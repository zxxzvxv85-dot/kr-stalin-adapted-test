l_simp_chinese:
  communist: "共产主义"
  communist_noun: "共产主义"
  communist_desc: "共产主义"
  marxist_subtype: "马克思主义"
  left_communist_subtype: "左翼共产主义"
  leninist_subtype: "列宁主义"
  marxism_leninism_subtype: "马克思列宁主义"
  right_communist_subtype: "右翼共产主义"
  maoist_subtype: "毛泽东思想"
  marxist_subtype_desc: "马克思主义涵盖从经济学到历史观的辽阔领域，其根本上力图将卡尔·马克思的理论付诸政治实践。主张阶级斗争以及过渡至生产资料公有制社会是这种意识形态的主要特征。"
  left_communist_subtype_desc: "左翼共产主义基于列宁主义，不过特别强调工业化的重要性，且认为社会主义革命一旦在一个国家展开，就必定会在世界范围内完成。同时左翼共产主义也反对一国建成社会主义论，认为世界分工、跨国技术依赖和原料依赖使得没有一个国家能单独建成社会主义。"
  leninist_subtype_desc: "列宁主义是一种基于马克思主义的意识形态流派，其旨在以一个组织严密的无产阶级政党领导革命颠覆资本主义社会的方式建立社会主义国家。而在取得政权后，这种意识形态下的政党会通过内部讨论决策的方式执政。"
  marxism_leninism_subtype_desc: "马克思列宁主义是马克思主义与列宁主义相结合形成的理论体系。它以辩证唯物主义和历史唯物主义为世界观和方法论，认为社会发展受生产力与生产关系、经济基础与上层建筑矛盾运动推动；在政治经济学上揭示资本主义剥削关系和剩余价值机制；在政治实践上强调无产阶级政党领导、社会主义革命和无产阶级专政，最终目标是消灭阶级剥削，实现共产主义社会。它既是一种社会历史理论，也是一种革命实践理论。"
  right_communist_subtype_desc: "右翼共产主义"
  maoist_subtype_desc: "毛泽东思想是一种以马克思列宁主义为基础、强调群众动员、农民革命战争与持续阶级斗争的共产主义流派。"
  communist_drift: "共产主义支持度每日变化"
  communist_acceptance: "共产主义外交的接纳度"
  RUS_stalin_MHC_organiser: "$KR_MHC_organiser$"
  FACTION_NAME_COMMUNIST_1: "共产国际"

