 RUS_ddz_close_tt:0 "收起牌桌，保留本局进度；可由测试决议重新打开。"
 RUS_ddz_rules:0 "玩法说明"
 RUS_ddz_rules_tt:0 "§Y斗地主§!\n每人先发17张牌，另留3张底牌。三人依次叫分，只能叫比当前更高的分；最高分者为地主，拿走底牌并先出牌。三人都不叫则重新开局。\n\n§Y出牌§!\n单张、对子、三张、三带一、三带一对；顺子至少5张、连对至少3对、飞机至少2组三张；飞机可不带牌，或每组带1张／1对；四带二张、四带两对；炸弹与王炸。\n顺子、连对、飞机主体不含2和大小王。飞机的单张带牌可成对，也可同时带大小王；带牌不得与主体同点数，单张带牌中不允许三张同点数。\n跟牌须牌型、张数相同且点数更大；炸弹压过普通牌，王炸压过所有牌。\n\n§Y获胜§!\n地主先出完则地主获胜；任一农民先出完则两位农民共同获胜。\n\n点击手牌选中／取消；“提示”选中可出的牌，“出牌”确认。“不出”跳过跟牌。关闭窗口不结束牌局。\n悬停人物头像可查看该牌友上一手动作。"
