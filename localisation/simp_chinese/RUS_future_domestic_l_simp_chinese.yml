 RUS_future_domestic_142:0 "整合农村组织"
 RUS_future_domestic_142_desc:0 "几乎每个政党都在农村经营着各自的势力范围，这种各自为政的割据状态已不可容忍。既然同属联合政府，那么至少在名义与形式上，这些地方组织都必须接受中央的统一管辖。"
