 RUS_future_domestic_138_desc:0 "坦白来说，自社会民主工党分裂以来，俄罗斯已经几十年没有一个统一的工人政党了。现实的差距固然让我们无法立刻做到这一点，但至少我们应该做出最基本的尝试。"
