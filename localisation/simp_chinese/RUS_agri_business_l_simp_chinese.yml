 RUS_agri_business_header:0 "容量/地力"
 RUS_agri_preview_summary:0 "基准预估：回款§Y[?RUS_agri_preview_receipts|1]§!  结余§Y[?RUS_agri_preview_capital|1]§!  净收益§Y[?RUS_agri_preview_profit|1]§!"
 RUS_agri_business_rules_tt:0 "平价收购容量每季为3至5点投入；超出的前2点实收倍率减0.30，之后的超额部分减0.70，各档最低0.40。\n单项投入至少5点或超过本季总投入一半会使该作物下季地力疲劳增加1级；投入不超过2点且不构成重仓时恢复1级，其余不变。每级扣减0.15，最多3级，跨年保留。\n订单以结算时的投入量验收，每份奖金为要求投入的0.65倍，并在土改进行中或成功后另加1分；未开启或失败不加分。奖金不计入作物收益率，结余仍封顶30。\n基准预估不计天气与行情，计入已达到投入要求的订单；未确认时，季度截止会改用均衡分配。"
