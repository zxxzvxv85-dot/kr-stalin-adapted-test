 RUS_future_foreign_policy_events.1.t:0 "“海燕”归来"
 RUS_future_foreign_policy_events.1.d:0 "近日，政治保卫局收到一封来自华沙的密信。信封朴素，以火漆封缄，落款处未署名，仅画着一只简洁的海燕轮廓。经技术部门检测，信纸与墨水均为波兰本地常见的廉价品。\n\n信的内容并不冗长。\n\n发信人自称是费利克斯·埃德蒙多维奇·捷尔任斯基——那位在内战撤退中失联、被绝大多数同志以为早已牺牲的老布尔什维克。信中，他简要叙述了当年的脱险经过：伪装身份、混入难民潮、辗转抵达华沙，因无法确认中央是否存续而选择就地潜伏，并在随后的岁月里逐步重建了联络网络。他在信末写道：“我一直等待能够重新建立可靠联系的时机。现在，我认为这个时机已经到来。”\n\n随信附来一件信物——一枚刻有彼得格勒军事革命委员会编号的旧式怀表，表壳内侧刻有一行细小字迹：“斯莫尔尼－1917”。这是当年十月武装起义期间捷尔任斯基随身携带的物品，无从伪造。\n\n密信由技术部门全文抄录后，原件被立即封存。鉴定工作由政治保卫局档案处与中央委员会书记处联合展开。旧式怀表被仔细拆解检验，表壳内侧刻字的磨损程度与年代相符，机芯编号亦与彼得格勒军事革命委员会1917年10月的装备登记簿完全吻合。更重要的是，信中提及的若干细节——例如1918年某次肃反行动中捷尔任斯基亲自签署的一份密令内容——从未被任何公开或半公开的文件记录过，只有当事人或极少数核心知情者才可能知晓。\n\n鉴定报告于三个工作日内完成，结论为：身份属实。"
