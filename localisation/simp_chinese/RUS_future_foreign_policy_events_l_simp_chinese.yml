 RUS_future_foreign_policy_events.1.t:0 "“海燕”归来"
 RUS_future_foreign_policy_events.1.d:0 "近日，政治保卫局收到一封来自华沙的密信。信封朴素，以火漆封缄，落款处未署名，仅画着一只简洁的海燕轮廓。经技术部门检测，信纸与墨水均为波兰本地常见的廉价品。\n\n信的内容并不冗长。\n\n发信人自称是费利克斯·埃德蒙多维奇·捷尔任斯基——那位在内战撤退中失联、被绝大多数同志以为早已牺牲的老布尔什维克。信中，他简要叙述了当年的脱险经过：伪装身份、混入难民潮、辗转抵达华沙，因无法确认中央是否存续而选择就地潜伏，并在随后的岁月里逐步重建了联络网络。他在信末写道：“我一直等待能够重新建立可靠联系的时机。现在，我认为这个时机已经到来。”\n\n随信附来一件信物——一枚刻有彼得格勒军事革命委员会编号的旧式怀表，表壳内侧刻有一行细小字迹：“斯莫尔尼－1917”。这是当年十月武装起义期间捷尔任斯基随身携带的物品，无从伪造。\n\n密信由技术部门全文抄录后，原件被立即封存。鉴定工作由政治保卫局档案处与中央委员会书记处联合展开。旧式怀表被仔细拆解检验，表壳内侧刻字的磨损程度与年代相符，机芯编号亦与彼得格勒军事革命委员会1917年10月的装备登记簿完全吻合。更重要的是，信中提及的若干细节——例如1918年某次肃反行动中捷尔任斯基亲自签署的一份密令内容——从未被任何公开或半公开的文件记录过，只有当事人或极少数核心知情者才可能知晓。\n\n鉴定报告于三个工作日内完成，结论为：身份属实。"
 RUS_future_foreign_policy_events.1.a:0 "“茫茫的沧海之上，狂风卷集着乌云……”"
 RUS_future_foreign_policy_events.1.unlock_tt:0 "我们将把广袤的俄罗斯建成世界革命的中转站！\n§Y欧洲革命委员会对外联络与侦察处§!，已在§Y权力平衡§!处解锁，请注意查看！"
 RUS_future_foreign_policy_events.2.t:0 "重返巴黎"
 RUS_future_foreign_policy_events.2.d:0 "巴黎·爱丽舍宫\n\n时隔不过数月，维亚切斯拉夫·米哈伊洛维奇便再次踏上了法兰西的土地。迎接他的是老朋友马塞尔·加香。巴黎方面为此次会议做足了准备，接待仪式之隆重令莫洛托夫略感意外——毕竟在外界看来，这不过是一次例行的外交回访。\n\n然而巴黎显然不愿浪费这次机会。\n\n会谈在爱丽舍宫的一间沙龙内举行。法方出席者包括加香、工农政府贸易专员，以及数名工业界的代表性人物。与莫斯科的预判不同，法方并未将议程停留在政治声明的层面，而是直入主题：他们希望扩大资源贸易，尤其是粮食、矿石与石油的进口份额。作为交换，法国可以提供重型机械与工业制成品，同时愿意在俄罗斯的重建计划中提供技术援助。\n\n莫洛托夫默记着对方提出的每一项条款，并未急于回应。加香对此并不意外——他了解这位老布尔什维克的谈判风格。\n\n随着讨论的推进，双方的分歧也逐渐明朗。法方始终将合作框定在“商业交换、经济互补”的范畴内，对莫斯科提出的政治互信条款则避而不谈。莫洛托夫曾两度将话题引向对欧洲革命运动的联合支持，两度被加香以“经济合作优先”为由轻轻带过。\n\n会议临近尾声时，莫洛托夫收到了一份内容详尽的贸易提案，涵盖石油、矿石及谷物等大宗商品，法方在技术援助方面的条件也显得颇为慷慨。\n\n其中最令双方满意的则是一项关于俄罗斯矿产资源联合开采的框架协议。法方对此表现出非同寻常的热忱——不仅承诺提供先进的开采设备与工程技术团队，还提出在加工和运输环节中建立长期合作机制。对于莫斯科而言，这意味着一笔稳定的硬通货收入；对巴黎而言，则是将西伯利亚的矿脉纳入法兰西工业体系的远期保障。双方在这一点上意外地找到了无需修饰的共同语言。"
 RUS_future_foreign_policy_events.2.a:0 "为我们的革命朋友干杯！"
 RUS_future_foreign_policy_events.3.t:0 "最初的革命"
 RUS_future_foreign_policy_events.3.d:0 "二十年多前的那个十月，我们曾经相信旧世界会在一声炮响中彻底崩塌。冬宫的门被推开时，我们以为推开的是通往未来的全部道路。\n\n后来的事情，比任何布尔什维克所能预想的都更为复杂。白军的反扑、国际的封锁、内部的倾轧、流亡的漫漫长夜——革命没有在1917年的那个夜晚完成，它只是在那里开始了。它像一道被点燃的引信，穿越了整个时代的黑暗，直到今天仍未燃尽。\n\n那些在斯莫尔尼宫走廊里匆匆穿行的身影，那些在工厂车间里压低声音念出传单的工人，那些在战壕里把最后一块面包分给同志的士兵——他们不是为了一个短暂的口号而战斗。他们战斗，是因为他们相信历史和人民会记住他们的选择。\n\n如今，我们站在他们所铺设的铁轨上，尽管方向颠簸……\n\n最初的革命，不只是十月的那一天。它是每一个拒绝向旧世界低头的人，在每一个时代所做出的那同一个选择——"
 RUS_future_foreign_policy_events.3.a:0 "将革命进行到底！"
 RUS_future_foreign_policy_events.3.poem_tt:0 "§R哪怕灾殃接着灾殃，\n也不能叫我们颓唐，\n让我们来结成朋友，\n我们永远有力量。\n\n听，风雪喧嚷，\n看，流星在飞翔;\n我的心向我呼唤:\n去动荡的远方……§!"
 RUS_future_foreign_policy_events.4.t:0 "工团主义与共产主义"
 RUS_future_foreign_policy_events.4.d:0 "即便在西方世界，工团主义革命也并非获得所有革命者的一致拥护。相当数量的革命者持有与雅科夫·斯维尔德洛夫相近的立场，认为工团主义本质上不过是革命改良主义的一种变体，缺乏对社会主义国家机器的掌控能力，而其所主张的人民民主也常常流于议会形式，未能触及社会的深层结构。\n\n这些革命者通常在工团主义国家内以反对派身份活动，其中最著名的当属法国工农共产党的马塞尔·加香与意大利共产党的安东尼奥·葛兰西。他们以“共产主义者”或“马克思列宁主义者”自居，并普遍将已故的弗拉基米尔·列宁奉为革命导师。此外，各国亦活跃着诸多自主活动的共产主义团体，如亚美尼亚共产党、拉脱维亚共产党及阿根廷共产党等。\n\n随着社会主义俄罗斯的重建，由各国共产主义者组成的代表团纷至沓来。尽管社会革命党对此略感不安，但这些代表仍受到布尔什维克与全俄劳联左派的普遍欢迎。\n\n德国革命元老、现德国社会主义党党魁罗莎·卢森堡同志受邀致辞，她在发言中对工团主义路线提出了含蓄但清晰的批评，强调应当回归列宁关于革命国家核心理念，而非满足于以工会组织替代国家职能的改良方案。在最后，她提出了革命的又一前景——共产主义的复兴。"
 RUS_future_foreign_policy_events.4.a:0 "“天将破晓，晨星在你们心中腾起。”"
