  rus_stalin_education_events.1.t: "关于普及义务教育的法令"
  rus_stalin_education_events.1.desc: "第一条：义务教育之范围\n自本法令颁布之日起，俄罗斯社会主义共和国境内，凡年满七周岁至十五周岁之儿童，无论性别、民族、家庭出身或宗教信仰，一律享有接受基础教育的权利与义务。义务教育为期四年，课程涵盖读写、算术、自然常识、历史与社会主义基础理论。\n\n第二条：教育免费原则\n义务教育阶段之学费、教材费及基本学习用品费用，一律由国家财政承担。任何地方机构或个人不得以任何名义向学生家庭收取与义务教育相关的费用。\n\n第三条：地方执行机构之责任\n各县、乡苏维埃须于本法令颁布之日起六个月内，完成辖区内适龄儿童的登记造册工作，并确保每一名登记在册之儿童按时入学。地方执行机构须每月向上一级教育主管部门报送入学率与出勤率。\n\n第四条：家长与监护人之义务\n父母或法定监护人须确保其所监护之适龄儿童按时入学并完成规定年限之学业。无正当理由阻挠儿童入学或致使儿童中途辍学者，经教育劝导后仍不改正者，由地方苏维埃视情节轻重处以警告、罚金或社会服务之处罚。"
  rus_stalin_education_events.1.desc_2: "第五条：师资配置与培训\n为实现普及义务教育之目标，政府将扩大师范院校的招生名额，并在各县设立短期师资培训班。凡具有中学以上文化程度且愿意从事教育工作者，经培训考核合格后，优先分配到乡村学校任教。乡村教师享有与城市教师同等之薪资待遇，并由国家提供住房补贴与寒暑假交通补助。\n\n第六条：特殊群体之教育保障\n对于因身体残疾、家庭贫困或其他特殊原因无法正常入学的适龄儿童，地方教育机构须建立相应的送教上门或特殊学校制度，确保不因任何原因剥夺其受教育的权利。\n\n第七条：过渡期安排\n本法令颁布之日起第一年为宣传准备期，各级苏维埃须在此期间完成校舍建设、师资培训及教材编印等准备工作。第二年秋季开学时，全国范围内的义务教育工作全面启动。\n\n第八条：监督执行\n本法令之执行由教育人民委员会与工农检查院共同监督。各地方执行机构须每季度向上级提交义务教育进展报告，凡执行不力或弄虚作假者，依法追究相关责任人。\n\n第九条：解释权与修订权\n本法令之解释权与修订权归属全俄中央教育部。"
  rus_stalin_education_events.1.a: "本法令自公布之日起生效。"
  rus_stalin_education_events.2.t: "平等的再生产"
  rus_stalin_education_events.2.desc: "——论旧教育的阶级本质与社会主义教育的使命\n尼古拉·彼得罗维奇·索博列夫\n\n在资本主义社会里，教育从来不是中立的。\n\n它表面上一视同仁——学校向所有人敞开大门，课程表对每个学生一视同仁，考试分数似乎只取决于个人努力。然而在这一片公平的表象之下，教育完成了一项隐秘而精准的使命：阶级的再生产。穷人的孩子继续成为穷人，富人的孩子继续成为富人。\n\n旧教育从不公开宣布这个目标，但它通过一套精密的筛选机制实现了它。这套机制包含三重设计：\n\n第一重：入学机会的不平等。 城市中心的名校与偏远乡村的破旧校舍共用同一套课程大纲，仿佛大纲本身就能抹平道路的距离、书籍的缺失和煤油灯的有无。教材里写的是城里的电车和工厂，农村的孩子读到“电车”时，脑子里浮现的是一辆从未见过的、会移动的铁盒子。\n\n第二重：教学内容的价值取向。 历史课教的是帝王将相的更迭，那些在田间和车间里创造真实财富的普通人，在课本里只留下一个模糊的“劳动人民”作为注脚。文学课教的是贵族的爱情与骑士的忠贞，而工人妻子在洗衣房里弯腰搓洗一整天的故事，从未有人觉得值得写进教材。孩子们在课堂上学到的，是对旧秩序的无声认同——仿佛世界原本就是如此，也只能如此。"
  rus_stalin_education_events.2.desc_2: "第三重：评价标准的文化偏见。 考试考的是“标准俄语”，而贫民窟的孩子从小听的是方言和俚语；考的是“文明举止”，而工厂子弟的表达方式被贴上“粗鲁”的标签。那些被筛选出来的“优等生”中，出身优越者始终占据着压倒性的比例——不是因为他们更聪明，而是因为教育从一开始就是为他们的生活经验量身定做的。\n\n通过这三重设计，旧教育完成了它的全部使命：它把阶级优势转化为个人能力的假象，把社会结构的暴力伪装成个人努力的差距，让优胜者相信自己配得一切，让失败者接受自己本来就不行。等到孩子们长大成人，他们便心平气和地走进各自早已被规划好的位置——富人的孩子接过产业与权柄，穷人的孩子接过工具与沉默。\n\n在这一场再生产运动中，优胜者理所当然，失败者心服口服。没有人质疑规则本身，因为规则看起来是“中立”的：一样的课本、一样的教室、一样的考试。然而，当权者们正是通过这种看似平等的“符号暴力”，隐秘而有效地捍卫着自己的生产资料所有权。\n\n什么是符号暴力？\n\n它不像地主手中的鞭子那样显而易见，也不像高利贷者的借条那样白纸黑字。它比这些都更隐蔽，也更有效。它藏在那些看似中立的词语里——“天赋”“勤奋”“聪明”“迟钝”。富人的孩子从小生活在摆满书籍的房间里，饭桌上听到的是关于政治与经济的讨论，他们自然更“聪明”，因为他们早已在家庭中完成了第一轮教育。而穷人的孩子，放学后要帮家里干活，晚饭后连一盏写字的煤油灯都舍不得点，他们自然更“迟钝”——因为他们早已被剥夺了不被剥夺的权利。\n\n旧教育的全部奥秘就在于此：它用同一把尺子衡量不同起点的人，然后宣布那些从起点就落后的人“不够努力”。\n\n这似乎是理所当然的优胜劣汰，其背后藏匿着的，则是名为社会达尔文主义的暴力——将人类社会的差异等同于自然界弱肉强食的法则，以此为阶级分化披上“科学”的外衣。"
  rus_stalin_education_events.2.desc_3: "但社会主义的教育不接受这套逻辑。我们不承认有什么“天生”就该失败的人。\n\n社会主义的教育不会问“你从哪里来”，它只问“你要到哪里去”。它不会用同一把尺子去丈量每一个孩子，因为它知道——每一个孩子站在不同的起跑线上，而教育者的职责，是让跑得慢的人不再被规则本身绊倒，而不是用规则来证明他们本来就该落后。\n\n为了洗涤旧时代的残余，为了终结阶级的再生产，社会主义的教育模式将向不公宣战。\n\n这意味着：学校不仅要教孩子识字，还要确保每个孩子都能在放学后有灯读书；学校不仅要传授知识，还要培养孩子认识世界的能力——不是被动接受“世界就是这样”，而是敢于追问“世界为什么是这样，以及怎样让它变得更好”；学校不再挑选“值得教育的人”，而是把教育送到每一个人的门口，不因为出身、不因为贫富、不因为父母的职业而剥夺任何一个人成长的权利。\n\n旧教育的终点是制造差距，并把差距神圣化为“公平竞争的结果”。而新教育的起点，是承认差距的存在，然后一点一点地把它填平。\n\n这不是一件容易的事。它需要学校、需要教师、需要课本，还需要灯油、需要食堂里的饱饭、需要冬天教室里的炉火。它比旧教育昂贵得多，也艰难得多。\n\n但只有这样，教育才不再是特权的避风港，而真正成为每一个孩子——无论他出生在莫斯科的公寓还是扎列奇耶村的土屋——通往未来的、不会被折断的梯子。\n\n旧教育负责筛选，新教育负责托举。"
  rus_stalin_education_events.2.a: "“这就是社会主义教育的全部信念。”"
  rus_stalin_education_events.3.t: "瓦西里·伊万诺维奇的粉笔"
  rus_stalin_education_events.3.desc: "萨拉托夫省·别廖佐夫卡村\n\n瓦西里·伊万诺维奇是村里唯一一个算得上“读书人”的。他以前在城里的印刷厂做过三年排版工，识字、会算账，还会写一手不算好看但能认出来的字。县长说要在村里建学校的时候，支书第一个想到的就是他。\n\n校舍是村里人自己盖的——没有砖，就用木头。梁是各家凑的，屋顶的木板是村长沙哈罗夫从自家拆下来的。一个多月后，一间能坐三十个孩子的木房子，立在村口那棵老橡树旁边。\n\n开学那天，来了十九个孩子，年龄从七岁到十三岁都有。\n\n瓦西里没有什么教材。他翻出自己在印刷厂时攒的那本旧书，把第一页上的字母一个个抄在黑板上——其实就是一块刨平了、刷了黑漆的木板。\n\n最大的那个男孩叫米沙，十三岁了，还不会写自己的名字。瓦西里把粉笔递给他：“来，把手伸出来。”\n\n米沙握粉笔的姿势就像握一把刀。瓦西里握住他的手，一笔一划，在黑板上写下“米沙”。\n\n“这是你的名字。”\n\n米沙看着那两个歪歪扭扭的字，看了很久。\n\n过了几天，瓦西里发现米沙来得特别早。他走进教室的时候，看见米沙正蹲在地上，用一根烧过的树枝，在泥地上反复写着什么。走近一看，是“米沙”。虽然笔画不对，但能认出来。"
  rus_stalin_education_events.3.desc_2: "瓦西里没说话，只是从兜里掏出一截粉笔头，放在米沙旁边的窗台上。米沙抬起头看他，他没说什么，只是转身去准备今天的课了。\n\n那天放学的时候，米沙的书包里多了一样东西——不是书，是一小块瓦西里从城里托人带来的石板。黑黑的，巴掌大。书包很轻，但米沙抱着它走了一路。\n\n冬天来的时候，教室里的炉子烧得很旺。瓦西里在炉子旁边给学生念报，念到“义务教育”两个字的时候，停下来解释了一下。孩子们似懂非懂地点头。只有米沙坐在第一排，瞪着大眼睛，好像在认真想些什么。\n\n放学后，米沙在泥地上刻字，每天练一会儿。等开春的时候"
  rus_stalin_education_events.3.a: "他的名字已经写得比瓦西里教的另一个孩子还齐整了。"
  rus_stalin_education_events.4.t: "关于建设高等教育的法令"
  rus_stalin_education_events.4.desc: "第一条：高等教育之任务\n为满足社会主义建设对专业技术人才之迫切需求，政府决定在全国主要城市扩建及新建一批高等教育机构。其培养目标为：工程师、农学家、医生、教师及各类专业技术人员——他们必须既掌握现代科学知识，又忠于社会主义事业。\n\n第二条：高校建设规划\n自本法令颁布之日起三年内，政府将在莫斯科等城市新建或扩建不少于十五所高等院校。每所院校应至少设立三个以上与国家经济建设直接相关的专业方向，包括但不限于机械工程、电气工程、化学工程、农学、医学、教育学及社会科学。\n\n第三条：招生原则\n凡年满十七周岁、完成中学教育或同等学力之公民，无论出身于何种阶级背景，均可报名参加高等院校入学考试。招生工作须坚持择优录取与阶级成分相结合之原则：在考试成绩同等之条件下，优先录取工人、农民及劳动知识分子家庭出身的考生。\n\n第四条：工农预备班\n为保障工农子弟能够顺利进入高等教育体系，各高等院校须设立工农预备班，为期一年至两年。预备班课程包括基础理论知识补习与政治思想教育。结业考核合格者，可直接升入相应专业学习，无需参加统一入学考试。"
  rus_stalin_education_events.4.desc_2: "第五条：教学科研相结合\n高等教育机构须贯彻教学与科学研究相结合之原则。各院系须设立科研小组或实验室，组织教师与高年级学生参与工农业生产实际问题的研究。研究成果优先用于解决国民经济中的具体技术难题。\n\n第六条：物资保障与经费来源\n高校建设之经费由中央财政统一拨付，列入国家年度预算重点项目。各地方人民委员会须为辖区内高校提供建设用地与建材配额。在建校期间，地方政府须协助解决施工工人之食宿与生活保障。\n\n第七条：师资队伍之建设\n政府将通过派遣优秀毕业生赴国外留学、邀请外国进步学者来校任教、选拔现有专业技术人员进修深造等多种途径，充实高校教师队伍。高校教师的薪资待遇及科研经费，由国家按统一标准予以保障。\n\n第八条：解释权与修订权\n本法令之解释权与修订权归属全俄中央教育部。"
  rus_stalin_education_events.4.a: "本法令自公布之日起生效。"
  rus_stalin_education_events.5.t: "夜校的第一盏灯"
  rus_stalin_education_events.5.desc: "图拉省·谢尔普霍夫机械厂\n\n工人夜校开课那天，来了十七个人。都是下了晚班直接过来的，身上还穿着沾着油污的工作服。教室是厂里一间闲置的旧仓库，厂长让人搬来几排长条凳，在前面挂了一块黑板。\n\n讲师是城里派来的，一个年轻人，戴着圆框眼镜，说话声音不大。他第一节课讲的是机械基础原理，画了一些图。有个老钳工坐在第一排，一直紧锁着眉头。\n\n下课后，老钳工走到黑板前：“你画的那个图不对。”\n\n年轻人一愣：“哪里不对？”\n\n老钳工拿起粉笔，把图上的传动结构改了：“实际的装配中，这个齿轮的方向是反的。图纸上看着对，装上去转不动。”\n\n年轻人看了看，推了推眼镜：“我回去查一下教材……”\n\n“不用查。”老钳工说，“你只要来车间看一眼就知道了。实物就在那里，不骗人。”\n\n第二节课，年轻人带来了一块真正的传动模型，和工厂车间里用的一模一样。他把模型放在讲台上，让工人轮流上手演示。轮到老钳工的时候，他把模型拆开，又装回去，只用了不到两分钟。\n\n年轻人沉默了一下：“您来教吧。”\n\n那天晚上的课上了将近三个小时，因为老钳工从口袋里掏出一本泛黄的笔记——是他自己整理的机床故障图册，没有字，全是手画的图——指着其中一页说：“这个故障，课本上怎么写？”"
  rus_stalin_education_events.5.desc_2: "年轻人凑过去看了看，承认自己从没见过这种案例。\n\n后来，夜校的课上总是摆着实物。有时候是一根坏掉的轴，有时候是一副磨损的轴承。工人围着它们讨论、拆解、争辩，年轻人站在一旁做记录，偶尔插一句理论知识。再后来，那个老钳工成了“兼职讲师”——上面给他发了一份额外的津贴，不多，但他没推辞。\n\n有人问他图什么，他闷声说：“我当学徒那年，什么都没人教，全靠自己偷学。现在有人愿意教，总得有人愿意学。”他顿了顿，“再说了，那小伙子讲的那些公式，确实管用——我修机器修了三十年，才知道自己以前那些法子，原来都是有道理的。”"
  rus_stalin_education_events.5.a: "科学理论要与实践结合。"
  rus_stalin_education_events.6.t: "伊格纳季耶夫的笔记本"
  rus_stalin_education_events.6.desc: "沃罗涅日省·县培训班\n\n伊格纳季耶夫报到的时候，是班上年纪最大的学员。其他人都二十出头，他已经三十五了。\n\n培训班为期两个月，课程排得很满——政策法规、土地分配条例、集体农庄章程、纠纷调解方法，还有一门口头表达课，专门教他们怎么在村民大会上把话说清楚。\n\n伊格纳季耶夫每天晚上把当天的笔记重新抄一遍，因为他的字迹太潦草了。\n\n结业考试的时候，考官问了每个人同一个问题：“如果你回到村里，遇到一个村民指着你问‘你凭什么来管我们’，你会怎么回答？”\n\n有人答“因为我是上面派来的”，有人答“因为我是来帮助你们的”。考官都不满意。\n\n轮到伊格纳季耶夫，他沉默了一下：“我就把我知道的都告诉他——为什么要有贫农委员会、集体农庄怎么分粮、谁家的地可以留在哪里。如果我答不上来，我就说‘我回去查清楚了再告诉你’，然后说话算话。”\n\n考官看着他：“你知道什么是‘说话算话’吗？”\n\n“知道。”伊格纳季耶夫说，“我就是种地的，农民不相信空话——他们只相信第二年的收成。”\n\n结业后，伊格纳季耶夫被分回了扎列奇耶村。他回去的第一天，村里人围着他问“学到什么了”。他没有长篇大论，只是从包里掏出一本全新的笔记本——封面上写着《扎列奇耶村工作记录》。"
  rus_stalin_education_events.6.desc_2: "“我学到的最重要的事，”伊格纳季耶夫说，“就是要把你们说的每一句话都记下来，然后一件一件去办。办不到的，我也记下来，以后看能不能办。”\n\n当天晚上，村里人看到了他翻开的第一页，上面写着几行字，字迹端端正正，是他抄的："
  rus_stalin_education_events.6.a: "“办事要有账本，说话要算话。”"
  rus_stalin_education_events.7.t: "回信"
  rus_stalin_education_events.7.desc: "沃罗涅日省·扎列奇耶村\n\n伊格纳季耶夫又去轮训了。上次是两个月，这次只去了一个月，但课程更难——有一门课专门讲“不同地区的农民诉求差异分析”。每天晚自习后，一起学习的同志们在宿舍里争论不休。\n\n轮训结束后回来的那天下午，他路过谢尔盖家。谢尔盖正在院子里修理篱笆，伊格纳季耶夫站在路边看了看，没有说话。\n\n“有什么好看的？”谢尔盖放下锤子，“怎么，去省里学习学成干部了，不认识村里人了？”\n\n伊格纳季耶夫笑了笑，从包里拿出一封信：“不是，是省委下的文件——关于土地分配纠纷的补充解释。有一页，可能对你有用。”\n\n谢尔盖接过信，翻了翻，没说什么，又把信还给了他。\n\n伊格纳季耶夫没急着走，在一旁的树桩上坐了下来：“谢尔盖，我学了不少东西。有一句话是这么说的：‘好的政策解释不好，等于没有政策。’”\n\n“意思是我得干好伙计的活，把省城的文件翻译成咱们村里人听得懂的大白话。”"
  rus_stalin_education_events.7.desc_2: "他顿了顿：“就比如你那事——你爹当过库兹涅佐夫家的管家，那是旧社会的错，不是你小时候能选的。可村里人怎么知道这个？我轮训时候学的办法是——让你负责村里扫盲班的治安，天天晚上去教室晃一圈。等大家看见你帮老太太拎水，看见你给学校修窗子，不用你解释，大家自己就会把你算成自己人。”\n\n谢尔盖骂了一句：“你真会算计人。”\n\n“不是算计。”伊格纳季耶夫站起身，拍了拍裤子上的灰，“是省城老师教的：‘基层干部得学会把道理长在土地上。’”\n\n谢尔盖没再骂，但他第二天真的去了扫盲班门口。站了一会儿，有个老太太认出了他，喊了一声“帮忙抬一下这个”，他也就稀里糊涂地干了。后来天天如此，不知道从哪天起，扫盲班的孩子开始喊他“谢尔盖叔叔”。\n\n那天轮训结束后，伊格纳季耶夫在自己的笔记本上添了一行："
  rus_stalin_education_events.7.a: "“在基层的经历比任何文件都管用。”"
  rus_stalin_education_events.8.t: "银幕"
  rus_stalin_education_events.8.desc: "坦波夫省·格列米亚奇耶村\n\n放映队到的时候天快黑了。一辆马车载着一台电影放映机、一块白色的幕布和一台发电机，后面跟着两个年轻人。\n\n村里人围过来，没见过。有人问“这是做什么的”，放映员说“放电影给你们看”。于是全村人都来了。\n\n幕布挂在学校外墙上，发电机在远处轰隆作响。第一段影像放的是集体农庄的收割场面：拖拉机开过麦田，谷粒像流水一样涌进粮仓。画面闪动，幕布上的拖拉机在前进。村里的老农看得入神，没人说话。\n\n紧接着放了一段工业建设的新闻影像：高炉出铁，火花四溅；工人们在车间里操作机床。一个年轻工人站在后排，他不自觉地摸了摸自己手上磨出的老茧——屏幕里的那双手和他的一模一样，只是那是城市的另一头。\n\n后来放映员又放了一段医疗宣传片，讲的是如何预防斑疹伤寒。一个老妇人听到一半突然站起来，指着幕布：“那个医生说的症状，去年冬天隔壁家的孩子就是这个病死掉的。”\n\n没人回答她。幕布上，医生正在示范怎样用石灰水消毒。\n\n放完的时候，有年轻人围着放映员问：“机器从哪里来的？”、“下次什么时候来？”有孩子绕着放映机走来走去。"
  rus_stalin_education_events.8.desc_2: "放映员一边收拾设备，一边耐心回答。有人问：“电影里的那些地方是真的吗？真有那么大的谷仓？”放映员拍了拍那台机器：“千真万确。只要你们把地种好，把粮食交了，再过几年你们的粮仓也能有那么大。”人群中有人笑了，笑得有点傻，但很真诚。\n\n银幕收起来了，幕布被叠好放回木箱，发电机渐渐安静下来，但村子里的灯亮得比平时晚了一些——很多人家都在议论着刚才看到的那些画面，那些拖拉机、那些钢铁、那些他们从未见过的远方……"
  rus_stalin_education_events.8.a: "……以及那美好的未来。"
  rus_stalin_education_events.9.t: "从废墟中长出的线条"
  rus_stalin_education_events.9.desc: "构成主义诞生于十月革命后的废墟之上。\n\n1917年之后，旧世界曾被砸了个粉碎。沙皇的肖像被扯下墙壁，贵族的庄园被付之一炬，教堂的钟声沉默了。但艺术家们很快意识到——砸碎旧的东西只是第一步。问题是：新的世界应该长什么样？\n\n一群年轻的艺术家开始思考这个问题。他们拒绝画贵族肖像，拒绝宗教题材，拒绝一切“只为欣赏而存在”的艺术。他们宣称：艺术不应该挂在墙上供人凝视，而应该走进生活，成为生活本身。于是，服务于人民群众的构成主义诞生了。\n\n构成主义者认为，艺术家不应该被称为“艺术家”，而应该被称为“工程师”。他们崇拜的不是灵感，而是结构——工厂的钢铁桁架、桥梁的悬索、机器的传动轴。在他们眼中，最美丽的物体不是一朵花或一个优雅的裸体，而是一台拖拉机、一座水塔、一张精确绘制的设计图。美，在他们看来，是可以测量的。"
  rus_stalin_education_events.9.desc_2: "他们的代表人物塔特林在1920年设计了“第三国际纪念塔”——一座倾斜的钢铁螺旋，比埃菲尔铁塔还要高一倍，内部悬吊着三个玻璃房间，分别用于立法、行政和宣传，各自以不同的速度旋转。这座塔从未建成，但它的图纸本身就是一个宣言：它不属于任何古典风格，它没有“正面”与“背面”之分，它本身就是一种动态的、向上的力量，永远在转动，永远在生长。\n\n另一位代表人物罗琴科在1921年写道：“我们宣布，艺术已经死亡。它的尸体在博物馆里腐烂。未来的艺术将是工业的、建设的、为人民服务的。”\n\n这段话在当时引发了轩然大波。传统艺术家指责他们“毁灭美感”，公众则困惑于那些歪斜的线条和纯几何图形到底意味着什么。但构成主义者并不在意这些争议。他们早已转向了新的工作：设计工厂的宣传栏、工人的制服、集体农庄的海报、甚至公共食堂的餐具。只要能够改变人们日常生活的视觉环境，任何东西都可以成为“艺术”。\n\n他们相信，新的社会需要新的视觉语言。沙皇时代的装饰风格充满矫饰与空洞的奢华，而构成主义则用直线替代弧线，用简洁有力的几何图形取代繁复的雕饰。这不是为了“好看”，而是为了让每一个看到它的人感受到一种新的力量——一种属于机器、属于集体、属于未来的力量。\n\n随着俄罗斯社会的巨大变革，构成主义重新被肯定和复兴。这些伟大的构成主义者正在用无产阶级的视角重新打量我们所熟悉的世界——把工厂的烟囱画成竖线，把田野的阡陌画成横线，把人民的笑脸画成一个明亮的圆。然后把这些线条和形状放在一起，组成一幅从未有人见过，却人人都觉得无比熟悉的新图景。"
  rus_stalin_education_events.9.a: "我们将为新世界画出第一张图纸。"
  rus_stalin_education_events.10.t: "“构成”黎明"
  rus_stalin_education_events.10.desc: "莫斯科·第一国家印刷厂\n\n那面墙原本是灰白色的，和这座城市里所有灰白色的墙一样。直到一群年轻人带来了刷子、颜料和一张写满几何线条的图纸。\n\n“这不是画，”领头的那个年轻人说，他穿着一件沾满油彩的工装外套，头发乱糟糟的，“这是结构。是生产线的延伸。是印刷机的另一张脸。”\n\n他们是构成主义者。在他们到来之前，这座印刷厂的墙壁上挂着的是沙皇时代的肖像和宗教画——去年秋天被扯下来之后，墙面就一直空着。工人们习惯了在空荡荡的墙边走过，从没有人想过要往上面添点什么。\n\n但构成主义者想。\n\n他们把图纸摊在食堂的长桌上，用圆规和尺子画出一条条射线、一个个圆环、一块块倾斜的色块。有的工人凑过来看，看不懂，又不好意思问。一个老排版工指着图纸上那个倾斜的红色三角形：“这是什么？”\n\n“革命。”\n\n“哪个革命？二月还是十月？”\n\n“每一次。”年轻人说，“每一次向上的冲击。”\n\n一周之后，墙画完成了。那是一幅巨大的几何构图——红色的楔形从左下角向右上方刺入，割开灰色的背景，金色和黑色的色块在其周围碎裂、旋转、重组。最上面写了一行字，字体是用直尺比着画的，棱角分明：“我们的眼睛不再向后看。”"
  rus_stalin_education_events.10.desc_2: "工人们端着饭盒站在墙前看了很久。没有人说“好看”，也没有人说“看不懂”。一个锅炉工放下了饭盒，走到那面墙前，伸出手指，沿着红色楔形的边沿描了一遍。\n\n“这颜色，”他说，“像炉膛里的火。”\n\n负责画画的年轻人站在人群后面，一直憋着的一口气终于松了下来。他看着那些粗糙的手指在墙面上方划过，不敢碰触，又舍不得离开，好像他画上去的不只是颜色，而是一件会碎的东西。\n\n第二天，工厂的墙上又多了几行字——这次是工人们自己写的。字写得歪歪扭扭，但底下还画了一个小小的红色三角形，像是怕别人看不见似的。"
  rus_stalin_education_events.10.a: "“炉膛的火是红的，我们的心也是。”"
  rus_stalin_education_events.11.t: "赌约"
  rus_stalin_education_events.11.desc: "伊热夫斯克机械工厂·总装车间\n\n安德烈·彼得罗维奇接到“改进生产技术”的指示后，召集厂里的技术骨干开了三天的会。结论是：必须对总装车间的流水线进行全面改造。但预算有限，停产改造意味着至少损失半个月的产量。\n\n“可以不全面改造。”老钳工米哈伊尔提出了不同意见，“先把瓶颈工位改掉，别的地方不动。改完一个看效果，效果好再改下一个。这样不用一次性停全线。”\n\n安德烈看着米哈伊尔：“分步改，每改一次就要停一次工，加起来停产时间可能更长。”\n\n“但每次只停一个工位，别的地方还能干。”米哈伊尔坚持，“你那个方案，全线一停，七百多号人干坐着。就算只停一天，也是七百多人一天没活干。”\n\n两人争执不下。最后厂长拍板：打赌。安德烈按他的方案先改造一个工位，米哈伊尔在旁边盯着，如果改造后一个月内效率没有明显提升，那就按米哈伊尔说的做。\n\n改造持续了五天，那个工位的传送带被重新设计了，零件架的摆放顺序也做了调整。重新开工的第一天，负责那个工位的工人一开始不太顺手，下午开始快起来了。第二天，工位上的半成品堆积量减少了一半。第三天，隔壁工位的人主动过来问“你们改了什么”。\n\n米哈伊尔站在旁边看了一个星期，什么也没说。"
  rus_stalin_education_events.11.desc_2: "第八天，他走进安德烈的办公室，把一包烟放在桌上：“你赢了。”\n\n安德烈没有接烟：“你的方案也对。分步改确实更稳。下次改造别的工位，我们按你的方法来。”\n\n米哈伊尔愣了一下：“你都赢了还按我的来？”\n\n“这不是赢不赢的问题，”安德烈说，“是哪种方法更合适。你的方法适合我们这个老厂子，我那个方法适合新厂。”\n\n米哈伊尔把烟收了回去，闷声说：“那你下次提前说一声，别跟我赌了。”\n\n“下次直接请你去参谋。”安德烈笑道。\n\n厂长在月度报告里写道：“工人不反对改变，他们只是希望改变的过程不影响他们工作。改造后，新工位的人均产出提升了，工人信心也提升了，下一步按米哈伊尔的分步方案，继续对其他工位进行改造。”"
  rus_stalin_education_events.11.a: "技术改进的过程，也是团结的过程。"
  rus_stalin_education_events.12.t: "厂长的三次巡视"
  rus_stalin_education_events.12.desc: "顿河畔·国营牧场·机械维修车间\n\n库兹涅佐夫调任场长之后，干的第一件事不是开会，而是把维修车间里的东西全部重新搬了一遍。他花了三天时间，把工具按大小排好，把备用零件按型号上架，把工作台从墙角挪到了窗户边上。\n\n工人们看着他忙活，有人在旁边低声说：“换了个新场长，就折腾这些没用的。”\n\n库兹涅佐夫听到了，没搭理。\n\n第四天，一台拖拉机趴窝了。以前工人修机器时得在堆满杂物的架子里翻半天找扳手，这次库兹涅佐夫五分钟就找到了合适的扳手，十五分钟拆开外壳，二十分钟换好了零件。全程不到一个小时。\n\n他把换下来的旧零件扔进废料桶，拍了拍手上的油污：“以前修一台要多久？”\n\n“半天。”\n\n库兹涅佐夫没有再说话，只是用鞋尖点了点地面上新画的一条黄色线——那条线把工作区分成了“待修区”和“已修区”，从此再没有人把修好的机器零件堆在坏零件旁边。\n\n第二天早会上，他唯一的指示是：“今天，把仓库里那堆乱放的新轴承按规格编号，下班前我要看到台账。”说完就走了。\n\n一个月后，车间里多了几张贴在墙上的图表：标着库存零件的数量变化。有人问库兹涅佐夫这是什么，他只说了一句："
  rus_stalin_education_events.12.a: "“你们以前浪费的时间都在这张表上写着，自己看。”"
  rus_stalin_education_events.13.t: "一把钥匙开一万把锁"
  rus_stalin_education_events.13.desc: "伊热夫斯克机械工厂·总工程师办公室\n\n产线通用化的通知到伊热夫斯克那天，总工程师安德烈·彼得罗维奇正为一批新步枪的零件公差问题发愁。不同的车间用的模具不一样，同一批零件送到总装线时，常有三分之一装不上。\n\n通用化意味着要重新制定统一的技术标准，意味着工厂得停产好几天来调整工装夹具。\n\n厂长在办公会上问：“停产一天，损失多少？”\n\n安德烈答：“五天的产量。”\n\n“那改完以后，省多少？”\n\n安德烈翻了一下预算书，斟酌着措辞：“以后修枪不用从我们厂调零件了。前线部队随便哪个机械站都能换。这是计算不出来的好处。”\n\n厂长沉默了一下：“改。”\n\n改造持续了一周。装配线重新校准后，工人发现之前那些需要反复打磨的零件，现在可以顺滑地装上去了。原来负责修配的老钳工说：“我干了二十年，头一次觉得别人厂的零件也能用。”\n\n这句话后来传到了坦波夫的一个农机站——那里的修理工第一次用伊热夫斯克的通用零件修好了一台来自列宁汽车厂的卡车，拧完最后一颗螺丝，他打开发动机盖子端详了一会儿：“以前我们得写信到厂里等零件，有时候一等就是几个月。现在打开仓就能拿。”他拿起扳手，“这玩意儿结实，而且通用——不用看牌子，看编号就行。一把钥匙开一万把锁，这是好活。”"
  rus_stalin_education_events.13.desc_2: "产线通用化的第一批成果在几个月后陆续显现：各厂之间零件互换率大幅提升，维修周期平均缩短了三分之二，生产车间的故障停工时间也显著减少。安德烈在给中央的报告中写道：“我们不仅节省了时间，还节省了信任。现在工人们觉得，整个国家的工厂都是一家人的。”"
  rus_stalin_education_events.13.a: "“零件走到哪里都能用，人也是。”"
