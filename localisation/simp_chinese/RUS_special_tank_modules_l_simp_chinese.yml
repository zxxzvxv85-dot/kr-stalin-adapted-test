l_simp_chinese:
 RUS_special_stabilizer:0 "双向稳定器"
 RUS_special_stabilizer_desc:0 "俄罗斯专用的火炮稳定系统，提高行进间射击的稳定性与整车可靠性。"
 RUS_special_auto_loader:0 "转盘式装弹机"
 RUS_special_auto_loader_desc:0 "俄罗斯专用的自动装填系统，强化火力输出与持续作战能力。"
 RUS_unlock_special_stabilizer:0 "双向稳定器"
 RUS_unlock_special_auto_loader:0 "转盘式装弹机"
 RUS_special_tank_modules.1.t:0 "双向稳定器研制完成"
 RUS_special_tank_modules.1.d:0 "装甲兵器设计部门已完成双向稳定器的定型工作。这套装置将改善坦克行进间的火炮稳定性，为装甲部队持续突破提供更可靠的保障。\n\n已解锁俄罗斯专属坦克配件：§Y双向稳定器§!。可在§Y坦克设计器的特殊模块槽位§!中安装。\n\n突破：§G+5§!、§G+10%§!\n可靠性：§G+40%§!\n生产花费：§R+2§!\n设计经验花费：§Y1§!"
 RUS_special_tank_modules.1.a:0 "交付装甲兵器设计部门。"
 RUS_special_tank_modules.2.t:0 "转盘式装弹机研制完成"
 RUS_special_tank_modules.2.d:0 "先进穿甲弹的研究成果推动了装填机构的进一步改进。转盘式装弹机现已通过定型审查，可为新一代装甲车辆提供更强的持续火力。\n\n已解锁俄罗斯专属坦克配件：§Y转盘式装弹机§!。可在§Y坦克设计器的特殊模块槽位§!中安装。\n\n对人员杀伤：§G+20%§!\n对装甲杀伤：§G+20%§!\n突破：§G+4§!\n防御：§G+4§!\n生产花费：§R+1.5§!\n设计经验花费：§Y1§!"
 RUS_special_tank_modules.2.a:0 "将新装填机构投入应用。"
