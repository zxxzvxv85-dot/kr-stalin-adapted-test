 RUS_semyon_budyonny_air_assault_chief:0 "谢苗·布琼尼"
 RUS_semyon_budyonny_air_assault_high_command:0 "谢苗·布琼尼"
 RUS_semyon_budyonny_air_assault_high_command_desc:0 "§Y生于：§!§L1883年4月25日；俄罗斯帝国、顿河州科久林村§!\n§Y背景：§!§L布琼尼出生于科久林村的一个雇农家庭，是这个多子女家庭中的第二个孩子，有三个妹妹和四个兄弟。他的童年生活十分辛酸，自八岁起便给富商雅茨金当小工，同时帮助父亲维持全家生计。\n\n1903年，布琼尼应征入伍，在远东的滨海龙骑兵团服役，服役期满后又选择超期服役。1904至1905年间，他作为第26顿河哥萨克团成员参加日俄战争。1908年，他从圣彼得堡军官骑兵学校附属军士训练班毕业；该训练班专门为骑兵部队培养教官。此后他晋升为上士，并在1914年前一直留在滨海龙骑兵团。第一次世界大战期间，他随第18谢韦尔斯基龙骑兵团转战德国、奥地利和高加索三个战线。凭借作战中的勇敢表现，他先后获授四个等级的圣乔治十字勋章各一枚，以及四枚圣乔治奖章。\n\n1917年二月革命后，布琼尼被全连一致推选为连士兵委员会主席，又在全团大会上当选团士兵委员会主席，继而成为师士兵委员会副主席。在明斯克驻防期间，他结识了西方面军布尔什维克党组织的领导人伏龙芝。十月革命后，他回到故乡组建苏维埃政权与骑兵部队；1918年参加苏俄红军，1919年加入俄共（布）。内战期间，他历任骑兵团长、旅长、师长、军长和第一骑兵集团军司令，以奔袭与深远机动相结合的骑兵战术屡建战功。\n\n十月革命失败后，布琼尼随布尔什维克流亡法国。在巴黎世博会上，他偶然看到西班牙展出的最新式直升机。旋翼飞行器越过地形、将人员直接送入敌后纵深的潜力令这位老骑兵指挥官深受震动。从那以后，他开始潜心钻研以空中机动继承骑兵奔袭精神的新式战术，并试图为重返俄国后的红军建立一支能够从天空发起冲锋的部队。§!"
