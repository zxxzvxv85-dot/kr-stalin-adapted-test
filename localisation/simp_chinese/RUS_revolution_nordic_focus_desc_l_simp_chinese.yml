l_simp_chinese:
 RUS_future_foreign_034_desc:0 "那些可恨的宪政改良派早已将革命出卖给了反动派，现在我们又有什么理由和他们继续合作？革命再不需和反动派做出任何妥协了！\n\n继续革命，永不投降！"
 RUS_future_foreign_057_desc:0 "北欧的工人们在寒冷与压迫中挣扎至今，反动保皇派与资产阶级政客轮流榨取着他们的血汗。如今第三国际的同志正努力将北欧的工人斗争拧成一股绳，但显然，德帝国主义不会善罢甘休——他们的眼睛和手从来没有离开过斯堪德纳维亚。为了第三国际同志们的行动顺利。我们必须采取一些措施........."
 RUS_future_foreign_035_desc:0 "行军翻越许多里\n穿过陆地与水域\n......\n巴尔干的繁星下\n苏维埃再绽新芽"
 RUS_future_foreign_058_desc:0 "勇敢地起来，骄傲地起来，\n要为了工人的事业去战斗，\n高高举起全人类战斗旗帜，\n为新世界早来到，人人自由。"
 RUS_future_foreign_049_desc:0 "修正主义叛徒们正盘踞在我们曾赖以为生的工会组织中，把持着理事会、攥着会费，替资本家安抚工人。他们用“合法斗争”的麻醉剂，让工人们相信只要投对票、选对人，面包就会从天上掉下来——我们必须夺回这些阵地！"
