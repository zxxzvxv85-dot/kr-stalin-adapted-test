 RUS_sc_volunteers_desc:0 "“工农红军由劳动阶级中觉悟最高、最有组织性的人员组成。凡年满十八岁的社会主义共和国公民，均可申请加入红军。”"
 RUS_sc_territorial_desc:0 "“现役兵役可在工农红军部队的常备编制或地域部队的轮换编制中履行，也可在部队以外履行。……地域部队轮换人员的现役期由集训和集训之间的休假组成。整个现役期内，集训总时长因兵种而异，上限为八至十二个月。”"
 RUS_sc_universal_desc:0 "“普遍兵役义务由法律规定。在工农红军服役是共和国公民的光荣义务。……一切共和国男性公民，无论种族、民族、宗教信仰、教育程度、社会出身和地位，均须在共和国武装力量中服兵役。”"
 RUS_sc_wartime_desc:0 "“为了保卫我们伟大的祖国和无产阶级革命的火种，凡出生于1905年至1918年（含首尾两年）的负有兵役义务人员，均须应召。”"
 RUS_sc_extended_desc:0 "“动员1890年至1904年出生的负有兵役义务人员，并征召1922年至1923年出生的应征人员。征召范围为斯摩棱斯克州、图拉州、库尔斯克州，以及奥廖尔州柳季诺沃—布良斯克—谢夫斯克一线以西地区。”"
 RUS_sc_emergency_desc:0 "“本市的工人、职员和学生按区动员参加人民民兵，并按区组建二十五个师。……民兵师从十七至五十五岁的劳动者中动员组建。”"
 RUS_sc_territorial_supply:0 "地域兵役补给组织"
