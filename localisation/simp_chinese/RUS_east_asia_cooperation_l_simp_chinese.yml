 RUS_project_156_monthly_surplus_tt:0 "£civ_factory_output 每月经济盈余：§G+[GetRUSEastAsiaMonthlySurplus]§!"
 RUS_project_156_monthly_infrastructure_tt:0 "每月独立随机选择 §Y[GetRUSEastAsiaInfrastructureDraws]§! 次本国拥有并控制、尚有建造空间的核心地区，每次立即增加 §G1§! 级§Y基础设施§!；同一地区可被重复选中。无符合条件的地区时跳过。"
