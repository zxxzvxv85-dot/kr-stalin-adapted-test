l_simp_chinese:
 RUS_japanese_antiwar_movement:0 "反战运动抬头"
 RUS_japanese_antiwar_movement_desc:0 "工厂、校园与港口里，反对帝国扩张的声音正逐渐汇成同一道浪潮。越来越多的日本人民开始追问：究竟是谁从这场战争中获利？"
 RUS_active_northeast_resistance:0 "活跃的东北抗联"
 RUS_active_northeast_resistance_desc:0 "铁路沿线的游击队与城市中的地下组织正相互呼应。奉系当局与日本资本建立的秩序，正在东北人民的反抗中动摇。"
 RUS_northeast_anti_japanese_network:0 "东北抗日联络网"
 RUS_northeast_anti_japanese_network_desc:0 "秘密交通站将散落各地的抗日力量连接起来。向导、情报和补给沿着这些不见于地图的道路流动，为共同的斗争提供支援。"
 RUS_transcontinental_economic_cooperation:0 "跨大陆经济协作"
 RUS_transcontinental_economic_cooperation_desc:0 "距离无法阻挡两国工人之间的合作。技术人员交换经验，工程队铺设道路，而新的生产计划正把两端的工业城市联系起来。"
 RUS_workers_peasants_military_exchange:0 "工农红军联合研讨"
 RUS_workers_peasants_military_exchange_desc:0 "来自两国的指战员在同一张地图前讨论战例。战场上的经验经过共同整理，将成为下一次行动中更加周密的计划。"
 RUS_project_156_sponsor:0 "156工程"
 RUS_project_156_sponsor_desc:0 "成套设备、技术图纸和工程人员正陆续启程前往中国。援建任务占用了国内的生产与建设能力，而双方约定的结算也将持续支持这项跨越国境的事业。"
 RUS_project_156_recipient:0 "156工程"
 RUS_project_156_recipient_desc:0 "新的工业基地将在中国大地上生根。来自俄罗斯的专家与中国工人一道勘测、施工、安装设备，为独立而完整的工业体系奠定基础。"
 RUS_sino_soviet_friendship_treaty:0 "《中苏友好同盟条约》"
 RUS_sino_soviet_friendship_treaty_desc:0 "两国人民以共同的利益与信念缔结同盟。从边境哨所到造船厂，从航空设计室到工人大会，长期合作将把这份承诺化为共同保卫和平的力量。"
 RUS_sino_soviet_treaty_easy_equipment:0 "简易模式：中苏条约装备协作"
 RUS_sino_soviet_treaty_easy_equipment_desc:0 "两国的航空工业合作正将设计成果转化为更加充足的装备供应。"
 RUS_northeast_network_combat:0 "东北抗日联络网"
 RUS_northeast_network_combat_easy:0 "东北抗日联络网：简易模式"
