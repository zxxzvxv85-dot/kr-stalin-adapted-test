l_simp_chinese:
  RUS_labour_aristocracy: "培养社会主义新文化"
  RUS_labour_aristocracy_desc: "社会主义共和国不能只依靠工厂、学校与军队维系自身。新的社会关系需要新的语言、新的艺术与新的日常生活。工农群众将在文化建设中获得发声的权利，而先锋干部也必须回答：他们是替群众说话，还是帮助群众学会用自己的声音说话。"
  RUS_education_reform_effect_new_culture_popularisation_tt: "§Y$RUS_reforming_education_system$§!追加效果：\n生活消费品工厂系数：§R+5.00%§!\n政治点每日获取：§G+5.00%§!"
  RUS_education_reform_effect_new_culture_elite_art_tt: "§Y$RUS_reforming_education_system$§!追加效果：\n生活消费品工厂系数：§G-5.00%§!\n政治点每日获取：§R-5.00%§!"
  RUS_education_reform_effect_revolutionary_realism_tt: "§Y$RUS_reforming_education_system$§!追加效果：\n党派支持度对稳定度修正：§G+10.00%§!"
  RUS_education_reform_effect_revolutionary_romanticism_tt: "§Y$RUS_reforming_education_system$§!追加效果：\n科研速度：§G+10.00%§!"
  rus_stalin_new_culture_events.next: "继续。"
  rus_stalin_new_culture_events.1.t: "新文化的创造者"
  rus_stalin_new_culture_events.1.desc: "为了奠定社会主义文化的基础，工农代表们召开了关于社会主义文化的讨论大会。会议期间，代表们将决定未来文化发展的方向。\n\n而摆在面前的首要问题是：新文化由谁创造？\n\n提出这个问题的是一位来自沃罗涅日省的农民代表。他说：“前几天我们村办了一期墙报，是上面来的干部写的。词写得很漂亮，但贴出去一整天，经过的人看了一眼就走了。后来有个老农把墙报揭下来，自己在背面写了一首打油诗。那首诗贴上去的当天，围了二十多个人看。我不是说干部写得不好——我是说，干部是坐在桌子前面写的，那首诗是蹲在田埂上写的。”\n\n会场里有人笑了，但笑完之后，这个问题被郑重地放到了议程上。\n\n一种声音认为：新文化必须由工农群众自己创造。\n\n主张这一方向的人认为：文化不能被“下发”。如果文化仅仅是自上而下地灌输给群众，那它和旧时代的“教化”有什么区别？新文化的生命力，在于它必须来自那些真正在劳动中生活的人——他们的语言、他们的感受、他们的表达方式，才是新文化最真实的土壤。\n\n干部的作用应该是提供材料与工具，而不是规定内容与形式。墙报由村民自己办，俱乐部由工人自己管，诗歌由握过锄头和扳手的人自己写。哪怕一开始粗糙、不成熟，那也是工农自己的表达——它有着任何精雕细琢的“干部文艺”都无法替代的生动与真诚。"
  rus_stalin_new_culture_events.1.desc_2: "另一种声音则认为：工农群众需要干部的引导与组织。\n\n群众生活在劳动的第一线，但缺乏系统的文化训练和理论武装。如果没有干部的组织和引导，工农自发的文化表达可能会滑向旧形式的惯性——继续唱老调子、画老花样，只是把歌词里的“沙皇”换成了“主席”。真正的社会主义新文化，需要有人来指明方向、把握分寸。\n\n干部不是来“代替”工农创作的，而是来帮助他们“提升”的。一个村庄可以自己办墙报，但如果没有干部告诉他们什么内容符合社会主义原则，他们可能会写出一些热闹却缺乏深度的东西。\n\n两种声音各有各的理由。\n\n支持工农自创的人说：干部主导的文化终将变成“干部文化”，群众只是被动的接受者，新文化将失去它最宝贵的特质——群众性。一个没有群众参与的文化，无论水平多高，都不是社会主义文化。\n\n支持干部引导的人则说：完全放任工农自发创造，可能导致文化水平的倒退。文化的进步需要方向和标准，而这些只能由受过更多教育和训练的干部来提供。如果只讲“群众性”而不讲“先进性”，新文化将永远停留在墙报和打油诗的水平上。\n\n这个问题的答案，将决定未来文化建设的根基：是自上而下地“建设”，还是自下而上地“生长”。前者保证了速度和秩序，后者保证了真实和温度。可文化本就是需要时间慢慢发酵的东西——太快，容易浮在表面；太慢，又可能错失时机。如何在这两者之间找到一条可行的路，才是这场讨论真正棘手的地方。\n\n大会决定就此表决。代表们认为:"
  rus_stalin_new_culture_events.1.a: "如不接地，束之高阁何益？"
  rus_stalin_new_culture_events.1.a.tt: "我们将以工农自创为主。"
  rus_stalin_new_culture_events.1.b: "若无引导，先锋干部何用？"
  rus_stalin_new_culture_events.1.b.tt: "我们将以干部引导为主。"
  rus_stalin_new_culture_events.2.t: "“普及”还是“拔高”？"
  rus_stalin_new_culture_events.2.desc: "文化资源是有限的，这几乎不需要论证。纸张、油墨、胶片、教师、放映机——每一样东西都有定额，每一笔拨款都需要反复争取。当你能给农村调拨的物资只有这么多时，选择就不可避免地摆在了桌面上：这些有限的东西，是拿去印十万份识字手册，还是拿去印一本精装的革命诗集？\n\n提出这个问题的是教育人民委员部的一位代表。他在发言中给出了几组数据：“按照现有的纸张配额和印刷能力，一本两百页的诗集所用的纸，足够印八千张识字挂图——挂图可以贴到八千个村庄的俱乐部里，诗集只能放进几百个书架。”\n\n会场里有人低头算了算，没有说话。\n\n争论很快分成了两条路。\n\n一方主张文化建设的首要任务是“让尽可能多的人接触到文化”。一个人如果没有看过书、没有听过戏、没有见过画，你就没法跟他讨论“什么样的书是好书、什么样的戏是好戏”。先把量铺开，让文化的种子尽可能广地播撒出去，等到每一个人都有机会识字、看报、看一场电影之后，再来谈质量的问题，才是现实的、可靠的路径。\n\n在这个主张下，资源应该优先投向普及性的文化活动：更多的乡村流动放映队、更多的扫盲课本、更多的巡回剧团。一部诗集可以做得很薄，甚至印成油印小册子；一幅画不必要求艺术水准有多高，只要它能被挂到每一个村庄的俱乐部里。有总比没有好，多一些总比少一些好。"
  rus_stalin_new_culture_events.2.desc_2: "另一方承认普及的重要性，但他们认为，“普及”的前提是“有值得普及的东西”。如果新文化始终停留在传单和挂图的水平，它将永远无法取代旧文化在群众心中的位置。一个农民看完十场粗糙的巡回演出，不如他记住一出好戏里的几句台词——而那些台词会在他心里生根，成为他判断其他事物的尺度。\n\n在这个主张下，资源应该集中投放到精品创作上——资助一部好剧本、出版一本好小说、拍一部好电影。哪怕因此少印几万张传单，只要这一部作品能够真正进入群众的心中，它的影响力就远远超过那些看过就忘的宣传品。量变引起质变的前提是“质”本身值得存在。\n\n两种主张的分歧，说到底是对“文化建设的时间逻辑”有着不同的判断。\n\n普及派认为，文化不可能在一代人之间完成跃升。先得让所有人都不再是文盲，然后才能谈“经典”；先得让所有人都看过戏，然后才能谈“好戏”——这条路更慢，但更稳，也更符合客观条件的限制。\n\n拔高派则认为，文化的跃升恰恰是通过少数精品来实现的。《共产党宣言》的初版印数并不算多，但它改变了整个世界的思考方式。如果只讲“量”而不讲“质”，文化建设就会变成一场没有灵魂的统计游戏——最后留下来的只有数据，没有一部能够被记住的作品。\n\n大会决定就此表决，大多数代表更认同:"
  rus_stalin_new_culture_events.2.a: "“量变引起质变。”"
  rus_stalin_new_culture_events.2.a.tt: "我们将认同普及派的发展方向。"
  rus_stalin_new_culture_events.2.b: "“一部经典胜过千条传单。”"
  rus_stalin_new_culture_events.2.b.tt: "我们将认同拔高派的发展方向。"
  rus_stalin_new_culture_events.3.t: "革命艺术的侧重"
  rus_stalin_new_culture_events.3.desc: "“新文化应该长什么样？”\n\n这个问题是一位南方代表提出来的：“我们建了学校、办了报纸、开了俱乐部——但俱乐部里演什么？墙上挂什么？如果新文化没有自己的艺术语言，那永远只能是无根之水。”\n\n会场随之形成了两种声音：\n\n一种主张日丹诺夫同志提出的“革命现实主义”。\n\n艺术必须扎根于现实，准确地反映社会主义建设中的具体斗争。不是照搬现实，而是通过真实的细节、具体的情境，让工农群众在艺术中看到自己的生活——看到拖拉机履带上沾着的泥、谷仓里飘着的灰尘、庄员脸上被日头晒出的皱纹。革命现实主义相信：现实本身已经足够有力量，艺术只需要诚实地把它呈现出来。"
  rus_stalin_new_culture_events.3.desc_2: "另一种则主张马雅可夫斯基同志所倡导的“革命浪漫主义”。\n\n仅仅反映现实是不够的。革命不仅是“现在发生了什么”，更是“未来将要成为什么”。艺术应该有比现实更高的温度，应该描绘出能够激励人民向前走的远景。它不回避理想，甚至刻意放大理想——因为工农群众需要在艺术中看到他们奋斗的终极目标。革命浪漫主义相信：艺术不是一面镜子，而是一盏灯——不仅照见现实，更照亮前路。\n\n现实主义派认为浪漫主义容易滑向空洞的抒情，浪漫主义派则担心现实主义会沦为对琐碎生活的平庸记录。两种声音各有各的立场，也各有各的理由。\n\n艺术的方向，将决定未来十年这个国家的文艺作品走向，也决定着一代人用什么方式来理解自己所生活的时代。\n\n大会决定就此表决。摆在代表们面前的是两个选项:"
  rus_stalin_new_culture_events.3.a: "让艺术扎根于现实斗争，以真实为最高标准。"
  rus_stalin_new_culture_events.3.a.tt: "我们认同革命现实主义。"
  rus_stalin_new_culture_events.3.b: "让艺术展望于未来方向，以理想为最高标准。"
  rus_stalin_new_culture_events.3.b.tt: "我们认同革命浪漫主义。"
  rus_stalin_new_culture_events.4.t: "宗教与社会主义"
  rus_stalin_new_culture_events.4.desc: "前俄罗斯帝国可以说基本是一个半宗教国家。东正教及其教会的影响渗透在民间生活的每一个角落——从出生时的洗礼到死亡时的安魂祈祷，从春耕前的祈福仪式到秋收后的感恩礼拜，教会在人们生活中的存在感远比任何行政机构都要持久。我国的绝大多数革命者早年也曾经是东正教徒，没有人能够否认，教会确实保存过农民的口头传统，在饥荒年月里也施舍过面包，并在很长一段时间里充当着俄国农村唯一的文化中心。\n\n有人认为，我们的目标与早期基督徒的愿景本质上是一致的：世界和平、人类大同、人人平等。在他们看来，早期基督教对罗马帝国奴隶制的反抗，与社会主义对资本主义剥削的反抗，在“精神气质”上有着某种相通之处——只不过前者把希望寄托在来世，后者在今生就要将其实现。这种“连续性”的视角，使得一些人主张以“改造”代替“摧毁”，用社会主义建设来吸纳宗教文化中有价值的部分。\n\n然而反对的声音同样响亮：早期基督徒等待的是天国，而我们正在建设的是人间。基督教会作为一个社会组织，其存在本身就依赖于“超自然权威”对世俗秩序的干预——这与社会主义的理性主义基础是根本不相容的。如果允许教会继续存在，它就会像一颗埋在路基下的旧钉子，在某一天突然扎破轮胎。"
  rus_stalin_new_culture_events.4.desc_2: "问题还不止于此。宗教在农村的权力结构并不只是精神上的——教会拥有土地（尽管已在土地改革中被没收）、拥有学校（正在被改造）、拥有对生老病死的仪式垄断权。它不需要公开对抗苏维埃政权，只需要继续在村庄里扮演“另一种权威”的角色，就足以让新政权的基层组织感到束手束脚。一个农民遇到困难时，是先找支部书记，还是先找神父？这个问题的答案，在相当一部分地区仍然不明确。\n\n大会最终在这个问题上形成了两种不同的路线：\n\n彻底清除宗教影响。教会与旧制度是一体的，不清除宗教影响，社会主义意识形态就无法在农村真正扎根。教堂应改为俱乐部或仓库，宗教教育应予禁止，神职人员应转业或接受再教育。只有彻底切断“神”与“人”之间的那根线，人民才能真正意识到：能拯救自己的不是天堂里的祈祷，而是手中的犁和锤子。\n\n逐步改善宗教关系。立即强制废除宗教只会制造不必要的对立，特别是在信仰根深蒂固的农村地区。应当通过教育、文化建设和社会保障，逐步削弱教会的实际影响力，让农民在感受到国家提供了比教会更可靠的帮助之后，自然地转向新的生活方式。宗教本身会随着社会条件的变化而自行消退，不必急于用行政手段去“拔除”。\n\n经最后表决，大会倾向于:"
  rus_stalin_new_culture_events.4.a: "宗教是人民的鸦片……"
  rus_stalin_new_culture_events.4.a.tt: "我们将与宗教决裂。"
  rus_stalin_new_culture_events.4.b: "……但问题应当在人民为何皈依祂"
  rus_stalin_new_culture_events.4.b.tt: "我们将与宗教和解。"
