l_simp_chinese:
 RUS_soviet_anthem.1.t:0 "行动吧！人民艺术家们！"
 RUS_soviet_anthem.1.d:0 "随着苏维埃社会主义共和国联盟作为一个统一的国家联盟存在，代国歌《国际歌》同时也是法兰西公社联邦国歌，容易出现一次大会奏响多次《国际歌》的尴尬局面，要求更改国歌的呼声也愈演愈烈。\n\n经过苏联共产党中央政治局会议讨论，我们决定面向全联盟人民征集新的国歌旋律和歌词，时限三个月。"
 RUS_soviet_anthem.1.a:0 "真期待他们的作品啊！"
 RUS_soviet_anthem.2.t:0 "苏联正式国歌的决定"
 RUS_soviet_anthem.2.d:0 "历经三个月，最高苏维埃先后收到了来自170位作曲家的223份音乐方案，以及来自67位诗人的84份歌词方案。经过多轮投票，最高苏维埃主席团从最终入围的19份歌词方案中选中了米哈尔科夫和埃尔-列吉斯坦的作品，但三首入围旋律仍然竞争激烈。\n\n第一首来自著名音乐家迪米特里·肖斯塔科维奇。宁静的编钟开场和逐渐高昂的曲调带来史诗般的气势，不过作为国歌，其音域可能会让人民演唱时感到吃力。\n\n第二首来自曾任军乐团总监兼指挥的谢苗·切尔涅茨基，名为《光荣啊，我们的苏维埃祖国》。这是一首歌词和编曲都十分出色的颂歌，但复杂的旋律也提高了传唱难度。\n\n第三首是亚历山大·亚历山德洛夫以《布尔什维克党歌》重新编曲的作品。苏联共产党党歌则重新改为《国际歌》。他提交了三个重编曲版本，最终入围的一版编曲简洁，音域适合大多数民众，易于传唱。\n\n全联盟最高苏维埃会议经过无记名投票，最终采用的国歌是——"
 RUS_soviet_anthem.2.a:0 "亚历山德洛夫重编曲填词后的《苏联颂》！"
 RUS_soviet_anthem.2.b:0 "切尔涅茨基的《光荣啊，我们的苏维埃祖国》！"
 RUS_soviet_anthem.2.c:0 "肖斯塔科维奇的《社会主义的钟声》！"
