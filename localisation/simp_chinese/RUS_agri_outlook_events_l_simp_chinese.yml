 RUS_agricultural_management.3.t:0 "新国家农业展望"
 RUS_agricultural_management.3.d:0 "随着土地改革的深入推进与农业工厂的大规模试点，最高经济委员会对各地区的农业生产恢复情况进行了综合评估。评估结果显示，在可预见的未来一段时期内，我国的粮食安全已获得基本保障——\n\n农业生产的恢复速度超出预期，试点区域的单位产量较传统耕作模式有了明显提升。这一趋势令各方对农业改造的前景抱有信心。\n\n中央统计局提交的最新粮食供需报告，亦为此提供了有力的数据支撑——\n\n过去数年间，全国主要粮食品种的自给率持续保持在安全线以上，战略储备粮库存已恢复至内战前水平的七成。最高经济委员会内部的一份评估文件进一步指出，若当前的生产恢复势头得以维持，至五年计划末期，我国将有望彻底摆脱对外部粮食输入的依赖。\n这一判断在委员会内部也获得了跨派系的广泛认同。\n\n然而，产量上的初步成功并不等同于体制上的成熟。农业工厂在各地推行过程中，暴露出管理标准不一、技术推广滞后、以及劳动力调配缺乏统筹等问题。部分试点地区虽产量达标，但组织架构松散，工人与管理人员之间的权责界限模糊；另一些地区则因缺乏统一的技术规范，相邻工厂之间的单产差异高达三成以上。更为突出的问题是，现有管理体系仍未有效解决“如何将分散的农村劳动力纳入稳定的工业劳动制度”这一根本性难题。\n\n针对上述情况，人民农业部副部长安德烈·科列加耶夫向大会提交了新的改革方案。方案提出，为保证农业生产的效率与稳定，农业工厂中须引入相应的民主管理方式与经济反馈制度，以厘清权责、规范流程，并为后续的规模化推广积累制度经验。\n\n该方案在大会上获得广泛认同，各方一致认为其在原则上也具有相当的可行性。具体条款则需由最高经济委员会与农业部共同成立的工作组，在进一步的实地调研中予以细化。"
 RUS_agricultural_management.3.a:0 "向新世界的又一次跃进。"
 RUS_agricultural_management.3.b:0 "让我看看这位“农民列宁主义者”的方案。"
 RUS_agricultural_management.4.t:0 "关于科列加耶夫方案"
 RUS_agricultural_management.4.d:0 "科列加耶夫方案的核心思路，在于将农业工厂从“实验性试点”全面推向“制度化运行”。其体制设计如下：\n\n一、组织架构\n\n农业工厂以行政区划内的若干村庄为单位组建，由地方农业苏维埃直接领导。工厂内部实行三级管理：厂部负责制定年度生产计划与技术方案；车间对应各自然村，负责落实具体耕作任务；生产队则为最基本的劳动单元，按土地面积与作物类型进行划分，实行定额管理。\n\n这一三级结构的设计初衷，在于保持足够的管理跨度，同时避免因层级过多而导致的指令失真。\n\n二、地区自主权与中央管控\n\n在地区自主权方面，方案确立了“统一计划、分级实施”的基本原则。厂部根据中央下达的指导性指标制定年度生产计划，但各车间在作物品种选择、耕作时序安排、轮作休耕比例等具体事项上享有相当程度的裁量权。各农业工厂可在不脱离上级计划框架的前提下，依据本地土壤条件与气候特点灵活调整种植结构——这一安排的初衷，在于避免中央指令脱离地方实际，从而降低因“一刀切”所带来的减产风险。\n\n与此同时，方案亦明确规定了强制性的调度机制。在粮食征购任务、耕种面积底线以及主要技术标准（如良种使用率、化肥施用规范）等关键事项上，各农业工厂须无条件执行中央统一指令，不得以地方特殊性为由申请豁免。地方农业苏维埃负有监督执行之责，每季度须向人民农业部提交生产进度报告。对于连续两季度未达标的单位，上级有权启动“特别督导程序”，派遣技术小组进行整改指导，并在必要时调整工厂管理班子。\n\n简言之：地方拥有足够的弹性以适应农业生产的自然差异，而中央保有足够的强制力以确保粮食安全这一战略底线不被侵蚀。方案试图在这一对矛盾之间划定一条可操作的边界。\n\n三、劳动关系与分配方式\n\n在劳动关系上，农业工厂实行统一的劳动组织制度。农民以“农业工人”身份进入工厂，不再作为独立个体农户与土地直接挂钩。每日出工、分工协作、轮换调度的制度逐步取代传统的农忙临时雇佣模式。工厂内部设立技术指导组与政治委员岗位——前者负责推广良种与耕作标准，后者负责劳动纪律与政治教育工作。\n\n在分配方式上，农业工厂采用按劳分配的工分制度。基本工分依据劳动时长与劳动强度确定，另设奖惩工分作为调节机制，以鼓励超额完成生产任务或采纳新技术。年度结算时，工分总额与工厂实际产量挂钩，多产多得，歉收则相应下调。\n\n若遭遇规模性自然灾害，委员会仍会保证工厂成员的基本生活。\n\n四、推广步骤\n\n方案提出分三期推进：\n\n· 第一期：在已有试点基础上总结经验，制定统一的管理章程与技术标准；\n· 第二期：选取主要产粮区全面铺开，计划覆盖全国可耕面积的60%；\n· 第三期：将农业工厂的经验逐步拓展至畜牧与园艺领域，实现农业部门的全面工厂化改造。\n\n五、方案的总体定位\n\n科列加耶夫在方案说明中强调，农业工厂不是简单的“集体化翻版”，而是以工业化逻辑重组农业生产的制度载体——其目标不仅是提高产量，更是在农村中建立起符合社会主义原则的劳动关系与管理结构。\n\n在方案说明的末尾，科列加耶夫援引并化用了列宁的名言作为结语："
 RUS_agricultural_management.4.a:0 "“社会主义农业=工厂生产+民主原则”"
