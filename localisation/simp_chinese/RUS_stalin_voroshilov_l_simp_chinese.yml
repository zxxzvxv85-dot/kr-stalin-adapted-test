 RUS_kliment_voroshilov: "克利缅特·叶夫列莫维奇·伏罗希洛夫"
 RUS_kliment_voroshilov_army_chief: "克利缅特·叶夫列莫维奇·伏罗希洛夫"
 RUS_kliment_voroshilov_advisor_desc: "§Y生于：§! §L1881年1月23日；俄罗斯帝国、叶卡捷琳诺斯拉夫省、巴赫姆特县§!\n§Y背景：§! §L克利缅特·叶夫列莫维奇·伏罗希洛夫出生于叶卡捷琳诺斯拉夫省巴赫姆特县的一个铁路工人家庭。年幼时，他曾当过牧羊人和矿工。1893年至1895年，他在一所泽姆斯基学校学习。\n\n1896年，他进入顿涅茨克-尤里耶夫斯克冶金协会所属的叶卡捷琳宁斯基工厂工作，后因组织罢工被解雇，也正是在这段经历中逐渐展露出自己的组织才能。1903年，他成为卢甘斯克机车制造厂的工人。同年年底，工人的悲惨待遇和激进地下报刊的影响促使他加入俄国社会民主工党（布）。\n\n从1904年到第一次世界大战爆发前，伏罗希洛夫先后三次被捕、两次流放；每次重获自由后，他都重新回到卢甘斯克的地下工作，并两度成为当地布尔什维克组织的领导人，还参加过两次俄国社会民主工党（布）代表大会。1914年第一次世界大战爆发后，他一直在察里津火炮厂工作。\n\n1917年二月革命后，他当选彼得格勒工兵苏维埃代表。3月，他担任布尔什维克卢甘斯克委员会主席；同年8月，他参加了俄国社会民主工党（布）第六次代表大会。\n\n1917年11月，在彼得格勒武装起义中，伏罗希洛夫担任彼得格勒军事革命委员会委员。一个月后，他又与费利克斯·埃德蒙多维奇·捷尔任斯基一道参与筹建全俄肃反委员会。\n\n1918年3月，伏罗希洛夫组建了卢甘斯克第1社会主义分队，抵挡德奥联军对顿巴斯的进攻。之后，他先后担任第5集团军司令员、南部方面军副司令员兼军事委员会委员。10月3日至12月18日，他出任第10集团军司令员，率部参加察里津战役。\n\n1919年，在俄共（布）第八次代表大会上，伏罗希洛夫站在斯大林的“军事反对派”一边。当托洛茨基假惺惺地提出在启用旧军官之前建立政委制度时，伏罗希洛夫拍案怒斥：“我操你妈！这本来就是已故领袖弗拉基米尔·伊里奇·列宁同志在遇刺之前提出的军事政治制度，在他逝世后竟然被你这个前孟什维克的军事委员会蛀虫隐瞒下来、拒绝执行，如今竟然作为折中方案出现，真是他妈的令人恶心！”随后愤然离席。\n\n不久后，奉斯维尔德洛夫、斯大林、伏龙芝等人的指示，伏罗希洛夫率部前往贝加尔湖一带，同当地善于寒区作战的游击队会合，并将其整编为一支在布尔什维克主力撤离俄罗斯本土后仍坚持作战的军事游击力量。这支部队持续打击白匪政府，因极其适应冰天雪地，当地白军畏惧地称他们为“雪怪”。“雪怪”游击队在底层民众中声望极高，几乎每个村民都把队员当作亲人，这也为游击队带来了源源不断的兵员和补给。\n\n伏罗希洛夫与同样在俄罗斯本土坚持游击斗争的日丹诺夫算是同乡。两人建立电台联系后，共同成立了名为“整合运动”的军政一体组织，号召更多受压迫者加入反抗剥削者的行列。\n\n当克里姆林宫的红旗再度升起，待到德国帝国主义也被击败之后，伏罗希洛夫终于能够回到阔别二十年的故乡卢甘斯克。§!"
