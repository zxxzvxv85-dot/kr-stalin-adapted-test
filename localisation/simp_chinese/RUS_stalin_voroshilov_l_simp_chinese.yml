 RUS_kliment_voroshilov: "克利缅特·叶夫列莫维奇·伏罗希洛夫"
 RUS_kliment_voroshilov_army_chief: "克利缅特·叶夫列莫维奇·伏罗希洛夫"
 RUS_kliment_voroshilov_advisor_desc: "§Y生于：§! §L1881年2月4日（俄历1月23日）；俄罗斯帝国、叶卡捷琳诺斯拉夫省巴赫姆特县维尔赫涅村§!\n§Y背景：§! §L克利缅特·叶夫列莫维奇·伏罗希洛夫出身于叶卡捷琳诺斯拉夫省巴赫姆特县的一个铁路工人家庭，幼年牧羊、下矿，备尝底层艰辛。1893至1895年间就读于泽姆斯基学校，1896年进入顿涅茨克—尤里耶夫斯克冶金协会叶卡捷琳宁斯基工厂，因组织罢工被解雇。也正是在这一时期，他的组织才干开始崭露头角。1903年，他转入卢甘斯克机车制造厂工作，同年年底，在对工人待遇的深切失望与地下革命报刊的感召下，他加入了俄国社会民主工党（布）。\n\n自1904年至一战爆发，他先后三次被捕、两次流放，其间两度出任卢甘斯克地区布尔什维克的领导人，并参加了两次全俄社会民主工党（布）代表大会。1914年大战伊始，他调至察里津火炮厂工作。\n\n1917年二月革命后，他当选彼得格勒工兵苏维埃代表，同年3月担任布尔什维克卢甘斯克委员会主席，8月出席俄国社会民主工党（布）第六次代表大会。11月彼得格勒武装起义期间，他是军事革命委员会委员；一个月后，又与捷尔任斯基共同参与组建全俄肃反委员会。\n\n1918年3月，伏罗希洛夫组建卢甘斯克第一社会主义分队，抵御德奥联军对顿巴斯的进攻，随后相继担任第五集团军司令员、南部方面军副司令员兼军事委员会委员，并于10月至12月间出任第十集团军司令员，率部参加了察里津战役。\n\n1919年俄共（布）第八次代表大会上，他作为斯大林的坚定支持者，置身“军事反对派”阵营。当托洛茨基以折中姿态提出在启用旧军官之前建立政委制度时，伏罗希洛夫当即予以尖锐驳斥——他点明，该制度本是已故领袖列宁在遇刺前既已明确的军事政治方针，却长期被托洛茨基以“过渡方案”之名搁置不宣，实为对革命遗产的蓄意曲解。言罢，他愤然离席。\n\n此后，经斯维尔德洛夫、斯大林、伏龙芝等人的部署，伏罗希洛夫率部开赴贝加尔湖一带，与擅长严寒作战的当地游击队会合，整合为布尔什维克撤离俄罗斯本土后仍在敌后坚持的军事游击力量，持续打击白军政权。由于对极寒环境的卓越适应力，这支队伍被当地白军惊恐地称为“雪怪”；而他们在底层民众中享有极高的声望，几乎每座村庄都视“雪怪”为亲人，因而兵员与补给源源不断。\n\n在此期间，他与同在俄罗斯本土从事游击斗争的日丹诺夫因同乡之谊建立电台联系，共同成立了“整合运动”（一个由布尔什维克主导、军政合一的游击组织），旨在号召更多受压迫者投身反抗剥削者的行列。\n\n当克里姆林宫的红旗再度升起，击败德帝国主义之后，伏罗希洛夫终于得以重返他阔别二十年的故乡——卢甘斯克。§!"
