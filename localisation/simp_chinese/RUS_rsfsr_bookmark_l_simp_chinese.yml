 RUS_rsfsr_bookmark_history: "起初，在弗拉基米尔·列宁激情四射的领导下，布尔什维克的大名响彻全国，还有希望最为渺茫、处境最为凄凉的阶层给予其支持。\n\n然而天不遂人愿，在革命形势急剧变化的过程中，人民所期望的左翼团结并没有到来，投机主义的社革党人率先背叛了革命，列宁同志也在这场背叛中牺牲，曾经前途大好的俄国革命毁于一旦，布尔什维克们只能背井离乡、另谋出路……"
