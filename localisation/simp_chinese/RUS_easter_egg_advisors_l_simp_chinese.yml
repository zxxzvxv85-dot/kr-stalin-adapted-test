 RUS_egg_hongying:0 "今日红缨在手"
 RUS_egg_hongying_advisor:0 "今日红缨在手"
 RUS_egg_hongying_trait:0 "远视极权自动化未来平权主义"
 RUS_egg_hongying_advisor_desc:0 "§Y背景：§!§L红缨的意识形态恐怕是近年来最值得研究的话题，他通常不被认为是正经的或是传统的革命者，如果说他是左派，他对自由意志的无限制打压会显得他像个保皇派，如果说他是右派，那么他对布尔什维克的政策又十分的推崇。\n\n一个倾向于平等的极权主义者——或许这么说可能会比较合适，他还认为只要让AI哲人王掌管一切经济事务，所有事情都会变得好起来。\n\n在组内，他也更倾向于快乐一些，虽然有时负面情绪会溢出来，但这微不足道。\n\n要喜剧，不要悲剧，为了让所有事物都走向Happy End。\n\n为了世界上所有美好而战——这人是个米卫兵§!"
 RUS_egg_hongying_recruit:0 "邀请今日红缨在手"
 RUS_egg_hongying_recruit_desc:0 "解锁彩蛋顾问今日红缨在手。解锁后可在政治顾问栏任命。"
 RUS_egg_suyi:0 "Suyi"
 RUS_egg_suyi_advisor:0 "Suyi"
 RUS_egg_suyi_trait:0 "概率学博士"
 RUS_egg_suyi_advisor_desc:0 "§Y背景：§!§LSuyi的mod制作历程可谓成效显著，仅用数周时间，便凭借独具风格的文案撰写和策划运营，完成了从普通群友到核心组员的跨越式转变——这一转变并非偶然，既源于其在文案撰写和策划运营方面的持续积累，也与其温和稳重的做事风格密切相关。\n\n尽管Suyi在群内仍习惯以“季伯常”自居，但其工作热情仍感染着每一位组员。\n\n“有理想的人，生活总是火热的。”§!"
 RUS_egg_suyi_recruit:0 "邀请Suyi"
 RUS_egg_suyi_recruit_desc:0 "解锁彩蛋顾问Suyi。解锁后可在政治顾问栏任命。"
 RUS_egg_xin:0 "心"
 RUS_egg_xin_advisor:0 "心"
 RUS_egg_xin_trait:0 "自刎归天"
 RUS_egg_xin_advisor_desc:0 "§Y背景：§!§L某种意义上来讲，牢心可能是制作组成分最复杂的人，在作为群友的早年生活中，他有时跳出来发表一些长篇大论，有时又会在长时间内陷入沉寂；不仅如此，牢心的还乐于在mod群里搬花样繁多的史，从科幻FPS对局到神笔历史小故事应有尽有，他自己美其名曰分享美食。尽管他的史经常0个人在意，但他依然乐此不疲。\n\n作为制作组新加入的成员之一，曾经的他对mod制作望而却步。直到某一天他下载了那个震撼的多么多么的多么mod——承蒙多么多么mod组的伟力，他被让KR红俄再次伟大的理想所感召，完成了从见证别人做mod到自己参与做mod的转变。为了达成这个伟大理想，无论付出何种代价都在所不惜，哪怕让群聊燃烧，让飞书陨落........§!"
 RUS_egg_xin_recruit:0 "邀请心"
 RUS_egg_xin_recruit_desc:0 "解锁彩蛋顾问心。解锁后可在政治顾问栏任命。"
 RUS_egg_mia:0 "米娅"
 RUS_egg_mia_advisor:0 "米娅"
 RUS_egg_mia_trait:0 "最强菜花蛇"
 RUS_egg_mia_advisor_desc:0 "§Y背景：§!§L米娅，一个简简单单的假名，浓缩了相当多的意义——友人称之为爱称，敌人则认为是撒旦般可憎的代名词。她向来被冠以许多称号，却都不能够充分的代表她。只有一件事情能够为多数人所肯定——她肯定任职着相当重要的位置，同larruping一般使用奶蛙作为代表图案，更是为这一事情提供了证据。\n\n米娅在何时何地进行过活动，也许连她的友人也无法得知。大多数时候，递交给米娅的文件都会在第二天以批注完毕的形式交付回来，这无疑为她增添了些许神秘色彩。随着奶蛙图案和过夜出现的批注文件越来越多，米娅也逐渐浮现在人们的视野中，可她究竟是谁？性别为何？这些问题仍留在黑暗之中。\n\n随着米娅的出现越来越突然，间隔也越来越久，不少人都认为她正在执行一个从所未有的任务，而更多的人只认为她已经死去，只留下米娅这个代称。不管怎么样，米娅都将在大众心里留下符号，不管是以什么样的色彩。§!"
 RUS_egg_mia_recruit:0 "邀请米娅"
 RUS_egg_mia_recruit_desc:0 "解锁彩蛋顾问米娅。解锁后可在政治顾问栏任命。"
 RUS_egg_su_beichen:0 "苏北辰"
 RUS_egg_su_beichen_advisor:0 "苏北辰"
 RUS_egg_su_beichen_trait:0 "制作组最锋利的剑"
 RUS_egg_su_beichen_advisor_desc:0 "§Y背景：§!§L该如何形容苏北辰，这位制作组最锋利的剑？他向来被冠以许多称号：愤怒者——只要被某些事情气红温就会产出优质文案；整活运动的实际领导者；毫无骨气的享乐主义者，沉迷于战争雷霆；组长larruping最早、最忠实的追随者。总而言之，他是个极端的人，对于所爱之物，他痛快地耍起；对于所恨之事，他放肆地耍起。\n\n事实上，关于苏北辰的种种神秘事迹很大程度上要归功于他的神人言论，或是那些和他一同加入制作组的组员。苏北辰从哪里来，0个人知道，直到组长的适配版震撼发布，他迷恋上了mod——他走上了做mod的道路，也走向了做mod的极端：经过很久攻击社革、攻击社革、攻击社革的道路，最终一步步走向了制作组。他摇身一变，从一名评论区鬣狗变成了一名制作组组员。他们将不惜一切代价，用鲜血铸就一条KR共产主义复兴之路。§!"
 RUS_egg_su_beichen_recruit:0 "邀请苏北辰"
 RUS_egg_su_beichen_recruit_desc:0 "解锁彩蛋顾问苏北辰。解锁后可在政治顾问栏任命。"
 RUS_egg_larruping:0 "larruping"
 RUS_egg_larruping_advisor:0 "larruping"
 RUS_egg_larruping_trait:0 "赌徒"
 RUS_egg_larruping_advisor_desc:0 "§Y背景：§!§L该如何形容larruping，这位制作组的组长？他向来被冠以许多称号：反动派，因为他mod里越来越弱的俄罗斯和苏联；享乐主义者、沉迷斗地主的赌徒和好色之徒，自以为肩负着某种伟大使命，还喜欢发唐得没边的奶蛙表情包。总而言之，他是个整活的人，对于所爱之物，他不离不弃地整活；对于所恨之事，他深恶痛绝地整活。\n\n事实上，关于larruping的种种神话很大程度上要归功于他的mod，或是那些受他启发的狂热玩家。larruping在遥远的东方长大成人，正是在那里，他迷恋上了做mod——他走上了做mod的道路，也走向了逻辑的极端：经过多年整活主义和bug的洗礼，最终一步步成立了多么多么的制作组。他摇身一变，从一名为爱发电的玩家变成了一位制作组的领导人。mod发布后，许多人随他加入了制作组——这是一个为KR布尔什维克拨乱反正的组织，他们将不惜一切代价，铸就一条KR共产主义的复兴之路。§!"
