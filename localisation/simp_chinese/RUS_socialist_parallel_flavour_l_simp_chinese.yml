 RUS_socialist_parallel_flavour.1.t: "《全俄工农国防动员令》"
 RUS_socialist_parallel_flavour.1.d: "德国容克与资产阶级政府现已通过《战争法》，公然叫嚣着要绞杀世界上所有的工农国家。他们企图用武力扑灭革命的火焰，把全俄人民重新推入无底的深渊。除了穷兵黩武的帝国主义者，谁还会准备这样一场针对无产阶级祖国的大战？\n\n面对帝国主义的刀锋，我们已别无选择。为了保卫工农政权，为了不让革命烈士的鲜血白流，全俄中央执行委员会现正式颁布《国防动员令》。我们绝不重蹈资产阶级临时政府的覆辙——他们为了帝国利益把士兵送进绞肉机，我们将为了阶级解放而武装工农。\n\n该法令引入了一项全新的“革命国防捐”，呼吁全国人民为保卫祖国献出力量，扩大军工生产。所有与国防相关的企业将全面实行军事化管理和免税优待，重工业全面转向战时轨道。同时，削减一切非必要的官僚机构开支，把每一分钱都用在红军和工人武装上。\n\n全俄罗斯的工人、农民和士兵们必须明白：我们即将迎来的，不是一场民族国家间的争霸战，而是一场生死存亡的卫国战争。为了一劳永逸地埋葬帝国主义的干涉，我们必须全副武装，"
 RUS_socialist_parallel_flavour.1.a: "随时准备粉碎一切来犯之敌。"
 RUS_socialist_parallel_flavour.2.t: "基辅事变"
 RUS_socialist_parallel_flavour.2.d: "近二十年来，乌克兰一直是帕夫洛·斯科罗帕茨基这个帝国主义走狗统治下的黑暗囚笼。这些年来，这个前沙皇将领始终在充当柏林容克和资本家的看门犬，残酷压榨着乌克兰的工农群众。每当底层反抗的浪潮涌起，他便会举起屠刀——1936年的反盖特曼起义未能将他赶下台，无数革命烈士的鲜血染红了第聂伯河，而他却依然盼着柏林主子能让他多苟延残喘一日。\n\n现在，盖特曼终于倒台了——但他并非败给了无产阶级革命，而是死于资产阶级内部更激进派系的黑吃黑。新上台的乌克兰民族主义联盟，披着激进的外衣，骨子里却比前任更加反动。他们毫不犹豫地投向柏林，继续充当帝国主义的附庸。\n\n这帮叛徒立刻开始了一场所谓的“民族革命”。他们取缔俄语，煽动民族仇恨，将枪口对准一切与苏维埃相连的事物。他们叫嚣着要“收复”顿巴斯和库班，妄图把罗斯托夫到阿斯特拉罕的工农兄弟重新踩在脚下。\n\n但柏林的算盘从未改变：乌克兰不过是资本主义世界用来绞杀苏维埃的一杆枪。无论是斯科罗帕茨基，还是这群所谓的民族主义者，都只是国际帝国主义拴在边境上的一条恶犬。\n\n新政权注定不会给乌克兰人民带来解放。它带来的只会是更深的压迫、更惨烈的内战和更彻底的卖国。乌克兰的无产阶级必须明白：只有与苏维埃的工农兄弟并肩作战，推翻一切资产阶级反动政权，才能砸碎帝国主义的锁链，真正成为自己土地的主人！\n\n我们绝不能坐视不管。乌克兰的工人和农民在呼唤，红军必须做好准备，粉碎这股反动的民族主义逆流。"
 RUS_socialist_parallel_flavour.2.a: "民族主义是资产阶级和一切反动派的口号……"
