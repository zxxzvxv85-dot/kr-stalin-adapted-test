 RUS_ip_cost_rail:0 "投资 §R-1§! · 每级"
 RUS_ip_rail_tt:0 "§Y厂内运输线§!\n线路等级：§G+1§!\n建设投资：§R-1§!\n逐格接到本区调度站，只连接上下左右。最多3级，与设施共用格子；最佳路线的最低等级限制产能。"
 RUS_ip_remove_tt:0 "返还设施全部实付投资；保留线路、库存和交付量。"
 RUS_ip_remove_rail_tt:0 "返还线路全部实付投资；保留设施，依赖此线的设施可能断线。"
 RUS_ip_switch_tt:0 "停机后不生产、不耗料、不耗电，线路仍能通行。"
 RUS_ip_refresh_tt:0 "重算线路、产能和次日产量，不推进日期、不发放收益。"
 RUS_ip_start_tt:0 "开始1800天连续生产；目标工业产值§Y500§!。关闭窗口仍运行，期满停止。"
 RUS_ip_restart_tt:0 "再次确认后清空六区设施、线路、全部原料、成品交付、产值与计时，恢复40投资并重抽矿点；不影响旧一五计划。"
 RUS_ip_footnote:0 "独立测试沙盘 · 产品按固定单价计入产值 · 随游戏日期生产"
 RUS_ip_help_title:0 "工业规划沙盘 · 玩法介绍"
 RUS_ip_help_0:0 "§Y一、先布置，再开工§!\n六区共享初始投资§Y40§!，每区煤§Y6§!、铁§Y4§!、钢§Y2§!。先布置，再点击“开始生产”。目标是在§Y1800§!天内交付§Y500§!工业产值，关闭窗口仍生产。\n基础煤铁、电站、钢铁厂和机械厂可独立开局；特色产业可在积累投资后发展。"
 RUS_ip_help_1:0 "§Y二、六区的不同选择§!\n莫斯科生产机床；彼得格勒生产航空部件；察里津生产拖拉机；西西伯利亚生产铁路装备；中西伯利亚生产发电设备；远东生产精密工具。\n铝、铬、钨和石油按KR州组分布；基础煤铁保留起步保障。矿点位置随机，切图和读档不重抽。"
 RUS_ip_help_2:0 "§Y三、运输与建设§!\n设施格及途经格铺线，按上下左右接到本区调度站。设施和线路最高§Y3§!级，最薄弱路段限制产能。一级绿、二级蓝、三级金。\n“基础生产”可建运输站，每区一座；两端接通后在“跨区运输”选择目的地与货物，设置保留量并开启自动发运。每级单批6单位，每单位运费0.1。"
 RUS_ip_help_3:0 "§Y四、按顺序组织加工§!\n采矿→炼油→发电→炼钢→铝与合金→特色制造→通用机械。炼油自备辅助动力，燃油电站可节省煤。\n特色制造先领取原料，可用停机按钮调整分配。物资可用运输站跨区调拨，电力仅在本区使用。缺料缺电按比例减产，电力不储存。"
 RUS_ip_help_4:0 "§Y五、产品价值与回流§!\n单价：机械§Y1§!，拖拉机§Y1.5§!，机床§Y2§!，铁路装备§Y2.5§!，航空部件与发电设备§Y3§!，精密工具§Y4§!。\n实际交付×单价计入产值，同额回流投资。原料和中间品库存不计价。高级工厂更贵、配套更多；没有固定拨款。"
 RUS_ip_help_5:0 "§Y六、预估、退款与期满§!\n产量速览是下一日产率×30，不保证库存能支撑整月。建设按钮显示每级配方和产值，顶部累计产值悬浮列出所有产品交付量。\n拆除退实付投资；期满保留结果，未到货物与该批运费退回，重置须再次确认。本沙盘独立，不发放真实工厂，不接管旧一五计划。"
 RUS_ip_freight_page:0 "跨区运输"
 RUS_ip_freight_page_active:0 "§Y跨区运输§!"
 RUS_ip_freight_page_tab:0 "[GetRUSIPFreightMenu]"
 RUS_ip_freight_title:0 "[GetRUSIPRegion] · 自动运输线路"
 RUS_ip_freight_destination_label:0 "目的地区：[GetRUSIPFreightDestination]"
 RUS_ip_freight_goods_label:0 "发运货物：[GetRUSIPFreightGoods]"
 RUS_ip_freight_reserve_button:0 "保留 [?RUS_ip_freight_reserve|0]"
 RUS_ip_freight_on:0 "§G自动发运：开§!"
 RUS_ip_freight_off:0 "自动发运：关"
 RUS_ip_freight_toggle_button:0 "[GetRUSIPFreightEnabled]"
 RUS_ip_freight_rules_tt:0 "§Y跨区运输§!\n两区各建一座运输站并接通当地调度站。\n每区一条自动外运线路，可接收多个地区来货。\n单批上限：两端较低有效等级 × §Y6§!\n每单位运费：§R-0.10§! 投资。最低发运量：§Y1§!。\n工厂先用料，日末从超过保留量的库存发货。\n按地区距离计时；两端每共同提高一级，行程减少1天，最低1天。\n这是沙盘运输，不检查原版地图铁路。电力和已交付成品不运输。"
 RUS_ip_freight_select_tt:0 "选择下一批货物的目的地区；已在途货物仍运往原目的地。"
 RUS_ip_freight_reserve_tt:0 "本地最低保留库存：§Y0 → 3 → 6 → 12§!，点击循环。\n只运出高于保留量的部分；工厂仍可以消耗保留的材料。"
 RUS_ip_freight_toggle_tt:0 "开启后持续自动发运；上一批卸货后自动安排下一批，无需重复点击。\n库存、运费不足或运输站断线时暂停，条件恢复后自动继续。\n关闭只停止新发货，已在途货物继续运输。关闭窗口不停止物流。"
 RUS_ip_freight_preview:0 "批量上限：§Y[?RUS_ip_freight_limit|0]§!   本区有效站级：§Y[?RUS_ip_transport_capacity|0]§!\n当前可发：§G[?RUS_ip_freight_preview_amount|1]§!   运费：§R-[?RUS_ip_freight_preview_fee|2]§!   行程：§Y[?RUS_ip_freight_preview_days|0]§! 天\n[GetRUSIPFreightStatus]"
 RUS_ip_freight_preview_tt:0 "按当前库存与投资预估，尚未扣款。实际日末先供应生产，再按剩余库存和投资发运。多个地区共用建设投资。"
 RUS_ip_freight_empty:0 "当前没有外运货物"
 RUS_ip_freight_shipment:0 "[GetRUSIPFreightCargo] §Y[?RUS_ip_freight_amount|1]§! → [GetRUSIPFreightTo]\n剩余 §Y[?RUS_ip_freight_days|0]§! 天；到期需目的站接通、开机方可卸货。"
 RUS_ip_freight_outbound:0 "[GetRUSIPFreightShipment]"
 RUS_ip_freight_outbound_tt:0 "货物离库后独立计时，修改配置或拆掉出发站不改变已发货物。\n目的站断线则等待卸货。期满未到货退回出发区，并退还该批运费。"
 RUS_ip_freight_incoming:0 "本区来货：§Y[?RUS_ip_freight_incoming_count|0]§! 批／§Y[?RUS_ip_freight_incoming_amount|1]§! 单位\n累计到货：§G+[?RUS_ip_freight_received|1]§!   全国净运费：§R-[?RUS_ip_freight_spent|1]§!"
 RUS_ip_freight_incoming_tt:0 "§Y发往本区的货物§!\n[GetRUSIPFreightInbound0]\n[GetRUSIPFreightInbound1]\n[GetRUSIPFreightInbound2]\n[GetRUSIPFreightInbound3]\n[GetRUSIPFreightInbound4]\n[GetRUSIPFreightInbound5]"
