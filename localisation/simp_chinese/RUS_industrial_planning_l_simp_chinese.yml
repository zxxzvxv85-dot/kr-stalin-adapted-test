 RUS_ip_stock_ribbon:0 "库存：钢 [?RUS_ip_sel_stock_steel|1] / 煤 [?RUS_ip_sel_stock_coal|1]  ·  日需求 [?RUS_ip_sel_need_steel|2] / [?RUS_ip_sel_need_coal|2]  |  [GetRUSIPArrival]  |  净收支 [?RUS_ip_sel_net_month|1] / 30 天"
 RUS_ip_arrival_blocked:0 "§R调拨线路中断§!"
 RUS_ip_arrival_pending:0 "最近到货约 [?RUS_ip_sel_arrival|1] 天"
 RUS_ip_arrival_none:0 "暂无入境批次"
 RUS_ip_arrival_waiting:0 "入境批次等待接收"
 RUS_ip_route_district:0 "畅通时单程约 [?RUS_ip_sel_route_days|1] 天，拥堵会延长"
 RUS_ip_route_hub:0 "总仓汇总全国批次；选择来源经济区可查看具体路线"
 RUS_ip_funds_tt:0 "§Y计划资金§!\n独立建设账户，初始 1000；不与原有经济盈余互换。开工一次扣款，发展度越低费用越高。每 30 天结算经营收支并拨款 100；当合计低于 25 时补足至 25。\n\n[GetRUSIPBudgetForecast]"
 RUS_ip_warehouse_tt:0 "§Y地区仓库§!\n钢、煤分别存放，各有容量上限。原生资源每占用 1 点，生产日入库 0.25 单位；全国至多使用可调配资源的一半。施工和经营每日消耗仓库，出库与在途物资不能再次使用。库存不足会减速或等待。"
 RUS_ip_transit_tt:0 "§Y自动调拨§!\n地区保留 21 天需求量后向莫斯科运送余料，总仓向缺料地区补至 14 天需求量。每个方向、每种物资最多一批；沿固定规划路线逐日运输，拥堵减速、断路停运。途中物资不计入可用库存。"
 RUS_ip_balance_tt:0 "§Y地区收支§!\n民工经营收入受发展度、仓储供料、用工与电力影响；矿业按实际入库量贡献收入。军工、公共设施、电网、铁路和基本公共服务产生维持费用。这里只核算本计划的贡献，不改变原生工厂产出。"
 RUS_ip_supply_card_funds:0 "统一计划资金\n§Y[?RUS_ip_funds|1]§!"
 RUS_ip_supply_card_warehouse:0 "本区库存  钢 / 煤\n§Y[?RUS_ip_sel_stock_steel|1] / [?RUS_ip_sel_stock_coal|1]§!"
 RUS_ip_supply_card_transit:0 "运抵本区  钢 / 煤\n§Y[?RUS_ip_sel_view_in_steel|1] / [?RUS_ip_sel_view_in_coal|1]§!"
 RUS_ip_supply_card_balance:0 "本区净收支 / 30 天\n§Y[?RUS_ip_sel_net_month|1]§!"
 RUS_ip_budget_ledger_projection:0 "距下次结算：[?RUS_ip_budget_next|0] 天；预计资金变动 [?RUS_ip_next_settlement|+1]\n预计结算后余额：[?RUS_ip_next_balance|1]\n本期已累计经营净额：[?RUS_ip_budget_net|+1]\n当前方案 / 30 天：经营 [?RUS_ip_projected_operating|+1]；合计 [?RUS_ip_projected_settlement|+1]\n合计包括固定拨款 100、预计应急补助 [?RUS_ip_projected_support|1]"
 RUS_ip_budget_ledger:0 "§Y全国计划账本§!\n[GetRUSIPLedgerForecast]\n上期实际入账：[?RUS_ip_last_budget|1]，其中应急补助 [?RUS_ip_last_support|1]\n累计开工扣款：[?RUS_ip_funds_spent|1]；取消与期满退款：[?RUS_ip_funds_refunded|1]\n全国库存：钢 [?RUS_ip_total_stock_steel|1] / 煤 [?RUS_ip_total_stock_coal|1]\n全国在途：钢 [?RUS_ip_total_transit_steel|1] / 煤 [?RUS_ip_total_transit_coal|1]"
 RUS_ip_supply_local:0 "§Y所选经济区§!\n统计 [?RUS_ip_sel_members|0] 个本国控制的州，人口 [?RUS_ip_sel_pop_k|0] 千\n每种物资仓容 [?RUS_ip_sel_warehouse_cap|1]；库存可用约 [?RUS_ip_sel_cover|1] 天\n工业日需求：钢 [?RUS_ip_sel_base_steel|2] / 煤 [?RUS_ip_sel_base_coal|2]\n施工日需求：钢 [?RUS_ip_sel_project_steel|2] / 煤 [?RUS_ip_sel_project_coal|2]\n民工经营收入 [?RUS_ip_sel_income_month|1] / 30 天\n矿业收入折算 [?RUS_ip_sel_mining_month|1] / 30 天（按当日入库）\n维持支出 [?RUS_ip_sel_upkeep_month|1] / 30 天\n本工程已付款 [?RUS_ip_sel_paid|1]；现在取消可退 [?RUS_ip_sel_refund|1]"
 RUS_ip_supply_route:0 "§Y调拨与线路§!\n[GetRUSIPArrival]\n[GetRUSIPRouteDetail]\n从本区发出：钢 [?RUS_ip_sel_view_out_steel|1] / 煤 [?RUS_ip_sel_view_out_coal|1]\n本区在途货物占用运力 [?RUS_ip_sel_delivery_load|1]\n全部负荷 [?RUS_ip_sel_freight_used|1] / 容量 [?RUS_ip_sel_freight|1]\n目的地失守会损失对应库存与入境批次；中途断路只暂停运输。"
 RUS_ip_supply_policy:0 "§Y调度政策§!\n[GetRUSIPPolicy]；[GetRUSIPPriority]\n和平时先保障本区工业，再供应施工。开战后自动优先供应在建工程，资金、运输和 1800 天期限照常结算。\n可指定一个经济区优先调拨；其余按地区顺序自动安排。工厂不足时也优先保留该区施工。"
 RUS_ip_priority:0 "优先供给本区"
 RUS_ip_priority_selected:0 "§G本区优先供给§!"
 RUS_ip_priority_other:0 "本区采用常规调度"
 RUS_ip_priority_tt:0 "再次点击可取消本区优先级。优先保障民工分配与总仓发车顺序，不立即到货、不产生免费物资，也不撤回已发出的货物。"
 RUS_ip_supply_note:0 "物资单位为本计划仓储单位。现有工厂照常参加原生生产；本页经营收支只计入计划资金。"
 RUS_ip_metric_development:0 "发展度\n§Y[?RUS_ip_sel_development|1] / 100§!"
 RUS_ip_metric_development_tt:0 "§Y发展度§!\n由经济区初始人口、加权基础设施和每州工厂密度决定，后续由工程积累。发展度提高施工速度与培训效果、降低开工费并提高经营收入；钢铁厂要求 20，机械军工厂要求 35。同类重复建设收益递减。"
 RUS_ip_metric_workers:0 "工业劳动力 · 供给／需求\n§Y[?RUS_ip_sel_workers|1] / [?RUS_ip_sel_workers_need|1]§!"
 RUS_ip_metric_workers_tt:0 "§Y工业劳动力 · 供给／需求§!\n工业劳动力容量点数，不扣征兵人力。现有民工、军工、矿业与施工共同占用；短缺会拖慢工程。建设公共设施、安排培训或提高发展度可缓解。公共设施 [?RUS_ip_sel_urban|0]/3，培训 [?RUS_ip_sel_training|0]/3。"
 RUS_ip_metric_power:0 "地区电力 · 可用／需求\n§Y[?RUS_ip_sel_power|1] / [?RUS_ip_sel_power_need|1]§!"
 RUS_ip_metric_power_tt:0 "§Y地区电力 · 可用／需求§!\n用于本建设计划的地区供电能力，不改写全国原生电力市场。基础设施、煤炭条件与电网提供能力；工厂和施工增加需求。当前调入 [?RUS_ip_sel_power_import|1]、调出 [?RUS_ip_sel_power_export|1]。调拨只走陆上相邻可用联系，每点电力消耗两端各 0.5 运力；不能转手重复输出，也不跨海输电。"
 RUS_ip_metric_freight:0 "运输负荷 · 使用／容量\n§Y[?RUS_ip_sel_freight_used|1] / [?RUS_ip_sel_freight|1]§!"
 RUS_ip_metric_freight_tt:0 "§Y运输负荷 · 使用／容量§!\n基础设施、铁路与公共设施增加容量；未接通莫斯科时容量为 60%。工厂、矿业、施工、在途物资和调电占用运力。货物沿途各区都计入负荷；拥堵时到货延迟，最低按正常速度的 5% 运输。新发车保留 10% 容量的应急通道，避免配套工程永远缺料。"
 RUS_ip_bottleneck_0:0 "§G配套充足§!"
 RUS_ip_bottleneck_1:0 "§R用工不足：安排培训或公共设施§!"
