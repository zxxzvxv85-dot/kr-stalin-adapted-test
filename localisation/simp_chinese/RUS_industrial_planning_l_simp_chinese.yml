 RUS_ip_build_9_cost_tt:0 "\n§Y开工与施工：§!\n计划资金：§R-[?RUS_ip_forecast_9_cost|1]§!\n$MODIFIER_CIVILIAN_FACTORY_USE$：§R+3§!\n每日钢消耗：§R-0.30§!\n每日煤消耗：§R-0.20§!\n工业劳动力需求：§R+3§!\n地区电力需求：§R+2§!\n基础运输负荷：§R+1§!\n在途货物另占运力；缺料按供给比例施工，无料等待。\n中心州须为普通地区类型，且尚未达到“$twelve$”。\n已用满建筑槽位仍可扩建；不适用于特殊港口、海岛和荒地。\n同类工程的发展度收益递减。\n供料充足时约 §Y[?RUS_ip_forecast_9_days|0]§! 天；瓶颈：[GetRUSIPForecast9]。\n估计不含待料与排队。"
