 RUS_ip_start_tt:0 "开始本期 1800 天建设计划，仅能启动一次。每完成一项煤矿或铁矿工程，恢复 2 个百分点的战略资源获取效率，累计 15 项后清除下述惩罚；建设期结束时清除剩余惩罚。"
 RUS_ip_refresh_tt:0 "重新核对领土、铁路与施工状态，不推进时间。全国可用建设物资每日更新。"
 RUS_ip_pause_tt:0 "暂停或恢复选中工程；暂停释放民工、停止施工耗料并保留进度。地区工业与仓库仍照常经营。"
 RUS_ip_cancel_tt:0 "确认取消后清空施工进度并释放民工，退还未完工部分所对应开工费的 75%。当前可退 [?RUS_ip_sel_refund|1] 资金；已消耗物资不退。"
 RUS_ip_help_title:0 "工业建设 · 玩法介绍"
 RUS_ip_help_0:0 "§Y一、启动与选址§!\n先执行“启用工业建设界面（测试）”决议，再在窗口点击“启动建设计划”，开始独立的 1800 天建设期。圆点代表经济区，工程落在所示中心州；每区同时一项，可跨区并行。关闭窗口后工程继续。"
 RUS_ip_help_1:0 "§Y二、真实建设与资源链§!\n启动时战略资源获取效率 −30%，每竣工一项煤矿或铁矿恢复 2 个百分点，15 项清除。煤矿产煤、铁矿产钢；电网降低工厂能耗，钢铁厂增加民工与钢，机械军工厂增加军工。具体收益见按钮原生提示。"
 RUS_ip_help_2:0 "§Y三、资金与仓储§!\n初始资金 §Y1000§!，开工扣费，施工占用民工并每日耗煤钢。每 30 天按实际收支结算，无固定拨款、无保底。余额可为负：每欠 §R100§!，稳定度 §R−5%§!、建造速度 §R−10%§!，最多 §R−50%§!／§R−75%§!，还款后减轻。负债时不能开新工程，现有工程继续。"
 RUS_ip_help_3:0 "§Y四、经济区与扩建§!\n统计全经济区本国拥有且控制的州，建筑落在中心州。发展度 §Y0—100§!；钢铁厂要求 §Y20§!，机械厂 §Y35§!。公共设施与培训改善劳动力。地区扩建消耗资金、民工与物资，竣工提升中心州类型一级，基础建筑槽位 §G+1§!，最高为“$twelve$”。"
 RUS_ip_help_4:0 "§Y五、自动物流与规划§!\n本地先供料；超过 21 天储备的余料发往莫斯科，总仓向缺料区补至 14 天。在途货物沿固定规划路线运输，拥堵延迟、断路暂停。可指定一个优先地区。电网与相邻余电支援仍保留，调电占运力；重工业必须接通莫斯科。仓库无料时，配套工程也会等待。"
 RUS_ip_help_5:0 "§Y六、战时与期满§!\n和平先供本区工业，开战后优先供给在建工程。计时与账本照常运行；取消或期满退回剩余开工费的 §Y75%§!。期满清除施工占用、开采与本期负债惩罚，保留完工资产并封存账本。在“仓储与预算”查看明细。本原型尚未接管旧一五计划。"
