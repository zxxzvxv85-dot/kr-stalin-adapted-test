 RUS_ip_budget_tt:0 "§Y建设投资§!\n初始：§Y40§!\n每交付 §Y1§! 单位机械，建设投资：§G+1.00§!\n拆除退还该设施或线路的实付投资。\n投资只用于本沙盘；没有固定拨款。"
 RUS_ip_stock_tt:0 "§Y厂区库存§!\n所有已接通设施共用原料。每日自动采矿、发电、炼钢、制造机械。\n缺料或缺电时按可用数量生产，不产生负库存。"
 RUS_ip_power_tt:0 "§Y电力§!\n电力当日生产、当日使用，不入库。先供炼钢，再供机械制造。\n满产需求按已接通且开机的设施计算；缺煤时电站也会减产。"
