 RUS_ip_budget_projection_tt:0 "§Y按当前方案预估§!\n30 天资金变动：[?RUS_ip_projected_settlement|=+1]\n本期累计经营净额：[?RUS_ip_budget_net|=+1]\n距结算：[?RUS_ip_budget_next|0] 天\n预计资金变动：[?RUS_ip_next_settlement|=+1]\n预计结算后余额：[?RUS_ip_next_balance|+1]\n\n每日及操作后刷新；不含未来开工、取消退款、竣工、供料与战局变化。最近一次结算包含本期已发生收支。"
