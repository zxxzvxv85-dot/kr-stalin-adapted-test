 RUS_ip_title:0 "国家计划委员会 · 工业规划沙盘"
 RUS_ip_open_tt:0 "§Y工业规划沙盘§!\n布置局部厂区、连接运输线，组织煤铁、电力、钢材与机械的连续生产。"
 RUS_ip_test_category:0 "工业规划测试"
 RUS_ip_test_category_desc:0 "在新的工业基地上，勘探、运输与制造必须形成一个完整的生产体系。"
 RUS_ip_enable_gui:0 "启用工业规划沙盘（测试）"
 RUS_ip_enable_gui_desc:0 "先在沙盘上检验我们的工业布局，再让未来的工业基地沿着规划发展。"
 RUS_ip_enable_gui_tt:0 "解锁独立入口并打开工业规划沙盘。布置完成后点击“开始生产”，启动 §Y1800§! 天连续生产。"
