 RUS_ip_budget_projection_tt:0 "§Y按当前方案预估§!\n30 天经营净额：[?RUS_ip_projected_operating|+1]\n固定拨款：§G+100.0§!\n预计应急补助：[?RUS_ip_projected_support|+1]\n30 天合计资金变动：[?RUS_ip_projected_settlement|+1]\n\n§Y最近一次结算§!\n本期已累计经营净额：[?RUS_ip_budget_net|+1]\n距结算还有 [?RUS_ip_budget_next|0] 天，按当前经营状态延续计算：\n预计资金变动：[?RUS_ip_next_settlement|+1]，其中补助 [?RUS_ip_next_support|+1]\n预计结算后余额：§Y[?RUS_ip_next_balance|1]§!\n\n每日及操作后刷新；不含未来开工、取消退款、竣工、供料与战局变化。30 天数值是当前方案的经营折算，最近一次结算另计本期已经发生的收支。"
 RUS_ip_budget_projection_pending:0 "启动建设计划后显示资金预估。"
 RUS_ip_budget_projection_frozen:0 "建设期已结束，账本封存，不再结算。"
 RUS_ip_supply:0 "仓储与预算"
