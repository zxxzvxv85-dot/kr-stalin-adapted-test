 RUS_ip_confirm_restart:0 "确认重置"
 RUS_ip_cost_rail:0 "投资 §R-1§! · 每级"
 RUS_ip_rail_tt:0 "§Y厂内运输线§!\n\n线路等级：§G+1§!\n建设投资：§R-1§!\n\n与上下左右的线路相连，须连通 §Y本区调度站§!。\n线路和设施可在同一格，最高 §Y3§! 级。有效产能取设施等级与最佳路线最薄弱等级中的较低值。\n这是沙盘内运输线。"
 RUS_ip_remove_tt:0 "§Y拆除设施§!\n返还该设施实际支付的全部建设投资。\n保留运输线、库存和累计交付。调度站不能拆除。"
 RUS_ip_remove_rail_tt:0 "§Y拆除线路§!\n返还该线路实际支付的全部建设投资。\n保留设施；依赖此线路的设施可能断线。调度站不能拆除。"
 RUS_ip_switch_tt:0 "§Y停机／开机§!\n停机后该设施不生产、不消耗原料或电力；该格运输线仍然可用。"
 RUS_ip_refresh_tt:0 "重新计算接通状态、产能和下一日产量。不会推进日期或结算生产。"
 RUS_ip_start_tt:0 "开始 §Y1800§! 天连续生产。设施按游戏日期自动运行，关闭窗口后也继续。\n目标：累计交付 §Y500§! 单位机械。期满停止生产并保留结果。"
 RUS_ip_restart_tt:0 "§Y重新规划§!\n再次确认后清空六区设施、线路、库存、交付与计时，恢复初始投资，并重新随机生成全部六张地图的矿点和岩壁。\n本沙盘独立计分，不发放真实工厂，不影响旧一五计划。"
 RUS_ip_footnote:0 "独立测试沙盘 · 机械为交付分数 · 生产随游戏日期推进"
 RUS_ip_help_title:0 "工业规划沙盘 · 玩法介绍"
 RUS_ip_help_0:0 "§Y一、先布置，再开工§!\n点击测试决议打开沙盘。六区共享投资 §Y40§!，每区煤 §Y6§!、铁 §Y4§!、钢 §Y2§!。先选地区布置厂区，再点击“开始生产”：在 §Y1800§! 天内交付 §Y500§! 单位机械。时间随游戏日期推进，关闭窗口不会暂停。"
 RUS_ip_help_1:0 "§Y二、六区禀赋与随机矿点§!\n三大城、西西伯利亚、中西伯利亚与远东，轮廓参考 KR。每区矿点数量不同，新计划随机位置，切图和读档不重抽。城市贫矿区保留少量起步矿点。\n矿山须建在对应矿点；其他设施用普通地块。一级绿、二级蓝、三级金；深灰岩壁不可建。详情和线路等级见悬浮提示。"
 RUS_ip_help_2:0 "§Y三、运输线决定布局§!\n在设施所在格及途经格铺设运输线，逐格接到 §Y本区调度站§!。只连上下左右。\n设施和线路最高 §Y3§! 级。三级设施经过一级线路，最多按一级生产；可以升级薄弱路段，也可以另建较好的路线。"
 RUS_ip_help_3:0 "§Y四、找出真正的瓶颈§!\n每级钢铁厂满产需煤 §R-0.20§!、铁 §R-0.20§!、电 §R+0.40§!，产钢 §G+0.20§!／日。每级机械厂需钢 §R-0.40§!、电 §R+0.20§!，交付机械 §G+0.20§!／日。\n先保证煤、电、钢足够，再扩机械厂。各区分别计算煤铁、电力和钢材，不跨区调拨；六区同时生产，交付合并计分。"
 RUS_ip_help_4:0 "§Y五、扩产与重新布置§!\n每交付 §Y1§! 单位机械，投资回流 §G+1.00§!；积累后扩矿、扩产或升级线路。没有固定拨款。\n拆除退还实际投资，便于调整布局。停机可以节省原料和电力，线路仍然通行。采矿、发电、炼钢、机械按此顺序每日结算。"
 RUS_ip_help_5:0 "§Y六、预估与期满§!\n产量速览显示下一日产量乘以 §Y30§!，不保证原料足够维持整月。库存耗尽后产量会改变；查看瓶颈与库存变化再调整。\n期满停止生产，保留交付量与完成度。重置须再次确认，将重抽六区矿点与岩壁。这是独立玩法测试，未接管旧一五计划，也不发放真实工厂。"
