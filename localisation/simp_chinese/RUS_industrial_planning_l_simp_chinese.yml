 RUS_ip_build_4_tt:0 "§Y钢铁厂§!\n\n设施等级：§G+1§!\n建设投资：§R-6§!\n\n§Y每级满产效果：§!\n每日煤炭消耗：§R-0.20§!\n每日铁矿消耗：§R-0.20§!\n每日电力需求：§R+0.40§!\n每日钢材产出：§G+0.20§!\n\n须位于普通工业用地，最多 §Y3§! 级；不能覆盖其他设施。\n接通调度站后自动运行，沿途最低线路等级限制产能；缺料、缺电按比例减产。"
