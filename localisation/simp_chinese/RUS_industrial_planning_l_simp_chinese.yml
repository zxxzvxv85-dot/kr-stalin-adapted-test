l_simp_chinese:
 RUS_ip_title:0 "国家计划委员会 · 工业蓝图"
 RUS_ip_subtitle:0 "俄罗斯工业布局沙盘  /  五轮规划与生产考核"
 RUS_ip_open_tt:0 "§Y工业规划沙盘§!\n在俄罗斯地图上建设工业与铁路，完成五轮生产目标。独立演算，可随时关闭并继续。"
 RUS_ip_summary:0 "第 §Y[?RUS_ip_round|0]§! / 5 轮   |   投资 §Y[?RUS_ip_budget|0]§!   |   累计机械 §G[?RUS_ip_machines|0]§!   |   考核 §Y[?RUS_ip_score|0]§! 分"
 RUS_ip_stocks:0 "库存    煤 [?RUS_ip_coal|0]    铁 [?RUS_ip_iron|0]    钢 [?RUS_ip_steel|0]\n本轮预计    钢 +[?RUS_ip_steel_output|0]    机械 +[?RUS_ip_machine_output|0]"
 RUS_ip_network:0 "接通地块 [?RUS_ip_connected_count|0] / 36    |    供电 [?RUS_ip_power_total|0] / 需求 [?RUS_ip_power_demand|0]    |    加工运力 [?RUS_ip_transport_total|0]"
 RUS_ip_target:0 "本轮目标：累计交付 §Y[?RUS_ip_target|0]§! 单位机械。预计结算后达到 §Y[?RUS_ip_next_machines|0]§!。\n达到目标获得 20 分；每轮后追加 18 投资，共五轮。"
 RUS_ip_instructions:0 "点击地区编号 → 建设或升级 → 检查预测 → 结算本轮\n相邻地区的铁路接通莫斯科后投产；蓝色虚线为两处海运接驳。编号位置有引线对应地区。"
 RUS_ip_sandbox_note:0 "本沙盘独立计分与投资，可重开练习；暂不改变国家工厂或一五计划正式奖励。"
 RUS_ip_legend:0 "煤：煤矿   铁：铁矿   电：电站   钢：钢铁厂   机：机械厂   ★：莫斯科枢纽"
 RUS_ip_selected:0 "[GetRUSIPDistrict]"
 RUS_ip_detail:0 "设施：[GetRUSIPSelectedType]  §Y[?RUS_ip_sel_level|0]§! 级\n铁路：§Y[?RUS_ip_sel_rail|0]§! 级    [GetRUSIPSelectedStatus]\n煤矿潜力：[GetRUSIPCoalPotential]\n铁矿潜力：[GetRUSIPIronPotential]\n\n经营资格以地区中心的控制权为准。\n设施与铁路分别建设，最高三级。"
 RUS_ip_status_0:0 "§g无铁路§!"
 RUS_ip_status_1:0 "§R不在控制下§!"
 RUS_ip_status_2:0 "§R尚未连通§!"
 RUS_ip_status_3:0 "§G已接通枢纽§!"
 RUS_ip_yes:0 "§G有§!"
 RUS_ip_no:0 "§g无§!"
 RUS_ip_type_0:0 "空地"
 RUS_ip_short_0:0 "·"
 RUS_ip_type_1:0 "煤矿"
 RUS_ip_short_1:0 "煤"
 RUS_ip_type_2:0 "铁矿"
 RUS_ip_short_2:0 "铁"
 RUS_ip_type_3:0 "电站"
 RUS_ip_short_3:0 "电"
 RUS_ip_type_4:0 "钢铁厂"
 RUS_ip_short_4:0 "钢"
 RUS_ip_type_5:0 "机械厂"
 RUS_ip_short_5:0 "机"
 RUS_ip_build_1:0 "煤矿  2"
 RUS_ip_build_1_tt:0 "§Y建设或升级煤矿§!\n消耗 2 投资。每级每轮生产 3 煤。需要煤矿潜力。\n须为空地或同类设施，且由俄罗斯拥有并控制。设施与铁路均最高三级。"
 RUS_ip_build_2:0 "铁矿  2"
 RUS_ip_build_2_tt:0 "§Y建设或升级铁矿§!\n消耗 2 投资。每级每轮生产 3 铁。需要铁矿潜力。\n须为空地或同类设施，且由俄罗斯拥有并控制。设施与铁路均最高三级。"
 RUS_ip_build_3:0 "电站  3"
 RUS_ip_build_3_tt:0 "§Y建设或升级电站§!\n消耗 3 投资。每级每轮消耗 1 煤，提供 6 电力。\n须为空地或同类设施，且由俄罗斯拥有并控制。设施与铁路均最高三级。"
 RUS_ip_build_4:0 "钢铁厂  4"
 RUS_ip_build_4_tt:0 "§Y建设或升级钢铁厂§!\n消耗 4 投资。每级每轮最多生产 2 钢。每单位消耗 1 煤、1 铁、2 电力、1 运力。\n须为空地或同类设施，且由俄罗斯拥有并控制。设施与铁路均最高三级。"
 RUS_ip_build_5:0 "机械厂  5"
 RUS_ip_build_5_tt:0 "§Y建设或升级机械厂§!\n消耗 5 投资。每级每轮最多生产 2 机械。每单位消耗 2 钢、1 电力、1 运力。\n须为空地或同类设施，且由俄罗斯拥有并控制。设施与铁路均最高三级。"
 RUS_ip_rail:0 "铁路  2"
 RUS_ip_rail_tt:0 "§Y建设或升级铁路§!\n消耗 2 投资。相邻有铁路的地块自动连通；连接莫斯科后，每级增加 2 加工运力。"
 RUS_ip_remove:0 "拆除设施"
 RUS_ip_remove_rail:0 "拆除铁路"
 RUS_ip_remove_tt:0 "移除选中设施，返还本局在该设施上实际支付的投资。起始设施不产生退款。"
 RUS_ip_remove_rail_tt:0 "移除选中地块的铁路，返还实际支付的投资。下游设施可能失去连接。"
 RUS_ip_settle:0 "结算本轮"
 RUS_ip_settle_tt:0 "重新核对领土与铁路连接，按预测生产并消耗原料。\n本轮只结算一次；五轮结束后显示总成绩。"
 RUS_ip_refresh:0 "刷新预测"
 RUS_ip_refresh_tt:0 "重新核对领土、铁路和产量预测，不推进轮次、不结算生产。"
 RUS_ip_restart:0 "重新规划"
 RUS_ip_restart_confirm:0 "确认重新规划"
 RUS_ip_restart_tt:0 "重新开始五轮演算。第一次点击显示确认按钮；再次确认后，清空本沙盘的布局、库存与成绩。"
 RUS_ip_finished:0 "§Y五轮规划结束§!   累计机械：[?RUS_ip_machines|0]   考核：[?RUS_ip_score|0] / 100 分\n可继续查看地图，或点击“重新规划”再进行一局。"
 RUS_ip_bottlenecks:0 "瓶颈：[GetRUSIPBottleneck]\n采矿 → 发电 → 炼钢 → 机械\n电力当轮使用，原料与成品留存。"
 RUS_ip_bottleneck_power:0 "§R电力不足§!"
