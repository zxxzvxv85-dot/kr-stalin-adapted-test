 RUS_ip_forecast_tt:0 "§Y产量速览§!\n当前下一日产量乘以 30，并非库存净变化或保证交付。库存耗尽、停机或改建会改变后续产量。\n可用电力、库存和接通能力每天及每次操作后重新计算。"
