 RUS_ip_type_1:0 "煤矿"
 RUS_ip_build_1:0 "煤矿"
 RUS_ip_build_1_tt:0 "§Y煤矿§!\n施工期间占用 2 座民工、2 钢、0 煤。\n基础工作量 120；所需当地运力 1。\n须有煤矿潜力，最多扩建三次。\n工程完成时获得："
 RUS_ip_type_2:0 "铁矿"
 RUS_ip_build_2:0 "铁矿"
 RUS_ip_build_2_tt:0 "§Y铁矿§!\n施工期间占用 2 座民工、2 钢、1 煤。\n基础工作量 120；所需当地运力 1。\n须有铁矿潜力，最多扩建三次。\n工程完成时获得："
 RUS_ip_type_3:0 "强化电网"
 RUS_ip_build_3:0 "强化电网"
 RUS_ip_build_3_tt:0 "§Y强化电网§!\n施工期间占用 3 座民工、4 钢、2 煤。\n基础工作量 180；所需当地运力 1。\n须有强化电网建设空间。\n工程完成时获得："
 RUS_ip_type_4:0 "钢铁厂"
 RUS_ip_build_4:0 "钢铁厂"
 RUS_ip_build_4_tt:0 "§Y钢铁厂§!\n施工期间占用 4 座民工、4 钢、4 煤。\n基础工作量 240；所需当地运力 2。\n须有民工槽位并接通莫斯科；缺电会减速。\n工程完成时获得："
 RUS_ip_type_5:0 "机械军工厂"
 RUS_ip_build_5:0 "机械军工厂"
 RUS_ip_build_5_tt:0 "§Y机械军工厂§!\n施工期间占用 5 座民工、6 钢、2 煤。\n基础工作量 300；所需当地运力 3。\n须有军工槽位并接通莫斯科；缺电会减速。\n工程完成时获得："
 RUS_ip_type_6:0 "交通建设"
 RUS_ip_build_6:0 "交通建设"
 RUS_ip_build_6_tt:0 "§Y交通建设§!\n施工期间占用 2 座民工、2 钢、1 煤。\n基础工作量 120；所需当地运力 1。\n须有基础设施空间；内陆地区需相邻已接通地区作为铁路起点。\n工程完成时获得："
 RUS_ip_start:0 "启动建设计划"
 RUS_ip_refresh:0 "刷新状态"
 RUS_ip_help:0 "玩法介绍"
 RUS_ip_back:0 "返回地图"
 RUS_ip_pause:0 "暂停／继续"
 RUS_ip_cancel:0 "取消工程"
 RUS_ip_confirm_cancel:0 "确认取消"
 RUS_ip_start_tt:0 "开始本期 1800 天建设计划，仅能启动一次。每完成一项煤矿或铁矿工程，恢复 2 个百分点的战略资源获取效率，累计 15 项后清除下述惩罚；建设期结束时清除剩余惩罚。"
 RUS_ip_refresh_tt:0 "重新核对领土、铁路与施工状态，不推进时间。全国可用建设物资每日更新。"
 RUS_ip_pause_tt:0 "暂停或恢复选中工程；暂停时释放占用的工厂和物资，保留进度。"
 RUS_ip_cancel_tt:0 "再次确认后取消选中工程，清空施工进度并释放占用。已建成设施不受影响。"
 RUS_ip_help_title:0 "工业建设 · 玩法介绍"
 RUS_ip_help_0:0 "§Y一、启动与选址§!\n先执行“启用工业建设界面（测试）”决议，再在窗口点击“启动建设计划”，开始独立的 1800 天建设期。圆点代表经济区，工程落在所示中心州；每区同时一项，可跨区并行。关闭窗口后工程继续。"
 RUS_ip_help_1:0 "§Y二、真实建设与资源链§!\n启动时战略资源获取效率 −30%，每竣工一项煤矿或铁矿恢复 2 个百分点，15 项清除。煤矿产煤、铁矿产钢；电网降低工厂能耗，钢铁厂增加民工与钢，机械军工厂增加军工。具体收益见按钮原生提示。"
 RUS_ip_help_2:0 "§Y三、持续占用§!\n施工持续占用真实民工与煤钢资源。缺少领土、槽位、物资或铁路条件时工程暂停。暂停、取消、完工均释放占用。国家可用物资每日核对；短缺时按地区编号依次保障施工。可手动暂停工程来调整优先级。"
 RUS_ip_help_3:0 "§Y四、工期与瓶颈§!\n每日基础进度 = 1 + 基础设施 × 0.12 + 民工数量（最多 20）× 0.025 + 相关资源（最多 40）× 0.005，再乘运力与供电系数。煤矿、电网参考煤，其余参考钢。全国缺电使钢铁与机械工程减速，最低保留 25% 速度。"
 RUS_ip_help_4:0 "§Y五、铁路与运输§!\n读取实际铁路是否接通莫斯科。当地运力 = 1 + 基础设施 + 铁路等级，未接通时仅为四分之一；运力不足进一步拖慢工程。钢铁与机械工程必须接通。交通建设增加基础设施并从相邻已接通的国内地区铺设一级铁路。两处海运接驳需要两端港口和至少 10 艘运输船。"
 RUS_ip_help_5:0 "§Y六、竣工与期限§!\n每天自动推进一次，完工后增加真实建筑或资源；每区两类矿业各可扩建三次。建设期结束时停止未完成工程、释放占用并清除剩余开采惩罚，保留竣工成果。本窗口独立运行，暂不改变旧一五计划任务、分数与结算奖励。"
