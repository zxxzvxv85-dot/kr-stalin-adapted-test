 RUS_ip_plan_debt:0 "计划建设负债"
 RUS_ip_plan_debt_desc:0 "工程账款积欠，公共开支难以维系。承建单位失去信心，生产与建设秩序也随之受到冲击。"
 RUS_ip_debt_active:0 "§R负债§!：§Y[?RUS_ip_debt|1]§!"
 RUS_ip_debt_clear:0 "无负债"
 RUS_ip_funds_hover:0 "[!ip_funds_icon_click]"
 RUS_ip_funds_tt:0 "§Y计划资金§!\n初始资金：§Y1000§!；独立账户，不与经济盈余兑换。\n每 30 天按实际收支结算，无固定拨款、无保底。\n开工一次扣款；资金不足时不能新开工。\n\n[GetRUSIPBudgetForecast]\n\n[GetRUSIPDebtStatus]\n建设期内每欠 §R100§!，稳定度 §R−5%§!、建造速度 §R−10%§!；分别封顶 §R−50%§!、§R−75%§!。\n按实际欠款连续计算，还款后减轻；原生与本界面建设均受影响。本期结束时清除惩罚。"
 RUS_ip_warehouse_tt:0 "§Y地区仓库§!\n钢、煤分别存放，各有容量上限。原生资源每占用 1 点，生产日入库 0.25 单位；全国至多使用可调配资源的一半。施工和经营每日消耗仓库，出库与在途物资不能再次使用。库存不足会减速或等待。"
 RUS_ip_transit_tt:0 "§Y自动调拨§!\n地区保留 21 天需求量后向莫斯科运送余料，总仓向缺料地区补至 14 天需求量。每个方向、每种物资最多一批；沿固定规划路线逐日运输，拥堵减速、断路停运。途中物资不计入可用库存。"
 RUS_ip_balance_tt:0 "§Y地区收支§!\n民工经营收入受发展度、仓储供料、用工与电力影响；矿业按实际入库量贡献收入。军工、公共设施、电网、铁路和基本公共服务产生维持费用。这里只核算本计划的贡献，不改变原生工厂产出。"
