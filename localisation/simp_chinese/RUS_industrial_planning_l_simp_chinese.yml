 RUS_ip_supply_card_warehouse:0 "本区库存  钢 / 煤\n§Y[?RUS_ip_sel_stock_steel|1]§! / §Y[?RUS_ip_sel_stock_coal|1]§!"
 RUS_ip_supply_card_transit:0 "运抵本区  钢 / 煤\n§Y[?RUS_ip_sel_view_in_steel|1]§! / §Y[?RUS_ip_sel_view_in_coal|1]§!"
 RUS_ip_supply_card_balance:0 "本区净收支 / 30 天\n[?RUS_ip_sel_net_month|=+1]"
 RUS_ip_budget_ledger_projection:0 "距下次结算：[?RUS_ip_budget_next|0] 天\n预计资金变动：[?RUS_ip_next_settlement|=+1]　结算后余额：[?RUS_ip_next_balance|+1]\n本期累计经营净额：[?RUS_ip_budget_net|=+1]\n每 30 天资金变动：[?RUS_ip_projected_settlement|=+1]"
 RUS_ip_budget_ledger:0 "§Y全国计划账本§!\n[GetRUSIPLedgerForecast]\n上期实际结算：[?RUS_ip_last_budget|=+1]\n累计开工支出：§R-[?RUS_ip_funds_spent|1]§!　累计退款：[?RUS_ip_funds_refunded|=+1]\n全国钢库存：§Y[?RUS_ip_total_stock_steel|1]§!　煤库存：§Y[?RUS_ip_total_stock_coal|1]§!\n全国在途钢：§Y[?RUS_ip_total_transit_steel|1]§!　在途煤：§Y[?RUS_ip_total_transit_coal|1]§!\n[GetRUSIPDebtStatus]；悬浮顶部资金查看影响。"
 RUS_ip_supply_local:0 "§Y所选经济区§!\n控制州数：§Y[?RUS_ip_sel_members|0]§!　人口：§Y[?RUS_ip_sel_pop_k|0]§! 千\n单种物资仓容：§Y[?RUS_ip_sel_warehouse_cap|1]§!　库存可用约 [?RUS_ip_sel_cover|1] 天\n工业每日需求：钢 §R[?RUS_ip_sel_base_steel|2]§! / 煤 §R[?RUS_ip_sel_base_coal|2]§!\n施工每日需求：钢 §R[?RUS_ip_sel_project_steel|2]§! / 煤 §R[?RUS_ip_sel_project_coal|2]§!\n民工经营收入：[?RUS_ip_sel_income_month|=+1] / 30 天\n矿业收入折算：[?RUS_ip_sel_mining_month|=+1] / 30 天（按当日入库）\n维持支出：§R-[?RUS_ip_sel_upkeep_month|1]§! / 30 天\n本工程开工支出：§R-[?RUS_ip_sel_paid|1]§!\n取消可退款：[?RUS_ip_sel_refund|=+1]"
 RUS_ip_supply_route:0 "§Y调拨与线路§!\n往返路线：[GetRUSIPRoutePath]\n[GetRUSIPRouteDiagnosis]\n[GetRUSIPArrival]；[GetRUSIPRouteDetail]\n本区发运钢：§Y[?RUS_ip_sel_view_out_steel|1]§!　煤：§Y[?RUS_ip_sel_view_out_coal|1]§!\n在途货物运输负荷：§Y[?RUS_ip_sel_delivery_load|1]§!\n本区总负荷：§Y[?RUS_ip_sel_freight_used|1]§!　容量：§Y[?RUS_ip_sel_freight|1]§!"
 RUS_ip_route_focus:0 "查看问题地区"
 RUS_ip_route_focus_tt:0 "选中当前路线最拥堵的经济区；若线路中断，则选中首处中断联系的远端地区。显示的是经济区中心州，不是逐省铁路区段。"
 RUS_ip_supply_policy:0 "§Y调度政策§!\n[GetRUSIPPolicy]；[GetRUSIPPriority]\n和平时先保障本区工业，再供应施工。开战后自动优先供应在建工程，资金、运输和 1800 天期限照常结算。\n可指定一个经济区优先调拨；其余按地区顺序自动安排。工厂不足时也优先保留该区施工。"
 RUS_ip_priority:0 "优先供给本区"
 RUS_ip_priority_selected:0 "§G本区优先供给§!"
 RUS_ip_priority_other:0 "本区采用常规调度"
 RUS_ip_priority_tt:0 "再次点击可取消本区优先级。优先保障民工分配与总仓发车顺序，不立即到货、不产生免费物资，也不撤回已发出的货物。"
 RUS_ip_supply_note:0 "物资单位为本计划仓储单位。现有工厂照常参加原生生产；本页经营收支只计入计划资金。"
 RUS_ip_rail_unselected:0 "未选定"
 RUS_ip_rail_choose:0 "选择铁路线路"
 RUS_ip_rail_clear:0 "清除线路"
 RUS_ip_rail_level_button:0 "目标：[?RUS_ip_rail_level|0] 级"
 RUS_ip_rail_queue:0 "加入修建队列"
 RUS_ip_rail_choose_tt:0 "点击后，在地图上依次点击起点经济区和终点经济区。两次选点完成后，悬浮“加入修建队列”查看费用与原生成果。"
 RUS_ip_rail_level_tt:0 "点击切换目标铁路等级：§Y1—5§!。更高等级增加费用与工作量；完工修建至该等级，不降低已有的更高等级铁路。"
 RUS_ip_rail_pick_start:0 "§Y请在地图上点击起点地区。§!"
 RUS_ip_rail_pick_end:0 "§Y请在地图上点击另一地区作为终点。§!"
 RUS_ip_rail_ready:0 "资金：§R-[?RUS_ip_rail_cost|1]§!  |  民工占用：§R+3§!  |  预计 [?RUS_ip_rail_days|0] 天"
 RUS_ip_rail_invalid:0 "§R两端必须由本国拥有并控制，且存在可施工的国内陆路。§!"
 RUS_ip_rail_prompt:0 "点击“选择铁路线路”，再依次点选地图上的两个经济区。"
 RUS_ip_rail_summary:0 "铁路：§Y[GetRUSIPRailFrom]§! → §Y[GetRUSIPRailTo]§!\n[GetRUSIPRailPrompt]"
 RUS_ip_rail_origin_marker:0 "§Y起§!"
 RUS_ip_rail_destination_marker:0 "§G终§!"
 RUS_ip_rail_queue_detail:0 "施工线路：§Y[GetRUSIPQueuedRailFrom]§! → §Y[GetRUSIPQueuedRailTo]§! · [?RUS_ip_sel_rail_level|0] 级"
 RUS_ip_category_special:0 "特殊地区（不可扩建）"
 RUS_ip_category_max:0 "已达最高等级"
 RUS_ip_metric_development:0 "发展度\n§Y[?RUS_ip_sel_development|1] / 100§!"
 RUS_ip_metric_development_tt:0 "§Y发展度§!\n由经济区初始人口、加权基础设施和每州工厂密度决定，后续由工程积累。发展度提高施工速度与培训效果、降低开工费并提高经营收入；钢铁厂要求 20，机械军工厂要求 35。同类重复建设收益递减。"
 RUS_ip_metric_workers:0 "工业劳动力 · 供给／需求\n§Y[?RUS_ip_sel_workers|1] / [?RUS_ip_sel_workers_need|1]§!"
 RUS_ip_metric_workers_tt:0 "§Y工业劳动力 · 供给／需求§!\n工业劳动力容量点数，不扣征兵人力。现有民工、军工、矿业与施工共同占用；短缺会拖慢工程。建设公共设施、安排培训或提高发展度可缓解。公共设施 [?RUS_ip_sel_urban|0]/3，培训 [?RUS_ip_sel_training|0]/3。"
 RUS_ip_metric_power:0 "地区电力 · 可用／需求\n§Y[?RUS_ip_sel_power|1] / [?RUS_ip_sel_power_need|1]§!"
 RUS_ip_metric_power_tt:0 "§Y地区电力 · 可用／需求§!\n用于本建设计划的地区供电能力，不改写全国原生电力市场。基础设施、煤炭条件与电网提供能力；工厂和施工增加需求。当前调入 [?RUS_ip_sel_power_import|1]、调出 [?RUS_ip_sel_power_export|1]。调拨只走陆上相邻可用联系，每点电力消耗两端各 0.5 运力；不能转手重复输出，也不跨海输电。"
 RUS_ip_metric_freight:0 "运输负荷 · 使用／容量\n§Y[?RUS_ip_sel_freight_used|1] / [?RUS_ip_sel_freight|1]§!"
 RUS_ip_metric_freight_tt:0 "§Y运输负荷 · 使用／容量§!\n基础设施、铁路与公共设施增加容量；未接通莫斯科时容量为 60%。工厂、矿业、施工、在途物资和调电占用运力。货物沿途各区都计入负荷；拥堵时到货延迟，最低按正常速度的 5% 运输。新发车保留 10% 容量的应急通道，避免配套工程永远缺料。"
 RUS_ip_bottleneck_0:0 "§G配套充足§!"
 RUS_ip_bottleneck_1:0 "§R用工不足：安排培训或公共设施§!"
 RUS_ip_bottleneck_2:0 "§R供电不足：建设电网或邻区调拨§!"
