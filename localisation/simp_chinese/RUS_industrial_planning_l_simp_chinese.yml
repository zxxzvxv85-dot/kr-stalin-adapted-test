 RUS_ip_build_10_cost_tt:0 "\n§Y开工与施工：§!\n计划资金：§R-[?RUS_ip_rail_cost|1]§!\n$MODIFIER_CIVILIAN_FACTORY_USE$：§R+3§!\n每日钢消耗：§R-0.30§!\n每日煤消耗：§R-0.20§!\n工业劳动力需求：§R+3§!\n地区电力需求：§R+1§!\n基础运输负荷：§R+2§!\n在途货物另占运力；缺料按供给比例施工，无料等待。\n两端须由本国拥有并控制，并存在可施工的国内陆路。\n使用终点地区的工程队列、仓库与配套。开工后两端和目标等级固定。\n费用与工作量随地图距离和目标等级增加；不代表实际逐省长度。\n同类工程的发展度收益递减。\n供料充足时约 §Y[?RUS_ip_rail_days|0]§! 天；瓶颈：[GetRUSIPForecast10]。\n估计不含待料与排队。"
