 RUS_stalin_bryukhanov_sketch_events.1.t: "非正式素描"
 RUS_stalin_bryukhanov_sketch_events.1.d: "今天，一位经济部门的高级官员用黑色墨水画了一幅讽刺财政人民委员尼古拉·布柳哈诺夫被睾丸吊起的漫画。斯大林偶然看到之后，在上面写道：\n\n“致政治局委员：鉴于其现在及未来的一切罪行，布柳哈诺夫应被吊住睾丸；若其睾丸能承受，则应视为法庭已宣告其无罪；若其睾丸不能承受，则应将其淹死在河里。”"
 RUS_stalin_bryukhanov_sketch_events.1.a: "这张素描最好只在政治局里流传。"
