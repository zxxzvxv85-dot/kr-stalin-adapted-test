l_simp_chinese:
 RUS_white_revolt_category: "白军反扑"
 RUS_white_revolt_category_desc: "旧军官集团拒绝承认社会主义临时政府。红军必须在九十天内控制彼得格勒和察里津周边交通线，粉碎白军的反扑。"
 RUS_white_revolt_deadline: "新生政权的九十天"
 RUS_white_revolt_deadline_desc: "如果我们未能在时限内解决彼得格勒和察里津的白军，军方将推翻社会主义临时政府。"
 RUS_white_revolt_status: "红军战区态势"
 RUS_white_revolt_status_desc: "彼得格勒外围：§Y[?RUS_white_revolt_petrograd_progress|0]§!/§Y[?RUS_white_revolt_petrograd_required|0]§!\n察里津外围：§Y[?RUS_white_revolt_tsaritsyn_progress|0]§!/§Y[?RUS_white_revolt_tsaritsyn_required|0]§!\n\n控制全部有效外围地区后，即可发动对应战区的最终行动。当前不由俄罗斯控制的目标州不计入要求。"
 RUS_bolshevik_rifle_support: "布尔什维克的支援"
 RUS_bolshevik_rifle_support_desc: "流亡归来的布尔什维克军事干部愿意组织武器运输，以五千支步枪武装铁路工人、赤卫队和临时征召部队。"
 RUS_bolshevik_rifle_support_tt: "消耗§R5000§!单位步枪，获得§G25§!指挥点。"
 RUS_red_army_advance: "向[FROM.GetName]推进"
 RUS_red_army_advance_desc: "组织赤卫队和忠于革命的部队肃清当地白军据点，确保铁路、桥梁与电报站处于临时政府控制之下。"
 RUS_encircle_petrograd_whites: "合围彼得格勒白军"
 RUS_encircle_petrograd_whites_desc: "外围交通线已经落入红军手中。现在必须封锁彼得格勒的白军兵营和司令部，迫使其投降。"
 RUS_cut_off_tsaritsyn_whites: "切断察里津白军退路"
 RUS_cut_off_tsaritsyn_whites_desc: "南俄白军通往顿河与伏尔加河下游的道路已经暴露。一次协调进攻将彻底摧毁其退路。"
 RUS_defend_against_white_counterattack: "阻止白军反击"
 RUS_defend_against_white_counterattack_desc: "白军正在进攻§Y[event_target:RUS_white_revolt_counterattack_state.GetName]§!。必须立即调集预备队，否则我们将失去这一地区。"
 RUS_white_revolt_counterattack_mission: "白军正在反击"
 RUS_white_revolt_counterattack_mission_desc: "白军试图夺回§Y[event_target:RUS_white_revolt_counterattack_state.GetName]§!。若不及时防御，该地区必须重新夺取。"
 RUS_white_revolt_cp_10: "£command_power §Y10§!"
 RUS_white_revolt_cp_10_blocked: "£command_power §R10§!"
 RUS_white_revolt_cp_15: "£command_power §Y15§!"
 RUS_white_revolt_cp_15_blocked: "£command_power §R15§!"
 RUS_white_revolt_cp_20: "£command_power §Y20§!"
 RUS_white_revolt_cp_20_blocked: "£command_power §R20§!"
 RUS_white_revolt_start_tt: "完成国策§Y克里姆林宫红旗升起§!。\n解锁§Y白军反扑§!决议组。\n获得§G30§!指挥点。\n必须在§Y90日§!内解决彼得格勒与察里津的白军。"
 RUS_white_revolt_victory_tt: "§G革命取得胜利。§!\n社会主义俄罗斯将正式建立。"
 RUS_white_revolt_failure_tt: "§R革命宣告失败。§!\n军方将建立临时政府并恢复共和国。"
 RUS_red_army_advance_tt: "行动完成后，红军将控制§Y[FROM.GetName]§!的交通线。"
 RUS_encircle_petrograd_whites_tt: "行动完成后，§G彼得格勒战区将取得胜利§!。"
 RUS_encircle_petrograd_whites_available_tt: "已控制彼得格勒及所有仍由俄罗斯掌握的外围目标地区，且当前没有白军反击。"
 RUS_cut_off_tsaritsyn_whites_tt: "行动完成后，§G察里津战区将取得胜利§!。"
 RUS_cut_off_tsaritsyn_whites_available_tt: "已控制察里津及所有仍由俄罗斯掌握的外围目标地区，且当前没有白军反击。"
 RUS_defend_against_white_counterattack_tt: "成功保住§Y[event_target:RUS_white_revolt_counterattack_state.GetName]§!，该地区无需重新肃清。"
 RUS_white_revolt_counterattack_failure_tt: "若未能及时组织防御，我们将失去§Y[event_target:RUS_white_revolt_counterattack_state.GetName]§!，并需要重新肃清当地白军。"
 russia_events.926.d: "萨文科夫死后数日，所谓“保卫祖国与自由联盟”的高层便已星散——或遭逮捕，或被枪决，或仓皇出逃。唯弗拉基米尔·曼施坦因将军与安东·图尔库尔将军尚能挟制莫斯科近郊卫戍部队，借机发动反政变。凭借骑兵与一支装甲纵队，二人一度攻入莫斯科南部城区，占领数处要地。\n\n反政变一方原指望莫斯科守军大规模倒戈，归顺其“白卫军”旗帜，然而应者寥寥。这座城早已无意再为逝去的元首殉葬。\n\n在兹韦尼哥罗德郊外短暂交火之后，叛军主力即宣告投降。曼施坦因被押解至军事法庭，当庭执行枪决。\n\n但肃反的浪潮远未平息。地方驻军中大批白卫军官拒不臣服，率部举旗反抗临时政府。这群反动武装在马尔科夫元帅的统一号令下迅速集结，磨刀霍霍，随时准备绞杀革命。"
 russia_events.926.a: "命令他们缴械投降！"
 rus_stalin_white_revolt_events.1.t: "白军拒绝缴械"
 rus_stalin_white_revolt_events.1.d: "曼施坦因的政变在莫斯科街头迅速瓦解，他本人也在混乱中丧命。然而，这并不意味着旧军队已经接受革命。彼得格勒的军官团控制了兵营和铁路枢纽，南俄的白军残部则以察里津为中心重新集结。\n\n社会主义临时政府能够依靠的正规部队极其有限。赤卫队、革命水兵和忠诚的铁路工人必须在白军协调行动之前打通两座城市周边的交通线。革命不会再得到第二次机会。"
 rus_stalin_white_revolt_events.1.a: "向彼得格勒和察里津派出红军！"
 rus_stalin_white_revolt_events.2.t: "彼得格勒的白色堡垒"
 rus_stalin_white_revolt_events.2.d: "彼得格勒的军校、近卫军兵营和旧海军机关已成为白军据点。卢加、奥洛涅茨和兹万斯克的铁路一旦被他们牢牢控制，革命水兵便会与内地隔绝。红军必须先夺取外围交通线，再合围城内守军。"
 rus_stalin_white_revolt_events.2.a: "不能让革命的摇篮落入白军之手。"
 rus_stalin_white_revolt_events.3.t: "南俄军官在察里津集结"
 rus_stalin_white_revolt_events.3.d: "顿河军官、哥萨克和从各地逃出的反革命部队正涌向察里津。他们企图依托伏尔加河交通，连接南俄各支白军并向莫斯科推进。米列罗沃、卡梅申、波克罗夫斯克和韦利科克尼亚热斯克将决定这支白军能否获得增援。"
 rus_stalin_white_revolt_events.3.a: "切断他们的一切退路。"
 rus_stalin_white_revolt_events.4.t: "白军发动反击"
 rus_stalin_white_revolt_events.4.d: "白军集中了最后的预备队，正向§Y[event_target:RUS_white_revolt_counterattack_state.GetName]§!发动反击。当地赤卫队请求立即派遣援军。"
 rus_stalin_white_revolt_events.4.a: "准备防御！"
 rus_stalin_white_revolt_events.5.t: "红军防线被突破"
 rus_stalin_white_revolt_events.5.d: "增援未能及时抵达§Y[event_target:RUS_white_revolt_counterattack_state.GetName]§!。当地红军被迫撤退，铁路与电报站再次落入白军手中。"
 rus_stalin_white_revolt_events.5.a: "我们必须重新夺回那里。"
 rus_stalin_white_revolt_events.6.t: "彼得格勒白军投降"
 rus_stalin_white_revolt_events.6.d: "在外围铁路被切断后，彼得格勒的白军很快耗尽了弹药与粮食。革命水兵和赤卫队攻入军官据守的兵营，残余守军最终放下武器。革命的摇篮重新升起红旗。"
 rus_stalin_white_revolt_events.6.a: "彼得格勒安全了。"
 rus_stalin_white_revolt_events.7.t: "察里津白军覆灭"
 rus_stalin_white_revolt_events.7.d: "红军同时切断铁路与伏尔加河渡口，察里津白军的南撤路线彻底断绝。数支哥萨克部队自行解散，军官集团则在最后一次突围失败后投降。南俄反革命的脊梁已经折断。"
 rus_stalin_white_revolt_events.7.a: "察里津属于革命。"
 rus_stalin_white_revolt_events.8.t: "白军推翻临时政府"
 rus_stalin_white_revolt_events.8.d: "九十天过去了，红军仍未能同时控制彼得格勒与察里津。白军借助完整的铁路网汇合，并向莫斯科发动决定性进攻。临时政府的卫队在数小时内被击溃，社会主义领导人或被捕，或被迫逃亡。\n\n军方宣布接管国家，在恢复秩序后重新召集制宪会议。俄国革命再次失败。"
 rus_stalin_white_revolt_events.8.a: "军方将恢复共和国。"
 rus_stalin_white_revolt_events.9.t: "革命经受住了考验"
 rus_stalin_white_revolt_events.9.d: "彼得格勒和察里津的白军据点均已被摧毁。旧军队失去了最后两个能够协调全国反革命活动的中心，各地军官不是宣誓服从，就是逃往国外。社会主义临时政府终于不再只是莫斯科街垒后的一个大胆宣言，而成为掌握国家命运的现实力量。"
 rus_stalin_white_revolt_events.9.a: "现在，开始建设社会主义俄罗斯。"
 rus_stalin_white_revolt_events.11.t: "卢加铁路重新通车"
 rus_stalin_white_revolt_events.11.d: "通往彼得格勒的南方铁路在卢加汇合，因此白军从起事之初便把这里经营成一道门闩。他们拆毁了朝莫斯科方向的数段铁轨，把装甲列车停在车站北侧，又强征附近村民挖掘环形战壕。红军先遣队沿着公路推进时，几乎每一座桥梁都遭到了爆破。\n\n真正改变局势的是铁路工人。夜色掩护下，他们拆除了白军安放在机车库里的炸药，并将一台藏起来的调车机开到了红军阵地。清晨，赤卫队乘着临时加挂的货车冲入车站，与从南面进攻的部队夹击守军。到中午，最后一列白军装甲列车已被迫向彼得格勒退去。工人们随即开始抢修线路；第一趟满载弹药和面包的列车已经鸣笛北上。"
 rus_stalin_white_revolt_events.11.a: "通向彼得格勒的大门已经打开。"
 rus_stalin_white_revolt_events.12.t: "奥洛涅茨森林中的红旗"
 rus_stalin_white_revolt_events.12.d: "奥洛涅茨没有适合大部队展开的宽阔道路。白军军官依托湖泊、森林和废弃伐木场建立了许多小型据点，企图用伏击拖住向彼得格勒迂回的红军。几支通讯分队在林间失踪后，前线一度只能依靠滑雪信使保持联系。\n\n当地伐木工和从前线逃回的士兵最终为红军带来了完整的林间小路图。他们带领轻装分队绕过白军路障，在黎明前夺取了电话交换所和弹药仓库。失去联络的白军据点很快各自溃散，有些军官甚至来不及烧毁名册。如今，红色布条被系在林区每一处路标上，北方迂回线已经掌握在革命手中。"
 rus_stalin_white_revolt_events.12.a: "森林也站在革命一边。"
 rus_stalin_white_revolt_events.13.t: "沃尔霍夫河上的桥梁"
 rus_stalin_white_revolt_events.13.d: "兹万斯克控制着沃尔霍夫河的重要渡口和通往彼得格勒东面的铁路。白军打算在撤退时炸毁桥梁，使革命军无法从东面完成合围。桥面上堆满炸药，河岸机枪阵地则昼夜监视着任何靠近桥墩的人。\n\n红军并未发动代价高昂的正面冲锋。一支由水兵和电厂工人组成的小队乘驳船顺流而下，在炮火掩护下从桥梁下方剪断了起爆线路。与此同时，城内工人委员会敲响工厂汽笛，带领武装工人占领车站。白军守军发现桥梁完好、退路却已被切断，只能抛下重武器向西逃散。沃尔霍夫河桥没有倒下，东面的铁环正在收紧。"
 rus_stalin_white_revolt_events.13.a: "让列车跨过沃尔霍夫河。"
 rus_stalin_white_revolt_events.14.t: "米列罗沃枢纽之战"
 rus_stalin_white_revolt_events.14.d: "米列罗沃是连接顿河地区与察里津白军的关键铁路枢纽。来自南方的军官、哥萨克和弹药都要从这里转运，车站周围因此挤满了临时兵营与军需仓库。白军相信，凭借开阔草原和骑兵优势，红军不可能切断这条生命线。\n\n红军指挥员反其道而行，将步兵隐藏在运煤列车中，让当地扳道工把列车引入军用站台。车门打开的一刻，赤卫队直接冲向信号楼；外围骑兵同时切断电报线并封锁南侧道口。混乱中的白军骑兵无法判断进攻来自何方，最终放弃仓库向顿河方向撤退。数十节装满步枪、炮弹和军粮的车厢完好落入我们手中，察里津与南方的联系已被斩断。"
 rus_stalin_white_revolt_events.14.a: "白军的生命线断了。"
 rus_stalin_white_revolt_events.15.t: "卡梅申的伏尔加船队"
 rus_stalin_white_revolt_events.15.d: "卡梅申港是察里津白军从伏尔加河上游获得补给的中转站。几艘临时加装火炮的拖船控制着河面，岸边粮仓则堆满了从各地征集来的面粉。只要港口仍在白军手中，察里津就不会真正陷入孤立。\n\n红军炮兵在夜间将轻炮拖上河西高地，黎明时突然向白军船队开火。港口工人趁乱关闭煤栈、破坏绞盘，使拖船无法及时起航。一艘拖船升起红旗并调转炮口后，其余船只很快失去抵抗意志。下午，红军已经接管码头和粮仓，并开始把没收的面粉分发给城中居民。伏尔加河不再为反革命输送粮食。"
 rus_stalin_white_revolt_events.15.a: "控制河流，就能控制察里津。"
 rus_stalin_white_revolt_events.16.t: "波克罗夫斯克工人的起义"
 rus_stalin_white_revolt_events.16.d: "隔着伏尔加河与察里津相望的波克罗夫斯克拥有铁路工场、码头和大片仓库。白军在这里拘捕工会积极分子，试图保证东岸始终是一块可靠的后方。然而，工场里的地下委员会一直通过修理记录和货运清单向红军传递情报。\n\n红军抵达河对岸的当夜，工人们拉响了防空警报作为起义信号。他们夺取枪械库，封锁通往码头的街道，并用尚未修好的机车堵死铁路。白军援军刚下车便遭到来自厂房和水塔的交叉射击。次日清晨，红军渡河部队与工人纠察队在车站会师。那些曾被关押的工会成员亲手打开监狱大门，东岸已经成为围困察里津的革命阵地。"
 rus_stalin_white_revolt_events.16.a: "工人自己解放了这座城市。"
 rus_stalin_white_revolt_events.17.t: "大克尼亚热斯克的草原骑兵"
 rus_stalin_white_revolt_events.17.d: "大克尼亚热斯克位于通往顿河与高加索的草原道路上。白军将这里当作骑兵集结地，征用村庄马匹并许诺在攻下莫斯科后恢复旧有土地秩序。许多贫苦哥萨克并不相信这些诺言，却又害怕拒绝军官的征召。\n\n红军没有立即进攻，而是先向各村派出熟悉哥萨克方言的宣传队，保证普通骑兵放下武器后可以回家。白军军官下令处决送信者，反而引发了两个骑兵团的哗变。战斗开始时，哗变者从侧翼冲入白军司令部，红军骑兵则从北面封锁道路。不到半日，草原上的白军旗帜便全部消失。大批普通骑兵交出马枪，其中不少人选择调转马头加入红军。"
 rus_stalin_white_revolt_events.17.a: "让他们为人民而战。"
 rus_stalin_white_revolt_events.18.t: "红旗招展西伯利亚"
 rus_stalin_white_revolt_events.18.d: "西伯利亚的广袤大地，曾是白卫军残部苟延残喘的最后巢穴。然而，随着农村赤卫队的全面动员与“整合运动”的深入渗透，这片冻土之上再无反动派的安宁之地。在伏罗西洛夫和日丹诺夫的统一指挥下，农村地方的反动势力无处遁形。赤卫队从城市郊区与铁路沿线迅速出击，配合红军正规部队形成合围态势，切断白军东西往来的所有交通要道。\n\n短短数周之内，西伯利亚各地的白匪军据点便陷入人民的汪洋。在鄂木斯克，守军未及突围便被包围，城头红旗次日即升；在新西伯利亚，白军整营整连放下武器，士兵们调转枪口加入赤卫行列；在伊尔库茨克，白军指挥部在整合运动的内线策应下崩溃，军官们四散奔逃。零星残部虽曾企图依托村镇或森林负隅顽抗，但在红军铁拳的反复清剿下，枪声很快便被茫茫雪原吞没——成建制的抵抗土崩瓦解，成堆的步枪、机枪与弹药被缴获，堆积如山的军需物资成为赤卫队和整合运动的战利品。\n\n远东方向，哥萨克首领谢苗诺夫一度野心勃勃，试图集结骑兵残部与逃亡地主武装，在西伯利亚大铁路东段掀起反扑。然而，他的集结令尚未传遍各营地，整合运动的游击队便已炸毁其预备弹药库，赤卫队更从南北两翼迂回包抄，切断其退往滨海地区的通道。谢苗诺夫仓促应战，骑兵在冰河上被红军炮火劈成碎片，辎重车队尽数陷于雪泥之中。最终，他仅带数十名亲信，抛弃军旗与重武器，在夜幕掩护下狼狈穿越国境线，逃亡满洲。\n\n随着谢苗诺夫残部的覆灭，西伯利亚的布尔什维克——社会革命党左翼政府宣布服从临时政府管辖，红旗从乌拉尔山麓一路插到太平洋之滨，城镇与乡村处处飘扬着苏维埃的赤色徽记。曾经不可一世的白卫军将领或死或降，士兵则被整编改造，散兵游勇再无藏身之地。铁路恢复了畅通，粮食与煤炭得以西送，新生的政权在这片辽阔土地上扎下深根。从此，在乌拉尔山脉以东，再无成建制的白军抵抗。"
 rus_stalin_white_revolt_events.18.a: "干得好，同志们！"
 rus_stalin_white_revolt_events.19.t: "论党的工作"
 rus_stalin_white_revolt_events.19.d: "约瑟夫•斯大林\n\n有些同志以为，既然我们已经是执政的党，既然工人阶级掌握了政权，那么社会主义意识就会自然而然地、自发地在群众中生长起来，用不着党的操心，用不着系统的教育工作。这是极端错误的，同志们，这是对自发性的腐朽崇拜，这是尾巴主义最露骨的表现。\n\n这种观点的害处在什么地方呢？就在于它抹杀了无产阶级先锋队同广大群众的区别，就在于它把我们党的水平降低到普通工人的平均水准，就在于它实际上否认了党作为工人阶级的先进部队、作为工人阶级的政治领袖的作用。列宁同志在《怎么办？》中已经一劳永逸地粉碎了这种经济主义的谬论。他教导我们说，崇拜自发性，就是削弱社会主义意识，就是给资产阶级思想体系扫清道路，因为自发的发展过程正是使工人运动受资产阶级思想体系的支配。\n\n党是什么？党是无产阶级的先锋队，是无产阶级组织的最高形式。它的使命不是跟在群众尾巴后面记录群众的情绪，而是走在群众前面，领导群众，把群众提高到社会主义意识的水平。党如果不向工人运动灌输社会主义意识，那它还要做什么呢？难道要它去做工会的尾巴吗？难道要它去做非党群众的自发情绪的传声筒吗？不，同志们，党的全部工作就在于用革命理论武装工人阶级，就在于把社会主义意识同工人运动结合起来。没有这种结合，就不会有真正的无产阶级政党，就不会有革命的胜利，更不会有无产阶级专政的巩固。"
 rus_stalin_white_revolt_events.19.d_2: "现在摆在我们面前的是社会主义建设的宏伟任务。但我们必须清醒地认识到，资产阶级思想残余并没有因为旧制度的垮台而自行消失。非但如此，它还盘踞在人们的意识中，隐藏在日常生活的一千零一个角落里，并不断地、自发地重新滋生。小资产阶级的自发势力包围着我们，吞噬着我们，用它的千丝万缕缠绕着工人阶级的队伍。它用私有心理、投机习气、民族主义偏见和官僚主义作风，从内部瓦解我们的队伍。不仅如此，国际资本主义的包围还在用一切手段——收买、间谍活动、思想渗透——企图在我们这里复辟资本主义。\n\n在这种情况下，削弱党的思想教育工作意味着什么？这意味着让资产阶级思想体系自由泛滥，意味着把我们的阵地拱手让给敌人。低估社会主义教育的意义，就是客观上帮助资产阶级，就是为资本主义复辟创造条件。这不是危言耸听，这是铁的现实。\n\n因此，党的当前任务应当是什么呢？"
 rus_stalin_white_revolt_events.19.a: "首先要明确党的任务。"
 rus_stalin_white_revolt_events.20.d: "第一，必须在党内加强马克思列宁主义理论教育。不能容忍那种对理论问题漠不关心的老爷式态度。我们的干部，特别是年轻干部，必须掌握马克思列宁主义这门科学，因为只有掌握理论，才能正确地判断形势，才能预见到事变的进程，才能在政治上不迷失方向。谁要是以为凭借实际工作经验就可以代替理论修养，那他就是近视眼，是事务主义者，迟早要在政治上摔跤。\n\n第二，必须把思想教育工作深入到工人阶级和全体劳动群众中去。工厂、集体农庄、学校、报刊、俱乐部——所有这些都应当成为党灌输社会主义意识的据点。要用群众的语言，用活生生的事实，用具体的事例，向工人和农民说明什么是社会主义，什么是资本主义，说明我们斗争的性质和目的。要造成这样一种风气，使得每个劳动者都把自己的命运同苏维埃国家的命运联系在一起，都自觉地、忠诚地、充满热情地为社会主义事业而奋斗。\n\n第三，必须在思想战线上进行不调和的斗争。不能给机会主义、民族主义、宗教偏见和各种资产阶级影响以任何可乘之机。批评和自我批评是我们党手中的锐利武器，这个武器决不能不使用。不敢揭露错误，不敢同错误的倾向作斗争，这是腐朽的自由主义，是同布尔什维主义格格不入的。党的工作者不应当是怕得罪人的老好人，而应当是有原则性的政治战士。要尖锐地、公开地、诚实地揭露一切偏离马克思列宁主义路线的倾向，不管它来自什么人，不管它披着什么样的外衣。\n\n有些同志会说：这样做会不会引起不满？会不会搞得关系紧张？要告诉他们：布尔什维克从来不是靠讨好群众来工作的。害怕批评的自由主义庸人，是最不可靠的所谓“共产党员”。他们那种软弱无力、息事宁人的作风，对党的事业所造成的损害，比公开的敌人还要大。因为公开的敌人看得见，可以准确地打击他；而庸人却用“党的利益”来掩盖自己的腐朽，瓦解着党的战斗力。"
 rus_stalin_white_revolt_events.20.a: "党必须成为有原则性的政治战士。"
 rus_stalin_white_revolt_events.21.d: "同志们！我们的党是在斗争中成长和锻炼起来的。在沙皇专制的黑暗年代，在白卫军疯狂进攻的内战时期，在同反动分子的殊死搏斗中，我们的党克服了无数困难，其力量的源泉就在于马克思主义理论的武装，在于对工人阶级事业的无限忠诚，在于钢一般的统一和铁一般的纪律。\n\n现在，在我们已经取得伟大的历史性胜利的时候，决不可以有丝毫的松懈。相反，越是在胜利的形势下，越是要加强党的思想工作，越是要提高革命的警惕性。必须记住资本主义包围的存在，必须记住阶级敌人并没有睡觉，必须记住他们还在妄想在苏联复辟资本主义的老根。\n\n把社会主义意识灌输到工人运动中去，这是我们党的一贯方针，过去是，现在是，将来也是。谁轻视这个方针，谁动摇这个方针，谁就是帮助敌人，谁就是破坏社会主义建设，谁就是为资本主义复辟铺平道路。\n\n我们的党是强大的，因为它是马克思列宁主义武装起来的党。我们的党是不可战胜的，因为它同工人阶级和全体劳动者有着血肉的联系。我们要像保护眼珠一样保护党的思想纯洁性和组织统一。我们要更加坚定地、更加顽强地、更加巧妙地进行党的思想工作。我们要把千百万群众团结在马克思列宁主义的旗帜下，用百折不回的布尔什维克的坚定性，向着共产主义的目标奋勇前进。\n\n放弃对自发性的幻想，坚决地、系统地向群众灌输社会主义意识——这就是党的工作的全部精髓。"
 rus_stalin_white_revolt_events.21.a: "这就是巩固无产阶级专政和建成社会主义社会的可靠保证。"
 rus_stalin_white_revolt_events.22.t: "关于“整合运动”"
 rus_stalin_white_revolt_events.22.d: "尽管布尔什维克在内战中落败，但他所留下的政治影响至今仍在：\n\n在布尔什维克高层的指导下，由克利缅特·叶夫列莫维奇·伏罗希洛夫与安德烈·亚历山德罗维奇·日丹诺夫组成的恐怖组织依然在广袤的西伯利亚平原上与军方进行着殊死搏斗。\n\n最令他们臭名昭著的则是对奉作战期间，与社革党最高纲领派对科尔尼洛夫元帅的未遂刺杀。事后当局虽花费大量人力物力进行搜捕，却仍未对“整合运动”组织进行有效打击，反而在围剿中让他们声名鹊起，成了残存赤匪的精神图腾。\n\n根据统帅部最新战报与实地核查结果，必须坦率承认：针对“整合运动”的当前攻势尚不具备短期内终结战事的条件。叶尼塞河以东的原始森林与沼泽地带为伏罗希洛夫—日丹诺夫团伙提供了天然庇护，其分散化的小组作战模式使我们传统的“堡垒—铁路”清剿方案难以发挥预期效力。更棘手的是，部分偏远居民点因长期隔绝、物资依赖，已形成对恐怖组织的被动共生态，敌我识别边界已日趋模糊……"
 rus_stalin_white_revolt_events.22.a: "这帮傻子还活在1917？！"
 RUS_stalin_post_white_revolt_events.1.t: "喀山事件"
 RUS_stalin_post_white_revolt_events.1.d: "内战的历程远非如我们想象的那般顺遂。在喀山，自发组建的农村公社与地方武装力量之间爆发了惨烈的械斗。类似的冲突在其他地区亦时有发生，暴露出一个日益尖锐的根本矛盾：土地。\n\n过往的自由派政府已届数年，但土地问题始终未获彻底解决。中央的法令在纸面上已颁布多时，然而在实际执行中，却因地方行政力量的薄弱、基层行政的不纯以及战后的混乱状态而进展迟缓。在喀山及其周边地区，富农阶层利用这一权力真空，以“租佃契约”和“债务关系”为名，继续维持对土地的实际控制，而贫农与红军退伍士兵则因土地迟迟无法到户而日益焦躁。当地农村公社的激进派认为“法令已经足够，缺的是行动”，遂自行组织武装，试图以直接手段夺回土地；地方军队则奉上级“维持秩序、保护一切合法财产”的命令予以阻拦，双方互不相让，最终在如今酿成大规模械斗。\n\n更为棘手的是，这场冲突很快被赋予了超出土地纠纷的政治含义。地方富农与旧合作社势力将自身包装为“反抗新布尔什维克暴政的秩序捍卫者”，而部分农村公社的激进行动则被安全机关报告为“可能含有白军煽动分子的渗透”。在喀山，一桩原本可以调解的矛盾，迅速被双方解读为“革命与反革命之间的对决”——而这类解读，恰恰是土地改革迟迟未能落实所催生的最危险的副产品……"
 RUS_stalin_post_white_revolt_events.1.a: "这将是一场殊死斗争……"
 RUS_stalin_post_white_revolt_events.1.a_tt: "土地改革已§R刻不容缓§!！一些“农村布尔什维克”同志的参与或许会对这项工作有所帮助。"
