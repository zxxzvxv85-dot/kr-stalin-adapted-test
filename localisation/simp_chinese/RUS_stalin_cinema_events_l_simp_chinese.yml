 RUS_stalin_cinema.1.t:0 "《不死族》"
 RUS_stalin_cinema.1.d:0 "据民营媒体“盖金社”报道，最新电影《不死族》在众多工人社区的电影院收到广泛好评。\n\n《不死族》的内容是：在遥远的“安东星”中，三个不死族——分别是安东·尤丁采夫、维亚切斯拉夫·巴兰尼科夫和尼基塔·布亚诺夫生活在一个特殊智慧种族遭受歧视的国家，在这个国家中，特殊种族得到的工资往往只有普通种族的五分之一，比如普通种族一个月能赚25金鹰（折合为10000银狮，金鹰和银狮是通用货币），特殊种族只有5金鹰；而尤丁采夫、巴兰尼科夫、布亚诺夫为了推翻种族主义、封建主义、资本主义的三座大山而投身于革命事业；由于他们是不死族，尽管三人先后多次在各种各样的阵亡名单和新闻中出现，被反动政府的内部称之为“新闻三要素”，但是三人仍然多次完好无损地出现在了革命前线。在电影的最后，经历了骑兵与步兵的轮番冲锋，革命最终胜利，画面定格在被击中头部眼部的布亚诺夫、失去马的巴兰尼科夫以及刚刚使用火炮让敌方装甲车弹药殉爆的尤丁采夫三人身上，他们共同欢呼，而美好的新生活似乎就在每个人的眼前。\n\n“这部电影这让我想起了我的丈夫，他在1920年保卫莫斯科的战斗中牺牲了……”有一位女工人在看完后这么说道。\n\n由于这部电影出色的反响，制片厂预计制作更多胶卷以供在社会主义国家与反殖民反霸权国家内传播。"
 RUS_stalin_cinema.1.a:0 "值得注意的是，有三名俄国白军间谍在观影的时候被捕"
