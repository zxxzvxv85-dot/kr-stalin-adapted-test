 RUS_europe_intervention_dzerzhinsky_tt:0 "§Y费利克斯·埃德蒙多维奇·捷尔任斯基§!\n§Y生于：§! §L1877年9月11日；俄罗斯帝国属波兰、维尔诺省§!\n§Y背景：§! §L费利克斯·埃德蒙多维奇·捷尔任斯基生于俄属波兰维尔诺省奥什米扬内县捷尔任诺沃庄园，一个波兰小地主贵族家庭。童年并未在庄园的安宁中度过太久——母亲早逝，父亲也在他十岁时离世，此后家道中落，少年时期的捷尔任斯基便已开始目睹阶级分化的残酷现实。1895年，他在维尔诺中学就读期间接触到马克思主义小组，次年便决心辍学，投身革命活动。1897年，他参与组织维尔诺社会民主工党，同年被捕，首次尝到牢狱滋味。\n\n1905年革命席卷波兰时，捷尔任斯基已是波兰王国和立陶宛社会民主工党的核心组织者之一。他在华沙和罗兹领导大规模罢工，参与武装斗争的准备，并负责地下刊物的编辑与分发。此后数年间，他辗转于维尔纽斯、华沙、基辅等地，先后五次被捕、三次流放，累计在监牢与流放地度过近十一年光阴——几乎占去他成年后将近一半的岁月。这段经历为他日后主持全俄肃反委员会的工作积累了深厚的地下斗争经验与心理承受力。\n\n1917年二月革命后，流放中的捷尔任斯基获释，随即奔赴彼得格勒。十月武装起义期间，他是军事革命委员会委员，负责斯莫尔尼宫的通讯与保卫工作，确保起义指挥中枢的畅通。起义成功后，根据列宁提议，他受命组建全俄肃反委员会，以应对白军与间谍活动的威胁。在内战最严峻的岁月里，他以极其严厉甚至冷酷的作风主持肃反工作——对叛徒与间谍从不留情，对组织内的动摇分子亦毫不姑息。白军和敌对势力闻之色变，党内同志则既敬畏又信赖，他因此赢得了“钢铁的费利克斯”的称号。\n\n然而，内战的走向最终未如革命者所愿。红色政权在多方围攻下倾覆，流亡成为唯一的出路。在撤离的混乱中，捷尔任斯基与中央失去联络。为掩人耳目，他销毁了一切能表明身份的文件，伪装成一名普通的波兰裔铁路工人，混入向西撤退的难民潮中——这一决定如此果断而彻底，以至于绝大多数同志都以为他已在白军的围剿中丧生——他的名字甚至一度出现在流亡者内部流传的牺牲者名单上。\n\n穿越战火与边境线的重重关卡后，捷尔任斯基辗转抵达华沙。在这座他年轻时便已熟悉的城市里，他以“海燕”为化名重新扎根。初期举步维艰——没有文件、没有联系人、没有资金，仅靠记忆中的几个旧地址和地下工作的本能，他开始逐一联络残存的波兰工党。凭借其惊人的记忆力与对地下工作的高度敏感，他很快在华沙、罗兹、克拉科夫等工业城市的工人社区中建立起可靠的情报节点。事到如今，这张以华沙为基地的网络已悄然延伸至东欧各国……§!\n\n§Y点击头像切换至莫洛托夫：民用援助§!"
 RUS_europe_intervention_molotov_tt:0 "§Y维亚切斯拉夫·莫洛托夫§!
§Y生于：§! §L1890年3月9日；俄罗斯帝国维亚特卡省库卡尔卡镇§!
§Y背景：§! §L维亚切斯拉夫·米哈伊洛维奇·莫洛托夫（原名维亚切斯拉夫·米哈伊洛维奇·斯克里亚宾）出身于一个乡村教师家庭，幼年家境尚可，但父亲早逝后家道中落。他在喀山中学就读期间接触到地下革命报刊，迅速为马克思主义所吸引。1906年，十六岁的莫洛托夫加入俄国社会民主工党，旋即投身于地下工作——组织学生集会、散发传单、联络铁路工人，在警察的监视下学会了谨慎与沉默。

1917年二月革命爆发时，莫洛托夫正在彼得格勒。他是最早一批抵达塔夫利达宫的布尔什维克活动分子之一，在此后数月间迅速成长为核心联络人。十月武装起义期间，他负责斯莫尔尼宫与各工厂之间的通讯协调——尽管不参与街垒战斗，但每一道指令都经由他的手传向前线。其效率和组织能力引起了列宁的注意，后者曾在一份内部文件中将他列为“值得培养的年轻干部”。

内战爆发后，莫洛托夫被派往前线负责政治动员工作。他在察里津与斯大林共事，在南方方面军与伏罗希洛夫并肩协调补给线。他并不以军事才能著称，但在组织文书、起草命令、整理报告方面的能力无人能及。这段经历使他形成了对“秩序”和“文件”近乎偏执的重视——他相信革命的持久性取决于行政链条的可靠性。

红色政权倾覆后，莫洛托夫随流亡者一同撤往欧洲。在巴黎流亡期间，他逐渐从一名党务组织者转型为外交事务的参与者。他自学法语，系统研究欧洲各国的政治格局，并多次以非官方身份与法国工农共产党、工团主义政党进行接触。斯维尔德洛夫曾评价他“每句话都经过了计算”。

随着社会主义俄罗斯重建工作的启动，莫洛托夫在布尔什维克党的推荐下，开始承担越来越重要的对外联络任务。他先后参与与第三国际的贸易谈判、与德国社会主义党的意识形态协调会议，以及多场关于“国际革命协调机制”的多边磋商。他并不擅长公开演说，但在闭门谈判中表现出罕见的耐性与精确度——他习惯于让对方先亮出全部底牌，然后逐条拆解、重新组合，最终拿出一份对方几乎无法拒绝的修正案。

在外交场合，莫洛托夫总是身着深色西装，领带系得一丝不苟，说话时习惯将双手平放在桌面上，仿佛随时准备在纸上签字或划掉某一行。在大多数同志看来，他的一举一动都与其“铁锤”的绰号相称——不张扬，不偏移，每一次落下都精准而有力。§!

§Y“老一辈布尔什维克从不让步于压力，这一点永远不会改变。”§!\n\n§Y点击头像切换至捷尔任斯基：军事援助§!"
