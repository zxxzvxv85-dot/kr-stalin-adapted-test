 RUS_europe_intervention_dzerzhinsky_tt:0 "§Y费利克斯·埃德蒙多维奇·捷尔任斯基§!\n§Y生于：§! §L1877年9月11日；俄罗斯帝国属波兰、维尔诺省§!\n§Y背景：§! §L费利克斯·埃德蒙多维奇·捷尔任斯基生于俄属波兰维尔诺省奥什米扬内县捷尔任诺沃庄园，一个波兰小地主贵族家庭。童年并未在庄园的安宁中度过太久——母亲早逝，父亲也在他十岁时离世，此后家道中落，少年时期的捷尔任斯基便已开始目睹阶级分化的残酷现实。1895年，他在维尔诺中学就读期间接触到马克思主义小组，次年便决心辍学，投身革命活动。1897年，他参与组织维尔诺社会民主工党，同年被捕，首次尝到牢狱滋味。\n\n1905年革命席卷波兰时，捷尔任斯基已是波兰王国和立陶宛社会民主工党的核心组织者之一。他在华沙和罗兹领导大规模罢工，参与武装斗争的准备，并负责地下刊物的编辑与分发。此后数年间，他辗转于维尔纽斯、华沙、基辅等地，先后五次被捕、三次流放，累计在监牢与流放地度过近十一年光阴——几乎占去他成年后将近一半的岁月。这段经历为他日后主持全俄肃反委员会的工作积累了深厚的地下斗争经验与心理承受力。\n\n1917年二月革命后，流放中的捷尔任斯基获释，随即奔赴彼得格勒。十月武装起义期间，他是军事革命委员会委员，负责斯莫尔尼宫的通讯与保卫工作，确保起义指挥中枢的畅通。起义成功后，根据列宁提议，他受命组建全俄肃反委员会，以应对白军与间谍活动的威胁。在内战最严峻的岁月里，他以极其严厉甚至冷酷的作风主持肃反工作——对叛徒与间谍从不留情，对组织内的动摇分子亦毫不姑息。白军和敌对势力闻之色变，党内同志则既敬畏又信赖，他因此赢得了“钢铁的费利克斯”的称号。\n\n然而，内战的走向最终未如革命者所愿。红色政权在多方围攻下倾覆，流亡成为唯一的出路。在撤离的混乱中，捷尔任斯基与中央失去联络。为掩人耳目，他销毁了一切能表明身份的文件，伪装成一名普通的波兰裔铁路工人，混入向西撤退的难民潮中——这一决定如此果断而彻底，以至于绝大多数同志都以为他已在白军的围剿中丧生——他的名字甚至一度出现在流亡者内部流传的牺牲者名单上。\n\n穿越战火与边境线的重重关卡后，捷尔任斯基辗转抵达华沙。在这座他年轻时便已熟悉的城市里，他以“海燕”为化名重新扎根。初期举步维艰——没有文件、没有联系人、没有资金，仅靠记忆中的几个旧地址和地下工作的本能，他开始逐一联络残存的波兰工党。凭借其惊人的记忆力与对地下工作的高度敏感，他很快在华沙、罗兹、克拉科夫等工业城市的工人社区中建立起可靠的情报节点。事到如今，这张以华沙为基地的网络已悄然延伸至东欧各国……§!"
