 russia_socialist_events.13.t:0 "牺牲的同志们"
 russia_socialist_events.13.d:0 "莫斯科的一座纪念碑于今日揭幕，以纪念所有在十月革命和第二次革命中牺牲的革命者。纪念碑距离革命广场仅有一个街区，这座雕塑由几名挣脱锁链的不同身份的革命者和一颗红色五角星组成，象征着为了俄国人民以及世界人民解放而流血牺牲俄罗斯人。纪念碑底座上刻有二十多个名字，包括担任过全俄中央执行委员会委员要职的米哈伊尔·费奥多罗维奇·弗拉基米尔斯基，他于1932年1月12日在奥尔良的一场火车爆炸案中不幸身亡；十月革命的指挥官尼古拉·波德沃伊斯基，他在组织向俄罗斯走私人员和装备时被捕遇害。\n\n1931年后，在克拉夫季·福斯的领导下，俄罗斯情报机构发起了一系列暗杀行动。他们承诺赦免并奖励出卖同志的社会主义者，借此在流亡者团体中播下互相猜疑的种子。在此期间，数不胜数的原红军指挥官和俄共成员被出卖，因此尼古拉·叶若夫曾受命调查党内叛徒，最后的线索指向了原红军指挥官卡尔·拉狄克，可就在俄共（布）决定审讯他的时候，他却与弗拉基米尔斯基一同在火车爆炸案中身亡。在弗拉基米尔斯基遇害后不久，雅科夫·斯维尔德洛夫主席奇迹般地躲过了一次暗杀，而互相猜疑的情绪也随之加剧。\n\n他们只是内战后尸山血海中的一滴血。1921年，白色恐怖席卷全国，几乎无人得以幸免。为了保卫莫斯科争取时间，留守的红军有十分之九的人员牺牲；为了掩护阿尔汉格尔斯克撤退，帕维尔·德边科的殿后部队全部壮烈牺牲。我们借此纪念碑告诉所有人：他们为革命所做出的牺牲并没有白费。即便无法打破俄罗斯的枷锁，但他们仍为之不懈奋斗，以便后继者们能够取得成功。"
 russia_socialist_events.13.a:0 "我们会铭记他们。"
