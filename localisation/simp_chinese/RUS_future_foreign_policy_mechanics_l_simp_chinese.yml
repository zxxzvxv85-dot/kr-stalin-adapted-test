 RUS_future_foreign_policy_events.5.t:0 "暴风雨的鸟"
 RUS_future_foreign_policy_events.5.d:0 "茫茫的苍海之上，狂风卷集着乌云。在乌云和大海之间，海燕——像黑色的闪电——一飞冲天，傲然翱翔。\n\n它一会儿用翅膀拍着波浪，一会儿又像箭一般地冲入云霄，它叫喊着，——在鸟儿勇敢的叫喊声里，乌云听见了欢乐。\n\n在这叫喊声里——充满着对暴风雨的热望！在这叫喊声里，乌云听见了愤怒的力量，热情的火焰，与胜利的自信。\n\n海鸥在暴风雨将来之前，呻吟着，——呻吟着，在海上飞窜，想把对暴风雨的恐惧，藏到海底里去。\n\n海鸭也呻吟着，——这些海鸭呀，享受不了生活的战斗的欢乐，轰然的雷声早把她们吓坏了。\n\n蠢笨的企鹅，畏缩地在崖岸底下躲藏着肥胖的身体……只有那高傲的海燕，勇敢地在泛起白沫的海上自由地飞翔！\n\n乌云愈是阴暗，愈是低低地压到海面上来，而波浪一边唱歌，一边冲向空中，去迎接那雷声。\n\n雷声轰隆。波浪在愤激的泡沫中呼啸，与狂风争鸣。看吧，狂风紧抱着层层巨浪，恶狠狠地将它们甩到崖岸上，把这些大块的翡翠似的波浪，打得粉碎，变成尘雾和飞沫。\n\n海燕叫喊着，飞掠着，像黑色的闪电，箭一般地穿过乌云，翅膀上带着波浪的飞沫。\n\n看吧，它飞舞着，像精灵似的，——高傲的，黑色的暴风雨的精灵，——它一边大笑，一边号叫……它笑那乌云，它笑得号叫起来！\n\n这敏感的精灵，早从雷声的震怒里听出了困乏，它深信乌云遮不住太阳，——遮不住的！\n\n狂风怒号……雷声轰响……\n\n一堆堆的乌云，像青色的火焰，在无底的海洋上燃烧。海洋把闪电的光箭抓住，把它们熄灭在自己的深渊里。这些闪电的影子，宛如一条条火蛇，在海洋里蜿蜒浮动，转瞬就消失了。\n\n——暴风雨！暴风雨就要来啦！\n\n这是勇敢的海燕，在怒吼的海上，在闪电之中，高傲地飞翔；这是胜利的先知者在叫喊："
 RUS_future_foreign_policy_events.5.a:0 "——让暴风雨来得更猛烈些吧！"
 RUS_future_foreign_policy_events.5.a_tt:0 "§R华沙起义失败了！德国人已经发现了我们的意图，他们很快就要来了！§!"
 RUS_future_foreign_policy_events.6.t:0 "穿裤子的云"
 RUS_future_foreign_policy_events.6.d:0 "我——\n从街头走来，\n被路灯的光\n熏得乌黑，\n被雨水\n洗得发亮——\n我站在你们面前，\n像一面赤裸的真理。\n\n最后的终结来了：\n你们无处可逃。\n我的诗——\n不是那些精致的玩具，\n不是那些用糖纸包裹的糖果。\n我的诗——\n是一把铁锤，\n敲碎你们所有的玻璃窗；\n是一阵冰雹，\n砸烂你们所有的花坛。\n\n而我将死去——\n像一面被撕碎的旗，\n但我死之前，\n要把这整个世界"
 RUS_future_foreign_policy_events.6.a:0 "翻一个底朝天！"
