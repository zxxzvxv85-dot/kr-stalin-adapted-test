l_simp_chinese:
 RUS_third_international_gendarme:0 "第三国际宪兵"
 RUS_third_international_gendarme_desc:0 "俄罗斯的革命军人不仅守卫本国工农政权，也在世界各地的阶级斗争中积累着宝贵经验。"
 RUS_third_international_gendarme_status_tt:0 "已赢得志愿军干涉的红色国家：§Y[?RUS_third_international_gendarme_victories|0]§!\n每在一个实际派遣过志愿军的§Y红色国家§!首次赢得干涉，志愿军上限与来自志愿军的陆军经验将进一步提高；非红色政权不计入结算。"
 RUS_soviets_and_phalanstere:0 "苏维埃与法伦施泰尔"
 RUS_soviets_and_phalanstere_desc:0 "法伦施泰尔不再只是流亡者遥望故国的窗口。苏维埃科研机关、革命政府与社会主义工业组织之间日益密切的联系，正在构成一张横跨世界的知识与生产网络。"
 RUS_soviets_and_phalanstere_status_tt:0 "当前红色国家：§Y[?RUS_soviets_and_phalanstere_red_country_count|0]§!\n使用任意§Y军工机构§!完成科技时，每个红色国家提供£civ_factory_output §G25§!经济盈余，当前合计为£civ_factory_output §G[?RUS_soviets_and_phalanstere_mio_surplus|0]§!。\n红色国家包括§Y激进社会主义、极权主义、工团主义与共产主义§!政权。"
 RUS_future_foreign_004_effect_tt:0 "解锁动态修正§Y第三国际宪兵§!。\n每完成一个新外交国策，§Y革命准备度§!提高§G1§!点。"
 RUS_future_foreign_016_effect_tt:0 "解锁动态修正§Y苏维埃与法伦施泰尔§!。\n世界上每有一个红色国家，科研共享加成提高§G0.5%§!；使用任意军工机构完成科技时，将按红色国家数量获得经济盈余。\n每完成一个新外交国策，生活消费品系数提高§R1%§!。"
 RUS_future_foreign_exchange_five_year_plan_score:0 "调拨五年计划资源"
 RUS_future_foreign_exchange_five_year_plan_score_desc:0 "外交战线所需的交通、器材和组织人员，可以从五年计划的既有成果中调拨。每投入一点计划分数，便可将革命准备度提高一点。"
 RUS_future_foreign_exchange_five_year_plan_score_effect_tt:0 "五年计划分数：§R-1§!\n革命准备度：§G+1§!"
