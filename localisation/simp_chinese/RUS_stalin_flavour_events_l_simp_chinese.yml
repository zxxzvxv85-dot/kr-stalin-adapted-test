 RUS_stalin_flavour_events.1.t: "《来自高山的布尔什维克》"
 RUS_stalin_flavour_events.1.d: "素有“超人般的贝利亚”（Ultraman Beria）之称的格鲁吉亚作家拉夫连季·贝利亚，近日推出架空历史新作《来自高山的布尔什维克》。小说设定在苏俄内战红军胜利之后、苏维埃社会主义共和国联盟成立之初。\n\n主人公索塞罗出身格鲁吉亚贫寒农家，童年于修道院初遇马克思主义，青年时期顺理成章投身布尔什维克，成为列宁的忠实追随者。他在斗争中逐步进入核心领导层，内战期间临危受命担任军事指挥，在喀山城下力挽狂澜，击退白军反扑。列宁因伤逝世后，他继任总书记，成功领导苏维埃政权度过内外交困。在索塞罗同志的英明领导下，苏维埃联盟实现了人类史上前所未有的壮举——短短数十年内，书中宣称饥荒与文盲被彻底扫除，工业跃居世界第一，甚至率先将红旗插上火星。\n\n这部乌托邦式宏大叙事甫一问世，便引发热议。激进工团党人和共产党人击节赞赏，称其为“理想国的蓝图”；而保守工团派和自由主义者们则批评其“藐视现实逻辑，缺乏深度思考”。\n\n值得注意的是，时任全俄劳联副主席的格里戈里·季诺维也夫同样对此书评价颇低，认为此作“不足以体现革命之热情”。"
 RUS_stalin_flavour_events.1.a: "现在的架空历史小说这么有卖头么？"
 RUS_stalin_flavour_events.2.t: "尼古拉·特斯拉教授退休"
 RUS_stalin_flavour_events.2.d: "莫斯科，1940年12月26日电：\n\n电气化委员会今日发布公告：著名电气工程师、交流电系统奠基人尼古拉·特斯拉教授，因年事已高及健康原因，正式提出退休申请，已获人民委员会批准。即日起，特斯拉教授不再担任电力标准化总工程师职务，其原兼任的电气化委员会主席一职，将由格列布·马克西米利安诺维奇·克尔日扎诺夫斯基同志接任。特斯拉教授将继续保留“电力工业荣誉顾问”头衔，以咨专家意见。\n\n特斯拉教授自1920年代初应邀来俄，至今已近二十载。在此期间，他主持制定了全俄统一的50赫兹三相交流电标准，全面整顿各地遗留的德制、美制设备混用乱象，使我国电网得以互联互通，为工业化建设奠定了坚实的能源基础。其倡导的远距离输电技术和无线电能传输构想，亦为后续科研项目提供了方向。\n\n人民委员会在批复中指出，特斯拉教授“以毕生精力服务于人类电力事业，并在俄罗斯人民最需要技术援助的时期倾囊相授，其贡献已载入社会主义建设的史册”。\n\n据悉，特斯拉教授退休后将移居莫斯科郊区的疗养所，继续从事理论研究和著述工作。全俄电工研究所将为其配备小型实验室，以资其个人探索之用。新任电气化委员会主席克尔日扎诺夫斯基同志表示，将继续推进特斯拉教授未竟的远距离输电与电气化事业。"
 RUS_stalin_flavour_events.2.a: "祝您退休生活愉快！"
 RUS_tesla_electrical_industries: "特斯拉电气"
 RUS_tesla_electrical_industries_desc: "由特斯拉教授主持建立的技术团队已经发展为独立的电气工业机构，并将继续推进统一电力标准、远距离输电与全国电气化工程。"
