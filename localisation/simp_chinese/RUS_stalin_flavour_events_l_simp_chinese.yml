 RUS_stalin_flavour_events.1.t: "《来自高山的布尔什维克》"
 RUS_stalin_flavour_events.1.d: "素有“超人般的贝利亚”（Ultraman Beria）之称的格鲁吉亚作家拉夫连季·贝利亚，近日推出架空历史新作《来自高山的布尔什维克》。小说设定在苏俄内战红军胜利之后、苏维埃社会主义共和国联盟成立之初。\n\n主人公索塞罗出身格鲁吉亚贫寒农家，童年于修道院初遇马克思主义，青年时期顺理成章投身布尔什维克，成为列宁的忠实追随者。他在斗争中逐步进入核心领导层，内战期间临危受命担任军事指挥，在喀山城下力挽狂澜，击退白军反扑。列宁因伤逝世后，他继任总书记，成功领导苏维埃政权度过内外交困。在索塞罗同志的英明领导下，苏维埃联盟实现了人类史上前所未有的壮举——短短数十年内，书中宣称饥荒与文盲被彻底扫除，工业跃居世界第一，甚至率先将红旗插上火星。\n\n这部乌托邦式宏大叙事甫一问世，便引发热议。激进工团党人和共产党人击节赞赏，称其为“理想国的蓝图”；而保守工团派和自由主义者们则批评其“藐视现实逻辑，缺乏深度思考”。\n\n值得注意的是，时任全俄劳联副主席的格里戈里·季诺维也夫同样对此书评价颇低，认为此作“不足以体现革命之热情”。"
 RUS_stalin_flavour_events.1.a: "现在的架空历史小说这么有卖头么？"
 RUS_stalin_flavour_events.2.t: "尼古拉·特斯拉教授退休"
 RUS_stalin_flavour_events.2.d: "莫斯科，1940年12月26日电：\n\n电气化委员会今日发布公告：著名电气工程师、交流电系统奠基人尼古拉·特斯拉教授，因年事已高及健康原因，正式提出退休申请，已获人民委员会批准。即日起，特斯拉教授不再担任电力标准化总工程师职务，其原兼任的电气化委员会主席一职，将由格列布·马克西米利安诺维奇·克尔日扎诺夫斯基同志接任。特斯拉教授将继续保留“电力工业荣誉顾问”头衔，以咨专家意见。\n\n特斯拉教授自1920年代初应邀来俄，至今已近二十载。在此期间，他主持制定了全俄统一的50赫兹三相交流电标准，全面整顿各地遗留的德制、美制设备混用乱象，使我国电网得以互联互通，为工业化建设奠定了坚实的能源基础。其倡导的远距离输电技术和无线电能传输构想，亦为后续科研项目提供了方向。\n\n人民委员会在批复中指出，特斯拉教授“以毕生精力服务于人类电力事业，并在俄罗斯人民最需要技术援助的时期倾囊相授，其贡献已载入社会主义建设的史册”。\n\n据悉，特斯拉教授退休后将移居莫斯科郊区的疗养所，继续从事理论研究和著述工作。全俄电工研究所将为其配备小型实验室，以资其个人探索之用。新任电气化委员会主席克尔日扎诺夫斯基同志表示，将继续推进特斯拉教授未竟的远距离输电与电气化事业。"
 RUS_stalin_flavour_events.2.a: "祝您退休生活愉快！"
 RUS_stalin_flavour_events.3.t: "特斯拉电气投入运作"
 RUS_stalin_flavour_events.3.d: "随着新一轮专项投资正式敲定，由特斯拉教授主持建立的特斯拉国家电气，迎来了他的第二春。\n\n国家拨款已迅速转化为实打实的物资与设备，分批运抵厂区。首批到位的包括数十台大功率高压变压器及特制特斯拉线圈，随后，大型真空管振荡器、阴极射线管电磁场测量仪、多台半自动精密绕线机，亦已陆续进入装配车间。仓库内，云母片、浸渍纸绝缘带、特种铜质线缆等物资储备充足。数辆移动式高压试验车已驶入测试场地。\n\n上述设备均由特斯拉教授亲自拟定清单，经莫斯科方面直接调拨，专供下一阶段实验之用。目前，安装与调试工作正按计划推进，第一轮试验预计于一个月后启动。特斯拉教授本人仍照常主持实验室日常工作，相关成果将另行通报。\n\n§Y（全俄罗斯电网故障排查小游戏现已解锁，可在决议栏中的特斯拉电气决议组内进入）§!"
 RUS_stalin_flavour_events.3.a: "期待您的新发明！"
 RUS_stalin_flavour_events.3.b: "多讲讲特斯拉教授。"
 RUS_stalin_flavour_events.4.t: "基洛夫的梦"
 RUS_stalin_flavour_events.4.d: "自从谢尔盖·基洛夫最近在一条街道上被一本从高空坠落的畅销小说砸进医院后，他入睡后便一直在做一些超乎常理的梦：\n\n“这里是……列宁格勒？天好黑啊，也没有什么行人。别的同志都这么努力了，我也要加把劲一起干活呀。怎么感觉背后凉飕飕的，你是……啊！”\n\n“我的视线怎么怪怪的，那个士兵在汇报些什么？为什么这里的俄国士兵说的都是英语……我们在天上？！什么叫做‘Kirov reporting’？？？”"
 RUS_stalin_flavour_events.4.a: "基洛夫醒来后第一件事就是去了疗养院。"
 RUS_stalin_flavour_events.5.t: "尼古拉·特斯拉"
 RUS_stalin_flavour_events.5.d: "§Y生于：§!1856年7月10日；奥地利帝国、克罗地亚军事边区斯米连\n\n§Y背景：§!尼古拉·特斯拉出身塞尔维亚家庭，天生拥有极强的视觉想象力与过目不忘的记忆力。在格拉茨理工学院求学期间，特斯拉因痴迷交流电研究而荒废学业，最终未获学位，随后辗转于布达佩斯和巴黎工作。\n\n1884年，他带着推荐信投奔爱迪生，却因直流电与交流电的路线之争而决裂。此后他发明了异步电动机，并将交流电相关专利售予西屋公司。1893年芝加哥世博会上，他亲自用交流电点亮会场，一举击败爱迪生的直流电方案，使交流电成为日后的世界电力标准。\n\n在纽约建立实验室后，特斯拉又陆续发明了特斯拉线圈、早期无线电遥控船，并展开对X射线的研究。1895年，人类首座大型交流电发电站——尼亚加拉水电站建成。\n\n然而命运并未善待他。席卷美国的巨大股灾令他几乎破产，为维持生计，他不得不随通用电气的同行一道前往俄罗斯，协助当地电气化建设。\n\n抵达俄国后，特斯拉很快发现各地电压、频率、相制混乱不堪，身为“三相交流之父”，他几乎无法忍受这种局面。于是他主动向萨文科夫政府递交技术备忘录，力陈50赫兹三相制的绝对优势，并亲自参与改造了一批德制和美制的遗留设备，使它们得以在统一标准下互联。\n\n尽管已年逾耄耋，特斯拉依然整天泡在实验室里，反复调试设备，一心想要完成向全球输电的宏愿。"
 RUS_stalin_flavour_events.5.a: "感谢您的付出！"
 RUS_stalin_flavour_events.6.t: "一桩荒唐事"
 RUS_stalin_flavour_events.6.d: "亚历山大·费奥多罗维奇·克伦斯基先生，前俄罗斯共和国总统、全俄劳联的“天然领袖”，眼下正困在纽约一套带大落地窗的公寓里。这里的家具是租的，壁纸是廉价的花纹，但每天傍晚，他会把窗帘拉开一条缝，让过路的人看见他正坐在书桌前奋笔疾书，仿佛他还在指挥着千军万马。事实上，他唯一的部队是几支旧钢笔，唯一的战线是批评萨文科夫的报纸，他用墨水把报纸上萨文科夫的画像描得面目全非，又在下面写上：“弑君者、寡头、独夫、国贼”。做完这一切，他会朝玻璃呵一口气，写下自己名字的首字母，然后满意地上床睡觉。没有人回头多看他一眼，但他对此十分满足，仿佛那层雾气上的字母已经昭告了天下：本人即将回国复位，奇迹就在明天。\n\n萨文科夫垮台的消息，是女仆从菜市场捡回的一张旧报纸上读到的。克伦斯基先生激动得打翻了墨水瓶，紫蓝色的墨水浇透了波斯地毯。他命令女仆立刻收拾行李：他要回国，要接管全俄劳联，要在冬宫前发表演说。女仆低着头说，先生，港口封了，美国打内战了。他先是斥责她胡说八道，然后跑上屋顶，亲眼看见哈德逊河上停着军舰，第九大道上垒起了街垒，远处有沉闷的炮声。他回到屋里，把行李箱中的礼服一件件拿出来又一件件挂回去，来回折腾了六遍，仿佛能看到他曾经的得体。他不停的张望窗外，盼着全俄劳联的官员来接他，但是窗外没有他所期盼的，只有纽约，而现在纽约也不像纽约，像一座围城。\n\n从此，他过上了更神经质的生活。他每天早上第一件事是查报纸，确信工人国会没有占领纽约；然后给旧日的社革同志们写信，信的开头总是“亲爱的老友”，但寄出的信大多被退了回来。他给麦克阿瑟的电报如石沉大海，给俄国大使的请求没有得到任何答复。他把这一切归结于女仆偷懒、情人不用心，以及纽约的邮差都是工团派来的探子。他开始砸花瓶，先砸便宜的，再砸贵重的。女仆被他赶走了，情人也渐渐不来。他一个人走在空荡荡的公寓里，从客厅走到书房，又从书房走进厨房，像一只被关在铁笼里的困兽。"
 RUS_stalin_flavour_events.6.a: "……"
 RUS_stalin_flavour_events.7.t: "一桩荒唐事"
 RUS_stalin_flavour_events.7.d: "有一天，枪声和呐喊声忽然从街角涌过来，比以往任何一次都近。克伦斯基先生从沙发上弹起来，贴着窗帘往下看，只见一群衣衫褴褛的人挥舞着红旗，正从街口冲过来。他的脸色一瞬间比窗外的积雪还白。他认定美利坚工人国会的暴徒打过来了，他们是来抓他的，要把他交到俄国，使他在冬宫的台阶上正法。他跌跌撞撞跑进厨房，抓起一把面包刀，对着镜子比划了半天。他把刀尖抵在自己瘦削的胸脯上，但手抖得厉害。他试了三回，每一回都在皮肤上留下一个浅浅的红印。第四回，他忽然哭起来，刀脱了手，哐当一声掉进灶火里，打翻了油灯。\n\n火先是趴在油布上喘口小气，然后爬上窗帘伸个懒腰，最后在满地的旧信纸间撒腿狂奔。克伦斯基先生试图用脚踩灭它，拖鞋却着了火；他跳着跑向门口，发现门被自己反锁了，钥匙留在卧室抽屉里。他冲向阳台，想沿着排水管爬下去，但排水管锈得轻轻一碰就断成两截。他站在阳台上，火光在背后升起，整整三分钟里，他放弃了所有尊严，像一头被追打的野狗般哀嚎着“救命”。然而街上的人正忙着听见枪声和呐喊声，没有人听得见一个俄国人的尖叫。\n\n他的尸体是第二天早晨被清理火场的人拖出来的。两个背着步枪的士兵站在烧焦的公寓前，对照着一份从涅瓦河畔送来的花名册。一个士兵念道：“亚历山大·费奥多罗维奇·克伦斯基，前俄国的总统。”另一个士兵探头看了看焦黑的尸体，皱了皱眉：“这个？这看起来根本没有应有的体面。”第一个士兵又念了一遍花名册底下的备注：“如果发现此人，务必逮捕并押送回国。”他们翻了翻尸体的口袋，只有一把烧变形的钥匙和半盒没烧完的火柴。两个人商量了一下，决定先拍照交差。他们找来了随军记者，把尸体拖出废墟，用绳子缚住脚踝，倒挂在街角一根焦黑的电线杆上。记者拍了一张照片，为了避免弄脏相机还特意后退了两步。镜头里，那具尸体在风中晃了几下，像一个被人扔掉的旧木偶，背后是仍在冒烟的街区。\n\n照片传回彼得格勒，编辑们围在冲洗室里看。有人问：“这人是谁？”年纪最大的编辑眯起眼睛，看不出半张被火熏得面目全非的脸，报纸于第三天在不起眼的版面刊登了这幅照片。没有多少人注意到，因为美国内战比一个过气政客的死有趣得多。倒是有一位在工地里讨生活的独眼老头，盯着报纸看了很久，最后说：“这照片上的家伙，倒有几分像克伦斯基。”他旁边的人笑了："
 RUS_stalin_flavour_events.7.a: "“克伦斯基？谁是克伦斯基？”"
 RUS_tesla_appointment_clause_socialist: "人民委员会正式委托"
 RUS_tesla_appointment_clause_default: "俄罗斯政府正式委托"
 RUS_tesla_electrical_industries: "特斯拉电气"
 RUS_tesla_electrical_industries_desc: "由特斯拉教授主持建立的技术团队已经发展为独立的电气工业机构，并将继续推进统一电力标准、远距离输电与全国电气化工程。"
