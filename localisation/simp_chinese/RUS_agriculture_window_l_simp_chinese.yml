l_simp_chinese:
 RUS_agri_window_open:0 "国家农业系统"
 RUS_agri_window_open_desc:0 "点击打开农业生产、农机生产、贸易与农业建设界面。"
 RUS_agri_window_open_tt:0 "§Y国家农业系统§!\n点击打开农业生产、农机生产、贸易与农业建设界面。"
 RUS_agri_window_support:0 "季度援助"
 RUS_agri_window_development:0 "农业建设"
 RUS_agri_window_support_status:0 "本季已用支援：§Y[?RUS_nat_support_count|0] / 4§!"
 RUS_agri_window_development_status:0 "可用土改分数：§Y[?RUS_agri_spendable_score|0]§!\n国内限时项目：§Y[?RUS_agri_domestic_active_count|0] / 2§!"
 RUS_agri_window_development_locked:0 "成功完成土地改革后，可在此开展农业建设。"
 RUS_agri_window_guide_label:0 "经营指南"
 RUS_agri_window_shutdown_label:0 "关闭国家农业系统"
 RUS_agri_window_shutdown_desc:0 "土地改革的目标已超额完成，可将日常生产交由常设机构负责。此决定不可撤销。"
 RUS_agri_window_shutdown_effect:0 "永久停止国家农业系统的每日运行、季度结算与提醒，并关闭经营面板；释放系统占用的民用工厂，移除季度经营产生的年度临时修正。已取得的土地改革阶段成果和其他独立奖励保留。"
 RUS_agri_window_RUS_nat_guide_decision_label:0 "经营指南"
 RUS_agri_window_RUS_nat_guide_decision_tt:0 "§Y经营指南§!\n查阅生产配置、国内供给、储备、出口与土地改革的经营流程。\n\n[!nat_action_RUS_nat_guide_decision_click_enabled]\n[!nat_action_RUS_nat_guide_decision_click]"
 RUS_agri_window_RUS_nat_support_food_label:0 "跨区粮食调运"
 RUS_agri_window_RUS_nat_support_food_tt:0 "§Y跨区粮食调运§!\n增加4单位小麦库存。每季限一次，农业支援每季最多四项，每项降低2%稳定度，乌斯季诺夫任职时降低1%。\n\n[!nat_action_RUS_nat_support_food_click_enabled]\n[!nat_action_RUS_nat_support_food_click]"
 RUS_agri_window_RUS_nat_support_processing_label:0 "补充加工原料"
 RUS_agri_window_RUS_nat_support_processing_tt:0 "§Y补充加工原料§!\n增加2单位甜菜库存。每季限一次，农业支援每季最多四项，每项降低2%稳定度，乌斯季诺夫任职时降低1%。\n\n[!nat_action_RUS_nat_support_processing_click_enabled]\n[!nat_action_RUS_nat_support_processing_click]"
 RUS_agri_window_RUS_nat_support_textiles_label:0 "保障纺织原料"
 RUS_agri_window_RUS_nat_support_textiles_tt:0 "§Y保障纺织原料§!\n亚麻、棉花库存各增加1.5单位。每季限一次，农业支援每季最多四项，每项降低2%稳定度，乌斯季诺夫任职时降低1%。\n\n[!nat_action_RUS_nat_support_textiles_click_enabled]\n[!nat_action_RUS_nat_support_textiles_click]"
 RUS_agri_window_RUS_nat_support_technical_label:0 "派驻农业技术组"
 RUS_agri_window_RUS_nat_support_technical_tt:0 "§Y派驻农业技术组§!\n本季作物产量+5%。每季限一次，农业支援每季最多四项，每项降低2%稳定度，乌斯季诺夫任职时降低1%。\n\n[!nat_action_RUS_nat_support_technical_click_enabled]\n[!nat_action_RUS_nat_support_technical_click]"
 RUS_agri_window_RUS_nat_support_repair_label:0 "农机集中检修"
 RUS_agri_window_RUS_nat_support_repair_tt:0 "§Y农机集中检修§!\n本季农机损耗率§G-5%§!。每季限一次，农业支援每季最多四项，每项降低2%稳定度，乌斯季诺夫任职时降低1%。\n\n[!nat_action_RUS_nat_support_repair_click_enabled]\n[!nat_action_RUS_nat_support_repair_click]"
 RUS_agri_window_RUS_nat_support_emergency_label:0 "启动应急粮食采购"
 RUS_agri_window_RUS_nat_support_emergency_tt:0 "§Y启动应急粮食采购§!\n结算时补足粮食内需缺口，最多补充§Y4§!单位，使粮食内需满足率最高补至§Y90%§!。\n\n不产生可出口余粮。每季限一次，农业支援每季最多四项，每项降低2%稳定度，乌斯季诺夫任职时降低1%。\n\n[!nat_action_RUS_nat_support_emergency_click_enabled]\n[!nat_action_RUS_nat_support_emergency_click]"
 RUS_agri_window_RUS_agri_exchange_rations_label:0 "改善城乡配给"
 RUS_agri_window_RUS_agri_exchange_rations_tt:0 "§Y改善城乡配给§!\n将土地改革与农业经营积累的成果用于巩固生产与社会保障。\n\n8 土改分\n[!nat_action_RUS_agri_exchange_rations_click_enabled]\n[!nat_action_RUS_agri_exchange_rations_click]"
 RUS_agri_window_RUS_agri_exchange_mechanisation_label:0 "推广农业机械"
 RUS_agri_window_RUS_agri_exchange_mechanisation_tt:0 "§Y推广农业机械§!\n将土地改革与农业经营积累的成果用于巩固生产与社会保障。\n\n10 土改分\n[!nat_action_RUS_agri_exchange_mechanisation_click_enabled]\n[!nat_action_RUS_agri_exchange_mechanisation_click]"
 RUS_agri_window_RUS_agri_exchange_reserves_label:0 "充实国家军粮储备"
 RUS_agri_window_RUS_agri_exchange_reserves_tt:0 "§Y充实国家军粮储备§!\n将土地改革与农业经营积累的成果用于巩固生产与社会保障。\n\n8 土改分\n[!nat_action_RUS_agri_exchange_reserves_click_enabled]\n[!nat_action_RUS_agri_exchange_reserves_click]"
 RUS_agri_window_RUS_agri_exchange_materials_label:0 "保障轻工业原料"
 RUS_agri_window_RUS_agri_exchange_materials_tt:0 "§Y保障轻工业原料§!\n将土地改革与农业经营积累的成果用于巩固生产与社会保障。\n\n10 土改分\n[!nat_action_RUS_agri_exchange_materials_click_enabled]\n[!nat_action_RUS_agri_exchange_materials_click]"
 RUS_agri_window_RUS_agri_exchange_export_label:0 "农产品出口创汇"
 RUS_agri_window_RUS_agri_exchange_export_tt:0 "§Y农产品出口创汇§!\n将土地改革与农业经营积累的成果用于巩固生产与社会保障。\n\n6 土改分\n[!nat_action_RUS_agri_exchange_export_click_enabled]\n[!nat_action_RUS_agri_exchange_export_click]"
 RUS_agri_window_RUS_agri_exchange_machinery_label:0 "追加农机调度"
 RUS_agri_window_RUS_agri_exchange_machinery_tt:0 "§Y追加农机调度§!\n将土地改革与农业经营积累的成果用于巩固生产与社会保障。\n\n4 土改分\n[!nat_action_RUS_agri_exchange_machinery_click_enabled]\n[!nat_action_RUS_agri_exchange_machinery_click]"
 RUS_agri_window_RUS_agri_exchange_storage_label:0 "改善仓储运输"
 RUS_agri_window_RUS_agri_exchange_storage_tt:0 "§Y改善仓储运输§!\n将土地改革与农业经营积累的成果用于巩固生产与社会保障。\n\n4 土改分\n[!nat_action_RUS_agri_exchange_storage_click_enabled]\n[!nat_action_RUS_agri_exchange_storage_click]"
