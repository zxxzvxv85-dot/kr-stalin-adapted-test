 RUS_agri_window_RUS_nat_close_system_tt:0 "§Y关闭国家农业系统§!\n土地改革的目标已超额完成，可将日常生产交由常设机构负责。此决定不可撤销。\n\n[!nat_action_RUS_nat_close_system_click_enabled]\n[!nat_action_RUS_nat_close_system_click]"
