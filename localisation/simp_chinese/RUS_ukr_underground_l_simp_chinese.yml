 RUS_ukr_land:0 "散发土地账册"
 RUS_ukr_land_cost:0 "[RUSUkrLandCost]"
 RUS_ukr_land_desc:0 "政治点：25；警戒达到50时另加10。组织力量：10。乌克兰土地改革得分达到70时，另加10政治点和5组织力量。历时30天。结束或取消后冷却120天。\n结算：政府警戒+10；乌克兰稳定度−5%、动员速度−10%，持续90天；乌克兰完成“清洗共和派同情者”后额外警戒+5。\n条件失效时取消，不退已支付资源；移除行动的消费品负担。"
 RUS_ukr_land_result_tt:0 "启动30天行动；到期结算。政府警戒+10；乌克兰稳定度−5%、动员速度−10%，持续90天；乌克兰完成“清洗共和派同情者”后额外警戒+5。"
 RUS_ukr_slowdown:0 "组织铁路怠工"
