 RUS_ukr_status:0 "乌克兰地下工作：[?RUS_ukr_strength|0]组织／[?RUS_ukr_alert|0]警戒"
 RUS_ukr_status_desc:0 "矿区：[RUSUkrMineState]　乡村：[RUSUkrRuralState]　铁路：[RUSUkrRailState]\n当前：[RUSUkrActionState]　剩余[?RUS_ukr_days|0]天\n封锁剩余：[?RUS_ukr_lockdown_days|0]天\n和平期间连续闲置30天，警戒−5。警戒达到50，除转移干部外的行动另收10政治点；达到80，和平行动结束时触发搜捕。\n搜捕事件文案暂留空：第一个选项紧急撤离，第二个选项放弃据点。网络不会因正常取消而丢失。"
