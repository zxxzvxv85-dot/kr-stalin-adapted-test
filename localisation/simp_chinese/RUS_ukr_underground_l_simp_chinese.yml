l_simp_chinese:
 RUS_ukr_families:0 "接济起义者家属"
 RUS_ukr_families_cost:0 "[RUSUkrFamiliesCost]"
 RUS_ukr_families_desc:0 "起义虽已失败，幸存者的家属却不应被遗忘。通过可靠的中间人给予援助，可以重新取得他们的信任。"
 RUS_ukr_mine:0 "重建顿巴斯矿工互助会"
 RUS_ukr_mine_cost:0 "[RUSUkrMineCost]"
 RUS_ukr_mine_desc:0 "顿巴斯的矿井仍聚集着大批工人。重建互助组织，将为彼此孤立的地下小组建立联系。"
 RUS_ukr_rural:0 "联络乡村社会主义残部"
 RUS_ukr_rural_cost:0 "[RUSUkrRuralCost]"
 RUS_ukr_rural_desc:0 "乡村中的斗争派与其他社会主义残部尚未销声匿迹。谨慎的联络将为双方寻找合作的余地。"
 RUS_ukr_rail:0 "恢复铁路工人联络"
 RUS_ukr_rail_cost:0 "[RUSUkrRailCost]"
 RUS_ukr_rail_desc:0 "铁路连接着乌克兰的城市与工业区，也能重新连接分散的工人组织。"
 RUS_ukr_relocate:0 "掩护地下干部转移"
 RUS_ukr_relocate_cost:0 "[RUSUkrRelocateCost]"
 RUS_ukr_relocate_desc:0 "警察正在逼近。暂缓公开活动，将受到注意的干部转移到安全地点，能够保住已有的联络。"
 RUS_ukr_declaration:0 "刊印地下联合宣言"
 RUS_ukr_declaration_cost:0 "[RUSUkrDeclarationCost]"
 RUS_ukr_declaration_desc:0 "共同的宣言不必掩盖彼此的分歧，却可以让分散的反对力量第一次以共同的声音发言。"
 RUS_ukr_strike:0 "资助矿区停工"
 RUS_ukr_strike_cost:0 "[RUSUkrStrikeCost]"
 RUS_ukr_strike_desc:0 "矿区的不满正在积累。为工人提供罢工所需的援助，可以使盖特曼政府切实感受到压力。"
 RUS_ukr_land:0 "散发土地账册"
 RUS_ukr_land_cost:0 "[RUSUkrLandCost]"
 RUS_ukr_land_desc:0 "土地分配留下的旧账仍在乡间流传。将账册交到农民手中，可以重新唤起尚未平息的争议。"
 RUS_ukr_slowdown:0 "组织铁路怠工"
 RUS_ukr_slowdown_cost:0 "[RUSUkrSlowdownCost]"
 RUS_ukr_slowdown_desc:0 "一次误点或许只是偶然，接连不断的延误却足以扰乱整个运输体系。铁路工人的配合将使这种压力持续下去。"
 RUS_ukr_night:0 "第聂伯之夜"
 RUS_ukr_night_cost:0 "[RUSUkrNightCost]"
 RUS_ukr_night_desc:0 "战争已经到来。沿第聂伯河埋下的联络线将同时行动，把长久的准备化为前线能够利用的机会。"
