 RUS_ukr_raid_evacuate_tt:0 "支付30政治点，生活消费品工厂系数+4%，持续30天；组织力量−10，保留全部联络网，警戒回到40。"
 RUS_ukr_raid_abandon_tt:0 "组织力量−25；随机一个有效联络网停用90天；警戒回到40。若行动条件已失效，本事件不再结算。"
 RUS_ukr_unlock_tt:0 "解锁乌克兰地下工作外交决议：建立联络网，积累组织力量并管理政府警戒。"
