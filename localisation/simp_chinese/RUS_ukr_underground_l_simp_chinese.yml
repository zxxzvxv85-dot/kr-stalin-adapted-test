 RUS_ukr_strike:0 "资助矿区停工"
 RUS_ukr_strike_cost:0 "[RUSUkrStrikeCost]"
 RUS_ukr_strike_desc:0 "政治点：30；警戒达到50时另加10。组织力量：15。行动期间生活消费品工厂系数：+2%。历时30天。结束或取消后冷却120天。\n结算：政府警戒+15；乌克兰稳定度−3个百分点（本局最多三次），工厂产出−5%，持续90天；乌克兰完成“清洗共和派同情者”后额外警戒+5。\n条件失效时取消，不退已支付资源；移除行动的消费品负担。"
