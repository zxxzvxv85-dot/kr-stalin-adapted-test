 RUS_ukr_night:0 "第聂伯之夜"
 RUS_ukr_night_cost:0 "[RUSUkrNightCost]"
 RUS_ukr_night_desc:0 "政治点：50；警戒达到50时另加10。步兵装备：1000。组织力量：40起，启动时冻结全部组织力量。历时7天。成功后不可重复。\n结算：按冻结组织力量40–59／60–79／80–100档，乌克兰补给效率−10%／−15%／−20%、组织度恢复−5%／−10%／−15%，持续30／45／60天；冻结矿区网追加工厂产出−10%，乡村网追加动员速度−20%，铁路网追加俄罗斯对乌克兰攻击+5%。清除本系统和平减益。警戒升至100并封锁90天，结束后回到40。\n取消时退回冻结组织力量，不退政治点和装备。"
 RUS_ukr_night_result_tt:0 "启动7天行动；到期结算。按冻结组织力量40–59／60–79／80–100档，乌克兰补给效率−10%／−15%／−20%、组织度恢复−5%／−10%／−15%，持续30／45／60天；冻结矿区网追加工厂产出−10%，乡村网追加动员速度−20%，铁路网追加俄罗斯对乌克兰攻击+5%。清除本系统和平减益。警戒升至100并封锁90天，结束后回到40。"
