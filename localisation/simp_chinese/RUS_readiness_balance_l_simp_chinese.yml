 RUS_readiness_decay_tt:0 "§Y准备度每月维护§!\n合计：§R−[?RUS_readiness_decay_total|2]§!\n军改（40%）：−[?RUS_readiness_decay_army|2]\n五年计划（35%）：−[?RUS_readiness_decay_plan|2]\n土改（25%）：−[?RUS_readiness_decay_land|2]\n\n月扣减四舍五入至0.1点。\n月扣减＝2 × 三项未完成比例的加权平均。\n军改按4阶段计算；五年计划150分、土改200分视为完成。土改已成功完成时免除该项。\n无基础衰减，每月最多扣2点，三项完成后不扣。仅适用于本路线，每月结算；积分兑换后按剩余积分计算。"
