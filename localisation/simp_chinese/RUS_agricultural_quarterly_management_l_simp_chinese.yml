 RUS_agricultural_management.1.t:0 "年度农业经营结算"
 RUS_agricultural_management.1.d.shortfall:0 "本年度的经营账簿已经汇总完毕。年末本金仅余§Y[?RUS_agri_annual_ending_capital|1]§!，本年度经营出现明显亏空。国家必须从民用经济中调拨资源填补缺口，下一年度的经营机构也将面临更严格的审查。"
 RUS_agricultural_management.1.d.balanced:0 "本年度的经营账簿已经汇总完毕。年末本金为§Y[?RUS_agri_annual_ending_capital|1]§!，大体维持了收支平衡。计划没有带来值得庆祝的盈余，但也没有给国家经济留下新的负担。"
 RUS_agricultural_management.1.d.surplus:0 "本年度的经营账簿已经汇总完毕。年末本金达到§Y[?RUS_agri_annual_ending_capital|1]§!，经营机构向国家上缴了一笔稳定盈余。这些结余足以在下一年度减轻部分民用经济负担。"
 RUS_agricultural_management.1.d.bumper:0 "本年度的经营账簿已经汇总完毕。年末本金达到§Y[?RUS_agri_annual_ending_capital|1]§!，远超最初投入。农业经营计划不仅带来了丰厚盈余，也为全国建设部门腾出了更多物资与设备。"
 RUS_agricultural_management.1.a:0 "核准账目，开始下一年度。"
 RUS_agri_emergency_annual_cap_tt:0 "§Y本年度曾动用紧急垫款，年度奖励最高只能达到中档盈余。§!"
