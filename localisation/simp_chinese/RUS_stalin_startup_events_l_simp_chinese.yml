l_simp_chinese:
  rus_stalin_startup_events.1.t: "伏尔加大饥荒的遗产"
  rus_stalin_startup_events.1.desc: "内战结束后，最令当代俄罗斯人刻骨铭心的，除了那场惨败的远东作战，便是1932年席卷伏尔加河流域的大饥荒。\n\n1932年春夏，伏尔加河流域遭遇了罕见的干旱。自5月起，几乎不见一场透雨；7月的酷热烤焦了田间的幼苗，本该金黄的麦田变成了灰褐色的荒原。当年伏尔加河中下游三十余县的谷物收成不足正常年份的两成。一位奉命视察的官员在报告中写道：“此地已非人间，所见皆是枯骨与绝望。”\n\n饥饿迅速蔓延。人们剥树皮、煮草根，甚至将粘土磨成粉充饥。牲畜因缺乏饲料成批倒毙，村庄里连鸡犬之声都绝迹了。据不完全统计，仅1932年冬至1933年春，伏尔加地区就有数十万人死于饥饿。逃荒的人群沿着铁路线涌向莫斯科，沿途倒毙者无人掩埋。"
  rus_stalin_startup_events.1.desc_2: "这场饥荒带来的社会后果极其深远。\n\n首先，农村的社会结构被彻底撕裂。原本就脆弱的中农阶层几乎绝迹——他们或在饥荒中破产，或被迫卖掉最后一点口粮以求活命，绝大多数沦为了贫农。富农则趁饥荒囤积粮食、放高利贷、以极低的价格兼并土地和农具，贫富差距在一季之间拉大到了令人瞠目的地步。农民之间过去那种朴素的互助关系荡然无存，取而代之的是赤裸裸的生存竞争。\n\n其次，农民对执政者的信任跌至冰点。立宪民主党“自由带来自由”的政治宣言不再有人相信，农民们转而投身于保卫联盟的民粹运动。他们相信“农民的英雄”萨文科夫能够带领他们重新夺回土地。这场饥荒也因此成为萨文科夫后来得以掌权的重要原因之一。\n\n最后，这场饥荒以最残酷的方式凸显了土地改革的紧迫性。经过这场浩劫，俄罗斯的土地结构已经脆弱得像一根随时会断裂的琴弦，再也经不起任何折腾。\n\n如果再不改变农村的生产关系和分配制度，下一次饥荒只会更加可怕——而届时，恐怕连“重新开始”的机会都不会有了。"
  rus_stalin_startup_events.next: "继续。"
  rus_stalin_startup_events.1.a: "绝不让悲剧重演！"
