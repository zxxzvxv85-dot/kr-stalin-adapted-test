 RUS_future_foreign_037_desc:0 "乌克兰人民正在反动当局的残暴统治下苦苦挣扎。粮食被征走，工厂被军管，任何抗议都被冠以“叛国”之名。乌共（布）与社革（斗争派）已在我们的倡议下进行协同合作，期待他们未来的成果。"
 RUS_future_foreign_036_desc:0 "在白俄罗斯，我们的同志们缺枪少弹，却要在沼泽与森林之间对抗装备精良的政府军——于情于理，我们都应当给予相当的援助，以保证他们的长期活动。"
 RUS_future_foreign_008_desc:0 "别等上苍发慈悲！\n\n愿为真理献生命。\n\n我们这些人，在今生，\n\n只随真理向前进！\n\n战斗仍将继续！"
 RUS_future_foreign_020_desc:0 "波罗的海总是与民族问题交织——德意志人、爱沙尼亚人、拉脱维亚人、立陶宛人……不同民族的文化被强行捏合在一起，形成了一个畸形而脆弱的拼图。我们有理由支持当地的民族解放运动——但这只是第一步，社会主义才是我们最终的目标。"
 RUS_future_foreign_022_desc:0 "高加索山脉在民族仇杀的泥潭中沉沦至今，可怜的山民们往往只是在压迫与被压迫中循环往复——今天被反动的将军们镇压，明天又被民族主义的政客们煽动。我们的同志们正在努力，我们要做的则是提供力所能及的帮助。"
 RUS_future_foreign_021_desc:0 "波兰问题曾被社会主义者们反复争论。如今面对既定的事实，波兰革命委员会已向一切社会主义者发出呼吁：共同反对德意志帝国主义——哪怕此时，他们自己仍不得不屈身事贼。"
 RUS_future_foreign_051_desc:0 "在俄罗斯为这个时代中的伟大战争，即彻底斩杀德皇的九头蛇做好准备之前，为了将东欧从德国的专政中解救出来，我们还有很多事要做，要塞、军工，一切都需要准备。"
 RUS_future_foreign_062_desc:0 "华沙的人民已率先举起义旗——我们怎能辜负他们的信任？我们将保卫我们的无产阶级同胞，就如同保卫我们自己！"
 RUS_future_foreign_010_desc:0 "中日俄三国革命者关系由来已久，奈何天不遂人愿——远东至今仍在欧罗巴与亚细亚的帝国主义间徘徊，但我们能肯定，未来的远东必将是赤旗之寰宇。"
 RUS_future_foreign_025_desc:0 "中国的革命者们取得了难以想象的成就:在华东的混乱局势中，曾折戟沉沙的国民革命军将红旗插上了南京城头，而我们将会保证它永远不会落下。"
 RUS_future_foreign_011_desc:0 "日本的帝国主义者至今还拿着泛亚共荣的画皮伪装自己，我们还有什么理由让日本人民在欺骗和暴力中沉沦？是时候揭露这场骗局的真相了！"
 RUS_future_foreign_026_desc:0 "反动的奉系军阀至今盘踞着满洲，但东北人民可不会就此承认帝国主义的特权，在有效组织下，所有反对帝国主义的同志们将在同一面旗帜下集结……"
 RUS_future_foreign_039_desc:0 "第一次北伐时期，光荣的布尔什维克军事代表团就曾指导过国民革命军的政治工作，如今布柳赫尔元帅的提议可谓恰到好处——我们理应为中国革命献出自己的一份力量。"
 RUS_future_foreign_061_desc:0 "反动的资产阶级国家永远不能理解无产阶级国家间的高尚情谊，我们也永远不会断绝与其他无产阶级国家的联系与沟通。"
 RUS_future_foreign_054_desc:0 "实现全世界无产阶级的大联合，并非只是所有革命者的一厢情愿——如果条件允许，谁不想要一个跨越世界的无产阶级联盟呢？"
 RUS_future_foreign_060_desc:0 "秉承着相同的建军理念，我们自然和东方的朋友们有着更多的，可以相互促进的军事经验交流，我们相信这将收获颇丰。"
 RUS_future_foreign_063_desc:0 "面对一个统一的大中国，我们承诺援助建设一批骨干工业项目:钢铁、机械、能源、化工、军工……这些美丽的工厂将会在神州大地展现自己的色彩。"
 RUS_future_foreign_027_desc:0 "基于两国人民利益和远东和平的共同愿望，中苏两国以友好合作精神，共同防止帝国主义之野心……"
 RUS_future_foreign_055_desc:0 "日本帝国侵占亚洲一天，泛亚之革命便一天不能实现，不能再犹豫了，必须要出重拳！"
 RUS_future_foreign_052_desc:0 "光荣的伊朗人民正朝着现代化跃进。为了保证南方革命的续存，我们有义务为中东革命添砖加瓦。"
 RUS_future_foreign_053_desc:0 "作为亚洲的十字路口，古老的阿富汗仍被宗教与自然所困扰，是时候结束这一切了——苏维埃将引领人民走向解放。"
 RUS_future_foreign_038_desc:0 "南亚的革命者们终于扫除了伟大革命的最后阻碍，作为世界革命的一部分，这的确是一场伟大的胜利。"
