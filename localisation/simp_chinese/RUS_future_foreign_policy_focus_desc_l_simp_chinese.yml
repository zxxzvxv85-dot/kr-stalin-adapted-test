l_simp_chinese:
 RUS_future_foreign_002_desc:0 "在西方，仍有同志与我们坚守着同一理想。尽管他们之中有些人在路线问题上与我们存在分歧，甚至偏离了我们所理解的“正统”——但若真正致力于摧毁帝国主义体系，我们便必须放下成见"
 RUS_future_foreign_003_desc:0 "作为横跨欧亚的国家，俄罗斯始终保留着与东方交流的窗口。亚洲的革命政党，大多与布尔什维克等俄罗斯本土政党有着深浅不一的渊源。相较于分歧渐生的西方朋友，来自东方的友人与我们之间，显然有着更多可以共同言说的议题。"
 RUS_future_foreign_016_desc:0 "无产阶级国家之间的协作，理应是毫无保留的、通力向前的。理论上，我们共享同一个目标；现实中，技术水平的落差却不容回避。俄罗斯目前仍与第三国际的主流技术标准保持着一段可见的距离——为了赶上领先多年的同志们，我们必须付出更多努力。"
 RUS_future_foreign_017_desc:0 "与西方的贸易往来，进展比预想中更为顺利。这一次，或许我们应当更主动一些——在既有贸易框架的基础上，与第三国际主要成员展开更为广泛的交流与洽谈。除公社外，伦敦方面亦对本协议表达了浓厚兴趣。我们有理由相信，这将成为无产阶级国家间交往的一座里程碑。"
 RUS_future_foreign_032_desc:0 "“批判的武器不能替代武器的批判。”——在全世界反动派的环伺之下，唯有力量才能守住阵地。俄罗斯的军事建设正在恢复，但这恢复不能仅靠一己之力。和西方同志在技术层面的互通有无，将使我们的国防建设愈发完善。"
 RUS_future_foreign_046_desc:0 "德意志帝国主义的威胁与日俱增。普鲁士军国主义的铁蹄何时会再次踏向革命——没有人能给出确切的答案。或许与法兰西公社间相互的独立保障，将成为我们面对帝国主义的最后一道防线……"
 RUS_future_foreign_047_desc:0 "“各尽其能，各取所需”——在理想的共产主义社会中，这将是毋庸置疑的基本保障。尽管这一原则在国内尚不具备全面推行的条件，但在无产阶级国家的交往中，我们应当率先践行这一准则。"
 RUS_future_foreign_056_desc:0 "世界革命的浪潮不可阻挡。从欧洲到亚洲，从工厂到田野，无产阶级的旗帜正在更多土地上竖起。帝国主义的墙壁终将倒塌，改良主义的迷雾终将散去，机会主义的背叛终将被历史清算。革命的火种正在从一处传向另一处，直至点燃每一片大陆……"
