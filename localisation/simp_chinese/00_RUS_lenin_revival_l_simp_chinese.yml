l_simp_chinese:
 RUS_lenin_revival_focus:0 "列宁复活线"
 RUS_lenin_revival_category:0 "列宁复活线"
 RUS_lenin_revival_category_desc:0 "关于那个本应死去、却重新出现在车站的男人。"
 RUS_LR_enable_easter_egg:0 "是否启用彩蛋事件/线路"
 RUS_LR_enable_easter_egg_desc:0 "在历史的缝隙里，某些本应结束的故事仍在继续。启用后，将触发一条关于归国者的彩蛋事件线。"
 RUS_LR_return_to_the_urals:0 "久有凌云志，重上乌拉尔"
 RUS_LR_return_to_the_urals_desc:0 "多年流亡之后，布尔什维克的旗帜再次出现在乌拉尔。列宁的归来不是偶然，而是历史欠下的一笔债。"
 RUS_LR_proclaim_the_return:0 "宣告布尔什维克的回归！"
 RUS_LR_proclaim_the_return_desc:0 "在工厂、车站与苏维埃的讲台上，布尔什维克公开宣告：俄国革命尚未结束。"
 RUS_LR_rally_old_bolsheviks:0 "联络老布尔什维克们"
 RUS_LR_rally_old_bolsheviks_desc:0 "从西伯利亚的流放地到巴黎的阁楼，一封封密信把散落各地的老同志重新串联起来。"
 RUS_LR_russias_present_and_future:0 "俄罗斯的现状与未来"
 RUS_LR_russias_present_and_future_desc:0 "共和国满目疮痍：战争、饥荒与派系倾轧。革命者必须先看清脚下这片土地。"
 RUS_LR_socialism_in_russia:0 "社会主义在俄罗斯"
 RUS_LR_socialism_in_russia_desc:0 "社会主义不是舶来品。它必须从俄国的工人、农民与士兵中生长出来。"
 RUS_LR_revolutionary_orthodoxy:0 "革命正统"
 RUS_LR_revolutionary_orthodoxy_desc:0 "谁继承了十月？谁背叛了十月？在这场争论中，正统本身就是武器。"
 RUS_LR_bolsheviks_enter_parliament:0 "俄共（布）到达议会"
 RUS_LR_bolsheviks_enter_parliament_desc:0 "布尔什维克代表走进议会大厅，不是为了妥协，而是为了从内部拆毁旧国家。"
 RUS_LR_unshakable_dictatorship:0 "无产阶级专政不可动摇"
 RUS_LR_unshakable_dictatorship_desc:0 "没有专政，就没有革命；没有革命，就没有俄罗斯的明天。"
 RUS_LR_critique_revisionism:0 "批判修正主义思想"
 RUS_LR_critique_revisionism_desc:0 "改良主义者的甜言蜜语，是埋葬革命的另一种方式。"
 RUS_LR_reconcile_zinoviev_kamenev:0 "劝解季诺维也夫与加米涅夫"
 RUS_LR_reconcile_zinoviev_kamenev_desc:0 "两位老同志仍在犹豫。革命不能等待迟疑者，但也不应轻易抛弃他们。"
 RUS_LR_bolsheviks_and_sr:0 "布尔什维克与社会革命党"
 RUS_LR_bolsheviks_and_sr_desc:0 "社革党人谈论土地与自由，却害怕工人掌握政权。合作与决裂只隔着一层薄纸。"
 RUS_LR_lessons_of_october:0 "吸取十月革命的教训"
 RUS_LR_lessons_of_october_desc:0 "十月不是一次暴动，而是一门必须被反复学习的艺术。"
 RUS_LR_peasants_and_workers:0 "农民与工人"
 RUS_LR_peasants_and_workers_desc:0 "俄国的大多数是农民。没有农民的支持，工人的国家只是一座孤岛。"
 RUS_LR_criticize_trotsky:0 "批评托洛茨基"
 RUS_LR_criticize_trotsky_desc:0 "不断革命论者把党推向冒险。革命需要热情，也需要纪律。"
 RUS_LR_bukharins_return:0 "布哈林同志的回归"
 RUS_LR_bukharins_return_desc:0 "布哈林带着他的理论回来了。争论可以继续，但党必须保持统一。"
 RUS_LR_unreasonable_sr:0 "不可理喻的社会革命党"
 RUS_LR_unreasonable_sr_desc:0 "社革党人拒绝交出土地委员会，也拒绝承认苏维埃的权威。"
 RUS_LR_break_with_revisionism:0 "与修正主义划清界限"
 RUS_LR_break_with_revisionism_desc:0 "党必须清除那些把革命当作议会游戏的人。"
 RUS_LR_revolution_returns:0 "革命从地狱中回来了"
 RUS_LR_revolution_returns_desc:0 "革命者从流亡、监狱与地下状态中归来。旧国家将在内战中被彻底打碎。"
 RUS_LR_rethink_peasant_policy:0 "反思对农不当政策"
 RUS_LR_rethink_peasant_policy_desc:0 "余粮收集制把农民推向了敌人。革命必须学会与土地相处。"
 RUS_LR_mechanized_red_army:0 "机械化红军"
 RUS_LR_mechanized_red_army_desc:0 "拖拉机与坦克开进红军序列，战争的形式正在改变。"
 RUS_LR_peoples_army:0 "人民的队伍来了！"
 RUS_LR_peoples_army_desc:0 "工人、农民和士兵汇成洪流。革命军队的力量来自人民。"
 RUS_LR_win_peasant_support:0 "争取农民支持"
 RUS_LR_win_peasant_support_desc:0 "土地、和平与面包——革命对农民许下的承诺必须兑现。"
 RUS_LR_secure_logistics:0 "保障后勤补给"
 RUS_LR_secure_logistics_desc:0 "没有铁路、粮食与弹药，最勇敢的军队也会崩溃。"
 RUS_LR_strengthen_arts:0 "加强文艺工作"
 RUS_LR_strengthen_arts_desc:0 "文艺不是装饰。每一首歌、每一幅海报都是革命的武器。"
 RUS_LR_soldiers_and_civilians:0 "军人平民，亲如一家"
 RUS_LR_soldiers_and_civilians_desc:0 "红军士兵来自人民，也必须回到人民之中。"
 RUS_LR_sing_and_march:0 "高唱军歌，大步前进"
 RUS_LR_sing_and_march_desc:0 "在歌声中，疲惫的队伍重新找回方向。"
 RUS_LR_declare_sr_defeat:0 "宣告社会革命党的落败！"
 RUS_LR_declare_sr_defeat_desc:0 "社革党的最后据点陷落。俄罗斯只有一个革命政权。"
 RUS_LR_true_socialist_russia:0 "真正的社会主义俄罗斯"
 RUS_LR_true_socialist_russia_desc:0 "内战结束，废墟之上终于出现了一个由苏维埃统治的俄罗斯。"
 RUS_LR_restore_party_congress:0 "恢复党的代表大会制度"
 RUS_LR_restore_party_congress_desc:0 "党不能只靠命令运转。代表大会必须重新成为争论与决定的场所。"
 RUS_LR_end_organizational_chaos:0 "结束内战造成的组织混乱"
 RUS_LR_end_organizational_chaos_desc:0 "战争打乱了党的组织。现在，秩序必须从中央一直建立到支部。"
 RUS_LR_after_victory:0 "革命胜利之后"
 RUS_LR_after_victory_desc:0 "胜利不是终点。一个破碎的国家等待被重新组织。"
 RUS_LR_restore_council_of_peoples_commissars:0 "恢复中央人民委员会"
 RUS_LR_restore_council_of_peoples_commissars_desc:0 "人民委员会必须重新运转，成为国家治理的中枢。"
 RUS_LR_bring_debate_back:0 "让争论回到党内"
 RUS_LR_bring_debate_back_desc:0 "不同意见不是敌人。把争论关进密室，才会制造真正的敌人。"
 RUS_LR_unify_party_discipline:0 "统一党的执行纪律"
 RUS_LR_unify_party_discipline_desc:0 "争论之后必须有统一的行动。纪律是革命政党的生命线。"
 RUS_LR_restart_railways:0 "让铁路重新动起来"
 RUS_LR_restart_railways_desc:0 "铁路是国家的血管。没有铁路，粮食、煤炭与军队都无法流动。"
 RUS_LR_rebuild_local_soviets:0 "重建地方苏维埃"
 RUS_LR_rebuild_local_soviets_desc:0 "中央的命令需要地方苏维埃来执行，也需要它们来监督。"
 RUS_LR_against_personality_cult:0 "反对个人崇拜和无条件服从"
 RUS_LR_against_personality_cult_desc:0 "革命不需要新的沙皇。领袖的作用是引导，而不是代替党思考。"
 RUS_LR_rectify_local_party:0 "整顿地方党组织"
 RUS_LR_rectify_local_party_desc:0 "地方党组织的涣散，会让中央的一切决议变成空文。"
 RUS_LR_end_wartime_measures:0 "结束内战时期的临时措施"
 RUS_LR_end_wartime_measures_desc:0 "战时法令、征用与非常法庭必须逐步退出历史舞台。"
 RUS_LR_unify_republic_laws:0 "统一共和国的法令"
 RUS_LR_unify_republic_laws_desc:0 "各地法令不一，国家便无法治理。统一的法律体系必须建立。"
 RUS_LR_collective_leadership:0 "集体领导"
 RUS_LR_collective_leadership_desc:0 "没有人可以代替党思考。重大决定由集体作出，也由集体负责。"
 RUS_LR_carry_out_central_decisions:0 "中央决议必须得到执行"
 RUS_LR_carry_out_central_decisions_desc:0 "民主讨论之后，中央的决议就是全党的决议。"
 RUS_LR_restore_agriculture:0 "恢复农业生产"
 RUS_LR_restore_agriculture_desc:0 "土地需要种子、农具与安宁。农业恢复是国家生存的前提。"
 RUS_LR_unify_state_finance:0 "统一国家财政"
 RUS_LR_unify_state_finance_desc:0 "没有统一的财政，就没有统一的国家。"
 RUS_LR_party_responsibility:0 "党对社会主义建设的负责"
 RUS_LR_party_responsibility_desc:0 "党不仅要领导革命，也要领导建设。这是新的历史任务。"
 RUS_LR_establish_gosplan:0 "建立国家计划委员会"
 RUS_LR_establish_gosplan_desc:0 "计划不是官僚的表格，而是把有限资源集中到最关键处的工具。"
 RUS_LR_unify_industrial_statistics:0 "统一工业统计"
 RUS_LR_unify_industrial_statistics_desc:0 "没有准确的数字，计划就只是空想。"
 RUS_LR_expand_farm_tool_production:0 "扩大农具生产"
 RUS_LR_expand_farm_tool_production_desc:0 "农具是农业恢复的第一步。"
 RUS_LR_survey_production_capacity:0 "调查全国生产能力"
 RUS_LR_survey_production_capacity_desc:0 "国家必须知道自己拥有什么，才能决定要建造什么。"
 RUS_LR_state_control_heavy_industry:0 "国家掌握重工业"
 RUS_LR_state_control_heavy_industry_desc:0 "重工业是社会主义的物质基础。"
 RUS_LR_unify_energy_and_mining:0 "统一能源与矿产管理"
 RUS_LR_unify_energy_and_mining_desc:0 "煤炭、石油与电力必须服从统一的国家计划。"
 RUS_LR_unified_material_distribution:0 "建立统一的物资分配体系"
 RUS_LR_unified_material_distribution_desc:0 "物资不能停留在仓库里，也不能落入投机者手中。"
 RUS_LR_planning_on_real_numbers:0 "让计划经济建立在实际数字之上"
 RUS_LR_planning_on_real_numbers_desc:0 "计划必须从统计出发，而不是从口号出发。"
 RUS_LR_unified_rail_dispatch:0 "铁路统一调度"
 RUS_LR_unified_rail_dispatch_desc:0 "一张全国铁路时刻表，胜过一千道行政命令。"
 RUS_LR_central_raw_material_allocation:0 "中央分配工业原料"
 RUS_LR_central_raw_material_allocation_desc:0 "原料必须流向最需要它的工厂。"
 RUS_LR_foundation_of_planned_economy:0 "社会主义计划经济的基础"
 RUS_LR_foundation_of_planned_economy_desc:0 "统计、分配与调度三者合一，计划经济才真正开始。"
 RUS_LR_restore_machine_building:0 "恢复机械制造业"
 RUS_LR_restore_machine_building_desc:0 "没有机器，就没有工业化。"
 RUS_LR_establish_agricultural_cooperatives:0 "建立农业合作社"
 RUS_LR_establish_agricultural_cooperatives_desc:0 "把小农组织起来，是社会主义改造的第一步。"
 RUS_LR_unify_grain_procurement:0 "统一粮食收购与供应"
 RUS_LR_unify_grain_procurement_desc:0 "国家必须掌握粮食，才能养活城市与军队。"
 RUS_LR_begin_agricultural_mechanization:0 "农业机械化的开始"
 RUS_LR_begin_agricultural_mechanization_desc:0 "拖拉机站将成为农村的新中心。"
 RUS_LR_adopt_collective_farms:0 "采用集体化农庄"
 RUS_LR_adopt_collective_farms_desc:0 "集体农庄是社会主义在农村的根基。"
 RUS_LR_economic_victory:0 "经济上的胜利"
 RUS_LR_economic_victory_desc:0 "当计划、工业与农业重新运转，社会主义俄罗斯终于站稳了脚跟。"
 RUS_LR_lenin_returned:0 "列宁归来"
 RUS_LR_lenin_returned_desc:0 "伊里奇回到了俄国。流亡者、工人与士兵重新聚拢在这面旗帜下。"
 RUS_LR_old_bolsheviks:0 "老布尔什维克归队"
 RUS_LR_old_bolsheviks_desc:0 "流亡多年的老同志重新回到党的行列，他们记得革命最初的样子。"
 RUS_LR_revolutionary_legacy:0 "革命正统"
 RUS_LR_revolutionary_legacy_desc:0 "党重新掌握了十月的解释权：革命不是议会妥协，而是阶级决战。"
 RUS_LR_party_democracy:0 "党内民主"
 RUS_LR_party_democracy_desc:0 "代表大会重新召开，争论回到党内，决定由集体作出。"
 RUS_LR_democratic_centralism:0 "民主集中制"
 RUS_LR_democratic_centralism_desc:0 "讨论时自由，执行时统一。党重新成为一台有纪律的机器。"
 RUS_LR_revolutionary_army:0 "革命军队"
 RUS_LR_revolutionary_army_desc:0 "红军是革命的学校，也是革命的刺刀。"
 RUS_LR_wartime_economy:0 "战时经济"
 RUS_LR_wartime_economy_desc:0 "一切为了前线。工厂、铁路与粮食都被纳入战争的节奏。"
 RUS_LR_gosplan:0 "国家计划委员会"
 RUS_LR_gosplan_desc:0 "计划委员会把全国的统计、工厂与铁路纳入同一张表格。"
 RUS_LR_planned_economy:0 "计划经济"
 RUS_LR_planned_economy_desc:0 "国家掌握重工业，原料与机器按计划流动。"
 RUS_LR_collectivization:0 "农业集体化"
 RUS_LR_collectivization_desc:0 "小农经济正在被合作社与集体农庄取代，农村的阵痛不可避免。"
 RUS_LR_railways:0 "铁路统一调度"
 RUS_LR_railways_desc:0 "全国铁路服从一张时刻表，粮食、煤炭与军队重新流动起来。"
 RUS_LR_soviet_legitimacy:0 "苏维埃的合法性"
 RUS_LR_soviet_legitimacy_desc:0 "苏维埃不再只是革命的临时机构，而是国家权力的正式形式。"
 RUS_lenin_revival.1.t:0 "熟悉的身影"
 RUS_lenin_revival.1.desc:0 "随着俄罗斯社会主义革命取得胜利，流亡海外的布尔什维克开始陆续返回祖国。\n\n火车站挤满了迎接归国者的人群。有人高举红旗，有人激动地呼喊着旧日同志的名字。那些在革命失败后被迫离开祖国的人，终于又一次踏上了俄罗斯的土地。\n\n就在这时，一名年轻党员忽然停止了交谈。\n\n人群的另一端，一个男人正缓缓走来。他穿着一件朴素的深色大衣，神情平静，似乎并不在意周围投来的目光。\n\n年轻党员觉得自己在哪里见过这张脸。\n\n不，不可能。\n\n他一定是认错人了。\n\n可是，为什么那个人看起来如此熟悉？"
 RUS_lenin_revival.1.a:0 "是斯大林同志，他也回来了。"
 RUS_lenin_revival.1.b:0 "那是——弗拉基米尔·伊里奇·乌里扬诺夫？！（进入列宁复活线）"
 RUS_lenin_revival.20.t:0 "内战爆发"
 RUS_lenin_revival.20.desc:0 "社会革命党拒绝承认苏维埃政权，拒绝交出土地委员会，也拒绝放下武器。\n\n他们控制着伏尔加河沿岸的粮仓与铁路枢纽，试图把俄罗斯重新拖回议会与妥协的旧时代。\n\n革命没有退路。列宁在斯莫尔尼宫宣布：旧国家必须被打碎。"
 RUS_lenin_revival.20.a:0 "让刺刀来决定吧。"
 RUS_lenin_revival.21.t:0 "社会革命党的落败"
 RUS_lenin_revival.21.desc:0 "最后一个社革党据点降下旗帜。伏尔加河沿岸的粮仓重新向城市敞开。\n\n俄罗斯只有一个革命政权。现在，问题不再是谁能获胜，而是如何建设这个国家。"
 RUS_lenin_revival.21.a:0 "革命胜利了。"
 RUS_lenin_revival.22.t:0 "经济上的胜利"
 RUS_lenin_revival.22.desc:0 "计划委员会的报表第一次显示出全面的增长。工厂重新开工，铁路重新通车，集体农庄把粮食送进城市。\n\n社会主义俄罗斯终于站稳了脚跟——但所有人都知道，这只是一个开始。"
 RUS_lenin_revival.22.a:0 "继续前进。"

 RUS_LR_vladimir_lenin:0 "弗拉基米尔·伊里奇·列宁"
 RUS_LR_bolshevik_party:0 "俄共（布）"
 RUS_LR_bolshevik_party_long:0 "俄罗斯共产党（布尔什维克）"
 RUS_LR_sr_defeated_tt:0 "社会革命党叛军已被击败"
 RUS_LR_vozhd_of_proletariat:0 "全世界无产者的领袖"
