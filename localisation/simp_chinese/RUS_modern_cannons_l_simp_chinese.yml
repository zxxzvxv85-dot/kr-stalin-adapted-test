l_simp_chinese:
 RUS_modern_high_velocity_cannon: "现代高速加农炮"
 RUS_modern_high_velocity_cannon_desc: "一门为实现极高初速而设计的现代加农炮。其使用专门准备的炮弹，对装甲目标具有极强杀伤力，同时改进后的弹药也提升了对人员杀伤。"
 RUS_modern_heavy_cannon: "现代重型加农炮"
 RUS_modern_heavy_cannon_desc: "一种发射大口径炮弹的现代重型加农炮，兼具强大的对人员与对装甲杀伤，但尺寸、重量与成本都十分可观。"
 EQ_MOD_CAT_RUS_modern_main_armament_TITLE: "现代坦克主武器"
 RUS_modern_cannons_unlock: "现代坦克火炮"
 RUS_modern_cannons_unlock_desc: "现代坦克底盘允许安装现代高速加农炮和现代重型加农炮。"
