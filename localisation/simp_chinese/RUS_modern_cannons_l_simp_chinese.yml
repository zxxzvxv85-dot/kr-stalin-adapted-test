l_simp_chinese:
 RUS_modern_high_velocity_cannon: "现代高速加农炮"
 RUS_modern_high_velocity_cannon_desc: "一门为实现极高初速而设计的现代加农炮。其使用专门准备的炮弹，对装甲目标具有极强杀伤力，同时改进后的弹药也提升了对人员杀伤。"
 RUS_modern_heavy_cannon: "现代重型加农炮"
 RUS_modern_heavy_cannon_desc: "一种发射大口径炮弹的现代重型加农炮，兼具强大的对人员与对装甲杀伤，但尺寸、重量与成本都十分可观。"
 EQ_MOD_CAT_RUS_modern_main_armament_TITLE: "现代坦克主武器"
 RUS_modern_cannons_unlock: "现代坦克火炮"
 RUS_modern_cannons_unlock_desc: "完成特殊项目“现代稳定尾翼脱壳穿甲弹”后，解锁现代高速加农炮和现代重型加农炮。两者均属于中型主武器，不再要求现代坦克底盘。"
 sp_land_modern_fin_stabilized_discarding_sabot: "现代稳定尾翼脱壳穿甲弹"
 sp_land_modern_fin_stabilized_discarding_sabot_desc: "研发新一代稳定尾翼脱壳穿甲弹，利用细长弹芯、高初速和气动稳定性显著提高现代坦克炮的穿甲效能。"
 sp_land_modern_fin_stabilized_discarding_sabot_speed_factor: "现代稳定尾翼脱壳穿甲弹研究速度"
