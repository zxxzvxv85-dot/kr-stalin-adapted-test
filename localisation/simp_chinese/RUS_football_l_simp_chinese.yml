 RUS_football.1.t:0 "历史转折中的俄罗斯足球（1/3）"
 RUS_football.1.d:0 "足球在俄罗斯扎根已久。19世纪后半叶，来自英国的侨民和企业雇员首次将现代足球带入俄罗斯；至1890年代，圣彼得堡已经出现较为稳定的足球团体和公开比赛；不过，直到20余年后，全俄罗斯足球联盟才得以成立，然而一战的到来给一切画上了句号，包括俄罗斯帝国本身。\n\n从废墟上建立的俄罗斯共和国在内战后的1924年才重新恢复了俄罗斯足联，然而全国赛事却迟迟没有得到落实，地区球队基本只能在自己的城市之内举办足球锦标赛,这严重制约了俄罗斯的足球竞技水平发展。1936年元旦，由莫斯科几家俱乐部所组成的“最精锐”的代表队前往巴黎，同巴黎竞技队在王子公园球场进行友谊赛，结果巴黎竞技在上下半场各入4球，莫斯科代表队只在比赛接近尾声，抓住对方换上替补球员之时打入了一粒挽回颜面的进球。"
 RUS_football.1.a:0 "继续阅读。"
 RUS_football.2.t:0 "历史转折中的俄罗斯足球（2/3）"
 RUS_football.2.d:0 "这条新闻传回国内之后引起轩然大波，各地区足协开始对俄罗斯足联口诛笔伐，指责他们空有联盟之名，毫无组织比赛之实，于是在1936年5月初，各地区足协联合架空俄罗斯足联，成立了全俄罗斯足球协会，并于5月22日举行了首次全国俱乐部联赛比赛。彼得格勒迪纳摩与莫斯科火车头的揭幕战在全国知名的彼得格勒迪纳摩球场举行，当天球场附近水泄不通，几乎全国的球迷都赶来共襄盛举，仅场内就坐满了1.2万观众，场外更是不计其数，更有甚者，为了一睹球员风采而爬到球场外的电线杆和树木上。火车头前锋维克托·拉夫罗夫在第5分钟先入一球，成为了全俄罗斯俱乐部联赛的首位进球者；然而凭借着更均衡的阵容，彼得格勒迪纳摩随后连扳三球，完成逆转。\n\n如今，随着社会主义政府的建立，俄罗斯的足球运动越发蓬勃发展，许多工厂和机关都建立了自己的足球队，并积极参与了地区的锦标赛。"
 RUS_football.2.a:0 "继续阅读。"
 RUS_football.3.t:0 "历史转折中的俄罗斯足球（3/3）"
 RUS_football.3.d:0 "同时，为了统筹这些如雨后春笋般的众多足球队，俄罗斯足协也推出了分级制度，共分5级，其中最高级别被称为A组（Группа «А»），不过，在民间，大家更习惯称它为俄罗斯足球超级联赛（简称俄超）。现在，每周末去为自己的主队加油助威已经成了相当多工人和学生的习惯，比较各自球队的强弱也变为了大家茶余饭后的谈资。也许在不久的将来，俄罗斯足球便能在国际舞台上大放异彩？"
 RUS_football.3.a:0 "对了，我还得去抢今年全俄锦标赛的决赛门票呢......"
