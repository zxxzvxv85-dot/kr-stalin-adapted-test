 RUS_nat_tab_0_tt:0 "§Y农业生产§!\n\n£RUS_nat_text_food£ 每季配置§Y20§!点，每种作物最多§Y10§!点；农机§4承诺§!成功、§G土改成功§!§G各永久+2点§!，总额最多§Y24§!。\n\n£RUS_nat_text_food£ §4实物产量§!受§4季节§!、§4地力疲劳§!、§4实际天气§!、§4平均农机覆盖§!及§4农业产量修正§!影响。预估不计§R隐藏天气与行情§!，§R预测不保证准确§!。§4行情§!、§4市场饱和§!与§4销售容量§!只影响§4售价§!。\n\n£RUS_nat_text_orders£ §Y确认后锁定配置§!，季末前可§Y重新调整§!；未确认时按§4内需§!与§4储备§!§Y自动配置§!。首次及截止日的不足整季时段按§Y实际天数§!结算。"
 RUS_nat_tab_1_tt:0 "§Y农机生产§!\n\n£RUS_nat_text_machinery£ 实际占用所分配的可用§4民用工厂§!。\n\n每厂日产 = §Y1.20§! × §4效率§! × §4产出系数§!\n\n§4一五当前分数§!与§4国家工厂产出§!、§4效率上限§!、§4效率增长§!修正参与计算。\n\n£RUS_nat_text_factories£ 新厂以§Y30%§!§4效率§!并入；停产时§4效率§!每日降低§Y0.1§!个百分点，最低§Y30%§!。失去工厂时自动减少占用；§4在役§!与§4仓库§!均满时§R停止生产§!，不增加§4累计产量§!。\n\n£RUS_nat_text_stock£ 农机优先补齐国内§4在役§!目标§Y400§!，§G土改成功§!后下一季为§Y500§!，§4仓库§!上限§Y4500§!。每季§4在役§!§R损耗§!随机§Y10%§!/§Y15%§!/§Y20%§!/§Y25%§!，§R恶劣天气§!再§G+5§!个百分点，最多§Y30%§!；§4库存§!不参与§R损耗§!。§4平均覆盖率§!使作物产量变为§Y90%§!至§Y110%§!。\n\n£RUS_nat_text_orders£ §4承诺§!要求§Y540§!天内§4推广拖拉机§!§Y3§!次，且从农业系统启动起§4累计自产§!§Y3000§!单位；出口不扣累计成绩。"
 RUS_nat_tab_2_tt:0 "§Y库存与贸易§!\n\n£RUS_nat_text_food£ 完整季度§4内需§!：小麦与黑麦共§Y8§!、甜菜§Y2§!、亚麻与棉花共§Y4§!；开季处于战争时粮食§G+2§!、纺织§G+1§!。\n\n£RUS_nat_text_stock£ 先满足§4内需§!，再保留选定的半季/一季/两季§4储备§!，最后按§4优先级§!交付已接§4订单§!。§Y仅交整单§!，同一§4库存§!不可重复交付。作物§4库存§!上限§Y12§!/§Y12§!/§Y6§!/§Y6§!/§Y6§!，季末§R损耗§!§Y5%§!，§Y卡霍夫斯卡娅§!任职时为§Y2%§!。\n\n£RUS_nat_text_export£ §Y西方同志§!解锁普通作物§4订单§!；§Y巴黎条约§!后，存在的英法各提供作物与农机§4订单§!，§Y从下一季生效§!。作物每单位基价§Y1000§!§4经济盈余§!，农机§Y150§!；英法已交付§4订单§!§4售价§!倍率§G+0.10§!，最终§4售价§!倍率§Y0.40§!至§Y1.50§!。农机出口先补国内缺口并留下目标§Y25%§!的§4备件§!。"
 RUS_nat_tab_3_tt:0 "§Y季度报告§!\n\n£RUS_nat_text_reform£ §4内需积分§!：粮食全部满足§G+2§!，满足§Y90%§!至不足§Y100%§!时§G+1§!；甜菜、纺织全部满足各§G+0.5§!。此项每季最多§Y3§!分，§Y每农业年度最多12分§!。三类§4内需§!全部满足额外§G+50§!§4政治点§!，§Y每年最多200§!。\n\n£RUS_nat_text_machinery£ 另外：一季§4粮食储备§!§G+2§!分、§4平均农机覆盖§!至少§Y90%§!§G+2§!分、§4季度任务§!§G+4§!分；§Y乌斯季诺夫§!任职时完成任务再§G+1§!。§Y仅正式土改进行中或成功后发分§!；不足整季按§Y实际天数§!折算。\n\n£RUS_nat_text_reform£ §Y乌斯季诺夫§!路线目标§Y150§!分、§Y720§!天。成功后超额分数成为§4可消费余额§!，§G不降低改革阶段§!；§R失败后停止积分与兑换§!，农业继续运转。§R出口没有额外土改积分§!。\n\n£RUS_nat_text_food£ §4年度精神§!依据§4内需§!平均满足率与年末§4储备§!评定。§R粮食短缺§!导致逐级惩罚，§G恢复供给§!一季降低一级；甜菜或纺织短缺影响§R工厂产出§!。"
