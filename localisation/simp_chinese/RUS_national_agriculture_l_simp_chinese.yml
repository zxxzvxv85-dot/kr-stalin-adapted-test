 RUS_nat_reserve_1_tt:0 "£RUS_nat_text_stock£ §Y一季国内储备§!\n\n先满足§4本季内需§!，再为粮食、甜菜与纺织原料各保留相当于§Y1个完整季度内需§!的库存。\n\n只有超出储备的部分才能用于§4出口订单§!。\n储备越多，可用于出口的库存越少。作物仍受库存上限及季末损耗约束。\n默认保留§Y一季§!。农机出口另按在役目标的§Y25%§!保留备件，不受此按钮影响。"
 RUS_nat_reserve_2:0 "保留两季"
 RUS_nat_reserve_2_tt:0 "£RUS_nat_text_stock£ §Y两季国内储备§!\n\n先满足§4本季内需§!，再为粮食、甜菜与纺织原料各保留相当于§Y2个完整季度内需§!的库存。\n\n只有超出储备的部分才能用于§4出口订单§!。\n储备越多，可用于出口的库存越少。作物仍受库存上限及季末损耗约束。\n默认保留§Y一季§!。农机出口另按在役目标的§Y25%§!保留备件，不受此按钮影响。"
