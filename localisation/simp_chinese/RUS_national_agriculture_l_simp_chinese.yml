 RUS_nat_tab_0_tt:0 "§Y农业生产§!\n每季配置20点，每种作物最多10点；农机承诺成功、土改成功各永久+2点，总额最多24。\n实物产量受季节、地力疲劳、实际天气、平均农机覆盖及农业产量修正影响。预估不计隐藏天气与行情，预测不保证准确。行情、市场饱和与销售容量只影响售价。\n确认后锁定配置，季末前可重新调整；未确认时按内需与储备自动配置。首次及截止日的不足整季时段按实际天数结算。"
 RUS_nat_tab_1_tt:0 "§Y农机生产§!\n实际占用所分配的可用民用工厂，日产为每厂1.20×效率×产出系数。一五当前分数与国家工厂产出、效率上限、效率增长修正参与计算。\n新厂以30%效率并入；停产时效率每日降低0.1个百分点，最低30%。失去工厂时自动减少占用；在役与仓库均满时停止生产，不增加累计产量。\n农机优先补齐国内在役目标400，土改成功后下一季为500，仓库上限4500。每季在役损耗随机10%/15%/20%/25%，恶劣天气再+5个百分点，最多30%；库存不参与损耗。平均覆盖率使作物产量变为90%至110%。\n承诺要求540天内推广拖拉机3次，且从农业系统启动起累计自产3000单位；出口不扣累计成绩。"
 RUS_nat_tab_2_tt:0 "§Y库存与贸易§!\n完整季度内需：小麦与黑麦共8、甜菜2、亚麻与棉花共4；开季处于战争时粮食+2、纺织+1。\n先满足内需，再保留选定的半季/一季/两季储备，最后按优先级交付已接订单。仅交整单，同一库存不可重复交付。作物库存上限12/12/6/6/6，季末损耗5%，卡霍夫斯卡娅任职时为2%。\n西方同志解锁普通作物订单；巴黎条约后，存在的英法各提供作物与农机订单，从下一季生效。作物每单位基价1000经济盈余，农机150；英法已交付订单售价倍率+0.10，最终售价倍率0.40至1.50。农机出口先补国内缺口并留下目标25%的备件。"
 RUS_nat_tab_3_tt:0 "§Y季度报告§!\n内需积分：粮食全部满足+2，满足90%至不足100%时+1；甜菜、纺织全部满足各+0.5。此项每季最多3分，每农业年度最多12分。三类内需全部满足额外+50政治点，每年最多200。\n另外：一季粮食储备+2分、平均农机覆盖至少90%+2分、季度任务+4分；乌斯季诺夫任职时完成任务再+1。仅正式土改进行中或成功后发分；不足整季按实际天数折算。\n乌斯季诺夫路线目标150分、720天。成功后超额分数成为可消费余额，不降低改革阶段；失败后停止积分与兑换，农业继续运转。出口没有额外土改积分。\n年度精神依据内需平均满足率与年末储备评定。粮食短缺导致逐级惩罚，恢复供给一季降低一级；甜菜或纺织短缺影响工厂产出。"
