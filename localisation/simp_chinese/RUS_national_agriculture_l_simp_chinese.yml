 RUS_nat_tab_0_tt:0 "§Y农业生产§!\n\n£RUS_nat_text_food£ 每季生产配置额度为§Y20§!，每种作物最多配置§Y10§!。\n\n农机§4承诺§!成功、§G土改成功§!各永久增加生产配置额度§G+2§!，总额度最多§Y24§!。\n\n£RUS_nat_text_food£ §4实物产量§!受§4季节§!、§4地力疲劳§!、§4实际天气§!、§4平均农机覆盖§!及§4农业产量修正§!影响。\n\n预估不计§R隐藏天气与行情§!，§R预测不保证准确§!。§4行情§!、§4市场饱和§!与§4销售容量§!只影响§4售价§!，不减少§4实物产量§!。\n\n单位产量表示每单位生产配置的预计实物产出，含当前公开修正及不足整季折算，未配置时也显示。例如单位产量§Y1.25§!表示每配置§Y1§!可产出§Y1.25§!单位作物。它不是资金回报率。\n\n£RUS_nat_text_income£ 各作物出口收入为预估可交付§4订单§!的§4经济盈余§!，包含可用旧§4库存§!。先满足§4内需§!并保留§4储备§!，无可交付§4订单§!时收入为§Y0§!。下方收入总览还包含农机出口。\n\n£RUS_nat_text_orders£ §Y确认后锁定配置§!，季末前可§Y重新调整§!。\n\n未确认时按§4内需§!与§4储备§!§Y自动配置§!。首次及截止日的不足整季时段按§Y实际天数§!结算。"
 RUS_nat_tab_1_tt:0 "§Y农机生产§!\n\n£RUS_nat_text_machinery£ 分配工厂会实际占用可用§4民用工厂§!。\n\n每厂日产 = §Y1.20§! × §4效率§! × §4产出系数§!\n\n§4一五当前分数§!与§4国家工厂产出§!、§4效率上限§!、§4效率增长§!修正参与计算。\n\n£RUS_nat_text_factories£ 新厂以§Y30%§!§4效率§!加权并入。停产时§4效率§!每日§R-0.1%§!，最低§Y30%§!。失去工厂时自动减少占用。\n\n国内§4在役§!目标已补满且农机§4仓库§!已满时§R停止生产§!，不增加§4累计产量§!。\n\n£RUS_nat_text_stock£ 国内§4在役§!农机目标为§Y400§!单位，§G土改成功§!后的下一季提高至§Y500§!单位。农机§4仓库§!上限§Y4500§!单位。\n\n每季§4在役§!农机§R损耗§!率随机为§Y10%§!/§Y15%§!/§Y20%§!/§Y25%§!。§R恶劣天气§!使§R损耗§!率额外§R+5%§!，最高§Y30%§!。§4仓库§!农机不参与§4在役§!§R损耗§!。\n\n§4平均覆盖率§!按本季每日§4在役§!数量计算，使作物产量变为§Y90%§!至§Y110%§!，季末补机不能追溯改善整季收成。\n\n£RUS_nat_text_orders£ 作出§4承诺§!后§Y540§!天内须完成§4推广拖拉机§!§Y3§!次，且从农业系统启动起§4累计自产§!农机达到§Y3000§!单位。\n\n初始设备不计入§4累计自产§!。出口不扣§4累计自产§!成绩。"
 RUS_nat_tab_2_tt:0 "§Y库存与贸易§!\n\n£RUS_nat_text_food£ 完整和平季度§4内需§!：粮食（小麦与黑麦）合计§Y8§!单位，甜菜§Y2§!单位，纺织原料（亚麻与棉花）合计§Y4§!单位。\n\n开季处于战争时，本季粮食§4内需§!额外§R+2§!、纺织原料§4内需§!额外§R+1§!。这是需求增加，不是产量奖励。\n\n£RUS_nat_text_stock£ 先满足§4内需§!，再保留选定的半季/一季/两季§4储备§!，最后按§4优先级§!交付已接§4订单§!。§Y仅交整单§!，同一§4库存§!不可重复交付。\n\n作物§4库存§!上限：小麦§Y12§!、黑麦§Y12§!、甜菜§Y6§!、亚麻§Y6§!、棉花§Y6§!单位。\n\n满足§4内需§!与出口后，剩余作物§4库存§!先移除超出上限的部分，再§R损耗§!§Y5%§!。§Y卡霍夫斯卡娅§!任职时§R损耗§!率为§Y2%§!。已消费、已出口的作物不再§R损耗§!。\n\n£RUS_nat_text_export£ §Y西方同志§!解锁普通作物§4订单§!。\n\n§Y巴黎条约§!后，存在的不列颠联盟、法兰西公社各提供作物与农机§4订单§!，§Y从下一季生效§!。\n\n每单位作物出口基价为§Y1000§!§4经济盈余§!，每单位农机为§Y150§!§4经济盈余§!。两国已交付§4订单§!§4售价§!倍率§G+10%§!，最终§4售价§!倍率§Y40%§!至§Y150%§!。\n\n农机出口前先补齐国内§4在役§!缺口，再保留§4在役§!目标§Y25%§!的§4仓库§!§4备件§!，仅剩余农机可出口。"
 RUS_nat_tab_3_tt:0 "§Y季度报告§!\n\n£RUS_nat_text_reform£ §4内需§!土改积分：粮食全部满足§G+2§!，满足§Y90%§!至不足§Y100%§!时§G+1§!。甜菜、纺织原料各自全部满足时各§G+0.5§!。\n\n仅§4内需§!这一项土改积分每完整季度最多§Y3§!，每农业年度最多§Y12§!，不包含下列§4储备§!、农机覆盖和任务积分。\n\n三类§4内需§!全部满足额外获得§4政治点§!：§G+50§!，每农业年度最多§Y200§!。\n\n£RUS_nat_text_machinery£ 季末§R损耗§!后，§4粮食储备§!达到一季§4内需§!时，土改积分§G+2§!。§4平均农机覆盖§!至少§Y90%§!时，土改积分§G+2§!。\n\n完成§4季度任务§!时，土改积分§G+4§!。§Y乌斯季诺夫§!任职时完成任务，土改积分再§G+1§!。\n\n仅正式土改进行中或成功后发放土改积分。不足整季的积分与§4政治点§!奖励按§Y实际天数§!折算。\n\n£RUS_nat_text_reform£ §Y乌斯季诺夫§!路线土改目标：§Y150§!。土改期限：§Y720§!天。成功后超额积分成为§4可消费余额§!，消费§G不降低改革阶段§!。\n\n§R失败后停止积分与兑换§!，农业继续运转。§R出口没有额外土改积分§!。\n\n£RUS_nat_text_food£ §4年度精神§!依据§4内需§!平均满足率与年末§4储备§!评定。粮食§4内需§!满足率不足§Y90%§!时惩罚加深一级，恢复至至少§Y90%§!一季降低一级。甜菜或纺织原料短缺影响§R工厂产出§!。"
