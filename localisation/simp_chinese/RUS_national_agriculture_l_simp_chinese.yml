 RUS_national_agriculture.1.t:0 "国家农业年度报告"
 RUS_national_agriculture.1.d:0 "农业委员会已完成本年度供给评估。平均内需满足率为[?RUS_nat_last_annual|1]%。新一年的农业生产现已开始。"
 RUS_national_agriculture.1.a:0 "继续建设社会主义农业。"
 RUS_national_agriculture.2.t:0 "国家农业经营指南"
 RUS_national_agriculture.2.d:0 "点击农业界面顶部的§b四个页签§!，即可切换生产、农机、贸易与报告。分类下的§b国家农业经营指南§!决议可随时重新查阅。\n\n§4安排生产§!：每季免费配置§b10§!，每种作物最多§b10§!。先查看§b供需清单§!中的内需与储备缺口，再用加减按钮分配作物。单位产量和出口收入随配置刷新。\n\n§4保存方案§!：手动调整即时保存，确认方案后锁定本季配置，重新调整可解锁。下季保留手动配置，自动模式则根据新季内需与储备重排。未确认的手动草案也会用于结算。\n\n§4推进土改§!：农业从部长任命后运行，正式启动土地改革后才获得经营积分。目标§b200§!，期限§b720§!天，土改决议累计最多提供§b90§!，其余由经营与事件补足。\n\n§4季度结算§!：先满足内需，再保留储备、交付订单，最后扣除剩余库存损耗。新季度会收到通知，截止前§b7§!天提醒检查未确认方案。"
 RUS_national_agriculture.3.t:0 "新一季度农业安排"
 RUS_national_agriculture.3.d:0 "上一季度已完成结算。\n\n§4内需满足§!：粮食§b[?RUS_nat_food_last_ratio|2]%§!，甜菜§b[?RUS_nat_beet_last_ratio|2]%§!，纺织原料§b[?RUS_nat_textile_last_ratio|2]%§!。\n§4本次土改积分§!：§b+[?RUS_agri_last_quarter_score|2]§!。\n§4本次政治点§!：§b+[?RUS_nat_last_pp|1]§!。\n\n新季度的季节条件、预测、需求与订单已更新，手动配置已保留。请检查§b供需清单§!，安排本季生产。"
 RUS_national_agriculture.4.t:0 "本季农业方案待检查"
 RUS_national_agriculture.4.d:0 "距离本季结算还有§b[?RUS_nat_remaining|0]§!天。当前状态：[GetRUSNatPlan]。\n\n请核对内需满足率、储备与订单缺口。手动草案会按当前配置结算，自动模式按内需和储备安排。确认后可通过§b重新调整§!继续修改。"
 RUS_national_agriculture.5.t:0 "本季农业供需清单"
 RUS_national_agriculture.5.d:0 "§4粮食§!\n现有库存 §b[?RUS_nat_food_stock_now|1]§!，预计新增 §b[?RUS_nat_food_new_yield|1]§!。\n内需供给 §b[?RUS_nat_food_delivered|1]§!/§b[?RUS_nat_food_need|1]§!，满足率 §b[?RUS_nat_food_preview|2]§!%。\n储备目标 §b[?RUS_nat_food_reserve|1]§!，已接订单 §b[?RUS_nat_food_order_need|1]§!。\n覆盖上述目标还需增产：§b[?RUS_nat_food_all_gap|2]§!。\n\n§4甜菜§!\n现有库存 §b[?RUS_nat_beet_stock_now|1]§!，预计新增 §b[?RUS_nat_beet_new_yield|1]§!。\n内需供给 §b[?RUS_nat_beet_delivered|1]§!/§b[?RUS_nat_beet_need|1]§!，满足率 §b[?RUS_nat_beet_preview|2]§!%。\n储备目标 §b[?RUS_nat_beet_reserve|1]§!，已接订单 §b[?RUS_nat_beet_order_need|1]§!。\n覆盖上述目标还需增产：§b[?RUS_nat_beet_all_gap|2]§!。\n\n§4纺织原料§!\n现有库存 §b[?RUS_nat_textile_stock_now|1]§!，预计新增 §b[?RUS_nat_textile_new_yield|1]§!。\n内需供给 §b[?RUS_nat_textile_delivered|1]§!/§b[?RUS_nat_textile_need|1]§!，满足率 §b[?RUS_nat_textile_preview|2]§!%。\n储备目标 §b[?RUS_nat_textile_reserve|1]§!，已接订单 §b[?RUS_nat_textile_order_need|1]§!。\n覆盖上述目标还需增产：§b[?RUS_nat_textile_all_gap|2]§!。\n\n总需求 = 本季内需 + 选定储备 + 已接订单\n\n粮食与纺织按类别合计，订单按指定作物整单交付。内需、出口完成后的剩余库存于本季结算时扣除损耗。预估采用公开条件。"
