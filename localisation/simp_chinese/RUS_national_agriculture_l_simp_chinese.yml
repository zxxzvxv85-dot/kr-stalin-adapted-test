 RUS_nat_event_guide:0 "返回经营指南"
 RUS_national_agriculture.6.t:0 "天气与行情"
 RUS_national_agriculture.6.d:0 "£RUS_nat_text_food£ §4天气§!代表本季全国农业气候的综合影响，五种作物共用同一结果。§G有利§!倾向增产，§b常态§!倾向无修正，§R不利§!倾向减产。实际恶劣天气还会提高在役农机损耗。\n\n天气修正先加到季节产出系数，再计算农机覆盖等因素。例如报告中的天气§b+20%§!对应系数§b+0.20§!：\n§b1.25§! + §b0.20§! = §b1.45§!\n\n£RUS_nat_text_income£ §4行情§!代表出口市场的价格变化，只影响已交付订单的售价。§G偏强§!倾向涨价，§b平稳§!倾向无修正，§R偏弱§!倾向降价。五种作物分别抽取，农机另有独立行情，预测结果可能偶然相同。\n\n§4预测与实际§!：开季显示的词语表示概率倾向。预测有利仍可能遇到坏天气，预测偏强仍可能降价。实际天气和行情到季末才在§b季度报告§!公布。\n\n§4预估口径§!：界面的单位产量与预计出口收入仅采用公开条件，均未计入隐藏的实际天气与行情，预测词语也不会直接加进预估数字。"
 RUS_national_agriculture.7.t:0 "产量、地力与收入"
 RUS_national_agriculture.7.d:0 "£RUS_nat_text_food£ §4单位产量§!：每配置§b1§!所预计获得的实物作物数量，已含季节、地力疲劳、平均农机覆盖、公开农业加成及不足整季折算。\n\n预计新增产量 = 配置数量 × 单位产量\n例如配置§b4§!、单位产量§b1.25§!，预计新增§b5§!单位。\n\n£RUS_nat_text_food£ §4地力疲劳§!：反复集中种植同一种作物会降低其产出，轮换或减少该作物配置可以恢复地力。§4市场饱和§!与§4销售容量§!则属于售价因素：连续集中配置会压价，同一种作物的累计出口超出销售容量后，超出部分逐级折价。\n\n£RUS_nat_text_stock£ §4内需与储备§!：粮食为小麦与黑麦合计，纺织原料为亚麻与棉花合计，甜菜单独计算。先满足内需、留下选定储备，再按指定作物交付整份订单，剩余库存最后截断上限并扣除损耗。\n\n£RUS_nat_text_income£ §4预计出口收入§!：按公开条件估算可交付订单的经济盈余，包含可用旧库存。自用作物只计入国内供给，无可交付订单时收入显示§b0§!。\n\n预计出口收入 = 各可交付订单预计收入之和\n单笔收入 = 交付数量 × 基价 × 适用售价倍率\n\n作物基价§b1000§!，农机基价§b150§!，售价倍率计入条约、饱和与超额折价，并限制在§b40%—150%§!。每行是该作物收入，底部总览另含农机。"
