  RUS_maximalist_land_reform_category: "最高纲领派土地改革"
  RUS_maximalist_land_reform_category_desc: "最高纲领派的方案已经得到大会通过。机械化、扫盲、畜牧业改造与集体农庄试验将逐步推进；每一轮改革都会增加土地改革分数，并按阶段调整国家精神。\n\n当前土地改革分数：§Y[?RUS_maximalist_land_reform_score|0]§!/§Y100§!\n当前阶段：[ROOT.RUSGetMaximalistLandReformCurrentStage]/§Y5§!\n下一阶段：[ROOT.RUSGetMaximalistLandReformNextStage]"
  RUS_maximalist_land_reform_mission: "最高纲领派土地改革"
  RUS_maximalist_land_reform_mission_desc: "最高纲领派必须在有限时间内证明自己的方案能够改造俄罗斯农村。若改革分数达到§Y100§!，土地改革将圆满完成；否则将以停滞告终。"
  RUS_maximalist_land_reform_active_slot_tt: "正在执行的土地改革决议少于§Y2§!项。"
  RUS_maximalist_land_reform_cancel_if_finished_tt: "土地改革已经圆满完成。"
