  RUS_pre_maximalist_land_reform: "“圆满完成”的土地改革"
  RUS_pre_maximalist_land_reform_desc: "历届政府都声称俄罗斯的土地问题已经得到妥善解决，农村秩序也早已恢复正常。但广袤乡村中的现实显然没有这样乐观：土地分配的旧伤、农村贫困、基层混乱和反社会主义势力的残余依然困扰着新生的社会主义政权。\n\n在最高纲领派正式提交自己的方案以前，这一问题仍只是被旧政府粉饰过的沉疴。"
  RUS_maximalist_land_reform: "最高纲领派土地改革"
  RUS_maximalist_land_reform_desc: "最高纲领派正在将自己的土地改革方案付诸实践。随着改革深入，农村的混乱、迟疑与反抗会逐步让位于新的组织形式。"
  RUS_maximalist_land_reform_stage_5: "圆满完成的土地改革"
  RUS_maximalist_land_reform_stage_5_desc: "最高纲领派的土地改革已经取得决定性成果。农村的混乱、迟疑与反抗逐步让位于新的组织形式，集体农庄、机械化生产与基层动员共同支撑起了一个更加稳固的社会主义农村。"
  RUS_maximalist_land_reform_stage_5_tractor_bonus: "圆满完成的土地改革"
  RUS_maximalist_land_reform_stage_5_tractor_bonus_desc: "最高纲领派的土地改革已经取得决定性成果。拖拉机承诺的兑现进一步巩固了农民对新政权的信任，集体农庄、机械化生产与基层动员共同支撑起了一个更加稳固的社会主义农村。"
  RUS_maximalist_land_reform_stagnation: "停滞不前的土地改革"
  RUS_maximalist_land_reform_stagnation_desc: "土地改革没有如最高纲领派所承诺的那样改变农村。白匪势力、混乱的基层执行与集体农庄的退出潮共同拖住了改革，农村问题再次成为政权必须背负的沉重负担。"

  RUS_max_landreform_agricultural_mechanisation: "农业机械化"
  RUS_max_landreform_agricultural_mechanisation_desc: "尽管城市无产阶级的数量在不断攀升，但我们不可忽视广大农村群众的重要性，为了改善他们的生活环境以及农业的整体落后状况，机械化势在必行。"
  RUS_max_landreform_promote_tractors: "推广拖拉机"
  RUS_max_landreform_promote_tractors_desc: "拖拉机是乡村耕种必备的帮手，但很显然目前国内的拖拉机保有量并不能令人满意，政府将额外拨款，用于推广拖拉机。"
  RUS_max_landreform_to_the_countryside: "到乡村去"
  RUS_max_landreform_to_the_countryside_desc: "为了解决国内普遍的文盲问题，政府将号召知识青年上山下乡，让知识传播到祖国的每一个角落。"
  RUS_max_landreform_literacy_campaign: "扫盲运动"
  RUS_max_landreform_literacy_campaign_desc: "困扰祖国的一大问题便是极高的文盲率，城市工人在过去的工厂生产中获得了基本的教育，而广大的农村地区依然是知识的荒漠，因此乡村扫盲工作必不可少。"
  RUS_max_landreform_livestock_reorganisation: "改造畜牧业"
  RUS_max_landreform_livestock_reorganisation_desc: "为了对畜牧业实施社会主义改造并凭此改善人民群众的生活质量，政府将通过集体化与合作社化对畜群进行全方位改造。"
  RUS_max_landreform_concentrate_herds: "集中畜群"
  RUS_max_landreform_concentrate_herds_desc: "国营农场将整合散养户，建立集体牧场；基层合作社则统一管理畜群，按劳分配收益。"
  RUS_max_landreform_model_kolkhoz_zone: "集体农庄示范区"
  RUS_max_landreform_model_kolkhoz_zone_desc: "我们对集体农庄的优越性充满自信心，可惜广大的农民群众并不能直观的看到这一点，因此划规一个集体农庄示范区显得尤为重要，榜样的力量可是很强大的。"
  RUS_max_landreform_call_for_collectivisation: "呼吁集体化"
  RUS_max_landreform_call_for_collectivisation_desc: "在完全自愿的原则下，基层干部们将呼吁广大的农村群众团结一心，建立集体农庄，有计划、有目的地进行大规模种植，这样做带来的好处将是不可估量的。"

  RUS_maximalist_land_reform_subtract_score_3_tt: "§Y最高纲领派土地改革§!进展减少§R3§!。"
  RUS_max_landreform_tractor_promise_mission: "履行拖拉机承诺"
  RUS_max_landreform_tractor_promise_mission_desc: "我们已经承诺在270天内补足农业设备。完成§Y推广拖拉机§!决议§Y3§!次即可兑现承诺。\n\n当前进度：§Y[?RUS_max_landreform_tractor_promise_count|0]§!/§Y3§!"
  RUS_max_landreform_tractor_promise_timeout_tt: "§R拖拉机承诺没有兑现：§!基础稳定度§R-10.00%§!，政治点数§R-45§!。"

  rus_maximalist_land_reform_events.1.t: "最高纲领派的提案"
  rus_maximalist_land_reform_events.1.desc: "为了回应日趋糜烂的农村局势，乌斯季诺夫向大会提交了最高纲领派的土地改革方案:\n一、与政保局合作，对长期盘踞在农村地区的富农和地主采取强制措施，彻底废除农村土地私有制。\n二、号召知识青年进入乡村，完成农村扫盲工作与意识形态化改造。\n三、进行广泛彻底的农业机械化，摒弃旧时代传统的人工形式。\n四、在自愿的原则下，通过基层干部，呼吁农民进入集体农庄，进行更为高效的大规模种植。\n此方案一经提出便在会上引起轩然大波，许多社革党元老质疑废除私有制运动的合法性与集体农庄的自愿性。乌斯季诺夫当场驳斥了他们，称之为向富农地主的投降主义，以及高高在上的教条作风。长期和社会革命党不睦的布尔什维克们则意料之中的对乌斯季诺夫的方案表示支持，高度肯定了最高纲领派的改革方向。\n讨论过后，大会以73%的得票率通过了方案。"
  rus_maximalist_land_reform_events.1.a: "让我们对农村私有制宣战！"
  rus_maximalist_land_reform_events.next: "继续。"
  rus_maximalist_land_reform_events.2.t: "农民涌向穆罗梅茨"
  rus_maximalist_land_reform_events.2.desc: "随着最高纲领派的提案被贯彻落实，多数农民都享受到了集体化的好处，主动要求加入者越来越多，过去畸形的土地结构渐渐在农村绝迹，广大的农民群众正满怀热忱地为社会主义建设添砖加瓦。\n\n与这场轰轰烈烈的土地改革相呼应，乌斯季诺夫和最高纲领派的名号愈发响亮，“穆罗梅茨”的绰号也不胫而走：作为带领农民反抗富农和地主的勇士，集体农庄的成员们都将乌斯季诺夫视为自己的领路人。"
  rus_maximalist_land_reform_events.2.a: "集体化的浪潮，“穆罗梅茨”的神话。"
  rus_maximalist_land_reform_events.2.a.tt: "§Y最高纲领派的土地改革已圆满完成！§!"
  rus_maximalist_land_reform_events.3.t: "停滞不前的土地改革"
  rus_maximalist_land_reform_events.3.desc: "面对如今一团乱麻的农村局势，曾踌躇满志的乌斯季诺夫终于低下了高昂的头颅。他承认了最高纲领派在土地改革上的彻底失败：盘踞农村的白匪势力没有得到有效肃清，集体农庄制度也没有得到正确的推行……\n\n种种失败的改革让最高纲领派颜面尽失，党内对乌斯季诺夫的质疑声此起彼伏。曾经将他奉为“农民救星”的同僚们，如今纷纷指责他脱离实际、操之过急；更有激进者直接要求他公开谢罪，将最高纲领派的领导权交由“更懂农村”的人执掌。\n\n乌斯季诺夫坐在空荡荡的会议室里，面前摊开的报告写满了数字：白匪袭击次数不降反升，集体农庄的退出申请堆成了小山。他试图辩解，却已是哑口无言。"
  rus_maximalist_land_reform_events.3.a: "“最高纲领”，实验告终。"
  rus_maximalist_land_reform_events.3.a.tt: "§R你究竟干了什么？§!"
  rus_maximalist_land_reform_events.4.t: "土地改革现状"
  rus_maximalist_land_reform_events.4.desc: "伏尔加大饥荒过后，俄国农村的面貌被永久地改写了。\n在此之前，前政府的土地自由化改革已经埋下了灾难的种子。土地从限制性分配转向自由买卖，表面上是为了激活农村经济，实际上却加速了土地兼并：富农凭借资金和生产资料大肆扩张，大量普通农民则在市场波动与债务压迫下逐渐丧失土地，沦为佃农或雇工。中农（serednyaks）在当时已岌岌可危，却还勉强维系着一丝存在感。\n然后饥荒来了。\n伏尔加河流域的连续干旱，将一切推向了深渊。饥饿面前，土地和粮食成了唯一的硬通货。尚有存粮的富农（kulaks）以极低的价格吞并了濒临饿死的农民的土地；负债的农民被迫卖掉最后一点家产以换取一口活命粮；还有更多的人什么都没来得及卖掉——他们只是死了。"
  rus_maximalist_land_reform_events.4.desc_2: "饥荒退去之后，留下的是一幅近乎绝望的图景：\n富农（kulaks）占据了最肥沃、最连片的耕地。他们拥有牲畜、农具，以及粮仓里尚未运走的余粮。贫农（bednyaks）和无地农民（batraks）构成了人口的绝大多数——前者在一块仅够维生的土地上年复一年地挣扎，后者则只能在富农的田地里以苛刻的条件充当雇工。而那个曾经作为农村稳定基石的中农（serednyaks）阶层，几乎彻底消失：他们或破产沦入贫农，或被饥荒吞噬，只有极少数人得以幸存。\n村社的互助传统在饥荒中被彻底冲垮了。富农将粮食视为武器，贫农则陷入沉默的绝望——俄罗斯农村仿佛倒退到了一个旧时代的轮回之中。\n更触目惊心的是大片荒芜的土地。那些属于死者与逃荒者的田产，有的被富农低价收购，有的由地方自治机构名义上托管，却因缺乏劳力和种子而无人耕种。肥沃的黑土地上长满了野草，而饥饿的人却无处下锄。\n如今，俄罗斯的农业需要的不是零敲碎打的修补，而是一场彻底的、革命性的改造——足以砸碎旧秩序、重铸新根基的改造。"
  rus_maximalist_land_reform_events.4.a: "把旧世界打个落花流水！"
  rus_maximalist_land_reform_events.6.t: "集体化宣言"
  rus_maximalist_land_reform_events.6.desc: "——乌斯季诺夫在工农代表大会上的演讲（节录）\n你们要我解释什么叫“合法”，什么叫“自愿”。\n好，我现在就解释。\n有人说直接废除土地私有制是“激进分子作风”。那我问一句：\n一个农民种了一辈子地，临死连块墓碑都买不起——这也叫“合法”？\n地主拿张借条就能牵走人家唯一的牛——这也叫“合法”？\n如果你们认为正确的举措是袖手旁观，那我情愿当一名激进分子。\n“资本从头到脚滴着血。”而我们的土地私有制，滴的是农民的血。\n如果你们管这叫“农村的根基”，那我就是要刨了这根基。\n你们最拿手的正是“自愿”两个字。\n我给你们讲个真事：坦波夫省有个老农，借了富农的种子粮，还不上。富农按“自愿协议”牵走了他的马。\n一个快饿死的人，签什么不是“自愿”？\n你们到农村看看：有脱粒机的人怎么勒索没脱粒机的人，有存粮的人怎么放高利贷。\n去亲眼看看吧，同志们——这就是资产阶级鼓吹的“自由”！"
  rus_maximalist_land_reform_events.6.desc_2: "集体农庄不拿枪逼人。但它会让所有人看见：\n加入的人吃饱，不加入的人挨饿。\n这就是革命的现实。\n你们说集体农庄是空话？\n萨拉托夫的“红色黎明”示范区，同样土地，同样天气，人均产量比单干高出四成。\n坦波夫的“劳动公社”，今年霜冻，个体户绝收四成，他们只绝收不到一成。\n数字都写在报告里。你们可以自己去查。\n老民粹派脱下贵族的燕尾服，穿上农民的树皮鞋，走进伏尔加河流域的每一个村庄，教农民认字、给农民看病、替农民写状子告地主。\n在这之后，“土地与自由”社的同志们扛着猎枪，在萨拉托夫的大路上截停地主的马车，把抢夺来的土地契约当众烧毁。\n——这才是社革党的传统。\n不是坐在彼得堡的沙龙里写措辞优雅的抗议书，而是到农村去，和农民一起流血。\n可现在呢？\n党内有些人，口口声声“土地社会化”，却连废除私有制都不敢讲。\n富农藏粮，他们说“要耐心”；地主复辟，他们说“要合法”；农民被逼得卖儿卖女，他们说“要尊重自愿原则”。\n这难道就是你们所坚持的传统吗？！\n1905年我在街头开枪的时候，1917年我在水兵中间的时候——那时候的你们在哪儿？\n在克伦斯基的部长椅上？在向英国人讨贷款的路上？\n如今又到了战斗的时候。\n社会革命党人理应为农民挺身而出。\n同志们，\n等集体农庄的拖拉机开进田野，\n等公共粮仓的面粉送到工人手里——\n等到那时候，你们再来说我是疯子，还是战士。"
  rus_maximalist_land_reform_events.6.a: "“只有通过彻底的社会变革，才能实现真正的个人发展。”"
  rus_maximalist_land_reform_events.7.t: "关于土地社会化与集体劳动的基本法"
  rus_maximalist_land_reform_events.7.desc: "第一条：土地所有权之归属\n自本法令公布之日起，俄罗斯社会主义共和国境内的全部土地——包括耕地、牧场、林地、果园及未开垦荒地——一概废除私有制，归国家所有。任何个人、家庭或团体不得以任何名义主张土地的私人产权。此前一切土地买卖、抵押、继承之契约，自即日起一律无效。\n第二条：土地使用权的分配原则\n土地使用权依劳动能力分配于实际耕作土地的劳动者。分配工作由各村、乡、县三级“贫农土地委员会”负责执行，该委员会由无地农民（batraks）与贫农（bednyaks）选举产生，其成员不得为富农（kulaks）、地主或其直系亲属。\n分配之标准如下：\n· 以户为单位，按家庭中具有劳动能力的成员人数核定耕作面积；\n· 土地质量优劣须搭配分配，不得以次充好或将贫瘠土地集中分配于特定群体；\n· 分配结果须经村民大会公开表决，三分之二以上到会者同意方为有效。"
  rus_maximalist_land_reform_events.7.desc_2: "第三条：集体劳动的基本原则\n土地分配完成后，享有土地使用权的农民应当在自愿原则的基础上，优先加入所在地区的集体农庄或农业合作社。集体农庄实行统一耕种、统一管理、统一分配的制度。庄员按劳动贡献参与年终分红。\n为鼓励集体劳动，国家将优先向已建立集体农庄的地区提供：\n· 农机设备及燃料配额；\n· 优良种子及化肥；\n· 低息农业贷款；\n· 技术人员及扫盲教师的派遣。\n凡拒绝加入集体农庄而选择独立耕作的农户，仍可继续耕种其分配所得的土地，但须独立承担赋税与生产风险，且不享受上述国家优先扶持政策。\n第四条：过渡期与执行机构\n本法令颁布之日起三个月内，各县须完成贫农土地委员会的选举工作。六个月内，须完成所辖区域内全部土地的丈量与登记。一年内，须完成土地使用权的初步分配。\n内务人民委员会与工农检查院共同负责本法令的监督执行，对阻挠土地分配、篡改分配结果、伪造贫农成分或煽动农民抵制集体农庄者，依法追究责任。\n第五条：解释权与修订权\n本法令的最终解释权属于全俄中央执行委员会。任何涉及土地分配与集体劳动的争议，由各级苏维埃逐级裁定，终裁权归属中央执行委员会下设之农业事务委员会。\n---\n本法令自公布之日起生效。\n农业人民委员 乌斯季诺夫"
  rus_maximalist_land_reform_events.7.a: "新世界的大门已向我们敞开。"
  rus_maximalist_land_reform_events.10.t: "农业机械化"
  rus_maximalist_land_reform_events.10.desc: "传统的农间劳作费时费力，农民们忙碌一天也只能耕耘极其有限的一小块土地，一年下来几乎都是看天吃饭。\n此前萨文科夫的确对农村有所投资，但绝大部分都落入保卫联盟官僚的私囊，农村群众依旧苦不堪言。\n这种情况应该得到改变了，旧时代的农村悲剧不能在新时代的土地上重新上演。为此，经大会一致表决通过，农业部门获得了一笔可观的资金用于购买拖拉机等机械化设备，当然还有必不可少的化肥与良种。\n我们相信在基层干部的协助下，每一位集体农庄成员都能熟练掌握拖拉机的使用。在未来，理性与高效将成为农业生产的代名词。"
  rus_maximalist_land_reform_events.10.a: "同志们，上拖拉机！"
  rus_maximalist_land_reform_events.11.t: "农业设备不足"
  rus_maximalist_land_reform_events.11.desc: "土地改革只是第一步。分到了地，还得种得下去。\n但在今天的俄罗斯农村，最匮乏的恰恰是种地所必需的机器。长期以来，拖拉机的生产与保有量始终严重滞后于实际需求。国内仅有的几家拖拉机厂连年开工不足——设备老化、零件短缺，产能远不能覆盖广袤的农村版图。\n以伏尔加流域为例，一个典型的集体农庄平均每三百公顷耕地才能分配到一台拖拉机，而其中相当一部分还因缺乏维修配件而处于半报废状态。在更偏远的省份，情况更加恶劣：许多村庄至今仍完全依赖畜力和手工劳作，木犁和镰刀依然是农民手中最常用的工具。"
  rus_maximalist_land_reform_events.11.desc_2: "有限的产能迫使我们在分配上做出抉择：\n优先供给集体农庄。 将有限的拖拉机集中在已经建立或即将建立的集体农庄中，确保示范区率先实现机械化，以实际成效说服观望者。这条路见效最快，但意味着散落在外的小农户将继续在原始条件下耕作，短期内可能加剧农村内部的不平等感。\n平均分配。 确保每一个村庄——无论规模大小——都能分到至少一台拖拉机。这条路在政治上最为稳妥，不会引发“厚此薄彼”的怨言。但代价也同样明显：机器过于分散，难以形成规模效应，维修和燃料供应的成本也会成倍增加。\n暂缓分配。 向农民保证，未来九个月内每一台拖拉机都将被妥善分配——但前提是，我们必须先集中精力提升产能、培训基层干部，并建立一套覆盖全国的维修配件供应网络。这条路最需要耐心，也最考验农民对政权的信任。"
  rus_maximalist_land_reform_events.11.a: "优先分配给集体农庄吧，农村基础要打好。"
  rus_maximalist_land_reform_events.11.a.tt: "我们将重点扶持集体农庄。"
  rus_maximalist_land_reform_events.11.b: "平均分配，社会主义讲平等。"
  rus_maximalist_land_reform_events.11.b.tt: "我们将平均分配农业设备。"
  rus_maximalist_land_reform_events.11.c: "让群众们再等等，马上人人都有拖拉机开！"
  rus_maximalist_land_reform_events.11.c.tt: "我们将优先保证拖拉机的生产。土地改革决议栏将出现新任务：在270天内累计完成§Y推广拖拉机§!决议§Y3§!次。若完成则触发§Y不被辜负的信任§!；若没有完成，则基础稳定度§R-10.00%§!，政治点数§R-45§!。"
  rus_maximalist_land_reform_events.12.t: "漫长的等待"
  rus_maximalist_land_reform_events.12.desc: "坦波夫省·某村庄·春耕前\n\n村口的老槐树下，围了一群人。\n\n“上面说了，等九个月，今年收秋前拖拉机就下来了。”村长把通知念了一遍又一遍，“今年嘛……大家辛苦点，先用牲口。”\n\n没人说话。\n\n有人低头搓着手，有人望着远处那几亩要翻的地发呆。一个年轻后生先开了口：“村长，我家那匹骡子今年开春就倒了，我拿什么种？”\n\n“借。互助组。挨一挨。”\n\n“去年也是这么说的。”\n\n人群中响起一声低低的笑——不是好笑的，是那种带点苦味的。\n\n村长沉默了一会儿，声音低沉但清晰：“我只说一句——信不信由你们，但我是信的。这个政权和以前那些不一样。他们说会来，就会来。只是……路要一步一步走。”\n\n春耕还是开始了，在拖拉机的缺席下。村里老把式弯腰扶犁，年轻人在后面撒种，孩子提着水桶跟在最后面。一切和五十年前一模一样。\n\n但村长始终记得那份通知的落款，和通知里那行字——“我们不会忘记你们。”"
  rus_maximalist_land_reform_events.12.a: "请乡亲们相信我们！"
  rus_maximalist_land_reform_events.13.t: "村头来信"
  rus_maximalist_land_reform_events.13.desc: "——《红色田野报》\n\n“拖拉机来了，可那是给他们的。”\n\n说话的是老谢尔盖，一个独门独户的中农。他蹲在自家门槛上，望着远处集体农庄方向扬起的尘土——那里正在开垦一片新地，引擎的轰鸣从清晨持续到傍晚。\n\n“他们说这叫‘重点扶持’，说我们以后也能沾光。”谢尔盖吐了口烟，“可今年的春耕怎么办？我家那匹马去年冬天就死了，我拿什么翻地？”\n\n同样的抱怨正在各个村庄蔓延。那些未能分到机器的个体农户，眼睁睁看着集体农庄的拖拉机开进田野，而自己依然扛着犁头，弯着腰，一步一个脚印地走在垄沟里。\n\n“集体农庄是未来，我们都是垫脚石。”有人这样总结道。\n\n但集体农庄的庄员们并不这么想。“我们这里干得快，产量高，以后全村的粮食都得靠我们。”一个年轻庄员拍了拍拖拉机的前盖，“他们想进来，随时欢迎——但要是死守着自己那一亩三分地，那也不能怪我们不等人。”\n\n土地不会骗人。秋收的时候，集体农庄的粮仓堆满了，个体户的谷仓却还空着一大半。\n\n庄员们开始意识到，集体的力量确实比单干强；而个体户们也开始意识到——要么加入他们，要么被抛下。"
  rus_maximalist_land_reform_events.13.a: "村庄裂开了，但裂缝的方向，恰好是最高纲领派想要的那个方向。"
  rus_maximalist_land_reform_events.14.t: "读者来信专栏"
  rus_maximalist_land_reform_events.14.desc: "——《消息报》\n\n“他们把我们和那些只有两公顷地的散户放在一起，这公平吗？”\n\n一封来自坦波夫省集体农庄庄员的投诉信被送到了报社。信中说，他们的农庄去年刚刚步入正轨，今年本应扩大种植面积，结果上面决定“平均分配”——原本承诺给他们的三台拖拉机，被调走了两台，分给了附近的两个小村子。\n\n“我们理解上面的难处，但我们的计划怎么办？一百五十公顷的土地，一台拖拉机，怎么种？”\n\n而那两个分到拖拉机的村子，日子也不好过。一台机器对于一个小村庄来说是陌生的：没人会修，没有备用零件，柴油还得跑到三十公里外的镇上才能买到。秋收时，那台拖拉机趴窝了将近半个月，等修好的时候，地里的庄稼已经熟过了头。\n\n“早知道这样，不如不开这个头。”一个村长苦笑着说，“见过拖拉机的人，再也回不到牛耕的日子了——可机器坏了，我们还得用牛。”\n\n平均分配的善意在基层被现实磨得支离破碎。每个人都分到了一点，但没有人分到了真正够用的东西。"
  rus_maximalist_land_reform_events.14.a: "这可不好！"
  rus_maximalist_land_reform_events.15.t: "不被辜负的信任"
  rus_maximalist_land_reform_events.15.desc: "伏尔加流域·某村庄·第二年开春\n\n天亮前下的那场雨还在淅淅沥沥地落，空气里是泥土翻开的腥气。村长站在村口，面前是两台崭新的拖拉机——履带上还沾着出厂时的防锈油。\n\n“来了。”他说。\n\n没有人欢呼。围观的老农们只是围着那两台钢铁怪兽走了一圈，有人弯腰摸了摸履带，有人用手指敲了敲车身，发出沉闷的金属声。沉默半晌，一个老妇人从人群里走出来，拎着一壶茶，放在拖拉机旁的石头上。\n\n“给师傅们的。一路辛苦了。”\n\n远处，第一批农机手正在村小学的空地上调试犁具。他们穿着干净的工作服，袖口卷到肘部，脸上带着那种只有“终于到了”的人才有的疲惫和欣慰。\n\n有人问村长：“接下来呢？”\n\n村长望着田垄尽头，那一片待翻的黑土地：“先把村里的地种完，然后去隔壁村帮忙。上面说了，这批机器是‘流动支援队’——谁家先种完，就去帮还没种完的。”\n\n年轻人们早就跑过去听农机手讲解操作了。村长老伴站在他旁边，用手肘碰了碰他：“你去年怎么跟他们说的？”\n\n“我说信就信。”\n\n“现在呢？”\n\n村长没有回答。他踩了踩脚下的泥——今年不用再扛犁了。光凭这一件事，就可以再信一年。\n\n远处，第一台拖拉机发动了，引擎的轰鸣撕裂了村庄的寂静。几个孩子追在后面跑，笑声落了一路。"
  rus_maximalist_land_reform_events.15.a: "没有人会被落下！"
  rus_maximalist_land_reform_events.15.a.tt: "土地改革完成后，§Y圆满完成的土地改革§!将额外获得：生活消费品工厂数量期望§G-2.00%§!，经济法案花费§G-20.00%§!。"
  rus_maximalist_land_reform_events.20.t: "地主阶级死灰复燃"
  rus_maximalist_land_reform_events.20.desc: "一时的强力镇压，并不等于永远的革命成果。\n\n近来各地陆续传回令人不安的报告：白匪残部在农村地区重新活跃起来。他们以被驱逐的地主和富农为基本盘，组建了所谓的“还乡团”——这群武装暴徒在乡间无恶不作，烧毁集体农庄的粮仓、杀害基层干部、强迫农民退还已经分配的土地。在一些地方，他们还悬挂旧旗帜、重立旧地契，仿佛内战从未结束。\n\n还乡团的暴行带有强烈的惩戒性质。"
  rus_maximalist_land_reform_events.20.desc_2: "在萨拉托夫省，他们公开枪毙了一名主持土地分配的贫农委员会主席，并在他身上挂了一块木牌，上面写着“土地的主人回来了”。在坦波夫省，几个村庄的集体农庄账本被当众焚毁，庄员被勒令“各自回家，等老东家回来重新签约”。更恶劣的是，他们利用农民对饥荒的记忆进行蛊惑，声称“跟着布尔什维克只有饿死，跟着我们才有饭吃”。这种煽动在一些粮食短缺的偏远地区竟然获得了短暂的响应。\n\n然而，这并非有组织的农民起义，而是一场旧势力的垂死反扑。还乡团每到一处，首先做的不是改善民生，而是复辟旧秩序——恢复地租、收回土地、清算“叛徒”。他们所谓的“还乡”，归根结底是地主富农在夺回他们失去的财产和特权。农民很快就会发现：跟着还乡团走，换来的不是饱饭，而是重新套上的枷锁。\n\n应当指出，还乡团的活动并非孤立的地方暴乱。已有情报显示，他们与境外流亡的白军势力保持着联系。武器弹药通过边境线悄悄流入，一些前白军军官甚至以“军事顾问”的身份潜入还乡团内部，试图将零散的乡村暴动整合为一场有计划的反革命叛乱。\n\n这对新生的革命政权而言，无疑是一次严峻的考验。如果我们不能及时铲除这些反动武装，不仅土地改革的成果将付之东流，刚刚建立的集体农庄也将遭到毁灭性的打击。为此，大会在讨论过后做出了决定:"
  rus_maximalist_land_reform_events.20.a: "扩大人民民兵，我们必须保证农村的安全……"
  rus_maximalist_land_reform_events.20.b: "……远远不够！把大炮给我拉进村！"
  rus_maximalist_land_reform_events.20.b.tt: "我们将允许地方治安大队使用重武器。"
  rus_maximalist_land_reform_events.20.c: "他们是不是以为只有他们能杀我们？"
  rus_maximalist_land_reform_events.20.c.tt: "除开扩大民兵和增设重武器以外，政治保卫局还将组织一场对白匪蛇首的暗杀。"
  rus_maximalist_land_reform_events.21.t: "哈尔滨一夜"
  rus_maximalist_land_reform_events.21.desc: "随着松花江封冻，街上的积雪被行人踩成了灰黑色的硬壳。哈尔滨，这座被奉系军阀牢牢攥在手里的城市，近年来涌入了大批流亡的白俄难民，也成了白军残余势力在远东最大的巢穴。\n\n格里戈里·米哈伊洛维奇·谢苗诺夫就住在这座城里。那个曾经在贝加尔湖以东叱咤风云的哥萨克首领，那个一度自称“外贝加尔哥萨克军最高统帅”的白军将军，如今依然拥有一座宽敞的俄式宅邸、一支由前白军军官组成的私人卫队，以及奉系军阀给予的“不公开的保护”。他在哈尔滨的客厅里接待日本关东军的联络官，在俄侨俱乐部里筹措资金，在暗处向远东边境地区派遣渗透小组，试图重新点燃社会主义政权在远东的麻烦。\n\n政治保卫总局盯上他已经很久了。\n\n谢苗诺夫不只是一个流亡者。他是白军势力在远东的精神支柱，是日本人和奉系军阀之间最熟悉俄国局势的中间人。只要他还活着，反社势力在满洲就永远有一个可以落脚、可以策划、可以串联的节点。国内农村地区的反社会主义抵抗——那些“还乡团”、那些重新潜入村庄的白军特务、那些暗中支持地主夺回土地的地方势力——大多与他有着千丝万缕的联系。武器通过他组织的渠道流入，资金经由他的手周转，甚至那些“还乡团”的指挥官，很多都是他当年在白军中的老部下。\n\n但他也知道自己身处险境，深居简出，出行路线严格保密，宅邸周围布置了层层警戒。他还雇用了三名前白军侦查员专职负责反侦察。\n\n然而，在哈尔滨，有一个他意想不到的漏洞：他的厨师。"
  rus_maximalist_land_reform_events.21.desc_2: "那名厨师是流亡白俄，早年曾在谢苗诺夫的部队里当过伙夫，后来随他一路逃到满洲。忠诚度从未被怀疑。但他还有一个身份——他的亲弟弟是阿穆尔州一名集体农庄的庄员，而那名庄员，早在两年前就被政保局发展成了外围线人。\n\n弟弟只传过一次消息：“我哥在哈尔滨给谢苗诺夫做饭。”然后他就再也没收到任何指示。\n\nX月X日\n\n谢苗诺夫的晚餐是一道乌克兰红菜汤。厨师像往常一样端上桌，退出门外，然后径直走向后门，上了一辆没有牌照的马车。他在哈尔滨不会再有第二份工作了。\n\n谢苗诺夫喝下了第一口汤。\n\n三小时后，他的私人医生宣布死因为“食物中毒引起的急性心脏衰竭”。奉系军警查封了厨房，逮捕了所有佣人，但厨师早已消失在满洲某条偏僻的村道上，过不了几日他就能回到故乡。\n\n消息传到莫斯科时，政保局的档案室里多了一份标记为“已完成”的卷宗，编号“夜莺-7”。\n\n一个月后，远东边境地区的渗透活动明显减少。又过了两个月，白军流亡者在哈尔滨的俄侨俱乐部里发生了一次公开争吵，分裂为两个互相指责对方“通社”的派系，再无统一指挥的可能。\n\n而在国内农村，变化更为直接。那些失去境外支持的“还乡团”开始暴露出致命的弱点：弹药得不到补充，新成员无法招募，更不知道下一步该往哪里走。过去那种“打完就跑、退入境外休整”的循环被打断了。一些曾经嚣张一时的白匪头目开始收到部下逃跑的消息，另一些则悄悄解散了队伍，把武器埋进了地里，装作从未当过土匪。"
  rus_maximalist_land_reform_events.21.a: "大快人心！"
  rus_maximalist_land_reform_events.22.t: "镰与锤之下"
  rus_maximalist_land_reform_events.22.desc: "还乡团第三支队在黎明前摸进了伏尔加河畔的别列佐夫卡村。他们计划烧毁村苏维埃的仓库，在井里下毒，然后绑走集体农庄主席的老母亲，在下一个集市上游街示众——这是他们惯用的“教学式恐怖”。\n\n但他们没有料到的是，这个村子里的民兵不再是两个月前那支只有三杆旧枪的乌合之众。\n\n自中央下达扩大人民民兵的指令后，别列佐夫卡村得到了三十五支步枪和一批手榴弹。更重要的是，他们得到了一名退役的沙俄陆军士官——一个因痛恨地主而投奔革命的鞑靼人。他用了两个星期时间，教会了三十七个农民如何伏击、如何交替掩护、如何用手榴弹封锁路口。\n\n还乡团刚一进村，粮仓方向就响起了密集的枪声。紧接着，村子东西两端的出口同时被点燃的草车堵死。惊慌失措的暴徒试图沿着河岸撤退，却发现那里已经埋伏了八个扛着猎枪和农用叉子的女人。\n\n战斗持续了不到半小时。还乡团第三支队共计十七人，十一人被击毙，六人被生擒。\n\n被俘的支队长——一个前白军上尉——在被带走前喃喃问道：“你们什么时候有了这么多枪？”\n\n村苏维埃主席踢了一脚他面前的土：“从你们决定当畜生那天起！”"
  rus_maximalist_land_reform_events.22.a: "干得漂亮！"
  rus_maximalist_land_reform_events.23.t: "炮火后的黎明"
  rus_maximalist_land_reform_events.23.desc: "尼古拉耶夫斯克县治安大队接到了一项前所未有的命令：允许在清剿行动中使用重武器。这意味着，从前那些被白匪当作据点的石砌庄园和砖窑，不再是攻不破的乌龟壳。\n\n三天后，治安大队包围了切尔内舍沃村外的一座旧地主庄园。情报显示，还乡团“铁锤支队”约六十人驻扎于此，囤积了大量从附近村庄抢来的粮食和弹药。\n\n大队长没有像往常一样组织步兵冲锋。他命令把两门76毫米野战炮架在庄园正前方四百米处，然后派人喊话：“给你们一刻钟，放下武器出来——否则庄园就是你们的棺材。”\n\n还乡团指挥官的回答是一梭子机枪子弹。\n\n十五分钟后，两门炮同时开火。第一轮炮弹精准地砸在庄园的主楼正中，碎石和木屑飞溅到半空中。第二轮瞄准了院墙和粮仓。第三轮之后，庄园里不再有枪声。\n\n步兵冲进去时，只找到二十几具尸体和十几名吓破了胆的俘虏。其余的人——包括那位嚣张的支队长——已经在第一轮炮击中没了踪影，只剩下半截靴子埋在瓦砾堆里。\n\n消息传开后，周边三个县的还乡团连夜拔营撤退，放弃了多处经营已久的据点。\n\n但在接下来的省委会议上，治安大队长也受到了批评：“你炸了那座庄园是痛快了，可那是历史建筑遗产——下次打准点。”\n\n大队长摊摊手：“下次我尽量让炮弹绕着文化走。”"
  rus_maximalist_land_reform_events.23.a: "真理只在大炮射程之内！"
  rus_maximalist_land_reform_events.30.t: "改造畜牧业"
  rus_maximalist_land_reform_events.30.desc: "旧时代的农村畜牧业以私营私贩为主，这种模式的弊端十分明显：个体户不仅难以看管大规模的畜群，而且也常常得不到满意的市场价格。这种情况直到现在也没有得到改善。\n为了对畜牧业实施彻底的社会主义改造，集体化与合作社化得到了大范围的肯定：\n通过整合养殖大户，国营农场得以集中资源进行统一规划和技术推广；通过计划调配，国家可以保障肉、奶、皮毛等产品的稳定供应。\n而对于小的个体户，基层干部则呼吁建立合作社，将畜群作为合作社的共有资产管理。\n这意味着，无论规模大小，每一个牧人都将不再是孤军奋战的“单干户”，而是社会主义畜牧链条上的一颗齿轮。从今往后，草原与畜栏将不再属于私人腰包，而是属于集体、属于全民。当第一车“合作社奶”运出乡村的时候，牧民们就会明白：只有团结起来的畜群，才能喂饱团结起来的人民。"
  rus_maximalist_land_reform_events.30.a: "让每一头牲畜都烙上集体的印记！"
  rus_maximalist_land_reform_events.31.t: "牧场主的最后一天"
  rus_maximalist_land_reform_events.31.desc: "顿河畔，一座占地四百公顷的牧场。铁栅栏门上还挂着旧主人的姓氏：库兹涅佐夫。\n\n国营农场的接收工作队到的时候，库兹涅佐夫本人正站在主屋的台阶上，穿着那件穿了二十年的皮夹克。他没说话，只是看着工作队的人一栏一栏清点畜群。他的女儿站在他身后，紧紧攥着父亲的衣角。\n\n“按法令，所有超过五十头牛的畜群，全部收归国有。”工作队队长念完文件，抬起头看他，“库兹涅佐夫同志，你有什么要说的吗？”\n\n“有。”库兹涅佐夫的声音很平静，“我养了三十年的牛。我这双手接生过的小牛犊，比你们工作队所有人加起来养的都多。你们把他们牵走了——谁喂？谁管？谁认得哪头牛快要产崽了？”\n\n工作队队长放下文件：“这正是我们需要你的原因。国营农场需要一个有经验的场长。如果你愿意的话——”\n\n库兹涅佐夫沉默了很久。\n\n“场长？”他笑了一声，带着一种说不清是讽刺还是自嘲的语气，“我家的牧场，我做场长。行吧。总比让我滚蛋强。”\n\n他走下台阶，走向那群即将被国有化的牛群。有一头老母牛认出了他，转过头来蹭他的手。他拍了拍牛脖子，低声说了一句只有牛听得见的话。"
  rus_maximalist_land_reform_events.31.desc_2: "第二天，库兹涅佐夫穿上了国营农场配发的工作服。袖口上印着“顿河国营牧场”的字样。他的女儿被安排进了兽医站，正在学习最新的防疫技术。他的旧账本被收进了档案室，取而代之的是一份《季度生产计划表》。\n\n晚饭时，女儿问他：“爸，你恨他们吗？”\n\n库兹涅佐夫夹起一块面包，嚼了很久，才说：“不恨了。恨不动了。而且——那些人说要扩大牧场、引进新种畜、建一个机械化挤奶间……这些事，我年轻的时候想过，但一个人做不了。”\n\n他顿了顿，望向窗外那群正在围栏里过夜的牛：“现在有了。”\n\n窗外的牧场很安静，只有牛铃偶尔响一声。远处，国营农场的工人们正在灯下开会，讨论下一季的饲料采购计划。库兹涅佐夫没有加入他们。他只是坐在窗边，看着自己曾经的地盘，正在变成一个更大的什么东西的一部分。"
  rus_maximalist_land_reform_events.31.a: "属于他的时代结束了。"
  rus_maximalist_land_reform_events.32.t: "五户人家的犹豫"
  rus_maximalist_land_reform_events.32.desc: "沃罗涅日省·扎列奇耶村·春末的下午\n\n村公所的长桌上摊着一份《畜牧业合作社章程》。五户人家围坐在桌边，代表五个只有三五头牛羊的小牧户。有的人手里转着帽子，有的人不时瞟向窗外，不知想些什么。\n\n“章程里写得很清楚，”基层干部伊格纳季耶夫把文件推过去，“畜群作为合作社共有资产，统一放牧、统一防疫、统一销售。年底按各户入社的牲畜数量和劳动力投入分红。亏了，大家一块担；赚了，大家一块分。”\n\n沉默。\n\n最年长的牧人费奥多尔先开了口：“我养羊养了四十年，从来都是自己放、自己卖。现在要把羊交出去，交给谁？你们谁放过羊？”\n\n伊格纳季耶夫不反驳，只是问：“费奥多尔大叔，去年你的羊死了几只？越冬的时候冻死多少？卖给收购商的时候，他压了你多少价？”\n\n费奥多尔不说话。他的羊去年冻死了七只。收购商给他的价格只有镇上肉铺卖价的一半。这些事，他知道，邻居也知道。\n\n“你们五个人的羊加起来，七十多只。七十只羊，在谁家院子里都装不下。但只要你们愿意，我可以申请一块公用牧场，再协调一台打草机。明年冬天，你们的羊不会再因为没有干草而饿死了。”伊格纳季耶夫停下来，“我一个人说没用，要你们五个人都点头才行。”\n\n又是一阵沉默。一个年轻媳妇小声问：“那我要是不放心，能先牵一半入社，另一半自己留着吗？”\n\n“可以。章程里有‘半入社’的条款。”伊格纳季耶夫翻开那一页，“但半年后你要做出选择——要么全部入社，要么全部退出。不能一半一半。合作社要的是齐心，不是两头下注。”"
  rus_maximalist_land_reform_events.32.desc_2: "“我入。”费奥多尔忽然说。所有人看向他。他低着头，盯着自己的手，“反正我一个人也养不好。死了七只羊，我心疼了整整一个冬天。入社吧，我老了，一个人放不动了。”\n\n第二个人说：“我也入。”第三个人说：“我考虑一下。”第四个人没说话，只是把杯子里的水喝了。\n\n第五个人就是那个年轻媳妇。她看了看费奥多尔，又看了看那份章程，咬了咬嘴唇：“我把我家的四只羊也加进去。但有一条——我得是合作社的会计。我识字的，你们谁都不许乱动账本。”\n\n伊格纳季耶夫笑了：“这个当然。”\n\n一个月后，扎列奇耶村的畜牧业合作社正式挂牌。门口挂着一块手写的木牌，字迹歪歪扭扭，是费奥多尔用烧过的树枝写的：“团结合作社”。开业那天，伊格纳季耶夫带来了一袋盐，按村里的老习俗，撒在合作社的门槛上。\n\n“盐不散，社不散。”他说。\n\n费奥多尔站在人群中，望着那群被赶进新建围栏里的羊——七十多只，挤在一起，叫声此起彼伏。他忽然觉得，这个冬天的羊叫声，似乎没有去年那么凄凉了。\n\n伊格纳季耶夫站在他身边，也望着那群羊：“第一车合作社奶，估计两个月后就能运出去。”\n\n费奥多尔沉默了一下，没有回答这句话。他只是说：“那家年轻的媳妇，算账很好。她管账比我自己管好。”\n\n他的语气很轻，但这句话里，有一种说不清的东西——旧的牵挂正在被新的信任慢慢替代。那天黄昏，合作社的成员们没有开什么会，只是各自带着家里的孩子们，一起把围栏的缺口补好了。钉子不够，有人从自家拆来了旧木板，有人把自家割的干草扔进了集体草棚。收工的时候，费奥多尔发现自己的围栏也修好了。他还没来得及问是谁修的，年轻媳妇扛着锤子从他面前走过，头也不回。"
  rus_maximalist_land_reform_events.32.a: "团结起来。"
  rus_maximalist_land_reform_events.40.t: "集体农庄示范区"
  rus_maximalist_land_reform_events.40.desc: "集体农庄对于大多数农村群众而言，是一个新鲜而陌生的名词。它时常出现在官方的画报和基层干部们的口中，至于它具体是什么，农村群众都不甚了解。\n但对于一小部分人来说，集体农庄是触手可及的东西：自共和国建立以来，乌斯季诺夫就有意识地号召群众建立集体农庄，以保卫自己免受流窜白匪的袭扰。当然，集体农庄的好处远不止于地区安保。在农庄中，庄员人人平等，集体决策成为主流，互帮互助几乎是每个庄员的基本素养。\n地区劳动竞赛中，集体农庄的人均产量远在其他个体户之上。物质条件的极大改善使越来越多的人注意到了集体农庄——有的是出于好奇，有的则是为了切身利益。但无论如何，集体农庄已经逐渐成为农业生产的主流。而这些示范区将作为先驱者的足迹，被人们永远铭记。"
  rus_maximalist_land_reform_events.40.a: "快看我们的集体农庄，到处都是一片新景象！"
  rus_maximalist_land_reform_events.41.t: "扎列奇耶村的土地会议（一）"
  rus_maximalist_land_reform_events.41.desc: "沃罗涅日省·扎列奇耶村·村公所\n\n法令下来的那天，扎列奇耶村的村公所里挤了四十多号人。长条凳不够坐，有人蹲在门槛上，有人靠在窗台边。空气里混着旱烟和泥土的气味，谁都不说话，只在村长把法令念到关键处时，底下才发出一阵低沉的嗡嗡声。\n\n“土地归国家所有……由贫农委员会分配……集体农庄自愿加入。”\n\n村长念完了，把纸放在桌上，用手压了压：“行了，有什么想问的，现在说。”\n\n沉默了一会儿。后头有个声音响起来：“我家的地，我爹传给我的，我种了二十五年——现在说不是我的了？”\n\n“地还是你种，只是不是你的。你不能卖，不能租，不能传给儿子。但你种出来的粮食归你，只要按规定上缴就行。”村长停了一下，“而且，如果加入集体农庄，种子、农具、技术指导都会有——”\n\n“那不还是不是我的？”\n\n村长没有立刻回答。他低头看了看法令上那句话：“……按劳动能力分配土地使用权。”他抬起头：“是啊，不是你的了。可你什么时候真正‘有过’地？你能卖吗？你能抵押换钱吗？你爹在的时候，遇上荒年不照样把地抵押给富农换粮，最后还不是没了？”"
  rus_maximalist_land_reform_events.41.a: "那个声音没有再响起。"
  rus_maximalist_land_reform_events.42.t: "扎列奇耶村的土地会议（二）"
  rus_maximalist_land_reform_events.42.desc: "沃罗涅日省·扎列奇耶村·村公所\n\n选举贫农委员会的时候出了事。\n\n按法令规定，委员会成员必须是无地农民或贫农，富农和地主及其直系亲属不得参选。村长沙哈罗夫让人在墙上贴了一张大白纸，每家每户自己报成分，然后村民互相投票。\n\n头两轮还算顺利。到了第三轮，选举贫农委员会主席时，有人在纸面上提名了一个叫“谢尔盖·彼得罗夫”的名字。\n\n“谢尔盖不行。”角落里有人开口。\n\n“他爹给库兹涅佐夫家当了二十年管家。他家的地，是库兹涅佐夫家‘赏’的。”\n\n谢尔盖的脸一下子白了。他站起来：“我是贫农！我家就那五亩地！库兹涅佐夫家倒了跟我有什么关系！”\n\n“那你爹当管家的时候，库兹涅佐夫家少收你们家租子了？你家的犁是谁给的？你家的马是谁给的？”\n\n谢尔盖张了张嘴，没说出来。\n\n村长沉默了一小会儿：“谢尔盖，你出去吧。等选举完了再进来。”\n\n谢尔盖站在门口，门在他身后关上了。门板很薄，里面议论的声音传出来，模模糊糊的。他蹲在门外的台阶上，用手搓了一把脸，没有走。"
  rus_maximalist_land_reform_events.42.a: "有人路过，看了他一眼，也没有说话。"
  rus_maximalist_land_reform_events.43.t: "扎列奇耶村的土地会议（三）"
  rus_maximalist_land_reform_events.43.desc: "沃罗涅日省·扎列奇耶村·村公所\n\n那天晚上的争论，是关于那句“在自愿原则的基础上”。\n\n“什么叫自愿？”一个老农把烟袋锅子磕在桌腿上，“我不加入，你们是不是就不给我种子？不给我分农具？”\n\n“法令说了，不加入的农户仍然享有土地使用权，只是不享受优先扶持——”\n\n“那就是逼我入！”\n\n“逼你的是土地，不是政策。”村长沙哈罗夫说，“你一个人种，能种多少？你家那匹骡子去年就老得拉不动犁了。秋收的时候你又要请短工、又要还贷款——谁逼你？你每年交不上粮的时候逼你自己。”\n\n老农不说话了。\n\n一个年轻媳妇举手：“我家的地想加入集体农庄，但我公公不同意——地是算他名下的。我能单独入吗？”\n\n“按户为单位。”村长翻了翻法令，“一户之内，需要全体具备劳动能力的成员同意。你公公不同意，就只能分户……”\n\n“分不了户，分了户我住哪儿？”\n\n“那就再谈。”"
  rus_maximalist_land_reform_events.43.a: "现场的人意识到：好的意图和真实生活中的人掺和到一起的时候，难免磕磕碰碰。"
  rus_maximalist_land_reform_events.44.t: "扎列奇耶村的土地会议（四）"
  rus_maximalist_land_reform_events.44.desc: "沃罗涅日省·扎列奇耶村·村公所\n\n散会的时候，费奥多尔——就是那个养羊的老头——在门口遇见谢尔盖。谢尔盖还蹲在台阶上。\n\n“你怎么还在？”\n\n“我……等消息。”\n\n“消息有了。”费奥多尔在他旁边坐下来，掏出烟袋子，“没选上。”\n\n谢尔盖愣了一下：“那谁当主席了？”\n\n“村长自己先顶着。下个月重新选。”\n\n“……那我呢？”\n\n费奥多尔点上烟，抽了一口：“你家的地照分，只要你不是富农就行。委员的事，下次再说。”他顿了一下，“不过你爹那事，村里人都知道。你得让大家知道你跟他们是一边的。”\n\n谢尔盖低着头，捻着一截草茎：“我怎么让他们知道？”\n\n费奥多尔拍了拍他的肩膀：“来合作社帮忙。不用说什么，来就行。”\n\n夜色降下来了，村公所的灯还亮着。屋里，剩下的人围在一起，商量着第一批集体农庄的边界应该划到哪里。有人在地图上比划，有人在小本子上记着各家的人口和牲畜数量——扎列奇耶村的第一份土地台账，就在这个夜晚被一页一页地写了出来，字迹歪歪扭扭，但每一条都有人亲眼见证。\n\n谢尔盖站了起来，把草茎扔到地上：“我明天来。”"
  rus_maximalist_land_reform_events.44.a: "费奥多尔摆了摆手，没再说话。他弯腰把地上的烟灰扫干净，然后慢吞吞地走进了夜色里。"
  rus_maximalist_land_reform_events.50.t: "富农的末日"
  rus_maximalist_land_reform_events.50.desc: "如果说最高纲领派对贫农而言是救世主，那么对富农来说，便是一场彻头彻尾的噩梦。\n\n在刺刀与枪口的威压下，他们通常只有两个选择：\n\n交出土地，带着被没收的农具和牲畜，以“庄员”的身份进入集体农庄——兴许还能保住一条性命，留下几分体面。但选择这条路的人很少。大多数富农拒绝放弃自己多年积攒下来的家业，有的甚至试图组织反抗。\n\n另一条路更短，也更直接。那些被民兵逮捕的富农，大部分在审判后被处决。但这还算“体面”的结局。许多地方干部在报告中提到，有些平日里横行乡里的富农，被愤怒的贫农从藏身处拖出来，扒去衣物游街示众，在村民大会上接受公开审判，就地处决后暴尸数日——尸体挂在村口的枯树上，直到风干了才被放下来。\n\n我们必须理解这种愤怒。毕竟，正是这些粮食投机分子，在大饥荒最惨烈的年份里，把粮食囤积在谷仓中发霉，等待着涨到更高的价钱。\n\n有的外国观察家指责我们的行为违背人伦、侵犯个人权益，“穆罗梅茨”则斩钉截铁的回答道:"
  rus_maximalist_land_reform_events.50.a: "恶魔们可曾想到有今天！"
  rus_maximalist_land_reform_events.51.t: "一个富农的最后一天"
  rus_maximalist_land_reform_events.51.desc: "伏尔加流域\n\n库兹马·伊里奇是被敲门声吵醒的。不是用手敲——是用枪托。\n\n他披上外套走到门口时，透过门缝看见了火把的光。院子里站着七八个人，手里举着火把，拿着棍子和镰刀，有的别着民兵的袖标——红布条，用别针固定在左臂上，最近才发下来的。\n\n门被从外面一脚踹开了。一个年轻后生走进来，库兹马·伊里奇认得他——去年夏天，这后生还来他这儿赊过一袋黑麦。后生也认出了他，眼神躲闪了一下，然后挺了挺胸膛，把民兵的袖标往胳膊上捋了捋——像是提醒自己，也像是提醒对面的人，这道红布条意味着什么。\n\n“库兹马·伊里奇·佩特罗夫，贫农委员会决议，你家的土地、牲畜、农具，全部没收。”\n\n后生身后的人群里，有人低声说了一句“跟他费什么话”，但没有人冲上来。他们只是举着火把，站在门槛外面。\n\n库兹马·伊里奇站在门框里，身上还穿着睡衣，赤着脚。他望着门外那一张张被火光映亮的脸——都是这个村里的人。他认得每一张脸：有的他从小看着长大，有的他借过粮，有的他雇过长工，干完活还多给了一袋土豆。\n\n“我种这块地种了三十年。”他声音很平，没什么表情，像是在陈述一个跟别人无关的事实。“我爹死后，我花了十年才把欠的债还清。你们要收走我的地，可以。但能不能给我留一头牛？我还有个五岁的孙子——”\n\n“不行。”后生回答。他说话的时候，眼睛没有看库兹马·伊里奇，而是看着旁边的墙。墙上挂着一幅圣像画，下面是一个旧木柜，柜门开着，里面是叠好的被褥，被角已经洗得发白。\n\n库兹马·伊里奇没有说话。他转身走进里屋，过了一会儿，拎着一个小布袋出来，放在桌上——布袋不沉，落地时声音很轻。里面是些零零碎碎的硬币，和一卷包在油纸里的卢布。\n\n“这些钱，我攒了三年。够买一头牛。”\n\n人群沉默了一阵。没有伸手去拿那个布袋。后生先开了口：“按法令，一切财产，不分大小、不分新旧，全部充公。入库登记后，由集体农庄统一支配。”"
  rus_maximalist_land_reform_events.51.desc_2: "库兹马·伊里奇把布袋推得更近了一些，布袋在桌面上向前滑了几寸，停在了桌沿附近。\n\n“你们可以拿走钱，拿走粮食，拿走犁，拿走马。我只要一头牛，再给我留下一副犁铧。我今年还能种地——我种了三十年了，我知道哪块地该深翻，哪块地该轮休。你们把地收走了，谁来种它？”他的声音很轻。\n\n人群里有一个人低声说：“他说得对，他确实知道怎么种地。”但没有人附和，也没有人反对。火把在风里晃了一下，火星飘到了门槛上，很快灭了。\n\n后生终于开口了：“库兹马·伊里奇，你先跟我们走一趟吧。有什么话，到贫农委员会说。”\n\n天亮的时候，库兹马·伊里奇被带走了。他的妻子站在门口，手里捏着那叠没有被拿走的小额钞票，不知道它被允许留下，还是只是忘了收。他后来把它交到了贫农委员会。收据上写的是“自愿捐献”，他不会写字，按了一个手印。那张收据他一直留着，压在柜子最底层，和那幅圣像画放在一起。\n\n村口的枯树上，几天前挂过一具尸体——隔壁村的一个富农，姓什么他已经记不清了，只记得那人穿着没有领章的外套，尸体被风干后的轮廓……"
  rus_maximalist_land_reform_events.51.a: "像一件空荡荡的衣服。"
  rus_maximalist_land_reform_events.52.t: "一个贫农的新的一天"
  rus_maximalist_land_reform_events.52.desc: "伏尔加流域\n\n贫农委员会的审查没有花太长时间。他们翻了一遍库兹马·伊里奇的账本——土地超过规定上限，雇过长工，粮仓里存着一年多的余粮。这些足够了。\n\n他被允许留在村里，但必须交出一切财产，进入集体农庄。村里人给他安排了一间旧仓房，他搬进去时只带走了一只箱子，里面放着一套换洗衣物、一本破旧的种植笔记——封面上写着“1913年—1926年”，里面是每一年天气的记录和每块地的收成——以及一小袋用碎布包好的种子。那袋种子他没有交给任何人，也没有人来收。\n\n春天来了。集体农庄开始翻地。库兹马·伊里奇被分配去抬石头——清理田里的碎石，为拖拉机耕作做准备。他弯着腰，一块一块地捡，把石头堆到田埂上。旁边就是他的旧地——那片他种了三十年的田，已经被划入了集体农庄的连片耕地。种子已经播下去了，他不知道是谁播的，也不知道播的是不是他往年习惯用的那个品种。\n\n有人路过，喊他“佩特罗夫大叔”，问他累不累。他摇了摇头：“地不累人，人累地。”说完他又蹲下去，把一块埋得很深的石头从土里抠出来——这块地他曾经翻过几十遍，他知道哪一尺土里有石头。\n\n夏天，他在地头看见自家原来那副犁铧，被搁在仓库门口，已经生了锈，旁边是一台从集体农庄统一调配的新设备。他走过去，想弯腰把犁铧扶正，旁边经过的年轻人看了他一眼，说别动那个，那是要当废铁卖的，不值几个钱。\n\n他收回了手，站了一会儿，转身走了。"
  rus_maximalist_land_reform_events.52.a: "他没走几步，回头向那副犁铧望了最后一眼。"
  rus_maximalist_land_reform_events.53.t: "第二个春天"
  rus_maximalist_land_reform_events.53.desc: "伏尔加流域\n\n那袋种子在箱底躺了一整年。\n\n库兹马·伊里奇偶尔会在夜里打开箱子，把那块碎布包拿出来，放在膝盖上，解开，看看里面的种子，再系好，放回去。他从没跟任何人提起过它。或许它还在本身就是一种回应。\n\n春天又来了，来得比去年早一些。\n\n去年那个冬天太冷了，冻死了好几户人家母羊刚下的小羊羔。开春融雪的时候，村东头那家寡妇家的屋顶塌了一角——雪压的，好在人没伤着。库兹马·伊里奇第二天早上路过时，看见几个邻居已经扛着木料和工具爬上去了。有人朝他喊了一声：“佩特罗夫大叔，搭把手！”他站了一会儿，放下了手里拎着的草绳，爬上屋顶，把旧木板撬下来，递了新板上去。邻居们没人说“谢谢”，也没有人提他以前是什么身份。屋顶修好的那天傍晚，寡妇家煮了一锅稀粥，在院子里摆了几只碗，扛木头的那几个人蹲在墙根下喝粥，有一搭没一搭地闲聊，望着远处开始变绿的田野。库兹马·伊里奇也端了一碗。\n\n集体农庄的春耕开始后，他不再像去年那样被单独分派拾石头了——今年拖拉机犁地已经普及到这片地，他的活变成了跟播种机，负责看种子漏不漏、深浅合不合适。他蹲在田埂上，用手指扒开刚覆上土的垄沟，捻了捻土，又站起来，朝拖拉机手打了个手势。那手势的意思是“再深一截指节”。\n\n拖拉机手是个年轻人，去年从城里来的，开拖拉机的手艺不错，但对土地不太熟悉。他停下来，把播种深度调了一档，回头看了看库兹马·伊里奇。库兹马·伊里奇没说话，只是点了点头，然后弯腰把田埂边上几块露出来的小石子捡走，扔到筐里。\n\n那之后，他注意到有些庄员会在休息时过来问他一些事：有的问“这块地适合种什么”，有的拿着被虫咬过的叶子过来让他看，有的问他犁铧的入土角度要怎么调。他说话不多，但给出的答复往往很实在。比如有人问起那几棵被虫咬过的叶子，他只是蹲下来翻了翻土，在根部附近找了一会儿，用指尖拨出一只灰褐色的蛴螬，放在叶子上，说：“就这。深翻一遍，把虫卵翻到地表来，冻死就完了。”\n\n后来他发现自己分到的口粮里偶尔会多出一小块腌猪油，或是几个土豆。没有人承认自己放的，也没人问是谁放的。\n\n他后来发现，集体农庄用的是新品种，比他往年种的早熟十天，穗粒更饱。收成的时候，他站在地头，看收割机开过去，粮仓一点一点满起来。没有人问他“怎么样”，他也没有主动说什么。那天他回家后，没有再打开过那个箱子。"
  rus_maximalist_land_reform_events.53.desc_2: "有一天傍晚，后生——现在是集体农庄的副队长——在田埂上找到他，手里拿着半截麦穗：“大叔，你看看这个，是不是有点不对劲？穗尖发黑。”\n\n库兹马·伊里奇接过来，捏了捏，对着夕阳看了看穗尖上那几个发黑的籽粒，又掰开一粒，闻了闻。\n\n“锈病。”他把麦穗还给后生，“去年就有，不严重。今年种得太密了，通风不够。明年垄距加两寸，就没事了。”\n\n后生把麦穗收进口袋，沉默了一下：“你怎么知道是锈病，不是别的什么？”\n\n库兹马·伊里奇没有回答。他蹲下去，捏了一把地里的土，搓了搓，让土从指缝间漏下去。身后有两个人扛着铁锹走过，其中一个停下来问后生明天翻哪块地，后生指了一个方向，那人应了一声“好”，又随口问了一句库兹马·伊里奇“要不要一起走”。他站起身来，拍了拍手上的土。\n\n“我种了三十年地了。别的不会，这个还认得。”\n\n他说完走了几步，又回头对后生补了一句：“锈病要是扩散了，拔掉病株，隔一垄烧掉，别舍不得。”\n\n那天晚上，库兹马·伊里奇从箱子里拿出那袋种子，解开碎布，捏了几粒放在手心里看了很久。第二天早上，他把它拿到了集体农庄的种子仓库，放在保管员的桌上。\n\n“这是老品种，”他说，“抗倒伏，但产量不如新的。留一点吧，万一哪年气候不好，新品种扛不住，这个还能顶上。”\n\n保管员是个年轻人，看了看那袋种子，又看了看他：“你怎么知道新品种扛不住？”\n\n“我不知道。”库兹马·伊里奇摇了摇头，“但地的事，说不准。多留一手总是好的。”\n\n他走出种子仓库的时候，天已经大亮了。田野上，拖拉机正在远处翻地，一排排黑土在阳光下翻涌出来，像是大地在翻身。他站在仓库门口看了一会儿，一个扛着铁锹的邻居从旁边经过，朝他点了点头，他点了点头。然后转身，朝那片他种了三十年的地走去——哦不，已经不是他的地了。但那块地还在那里。而且，今年冬天的时候，他家的柴火堆旁边多了一捆劈好的木柴，不知道是谁放的。他想了想，把柴火抱进了屋里。"
  rus_maximalist_land_reform_events.53.a: "足够多了。"

