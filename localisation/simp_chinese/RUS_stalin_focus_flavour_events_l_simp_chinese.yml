l_simp_chinese:
 RUS_stalin_focus_flavour.1.t: "粮食采购危机"
 RUS_stalin_focus_flavour.1.d: "革命成功之后，哪怕是最极端的计划经济者也被迫接受了农村市场体系，社革党对此的狂热和坚定足以阻止任何一个反对它的提案。\n\n但现在事情闹大了，革命导致的军事斗争和萨文科夫经济体制的破产，迫使政府向每一个能卖出粮食的农民采购粮食。发现这一点的粮食投机家开始大肆囤积粮食以谋取巨利，现在城市里粮食的价格已经飞到了每普特XX卢布，约等于革命前的四五倍。城市苏维埃要求立刻改变这个状况，但农村苏维埃却不满该措施将导致的农产品收购价降低，也开始要求维持现状。\n\n现在国家苏维埃大会已经吵成一团，要求立刻管控和执行计划经济的意见占了一半，另一半则是社革党坚定的反对意见。全劳联虽然不强烈赞成计划经济，但他们也对城市居高不下的粮家感到愤怒。\n\n现在问题已经提出，解决办法是什么?"
 RUS_stalin_focus_flavour.1.a: "让社革党去死吧，粮食价格必须得到控制"
 RUS_stalin_focus_flavour.1.b: "同意进行控制，但必须坚持农村自由采购制度"
