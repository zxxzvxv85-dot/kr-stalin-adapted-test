 RUS_fr_military_reform.90.d:0 "联邦军备与国防工业委员会常务委员会\n呈国家军事委员会、联邦计划委员会：\n[RUS_fr_armaments_report_header]\n\n自委员会成立以来，总参谋部提出的战术要求、各军工机构提交的工程方案与联邦计划机关下达的生产指标，已第一次被纳入同一建设周期。[RUS_fr_armaments_report_priority]\n\n§Y一、陆军兵器工作§!\n[RUS_fr_armaments_report_infantry_route]\n\n§Y二、战役机动与运输工作§!\n[RUS_fr_armaments_report_mobility_route]\n\n§Y三、装甲兵器工作§!\n[RUS_fr_armaments_report_armour_route]\n\n§Y常务委员会结论§!\n[RUS_fr_armaments_report_conclusion]\n\n联邦军备与国防工业委员会常务委员会谨呈。"
