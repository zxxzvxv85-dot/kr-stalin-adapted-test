l_simp_chinese:
 RUS_fr_post_revolutionary_armed_forces:0 "革命后的武装力量"
 RUS_fr_post_revolutionary_armed_forces_desc:0 "革命夺取了国家，却没有立即带来一支能够保卫革命的军队。旧政权留下的军区、仓库和参谋机关仍按昨日的习惯运转，归国的红军干部与各地工人士兵也尚未被纳入统一军制。伏龙芝要求我们首先清点这份混乱的遗产：保存一切可用的专业知识，清除反动关系网，并让红军重新成为劳动共和国手中可靠的武装力量。"
 RUS_fr_frunze_defence_report:0 "铁木辛哥的整军报告"
 RUS_fr_frunze_defence_report_desc:0 "奉伏龙芝之命，铁木辛哥走访了军区司令部、训练营和前线部队，把那些长期被报表掩盖的问题写进同一份报告。军官派系、编制混乱、训练不足与军工脱节不再能被解释为革命后的暂时困难。军事委员会将以这份报告为依据，为肃清隐患、重组军制和整顿国防工业规定明确的先后次序。"
 RUS_fr_unified_military_leadership:0 "首长负责制"
 RUS_fr_unified_military_leadership_desc:0 "革命军队不能重走旧军官团专断跋扈的道路，但集体讨论也不应成为无人负责的借口。伏龙芝主张在政治监督和士兵权利得到制度保障之后，由军事首长对训练、命令与战果承担完整责任。可以在命令下达前充分争论，而一旦作出决定，全军便必须按照同一意志行动。"
 RUS_fr_rebuild_revolutionary_military_council:0 "重建革命军事委员会"
 RUS_fr_rebuild_revolutionary_military_council_desc:0 "内战年代的革命军事委员会曾把分散的赤卫队、铁路与军需机关组织成一支真正的红军，如今共和国再次需要这样的中枢。重建后的委员会将由伏龙芝主持，以集体决策确定战略，以专业参谋落实命令，并以政治机关确保军队始终服务于劳动人民。斯大林也将以总司令身份进入最高指挥体系，为革命政府承担直接的军事责任。"
 RUS_fr_reorganise_general_staff_districts:0 "统一指挥与军制"
 RUS_fr_reorganise_general_staff_districts_desc:0 "俄罗斯广阔的距离使每个军区都养成了自己的表格、命令格式和动员习惯，中央意图往往在层层转达中变得面目全非。沙波什尼科夫等参谋军官将协助伏龙芝重新划定总参谋部与军区的职责，把首长负责制、作战计划和标准化编制写入同一套制度。自此，莫斯科作出的决定应当能够以清晰而一致的形式抵达每一支野战部队。"
 RUS_fr_national_military_reform_program:0 "军队重组"
 RUS_fr_national_military_reform_program_desc:0 "零散修补已经无法解决红军面对的结构性问题。伏龙芝将把总参谋部、军区、院校和政治机关召集到同一张会议桌前，使训练、动员、作战理论与干部培养服从一项全国性的整军计划。改革不会以几份新条例告终，它将深入每一级司令部和每一座兵营，直到革命战争时期的临时军制被彻底重组。"
 RUS_fr_cadres_decide_everything:0 "政治委员组织体系"
 RUS_fr_cadres_decide_everything_desc:0 "枪炮不会自行理解革命的目的，命令也无法取代官兵之间的政治信任。我们将建立从军事委员会延伸至基层连队的政治委员组织网，统一干部教育、纪律申诉和部队政治工作。政委不再只是危急时刻的鼓动员或军官身后的监视者，而将成为连接党、指挥员与普通战士的正式纽带。"
 RUS_fr_equipment_is_the_armys_skeleton:0 "科学化总参谋部"
 RUS_fr_equipment_is_the_armys_skeleton_desc:0 "勇气可以赢得一场冲锋，却无法独自设计一场覆盖数百公里的战役。总参谋部必须摆脱私人经验与派系习惯的支配，让地图测绘、统计资料、兵棋推演和战史研究成为制定计划的共同语言。经过改组的参谋机关将不断检验自己的判断，把前线教训转化为全军都能使用的军事知识。"
 RUS_fr_train_before_expansion:0 "纵深作战理论"
 RUS_fr_train_before_expansion_desc:0 "特里安达菲洛夫等年轻理论家指出，现代战争的胜负不会在第一道战壕前决定。红军必须同时组织正面突破、预备队投入和纵深追击，使敌人的炮兵、交通与指挥系统在连续打击下共同崩溃。多梯队协同和快速增援将不再是少数军官的设想，而会成为全军理解战役的基本方式。"
 RUS_fr_red_commander_system:0 "“雷雨”军事学院"
 RUS_fr_red_commander_system_desc:0 "流亡、内战与长期政治分裂使整整一代红色军官失去了系统深造的机会，许多宝贵经验也只能依赖私人回忆流传。“雷雨”军事学院将重新召集归国将领、前线干部和军事理论家，以高级轮训、兵棋推演和战役研究培养新的指挥集体。这里不应复制旧帝国军校的等级壁垒，而要让忠于革命且真正具备才干的人获得承担重任的机会。"
 RUS_fr_unified_training_mobilisation_system:0 "标准化陆军编制"
 RUS_fr_unified_training_mobilisation_system_desc:0 "如今，同样冠以步兵师之名的部队可能拥有完全不同的兵员、火炮和补充办法，这种差异在和平时期只是混乱，在战争中却足以酿成灾难。军事委员会将统一师、军与军区的编制表、动员表和训练周期。新组建的部队必须能够迅速接入既有指挥与保障体系，而不再从头发明自己的军队。"
 RUS_fr_frunze_field_regulations:0 "进攻性决策机制"
 RUS_fr_frunze_field_regulations_desc:0 "伏龙芝始终反对把进攻精神误解为不计代价的正面冲锋。新的决策机制将允许前线指挥员在既定意图下主动判断，同时要求他们快速上报情况，并与炮兵、装甲和后勤机关保持联系。真正的主动性来自充分准备和清晰责任，而不是以士兵生命掩盖参谋工作的失败。"
 RUS_fr_general_staff_experimental_formations:0 "严格训练制度"
 RUS_fr_general_staff_experimental_formations_desc:0 "铁木辛哥在整军报告中尖锐地指出，许多部队的优良成绩只存在于事先安排好的检阅场上。今后的训练将采用统一考核、实弹射击和不预先告知结果的对抗演习，任何司令部都不能再用漂亮报表代替战斗能力。严格训练并非为了折磨士兵，而是为了让他们在真正的炮火中拥有活下去并完成任务的本领。"
 RUS_fr_national_mobilisation_supply_test:0 "老兵标杆制度"
 RUS_fr_national_mobilisation_supply_test_desc:0 "革命战争的老兵掌握着任何教科书都无法完整记录的知识：如何在混乱中维持队形，如何判断一次冲锋是否值得，又如何让疲惫的新兵重新站起来。我们将把这些老兵编入训练和考核体系，使他们成为新部队的标杆与基层干部的老师。个人传奇终会随岁月消逝，但经过整理和传授的经验能够成为整支红军的传统。"
 RUS_fr_all_russian_red_army_exercise:0 "淬火成钢"
 RUS_fr_all_russian_red_army_exercise_desc:0 "条例只有在泥泞、疲惫和错误命令面前仍然有效，才配被称作制度。来自各军区的部队将在沃罗涅日附近展开一场不预设胜负的大规模对抗演习，总参谋部、铁路、仓库与野战医院也必须一同接受检验。红军将在这座熔炉中暴露最后的弱点，并以革命集体主义、军事先锋主义和革命英雄主义把自己淬炼成钢。"
 RUS_fr_revolutionary_military_system_finalised:0 "红军最强大"
 RUS_fr_revolutionary_military_system_finalised_desc:0 "从士兵委员会到总参谋部，从军校课堂到装甲纵队，曾经彼此割裂的改革已经汇成一套完整的革命军事制度。德意志帝国曾以为旧秩序的军队可以永远压制东方的劳动人民，而它的覆灭已经给出了答案。红军的强大不来自鞭子与盲从，而来自自觉纪律、现代军事科学，以及千百万人民对自己军队的信任。"
 RUS_fr_military_rectification:0 "军事肃反"
 RUS_fr_military_rectification_desc:0 "旧军官团的公开统治已经结束，但依靠私人效忠、秘密结社和白军关系网维系的影响仍潜伏在若干司令部中。伏龙芝拒绝以毫无边界的恐慌取代调查：纪律委员会必须依靠证据、履历与公开程序查明责任。肃反的目的不是摧毁军事专业，而是把军队从反革命派系手中解放出来，使忠诚与能力都能在制度下得到证明。"
 RUS_fr_investigate_white_networks:0 "军事民主制试行"
 RUS_fr_investigate_white_networks_desc:0 "白军残余能够在军队中藏身，正是因为基层战士长期没有正规的申诉与监督渠道，只能依附军官的私人关系。军事民主制的试行将允许士兵公开反映生活、训练和纪律问题，并选出代表参与有限的基层监督。革命民主不能代替战场指挥，但它能够让秘密结社和派系担保失去赖以生存的阴影。"
 RUS_fr_officer_oath_service_review:0 "军队政治工作体系建设"
 RUS_fr_officer_oath_service_review_desc:0 "仅凭一纸宣誓无法判断军官是否忠于革命，同样，出身和旧履历也不应成为永远无法洗脱的罪名。政治工作机关将统一军官宣誓、教育、履历复审与群众评议程序，以长期表现而非流言决定一个人的去留。红军需要的是理解劳动共和国为何而战的专业军人，而不是善于在审查表上写正确口号的投机者。"
 RUS_fr_basic_commissar_system:0 "军纪与政治审查制度"
 RUS_fr_basic_commissar_system_desc:0 "军纪必须保护革命军队，而不能沦为私人报复和派系斗争的工具。新的政治审查制度将规定明确的证据标准、申诉渠道和责任边界，由政委、军事法官与指挥机关共同处理案件。真正的反革命组织会被连根拔除，忠诚的专业军官也不必再担心因为一次匿名指控便失去名誉与职位。"
 RUS_fr_soldiers_committees:0 "士兵委员会制度"
 RUS_fr_soldiers_committees_desc:0 "革命把士兵从旧军队沉默的服从者变成了国家的主人，但这种权利必须获得稳定而清晰的组织形式。士兵委员会将监督伙食、医疗和生活保障，向政治机关反映基层意见，并协助开展教育工作。它们不干预作战命令，却要确保每一位战士都知道自己为何服从，也知道自己的合理诉求能够被听见。"
 RUS_fr_unified_military_political_system:0 "统一军政制度"
 RUS_fr_unified_military_political_system_desc:0 "指挥员、政委和士兵委员会若彼此争夺权力，再正确的制度也会在前线变成新的混乱。革命军事委员会将明确三者的权限：指挥员负责军事行动，政委维护政治方向，士兵委员会保障基层权利与组织生活。政治可靠性与军事效率不再被视为互相排斥的目标，而将共同构成红军纪律的基础。"
 RUS_fr_revolutionary_collectivism:0 "革命集体主义"
 RUS_fr_revolutionary_collectivism_desc:0 "旧世界喜欢把胜利归功于少数天才将领，却遗忘了维持战线的普通士兵、卫生员和铁路工人。革命集体主义认为，军队的力量来自班、排、连直至整个共和国之间彼此承担的责任。我们将以共同训练、互助传统和单位荣誉维系部队，使任何个人的伤亡与动摇都无法轻易击垮整个战斗集体。"
 RUS_fr_military_vanguardism:0 "军事先锋主义"
 RUS_fr_military_vanguardism_desc:0 "革命军队不能等到所有人都接受新思想之后才开始改变。最优秀的军官、技术人员和战士将被集中到试验部队，率先采用新的编制、通信方式与机械化战术。它们的成功会为全军指出方向，它们的失败也必须被如实记录，让一次试验的代价换来整个红军的进步。"
 RUS_fr_revolutionary_heroism:0 "革命英雄主义"
 RUS_fr_revolutionary_heroism_desc:0 "劳动共和国需要英雄，但不需要被塑造成不可企及神像的英雄。我们将公开表彰在关键时刻承担责任的军官、坚守阵地的战士，以及让部队免于饥饿和包围的后勤人员。每一项功勋都应成为全军能够学习的经验，使个人勇气最终转化为集体的战斗意志。"
 RUS_fr_army_mechanisation_torrent:0 "机械化洪流"
 RUS_fr_army_mechanisation_torrent_desc:0 "几辆汽车无法使一支军队机械化，真正的机械化意味着编制、通信、维修和指挥节奏都围绕车辆重新组织。军事先锋部队将率先把新式装备投入连续突破与快速追击，在运动中检验理论家的设想。若试验成功，红军的攻势将不再止步于敌军第一道防线，而会像洪流一样涌向其战役纵深。"
 RUS_fr_guards_model_units:0 "近卫模范部队"
 RUS_fr_guards_model_units_desc:0 "近卫称号不应是装饰性的荣誉，而应代表全军能够观察和学习的最高标准。经过实战与演习检验的单位将承担新装备试用、战术示范和基层干部培养任务，并把经验主动交给其他部队。模范部队的价值不在于与普通士兵拉开距离，而在于证明普通红军战士经过正确组织能够达到怎样的高度。"
 RUS_fr_revolutionary_merit_competition:0 "革命功勋竞赛"
 RUS_fr_revolutionary_merit_competition_desc:0 "旧军队的晋升依靠门第、资历和司令官的私人提携，革命军队则必须让真正有能力的人脱颖而出。公开战绩、群众评议、兵棋成绩和专业考核将共同决定军官的前途，失败的教训也会被纳入评价。功勋竞赛不是鼓励虚报战果，而是迫使军官们不断证明自己确实能够带领士兵取得胜利。"
 RUS_fr_people_and_revolutionary_army:0 "人民军与革命军"
 RUS_fr_people_and_revolutionary_army_desc:0 "一支脱离人民的军队迟早会重新成为压迫人民的工具，一支忘记革命目的的军队也只会为边界和将军的野心流血。红军必须同时是由工农供养、接受人民监督的人民军，也是愿意保卫世界劳动者解放事业的革命军。无论集体主义、先锋主义还是英雄主义得到怎样的发展，这一根本性质都不容动摇。"
 RUS_fr_federal_armaments_defence_industry_commission:0 "联邦军备与国防工业委员会"
 RUS_fr_federal_armaments_defence_industry_commission_desc:0 "长期以来，总参谋部提出需求、计划机关分配产能、设计局追逐自己的方案，三者却很少真正坐在一起。联邦军备与国防工业委员会将成为连接军队、联邦计划委员会和军工机构的常设机关，由它把战场经验转化为技术指标，再把指标变成工厂能够执行的订单。伏龙芝要求军人学会理解工业的边界，也要求工程师明白每一项数字最终都关系到前线士兵的生命。"
 RUS_fr_light_weapons_artillery_design:0 "陆军兵器设计总纲"
 RUS_fr_light_weapons_artillery_design_desc:0 "红军的步兵武器与火炮来自不同年代、不同工厂，甚至服务于彼此矛盾的战术设想。新的设计总纲将由总参谋部提出共同战术需求，再交由工程师把这些需求转化为口径、重量、射程与生产规范。枪械、支援装备和炮兵器材不再是互不相干的工业产品，而要共同构成步兵师可以依赖的完整兵器体系。"
 RUS_fr_small_arms_standardisation_committee:0 "单兵武器标准化委员会"
 RUS_fr_small_arms_standardisation_committee_desc:0 "各地兵工厂仍在使用不同的图纸、公差和零件目录，一支步枪在图拉能够修复，送到西伯利亚却可能只能被拆作废铁。单兵武器标准化委员会将召集工厂代表、军需官与前线老兵，对口径、部件和生产规范逐项作出裁决。统一并不意味着拒绝改良，而是要让每一次改良都能被整个联邦的工业迅速采用。"
 RUS_fr_artillery_ammunition_technical_committee:0 "火炮与弹药技术委员会"
 RUS_fr_artillery_ammunition_technical_committee_desc:0 "一门性能优良的火炮若没有可靠炮弹、牵引车辆和稳定的量产线，便只能停留在试验场上。技术委员会将把奥布霍夫、布良斯克与图拉的设计和生产能力纳入共同计划，统一炮身、弹药与牵引设备的试制程序。炮兵军官也将直接参与评审，使工程师不再只为漂亮的射程数字设计武器。"
 RUS_fr_ergonomic_tolerance_standards:0 "战斗装具人体工学规范"
 RUS_fr_ergonomic_tolerance_standards_desc:0 "设计图上的几百克重量和几厘米尺寸，在漫长行军与持续战斗中都会变成士兵肩头真实的痛苦。委员会将系统收集前线对握持、瞄准、携行和装具布置的意见，让武器适应人的身体，而不是要求人去忍受糟糕的设计。工程师必须走出办公室，因为一件装备是否合格，最终要由使用它作战的红军战士回答。"
 RUS_fr_soldier_load_lightening_program:0 "单兵负荷轻量化纲要"
 RUS_fr_soldier_load_lightening_program_desc:0 "红军士兵携带的每一件物品都有理由，却并非每一件都必须由同一个人背负。军需部门将重新审查包装、材料、弹药基数和班组携行分工，把可以交给车辆与集体装备的重量从个人肩上移走。减轻负荷不是追求舒适，而是让部队在抵达战场之后仍然保有战斗、挖掘和继续前进的体力。"
 RUS_fr_divisional_artillery_support_standard:0 "师属炮兵支援标准"
 RUS_fr_divisional_artillery_support_standard_desc:0 "炮兵若只在重大攻势前临时配属，步兵便永远无法学会如何依靠炮火作战。每个步兵师都将获得稳定的炮兵编制、弹药基数和火力联络人员，训练场上的协同程序也必须与战时完全一致。当前沿连队请求支援时，他们需要听见的是熟悉炮兵的回应，而不是司令部之间漫长的讨价还价。"
 RUS_fr_armaments_quality_assurance_inspectorate:0 "军品质量验收制度"
 RUS_fr_armaments_quality_assurance_inspectorate_desc:0 "计划数字可以证明工厂交付了多少武器，却不能证明这些武器能否在严寒、泥泞和炮火中工作。独立验收人员将获得退回不合格批次、追踪失效原因并要求重新设计的权力，厂长也不能再以完成产量指标为由压下质量报告。社会主义工业的荣誉不应建立在报表上，而应建立在士兵能够信任自己装备的事实上。"
 RUS_fr_self_propelled_support_fire_trials:0 "自行支援火力联合试验"
 RUS_fr_self_propelled_support_fire_trials_desc:0 "机械化部队的推进速度正在超过传统炮兵转移阵地的能力，突破纵队不能永远停下来等待火炮。火炮工程师、车辆设计局和野战部队将共同试验能够伴随前线机动的自行支援平台，记录底盘承载、射击稳定与补给消耗之间的矛盾。无论试验最终导向自行火炮还是其他重型火力，它都将迫使两个长期分离的技术部门学会合作。"
 RUS_fr_combined_arms_support_standard:0 "陆军兵器体系定型"
 RUS_fr_combined_arms_support_standard_desc:0 "经过多轮委员会审查与部队试验，步兵武器、火炮、弹药和支援平台终于能够按照同一套战术需求安排生产。联邦军备委员会将把这些成果写入正式的陆军兵器体系，结束设计局各自为政的时代。今后的装备更新不再只是换上一件性能更高的武器，而要确保整支步兵师都能围绕它训练、补给和作战。"
 RUS_fr_mechanisation_wave:0 "陆军机动化建设纲要"
 RUS_fr_mechanisation_wave_desc:0 "俄罗斯的距离曾吞噬过无数进攻，部队赢得战斗后往往只能看着敌人从铁路与公路上重新集结。陆军机动化建设将同时扩大车辆生产、驾驶员训练、道路保障和维修能力，使速度不再只是少数骑兵与侦察部队的特权。红军必须学会让整个战役体系移动起来，而不仅是给旧编制安装更多发动机。"
 RUS_fr_mechanised_platform_research_committee:0 "机械化平台研究委员会"
 RUS_fr_mechanised_platform_research_committee_desc:0 "汽车厂、发动机厂与军方设计部门过去各自追求理想型号，结果却是零件繁杂、维修困难和产能反复浪费。机械化平台研究委员会将协调莫斯科、下诺夫哥罗德等地的车辆企业，规定卡车、履带车辆与通用底盘能够共享的技术基础。工程上的统一将为大规模生产铺平道路，也让野战修理所不必面对无穷无尽的零件目录。"
 RUS_fr_rapid_mobility_equipment_trials:0 "快速机动装备试验纲要"
 RUS_fr_rapid_mobility_equipment_trials_desc:0 "试验场上短暂的高速无法说明一辆车辆是否适合俄罗斯战争。新装备将接受长途行军、恶劣道路、低温启动和战时抢修检验，驾驶员与维修人员的报告将与工程数据同等重要。试验结果会迫使委员会作出取舍：是优先扩充可靠的车辆工业、建设专业机械化后勤，还是把资源投入更大胆的旋翼航空器计划。"
 RUS_fr_vehicle_manufacturing_integration:0 "车辆制造工艺统合"
 RUS_fr_vehicle_manufacturing_integration_desc:0 "有些工程师希望继续追逐性能惊人的新型号，但前线军官更需要成千上万辆能够按时抵达的可靠车辆。我们将集中改良现有底盘、发动机与流水线，使不同工厂按照共同规范扩大生产，并让零件可以在野战条件下互换。数量、可靠性与维修通用性将优先于少数样车在试验场上创造的纪录。"
 RUS_fr_mechanised_logistics_regulations:0 "机械化后勤勤务条例"
 RUS_fr_mechanised_logistics_regulations_desc:0 "机械化部队真正的边界并非装甲厚度或发动机马力，而是燃料、备件和修理人员能够抵达的距离。新条例将把运输营、维修营和燃料纵队纳入作战编制，使后勤军官从攻势开始之前便参与计划。坦克与卡车不应在道路尽头变成废弃的钢铁，专业化保障必须跟随它们穿过整个战役纵深。"
 RUS_fr_helicopter_pilot_program:0 "旋翼航空器验证计划"
 RUS_fr_helicopter_pilot_program_desc:0 "旋翼航空器仍被许多老派军官视作工程师的玩具，但它所展示的垂直起降能力可能改变部队理解距离的方式。航空技术人员和志愿飞行员将把发动机、旋翼结构与运输任务纳入一项正式验证计划，在事故与失败中积累任何现成教范都无法提供的知识。若这条道路能够走通，河流、山地和破坏的道路将不再拥有过去那样的阻挡力量。"
 RUS_fr_rapid_operational_corps:0 "重装机械化战斗群"
 RUS_fr_rapid_operational_corps_desc:0 "只有车辆而没有独立指挥、火力和保障能力的部队，仍然只是乘车移动的步兵。以改良车辆工业或专业机械化后勤为基础，红军将组建能够自行实施突破、追击与纵深作战的重装战斗群。它们必须在离开集团军主力之后继续作战，把短暂的战术缺口扩大为敌军无法挽回的战役崩溃。"
 RUS_fr_air_assault_brigades:0 "空中机动步兵试验编制"
 RUS_fr_air_assault_brigades_desc:0 "旋翼航空器若只用于运送军官和文件，便永远无法证明自己的军事价值。我们将从最优秀的轻步兵、飞行员和通信人员中组建试验编制，训练他们越过正面障碍夺取桥梁、机场与指挥节点。这是一条昂贵且排他的道路，它会占用原本属于车辆工业和机械化后勤的资源，但也可能创造一种任何旧军队都未曾拥有的机动能力。"
 RUS_fr_deep_mobility_program:0 "高速纵深机动纲要"
 RUS_fr_deep_mobility_program_desc:0 "垂直机动的意义不在于表演一次大胆突袭，而在于让敌人整个纵深都失去安全地带。空中突击步兵、远程侦察与快速战役指挥将被纳入共同纲要，围绕交通枢纽、炮兵阵地和预备队集结地组织行动。红军将尝试越过敌军最坚固的正面，在其尚未来得及理解发生了什么之前切断整个防御体系。"
 RUS_fr_emphasise_armour_design:0 "装甲兵器发展纲要"
 RUS_fr_emphasise_armour_design_desc:0 "俄罗斯拥有众多优秀的坦克设计局和重工业中心，却缺少一项能够让它们服务于共同战役思想的装甲计划。委员会将把设计局、冶金单位、火炮部门和试验场纳入统一领导，由装甲兵军官提出真正需要解决的问题。坦克不再是工程师彼此竞争的孤立作品，而将成为红军突破、机动与火力体系中的一部分。"
 RUS_fr_alloy_armour_standard:0 "合金装甲工程"
 RUS_fr_alloy_armour_standard_desc:0 "同样厚度的装甲板可能因为钢材配方、热处理和焊接质量不同而表现出天壤之别。索尔莫沃、车里雅宾斯克与乌拉尔的冶金和车辆部门将采用共同的合金牌号、弹道验收与失效分析标准。每一块被击穿的试验装甲都必须留下有用的数据，让下一辆驶出工厂的战车不必重复同样的弱点。"
 RUS_fr_tank_firepower_development_plan:0 "坦克火力发展计划"
 RUS_fr_tank_firepower_development_plan_desc:0 "更大的火炮并不必然意味着更强的坦克，炮塔空间、后坐机构、瞄准设备与乘员负担都会为每一次升级索取代价。坦克火力计划将让火炮工程师、炮塔设计师和前线车组共同参与评审，建立从试验炮到量产模块的连续研发链。我们需要的是能够在战场上稳定命中并摧毁目标的完整武器系统，而不是只在文件上令人印象深刻的口径。"
 RUS_fr_breakthrough_chassis_program:0 "突破型通用底盘"
 RUS_fr_breakthrough_chassis_program_desc:0 "承担突破任务的车辆必须同时承受厚重装甲、大型火炮和恶劣地形带来的压力，普通底盘无法无限接受这些要求。设计局将围绕承载能力、传动和悬挂建立一套通用突破底盘，为不同上装保留足够的发展余地。它未必是速度最快或成本最低的方案，却必须能够带着红军最强大的火力穿过敌军正面。"
 RUS_fr_hull_structural_durability_trials:0 "车体结构耐久试验"
 RUS_fr_hull_structural_durability_trials_desc:0 "战场不会因为一辆坦克拥有厚重装甲便宽恕断裂的焊缝、失效的悬挂和过热的传动机构。试验部门将延长车辆测试里程，并把故障车辆彻底拆解，追究每一次结构失效的根源。可靠性或许不像火炮和装甲那样醒目，却是把少数样车变成一支真正装甲军团的前提。"
 RUS_fr_long_range_armoured_exploitation:0 "远程机动作战标准"
 RUS_fr_long_range_armoured_exploitation_desc:0 "突破敌军防线只是装甲兵任务的开始，真正的战果来自随后数百公里的追击与合围。新的远程机动作战标准将同时考虑油料、履带寿命、乘员疲劳、无线电联络和战役补给，让装甲纵队学会脱离铁路持续行动。任何只在地图上画出大胆箭头、却不计算一桶燃料如何抵达前线的计划，都将被拒绝。"
 RUS_fr_high_velocity_kinetic_gun_program:0 "高速动能火炮计划"
 RUS_fr_high_velocity_kinetic_gun_program_desc:0 "装甲与火炮之间的较量从未停歇，今日足以洞穿敌军战车的武器，明日便可能在更厚重的钢板前败下阵来。联邦军备与国防工业委员会将集中冶金、弹道学与火炮设计部门的力量，探索更高初速与更强穿透力的反装甲武器。未来，无论敌人把怎样的钢铁巨兽推上战场，红军都必须拥有将其正面击毁的手段。"
 RUS_fr_universal_hull_standards:0 "装甲车辆部件通用化"
 RUS_fr_universal_hull_standards_desc:0 "为每一种任务重新设计整辆车辆，既浪费工程时间，也让工厂和维修部队承担无法控制的零件种类。装甲部门将统一动力、悬挂、传动和接口标准，使坦克、自行火炮与反坦克车辆能够共享尽可能多的基础部件。通用化不会消灭专业车辆，反而会让新的炮塔和上装更快从图纸走向量产。"
 RUS_fr_self_propelled_direct_fire_system:0 "自行直射火力系统"
 RUS_fr_self_propelled_direct_fire_system_desc:0 "牵引火炮能够摧毁堡垒，却很难始终跟随装甲纵队穿过突破口。我们将把重型火炮安装到能够伴随前线行动的底盘上，由自行火炮和突击炮直接压制工事、炮位与集结中的敌军。装甲兵由此获得不必等待后方炮兵的重型火力，但也必须建立与之相称的弹药和维修保障。"
 RUS_fr_armoured_firepower_coordination_standard:0 "装甲火力协同标准"
 RUS_fr_armoured_firepower_coordination_standard_desc:0 "坦克、自行火炮与师属炮兵若各自寻找目标，再多火力也只会被分散在战场各处。新的协同标准将统一无线电呼号、目标指示、火力分区和机动侦察报告，使装甲集群能够在决定性地点迅速集中射击。车长、炮兵观察员和参谋军官必须学会使用同一种语言，才能让钢铁真正成为有组织的力量。"
 RUS_fr_land_warfare_mainstay:0 "统一装甲兵器体系"
 RUS_fr_land_warfare_mainstay_desc:0 "从合金装甲与通用底盘，到坦克炮、自行火力和远程保障，曾经分散在各设计局的成果已经能够围绕同一战役任务运转。装甲兵器不再是阅兵场上的孤立样车，而成为拥有共同部件、统一火力程序和可靠工业后盾的完整体系。红军终于可以把装甲部队视作陆战中的独立主干力量，而不仅是临时配属给步兵的辅助兵器。"
 RUS_fr_armaments_construction_stage_summary:0 "军备建设阶段总结"
 RUS_fr_armaments_construction_stage_summary_desc:0 "步兵兵器、战役机动与装甲工程三个领域的委员会已经交出了本阶段成果，也留下了彼此争夺钢材、机床和熟练工人的矛盾。联邦军备与国防工业委员会将汇总试验报告、工厂数据与前线意见，把零散形成的制度整合进人民军的统一建设成果。下一期联邦计划不会平均满足所有人的愿望，而将依据我们已经选择的军事重点决定共和国把最宝贵的工业力量投向何处。"
 RUS_fr_armaments_summary_integration_tt:0 "联邦军备与国防工业委员会下属计划产生的所有§Y民族精神§!将整合进§Y我们是人民的军队§!"
