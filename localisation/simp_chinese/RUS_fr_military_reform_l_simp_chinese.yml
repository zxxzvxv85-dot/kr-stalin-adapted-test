 RUS_fr_establish_political_commissar_organisation:0 "落实政治委员组织体系"
 RUS_fr_establish_political_commissar_organisation_desc:0 "经过§Y90日§!整编，将政治工作干部、教育课程和基层反馈渠道纳入全军统一编制；完成后获得§Y政治委员组织体系§!。"
 RUS_fr_establish_scientific_general_staff:0 "组建科学化总参谋部"
 RUS_fr_establish_scientific_general_staff_desc:0 "经过§Y60日§!建设，为总参谋部建立统一数据、作战模型与参谋教育制度；完成后获得§Y科学化总参谋部§!。"
 RUS_fr_adopt_deep_battle_concept:0 "贯彻纵深作战理论"
 RUS_fr_adopt_deep_battle_concept_desc:0 "经过§Y60日§!推演，把纵深突破、战役预备队和快速增援写入全军作战条令；完成后获得§Y纵深作战理论§!。"
 RUS_fr_establish_one_man_command:0 "落实首长负责制"
 RUS_fr_establish_one_man_command_desc:0 "经过§Y60日§!制度调整，明确指挥员的军事责任，并协调指挥与政治工作；完成后获得§Y首长负责制§!。"
 RUS_fr_adopt_revolutionary_collectivism:0 "实施革命集体主义纲领"
 RUS_fr_adopt_revolutionary_collectivism_desc:0 "经过§Y60日§!教育整顿，以集体责任、阵地韧性和部队协同作为军队建设的重心；完成后获得§Y革命集体主义§!。"
 RUS_fr_adopt_military_vanguardism:0 "实施军事先锋主义纲领"
 RUS_fr_adopt_military_vanguardism_desc:0 "经过§Y90日§!试点，优先支持试验编制、快速决策与高机动作战单位；完成后获得§Y军事先锋主义§!。"
 RUS_fr_adopt_revolutionary_heroism:0 "实施革命英雄主义纲领"
 RUS_fr_adopt_revolutionary_heroism_desc:0 "经过§Y60日§!宣传与制度建设，以公开表彰、战场授权和先进典型鼓励战士发挥主动性；完成后获得§Y革命英雄主义§!。"
 RUS_fr_reform_disorganisation_4:0 "工农红军现状：乌合之众"
 RUS_fr_reform_disorganisation_4_desc:0 "尽管在华西列夫斯基将军的策反下，白匪军中的少壮派已大批倒戈归顺，但我军内部积弊依然严峻：指挥体系近乎瘫痪，民兵编制严重超编，更有敌方奸细潜伏其间。若要真正锻造出一支捍卫人民的钢铁之师，我们必须立即展开一场雷厉风行的全面整肃。"
 RUS_fr_reform_disorganisation_3:0 "工农红军现状：百废待兴"
 RUS_fr_reform_disorganisation_3_desc:0 "整肃之后，红军总算甩掉了臃肿的包袱，但距离一支真正的正规军尚有天壤之别。基层军官多为起义旧部，战术思想陈旧；新征战士虽热情高涨，却连基本队列都难以走齐。为今之计，惟求提纲挈领。待到营连建制齐全、号令能达连排，这支军队才算初具雏形。"
 RUS_fr_reform_disorganisation_2:0 "工农红军现状：淬火成钢"
 RUS_fr_reform_disorganisation_2_desc:0 "纸上写好的编制和条令，必须回到训练场上，用汗水检验、用时间修正。一支军队的成型从来不是一纸命令就能完成的——它需要在反复拉练中磨合，在实弹演习中暴露问题，在每一次操练中一点一点地缩短纸上与实战之间的距离。"
 RUS_fr_reform_disorganisation_1:0 "工农红军现状：铁流万里"
 RUS_fr_reform_disorganisation_1_desc:0 "借用一句东方谚语——“万事俱备，只欠东风”——来形容此刻的红军，再贴切不过。新式装备陆续列装，工农红军的素质正在稳步提升。我们的战士已经学会了操作新装备，指挥员正在消化新的战术条令，后勤体系逐步覆盖更远的战线。我们业已枕戈待旦，准备向旧世界的堡垒发起冲锋。"
 RUS_fr_reform_disorganisation_0:0 "工农红军现状：铁流万里"
 RUS_fr_reform_disorganisation_0_desc:0 "借用一句东方谚语——“万事俱备，只欠东风”——来形容此刻的红军，再贴切不过。新式装备陆续列装，工农红军的素质正在稳步提升。我们的战士已经学会了操作新装备，指挥员正在消化新的战术条令，后勤体系逐步覆盖更远的战线。我们业已枕戈待旦，准备向旧世界的堡垒发起冲锋。"
