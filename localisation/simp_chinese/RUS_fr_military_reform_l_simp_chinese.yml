 RUS_fr_establish_political_commissar_organisation:0 "落实政治委员组织体系"
 RUS_fr_establish_political_commissar_organisation_desc:0 "经过§Y90日§!整编，将政治工作干部、教育课程和基层反馈渠道纳入全军统一编制；完成后获得§Y政治委员组织体系§!。"
 RUS_fr_establish_scientific_general_staff:0 "组建科学化总参谋部"
 RUS_fr_establish_scientific_general_staff_desc:0 "经过§Y120日§!建设，为总参谋部建立统一数据、作战模型与参谋教育制度；完成后获得§Y科学化总参谋部§!。"
 RUS_fr_adopt_deep_battle_concept:0 "贯彻纵深作战理论"
 RUS_fr_adopt_deep_battle_concept_desc:0 "经过§Y120日§!推演，把纵深突破、战役预备队和快速增援写入全军作战条令；完成后获得§Y纵深作战理论§!。"
 RUS_fr_establish_one_man_command:0 "落实首长负责制"
 RUS_fr_establish_one_man_command_desc:0 "经过§Y60日§!制度调整，明确指挥员的军事责任，并协调指挥与政治工作；完成后获得§Y首长负责制§!。"
 RUS_fr_adopt_revolutionary_collectivism:0 "实施革命集体主义纲领"
 RUS_fr_adopt_revolutionary_collectivism_desc:0 "经过§Y60日§!教育整顿，以集体责任、阵地韧性和部队协同作为军队建设的重心；完成后获得§Y革命集体主义§!。"
 RUS_fr_adopt_military_vanguardism:0 "实施军事先锋主义纲领"
 RUS_fr_adopt_military_vanguardism_desc:0 "经过§Y90日§!试点，优先支持试验编制、快速决策与高机动作战单位；完成后获得§Y军事先锋主义§!。"
 RUS_fr_adopt_revolutionary_heroism:0 "实施革命英雄主义纲领"
 RUS_fr_adopt_revolutionary_heroism_desc:0 "经过§Y60日§!宣传与制度建设，以公开表彰、战场授权和先进典型鼓励战士发挥主动性；完成后获得§Y革命英雄主义§!。"
 RUS_fr_reform_disorganisation_4:0 "军事体系积弊：全面失调"
 RUS_fr_reform_disorganisation_4_desc:0 "旧军制的残片、革命战争中的临时编制和各派系遗留的指挥习惯被仓促拼接在一起。命令往往在军区与部队之间失去原意，部队也常被拥挤在彼此重叠的作战正面上；军官们只能依靠私人关系和战时经验维持这架摇摇欲坠的机器。"
 RUS_fr_reform_disorganisation_3:0 "军事体系积弊：严重失调"
 RUS_fr_reform_disorganisation_3_desc:0 "全军审计清理了冗余司令部，并第一次把作战正面与指挥权限写入统一的计划程序。命令不再像过去那样层层失真，但编制、动员与保障机关仍各自沿用着旧有尺度。"
 RUS_fr_reform_disorganisation_2:0 "军事体系积弊：结构性缺陷"
 RUS_fr_reform_disorganisation_2_desc:0 "统一编制表和军政责任制开始约束各军区，部队之间终于能够按照相同标准组织协同。可基层训练仍参差不齐，铁路、仓库与补充兵也还没有被纳入一套完整的保障循环。"
 RUS_fr_reform_disorganisation_1:0 "军事体系积弊：残余问题"
 RUS_fr_reform_disorganisation_1_desc:0 "训练、动员、补充与后勤机关已经开始按照同一节奏运转，红军的日常制度接近定型。残余问题只会在大规模部队调动中暴露，必须由一次覆盖全国的实兵检验作出最后裁决。"
 RUS_fr_reform_disorganisation_0:0 "军事体系改革：基础整顿完成"
 RUS_fr_reform_disorganisation_0_desc:0 "从总参谋部的沙盘到边远军区的征兵站，命令、人员与物资终于按照同一套制度流动。全军性的失调已经得到纠正，但学说、军官培养、气候适应、兵种协同与装备标准化仍须由各专业机关逐项解决。"
 RUS_fr_timoshenko_reform_theorist:0 "军制整顿理论家"
 RUS_fr_timoshenko_reform_theorist_reformed:0 "军制整顿理论家（完善）"
 RUS_fr_timoshenko_reform_cost_discount_tt:0 "担任理论家时，军事改革决议陆军经验花费：每级§G-5%§!"
 RUS_fr_timoshenko_stage_four_upgrade_tt:0 "§Y谢苗·铁木辛哥§!的理论家特质将得到强化，额外获得：\n战场宽度：§G-10.0%§!"
 RUS_fr_political_commissar_organisation_idea:0 "政治委员组织体系"
 RUS_fr_political_commissar_organisation_idea_desc:0 "政委不再是危急时刻临时派往前线的鼓动员，也不是站在指挥员身后的监视者。他们将政治教育、士兵诉求与部队经验带入统一的组织渠道，使党、军官和普通战士第一次能够在同一套制度中彼此理解。"
 RUS_fr_scientific_general_staff_idea:0 "科学化总参谋部"
 RUS_fr_scientific_general_staff_idea_desc:0 "地图、统计、兵棋与战史研究正在取代将领们彼此矛盾的直觉。总参谋部不再只是传递命令的机关，而是一所持续观察战争、检验假设并把教训写回条令的军事科学中心。"
 RUS_fr_deep_battle_concept_idea:0 "纵深作战理论"
 RUS_fr_deep_battle_concept_idea_desc:0 "战场不再被视作一条必须正面撞开的线，而是由交通枢纽、预备队、炮兵阵地和指挥机关构成的广阔纵深。突破只是战役的开端；真正的胜利来自接连不断的打击，直到敌人的整个体系同时崩溃。"
 RUS_fr_one_man_command_idea:0 "首长负责制"
 RUS_fr_one_man_command_idea_desc:0 "命令下达之前可以争论，命令下达之后必须执行。指挥员被赋予明确而完整的军事责任，政治机关则负责监督原则、解释目标并维护军队与革命之间的联系，两者不再以含混的权限彼此推诿。"
 RUS_fr_revolutionary_collectivism_idea:0 "革命集体主义"
 RUS_fr_revolutionary_collectivism_idea_desc:0 "人民军的力量不属于某一位天才将领或孤胆英雄，而来自彼此负责的班、排、连和每一个士兵委员会。只要集体仍然保持联系，伤亡、疲惫和暂时的失败便无法使部队彻底瓦解。"
 RUS_fr_military_vanguardism_idea:0 "军事先锋主义"
 RUS_fr_military_vanguardism_idea_desc:0 "革命不能永远等待旧军队接受新观念。经过严格选拔的试验部队将率先采用新的编制、通信和机动作战方法，以成功证明道路，以失败为全军换取教训。"
 RUS_fr_revolutionary_heroism_idea:0 "革命英雄主义"
 RUS_fr_revolutionary_heroism_idea_desc:0 "革命所需要的英雄并非供人膜拜的偶像，而是在决定性时刻愿意承担责任的人。工人出身的军官、坚守阵地的士兵和维持道路畅通的后勤人员，都将成为可以被全军学习而非遥不可及的榜样。"
 RUS_fr_tempered_in_steel_idea:0 "淬火成钢"
 RUS_fr_tempered_in_steel_idea_desc:0 "一次次对抗演习使红军学会隐藏真正的意图，在敌人确信自己已经看清一切时改变部署、转移主攻方向并发动反击。伪装、侦察与欺骗不再是少数参谋的奇技，而成为从军区司令部到前沿部队共同掌握的作战方法。"
 RUS_fr_unified_army_reform:0 "人民军建设的基础成果"
 RUS_fr_unified_army_reform_desc:0 "从革命战争中成长起来的红军，终于摆脱了临时编制、派系习惯与旧军官团遗产的束缚。统一的条令、参谋制度和政治工作将散布各地的部队锻造成一支真正属于劳动人民的军队；伏龙芝所倡导的革命军事科学，也不再只是纸面上的纲领，而成为从总参谋部到基层士兵共同遵循的准则。"
 RUS_fr_unified_army_reform_final:0 "我们是人民的军队"
 RUS_fr_unified_army_reform_final_desc:0 "从士兵委员会、政治工作机关和科学化总参谋部，到统一的军备标准、机械化纵队与装甲兵团，红军终于将革命的政治理想、现代工业和军事科学结合为一个不可分割的整体。这支军队不属于旧时代的军官团，也不服务于少数人的野心；它来自劳动人民，也将以人民的名义保卫革命。"
 RUS_fr_unify_basic_army_reform_tt:0 "将已获得的§Y军制改革§!与§Y军队制度§!精神合并为一个§Y人民军建设的基础成果§!；此后完成的相关决议也会直接并入该精神。"
 RUS_fr_comrades_abroad_army_reform_bonus_tt:0 "§Y人民军建设的基础成果§!追加：\n$MODIFIER_SEND_VOLUNTEER_SIZE$: §G+5§!\n$MODIFIER_ARMY_EXPERIENCE_FROM_VOLUNTEERS$: §G+50.0%§!"
 tech_forest_warfare_terrain_effect:0 "§Y徒步、摩托化与机械化步兵§!：\n森林：\n  移动：§G+5.0%§!\n  攻击：§G+5.0%§!\n  防御：§G+3.0%§!"
 tech_marsh_warfare_terrain_effect:0 "§Y徒步、摩托化与机械化步兵§!：\n沼泽：\n  移动：§G+5.0%§!\n  攻击：§G+10.0%§!\n  防御：§G+5.0%§!"
 RUS_fr_armaments_basic_result:0 "军备建设基础成果"
 RUS_fr_armaments_basic_result_desc:0 "图拉的枪械、彼得格勒的火炮和各地仓库中的零件开始服从统一的图纸、口径与验收标准。联邦订单不再只追求交付数字，前线士兵第一次可以相信送到手中的武器能够彼此替换、经受使用；然而围绕本土正规战建立的定型体系，也暂时削弱了部队在远离联邦核心地区时因地制宜的能力。"
 RUS_fr_mobility_basic_result:0 "机动建设基础成果"
 RUS_fr_mobility_basic_result_desc:0 "车辆不再是各工厂按照自身习惯制造的稀罕机器。统一的发动机规格、维修手册和零件目录把汽车厂、军需仓库与野战修理所连接起来，为红军建立了最初的机动骨架。"
 RUS_fr_mechanised_platform_mobility_priority:0 "机械化平台优先建设"
 RUS_fr_mechanised_platform_mobility_priority_desc:0 "委员会将机械化部队视作战役机动的核心，而非单纯的运输工具。车辆、乘员与步兵战术由此被纳入同一套训练和作战标准。"
 RUS_fr_vehicle_manufacturing_integration_idea:0 "车辆制造工艺统合"
 RUS_fr_vehicle_manufacturing_integration_idea_desc:0 "统一的零件目录、燃料标准和流水线规范减少了机械化车辆在工厂与前线之间的浪费，使大规模装备部队成为可持续的工业任务。"
 RUS_fr_vehicle_manufacturing_integration_priority_idea:0 "车辆制造工艺统合"
 RUS_fr_vehicle_manufacturing_integration_priority_idea_desc:0 "在统一零件目录、燃料标准和流水线规范之外，机动化建设的优先地位还推动机械化部队形成了更成熟的训练、编组与协同作战体系。"
 RUS_fr_air_assault_brigades_idea:0 "空中机动试验编制"
 RUS_fr_air_assault_brigades_idea_desc:0 "维持旋翼航空器、训练专门步兵并建立新的指挥体系代价高昂，但它使红军第一次能够绕过正面障碍，直接争夺敌军战役纵深。"
 RUS_fr_air_assault_mobility_priority_idea:0 "旋翼航空器集中生产计划"
 RUS_fr_air_assault_mobility_priority_idea_desc:0 "为了让空中突击从试验编制变成真正的战役力量，委员会接受了极其昂贵的专用航空器和训练体系，将最优秀的人员集中到新型特种部队之中。"
 RUS_fr_deep_mobility_priority_idea:0 "高速纵深机动作战体系"
 RUS_fr_deep_mobility_priority_idea_desc:0 "持续投入使空中机动部队能够越过道路、河流与战壕，在敌军尚未完成部署前进入纵深。与之相伴的庞大工业负担，则成为联邦计划必须长期承担的代价。"
 RUS_fr_mobility_priority_improved_logistics_bonus:0 "机动化后勤强化标准"
 RUS_fr_mobility_priority_improved_logistics_bonus_desc:0 "机动化建设的优先投入使运输调度、燃料管理与前线补给规程得到进一步强化。"
 RUS_fr_mobility_priority_logistics_bonus_tt:0 "若侧重§Y陆军机动化建设纲要§!，§Y改良后勤连§!的效果§G翻倍§!：\n补给使用：额外§G-10.0%§!\n燃油使用：额外§G-5.0%§!"
 RUS_fr_armour_basic_result:0 "装甲建设基础成果"
 RUS_fr_armour_basic_result_desc:0 "设计局不再把每一种坦克视作只属于自己的作品。底盘、装甲、炮塔和传动系统被纳入共同的工程语言，乌拉尔与彼得格勒的工厂由此能够分享试验结果，并为未来的大规模装甲部队奠定基础。"
 RUS_fr_armaments_priority_result:0 "陆军兵器优先建设"
 RUS_fr_armaments_priority_result_desc:0 "委员会把最好的钢材、量具和熟练工人留给步兵兵器与火炮工厂。红军仍将依靠人的双脚前进，但这些战士不会再因粗劣的枪机、破裂的炮闩或无法互换的零件付出代价。"
 RUS_fr_mobility_mechanised_priority_result:0 "重型机械化优先建设"
 RUS_fr_mobility_mechanised_priority_result_desc:0 "与其追求少数耀眼的新式车辆，委员会选择首先建设能够支撑整个集团军的车队、修理营和机械化运输纵队。速度将不再属于侦察尖兵，而会成为整支军队组织方式的一部分。"
 RUS_fr_mobility_air_priority_result:0 "空中机动优先建设"
 RUS_fr_mobility_air_priority_result_desc:0 "旋翼机仍是工程师图板和试验场上的新奇事物，但它展示了一种越过道路、河流和战壕的可能。最优秀的轻步兵将被编入试验单位，为一支尚不存在于任何军事教范中的空中骑兵探索道路。"
 RUS_fr_armour_priority_result:0 "装甲兵器优先建设"
 RUS_fr_armour_priority_result_desc:0 "坦克不应只是掩护步兵前进的移动盾牌。集中起来的设计力量将围绕独立装甲兵团重新组织生产，使火力、防护、通信与长途行军能力共同服务于战役突破。"
 RUS_fr_armaments_specialisation:0 "军备专业化建设"
 RUS_fr_armaments_specialisation_desc:0 "联邦计划把军械生产从临时扩建转变为长期专业分工。设计局、试验场与量产工厂之间形成稳定的反馈循环，使每一轮订单都能吸收上一轮战争与生产的教训。"
 RUS_fr_mobility_specialisation:0 "机动专业化建设"
 RUS_fr_mobility_specialisation_desc:0 "道路、车辆、仓库和修理能力被视作同一个战役体系，而不再是彼此分离的后勤项目。红军的机动将由可以反复运转的组织网络保障，而非依赖一次性的物资集中。"
 RUS_fr_armour_specialisation:0 "装甲专业化建设"
 RUS_fr_armour_specialisation_desc:0 "独立的装甲工程体系已经形成。冶金、火炮、发动机和无线电领域的成果被持续汇入共同底盘，使装甲兵能够围绕自己的战役任务塑造装备，而不是被动接受工厂提供的车辆。"
 RUS_fr_military_reform.10.t:0 "第一次军备工作会议"
 RUS_fr_military_reform.10.d:0 "联邦军备与国防工业委员会已经收到三套同样庞大的建设方案。委员会能够推进全部领域，使每一领域获得基础成果；但最先确立的优先方向将得到额外资源、干部和长期政策倾斜。"
 RUS_fr_military_reform.10.a:0 "优先建立统一的军备生产体系"
 RUS_fr_military_reform.10.b:0 "优先解决机动与后勤问题"
 RUS_fr_military_reform.10.c:0 "优先塑造独立的装甲兵器体系"
 RUS_fr_military_reform.20.t:0 "步兵兵器设计争论"
 RUS_fr_military_reform.20.d:0 "委员会无法同时把有限的专项物资投入单兵负荷优化和师属炮兵扩充。前置设计工作已经完成，现在必须决定首先定型哪一种方案。"
 RUS_fr_military_reform.20.a:0 "减轻负荷，提高步兵持续作战能力"
 RUS_fr_military_reform.20.b:0 "强化师属炮兵，以火力保护步兵"
 RUS_fr_military_reform.30.t:0 "机动化建设的技术路线"
 RUS_fr_military_reform.30.d:0 "常规车辆制造、机械化后勤专业化和仍处于试验阶段的直升机空中突击会争夺同一批工程师、发动机和训练资源。委员会只能选定其中一条路线。"
 RUS_fr_military_reform.30.a:0 "统合车辆制造，建设快速战役军团"
 RUS_fr_military_reform.30.b:0 "优先专业化机械化后勤"
 RUS_fr_military_reform.30.c:0 "越过常规阶段，试编空中突击部队"
 RUS_fr_military_reform.40.t:0 "装甲兵器的工程取向"
 RUS_fr_military_reform.40.d:0 "委员会必须在自行直射火力与车体结构耐久之间确定专项试验重点。其余共同底盘、火炮与部件标准仍将照常推进。"
 RUS_fr_military_reform.40.a:0 "优先建立自行直射火力系统"
 RUS_fr_military_reform.40.b:0 "优先完成车体结构耐久试验"
 RUS_fr_military_reform.90.t:0 "军备建设阶段总结"
 RUS_fr_military_reform.90.d:0 "三个军备领域均已完成本阶段工作。最初选定的优先领域获得专业化增益，其强度与极权主义和共产主义支持率之和成正比，最高不超过20%；其余领域保留完整的基础成果。"
 RUS_fr_military_reform.90.a:0 "把试验成果写入下一期联邦计划"
 RUS_fr_fpc_optimisation_materials_tt:0 "联邦计划委员会优化等级提高，为军事改革追加§Y12§!点物资"
 RUS_fr_officer_attack_growth_penalty_tt:0 "将领升级时获得§Y进攻§!能力的权重：§R-25%§!"
 RUS_fr_officer_attack_growth_bonus_tt:0 "将领升级时额外获得§Y1点进攻§!的概率：§G+25%§!"
 RUS_fr_recruitable_population_factor_penalty_tt:0 "适役人口系数：§R-10.00%§!"
 RUS_fr_recruitable_population_factor_bonus_tt:0 "适役人口系数：§G+10.00%§!"
 RUS_fr_fragmented_officer_training:0 "断裂的军官培养体系"
 RUS_fr_fragmented_officer_training_desc:0 "不同军区、旧军校与战时速成班各自奉行一套标准，进攻指挥尤其缺少系统训练。"
 RUS_fr_equipment_standardisation_correction:0 "步兵装备标准化"
 RUS_fr_equipment_standardisation_correction_desc:0 "统一口径、零件、公差与验收规则，正在消除步兵装备和支援器材生产中的重复浪费。"
 RUS_fr_armoured_production_correction:0 "装甲生产标准化"
 RUS_fr_armoured_production_correction_desc:0 "底盘、动力与传动部件被纳入统一系列，装甲车辆不再由互不兼容的工厂方案拼凑而成。"
 RUS_fr_field_regulations_correction:0 "伏龙芝野战条令"
 RUS_fr_field_regulations_correction_desc:0 "条令将战斗经验整理为全军共享的语言，使步兵协同和军事理论终于能够在实战中持续积累。"
 RUS_fr_climate_training_correction:0 "全气候训练规程"
 RUS_fr_climate_training_correction_desc:0 "冬季驻训、炎热地区轮换和统一卫生保障，使部队不再把气候视为无法预见的灾难。"
 RUS_fr_core_operations_correction:0 "本土战区协同体系"
 RUS_fr_core_operations_correction_desc:0 "军区、总参谋部与地方动员机关共享同一套预案，红军终于能够在本土战区组织连贯的防御和反击。"
 RUS_fr_red_academy_correction:0 "雷雨军事学院"
 RUS_fr_red_academy_correction_desc:0 "流亡归来的将领与革命战争中的优秀干部被纳入统一的高级军官教育体系，经验得以真正传承。"
 RUS_fr_armoured_coordination_correction:0 "装甲兵协同规程"
 RUS_fr_armoured_coordination_correction_desc:0 "装甲部队不再是分散配属的移动火力点，而开始按照统一的突破、通信与保障原则行动。"
 RUS_fr_special_forces_correction:0 "卫队与特种部队训练标准"
 RUS_fr_special_forces_correction_desc:0 "示范单位把高强度训练、选拔与战术总结推广到全军特种部队，使其重新具备承担关键任务的能力。"
 RUS_fr_mobilisation_base_correction:0 "全国动员登记体系"
 RUS_fr_mobilisation_base_correction_desc:0 "地方名册、医疗检查与补充计划被统一起来，纸面人口终于能够转化为可用的合格兵员。"
 RUS_fr_command_merit_system_idea:0 "革命军功竞赛制度"
 RUS_fr_command_merit_system_idea_desc:0 "公开复盘和军功评议使真正善于进攻的指挥员获得晋升机会，也迫使保守的军官学校重新审视自己的标准。"
 RUS_fr_military_democracy_trial_idea:0 "军事民主制试行"
 RUS_fr_military_democracy_trial_idea_desc:0 "基层参与扩大了红军在边远地区的政治动员能力，但装甲兵所需的高度集中指挥暂时受到了冲击。"
 RUS_fr_political_work_system_idea:0 "军队政治工作体系"
 RUS_fr_political_work_system_idea_desc:0 "党组织进入连队日常生活并稳定了军心，但政治程序与军事命令之间仍需磨合。"
 RUS_fr_soldiers_committees_system_idea:0 "士兵委员会制度"
 RUS_fr_soldiers_committees_system_idea_desc:0 "士兵的生活、医疗和补充问题第一次拥有正式申诉渠道，部队因而更能承受长期作战。"
 RUS_fr_discipline_review_system_idea:0 "军纪与政治审查制度"
 RUS_fr_discipline_review_system_idea_desc:0 "严格审查保护了部队经验和骨干，却也使基层步兵指挥在一段时间内趋于谨慎。"
 RUS_fr_standardised_army_structure_idea:0 "标准化陆军编制"
 RUS_fr_standardised_army_structure_idea_desc:0 "统一编制、补充和训练周期使不同军区的部队能够真正互换人员、装备和任务。"
 RUS_fr_investigate_white_networks_operation:0 "清查军内白军联络网"
 RUS_fr_investigate_white_networks_operation_desc:0 "投入§Y[?RUS_fr_xp_cost_40|1]§!点陆军经验，在30天内清查旧军官关系网并试行受制度约束的军事民主监督。"
 RUS_fr_review_officer_service_records:0 "复核军官誓词与履历"
 RUS_fr_review_officer_service_records_desc:0 "投入§Y[?RUS_fr_xp_cost_45|1]§!点陆军经验，在30天内建立统一的军官履历、政治工作与服役审查制度。"
 RUS_fr_organise_basic_commissar_network:0 "建立基层政委与军纪审查网"
 RUS_fr_organise_basic_commissar_network_desc:0 "投入§Y[?RUS_fr_xp_cost_40|1]§!点陆军经验，在30天内把政委、军纪和政治审查落实到基层部队。"
 RUS_fr_institutionalise_soldiers_committees:0 "制度化士兵委员会"
 RUS_fr_institutionalise_soldiers_committees_desc:0 "投入§Y[?RUS_fr_xp_cost_45|1]§!点陆军经验，在30天内把士兵委员会纳入正式军政体系。"
 RUS_fr_reopen_thunderstorm_military_academy:0 "重开雷雨军事学院"
 RUS_fr_reopen_thunderstorm_military_academy_desc:0 "投入§Y[?RUS_fr_xp_cost_60|1]§!点陆军经验，用120天重建高级军官教育并召回流亡干部。"
 RUS_fr_issue_frunze_field_regulations:0 "颁行伏龙芝野战条令"
 RUS_fr_issue_frunze_field_regulations_desc:0 "投入§Y[?RUS_fr_xp_cost_60|1]§!点陆军经验，用120天统一野战条令、步兵协同和学说研究方法。"
 RUS_fr_implement_unified_training_mobilisation:0 "落实统一训练与动员体系"
 RUS_fr_implement_unified_training_mobilisation_desc:0 "投入§Y[?RUS_fr_xp_cost_50|1]§!点陆军经验，用120天统一训练、动员与全气候驻训规程。"
 RUS_fr_reorganise_general_staff_district_network:0 "重组总参谋部—军区网络"
 RUS_fr_reorganise_general_staff_district_network_desc:0 "投入§Y[?RUS_fr_xp_cost_55|1]§!点陆军经验，用120天统一本土战区计划和军区指挥关系。"
 RUS_fr_conduct_all_russian_red_army_exercise:0 "沃罗涅日大演习"
 RUS_fr_conduct_all_russian_red_army_exercise_desc:0 "投入§Y[?RUS_fr_xp_cost_50|1]§!点陆军经验，用30天检验已经建立的指挥、动员与保障制度。"
 RUS_fr_test_experimental_general_staff_formations:0 "检验总参谋部实验编制"
 RUS_fr_test_experimental_general_staff_formations_desc:0 "投入§Y[?RUS_fr_xp_cost_45|1]§!点陆军经验，用90天检验新编制并整理其学说成果。"
 RUS_fr_conduct_national_mobilisation_supply_test:0 "实施全国动员保障检验"
 RUS_fr_conduct_national_mobilisation_supply_test_desc:0 "投入§Y[?RUS_fr_xp_cost_45|1]§!点陆军经验，用90天复核兵员登记、补充和全国保障能力。"
 RUS_fr_launch_army_mechanisation_programme:0 "启动陆军机械化实施计划"
 RUS_fr_launch_army_mechanisation_programme_desc:0 "投入§Y[?RUS_fr_xp_cost_60|1]§!点陆军经验，用120天统一机械化部队与装甲生产标准。"
 RUS_fr_form_guards_model_units:0 "组建卫队示范单位"
 RUS_fr_form_guards_model_units_desc:0 "投入§Y[?RUS_fr_xp_cost_45|1]§!点陆军经验，用90天建立能够向特种部队推广经验的示范单位。"
 RUS_fr_institute_revolutionary_merit_competition:0 "推行革命军功竞赛"
 RUS_fr_institute_revolutionary_merit_competition_desc:0 "投入§Y[?RUS_fr_xp_cost_50|1]§!点陆军经验，用90天改革军官评议与进攻指挥人才的晋升标准。"
 RUS_fr_requires_experimental_formations_decision_tt:0 "已完成决议：§Y检验总参谋部实验编制§!"
 RUS_fr_requires_mobilisation_test_decision_tt:0 "已完成决议：§Y实施全国动员保障检验§!"
 RUS_fr_requires_mechanisation_decision_tt:0 "已完成决议：§Y启动陆军机械化实施计划§!"
 RUS_fr_requires_guards_units_decision_tt:0 "已完成决议：§Y组建卫队示范单位§!"
 RUS_fr_requires_merit_competition_decision_tt:0 "已完成决议：§Y推行革命军功竞赛§!"
 RUS_fr_ergonomic_infantry_equipment_idea:0 "战斗装具人体工学标准"
 RUS_fr_ergonomic_infantry_equipment_idea_desc:0 "统一的携行、握持和瞄准规范使步兵装备更适合长途行军与持续战斗，士兵不必再用体力弥补设计上的疏忽。"
 RUS_fr_ergonomic_infantry_equipment_priority_idea:0 "战斗装具人体工学标准"
 RUS_fr_ergonomic_infantry_equipment_priority_idea_desc:0 "步兵兵器获得优先投入后，人体工学标准不再只着眼于减轻负担，而是通过材料、结构与携行方式的全面革新，使单兵装备能够适应更高速的战术机动。"
 RUS_fr_support_fire_joint_trials_idea:0 "支援火力联合试验成果"
 RUS_fr_support_fire_joint_trials_idea_desc:0 "火炮部门与机械化单位共同建立了新的试验标准。传统火炮承担了更严格的结构要求，而火箭炮则被作为大规模火力突击手段优先完善。"
 RUS_fr_armaments_priority_support_tradeoffs_idea:0 "炮兵火力优先配置"
 RUS_fr_armaments_priority_support_tradeoffs_idea_desc:0 "有限的合金、机床和试验力量被优先拨给火炮与火箭炮工程。陆军火力因此迅速增强，但装甲兵器的产能和战术发展不得不暂时让步。"
 RUS_fr_light_infantry_load_standard_idea:0 "轻装步兵负荷标准"
 RUS_fr_light_infantry_load_standard_idea_desc:0 "更合理的携行重量、卫生器材和补给分配让步兵能够走得更快、维持更完整的组织，并在漫长战斗中保存更多有生力量。"
 modifier_army_sub_unit_infantry_speed_factor:0 "步兵速度"
 modifier_army_sub_unit_infantry_max_org_factor:0 "步兵组织度"
 RUS_fr_divisional_artillery_priority_idea:0 "师属炮兵优先建设"
 RUS_fr_divisional_artillery_priority_idea_desc:0 "火炮编制、弹药基数和火力呼叫程序被直接嵌入步兵师，使炮兵与步兵不再作为两套彼此分离的作战系统。"
 RUS_fr_armaments_system_priority_idea:0 "陆军兵器体系优先定型"
 RUS_fr_armaments_system_priority_idea_desc:0 "联邦计划选择以步兵和炮兵为军队的主要骨架。统一装备体系显著强化了夜战、复杂地形和防空火力协调，但装甲兵器的发展空间受到进一步压缩。"
 RUS_fr_katyusha_rocket_artillery_idea:0 "喀秋莎火箭炮体系"
 RUS_fr_katyusha_rocket_artillery_idea_desc:0 "标准化火箭弹、发射架和齐射程序使火箭炮从少数试验装备转变为能够在短时间内倾泻毁灭性火力的完整兵器体系。"
 RUS_fr_tank_firepower_development_idea:0 "装甲火力发展纲要"
 RUS_fr_tank_firepower_development_idea_desc:0 "装甲兵器设计不再围绕单一车型临时展开。炮塔座圈、火炮后坐机构与乘员战位被纳入共同标准，使坦克的火力与防护能够在同一套工程程序中相互协调。"
 RUS_fr_armour_breakthrough_programme_idea:0 "突破型底盘计划"
 RUS_fr_armour_breakthrough_programme_idea_desc:0 "底盘试验不再以展示样车的极限性能为目标，而是围绕持续突破所需的承载、传动和悬挂能力展开。"
 RUS_fr_long_range_armoured_exploitation_idea:0 "远程装甲奔袭规程"
 RUS_fr_long_range_armoured_exploitation_idea_desc:0 "装甲兵被要求脱离步兵推进节奏，以独立纵队完成长距离机动和战役追击。传统步兵编制因此让出一部分资源，装甲部队则获得了更完整的行动自由。"
 RUS_fr_armour_reliability_priority_idea:0 "装甲兵器可靠性优先"
 RUS_fr_armour_reliability_priority_idea_desc:0 "既然装甲兵将承担远程突破任务，发动机、传动和履带便必须在离开铁路与修理厂后继续工作。试验部门因此把耐久性置于所有定型指标之前。"
 RUS_fr_universal_hull_armour_priority_idea:0 "通用车体改装标准"
 RUS_fr_universal_hull_armour_priority_idea_desc:0 "统一接口与结构件使旧车辆能够更快接受新炮塔、发动机和专用上装，装甲车辆的改装不再等同于重新设计一辆坦克。"
 RUS_fr_armoured_firepower_coordination_idea:0 "装甲火力协同标准"
 RUS_fr_armoured_firepower_coordination_idea_desc:0 "坦克、自行火炮和反坦克车辆开始共享目标指示、无线电呼号与火力分区。装甲纵队因此能够像一个完整兵种体系那样集中力量。"
 RUS_fr_tank_destroyer_structural_idea:0 "自行反坦克炮结构标准"
 RUS_fr_tank_destroyer_structural_idea_desc:0 "反坦克炮、底盘与传动机构不再被视为临时拼装的组合。统一结构试验使自行反坦克炮能够在保持机动的同时更有效地对付敌军装甲。"
 RUS_fr_armoured_priority_coordination_tradeoff_idea:0 "装甲突击力量集中"
 RUS_fr_armoured_priority_coordination_tradeoff_idea_desc:0 "最好的通信器材、参谋与保障单位被集中到装甲兵团。它赋予装甲矛头决定性的力量，却暂时削弱了全军其他部队能够获得的支援。"
 RUS_fr_land_warfare_mainstay_idea:0 "陆战主干兵器体系"
 RUS_fr_land_warfare_mainstay_idea_desc:0 "底盘、装甲、炮塔与传动系统被纳入统一的工程语言，工业订单也开始围绕装甲与自行支援火力重排。步兵仍是战线的基础，但最优质的钢材、量具和保障力量正被集中到新的陆战主干兵器体系之中；在这套体系真正成熟以前，全军都必须承担重整生产与战术标准的代价。"
 RUS_fr_unified_armaments_equipment_standard_idea:0 "人民军建设成果：军备工程标准"
 RUS_fr_unified_armaments_equipment_standard_idea_desc:0 "突破底盘、步兵装备和兵种接口的工程规范已经被写入人民军统一建设标准。它们不再是彼此孤立的委员会试验，而成为全军装备体系的共同技术附录。"
 RUS_fr_unified_armaments_equipment_standard_priority_idea:0 "人民军建设成果：装甲工程标准"
 RUS_fr_unified_armaments_equipment_standard_priority_idea_desc:0 "在统一军备工程标准之上，装甲兵器的可靠性被确立为优先指标。底盘、生产和战场保障由此围绕独立装甲兵团形成完整闭环。"
 RUS_fr_unified_armaments_equipment_standard_td_idea:0 "人民军建设成果：反装甲工程标准"
 RUS_fr_unified_armaments_equipment_standard_td_idea_desc:0 "突破底盘、步兵装备与自行反坦克炮的工程规范已经并入人民军统一建设标准，结构试验的成果得以在各级坦克歼击车上延续。"
 RUS_fr_unified_armaments_equipment_standard_priority_td_idea:0 "人民军建设成果：装甲与反装甲工程标准"
 RUS_fr_unified_armaments_equipment_standard_priority_td_idea_desc:0 "装甲兵器可靠性与自行反坦克炮结构标准共同写入统一军备工程体系，使突破兵器与反装甲火力能够围绕同一工业基础持续改进。"
