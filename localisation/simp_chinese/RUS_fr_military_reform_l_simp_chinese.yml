 RUS_fr_federal_plan_armaments_allocation_desc:0 "调整本期计划指标，为军队改革追加一批钢材、机床、车辆和通信器材。"
 RUS_fr_draw_general_staff_reserves:0 "动用总参谋部储备"
 RUS_fr_draw_general_staff_reserves_desc:0 "以陆军经验代表的组织资本和成熟方案，换取一批可立即投入改革的储备。"
 RUS_fr_wartime_emergency_procurement:0 "战时紧急采购"
 RUS_fr_wartime_emergency_procurement_desc:0 "战争爆发后进行一次紧急采购，获得30点军事改革物资，但降低稳定度；该措施每场建设周期只能使用一次。"
 RUS_fr_develop_katyusha_rocket_artillery:0 "研发喀秋莎火箭炮"
 RUS_fr_develop_katyusha_rocket_artillery_desc:0 "投入§Y[?RUS_fr_xp_cost_50|1]§!点陆军经验，用120天完成火箭弹、发射架、齐射控制和车辆化部署试验，建立适用于牵引式与自行式火箭炮的统一技术体系。"
 RUS_fr_reform_command_audit:0 "第一阶段：指挥体系审计"
 RUS_fr_reform_command_audit_desc:0 "投入§Y[?RUS_fr_xp_cost_100|1]§!点陆军经验开展持续120天的指挥体系审计，优先整顿指挥链、作战计划与战役正面。"
 RUS_fr_reform_standard_tables:0 "第二阶段：统一编制与军政标准"
 RUS_fr_reform_standard_tables_desc:0 "投入§Y[?RUS_fr_xp_cost_100|1]§!点陆军经验开展持续120天的统一整编，重点厘清军政权限、规范编制并恢复部队协同。"
 RUS_fr_reform_training_cycles:0 "第三阶段：训练与保障周期"
 RUS_fr_reform_training_cycles_desc:0 "投入§Y[?RUS_fr_xp_cost_100|1]§!点陆军经验开展持续120天的训练整顿，重点重建训练、动员、补充与后勤循环。"
 RUS_fr_reform_grand_field_test:0 "第四阶段：全国性实兵检验"
 RUS_fr_reform_grand_field_test_desc:0 "投入§Y[?RUS_fr_xp_cost_100|1]§!点陆军经验开展持续120天的全国性实兵检验，完成通用军事体系的基础整顿；学说、军官培养、装备标准与兵种协同等专业问题仍须由相应改革逐项解决。"
