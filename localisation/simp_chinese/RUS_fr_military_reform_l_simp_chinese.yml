 RUS_fr_military_reform.10.t:0 "第一次军备工作会议"
 RUS_fr_military_reform.10.d:0 "联邦军备与国防工业委员会已经收到三套同样庞大的建设方案。委员会能够推进全部领域，使每一领域获得基础成果；但最先确立的优先方向将得到额外资源、干部和长期政策倾斜。"
 RUS_fr_military_reform.10.a:0 "优先建立统一的军备生产体系"
 RUS_fr_military_reform.10.b:0 "优先解决机动与后勤问题"
 RUS_fr_military_reform.10.c:0 "优先塑造独立的装甲兵器体系"
 RUS_fr_military_reform.20.t:0 "步兵兵器设计争论"
 RUS_fr_military_reform.20.d:0 "委员会无法同时把有限的专项物资投入单兵负荷优化和师属炮兵扩充。前置设计工作已经完成，现在必须决定首先定型哪一种方案。"
 RUS_fr_military_reform.20.a:0 "减轻负荷，提高步兵持续作战能力"
 RUS_fr_military_reform.20.b:0 "强化师属炮兵，以火力保护步兵"
 RUS_fr_military_reform.30.t:0 "机动化建设的技术路线"
 RUS_fr_military_reform.30.d:0 "常规车辆制造、机械化后勤专业化和仍处于试验阶段的直升机空中突击会争夺同一批工程师、发动机和训练资源。委员会只能选定其中一条路线。"
 RUS_fr_military_reform.30.a:0 "统合车辆制造，建设快速战役军团"
 RUS_fr_military_reform.30.b:0 "优先专业化机械化后勤"
 RUS_fr_military_reform.30.c:0 "越过常规阶段，试编空中突击部队"
 RUS_fr_military_reform.40.t:0 "装甲兵器的工程取向"
 RUS_fr_military_reform.40.d:0 "委员会必须在自行直射火力与车体结构耐久之间确定专项试验重点。其余共同底盘、火炮与部件标准仍将照常推进。"
 RUS_fr_military_reform.40.a:0 "优先建立自行直射火力系统"
 RUS_fr_military_reform.40.b:0 "优先完成车体结构耐久试验"
 RUS_fr_military_reform.90.t:0 "军备建设阶段总结"
 RUS_fr_military_reform.90.d:0 "三个军备领域均已完成本阶段工作。最初选定的优先领域获得专业化增益，其强度与极权主义和共产主义支持率之和成正比，最高不超过20%；其余领域保留完整的基础成果。"
 RUS_fr_military_reform.90.a:0 "把试验成果写入下一期联邦计划"
