 RUS_fr_armaments_basic_result:0 "军备建设基础成果"
 RUS_fr_armaments_basic_result_desc:0 "步兵与火炮类装备可靠性+3%；TOZ、VPOZ、奥布霍夫与BMZ获得委员会基础扶持。"
 RUS_fr_mobility_basic_result:0 "机动建设基础成果"
