 RUS_fr_requires_unified_military_political_system_tt:0 "完成§Y统一军政制度§!后才能解锁§Y军队重组§!"
 RUS_fr_unlock_reform_decision_chain_tt:0 "解锁四阶段§Y军事改革决议链§!；肃反与军政制度国策可直接推进前两阶段，剩余阶段仍需投入陆军经验与军事改革物资"
