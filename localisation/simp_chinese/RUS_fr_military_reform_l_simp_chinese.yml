 RUS_fr_okmo_half_xp_cost_tt:0 "§YOKMO§!选择§Y一线设计报告员§!路线后，所有后续特质的陆军经验花费§G减半§!"
 RUS_fr_self_propelled_artillery_firepower_bonus:0 "自行火炮火力强化标准"
 RUS_fr_self_propelled_artillery_firepower_bonus_desc:0 "统一的火炮、弹药与车体接口使自行火炮能够在机动作战中持续提供高强度支援火力。"
 RUS_fr_self_propelled_artillery_firepower_bonus_tt:0 "所有§Y自行火炮§!：\n对人员杀伤：§G+10.0%§!\n对装甲杀伤：§G+100.0%§!"
 RUS_fr_armour_priority_self_propelled_bonus:0 "装甲兵自行火力协同标准"
 RUS_fr_armour_priority_self_propelled_bonus_desc:0 "装甲兵器侧重使坦克与自行火炮被纳入同一套火力指挥和补给体系，以更高的保障投入换取突破集群的集中杀伤力。"
 RUS_fr_armour_priority_self_propelled_bonus_tt:0 "若侧重§Y装甲兵器发展纲要§!：\n所有§Y坦克§!对人员杀伤与对装甲杀伤：§G+15.0%§!\n所有§Y自行火炮§!补给消耗：§G-30.0%§!"
 modifier_army_sub_unit_category_tank_destroyers_speed_factor:0 "自行反坦克炮最大速度"
