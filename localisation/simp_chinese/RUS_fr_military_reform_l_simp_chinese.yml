 RUS_fr_mechanised_platform_mobility_priority_tt:0 "若§Y机动与后勤建设§!是优先方向：机械化部队攻击与防御：§G+5.0%§!"
 RUS_fr_air_assault_mobility_priority_tt:0 "若§Y机动与后勤建设§!是优先方向：\n§Y空中突击步兵§!将作为§Y特种部队§!编制\n转制后的§Y空中突击特种部队§!对人员杀伤与对装甲杀伤：§G+200.0%§!\n转制后的§Y空中突击特种部队§!突破：§G+150.0%§!\n转制后的§Y空中突击特种部队§!穿甲深度：§G+750.0%§!\n转制后的§Y空中突击特种部队§!全地形进攻、防御与移动修正：§G+10.0%§!\n转制为特种部队时，§Y直升机§!生产花费：§R+500.0%§!"
