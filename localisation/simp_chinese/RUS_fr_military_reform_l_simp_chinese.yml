 RUS_fr_armaments_report_priority_armaments:0 "委员会遵照第一次军备工作会议的决议，将本期可支配精密机床时数的61%、优质枪炮钢配额的54%以及74个高级技术小组优先拨给步兵兵器与炮兵工程。43家兵工企业由此被纳入统一订货表，其中36家按期完成转产。常务委员会认为，在联邦尚未完成全面工业扩张以前，可靠而统一的枪炮仍将是红军最坚实的骨骼。"
 RUS_fr_armaments_report_priority_mobility:0 "委员会遵照第一次军备工作会议的决议，将17家汽车、发动机与修理联合企业列入优先保障名册，并从铁路和民用运输机关抽调了1,200余名工程干部。年度发动机交付计划已完成88%，军用燃料储运设施的建设进度则达到81%。常务委员会认为，俄罗斯的距离本身就是一种敌人，红军只有让人员、火力和补给共同移动起来，才能把一次突破变成无法挽回的战役胜利。"
 RUS_fr_armaments_report_priority_armour:0 "委员会遵照第一次军备工作会议的决议，把9家重型制造企业、4处国家试验场以及本期合金钢配额的47%集中到装甲兵器工程。各设计局共提交32项整车与专用底盘方案，其中19项获准进入样车或部件试制。常务委员会认为，未来战争要求红军拥有能够独立突破、持续机动并集中火力的装甲兵团，而不是少数供检阅使用的试验车辆。"
 RUS_fr_armaments_report_priority_generic:0 "委员会已经完成本期资源与工程任务的清点：纳入统一计划的68项重点任务中，57项按期验收，7项延期，4项因技术条件不足予以撤销。总参谋部、设计局和生产机关过去彼此矛盾的指标，正在被改写为能够由全联邦共同执行的建设标准。"
 RUS_fr_armaments_report_infantry_lightweight:0 "委员会采纳了前线老兵和军医部门的共同意见，没有继续以增加装备数量为唯一目标。12种样枪、瞄准具与战斗装具交由6个步兵师、共18,400名官兵试用；在累计1,200公里的行军与射击考核后，单兵平均携行重量下降3.7公斤，因装具不适造成的非战斗减员下降11%。军需总局据此批准了新的班组负荷表，多余重量将改由车辆或集体装备承担。"
 RUS_fr_armaments_report_infantry_artillery:0 "委员会决定把师属炮兵建设置于单兵负荷改良之前。9个试验师、312门火炮参加了跨军区联合演习，炮兵观察员与步兵团部之间的平均火力请求时间由26分钟缩短至11分钟。火炮编制、弹药基数和呼叫程序现已写入共同标准；在最后一次实弹考核中，73%的炮兵连能够在预定时限内完成首次齐射。"
 RUS_fr_armaments_report_infantry_generic:0 "陆军兵器分委员会已核准47项口径、弹药与零件标准，撤销113份彼此冲突的旧图纸。仍有8种方案需要继续部队试用，但各兵工厂至少不再为同一支军队生产无法互换的武器与备件。"
 RUS_fr_armaments_report_mobility_vehicle:0 "委员会选择以车辆制造工艺统合作为主要道路。莫斯科及其他汽车工业中心把1,240种重复零件压缩为463种共同规格，并组织3支快速战斗群完成总计3,600公里的道路行军。参加试验的872辆车辆中，82%未经大修抵达终点，平均野战维修时间较旧编制缩短31%。这证明大批可维修的车辆远比少数性能惊人的样车更有价值。"
 RUS_fr_armaments_report_mobility_logistics:0 "委员会把专业化机械后勤确定为主要道路。4个军、11个师及5,200余辆车辆参加了持续6周的保障试验，运输营、维修营和燃料纵队第一次从演习开始便被写入战斗计划。每1,000车辆日发生的燃料中断由17次降至5次，64%的机械故障能够在野战修理所内解决；机械化作战因而第一次具备了可持续性。"
 RUS_fr_armaments_report_mobility_air_assault:0 "委员会批准了风险最高的旋翼航空器与空中突击试验。24架原型机完成417架次飞行，3个加强连先后实施越河、夺桥和敌后着陆；5架机体因事故报废，另有7架需要返厂重修，这些损失均已如实列入附件。然而，在最后一次考核中，突击分队比地面先遣队提前6小时40分钟占领预定目标。常务委员会认为，这项工程距离成熟尚远，却已证明战役纵深不再必然受地面交通支配。"
 RUS_fr_armaments_report_mobility_generic:0 "机动化分委员会已完成36项车辆接口、维修工具和运输编制标准，7个军区建立了首批统一备件库。有关下一步究竟应扩大车辆生产、加强专业后勤还是继续探索空中机动的争论仍未完全平息，但所有方案都必须建立在这套共同工业基础之上。"
 RUS_fr_armaments_report_armour_firepower:0 "委员会将自行直射与伴随火力列为专项试验重点。11辆自行火炮及反坦克样车完成1,860发实弹射击和340公里强行军，炮身、底盘与弹药接口的联合验证通过率达到78%。试验同时暴露了补给负担与车体寿命问题，3种方案因此被退回重制；但获准继续发展的车辆已经能够伴随装甲纵队通过突破口，而不必在每一道坚固阵地前等待后方炮兵。"
 RUS_fr_armaments_report_armour_durability:0 "委员会首先处理了长期被样车性能掩盖的结构可靠性问题。16种底盘在泥泞、冻土和碎石路面累计行驶9,700公里，其中6种未达到最低寿命要求并被停止试制。经2轮改进后，每1,000公里传动故障由6.4次降至2.1次，履带平均寿命提高38%。新车辆的纸面性能并未因此显著上升，却终于能够在离开铁路和修理厂后继续完成战役任务。"
 RUS_fr_armaments_report_armour_generic:0 "装甲兵器分委员会已完成22项底盘、炮塔与维修接口标准，并对27辆样车进行了累计6,000余公里的耐久考核。各设计局仍可保留自己的技术传统，但今后任何车辆都必须证明它能够进入统一生产与保障体系，而非只在试验场上取得漂亮成绩。"
 RUS_fr_armaments_report_conclusion_armaments:0 "常务委员会据此建议，下一期联邦计划继续优先保障枪械、火炮、弹药与质量验收体系，并把本期形成的标准推广到所有军区仓库和兵工企业。机动化与装甲部门已经保留了继续发展的工业基础，但在步兵兵器完成全面换装以前，不宜再次分散最稀缺的精密设备。委员会请求国家军事委员会批准上述结论。"
 RUS_fr_armaments_report_conclusion_mobility:0 "常务委员会据此建议，下一期联邦计划继续优先扩充车辆、燃料、维修与机动部队训练体系，使本期试验不止停留在少数示范单位。步兵兵器与装甲工程已经完成必要的标准化工作，今后的新增产能则应首先用于缩短部队与补给抵达战场所需的时间。委员会请求国家军事委员会批准上述结论。"
 RUS_fr_armaments_report_conclusion_armour:0 "常务委员会据此建议，下一期联邦计划继续把合金、重型机床、无线电和专业保障力量集中到装甲兵器建设，使通用底盘与统一火力程序能够支撑真正独立的装甲兵团。步兵和机动化部门已经取得足以维持全军运转的基础成果，但最优质的工业资源仍应服务于决定性突破力量。委员会请求国家军事委员会批准上述结论。"
 RUS_fr_armaments_report_conclusion_generic:0 "常务委员会建议把本期形成的图纸、试验规程和生产标准正式写入下一期联邦计划，并由总参谋部继续监督其在各军区的落实。委员会请求国家军事委员会审议并批准上述结论。"
