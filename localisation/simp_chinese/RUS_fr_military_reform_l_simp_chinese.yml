l_simp_chinese:
 RUS_fr_post_revolutionary_armed_forces:0 "革命后的武装力量"
 RUS_fr_post_revolutionary_armed_forces_desc:0 "旧政权留下了一架庞大却反动的战争机器，而归国的红军干部、革命士兵和新生的劳动政权尚未形成统一军制。我们必须首先清点力量、恢复红军传统，并为全面整军建立制度与物资基础。"
 RUS_fr_frunze_defence_report:0 "伏龙芝的国防报告"
 RUS_fr_frunze_defence_report_desc:0 "伏龙芝将向中央提交一份关于军队指挥、训练、军需和国防工业的完整报告。报告既总结革命战争的经验，也将确定军事改革所需的干部、经验与物资规模。"
 RUS_fr_unified_military_leadership:0 "伏龙芝的统一军事领导"
 RUS_fr_unified_military_leadership_desc:0 "革命军队不能继续受派系、地域与旧参谋体系的牵制。伏龙芝将以统一的军事领导，把红军改造成一支真正属于劳动共和国的现代军队。"
 RUS_fr_rebuild_revolutionary_military_council:0 "重建革命军事委员会"
 RUS_fr_rebuild_revolutionary_military_council_desc:0 "恢复革命军事委员会，以集体决策、专业参谋与政治监督统合全国武装力量。斯大林也将在此后获准进入最高军事指挥体系。"
 RUS_fr_reorganise_general_staff_districts:0 "整编总参谋部与军区体系"
 RUS_fr_reorganise_general_staff_districts_desc:0 "重新划分军区、明确总参谋部权限，并打通中央命令直达野战部队的制度通道。"
 RUS_fr_national_military_reform_program:0 "全国军事改革总纲"
 RUS_fr_national_military_reform_program_desc:0 "军队建设必须与国家计划相协调。军事改革总纲将把干部、装备、训练、动员和国防工业纳入统一日程。"
 RUS_fr_cadres_decide_everything:0 "干部决定一切"
 RUS_fr_cadres_decide_everything_desc:0 "优秀的红色指挥员不是旧军官制度的复制品，而是在战斗、学习和群众监督中成长起来的革命军事干部。"
 RUS_fr_equipment_is_the_armys_skeleton:0 "装备是军队的骨骼"
 RUS_fr_equipment_is_the_armys_skeleton_desc:0 "勇气必须由步枪、火炮、车辆和稳定的补给制度支撑。统一军械标准是现代战争的物质基础。"
 RUS_fr_train_before_expansion:0 "先训练，再扩编"
 RUS_fr_train_before_expansion_desc:0 "未经训练的扩军只会制造纸面数字。新编部队必须先完成标准化训练周期，再进入战斗序列。"
 RUS_fr_red_commander_system:0 "红色指挥员体系"
 RUS_fr_red_commander_system_desc:0 "建立军校、轮训、战地考评和逐级晋升制度，使真正有能力的基层干部获得指挥权。"
 RUS_fr_unified_ordnance_supply_system:0 "统一军械与军需制度"
 RUS_fr_unified_ordnance_supply_system_desc:0 "统一口径、零件、验收与仓储制度，以国家计划取代各军区各自为政的采购方式。"
 RUS_fr_unified_training_mobilisation_system:0 "统一训练与动员制度"
 RUS_fr_unified_training_mobilisation_system_desc:0 "常备军、预备役、铁路运输和地方动员机关将遵循同一套训练与动员表。"
 RUS_fr_frunze_field_regulations:0 "伏龙芝野战条令"
 RUS_fr_frunze_field_regulations_desc:0 "新条令将革命主动性与严密的参谋工作结合起来，为各兵种协同建立统一原则。"
 RUS_fr_general_staff_experimental_formations:0 "总参谋部试验编制"
 RUS_fr_general_staff_experimental_formations_desc:0 "选取若干部队试行新的师级编制，并用演习数据纠正纸面方案。"
 RUS_fr_national_mobilisation_supply_test:0 "全国动员与补给检验"
 RUS_fr_national_mobilisation_supply_test_desc:0 "从征召、编组到铁路输送和前线补给，对整个战争机器进行一次不预先通知的检验。"
 RUS_fr_all_russian_red_army_exercise:0 "全俄红军大演习"
 RUS_fr_all_russian_red_army_exercise_desc:0 "陆军各军区将在统一想定下进行大规模对抗演习，检验改革是否真正抵达基层。"
 RUS_fr_revolutionary_military_system_finalised:0 "革命军事体系定型"
 RUS_fr_revolutionary_military_system_finalised_desc:0 "改革不再是临时措施。新的指挥、训练、军需与政治工作制度将成为劳动共和国武装力量的常制。"
 RUS_fr_military_rectification:0 "军事肃反"
 RUS_fr_military_rectification_desc:0 "以纪律委员会、履历审查与合法程序清除仍企图恢复旧秩序的秘密网络。"
 RUS_fr_investigate_white_networks:0 "清查残余白军网络"
 RUS_fr_investigate_white_networks_desc:0 "调查旧军官团体与地下组织的联系，同时为愿意宣誓效忠共和国者保留服务和退役安置渠道。"
 RUS_fr_officer_oath_service_review:0 "军官宣誓与履历复审"
 RUS_fr_officer_oath_service_review_desc:0 "用统一的宣誓、复审和考评取代派系担保，使军官资格建立在能力与现实表现之上。"
 RUS_fr_basic_commissar_system:0 "设立基本政委制度"
 RUS_fr_basic_commissar_system_desc:0 "政委负责政治教育、纪律申诉和军政沟通，但不得以政治口号取代专业军事指挥。"
 RUS_fr_soldiers_committees:0 "建立士兵委员会"
 RUS_fr_soldiers_committees_desc:0 "士兵委员会将监督生活保障、反映基层意见，并在不破坏指挥统一的前提下维护红军战士权利。"
 RUS_fr_unified_military_political_system:0 "统一军政制度"
 RUS_fr_unified_military_political_system_desc:0 "明确指挥员、政委和士兵委员会的权限边界，使政治可靠性与军事效率相互支撑。"
 RUS_fr_federal_armaments_defence_industry_commission:0 "联邦军备与国防工业委员会"
 RUS_fr_federal_armaments_defence_industry_commission_desc:0 "设立跨部门常设委员会，把总参谋部需求、联邦计划机关的产能指标与各军工机构的研发计划结合起来。"
 RUS_fr_light_weapons_artillery_design:0 "陆军兵器设计总纲"
 RUS_fr_light_weapons_artillery_design_desc:0 "以统一战术需求统筹步兵武器、支援装备、火炮和弹药设计，并为两个专业技术委员会规定共同标准。"
 RUS_fr_small_arms_standardisation_committee:0 "单兵武器标准化委员会"
 RUS_fr_small_arms_standardisation_committee_desc:0 "统一步兵武器与支援装备的口径、零件、公差和生产规范，并接管旧军工线的相关科技与企业升级。"
 RUS_fr_artillery_ammunition_technical_committee:0 "火炮与弹药技术委员会"
 RUS_fr_artillery_ammunition_technical_committee_desc:0 "统筹火炮、弹药、牵引设备和重型火力试制，协调奥布霍夫、BMZ与图拉兵工体系。"
 RUS_fr_ergonomic_tolerance_standards:0 "战斗装具人体工学规范"
 RUS_fr_ergonomic_tolerance_standards_desc:0 "统一握持、携行、瞄准装置与战斗装具的人体工学规范，降低长期行军和持续战斗对士兵的负担。"
 RUS_fr_soldier_load_lightening_program:0 "单兵负荷轻量化纲要"
 RUS_fr_soldier_load_lightening_program_desc:0 "通过材料优化和携行制度降低单兵负担，提升长时间行军与持续作战能力。"
 RUS_fr_divisional_artillery_support_standard:0 "师属炮兵支援标准"
 RUS_fr_divisional_artillery_support_standard_desc:0 "为每个步兵师建立稳定的炮兵编制、弹药基数和火力呼叫程序。"
 RUS_fr_armaments_quality_assurance_inspectorate:0 "军品质量验收制度"
 RUS_fr_armaments_quality_assurance_inspectorate_desc:0 "设立独立验收、失效追踪和批次复查制度，让产量指标不能再掩盖质量缺陷。"
 RUS_fr_self_propelled_support_fire_trials:0 "自行支援火力联合试验"
 RUS_fr_self_propelled_support_fire_trials_desc:0 "由火炮和机械化部门联合验证自行支援火力平台，为炮兵伴随机动和重型火力项目积累数据。"
 RUS_fr_combined_arms_support_standard:0 "陆军兵器体系定型"
 RUS_fr_combined_arms_support_standard_desc:0 "把步兵武器、火炮、弹药、质量验收和支援火力规范定型为统一的陆军兵器体系。"
 RUS_fr_mechanisation_wave:0 "陆军机动化建设纲要"
 RUS_fr_mechanisation_wave_desc:0 "扩大车辆生产、驾驶员训练和维修能力，为红军建立现代战役机动体系。"
 RUS_fr_mechanised_platform_research_committee:0 "机械化平台研究委员会"
 RUS_fr_mechanised_platform_research_committee_desc:0 "统筹卡车、履带车辆、发动机和通用机械化底盘研究，并协调AMO、NAZ与LAZ的生产计划。"
 RUS_fr_rapid_mobility_equipment_trials:0 "快速机动装备试验纲要"
 RUS_fr_rapid_mobility_equipment_trials_desc:0 "以长途行军、恶劣道路和战时维修试验检验快速机动装备，随后由事件确定机动化领域的最终路线。"
 RUS_fr_vehicle_manufacturing_integration:0 "车辆制造工艺统合"
 RUS_fr_vehicle_manufacturing_integration_desc:0 "集中改良底盘、发动机和流水线，优先提高车辆数量与野战维修通用性。"
 RUS_fr_mechanised_logistics_regulations:0 "机械化后勤勤务条例"
 RUS_fr_mechanised_logistics_regulations_desc:0 "以运输营、维修营和燃料纵队为核心，形成专业化机械后勤体系。"
 RUS_fr_helicopter_pilot_program:0 "旋翼航空器验证计划"
 RUS_fr_helicopter_pilot_program_desc:0 "把航空发动机、旋翼结构和运输试验纳入正式验证计划，为空中机动部队探索道路。"
 RUS_fr_rapid_operational_corps:0 "重装机械化战斗群"
 RUS_fr_rapid_operational_corps_desc:0 "以车辆制造或专业化机械后勤为基础，组建能够独立实施突破、追击和纵深作战的重装机械化战斗群。"
 RUS_fr_air_assault_brigades:0 "空中机动步兵试验编制"
 RUS_fr_air_assault_brigades_desc:0 "试编依靠旋翼航空器实施垂直机动的步兵部队；选择此路线将放弃车辆制造和机械化后勤的高级强化。"
 RUS_fr_deep_mobility_program:0 "高速纵深机动纲要"
 RUS_fr_deep_mobility_program_desc:0 "把空中机动、远程侦察和快速战役指挥结合起来，形成越过正面、打击纵深目标的作战纲要。"
 RUS_fr_emphasise_armour_design:0 "装甲兵器发展纲要"
 RUS_fr_emphasise_armour_design_desc:0 "把坦克设计局、冶金单位、火炮部门和试验场纳入统一装甲兵器计划。"
 RUS_fr_alloy_armour_standard:0 "合金装甲工程"
 RUS_fr_alloy_armour_standard_desc:0 "统一装甲钢牌号、热处理和弹道验收，并强化Sormovo、CHTZ与UZTM的材料工程能力。"
 RUS_fr_tank_firepower_development_plan:0 "坦克火力发展计划"
 RUS_fr_tank_firepower_development_plan_desc:0 "协调坦克炮、炮塔、瞄准系统和弹药设计，建立从试验火炮到量产模块的完整研发链。"
 RUS_fr_breakthrough_chassis_program:0 "突破型通用底盘"
 RUS_fr_breakthrough_chassis_program_desc:0 "优先满足正面突破、强火力和战役纵深推进所需的底盘设计。"
 RUS_fr_hull_structural_durability_trials:0 "车体结构耐久试验"
 RUS_fr_hull_structural_durability_trials_desc:0 "先解决焊接、悬挂和传动系统的寿命问题，以可靠性奠定装甲兵规模化基础。"
 RUS_fr_long_range_armoured_exploitation:0 "远程机动作战标准"
 RUS_fr_long_range_armoured_exploitation_desc:0 "围绕油料、履带寿命、乘员疲劳和战役补给制定装甲部队远程机动作战标准。"
 RUS_fr_high_velocity_kinetic_gun_program:0 "高速动能火炮计划"
 RUS_fr_high_velocity_kinetic_gun_program_desc:0 "推进稳定尾翼脱壳穿甲弹和现代高速火炮研究；特殊项目尚未完成时只提供进度与研究替代，不会阻塞自动国策。"
 RUS_fr_universal_hull_standards:0 "装甲车辆部件通用化"
 RUS_fr_universal_hull_standards_desc:0 "统一动力、悬挂、传动和维修部件标准，降低不同装甲车辆之间的生产与保障成本。"
 RUS_fr_self_propelled_direct_fire_system:0 "自行直射火力系统"
 RUS_fr_self_propelled_direct_fire_system_desc:0 "以自行火炮和突击炮承担伴随直射火力，强化装甲部队突破坚固阵地的能力。"
 RUS_fr_armoured_firepower_coordination_standard:0 "装甲火力协同标准"
 RUS_fr_armoured_firepower_coordination_standard_desc:0 "把坦克炮、自行火炮、师属炮兵和机动侦察纳入统一火力指挥程序。"
 RUS_fr_land_warfare_mainstay:0 "统一装甲兵器体系"
 RUS_fr_land_warfare_mainstay_desc:0 "装甲兵器不再是彼此割裂的样车，而成为具有通用部件、统一火力与可靠保障的完整体系。"
 RUS_fr_automatic_focus_tt:0 "该国策由§Y联邦军备与国防工业委员会§!自动推进，不占用玩家国策槽；界面显示的国策天数就是控制器实际使用的时间。"
 RUS_fr_military_reform_decisions:0 "全国军事改革"
 RUS_fr_military_reform_decisions_desc:0 "当前§Y军事改革物资§!：§Y[?RUS_fr_military_reform_materials|0]§!\n\n军事改革物资用于手动军制国策、改革决议以及委员会自动项目。自动国策在启动时扣除物资：发展总纲§Y8§!、普通技术委员会§Y10§!、专项试验与标准§Y12§!、跨部门联合项目§Y15§!、路线终点§Y20§!。物资不足时项目进入等待拨款状态，不会被取消。"
 RUS_fr_military_reform_materials:0 "军事改革物资"
 RUS_fr_mio_research_cap_tt:0 "该军工机构的£research_speed_icon §H研究加成软上限§!提高$RIGHT|+=2%$"
 RUS_fr_amo_research_surplus_tt:0 "AMO完成科技研究时，每级军工机构规模获得的£civ_factory_output §H经济盈余§!提高$RIGHT|+=0$"
 RUS_fr_federal_plan_armaments_allocation:0 "追加军备拨款"
 RUS_fr_federal_plan_armaments_allocation_desc:0 "调整本期计划指标，为军队改革追加一批钢材、机床、车辆和通信器材。"
 RUS_fr_draw_general_staff_reserves:0 "动用总参谋部储备"
 RUS_fr_draw_general_staff_reserves_desc:0 "以陆军经验代表的组织资本和成熟方案，换取一批可立即投入改革的储备。"
 RUS_fr_wartime_emergency_procurement:0 "战时紧急采购"
 RUS_fr_wartime_emergency_procurement_desc:0 "战争爆发后进行一次紧急采购，获得30点军事改革物资，但降低稳定度；该措施每场建设周期只能使用一次。"
 RUS_fr_reform_command_audit:0 "第一阶段：指挥体系审计"
 RUS_fr_reform_command_audit_desc:0 "消耗军事改革物资与陆军经验，优先削弱最严重的军制积弊，并获得四分之一的基础改革增益；完成后返还5点可复用物资。"
 RUS_fr_reform_standard_tables:0 "第二阶段：统一编制与表册"
 RUS_fr_reform_standard_tables_desc:0 "进一步削弱负面精神，将基础改革增益提高到最终值的一半；完成后返还5点可复用物资。"
 RUS_fr_reform_training_cycles:0 "第三阶段：标准训练周期"
 RUS_fr_reform_training_cycles_desc:0 "把改革落实到训练和基层单位，将基础改革增益提高到最终值的四分之三；完成后返还5点可复用物资。"
 RUS_fr_reform_grand_field_test:0 "第四阶段：全军实地检验"
 RUS_fr_reform_grand_field_test_desc:0 "彻底移除军事体系积弊，并取得全部固定基础增益；完成后返还5点可复用物资。"
 RUS_fr_cost_25_army_xp:0 "£army_experience §Y25§!"
 RUS_fr_reform_disorganisation_4:0 "军事体系积弊：全面失调"
 RUS_fr_reform_disorganisation_4_desc:0 "旧军制、革命战争中的临时编制和各派系遗留的指挥习惯彼此冲突。只有持续投入经验与物资，才能逐步消除这些问题。"
 RUS_fr_reform_disorganisation_3:0 "军事体系积弊：严重失调"
 RUS_fr_reform_disorganisation_3_desc:0 "第一轮审计已经厘清部分问题，但指挥、训练与军需仍缺乏统一标准。"
 RUS_fr_reform_disorganisation_2:0 "军事体系积弊：结构性缺陷"
 RUS_fr_reform_disorganisation_2_desc:0 "改革已经产生效果，剩余问题主要集中在基层执行和跨军区协同。"
 RUS_fr_reform_disorganisation_1:0 "军事体系积弊：残余问题"
 RUS_fr_reform_disorganisation_1_desc:0 "大部分制度障碍已经清除，最后一次全军检验将决定改革能否定型。"
 RUS_fr_reform_basic_bonuses_1:0 "军事改革基础成果：第一阶段"
 RUS_fr_reform_basic_bonuses_1_desc:0 "已经获得最终固定基础增益的四分之一。该部分与政党支持率无关。"
 RUS_fr_reform_basic_bonuses_2:0 "军事改革基础成果：第二阶段"
 RUS_fr_reform_basic_bonuses_2_desc:0 "已经获得最终固定基础增益的一半。该部分与政党支持率无关。"
 RUS_fr_reform_basic_bonuses_3:0 "军事改革基础成果：第三阶段"
 RUS_fr_reform_basic_bonuses_3_desc:0 "已经获得最终固定基础增益的四分之三。该部分与政党支持率无关。"
 RUS_fr_reform_basic_bonuses_4:0 "军事改革基础成果：完成"
