 RUS_fr_timoshenko_reform_cost_discount_tt:0 "担任理论家时，军事改革决议陆军经验花费：每级§G-5%§!"
 RUS_fr_timoshenko_armaments_specialisation_tt:0 "侧重§Y陆军兵器设计总纲§!时：\n将领升级时额外获得§Y1§!点进攻的概率：§G+50%§!\n将领升级时额外获得§Y1§!点防御的概率：§G+50%§!\n将领升级时额外获得§Y1§!点计划的概率：§G+50%§!\n将领升级时额外获得§Y1§!点后勤的概率：§G+50%§!"
 RUS_fr_timoshenko_stage_four_upgrade_tt:0 "§Y谢苗·铁木辛哥§!的理论家特质将得到强化，额外获得：\n战场宽度：§G-10.0%§!"
 RUS_fr_political_commissar_organisation_idea:0 "政治委员组织体系"
 RUS_fr_political_commissar_organisation_idea_desc:0 "政委不再是危急时刻临时派往前线的鼓动员，也不是站在指挥员身后的监视者。他们将政治教育、士兵诉求与部队经验带入统一的组织渠道，使党、军官和普通战士第一次能够在同一套制度中彼此理解。"
 RUS_fr_scientific_general_staff_idea:0 "科学化总参谋部"
 RUS_fr_scientific_general_staff_idea_desc:0 "地图、统计、兵棋与战史研究正在取代将领们彼此矛盾的直觉。总参谋部不再只是传递命令的机关，而是一所持续观察战争、检验假设并把教训写回条令的军事科学中心。"
 RUS_fr_deep_battle_concept_idea:0 "纵深作战理论"
 RUS_fr_deep_battle_concept_idea_desc:0 "战场不再被视作一条必须正面撞开的线，而是由交通枢纽、预备队、炮兵阵地和指挥机关构成的广阔纵深。突破只是战役的开端；真正的胜利来自接连不断的打击，直到敌人的整个体系同时崩溃。"
 RUS_fr_one_man_command_idea:0 "首长负责制"
 RUS_fr_one_man_command_idea_desc:0 "命令下达之前可以争论，命令下达之后必须执行。指挥员被赋予明确而完整的军事责任，政治机关则负责监督原则、解释目标并维护军队与革命之间的联系，两者不再以含混的权限彼此推诿。"
 RUS_fr_revolutionary_collectivism_idea:0 "革命集体主义"
 RUS_fr_revolutionary_collectivism_idea_desc:0 "人民军的力量不属于某一位天才将领或孤胆英雄，而来自彼此负责的班、排、连和每一个士兵委员会。只要集体仍然保持联系，伤亡、疲惫和暂时的失败便无法使部队彻底瓦解。"
 RUS_fr_military_vanguardism_idea:0 "军事先锋主义"
 RUS_fr_military_vanguardism_idea_desc:0 "革命不能永远等待旧军队接受新观念。经过严格选拔的试验部队将率先采用新的编制、通信和机动作战方法，以成功证明道路，以失败为全军换取教训。"
 RUS_fr_revolutionary_heroism_idea:0 "革命英雄主义"
 RUS_fr_revolutionary_heroism_idea_desc:0 "革命所需要的英雄并非供人膜拜的偶像，而是在决定性时刻愿意承担责任的人。工人出身的军官、坚守阵地的士兵和维持道路畅通的后勤人员，都将成为可以被全军学习而非遥不可及的榜样。"
 RUS_fr_tempered_in_steel_idea:0 "淬火成钢"
 RUS_fr_tempered_in_steel_idea_desc:0 "一次次对抗演习使红军学会隐藏真正的意图，在敌人确信自己已经看清一切时改变部署、转移主攻方向并发动反击。伪装、侦察与欺骗不再是少数参谋的奇技，而成为从军区司令部到前沿部队共同掌握的作战方法。"
 RUS_fr_field_political_agitation_idea:0 "前线政治鼓动巡回队"
 RUS_fr_field_political_agitation_idea_desc:0 "政工干部、战地记者和基层模范战士正在新编部队之间巡回。他们把革命政府的命令讲成士兵能够理解的语言，也把兵营里的抱怨和困惑带回政治机关。"
 RUS_fr_general_staff_wargames_idea:0 "总参谋部兵棋推演"
 RUS_fr_general_staff_wargames_idea_desc:0 "地图、棋子和厚厚的铁路时刻表铺满了参谋部会议桌。每一次推演都在迫使军官们回答同一个问题：当敌人不按我们希望的方式行动时，红军该如何继续进攻？"
 RUS_fr_deep_battle_exercise_idea:0 "纵深突破演练"
 RUS_fr_deep_battle_exercise_idea_desc:0 "第一梯队的突破只是战役的开端。预备队、侦察分队和机动火力正在训练场上反复穿越假想缺口，学习如何把敌人的局部崩溃扩展为整条战线的动摇。"
 RUS_fr_central_military_liaison_idea:0 "中央军政协调会议"
 RUS_fr_central_military_liaison_idea_desc:0 "总参谋部、政治机关和主要军区的代表被召到同一张桌前。会议并不总是愉快，但每一次争论都比前线收到互相矛盾的命令更便宜。"
 RUS_fr_academy_research_groups_idea:0 "军校理论研究小组"
 RUS_fr_academy_research_groups_idea_desc:0 "雷雨军事学院的教官们正把演习记录、国外战例和内战经验整理成新的讲义。红军需要的不只是勇敢的军官，还需要能把教训变成方法的人。"
 RUS_fr_unified_training_rotation_idea:0 "统一轮训计划"
 RUS_fr_unified_training_rotation_idea_desc:0 "来自不同军区的干部和骨干士兵被打散轮训。北方部队学习草原上的补给办法，西部军区接受严寒驻训经验，而每个人都必须服从同一套考核标准。"
 RUS_fr_military_district_readiness_idea:0 "军区战备核验"
 RUS_fr_military_district_readiness_idea_desc:0 "检查组不会提前通知仓库主任、铁路调度员或军区参谋长。动员表、燃料记录和预案地图必须在今天就能使用，因为战争不会等我们把文件重新誊清。"
 RUS_fr_voronezh_exercise_review_idea:0 "沃罗涅日演习复盘"
 RUS_fr_voronezh_exercise_review_idea_desc:0 "沃罗涅日演习的失败动作、迟到列车和错误命令被逐条写入复盘材料。红军愿意在纸面上承认这些难堪，因为下一次暴露问题的地方可能就是战场。"
 RUS_fr_emergency_workshop_norms_idea:0 "军工车间突击规范"
 RUS_fr_emergency_workshop_norms_idea_desc:0 "军需官、工程师和工会小组正在关键车间里逐台检查机床、逐批核验零件。突击规范不会永久解决工业问题，却能让眼下这批订单更快、更稳地送到前线。"
 RUS_fr_unified_army_reform:0 "工农红军现状：铁流万里"
 RUS_fr_unified_army_reform_desc:0 "借用一句东方谚语——“万事俱备，只欠东风”——来形容此刻的红军，再贴切不过。新式装备陆续列装，工农红军的素质正在稳步提升。我们的战士已经学会了操作新装备，指挥员正在消化新的战术条令，后勤体系逐步覆盖更远的战线。我们业已枕戈待旦，准备向旧世界的堡垒发起冲锋。"
 RUS_fr_unified_army_reform_final:0 "工农红军现状：无敌与传奇"
 RUS_fr_unified_army_reform_final_desc:0 "历经淬炼的工农红军最终击败了它的宿敌，不可一世的德意志帝国在人民浪潮的冲击下土崩瓦解……让资产阶级发疯去吧！让无价值的灵魂哭泣去吧！历史已经写下了它的判决！工农红军将解放世界的每个角落！"
 RUS_fr_unify_basic_army_reform_tt:0 "将已获得的§Y军制改革§!与§Y军队制度§!精神合并为§Y工农红军现状：铁流万里§!；此后完成的相关决议也会直接并入该精神。"
 RUS_fr_comrades_abroad_army_reform_bonus_tt:0 "§Y工农红军现状§!追加：\n$MODIFIER_SEND_VOLUNTEER_SIZE$: §G+5§!\n$MODIFIER_ARMY_EXPERIENCE_FROM_VOLUNTEERS$: §G+50.0%§!"
 RUS_fr_unlock_invincible_legendary_status_tt:0 "§Y工农红军现状：铁流万里§!将升级为§Y工农红军现状：无敌与传奇§!"
 tech_forest_warfare_terrain_effect:0 "§Y徒步、摩托化与机械化步兵§!：\n森林：\n  移动：§G+5.0%§!\n  攻击：§G+5.0%§!\n  防御：§G+3.0%§!"
 tech_marsh_warfare_terrain_effect:0 "§Y徒步、摩托化与机械化步兵§!：\n沼泽：\n  移动：§G+5.0%§!\n  攻击：§G+10.0%§!\n  防御：§G+5.0%§!"
 RUS_fr_armaments_basic_result:0 "军备建设基础成果"
 RUS_fr_armaments_basic_result_desc:0 "图拉的枪械、彼得格勒的火炮和各地仓库中的零件开始服从统一的图纸、口径与验收标准。联邦订单不再只追求交付数字，前线士兵第一次可以相信送到手中的武器能够彼此替换、经受使用；然而围绕本土正规战建立的定型体系，也暂时削弱了部队在远离联邦核心地区时因地制宜的能力。"
 RUS_fr_mobility_basic_result:0 "机动建设基础成果"
 RUS_fr_mobility_basic_result_desc:0 "车辆不再是各工厂按照自身习惯制造的稀罕机器。统一的发动机规格、维修手册和零件目录把汽车厂、军需仓库与野战修理所连接起来，为红军建立了最初的机动骨架。"
 RUS_fr_mechanised_platform_mobility_priority:0 "机械化平台优先建设"
 RUS_fr_mechanised_platform_mobility_priority_desc:0 "委员会将机械化部队视作战役机动的核心，而非单纯的运输工具。车辆、乘员与步兵战术由此被纳入同一套训练和作战标准。"
 RUS_fr_vehicle_manufacturing_integration_idea:0 "车辆制造工艺统合"
 RUS_fr_vehicle_manufacturing_integration_idea_desc:0 "统一的零件目录、燃料标准和流水线规范减少了机械化车辆在工厂与前线之间的浪费，使大规模装备部队成为可持续的工业任务。"
 RUS_fr_vehicle_manufacturing_integration_priority_idea:0 "车辆制造工艺统合"
 RUS_fr_vehicle_manufacturing_integration_priority_idea_desc:0 "在统一零件目录、燃料标准和流水线规范之外，机动化建设的优先地位还推动机械化部队形成了更成熟的训练、编组与协同作战体系。"
 RUS_fr_air_assault_brigades_idea:0 "空中机动试验编制"
 RUS_fr_air_assault_brigades_idea_desc:0 "维持旋翼航空器、训练专门步兵并建立新的指挥体系代价高昂，但它使红军第一次能够绕过正面障碍，直接争夺敌军战役纵深。"
 RUS_fr_air_assault_mobility_priority_idea:0 "旋翼航空器集中生产计划"
 RUS_fr_air_assault_mobility_priority_idea_desc:0 "为了让空中突击从试验编制变成真正的战役力量，委员会接受了极其昂贵的专用航空器和训练体系，将最优秀的人员集中到新型特种部队之中。"
 RUS_fr_deep_mobility_priority_idea:0 "高速纵深机动作战体系"
 RUS_fr_deep_mobility_priority_idea_desc:0 "持续投入使空中机动部队能够越过道路、河流与战壕，在敌军尚未完成部署前进入纵深。与之相伴的庞大工业负担，则成为联邦计划必须长期承担的代价。"
 RUS_fr_mobility_priority_improved_logistics_bonus:0 "机动化后勤强化标准"
 RUS_fr_mobility_priority_improved_logistics_bonus_desc:0 "机动化建设的优先投入使运输调度、燃料管理与前线补给规程得到进一步强化。"
 RUS_fr_mobility_priority_logistics_bonus_tt:0 "若侧重§Y陆军机动化建设纲要§!，§Y改良后勤连§!的效果§G翻倍§!：\n补给使用：额外§G-10.0%§!\n燃油使用：额外§G-5.0%§!"
 RUS_fr_armour_basic_result:0 "装甲建设基础成果"
 RUS_fr_armour_basic_result_desc:0 "设计局不再把每一种坦克视作只属于自己的作品。底盘、装甲、炮塔和传动系统被纳入共同的工程语言，乌拉尔与彼得格勒的工厂由此能够分享试验结果，并为未来的大规模装甲部队奠定基础。"
 RUS_fr_armaments_priority_result:0 "陆军兵器优先建设"
 RUS_fr_armaments_priority_result_desc:0 "委员会把最好的钢材、量具和熟练工人留给步兵兵器与火炮工厂。红军仍将依靠人的双脚前进，但这些战士不会再因粗劣的枪机、破裂的炮闩或无法互换的零件付出代价。"
 RUS_fr_mobility_mechanised_priority_result:0 "重型机械化优先建设"
 RUS_fr_mobility_mechanised_priority_result_desc:0 "与其追求少数耀眼的新式车辆，委员会选择首先建设能够支撑整个集团军的车队、修理营和机械化运输纵队。速度将不再属于侦察尖兵，而会成为整支军队组织方式的一部分。"
 RUS_fr_mobility_air_priority_result:0 "空中机动优先建设"
 RUS_fr_mobility_air_priority_result_desc:0 "旋翼机仍是工程师图板和试验场上的新奇事物，但它展示了一种越过道路、河流和战壕的可能。最优秀的轻步兵将被编入试验单位，为一支尚不存在于任何军事教范中的空中骑兵探索道路。"
 RUS_fr_armour_priority_result:0 "装甲兵器优先建设"
 RUS_fr_armour_priority_result_desc:0 "坦克不应只是掩护步兵前进的移动盾牌。集中起来的设计力量将围绕独立装甲兵团重新组织生产，使火力、防护、通信与长途行军能力共同服务于战役突破。"
 RUS_fr_armaments_specialisation:0 "军备专业化建设"
 RUS_fr_armaments_specialisation_desc:0 "联邦计划把军械生产从临时扩建转变为长期专业分工。设计局、试验场与量产工厂之间形成稳定的反馈循环，使每一轮订单都能吸收上一轮战争与生产的教训。"
 RUS_fr_mobility_specialisation:0 "机动专业化建设"
 RUS_fr_mobility_specialisation_desc:0 "道路、车辆、仓库和修理能力被视作同一个战役体系，而不再是彼此分离的后勤项目。红军的机动将由可以反复运转的组织网络保障，而非依赖一次性的物资集中。"
 RUS_fr_armour_specialisation:0 "装甲专业化建设"
 RUS_fr_armour_specialisation_desc:0 "独立的装甲工程体系已经形成。冶金、火炮、发动机和无线电领域的成果被持续汇入共同底盘，使装甲兵能够围绕自己的战役任务塑造装备，而不是被动接受工厂提供的车辆。"
 RUS_fr_military_reform.10.t:0 "第一次军备工作会议"
 RUS_fr_military_reform.10.d:0 "联邦军备与国防工业委员会已经收到三套同样庞大的建设方案。委员会能够推进全部领域，使每一领域获得基础成果；但最先确立的优先方向将得到额外资源、干部和长期政策倾斜。"
 RUS_fr_military_reform.10.a:0 "优先建立统一的军备生产体系"
 RUS_fr_military_reform.10.b:0 "优先解决机动与后勤问题"
 RUS_fr_military_reform.10.c:0 "优先塑造独立的装甲兵器体系"
 RUS_fr_military_reform.20.t:0 "步兵兵器设计争论"
 RUS_fr_military_reform.20.d:0 "委员会无法同时把有限的专项物资投入单兵负荷优化和师属炮兵扩充。前置设计工作已经完成，现在必须决定首先定型哪一种方案。"
 RUS_fr_military_reform.20.a:0 "减轻负荷，提高步兵持续作战能力"
 RUS_fr_military_reform.20.b:0 "强化师属炮兵，以火力保护步兵"
 RUS_fr_military_reform.30.t:0 "机动化建设的技术路线"
 RUS_fr_military_reform.30.d:0 "常规车辆制造、机械化后勤专业化和仍处于试验阶段的直升机空中突击会争夺同一批工程师、发动机和训练资源。委员会只能选定其中一条路线。"
 RUS_fr_military_reform.30.a:0 "统合车辆制造，建设快速战役军团"
 RUS_fr_military_reform.30.b:0 "优先专业化机械化后勤"
 RUS_fr_military_reform.30.c:0 "越过常规阶段，试编空中突击部队"
 RUS_fr_military_reform.40.t:0 "装甲兵器的工程取向"
 RUS_fr_military_reform.40.d:0 "委员会必须在自行直射火力与车体结构耐久之间确定专项试验重点。其余共同底盘、火炮与部件标准仍将照常推进。"
 RUS_fr_military_reform.40.a:0 "优先建立自行直射火力系统"
 RUS_fr_military_reform.40.b:0 "优先完成车体结构耐久试验"
 RUS_fr_military_reform.50.t:0 "关于红军当前建设困境的评估报告"
 RUS_fr_military_reform.50.d:0 "致：中央执行委员会军事事务处\n\n一、关于兵源素质\n\n当前红军的兵员构成以工人和农民为主。从意识形态角度而言，这支队伍的纯洁性是可以保证的——他们来自劳动阶级，与旧制度没有利益纠葛，对新政权抱有朴素的信任。但在实际操作层面，我们无法回避一个根本性的困难：识字率不等于认知能力。\n\n扫盲计划为士兵提供了最基础的读写训练，但这远远不够。一个能够辨认命令文字的士兵，未必能理解“敌情研判”“地形利用”“火力协同”这些概念。战场上的判断力需要的是理解能力，而不仅仅是识字能力。目前红军基层士兵中，能够在战术层面独立判断局势的比例仍然偏低。这导致基层指挥员必须承担大量本可由士兵自行完成的判断工作，指挥链条因此变得脆弱且低效。\n\n此外，部队中仍有相当一部分士兵对现代武器的操作原理缺乏基本认知。他们能够按照操典完成装填和射击动作，但一旦出现故障或异常情况，往往无法独立判断问题所在。在实战条件下，这种“只会操作、不会判断”的状态，可能成为致命的短板。\n\n二、关于指挥员短缺\n\n白军军官的大规模辞职，在革命初期被视为“清洗旧势力”的必要过程。但这一过程留下的缺口，至今未能有效填补。\n\n目前红军中基层指挥员的缺口仍然明显。现有的指挥员队伍中，有相当一部分是从士兵中直接提拔的——他们勇敢、忠诚、有威信，但缺乏系统的军事教育。少数人能够在实战中自行摸索出有效的指挥方法，但大多数人需要比现有条件更长的时间来积累经验。而在基层指挥员缺口尚未填满的情况下，更高层级的指挥岗位也受到了影响。\n\n问题的本质是时间不够。一名合格的排长需要至少一年的系统训练和实践积累；一名连长需要更长时间；而一名能够独立指挥营级单位的军官，其成长周期是以年为单位来计算的。我们正在加快培养速度，但培养速度和实际需求之间的差距仍然显著，短期内难以完全弥合。\n\n三、关于“大纵深”理论的现实距离\n\n图哈切夫斯基元帅的军事理论是完备的、科学的，这一点毋庸置疑。但理论的完备性，不能替代现实中的准备过程。\n\n实现“大纵深”理论所需的装甲兵团、机械化步兵、协同空军以及相应的后勤保障体系，目前仍处于起步阶段。我们的工业基础尚不能支撑如此规模的装备生产；我们的交通网络尚不能保证如此纵深的后勤补给；我们的通信手段尚不能维持如此复杂的战场协同——所有支撑理论落地的物质条件，都还有相当长的路要走。\n\n这不是对图哈切夫斯基元帅理论的否定，而是对现实条件的评估。如果我们按照“理论完备”的标准去衡量红军的现状，得出的结论必然是“远远不够”。而如果我们因为“远远不够”就放缓前进的步伐，那么我们就永远无法抵达理论所描绘的那个高度。\n\n关键在于：要有一个清晰的时间表。我们需要知道，在现有工业能力和教育资源下，每一年能够推进到什么程度；需要知道，哪些环节是可以加速的，哪些环节只能按部就班；还需要知道，如果必须在某个时间节点之前形成战斗力，我们必须在哪些方面做出取舍。\n\n结语\n\n红军目前面临的三个问题——兵员素质、指挥员短缺、理论落地——不是独立的三个问题，而是同一个问题的三个侧面：时间不够用。\n\n我们需要更多的时间来培养士兵的理解能力，更多的时间来训练指挥员，更多的时间来建设实现“大纵深”所必需的工业基础和后勤体系。但战争不等人。因此，我们必须做出一个艰难的选择：在有限的时间内，把有限的资源集中在最关键的环节上。\n\n国家军事参谋部\n谢苗·康斯坦丁诺维奇·铁木辛哥"
 RUS_fr_military_reform.50.a:0 "时间紧，任务重。"
 RUS_fr_military_reform.51.t:0 "未来战争之首要"
 RUS_fr_military_reform.51.d:0 "在军事革命思想的推动下，米哈伊尔·尼古拉耶维奇·图哈切夫斯基元帅完成了他的著作《未来战争之首要》。该书从国内战争的实战经验出发，结合他在法国总参谋部军事学院学习期间的见闻以及对欧洲各大军事强国的长期观察，系统地论证了装甲兵这一新兴军事产物在未来战争中的决定性作用。\n\n图哈切夫斯基在书中写道：“未来战争将不再是战壕与铁丝网的僵持，而是钢铁与速度的较量。”他分析了欧洲各国在装甲兵建设方面的进展，明确指出俄国在这一领域已落后于西方主要强国。书中提出的观点具有相当的前瞻性：未来的战场将属于大规模的机械化兵团，步兵的突破能力必须依靠装甲部队的快速穿插来实现，而空中力量与装甲部队的协同将是决定战役成败的关键。他还特别强调了军事工业的标准化和通用化——这一主张与他在国内战争期间观察到的高强度消耗战中的供应困境直接相关。\n\n该书一经出版便在军界和政界引起了强烈反响。军事学院的教员将其列为军官的推荐读物，前线部队的指挥官则逐页翻阅，试图从中找到关于下一场战争应该怎么打的答案。也有持不同意见者指出：以国内目前的经济水平，大规模扩充装甲部队是否现实？图哈切夫斯基在回应中并未否认经济基础的制约，而是指出技术代差不会因为等待而自行缩小——“今天我们造不起，明天我们就更造不起——因为别人跑得比我们快。”\n\n借此时机，图哈切夫斯基联合了国内一批年轻军官，正式向中央执行委员会提交了设立“国家军事委员会”（简称“国军委”）的提案。该提案建议，新部门将直接隶属于中央执行委员会，负责统筹全国的军事研发、军工生产和战略规划，确保各军区之间的情报互通与物资协调。国军委的职能将涵盖：制定统一的军工生产标准，协调各军工企业的生产计划；组织军事科研项目立项与评审，确保装备研发与战略需求同步；建立独立的试验与评估体系，对现有装备的技术代差进行系统评估和改进。\n\n提案的最后写道：“一个没有战争大脑的国家，只能在自己的土地上被动应战。”国军委的意义在于——它将使俄罗斯的军事建设摆脱“各军区各行其是”的惯性，成为一个有方向、有节奏、有预判能力的整体。它不是另一层行政机构，而是一台专注于“如何打赢下一场战争”的引擎。\n\n目前，该提案已进入初步讨论阶段。支持者认为此举将大幅提升国防效率，反对者则质疑其职权边界与现有军事机关的关系。但无论结果如何，“未来战争”已经从一篇文章标题，变成了一个需要被认真对待的政治议题。"
 RUS_fr_military_reform.51.a:0 "更快！更强！"
 RUS_fr_military_reform.52.t:0 "《雷声》引言"
 RUS_fr_military_reform.52.d:0 "米哈伊尔·伏龙芝\n\n——现代进攻战役的组织机理与计算基础\n\n资产阶级军事学家常将战争定义为“政治的延续”，这没错，但他们刻意回避了一个更根本的追问：政治本身是谁的延续？答案只能是无产阶级与剥削阶级之间不可调和的阶级斗争之延续。\n\n因此，本书不研究“一般战争”。世间不存在一般战争，正如不存在一般的人。所有进攻战役，无论其地图上的箭头指向何方，本质上都是阶级意志在空间中的物质展开。当我们讨论“雷声”时，我们不是在讨论一种音响效果，而是在讨论：如何用钢铁与炸药，以最高的经济效率，向旧世界宣读其历史判决书。\n\n目前流行的军事教材存在两种有害倾向。一种是“技术拜物教”，把战争拆解成弹道曲线和燃料消耗率，仿佛胜利取决于计算尺的精度；另一种是“自发论英雄主义”，把国内战争时期的冲锋经验神圣化，视组织为多余。前者忘记了武器是人的手臂延长，而人是阶级的细胞；后者则拒绝承认：革命激情若不能转化为每分钟射速和每公里油耗的精确换算，就只是没有引信的炸药。\n\n本书试图在这两种倾向之间开辟第三条道路——无产阶级的科学战役观。它的核心信条可以表述为：\n\n“每一发炮弹都必须问自己：你是在为谁的土地而炸响？”\n\n基于此，全书不提供“必胜秘诀”，而是提供一套阶级敏感度与物质约束条件的联立方程。我们要求指挥员在制定计划前，必须完成三道精神工序：\n\n1. 阶级定位：你的进攻方向，是否切断了敌军所依赖的阶级供应链？例如，夺取一座面包厂比夺取一座碉堡更具战略意义。\n\n2. 政治传导：你的命令下达后，最底层的红军战士是否能用自己的语言将其翻译为“保卫苏维埃”的具体画面？\n\n3. 历史自反：假如此役失败，你能否在报告中清晰指出——是物质计算错误，还是政治动员失能？\n\n有人会指责这种提法“把政治凌驾于军事之上”。我的回答是：红军之所以是红军，恰恰因为它从不假装政治中立。白军将军们同样有政治，只是他们羞于承认自己的政治是地主和资本家的政治罢了。\n\n我们可以引用列宁同志的一段话：“在最民主的资产阶级共和国中，‘中立’不过是奴役劳动者的形式之一。”\n\n最后，我必须坦率地记录一个数据：在1920年对弗兰格尔的进攻中，某步兵师因政治委员提前两天向士兵解释了“为什么要占领那座车站”，其冲击速度比相邻未做解释的师快了27分钟。这27分钟，就是意识形态的物质转化率。本书所言的“雷声”，归根结底，就是要用这种转化率去覆盖资产阶级军事学所谓“纯粹技术”的全部领空。\n\n若您读完此书后，只记得某个战术公式，那说明您只读懂了骨架。若您合上书本时，耳边响起的是千百万被剥削者要求归还土地与工厂的呼声——那才是“雷声”真正的频率。\n\n谨以此书，献给那些既会擦拭步枪、也会阅读《资本论》的红色指挥员。\n因为未来的战争，不是由将军赢得，而是由懂得辩证法的士兵赢得。"
 RUS_fr_military_reform.52.a:0 "革命战场的一声惊雷！"
