 RUS_east_asia_flavour.1.t:0 "东方红"
 RUS_east_asia_flavour.1.d:0 "“殖民地半殖民地的革命，第一步应当是推翻外国帝国主义的压迫，建立独立的民族国家；第二步才是在无产阶级政党领导下，走非资本主义发展道路。”\n\n面对如今世界革命的盛况，国内关于国际主义援助的讨论一波高过一波。其中，东亚革命的声音尤为引人注目。南京国民政府的胜利，使大多数同志对东方革命的未来更加充满信心。最近一期的《真理报》刊发评论文章指出：东亚殖民地半殖民地人民的觉醒，已不再局限于旧式的民族主义起义。一个拥有数万万人口的东方大国，正以自身的胜利证明——帝国主义在亚洲的链条，是可以被打破的。\n\n文章进一步论述，南京国民政府的新三民主义道路，连同其反帝立场与土地改革的初步推行，已使东亚革命的形势发生了根本变化。我国应当抓住这一历史窗口，在道义与物质上给予东方革命以更有力的支持。部分同志甚至提出，应尽快向南京派遣正式的军事顾问团，并提供必要的工业设备援助。\n\n不过，也有谨慎的声音提醒：东亚革命的道路不会一帆风顺。帝国主义不会甘心退出这片大陆，而民族解放的下一步——向社会主义发展道路的过渡——更将考验一切革命者的决心与智慧。"
 RUS_east_asia_flavour.1.a:0 "革命的中国万岁！"
 RUS_east_asia_flavour.1.b:0 "我还是对我们东方的布尔什维克朋友更感兴趣……"
 RUS_east_asia_flavour.1.b.tt:0 "想解锁更多关于中国革命的拓展内容？或许您可以试试“§R长夜孤星§!”！"
