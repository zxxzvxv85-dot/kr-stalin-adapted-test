l_simp_chinese:
  RUS_semyon_timoshenko_high_command_desc: "§Y生于：§!§L1895年2月16日；俄罗斯帝国、比萨拉比亚省奥尔曼§!\n§Y背景：§!§L铁木辛哥生于一户乌克兰农民家庭，是家中十七个孩子里最小的一个。自小在田野、集市与马背间长大，他在家乡学会了俄语、乌克兰语和摩尔多瓦语三种语言，能用三种乡音和不同的人谈天、争论与讲价，也早早埋下了善于与士兵打成一片的底子。\n\n第一次世界大战的炮火将他的少年时代拦腰截断。铁木辛哥应征入伍，因反应迅捷、对枪械有种近乎天赋的敏锐，被选入奥拉宁鲍姆的机枪学校接受系统训练，最终以军士长军衔毕业，成为西部方面军第四骑兵师的一员。在漫长的东线堑壕与沼泽间，他迅速从新兵蜕变为老兵，而最令他声名初显的战斗，是惨烈至极的奥索维茨要塞防御战。德军毒气如绿云般碾过阵地后，他满脸血污仍死死据守在机枪旁，同残存战友一道发起了那场被后世称为“死者冲锋”的绝望反击。战争结束时，他胸前已挂上三枚圣格奥尔基十字勋章，每一枚都浸透了硝烟与侥幸活下来的代价。然而在服役末期，因无法忍受一名军官当众毫无道理的羞辱，他愤然挥拳将其打倒，因此被捕。沙俄军队的军法森严如铁，他本难逃重惩，可二月革命的风暴骤然而至，他由此重获自由。\n\n俄国内战爆发后，铁木辛哥毫不犹豫地加入红军，奔赴南部方面军。在那段刀兵相向的炽烈岁月里，他结识了约瑟夫·朱加什维利与布琼尼等后来一众震动世界的布尔什维克指挥官，并于1919年正式加入俄共（布）。在保卫察里津的拉锯战中，他率骑兵侦察分队与弗兰格尔的白军反复缠斗，多次以寡敌众，硬生生拖住敌军的锋刃。尽管红军战士们击退了白军一次次浪潮般的进犯，但形势终究如山倾洪溃，在留下“一定会回来”的承诺后，他最终只能与大部队一同撤出那座几乎被血浸透的城市。\n\n但随后的流亡岁月，出人意料地替他推开了另一扇门。他得到了红军卓越统帅伏龙芝元帅的亲身教导，并进入伏龙芝在巴黎亲手开创的雷雨军事学院，先为学员，后留任助教。铁木辛哥系统研习大纵深作战思想，又深度参与了法兰西公社的军队演习与编制改革实操——在演习场扑面而来的尘土和履带轰鸣里，他一遍遍验证、修正、重铸着自己的战争认知。战火与墨水共同浇灌下，昔日那个凭悍勇与本能冲锋的骑兵，已然蜕变为一名目光沉静、胸有韬略的合格军事改革家。§!"
