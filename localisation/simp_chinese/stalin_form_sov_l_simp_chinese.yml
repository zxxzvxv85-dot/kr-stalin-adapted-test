  stalin_form_sov.17.t: "《钢铁是怎样炼成的》"
  stalin_form_sov.17.desc: "乌克兰穷苦工人家出身的布尔什维克、俄国共产主义作家尼古拉·阿列克谢耶维奇·奥斯特洛夫斯基的《钢铁是怎样炼成的》一经发表，就被认为是国际社会主义的经典之作，本书以作者自身为原型，加以部分艺术加工成分，较为真实地展现了1917年革命开始至1921年革命失败，再到社会主义俄罗斯的重建后的历史片段，客观地再现了当时人民的思想状况与生活，广受推崇与喜爱，不仅仅是在俄罗斯，在国际上也引起了轩然大波。书中 “人最宝贵的是生命，生命对于人只有一次。人的一生应该这样度过：当回忆往事的时候，他不会因为虚度年华而悔恨，也不会因为碌碌无为而羞愧；在临死的时候，他能够说：“我的生命和全部的精力，都全部献给了世界上最壮丽的事业——为人类的解放事业而斗争。”更是鼓舞了世界各地的革命社会主义组织和受压迫的人民。\n\n尽管1921年跟随斯维尔德洛夫、斯大林、伏龙芝等共产主义者经阿格尔汉斯克前往法兰西公社流亡，他仍然是共产主义、马克思列宁主义的捍卫者，并且与国际上无论左右翼对于共产主义和马克思列宁主义进行极权主义污蔑进行强而有力的斗争，尽管没有在书中直接写出，不过还是能从字里行间中向所有人透露一条信息——共产党及共产主义绝非像那些人污蔑的那样同极端民族主义分子那样“极权”。\n\n奥斯特洛夫斯基指出，世人如此污蔑共产党和共产主义只是因为没有先进思想引领的人民被形形色色的反动势力迷惑并误导了：“只有一个政党是不屈不挠同所有压迫者作斗争的革命党，那就是布尔什维克党”。而对于回击那些反革命、污蔑者和修正主义，奥斯特洛夫斯基只是针对他们的心理在书的封皮背后引用了约瑟夫·斯大林的话：不通过残酷的阶级斗争能不能铲除资本主义？不能。依靠资本家长入社会主义的理论，只能培植阶级并使阶级永久存在。\n\n针对那些指责先锋队式的共产主义运动是非理性、具有破坏性的并认为共产党没有兴趣、没有能力、没有意愿去解决社会问题，且指责所谓“红色恐怖”的结局是不合理且没有合理前提的的那些人，奥斯特洛夫斯基引用了列宁著作中的几句话：“推翻旧制度只是革命的开始，真正的革命在于建设。”“在无产阶级夺取政权后，无产阶级同资产阶级的阶级斗争并没有终止，相反地，这种斗争会变得更广泛、更尖锐和更残酷。”\n\n奥斯特洛夫斯基的著作引起了众多共产主义、社会主义革命家、活动家、政治家的关注，且被视作共产党摆脱极权主义的窗口和世人重新审视极权主义的定义的开端。"
  stalin_form_sov.17.a: "不要让反动势力蒙蔽了人民的双眼！"

  stalin_form_sov.19.t: "十月革命纪念日"
  stalin_form_sov.19.desc: "1921年1月28日，在内外交困下，最后一支成建制的红军部队停止了抵抗，支离破碎的俄国革命最终走向了失败。\n\n如今，随着党中央对“红十月”的重新定性与广泛的群众动员，人民已经识破了反动派的妄语——“十月”的真相也被重新发掘，这场失败被认为是一场勇敢者的颂歌——面对着全世界反动派的围剿、面对着潜藏叛徒的暗箭、面对着种种不利的现实条件，布尔什维克们没有屈膝投降，而是选择为真理与公义流尽最后一滴血。\n\n于是，又一场游行自发的组织了起来:从列宁格勒开始，从“阿芙乐尔”开始，一望无际的人潮涌动着，他们挥舞着红旗，高声合唱着《国际歌》，为牺牲的勇士们哀悼。\n\n在他们之中，有的是车间的普通工人，有的是集体农庄的贫苦农民，他们的生活各不相同，但他们有一个共同的共产主义理想。\n\n一切正如伏龙芝元帅在内战中所记下的:“无数人死在冲锋的路上，然后我们越过他们的尸体继续前进。”\n\n“我们共产党人是具有特种性格的人，我们是由特殊材料制成的……如有必要，我们会毫无顾虑地为革命献身......”"
  stalin_form_sov.19.a: "“因为只要还有最后一个共产主义者，我们的理想就永远不会消亡”"

  stalin_form_sov.21.t: "最美好的前途"
  stalin_form_sov.21.desc: "人类追求解放的历史，究竟可以追溯到多远？\n是西方的斯巴达克斯，还是东方的陈胜、吴广？\n\n史学家或许各有答案，但有一件事始终未曾改变：人类追求解放的脚步，从未停息。\n\n1917年，伟大的列宁带领人民反抗剥削与压迫，在巴黎公社之后，再一次点燃了社会主义的火炬。尽管革命曾在历史的重压下遭遇挫折，但解放的理想从未熄灭。后来的岁月也一再证明列宁的真理：\n\n“死亡不属于工人阶级！”\n\n而如今，从波罗的海到东京湾，各族人民在苏维埃的旗帜下团结一心。腐朽堕落的旧世界，正在人民的怒火中燃烧殆尽；光芒万丈的明日之国，已经向全人类敞开大门。\n\n我们可以预见：\n\n自由而民主的工农国家，将创造任何资本主义列强都无法企及的伟大成就；\n科学与诗篇，将属于每一个人；\n面包与玫瑰，将不再被标价出售。\n\n苏维埃将带领全人类走出“必然王国”的囚笼，迈向真正自由的未来。"
  stalin_form_sov.21.a: "“就从零点起步，向最美好的前途。”"
  stalin_form_sov.21.a_tt: "§Y就从零点起步，哪怕是漫长的路。\n光荣而伟大的解放者，向您致敬！§!"
  stalin_form_sov.22.t: "《苏维埃社会主义共和国联盟成立宣言》"
  stalin_form_sov.22.desc: "自从苏维埃共和国成立以来，世界各国已经分裂为两个阵营：资本主义阵营和社会主义阵营。\n\n在那里，在资本主义阵营中，是民族仇恨和不平等、殖民奴役和沙文主义、民族压迫和迫害、帝国主义暴行和战争。\n\n在这里，在社会主义阵营中，是相互信任与和平、民族自由与平等、各民族的和平共处和兄弟合作。\n\n资本主义世界几十年来企图把各民族的自由发展同人剥削人的制度结合起来，以解决民族问题，但这些尝试都归于徒劳。相反，民族矛盾的纠结越来越深，已经威胁到资本主义本身的存在。资产阶级已经无力建立各民族之间的合作。\n\n只有在苏维埃阵营中，只有在团结了大多数居民的无产阶级专政条件下，才有可能从根本上消灭民族压迫，造成相互信任的环境，并奠定各民族兄弟合作的基础。也只有由于这些条件，苏维埃共和国才能击退全世界帝国主义者从内部和外部发动的进攻。\n\n也只有由于这些条件，它们才能顺利结束国内战争，保障自己的存在，并开始和平的经济建设。\n\n但是，战争年代并没有毫无痕迹地过去。荒废的田野、停顿的工厂、被破坏的生产力以及被战争遗留下来的枯竭的经济资源，使各个共和国各自单独进行经济建设的努力显得不够。各共和国分立存在时，国民经济的恢复是不可能的。\n\n另一方面，国际形势的不稳定和新的进攻危险，使各苏维埃共和国面对资本主义包围时，必须建立统一战线。\n\n最后，苏维埃政权本身的结构，按其阶级本质来说是国际主义的，它推动各苏维埃共和国的劳动群众走向联合为一个社会主义大家庭的道路。\n\n所有这些情况，都迫切要求各苏维埃共和国联合为一个联盟国家，使其能够保障外部安全、内部经济繁荣以及各民族自由发展的权利。\n\n各苏维埃共和国人民的意志，最近在各自苏维埃代表大会上聚集起来，并一致通过成立“苏维埃社会主义共和国联盟”的决定，便是可靠的保证：这个联盟是平等民族的自愿联合；每一个共和国都被保障享有自由退出联盟的权利；联盟向一切社会主义苏维埃共和国开放，无论它们是已经存在的，还是将来可能产生的；这个新的联盟国家，是1917年十月以来所奠定的各民族和平共处和兄弟合作原则的应有完成；它将成为反对世界资本主义的可靠堡垒，并成为把各国劳动者联合为世界社会主义苏维埃共和国道路上的新的决定性一步。\n\n我们向全世界声明这一切，并庄严宣告苏维埃政权原则的不可动摇性。这些原则已经在授权我们代表的各社会主义苏维埃共和国宪法中得到体现。我们，这些共和国的代表，根据授予我们的权限，决定签署关于成立“苏维埃社会主义共和国联盟”的条约。"
  stalin_form_sov.22.a: "最崇高的理想！"

  stalin_form_sov.24.t: "社会革命党与布尔什维克"
  stalin_form_sov.24.desc: "尽管全俄劳联取得了议会中的胜利，但在实际的执政上，它依然需要倚仗作为盟友的社会革命党与流亡归来的布尔什维克。\n\n表面的合作之下，两党的暗斗从未停歇。财政部、土地委员会、军事署、地方苏维埃人事科——每一个职位空缺都可能成为新的战场。\n\n社会革命党凭借其在农村地区的精耕细作，掌控着绝大多数乡苏维埃与地方民兵武装。从西俄罗斯到西伯利亚，从粮食征收到春季播种，几乎每一根农业神经末梢都攥在他们手里。在二次革命之初，我们正是通过其在农村的影响才避免了内战——这种力量是全俄劳联无法忽视的筹码。\n\n布尔什维克则暂时蛰居于城市与地下。他们在工厂车间、铁路调车场和港口码头拥有坚实的关系网络，赤卫队老兵潜藏在民兵序列中，秘密党员则悄悄占据了电报局和银行。就目前而言，其成员数量远不及社革党，但组织纪律性极强；并且在吸取了第一次内战的教训后，布尔什维克更为团结了。\n\n会议桌上一团和气，会议桌下拆台使绊。双方都在等待一个机会，将对方的势力从政府中连根拔起。而作为协调者的全俄劳联，只能在两派之间小心翼翼地维持平衡，以保证革命按计划进行。"
  stalin_form_sov.24.a: "我们将小心行事。"
  stalin_form_sov.25.t: "布尔什维克离开家"
  stalin_form_sov.25.desc: "罗斯托夫\n\n提到家，阿廖沙总好像有一万句话要讲。在周末的互助会里，他总是坐得最靠前的那一个，脊背挺得笔直，两只粗糙的大手规规矩矩地搁在膝盖上——可只要有人起了个话头，他整个人就像解了冻的河，话一句赶着一句往外淌，拦都拦不住。\n\n战友们把他的故事听了个七七八八，渐渐地，也大约拼出了阿廖沙的前半生。\n\n1917年，阿廖沙的父亲被白匪抓走，从此了无音讯。母亲在悲愤中一病不起，身子骨说垮就垮了。那一年阿廖沙刚满十八岁，下面还有个才满九岁的妹妹伊莉娅。少年人还没来得及想明白“革命”“前途”这些大字眼究竟是什么意思，就被生活一巴掌推进了成年——他得扛起这个摇摇欲坠的家。\n\n1921年，白军在俄罗斯确立了统治。社革党和宪民盟拼出来了个所谓“民主联盟”。他们换了个招牌，却没有给阿廖沙带来任何好运。他在郊外的一家螺丝厂做工，车床前的铁屑飞溅如雨，他把板手都抡得冒了烟，可挣到手的那几张票子，只够一家人勉强糊口。母亲吃药的钱，还是伊莉娅替人洗衣裳、一戈比一戈比攒出来的。\n\n日子就这么不咸不淡地熬着，直到1936年的夏天。一个相熟的工头连哄带骗，把失业的阿廖沙塞进了萨文科夫那个叫“日出计划”的工程。名字倒是响亮得很——日出。可阿廖沙后来跟人说起这段的时候，只会苦笑着摇头：那个鬼地方……在暗无天日的工地上，他曾经被逼着连续干了二十七个钟头，最后一头栽倒在冻得硬邦邦的泥地上。要不是边上有个老工人死活把他拖到棚子里灌了半碗热汤，他怕是再也醒不过来了。\n\n幸运的是，布尔什维克回来了。厂里的工头换了人，工时也有了定数，连车间顶上的灯都多挂了两盏。阿廖沙的日子总算亮堂了些，手里的票子也渐渐能攒下几张了。可母亲的病根子落得深，药费像个填不满的窟窿。他把账翻来覆去算了好几宿，最后把心一横——当兵去。红军的津贴比工厂高出一截，省吃俭用寄回家，够母亲抓药。就冲着这个，他报了名。\n\n出发那天，火车站的月台上挤满了送行的人，空气里弥漫着煤烟、泪水和手风琴的调子。伊莉娅——那个他从小背在背上、如今已经出落成大姑娘的丫头——踮着脚站在人群里，拼命朝他挥手。\n\n阿廖沙半个身子探出车窗，张了张嘴，好像有一万句话堵在嗓子眼里。\n\n车轮碾过铁轨发出刺耳的摩擦声，所有的话都被那声巨响吞了个干净。他最终只是冲着妹妹大声喊道："
  stalin_form_sov.25.a: "“再见啦！小伊莉娅！照顾好妈妈！”"
  stalin_form_sov.26.t: "第一届革命军事竞赛"
  stalin_form_sov.26.desc: "喀山\n\n说实话，列昂并不喜欢跟人说话。\n\n这倒不是说他脾气坏，或者瞧不起谁。他就是单纯地觉得，张嘴是件很累的事情。别人跟他搭话，他倒也会回应，但通常不超过三个字——“嗯。”“好。”“知道了。”——再多，就好像有什么东西卡在喉咙里，怎么都吐不出来。在军营这么个吃饭睡觉都有人跟你挨着的地方，他这种性格当然算不上讨喜，所以入伍大半年了，他也确实没交到什么朋友。\n\n不过他有别的东西。\n\n他懂机械。不是那种翻了两本书就敢说“懂”的懂，是真懂。一台发动机在他耳朵里不是一个轰隆隆的铁块，而是几十上百个零件在同时说话，哪一个的声响不对了，哪一个的转速慢了半拍，他闭着眼睛都能听出来。连长有一次半开玩笑地说他：“列昂，你要是跟人说话有跟机器说话一半上心，我这连长让给你当都行。”列昂想了想，觉得这话没法接，于是只说了两个字：“不敢。”\n\n所以当全军第一届革命军事竞赛的通知下来，连里的技术标兵名额落到他头上时，没有一个人表示意外。\n\n举办地是喀山。消息传来的时候，列昂正在车库里钻在一辆半履带车的底盘下面，满手机油地拧一颗螺丝。指导员把通知念了一遍，等着他说点什么，结果他只从车底下伸出一只手，比了个大拇指，就又缩回去了。\n\n指导员站在那儿哭笑不得：“你倒是出来跟我说句话啊。”\n\n车底下闷闷地传来一句：“收拾东西。”\n\n指导员摇摇头，走了。\n\n从驻地去喀山的路不短。军用卡车在坑坑洼洼的土路上颠了整整一天，车斗里坐了十二个参赛的兵，都是各连选上来的尖子。有人起头唱了个歌，唱到一半发现调子起高了，全车人笑成一团。列昂坐在最靠里的角落里，背靠着车挡板，膝盖上摊着一本翻旧了的《内燃机构造原理》。有人递给他一壶水，他接过来喝了一口，说了声“谢谢”，就又低头看书去了。\n\n旁边的兵互相看了一眼，交换了一个“这人就这样”的眼神。\n\n喀山到底是喀山。跟驻地的营房和土操场不一样，这里是伏尔加河边上的一座老城，街面上铺着石头，有些楼房的墙上还留着当年内战时期留下的弹孔，但已经有电车在跑了，叮叮当当的铃声响了一路。竞赛场地设在城郊的一座老军营里，各部队的人乌泱泱聚了一大片，到处都是不同颜色的领章和袖标，热闹得像过年。\n\n开幕式那天，来了一位总部的首长，站在台子上讲了话。讲的什么列昂没记住多少，只记得一句：“革命的军队，不只要勇敢，还要有本事。”他站在队列里，把这句话在心里翻来覆去嚼了好几遍，觉得有点道理。\n\n比赛分了好几个项目。射击、越野、战术动作、无线电操作，每一项都有人欢呼，有人叹气。列昂报的是机械维修，这个项目不热闹，连看的人都少。考场设在操场最边上的一个角落里，一张长条桌上摆了一排拆散了的步枪，故意弄出了七八种故障。考官是个戴着圆框眼镜的军械官，模样像个教书先生，一开口倒是干脆利落：“比赛一个小时，开始！”\n\n列昂在桌前坐下了。\n\n外头的操场上不时爆发出阵阵喝彩声——大概是射击那边有人打了满环，或者越野那边有人冲了线。远处伏尔加河上的汽笛声隐隐约约地飘过来，混在九月的风里，让人莫名地有点恍惚。但列昂统统没听见。\n\n他拿起第一把枪的时候，外面的声音就全关了。\n\n他的手不抖。这是他的本事——拧了好几年螺丝的手，稳得像一台校准过的机床。每一根手指都准确地知道该往哪儿放，该用多大的力。他把步枪分解开来，动作不快，但每一个步骤都干净利落，卸机匣、退弹簧、抽出撞针，没有一丝多余的动作。他像一个沉默的乐队指挥，手指划过的地方，金属零件自动排列成行，在桌面上摊开一幅精密的地图。\n\n圆框眼镜的考官一开始还站在旁边看，看着看着就不动了。他摘下眼镜擦了一下，又戴上，然后从兜里掏出一个笔记本，在纸上记了些什么。\n\n第三十八分钟，列昂把最后一把枪重新组装好，拉开枪栓，扣了一下扳机。击针发出一声干脆的脆响。他把枪规规矩矩地放回桌上，然后站起来，把手在裤子上蹭了蹭油，才发现考官正盯着他看。\n\n“你是哪个部队的？”考官问。\n\n列昂报了番号。\n\n考官把眼镜往上推了推，笑了一下。那是一个懂行的人才会有的笑，里面带着点意外的惊喜。“你以前是做什么的？”\n\n“乌拉尔机械厂。修过三年车床。”\n\n考官点点头，好像终于想通了什么。他在本子上又写了一笔，然后拍了拍列昂的肩膀：“行了，同志。回头成绩会公布的。”\n\n结果公布那天，列昂拿了个第一。\n\n他不是那种拿到第一会笑出来的人。站在领奖台上的时候，他脸上的表情跟平时修车差不多，甚至还要更严肃一点，像是不知道两只手该往哪儿放。底下的掌声倒是很响，尤其是他们连的那几个兵，巴掌都拍红了，有个嗓门大的还喊了一嗓子“好样的列昂！”，惹得周围一片哄笑。\n\n晚上，参赛的人围在营房外面的空地上吃饭。有人弹起了吉他，有人用饭盒盖敲着拍子，火光照得所有人的脸都忽明忽暗的。有人拉了列昂一把，让他坐到圈子中间去。他犹豫了一下，还是坐过去了。\n\n那个弹吉他的兵凑过来问他：“哎，冠军同志，你就没有什么想说的？”\n\n列昂沉默了一会儿。篝火烧得噼啪响，火星子直往天上窜。远处的伏尔加河在夜色里安静地流着，像一条黑色的缎子。他低头看了看自己那双沾满了机油和铁锈的手——这双手拧了十几年的螺丝，修过车床、拖拉机、步枪，养活了自己，也养活了一台台沉默的、轰鸣的机器。他从来没觉得这有什么了不起的。\n\n但此刻，他坐在火光的正中间，周围是一张张被映得通红的、等着他说话的脸。\n\n他忽然觉得，张嘴这件事，好像也没有那么难。"
  stalin_form_sov.26.a: "“我叫列昂，”他说，“修车的。”"
  stalin_form_sov.24.a_tt: "§R两党积怨已久。倘若革命形势趋于极端，谁能保证他们不会反客为主？§!"

  russia_socialist_events.30.t: "流亡者归国"
  russia_socialist_events.30.d: "《1923年国家保卫法案》曾将一切“共产主义”活动定为非法。玛丽亚·斯皮里多诺娃政府上台后，首先便推翻了所有依据该法案作出的政治犯罪判例。曾经，这条法律如同一柄悬顶之剑——数以千计的社会主义者遭到迫害、锒铛入狱，许多人逃亡西方社会主义国家，加入了那里的布尔什维克流亡群体。如今，大多数人正搭乘“红船”归国，同志们从巴黎、伦敦踏上了返乡之路。\n\n他们在彼得格勒受到热烈欢迎，并宣布与长期在西伯利亚活动的“整合运动”党组织合并。然而，分歧的种子早已埋下。流亡者与国内社会主义者截然不同的经历，正激烈地碰撞。这些流亡者如今更像一个军事政治集团，自视为列宁的正统继承人，对当前俄罗斯的政治局势深感失望。"
  russia_socialist_events.30.a: "欢迎回家？"

  russia_socialist_events.32.t: "军官团里的布尔什维克"
  russia_socialist_events.32.d: "由于大批白军军官的自愿或非自愿退役，经验丰富的指挥官已是供不应求。基层连排长缺口尤甚，新组建的部队往往在战术演练和实际调度中暴露出严重的指挥断层。\n\n为此，伏龙芝联名其他流亡归来的红军军官向临时政府提交了一份“军事肃反与改革提案”。提案的核心思路是双管齐下：一方面继续甄别和清除旧军队中不可靠的残余势力，另一方面则大幅加快军事院校的速成培训，并从工农骨干和归国军官中选拔可塑之才填补指挥岗位。\n\n这份提案涉及面极广——从现役军官的重新审查，到部队编制调整，再到新作战条令的编写与推广，事务千头万绪。伏龙芝虽身兼战略决策之职，但无力逐一督办每项改革细节。因此在提案的附加说明中，他特意推荐了自己的得意门生，谢苗·铁木辛哥，负责协调和执行改革中的日常组织工作，以便将这份文件尽快转化为军队的实际战斗力。"
  russia_socialist_events.32.c: "事实证明，他们的确是有能力的革命者。"

  russia_socialist_events.101.t: "喀琅施塔得之围"
  russia_socialist_events.101.d: "红军部队已推进至彼得格勒城郊，并勒令高尔察克率部投降。然而，这位白军元帅并未在城内露面，依旧留在停泊于城外的旗舰“阿列克谢耶夫将军”号上。波罗的海舰队态度暧昧，蠢蠢欲动，整座城市陷入一种诡异的僵持局面。与此同时，喀琅施塔得要塞和波罗的海舰队对各方通讯均未予实质回应，仅以“收悉”二字敷衍了事。\n\n城市目前仍处于人民控制之下——大部分彼得格勒驻军正属于首批倒戈的部队，他们随即开始逮捕城内不受欢迎的“斯沃博达”分子。\n\n这位海军老帅无疑对社会主义者再次掌权感到出离愤怒，但这一次，他似乎孤立无援。不过，他身边仍有一批忠心的海员和海军步兵营，舰上炮口也依然瞄准着俄罗斯的心脏地带。彼得格勒外的红军内部爆发激烈争论：高尔察克究竟在谋划什么？是组织反革命反扑，还是早已众叛亲离、只剩这支舰队？\n\n最终，政府委派彼得格勒市委员登上“阿列克谢耶夫将军”号，与高尔察克谈判，提出以移交舰队换取体面退休的条件。在舰上，昔日“全俄罗斯最高执政”显得灰头土脸。他只是淡淡地说，或许自己已与俄罗斯渐行渐远，再也看不懂这个国家了。先前对政变的极度担忧最终被证明是多余的——元帅更多的是失望和疲惫。经一番好言劝说，他同意请辞，并表示希望继续担任北极研究委员会主席。"
  russia_socialist_events.101.a: "一场灾难就此避免。"

  russia_socialist_events.332.t: "人民农业部"
  russia_socialist_events.332.a: "农业需要激进改革，让杜布罗夫斯基上。"
  russia_socialist_events.332.b: "马约罗夫和社革再合适不过了。"
  russia_socialist_events.332.c: "乌斯季诺夫的观点可谓天才。"

  russia_news_events.8.t: "革命风暴席卷俄罗斯"
  russia_news_events.8.d: "鲍里斯·萨文科夫就此陨落。由于总统的所作所为让民众与军方愈发愤怒，红场爆发了大规模抗议活动，伴随着响彻首都的枪声，萨文科夫被一名社会革命党人射杀。\n\n乱局之中，曾遭取缔的社会主义政党们揭竿而起，各地相继成立了各自的人民委员会与工农苏维埃。在赤卫队的广泛动员下，临时政府高歌猛进，彼得格勒和南俄罗斯的白军残余势力纷纷作鸟兽散。\n\n俄罗斯似乎仅在一夜之间便成为了社会主义国家，这对欧洲乃至于整个世界而言都产生了深远的影响。"
  russia_news_events.8.c: "世界革命已近在咫尺！"


  stalin_form_sov.10002.t: "德国求和！"
  stalin_form_sov.10002.desc: "我们的战争进程要远比预想的要顺利，我们成功光复了上次不平等条约下所损失的领土。近日，德意志帝国因为接连不断的战争已经不堪重负，向我们抛来了和平的橄榄枝，他们声称愿意恢复二战前的欧洲版图，并且不再干涉中亚事务。\n\n我们应该如何回应？"
  stalin_form_sov.10002.a: "打够了，翻篇吧"
  stalin_form_sov.10002.a_tt: "§Y我们将能够恢复二战前的欧洲版图！§!"
  stalin_form_sov.10002.b: "去你媽的！"

  RUS_dictatorship_proletariat: "全民国家"
  RUS_dictatorship_proletariat_desc: "我国现在的国家，在本质上已经不同于资产阶级国家的国家了……旧国家的定义已不再适用于我国的现状，他应该作为全体人民的统治工具而继续工作。"
  RUS_charter_of_russian_totalism: "极权主义论战"
  RUS_charter_of_russian_totalism_desc: "受西方的革命思潮影响，国内掀起了一阵关于极权主义的讨论，而格龙斯基下场设立的西方极权主义研究协会，正使这场有关于意识形态的大辩论变得更加学术化和政治化……"
  RUS_invite_sverdlov: "回归列宁主义"
  RUS_war_on_landowners: "加速结束农业过渡期"
  RUS_war_on_landowners_desc: "农民这一过渡阶级是必然在未来消亡的，而我们要做的则是加速这一过程，促使向农业工人的迈进，确保旧的小资产阶级思想再无立地生根的阶级基础。"
  RUS_red_intelligentsia: "革命文化阵地战"
  RUS_red_intelligentsia_desc: "“旧世界的消亡不是一下子完成的，而是经历着一个痛苦的和长期的过程。”为了避免旧资产阶级思想的侵蚀与投机分子的影响，我们必须将革命与民主的思想植入每一名公民的心中。"
  RUS_technocratic_syndicalism: "为民主奠基"
  RUS_technocratic_syndicalism_desc: "终于！列宁同志所设想的无产阶级民主已在如今的俄罗斯蓄势待发，一个“比任何资产阶级民主更民主千百倍的民主”将确保我们向共产主义的过渡！"
  RUS_preserve_revolution_within: "红色舵手凯旋"
  RUS_preserve_revolution_within_desc: "在一系列的政治运作下，季诺维也夫业已大权在握，他所构想的俄罗斯式的极权主义与无产阶级专政国家将§R变成现实§!。"
  RUS_maximalist_land_reform_success_focus_requirement: "已完成§Y土地改革§!"

  rus_stalin_zinovyev_rework.continue: "继续读下去……"
  rus_stalin_zinovyev_rework.1.t: "西方极权主义研究协会"
  rus_stalin_zinovyev_rework.1.d: "随着革命在俄罗斯站稳脚跟，资产阶级审查制度被废除，西方思想开始在民众中传播，其中就包括莫斯利、瓦卢瓦和墨索里尼等人所定义的极权主义。尽管这些思想遭到了全俄劳联全体领导人的公开谴责，却仍在试图综合这些学说的各路知识分子中产生了一定影响。\n\n伊万·格龙斯基发起成立的“西方极权主义研究协会”便是其中之一，协会汇聚了来自全俄劳联左派、布尔什维克以及社会革命党最高纲领派的知识分子。在会议期间，他们明确否决了“俄罗斯极权主义”的提法，主张对西方极权主义展开全面批判。\n\n布尔什维克是协会中的主要参与力量。他们指出，所谓极权主义者将国家机器美化为“人类发展的终极阶段”，将抛弃民主粉饰为“献出全力”，是对马克思主义最无耻的背叛。他们还援引了列宁同志的论述：“无产阶级专政……将第一次提供人民享受的、大多数人享受的民主……只有共产主义才能提供真正完全的民主，而民主愈完全，它也就愈迅速地……自行消亡。”\n\n在此基础上，协会进一步阐明：所谓极权主义，不过是将国家机器永久化和神圣化的遮羞布。它所许诺的“社会主义”，恰恰是以剥夺广大劳动者的民主权利为前提的阶级压迫体系。协会一致认为，真正的社会主义只能建立在打碎旧的国家机器、以无产阶级民主取而代之的革命实践之上。对西方极权主义及其在俄罗斯国内的一切变种，协会的态度是明确而坚决的——予以彻底的揭露与清算。"
  rus_stalin_zinovyev_rework.1.a: "这话说的痛切！"
  rus_stalin_zinovyev_rework.2.t: "俄式极权主义"
  rus_stalin_zinovyev_rework.2.d: "面对来自各方的指责，季诺维耶夫发表了一篇宣言，题为《俄式极权主义》。在宣言中，他毫不掩饰对西方极权主义的蔑视——但这蔑视更多地出于对后者过分痴迷形式民主的反感。他宣称，无产阶级专政是社会主义国家的必要条件，任何以“民主”为名削弱这一专政的企图，本质上都是向资产阶级的软弱投降。\n\n季诺维耶夫进而论述道，西方极权主义者把国家奉为永恒不变的“终极阶段”，而俄式极权主义则将国家视为无产阶级用以镇压剥削阶级、进而为国家的最终消亡准备条件的过渡工具。在他看来，莫斯利之流拥抱“极权”之名，不过是对国家机器的偶像崇拜；而俄国革命者所坚持的，则是马克思主义关于国家必然消亡的基本原理。他写道：“我们与他们之间的区别不在于要不要国家，而在于要什么样的国家——是永久化的镇压机器，还是正在自行走向消亡的无产阶级半国家。”"
  rus_stalin_zinovyev_rework.3.d: "宣言最后呼吁，不应因为西方极权主义对“极权”一词的滥用而放弃对无产阶级专政的捍卫。真正的分野不在民主与专政的抽象对立之间，而在无产阶级专政与资产阶级专政的阶级对立之间。\n\n然而，布尔什维克方面对这位已退党的前领导人的回应毫不留情。他们尖锐地指出，季诺维耶夫对“民主形式”的蔑视，恰恰暴露了他对马克思主义国家学说的根本歪曲。无产阶级专政从来不是对民主的否定，而是民主的质的飞跃——对多数人实行最广泛的民主，对少数剥削者实行最坚决的专政。季诺维耶夫闭口不谈无产阶级民主，只抽象地挥舞“专政”的大旗，实质上抹杀了无产阶级国家与资产阶级国家在民主问题上的本质区别。正如列宁所教导的：\n\n“无产阶级专政……是被剥削者先锋队组织的民主，即成为统治阶级的无产阶级的民主，而不是什么全体人民的民主。无产阶级专政，即向共产主义过渡的时期，将第一次提供人民享受的、大多数人享受的民主，同时对少数人即剥削者实行必要的镇压。”\n\n布尔什维克认为，季诺维耶夫的根本错误，在于他把“专政”与“民主”对立起来，从而在逻辑上滑向了与西方极权主义者同样的泥淖——他们都认为，要专政就必然牺牲民主。而马克思主义的真理恰恰相反：无产阶级民主离不开无产阶级专政来保障，无产阶级专政也离不开无产阶级民主来赋形。一个背离了党的人，一个脱离了无产阶级有组织的先锋队伍的人，或许仍能背诵革命的词句，却早已无法理解革命的真谛。"
  rus_stalin_zinovyev_rework.3.a: "让加米涅夫把他看好了！"
  rus_stalin_zinovyev_rework.10.t: "无产阶级专政研究会"
  rus_stalin_zinovyev_rework.10.d: "在《俄式极权主义》宣言发表后不久，季诺维耶夫身边逐渐聚集起一个小团体，他们自称“无产阶级专政研究会”，外界则直呼其为“季诺维耶夫派”。核心成员包括前国际机关报的几位撰稿人、彼得格勒大学少数追随他的理论工作者，以及一些在社会革命党左派与布尔什维克之间摇摆不定的知识分子。他们在季诺维耶夫的寓所定期集会，讨论无产阶级专政的理论基础、专政国家的条件，以及——用他们自己的话说——“被形式民主毒害的欧洲社会主义”。\n\n该团体很快发表了一份公开声明。在声明中，季诺维耶夫断然拒绝了外界强加给他们的“极权主义”标签。他写道：\n\n“把我们称为极权主义者，要么是出于理论上的无知，要么是一种蓄意的政治诽谤。极权主义——无论是伯明翰那伙人还是米兰的那位‘领袖’——其本质是将国家绝对化、永恒化，是把国家机器置于阶级之上。而我们所主张的，恰恰相反：是阶级对国家的支配，是无产阶级借助国家机器这一过渡形式走向一切国家权力的最终消亡。谁若分不清‘为了消灭国家而暂时强化国家’与‘把国家当作终极目的来崇拜’之间的区别，谁就不配谈论马克思主义。”\n\n声明还强调，该团体并不谋求另立新党，也无意与全俄劳联对抗——他们只是要求在无产阶级专政的理论讨论中占有一席之地。"
  rus_stalin_zinovyev_rework.10.a: "“格里戈里，你悠着点。”"
  rus_stalin_zinovyev_rework.11.t: "关于极权主义问题的决议"
  rus_stalin_zinovyev_rework.11.d: "在全俄劳联代表大会上，“极权主义”问题被正式列入议程。大会围绕伯明翰宣言以来的西方极权主义思潮、季诺维耶夫的《俄式极权主义》宣言及其“无产阶级专政研究会”的活动，展开了激烈辩论。最终，两项对立的决议草案被提交大会，等待着代表们最后的抉择：\n\n第一个方向：团结与包容\n\n这份草案认为，季诺维耶夫对西方极权主义的批判在方向上与全俄劳联一致。他所主张的“无产阶级专政是过渡工具而非终极目的”等观点，与马克思主义基本原理并无根本冲突。草案提议，在明确谴责西方极权主义的同时，有限度地接纳季诺维耶夫派的合理成分，以团结一切反帝国主义力量。其核心措辞为：季诺维耶夫同志虽在组织上和主流纲领有所偏差，但其理论工作在革命斗争的大前提下，不应被简单等同于敌人。\n\n第二个方向：划清一切界限\n\n这份草案则主张根本不存在妥协空间。季诺维耶夫的真正问题不在于批判西方极权主义，而在于他对民主的蔑视与伯明翰那伙人如出一辙。他将“专政”与“民主”抽象对立，闭口不谈无产阶级民主，实质上抹杀了无产阶级国家与资产阶级国家的本质区别。正如列宁同志所教导的，无产阶级专政“将第一次提供人民享受的、大多数人享受的民主”。草案坚持，无论西方极权主义还是披着“俄式”外衣的变种，均是对马克思主义国家学说的背叛，全俄劳联旗帜之下不应对其有任何理论上的宽容。"
  rus_stalin_zinovyev_rework.11.a: "部分采纳季诺维耶夫的观点以维持团结。"
  rus_stalin_zinovyev_rework.11.b: "我们不应对路线的偏离有所宽容。"
  rus_stalin_zinovyev_rework.4.t: "“农业工厂”试点区"
  rus_stalin_zinovyev_rework.4.d: "随着土地改革与机械化的全面铺开，最高纲领派和布尔什维克们终于得以着手推进一项更为深远的议程——在制度层面“消灭农民阶级”，完成向农业工人的历史性过渡。\n\n鄂木斯克的“曙光”国营农业工厂，便是这项计划的第一个试点。它以国家工人的身份、固定月薪和完善的保障体系作为号召，邀请社会上熟练的农业工作者参与统一生产。\n\n结果远超所有人的预期。\n\n原定400人的编制，在报名截止前收到了逾1200份申请书。赶来的人群中，有参加过拖拉机手速成班的年轻机师，有胸前佩戴地方劳动勋章的先进生产者，而更多的，是那些在集体农庄的土地上第一次吃饱饭的普通庄员。\n\n如果说先进生产者们看重的是为国献身与未来发展，那么这些普通庄员们所怀揣的，则是一种更为朴素的情感——信任。他们相信“穆罗梅茨”口中那个光明的未来，也愿意为之献上自己全部的勤劳与汗水。\n\n此刻，第一批志愿者已坐上驶离故乡的火车。他们正前往鄂木斯克——那里，将是这场伟大试验的起点。"
  rus_stalin_zinovyev_rework.4.a: "而他们，将成为这片冻土上第一批农业工人。"
  rus_stalin_zinovyev_rework.5.t: "农奴，农民，农工"
  rus_stalin_zinovyev_rework.5.d: "新西伯利亚•“土地与自由”集体农庄\n\n老瓦列里的前半生，像西伯利亚冻土上一条笔直而又单调的辙印，没有岔路，也没有尽头。\n\n他出生在农奴的窝棚里，从能扶稳犁把的那天起，就把脊梁弯成了与大地平行的弧度。一九一七年的两场革命，于他而言不过是远处电报站换了几回旗帜——西伯利亚向来是白军的后方，政权更迭的喧嚣传到针叶林边缘时，早已弱成一阵无关痛痒的风。\n\n“不过是一群人走了，另一群人来了。”多年后面对记者的提问，他只剩下一声苦笑。\n\n若说有什么能在漫长的灰暗中砸出一点涟漪，那便是一九二七年夏天，庄上来了个穿城市西装的年轻诗人。诗人站在麦茬地里，挥舞着苍白的手臂，用一大串他听不懂的修辞，将他日复一日的饥饿、腰疼和蚊蚋叮咬，统统讴歌成“田园牧歌”。老瓦列里蹲在田埂上，默默看着诗人白净的皮鞋沾上牛粪，心里想的是明天会不会又断粮。一个月后，诗人因思念城里的咖啡馆和夜灯，留下一句“我一定会回来”的誓言，便搭着运木材的火车消失在西方的斜阳里。"
  rus_stalin_zinovyev_rework.6.d: "后来，土地改革的风终于刮到了西伯利亚。老瓦列里第一次分到了真正属于自己名下的几俄亩黑土。他捧着地契，激动得整夜没睡，以为从此可以为自己而耕。可很快他便发现，这土地不是解放的钥匙，而是一口更深的井——没有农具，没有种子，没有余力，他依旧被拴在四季的轮回上，春播秋收，周而复始，稍有懈怠，饥饿便像狼一样蹲在门槛外。那几年收成不好，接着是大面积的歉收，粮仓空得能听见回声，村里有人吃树皮，有人卖掉儿女换一袋发霉的黑麦。老瓦列里骨瘦如柴，却还得拖着浮肿的腿去翻地——土地喂养了他，也吞噬了他，他是他自己田垄上的奴隶。\n\n他偶尔望着远处烟囱冒出的工厂黑烟，羡慕城里工人有固定的工时、有周末的休憩、有不需要看天色吃饭的安稳日子。可那份向往，每每被现实碾得支离破碎——他连去车站的车票钱都凑不齐，何况家里还有张嘴要喂。日子久了，他觉得自己正在慢慢消失，不是死去，而是被一点一点磨成脚下的尘土，再也拼不出一个完整的“瓦列里”。\n\n直到“穆罗梅茨”来了。那位大人物在西伯利亚推行集体农庄，把散碎的小块土地连成大片，引进了拖拉机、良种和储粮窖。起初老瓦列里将信将疑，但当第一季秋收的谷物堆满公仓，家家分到了足额的口粮，甚至还有余粮换布匹和煤油时，他才第一次在这个寒冷的边疆，尝到了“饱腹”的踏实。农务因为机械而日渐轻松，他不必再从天不亮跪到天黑，偶尔竟能在收工后坐在门槛上，看一会儿晚霞。\n\n而正是这一丝闲暇，重新唤醒了他心底那个埋藏多年的念头：\n\n他想去城市看看。\n\n他想知道，离开这片既给了他生命又耗尽他生命的土地，自己还能不能活成另一个模样。\n\n他站起身，拍了拍膝盖上的泥土。"
  rus_stalin_zinovyev_rework.6.a: "他要离开这片土地。"
  rus_stalin_zinovyev_rework.7.t: "新来的"
  rus_stalin_zinovyev_rework.7.d: "鄂木斯克•“曙光”农业工厂\n\n卡车在砂石路上停下时，瓦西里·舒米洛夫正抱着他的行李——一个捆着麻绳的旧皮箱，里面塞着两件换洗的衬衫、一包母亲用攒了半年的白糖烤的饼干，还有一本边角都磨白了的油印小册子，封面上印着《拖拉机操作简明手册》。他跳下车，鞋底踩在硬实的砂石路面上，发出一种陌生的、咯吱咯吱的响声。不是泥，不是土。是铺过的路。\n\n他来这里的原因，得从几年前说起。\n\n土地改革之后，区里按照机械化推广计划，在几个中心农庄轮流举办“工农技术培训班”。每期四十天，教最基本的拖拉机驾驶、日常保养和常见故障排除。说是培训班，其实就是在打谷场上支一块黑板，教员是区农机站的技术员，教材就是那本油印的《拖拉机操作简明手册》。拖拉机只有一台，学员轮流上机，每人每天摸方向盘的时间不超过二十分钟。\n\n瓦西里是第二期的学员。四十天里，他把那本油印手册从头到尾抄了一遍，晚上在煤油灯下背传动系统原理图。结业考核那天，教员让他独立完成一次挂犁转弯，他一把过了，拿了全班第二。这在当地就算正式有了“拖拉机手”的资格。\n\n但培训班能给的，也就到此为止了。它教会了他怎么开，怎么保养，怎么换滤芯和紧螺丝。至于更多的——比如那台老家伙的变速箱为什么永远咔咔响——不在教学范围内。没有教员可以问，没有多余的配件，他只能自己把变速箱拆开，对照着手册上那张模糊的剖面图，一件一件零件摸过去。最后发现是同步器磨损了。手册上没写怎么修这个，他就自己琢磨，用锉刀把磨损面重新打平，装回去，居然不响了。\n\n这就是他全部的本事：四十天的培训，加上自己摸索出来的手感。在集体农庄，这已经算顶尖技术了。去年秋播，他一个人干了三个人的活，农庄主席在大会上拍着他的肩膀，管他叫“我们的科学家”。\n\n但瓦西里自己知道，他知道得太少了。"
  rus_stalin_zinovyev_rework.8.d: "所以一个月前，当区里的干部站在老橡树下，讲到鄂木斯克的“农业工厂”时，他听到一个词：技术培训。不是四十天的那种，是定期的、系统的、有教员的培训。干部还说，那边有新型号的拖拉机，有机修车间，有车床和配件库。他站在人群后排，把“机修车间”和“配件库”这几个字在心里反复咀嚼，像嚼一颗放了很久的硬糖。\n\n他被选上的原因，就写在那张油印手册的油污和折痕里。干部翻完他交上去的手册，看了看他在培训班的结业成绩，又看了看农庄主席写的推荐信——信里只有一句话：“这个人能把一台快散架的拖拉机再撑两年。”干部合上手册，在登记表上写了几个字，说：“那边需要的就是你这种人。”\n\n他的名字出现在录取名单的第一行。瓦西里·格里戈里耶维奇·舒米洛夫，拖拉机手兼机械维修，定级：待考核。\n\n此刻，他站在曙光国营农业工厂的入口，面前是一片开阔的广场。广场上停着整排的拖拉机，不是他开过的那种破老旧拖拉机，而是新型号——铁灰色的引擎盖，崭新的履带，每一台都擦得反光。他认不出型号，但他数了数，光是他眼前能看到的，就有十二台。他所在的集体农庄总共只有三台，只堪堪满足日常的需要。十二台。他在心里把这个数字又过了一遍，觉得不太真实，像在做梦。\n\n空气里有一股机油和铁屑混在一起的气味，从远处那座红砖机修车间里飘出来。车间比他见过的任何农舍都要高大，红色的烟囱正冒着淡淡的烟。有人在里面操作车床，金属切削的尖啸声断断续续地传过来。他站在那里听了一会儿。这种声音，他在集体农庄从没听过。他甚至不太确定车床长什么样——手册上提过，但没有图。\n\n一个穿蓝工装的女人走过来，手里夹着写字板。她问了姓名、原单位、技术专长，在板上记了几笔，然后简要交代了安排：技术考核明天上午，通过定三级，通不过先当辅助工。宿舍东区三号房，下铺。说完便转身走了，蓝工装的背影穿过拖拉机阵列，消失在机修车间的门洞里。她走路很快，从头到尾没有一句多余的话。\n\n三号房是长条形木屋，里面排着六张铁架床，上下铺。床单是粗白布的，枕头是荞麦壳的。他的铺位靠窗。窗台上有一个空罐头瓶，瓶里插着一株不知名的幼苗，叶子嫩绿，在这个充满机油味的世界里显得格格不入。窗台下面贴着一张手写的纸条：“实验苗。代号K-17。”瓦西里想起干部提过，这里是育种试验站，和农学院有合作。他想，住上铺的大概是个搞科研的。\n\n他在床沿上坐下来。窗外，田野从宿舍后面一直铺展到看不见的地方。不是他在家乡看惯的那种东一块西一块、被田埂和界碑切割开的条田，而是一整片连在一起的、开阔得几乎让人不安的大田。没有界桩，没有篱笆，没有写着哪一户姓名的木牌。只有一块铁皮标牌，上面用红漆写着：第三作业区。"
  rus_stalin_zinovyev_rework.9.d: "他在食堂里听到了更多细节。食堂是全天开放的，因为农场实行三班倒，总有人在出勤。他端着一盘土豆炖牛肉和黑面包坐下——在集体农庄，肉不是顿顿都能吃到的——听到旁边桌上两个工人在讨论下个月的播种计划。\n\n“四号作业区要开了，防风林带外面那块荒地。场部批了三台新拖拉机，专门翻那片地。”\n\n“人手够吗？”\n\n“还缺几个有经验的。”\n\n瓦西里低头嚼着面包，没有说话。但他在心里把那句话存了起来。四号作业区。荒地。三台新拖拉机。\n\n晚饭后，他没有马上回宿舍，而是绕着场区走了一圈。机修车间的灯还亮着，透过半开的铁门，能看到里面停着几台正在检修的农机。有人在车床前弯腰作业，火花溅到地上，亮一下又灭了。再往前走，是仓库，外墙刷着白灰，门口挂着黑板，上面用粉笔写着下周的物资到货计划：机油×20桶，滤芯×50个，播种机配件×3箱。他站在这块黑板前面看了很久，像是在看一种他从没见过的东西。\n\n他往宿舍走的时候，天已经全黑了。远处传来低沉的轰鸣声，是夜班拖拉机正在翻耕。他停下脚步，侧耳听了一会儿。不是一台，是至少三台同时在工作。这种声音，在家乡只有春播时节才能听到。但在这里，它只是一个普通的夜晚。\n\n他躺在荞麦壳枕头上，把手枕在脑后。窗外月光很亮，照在窗台上那个罐头瓶里，幼苗的影子投在墙上，小小的，但轮廓清晰。明天有技术考核。他不知道这里的考核标准是什么——四十天的培训班没教过这个。但没关系。那把从家里带来的旧扳手还躺在他的皮箱里，扳手上磨出的凹痕，正好吻合变速箱上那颗总是松动的螺丝。这里的新机型用的螺丝也许不同，规格也许更大，但他想，原理不会差太远。\n\n他翻了个身。四号作业区。三台新拖拉机。防风林带外面那片荒地，现在还长着野草和矮灌木，但等他考完试、定完级、上完第一个班次——也许就是明年春天，也许更早——他会坐在一台新拖拉机的驾驶舱里，亲手把它的土翻过来。到时候，它就不再叫“荒地”了。它会有一个正式的编号，写在调度员的写字板上，写在他的交班日志上。\n\n而现在，此刻，他只需要好好睡一觉。\n\n他闭上眼睛。"
  rus_stalin_zinovyev_rework.9.a: "机修车间的灯，在他入睡前，一直亮着。"
