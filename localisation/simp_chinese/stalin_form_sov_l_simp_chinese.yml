  RUS_sov_DEF: "俄罗斯苏维埃联邦社会主义共和国"
  RUS_totalist_party_sov: "俄共(布)"
  RUS_totalist_party_sov_long: "俄罗斯共产党（布尔什维克）(Rossiyskaya Kommunisticheskaya Partiya (bolshevikov))\n§g起初，在弗拉基米尔·列宁激情四射的领导下，布尔什维克的大名响彻全国，还有希望最为渺茫、处境最为凄凉的阶层给予其支持。  然而天不遂人愿，在革命形势急剧变化的过程中，人民所期望的左翼团结并没有到来，投机主义的社革党人率先背叛了革命，列宁同志也在这场背叛中牺牲，曾经前途大好的俄国革命毁于一旦，布尔什维克们只能背井离乡、另谋出路……\n\n在斯大林与斯维尔德洛夫成功挫败了季诺维也夫取缔布尔什维克党的野心之后，布党时隔近二十年重新掌舵俄罗斯。和曾经一样，他们并不愿意将自己的命运全盘托付给西方的工团主义国家，可现如今欧洲乃至全球的局势已经一触即发，留给布尔什维克们的时间已经刻不容缓。社会主义俄罗斯能否继续存续，乃至完成更远大的目标，这些就要交给他们自己来把握了。§!\n"

  RUS_iosif_stalin_leader_desc: "§Y生于：§!§L1878年12月18日；俄罗斯帝国、第比利斯省哥里§!\n§Y背景：§!§L约瑟夫·维萨里奥诺维奇·朱加什维利生于一户格鲁吉亚农民家庭，以“斯大林”之名而为人所熟知。斯大林最初立志成为神父，后来他在第比利斯接触到马克思主义，并化名为“科巴”，成为了一名宣传员和罢工组织者。\n\n斯大林曾多次被流放到西伯利亚，1917年获释后，他成为彼得格勒的一名重要布尔什维克。俄国内战期间，斯大林担任民族事务人民委员以及其他各种军事政治职务。他的重要经历是，曾因坚决反对使用前保皇派军官而与列夫·托洛茨基发生冲突。列宁于1918年8月去世后，斯大林、斯维尔德洛夫和托洛茨基三人组成了执政三驾马车，最终斯大林支持“军事反对派”的观点占了上风。后人批评正是斯大林的这一政策在关键时刻削弱了红军。\n\n斯大林与克利缅特·伏罗希洛夫一起积极参与了察里津的保卫战，1920年斯大林短暂地担任了军事事务人民委员，其职业生涯到达了巅峰。\n\n如今，斯大林携手斯维尔德洛夫成功挫败了季诺维也夫想要完全取缔布尔什维克党，合并至全俄劳联的阴谋。在随后的党内辩论中，他又据理力争，认为革命的成功必须依赖于强有力的中央集权，主张由一个核心领导集中的力量来指挥革命。最终，斯大林成功说服了党内大多数成员，重新回到了领导者的位置上，距离上一次布尔什维克革命失败已近二十年，这次他一定要倾其所有，彻底击败德帝国主义。§!"
  RUS_lazar_kaganovich: "拉扎尔·莫伊谢耶维奇·卡冈诺维奇"
  RUS_lazar_kaganovich_advisor: "拉扎尔·莫伊谢耶维奇·卡冈诺维奇"
  RUS_lazar_kaganovich_advisor_desc: "§Y生于：§!§L1893年11月22日；俄罗斯帝国、基辅省、卡巴纳村§!\n§Y背景：§!§L拉扎尔·莫伊谢耶维奇·卡冈诺维奇出生在一个贫苦犹太人家庭，由于家境贫寒，无法完成学业，只好去学习缝制皮靴的手艺，1907年14岁时就到鞋匠作坊干活。1911年加入分裂后的俄国社会民主工党（布），曾几次遭到逮捕。被释放后在尤佐夫卡一家鞋店干活，领导当地一个鞣革和制鞋工人工会。\n\n1917年春，卡冈诺维奇应征服役，被派往驻扎在萨拉托夫省的第四十二步兵团接受军训，作为这支警备部队的代表出席全俄布尔什维克党军队组织代表会议。在会后返回萨拉托夫时被捕；逃脱之后来到位于前线地区的戈麦尔，成为当地鞣革和制靴工会主席。十月革命开始时，他成功接管了戈麦尔的地方政权。\n\n内战开始后，他任全国工农红军筹委会宣传部政委，不久被派往下诺夫哥罗德任党委会主席兼省苏维埃执委会主席，期间由于卓越的组织才能和规划能力受到了列宁、斯维尔德洛夫、斯大林等人的赏识，其本人也被称为“钢铁拉扎尔”。\n\n布尔什维克逐渐失利之后，卡冈诺维奇也跟随大部分布党成员流亡到了法兰西公社，并在完成主要人员转移后复刊的《真理报》担任总编辑，继续宣传马克思列宁主义与共产主义；在派系斗争上，卡冈诺维奇支持并宣传斯维尔德洛夫、斯大林的派系，并且大肆批判党内存在的修正主义、投降主义、宗派主义倾向。\n\n当革命风暴席卷俄罗斯，卡冈诺维奇也跟着大部队回国，并继续在适合自己的岗位上奋斗，正如党章中所要求的一样。§!"
