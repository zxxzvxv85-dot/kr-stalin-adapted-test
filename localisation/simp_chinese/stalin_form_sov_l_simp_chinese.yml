  RUS_andrei_zhdanov: "安德烈·亚历山德罗维奇·日丹诺夫"
  RUS_andrei_zhdanov_advisor: "安德烈·亚历山德罗维奇·日丹诺夫"
  RUS_andrei_zhdanov_advisor_desc: "§Y生于：§! §L1896年2月26日；俄罗斯帝国、叶卡捷琳诺斯拉夫省、马里乌波尔§!\n§Y背景：§! §L安德烈·亚历山德罗维奇·日丹诺夫出生于一国民中学督学家庭，父亲亚历山大·阿列克谢耶维奇，是一位神学教授；母亲是叶卡捷琳娜·帕夫洛夫娜。由于父母都接受过一定的教育，使得童年的安德烈·亚历山德罗维奇就具有很强的学习能力。在他父亲去世后，全家随母亲搬迁到特维尔省居住。在十四岁时，他考入实科学校学习。\n\n1915年，他从实科学校毕业后，先后考入彼得罗夫斯基-拉祖莫夫斯卡农业学院和莫斯科商业学院学习，学习期间深受革命思想鼓舞，因此他在第一年就辍学了，且加入了俄国社会民主工党（布）。\n\n第一次世界大战时期，同社会民主工党特维尔委员会中其他布尔什维克一道，积极捍卫列宁党的关于变帝国主义战争为国内战争的路线。1916年7月，应征入伍，在察里津的一个预备训练营受训，然后进入第比利斯第三尉官学校学习，毕业后被授予少尉军衔，随后被分配到第139预备步兵团。在后备第139团服役时期，积极进行布尔什维克党的宣传工作。1917年二月革命后，被选为团委员会成员。\n\n内战时期，日丹诺夫在沙德林斯克历任多个重要职务，并且积极肃清反动的社会革命党，而在捷克斯洛伐克军团攻入沙德林斯克前夕，他前往了彼尔姆，负责政治、文化与教育工作者进修班的工作，但很快他就加入了工农红军，担任多次政治处干部以及负责文化、教育、宣传方面的工作；随着布尔什维克逐渐失利，日丹诺夫也在思考自己何去何从。\n\n与斯维尔德洛夫、伏龙芝、斯大林等人不同，日丹诺夫并没有流亡海外，而是在西西伯利亚的发展落后地区以及各处的学校进行政治宣传，甚至组织起了一支总计两千多人的红军游击队，在广阔的西伯利亚和乌拉尔山脉来回游走，在这附近人民中的威望很高，有着“受压迫者之盾”的美名。\n\n随着苏维埃俄罗斯的重建，日丹诺夫得以回到他最擅长的政治文化宣传领域，不过他过于热情的工作态度引发了许多人对他健康的担忧。§!"
  RUS_ardent_revolutionary: "热忱革命者"
  KR_bolshevik_zhdanov: "$KR_bolshevik_trait$"
  RUS_nikolay_yezhov: "尼古拉·伊万诺维奇·叶若夫"
  RUS_nikolay_yezhov_advisor: "尼古拉·伊万诺维奇·叶若夫"
  RUS_nikolay_yezhov_advisor_desc: "§Y生于：§!§L1895年5月1日；俄罗斯、圣彼得堡§!\n§Y背景：§!§L1895年5月1日，尼古拉·伊万诺维奇·叶若夫出生在圣彼得堡的一个铸造工人家庭。16岁那年，他进入普梯洛夫工厂当锁匠学徒，但是在两年后他就离开圣彼得堡，前往苏瓦乌基省投奔父母。\n\n1915年6月，他应征加入沙俄陆军，先在第76预备步兵营中受训，随后被派往西北方面军利达第122步兵团中服役，由于他矮小的身材，很多军队里的士兵和长官都排挤、歧视他，因此他不久后就被调任后方担任工厂车间的警卫，而在一年后，他担任了这个炮兵车间的行政员。\n\n1917年，他加入了俄国社会民主工党（布），但是在十月革命的时候并没有直接参与起义，而是在玻璃厂工作了一段时间之后再在1919年4月加入了工农红军，尽管当时红军已经逐渐败退。\n\n布尔什维克流亡海外以后，陷入迷茫和执着的叶若夫在法兰西公社的各个图书馆翻阅政治书籍，试图破解自己的迷茫和执着，甚至有几次因为在一些不入流的边缘地带查阅到了一些离谱的盗版书发表言论而被法国警察部门逮捕。在他第二次被警察逮捕后，警察部门将他移交至了流亡中的俄共（布）中央，在一个不起眼的议会厅建筑，他第一次见到了斯维尔德洛夫、伏龙芝、斯大林等中央领导人物。\n\n叶若夫的种种行为虽然离谱，但斯维尔德洛夫认为叶若夫仍然是可塑之才，经常对他进行政治教育：从《资本论》讲到《国家与革命》；从第一国际（国际工人协会）到第三国际（工团国际）；从巴黎公社再到如今的法兰西公社……\n\n叶若夫在接受教育的时间内非常积极，有任何不理解的事情就立马去和党内的其他同志们讨论，不过，他似乎一直没找到自己真正的兴趣点，直到在法兰西公社安全部门查处多个间谍窝点的新闻放出后，叶若夫才开始对研究反间谍与情报学产生了浓厚兴趣，在很短时间便取得了巨大的进步，斯大林曾称赞他是“捷尔任斯基的继任者”。他对于理论学习和实践非常积极，在生活日常相处各个方面也很令人讨喜，再加上他身材矮小，在党内得到了“红色多莫佛伊”的美名（多莫佛伊是斯拉夫神话中家庭守护精灵的名字）。\n\n当红色俄罗斯卷土重来，叶若夫也将作为情报部门的优秀组织者，为了守护万家灯火而奋斗。§!"
