  RUS_reverse_the_october_revolution: "逆转十月革命"
  RUS_reverse_the_october_revolution_desc: "如今季诺维也夫的阴谋已经被挫败，但也得益于他在全俄劳联集中权力的操作，我们终于有机会让俄罗斯重回正轨，继续二十年前未竟的事业！"
  stalin_form_sov.13.t: "关于联盟共和国的地位"
  stalin_form_sov.13.desc: "在社会主义俄罗斯刚刚回归的时候，对于我们国家内的部分地区，我们决定尊重民族自决原则，将其重新划归为联盟共和国或自治联盟共和国，而其中的政府部门则多是参照西方的工团主义国家来组建的。\n\n而现在，随着布尔什维克的归来，关于这些联盟共和国的地位需要重新考量，一味照搬我们的工团朋友的政策恐怕是行不通的。按照列宁的设想，我们应该在不远的将来会建立一个由诸多社会主义国家组成的共和国联盟，也许对于这些联盟共和国的行政地位也应按照这个设想，将他们重组为苏维埃加盟共和国。虽然现在的加盟国家数量寥寥无几，但是我们可以为以后打好样本，是时候放开手去做了。"
  stalin_form_sov.13.a: "重组我们的联盟共和国"
  stalin_form_sov.13.b: "现在还不是时候"
  stalin_form_sov.13.b_tt: "§Y在我们赢得将来的对德战争后，我们仍然可以邀请目前的联盟共和国以及其他潜在成员国成为我们的苏维埃加盟共和国。§!"
  stalin_form_sov.14.t: "一切的起点"
  stalin_form_sov.14.desc: "1917年，俄历10月，当布尔什维克党内还在就起义时机进行争论的时候，彼得格勒苏维埃及其军事革命委员会已经开始具体组织起义。预备会议建议临时政府立即宣布激进的“土地和和平”纲领，但遭到拒绝，军事革命委员会旋即自10月21日起开展行动，25日下午的彼得格勒苏维埃特别会议上，军事委员会宣布临时政府已被推翻。当天夜里举行的全俄苏维埃第二次代表大会苏维埃，标志着苏维埃政权的建立，也意味着俄罗斯新时代的开端。以旧贵族和资本家为主的保皇党又开始支持尼古拉二世复辟，自由主义者虽然反对复辟帝制，但各种反布尔什维克势力暂时联合，组成白军与苏维埃政权对抗，俄国内战随即爆发。\n\n可故事的结局并不美好，列宁同志被社会革命党人刺杀，我们在内战当中也没能笑到最后。如今历史又给了我们一次机会，也许这次我们可以为革命书写不一样的结局。"
  stalin_form_sov.14.a: "列宁永远活在我们的心中"
  stalin_form_sov.14.b: "而斯大林也将继续战斗下去"
  STATE_195_LENINGRAD: "列宁格勒"
  VICTORY_POINTS_6174_LENINGRAD: "列宁格勒"
  STATE_217_STALINGRAD: "斯大林格勒"
  VICTORY_POINTS_3529_STALINGRAD: "斯大林格勒"

  RUS_fate_of_the_radsocs: "社会革命党人的命运"
  RUS_fate_of_the_radsocs_desc: "实际上，社会革命党在加米涅夫和季诺维也夫的打压下早已被极度边缘化，现在我们要做的只不过是踢上临门一脚，彻底让他们失去话语权。"
  RUS_fate_of_the_radsocs_tt: "我们将接管§t社会革命党§!目前残存的所有影响力，但这也会使我们失去一定的稳定度。\n当前的效果为："

  RUS_leniency_granted: "网开一面"
  RUS_leniency_granted_desc: "既然社会革命党现在的状态已经算是半死不活，如果我们对他们网开一面，他们必将心怀感激，这将对我们接下来的治理有百利而无一害。"
  RUS_leniency_granted_tt: "§t社会革命党§!将加入我们，我们将有机会启用社革党不同派系的政治顾问。"
  stalin_form_sov.15.t: "关于社革党人"
  stalin_form_sov.15.desc: "鉴于我们将对社会革命党网开一面，那么让部分社会革命党人重新参与到国家建设中来的任务已经推上了日程，毕竟他们各自都有所专精的特长，可以为我们的建设事业添砖加瓦。\n\n但是，不知道他们“永不翻案”的承诺究竟是真是假？"
  stalin_form_sov.15.a: "团结无派系社革党人"
  stalin_form_sov.15.a_tt: "我们将能启用无派系$KR_sr_trait$人的政治顾问！"
  stalin_form_sov.15.b: "团结社革(斯皮里多诺娃派)"
  stalin_form_sov.15.b_tt: "我们将能启用$KR_spiridonist_trait$的政治顾问！"
  stalin_form_sov.15.c: "团结社革(最高纲领派)"
  stalin_form_sov.15.c_tt: "我们将能启用$KR_maximalist_trait$的政治顾问！"

  RUS_radsocs_advisor: "团结了无派系$KR_sr_trait$人"
  RUS_radsocs_spiridonist_advisor: "团结了$KR_spiridonist_trait$"
  RUS_radsocs_maximalist_advisor: "团结了$KR_maximalist_trait$"

  RUS_remove_dust_and_filth: "除尘扫垢"
  RUS_remove_dust_and_filth_desc: "在之前的全俄劳联中，保守派和右派还是占有相当一部分的话语权，我们必须扭转这个局面，把权力牢牢掌控在手中。"
  RUS_remove_dust_and_filth_tt: "我们可以通过决议，花费§r更大的代价§!逐步减少国家精神§Y反社会主义抵抗活动§!的影响，但是只有完成战后国策才能将其完全消除。\n解锁决议：£GFX_decision_icon_small §Y肃清反革命活动§!。"
  RUS_destroy_antisoc_resistance_soviet: "肃清反革命活动"
  RUS_remove_dust_and_filth_idea: "除尘扫垢"

  RUS_shelter_dust_and_filth: "藏污纳垢"
  RUS_shelter_dust_and_filth_desc: "大敌当前，如果现在将保守派和右派一网打尽，我们所面临的反社会主义抵抗势必更加强烈，也许一时的容忍是必要的。"
  RUS_shelter_dust_and_filth_tt: "我们可以通过决议，花费§G更小的代价§!逐步减少国家精神§Y反社会主义抵抗活动§!的影响，但是只有完成战后国策才能将其完全消除。\n解锁决议：£GFX_decision_icon_small §Y处理反革命活动§!。"
  RUS_decrease_antisoc_resistance_soviet: "处理反革命活动"
  RUS_shelter_dust_and_filth_idea: "藏污纳垢"

  RUS_one_nation_one_purpose: "举国一致"
  RUS_one_nation_one_purpose_desc: "这场与德国的战争远比我们想象的要艰难得多，现在也许是时候放下成见一致对敌了，如果战争的进程无法好转，我们也许会对局势失去控制。"
  RUS_one_nation_one_purpose_tt: "也许我们这样做的初衷是为了团结一致，但是这在给我们带来好处的同时可能会产生§o极其严重的后果§!！"

  RUS_triple_flip: "三次政变"
  RUS_triple_flip_desc: "布尔什维克党没能把握住第二次机会，彻底的失败了，这一次我们将会跌入万劫不复的深渊，俄罗斯的存亡已经到了最后关头。"
  RUS_triple_flip_tt: "§R我们没能按照预料的那样顺利抗击德国，国家在短暂的几年里经历数次政治动荡，未来已是风雨飘摇……§!\n\n我们将不得不向§Y德意志帝国§!求和，并割让大量领土。\n§C倘若德国仍然处于战争之中，他们便不会拒绝我们。§!"
  RUS_triple_flip_happened: "三次政变发生了"

  RUS_fate_of_the_syndicalists: "整合全俄劳联"
  RUS_fate_of_the_syndicalists_desc: "季诺维也夫犯了大错，他想要将布尔什维克党取缔，整合进全俄劳联。不过他为我们提了个醒，我们可以反过来整合全俄劳联，毕竟布尔什维克如今能够卷土重来，是全俄劳联中的共产主义者持久不懈努力所换来的结果，如今他们也是全俄劳联中最大的派系。"
  RUS_fate_of_the_syndicalists_tt: "§t全俄劳联§!将彻底被我们掌控，你将获得一个临时的国家精神，在整合完成后该精神将会升级。\n我们将可以启用$KR_vst_left_trait$的政治顾问。"
  RUS_fate_of_the_syndicalists_idea: "整合全俄劳联"
  RUS_syndicalists_has_been_integrated_idea: "全俄劳联已被整合"
  RUS_syndicalist_party_sov: "俄共(布)属全俄工联"
  RUS_syndicalist_party_sov_long: "$RUS_syndicalist_party_sov_long_tt$\n§g季诺维也夫所推动的合并计划失败后，斯大林主导的布尔什维克党以及全俄劳联中的共产主义者决定放弃党争，联合起来共同追求世界革命。尽管有部分其他派系的成员试图阻止，但他们因为失去了话语权不得不放弃，最终由前流亡布尔什维克、全俄劳联内的共产派和一些愿意合作的其他派系组织了这次合并。随着俄共(布)吸收了全俄劳联，劳联改组成为了全俄工会联盟这一政府机构，共产主义者自此合流为一个组织，结束了数十年的分裂，列宁的追随者们再次团结了起来。§!\n"
  RUS_syndicalist_party_sov_long_tt: "俄共(布)属全俄工联(Vserossiysky Soyuz Profsoyuzov (bolshevikov))"

  RUS_ensure_the_syndicalists_independence: "尊重全俄劳联独立性"
  RUS_ensure_the_syndicalists_independence_desc: "我们不能再犯季诺维也夫的错误，如果随意整合全俄劳联可能会重蹈他的覆辙。相反地，如果我们尊重他们的独立地位，他们便可以视为我们友好的“官方反对党”，这对于我们是一个双赢的选择。"
  RUS_ensure_the_syndicalists_independence_tt: "我们将可以启用$KR_vst_left_trait$的政治顾问，我们将有机会启用$KR_vst_centre_trait$和$KR_vst_right_trait$的政治顾问。"
  stalin_form_sov.16.t: "关于全俄劳联"
  stalin_form_sov.16.desc: "鉴于我们将尊重全俄劳联的独立性，曾今声称与我们划清界限的部分劳联人士如今改口称可以考虑合作，那么让部分劳联人士重新参与到国家建设中来的任务已经推上了日程，毕竟他们各自都有所专精的特长，可以为我们的建设事业添砖加瓦。\n\n不过，对于只拉拢中间派还是连着右派一起拉拢这一点还是要好好考虑的。"
  stalin_form_sov.16.a: "团结全俄劳联(中派)"
  stalin_form_sov.16.a_tt: "我们将能启用$KR_vst_centre_trait$的政治顾问！"
  stalin_form_sov.16.b: "团结全俄劳联(中派)和全俄劳联(右派)"
  stalin_form_sov.16.b_tt: "我们将能启用$KR_vst_centre_trait$和$KR_vst_right_trait$的政治顾问！"

  RUS_vst_left_advisor: "团结了$KR_vst_left_trait$"
  RUS_vst_central_advisor: "团结了$KR_vst_centre_trait$"
  RUS_vst_right_advisor: "团结了$KR_vst_right_trait$"

  RUS_mobilize_before_the_storm: "未战而动"
  RUS_mobilize_before_the_storm_desc: "在可以预见的未来与德帝国主义的战争中，我们的前方工业一定会遭受到沉重的打击，我们必须采取一切手段来保护我们的生产线不受影响。"
  RUS_mobilize_before_the_storm_tt: "我们可以通过决议迁移我们前线的工业至后方。\n§R注意，当开战后这些决议将不再可用！§!\n解锁决议：£GFX_decision_icon_small §Y迁移波罗的前线工业§!。\n解锁决议：£GFX_decision_icon_small §Y迁移白罗斯前线工业§!。\n解锁决议：£GFX_decision_icon_small §Y迁移乌克兰前线工业§!。"
  RUS_mobilize_before_the_storm_idea: "未战而动"
  RUS_mobilize_before_the_storm_decisions: "未战而动"
  RUS_transfer_baltic_industries: "迁移波罗的前线工业"
  RUS_transfer_belarus_industries: "迁移白罗斯前线工业"
  RUS_transfer_ukraine_industries: "迁移乌克兰前线工业"

  RUS_hearts_of_iron: "钢铁之心"
  RUS_hearts_of_iron_desc: "随着政治局势趋于稳定，现在是时候确立斯大林同志的领导地位了，布尔什维克党在他的带领下在社会主义俄罗斯重新掌舵，只要我们团结在一起，也一定能够击退以后袭来的威胁，实现我们的革命理想。"
  RUS_stalin_hearts_of_iron: "钢铁之心"
  RUS_stalin_hearts_of_iron_2: "钢铁之心"
  stalin_form_sov.6.t: "国旗问题"
  stalin_form_sov.6.desc: "自斯大林掌权以来，他一直在考虑如何塑造社会主义俄罗斯的未来和标志性象征。随着党内的权力斗争逐渐平息，斯大林开始思考是否要重新审视红旗的象征意义。十月革命后使用的红色旗帜曾在革命初期成为全俄罗斯人民的荣耀象征，斯大林认为恢复这一旗帜不仅能彰显革命的传承，也能向全体人民传递他对革命成果的坚定承诺。\n\n然而，斯大林身边的某些党内领导人认为：可以更换其他样式的红旗，来彰显我们处于全新的革命阶段。而反驳的人则说现在的旗帜已经足够完美，最好不要做任何变动。当然，无论现有红旗的去留与否，这都是我们对于革命与国家象征的一次全新思考。\n\n随着政府内部人士的广泛讨论以及对社会群众意见的广泛征询完成之后，上交至斯大林面前以供他最后拍板的国旗样式有以下几种："
  stalin_form_sov.6.a: "我们就用现在这个"
  stalin_form_sov.6.b: "第二种好一点"
  stalin_form_sov.6.c: "第三种不错"
  stalin_form_sov.6.d: "第四种比较美观"
  RUS_sov_2: "俄罗斯苏维埃联邦社会主义共和国"
  RUS_sov_2_DEF: "俄罗斯苏维埃联邦社会主义共和国"
  RUS_sov_3: "俄罗斯苏维埃联邦社会主义共和国"
  RUS_sov_3_DEF: "俄罗斯苏维埃联邦社会主义共和国"
  RUS_sov_4: "俄罗斯苏维埃联邦社会主义共和国"
  RUS_sov_4_DEF: "俄罗斯苏维埃联邦社会主义共和国"

  RUS_a_compromise_choice: "折衷之选"
  RUS_a_compromise_choice_desc: "我们已经克服了政权交接期间的种种不稳定，虽然在这个过程中我们也做出了妥协，但是毋庸置疑的是，斯大林同志是目前整个苏维埃俄国的折衷之选。"
  RUS_stalin_compromise_choice: "折衷之选"
  RUS_stalin_compromise_choice_2: "折衷之选"

  RUS_political_figurehead: "政治花瓶"
  RUS_political_figurehead_desc: "每个伟大的开始都伴随着豪言壮语，但是能做到言行合一并没有那么容易，我们在稳定政治环境期间可能付出了太多，也犯下了太多错误，现在我们恐怕要付出一些代价了。"
  RUS_stalin_political_figurehead: "政治花瓶"
  RUS_stalin_political_figurehead_2: "政治花瓶"

  RUS_plan_ahead: "山雨欲来"
  RUS_plan_ahead_desc: "欧洲乃至全球的局势已经一触即发，我们在这样的险要关头却经历了数次政府与领导更替，时间已经刻不容缓，我们必须立刻着手准备，为即将到来的抗击德帝国主义的战争坚壁清野。"
  RUS_plan_ahead_idea: "未雨绸缪"

  RUS_stay_strong: "风雨欲摧"
  RUS_stay_strong_desc: "与德帝国主义的最后一战已经来临，我们一步也不能后退，这不仅是为了我们自己，也是为了欧洲乃至世界能否成功实现革命的最终考验。"
  RUS_stay_strong_tt: "根据§Y约瑟夫·斯大林§!现在的领袖特质，我们会得到对应的升级。"

  RUS_what_a_childish_fantasy: "多么幼稚的幻想！"
  RUS_what_a_childish_fantasy_desc: "有人曾说这是一个幼稚的幻想，但我们实现了不可能的事情：我们又一次在俄罗斯实现了社会主义，我们在与社会革命党投机分子和全俄劳联不同派系的一系列斗争中脱颖而出，重新逆转了十月革命，我们抵挡住了条顿威胁，击灭了德帝国主义。如今大局已定，是时候实现二十年前的理想了！"
  RUS_what_a_childish_fantasy_tt: "我们将可以在占领地区建立苏维埃加盟共和国，最终成立§o苏维埃社会主义共和国联盟§!。\n解锁决议：£GFX_decision_icon_small §Y邀请成为加盟共和国§!。"
  RUS_sov_afterwar: "俄罗斯苏维埃联邦社会主义共和国"
  RUS_sov_afterwar_DEF: "俄罗斯苏维埃联邦社会主义共和国"

  RUS_found_communist_international: "建立共产国际"
  RUS_found_communist_international_desc: "我们的西方朋友无论是政治模式还是工业模式都与我们有很大的区别，和他们的友好交流是必要的，但将自己全盘托付是愚蠢的。我们需要建立一个自己主导的阵营，让所有的盟国都可以从中受益。"
  communist_international: "共产国际"

  RUS_help_allys_industry: "援助加盟国工业"
  RUS_help_allys_industry_desc: "迟早有一天我们会与我们的苏维埃加盟国合而为一，在这之前我们要大力援助他们的工业，这样不仅可以改善当地的工业水平，也可以为我们以后的统一调度打好基础。"
  RUS_help_allys_industry_tt: "所有的苏维埃加盟共和国将获得来自我们的工业援助，以后§Y有可能§!加入我们联盟的国家在成为加盟共和国后也会获得这些效果。\n当前的效果为："
  RUS_soviet_republic_industry_idea: "俄罗斯援助我国经济"

  RUS_found_sov_union: "成立苏维埃社会主义共和国联盟"
  RUS_found_sov_union_desc: "我们伟大的革命已经开始席卷整个世界，工人阶级和农民的力量联合起来推翻了一个又一个腐朽的旧政权。为了确保革命的最终胜利，我们必须将所有革命力量凝聚在一起，成立一个牢不可破的联盟。让我们共同迈向共产主义的未来，摧毁一切反动和帝国主义势力，为全世界的工人阶级铺平道路！"
  RUS_found_sov_union_tt: "我们将整合我们所有的§Y苏维埃加盟共和国§!，获得他们的所有部队，并且获得他们所有地区的核心（包括那些有§Y宣称§!但尚未整合完成的地区）。"
  RUS_sov_union: "苏维埃社会主义共和国联盟"
  RUS_sov_union_DEF: "苏维埃社会主义共和国联盟"
  RUS_totalist_party_sov_union: "联共(布)" 
  RUS_totalist_party_sov_union_long: "$RUS_totalist_party_sov_union_long_tt$\n§g起初，在弗拉基米尔·列宁激情四射的领导下，布尔什维克的大名响彻全国，还有希望最为渺茫、处境最为凄凉的阶层给予其支持。  然而天不遂人愿，在革命形势急剧变化的过程中，人民所期望的左翼团结并没有到来，投机主义的社革党人率先背叛了革命，列宁同志也在这场背叛中牺牲，曾经前途大好的俄国革命毁于一旦，布尔什维克们只能背井离乡、另谋出路……\n\n在斯大林与斯维尔德洛夫成功挫败了季诺维也夫取缔布尔什维克党的野心之后，布党时隔近二十年重新掌舵俄罗斯。和曾经一样，他们并不愿意将自己的命运全盘托付给西方的工团主义国家，可现如今欧洲乃至全球的局势已经一触即发，留给布尔什维克们的时间已经刻不容缓。社会主义俄罗斯能否继续存续，乃至完成更远大的目标，这些就要交给他们自己来把握了。\n\n这是一个所有人都无法预想到的结局，社会主义俄罗斯不但在经历了第二次世界大战后继续傲然挺立，而且在斯大林的带领之下，布尔什维克们还成功建立起了一个迄今为止最庞大的社会主义共和国联盟。随着俄共(布)已然走进历史，全联盟共产党将继续为了世界革命而持久不懈的奋斗，愿共产主义精神永放光芒！§!\n"
  RUS_totalist_party_sov_union_long_tt: "全联盟共产党（布尔什维克）(Vsesoyuznaya kommunisticheskaya partiya (bolshevikov))"
  RUS_syndicalist_party_sov_union: "联共(布)属全苏工联"
  RUS_syndicalist_party_sov_union_long: "联共(布)属全苏工联(Vsesoyuznyy Soyuz Profsoyuzov (bolshevikov))\n§g季诺维也夫所推动的合并计划失败后，斯大林主导的布尔什维克党以及全俄劳联中的共产主义者决定放弃党争，联合起来共同追求世界革命。尽管有部分其他派系的成员试图阻止，但他们因为失去了话语权不得不放弃，最终由前流亡布尔什维克、全俄劳联内的共产派和一些愿意合作的其他派系组织了这次合并。随着俄共(布)吸收了全俄劳联，劳联改组成为了全俄工会联盟这一政府机构，共产主义者自此合流为一个组织，结束了数十年的分裂，列宁的追随者们再次团结了起来。\n\n随着苏维埃社会主义共和国联盟的建立，全俄工会联盟进一步改组为全苏工会联盟，与全联盟共产党一同进入了全新的革命阶段，而他们也将继续精诚合作，为了社会主义俄罗斯更美好的未来而奋斗。§!\n"
  
  RUS_red_october_never_fade: "红十月永不褪色"
  RUS_red_october_never_fade_desc: "列宁的继承者们终于证明了自己，和二十年前不同，这一次我们从资产阶级和帝国主义者手中保卫住了自己的国家。在曾经信奉拜物教的资本主义国家的废墟上，一个又一个崭新的工人阶级统治的苏维埃国家被建立起来，一个又一个由无产阶级创造、服务于无产阶级的全新力量诞生，这番伟业毫无疑问是永恒不朽的。让我们大步向世界革命前进，红十月永不褪色！"
  RUS_red_october_never_fade_tt: "§G如果我们已经通过决议将反社会主义抵抗活动影响降至最小，我们将可以将其完全移除！§!"

  RUS_soviets_future: "苏维埃的未来"
  RUS_soviets_future_desc: "我们在革命初期继承的宪法如今已不具效力。苏维埃早已根植于工人的血肉之中，所有劳动者都参与其中。全俄劳联实际上也早已失去了其原有的行政作用，如今只能跟随共产党中央委员会的脚步，在国民经济委员会的指导下履行其经济职能。这一切都是在无产阶级的先锋队——布尔什维克党的主持下进行的。因此，我们理应结合目前的现状和对未来的展望，起草一部新的宪法。"
  RUS_soviets_future_tt_1: "§G在事件链结束后，这个国策会自动完成。§!"
  RUS_soviets_future_tt_2: "§C我们将开启一系列决定国家未来的事件链，国家将走向个人崇拜还是党内民主，将取决于你接下来的选择。§!"
  # 接下来触发的一系列事件
  stalin_form_sov.7.t: "关于苏维埃未来的讨论"
  stalin_form_sov.7.desc: "随着战争的硝烟逐渐散去，千疮百孔的祖国迎来了短暂的和平。曾经席卷欧洲大陆的战火虽已熄灭，但它留下的创伤依然深深刻印在每一个公民的心中。人民期待着一个更加光明的未来，他们渴望安定、繁荣与公正的社会秩序。而在克里姆林宫的高墙之内，党内高层围绕着国家的前进方向展开了激烈的辩论。\n\n一些领导人主张扩大党内民主，认为苏维埃制度应当回归其最初的理念，让工人、农民和各级代表大会真正掌握权力，以此确保国家治理更加透明、公正。他们相信，唯有给予基层更多的发言权，才能激发全社会的活力，使苏联在战后的废墟上迎来新的复兴。\n\n然而，另一部分人则对这种想法嗤之以鼻，他们坚信只有继续巩固现有的领导体制，才能确保国家的稳定与强大。在他们看来，权力过度分散将导致内部分裂，而党内的绝对统一才是苏联继续前进的唯一保障。面对外部资本主义世界的敌视与内部重建的重任，他们主张加强对国家机器的控制，确保党的意志能够贯彻到底，不容丝毫动摇。\n\n如今，苏维埃正站在历史的十字路口。它的未来，是走向更加开放的党内民主，还是继续沿着高度集权的道路前进？这场辩论的结果，将决定整个国家的命运。"
  stalin_form_sov.7.a: "巩固个人领导，斯大林是我们的核心"
  stalin_form_sov.7.b: "加强党内民主，赋予苏维埃更大权力"

  stalin_form_sov.8.t: "关于改革的讨论"
  stalin_form_sov.8.desc: "在克里姆林宫的会议厅内，政治局成员围绕改革议题展开了新一轮的激烈讨论。随着全国人民的关注，这场辩论已不再局限于高层内部，而是蔓延到了各级党组织和地方苏维埃。苏联正站在历史的关口，每一步决定都将影响国家的命运。\n\n改革派主张扩大工人代表大会的权力，给予地方更多的自主决策空间，以此提高治理效率，让真正的人民代表参与国家管理。他们指出，在战争期间，中央集权的模式固然提高了动员能力，但和平时期应当让治理模式更加灵活，以避免官僚体系的僵化。\n\n然而，保守派则警告，这种松散的治理模式将严重削弱中央政府的控制力，使国家陷入混乱。他们强调，必须继续加强党的领导核心，确保决策的高度统一，以应对未来可能出现的国际挑战。他们提议扩大国家安全部门的权力，对潜在的反对派进行必要的监控，以维护国家的稳定。\n\n在这场会议上，所有的目光都集中在斯大林身上，他的态度将决定改革的方向。"
  stalin_form_sov.8.a: "改革应当有限进行，不能损害党的领导地位"
  stalin_form_sov.8.b: "人民代表大会应当拥有更多的权力"

  stalin_form_sov.9.t: "国家治理模式的定型"
  stalin_form_sov.9.desc: "随着改革进程的推进，全国各地对于国家治理模式的讨论愈演愈烈。从莫斯科的工厂工人，到基辅的地方官员，再到远东的军队指挥官，每个人都在关注克里姆林宫即将做出的决定。这场关乎苏维埃未来的辩论不仅存在于政治局会议室内，更在街头巷尾、工人食堂和军营会议中激起了层层波澜。\n\n在一些地区，地方苏维埃已经开始尝试新的自治模式，试图在不破坏国家统一的前提下，赋予地方政府更多决策权。工厂工人组织起代表委员会，提出更直接的劳动政策建议；农村合作社希望在计划经济框架下争取更灵活的生产调配权。然而，与此同时，国家安全机构也在加强对异见分子的监视，任何鼓吹“过度自由化”的言论都会引起政府的警惕，秘密警察的活动频率明显增加，一些地方的政治异见者被“暂时拘留”进行思想整顿。\n\n改革派强调，苏联的未来不能再依赖单一的权力结构，而应当构建一个更具透明度的治理体系，让各级苏维埃能够真正反映人民的声音。他们主张修改部分法律，扩大工人代表大会的权力，并鼓励学术界、经济专家和社会组织参与政策制定，使政府更加贴近人民的需求。\n\n然而，保守派对此保持高度警惕。他们认为，过去的成功正是依靠党的统一领导才得以实现，任何削弱中央权力的举措都可能导致国家走向不稳定。为此，他们推动出台一系列新法律，加强对媒体、出版物以及学术机构的控制，以确保思想领域的统一性。同时，军方内部的高级将领也在向中央施压，要求维持现有的权力架构，以防止任何可能威胁苏联安全的政治动荡。\n\n整个国家仿佛被拉向了两个不同的方向，每个人都在等待克里姆林宫的最终决策。而这场改革，是走向更广泛的党内民主，还是进一步巩固现有的领导体制？答案即将揭晓。"
  stalin_form_sov.9.a: "稳定压倒一切"
  stalin_form_sov.9.b: "是时候做出改变了"

  stalin_form_sov.10.t: "新宪法的起草"
  stalin_form_sov.10.desc: "随着关于国家治理模式的讨论不断深入，党内高层开始着手起草一部新的苏维埃宪法，以确立未来的政治框架。新的宪法不仅将决定党的运作方式，还将影响国家行政、经济政策以及公民的基本权利。\n\n在宪法委员会的会议上，两种截然不同的理念针锋相对。改革派希望赋予宪法更大的权威性，确保各级苏维埃代表大会能够独立决策，减少党对国家机构的直接干预。而保守派则强调，宪法必须维护党的核心地位，确保国家机器的运作不被地方势力削弱，同时强化国家安全机制，以防止潜在的分裂和动荡。\n\n斯大林本人并未公开表态，而是让宪法委员会自行达成共识。新的宪法将奠定苏联未来几十年的政治基础，而这一决定也将影响整个国家的命运。"
  stalin_form_sov.10.a: "党将牢牢掌控国家机器"
  stalin_form_sov.10.b: "人民将会真正掌控国家"

  stalin_form_sov.11.t: "苏维埃宪法的最终定稿"
  stalin_form_sov.11.desc: "经过漫长的讨论与政治博弈，苏维埃宪法的最终定稿即将出炉。这部宪法不仅将确立国家治理模式，也将决定党与国家之间的权力关系。克里姆林宫的会议厅内，改革派与保守派的角力达到了白热化的程度，最终的决定将塑造苏联未来数十年的发展方向。\n\n新宪法确立了党的绝对领导地位，强调中央集权，确保国家机器的高效运作。所有地方苏维埃的决策权最终仍需服从党的最高指示，国家安全机构获得了更大的权力来维护国家稳定。尽管这种体制保证了国家的统一与秩序，但也意味着政治自由的进一步收紧。"
  stalin_form_sov.11.a: "我们的苏联（哽咽）……会变成（哽咽）……什么样子……"

  stalin_form_sov.12.t: "苏维埃宪法的最终定稿"
  stalin_form_sov.12.desc: "经过漫长的讨论与政治博弈，苏维埃宪法的最终定稿即将出炉。这部宪法不仅将确立国家治理模式，也将决定党与国家之间的权力关系。克里姆林宫的会议厅内，改革派与保守派的角力达到了白热化的程度，最终的决定将塑造苏联未来数十年的发展方向。\n\n全国代表大会正式通过了一部更具开放性的宪法。这部宪法赋予地方苏维埃更大权力，确保工人代表大会在决策过程中拥有真正的话语权。媒体和学术界获得更多自由，国家机构的透明度也得到了提高。然而，这种新体制的稳定性仍然存疑，部分党内强硬派对此保持警惕。"
  stalin_form_sov.12.a: "不管怎么说，总算迈出了第一步"

  RUS_future_is_determined_1: "我们已经确定了未来的走向"
  RUS_future_is_determined_2: "我们已经确定了未来的走向"

  RUS_the_supreme_soviet: "成立最高苏维埃"
  RUS_the_supreme_soviet_desc: "苏维埃体系的核心在于各级代表大会，而战后的新形势要求我们进一步完善这一制度。最高苏维埃将作为国家的最高立法机关，统一管理全国事务，并确保党的领导地位得到贯彻。在新的体制下，中央政府将拥有更高的决策效率，而各级代表大会也将继续在国家治理中发挥作用。"
  RUS_supreme_soviet: "最高苏维埃"
  RUS_supreme_soviet_desc: "作为苏联的最高立法机关，最高苏维埃不仅是国家治理的核心机构，也在很大程度上体现了国家的政治走向。它由两个院组成：联盟院（Soviet of the Union）和民族院（Soviet of Nationalities），理论上代表着工人、农民、士兵以及各加盟共和国的利益。\n\n在改革派的设想中，最高苏维埃应该成为真正的立法机构，赋予各级代表大会更大的决策权，使政府更具透明度，减少党的直接干预。他们主张建立独立的宪法法院，赋予法律更高的权威性，以防止行政机关的过度干预。\n\n然而，在保守派看来，最高苏维埃的首要任务是维护党的领导地位，确保国家的统一和稳定。尽管代表大会定期召开，但最终的决策仍需服从党的指导，任何可能导致权力分散的改革都必须被遏制。他们提议通过新宪法，进一步强化党的领导，使最高苏维埃的职能更加集中于执行党的政策，而非独立立法。\n\n最高苏维埃究竟会成为真正的立法机关，还是最终沦为党的执行工具？这一切都取决于未来。"
  strong_party_discipline: "党纪严明"
  RUS_peoples_will_leader_trait: "人民意志"
  RUS_hymnoftheussr_base: "苏联国歌"
  RUS_alexandrov_departure: "出发"

  RUS_unite_under_stalin: "团结在斯大林同志的旗帜下"
  RUS_unite_under_stalin_desc: "伟大的卫国战争已经结束，但苏联的未来依然面临着诸多挑战。国内的重建工作需要一个坚定而果断的领导核心，而国际局势的紧张也要求我们保持高度的团结。在这样的历史关头，我们必须坚定信念，巩固党的核心，确保国家在斯大林同志的领导下继续前进。"
  RUS_father_of_nations: "各民族的慈父"

  RUS_extend_our_union: "扩张我们的联盟"
  RUS_extend_our_union_desc: "社会主义的胜利不能止步于苏联本土，全世界仍有无数劳动者在资本主义的压迫下挣扎。我们不能停滞不前，而必须主动承担起历史的使命，向整个欧洲乃至世界输出革命，为国际共产主义运动奠定基础。"
  RUS_extend_our_union_tt: "我们将能够对我们阵营中的其他欧洲社会主义国家执行£GFX_decision_icon_small §Y邀请成为加盟共和国§!和£GFX_decision_icon_small §Y整合至苏维埃社会主义共和国联盟§!决议。" 

  RUS_socialist_big_family: "社会主义大家庭"
  RUS_socialist_big_family_desc: "苏维埃社会主义共和国联盟不仅是一个国家，更是社会主义大家庭的核心。在我们周围，东欧的兄弟国家正在苏联的帮助下重建，世界社会主义阵营也在逐步形成。然而，我们不能让这个联盟仅仅停留在名义上，而必须真正实现经济一体化，使整个阵营成为一个不可分割的整体。"
  RUS_socialist_big_family_tt_1: "我们将进一步整合阵营内所有社会主义国家的工业和经济，我们还能够从我们的附属国获得额外的工厂。"
  RUS_socialist_big_family_tt_2: "§C我们的所有附属国§!：\n获得§Y$RUS_socialist_big_family_subject_idea$§!，其效果为（贡献给宗主国的民用工厂：§G+50%§!，贡献给宗主国的军用工厂：§G+50%§!）。"
  RUS_socialist_big_family_subject_idea: "一体化"
  RUS_socialist_big_family_tt_3: "§C我们阵营中的所有国家§!：\n获得§Y$RUS_socialist_big_family_all_idea$§!，其效果为（生活消费品工厂系数：§Y-20%§!，建造速度：§G+15%§!）。"
  RUS_socialist_big_family_all_idea: "社会主义大家庭"

  RUS_sov_to_the_world_revolution: "向着世界革命"
  RUS_sov_to_the_world_revolution_desc: "社会主义的事业不应局限于一国之内，而必须成为全人类的共同道路，资本主义和帝国主义势力仍在世界各地横行，他们压迫工人阶级、掠夺世界资源、阻碍社会进步。我们不能再容忍这种状况继续存在，红旗将飘扬在五大洲四大洋，我们将动员整个社会主义阵营，发动对全球反动势力的最后一击！"
  RUS_sov_to_the_world_revolution_tt: "§C我们将向世界上所有非社会主义国家开战！§!"

  news_stalin_form_sov.1.t: "苏维埃俄国的归来"
  news_stalin_form_sov.1.desc: "自从全俄劳联掌控社会主义俄罗斯以来，发生了一系列剧烈的政治斗争，最终在属于劳联极左派的季诺维也夫一场堪称失败的政治操作下，他的失势已不可避免，连带着全俄劳联的领导权被布尔什维克党所取代。目前俄罗斯已经进入了一场关键的权力交接期，在斯维尔德洛夫与斯大林的联手之下，季诺维也夫被迫辞去全俄劳联主席的职务，并被软禁在外。\n\n布党时隔近二十年重新掌舵俄罗斯，他们在接手全俄劳联的工作之后，对待西方工团主义国家的态度是否会发生变化还有待商榷。但是毋庸置疑的是，苏维埃俄国已经归来，与前任领导者一样，他们也将德帝国主义的压迫放在了斗争的首位。在可以预见的未来，两股巨头不可避免的会发生一场大战，这场大战也将证明两方谁的价值观念会笑到最后。"
  news_stalin_form_sov.1.a: "那就让我们拭目以待吧"
  news_stalin_form_sov.2.t: "苏维埃社会主义共和国联盟成立"
  news_stalin_form_sov.2.desc: "这是一个所有人都无法预想到的结局，社会主义俄罗斯不但在经历了第二次世界大战后继续傲然挺立，而且在斯大林的带领之下，布尔什维克们还成功建立起了一个迄今为止最庞大的社会主义共和国联盟。\n\n根据苏联官方表示，随着俄共(布)已然走进历史，全联盟共产党将继续为了世界革命而持久不懈的奋斗，他们将会继续与世界上的其余的社会主义国家共同前行，向着最终的世界革命大步前进。"
  news_stalin_form_sov.2.a: "也许他们真的能做到"

  RUS_invite_revolutionary_committee_tt_2: "如果我们现在的目标是建立一个由多个苏维埃国家组成的联盟，只要我们能在二战爆发之前完成这个决议，§Y[POL.GetNameDef]§!将成为我们潜在的加盟对象！"
  RUS_abolish_war_focus_tt: "未建立§Y共产国际§!"
  RUS_stalin_abolish_war_faction_leader_tt: "加入§Y第三国际§!后，我们将自动取得阵营领导权。"

  RUS_triple_flip_copy: "$RUS_triple_flip$"
  RUS_triple_flip_copy_desc: "$RUS_triple_flip_desc$"

  RUS_turn_the_tide: "破釜沉舟"
  RUS_turn_the_tide_desc: "这是最后的一次机会，德国人想要凭借虚假的和平，在我们的领土上坐享其成，但他们想错了，我们并不害怕玉石俱焚！"
  RUS_turn_the_tide_tt: "我们将向§Y德意志帝国§!宣战，但这将是最后一次机会，如果我们无法在半年内收复§Y被迫割让§!的所有领土，我们会§o顷刻崩溃§!！"
  RUS_turn_the_tide_idea: "破釜沉舟"
  RUS_turn_the_tide_mission: "最后一战"
  RUS_turn_the_tide_mission_tt: "§Y被迫割让§!的所有领土已被收复"
  RUS_turn_the_tide_mission_timeout_tt: "§o顷刻崩溃……§!"

  RUS_stalin_pacing_decisions: "节奏调整"
  RUS_stalin_pacing_decisions_desc: "对俄罗斯国策节奏进行一次性调整。"
  RUS_prevent_pacing_drag: "防止节奏拖沓"
  RUS_prevent_pacing_drag_desc: "将俄罗斯当前国策树中的所有国策完成时间减少7天。"
  RUS_prevent_pacing_drag_tt: "§C所有俄罗斯国策§!的完成时间减少§G7天§!。"
  RUS_stalin_red_army_dynamic_modifier: "工农红军"
  RUS_stalin_red_army_dynamic_modifier_desc: "在斯大林路线下，工农红军正在把革命战争经验与集中统一的军事建设结合起来。"
  RUS_stalin_red_army_supply_tt: "§Y$RUS_russian_army_soc$§!追加效果：\n补给消耗：§G-10.00%§!\n每项已完成的§Y处理陆军§!国策都会在该精神中追加§G+1.00%§!地形惩罚降低。"
  RUS_stalin_red_army_guard_tt: "§Y$RUS_russian_army_soc$§!追加效果：\n主动性：§G+25.00%§!\n陆军师组织度：§G+10.00%§!"
  RUS_stalin_red_army_basis_tt: "§Y$RUS_russian_army_soc$§!追加效果：\n装甲师攻击：§G+10.00%§!\n装甲师防御：§G+10.00%§!\n机械化攻击：§G+10.00%§!\n机械化防御：§G+10.00%§!"
  RUS_stalin_red_army_sword_tt: "§Y$RUS_russian_army_soc$§!追加效果：\n战争对稳定度惩罚修正：§G+20.00%§!\n旅规模：§G+1§!\nHP：§G+15.00%§!"
  RUS_stalin_red_army_terrain_focus_tt: "§Y$RUS_russian_army_soc$§!追加效果：地形惩罚降低：§G+1.00%§!"
