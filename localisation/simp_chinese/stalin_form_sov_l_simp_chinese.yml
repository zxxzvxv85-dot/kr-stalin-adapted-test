  RUS_aleksey_ustinov_leader_desc: "§Y生于：§!§L1885年3月15日；俄罗斯帝国、莫斯科省科尔孚诺§!\n§Y背景：§!§L阿列克谢·米哈伊洛维奇·乌斯季诺夫生于一个富裕的贵族家庭，受过良好的教育，但命运为他铺设了一条截然不同的道路。1902年，当时还是个富裕青年的乌斯季诺夫参与了革命活动，后来加入了社会革命党，从此再未回头。他在萨拉托夫组建了自己的社革党战斗组织，但随即被捕入狱，失去贵族身份，被迫流亡海外。世界大战期间，他在俄国战俘中组建了革命网络，准备发动大规模起义。1917年，起义的时机终于到来，他毫不犹豫地站在社革党的极左派一边，公开反对克伦斯基政府，并反对与资产阶级政党做出任何妥协。\n\n与其他左翼社革党人一样，乌斯季诺夫深入人民群众，成为了赫尔辛福斯（即赫尔辛基）革命水兵的杰出领袖。为了确保“革命走向最终阶段”，他和他的追随者们日益接近布尔什维克，最高纲领派与社革党其他派系的分歧也愈发明显。虽然他与最高纲领派和布尔什维克在诸多问题上存在分歧，但在最根本的问题上仍保持一致——那就是全力献身革命。\n\n内战中，乌斯季诺夫反对左翼社革党发动叛乱，并选择与布尔什维克并肩作战至最后一刻。内战结束后，最高纲领派仍以小规模游击组织的形式继续活动，他本人则在白罗斯、法国等地辗转流亡了很长时间。在此期间，他专注于领导流亡中的最高纲领派，并与列万多夫斯基的战斗组保持着紧密联系。\n\n在反思世界各国的革命后，他深刻意识到革命工农联盟的重要性。因此为了解决俄国长期存在的农村贫困问题，使基层贫农完成向农业工人的跨越，他创造性地提出了“集体农庄”的农村生产形式，并在共和国成立后带领贫农反抗地主与富农的压迫，并成功建立了数个示范区。正是他这种对反动派毫不留情的强硬态度，为他赢得了“穆罗梅茨”的美誉。§!\n\n备注:尽管他时常显露出傲慢自负的一面，但作为最高纲领派的唯一领袖，他仍是个富有奉献精神、能够领导并激励身边同志的伟大革命者。"
