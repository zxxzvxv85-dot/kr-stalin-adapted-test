l_simp_chinese:
 RUS_future_foreign_009_desc:0 "俄罗斯革命胜利后，土匪和地主们仍盘踞在中亚。他们不停挥动着马鞭，对我们的无产阶级同胞耀武扬威，我们绝不容忍此般闹剧在大草原上继续上演。"
 RUS_future_foreign_024_desc:0 "资产阶级民族国家的概念，对如今的革命有何意义？总有人想通过人为修订的边境线，来抹煞国际无产阶级间的长久友谊，新生的月即别劳工联邦将终结他们的一切妄想！"
 RUS_future_foreign_023_desc:0 "长远上看，建立一个广泛的无产阶级国家联盟自然是无比正确，但现实情况却不允许我们这样做——在中亚，小民族压迫着更小的民族，为了终结这乱局，我们将建立真正模范的社会主义民族国家！"
 RUS_future_foreign_009_intervention_tt:0 "我们将准备好对月即别地区的干涉。"
