l_simp_chinese:
  RUS_malformed_education_system: "畸形的教育模式"
  RUS_malformed_education_system_desc: "沙皇时代遗留下来的教育体系严重畸形，城市与少数精英占据了绝大多数教育资源，广大工人和农民只能在贫困与文盲中摸索生产。若不彻底改革教育，社会主义建设就会缺少最基础的人才土壤。"
  RUS_reforming_education_system: "改革中的教育模式"
  RUS_reforming_education_system_desc: "教育改革已经启动，但旧教育体系留下的效率低下与人才匮乏不会在一夜之间消失。一次性改革会打开新的改革方向，可重复改革总计最多执行§Y18§!次。"
  RUS_completed_education_reform: "圆满完成的教育改革"
  RUS_completed_education_reform_desc: "经过持续而广泛的改革，社会主义俄罗斯已经初步建立起面向工农群众的新教育体系。学校、培训班、文化队与工厂技术改造共同塑造了新一代建设者。"
  RUS_education_reform_status_tt: "§Y可重复教育改革次数§!：[?RUS_education_reform_repeat_count|Y0]/§Y18§!\n§Y正在执行的教育改革§!：[?RUS_education_reform_active_decisions|Y0]/§Y2§!"
  RUS_education_reform_completed_status_tt: "§G教育改革已经圆满完成。§!\n§Y可重复教育改革次数§!：[?RUS_education_reform_repeat_count|Y0]/§Y18§!"
  RUS_education_reform_focus_start_tt: "移除§Y$RUS_malformed_education_system$§!，开始§Y教育改革§!。"
  RUS_education_reform_active_slot_tt: "正在执行的教育改革决议少于§Y2§!项。"
  RUS_education_reform_repeat_limit_tt: "已完成的可重复教育改革少于§Y18§!次。"
  RUS_education_reform_cancel_if_ended_tt: "教育改革已经结束或中止。"
  RUS_education_reform_category: "教育改革"
  RUS_education_reform_category_desc: "社会主义建设需要新的教育体系。一次性改革会打开新的改革方向，可重复改革总计最多执行§Y18§!次。\n\n当前可重复改革次数：§Y[?RUS_education_reform_repeat_count|0]§!/§Y18§!\n正在执行的教育改革：§Y[?RUS_education_reform_active_decisions|0]§!/§Y2§!"
  RUS_edu_compulsory_education: "普及义务教育"
  RUS_edu_compulsory_education_desc: "教育不是特权，是每一个苏维埃公民的权利。长期以来，俄国的教育体系只服务于城市和少数精英阶层，广大的农村与工人阶级家庭的孩子，往往在学会认字之前就已经学会了握锄头和扳手。政府决定在全国范围内推行普及义务教育，让每一个适龄儿童都有学上、有书读。这不只是一项政策，更是一场面向未来的投资。"
  RUS_edu_build_rural_schools: "新建乡村学校"
  RUS_edu_build_rural_schools_desc: "仅仅有政策是不够的。政府将拨款在全国范围内新建乡村学校，配备基本的教材与教具，并确保每一所学校都有一名受过正规培训的教师。"
  RUS_edu_higher_education: "建设高等教育"
  RUS_edu_higher_education_desc: "一个没有高等教育的国家，只能永远跟在别人后面走。我们拥有广阔的领土、丰富的资源和勤劳的人民，但如果没有自己的工程师、农学家、医生和教师，这一切都只会沉睡在地下和田野里。政府将在主要城市建设一批新型高等教育机构，培养属于我们自己的专业人才——不是为旧阶级服务的“精英”，而是为建设社会主义服务的“骨干”。"
  RUS_edu_worker_peasant_courses: "工农培训课程"
  RUS_edu_worker_peasant_courses_desc: "高等教育不能只向旧知识阶层敞开大门。许多工人和农民在实际生产中积累了丰富的经验，却缺乏系统的理论知识；他们有改变现状的愿望，却缺少改变的工具。政府将在各大工厂和集体农庄开设工农培训课程，利用晚间和农闲时间，为有学习意愿的劳动群众提供基础理论和专业技能教育。这是一条从车间与田野通往讲台的阶梯——只要愿意走，没有人会被拦在门外。"
  RUS_edu_grassroots_cadres: "培养基层干部"
  RUS_edu_grassroots_cadres_desc: "政策再好，落不到基层就是空话。在农村，许多村庄甚至连一个能够读懂上级文件的人都没有——政策从省里传到县里，再从县里传到村里，往往只剩下一句“上面说要这么办”。政府将在各县设立基层干部培训班，从农村青年、退伍军人和优秀工人中选拔学员，进行政策解读、组织管理、纠纷调解等方面的系统培训。他们不需要成为理论家，但需要成为农民和工人信任的人——那个能够在一张纸上念出上面写了什么，并且让大家相信上面写的是真话的人。"
  RUS_edu_cadre_rotation: "干部轮训制度"
  RUS_edu_cadre_rotation_desc: "培训不是一次性的，而是一个持续的过程。基层干部在工作两到三年后，将分批返回培训中心进行轮训，更新知识、交流经验、解决工作中遇到的难题。轮训期间，学员不仅要学习新的政策法规，还要带来自己所在地区遇到的实际问题，在课堂上集体讨论解决方案，让教学与实际紧密结合，确保干部的能力随着时代的变化不断更新提升。"
  RUS_edu_cultural_propaganda: "扩大文化宣传"
  RUS_edu_cultural_propaganda_desc: "光有学校还不够，文化必须走进田间地头和工厂车间。在许多偏远的村庄，农民一辈子没有走出过方圆五十里，他们知道什么时候该播种、什么时候该收割，却不知道外面的世界已经变成什么样子——不知道拖拉机已经代替了木犁，不知道列宁格勒的工人和伏尔加河的农民正站在同一条战线上。政府将组织文化宣传队深入农村，带去书籍、报纸、电影放映机和简单的医疗知识。文化的意义不仅是识字，更是让每一个人都意识到：自己不是一个孤立的个体，而是一个伟大事业的一部分。"
  RUS_edu_production_technology: "改进生产技术"
  RUS_edu_production_technology_desc: "工厂的生产效率直接决定国家的建设速度。然而目前许多企业仍沿用旧时代的设备和工艺流程，浪费严重、产出低下，远远无法满足社会主义建设对工业品的迫切需求。改变这一现状的唯一出路，就是推动生产技术的全面改进——用更少的资源，造出更多更好的产品。"
  RUS_edu_streamlined_workshops: "精简生产车间"
  RUS_edu_streamlined_workshops_desc: "许多工厂的车间布局混乱、工序重叠，工人不得不在不同工位之间来回奔走，大量时间浪费在了无意义的移动和等待上。政府将组织技术专家对各地工厂的生产流程进行系统评估，合并冗余环节、优化工位配置、建立更合理的物料运输路线。精简不是减少人手，而是减少浪费——让每一双劳动的手都能用在最需要的地方。"
  RUS_edu_standardized_lines: "产线通用化"
  RUS_edu_standardized_lines_desc: "过去各工厂之间各自为政，同一类零件在不同厂家生产的规格互不通用，一旦设备损坏，就必须专门定制配件，维修周期长达数周乃至数月。政府将推行产线通用化标准，统一零部件的规格型号，使不同工厂之间的设备和配件可以相互替换。这不仅能大幅降低维修成本，还能在战时迅速实现产能转换——一条生产拖拉机的流水线，经过简单调整就能生产装甲车底盘。通用化，是效率，也是安全的保障。"
  RUS_education_reform_effect_compulsory_tt: "§Y$RUS_reforming_education_system$§!追加效果：\n科研速度：§G+2.00%§!\n基础生产效率：§G+5.00%§!\n解锁决议：§Y$RUS_edu_build_rural_schools$§!"
  RUS_education_reform_effect_rural_school_tt: "§Y$RUS_reforming_education_system$§!追加效果：\n科研速度：§G+1.00%§!\n可重复教育改革次数：§Y+1§!"
  RUS_education_reform_effect_higher_education_tt: "§Y$RUS_reforming_education_system$§!追加效果：\n科研速度：§G+3.00%§!\n基础生产效率：§G+5.00%§!\n解锁决议：§Y$RUS_edu_worker_peasant_courses$§!"
  RUS_education_reform_effect_worker_peasant_course_tt: "§Y$RUS_reforming_education_system$§!追加效果：\n科研速度：§G+2.00%§!\n军工机构经费获取：§G+2.00%§!\n生活消费品工厂系数：§R+3.00%§!\n可重复教育改革次数：§Y+1§!"
  RUS_education_reform_effect_grassroots_cadres_tt: "§Y$RUS_reforming_education_system$§!追加效果：\n生活消费品工厂系数：§R+5.00%§!\n政治点每日获取：§G+10.00%§!\n解锁决议：§Y$RUS_edu_cadre_rotation$§!"
  RUS_education_reform_effect_cadre_rotation_tt: "§Y$RUS_reforming_education_system$§!追加效果：\n每日政治点获取：§G+0.20§!"
  RUS_education_reform_effect_cultural_propaganda_tt: "§Y$RUS_reforming_education_system$§!追加效果：\n每日政治点获取：§R-0.30§!\n科研速度：§G+5.00%§!"
  RUS_education_reform_effect_production_technology_tt: "§Y$RUS_reforming_education_system$§!追加效果：\n生产效率增长：§G+10.00%§!\n解锁决议：§Y$RUS_edu_streamlined_workshops$§!、§Y$RUS_edu_standardized_lines$§!"
  RUS_education_reform_effect_streamlined_workshops_tt: "§Y$RUS_reforming_education_system$§!追加效果：\n生活消费品工厂系数：§G-1.50%§!\n可重复教育改革次数：§Y+1§!"
  RUS_education_reform_effect_standardized_lines_tt: "§Y$RUS_reforming_education_system$§!追加效果：\n基础生产效率：§G+2.00%§!\n政治点每日获取：§G+1.50%§!\n生活消费品工厂系数：§R+1.50%§!\n可重复教育改革次数：§Y+1§!"
