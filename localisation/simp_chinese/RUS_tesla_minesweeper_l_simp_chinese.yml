l_simp_chinese:
  RUS_tesla_minesweeper_category: "全俄罗斯电网故障排查"
  RUS_tesla_minesweeper_category_desc: "在§Y8×8§!电网中排查§Y10§!个故障节点。左键检查节点；数字表示周围八格中的故障数量，空白区域会自动展开。右键标记危险节点，再次点击已标记节点即可取消标记。\n\n完成第§Yx§!次连续排障时，将在随机地区建设§Yx§!座§C强化电网§!；每轮结束后冷却§Y60日§!。选择§Y特斯拉电气§!作为工业企业后可进行排查。"
  RUS_tesla_state_funding: "国家拨款特斯拉电气"
  RUS_tesla_state_funding_desc: "向§Y特斯拉电气§!拨付专项研发经费。"
  RUS_tesla_minesweeper_title: "全俄罗斯电网故障排查"
  RUS_tesla_minesweeper_board_desc: "排查8×8电网中的10个故障节点；空白区会自动展开，数字表示相邻故障数。"
  RUS_tesla_minesweeper_locked_desc: "§Y任命尼古拉·特斯拉为顾问§!或选择§Y特斯拉电气§!作为工业企业后解锁。"
  RUS_tesla_minesweeper_entry_desc: "打开全俄罗斯电网故障排查。\n\n§L工程师们正在全俄罗斯电网中定位故障节点、隔离短路区段，并组织线路抢修。§!"
  RUS_tesla_minesweeper_entry_category_desc: "§L定位故障节点，隔离短路区段并组织线路抢修。§!"
  RUS_tesla_minesweeper_status_ready: "§Y检修组待命§!"
  RUS_tesla_minesweeper_status_active: "§G电网排查进行中§!"
  RUS_tesla_minesweeper_status_won: "§G故障排除§!\n§L连胜[?RUS_tesla_minesweeper_win_streak|0]次 · 新增[?RUS_tesla_minesweeper_reward_grids|0]座§!"
  RUS_tesla_minesweeper_status_won_no_reward: "§G故障排除§!\n§L连胜[?RUS_tesla_minesweeper_win_streak|0]次 · 已全部覆盖§!"
  RUS_tesla_minesweeper_status_lost: "§R电网短路§!"
  RUS_tesla_minesweeper_reward: "§Y连续排障奖励§!\n连续完成第几轮排查，便会随机建设几座强化电网。"
  RUS_tesla_minesweeper_flags: "故障节点：10  标记：[?RUS_tesla_minesweeper_flags|0]/10"
  RUS_tesla_minesweeper_elapsed: "用时：[?RUS_tesla_minesweeper_elapsed_hours|0]小时"
  RUS_tesla_minesweeper_cooldown: "§Y设备检修：60日冷却中§!"
  RUS_tesla_minesweeper_start: "开始新一轮排查"
  RUS_tesla_minesweeper_start_tooltip: "划定一片新的8×8电网排查区域。每轮结束后设备需检修60日。"
  RUS_tesla_minesweeper_cell_tooltip: "§Y左键§!排查节点\n§Y右键§!标记危险节点\n§Y左键或右键已标记节点§!取消标记\n§L第一次排查必定安全。§!"
