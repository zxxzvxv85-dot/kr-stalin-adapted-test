 # ==================== 国策树导航 ====================
 GRU_shortcut_red_germany:0 "红德：重建阶段国策"
 # ==================== 民族精神（全流程唯一一条） ====================
 # 建政当天添加，第一次大选结束后移除
 GRU_collapsed_germany:0 "崩溃的德意志"
 GRU_collapsed_germany_desc:0 "战争结束了，帝国也结束了。留下的是一片工业与信用同时破产的土地：工厂缺少原料与订单，铁路缺少机车，城市缺少粮食，国家缺少能办事的人。重建不是一句口号，它是三张清单——经济、治安、民生——以及暗处不断破坏这些清单的敌人。"
 # ==================== 决议组 ====================
 GRU_reconstruction_work:0 "德意志重建工作"
 # ==================== 决议 ====================
 GRU_invest_economy:0 "投资经济重建"
 GRU_invest_economy_desc:0 "把停工的厂房、铁路与矿井重新点起来，国有、合作社与私人小厂一起开工。"
 GRU_tt_invest_economy_avail:0 "「经济」重建进度尚未达到 100%。\n当前进度：§Y[?GRU_bar_economy|0]%§!"
 GRU_invest_security:0 "投资治安重建"
 GRU_invest_security_desc:0 "扩充警察编制，修缮派出所与监狱，把街面上的秩序一寸一寸买回来。"
 GRU_tt_invest_security_avail:0 "「治安」重建进度尚未达到 100%。\n当前进度：§Y[?GRU_bar_security|0]%§!"
 GRU_invest_livelihood:0 "投资民生重建"
 GRU_invest_livelihood_desc:0 "修住宅、开诊所、发面包票。民生进度决定人们是否还愿意相信这个国家。"
 GRU_tt_invest_livelihood_avail:0 "「民生」重建进度尚未达到 100%。\n当前进度：§Y[?GRU_bar_livelihood|0]%§!"
 GRU_suppress_anarchist:0 "取缔无政府主义组织"
 GRU_suppress_anarchist_desc:0 "搜捕无政府主义者的印刷所与集会点，冻结他们的资金与人手。"
 GRU_tt_suppress_anarchist_avail:0 "「无政府主义暴乱」的影响力高于 0，仍有可取缔的组织。\n当前影响力：§R[?GRU_inf_anarchist|0]%§!"
 GRU_suppress_nationalist:0 "取缔民族主义团体"
 GRU_suppress_nationalist_desc:0 "查封退伍军人俱乐部与民族主义报纸，把煽动者送上法庭。"
 GRU_tt_suppress_nationalist_avail:0 "「民族主义煽动」的影响力高于 0，仍有可取缔的组织。\n当前影响力：§R[?GRU_inf_nationalist|0]%§!"
 GRU_suppress_royalist:0 "取缔保皇派密谋"
 GRU_suppress_royalist_desc:0 "清查旧军官、容克地主与霍亨索伦的旧部，掐断他们的钱与枪。"
 GRU_tt_suppress_royalist_avail:0 "「保皇派密谋」的影响力高于 0，仍有可取缔的组织。\n当前影响力：§R[?GRU_inf_royalist|0]%§!"
 GRU_hold_first_election:0 "召开第一次大选"
 GRU_hold_first_election_desc:0 "工厂重新开工，街巷恢复秩序，人民终于能够走向投票站，为重建后的共和国选出自己的代表。"
 GRU_tt_hold_first_election_avail:0 "任意两条重建进度达到 100%。\n当前：经济 §Y[?GRU_bar_economy|0]%§! ／ 治安 §Y[?GRU_bar_security|0]%§! ／ 民生 §Y[?GRU_bar_livelihood|0]%§!"
