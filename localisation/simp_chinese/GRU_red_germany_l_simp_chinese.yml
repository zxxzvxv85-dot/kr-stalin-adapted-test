 # ==================== 破坏事件的选项提示（带实时数字） ====================
 GRU_tt_crush_anarchist:0 "本次破坏不会造成进度损失。\n但镇压会激怒他们：「无政府主义暴乱」影响力 §R+2%§!（当前 §R[?GRU_inf_anarchist|0]%§!）。"
 GRU_tt_ignore_anarchist:0 "承受本次破坏：「治安」进度 §R-1~10%§!，「无政府主义暴乱」影响力 §R+4~8%§!。\n当前进度 §Y[?GRU_bar_security|0]%§!，当前影响力 §R[?GRU_inf_anarchist|0]%§!。"
 GRU_tt_crush_nationalist:0 "本次破坏不会造成进度损失。\n但镇压会激怒他们：「民族主义煽动」影响力 §R+2%§!（当前 §R[?GRU_inf_nationalist|0]%§!）。"
 GRU_tt_ignore_nationalist:0 "承受本次破坏：「民生」进度 §R-1~10%§!，「民族主义煽动」影响力 §R+4~8%§!。\n当前进度 §Y[?GRU_bar_livelihood|0]%§!，当前影响力 §R[?GRU_inf_nationalist|0]%§!。"
