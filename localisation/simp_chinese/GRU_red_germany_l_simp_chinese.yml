 # ==================== 事件 ====================
 GRU_reconstruction.1.t:0 "重建的每一天"
 GRU_reconstruction.1.d:0 "配给站的队伍、码头的装卸、警察局的报案簿——重建的进度就写在这些地方。而在看不见的地方，有人在等着它慢下来。"
 GRU_reconstruction.2.t:0 "街垒又立起来了"
 GRU_reconstruction.2.d:0 "无政府主义者在码头区纵火，烧掉了一整座配给粮仓，用啤酒桶和电车轨道垒起街垒。他们反对一切权威，包括我们的权威。传单正在工人中间散发，而损失已经发生。"
 GRU_reconstruction.2.a:0 "强力镇压"
 GRU_reconstruction.2.b:0 "不予理会"
 GRU_reconstruction.3.t:0 "有人在散发旧旗"
 GRU_reconstruction.3.d:0 "黑红金三色旗出现在市郊的酒馆与退伍军人俱乐部。民族主义者在失业工人中煽动：说是外国人和犹太人拿走了工作，说是社会主义者签下了投降书。这套说法在饥饿的人群里传得比真理快。"
 GRU_reconstruction.3.a:0 "强力镇压"
 GRU_reconstruction.3.b:0 "不予理会"
 GRU_reconstruction.4.t:0 "旧爵爷们的账本"
 GRU_reconstruction.4.d:0 "前帝国军官与容克地主的密谋被截获：他们在旧庄园里聚会，谈论复辟与国外的资助。他们不必上街——工厂的股权、铁路的债券与一半的粮食储备还在他们手里。"
 GRU_reconstruction.4.a:0 "强力镇压"
 GRU_reconstruction.4.b:0 "不予理会"
 GRU_reconstruction.5.t:0 "投票日"
 GRU_reconstruction.5.d:0 "选票已经印好，票箱已经封好。今天将决定谁来管理这个已经重建起来的国家。"
 GRU_reconstruction.6.t:0 "第一次大选"
 GRU_reconstruction.6.d:0 "投票率出乎意料地高。工人、农民、妇女排着长队，把选票投进票箱。没有哪个敌特组织有能力在这一天改变什么——两年多的重建，让这个国家第一次有了可以争论、可以分配的明天。"
 GRU_reconstruction.6.a:0 "人民做出了选择"
 GRU_reconstruction.7.t:0 "被渗透的选举"
 GRU_reconstruction.7.d:0 "计票到一半，人们发现有些选区的结果被动过手脚：无政府主义者的破坏、民族主义者的煽动、保皇派的钱，都混进了票箱。选举还是完成了，但没有多少人愿意相信这个结果。"
 GRU_reconstruction.7.a:0 "至少投票已经完成"
 GRU_reconstruction.10.t:0 "德意志的内战"
 GRU_reconstruction.10.d:0 "两个敌特组织的影响力都到了极点，他们不再需要躲在暗处。城市被街垒与铁轨切成两半，军队开始分化，命令从两个不同的地方发出——这是德国的第二次内战。"
 GRU_reconstruction.10.a:0 "我们只能继续打下去"
 GRU_reconstruction.99.t:0 "红德建立（调试指令）"
 GRU_reconstruction.99.d:0 "这条事件只会由控制台指令触发，正常游玩时不会出现。\n\n它把当前国家直接变成红德：换上「德意志社会主义共和国」的国名与配色、由德国共产党执政、移除占领政府精神、挂上「崩溃的德意志」、载入重建阶段国策树，并启动经济／治安／民生三条重建进度条。\n\n正常流程里红德会自己建立（由共产主义路线的俄罗斯统治、已停战的社会主义德国傀儡），所以只有在想直接看国策树或测试重建机制时才需要用到这条指令。"
 GRU_reconstruction.99.a:0 "开始重建"
 # ==================== 国策名与说明 ====================
 # 国策只推进重建进度，不再发放同名民族精神
 GRU_new_german_government:0 "德意志的新政府"
 GRU_new_german_government_desc:0 "旧帝国在废墟上签署了最后一份文件。新的政府从工人委员会里走出来，没有加冕，也没有礼炮。"
 GRU_the_predicament:0 "我们所面临的困境"
 GRU_the_predicament_desc:0 "胜利者要面对的问题比战败者更具体：工厂、粮食、罪犯，以及一千万个饥饿的胃。"
 GRU_collapsing_economy:0 "崩溃的经济"
 GRU_collapsing_economy_desc:0 "马克的价值以小时计算，工厂的烟囱冷得像墓碑。重建必须从清点废墟开始。"
 GRU_surging_crime:0 "飙升的犯罪率"
 GRU_surging_crime_desc:0 "军械流散民间，配给的黑市比官方商店更繁荣。旧秩序退场之后，暴力填补了它留下的空位。"
 GRU_peoples_livelihood:0 "人民的生活"
 GRU_peoples_livelihood_desc:0 "战争带走了丈夫、儿子和父亲，留下了寡妇、孤儿和伤残者。革命要回答的第一个问题是今晚吃什么。"
 GRU_gradual_reconstruction:0 "循序渐进的重建"
 GRU_gradual_reconstruction_desc:0 "一切按图纸来。先修铁路与电厂，再修厂房与住宅。慢，但每一步都踩在实处。"
 GRU_faster_and_cheaper:0 "多快好省"
 GRU_faster_and_cheaper_desc:0 "与其等待条件成熟，不如立刻掀开所有工地。口号是好的：多、快、好、省。"
 GRU_peoples_police:0 "人民警察"
 GRU_peoples_police_desc:0 "警察从街区的工人中产生，袖章是红的，人数很多，训练很少。"
 GRU_old_police_system:0 "启用旧警察系统"
 GRU_old_police_system_desc:0 "那些曾经逮捕过同志的人，如今被重新请回办公室。档案还在，经验还在，只是制服从黑换成了灰。"
 GRU_import_food_from_comrades:0 "从同志们那里进口食物"
 GRU_import_food_from_comrades_desc:0 "苏维埃的粮车越过边界，车厢里是黑面包和罐头。意识形态的友谊，最先从胃里被感受到。"
 GRU_disease_eradication:0 "消灭疾病运动"
 GRU_disease_eradication_desc:0 "斑疹伤寒、结核与饥饿性水肿，这些不拿枪的敌人，杀死的德国人比战争更多。"
 GRU_comfort_the_bereaved:0 "安抚阵亡士兵家属"
 GRU_comfort_the_bereaved_desc:0 "抚恤金不多，但发到手了。寡妇们拿着新的证件，第一次觉得自己没有被遗忘。"
 GRU_train_new_cadres:0 "培养新基层"
 GRU_train_new_cadres_desc:0 "从识字班和工厂夜校里挑选忠诚的年轻人，他们不懂治理，但服从命令。"
 GRU_social_democrat_bureaucrats:0 "任用社民党官僚"
 GRU_social_democrat_bureaucrats_desc:0 "旧社会民主党的公务员回来了，他们熟悉表格、预算和档案柜。革命需要他们，也不完全信任他们。"
 GRU_party_cells:0 "成立基层党组织"
 GRU_party_cells_desc:0 "每一个街区、每一座工厂、每一个村庄，都要有一个支部。它不一定掌权，但一定在场。"
 GRU_investigate_corruption:0 "彻查腐败"
 GRU_investigate_corruption_desc:0 "新的特权正在生长，速度比预想的快。必须在新阶级成形之前把它掐掉。"
 GRU_traditional_agriculture:0 "传统农业的美味才是王道"
 GRU_traditional_agriculture_desc:0 "黑面包、香肠、土豆与酸菜，这些东西救过一代人的命，不该被实验室取代。"
 GRU_industrial_food:0 "工业食品的方便才受大众喜爱"
 GRU_industrial_food_desc:0 "罐头与浓缩汤是双职工家庭的救星。城市选择了省时间的一方。"
 GRU_secret_report:0 "秘密报告"
 GRU_secret_report_desc:0 "一份只在内部宣读的文件，把上一代革命者的名字从墙上取了下来。"
 GRU_sweep_organized_crime:0 "全盘扫黑除恶"
 GRU_sweep_organized_crime_desc:0 "黑市、帮派与旧警察的残部纠缠在一起。要清理它们，只能用比它们更有组织的力量。"
 GRU_deal_with_underworld:0 "与当地黑道合作"
 GRU_deal_with_underworld_desc:0 "警察力量不够，但黑道愿意谈条件：他们交出武器，换取经营码头与酒馆的默许。"
 GRU_our_food_culture:0 "我们独特的饮食文化"
 GRU_our_food_culture_desc:0 "面包、香肠与啤酒没有消失，只是换了主人。工人阶级的餐桌，如今由自己划定规矩。"
 GRU_security_restored:0 "治安转好"
 GRU_security_restored_desc:0 "夜里的枪声变少了。人们在街上走，不必再贴着墙根。"
 GRU_new_berlin:0 "新柏林"
 GRU_new_berlin_desc:0 "废墟被清走，新的街区在旧街道的位置上站起来，线条笔直，窗户朝南。"
 GRU_follow_berlin_experience:0 "效仿柏林经验"
 GRU_follow_berlin_experience_desc:0 "柏林做成的样子，就是全国该有的样子。图纸、材料与工法，一并复制到每一座城市。"
 GRU_localized_reconstruction:0 "本地化重建"
 GRU_localized_reconstruction_desc:0 "每座城市有自己的砖、自己的河、自己的乡愁。规划师被要求先读书，再画线。"
 GRU_urbanization:0 "城市化"
 GRU_urbanization_desc:0 "工厂在哪里，人就到哪里。住房、电车与自来水，跟着烟囱一起生长。"
 GRU_modern_countryside:0 "现代农村"
 GRU_modern_countryside_desc:0 "拖拉机开进田里，电灯接进村口。农村不再只是城市的粮仓，也要是它的对手。"
 GRU_workers_welfare:0 "工人福利的落实"
 GRU_workers_welfare_desc:0 "八小时工作日、工伤赔偿与疗养院，这些写在纲领里的词，现在要写进账本。"
 GRU_cooperative_system:0 "合作社制度"
 GRU_cooperative_system_desc:0 "土地、农具和牲畜并入合作社，个人不再是农民，而是社员。"
 GRU_collective_agriculture:0 "集体化农业"
 GRU_collective_agriculture_desc:0 "田埂被推平，边界重新丈量。大规模的机器只在成片的土地上才有意义。"
 GRU_meat_eggs_milk:0 "肉蛋奶不能缺"
 GRU_meat_eggs_milk_desc:0 "没有肉和奶的社会主义，说服不了农民，也说服不了孩子。"
 GRU_more_police_funding:0 "加大警力投入"
 GRU_more_police_funding_desc:0 "警察的编制、装备与薪水同时提高。街头的威慑，从来都是需要用钱买的。"
 GRU_party_branch_in_coops:0 "合作社内的党支部"
 GRU_party_branch_in_coops_desc:0 "合作社不只是生产单位，也是组织单位。支部书记在麦收之后开党员大会。"
 GRU_mass_tractor_purchase:0 "批量采购拖拉机"
 GRU_mass_tractor_purchase_desc:0 "一次订单几千台，从东方和西方同时采购。钢铁优先供给履带，而不是炮塔。"
 GRU_spread_farming_knowledge:0 "传授先进农业经验"
 GRU_spread_farming_knowledge_desc:0 "农艺师带着土壤样本与良种走遍村庄，讲课的人坐在田埂上，听课的人蹲着。"
 GRU_special_police_units:0 "特种警察单位"
 GRU_special_police_units_desc:0 "为应对巷战、骚乱与武装团伙，组建一支装备精良、编制独立的快速反应力量。"
 GRU_state_discipline_committee:0 "国家纪律检查委员会"
 GRU_state_discipline_committee_desc:0 "它不指挥生产，也不指挥战斗，它只检查人。权力属于它，而它只对中央负责。"
 GRU_import_fertilizer_plants:0 "进口化肥厂"
 GRU_import_fertilizer_plants_desc:0 "比良种更见效的是化肥。整套设备从国外运来，连同图纸和工程师。"
 GRU_self_assessment:0 "自评共议"
 GRU_self_assessment_desc:0 "收成之后，全村坐下来评议每一位社员的劳动与思想。批评与自我批评，都在饭前进行。"
 GRU_state_security_ministry:0 "成立国家安全部"
 GRU_state_security_ministry_desc:0 "把秘密警察、反间谍与内部保卫合并为一个机构。它的档案室比党的会议室还大。"
 GRU_agriculture_committee:0 "农业与农村委员会"
 GRU_agriculture_committee_desc:0 "粮食、土地、农具与农民，从此由同一个委员会管理。"
 GRU_crush_enemy_agents:0 "暴力镇压敌特分子"
 GRU_crush_enemy_agents_desc:0 "对暗杀、破坏与叛乱，回答必须是整齐、迅速且不可逆的。"
 GRU_socialist_propaganda_rural:0 "在农村中宣传社会主义"
 GRU_socialist_propaganda_rural_desc:0 "电影放映队、流动剧团和扫盲班一起下乡。革命先要让人看得见，才能让人信。"
 GRU_batons_and_tear_gas:0 "警棍与催泪弹"
 GRU_batons_and_tear_gas_desc:0 "驱散人群的手段不必致命。城市需要的是秩序，不是尸体。"
 GRU_pistols_and_guillotine:0 "手枪与断头台"
 GRU_pistols_and_guillotine_desc:0 "对组织者与首恶，处理必须彻底。留下一个活口，就是留下一个火种。"
 GRU_compulsory_education:0 "义务教育与赤脚医生"
 GRU_compulsory_education_desc:0 "每个村庄有学校，每个学校走出一批识字的青年；每个乡镇有诊所，医生背着药箱翻山。"
 GRU_army_crushes_mutiny:0 "军队镇叛"
 GRU_army_crushes_mutiny_desc:0 "当警察不足以恢复秩序时，成建制的部队与火炮就会被调进城市。"
 GRU_no_emperor:0 "没有皇帝"
 GRU_no_emperor_desc:0 "霍亨索伦的旗帜已经从所有公共建筑上取下。皇帝不再是一个政治选项。"
 GRU_no_masters:0 "没有老爷"
 GRU_no_masters_desc:0 "容克、地主与旧官僚的姓氏，从通讯录里消失了。土地属于耕种它的人。"
 GRU_no_lord:0 "没有主"
 GRU_no_lord_desc:0 "在天与地之间，不再有中间人。人只对自己和集体负责。"
 GRU_cure_the_sick:0 "治病救人？"
 GRU_cure_the_sick_desc:0 "对参与了叛乱的工人与士兵，先治病，再谈话。绝大多数人是可以被改造的。"
 GRU_root_out_the_trouble:0 "永绝后患？"
 GRU_root_out_the_trouble_desc:0 "首恶必办，胁从不问——但谁算首恶，由不得他们自己说。"
 GRU_war_on_religion:0 "对宗教宣战"
 GRU_war_on_religion_desc:0 "教会的土地、学校与出版机构被收归国有。新的国家不允许存在另一个组织中心。"
 GRU_happy_new_life:0 "快乐与崭新的生活"
 GRU_happy_new_life_desc:0 "孩子们上学，工人们下班后去看电影，广场上有音乐。这是革命承诺给所有人的生活。"
 GRU_jesus_utopian_socialist:0 "耶稣是个空想社会主义者！"
 GRU_jesus_utopian_socialist_desc:0 "把他从教会手里抢回来：他是穷人的先知，是第一个共产主义者，而不是罗马的朋友。"
 GRU_uproot_catholicism:0 "拔除天主教毒草"
 GRU_uproot_catholicism_desc:0 "天主教组织网络遍布乡村，与旧的乡村权力捆在一起。要铲除旧势力，先铲除它的根。"
 GRU_womens_rights_movement:0 "煽动妇女平权思潮"
 GRU_womens_rights_movement_desc:0 "妇联、女工委员会与托儿所同时铺开。妇女从家庭中走出，进入工厂与会议室。"
 GRU_prepare_first_election:0 "筹备第一次大选"
 GRU_prepare_first_election_desc:0 "选票、选区与候选人名单开始印制。这场选举只有一个问题：谁来管理已经建成的国家。"

 # 测试版整合：政党、重建账目与决议效果
 GRU_red_communist_party:0 "德国共产党"
 GRU_red_communist_party_long:0 "德国共产党（Kommunistische Partei Deutschlands）"
 GRU_reconstruction_work_desc:0 "战争留下的废墟仍在等待清理。经济、治安与民生的恢复，将决定共和国能否站稳脚跟。\n\n§Y重建进度§!\n经济重建：§Y[?GRU_bar_economy|0]%§!\n治安重建：§Y[?GRU_bar_security|0]%§!\n民生重建：§Y[?GRU_bar_livelihood|0]%§!\n\n§Y破坏势力影响力§!\n无政府主义者：§R[?GRU_inf_anarchist|0]%§!\n民族主义者：§R[?GRU_inf_nationalist|0]%§!\n保皇派：§R[?GRU_inf_royalist|0]%§!\n\n任意两项重建达到 §Y100%§! 后，可以召开第一次大选；任意破坏势力影响力超过 §R80%§! 会干扰选举，任意两派达到 §R100%§! 将引发内战。"
 GRU_suppress_anarchist_effect_tt:0 "无政府主义者影响力：§G-10%§!"
 GRU_suppress_nationalist_effect_tt:0 "民族主义者影响力：§G-10%§!"
 GRU_suppress_royalist_effect_tt:0 "保皇派影响力：§G-10%§!"


 # ==================== 红德后续路线 ====================
 GRU_shortcut_hitler_line:0 "红德：希特勒线国策"
 GRU_reconstruction.8.t:0 "民族派的德意志"
 GRU_reconstruction.8.d:0 "计票结果公布的那个晚上，民族主义煽动的组织者站到了台前：他们不打碎票箱，他们宣布票箱里装的正是他们的胜利。军警没有阻拦，工人纠察队里有人开始鼓掌，而党的机关收到了新的名单——重建委员会变成了革命的法庭。\n\n「崩溃的德意志」就此结束：这个国家不再需要重建，它需要的是方向。一份新的国策纲领被摆上桌面，封面上写着两个名字。"
 GRU_reconstruction.8.a:0 "德国，走向新的道路"
 GRU_reconstruction.97.t:0 "希特勒线（调试指令）"
 GRU_reconstruction.97.d:0 "这条事件仅用于控制台测试。尚在重建时，它会完成基础收尾、移除“崩溃的德意志”，并载入包含 42 项国策的后续路线；已经完成第一次大选时，它只切换国策树，不会重复发放大选奖励。已经进入后续路线时，再次调用不会清空该路线的国策进度；内战国家与叛军不能使用。\n\n正常入口：首次大选结算时，“民族主义煽动”影响力高于 80%。"
 GRU_reconstruction.97.a:0 "载入希特勒线"
 GRU_national_revolution:0 "德意志民族的革命"
 GRU_national_revolution_desc:0 "革命不再是别人的事业。它从德国自己的伤口里长出来：战败、饥饿与被出卖的和平。"
 GRU_yes_chancellor:0 "是，总理！"
 GRU_yes_chancellor_desc:0 "国会把权力交到总理手里——连同它自己。掌声退去后，德国只剩一个声音。"
 GRU_aristocrats_unforgivable:0 "贵族不可饶恕"
 GRU_aristocrats_unforgivable_desc:0 "容克与旧贵族的名字从一切名单上划去：军队、庄园、银行、大学。他们曾拥有一切，现在什么都不该有。"
 GRU_abolish_officer_corps:0 "取消军官制"
 GRU_abolish_officer_corps_desc:0 "军衔与出身一道废除。将军与士兵在同一张桌子上判断命令是否值得服从。"
 GRU_smash_old_state:0 "坚定的打碎旧国家机器"
 GRU_smash_old_state_desc:0 "旧的部、旧的法、旧的官：统统拆开重组。新国家不需要继承旧国家的耐心。"
 GRU_check_three_generations:0 "往上查三代"
 GRU_check_three_generations_desc:0 "忠于谁、出身何处、战争那些年在哪里——档案一条条翻出来，谁也藏不住。"
 GRU_national_revolution_own:0 "本民族的革命"
 GRU_national_revolution_own_desc:0 "它不是莫斯科派来的，也不该由柏林以外的任何人审判：德意志的革命由德意志人完成。"
 GRU_international_revolution:0 "国际的革命"
 GRU_international_revolution_desc:0 "一个国家的革命守不住自己：要么让旗帜插遍欧罗巴，要么被欧罗巴围死。"
 GRU_crown_and_guillotine:0 "皇室与断头台"
 GRU_crown_and_guillotine_desc:0 "霍亨索伦的王冠被抬上断头台，不是为了处决一个人，而是为了处决一种可能性。"
 GRU_anti_party_is_counterrevolution:0 "反党反苏就是反革命"
 GRU_anti_party_is_counterrevolution_desc:0 "纪律只有一条：党与苏联不容议论。越出这条线的，不论动机，都是敌人。"
 GRU_proletarian_germany:0 "无产阶级的德意志"
 GRU_proletarian_germany_desc:0 "工人、农民、士兵——德意志的主体第一次与国家的名字重合。民族与阶级，就此合流。"
 GRU_anti_communism_is_anti_germany:0 "反共反民主就是反德意志"
 GRU_anti_communism_is_anti_germany_desc:0 "旧世界的两种口音：一种骂我们赤色，一种骂我们独裁。听起来不同，做的事一样。"
 GRU_critique_of_moderates:0 "“温和派”的批判"
 GRU_critique_of_moderates_desc:0 "改良派、调和派、什么都赞成一半的派：革命最危险的敌人从来不是反对者，而是朋友里的折扣。"
 GRU_german_style_democracy:0 "德意志的特色民主"
 GRU_german_style_democracy_desc:0 "民主保留下来——以德意志的方式：一个政党、一个纲领、一个声音的民主。"
 GRU_bureaucratic_opposition:0 "官僚反对派的初露头角"
 GRU_bureaucratic_opposition_desc:0 "机关里的老文书们开始用规章对抗方向：他们没有旗帜，只有拖延、推诿与一抽屉的旧公章。"
 GRU_end_of_american_liberalism:0 "美式自由主义的终结"
 GRU_end_of_american_liberalism_desc:0 "美元、贷款、自由市场的神话随旧政权一起清算。德国不再向大西洋另一边解释自己。"
 GRU_great_purge:0 "大清洗"
 GRU_great_purge_desc:0 "名单从机关一直排到军营。清洗之后，国家轻了，也静了。"
 GRU_fuhrer_of_the_people:0 "总理？人民的元首！"
 GRU_fuhrer_of_the_people_desc:0 "头衔不是升级，是定性：总理是职务，元首是意志。德国从此不再分这两样东西。"
 GRU_germany_holy_land_of_revolution:0 "德意志，革命的圣地"
 GRU_germany_holy_land_of_revolution_desc:0 "巴黎与莫斯科都曾以为革命属于他们。新的圣地要由莱茵河畔的工厂与军营来定义。"
 GRU_europes_three_best_friends:0 "欧罗巴三个最好的朋友"
 GRU_europes_three_best_friends_desc:0 "三个、五个、还是七个——朋友的数量取决于地图的颜色，而不是酒杯里的祝词。"
 GRU_russia_our_teacher:0 "俄罗斯，德意志的老师"
 GRU_russia_our_teacher_desc:0 "两个大陆国家，同样的伤口，同样的药方。老师的经验免费，学生的学费是国家。"
 GRU_france_our_friend:0 "法兰西，我们的挚友"
 GRU_france_our_friend_desc:0 "从色当到凡尔登，仇恨写了两代人的历史。现在轮到工程师与委员们重新画一遍。"
 GRU_britain_captain_of_europe:0 "不列颠，欧罗巴的船长"
 GRU_britain_captain_of_europe_desc:0 "岛国生来怕被围，除非它能站在围栏的这一边指挥。给它一个体面的位置，它就体面。"
 GRU_america_son_of_the_new_world:0 "美利坚，新大陆的团结之子"
 GRU_america_son_of_the_new_world_desc:0 "大西洋够宽，容得下两个互不拆台的新国家。前提是华尔街学会不越洋点菜。"
 GRU_china_gendarme_of_the_east:0 "中国，东方的革命宪兵"
 GRU_china_gendarme_of_the_east_desc:0 "一张地图上只有两支队伍：被旧世界剥削的，和剥削别人的。远东的同伴越强，欧罗巴的压力越小。"
 GRU_who_is_mussolini:0 "谁是墨索里尼？"
 GRU_who_is_mussolini_desc:0 "罗马那位曾经定义什么叫“对的人”的人，如今只是历史脚注。新时代不再需要他的修辞。"
 GRU_hail_great_stalin:0 "万岁，伟大的斯大林！"
 GRU_hail_great_stalin_desc:0 "第三国际不再有争论，只有致敬：伟大的导师、伟大的舵手、伟大的同志。"
 GRU_marx_prophet_of_germany:0 "马克思，德意志的骄傲与先知"
 GRU_marx_prophet_of_germany_desc:0 "他从特利尔的图书馆出发，绕了地球一圈，如今由德国替他把结论写完。"
 GRU_lenin_hero_and_martyr:0 "列宁，伟大的英雄与殉道者"
 GRU_lenin_hero_and_martyr_desc:0 "一个把理论变成国家的人。有人希望他安息，可他留下的方法从不安息。"
 GRU_zinoviev_traitor:0 "季诺维也夫，叛徒与野心家"
 GRU_zinoviev_traitor_desc:0 "曾经最接近领袖位置的几个人，被逐出名单的比留在名单上的更替大家上了一课。"
 GRU_kautsky_bernstein_revisionists:0 "考茨基与伯恩施坦，投机者与修正主义"
 GRU_kautsky_bernstein_revisionists_desc:0 "他们的书早就不再翻开，但要在每一本新教科书里替他们写好结论。"
 GRU_hitler_father_of_germany:0 "希特勒，德意志的慈父"
 GRU_hitler_father_of_germany_desc:0 "他曾经咒骂赤旗，如今赤旗上的名字里有他。国家的父亲，也是革命的养子——两者都不再重要，只有国家。"
 GRU_hitler_and_stalin:0 "希特勒与斯大林"
 GRU_hitler_and_stalin_desc:0 "照片上两个人握手，标题写着划时代。历史暂时不发表意见。"
 GRU_attack_revisionism:0 "抨击修正主义"
 GRU_attack_revisionism_desc:0 "两党的讲坛同时转向：修正主义是唯一还在生长的敌人，因为它长在革命内部。"
 GRU_army_purge:0 "军队清洗"
 GRU_army_purge_desc:0 "军装与党证一起翻检：昨天的战功不能抵扣今天的忠诚。"
 GRU_camps_for_the_guilty:0 "集中营，让罪人们洗去罪孽"
 GRU_camps_for_the_guilty_desc:0 "铁丝网围起的不是惩罚，而是教材：让每个人明白罪孽的清算可以不经过法庭。"
 GRU_jews_friends_of_germans:0 "犹太人是日耳曼人的朋友"
 GRU_jews_friends_of_germans_desc:0 "新的教义把旧的仇恨翻了个面：种族学说被丢进垃圾堆，取而代之的是“劳动者不分血统”。"
 GRU_hail_stalin_hail_hitler:0 "Hail Stalin! Hail Hitler!"
 GRU_hail_stalin_hail_hitler_desc:0 "两场运动的仪式合为一场：同一面旗帜下，两种口号的呼吸被调成同一个节拍。"
 GRU_european_communist_union:0 "欧罗巴共产主义联盟提案"
 GRU_european_communist_union_desc:0 "一份递交给东方的提案：让欧洲的支部们学会用同一个调子说话，再决定谁先领桨。"
 GRU_roman_nostalgia:0 "掀起罗马情怀"
 GRU_roman_nostalgia_desc:0 "从莱茵河到台伯河，从军团大道到新建筑群：帝国的形式学回来，教义换一套。"
 GRU_unite_europe:0 "欧洲一统之夙愿"
 GRU_unite_europe_desc:0 "把地图当作一份待完成的图纸：关税、铁路、货币、语言，全都指向同一句口号。"
 GRU_hitler_augustus:0 "希特勒·奥古斯都"
 GRU_hitler_augustus_desc:0 "一个新时代的名字落定：赤色的旗、罗马的形、德意志的手。历史在等它自己证明自己。"

 # 红德后续路线人物；架空背景按用户原文录入。
 GRU_adolf_hitler:0 "阿道夫·希特勒"
 GRU_adolf_hitler_leader_desc:0 "§Y生于：§!§L1889年4月20日；奥地利帝国 上奥地利大公国 布劳瑙因河畔§!\n§Y背景：§!§L阿道夫·希特勒的前半生，可以说与革命毫无关系。奥匈帝国海关职员的儿子，林茨和维也纳的失意画徒，1913年迁居慕尼黑时不过是一个逃避兵役的落魄青年。战争改变了他——但并非以人们通常以为的方式。四年西线堑壕，两次负伤，铁十字勋章。1918年帝国胜利时，他躺在医院里，听到的不是凯旋的钟声，而是慕尼黑街头士兵委员会的喧哗。\n\n待他痊愈后，军方便马不停蹄地派他去监视赤色分子在慕尼黑的地下网络。他自述，这是他革命生涯的开始。\n\n没有人确切知道那几个月里他经历了什么。但1919年，他出现在德国社会民主党左翼的集会中，以一名退伍兵的身份讲述前线士兵如何被军官团出卖、被容克遗忘。他的演讲有一种粗粝的感染力——不同于那些高高在上的理论家，他更清楚工人阶级究竟想要一个怎样的德意志。同年，他加入斯巴达克同盟，次年随激进派并入德国共产党。\n\n1923年，德国社会民主党重新统一，他激烈反对。在他看来，与那些“坐在内阁里和军官团碰杯的人”重新联合，是对九月起义死者的背叛，更是对革命的羞辱。此后十余年间，他作为联络员来往于德法两国革命者之间，在工人区的地下印刷所和边境接头点之间辗转，积累了广泛的人脉，也磨出了一套属于自己的语言——简单、锋利、直指人心。1936年的鲁尔大罢工中，阿道夫·希特勒的名字第一次出现在德国全国性报刊上——他极具煽动性的演讲，几乎在一夜之间就让鲁尔区陷入狂热。\n\n新俄罗斯革命胜利时，大部分德国革命者都将其视为远方同志的又一场胜利，但阿道夫不同。他更倾向于将它视作新革命对自己的召唤——一个更激进、更彻底、更不容妥协的德意志革命，正等待着他去点燃。他加入了新生的德国统一社会党，很快便凭借出色的组织能力赢得了党内许多同志的支持。\n\n在共和国的选举中，阿道夫振聋发聩的演讲和堪称极端的革命态度，使他的民粹派遥遥领先于党内其他派系。尽管仍然有人质疑他对国际工人事业的态度，但他对革命的忠贞毋庸置疑。§!\n\n§R“当一个人能为理想而活，他便会明白生命的真谛。”§!"

