  RUS_long_event_continue: "继续"
  russia_socialist_events.3.b: "多讲讲社会革命党。"
  russia_socialist_events.1437.t: "社会革命党现状"
  russia_socialist_events.1437.d: "目前，在现实压力下“重归于好”的社会革命党已明显分化为两大主要派系。\n\n左翼方面，是以玛利亚·斯皮里多诺娃为首的民粹派。他们延续了第一次内战前左翼社会革命党的传统，仍高擎“土地与自由”的旗帜，主张立即将地主土地无偿划归村社和贫农委员会，并恢复工人对工厂的监督权。\n\n右翼方面，则由已故领袖维克托·切尔诺夫的长期副手——弗里德里希·里希特领衔的民主派所代表。这一派自视为切尔诺夫“建设性社会主义”的正统继承者，主张依托地方自治局、合作社和合法报刊，逐步重建民主制度。与民粹派的激进直接相比，民主派更侧重程序规范、教育启蒙和地方自治，对议会民主怀有深切的向往。\n\n两派之外，还散布着若干小派系。其中，由皮季里姆·索罗金组建的公民派，活跃于两派之间，持社会民主主义与温和实用主义立场。该派人数虽寡，却多集中于大学讲坛、地方合作社与统计机构，善于借助社会调查、成人教育和合作信贷等手段，在基层社会中潜移默化地积累影响力。\n\n然而，在当今俄罗斯政坛，最引人瞩目的却是一个非主流派别——以阿列克谢·乌斯季诺夫为灵魂人物的最高纲领派（党内建制派的会议中常把他们称为“农业布尔什维克分子”）。该派在第一次内战期间便以布尔什维克坚定盟友的身份扬名；白色俄罗斯胜利后，其多数成员被编入战斗组，流徙于中西伯利亚地区，并在那里试行乌斯季诺夫的集体农庄制度。如今，随着红旗再度凯旋，最高纲领派虽仍不受社会革命党建制派的认可，但其声望却与日俱增。"
  russia_socialist_events.1437.a: "“……它会在未来的某个时刻结出果实，哪怕你已无法看见。”"
