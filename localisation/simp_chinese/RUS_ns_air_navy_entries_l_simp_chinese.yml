 RUS_ns_evaluate_VVFR: "评估俄罗斯空军"
 RUS_ns_evaluate_VVFR_desc: "俄罗斯空军(Voyenno-Vozdushny Flot Rossii)自1929年以来已经成为了独立的军种，在过去几年间已经从一支小型的轰炸机支援编队变为了一支实力雄厚的部队。然而，还有许多问题需要解决，比如替换掉过时的、进口的飞机以及重组空军指挥部。"
 RUS_ns_inspect_VMFR: "评估俄罗斯海军"
 RUS_ns_inspect_VMFR_desc: "俄罗斯海军(Voyenno-Morskoy Flot Rossii)曾在俄国内战与接踵而至的经济危机中大受打击。尽管有所恢复，目前的海军规模仍与旧帝国舰队相去甚远。但海军部一直在不懈地筹备改革计划，希望一转俄罗斯海军的颓势。"
