 RUS_future_foreign_policy_events.10.t:0 "华沙起义"
 RUS_future_foreign_policy_events.10.d:0 "凌晨01:15，华沙普拉加区军械库传出剧烈爆炸声。由波兰共产党（MKP）联合工会联盟（ZZZ）及流亡莫斯科的波兰革命委员会发动的武装起义正式开始。起义者切断了通往维也纳车站的电话线，占领了铁路局和旧城区电车站。\n\n起义军主力约三千人，由工人卫队和倒戈的波兰国防军士兵组成。他们手持步枪与轻机枪，在克拉科夫大道建立街垒。凌晨02:40，起义者攻入华沙市政厅，解除了守卫武装。03:15，起义军占领国家电台。波兰临时政府首脑§b[POL.GetRUSWarsawHeadOfGovernment]§!被抓获，关押在波兰银行地下室。\n\n德意志帝国驻波兰军事代表团紧急宣布全城戒严。德国驻华沙军队司令冯·贝塞勒下令装甲车部队开进剧院广场。上午05:20，德军装甲车在莫科托夫区遭到起义军反坦克瓶和交叉火力阻击，两辆装甲车被焚毁，残部退入西郊兵营。\n\n上午06:00，波兰社会党（PPS）发表声明，支持起义，呼吁工人总罢工。基督教民族联盟（ChZJN）宣布保持中立。奥地利帝国领事馆关闭大门，奥匈驻军未采取行动。\n\n07:30，起义者控制维斯瓦河上两座桥梁。§b[POL.GetName]§!政府残余内阁撤至拉齐维乌宫。德国军事代表团向柏林发送紧急电报，请求增援。\n\n08:00，波兰革命委员会通过电台宣读《告波兰人民书》，宣布废除君主制，退出帝国公约，建立波兰苏维埃共和国。号召波兹南、利沃夫等地立即发动总罢工和武装起义。"
 RUS_future_foreign_policy_events.10.a:0 "波兰人的枷锁终究由自己摘落"

 RUS_future_foreign_policy_events.11.t:0 "箭在弦上"
 RUS_future_foreign_policy_events.11.d:0 "起初不过是城中的一场野猫罢工，如今已经演变成席卷华沙的大动荡。纺织厂的工人率先走出车间，电车司机熄了火，面包房的烤炉冷了下去。到第三天，华沙的各大工厂区已连成一片，街垒在工人区与市中心之间拔地而起。人们高举的旗帜上，除了波兰工人运动的旧徽，还出现了新的字样——“土地、面包、自由”。\n\n德意志帝国的总督府起初并不在意。在华沙驻扎的帝国军队足够镇压任何骚乱。但当游行队伍从布拉格区向市中心推进时，总督发现，军队的调动出现了异常——波兰籍的士兵在接到命令后，动作迟缓，甚至有人拒绝向人群举枪。\n\n与此同时，波兰革命委员会的传单出现在每一个街角。他们呼吁工人成立代表会议，呼吁农民拒绝向驻军缴纳粮食。更令柏林不安的是，一些地方的铁路工人已经开始拦截运往德国的专列。华沙的夜空被大火映红，枪声与歌声混杂在一起，从维斯瓦河畔一直传到郊外的工人区。\n\n留给革命者谨慎抉择的时间已经不多——是否应该领导群众的罢工？华沙城中的党组织是否能够妥善应对未来可能的突发情况？各地方又能否及时响应？"
 RUS_future_foreign_policy_events.11.a:0 "让我们大胆地举起我们的红旗！"
 RUS_future_foreign_policy_events.11.a_tt:0 "即使人们的明天如此渺茫……\n局面至此，已是山雨满楼，华沙起义即将开始——我们对战争的准备度将决定波兰地方能否响应首都的革命。"

 RUS_future_foreign_policy_events.12.t:0 "卢布林骚动"
 RUS_future_foreign_policy_events.12.d:0 "我们对波兰革命的官方资助，使波兰革命者拥有了更多的可发挥空间。过去几个月里，从边境秘密通道流入的经费与印刷设备，已在卢布林、凯尔采和热舒夫等地悄然生根。地下印刷所开始定期出版《工人之声》，传单出现在工厂门口、军营食堂和乡村集市上。波兰革命委员会利用这笔资金，在铁路工人中建立了联络网，在矿区和纺织厂里恢复了被破坏的基层组织。\n\n华沙方面并非毫无察觉。警察局的密探开始频繁出现在卢布林的工人区，逮捕和搜查的消息不断传出。但每一次镇压，都伴随着更大规模的抗议——上周，卢布林机车厂的工人为抗议逮捕三名同志而自发罢工，随即蔓延至全市电车和市政工人。政府调来了骑警，但面对数千名堵在厂门口的工人，他们最终没有动手。"
 RUS_future_foreign_policy_events.12.a:0 "时机正在酝酿。"
 RUS_future_foreign_policy_events.12.a_tt:0 "Всеобщая вера в революцию есть уже начало революции.\n对革命的普遍信仰已是革命的开始。"
