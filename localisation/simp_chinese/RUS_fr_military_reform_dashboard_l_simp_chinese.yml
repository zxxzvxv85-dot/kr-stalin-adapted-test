 RUS_fr_dashboard_stage_3_tt:0 "§Y第三阶段：训练体系与战役协同§!\n通过轮训、军校和演习，把纸面条令转化为各军区能够共同执行的作战方法。"
 RUS_fr_dashboard_stage_4_tt:0 "§Y第四阶段：全国实兵检验§!\n以大规模野外试验检验动员、补给、通信和新编部队，完成基础改革的最后定型。"
