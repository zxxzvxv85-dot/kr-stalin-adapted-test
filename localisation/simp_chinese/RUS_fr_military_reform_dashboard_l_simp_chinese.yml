 RUS_fr_dashboard_stage_1_tt:0 "§Y第一阶段：指挥体系整肃§!\n重新审查军官档案，清除潜伏网络，并恢复从中央到基层的基本号令。\n\n花费：£army_experience §Y[?RUS_fr_xp_cost_100|1]§!\n用时：§Y120日§!\n前提：完成国策§Y军队整肃§!\n\n§G条件满足时，点击图标启动本阶段改革。§!"
 RUS_fr_dashboard_stage_2_tt:0 "§Y第二阶段：编制与军政关系定型§!\n统一营连建制，厘清指挥员、政治机关与士兵组织之间的职责边界。\n\n花费：£army_experience §Y[?RUS_fr_xp_cost_100|1]§!\n用时：§Y120日§!\n前提：完成§Y第一阶段§!及国策§Y统一军政体制§!\n\n§G条件满足时，点击图标启动本阶段改革。§!"
 RUS_fr_dashboard_stage_3_tt:0 "§Y第三阶段：训练体系与战役协同§!\n通过轮训、军校和演习，把纸面条令转化为各军区能够共同执行的作战方法。\n\n花费：£army_experience §Y[?RUS_fr_xp_cost_100|1]§!\n用时：§Y90日§!\n前提：完成§Y第二阶段§!及国策§Y全国军事改革纲领§!\n\n§G条件满足时，点击图标启动本阶段改革。§!"
 RUS_fr_dashboard_stage_4_tt:0 "§Y第四阶段：全国实兵检验§!\n以大规模野外试验检验动员、补给、通信和新编部队，完成基础改革的最后定型。\n\n花费：£army_experience §Y[?RUS_fr_xp_cost_100|1]§!\n用时：§Y90日§!\n前提：完成§Y第三阶段§!及国策§Y全国军事改革纲领§!\n\n§G条件满足时，点击图标启动本阶段改革。§!"
