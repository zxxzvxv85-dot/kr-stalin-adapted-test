  russia_socialist_events.73.t: "The Maximalists of the Socialist-Revolutionary Party"
  russia_socialist_events.73.d: "The Maximalists are one of the most radical factions within the Socialist-Revolutionary Party, with roots reaching back to pre-revolutionary Russia. The faction takes its name from the manifesto The Revolutionary Maximalist Programme — Communism, written by Alexei Ustinov. More than a statement of principles, the document has to a considerable extent become the faction's political declaration.\n\nDuring the Revolutionary War, the Maximalists allied themselves with the Bolsheviks and forged a close working relationship on their shared battlefields. They did not disband after the war, instead becoming a partisan organisation that remained active at the grassroots. Through long years underground, they preserved both their organisational integrity and their will to fight. Now, as the political climate changes, this force has resurfaced and is rapidly growing.\n\nAs a resurgent force, the Maximalists are fundamentally closer to revolutionaries than to Socialist-Revolutionaries in the traditional sense. Their political language, organisational methods, and logic of struggle have far more in common with the Bolsheviks, leaving them with a distinct identity within the Socialist-Revolutionary Party.\n\nWithin the leadership, Alexei Ustinov is widely regarded by the membership as its spiritual leader, and the theoretical framework established in his writings remains the ideological foundation of the faction. Practical organisation and everyday affairs, meanwhile, are handled by Andrei Kolegayev. Their relationship, at once that of teacher and student and of close comrades, forms the Maximalists' strongest political bond. It is this mutually reinforcing structure that has enabled the faction to preserve the distinctive vitality of a revolutionary party through years of adversity.\n\nThe Maximalists' political programme differs sharply from that of traditional Socialist-Revolutionaries. In principle, they reject the peasantry's independent historical role as a ‘transitional class’ in the revolutionary process, regarding it as inherently wavering and limited. In practice, however, they accept the revolutionary purpose of the poor peasantry as an instrument of transformation: poor peasants can be mobilised, organised, and guided towards socialist transformation. Consequently, awakening the class consciousness of agricultural workers and organising them is explicitly identified as one of the faction's central policy objectives."
  russia_socialist_events.73.a: "The finest allies of the social revolution!"
  russia_socialist_events.3.t: "The Socialist-Revolutionaries Reunited"
  russia_socialist_events.3.d: "The history of the Socialist-Revolutionary Party is one of ceaseless division and reunion. Its most recent great schism followed the death of Viktor Chernov, whose passing tore open fissures that had long existed within the party. In his wake, Boris Savinkov subjected the right wing to an almost ruinous purge, consigning many cadres once regarded as the ‘backbone of the party’ to lists of traitors. Meanwhile, the left was driven underground and forced back into the mode of survival it knew best, and bore most heavily: terrorism.\n\nToday, the Socialist-Revolutionaries have once again assumed a dominant place on the political map. Yet this alone is far from sufficient to unite beneath one banner the peasantry that constitutes the overwhelming majority of Russia's population. Peasant distrust of political parties, regional divisions, and the mutual suspicions inherited from the revolutionary years remain deep chasms across the road to unity.\n\nAfter several rounds of private negotiations between Maria Spiridonova and Friedrich Richter, the Socialist-Revolutionary Party has finally proclaimed itself reunited once more.\n\nObservers note that this reunion bears the unmistakable marks of compromise. Spiridonova represents the left's radical inheritance and rural foundations, while Richter embodies the forces within the party seeking democratisation and parliamentarism. Their consensus rests less upon trust than upon pragmatic calculation: after all, the price of division is far higher than the cost of compromise."
  russia_socialist_events.3.a: "Can these people truly learn what cooperation means?"
  russia_socialist_events.3.b: "Tell me more about the Socialist-Revolutionary Party."
  russia_socialist_events.1437.t: "The State of the Socialist-Revolutionary Party"
  russia_socialist_events.1437.d: "The Socialist-Revolutionary Party, ‘reunited’ under the pressure of circumstances, has now clearly divided into two principal factions.\n\nOn the left stand the Populists led by Maria Spiridonova. They preserve the traditions of the Left Socialist-Revolutionaries from before the First Civil War and still hold aloft the banner of ‘Land and Freedom’. They demand the immediate and uncompensated transfer of the landlords’ estates to village communes and poor peasants’ committees, together with the restoration of workers’ supervision over the factories.\n\nThe right is represented by the Democrats led by Friedrich Richter, the longtime deputy of the late Viktor Chernov. They regard themselves as the legitimate heirs of Chernov’s ‘constructive socialism’ and advocate the gradual reconstruction of democratic institutions through zemstvos, cooperatives, and a lawful press. Less direct and radical than the Populists, the Democrats place greater emphasis on due process, public education, and local self-government, and remain deeply attached to parliamentary democracy.\n\nSeveral smaller tendencies exist beyond these two camps. Among them is the Civic faction established by Pitirim Sorokin, which operates between the left and right from a position of social democracy and moderate pragmatism. Though small in number, its members are concentrated in universities, local cooperatives, and statistical offices, where they steadily build influence through social surveys, adult education, and cooperative credit.\n\nYet the most conspicuous outsider in Russian politics today is the Maximalist faction, whose guiding spirit is Alexei Ustinov. At meetings, the party establishment often refers to them as ‘Agrarian Bolsheviks’. During the First Civil War, the Maximalists won renown as steadfast allies of the Bolsheviks. After White Russia’s victory, most of their members were organised into combat groups, scattered across central and eastern Siberia, and there put Ustinov’s collective-farm system into practice. Now that the Red Banner has triumphed once more, the Maximalists remain unrecognised by the Socialist-Revolutionary establishment, but their prestige continues to grow."
  russia_socialist_events.1437.a: "‘...It will bear fruit at some future moment, even if you are no longer there to see it.’"
