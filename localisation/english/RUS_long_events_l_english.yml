  russia_socialist_events.3.b: "Tell me more about the Socialist-Revolutionary Party."
  russia_socialist_events.1437.t: "The State of the Socialist-Revolutionary Party"
  russia_socialist_events.1437.d: "Reunited under the pressure of circumstances, the Socialist-Revolutionary Party has now clearly divided into two principal factions.\n\nOn the left stand the Populists led by Maria Spiridonova. They preserve the traditions of the Left Socialist-Revolutionaries from before the First Civil War and still hold aloft the banner of ‘Land and Freedom’. They demand the immediate and uncompensated transfer of the landlords’ estates to village communes and poor peasants’ committees, together with the restoration of workers’ supervision over the factories.\n\nThe right is represented by the Democrats led by Friedrich Richter, the longtime deputy of the late Viktor Chernov. They regard themselves as the legitimate heirs of Chernov’s ‘constructive socialism’ and advocate the gradual reconstruction of democratic institutions through zemstvos, cooperatives, and a lawful press. Less direct and radical than the Populists, the Democrats place greater emphasis on due process, public education, and local self-government, and remain deeply attached to parliamentary democracy.\n\nSeveral smaller tendencies exist beyond these two camps. Among them is the Civic faction established by Pitirim Sorokin, which operates between the left and right from a position of social democracy and moderate pragmatism. Though small in number, its members are concentrated in universities, local cooperatives, and statistical offices, where they steadily build influence through social surveys, adult education, and cooperative credit.\n\nYet the most conspicuous outsider in Russian politics today is the Maximalist faction, whose guiding spirit is Alexei Ustinov. During the First Civil War, the Maximalists won renown as steadfast allies of the Bolsheviks. After White Russia’s victory, most of their members were organised into combat groups, scattered across central and eastern Siberia, and there put Ustinov’s collective-farm system into practice. Now that the Red Banner has triumphed once more, the Maximalists remain unrecognised by the Socialist-Revolutionary establishment, but their prestige continues to grow."
  russia_socialist_events.1437.a: "‘...It will bear fruit at some future moment, even if you are no longer there to see it.’"
