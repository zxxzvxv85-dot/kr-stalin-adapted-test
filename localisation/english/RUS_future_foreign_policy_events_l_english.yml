 RUS_future_foreign_policy_events.1.t:0 "The Return of the Petrel"
 RUS_future_foreign_policy_events.1.d:0 "The Political Security Directorate has recently received a secret letter from Warsaw. Its plain envelope was sealed with wax and bore no signature, only the simple outline of a petrel. Technical examination found both paper and ink to be cheap varieties commonly available in Poland.\n\nThe letter itself was brief.\n\nIts author claimed to be Felix Edmundovich Dzerzhinsky—the old Bolshevik who disappeared during the retreat in the Civil War and whom most comrades had long believed dead. He briefly recounted his escape: assuming a false identity, joining the streams of refugees, and eventually reaching Warsaw. Unable to determine whether the Central Committee had survived, he remained underground and spent the ensuing years gradually rebuilding a network of contacts. At the end he wrote: ‘I have always awaited the moment when reliable contact could be restored. I now believe that moment has come.’\n\nThe letter was accompanied by a token—an old pocket watch engraved with the registration number of the Petrograd Military Revolutionary Committee. A tiny inscription inside the case read: ‘Smolny—1917’. Dzerzhinsky had carried this watch during the October uprising, and it could not readily have been forged.\n\nAfter the technical department copied the letter in full, the original was immediately sealed away. The archives office of the Political Security Directorate and the Secretariat of the Central Committee jointly conducted the authentication. The watch was carefully dismantled: the wear upon the inscription accorded with its age, and the movement number exactly matched the Petrograd Military Revolutionary Committee's equipment register for October 1917. More importantly, the letter mentioned details—among them the contents of a secret order personally signed by Dzerzhinsky during a 1918 counter-revolutionary operation—that had never appeared in any public or restricted document and could only be known to the participants or a handful of senior officials.\n\nThe report was completed within three working days. Its conclusion: the identity was genuine."
 RUS_future_foreign_policy_events.1.a:0 "‘Over the boundless sea, the wind gathers the storm clouds…’"
 RUS_future_foreign_policy_events.1.unlock_tt:0 "We shall make the vast expanses of Russia a transit hub for world revolution!\nThe §YForeign Liaison and Intelligence Office of the European Revolutionary Committee§! has been unlocked under §YBalance of Power§!. Be sure to check it!"
