 RUS_future_foreign_policy_events.1.t:0 "The Return of the Petrel"
 RUS_future_foreign_policy_events.1.d:0 "The Political Security Directorate has recently received a secret letter from Warsaw. Its plain envelope was sealed with wax and bore no signature, only the simple outline of a petrel. Technical examination found both paper and ink to be cheap varieties commonly available in Poland.\n\nThe letter itself was brief.\n\nIts author claimed to be Felix Edmundovich Dzerzhinsky—the old Bolshevik who disappeared during the retreat in the Civil War and whom most comrades had long believed dead. He briefly recounted his escape: assuming a false identity, joining the streams of refugees, and eventually reaching Warsaw. Unable to determine whether the Central Committee had survived, he remained underground and spent the ensuing years gradually rebuilding a network of contacts. At the end he wrote: ‘I have always awaited the moment when reliable contact could be restored. I now believe that moment has come.’\n\nThe letter was accompanied by a token—an old pocket watch engraved with the registration number of the Petrograd Military Revolutionary Committee. A tiny inscription inside the case read: ‘Smolny—1917’. Dzerzhinsky had carried this watch during the October uprising, and it could not readily have been forged.\n\nAfter the technical department copied the letter in full, the original was immediately sealed away. The archives office of the Political Security Directorate and the Secretariat of the Central Committee jointly conducted the authentication. The watch was carefully dismantled: the wear upon the inscription accorded with its age, and the movement number exactly matched the Petrograd Military Revolutionary Committee's equipment register for October 1917. More importantly, the letter mentioned details—among them the contents of a secret order personally signed by Dzerzhinsky during a 1918 counter-revolutionary operation—that had never appeared in any public or restricted document and could only be known to the participants or a handful of senior officials.\n\nThe report was completed within three working days. Its conclusion: the identity was genuine."
 RUS_future_foreign_policy_events.1.a:0 "‘Over the boundless sea, the wind gathers the storm clouds…’"
 RUS_future_foreign_policy_events.1.unlock_tt:0 "We shall make the vast expanses of Russia a transit hub for world revolution!\nThe §YForeign Liaison and Intelligence Office of the European Revolutionary Committee§! has been unlocked under §YBalance of Power§!. Be sure to check it!"
 RUS_future_foreign_policy_events.2.t:0 "Return to Paris"
 RUS_future_foreign_policy_events.2.d:0 "Paris, the Élysée Palace\n\nAfter an absence of only a few months, Vyacheslav Mikhailovich once again set foot on French soil. His old friend Marcel Cachin was there to greet him. Paris had prepared thoroughly for the conference, and the splendour of the reception came as a mild surprise to Molotov—for, to outside observers, this was merely a routine diplomatic visit.\n\nParis, however, clearly had no intention of wasting the opportunity.\n\nThe talks took place in a salon of the Élysée Palace. The French delegation included Cachin, the workers' and peasants' government's trade commissioner, and several prominent representatives of industry. Contrary to Moscow's expectations, the French did not linger over political declarations, but came directly to the point: they wished to expand trade in resources, particularly their imports of grain, ores, and oil. In exchange, France could supply heavy machinery and manufactured goods, and was prepared to offer technical assistance with Russia's reconstruction programme.\n\nMolotov committed every proposed clause to memory without rushing to reply. Cachin was not surprised; he knew the old Bolshevik's negotiating style.\n\nAs the discussion progressed, the differences between the two sides also became clear. The French consistently confined cooperation to the realm of ‘commercial exchange and economic complementarity’, while avoiding Moscow's proposed clauses on political trust. Twice Molotov steered the conversation towards joint support for Europe's revolutionary movements, and twice Cachin gently brushed the matter aside on the grounds that ‘economic cooperation must come first’.\n\nAs the meeting drew to a close, Molotov received a detailed trade proposal covering bulk commodities such as oil, ores, and grain. The French terms for technical assistance also appeared notably generous.\n\nMost satisfactory to both sides was a framework agreement for the joint exploitation of Russia's mineral resources. The French displayed uncommon enthusiasm, promising not only advanced mining equipment and teams of engineers, but also a long-term cooperative arrangement for processing and transport. For Moscow, this meant a steady source of hard currency; for Paris, a long-term guarantee that Siberia's mineral veins would feed the French industrial system. On this point, the two sides unexpectedly discovered a common language that required no embellishment."
 RUS_future_foreign_policy_events.2.a:0 "To our revolutionary friends!"
 RUS_future_foreign_policy_events.3.t:0 "The First Revolution"
 RUS_future_foreign_policy_events.3.d:0 "That October more than twenty years ago, we believed the old world would collapse completely at the sound of a single gunshot. When the doors of the Winter Palace were thrown open, we thought every road to the future had opened with them.\n\nWhat followed was more complicated than any Bolshevik could have foreseen: the White counterattack, international blockade, internal strife, and the long night of exile. The revolution was not completed on that night in 1917; it merely began there. Like a burning fuse, it passed through the darkness of an entire age and has not yet burned itself out.\n\nThose figures hurrying through the corridors of Smolny, those workers reading leaflets in hushed voices on the factory floor, those soldiers sharing their last crust of bread with a comrade in the trenches—they did not fight for a fleeting slogan. They fought because they believed history and the people would remember their choice.\n\nToday we stand upon the rails they laid down, however violently the course may lurch...\n\nThe first revolution was not merely that one day in October. It is the same choice made in every age by every person who refuses to bow before the old world—"
 RUS_future_foreign_policy_events.3.a:0 "Carry the revolution through to the end!"
 RUS_future_foreign_policy_events.3.poem_tt:0 "§RThough calamity follows calamity,\nThey shall never make us despair.\nLet us come together as comrades;\nOur strength shall endure forever.\n\nHear the snowstorm clamour,\nSee the shooting stars in flight;\nMy heart is calling me onward:\nTo the distant lands in turmoil...§!"
 RUS_future_foreign_policy_events.4.t:0 "Syndicalism and Communism"
 RUS_future_foreign_policy_events.4.d:0 "Even in the Western world, the syndicalist revolution has not won the unanimous support of every revolutionary. A considerable number of revolutionaries share Yakov Sverdlov's view that syndicalism is ultimately a form of revolutionary reformism: it lacks the capacity to command the socialist state, while its people's democracy often remains a parliamentary form that never reaches the deeper structure of society.\n\nThese revolutionaries usually operate as oppositionists inside syndicalist countries. The best known are Marcel Cachin of the French Workers' and Peasants' Communist Party and Antonio Gramsci of the Italian Communist Party. They call themselves Communists or Marxist-Leninists and generally revere the late Vladimir Lenin as their revolutionary teacher. Independent communist groups are also active in many countries, including the Communist parties of Armenia, Latvia and Argentina.\n\nAs socialist Russia was rebuilt, delegations of communists from across the world began arriving one after another. The Socialist-Revolutionary Party viewed them with some unease, but the visitors were broadly welcomed by the Bolsheviks and the left wing of the All-Russian Labour Union.\n\nComrade Rosa Luxemburg, a veteran of the German revolution and now leader of the German Socialist Party, was invited to speak. In measured but unmistakable terms, she criticised the syndicalist line and called for a return to Lenin's core conception of the revolutionary state, rather than a reformist programme that substitutes trade-union organisation for state functions. At the close, she offered another prospect for the revolution: the revival of communism."
 RUS_future_foreign_policy_events.4.a:0 "“The dawn will break; the morning star rises in your hearts.”"
