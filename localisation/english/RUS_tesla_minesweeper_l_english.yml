l_english:
  RUS_tesla_minesweeper_category: "All-Russian Grid Fault Inspection"
  RUS_tesla_minesweeper_category_desc: "Inspect an §Y8x8§! grid containing §Y10§! fault nodes. Left-click to inspect a node; numbers show the faults in the eight surrounding nodes, while empty areas open automatically. Right-click to mark a dangerous node and click a marked node again to clear it.\n\nCompleting the §Yx§!th consecutive inspection constructs §Yx§! §CReinforced Electrical Grids§! in random states. Each round is followed by a §Y60-day§! cooldown. Inspection requires §YTesla Electric§! to be retained as the industrial concern."
  RUS_tesla_state_funding: "State Funding for Tesla Electric"
  RUS_tesla_state_funding_desc: "Provide §YTesla Electric§! with a dedicated research grant."
  RUS_tesla_minesweeper_title: "All-Russian Grid Fault Inspection"
  RUS_tesla_minesweeper_board_desc: "Inspect 10 faults on an 8x8 grid; empty areas open automatically and numbers show adjacent faults."
  RUS_tesla_minesweeper_locked_desc: "Unlocked by appointing §YNikola Tesla§! as an advisor or retaining §YTesla Electric§! as the industrial concern."
  RUS_tesla_minesweeper_entry_desc: "Open the All-Russian Grid Fault Inspection.\n\n§LEngineers are locating fault nodes, isolating shorted sections, and directing repairs across the Russian electrical grid.§!"
  RUS_tesla_minesweeper_entry_category_desc: "§LLocate fault nodes, isolate shorted sections, and direct grid repairs.§!"
  RUS_tesla_minesweeper_status_ready: "§YRepair Crews Standing By§!"
  RUS_tesla_minesweeper_status_active: "§GGrid Inspection in Progress§!"
  RUS_tesla_minesweeper_status_won: "§GFaults Cleared§!\n§LStreak [?RUS_tesla_minesweeper_win_streak|0] · Built [?RUS_tesla_minesweeper_reward_grids|0] grid(s)§!"
  RUS_tesla_minesweeper_status_won_no_reward: "§GFaults Cleared§!\n§LStreak [?RUS_tesla_minesweeper_win_streak|0] · Full coverage§!"
  RUS_tesla_minesweeper_status_lost: "§RGrid Shorted§!"
  RUS_tesla_minesweeper_reward: "§YConsecutive Repair Reward§!\nCompleting the nth consecutive inspection constructs up to n Reinforced Electrical Grids in random eligible states."
  RUS_tesla_minesweeper_flags: "Faults: 10  Marked: [?RUS_tesla_minesweeper_flags|0]/10"
  RUS_tesla_minesweeper_elapsed: "Time: [?RUS_tesla_minesweeper_elapsed_hours|0] h"
  RUS_tesla_minesweeper_cooldown: "§YEquipment Maintenance: 60-day cooldown§!"
  RUS_tesla_minesweeper_start: "Begin New Inspection"
  RUS_tesla_minesweeper_start_tooltip: "Designate a new 8x8 grid sector for inspection. Equipment undergoes 60 days of maintenance after each operation."
  RUS_tesla_minesweeper_cell_tooltip: "§YLeft-click§! to inspect a node\n§YRight-click§! to mark a dangerous node\n§YLeft- or right-click a marked node§! to clear it\n§LThe first inspection is always safe.§!"
