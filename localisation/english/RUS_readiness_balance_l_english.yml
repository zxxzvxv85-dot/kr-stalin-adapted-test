 RUS_readiness_decay_tt:0 "§YMonthly readiness upkeep§!\nTotal: §R−[?RUS_readiness_decay_total|2]§!\nArmy (40%): −[?RUS_readiness_decay_army|2]\nFive-Year Plan (35%): −[?RUS_readiness_decay_plan|2]\nLand reform (25%): −[?RUS_readiness_decay_land|2]\n\nRounded to 0.1 point.\nMonthly loss = 2 × weighted average of unfinished reform shares.\nTargets: 4 army stages, 150 plan points, 200 land points. Successful land reform also removes its penalty.\nMonthly deductions begin only after the diplomacy GUI is unlocked. No base decay; maximum 2 points monthly, zero when all targets are met. Applies to this route only; remaining plan points after exchanges are used."
