l_english:
  RUS_malformed_education_system: "Malformed Education System"
  RUS_malformed_education_system_desc: "The educational system inherited from the old regime is badly malformed. Cities and a small elite monopolise most educational resources, while workers and peasants are left to learn production through hardship and illiteracy. Without a thorough reform, socialist construction will lack the people it needs."
  RUS_reforming_education_system: "Education System Under Reform"
  RUS_reforming_education_system_desc: "Education reform has begun, but the inefficiency and shortage of trained personnel inherited from the old system will not disappear overnight. One-time reforms open new branches, while repeatable reforms may be completed up to §Y[?RUS_education_reform_repeat_limit|0]§! times in total."
  RUS_completed_education_reform: "Successfully Completed Education Reform"
  RUS_completed_education_reform_desc: "After sustained and wide-ranging reform, socialist Russia has begun to build a new education system for workers and peasants. Schools, training courses, cultural detachments and factory reforms now shape a new generation of builders."
  RUS_education_reform_status_tt: "§YRepeatable Education Reforms§!: [?RUS_education_reform_repeat_count|Y0]/§Y[?RUS_education_reform_repeat_limit|0]§!\n§YActive Education Reforms§!: [?RUS_education_reform_active_decisions|Y0]/§Y2§!"
  RUS_education_reform_completed_status_tt: "§GEducation reform has been successfully completed.§!\n§YRepeatable Education Reforms§!: [?RUS_education_reform_repeat_count|Y0]/§Y[?RUS_education_reform_repeat_limit|0]§!"
  RUS_education_reform_focus_start_tt: "Remove §Y$RUS_malformed_education_system$§! and begin §YEducation Reform§!."
  RUS_education_reform_active_slot_tt: "Fewer than §Y2§! education reform decisions are currently active."
  RUS_education_reform_recruitable_population_penalty_tt: "Recruitable Population Factor: §R-1.00%§!"
  RUS_education_reform_recruitable_population_dynamic_penalty_tt: "Recruitable Population Factor: §R-1.00%§!"
  RUS_education_reform_repeat_limit_tt: "Fewer than §Y[?RUS_education_reform_repeat_limit|0]§! repeatable education reforms have been completed."
  RUS_education_reform_cancel_if_ended_tt: "Education reform has ended or been halted."
  RUS_education_reform_category: "Education Reform"
  RUS_education_reform_category_desc: "Socialist construction requires a new education system. One-time reforms open new branches, while repeatable reforms may be completed up to §Y[?RUS_education_reform_repeat_limit|0]§! times in total.\n\nCurrent repeatable reforms: §Y[?RUS_education_reform_repeat_count|0]§!/§Y[?RUS_education_reform_repeat_limit|0]§!\nActive education reforms: §Y[?RUS_education_reform_active_decisions|0]§!/§Y2§!"
  RUS_edu_compulsory_education: "Universal Compulsory Education"
  RUS_edu_compulsory_education_desc: "Education is not a privilege, but the right of every Soviet citizen. For too long, Russia's schools served only cities and a narrow elite, while children of workers and peasants often learned the hoe and wrench before they learned letters. The government will introduce compulsory education nationwide, ensuring that every child of school age has a school and books."
  RUS_edu_build_rural_schools: "Build Rural Schools"
  RUS_edu_build_rural_schools_desc: "Policy alone is not enough. The government will fund new rural schools across the country, supply basic textbooks and teaching tools, and ensure that every school has at least one formally trained teacher."
  RUS_edu_higher_education: "Build Higher Education"
  RUS_edu_higher_education_desc: "A country without higher education can only follow others. We have land, resources and diligent people, but without engineers, agronomists, doctors and teachers, all of it sleeps beneath the soil and fields. The government will build new higher education institutions for socialist construction."
  RUS_edu_worker_peasant_courses: "Worker-Peasant Training Courses"
  RUS_edu_worker_peasant_courses_desc: "Higher education must not be reserved for the old intelligentsia. Workers and peasants have practical experience and a desire to change their conditions, but they need theory and tools. Evening and seasonal courses will open a path from workshop and field to lecture hall."
  RUS_edu_grassroots_cadres: "Train Grassroots Cadres"
  RUS_edu_grassroots_cadres_desc: "Good policy is empty if it never reaches the villages. County cadre schools will train rural youth, veterans and outstanding workers in policy, organisation and dispute mediation, creating trusted local organisers."
  RUS_edu_cadre_rotation: "Cadre Rotation System"
  RUS_edu_cadre_rotation_desc: "Training is a process, not a single act. Cadres will periodically return to training centres to update their knowledge, exchange experience and solve practical problems together."
  RUS_edu_cultural_propaganda: "Expand Cultural Propaganda"
  RUS_edu_cultural_propaganda_desc: "Schools are not enough: culture must enter fields and factory floors. Cultural detachments will bring books, newspapers, film projectors and basic medical knowledge to remote villages, teaching people that they are part of a great common cause."
  RUS_edu_production_technology: "Improve Production Technology"
  RUS_edu_production_technology_desc: "Factory efficiency determines the speed of national construction. Many enterprises still use outdated equipment and wasteful processes. The only answer is comprehensive technical improvement: to produce more and better goods with fewer resources."
  RUS_edu_streamlined_workshops: "Streamline Workshops"
  RUS_edu_streamlined_workshops_desc: "Chaotic layouts and overlapping processes waste time and labour. Technical experts will assess factory workflows, merge redundant steps, optimise stations and establish better transport routes."
  RUS_edu_standardized_lines: "Standardise Production Lines"
  RUS_edu_standardized_lines_desc: "Factories once worked to incompatible standards. By standardising components and production lines, equipment and parts can be shared, repaired faster, and converted to wartime needs more easily."
  RUS_education_reform_effect_compulsory_tt: "Add effects to §Y$RUS_reforming_education_system$§!:\nResearch Speed: §G+2.00%§!\nBase Production Efficiency: §G+5.00%§!\nUnlocks decision: §Y$RUS_edu_build_rural_schools$§!"
