  marxist_subtype_desc: "Marxism is a socialist current rooted in class struggle, collective ownership of the means of production, and the political programme derived from Karl Marx's work."
  left_communist_subtype_desc: "Left communism is a Leninist current that stresses industrialisation, international revolution, and opposition to socialism in one country."
  leninist_subtype_desc: "Leninism is a Marxist current centred on a disciplined vanguard party leading revolution and governing through party deliberation after taking power."
  marxism_leninism_subtype_desc: "Marxism-Leninism is a theoretical system formed by combining Marxism and Leninism. It uses dialectical and historical materialism as its worldview and method, treats social development as driven by contradictions between productive forces and relations of production and between the economic base and superstructure, analyses capitalist exploitation and surplus value, and emphasises proletarian party leadership, socialist revolution, and the dictatorship of the proletariat with the ultimate goal of abolishing class exploitation and achieving communist society."
  right_communist_subtype_desc: "Right communism"
  maoist_subtype_desc: "Maoism adapts Marxism-Leninism around mass mobilisation, peasant revolutionary war, and continuous class struggle."
