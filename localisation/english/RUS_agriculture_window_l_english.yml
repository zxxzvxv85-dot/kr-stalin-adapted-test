l_english:
 RUS_agri_window_open:0 "National agricultural system"
 RUS_agri_window_open_desc:0 "Click to open agricultural production, machinery production, trade and development."
 RUS_agri_window_open_tt:0 "§YNational agricultural system§!\nClick to open agricultural production, machinery production, trade and development."
 RUS_agri_window_support:0 "Quarterly support"
 RUS_agri_window_development:0 "Development"
 RUS_agri_window_support_status:0 "Support used this quarter: §Y[?RUS_nat_support_count|0] / 4§!"
 RUS_agri_window_development_status:0 "Available reform score: §Y[?RUS_agri_spendable_score|0]§!\nActive domestic projects: §Y[?RUS_agri_domestic_active_count|0] / 2§!"
 RUS_agri_window_development_locked:0 "Agricultural development becomes available after land reform succeeds."
 RUS_agri_window_guide_label:0 "Management guide"
 RUS_agri_window_shutdown_label:0 "End agricultural management"
 RUS_agri_window_shutdown_desc:0 "Land reform has exceeded its goals. Permanent institutions can take over everyday production. This decision is irreversible."
 RUS_agri_window_shutdown_effect:0 "Permanently ends daily agricultural management, quarterly settlement and reminders, and closes this window. Releases assigned civilian factories and removes annual temporary agricultural modifiers. Land reform milestones and other independent rewards are retained."
 RUS_agri_window_RUS_nat_guide_decision_label:0 "Management guide"
 RUS_agri_window_RUS_nat_guide_decision_tt:0 "§YManagement guide§!\nReview allocation, domestic supply, reserves, exports and land reform.\n\n[!nat_action_RUS_nat_guide_decision_click_enabled]\n[!nat_action_RUS_nat_guide_decision_click]"
 RUS_agri_window_RUS_nat_support_food_label:0 "Interregional Grain Deliveries"
 RUS_agri_window_RUS_nat_support_food_tt:0 "§YInterregional Grain Deliveries§!\nAdd 4 units of wheat; once per quarter, at most four agricultural support measures per quarter; stability -2% per measure, or -1% with Ustinov.\n\n[!nat_action_RUS_nat_support_food_click_enabled]\n[!nat_action_RUS_nat_support_food_click]"
 RUS_agri_window_RUS_nat_support_processing_label:0 "Processing Supplies"
 RUS_agri_window_RUS_nat_support_processing_tt:0 "§YProcessing Supplies§!\nAdd 2 units of beet; once per quarter, at most four agricultural support measures per quarter; stability -2% per measure, or -1% with Ustinov.\n\n[!nat_action_RUS_nat_support_processing_click_enabled]\n[!nat_action_RUS_nat_support_processing_click]"
 RUS_agri_window_RUS_nat_support_textiles_label:0 "Textile Supplies"
 RUS_agri_window_RUS_nat_support_textiles_tt:0 "§YTextile Supplies§!\nAdd 1.5 units each of flax and cotton; once per quarter, at most four agricultural support measures per quarter; stability -2% per measure, or -1% with Ustinov.\n\n[!nat_action_RUS_nat_support_textiles_click_enabled]\n[!nat_action_RUS_nat_support_textiles_click]"
 RUS_agri_window_RUS_nat_support_technical_label:0 "Agronomic Support"
 RUS_agri_window_RUS_nat_support_technical_tt:0 "§YAgronomic Support§!\nCrop output +5% this quarter; once per quarter, at most four agricultural support measures per quarter; stability -2% per measure, or -1% with Ustinov.\n\n[!nat_action_RUS_nat_support_technical_click_enabled]\n[!nat_action_RUS_nat_support_technical_click]"
 RUS_agri_window_RUS_nat_support_repair_label:0 "Machinery Overhaul"
 RUS_agri_window_RUS_nat_support_repair_tt:0 "§YMachinery Overhaul§!\nMachinery wear -5 percentage points this quarter; once per quarter, at most four agricultural support measures per quarter; stability -2% per measure, or -1% with Ustinov.\n\n[!nat_action_RUS_nat_support_repair_click_enabled]\n[!nat_action_RUS_nat_support_repair_click]"
 RUS_agri_window_RUS_nat_support_emergency_label:0 "Emergency Grain Procurement"
 RUS_agri_window_RUS_nat_support_emergency_tt:0 "§YEmergency Grain Procurement§!\nAt settlement, cover up to 90% of food needs; maximum 4 units, no export surplus; once per quarter, at most four agricultural support measures per quarter; stability -2% per measure, or -1% with Ustinov.\n\n[!nat_action_RUS_nat_support_emergency_click_enabled]\n[!nat_action_RUS_nat_support_emergency_click]"
 RUS_agri_window_RUS_agri_exchange_rations_label:0 "Improve Urban and Rural Rations"
 RUS_agri_window_RUS_agri_exchange_rations_tt:0 "§YImprove Urban and Rural Rations§!\nPut the achievements of land reform and agricultural management to work for production and public welfare.\n\n8 reform pts\n[!nat_action_RUS_agri_exchange_rations_click_enabled]\n[!nat_action_RUS_agri_exchange_rations_click]"
 RUS_agri_window_RUS_agri_exchange_mechanisation_label:0 "Expand Agricultural Mechanisation"
 RUS_agri_window_RUS_agri_exchange_mechanisation_tt:0 "§YExpand Agricultural Mechanisation§!\nPut the achievements of land reform and agricultural management to work for production and public welfare.\n\n10 reform pts\n[!nat_action_RUS_agri_exchange_mechanisation_click_enabled]\n[!nat_action_RUS_agri_exchange_mechanisation_click]"
 RUS_agri_window_RUS_agri_exchange_reserves_label:0 "Replenish Army Food Reserves"
 RUS_agri_window_RUS_agri_exchange_reserves_tt:0 "§YReplenish Army Food Reserves§!\nPut the achievements of land reform and agricultural management to work for production and public welfare.\n\n8 reform pts\n[!nat_action_RUS_agri_exchange_reserves_click_enabled]\n[!nat_action_RUS_agri_exchange_reserves_click]"
 RUS_agri_window_RUS_agri_exchange_materials_label:0 "Secure Light Industry Materials"
 RUS_agri_window_RUS_agri_exchange_materials_tt:0 "§YSecure Light Industry Materials§!\nPut the achievements of land reform and agricultural management to work for production and public welfare.\n\n10 reform pts\n[!nat_action_RUS_agri_exchange_materials_click_enabled]\n[!nat_action_RUS_agri_exchange_materials_click]"
 RUS_agri_window_RUS_agri_exchange_export_label:0 "Export Agricultural Surpluses"
 RUS_agri_window_RUS_agri_exchange_export_tt:0 "§YExport Agricultural Surpluses§!\nPut the achievements of land reform and agricultural management to work for production and public welfare.\n\n6 reform pts\n[!nat_action_RUS_agri_exchange_export_click_enabled]\n[!nat_action_RUS_agri_exchange_export_click]"
 RUS_agri_window_RUS_agri_exchange_machinery_label:0 "Additional Machinery"
 RUS_agri_window_RUS_agri_exchange_machinery_tt:0 "§YAdditional Machinery§!\nPut the achievements of land reform and agricultural management to work for production and public welfare.\n\n4 reform pts\n[!nat_action_RUS_agri_exchange_machinery_click_enabled]\n[!nat_action_RUS_agri_exchange_machinery_click]"
 RUS_agri_window_RUS_agri_exchange_storage_label:0 "Improved Storage and Transport"
 RUS_agri_window_RUS_agri_exchange_storage_tt:0 "§YImproved Storage and Transport§!\nPut the achievements of land reform and agricultural management to work for production and public welfare.\n\n4 reform pts\n[!nat_action_RUS_agri_exchange_storage_click_enabled]\n[!nat_action_RUS_agri_exchange_storage_click]"
 RUS_agri_window_RUS_nat_close_system_label:0 "End agricultural management"
 RUS_agri_window_RUS_nat_close_system_tt:0 "§YEnd agricultural management§!\nLand reform has exceeded its goals. Permanent institutions can take over everyday production. This decision is irreversible.\n\n[!nat_action_RUS_nat_close_system_click_enabled]\n[!nat_action_RUS_nat_close_system_click]"
