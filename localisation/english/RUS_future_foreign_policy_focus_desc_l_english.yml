l_english:
 RUS_future_foreign_002_desc:0 "In the West, comrades still stand with us in defence of the same ideal. Some of them differ with us on matters of political line, and have even strayed from what we understand as ‘orthodoxy’—but if we are truly committed to destroying the imperialist system, we must set aside our prejudices."
 RUS_future_foreign_003_desc:0 "As a country spanning Europe and Asia, Russia has always kept open a window onto the East. Most of Asia's revolutionary parties have ties of varying depth to the Bolsheviks and other Russian political movements. Compared with our Western friends, from whom differences are steadily emerging, our friends in the East clearly share far more ground with us for common discussion."
