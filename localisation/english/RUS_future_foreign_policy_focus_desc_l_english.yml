l_english:
 RUS_future_foreign_002_desc:0 "In the West, comrades still stand with us in defence of the same ideal. Some of them differ with us on matters of political line, and have even strayed from what we understand as ‘orthodoxy’—but if we are truly committed to destroying the imperialist system, we must set aside our prejudices."
 RUS_future_foreign_003_desc:0 "As a country spanning Europe and Asia, Russia has always kept open a window onto the East. Most of Asia's revolutionary parties have ties of varying depth to the Bolsheviks and other Russian political movements. Compared with our Western friends, from whom differences are steadily emerging, our friends in the East clearly share far more ground with us for common discussion."
 RUS_future_foreign_016_desc:0 "Cooperation among proletarian states ought to be wholehearted and concerted. In theory, we share the same objective; in practice, however, the disparity in technical development cannot be ignored. Russia still trails visibly behind the prevailing technical standards of the Third International. Catching up with comrades who have enjoyed years of progress will demand greater effort from us."
 RUS_future_foreign_017_desc:0 "Trade with the West has progressed more smoothly than expected. Perhaps the time has come to take the initiative and, building upon the existing trade framework, pursue broader exchanges and negotiations with the principal members of the Third International. London, no less than the Commune, has expressed keen interest in the agreement. We have every reason to believe it will become a milestone in relations among proletarian states."
 RUS_future_foreign_032_desc:0 "‘The weapon of criticism cannot, of course, replace criticism by weapons.’ Surrounded by reactionaries across the world, only strength can hold the line. Russia's military establishment is recovering, but it cannot recover by its own efforts alone. Technical exchange with our Western comrades will bring our national defence ever nearer to perfection."
 RUS_future_foreign_046_desc:0 "The threat of German imperialism grows by the day. No one can say with certainty when the iron heel of Prussian militarism will once again march against the revolution. Perhaps mutual guarantees of independence between ourselves and the Commune of France will form our final line of defence against imperialism..."
 RUS_future_foreign_047_desc:0 "‘From each according to his ability, to each according to his needs’—in the ideal communist society, this will be an unquestioned fundamental guarantee. Although the conditions do not yet exist to apply this principle fully at home, we should lead by putting it into practice in relations among proletarian states."
 RUS_future_foreign_056_desc:0 "The tide of world revolution cannot be stopped. From Europe to Asia, from the factories to the fields, the banner of the proletariat is rising over ever more lands. The walls of imperialism will fall, the fog of reformism will lift, and history will pass judgement upon the betrayals of opportunism. The spark of revolution is spreading from one place to the next, until every continent is set alight..."
