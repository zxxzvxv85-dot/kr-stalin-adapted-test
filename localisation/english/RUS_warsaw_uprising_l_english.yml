 RUS_future_foreign_policy_events.10.t:0 "The Warsaw Uprising"
 RUS_future_foreign_policy_events.10.d:0 "At 01:15, a violent explosion tore through the arsenal in Warsaw's Praga district. An armed uprising, organised by the Polish Communist Party (MKP), the Union of Trade Unions (ZZZ) and the Polish Revolutionary Committee in exile in Moscow, had begun. Insurgents cut the telephone lines to Vienna Station and occupied the railway administration and the Old Town tram depot.\n\nThe main insurgent force numbered roughly three thousand, comprising workers' guards and defecting Polish soldiers. Armed with rifles and light machine guns, they erected barricades along Krakowskie Przedmieście. At 02:40, they stormed Warsaw City Hall and disarmed its guards. At 03:15, they seized the national radio station. §b[POL.GetRUSWarsawHeadOfGovernment]§!, head of the Polish provisional government, was captured and confined in the basement of the Bank of Poland.\n\nThe German military mission in Poland hastily declared martial law throughout the city. Von Beseler, commander of the German garrison in Warsaw, ordered armoured cars into Theatre Square. At 05:20, insurgents ambushed the vehicles in Mokotów with incendiary bottles and crossfire. Two armoured cars were burned out, and the survivors withdrew to barracks in the western suburbs.\n\nAt 06:00, the Polish Socialist Party (PPS) issued a statement supporting the uprising and calling for a general strike. The Christian Union of National Unity (ChZJN) declared its neutrality. The Austrian imperial consulate closed its doors, while Austro-Hungarian troops took no action.\n\nBy 07:30, insurgents controlled two bridges over the Vistula. The remaining cabinet of §b[POL.GetName]§! withdrew to the Radziwiłł Palace. The German military mission sent an urgent telegram to Berlin requesting reinforcements.\n\nAt 08:00, the Polish Revolutionary Committee broadcast its Address to the Polish People, proclaiming the abolition of the monarchy, withdrawal from the Reichspakt and the establishment of a Polish Soviet Republic. It called for immediate general strikes and armed uprisings in Poznań, Lwów and other cities."
 RUS_future_foreign_policy_events.10.a:0 "The Polish people shall cast off their own chains."

 RUS_future_foreign_policy_events.11.t:0 "The Arrow Is Nocked"
 RUS_future_foreign_policy_events.11.d:0 "What began as a wildcat strike has become an upheaval sweeping across Warsaw. Textile workers were the first to leave their workshops; tram drivers shut off their engines, and bakery ovens grew cold. By the third day, the city's industrial districts had joined together, and barricades had risen between the workers' quarters and the city centre. Alongside the old emblems of the Polish workers' movement, the banners bore new words: 'Land, Bread, Freedom'.\n\nThe German imperial governor's office was initially unconcerned. The imperial troops stationed in Warsaw were sufficient to suppress any disturbance. But as the demonstrators advanced from Praga towards the city centre, the governor discovered something amiss with the deployment of his troops: Polish soldiers were slow to obey orders, and some even refused to raise their rifles against the crowd.\n\nMeanwhile, leaflets from the Polish Revolutionary Committee appeared on every street corner. They called on workers to form councils of delegates and on peasants to refuse grain deliveries to the garrisons. More troubling still for Berlin, railway workers in some districts had begun intercepting special trains bound for Germany. Fires lit Warsaw's night sky red; gunfire mingled with song, echoing from the Vistula's banks to the workers' quarters on the outskirts.\n\nLittle time remains for the revolutionaries to weigh their choices. Should they take the lead in the mass strike? Can the party organisations in Warsaw cope with the unforeseen crises to come? And can the provinces respond in time?"
 RUS_future_foreign_policy_events.11.a:0 "Let us boldly raise our red flag!"
 RUS_future_foreign_policy_events.11.a_tt:0 "Even if the people's tomorrow remains so uncertain…\nThe storm is upon us, and the Warsaw Uprising is about to begin. Our readiness for war will determine whether the Polish provinces can answer the capital's revolution."

 RUS_future_foreign_policy_events.12.t:0 "Unrest in Lublin"
 RUS_future_foreign_policy_events.12.d:0 "Our official support for the Polish revolution has given Polish revolutionaries greater room to act. Over the past few months, funds and printing equipment smuggled across the border have quietly taken root in Lublin, Kielce and Rzeszów. Underground presses now regularly publish The Workers' Voice, and leaflets appear at factory gates, in barracks canteens and at village markets. With these funds, the Polish Revolutionary Committee has established a network among railway workers and rebuilt the local organisations once broken up in the mines and textile mills.\n\nThe authorities in Warsaw have not been oblivious. Police informers are increasingly frequent visitors to Lublin's working-class districts, and reports of arrests and searches continue to arrive. Yet each crackdown brings larger protests. Last week, workers at the Lublin locomotive works spontaneously walked out to protest the arrest of three comrades; the strike soon spread to the city's tramway and municipal workers. The government sent in mounted police, but faced with thousands of workers blocking the factory gates, they ultimately did not intervene."
 RUS_future_foreign_policy_events.12.a:0 "The moment is taking shape."
 RUS_future_foreign_policy_events.12.a_tt:0 "Всеобщая вера в революцию есть уже начало революции.\nUniversal faith in revolution is already the beginning of revolution."
