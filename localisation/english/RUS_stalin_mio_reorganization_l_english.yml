 RUS_stalin_mio_reorganization.1.t:0 "全新的社会主义军工生产体系"
 RUS_stalin_mio_reorganization.1.d:0 "随着大规模国有化的进行，军事工业作为重要工业也被列入了清单，原俄罗斯共和国的各个重要军事企业或部门被统一改组后完全纳入国家的掌控，曾受到约束的人才们也在苏维埃的帮助下有了施展拳脚的机会：\n亚速海造船厂得到扩大后更名为黑海造船厂；\n布良斯克机械制造厂被新建的莫托维利哈工厂所合并，其资源、人才、人力都被合并；\n曾经的“战斗机之王”莫斯科航空工厂杜克斯因公然对抗政府进行反社会主义活动被阿尔焦姆·米高扬与米哈伊尔·格列维奇接管，最高苏维埃任命他们成立了米高扬-格列维奇设计局；\n俄罗斯航空公司加马云因内部大量人员潜逃国外，最高苏维埃因此任命前途无量的图波列夫弟子苏霍伊接管加马云，并在此基础上成立了苏霍伊设计局；\n原国防飞机协助协会因高层从事反革命活动被执行调查，优秀设计师伊留申因此接管协会并在此基础上成立了伊留申设计局；\n莫斯科汽车厂为纪念革命导师弗拉基米尔·列宁更名为了列宁汽车厂；\n为了纪念文学巨匠高尔基，下诺夫哥罗德被更名为高尔基，而下诺夫哥罗德汽车厂更名为了高尔基汽车厂；\n实验机械设计部在进行内部审查后更名为莫洛佐夫机械制造设计局，由莫洛佐夫领导；\n为了表彰谢尔盖·基洛夫在拖拉机与坦克工业领域的贡献，普梯洛夫工厂更名基洛夫工厂；\n“红色速度”的掌控者雅科夫列夫主动接受改组，在人员基本不变的情况下成立了雅科夫列夫设计局；\n航空托拉斯索科尔接受政府再次改组后由拉沃契金担任总设计师，成立了拉沃契金设计局；\n中央空气流体学研究院与佩特利亚科夫为首的前加马云团体再次合并后成立了图波列夫与佩特利亚科夫联合设计局；\n五年计划期间，为了体现“工人”的要素，威亚茨基耶波利亚内工厂更名为莫洛特机器制造厂（莫洛特，译为锤子）；\n为了表彰斯大林在内战时期于察里津死战不退、多次击退白军进攻、为其他方向的撤退部队争取时间的英勇举动和对其余军事上的贡献，察里津更名为斯大林格勒（尽管遭受了当事人的强烈反对），察里津拖拉机厂也改名为斯大林格勒拖拉机厂。"
 RUS_stalin_mio_reorganization.1.a:0 "我国的军事命脉决不能被外人与反动派掌控！"
