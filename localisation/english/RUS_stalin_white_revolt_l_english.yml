l_english:
 RUS_white_revolt_category: "The White Counter-Revolt"
 RUS_white_revolt_category_desc: "The old officer corps refuses to recognise the Socialist Provisional Government. The Red Army must secure the approaches to Petrograd and Tsaritsyn within ninety days."
 RUS_white_revolt_deadline: "Ninety Days of the New Regime"
 RUS_white_revolt_deadline_desc: "If the White strongholds in Petrograd and Tsaritsyn are not destroyed in time, the military will overthrow the Socialist Provisional Government."
 RUS_white_revolt_status: "Red Army Fronts"
 RUS_white_revolt_status_desc: "Petrograd approaches: §Y[?RUS_white_revolt_petrograd_progress|0]§!/§Y[?RUS_white_revolt_petrograd_required|0]§!\nTsaritsyn approaches: §Y[?RUS_white_revolt_tsaritsyn_progress|0]§!/§Y[?RUS_white_revolt_tsaritsyn_required|0]§!\n\nSecuring every valid approach unlocks the final operation in that theatre. Target states not controlled by Russia are waived."
 RUS_bolshevik_rifle_support: "Bolshevik Support"
 RUS_bolshevik_rifle_support_desc: "Returning Bolshevik military cadres will organise arms shipments for railway workers, Red Guards and emergency formations."
 RUS_bolshevik_rifle_support_tt: "Lose §R5,000§! units of infantry equipment and gain §G25§! Command Power."
 RUS_red_army_advance: "Advance into [FROM.GetName]"
 RUS_red_army_advance_desc: "Red Guards and loyal troops will clear local White positions and secure the railways, bridges and telegraph offices."
 RUS_encircle_petrograd_whites: "Encircle the Petrograd Whites"
 RUS_encircle_petrograd_whites_desc: "With the surrounding railways secured, the White barracks and headquarters inside Petrograd can finally be isolated and forced to surrender."
 RUS_cut_off_tsaritsyn_whites: "Cut Off the Tsaritsyn Whites"
 RUS_cut_off_tsaritsyn_whites_desc: "A coordinated offensive will sever the Whites' remaining routes towards the Don and the lower Volga."
 RUS_defend_against_white_counterattack: "Repel the White Counterattack"
 RUS_defend_against_white_counterattack_desc: "The Whites are attacking §Y[event_target:RUS_white_revolt_counterattack_state.GetName]§!. Reserves must be committed immediately."
 RUS_white_revolt_counterattack_mission: "White Counterattack"
 RUS_white_revolt_counterattack_mission_desc: "Unless reinforced, our forces in §Y[event_target:RUS_white_revolt_counterattack_state.GetName]§! will be driven out."
 RUS_white_revolt_cp_10: "£command_power §Y10§!"
 RUS_white_revolt_cp_10_blocked: "£command_power §R10§!"
 RUS_white_revolt_cp_15: "£command_power §Y15§!"
 RUS_white_revolt_cp_15_blocked: "£command_power §R15§!"
 RUS_white_revolt_cp_20: "£command_power §Y20§!"
 RUS_white_revolt_cp_20_blocked: "£command_power §R20§!"
 RUS_white_revolt_start_tt: "Completes the §YRed Flag over the Kremlin§! national focus.\nUnlocks the §YWhite Counter-Revolt§! decisions.\nGain §G30§! Command Power.\nThe White strongholds in Petrograd and Tsaritsyn must be defeated within §Y90 days§!."
 RUS_white_revolt_victory_tt: "§GThe revolution is victorious.§!\nSocialist Russia will now be formally established."
 RUS_white_revolt_failure_tt: "§RThe revolution has failed.§!\nThe military will establish a provisional government and restore the republic."
 RUS_red_army_advance_tt: "Once the operation is complete, the Red Army will secure the transport routes in §Y[FROM.GetName]§!."
 RUS_encircle_petrograd_whites_tt: "Once the operation is complete, §Gthe Petrograd theatre will be won§!."
 RUS_encircle_petrograd_whites_available_tt: "Control Petrograd and every surrounding target still held by Russia, with no White counterattack in progress."
 RUS_cut_off_tsaritsyn_whites_tt: "Once the operation is complete, §Gthe Tsaritsyn theatre will be won§!."
 RUS_cut_off_tsaritsyn_whites_available_tt: "Control Tsaritsyn and every surrounding target still held by Russia, with no White counterattack in progress."
 RUS_defend_against_white_counterattack_tt: "Hold §Y[event_target:RUS_white_revolt_counterattack_state.GetName]§!, preventing the Whites from re-establishing their positions."
 RUS_white_revolt_counterattack_failure_tt: "If the defence is not organised in time, §Y[event_target:RUS_white_revolt_counterattack_state.GetName]§! will be lost and must be cleared again."
 russia_events.926.d: "Within days of Savinkov's death, the upper ranks of the so-called Union for the Defence of the Motherland and Freedom had scattered—arrested, shot, or fleeing the country. Only Generals Vladimir Manstein and Anton Turkul retained enough influence over the garrisons outside Moscow to launch a counter-coup. With cavalry and an armoured column, they briefly entered the southern districts of the capital and seized several important positions.\n\nThe plotters expected the Moscow garrison to defect en masse and rally beneath their 'White Guard' banners. Almost no one answered. The city had no desire to die for its fallen Vozhd.\n\nAfter a short engagement outside Zvenigorod, the main rebel force surrendered. Manstein was brought before a military tribunal and executed on the spot.\n\nYet the wave of counter-revolution had not subsided. Across the provinces, White officers refused obedience and raised their garrisons against the provisional government. Under the unified command of Field Marshal Markov, these reactionary formations are rapidly assembling, sharpening their blades for an attempt to strangle the revolution."
 russia_events.926.a: "Order them to lay down their arms!"
 rus_stalin_white_revolt_events.1.t: "The Whites Refuse to Disarm"
 rus_stalin_white_revolt_events.1.d: "Manstein's coup collapsed in the streets of Moscow and the general died amid the confusion. Yet the old army has not accepted the revolution. Officers have seized barracks and railway junctions around Petrograd, while White remnants rally around Tsaritsyn in southern Russia.\n\nThe provisional government has few regular troops it can trust. Red Guards, revolutionary sailors and loyal railway workers must open the approaches to both cities before the Whites coordinate their forces. The revolution will not receive another chance."
 rus_stalin_white_revolt_events.1.a: "Send the Reds to Petrograd and Tsaritsyn!"
 rus_stalin_white_revolt_events.2.t: "The White Fortress of Petrograd"
 rus_stalin_white_revolt_events.2.d: "Military schools, guard barracks and old naval offices have become White strongholds. If the railways through Luga, Olonets and Zvansk remain in their hands, the revolutionary sailors will be isolated from the interior."
 rus_stalin_white_revolt_events.2.a: "The cradle of the revolution must not fall."
 rus_stalin_white_revolt_events.3.t: "Southern Officers Rally at Tsaritsyn"
 rus_stalin_white_revolt_events.3.d: "Don officers, Cossacks and counter-revolutionary detachments are streaming towards Tsaritsyn. They intend to use the Volga routes to unite the southern Whites and march on Moscow. Millerovo, Kamyshin, Pokrovsk and Velikoknyazhesk will decide whether reinforcements reach them."
 rus_stalin_white_revolt_events.3.a: "Cut every road of retreat."
 rus_stalin_white_revolt_events.4.t: "The Whites Counterattack"
 rus_stalin_white_revolt_events.4.d: "White commanders have committed their reserves against §Y[event_target:RUS_white_revolt_counterattack_state.GetName]§!. The local Red Guards request immediate reinforcement."
 rus_stalin_white_revolt_events.4.a: "Prepare the defence!"
 rus_stalin_white_revolt_events.5.t: "The Red Line Breaks"
 rus_stalin_white_revolt_events.5.d: "Reinforcements failed to reach §Y[event_target:RUS_white_revolt_counterattack_state.GetName]§! in time. The railway and telegraph offices have fallen back into White hands."
 rus_stalin_white_revolt_events.5.a: "We will have to take it again."
 rus_stalin_white_revolt_events.6.t: "The Petrograd Whites Surrender"
 rus_stalin_white_revolt_events.6.d: "Cut off from the surrounding railways, the White garrison soon exhausted its food and ammunition. Revolutionary sailors and Red Guards stormed the remaining barracks, and the red flag flies over the cradle of the revolution once more."
 rus_stalin_white_revolt_events.6.a: "Petrograd is secure."
 rus_stalin_white_revolt_events.7.t: "The Tsaritsyn Whites Destroyed"
 rus_stalin_white_revolt_events.7.d: "The Red Army seized the railways and Volga crossings simultaneously. Cossack units dissolved and the remaining officers surrendered after a failed breakout. The backbone of the southern counter-revolution has been broken."
 rus_stalin_white_revolt_events.7.a: "Tsaritsyn belongs to the revolution."
 rus_stalin_white_revolt_events.8.t: "The Whites Overthrow the Provisional Government"
 rus_stalin_white_revolt_events.8.d: "Ninety days have passed without simultaneous control of Petrograd and Tsaritsyn. Using the intact railway network, the White forces united and launched a decisive drive on Moscow. The provisional government's guards collapsed within hours.\n\nThe military has assumed control and promises to reconvene the Constituent Assembly once order is restored. The Russian Revolution has failed again."
 rus_stalin_white_revolt_events.8.a: "The military will restore the republic."
 rus_stalin_white_revolt_events.9.t: "The Revolution Endures"
 rus_stalin_white_revolt_events.9.d: "The White strongholds in Petrograd and Tsaritsyn have both been destroyed. The old army has lost its last centres for coordinating a national counter-revolution. The Socialist Provisional Government is no longer merely a bold proclamation behind Moscow's barricades, but the power that holds Russia's fate."
 rus_stalin_white_revolt_events.9.a: "Now we shall build socialist Russia."
 rus_stalin_white_revolt_events.11.t: "The Luga Railway Reopens"
 rus_stalin_white_revolt_events.11.d: "The southern lines into Petrograd converge at Luga, and the Whites had turned the junction into a great bolt across the capital's door. Tracks towards Moscow were torn up, an armoured train guarded the northern platform, and villagers were forced to dig trenches around the station. Nearly every bridge met by our advance had been demolished.\n\nRailway workers changed the course of the battle. Under cover of darkness they removed charges from the locomotive depot and drove a hidden shunting engine towards the Red lines. At dawn, Red Guards rode improvised freight cars into the station while loyal troops attacked from the south. By noon the White armoured train was retreating towards Petrograd. The first repaired train, loaded with bread and ammunition, is already steaming north."
 rus_stalin_white_revolt_events.11.a: "The gate to Petrograd is open."
 rus_stalin_white_revolt_events.12.t: "Red Banners in the Olonets Forests"
 rus_stalin_white_revolt_events.12.d: "Olonets offered no broad roads for an army. White officers used its lakes, forests and abandoned logging camps to build scattered strongpoints and ambush the Red columns turning north of Petrograd. After several signal detachments vanished, the front briefly depended on messengers travelling by ski.\n\nLocal lumbermen and soldiers returned from the old front supplied a complete map of the forest trails. Light detachments bypassed the roadblocks before dawn and captured the telephone exchange and ammunition stores. Isolated from one another, the White posts quickly dissolved. Red cloth now marks every forest signpost, and the northern approach belongs to the revolution."
 rus_stalin_white_revolt_events.12.a: "Even the forests stand with the revolution."
 rus_stalin_white_revolt_events.13.t: "The Bridge over the Volkhov"
 rus_stalin_white_revolt_events.13.d: "Zvansk controlled the crossings over the Volkhov and the railway east of Petrograd. The Whites packed the bridge with explosives, intending to destroy it during their retreat and prevent an eastern encirclement. Machine guns watched every approach to the piers.\n\nRather than launch a costly frontal assault, sailors and power-station workers travelled downstream by barge and cut the detonation cables beneath the bridge. Factory sirens then called the town's workers to seize the station. With the bridge intact and their escape route severed, the White garrison abandoned its heavy weapons and fled west. The eastern ring is closing."
 rus_stalin_white_revolt_events.13.a: "Send the trains across the Volkhov."
 rus_stalin_white_revolt_events.14.t: "The Battle for Millerovo Junction"
 rus_stalin_white_revolt_events.14.d: "Millerovo was the railway hinge connecting the Don region with the Whites at Tsaritsyn. Officers, Cossacks and ammunition from the south all passed through its crowded platforms and depots. The Whites believed the open steppe and their cavalry made this lifeline impossible to cut.\n\nRed infantry entered hidden inside coal wagons, guided onto the military platform by sympathetic switchmen. As the doors opened, Red Guards rushed the signal box while cavalry cut the telegraph and sealed the southern crossing. The defenders abandoned their warehouses and withdrew towards the Don. Dozens of wagons filled with rifles, shells and food fell intact into our hands."
 rus_stalin_white_revolt_events.14.a: "Their lifeline has been severed."
 rus_stalin_white_revolt_events.15.t: "The Volga Flotilla at Kamyshin"
 rus_stalin_white_revolt_events.15.d: "Kamyshin served as the transfer port for supplies travelling down the Volga to Tsaritsyn. Armed tugboats controlled the river, while flour requisitioned from the countryside filled the waterfront warehouses. So long as the port remained White, Tsaritsyn could not be isolated.\n\nRed gunners dragged light pieces onto the western heights and opened fire at dawn. Dockworkers closed the coal yards and sabotaged the winches, preventing the flotilla from sailing. When one tug raised a red flag and turned its gun, the rest soon surrendered. The harbour and its grain now belong to the revolution."
 rus_stalin_white_revolt_events.15.a: "Control the river, and we control Tsaritsyn."
 rus_stalin_white_revolt_events.16.t: "The Workers' Rising in Pokrovsk"
 rus_stalin_white_revolt_events.16.d: "Across the Volga from Tsaritsyn, Pokrovsk contained railway workshops, docks and extensive warehouses. The Whites arrested union organisers to keep the eastern bank secure, yet an underground committee continued sending repair logs and freight manifests to the Reds.\n\nOn the night of our arrival, the workers sounded the air-raid siren as their signal. They seized the armoury, barricaded the streets to the docks and blocked the railway with unfinished locomotives. White reinforcements stepped from their train into fire from workshops and water towers. By morning, Red troops and workers' patrols met at the station."
 rus_stalin_white_revolt_events.16.a: "The workers have liberated their own city."
 rus_stalin_white_revolt_events.17.t: "Cavalry on the Velikoknyazhesk Steppe"
 rus_stalin_white_revolt_events.17.d: "Velikoknyazhesk lay on the steppe roads towards the Don and Caucasus. White officers gathered cavalry there, requisitioned village horses and promised to restore the old land order after taking Moscow. Many poor Cossacks trusted neither these promises nor the officers who enforced them.\n\nRed agitators promised ordinary riders that those who disarmed could return home. Attempts to execute the messengers instead provoked two cavalry regiments to mutiny. When battle began, the mutineers rode into White headquarters while Red cavalry sealed the northern road. Within half a day every White banner had vanished from the steppe, and many former conscripts chose to join us."
 rus_stalin_white_revolt_events.17.a: "Let them ride for the people."
 rus_stalin_white_revolt_events.18.t: "The Red Banner Flies over Siberia"
 rus_stalin_white_revolt_events.18.d: "The vast lands of Siberia had long been the final refuge of the White remnants. The mobilisation of the rural Red Guards and the deep penetration of the Reunion Movement have now denied the reactionaries any sanctuary upon the frozen earth. Under the unified direction of Voroshilov and Zhdanov, Red Guards struck from railway settlements and the outskirts of the cities while regular Red Army formations closed the ring and severed every east-west route available to the Whites.\n\nWithin weeks, White strongholds across Siberia were submerged by the people's mobilisation. Omsk was surrounded before its garrison could break out, and a red flag flew above the city the following morning. At Novonikolayevsk, entire companies laid down their arms and many soldiers joined the Red Guards. In Irkutsk, agents of the Reunion Movement shattered the White headquarters from within. Scattered detachments attempted to resist from villages and forests, but repeated sweeps soon silenced their rifles beneath the snow. Weapons, ammunition and entire military depots fell into revolutionary hands.\n\nIn the Far East, the Cossack chieftain Semyonov attempted to rally cavalry and fugitive landowners along the eastern Trans-Siberian Railway. Before his orders reached every camp, partisans destroyed his reserve ammunition dump and Red Guards cut the road towards the Maritime Province. His cavalry was broken by artillery fire on the frozen rivers, while its baggage train sank into the thawing mud. Semyonov abandoned his standards and heavy weapons and escaped into Manchuria with only a few dozen followers.\n\nWith his forces destroyed, the Siberian Bolshevik–Left Socialist-Revolutionary government accepted the authority of the provisional government. Red banners now fly from the Urals to the Pacific. The railways carry grain and coal west once more, surrendered soldiers are being reorganised, and the new regime has planted deep roots across the immense territory. East of the Urals, no organised White resistance remains."
 rus_stalin_white_revolt_events.18.a: "Well done, comrades!"
 rus_stalin_white_revolt_events.19.t: "On the Work of the Party"
 rus_stalin_white_revolt_events.19.d: "Joseph Stalin\n\nSome comrades imagine that because ours is now the ruling party, because the working class has taken power, socialist consciousness will arise naturally and spontaneously among the masses, without the Party's concern and without systematic education. This is a most serious error, comrades: a rotten worship of spontaneity and the most naked form of tailism.\n\nIts harm lies in erasing the distinction between the proletarian vanguard and the broad masses, lowering our Party to the average level of the ordinary worker and denying its role as the advanced detachment and political leader of the working class. In What Is to Be Done?, Comrade Lenin demolished this economist fallacy once and for all. Worshipping spontaneity weakens socialist consciousness and clears the road for bourgeois ideology, for the spontaneous development of the labour movement subjects it to that ideology.\n\nWhat is the Party? It is the vanguard of the proletariat and the highest form of proletarian organisation. Its mission is not to trail behind the masses and record their moods, but to march ahead, lead them and raise them to socialist consciousness. If the Party does not introduce socialist consciousness into the labour movement, what purpose does it serve? Is it to become the tail of the trade unions, or a loudspeaker for the spontaneous moods of the non-party masses? No, comrades. The whole work of the Party consists in arming the working class with revolutionary theory and uniting socialist consciousness with the labour movement. Without this union there can be no genuine proletarian party, no revolutionary victory and no consolidation of the dictatorship of the proletariat."
 rus_stalin_white_revolt_events.19.d_2: "The immense task of socialist construction now stands before us. Yet the remnants of bourgeois thought did not vanish with the old order. They remain in people's minds, hide in a thousand corners of daily life and constantly reproduce themselves. Petty-bourgeois spontaneity surrounds and entangles the working class through private-property habits, speculation, nationalist prejudice and bureaucratic conduct. International capitalism likewise seeks restoration through bribery, espionage and ideological penetration.\n\nWhat, then, does weakening the Party's ideological work mean? It means allowing bourgeois ideology to flood freely and surrendering our positions to the enemy. To underestimate socialist education is objectively to aid the bourgeoisie and prepare the restoration of capitalism. This is not alarmism; it is an iron reality.\n\nWhat, therefore, are the Party's immediate tasks?"
 rus_stalin_white_revolt_events.19.a: "First, the Party's tasks must be made clear."
 rus_stalin_white_revolt_events.20.d: "First, Marxist-Leninist theoretical education must be strengthened within the Party. We cannot tolerate a gentlemanly indifference to theory. Our cadres, particularly the young, must master Marxism-Leninism, for only theory permits them to judge circumstances correctly, foresee the course of events and avoid losing their political bearings. Whoever imagines practical experience can replace theoretical cultivation is shortsighted, a narrow practitioner destined eventually to stumble in politics.\n\nSecond, ideological education must penetrate the working class and all labouring people. Factories, collective farms, schools, newspapers and clubs must become strongpoints from which the Party introduces socialist consciousness. In the language of the masses, through living facts and concrete examples, workers and peasants must be shown what socialism and capitalism are and what our struggle seeks. Every labourer must connect their fate with that of the Soviet state and consciously, loyally and enthusiastically struggle for socialism.\n\nThird, an irreconcilable struggle must be fought on the ideological front. Opportunism, nationalism, religious prejudice and every bourgeois influence must be denied any opening. Criticism and self-criticism are sharp weapons in the Party's hands and must never be left unused. To fear exposing mistakes and fighting erroneous tendencies is rotten liberalism, incompatible with Bolshevism. Party workers must not be agreeable men afraid of causing offence, but principled political fighters who expose every deviation from Marxism-Leninism sharply, openly and honestly, no matter who advances it or what clothing it wears.\n\nSome comrades ask whether this will provoke dissatisfaction and strain relations. Bolsheviks have never worked by flattering the masses. Liberal philistines who fear criticism are the least reliable sort of 'communist'. Their weakness and desire to avoid conflict inflict greater damage upon the Party than open enemies. An open enemy can be seen and struck precisely; the philistine conceals decay behind the 'interests of the Party' and corrodes its fighting strength."
 rus_stalin_white_revolt_events.20.a: "The Party must be a principled political fighter."
 rus_stalin_white_revolt_events.21.d: "Comrades! Our Party grew and was tempered in struggle. Through the darkness of tsarist autocracy, the furious White assaults of the Civil War and the mortal contest with reaction, it overcame countless difficulties. Its strength came from the armour of Marxist theory, limitless loyalty to the working-class cause, steel-like unity and iron discipline.\n\nNow that we have achieved a great historical victory, there can be no relaxation. The more favourable our position, the more we must strengthen ideological work and revolutionary vigilance. We must remember capitalist encirclement, remember that the class enemy does not sleep, and remember that he still dreams of restoring the old roots of capitalism in the Soviet Union.\n\nIntroducing socialist consciousness into the labour movement has always been the Party's policy; it was so yesterday, is so today and will remain so tomorrow. Whoever belittles or weakens this policy helps the enemy, sabotages socialist construction and prepares the restoration of capitalism.\n\nOur Party is powerful because it is armed with Marxism-Leninism. It is invincible because it is bound by flesh and blood to the working class and all labouring people. We must guard its ideological purity and organisational unity as the apple of our eye. With greater firmness, persistence and skill, we must unite millions beneath the banner of Marxism-Leninism and advance towards communism with unbreakable Bolshevik determination.\n\nAbandoning illusions about spontaneity and resolutely, systematically introducing socialist consciousness among the masses—this is the entire essence of the Party's work."
 rus_stalin_white_revolt_events.21.a: "This is the sure guarantee of proletarian dictatorship and socialist construction."
 rus_stalin_white_revolt_events.22.t: "On the 'Reunion Movement'"
 rus_stalin_white_revolt_events.22.d: "Although the Bolsheviks were defeated in the Civil War, their political influence endures.\n\nUnder the direction of the Bolshevik leadership, a terrorist organisation formed by Kliment Yefremovich Voroshilov and Andrei Alexandrovich Zhdanov continues a desperate struggle against the military across the vast Siberian plain.\n\nTheir greatest notoriety came during the campaign against Fengtian, when they cooperated with the maximalist Socialist-Revolutionaries in an unsuccessful attempt on Field Marshal Kornilov's life. The authorities spent immense manpower and resources on the subsequent pursuit, yet failed to strike an effective blow against the 'Reunion Movement'. The campaign instead magnified its reputation and transformed it into a spiritual symbol for the remaining Red bandits.\n\nThe latest reports of the High Command and investigations on the ground compel a candid admission: the present offensive cannot end the conflict in the short term. The primeval forests and marshes east of the Yenisei provide natural shelter for the Voroshilov-Zhdanov gang, while its decentralised cells frustrate our traditional fortress-and-railway pacification scheme. More troubling still, prolonged isolation and dependence upon smuggled supplies have produced a passive symbiosis between the terrorists and certain remote settlements. The line separating friend from foe grows ever less distinct..."
 rus_stalin_white_revolt_events.22.a: "Do these fools still think it is 1917?!"
 RUS_stalin_post_white_revolt_events.1.t: "The Kazan Incident"
 RUS_stalin_post_white_revolt_events.1.d: "The course of the Civil War has proved far less smooth than we imagined. In Kazan, bitter armed clashes have erupted between spontaneously organised rural communes and local armed forces. Similar conflicts have occasionally broken out elsewhere, laying bare an increasingly acute fundamental contradiction: the land.\n\nThe former liberal governments had years to act, yet the land question was never fully resolved. Central decrees have long existed on paper, but weak local administration, unreliable grassroots officials and the disorder left by the war have all slowed their implementation. Around Kazan, wealthy peasants have exploited this vacuum to preserve their effective control over the land under the names of ‘tenancy contracts’ and ‘debtor relations’. Poor peasants and Red Army veterans, meanwhile, have grown increasingly agitated as the promised land fails to reach them. Radicals in the rural communes concluded that ‘the decrees are sufficient; action is what is lacking’ and formed armed groups to seize the land directly. Local troops, ordered from above to ‘maintain order and protect all lawful property’, moved to stop them. Neither side yielded, and a large-scale armed confrontation followed.\n\nMore troubling still, the conflict quickly acquired a political meaning far beyond a dispute over land. Local kulaks and the old cooperative interests have cast themselves as ‘defenders of order against the new Bolshevik tyranny’, while the security organs report that some of the communes' radical actions ‘may have been infiltrated by White agitators’. In Kazan, a dispute that might once have been mediated has swiftly been interpreted by both sides as ‘a confrontation between revolution and counter-revolution’. Such an interpretation is precisely the most dangerous by-product of the long delay in carrying out land reform..."
 RUS_stalin_post_white_revolt_events.1.a: "This will be a struggle to the death..."
 RUS_stalin_post_white_revolt_events.1.a_tt: "Land reform is now §Rtoo urgent to delay§!! The participation of certain ‘rural Bolshevik’ comrades may prove helpful in this work."
