l_english:
  rus_stalin_startup_events.1.t: "The Legacy of the Volga Famine"
  rus_stalin_startup_events.1.desc: "After the Civil War, what remains most seared into the memory of contemporary Russians, aside from the disastrous Far Eastern campaign, is the great famine that swept the Volga basin in 1932.\n\nIn the spring and summer of 1932, the Volga basin was struck by an extraordinary drought. From May onward, scarcely a proper rain fell; by July, scorching heat had burned the young shoots in the fields, and wheatlands that should have turned golden became grey-brown wastelands. In more than thirty counties along the middle and lower Volga, the grain harvest amounted to less than one-fifth of a normal year. One official sent to inspect the region wrote in his report: “This is no longer the realm of men; all that remains is bone and despair.”\n\nHunger spread quickly. People stripped bark from trees, boiled grass roots, and even ground clay into powder to fill their stomachs. Livestock perished in droves for lack of fodder, and in many villages even the sounds of chickens and dogs vanished. By incomplete estimates, from the winter of 1932 to the spring of 1933, hundreds of thousands in the Volga region died of starvation. Refugees streamed along the railways toward Moscow, while those who collapsed along the way were left unburied."
  rus_stalin_startup_events.1.desc_2: "The social consequences of this famine were profound.\n\nFirst, the social structure of the countryside was torn apart. The already fragile middle peasantry virtually disappeared: some were ruined by famine, others sold their last grain simply to survive, and the great majority sank into poverty. The kulaks, meanwhile, hoarded grain, lent at usurious rates, and swallowed up land and tools at humiliating prices. Inequality widened within a single season to a shocking degree. The old, rough habits of mutual aid among peasants gave way to naked competition for survival.\n\nSecond, peasant trust in the government fell to its lowest point. No one any longer believed the Kadet proclamation that “freedom brings freedom.” Peasants turned instead to the populist movement of the Guarding Alliance, convinced that Savinkov, the “hero of the peasants,” could lead them to reclaim the land. The famine thus became one of the key reasons Savinkov later came to power.\n\nFinally, the famine exposed, in the cruelest possible way, the urgency of land reform. After this catastrophe, Russia’s land structure became as fragile as a string about to snap, unable to withstand further strain.\n\nIf the relations of production and distribution in the countryside are not transformed, the next famine will be still more terrible—and when it comes, there may be no chance left to begin again."
  rus_stalin_startup_events.next: "Continue."
  rus_stalin_startup_events.1.a: "Never again shall tragedy be repeated!"
