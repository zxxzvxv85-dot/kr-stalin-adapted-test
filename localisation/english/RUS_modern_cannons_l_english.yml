 RUS_modern_high_velocity_cannon: "Modern High-Velocity Cannon"
 RUS_modern_high_velocity_cannon_desc: "A modern cannon designed for extremely high muzzle velocity. Specialized ammunition gives it exceptional anti-armour performance, while improved shells also increase its effectiveness against soft targets."
 RUS_modern_heavy_cannon: "Modern Heavy Cannon"
 RUS_modern_heavy_cannon_desc: "A modern large-calibre cannon with formidable performance against both soft and armoured targets, at the cost of considerable size, weight, and expense."
 EQ_MOD_CAT_RUS_modern_main_armament_TITLE: "Modern Tank Main Armament"
 RUS_modern_cannons_unlock: "Modern Tank Armament"
 RUS_modern_cannons_unlock_desc: "Modern tank chassis can mount the Modern High-Velocity Cannon and Modern Heavy Cannon."
