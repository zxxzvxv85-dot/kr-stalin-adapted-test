l_english:
 RUS_modern_high_velocity_cannon: "Modern High-Velocity Cannon"
 RUS_modern_high_velocity_cannon_desc: "A modern cannon designed for extremely high muzzle velocity. Specialized ammunition gives it exceptional anti-armour performance, while improved shells also increase its effectiveness against soft targets."
 RUS_modern_heavy_cannon: "Modern Heavy Cannon"
 RUS_modern_heavy_cannon_desc: "A modern large-calibre cannon with formidable performance against both soft and armoured targets, at the cost of considerable size, weight, and expense."
 EQ_MOD_CAT_RUS_modern_main_armament_TITLE: "Modern Tank Main Armament"
 RUS_modern_cannons_unlock: "Modern Tank Armament"
 RUS_modern_cannons_unlock_desc: "Completing the Modern Fin-Stabilized Discarding Sabot special project unlocks the Modern High-Velocity Cannon and Modern Heavy Cannon. Both count as medium main armaments and no longer require a modern tank chassis."
 sp_land_modern_fin_stabilized_discarding_sabot: "Modern Fin-Stabilized Discarding Sabot"
 sp_land_modern_fin_stabilized_discarding_sabot_desc: "Develop a new generation of fin-stabilized discarding-sabot ammunition whose long penetrator, high velocity, and aerodynamic stability greatly improve the armour penetration of modern tank guns."
 sp_land_modern_fin_stabilized_discarding_sabot_speed_factor: "Modern Fin-Stabilized Discarding Sabot Research Speed"
