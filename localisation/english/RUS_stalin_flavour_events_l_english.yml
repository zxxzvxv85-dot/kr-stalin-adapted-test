 RUS_stalin_flavour_events.1.t: "A Bolshevik from the Mountains"
 RUS_stalin_flavour_events.1.d: "The Georgian author Lavrentiy Beria, popularly known as 'Ultraman Beria', has recently published a new work of alternate history entitled §IA Bolshevik from the Mountains§!. The novel is set after a Red victory in the Russian Civil War, at the dawn of a Union of Soviet Socialist Republics.\n\nIts protagonist, Soselo, is born to an impoverished Georgian peasant family. Introduced to Marxism while studying at a seminary, he naturally joins the Bolsheviks as a young man and becomes a devoted follower of Lenin. He gradually rises into the inner leadership and, when the Civil War reaches its hour of crisis, takes military command and turns the tide against a White counterattack outside Kazan. After Lenin succumbs to his wounds, Soselo succeeds him as General Secretary and guides the Soviet state through enemies at home and abroad. Under Comrade Soselo's wise leadership, the Soviet Union accomplishes feats without precedent in human history: within a few decades, the book claims, famine and illiteracy are abolished, Soviet industry becomes the greatest in the world, and a red banner is planted on Mars.\n\nThe novel's sweeping utopian narrative caused an immediate sensation. Radical syndicalists and communists hailed it as 'a blueprint for utopia', while conservative syndicalists and liberals condemned its disregard for realism and want of serious thought.\n\nNotably, Grigory Zinoviev, then serving as deputy chairman of the All-Russian Union of Labour, was equally unimpressed, judging the work 'insufficiently expressive of revolutionary ardour'."
 RUS_stalin_flavour_events.1.a: "Does alternate history really sell this well nowadays?"
 RUS_stalin_flavour_events.2.t: "Professor Nikola Tesla Retires"
 RUS_stalin_flavour_events.2.d: "MOSCOW, 26 December 1940:\n\nThe Electrification Commission announced today that Professor Nikola Tesla, the renowned electrical engineer and pioneer of alternating-current systems, has formally requested retirement on account of his advanced age and declining health. The Council of People's Commissars has approved his request. Effective immediately, Professor Tesla will relinquish his post as Chief Engineer for Electrical Standardisation. His concurrent office as chairman of the Electrification Commission will pass to Comrade Gleb Maximilianovich Krzhizhanovsky. Tesla will retain the honorary title of Adviser to the Electrical Power Industry and may still be consulted as an expert.\n\nProfessor Tesla came to Russia by invitation in the early 1920s and has now served here for nearly twenty years. During that time he directed the adoption of a uniform fifty-hertz, three-phase alternating-current standard throughout Russia. He brought order to the inherited confusion of German and American equipment and made it possible to interconnect the country's electrical networks, laying a firm energy foundation for industrialisation. His advocacy of long-distance transmission and his proposals for wireless power have likewise shaped subsequent research programmes.\n\nIn approving the retirement, the Council of People's Commissars declared that Professor Tesla 'devoted his life's strength to the electrical advancement of mankind and gave freely of his knowledge when the Russian people stood in greatest need of technical assistance; his contribution has entered the annals of socialist construction.'\n\nProfessor Tesla will reportedly move to a sanatorium outside Moscow, where he intends to continue his theoretical research and writing. The All-Russian Electrotechnical Institute will provide him with a small laboratory for his private investigations. The incoming chairman, Comrade Krzhizhanovsky, has promised to carry forward Tesla's unfinished work in long-distance transmission and electrification."
 RUS_stalin_flavour_events.2.a: "May you enjoy your retirement, Professor!"
 RUS_stalin_flavour_events.3.t: "Tesla Electric Begins Operations"
 RUS_stalin_flavour_events.3.d: "With [RUSGetTeslaAppointmentClause] Tesla Electric with state industrial projects, the technical staff assembled under Professor Tesla has finally secured dependable funding, equipment and testing grounds. Its engineers have begun cataloguing the country's electrical networks and training specialists capable of locating faults at a moment's notice.\n\n§YThe 'All-Russian Power Grid Troubleshooting' minigame has been unlocked and can be opened from the Tesla Electric category in the Decisions tab.§!"
 RUS_stalin_flavour_events.3.a: "Let us see what the engineers have prepared."
 RUS_stalin_flavour_events.4.t: "Kirov's Dream"
 RUS_stalin_flavour_events.4.d: "Ever since Sergei Kirov was sent to hospital after a bestselling novel fell from high above and struck him in the street, his sleep has been haunted by dreams that defy all reason:\n\n'Is this... Leningrad? The sky is so dark, and there is nobody about. All the other comrades are working so hard; I should redouble my efforts and join them. Why does it feel so cold behind me? You are... ah!'\n\n'Why does everything look so strange? What is that soldier reporting? Why are the Russian soldiers here speaking English... Are we in the sky?! What does ‘Kirov reporting’ mean???'"
 RUS_stalin_flavour_events.4.a: "The first thing Kirov did upon waking was visit a sanatorium."
 RUS_tesla_appointment_clause_socialist: "the Council of People's Commissars formally entrusting"
 RUS_tesla_appointment_clause_default: "the Russian government formally entrusting"
 RUS_tesla_electrical_industries: "Tesla Electric"
 RUS_tesla_electrical_industries_desc: "The technical staff assembled under Professor Tesla has become an electrical concern in its own right and will continue his work on uniform power standards, long-distance transmission and nationwide electrification."
