 RUS_tesla_electrical_industries: "Tesla Electric"
 RUS_tesla_electrical_industries_desc: "The technical staff assembled under Professor Tesla has become an electrical concern in its own right and will continue his work on uniform power standards, long-distance transmission and nationwide electrification."
