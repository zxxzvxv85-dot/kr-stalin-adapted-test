 RUS_kliment_voroshilov: "Kliment Yefremovich Voroshilov"
 RUS_kliment_voroshilov_army_chief: "Kliment Yefremovich Voroshilov"
 RUS_kliment_voroshilov_advisor_desc: "§YBorn:§! §LJanuary 23rd, 1881; Bakhmut Uyezd, Yekaterinoslav Governorate, Russian Empire§!\n§YBackground:§! §LKliment Yefremovich Voroshilov was born into the family of a railway worker in Bakhmut Uyezd, Yekaterinoslav Governorate. As a child, he worked as a shepherd and a miner. From 1893 to 1895, he studied at a zemstvo school.\n\nIn 1896, he found work at the Yekaterininsky Works of the Donets-Yuryev Metallurgical Society. He was dismissed for organising a strike, an experience that first revealed his considerable talent for organisation. In 1903, he became a worker at the Lugansk Locomotive Works. By the end of that year, bitter disappointment with the workers' treatment and the influence of radical underground newspapers had led him to join the Russian Social Democratic Labour Party (Bolshevik).\n\nBetween 1904 and the outbreak of the Weltkrieg, Voroshilov was arrested three times and exiled twice. Whenever he regained his freedom, he returned to underground work in Lugansk, twice becoming one of the local Bolshevik leaders, and attended two party congresses. After the war began in 1914, he worked at the Tsaritsyn Artillery Works.\n\nFollowing the February Revolution of 1917, he was elected to the Petrograd Soviet of Workers' and Soldiers' Deputies. In March, he became chairman of the Bolshevik committee in Lugansk, and in August attended the Sixth Congress of the Russian Social Democratic Labour Party (Bolshevik).\n\nDuring the Petrograd armed uprising in November 1917, Voroshilov served on the Petrograd Military Revolutionary Committee. A month later, he joined Felix Edmundovich Dzerzhinsky in the work of establishing the All-Russian Extraordinary Commission.\n\nIn March 1918, Voroshilov formed the 1st Lugansk Socialist Detachment to resist the Austro-German advance into the Donbas. He later commanded the Fifth Army and served as deputy commander and a military council member of the Southern Front. From October 3rd to December 18th, he commanded the Tenth Army during the Battle of Tsaritsyn.\n\nAt the Eighth Congress of the Russian Communist Party (Bolshevik) in 1919, Voroshilov sided with Stalin's Military Opposition. When Trotsky sanctimoniously proposed establishing a commissar system before employing former officers, Voroshilov slammed the table and roared: 'Fuck you! This military-political system was proposed by our late leader, Comrade Vladimir Ilyich Lenin, before his assassination. After his death, you, a former Menshevik parasite of the Revolutionary Military Council, buried it and refused to implement it. Now you present it as a compromise. It is fucking disgusting!' He then stormed out of the hall.\n\nSoon afterwards, acting on instructions from Sverdlov, Stalin, Frunze and others, Voroshilov led his troops towards Lake Baikal, joined local guerrillas skilled in winter warfare, and reorganised them into a Bolshevik military-partisan force that remained in the Russian heartland after the main Bolshevik armies withdrew. Their continued attacks on the White government and extraordinary mastery of the frozen wilderness led terrified local Whites to call them the 'Yetis'. The Yetis enjoyed such a strong reputation among ordinary people that villagers treated the partisans like family, providing them with a steady stream of recruits and supplies.\n\nVoroshilov and Zhdanov, a fellow countryman likewise engaged in guerrilla struggle inside Russia, established radio contact and founded the Integration Movement, a combined political and military organisation intended to rally the oppressed against their exploiters.\n\nWith the red flag flying above the Kremlin once more, Voroshilov will finally be able to return to Lugansk, the home he has not seen for twenty years, once German imperialism has been defeated.§!"
 RUS_kliment_voroshilov_recruit_tt: "§YKliment Yefremovich Voroshilov§! will join as a §YField Marshal§!."
 RUS_kliment_voroshilov_army_chief_tt: "§YKliment Yefremovich Voroshilov§! will become available as §YChief of Army§!: §YArmy Breakthrough (Master)§!."
