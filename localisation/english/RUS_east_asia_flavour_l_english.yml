l_english:
 RUS_east_asia_flavour.1.t:0 "The East Is Red"
 RUS_east_asia_flavour.1.d:0 "“The revolution in colonial and semi-colonial countries must first overthrow foreign imperialist oppression and establish independent nation-states; only then, under the leadership of a proletarian party, should it embark upon a non-capitalist path of development.”\n\nAs the world revolution gathers strength, debate over internationalist aid has swept through our country in wave after wave. The voices calling attention to the revolution in East Asia have been especially prominent. The victory of the National Government in Nanjing has given most comrades renewed confidence in the future of the revolution in the East. A commentary in the latest issue of Pravda argues that the awakening of the colonial and semi-colonial peoples of East Asia is no longer confined to nationalist uprisings of the old kind. Through its own victory, a great eastern country of hundreds of millions is demonstrating that the chains of imperialism in Asia can be broken.\n\nThe article goes on to argue that the National Government's commitment to the New Three Principles of the People, together with its anti-imperialist stance and the first steps towards land reform, has fundamentally changed the prospects for revolution in East Asia. Our country should seize this historic opportunity to offer stronger moral and material support. Some comrades have even proposed sending an official military advisory mission to Nanjing as soon as possible, accompanied by aid in the form of industrial equipment.\n\nMore cautious voices, however, remind us that the road ahead will be far from smooth. Imperialism will not willingly withdraw from this continent, while the next stage of national liberation—the transition towards a socialist path of development—will test the resolve and wisdom of every revolutionary."
 RUS_east_asia_flavour.1.a:0 "Long live revolutionary China!"
 RUS_east_asia_flavour.1.b:0 "I remain more interested in our Bolshevik friends in the East…"
 RUS_east_asia_flavour.1.b.tt:0 "Looking for more content about the Chinese Revolution? Perhaps you could try “§R长夜孤星§!”!"
