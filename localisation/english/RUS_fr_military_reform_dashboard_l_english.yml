 RUS_fr_dashboard_stage_1_tt:0 "§YStage I: Command Rectification§!\nRe-examine officer files, dismantle infiltrator networks, and restore an effective chain of command from the central staff to the front line.\n\nCost: £army_experience §Y[?RUS_fr_xp_cost_100|1]§!\nDuration: §Y120 days§!\nRequires: the §YMilitary Rectification§! focus\n\n§GClick the icon to begin once all conditions are met.§!"
 RUS_fr_dashboard_stage_2_tt:0 "§YStage II: Organisation and Political Command§!\nStandardise battalion and company tables and clarify the duties of commanders, political organs, and soldiers' bodies.\n\nCost: £army_experience §Y[?RUS_fr_xp_cost_100|1]§!\nDuration: §Y120 days§!\nRequires: §YStage I§! and the §YUnified Military-Political System§! focus\n\n§GClick the icon to begin once all conditions are met.§!"
 RUS_fr_dashboard_stage_3_tt:0 "§YStage III: Training and Operational Co-ordination§!\nUse rotation training, military academies, and field exercises to turn written regulations into a common operational method.\n\nCost: £army_experience §Y[?RUS_fr_xp_cost_100|1]§!\nDuration: §Y90 days§!\nRequires: §YStage II§! and the §YArmy Reorganisation§! focus\n\n§GClick the icon to begin once all conditions are met.§!"
 RUS_fr_dashboard_stage_4_tt:0 "§YStage IV: Nationwide Field Trials§!\nTest mobilisation, supply, communications, and the new formations in a nationwide exercise, bringing the basic reforms to their final form.\n\nCost: £army_experience §Y[?RUS_fr_xp_cost_100|1]§!\nDuration: §Y90 days§!\nRequires: §YStage III§! and the §YArmy Reorganisation§! focus\n\n§GClick the icon to begin once all conditions are met.§!"
 RUS_fr_dashboard_unlock_stage_1_tt:0 "Enables the §YStage I Reform§! button on the §YArmy Reform§! panel"
 RUS_fr_dashboard_unlock_stage_2_tt:0 "Enables the §YStage II Reform§! button on the §YArmy Reform§! panel"
 RUS_fr_dashboard_unlock_late_stages_tt:0 "Enables the §YStage III and Stage IV Reform§! buttons on the §YArmy Reform§! panel; the two stages must still be completed in order"
 RUS_fr_topbar_military_reform_materials_value:0 "[?ROOT.RUS_fr_military_reform_materials|2]/[?ROOT.RUS_fr_military_reform_materials_limit|0] | [?ROOT.RUS_fr_military_reform_materials_daily_growth|2+=]"
 RUS_fr_topbar_military_reform_materials_tt:0 "£GFX_RUS_fr_military_reform_materials §YMilitary Reform Materiel§!\n\nBase daily gain is §G+1.00§!. Each score stage reached by the §YFirst Five-Year Plan§! adds §G+0.05§!. Completing §YUnified Command and Organisation§! and §YThe People's and Revolutionary Army§! raises the stockpile limit by §Y10§! each.\n\nWhen selecting the §YFederal Armaments and Defence Industry Commission§! or a focus below it, a stockpile at least equal to the focus duration is consumed to complete it immediately. With insufficient materiel, the focus proceeds normally."
 RUS_fr_materials_system_unlocked_tt:0 "Unlocks £GFX_RUS_fr_military_reform_materials §YMilitary Reform Materiel§! with a base cap of §Y60§! and a base daily gain of §G+1.00§!. Each §YFirst Five-Year Plan§! score stage adds §G+0.05§! daily gain. Also unlocks the §YNationwide Military Reform§! decision category."
 RUS_fr_military_reform_materials_limit_increase_10_tt:0 "£GFX_RUS_fr_military_reform_materials Military Reform Materiel cap: §Y+10§!"
 RUS_fr_focus_materials_instant_completion_tt:0 "If the current £GFX_RUS_fr_military_reform_materials §YMilitary Reform Materiel§! stockpile is at least equal to this focus's duration in days, selecting it consumes that amount and §Gcompletes it immediately§!. With insufficient materiel, the focus proceeds normally."
