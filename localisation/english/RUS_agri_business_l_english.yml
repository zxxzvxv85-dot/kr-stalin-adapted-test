 RUS_agri_preview_summary:0 "Baseline: receipts §Y[?RUS_agri_preview_receipts|1]§!  balance §Y[?RUS_agri_preview_capital|1]§!  profit §Y[?RUS_agri_preview_profit|1]§!"
 RUS_agri_business_rules_tt:0 "Full-price capacity is 3-5 investment units per crop per quarter. The next 2 units lose 0.30 from their return multiplier; further units lose 0.70. Each tier has a 0.40 minimum.\nInvesting at least 5 units or over half of total investment raises that crop's fatigue by 1 next quarter. Investing at most 2 without concentrating restores 1; otherwise fatigue stays unchanged. Each level costs 0.15, up to 3 levels, persisting across years.\nOrders are checked at settlement. Each pays 0.65 times its required investment in capital, plus 1 reform point during or after successful reform. No points before reform or after failure. Bonuses do not count toward crop yield; closing capital is capped at 30.\nThe baseline excludes weather and markets but includes orders meeting their investment targets. Unconfirmed allocations are replaced by balanced investment at the deadline."
