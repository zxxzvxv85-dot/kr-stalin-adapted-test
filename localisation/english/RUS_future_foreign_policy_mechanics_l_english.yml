 RUS_future_foreign_016_effect_tt:0 "Unlocks the dynamic modifier §YThe Soviets and the Phalanstere§!.\nEach European socialist country grants §G+1%§! research-sharing bonus; each American socialist country grants §G+1%§! Trade Opinion Factor and §G-0.5%§! Consumer Goods Factor; each Asian, African or Oceanian socialist country grants §G+1%§! Infrastructure construction speed.\nWhen an MIO completes a technology, each socialist country provides £civ_factory_output §G25§! economic surplus.\nEach completed new foreign-policy focus increases the Consumer Goods Factor by §R1%§!."
 RUS_future_foreign_exchange_five_year_plan_score:0 "Reallocate Five-Year Plan Resources"
 RUS_future_foreign_exchange_five_year_plan_score_desc:0 "Transport, equipment and organisers required by the foreign front can be drawn from the Five-Year Plan's accumulated achievements. Each plan point committed raises revolutionary readiness by one point."
 RUS_future_foreign_exchange_five_year_plan_score_effect_tt:0 "Five-Year Plan Score: §R-1§!\nRevolutionary Readiness: §G+1§!"
