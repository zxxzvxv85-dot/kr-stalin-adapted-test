 RUS_future_foreign_nordic_effect_negative:0 "\nRelations below §Y0§!:\n£stability_texticon Base stability: §R-2.00%§!\n£boost_popularity_texticon Radical socialist support: §G+2.00%§!\n"
 RUS_future_foreign_nordic_effect_low:0 "\nRelations §Y0 to 40§!:\n£stability_texticon Base stability: §R-5.00%§!\n£boost_popularity_texticon Radical socialist support: §G+5.00%§!\n"
 RUS_future_foreign_nordic_effect_mid:0 "\nRelations §Y41 to 80§!:\n£civilian_intel_texticon Civilian intelligence: §G+50.00%§!\n£stability_texticon Base stability: §R-8.00%§!\n£boost_popularity_texticon Radical socialist support: §G+10.00%§!\n"
 RUS_future_foreign_nordic_effect_pact:0 "\nRelations §Y81 to 100§!:\nNon-aggression pact: signed\n£pol_power Russia's political power: §G+50§!\n£pol_power Target's political power: §G+50§!\n"
 RUS_future_foreign_nordic_effect_invite:0 "\nRelations above §Y100§! and socialist target: unlocks a decision to invite the target into the Russian faction.\n"
 RUS_future_foreign_nordic_effect_none:0 "\nRelations above §Y100§! and non-socialist target: no additional effect.\n"
 RUS_future_foreign_nordic_relation_low_negative:0 "Strained Nordic Relations"
 RUS_future_foreign_nordic_relation_low_negative_desc:0 "Deteriorating relations with Russia are undermining domestic stability."
 RUS_future_foreign_nordic_relation_low:0 "Cool Nordic Relations"
 RUS_future_foreign_nordic_relation_low_desc:0 "Cool relations with Russia are creating political pressure."
 RUS_future_foreign_nordic_relation_mid:0 "Distant Nordic Relations"
 RUS_future_foreign_nordic_relation_mid_desc:0 "Limited cooperation with Russia is accompanied by domestic unease."
 RUS_future_foreign_nordic_relation_faction:0 "Nordic Bloc Confrontation"
 RUS_future_foreign_nordic_relation_faction_desc:0 "Membership in a rival faction exposes the country to Russian political and intelligence pressure."
 RUS_future_foreign_nordic_invite:0 "Invite [FROM.GetNameDef] to the Russian Faction"
 RUS_future_foreign_nordic_invite_desc:0 "Dzerzhinsky will directly bring this socialist country into the faction created by Russia. The target joins immediately when the decision is completed, without waiting for a reply."
 RUS_future_foreign_nordic_invite_available_tt:0 "Russia must be a faction leader; the target must be a socialist country in no faction, have relations above §Y100§!, and Russia must have at least §Y20§! political power."
 RUS_future_foreign_agriculture_enabled_tt:0 "§YUstinov's agricultural minigame§! is active."
 RUS_future_foreign_policy_events.5.t:0 "The Final Struggle"
 RUS_future_foreign_policy_events.5.d:0 "Revolutionary Readiness Falters"
 RUS_future_foreign_policy_events.5.a:0 "Understood."
 RUS_future_foreign_policy_events.6.t:0 "The Cloud in Trousers"
 RUS_future_foreign_policy_events.6.d:0 "I came from the streets, blackened by streetlamps and polished by rain. I stand before you like a naked truth.\n\nThe final end has come: there is nowhere left to run. My poem is a hammer that shatters every window and hail that ruins every garden.\n\nI will die like a torn flag, but before I die, I will turn this whole world upside down!"
 RUS_future_foreign_policy_events.6.a:0 "Let Poland join our faction."
