 RUS_future_foreign_016_effect_tt:0 "Unlocks the dynamic modifier §Y$RUS_soviets_and_phalanstere$§!.\nEach European socialist country grants §G+1%§! $MODIFIER_RESEARCH_SHARING_PER_COUNTRY_BONUS$; each American socialist country grants §G+1%§! $MODIFIER_TRADE_OPINION_FACTOR$ and §G-0.5%§! $MODIFIER_CONSUMER_GOODS_FACTOR$; each Asian, African or Oceanian socialist country grants §G+1%§! $modifier_production_speed_infrastructure_factor$.\nWhen an MIO completes a technology, each socialist country provides £civ_factory_output §G25§! economic surplus.\nEach completed new foreign-policy focus increases the $MODIFIER_CONSUMER_GOODS_FACTOR$ by §R1%§!."
 RUS_future_foreign_047_merge_tt:0 "Modify §Y$RUS_soviets_and_phalanstere$§! by:\n$MODIFIER_CONSUMER_GOODS_FACTOR$: §G-15.00%§!\n$MODIFIER_RESEARCH_SPEED_FACTOR$: §G+5.00%§!\n$country_resource_oil$: §R-40§!\nThese additional effects will be removed once war with Germany breaks out."
 RUS_future_foreign_exchange_five_year_plan_score:0 "Reallocate Five-Year Plan Resources"
 RUS_future_foreign_exchange_five_year_plan_score_desc:0 "Transport, equipment and organisers required by the foreign front can be drawn from the Five-Year Plan's accumulated achievements. Each plan point committed raises revolutionary readiness by one point."
 RUS_future_foreign_exchange_five_year_plan_score_effect_tt:0 "Five-Year Plan Score: §R-1§!\nRevolutionary Readiness: §G+1§!"
