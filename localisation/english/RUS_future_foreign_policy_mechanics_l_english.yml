l_english:
 RUS_third_international_gendarme:0 "Gendarme of the Third International"
 RUS_third_international_gendarme_desc:0 "Russia's revolutionary army is learning from socialist struggles abroad."
 RUS_third_international_gendarme_status_tt:0 "Socialist countries where volunteer interventions were won: §Y[?RUS_third_international_gendarme_victories|0]§!\nOnly §Ysocialist countries§! that received our volunteers are counted.\nBalkan socialist countries counted: §Y[?RUS_third_international_gendarme_balkan_count|0]§! (counted once §YUnder the Starry Sky§! is completed)"
 RUS_soviets_and_phalanstere:0 "The Soviets and the Phalanstere"
 RUS_soviets_and_phalanstere_desc:0 "The Soviets coordinate research, trade and construction with socialist countries according to the conditions of each continent."
 RUS_soviets_and_phalanstere_status_tt:0 "European socialist countries: §Y[?RUS_soviets_and_phalanstere_europe_country_count|0]§!\nAmerican socialist countries: §Y[?RUS_soviets_and_phalanstere_america_country_count|0]§!\nAsian, African and Oceanian socialist countries: §Y[?RUS_soviets_and_phalanstere_afro_asia_oceania_country_count|0]§!\nWhen an MIO completes a technology, each socialist country provides £civ_factory_output §G25§! economic surplus; current total: £civ_factory_output §G[?RUS_soviets_and_phalanstere_mio_surplus|0]§!."
 RUS_franco_russian_industrial_cooperation:0 "Franco-Russian Industrial Cooperation"
 RUS_franco_russian_industrial_cooperation_desc:0 "French heavy machinery and engineers are helping Russia develop its mineral resources and improve the associated infrastructure and trade networks."
 RUS_future_foreign_joint_develop_pokrovsk_tungsten:0 "Jointly Develop the Pokrovsk Tungsten Mines"
 RUS_future_foreign_joint_develop_pokrovsk_tungsten_desc:0 "Under the Paris-Moscow Treaty, Russia and the Commune of France will jointly invest in developing the tungsten mines at Pokrovsk. Part of the new capacity will remain locally available, while the rest will form France's long-term extraction share."
 RUS_future_foreign_017_pokrovsk_unlock_tt:0 "Unlocks diplomatic decision: §Y$RUS_future_foreign_joint_develop_pokrovsk_tungsten$§!"
 RUS_pokrovsk_tungsten_concession:0 "Pokrovsk Tungsten Concession"
 RUS_pokrovsk_tungsten_concession_desc:0 "Under the joint development agreement with Russia, the Commune of France enjoys a long-term share of the tungsten extracted at Pokrovsk."
 RUS_future_foreign_joint_develop_zlatoust_chromium:0 "Develop the Zlatoust Chromium Mines"
 RUS_future_foreign_joint_develop_zlatoust_chromium_desc:0 "Under the Paris-Moscow Treaty, Russia and the Commune of France will jointly invest in developing the chromium mines at Zlatoust. Part of the new capacity will remain locally available, while the rest will form France's long-term extraction share."
 RUS_future_foreign_017_zlatoust_unlock_tt:0 "Unlocks diplomatic decision: §Y$RUS_future_foreign_joint_develop_zlatoust_chromium$§!"
 RUS_zlatoust_chromium_concession:0 "Zlatoust Chromium Concession"
 RUS_zlatoust_chromium_concession_desc:0 "Under the joint development agreement with Russia, the Commune of France enjoys a long-term share of the chromium extracted at Zlatoust."
 RUS_future_foreign_004_effect_tt:0 "Unlocks the §YGendarme of the Third International§! dynamic modifier.\nEach completed new foreign-policy focus increases §YRevolutionary Readiness§! by §G1§!."
 RUS_future_foreign_002_effect_tt:0 "Unlocks §YMilitary Aid§! decisions for every socialist country in the world; each country may receive this aid only once."
 RUS_future_foreign_003_effect_tt:0 "Unlocks §YCivilian Aid§! decisions for every socialist country in the world; each country may receive this aid only once."
 RUS_future_foreign_019_effect_tt:0 "For socialist regimes in the Balkans:\nMilitary and Civilian Aid costs: §G-50.00%§! (Political Power, military materials and Five-Year Plan points)\n§YPeacetime Military Aid§!:\n£mil_factory Off-map military factories: §G+2§!\n£manpower_texticon Manpower: §G+10000§!\n§YWartime Military Aid§!: gain §Y$RUS_future_foreign_balkan_military_aid$§! for §Y180§! days, granting:\n$MODIFIER_ARMY_ORG_FACTOR$: §G+10.00%§!\n$MODIFIERS_ARMY_ATTACK_AGAINST_MAJOR_FACTOR$: §G+10.00%§!\n$MODIFIERS_ARMY_DEFENCE_AGAINST_MAJOR_FACTOR$: §G+10.00%§!\nUnlocks diplomatic decision: §Y$RUS_future_foreign_balkan_invite$§!."
 RUS_future_foreign_019_agri_orders_tt:0 "Once §YUstinov's agricultural minigame§! is active, Balkan socialist regimes add a combined crop purchase order each quarter."
 RUS_future_foreign_balkan_invite:0 "Invite to the current Russian faction"
 RUS_future_foreign_balkan_invite_desc:0 "Directly invite a Balkan socialist regime that has joined no faction into the faction we lead, without waiting for an answer."
 RUS_future_foreign_balkan_invite_available_tt:0 "We must lead a faction; the target must be a Balkan socialist country that is in no faction; and we need at least §Y20§! Political Power."
 RUS_future_foreign_035_effect_tt:0 "For each existing socialist country in the Balkans, add to §Y$RUS_third_international_gendarme$§!:\n$MODIFIER_ARMY_EXPERIENCE_FROM_VOLUNTEERS$: §G+5.00%§!\n$MODIFIERS_ARMY_NON_CORE_ATTACK_FACTOR$: §G+0.20%§!\nSign a §Ynon-aggression pact§! with that country and gain §Y50§! Political Power per country.\n\nCurrent socialist Balkan countries (§Y[?RUS_third_international_gendarme_balkan_socialist_count|0]§!):\n[GetRUSBalkanGendarmeSerbia][GetRUSBalkanGendarmeRomania][GetRUSBalkanGendarmeGreece][GetRUSBalkanGendarmeAlbania][GetRUSBalkanGendarmeBulgaria]"
