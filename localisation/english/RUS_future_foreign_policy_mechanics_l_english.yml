l_english:
 RUS_third_international_gendarme:0 "Gendarme of the Third International"
 RUS_third_international_gendarme_desc:0 "Russia's revolutionary soldiers defend not only their own workers' and peasants' government, but also gain invaluable experience in class struggles across the world."
 RUS_third_international_gendarme_status_tt:0 "Red countries where volunteer interventions were won: §Y[?RUS_third_international_gendarme_victories|0]§!\nThe first victory in each §Yred country§! to which we actually sent volunteers further increases our volunteer limit and army experience gained from volunteers; non-red regimes do not count."
 RUS_soviets_and_phalanstere:0 "The Soviets and the Phalanstere"
 RUS_soviets_and_phalanstere_desc:0 "The Phalanstere is no longer merely a window through which exiles gaze towards their homeland. The growing ties between Soviet research institutes, revolutionary governments and socialist industry are forming a worldwide network of knowledge and production."
 RUS_soviets_and_phalanstere_status_tt:0 "Current red countries: §Y[?RUS_soviets_and_phalanstere_red_country_count|0]§!\nCompleting a technology with any §YMilitary Industrial Organisation§! grants £civ_factory_output §G25§! economic surplus per red country, currently £civ_factory_output §G[?RUS_soviets_and_phalanstere_mio_surplus|0]§! in total.\nRed countries are those governed by §YRadical Socialists, Totalists, Syndicalists or Communists§!."
 RUS_future_foreign_004_effect_tt:0 "Unlocks the §YGendarme of the Third International§! dynamic modifier.\nEach completed new foreign-policy focus increases §YRevolutionary Readiness§! by §G1§!."
 RUS_future_foreign_016_effect_tt:0 "Unlocks the dynamic modifier §YThe Soviets and the Phalanstere§!.\nEach red country in the world grants §G0.5%§! research-sharing bonus; completing a technology with any MIO grants economic surplus according to the number of red countries.\nEach completed new foreign-policy focus increases the Consumer Goods Factor by §R1%§!."
 RUS_future_foreign_exchange_five_year_plan_score:0 "Reallocate Five-Year Plan Resources"
 RUS_future_foreign_exchange_five_year_plan_score_desc:0 "Transport, equipment and organisers required by the foreign front can be drawn from the Five-Year Plan's accumulated achievements. Each plan point committed raises revolutionary readiness by one point."
 RUS_future_foreign_exchange_five_year_plan_score_effect_tt:0 "Five-Year Plan Score: §R-1§!\nRevolutionary Readiness: §G+1§!"
