  RUS_nikolay_bukharin: "Nikolay Bukharin"
  RUS_nikolay_bukharin_advisor: "Nikolay Bukharin"
  RUS_nikolay_bukharin_advisor_compat: "Nikolay Bukharin"
  RUS_nikolay_bukharin_advisor_desc: "§YBorn:§! §L27 September 1888, Old Style; Moscow, Russian Empire.§!\n§YBackground:§! §LTo outsiders, Bukharin would always appear as that youthful revolutionary whose enthusiasm bordered on naivety and whose courtesy carried a touch of cunning—and the impression suited him perfectly. He was a gifted caricaturist, his pen biting yet humorous; he was also fascinated by natural history, and during exile could lose himself contemplating the rock strata of the Alps. These pursuits, seemingly so ill-suited to underground struggle, left him a window onto the outside world. Through a microscope and a sketchbook, he saw a world far more complex than doctrine, and all the more worth fighting for.\n\nYet the age never allowed a revolutionary to linger long among specimens and drawings.\n\nLike countless members of his generation, Bukharin's life was transformed by the Revolution of 1905. The decisive turn, however, came not from the height of the barricades and demonstrations, but from the suffocating repression that followed the storm.\n\n“Meetings were no longer held at the university; there were no more demonstrations or barricades. It was in that year that I joined the Bolshevik organisation.”\n\nDuring the revolution that shook the world, Bukharin stood among the youngest members of the Bolshevik Left Opposition. He fiercely opposed Lenin's concessions to Germany in the Treaty of Brest-Litovsk and demanded the abolition of national self-determination, which he considered contrary to the Marxist understanding of the national question. In light of later history, however, he was forced to admit that without those measures the tragic revolution would only have met its end sooner.\n\nThe failure of Red October did not leave him disheartened. The years of exile in Paris and London broadened his horizons, and through repeated arguments with Western syndicalists he developed a singular conception: a democratic planned economy. He hoped that the coercive power of the state, combined with broad trade-union democracy, could preserve the flexibility of economic planning and sustain the revolutionary character of the local soviets.§!"
  RUS_bukharin_economic_theorist: "Economic Theorist"
