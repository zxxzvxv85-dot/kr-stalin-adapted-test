  RUS_mikhail_kalinin: "Mikhail Ivanovich Kalinin"
  RUS_mikhail_kalinin_advisor: "Mikhail Ivanovich Kalinin"
  RUS_mikhail_kalinin_advisor_desc: "§YBorn:§! §L19 November 1875 (7 November, Old Style); Tver Governorate, Russian Empire.§!\n§YBackground:§! §LMikhail Ivanovich Kalinin was born into a typical poor Russian peasant family. With the household in straitened circumstances, he received only a few years of primary schooling and at the age of fourteen set out alone for Saint Petersburg to earn a living, working first as a factory apprentice and then as a lathe operator. He learned the hardships of working-class life at an early age. It was on the factory floor that he encountered the burgeoning labour movement and rapidly awakened to political consciousness. In 1898 he joined the Russian Social Democratic Labour Party and, in the ensuing inner-party struggles, stood firmly with the Bolsheviks led by Lenin.\n\nDuring the Revolution of 1905, Kalinin actively organised workers' strikes in Petrograd, helped establish factory committees and distributed revolutionary leaflets at clandestine meetings. Over the following decade, his continuing underground activity led to repeated arrests and exile, taking him from the Caucasus to Estonia and beyond. After every release he returned to Petrograd to resume the work left unfinished. Neither imprisonment nor bitter cold broke his will; instead, they forged his steady, pragmatic and difficult-to-shake political character.\n\nAfter the outbreak of the Weltkrieg, Kalinin secretly conducted anti-war agitation in Petrograd, bringing together soldiers at the front and workers in the rear. When the February Revolution of 1917 overthrew the Tsarist regime, he immediately set about rebuilding the battered party organisation and was elected to the Petrograd City Duma. That October he joined the Bolshevik Military Revolutionary Headquarters, directly participating in the liaison and mobilisation work for the storming of the Winter Palace and becoming one of the key coordinators of the Petrograd uprising.\n\nThe civil war, however, ended in the defeat of the Red regime. Fortunately, Kalinin had joined the exiles withdrawing to Western Europe before the government collapsed completely. Soon after reaching Paris, the émigré community sank into profound discouragement and introspection. Kalinin's judgement remained unusually clear: the failure was due in large measure to opportunists who had corroded and undermined the revolutionary cause. During the party purge led by Sverdlov, he therefore presided over investigations with a moderate and steady hand. While safeguarding the organisation's integrity, he removed opportunists and degenerates with restraint, preventing the campaign from descending into excess or indiscriminate persecution.\n\nThe years far from his homeland and the relative stability of Paris afforded him a rare opportunity. He began systematically organising the experience accumulated during his early work in the labour movement and devoted all his enthusiasm to communist education, from writing political primers to conducting training courses. He remained convinced that: “Labour not only creates material wealth; it also shapes the spiritual character of man.”§!"
  RUS_kalinin_engineer_of_human_souls: "Communist Educator"
