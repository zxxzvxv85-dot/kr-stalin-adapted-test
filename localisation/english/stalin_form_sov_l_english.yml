  stalin_form_sov.17.t: "How the Steel Was Tempered"
  stalin_form_sov.17.desc: "Nikolai Alexeyevich Ostrovsky, a Bolshevik and Russian communist writer born to a poor Ukrainian working-class family, saw his How the Steel Was Tempered acclaimed as a classic of international socialism as soon as it was published. Taking the author's own life as its model, while allowing for a measure of artistic reshaping, the book vividly presents historical fragments from the beginning of the 1917 Revolution through its defeat in 1921 and the later reconstruction of Socialist Russia. It realistically captures the thoughts and lives of the people of that era, and was celebrated not only in Russia but across the world. Its famous passage on devoting one's whole life and strength to the liberation of humanity has inspired revolutionary socialist organisations and oppressed peoples around the globe.\n\nThough Ostrovsky followed Sverdlov, Stalin, Frunze and other communists into exile through Arkhangelsk to the Commune of France in 1921, he remained a defender of communism and Marxism-Leninism. He also waged a forceful struggle against the slanders that described communism and Marxism-Leninism as totalitarian, whether those slanders came from the international left or the right. Although the book never states it directly, one message can be read between its lines: the Communist Party and communism are not totalitarian in the manner alleged by their enemies."
  stalin_form_sov.17.desc_2: "Ostrovsky argued that the world slanders the Communist Party and communism because people without advanced ideas can be deceived and misled by every kind of reactionary force: only one party fights all oppressors with unbending resolve, and that is the Bolshevik Party. In answering counter-revolutionaries, slanderers and revisionists, Ostrovsky addressed their mentality by placing a saying of Joseph Stalin on the back cover: can capitalism be eradicated without ruthless class struggle? No. The theory that capitalists can grow into socialism only cultivates classes and makes them permanent.\n\nAgainst those who claim that vanguard communism is irrational and destructive, that communists have neither the interest nor ability nor will to solve social problems, and that the outcome of the so-called Red Terror lacked reason or any rational premise, Ostrovsky cited Lenin's writings: overthrowing the old order is only the beginning of revolution, and true revolution lies in construction; after the proletariat seizes power, the class struggle between proletariat and bourgeoisie does not end, but becomes broader, sharper and more severe.\n\nOstrovsky's work has drawn the attention of countless communist and socialist revolutionaries, activists and politicians. It is now regarded as a window through which communism may cast off the charge of totalitarianism, and as the beginning of a new public re-examination of what totalitarianism means."
  stalin_form_sov.17.a: "Do not let reaction blind the people's eyes!"

  stalin_form_sov.19.t: "Anniversary of the October Revolution"
  stalin_form_sov.19.desc: "On January 28, 1921, beset from within and without, the last organised Red Army formation ceased resistance, and the shattered Russian Revolution finally ended in defeat.\n\nToday, with the Party Centre's new understanding of Red October and its broad mobilisation of the masses, the people have seen through the lies of reaction. The truth of October has been rediscovered, and that defeat is now regarded as a song of the brave: surrounded by the reactionaries of the whole world, struck by hidden traitors, and faced with every unfavourable condition, the Bolsheviks did not kneel in surrender, but chose to shed their last drop of blood for truth and justice.\n\nAnd so another march has organised itself spontaneously: beginning in Leningrad, beginning from the Aurora, an endless tide of people surges forward, waving red flags and singing the Internationale in chorus as they mourn the fallen warriors.\n\nAmong them are ordinary workers from the shops and poor peasants from the collective farms. Their lives are different, but they share one communist ideal.\n\nIt is just as Marshal Frunze wrote during the Civil War: countless men died on the road of the charge, and then we crossed over their bodies and continued onward.\n\nWe communists are people of a special mould, made from special material... and if necessary, we will devote ourselves to the revolution without hesitation."
  stalin_form_sov.19.a: "\"For as long as even one communist remains, our ideal shall never die\""

  stalin_form_sov.21.t: "The Brightest Future"
  stalin_form_sov.21.desc: "How far back can the history of humanity's pursuit of liberation be traced?\nTo Spartacus in the West, or to Chen Sheng and Wu Guang in the East?\n\nHistorians may offer different answers, but one thing has never changed: humanity's march toward liberation has never ceased.\n\nIn 1917, the great Lenin led the people against exploitation and oppression, lighting the torch of socialism once again after the Paris Commune. Though the revolution once suffered setbacks under the weight of history, the ideal of liberation never went out. The years that followed proved Lenin's truth again and again:\n\n\"Death does not belong to the working class!\"\n\nAnd now, from the Baltic Sea to Tokyo Bay, all peoples stand united beneath the Soviet banner. The decayed old world is burning in the people's wrath, while the radiant country of tomorrow has opened its gates to all humanity.\n\nWe can foresee it:\n\nA free and democratic state of workers and peasants will create achievements no capitalist great power can match;\nScience and poetry will belong to every person;\nBread and roses will no longer be sold with a price tag.\n\nThe Soviets will lead all humanity out of the prison of the realm of necessity and toward a truly free future."
  stalin_form_sov.21.a: "\"Starting from zero o'clock, toward the brightest future.\""
  stalin_form_sov.21.a_tt: "§YStarting from zero, even if the road is long.\nTo the glorious and great liberator, we salute you!§!"

  stalin_form_sov.22.t: "Declaration on the Formation of the Union of Soviet Socialist Republics"
  stalin_form_sov.22.desc: "Since the founding of the Soviet republics, the nations of the world have been divided into two camps: the capitalist camp and the socialist camp.\n\nThere, in the capitalist camp, there is national hatred and inequality, colonial slavery and chauvinism, national oppression and persecution, imperialist atrocity and war.\n\nHere, in the socialist camp, there is mutual trust and peace, national freedom and equality, peaceful coexistence and fraternal cooperation among peoples.\n\nFor decades the capitalist world has tried to reconcile the free development of nations with a system in which human beings exploit one another, hoping thereby to solve the national question. These attempts have all come to nothing. On the contrary, national contradictions have become more entangled and now threaten the existence of capitalism itself. The bourgeoisie is no longer capable of building cooperation among peoples.\n\nOnly in the Soviet camp, only under the dictatorship of the proletariat uniting the great majority of the population, is it possible to abolish national oppression at its root, create an atmosphere of mutual trust, and lay the foundations for fraternal cooperation among peoples. Only because of these conditions have the Soviet republics been able to repel the attacks launched by imperialists from within and without.\n\nOnly because of these conditions have they been able to bring the civil war to a successful close, secure their existence, and begin peaceful economic construction.\n\nYet the years of war have not passed without leaving traces. Wasted fields, idle factories, shattered productive forces, and exhausted economic resources left behind by war have made the separate efforts of each republic insufficient. The restoration of the national economy is impossible while the republics remain divided.\n\nAt the same time, the instability of the international situation and the danger of new attacks require the Soviet republics to establish a united front in the face of capitalist encirclement.\n\nFinally, the very structure of Soviet power, internationalist by its class nature, drives the working masses of the Soviet republics toward union in one socialist family.\n\nAll these circumstances urgently require the Soviet republics to unite into one union state, capable of guaranteeing external security, internal economic prosperity, and the right of every people to free development.\n\nThe will of the peoples of the Soviet republics, recently gathered in their own congresses of soviets and unanimously expressed in the decision to establish the Union of Soviet Socialist Republics, is a reliable guarantee that this union is a voluntary union of equal nations; that every republic is guaranteed the right freely to leave the union; that the union is open to all socialist soviet republics, whether already existing or yet to arise; that this new union state is the proper completion of the principles of peaceful coexistence and fraternal cooperation among peoples laid down since October 1917; that it will become a reliable bulwark against world capitalism and a new decisive step on the road to uniting the workers of every country in a world socialist soviet republic.\n\nWe declare all this to the whole world, and solemnly proclaim the inviolability of the principles of Soviet power. These principles are embodied in the constitutions of the socialist soviet republics whose representatives have empowered us. We, the representatives of these republics, acting under the authority granted to us, resolve to sign the treaty on the formation of the Union of Soviet Socialist Republics."

  stalin_form_sov.24.t: "The Socialist-Revolutionaries and the Bolsheviks"
  stalin_form_sov.24.desc: "Although the All-Russian Union of Labour has won victory in parliament, in the practical work of governing it still depends on its Socialist-Revolutionary allies and on the Bolsheviks returning from exile.\n\nBeneath the surface of cooperation, the struggle between the two parties has never ceased. The Ministry of Finance, the Land Committee, the Military Department, the personnel offices of the local soviets - every vacancy may become a new battlefield.\n\nThrough their long cultivation of the countryside, the Socialist-Revolutionaries control the great majority of village soviets and local militia forces. From western Russia to Siberia, from grain requisitioning to spring sowing, nearly every agricultural nerve ending is held in their hands. At the beginning of the Second Revolution, it was precisely their influence in the countryside that helped us avoid civil war. This is a strength the All-Russian Union of Labour cannot ignore.\n\nThe Bolsheviks, meanwhile, remain for now in the cities and underground. They possess firm networks in the factory workshops, railway yards and port docks; Red Guard veterans lie hidden within the militia ranks, while secret party members quietly occupy telegraph offices and banks. For the moment, their membership is far smaller than that of the Socialist-Revolutionaries, but their discipline is formidable, and after learning from the first civil war, the Bolsheviks are more united than before.\n\nAt the conference table all is harmony; beneath it, every leg is being kicked. Both sides are waiting for the chance to tear the other's influence out of the government by the roots. As coordinator, the All-Russian Union of Labour can only maintain a careful balance between the two factions, so that the revolution may proceed according to plan."
  stalin_form_sov.24.a: "We shall tread carefully."
  stalin_form_sov.24.a_tt: "§RThe two parties have nursed old grudges for a long time. If the revolutionary situation grows extreme, who can guarantee they will not turn the tables?§!"


  stalin_form_sov.10002.t: "Germany Seeks Peace!"
  stalin_form_sov.10002.desc: "Our war effort has gone far better than expected. We have successfully reclaimed the territories lost in the previous unequal treaty. Now, overwhelmed by continuous warfare, the German Empire has extended an olive branch, claiming it is willing to restore the pre-war European borders and cease interference in Central Asia.\n\nHow should we respond?"
  stalin_form_sov.10002.a: "Enough."
  stalin_form_sov.10002.a_tt: "§YWe will be able to restore the pre-war European borders!§!"
  stalin_form_sov.10002.b: "To hell with them!"

  RUS_dictatorship_proletariat: "State of the Whole People"
  RUS_dictatorship_proletariat_desc: "Our state is fundamentally different from a bourgeois state. The old definition no longer fits; it should continue as an instrument of rule for the whole people."
  RUS_charter_of_russian_totalism: "The Totalist Debate"
  RUS_charter_of_russian_totalism_desc: "Western revolutionary currents have sparked a debate over totalism. Gronsky's Society for the Study of Western Totalism is making this controversy ever more academic and political."
  RUS_invite_sverdlov: "Return to Leninism"
  RUS_war_on_landowners: "Accelerate the End of the Agricultural Transition"
  RUS_war_on_landowners_desc: "The peasantry is a transitional class destined to disappear. We must hasten its transformation into agricultural workers and deprive petty-bourgeois ideas of their class foundation."
  RUS_red_intelligentsia: "The Revolutionary Cultural Front"
  RUS_red_intelligentsia_desc: "The old world does not disappear at once, but through a painful and protracted process. Revolution and democracy must take root in every citizen."
  RUS_technocratic_syndicalism: "Lay the Foundations of Democracy"
  RUS_technocratic_syndicalism_desc: "At last, the proletarian democracy envisioned by Lenin is gathering strength in Russia. A democracy a million times more democratic than any bourgeois democracy will secure our transition to communism!"
  RUS_preserve_revolution_within: "Triumph of the Red Helmsman"
  RUS_preserve_revolution_within_desc: "Zinovyev has secured supreme power. His vision of Russian-style totalism and a state of proletarian dictatorship will now §Rbecome reality§!."
  RUS_maximalist_land_reform_success_focus_requirement: "The §YLand Reform§! has been completed"
  rus_stalin_zinovyev_rework.continue: "Read on..."
  rus_stalin_zinovyev_rework.1.t: "Society for the Study of Western Totalism"
  rus_stalin_zinovyev_rework.1.d: "With bourgeois censorship abolished, the totalism of Mosley, Valois and Mussolini began circulating in Russia. Ivan Gronsky's society gathered intellectuals from the VST Left, the Bolsheviks and the SR Maximalists, rejected any notion of Russian totalism, and demanded a comprehensive critique of its Western form.\n\nThe Bolsheviks denounced totalism for sanctifying the state as humanity's final stage and disguising the abandonment of democracy as total commitment. Citing Lenin on democracy for the majority and the state's withering away, the society concluded that totalism made the state machine permanent and sacred. Western totalism and all its Russian variants were to be exposed and eradicated."
  rus_stalin_zinovyev_rework.1.a: "A painfully accurate judgement!"
  rus_stalin_zinovyev_rework.2.t: "Russian-Style Totalism"
  rus_stalin_zinovyev_rework.2.d: "Zinovyev answered his critics with a manifesto entitled Russian-Style Totalism. Proletarian dictatorship, he argued, was necessary to socialism, and weakening it in democracy's name meant surrender to the bourgeoisie.\n\nUnlike Western totalists who worshipped an eternal state, Russian totalists would use a transitional proletarian semi-state to suppress exploiters while preparing its own disappearance."
  rus_stalin_zinovyev_rework.3.d: "Zinovyev insisted that the abuse of the word total by Western movements should not make revolutionaries abandon proletarian dictatorship. The Bolsheviks replied that his contempt for democratic forms distorted Marxism: proletarian dictatorship was the broadest democracy for the majority combined with firm suppression of exploiters.\n\nBy opposing dictatorship to democracy, Zinovyev had fallen into the same trap as Western totalists. Proletarian democracy required dictatorship for protection, while dictatorship required proletarian democracy for its form. Outside the organised vanguard, he could still recite revolutionary phrases but no longer grasp their meaning."
  rus_stalin_zinovyev_rework.3.a: "Have Kamenev keep a close eye on him!"
  rus_stalin_zinovyev_rework.10.t: "The Society for the Study of Proletarian Dictatorship"
  rus_stalin_zinovyev_rework.10.d: "Not long after the publication of the Manifesto of Russian Totalism, a small circle began to gather around Zinovyev. They called themselves the Society for the Study of Proletarian Dictatorship; outsiders simply called them the Zinovyevites. Its core included several former contributors to internationalist newspapers, a handful of theoreticians at Petrograd University, and intellectuals wavering between the Left Socialist-Revolutionaries and the Bolsheviks. They met regularly in Zinovyev's apartment to discuss the theoretical foundations of proletarian dictatorship, the conditions of the dictatorial state and—in their own words—'European socialism poisoned by formal democracy'.\n\nThe circle soon issued a public declaration in which Zinovyev categorically rejected the label of totalism imposed upon them:\n\n'To call us totalists is either theoretical ignorance or deliberate political slander. Totalism—whether that of the Birmingham group or the so-called Leader in Milan—absolutises and eternalises the state, placing the state machine above class. We advocate precisely the opposite: the domination of the state by a class, the proletariat's use of the state machine as a transitional form leading to the final disappearance of all state power. Whoever cannot distinguish temporarily strengthening the state in order to abolish it from worshipping the state as an end in itself is unfit to speak of Marxism.'\n\nThe declaration also insisted that the society sought neither a separate party nor confrontation with the All-Russian Labour Union. It demanded only a place in the theoretical discussion of proletarian dictatorship."
  rus_stalin_zinovyev_rework.10.a: "'Grigory, do try to be careful.'"
  rus_stalin_zinovyev_rework.11.t: "Resolution on the Question of Totalism"
  rus_stalin_zinovyev_rework.11.d: "At the Congress of the All-Russian Labour Union, the question of totalism was formally placed upon the agenda. The delegates fiercely debated Western totalist thought since the Birmingham Declaration, Zinovyev's Manifesto of Russian Totalism and the activities of his Society for the Study of Proletarian Dictatorship. At last, two opposing draft resolutions were submitted.\n\nThe first course: Unity and Inclusion\n\nThis draft argued that Zinovyev's criticism of Western totalism pointed in the same direction as that of the Union. His claim that proletarian dictatorship was a transitional instrument rather than an ultimate end did not fundamentally contradict Marxism. While clearly condemning Western totalism, the Union should accept the reasonable elements of Zinovyevite theory and unite every anti-imperialist force. Comrade Zinovyev might deviate from the mainstream programme in organisation, but his theoretical work should not simply be equated with that of an enemy.\n\nThe second course: Draw Every Boundary\n\nThis draft denied any room for compromise. Zinovyev's real error was not his criticism of Western totalism, but his contempt for democracy, identical to that of the Birmingham group. By abstractly opposing dictatorship to democracy and remaining silent about proletarian democracy, he erased the essential distinction between proletarian and bourgeois states. As Lenin taught, proletarian dictatorship would for the first time provide democracy for the people and the majority. Western totalism and its supposedly Russian variant were both betrayals of Marxist state theory and deserved no theoretical tolerance beneath the Union's banner."
  rus_stalin_zinovyev_rework.11.a: "Adopt part of Zinovyev's position to preserve unity."
  rus_stalin_zinovyev_rework.11.b: "We must tolerate no deviation from the line."
  rus_stalin_zinovyev_rework.4.t: "The Agricultural Factory Pilot Zone"
  rus_stalin_zinovyev_rework.4.d: "With land reform and mechanisation advancing, the Maximalists and Bolsheviks began abolishing the peasantry as a class through its transition into agricultural workers.\n\nThe Dawn State Agricultural Factory in Omsk offered state-worker status, fixed wages and benefits. Four hundred posts attracted over twelve hundred applicants: tractor drivers, model producers and ordinary collective farmers who trusted Muromets and his promised future. The first volunteers are now travelling to Omsk."
  rus_stalin_zinovyev_rework.4.a: "They will be the first agricultural workers on this frozen soil."
  rus_stalin_zinovyev_rework.5.t: "Serf, Peasant, Agricultural Worker"
  rus_stalin_zinovyev_rework.5.d: "Land and Freedom Collective Farm, Novosibirsk\n\nOld Valery had bent his back over Siberian soil since childhood. The revolutions of 1917 were merely distant changes of flags. In 1927 an urban poet turned his hunger and pain into pastoral verse, then fled back to the cafés and lights of the city."
  rus_stalin_zinovyev_rework.6.d: "Land reform gave Valery a plot but no tools or security, and bad harvests made the land another chain. Then Muromets brought collective farms, tractors, seed and storage. Full granaries and machinery gave Valery both food and the unfamiliar gift of free time.\n\nThat freedom revived an old desire: to see the city and learn whether he could become someone beyond the soil that had given and consumed his life."
  rus_stalin_zinovyev_rework.6.a: "He will leave this land."
  rus_stalin_zinovyev_rework.7.t: "The New Arrival"
  rus_stalin_zinovyev_rework.7.d: "Dawn Agricultural Factory, Omsk\n\nVasily Shumilov arrived with a rope-bound suitcase and a worn tractor manual. A forty-day course had taught him the basics; patient self-study had taught him to repair what the course could not explain. His collective farm called him their scientist, but Vasily knew how little he understood."
  rus_stalin_zinovyev_rework.8.d: "The Omsk factory promised systematic training, new tractors, a repair shop, lathes and spare parts. Vasily's grease-stained manual, examination marks and practical talent put him first on the intake list."
  rus_stalin_zinovyev_rework.8.d_2: "At Dawn he found twelve gleaming tractors, a vast workshop, a technical examination waiting for him, and an immense unbroken field marked Third Work Zone."
  rus_stalin_zinovyev_rework.9.d: "In the round-the-clock canteen, Vasily overheard plans to open a fourth work zone with three new tractors. That evening he walked past the lit repair shop and listened to the night shift working beyond the darkness. Here, that sound was ordinary.\n\nThinking of tomorrow's examination and the old wrench in his suitcase, he imagined turning the first soil of the fourth zone. For now, he only needed to sleep. He closed his eyes."
  rus_stalin_zinovyev_rework.9.a: "The repair shop light remained on until he fell asleep."
  RUS_nationalise_AEG_electrical_facilities: "Nationalise AEG's Electrical Facilities"
  RUS_nationalise_AEG_electrical_facilities_desc: "The power stations, substations and transmission network left behind by AEG remain divided among disconnected companies and local authorities. The state must seize these facilities, impose a common technical standard and incorporate them into the nationwide grid of the Voskhod Programme.\n\n§YTakeover regions selected by the Voskhod Programme:§!\n[?RUS_aeg_nationalisation_state_1.GetName], [?RUS_aeg_nationalisation_state_2.GetName], [?RUS_aeg_nationalisation_state_3.GetName], [?RUS_aeg_nationalisation_state_4.GetName], [?RUS_aeg_nationalisation_state_5.GetName]\n[?RUS_aeg_nationalisation_state_6.GetName], [?RUS_aeg_nationalisation_state_7.GetName], [?RUS_aeg_nationalisation_state_8.GetName], [?RUS_aeg_nationalisation_state_9.GetName], [?RUS_aeg_nationalisation_state_10.GetName]"
  RUS_nationalise_AEG_electrical_facilities_complete_tt: "Upon completion:\nAdd §Y1 Reinforced Electrical Grid§!, §Y1 Infrastructure§! and §Y1 Building Slot§! to each of these §Y10 states§!:\n§Y[?RUS_aeg_nationalisation_state_1.GetName], [?RUS_aeg_nationalisation_state_2.GetName], [?RUS_aeg_nationalisation_state_3.GetName], [?RUS_aeg_nationalisation_state_4.GetName], [?RUS_aeg_nationalisation_state_5.GetName]\n[?RUS_aeg_nationalisation_state_6.GetName], [?RUS_aeg_nationalisation_state_7.GetName], [?RUS_aeg_nationalisation_state_8.GetName], [?RUS_aeg_nationalisation_state_9.GetName], [?RUS_aeg_nationalisation_state_10.GetName]§!\nSyndicalist popularity: §G+5.00%§!"
  RUS_stalin_voskhod.1.t: "The Winding Road to Electrification"
  RUS_stalin_voskhod.1.d: "With the Civil War over in 1920, the fledgling Russian Republic could at last revive the stalled electrification law of the '1886 Association'. By 1922, the newly formed Socialist-Revolutionary-Constitutional Democratic government intended to preserve the concessionary joint-stock system of the old empire. Private and foreign capital would establish companies, apply for concessions and receive an urban or industrial district in which to pursue 'free development'.\n\nElectrification consequently took two broad forms. European Russia radiated from Moscow and chiefly used German standards and AEG equipment; Asian Russia drew upon nearby American suppliers and adopted American standards and General Electric machinery. Private capital and foreign firms, including Belgian concerns, were scattered like stars across the country. Their equipment obeyed no common standard: transmission frequencies alone included 20, 40 and 50 Hz, while single-phase and three-phase systems existed side by side.\n\nThe American stock-market crash and the tightening restraints of the Vilnius Agreement brought this halting progress to a standstill. Broken credit forced projects to be abandoned, reducing the ambitious promise of 'free development' to half-built works. Incompatible grids could not be interconnected and, without common maintenance, failed with growing frequency, compounding the disorder of industrial production. Departing foreign capital left a technical vacuum that domestic firms could neither fill nor afford to modernise. Russia's brief surge of electrification rapidly lost momentum.\n\nAt the moment of greatest isolation, the new French Social Republic and its reorganised EDF entered the Russian market with low prices and capable service. A new grid spread from Petrograd and filled part of the Republic's deficit. Once the Union for the Defence of the Fatherland and Freedom came to power, Vozhd Savinkov imposed a compulsory 'Unified Electrical Standard': every new or rebuilt facility would use 50 Hz three-phase alternating current. Private utilities were nationalised, while foreign-owned firms received a transitional period in which to replace their equipment and conform. On French advice, regional stations were built near the peat fields of central Russia and linked by high-voltage lines to Moscow, Nizhny Novgorod and the other industrial centres.\n\nThe 'Savinkov Standard' greatly accelerated electrification. Yet the shortage of trained personnel meant that even the Vozhd had to turn a blind eye to the French 'syndicalist thugs' who came with it, allowing them to organise technical courses and political agitation on the worksites."
  RUS_stalin_voskhod.1.a: "As radiant, as bright, and as warm as the Vozhd!"
