  RUS_prevent_pacing_drag_tt: "The completion time of §Call Russian focuses§! is reduced by §G7 days§!."
  RUS_stalin_red_army_dynamic_modifier: "The Workers and Peasants Red Army"
  RUS_stalin_red_army_dynamic_modifier_desc: "Under Stalin's line, the Workers and Peasants Red Army is combining revolutionary war experience with unified military construction."
  RUS_stalin_red_army_supply_tt: "§Y$RUS_russian_army_soc$§! gains:\nSupply Consumption: §G-10.00%§!\nEach completed §YAddress the Army§! branch focus adds §G+1.00%§! Terrain Penalty Reduction to this spirit."
