  RUS_fate_of_the_radsocs: "The Fate of the PSR"
  RUS_fate_of_the_radsocs_desc: "In reality, the PSR has already been extremely marginalized under the suppression of Kamenev and Zinoviev. What we need to do now is simply deliver the final blow, completely depriving them of their voice."
  RUS_fate_of_the_radsocs_tt: "We will take over all remaining influence of the §tPSR§!, but this will also cause us to lose some stability.\nCurrent effects:"

  RUS_leniency_granted: "Leniency Granted"
  RUS_leniency_granted_desc: "Given that the Radsocs is now barely surviving, if we grant them leniency, they will surely be grateful. This will bring great benefits and no harm to our future governance."
  RUS_leniency_granted_tt: "§tPSR§! will join us, and we will have the opportunity to activate political advisors from its various factions."

  stalin_form_sov.15.t: "On the Radsocs"
  stalin_form_sov.15.desc: "Since we have decided to grant leniency to the Radsocs, the task of reintegrating some of their members into national reconstruction has now come to the forefront. After all, each of them has their own areas of expertise and can contribute to our cause.\n\nBut can we truly trust their promise to ‘never seek rehabilitation’?"
  stalin_form_sov.15.a: "Unite the non-factional."
  stalin_form_sov.15.a_tt: "We will be able to activate the non-factional $KR_sr_trait$ political advisors!"
  stalin_form_sov.15.b: "Unite the Spiridonovist."
  stalin_form_sov.15.b_tt: "We will be able to activate the $KR_spiridonist_trait$ political advisors!"
  stalin_form_sov.15.c: "Unite the Maximalist."
  stalin_form_sov.15.c_tt: "We will be able to activate the $KR_maximalist_trait$ political advisors!"

  RUS_radsocs_advisor: "United the Non-Factional $KR_sr_trait$"
