  RUS_aleksey_ustinov: "Aleksey Mikhailovich Ustinov"
  RUS_aleksey_ustinov_advisor: "Aleksey Mikhailovich Ustinov"
  RUS_aleksey_ustinov_sic: "Aleksey Mikhailovich Ustinov"
  RUS_aleksey_ustinov_advisor_desc: "§YBorn:§! §LMarch 15th, 1885; Korfuno, Moscow Governorate, Russian Empire§!\n§YBackground:§! §LAleksey Mikhailovich Ustinov was born into a wealthy noble family and received a good education, but fate laid out a very different road for him. In 1902, while still a wealthy young man, Ustinov took part in revolutionary activity and later joined the Socialist Revolutionary Party, never turning back. He organised his own Socialist Revolutionary combat organisation in Saratov, but was soon arrested and imprisoned, stripped of noble status, and forced into exile abroad. During the Weltkrieg, he built a revolutionary network among Russian prisoners of war in preparation for a large-scale uprising. In 1917, when the moment for revolt finally arrived, he unhesitatingly sided with the far left of the Socialist Revolutionaries, openly opposing Kerensky's government and any compromise with bourgeois parties.\n\nLike other Left Socialist Revolutionaries, Ustinov went deep among the people and became an outstanding leader of the revolutionary sailors of Helsingfors, or Helsinki. To ensure that the revolution would move to its final stage, he and his followers drew increasingly close to the Bolsheviks, while the divide between the Maximalists and the other Socialist Revolutionary factions became ever clearer. Although he differed with the Maximalists and the Bolsheviks on many questions, they remained united on the most fundamental one: total dedication to the revolution.\n\nDuring the Civil War, Ustinov opposed the Left Socialist Revolutionary uprising and chose to fight beside the Bolsheviks to the final moment. After the Civil War ended, the Maximalists continued to operate as small guerrilla organisations, while he himself spent many years in exile between Belarus, France, and elsewhere. During this period, he focused on leading the Maximalists in exile and maintained close ties with Levandovsky's combat group.\n\nReflecting on revolutions across the world, he came to understand the importance of the revolutionary worker-peasant alliance. To solve Russia's long-standing rural poverty and allow poor peasants at the grassroots to make the leap into agricultural workers, he creatively proposed the rural production form of the kolkhoz. After the republic was founded, he led poor peasants against the oppression of landlords and kulaks and successfully established several model districts. It was precisely this ruthless attitude toward reactionaries that earned him the sobriquet Muromets.§!\n\nNote: Though he often reveals an arrogant and self-important side, as the sole leader of the Maximalists he remains a great revolutionary: devoted, capable of leadership, and able to inspire the comrades around him."
  RUS_aleksey_ustinov_sic_desc: "§YBorn:§! §LMarch 15th, 1885; Korfuno, Moscow Governorate, Russian Empire§!\n§YBackground:§! §LAleksey Mikhailovich Ustinov was born into a wealthy noble family and received a good education, but fate laid out a very different road for him. In 1902, while still a wealthy young man, Ustinov took part in revolutionary activity and later joined the Socialist Revolutionary Party, never turning back. He organised his own Socialist Revolutionary combat organisation in Saratov, but was soon arrested and imprisoned, stripped of noble status, and forced into exile abroad. During the Weltkrieg, he built a revolutionary network among Russian prisoners of war in preparation for a large-scale uprising. In 1917, when the moment for revolt finally arrived, he unhesitatingly sided with the far left of the Socialist Revolutionaries, openly opposing Kerensky's government and any compromise with bourgeois parties.\n\nLike other Left Socialist Revolutionaries, Ustinov went deep among the people and became an outstanding leader of the revolutionary sailors of Helsingfors, or Helsinki. To ensure that the revolution would move to its final stage, he and his followers drew increasingly close to the Bolsheviks, while the divide between the Maximalists and the other Socialist Revolutionary factions became ever clearer. Although he differed with the Maximalists and the Bolsheviks on many questions, they remained united on the most fundamental one: total dedication to the revolution.\n\nDuring the Civil War, Ustinov opposed the Left Socialist Revolutionary uprising and chose to fight beside the Bolsheviks to the final moment. After the Civil War ended, the Maximalists continued to operate as small guerrilla organisations, while he himself spent many years in exile between Belarus, France, and elsewhere. During this period, he focused on leading the Maximalists in exile and maintained close ties with Levandovsky's combat group.\n\nReflecting on revolutions across the world, he came to understand the importance of the revolutionary worker-peasant alliance. To solve Russia's long-standing rural poverty and allow poor peasants at the grassroots to make the leap into agricultural workers, he creatively proposed the rural production form of the kolkhoz. After the republic was founded, he led poor peasants against the oppression of landlords and kulaks and successfully established several model districts. It was precisely this ruthless attitude toward reactionaries that earned him the sobriquet Muromets.§!\n\nNote: Though he often reveals an arrogant and self-important side, as the sole leader of the Maximalists he remains a great revolutionary: devoted, capable of leadership, and able to inspire the comrades around him."
  RUS_aleksey_ustinov_leader_desc: "§YBorn:§! §LMarch 15th, 1885; Korfuno, Moscow Governorate, Russian Empire§!\n§YBackground:§! §LAleksey Mikhailovich Ustinov was born into a wealthy noble family and received a good education, but fate laid out a very different road for him. In 1902, while still a wealthy young man, Ustinov took part in revolutionary activity and later joined the Socialist Revolutionary Party, never turning back. He organised his own Socialist Revolutionary combat organisation in Saratov, but was soon arrested and imprisoned, stripped of noble status, and forced into exile abroad. During the Weltkrieg, he built a revolutionary network among Russian prisoners of war in preparation for a large-scale uprising. In 1917, when the moment for revolt finally arrived, he unhesitatingly sided with the far left of the Socialist Revolutionaries, openly opposing Kerensky's government and any compromise with bourgeois parties.\n\nLike other Left Socialist Revolutionaries, Ustinov went deep among the people and became an outstanding leader of the revolutionary sailors of Helsingfors, or Helsinki. To ensure that the revolution would move to its final stage, he and his followers drew increasingly close to the Bolsheviks, while the divide between the Maximalists and the other Socialist Revolutionary factions became ever clearer. Although he differed with the Maximalists and the Bolsheviks on many questions, they remained united on the most fundamental one: total dedication to the revolution.\n\nDuring the Civil War, Ustinov opposed the Left Socialist Revolutionary uprising and chose to fight beside the Bolsheviks to the final moment. After the Civil War ended, the Maximalists continued to operate as small guerrilla organisations, while he himself spent many years in exile between Belarus, France, and elsewhere. During this period, he focused on leading the Maximalists in exile and maintained close ties with Levandovsky's combat group.\n\nReflecting on revolutions ac