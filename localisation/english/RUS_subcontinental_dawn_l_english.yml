 RUS_subcontinental_economic_aid:0 "Russo-Indian Economic Aid"
 RUS_subcontinental_economic_aid_desc:0 "From the Volga to the Ganges, reciprocal trade agreements link the construction efforts of both countries. Raw materials, machinery and technical knowledge cross their borders, helping workers and peasants build a new life together."
 RUS_subcontinental_military_aid:0 "Russian Military Aid"
 RUS_subcontinental_military_aid_desc:0 "India's struggle for unity is not yet over. Russian military advisers are working alongside local revolutionaries, bringing their experience in training, supply and coordination to the front lines of the subcontinent."
