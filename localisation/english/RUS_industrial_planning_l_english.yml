 RUS_ip_freight_off:0 "Dispatch: OFF"
 RUS_ip_freight_toggle_button:0 "[GetRUSIPFreightEnabled]"
 RUS_ip_freight_rules_tt:0 "§YFreight§!\nBuild and connect a station at both ends. Each region has one outbound route and may receive from multiple regions.\nBatch limit: lower effective station level × §Y6§!. Fee: §R-0.10§! investment per unit; minimum batch §Y1§!.\nPlants consume inputs first, then remaining stock above the reserve is shipped. Distance sets travel time; each shared level above one saves a day. Minimum one day. Native map railways are not queried. Power and delivered products cannot be shipped."
 RUS_ip_freight_select_tt:0 "Choose the next destination. Cargo already in transit keeps its original destination."
 RUS_ip_freight_reserve_tt:0 "Cycle the export reserve: §Y0 → 3 → 6 → 12§!. Export only stock above this level; local plants may consume the reserve."
 RUS_ip_freight_toggle_tt:0 "Keep shipping automatically: once a batch is unloaded, the next is dispatched without another click.\nWaits for sufficient stock, funds and connected stations, then resumes automatically.\nDisabling stops new shipments; existing cargo continues. Closing the GUI does not stop freight."
 RUS_ip_freight_preview:0 "Batch limit: §Y[?RUS_ip_freight_limit|0]§!  Effective station: §Y[?RUS_ip_transport_capacity|0]§!\nAvailable now: §G[?RUS_ip_freight_preview_amount|1]§!  Fee: §R-[?RUS_ip_freight_preview_fee|2]§!  Days: §Y[?RUS_ip_freight_preview_days|0]§!\n[GetRUSIPFreightStatus]"
 RUS_ip_freight_preview_tt:0 "Current stock/funds estimate, not a charge. Dispatch follows production and uses the remaining stock and shared investment."
 RUS_ip_freight_empty:0 "No outbound shipment"
 RUS_ip_freight_shipment:0 "[GetRUSIPFreightCargo] §Y[?RUS_ip_freight_amount|1]§! → [GetRUSIPFreightTo]\n§Y[?RUS_ip_freight_days|0]§! days; unloading needs an active connected destination."
