 RUS_ip_metric_development_tt:0 "§YDevelopment§!\nSeeded once from regional population, weighted infrastructure and industry per state. Improves work, training and income while reducing upfront costs. Steelworks need 20, machinery 35. Repeated projects yield less development."
 RUS_ip_metric_workers:0 "Labour · supply / need\n§Y[?RUS_ip_sel_workers|1] / [?RUS_ip_sel_workers_need|1]§!"
 RUS_ip_metric_workers_tt:0 "§YLabour · supply / need§!\nProgramme labour points, not recruitable manpower. Existing industry, mines and current work consume capacity. Public facilities, training and development improve it."
 RUS_ip_metric_power:0 "Power · available / need\n§Y[?RUS_ip_sel_power|1] / [?RUS_ip_sel_power_need|1]§!"
 RUS_ip_metric_power_tt:0 "§YPower · available / need§!\nProgramme power capacity. Infrastructure, coal and grids support it; factories and work consume it. Imports [?RUS_ip_sel_power_import|1], exports [?RUS_ip_sel_power_export|1]. Land neighbours only; each transferred point uses 0.5 freight at both endpoints. Imports cannot be re-exported."
 RUS_ip_metric_freight:0 "Freight · load / capacity\n§Y[?RUS_ip_sel_freight_used|1] / [?RUS_ip_sel_freight|1]§!"
 RUS_ip_metric_freight_tt:0 "§YFreight · load / capacity§!\nInfrastructure, rail and facilities add capacity; disconnected regions retain 60%. Industry, work, power and cargo along the whole route use freight. Congestion slows arrivals, down to 5% speed. New dispatches retain a 10% emergency allowance to avoid supply deadlock."
