 RUS_ip_cost_rail:0 "§R-1§! / level"
 RUS_ip_rail_tt:0 "§YTransport line§!\nLevel: §G+1§!\nInvestment: §R-1§!\nConnect orthogonally to the local depot. Maximum level 3; shares plant tiles. Weakest segment limits output."
 RUS_ip_remove_tt:0 "Refund plant investment; keep lines, stocks and deliveries."
 RUS_ip_remove_rail_tt:0 "Refund line investment; downstream plants may disconnect."
 RUS_ip_switch_tt:0 "Stop production and input use; the line remains passable."
 RUS_ip_refresh_tt:0 "Recalculate routes and forecast without production or income."
 RUS_ip_start_tt:0 "Start 1800 days of production; value target §Y500§!. Runs while closed; stops at expiry."
 RUS_ip_restart_tt:0 "Confirm twice to clear all boards, stocks, product deliveries, value and time; restore 40 investment and reroll deposits. The old plan is unaffected."
 RUS_ip_footnote:0 "Independent sandbox · fixed product values · production follows game time"
 RUS_ip_help_title:0 "Factory Planning · How to Play"
 RUS_ip_help_0:0 "§Y1. Plan, then start§!\nShare §Y40§! investment; each region starts with §Y6§! coal, §Y4§! iron and §Y2§! steel. Target §Y500§! delivered value in §Y1800§! days. Production continues while closed.\nBasic coal, iron, power, steel and machinery provide an independent start."
 RUS_ip_help_1:0 "§Y2. Regional choices§!\nMoscow: machine tools. Petrograd: aircraft parts. Tsaritsyn: tractors. West Siberia: rail equipment. Central Siberia: generating equipment. Far East: precision tools.\nSpecial ores follow KR catchments; basic ores include starter reserves. Positions reroll only on a new plan."
 RUS_ip_help_2:0 "§Y3. Lines and construction§!\nConnect facility tiles orthogonally to the local depot. Plants and lines reach level §Y3§!; the weakest route limits production. Grades are green, blue and gold.\nBuild one freight station per region under Basic production. Connect both ends; select destination, cargo, reserve and enable dispatch under Freight. Batch size is 6 per effective level; fee is 0.1 per unit."
 RUS_ip_help_3:0 "§Y4. Processing order§!\nMines → refining → power → steel → aluminium/alloys → regional products → generic machinery. Refineries have their own auxiliary power. Fuel power saves coal.\nRegional products have input priority; stop plants to redirect inputs. Freight stations transfer stocks; power stays local. Shortages scale output."
 RUS_ip_help_4:0 "§Y5. Prices and investment§!\nPrices: machinery §Y1§!, tractors §Y1.5§!, machine tools §Y2§!, rail equipment §Y2.5§!, aircraft parts and generators §Y3§!, precision tools §Y4§!.\nDelivered quantity × price gives value and equal investment. Intermediate stocks do not earn income. Advanced chains cost more to build."
 RUS_ip_help_5:0 "§Y6. Forecasts and expiry§!\nForecasts show next-day rates × 30, not guaranteed monthly output. Hover build buttons for recipes and total value for product deliveries.\nDemolition refunds paid costs. Expiry preserves results and returns unfinished cargo and its fees; confirm reset twice. This sandbox grants no real factories and does not replace the old plan."
