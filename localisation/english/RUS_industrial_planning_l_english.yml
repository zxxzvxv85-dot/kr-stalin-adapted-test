 RUS_ip_start_tt:0 "Begin this independent 1800-day programme once. Each completed coal or iron mine restores 2 percentage points of extraction efficiency; 15 mines clear the penalty. Any remaining penalty ends with the programme."
 RUS_ip_refresh_tt:0 "Recheck territory, rail and work without advancing time. National capacity updates daily."
 RUS_ip_pause_tt:0 "Pause or resume. Releases project civs and stops its material use; local industry and warehousing continue."
 RUS_ip_cancel_tt:0 "Confirm to release civs and discard progress. Refunds 75% of the uncompleted share of the upfront cost: [?RUS_ip_sel_refund|1] now. Consumed materials are not refunded."
 RUS_ip_help_title:0 "Industrial construction · How to play"
 RUS_ip_help_0:0 "§Y1. Start and choose a site§!\nFirst take Enable Industrial Construction GUI (Test), then Start programme in this window for an independent 1800-day period. Work is delivered to the selected central state. One queued project per district, several districts at once. Closing the window does not stop work."
 RUS_ip_help_1:0 "§Y2. Real assets and supply chains§!\nStarting applies -30% extraction efficiency. Each completed coal or iron mine restores 2 percentage points; 15 clear it. Coal mines add coal, iron mines add steel; grids lower energy needs, steelworks add civs and steel, machine works add arms factories. See native reward tooltips."
 RUS_ip_help_2:0 "§Y3. Funds and stock§!\nStart with 1000 funds. Projects cost funds, reserve civs and consume coal/steel. Settle actual operations every 30 days, with no funding or minimum. Debt can grow below zero: per 100 owed, stability -5%, construction -10%, capped at -50%/-75%. Repayment reduces penalties. Debt blocks new orders, not existing work."
 RUS_ip_help_3:0 "§Y4. Regions and expansion§!\nAggregate owned and controlled member states; deliver buildings to the centre. Development 0–100; steelworks require 20, machinery 35. Public facilities and training improve labour. Expansion consumes funds, civs and materials, raises the central state category once and adds one base slot, up to $twelve$."
 RUS_ip_help_4:0 "§Y5. Automatic freight and planning§!\nUse local stocks first. Export beyond 21 days to Moscow; the hub supplies up to 14 days. Fixed routes carry finite cargo; congestion delays and route cuts pause it. Select one priority district. Power sharing uses freight. Heavy industry needs Moscow access. No materials means no work."
 RUS_ip_help_5:0 "§Y6. War and conclusion§!\nPeace favours industry; war favours current construction. Accounts and time continue. Cancellation or expiry refunds 75% of unused upfront cost. Expiry releases commitments, extraction and programme debt penalties; assets remain and accounts freeze. The old Five-Year Plan is separate."
