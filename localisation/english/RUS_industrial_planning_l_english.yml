 RUS_ip_route_focus:0 "Inspect bottleneck"
 RUS_ip_route_focus_tt:0 "Select the worst freight bottleneck, or the far side of the first interrupted link. Identifies a district centre, not a province-by-province railway segment."
 RUS_ip_supply_policy:0 "§YDispatch policy§!\n[GetRUSIPPolicy]; [GetRUSIPPriority]\nPeace: local industry first. War: queued construction first, with normal accounts, freight and programme clock.\nSelect one priority region; others follow district order. The priority also applies to civilian factory allocation."
