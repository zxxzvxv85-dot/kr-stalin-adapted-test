 RUS_ip_budget_projection_tt:0 "§YCurrent-plan forecast§!\n30-day funds change: [?RUS_ip_projected_settlement|=+1]\nAccrued operating net: [?RUS_ip_budget_net|=+1]\n[?RUS_ip_budget_next|0] days to settlement\nExpected change: [?RUS_ip_next_settlement|=+1]\nExpected balance: [?RUS_ip_next_balance|+1]\n\nUpdates daily and after actions. Excludes future starts, refunds, completions, supply and war changes. The next settlement includes actual accruals."
