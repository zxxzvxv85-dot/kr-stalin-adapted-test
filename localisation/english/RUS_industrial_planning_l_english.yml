 RUS_ip_build_10_cost_tt:0 "\n§YConstruction:§!\nProgramme funds: §R-[?RUS_ip_rail_cost|1]§!\n$MODIFIER_CIVILIAN_FACTORY_USE$: §R+3§!\nDaily steel consumption: §R-0.30§!\nDaily coal consumption: §R-0.20§!\nIndustrial labour demand: §R+3§!\nLocal power demand: §R+1§!\nBase freight load: §R+2§!\nCargo adds freight load; shortages slow or halt work.\nOwn and control both endpoints, with a buildable domestic land path.\nUses the destination queue, stocks and capacities. Endpoints and level lock on acceptance.\nCost and work scale with map distance and target level, not the exact provincial route.\nRepeated projects yield less development.\nSupplied estimate: §Y[?RUS_ip_rail_days|0]§! days. [GetRUSIPForecast10].\nExcludes waiting for materials and capacity."
