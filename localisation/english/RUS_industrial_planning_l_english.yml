 RUS_ip_build_9_cost_tt:0 "\n§YConstruction:§!\nProgramme funds: §R-[?RUS_ip_forecast_9_cost|1]§!\n$MODIFIER_CIVILIAN_FACTORY_USE$: §R+3§!\nDaily steel consumption: §R-0.30§!\nDaily coal consumption: §R-0.20§!\nIndustrial labour demand: §R+3§!\nLocal power demand: §R+2§!\nBase freight load: §R+1§!\nCargo adds freight load; shortages slow or halt work.\nThe central state must have an ordinary category below $twelve$.\nCan expand with all slots occupied; special ports, islands and wastelands are excluded.\nRepeated projects yield less development.\nSupplied estimate: §Y[?RUS_ip_forecast_9_days|0]§! days. [GetRUSIPForecast9].\nExcludes waiting for materials and capacity."
