 RUS_ip_route_hub_lost:0 "Moscow warehouse is not owned and controlled"
 RUS_ip_route_diagnosis_blocked:0 "§RRoute interrupted§!: [GetRUSIPRouteGap]\nCheck control and rail connections, or ports and convoys for sea links."
 RUS_ip_route_diagnosis_hub:0 "The hub aggregates several routes; select a receiving or sending district to inspect its bottleneck."
 RUS_ip_route_diagnosis_busy:0 "§RFreight bottleneck§!: [GetRUSIPRouteBottleneck]\nLoad: §Y[?RUS_ip_sel_route_load|1]§! / capacity: §Y[?RUS_ip_sel_route_capacity|1]§!; shortfall: §Y[?RUS_ip_sel_route_missing|1]§!\nCentral-state rail: §Y[?RUS_ip_sel_route_rail|0]§! / §Y5§!. Improve transport here or reduce local load."
 RUS_ip_route_diagnosis_clear:0 "§GNo freight bottleneck§!; normal journey time. Further rail upgrades will not shorten it."
 RUS_ip_plan_debt:0 "Programme Construction Debt"
 RUS_ip_plan_debt_desc:0 "Unpaid bills undermine public services and confidence among contractors, disrupting construction and economic order."
 RUS_ip_debt_active:0 "§RDebt§!: §Y[?RUS_ip_debt|1]§!"
 RUS_ip_debt_clear:0 "No debt"
 RUS_ip_funds_hover:0 "[!ip_funds_icon_click]"
 RUS_ip_funds_tt:0 "§YProgramme funds§!\nStarting funds: §Y1000§!; separate from the existing surplus.\nActual accounts settle every 30 days, without grants or a minimum.\nPay upfront; insufficient funds block new orders.\n\n[GetRUSIPBudgetForecast]\n\n[GetRUSIPDebtStatus]\nDuring the programme, per §R100§! owed: stability §R−5%§!, construction §R−10%§!, capped at §R−50%§!/§R−75%§!.\nScales continuously and recedes with repayment. Affects native and GUI construction. Penalties end when this programme expires."
 RUS_ip_warehouse_tt:0 "§YRegional warehouse§!\nSeparate steel/coal capacities. Booking one native resource point yields 0.25 warehouse units that day, using at most half the national available flow. Daily operation and construction consume stocks. Dispatched cargo cannot be spent twice."
 RUS_ip_transit_tt:0 "§YAutomatic freight§!\nRegions export beyond a 21-day reserve to Moscow. The hub supplies up to 14 days of regional demand. One batch per direction and resource. Fixed planning routes, congestion delays and interruptions. Cargo in transit is unavailable."
 RUS_ip_balance_tt:0 "§YRegional balance§!\nCivilian income depends on development, materials, labour and power. Mining earns on actual production. Military industry, facilities, grids, rail and public services incur upkeep. These are programme contributions, not native factory output penalties."
 RUS_ip_supply_card_funds:0 "Programme funds\n[?RUS_ip_funds|+1]"
 RUS_ip_supply_card_warehouse:0 "Local stock · ST / CO\n§Y[?RUS_ip_sel_stock_steel|1]§! / §Y[?RUS_ip_sel_stock_coal|1]§!"
 RUS_ip_supply_card_transit:0 "Inbound · ST / CO\n§Y[?RUS_ip_sel_view_in_steel|1]§! / §Y[?RUS_ip_sel_view_in_coal|1]§!"
 RUS_ip_supply_card_balance:0 "Local balance / 30 days\n[?RUS_ip_sel_net_month|=+1]"
 RUS_ip_budget_ledger_projection:0 "Next settlement: [?RUS_ip_budget_next|0] days\nFunds change: [?RUS_ip_next_settlement|=+1] · balance: [?RUS_ip_next_balance|+1]\nAccrued operating net: [?RUS_ip_budget_net|=+1]\nFunds change / 30d: [?RUS_ip_projected_settlement|=+1]"
 RUS_ip_budget_ledger:0 "§YNational account§!\n[GetRUSIPLedgerForecast]\nLast settlement: [?RUS_ip_last_budget|=+1]\nTotal spending: §R-[?RUS_ip_funds_spent|1]§! · refunds: [?RUS_ip_funds_refunded|=+1]\nSteel stock: §Y[?RUS_ip_total_stock_steel|1]§! · coal: §Y[?RUS_ip_total_stock_coal|1]§!\nSteel in transit: §Y[?RUS_ip_total_transit_steel|1]§! · coal: §Y[?RUS_ip_total_transit_coal|1]§!\n[GetRUSIPDebtStatus]; hover funds for effects."
 RUS_ip_supply_local:0 "§YSelected economic region§!\nStates: §Y[?RUS_ip_sel_members|0]§! · population: §Y[?RUS_ip_sel_pop_k|0]§! thousand\nStorage/resource: §Y[?RUS_ip_sel_warehouse_cap|1]§! · cover: ~[?RUS_ip_sel_cover|1] days\nIndustrial daily demand: ST §R[?RUS_ip_sel_base_steel|2]§! / CO §R[?RUS_ip_sel_base_coal|2]§!\nConstruction daily demand: ST §R[?RUS_ip_sel_project_steel|2]§! / CO §R[?RUS_ip_sel_project_coal|2]§!\nCivilian income: [?RUS_ip_sel_income_month|=+1] / 30 days\nMining run rate: [?RUS_ip_sel_mining_month|=+1] / 30 days\nUpkeep: §R-[?RUS_ip_sel_upkeep_month|1]§! / 30 days\nProject spending: §R-[?RUS_ip_sel_paid|1]§!\nRefund on cancellation: [?RUS_ip_sel_refund|=+1]"
