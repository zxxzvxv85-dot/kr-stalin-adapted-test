 RUS_nat_reserve_0_tt:0 "£RUS_nat_text_stock£ §Y0.5-quarter domestic reserve§!\n\nMeet §4current domestic needs§! first, then retain food, beet and fibre stocks equal to §Y0.5 full quarters of demand§!. Only stock above this reserve may fulfil §4export orders§!.\nLarger reserves leave less stock for exports. §RThis is a stock target, not free supplies or a storage duration.§! Storage caps and quarterly spoilage still apply.\nDefault: §Yone quarter§!. Machinery separately retains spares equal to §Y25%§! of its in-service target; this button does not change that reserve."
 RUS_nat_reserve_1:0 "Keep 1 quarter"
 RUS_nat_reserve_1_tt:0 "£RUS_nat_text_stock£ §Y1-quarter domestic reserve§!\n\nMeet §4current domestic needs§! first, then retain food, beet and fibre stocks equal to §Y1 full quarters of demand§!. Only stock above this reserve may fulfil §4export orders§!.\nLarger reserves leave less stock for exports. §RThis is a stock target, not free supplies or a storage duration.§! Storage caps and quarterly spoilage still apply.\nDefault: §Yone quarter§!. Machinery separately retains spares equal to §Y25%§! of its in-service target; this button does not change that reserve."
 RUS_nat_reserve_2:0 "Keep 2 quarters"
 RUS_nat_reserve_2_tt:0 "£RUS_nat_text_stock£ §Y2-quarter domestic reserve§!\n\nMeet §4current domestic needs§! first, then retain food, beet and fibre stocks equal to §Y2 full quarters of demand§!. Only stock above this reserve may fulfil §4export orders§!.\nLarger reserves leave less stock for exports. §RThis is a stock target, not free supplies or a storage duration.§! Storage caps and quarterly spoilage still apply.\nDefault: §Yone quarter§!. Machinery separately retains spares equal to §Y25%§! of its in-service target; this button does not change that reserve."
