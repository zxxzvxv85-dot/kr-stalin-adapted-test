 RUS_nat_title:0 "National Agriculture Board"
 RUS_nat_tab_0:0 "Agriculture"
 RUS_nat_tab_1:0 "Machinery"
 RUS_nat_tab_2:0 "Stocks & Trade"
 RUS_nat_tab_3:0 "Quarterly Report"
 RUS_nat_tab_0_tt:0 "§YAgriculture§!\nAllocate 20 points per quarter, at most 10 per crop. Fulfilling the machinery promise and completing reform each add 2 permanently, up to 24.\nPhysical output depends on season, soil fatigue, actual weather, average machinery coverage and agricultural output modifiers. Estimates exclude hidden weather and markets; forecasts may be wrong. Markets, saturation and sales capacity affect prices only.\nConfirmation locks the plan until reopened. Unconfirmed plans are allocated automatically for domestic needs and reserves. Partial quarters are prorated by actual days."
 RUS_nat_tab_1_tt:0 "§YMachinery§!\nAssigned available civilian factories are reserved. Daily output per factory is 1.20 x efficiency x output factor. Current five-year-plan score and national factory output, efficiency cap and efficiency growth modifiers apply.\nNew factories enter at 30% efficiency. Stopped lines lose 0.1 percentage points daily, to a 30% floor. Factory losses reduce allocation. Full domestic service and storage stop production and cumulative credit.\nDomestic target: 400, rising to 500 next quarter after reform; warehouse cap: 4500. Quarterly in-service wear is 10/15/20/25%, plus 5 percentage points in adverse weather, capped at 30%. Stored machines do not wear. Average coverage scales crops to 90-110%.\nThe promise requires three tractor decisions within 540 days and 3000 self-produced units since system activation. Exports do not reduce cumulative production."
 RUS_nat_tab_2_tt:0 "§YStocks and Trade§!\nFull-quarter needs: wheat and rye combined 8, beet 2, flax and cotton combined 4. War at quarter start adds 2 food and 1 fibre.\nDomestic needs come first, then selected half/one/two-quarter reserves, then accepted orders by priority. Whole orders only; stock cannot be reused. Crop caps are 12/12/6/6/6. End-quarter spoilage is 5%, or 2% with Kakhovskaya.\nWestern Comrades unlocks an ordinary crop order. After the Paris treaty, existing Britain and France each supply crop and machinery orders from the next quarter. Base surplus per unit: crops 1000, machinery 150. Delivered British/French orders add 0.10 to price; final price multiplier 0.40-1.50. Machinery exports require domestic replenishment and spare reserves of 25% of target."
 RUS_nat_tab_3_tt:0 "§YQuarterly Report§!\nDomestic points: all food +2, or 90% to below 100% +1; all beet and all fibre +0.5 each. This component is capped at 3 per quarter and 12 per agricultural year. Meeting all three needs also grants 50 political power, capped at 200 per year.\nAdditional points: one-quarter food reserves +2; average machinery coverage at least 90% +2; quarterly task +4, plus 1 with Ustinov. Points require ongoing or successful formal reform. Partial quarters are prorated.\nUstinov reform: 150 points in 720 days. After success, excess points form a spendable balance without lowering stages. Failure stops points and exchanges, not farming. Exports grant no additional reform points.\nAnnual spirits use average domestic supply and year-end reserves. Food shortages build penalties, recovering one level per supplied quarter. Beet or fibre shortages reduce factory output."
