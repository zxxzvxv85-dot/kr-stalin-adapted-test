 RUS_nat_industry:0 "National Agriculture and Machinery"
 RUS_national_agriculture.1.t:0 "Annual Agricultural Report"
 RUS_national_agriculture.1.d:0 "The Agriculture Board has completed its annual assessment. Average domestic supply reached [?RUS_nat_last_annual|1]%. The new agricultural year has begun."
 RUS_national_agriculture.1.a:0 "Continue building socialist agriculture."
 RUS_national_agriculture.2.t:0 "National Agriculture Guide"
 RUS_national_agriculture.2.d:0 "Click the §bfour tabs§! above the agriculture interface to switch between crops, machinery, trade and reports. The free §bNational Agriculture Guide§! decision reopens this guide.\n\n§4Production§!: allocate §b10§! free points per quarter, up to §b10§! per crop. Check the §bSupply Ledger§! for domestic and reserve gaps, then use the plus and minus buttons. Unit yields and export estimates update immediately.\n\n§4Plans§!: manual edits are saved immediately. Confirm locks this quarter; Reopen allows edits. Manual allocations carry into the next quarter. Automatic mode replans for seasonal domestic needs and reserves. An unconfirmed manual draft is still used at settlement.\n\n§4Reform§!: farming starts on appointment; reform points start with formal land reform. Reach §b200§! in §b720§! days. Decisions provide at most §b90§!; farming and events supply the rest.\n\n§4Settlement§!: domestic supply, reserves, orders, then remaining-stock spoilage. A notice arrives each new quarter; unconfirmed plans receive a reminder with §b7§! days left."
 RUS_national_agriculture.3.t:0 "A New Agricultural Quarter"
 RUS_national_agriculture.3.d:0 "The previous quarter has settled.\n\n§4Domestic supply§!: food §b[?RUS_nat_food_last_ratio|2]%§!, beet §b[?RUS_nat_beet_last_ratio|2]%§!, fibre §b[?RUS_nat_textile_last_ratio|2]%§!.\n§4Reform points§!: §b+[?RUS_agri_last_quarter_score|2]§!.\n§4Political power§!: §b+[?RUS_nat_last_pp|1]§!.\n\nSeasonal conditions, forecasts, needs and orders have updated. Manual allocations are retained. Check the §bSupply Ledger§! for the new quarter."
 RUS_national_agriculture.4.t:0 "Review the Agricultural Plan"
 RUS_national_agriculture.4.d:0 "Settlement is §b[?RUS_nat_remaining|0]§! days away. Current state: [GetRUSNatPlan].\n\nReview domestic coverage, reserves and orders. The current manual draft will be used; automatic mode allocates for domestic needs and reserves. A confirmed plan can be reopened."
 RUS_national_agriculture.5.t:0 "Quarterly Supply Ledger"
 RUS_national_agriculture.5.d:0 "§4Food§!\nCurrent stock §b[?RUS_nat_food_stock_now|1]§!; expected harvest §b[?RUS_nat_food_new_yield|1]§!.\nDomestic supply §b[?RUS_nat_food_delivered|1]§!/§b[?RUS_nat_food_need|1]§! (§b[?RUS_nat_food_preview|2]§!%).\nReserve target §b[?RUS_nat_food_reserve|1]§!; accepted orders §b[?RUS_nat_food_order_need|1]§!.\nAdditional harvest required: §b[?RUS_nat_food_all_gap|2]§!.\n\n§4Beet§!\nCurrent stock §b[?RUS_nat_beet_stock_now|1]§!; expected harvest §b[?RUS_nat_beet_new_yield|1]§!.\nDomestic supply §b[?RUS_nat_beet_delivered|1]§!/§b[?RUS_nat_beet_need|1]§! (§b[?RUS_nat_beet_preview|2]§!%).\nReserve target §b[?RUS_nat_beet_reserve|1]§!; accepted orders §b[?RUS_nat_beet_order_need|1]§!.\nAdditional harvest required: §b[?RUS_nat_beet_all_gap|2]§!.\n\n§4Fibre§!\nCurrent stock §b[?RUS_nat_textile_stock_now|1]§!; expected harvest §b[?RUS_nat_textile_new_yield|1]§!.\nDomestic supply §b[?RUS_nat_textile_delivered|1]§!/§b[?RUS_nat_textile_need|1]§! (§b[?RUS_nat_textile_preview|2]§!%).\nReserve target §b[?RUS_nat_textile_reserve|1]§!; accepted orders §b[?RUS_nat_textile_order_need|1]§!.\nAdditional harvest required: §b[?RUS_nat_textile_all_gap|2]§!.\n\nTotal target = domestic needs + selected reserves + accepted orders\n\nFood and fibre are grouped; orders require their specified crop in full. Remaining stocks spoil after domestic supply and exports at this quarter end. The additional harvest gap includes expected end-quarter spoilage; expected harvest remains the gross pre-spoilage yield."
