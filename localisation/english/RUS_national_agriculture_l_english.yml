 RUS_national_agriculture.6.t:0 "Weather and Markets"
 RUS_national_agriculture.6.d:0 "£RUS_nat_text_food£ §4Weather§! is the quarter-wide climate outcome shared by all five crops. §GFavourable§! tends towards more output, §bnormal§! towards no change, and §Radverse§! towards less output. Actual adverse weather also increases machinery wear.\n\nWeather is added to the seasonal yield coefficient before machinery coverage and other factors. A reported weather change of §b+20%§! adds §b0.20§! to that coefficient:\n§b1.25§! + §b0.20§! = §b1.45§!\n\n£RUS_nat_text_income£ §4Markets§! change the sale price of delivered export orders. §GStrong§! tends towards higher prices, §bsteady§! towards no change and §Rweak§! towards lower prices. Each crop and machinery have separate market draws; forecasts may coincide.\n\n§4Forecasts and outcomes§!: the opening labels indicate likelihood, not certainty. Favourable weather can turn adverse; a strong market can fall. Actual outcomes appear in the §bQuarterly Report§! at settlement.\n\n§4Estimates§!: displayed unit yields and export income use public conditions only. Hidden actual weather and markets, and forecast labels themselves, are excluded from those calculations."
 RUS_national_agriculture.7.t:0 "Yields, Soil and Income"
 RUS_national_agriculture.7.d:0 "£RUS_nat_text_food£ §4Unit yield§!: estimated physical crops from §b1§! allocation, including season, soil fatigue, average machinery coverage, public bonuses and partial-quarter scaling.\n\nExpected harvest = allocation x unit yield\n§b4§! allocation at §b1.25§! yields §b5§! units.\n\n£RUS_nat_text_food£ §4Soil fatigue§!: repeated concentrated planting reduces output; rotating or reducing that crop allows recovery. §4Saturation§! and §4sales capacity§! affect prices: repeated concentration lowers prices; exports beyond a crop's sales capacity receive marginal discounts.\n\n£RUS_nat_text_stock£ §4Domestic needs and reserves§!: wheat and rye share food needs; flax and cotton share fibre needs; beet stands alone. Meet domestic needs, keep selected reserves, then deliver whole orders of their specified crop. Remaining stock is capped and then spoils.\n\n£RUS_nat_text_income£ §4Estimated export income§!: surplus from deliverable orders under public conditions, including available old stocks. Domestic use counts towards supply; no deliverable orders means §b0§! income.\n\nEstimated export income = sum of deliverable order estimates\nOrder income = quantity x base price x applicable price multiplier\n\nBase prices: crops §b1000§!, machinery §b150§!. Treaty bonuses, saturation and marginal discounts apply within §b40%–150%§!. Crop rows show their own income; the footer also includes machinery."
