 RUS_nat_tab_3:0 "Quarterly Report"
 RUS_nat_tab_0_tt:0 "§YAgriculture§!\n\n£RUS_nat_text_food£ Allocate §Y20§! points per quarter, at most §Y10§! per crop. Fulfilling the machinery promise and §Gcompleting reform§! §Geach add 2 permanently§!, up to §Y24§!.\n\n£RUS_nat_text_food£ §4Physical output§! depends on §4season§!, §4soil fatigue§!, §4actual weather§!, §4average machinery coverage§! and §4agricultural output modifiers§!. Estimates exclude §Rhidden weather and markets§!; §Rforecasts may be wrong§!. §4Markets§!, §4saturation§! and §4sales capacity§! affect §4prices§! only.\n\n£RUS_nat_text_orders£ §YConfirmation locks the plan§! until §Yreopened§!. Unconfirmed plans are §Yallocated automatically§! for §4domestic needs§! and §4reserves§!. Partial quarters are prorated by §Yactual days§!."
 RUS_nat_tab_1_tt:0 "§YMachinery§!\n\n£RUS_nat_text_machinery£ Assigned available §4civilian factories§! are reserved. \n\nDaily output per factory = §Y1.20§! x §4efficiency§! x §4output factor§!\n\nCurrent §4five-year-plan score§! and national §4factory output§!, §4efficiency cap§! and §4efficiency growth§! modifiers apply.\n\n£RUS_nat_text_factories£ New factories enter at §Y30%§! §4efficiency§!. Stopped lines lose §Y0.1§! percentage points daily, to a §Y30%§! floor. Factory losses reduce allocation. Full domestic service and storage stop production and cumulative credit.\n\n£RUS_nat_text_stock£ §4Domestic target§!: §Y400§!, rising to §Y500§! §Ynext quarter§! after reform; §4warehouse cap§!: §Y4500§!. Quarterly in-service §Rwear§! is §Y10§!/§Y15§!/§Y20§!/§Y25%§!, plus §Y5§! percentage points in §Radverse weather§!, capped at §Y30%§!. Stored machines do not §Rwear§!. §4Average coverage§! scales crops to §Y90§!§R-110%§!.\n\n£RUS_nat_text_orders£ The promise requires three tractor decisions within §Y540§! days and §Y3000§! self-produced units since system activation. Exports do not reduce §4cumulative production§!."
 RUS_nat_tab_2_tt:0 "§YStocks and Trade§!\n\n£RUS_nat_text_food£ Full-quarter needs: wheat and rye combined §Y8§!, beet §Y2§!, flax and cotton combined §Y4§!. War at quarter start adds §Y2§! food and §Y1§! fibre.\n\n£RUS_nat_text_stock£ Domestic needs come first, then selected half/one/two-quarter §4reserves§!, then accepted §4orders§! by priority. §YWhole orders only§!; stock cannot be reused. Crop caps are §Y12§!/§Y12§!/§Y6§!/§Y6§!/§Y6§!. End-quarter §Rspoilage§! is §Y5%§!, or §Y2%§! with §YKakhovskaya§!.\n\n£RUS_nat_text_export£ §YWestern Comrades§! unlocks an ordinary §4crop order§!. After the §YParis treaty§!, existing Britain and France each supply crop and machinery §4orders§! from the §Ynext quarter§!. §4Base surplus§! per unit: crops §Y1000§!, machinery §Y150§!. Delivered British/French §4orders§! add §Y0.10§! to price; final §4price multiplier§! §Y0.40§!§R-1.50§!. Machinery exports require domestic replenishment and §4spare reserves§! of §Y25%§! of target."
 RUS_nat_tab_3_tt:0 "§YQuarterly Report§!\n\n£RUS_nat_text_reform£ §4Domestic points§!: all food §G+2§!, or §Y90%§! to below §Y100%§! §G+1§!; all beet and all fibre §G+0.5§! each. This component is capped at §Y3§! per quarter and §Y12 per agricultural year§!. Meeting all three needs also grants §Y50§! §4political power§!, capped at §Y200 per year§!.\n\n£RUS_nat_text_machinery£ Additional points: one-quarter §4food reserves§! §G+2§!; §4average machinery coverage§! at least §Y90%§! §G+2§!; §4quarterly task§! §G+4§!, plus §Y1§! with §YUstinov§!. §YPoints require ongoing or successful formal reform§!. Partial quarters are prorated.\n\n£RUS_nat_text_reform£ §YUstinov§! reform: §Y150§! points in §Y720§! days. After success, excess points form a §4spendable balance§! §Gwithout lowering stages§!. §RFailure stops points and exchanges§!, not farming. §RExports grant no additional reform points§!.\n\n£RUS_nat_text_food£ §4Annual spirits§! use average domestic supply and year-end §4reserves§!. §RFood shortages§! build penalties, §Grecovering one level§! per supplied quarter. Beet or fibre shortages §Rreduce factory output§!."
