l_english:
 RUS_japanese_antiwar_movement:0 "A Growing Anti-War Movement"
 RUS_japanese_antiwar_movement_desc:0 "Opposition to imperial expansion is spreading through factories, universities and ports. More and more Japanese citizens are asking who truly profits from war."
 RUS_active_northeast_resistance:0 "Active Northeast Resistance"
 RUS_active_northeast_resistance_desc:0 "Partisans along the railways are working with underground organisations in the cities. Popular resistance is undermining the order built by the Fengtian authorities and Japanese capital."
 RUS_northeast_anti_japanese_network:0 "Northeast Anti-Japanese Network"
 RUS_northeast_anti_japanese_network_desc:0 "Clandestine stations connect the resistance. Guides, intelligence and supplies travel along routes absent from any official map."
 RUS_transcontinental_economic_cooperation:0 "Transcontinental Economic Cooperation"
 RUS_transcontinental_economic_cooperation_desc:0 "Distance cannot prevent cooperation between our workers. Engineers exchange knowledge as new roads and production plans connect the industrial cities of both countries."
 RUS_workers_peasants_military_exchange:0 "Joint Red Army Studies"
 RUS_workers_peasants_military_exchange_desc:0 "Officers from both countries study their campaigns around the same maps, turning battlefield experience into better plans for future operations."
 RUS_project_156_sponsor:0 "Project 156"
 RUS_project_156_sponsor_desc:0 "Industrial equipment, technical drawings and engineers are leaving for China. The undertaking commits domestic production and construction capacity, sustained by regular bilateral settlements."
 RUS_project_156_recipient:0 "Project 156"
 RUS_project_156_recipient_desc:0 "New industrial centres are taking root across China. Russian specialists and Chinese workers are surveying, building and installing the foundations of an independent industrial economy."
 RUS_sino_soviet_friendship_treaty:0 "Sino-Soviet Treaty of Friendship and Alliance"
 RUS_sino_soviet_friendship_treaty_desc:0 "Shared interests and convictions bind our peoples together. From frontier posts and shipyards to aircraft design offices and workers' assemblies, cooperation gives substance to our common defence of peace."
 RUS_sino_soviet_treaty_easy_equipment:0 "Easy Mode: Sino-Soviet Equipment Cooperation"
 RUS_sino_soviet_treaty_easy_equipment_desc:0 "Aviation cooperation is turning shared designs into a more plentiful supply of equipment."
 RUS_northeast_network_combat:0 "Northeast Resistance Network"
 RUS_northeast_network_combat_easy:0 "Northeast Resistance Network: Easy Mode"
 RUS_northeast_network_targets_tt:0 "Army attack and defence against non-socialist §Y[JAP.GetName]§! and a collaborating §Y[FNG.GetName]§!: §G+[GetRUSEastAsiaNetworkBonus]%§!. Ends against a country when it changes its alignment."
 RUS_project_156_monthly_surplus_tt:0 "£civ_factory_output Monthly economic surplus: §G+[GetRUSEastAsiaMonthlySurplus]§!"
 RUS_project_156_monthly_infrastructure_tt:0 "Each month, make §Y[GetRUSEastAsiaInfrastructureDraws]§! independent random selections among owned and controlled core states with free infrastructure capacity. Each selection instantly adds §G1§! level of §Yinfrastructure§!. A state may be selected again; skip a selection if none qualify."
