 RUS_agricultural_management.3.t:0 "Agricultural Prospects for the New State"
 RUS_agricultural_management.3.d:0 "As land reform advances and agricultural factories enter large-scale trials, the Supreme Economic Council has completed a comprehensive assessment of the recovery of agricultural production across the country. Its findings suggest that our food security is now broadly assured for the foreseeable future.\n\nAgricultural production has recovered faster than expected, and yields in the pilot areas have risen noticeably above those achieved through traditional cultivation. This trend has inspired confidence in the prospects for agricultural transformation.\n\nThe Central Statistical Bureau's latest report on food supply and demand offers strong supporting evidence.\n\nFor several years, self-sufficiency in the country's principal food crops has remained above the safety threshold, while strategic grain reserves have recovered to seventy percent of their pre-civil-war level. An internal assessment by the Supreme Economic Council further concludes that, should this recovery continue, the country could eliminate its dependence on imported food by the end of the Five-Year Plan.\nThis judgment has won broad support across the Council's political factions.\n\nYet early success in production does not mean that the system itself has matured. The introduction of agricultural factories has exposed inconsistent management standards, delays in spreading new techniques, and poor coordination in the allocation of labour. Some pilot areas meet their production targets but retain loose organisational structures, with unclear divisions of responsibility between workers and managers. Elsewhere, the lack of common technical standards has produced yield differences of more than thirty percent between neighbouring factories. More fundamentally, the existing administration has yet to resolve how a dispersed rural workforce can be integrated into a stable system of industrial labour.\n\nIn response, Deputy People's Minister of Agriculture Andrey Kolegayev has submitted a new reform proposal to the congress. To ensure efficient and stable agricultural production, he argues, agricultural factories must introduce appropriate forms of democratic management and economic feedback, clarifying responsibilities, standardising procedures, and gaining institutional experience for subsequent expansion.\n\nThe proposal has received broad approval at the congress, with all sides recognising its considerable feasibility in principle. Its detailed provisions will be refined through further field research by a joint working group of the Supreme Economic Council and the Ministry of Agriculture."
 RUS_agricultural_management.3.a:0 "Another leap towards a new world."
 RUS_agricultural_management.3.b:0 "Let me see this 'peasant Leninist's' proposal."
 RUS_agricultural_management.4.t:0 "On Kolegayev's Proposal"
 RUS_agricultural_management.4.d:0 "The central aim of Kolegayev's proposal is to move agricultural factories from experimental trials to fully institutionalised operation. Its design is as follows:\n\nI. Organisational Structure\n\nEach agricultural factory comprises several villages within an administrative district and operates under the direct leadership of the local agricultural soviet. Internally, management has three levels: the factory administration draws up annual production plans and technical programmes; workshops, corresponding to individual villages, carry out specific cultivation tasks; and production teams form the basic labour units, organised by acreage and crop type and managed through work quotas.\n\nThis three-tier structure is intended to provide an adequate span of management without allowing excessive layers of authority to distort instructions.\n\nII. Regional Autonomy and Central Control\n\nThe proposal establishes the principle of unified planning with implementation at several levels. Factory administrations draw up annual plans based on central guidelines, but workshops retain considerable discretion over crop varieties, cultivation schedules, crop rotation, and fallow acreage. Within the framework of the higher-level plan, factories may adapt their planting patterns to local soil and climatic conditions. This is intended to prevent central instructions from becoming detached from local realities and to reduce losses caused by a uniform approach.\n\nAt the same time, the proposal explicitly provides for compulsory coordination. On essential matters such as grain procurement obligations, minimum cultivated acreage, and major technical standards, including the use of improved seed and fertiliser, every factory must obey central directives without claiming exemptions on grounds of local circumstances. Local agricultural soviets must supervise implementation and submit quarterly progress reports to the People's Ministry of Agriculture. Where a unit fails to meet its targets for two consecutive quarters, the higher authorities may initiate a special supervisory procedure, dispatch technical teams to guide corrective work, and, where necessary, replace the factory's management.\n\nIn short, local bodies retain sufficient flexibility to accommodate the natural variations of agriculture, while the centre retains sufficient authority to protect the strategic minimum of food security. The proposal seeks to draw a workable boundary between these competing requirements.\n\nIII. Labour Relations and Distribution\n\nAgricultural factories will adopt a unified system of labour organisation. Peasants will enter them as agricultural workers, no longer tied directly to the land as independent households. Regular daily work, coordinated assignments, and rotating deployment will gradually replace the traditional use of temporary labour during busy seasons. Each factory will have a technical guidance team to promote improved seed and cultivation standards, alongside political commissars responsible for labour discipline and political education.\n\nDistribution will follow a work-point system based on labour contributed. Basic points will reflect the duration and intensity of work, with supplementary rewards and penalties encouraging the exceeding of production targets and adoption of new techniques. At the annual settlement, the value of work points will be linked to the factory's actual output: greater production brings higher returns, while poor harvests reduce them.\n\nIn the event of a large-scale natural disaster, the Council will still guarantee factory members' basic subsistence.\n\nIV. Stages of Expansion\n\nThe proposal envisages three stages:\n\n- First: summarise the experience of existing trials and establish common management regulations and technical standards.\n- Second: extend the system across the principal grain-producing regions, aiming to cover 60% of the country's arable land.\n- Third: gradually extend the experience of agricultural factories to livestock raising and horticulture, completing the transformation of agriculture along factory lines.\n\nV. The Proposal's Overall Purpose\n\nKolegayev stresses that agricultural factories are not merely a new version of collectivisation. They are institutions intended to reorganise agricultural production on industrial principles, raising output while establishing rural labour relations and management structures consistent with socialism.\n\nAt the end of his explanation, Kolegayev adapts a famous saying of Lenin as his concluding words:"
 RUS_agricultural_management.4.a:0 "'Socialist agriculture = factory production + democratic principles.'"
