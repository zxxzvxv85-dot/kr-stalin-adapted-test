  rus_stalin_education_events.1.t: "Decree on Universal Compulsory Education"
  rus_stalin_education_events.1.desc: "Article I: Scope of Compulsory Education\nFrom the date of this decree's promulgation, every child within the Russian Socialist Republic between the ages of seven and fifteen, regardless of sex, nationality, family origin or religious belief, shall enjoy both the right and the duty to receive basic education. Compulsory education shall last four years, and its curriculum shall include literacy, arithmetic, elementary natural science, history and the fundamentals of socialist theory.\n\nArticle II: The Principle of Free Education\nTuition, textbooks and basic school supplies for compulsory education shall be paid for in full by the state treasury. No local institution or private person may collect any fee from a student's family in the name of compulsory education.\n\nArticle III: Duties of Local Executive Bodies\nCounty and village soviets shall, within six months of this decree's promulgation, complete registration of all school-age children in their jurisdictions and ensure that each registered child enters school on time. Local executive bodies shall submit monthly reports on enrolment and attendance to the next higher educational authority.\n\nArticle IV: Duties of Parents and Guardians\nParents or legal guardians shall ensure that the school-age children under their care enter school on time and complete the required years of study. Those who, without proper cause, obstruct a child's enrolment or cause a child to leave school before completion, and who refuse to correct their actions after educational persuasion, shall be punished by the local soviet with warnings, fines or social service according to the severity of the case."
  rus_stalin_education_events.1.desc_2: "Article V: Teacher Assignment and Training\nTo realise universal compulsory education, the government shall expand enrolment in normal schools and establish short-term teacher training courses in every county. Persons with a secondary education or above who are willing to teach shall, after passing training and assessment, be assigned by priority to rural schools. Rural teachers shall enjoy the same salary as urban teachers, along with state housing subsidies and transport allowances for winter and summer holidays.\n\nArticle VI: Educational Protection for Special Groups\nFor school-age children who cannot attend school normally because of disability, family poverty or other special circumstances, local educational bodies shall establish home-teaching arrangements or special schools, ensuring that no child is deprived of education for any reason.\n\nArticle VII: Transitional Arrangements\nThe first year after this decree's promulgation shall be a period of publicity and preparation. All levels of soviet authority shall complete school construction, teacher training and textbook printing during this period. At the autumn term of the second year, compulsory education shall begin throughout the country.\n\nArticle VIII: Supervision and Implementation\nImplementation of this decree shall be jointly supervised by the People's Commissariat of Education and the Workers' and Peasants' Inspectorate. Local executive bodies shall submit quarterly progress reports on compulsory education to their superiors. Those who execute the decree poorly or falsify reports shall be held legally responsible.\n\nArticle IX: Authority of Interpretation and Revision\nThe authority to interpret and revise this decree belongs to the All-Russian Central Department of Education."
  rus_stalin_education_events.1.a: "This decree shall take effect upon publication."
  rus_stalin_education_events.2.t: "The Reproduction of Equality"
  rus_stalin_education_events.2.desc: "- On the Class Nature of Old Education and the Mission of Socialist Education\nNikolai Petrovich Sobolev\n\nIn capitalist society, education is never neutral.\n\nOn the surface it treats everyone alike: schools open their doors to all, the timetable is the same for every student, and examination scores seem to depend only on individual effort. Yet beneath this appearance of fairness, education performs a hidden and precise function: the reproduction of class. The children of the poor remain poor, and the children of the rich remain rich.\n\nOld education never announces this aim openly, but it realises it through an elaborate mechanism of selection. This mechanism has three layers.\n\nFirst: unequal access to schooling. Famous schools in city centres and dilapidated classrooms in remote villages share the same syllabus, as though a syllabus could erase the distance of the road, the absence of books and the lack of a kerosene lamp. The textbook speaks of trams and factories in the city; when a peasant child reads the word “tram”, he imagines an iron box that he has never seen.\n\nSecond: the values embedded in teaching. History lessons teach the succession of emperors and generals, while ordinary people who create real wealth in fields and workshops are reduced to a vague footnote called “the labouring people”. Literature lessons teach aristocratic love and knightly loyalty, while the story of a worker's wife bending over laundry all day is never considered worthy of a textbook. In the classroom, children learn a silent consent to the old order, as though the world has always been this way and can only remain this way."
  rus_stalin_education_events.2.desc_2: "Third: cultural bias in standards of evaluation. Exams test “standard Russian”, while children from slums grow up speaking dialects and slang; they test “civilised manners”, while the manner of expression of factory children is branded “coarse”. Among the selected “excellent students”, those from privileged backgrounds always occupy an overwhelming proportion: not because they are more intelligent, but because education was designed around their life experience from the beginning.\n\nThrough these three layers, old education fulfils its whole mission: it turns class advantage into the appearance of personal ability, disguises the violence of social structure as differences in individual effort, teaches the winners that they deserve everything, and teaches the defeated to accept that they were never capable. When the children grow up, they calmly enter the positions already prepared for them: the children of the rich inherit property and power; the children of the poor inherit tools and silence.\n\nIn this movement of reproduction, the winners see their victory as natural, and the losers are made to consent. No one questions the rules themselves, because the rules appear “neutral”: the same textbooks, the same classrooms, the same examinations. Yet those in power defend their ownership of the means of production precisely through this apparently equal “symbolic violence”.\n\nWhat is symbolic violence?\n\nIt is not as visible as the landlord's whip, nor as plainly written as a usurer's note. It is more hidden, and for that reason more effective. It hides in apparently neutral words: “talent”, “diligence”, “intelligence”, “slowness”. The child of the rich grows up in rooms filled with books, hearing discussions of politics and economics at the dinner table. Naturally he appears more “intelligent”, because he has already completed his first round of education at home. The child of the poor must help his family after school and dares not light a kerosene lamp after supper. Naturally he appears more “slow”, because he has already been deprived of the right not to be deprived.\n\nThe whole secret of old education lies here: it measures people who start from different points with the same ruler, then declares that those who began behind simply “did not work hard enough”.\n\nThis seems like natural selection and the survival of the fittest, but behind it hides the violence called social Darwinism: the differences within human society are equated with the law of the jungle, and class division is dressed in the cloak of “science”.\n\nBut socialist education rejects this logic. We do not accept that anyone is “born” to fail.\n\nSocialist education does not ask “where did you come from”; it asks “where do you want to go”. It does not measure every child with the same ruler, because it knows that every child stands at a different starting line, and the educator's duty is to prevent the slower runner from being tripped by the rules themselves, not to use the rules to prove that he deserved to fall behind.\n\nTo wash away the remnants of the old age and end the reproduction of class, socialist education must declare war on injustice.\n\nThis means that school must not only teach children to read, but also ensure that every child has light to read by after class; school must not only pass down knowledge, but also cultivate the ability to understand the world, not passively accepting that “the world is like this”, but daring to ask “why is the world like this, and how can we make it better”; school must no longer select those “worthy of education”, but bring education to every door, depriving no one of the right to grow because of birth, poverty or the occupation of one's parents.\n\nThe end point of old education is to create differences and sanctify them as the result of “fair competition”. The starting point of new education is to recognise those differences, then fill them in little by little.\n\nThis will not be easy. It needs schools, teachers and textbooks; it also needs lamp oil, full meals in the canteen and stoves in winter classrooms. It is far more expensive and difficult than old education.\n\nBut only in this way can education cease to be a refuge of privilege and truly become a ladder to the future for every child, whether born in a Moscow apartment or a mud house in Zarechye.\n\nOld education selects. New education lifts."
  rus_stalin_education_events.2.a: "“This is the whole faith of socialist education.”"
  rus_stalin_education_events.3.t: "Vasily Ivanovich's Chalk"
  rus_stalin_education_events.3.desc: "Saratov Governorate, Beryozovka Village\n\nVasily Ivanovich was the only person in the village who could be called “educated”. He had worked for three years as a typesetter in a city print shop. He could read, count and write a hand that was not beautiful but could be understood. When the county chief said a school should be built in the village, the secretary thought of him first.\n\nThe villagers built the schoolhouse themselves: no bricks, so they used timber. The beams came from every household, and the roof boards were taken by village elder Shakharov from his own house. A little over a month later, a wooden room that could seat thirty children stood beside the old oak at the village entrance.\n\nOn the first day of school, nineteen children came, ranging in age from seven to thirteen.\n\nVasily had few teaching materials. He took out an old book he had kept from the print shop and copied the letters from its first page onto the blackboard, which was really just a planed plank painted black.\n\nThe oldest boy was called Misha. He was thirteen and still could not write his own name. Vasily handed him the chalk. “Here. Stretch out your hand.”\n\nMisha held the chalk as though holding a knife. Vasily took his hand and, stroke by stroke, wrote “Misha” on the board.\n\n“That is your name.”\n\nMisha stared at the crooked letters for a long time.\n\nA few days later, Vasily noticed that Misha came especially early. When he entered the classroom, he saw Misha crouching on the ground, repeatedly scratching something into the dirt with a burned twig. Coming closer, he saw it was “Misha”. The strokes were wrong, but it could be recognised."
  rus_stalin_education_events.3.desc_2: "Vasily said nothing. He simply took a stub of chalk from his pocket and placed it on the windowsill beside Misha. Misha looked up at him, but Vasily said nothing and turned away to prepare the day's lesson.\n\nWhen school ended that day, Misha had something extra in his satchel: not a book, but a small slate that Vasily had asked someone from the city to bring. It was black, no bigger than a palm. The satchel was light, but Misha carried it in his arms all the way home.\n\nWhen winter came, the stove in the classroom burned hot. Beside it, Vasily read the newspaper to the pupils. When he reached the words “compulsory education”, he stopped and explained them. The children nodded without quite understanding. Only Misha sat in the front row with wide eyes, as if seriously thinking about something.\n\nAfter school, Misha practised scratching letters in the dirt every day. By spring"
  rus_stalin_education_events.3.a: "his name was neater than that of another child Vasily had taught."
  rus_stalin_education_events.4.t: "Decree on Building Higher Education"
  rus_stalin_education_events.4.desc: "Article I: Tasks of Higher Education\nTo meet the urgent need of socialist construction for specialist technical personnel, the government has decided to expand and build a number of higher educational institutions in the country's major cities. Their training goals shall be engineers, agronomists, doctors, teachers and all kinds of technical specialists, who must master modern scientific knowledge and remain loyal to the socialist cause.\n\nArticle II: Plan for Building Higher Education\nWithin three years of this decree's promulgation, the government shall build or expand no fewer than fifteen institutions of higher education in Moscow and other cities. Each institution shall establish at least three fields of study directly related to national economic construction, including but not limited to mechanical engineering, electrical engineering, chemical engineering, agronomy, medicine, pedagogy and social sciences.\n\nArticle III: Principles of Admission\nAll citizens who have reached the age of seventeen and completed secondary education or its equivalent may register for entrance examinations to higher educational institutions, regardless of class origin. Admissions shall adhere to the principle of combining merit-based selection with class background: where examination results are equal, priority shall be given to candidates from worker, peasant and labouring intellectual families.\n\nArticle IV: Worker-Peasant Preparatory Courses\nTo ensure that the children of workers and peasants can enter higher education, every institution of higher education shall establish worker-peasant preparatory courses lasting one to two years. The curriculum shall include remedial instruction in basic theory and political education. Those who pass the final assessment may enter the corresponding programme directly without taking the unified entrance examination."
  rus_stalin_education_events.4.desc_2: "Article V: Combining Teaching with Scientific Research\nHigher educational institutions shall carry out the principle of combining teaching with scientific research. Each faculty shall establish research groups or laboratories and organise teachers and senior students to take part in research on practical problems in industrial and agricultural production. Research results shall be used first to solve concrete technical problems in the national economy.\n\nArticle VI: Material Support and Funding\nFunds for the construction of higher education shall be allocated centrally by the state treasury and listed as key items in the national annual budget. Local people's committees shall provide construction land and building material quotas for higher education institutions in their jurisdictions. During construction, local governments shall assist in solving food, lodging and living support for construction workers.\n\nArticle VII: Building the Teaching Staff\nThe government shall strengthen the teaching corps of higher education through several methods: sending outstanding graduates abroad for study, inviting progressive foreign scholars to teach, and selecting existing technical specialists for further training. Salaries and research funds for higher education teachers shall be guaranteed by the state according to unified standards.\n\nArticle VIII: Authority of Interpretation and Revision\nThe authority to interpret and revise this decree belongs to the All-Russian Central Department of Education."
  rus_stalin_education_events.4.a: "This decree shall take effect upon publication."
  rus_stalin_education_events.5.t: "The First Lamp of the Evening School"
  rus_stalin_education_events.5.desc: "Tula Governorate, Serpukhov Machine Factory\n\nWhen the workers' evening school opened, seventeen people came. All of them had come straight after the late shift, still wearing work clothes stained with oil. The classroom was an unused warehouse in the factory. The director had rows of benches moved in and hung a blackboard at the front.\n\nThe lecturer had been sent from the city. He was a young man with round spectacles and a quiet voice. In the first lesson he spoke about the basic principles of mechanics and drew several diagrams. An old fitter sat in the front row, frowning the entire time.\n\nAfter class, the old fitter walked to the blackboard. “That drawing is wrong.”\n\nThe young man froze. “What is wrong with it?”\n\nThe old fitter picked up the chalk and changed the transmission structure in the drawing. “In actual assembly, this gear turns the other way. It looks right on paper, but once you install it, it will not move.”\n\nThe young man looked at it and adjusted his glasses. “I will check the textbook...”\n\n“No need,” said the old fitter. “You only have to come to the workshop and look once. The thing itself is there. It does not lie.”\n\nFor the second lesson, the young man brought a real transmission model, exactly like the one in the factory workshop. He placed it on the desk and let the workers take turns demonstrating it. When it was the old fitter's turn, he took the model apart and put it back together in less than two minutes.\n\nThe young man was silent for a moment. “You should teach.”\n\nThat evening's class lasted nearly three hours, because the old fitter pulled from his pocket a yellowed notebook: his own atlas of machine-tool faults, with no words, only hand-drawn diagrams. Pointing to one page, he asked, “How does the textbook describe this fault?”"
  rus_stalin_education_events.5.desc_2: "The young man leaned in, looked at it and admitted that he had never seen such a case.\n\nAfter that, the evening school's lessons always included real objects. Sometimes it was a broken shaft; sometimes a worn bearing. Workers gathered around them to discuss, dismantle and argue, while the young man stood aside taking notes, occasionally adding a theoretical explanation. Later, the old fitter became a “part-time instructor”. The authorities gave him an extra allowance. It was not much, but he did not refuse.\n\nSomeone asked him what he wanted from it. He replied gruffly, “When I was an apprentice, nobody taught me anything. I had to steal knowledge for myself. Now that someone is willing to teach, someone ought to be willing to learn.” He paused. “Besides, the formulas that young fellow teaches really do work. I have repaired machines for thirty years, and only now do I know that the old methods I used actually had a reason behind them.”"
  rus_stalin_education_events.5.a: "Scientific theory must be combined with practice."
  rus_stalin_education_events.6.t: "Ignatyev's Notebook"
  rus_stalin_education_events.6.desc: "Voronezh Governorate, County Training Course\n\nWhen Ignatyev reported for duty, he was the oldest trainee in the class. Everyone else was in their early twenties. He was already thirty-five.\n\nThe course lasted two months, and the schedule was full: policies and regulations, land distribution rules, collective farm statutes, methods of mediating disputes, and even a class in public speaking, meant to teach them how to explain things clearly at village meetings.\n\nEvery night Ignatyev copied out the day's notes again because his handwriting was too messy.\n\nAt the final examination, the examiner asked everyone the same question: “If you return to your village and a villager points at you and asks, ‘What gives you the right to manage us?’, how will you answer?”\n\nSome answered, “Because I was sent by the authorities.” Others answered, “Because I came to help you.” The examiner was satisfied with none of them.\n\nWhen it was Ignatyev's turn, he was silent for a moment. “I would tell him everything I know: why there must be poor peasant committees, how the collective farm distributes grain, whose plot can remain where. If I cannot answer, I will say, ‘I will find out and tell you’, and then I will keep my word.”\n\nThe examiner looked at him. “Do you know what it means to keep your word?”\n\n“I do,” Ignatyev said. “I farm the land. Peasants do not believe empty words. They believe next year's harvest.”\n\nAfter graduation, Ignatyev was assigned back to Zarechye Village. On his first day home, villagers surrounded him and asked what he had learned. He gave no long speech. He simply took a brand-new notebook from his bag. On the cover was written Records of Work in Zarechye Village."
  rus_stalin_education_events.6.desc_2: "“The most important thing I learned,” Ignatyev said, “is to write down every word you say, then handle the matters one by one. What cannot be done, I will also write down, and later see whether it can be done.”\n\nThat evening, the villagers saw the first page opened before them. On it were several neat lines that he had copied:"
  rus_stalin_education_events.6.a: "“Keep accounts when doing work, and keep one's word when speaking.”"
  rus_stalin_education_events.7.t: "A Letter in Reply"
  rus_stalin_education_events.7.desc: "Voronezh Governorate, Zarechye Village\n\nIgnatyev had gone for another round of training. Last time it lasted two months; this time only one, but the courses were harder. One class was devoted entirely to “analysing differences in peasant demands between regions”. After evening study, the comrades in the dormitory argued endlessly.\n\nOn the afternoon he returned, he passed Sergei's house. Sergei was repairing the fence in the yard. Ignatyev stood by the roadside and looked for a moment without speaking.\n\n“What are you staring at?” Sergei put down his hammer. “What, you went to the provincial capital to study and now you do not know village people?”\n\nIgnatyev smiled and took a letter from his bag. “No. It is a document from the provincial committee, a supplementary explanation about land distribution disputes. One page may be useful to you.”\n\nSergei took the letter, turned it over, said nothing and handed it back.\n\nIgnatyev did not hurry away. He sat down on a stump nearby. “Sergei, I learned quite a few things. There was one saying: ‘A good policy explained badly is the same as no policy at all.’”\n\n“That means my job is to translate the provincial papers into plain village speech that our people can understand.”"
  rus_stalin_education_events.7.desc_2: "He paused. “Take your case, for example. Your father used to be steward for the Kuznetsov family. That was the old society's fault, not something you chose as a child. But how would the village know that? The method I learned in training is this: have you take charge of order at the literacy class. Walk around the classroom every evening. When everyone sees you carrying water for old women and fixing the school's windows, you will not need to explain. They will count you as one of their own.”\n\nSergei cursed. “You really know how to calculate people.”\n\n“It is not calculation.” Ignatyev stood up and patted the dust from his trousers. “It is what the teachers in the provincial capital taught: ‘A grassroots cadre must learn to let reason take root in the soil.’”\n\nSergei cursed no more, but the next day he really did go to the door of the literacy class. He stood there for a while. An old woman recognised him and called, “Help me lift this”, and somehow he helped. After that he did so every day. At some point, without anyone quite noticing when, the children in the literacy class began calling him Uncle Sergei.\n\nAfter that round of training, Ignatyev added one line to his notebook:"
  rus_stalin_education_events.7.a: "“Experience at the grassroots is more useful than any document.”"
  rus_stalin_education_events.8.t: "The Screen"
  rus_stalin_education_events.8.desc: "Tambov Governorate, Gremyachye Village\n\nIt was nearly dark when the projection team arrived. A cart carried a film projector, a white screen and a generator, followed by two young people.\n\nThe villagers gathered around. They had never seen such things. Someone asked what it was for. The projectionist said, “To show films.” So the whole village came.\n\nThe screen was hung on the outer wall of the school, and the generator rumbled in the distance. The first reel showed the harvest of a collective farm: tractors moving across wheat fields, grain pouring into granaries like water. The image flickered, and the tractor on the screen moved forward. The old peasants watched intently. No one spoke.\n\nThen came a newsreel on industrial construction: blast furnaces tapping iron, sparks flying, workers operating machine tools in workshops. A young worker stood in the back row and unconsciously touched the calluses on his hands. The hands on the screen were exactly like his, only they were somewhere else, in a city.\n\nLater, the projectionist showed a medical film on preventing typhus. Halfway through, an old woman suddenly stood up and pointed at the screen. “Those symptoms the doctor is talking about. The child next door died of that last winter.”\n\nNo one answered her. On the screen, the doctor was demonstrating how to disinfect with limewater.\n\nWhen the showing ended, young people surrounded the projectionist with questions: “Where did the machine come from?” “When will you come again?” Children walked around the projector again and again."
  rus_stalin_education_events.8.desc_2: "As the projectionist packed up the equipment, he answered patiently. Someone asked, “Are the places in the film real? Are there really granaries that big?” The projectionist patted the machine. “Absolutely real. If you cultivate your land well and deliver the grain, in a few years your granaries can be that large too.” Someone in the crowd laughed, a little foolishly, but sincerely.\n\nThe screen was taken down and folded back into its box. The generator gradually fell silent, but the village lights stayed on later than usual. Many households were talking about what they had just seen: the tractors, the steel, and those distant places they had never known..."
  rus_stalin_education_events.8.a: "...and that beautiful future."
  rus_stalin_education_events.9.t: "Lines Growing from the Ruins"
  rus_stalin_education_events.9.desc: "Constructivism was born amid the ruins after the October Revolution.\n\nAfter 1917, the old world had been smashed to pieces. Portraits of the tsar were torn from the walls, noble estates went up in flames, and church bells fell silent. But artists soon realised that smashing the old things was only the first step. The question was: what should the new world look like?\n\nA group of young artists began to think about this question. They refused to paint portraits of nobles, rejected religious subjects, and rejected everything that existed “only to be admired”. They declared that art should not hang on walls to be gazed at, but should enter life and become life itself. Thus was born constructivism in the service of the people.\n\nThe constructivists believed that artists should not be called “artists” but “engineers”. They worshipped not inspiration, but structure: the steel trusses of factories, the suspension cables of bridges, the drive shafts of machines. In their eyes, the most beautiful object was not a flower or an elegant nude, but a tractor, a water tower or a precisely drawn blueprint. Beauty, to them, was something that could be measured."
  rus_stalin_education_events.9.desc_2: "Their representative figure Tatlin designed the Monument to the Third International in 1920: an inclined spiral of steel, more than twice as tall as the Eiffel Tower, with three glass rooms suspended inside it for legislation, administration and propaganda, each rotating at a different speed. The tower was never built, but its plans were themselves a manifesto. It belonged to no classical style, had no distinction between “front” and “back”, and was itself a dynamic, upward force, forever turning and forever growing.\n\nAnother representative figure, Rodchenko, wrote in 1921: “We declare that art is dead. Its corpse is rotting in museums. The art of the future will be industrial, constructive and in the service of the people.”\n\nThese words caused an uproar at the time. Traditional artists accused the constructivists of “destroying beauty”, while the public wondered what those slanting lines and pure geometric forms were supposed to mean. But the constructivists did not care about these disputes. They had already turned to new work: designing factory noticeboards, workers' uniforms, collective farm posters and even tableware for public canteens. Anything that could change the visual environment of daily life could become “art”.\n\nThey believed that the new society needed a new visual language. The decorative style of the tsarist age was full of affectation and hollow luxury, while constructivism replaced curves with straight lines and ornate carving with concise, powerful geometric forms. This was not for the sake of being “pretty”, but to make everyone who saw it feel a new force: a force belonging to machines, to the collective and to the future.\n\nAs Russian society undergoes immense transformation, constructivism has once again been affirmed and revived. These great constructivists are looking again at the familiar world through proletarian eyes: turning factory chimneys into vertical lines, field paths into horizontal lines and the smiling faces of the people into bright circles. Then they place these lines and shapes together to form a new picture that no one has ever seen, yet everyone finds profoundly familiar."
  rus_stalin_education_events.9.a: "We shall draw the first blueprint of the new world."
  rus_stalin_education_events.10.t: "A Dawn of “Construction”"
  rus_stalin_education_events.10.desc: "Moscow, First State Printing House\n\nThe wall had originally been grey-white, like every other grey-white wall in the city. Then a group of young people arrived with brushes, paint and a sheet of paper covered in geometric lines.\n\n“This is not a painting,” said the young man leading them. He wore a work jacket stained with paint, and his hair was a mess. “This is structure. It is an extension of the production line. It is another face of the printing press.”\n\nThey were constructivists. Before they came, the walls of this printing house had held portraits and religious paintings from the tsarist age. After they had been torn down last autumn, the wall had remained empty. Workers were used to passing by the empty wall and had never thought of adding anything to it.\n\nBut the constructivists had.\n\nThey spread their plans across the long tables of the canteen and, with compass and ruler, drew rays, rings and tilted blocks of colour. Some workers came close to look. They did not understand and were embarrassed to ask. An old typesetter pointed at the tilted red triangle on the drawing. “What is this?”\n\n“Revolution.”\n\n“Which revolution? February or October?”\n\n“Every one,” the young man said. “Every upward thrust.”\n\nA week later, the mural was complete. It was a vast geometric composition: a red wedge thrusting from the lower left to the upper right, cutting open the grey background, while blocks of gold and black shattered, revolved and reassembled around it. At the top was a line of text, drawn with ruler-straight edges: “Our eyes no longer look backward.”"
  rus_stalin_education_events.10.desc_2: "Workers stood before the wall with their meal tins for a long time. No one said it was “beautiful”, and no one said they “did not understand”. A stoker put down his tin, walked up to the wall and traced the edge of the red wedge with his finger.\n\n“That colour,” he said, “is like the fire in the furnace.”\n\nThe young man responsible for the mural stood behind the crowd, and finally released the breath he had been holding. He watched those rough fingers pass over the wall, not daring to touch it yet unwilling to leave, as if what he had painted was not merely colour, but something fragile.\n\nThe next day, several more lines of text appeared on the factory wall. This time they had been written by the workers themselves. The writing was crooked, but beneath it they had drawn a little red triangle, as though afraid others might not notice it."
  rus_stalin_education_events.10.a: "“The fire in the furnace is red, and so are our hearts.”"
  rus_stalin_education_events.11.t: "The Wager"
  rus_stalin_education_events.11.desc: "Izhevsk Machine Factory, Final Assembly Workshop\n\nAfter receiving the instruction to “improve production technology”, Andrei Petrovich called the factory's technical backbone together for three days of meetings. The conclusion was that the final assembly workshop had to undergo a full transformation of its production line. But the budget was limited, and stopping production for reconstruction meant losing at least half a month's output.\n\n“It does not have to be a full transformation,” said Mikhail, the old fitter, offering a different view. “First fix the bottleneck stations and leave the rest alone. Change one, look at the result, then change the next if it works. That way the entire line does not have to stop at once.”\n\nAndrei looked at Mikhail. “If we do it step by step, each change requires a stoppage. Added together, the downtime may be longer.”\n\n“But each time only one station stops. The rest can keep working,” Mikhail insisted. “With your plan, once the whole line stops, seven hundred people sit idle. Even one day is seven hundred people without work for a day.”\n\nThe two could not agree. Finally the director decided: they would make a wager. Andrei would first rebuild one station according to his plan, and Mikhail would watch from the side. If efficiency did not clearly improve within one month after the modification, they would do as Mikhail said.\n\nThe modification lasted five days. The conveyor belt at that station was redesigned, and the order of the parts racks was adjusted. On the first day after work resumed, the workers at the station were clumsy at first, but by afternoon they were getting faster. On the second day, the pile of semi-finished parts at the station had shrunk by half. On the third day, workers from the neighbouring station came over and asked, “What did you change?”\n\nMikhail stood beside them and watched for a week without saying a word."
  rus_stalin_education_events.11.desc_2: "On the eighth day, he walked into Andrei's office and put a pack of cigarettes on the desk. “You won.”\n\nAndrei did not take the cigarettes. “Your plan is right too. Step-by-step modification is indeed more stable. Next time we rebuild another station, we will use your method.”\n\nMikhail was stunned. “You won, and you still want to do it my way?”\n\n“This is not a question of winning or losing,” Andrei said. “It is a question of which method is more suitable. Your method suits this old factory. Mine suits a new one.”\n\nMikhail took the cigarettes back and muttered, “Next time just tell me in advance. Do not make a wager with me.”\n\n“Next time I will invite you directly as an adviser,” Andrei laughed.\n\nIn the monthly report, the director wrote: “Workers do not oppose change. They only hope the process of change will not interfere with their work. After the modification, output per worker at the new station increased and workers' confidence also rose. The next step will be to continue rebuilding other stations according to Mikhail's step-by-step plan.”"
  rus_stalin_education_events.11.a: "Technical improvement is also a process of unity."
  rus_stalin_education_events.12.t: "The Director's Three Inspections"
  rus_stalin_education_events.12.desc: "On the Don, State Farm Mechanical Repair Workshop\n\nAfter Kuznetsov was transferred in as farm director, the first thing he did was not hold a meeting, but move everything in the repair workshop. He spent three days arranging tools by size, shelving spare parts by model, and moving the workbench from the corner to the window.\n\nThe workers watched him busy himself. Someone muttered, “A new director comes in, and he starts messing with useless things.”\n\nKuznetsov heard it and ignored him.\n\nOn the fourth day, a tractor broke down. In the past, workers searching for the right wrench had to rummage through shelves piled with clutter. This time Kuznetsov found the proper wrench in five minutes, opened the casing in fifteen, and replaced the part in twenty. The whole job took less than an hour.\n\nHe threw the old part into the scrap bin, clapped the oil from his hands and asked, “How long did repairing one take before?”\n\n“Half a day.”\n\nKuznetsov said nothing more. He simply tapped with the toe of his boot a newly painted yellow line on the floor, dividing the work area into “awaiting repair” and “repaired”. From then on, no one again piled repaired machine parts beside broken ones.\n\nAt the next morning's meeting, his only instruction was: “Today, sort that pile of loose new bearings in the warehouse by specification and number them. I want to see the ledger before the end of the shift.” Then he left.\n\nA month later, several charts appeared on the workshop wall, marking changes in the inventory of spare parts. Someone asked Kuznetsov what they were. He gave only one answer:"
  rus_stalin_education_events.12.a: "“The time you used to waste is written on this chart. Read it yourselves.”"
  rus_stalin_education_events.13.t: "One Key Opens Ten Thousand Locks"
  rus_stalin_education_events.13.desc: "Izhevsk Machine Factory, Chief Engineer's Office\n\nWhen the notice on standardising production lines arrived at Izhevsk, chief engineer Andrei Petrovich was worrying over tolerances in a batch of new rifle parts. Different workshops used different moulds, and when parts from the same batch reached the final assembly line, a third of them often would not fit.\n\nStandardisation meant drafting unified technical standards all over again. It meant the factory would have to halt production for several days to adjust jigs and fixtures.\n\nAt the office meeting, the director asked, “How much do we lose by stopping production for one day?”\n\nAndrei answered, “Five days' output.”\n\n“And after the changes, how much do we save?”\n\nAndrei looked through the budget and chose his words carefully. “In the future, guns will not have to be sent back to our factory for replacement parts. Any mechanical station at the front can replace them. That benefit cannot be calculated.”\n\nThe director was silent for a moment. “Do it.”\n\nThe modification lasted a week. After the assembly line was recalibrated, workers discovered that parts which had once required repeated filing could now fit smoothly into place. The old fitter in charge of adjustment said, “In twenty years, this is the first time I have felt that parts from another factory can be used too.”\n\nThe remark later reached an agricultural machinery station in Tambov, where a mechanic used standard Izhevsk parts for the first time to repair a truck from the Lenin Automobile Plant. After tightening the last screw, he opened the hood and examined it for a moment. “Before, we had to write to the factory and wait for parts. Sometimes we waited for months. Now we just open the warehouse and take one.” He picked up his wrench. “This thing is sturdy and standard. No need to look at the brand, only the number. One key opens ten thousand locks. That is good work.”"
  rus_stalin_education_events.13.desc_2: "The first results of production-line standardisation appeared several months later: the interchangeability of parts between factories rose sharply, repair times were shortened by an average of two-thirds, and downtime from workshop faults also decreased markedly. In his report to the centre, Andrei wrote: “We have not only saved time, but also saved trust. Now the workers feel that every factory in the country belongs to one family.”"
  rus_stalin_education_events.13.a: "“Parts can go anywhere, and so can people.”"
