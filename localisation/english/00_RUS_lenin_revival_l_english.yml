l_english:
 RUS_lenin_revival_focus:0 "The Lenin Revival"
 RUS_lenin_revival_category:0 "The Lenin Revival"
 RUS_lenin_revival_category_desc:0 "About the man who should have died, yet appeared again at the station."
 RUS_LR_enable_easter_egg:0 "Enable the Easter Egg Event Line"
 RUS_LR_enable_easter_egg_desc:0 "In the cracks of history, some stories that should have ended continue. Enabling this will trigger an easter egg event line about a returning exile."
 RUS_LR_return_to_the_urals:0 "Long-Held Ambition: Back to the Urals"
 RUS_LR_return_to_the_urals_desc:0 "After years of exile, the Bolshevik banner rises over the Urals once more. Lenin's return is no accident, but a debt history owes."
 RUS_LR_proclaim_the_return:0 "Proclaim the Bolshevik Return!"
 RUS_LR_proclaim_the_return_desc:0 "From factories, stations and soviet platforms, the Bolsheviks declare openly: the Russian Revolution is not over."
 RUS_LR_rally_old_bolsheviks:0 "Rally the Old Bolsheviks"
 RUS_LR_rally_old_bolsheviks_desc:0 "From Siberian exile to Parisian attics, letters reconnect the scattered old comrades."
 RUS_LR_russias_present_and_future:0 "Russia's Present and Future"
 RUS_LR_russias_present_and_future_desc:0 "The republic lies in ruins: war, famine and factional strife. Revolutionaries must first see the land beneath their feet."
 RUS_LR_socialism_in_russia:0 "Socialism in Russia"
 RUS_LR_socialism_in_russia_desc:0 "Socialism is no import. It must grow out of Russia's workers, peasants and soldiers."
 RUS_LR_revolutionary_orthodoxy:0 "Revolutionary Orthodoxy"
 RUS_LR_revolutionary_orthodoxy_desc:0 "Who inherited October, and who betrayed it? In this quarrel, orthodoxy itself is a weapon."
 RUS_LR_bolsheviks_enter_parliament:0 "The Bolsheviks Enter Parliament"
 RUS_LR_bolsheviks_enter_parliament_desc:0 "Bolshevik deputies enter the chamber not to compromise, but to dismantle the old state from within."
 RUS_LR_unshakable_dictatorship:0 "The Dictatorship of the Proletariat Stands Firm"
 RUS_LR_unshakable_dictatorship_desc:0 "No dictatorship, no revolution; no revolution, no tomorrow for Russia."
 RUS_LR_critique_revisionism:0 "Critique Revisionist Thought"
 RUS_LR_critique_revisionism_desc:0 "The sweet talk of the reformists is another way to bury the revolution."
 RUS_LR_reconcile_zinoviev_kamenev:0 "Reconcile Zinoviev and Kamenev"
 RUS_LR_reconcile_zinoviev_kamenev_desc:0 "The two old comrades still hesitate. Revolution cannot wait for the hesitant, yet should not cast them aside lightly."
 RUS_LR_bolsheviks_and_sr:0 "Bolsheviks and Socialist Revolutionaries"
 RUS_LR_bolsheviks_and_sr_desc:0 "The SRs speak of land and liberty, yet fear the workers' power. Cooperation and rupture are separated by paper."
 RUS_LR_lessons_of_october:0 "Learn the Lessons of October"
 RUS_LR_lessons_of_october_desc:0 "October was not a riot, but an art that must be studied again and again."
 RUS_LR_peasants_and_workers:0 "Peasants and Workers"
 RUS_LR_peasants_and_workers_desc:0 "Russia is mostly peasant. Without peasant support, the workers' state is an island."
 RUS_LR_criticize_trotsky:0 "Criticize Trotsky"
 RUS_LR_criticize_trotsky_desc:0 "The permanent revolutionaries push the party toward adventure. Revolution needs ardour, and discipline."
 RUS_LR_bukharins_return:0 "Comrade Bukharin Returns"
 RUS_LR_bukharins_return_desc:0 "Bukharin returns with his theories. Debate may continue, but the party must remain united."
 RUS_LR_unreasonable_sr:0 "The Unreasonable Socialist Revolutionaries"
 RUS_LR_unreasonable_sr_desc:0 "The SRs refuse to surrender the land committees, and refuse to recognize Soviet authority."
 RUS_LR_break_with_revisionism:0 "Break with Revisionism"
 RUS_LR_break_with_revisionism_desc:0 "The party must clear out those who treat revolution as a parliamentary game."
 RUS_LR_revolution_returns:0 "The Revolution Returns from Hell"
 RUS_LR_revolution_returns_desc:0 "Revolutionaries return from exile, prison and the underground. The old state will be shattered in civil war."
 RUS_LR_rethink_peasant_policy:0 "Rethink the Peasant Policy"
 RUS_LR_rethink_peasant_policy_desc:0 "Grain requisitioning drove the peasants to the enemy. The revolution must learn to live with the land."
 RUS_LR_mechanized_red_army:0 "Mechanized Red Army"
 RUS_LR_mechanized_red_army_desc:0 "Tractors and tanks join the Red Army; the shape of war is changing."
 RUS_LR_peoples_army:0 "The People's Army Has Come!"
 RUS_LR_peoples_army_desc:0 "Workers, peasants and soldiers merge into a torrent. The revolutionary army draws its strength from the people."
 RUS_LR_win_peasant_support:0 "Win Peasant Support"
 RUS_LR_win_peasant_support_desc:0 "Land, peace and bread: the promises made to the peasants must be kept."
 RUS_LR_secure_logistics:0 "Secure the Logistics"
 RUS_LR_secure_logistics_desc:0 "Without railways, grain and ammunition, even the bravest army collapses."
 RUS_LR_strengthen_arts:0 "Strengthen the Arts"
 RUS_LR_strengthen_arts_desc:0 "Art is no ornament. Every song and every poster is a weapon of the revolution."
 RUS_LR_soldiers_and_civilians:0 "Soldiers and Civilians as One Family"
 RUS_LR_soldiers_and_civilians_desc:0 "Red soldiers come from the people, and must return to the people."
 RUS_LR_sing_and_march:0 "Sing and March On"
 RUS_LR_sing_and_march_desc:0 "In song, the weary columns find their direction again."
 RUS_LR_declare_sr_defeat:0 "Declare the Defeat of the Socialist Revolutionaries!"
 RUS_LR_declare_sr_defeat_desc:0 "The last SR stronghold falls. Russia has only one revolutionary government."
 RUS_LR_true_socialist_russia:0 "A Truly Socialist Russia"
 RUS_LR_true_socialist_russia_desc:0 "The civil war is over. On the ruins, a Russia ruled by soviets has finally appeared."
 RUS_LR_restore_party_congress:0 "Restore the Party Congress"
 RUS_LR_restore_party_congress_desc:0 "A party cannot run on orders alone. The congress must again become the place of debate and decision."
 RUS_LR_end_organizational_chaos:0 "End the Wartime Organizational Chaos"
 RUS_LR_end_organizational_chaos_desc:0 "War disrupted the party's organization. Order must now run from the center down to every cell."
 RUS_LR_after_victory:0 "After the Victory"
 RUS_LR_after_victory_desc:0 "Victory is not the end. A broken country waits to be reorganized."
 RUS_LR_restore_council_of_peoples_commissars:0 "Restore the Council of People's Commissars"
 RUS_LR_restore_council_of_peoples_commissars_desc:0 "The Council of People's Commissars must function again as the nerve center of government."
 RUS_LR_bring_debate_back:0 "Bring Debate Back into the Party"
 RUS_LR_bring_debate_back_desc:0 "Dissent is not the enemy. Driving debate underground is what creates real enemies."
 RUS_LR_unify_party_discipline:0 "Unify Party Discipline"
 RUS_LR_unify_party_discipline_desc:0 "Debate must be followed by united action. Discipline is the lifeline of a revolutionary party."
 RUS_LR_restart_railways:0 "Get the Railways Moving Again"
 RUS_LR_restart_railways_desc:0 "Railways are the nation's veins. Without them, grain, coal and armies cannot move."
 RUS_LR_rebuild_local_soviets:0 "Rebuild the Local Soviets"
 RUS_LR_rebuild_local_soviets_desc:0 "Central orders need local soviets to execute them, and to watch over them."
 RUS_LR_against_personality_cult:0 "Against the Personality Cult and Blind Obedience"
 RUS_LR_against_personality_cult_desc:0 "The revolution needs no new tsar. A leader guides, but does not think in place of the party."
 RUS_LR_rectify_local_party:0 "Rectify the Local Party Organizations"
 RUS_LR_rectify_local_party_desc:0 "Loose local party organizations turn every central resolution into waste paper."
 RUS_LR_end_wartime_measures:0 "End the Wartime Emergency Measures"
 RUS_LR_end_wartime_measures_desc:0 "Wartime decrees, requisitions and special tribunals must gradually leave the stage."
 RUS_LR_unify_republic_laws:0 "Unify the Laws of the Republic"
 RUS_LR_unify_republic_laws_desc:0 "A country of differing local laws cannot be governed. A unified legal order must be built."
 RUS_LR_collective_leadership:0 "Collective Leadership"
 RUS_LR_collective_leadership_desc:0 "No one thinks for the party. Great decisions are made and owned collectively."
 RUS_LR_carry_out_central_decisions:0 "Central Decisions Must Be Carried Out"
 RUS_LR_carry_out_central_decisions_desc:0 "After democratic debate, the central decision is the decision of the whole party."
 RUS_LR_restore_agriculture:0 "Restore Agricultural Production"
 RUS_LR_restore_agriculture_desc:0 "The land needs seed, tools and calm. Agricultural recovery is the precondition of national survival."
 RUS_LR_unify_state_finance:0 "Unify State Finance"
 RUS_LR_unify_state_finance_desc:0 "Without unified finance there is no unified state."
 RUS_LR_party_responsibility:0 "The Party's Responsibility for Socialist Construction"
 RUS_LR_party_responsibility_desc:0 "The party must lead construction as it led revolution. This is the new historical task."
 RUS_LR_establish_gosplan:0 "Establish the State Planning Committee"
 RUS_LR_establish_gosplan_desc:0 "Planning is no bureaucratic form. It is the tool for concentrating scarce resources where they matter most."
 RUS_LR_unify_industrial_statistics:0 "Unify Industrial Statistics"
 RUS_LR_unify_industrial_statistics_desc:0 "Without accurate figures, planning is mere fantasy."
 RUS_LR_expand_farm_tool_production:0 "Expand Farm Tool Production"
 RUS_LR_expand_farm_tool_production_desc:0 "Farm tools are the first step of agricultural recovery."
 RUS_LR_survey_production_capacity:0 "Survey the Nation's Production Capacity"
 RUS_LR_survey_production_capacity_desc:0 "The state must know what it has before deciding what to build."
 RUS_LR_state_control_heavy_industry:0 "The State Takes Heavy Industry"
 RUS_LR_state_control_heavy_industry_desc:0 "Heavy industry is the material foundation of socialism."
 RUS_LR_unify_energy_and_mining:0 "Unify Energy and Mining Management"
 RUS_LR_unify_energy_and_mining_desc:0 "Coal, oil and electricity must obey a single national plan."
 RUS_LR_unified_material_distribution:0 "Build a Unified Material Distribution System"
 RUS_LR_unified_material_distribution_desc:0 "Goods must not rot in warehouses, nor fall into speculators' hands."
 RUS_LR_planning_on_real_numbers:0 "Base Planning on Real Numbers"
 RUS_LR_planning_on_real_numbers_desc:0 "Planning must start from statistics, not slogans."
 RUS_LR_unified_rail_dispatch:0 "Unified Railway Dispatch"
 RUS_LR_unified_rail_dispatch_desc:0 "One national timetable is worth a thousand administrative orders."
 RUS_LR_central_raw_material_allocation:0 "Central Allocation of Industrial Materials"
 RUS_LR_central_raw_material_allocation_desc:0 "Raw materials must flow to the factories that need them most."
 RUS_LR_foundation_of_planned_economy:0 "The Foundation of the Socialist Planned Economy"
 RUS_LR_foundation_of_planned_economy_desc:0 "Statistics, distribution and dispatch come together; only then does planned economy begin."
 RUS_LR_restore_machine_building:0 "Restore Machine Building"
 RUS_LR_restore_machine_building_desc:0 "Without machines there is no industrialization."
 RUS_LR_establish_agricultural_cooperatives:0 "Establish Agricultural Cooperatives"
 RUS_LR_establish_agricultural_cooperatives_desc:0 "Organizing the small peasants is the first step of socialist transformation."
 RUS_LR_unify_grain_procurement:0 "Unify Grain Procurement and Supply"
 RUS_LR_unify_grain_procurement_desc:0 "The state must control grain to feed its cities and armies."
 RUS_LR_begin_agricultural_mechanization:0 "The Beginnings of Agricultural Mechanization"
 RUS_LR_begin_agricultural_mechanization_desc:0 "Machine-tractor stations will become the new centers of the countryside."
 RUS_LR_adopt_collective_farms:0 "Adopt Collective Farms"
 RUS_LR_adopt_collective_farms_desc:0 "The collective farm is the root of socialism in the countryside."
 RUS_LR_economic_victory:0 "Economic Victory"
 RUS_LR_economic_victory_desc:0 "With planning, industry and agriculture running again, socialist Russia has finally found its footing."
 RUS_LR_lenin_returned:0 "Lenin Has Returned"
 RUS_LR_lenin_returned_desc:0 "Ilyich has returned to Russia. Exiles, workers and soldiers gather again under this banner."
 RUS_LR_old_bolsheviks:0 "Old Bolsheviks Return"
 RUS_LR_old_bolsheviks_desc:0 "Veterans of the exile return to the party's ranks, remembering what the revolution first was."
 RUS_LR_revolutionary_legacy:0 "Revolutionary Orthodoxy"
 RUS_LR_revolutionary_legacy_desc:0 "The party reclaims October: revolution is not parliamentary compromise, but class war."
 RUS_LR_party_democracy:0 "Intra-Party Democracy"
 RUS_LR_party_democracy_desc:0 "The congress meets again; debate returns, and decisions are made collectively."
 RUS_LR_democratic_centralism:0 "Democratic Centralism"
 RUS_LR_democratic_centralism_desc:0 "Free in discussion, united in action. The party is a disciplined machine again."
 RUS_LR_revolutionary_army:0 "Revolutionary Army"
 RUS_LR_revolutionary_army_desc:0 "The Red Army is the school of the revolution, and its bayonet."
 RUS_LR_wartime_economy:0 "Wartime Economy"
 RUS_LR_wartime_economy_desc:0 "Everything for the front. Factories, railways and grain are bent to the rhythm of war."
 RUS_LR_gosplan:0 "State Planning Committee"
 RUS_LR_gosplan_desc:0 "The Planning Committee gathers the nation's statistics, factories and railways into one table."
 RUS_LR_planned_economy:0 "Planned Economy"
 RUS_LR_planned_economy_desc:0 "The state controls heavy industry; materials and machines move by plan."
 RUS_LR_collectivization:0 "Agricultural Collectivization"
 RUS_LR_collectivization_desc:0 "Smallholding is giving way to cooperatives and collective farms; the countryside's pain is unavoidable."
 RUS_LR_railways:0 "Unified Railway Dispatch"
 RUS_LR_railways_desc:0 "The railways obey one timetable; grain, coal and armies move again."
 RUS_LR_soviet_legitimacy:0 "Soviet Legitimacy"
 RUS_LR_soviet_legitimacy_desc:0 "The soviet is no longer a temporary organ of revolution, but the formal form of state power."
 RUS_lenin_revival.1.t:0 "A Familiar Figure"
 RUS_lenin_revival.1.desc:0 "With the victory of the Russian socialist revolution, the Bolsheviks in exile begin to return home.\n\nThe station is crowded with people welcoming the returnees. Some raise red flags; others shout the names of old comrades. Those forced to leave after the revolution's defeat set foot on Russian soil once more.\n\nThen a young party member suddenly stops talking.\n\nAt the other end of the crowd, a man walks slowly forward. He wears a plain dark coat, his expression calm, as if indifferent to the glances around him.\n\nThe young member feels he has seen that face somewhere.\n\nNo. Impossible.\n\nHe must be mistaken.\n\nBut why does that man look so familiar?"
 RUS_lenin_revival.1.a:0 "It is Comrade Stalin. He has returned too. (No change)"
 RUS_lenin_revival.1.b:0 "That is—Vladimir Ilyich Ulyanov?! (Enter the Lenin Revival line)"
 RUS_lenin_revival.20.t:0 "Civil War Erupts"
 RUS_lenin_revival.20.desc:0 "The Socialist Revolutionaries refuse to recognize Soviet power, refuse to surrender the land committees, and refuse to lay down their arms.\n\nThey hold the granaries and rail junctions along the Volga, trying to drag Russia back to the old age of parliament and compromise.\n\nThe revolution has no way back. At Smolny, Lenin declares: the old state must be smashed."
 RUS_lenin_revival.20.a:0 "Let the bayonets decide."
 RUS_lenin_revival.21.t:0 "The Defeat of the Socialist Revolutionaries"
 RUS_lenin_revival.21.desc:0 "The last SR stronghold lowers its flag. The Volga granaries open to the cities again.\n\nRussia has only one revolutionary government. The question is no longer who wins, but how to build this country."
 RUS_lenin_revival.21.a:0 "The revolution has won."
 RUS_lenin_revival.22.t:0 "Economic Victory"
 RUS_lenin_revival.22.desc:0 "For the first time, the Planning Committee's tables show growth across the board. Factories reopen, railways run, collective farms send grain to the cities.\n\nSocialist Russia has finally found its footing—but everyone knows this is only the beginning."
 RUS_lenin_revival.22.a:0 "March on."

 RUS_LR_vladimir_lenin:0 "Vladimir Ilyich Lenin"
 RUS_LR_bolshevik_party:0 "RKP(b)"
 RUS_LR_bolshevik_party_long:0 "Russian Communist Party (Bolsheviks)"
 RUS_LR_sr_defeated_tt:0 "The Socialist-Revolutionary rebels have been defeated"
 RUS_LR_vozhd_of_proletariat:0 "Vozhd of the World Proletariat"
