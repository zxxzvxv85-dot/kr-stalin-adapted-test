l_english:
 RUS_ns_evaluate_VVFR: "Evaluate the VVFR"
 RUS_ns_evaluate_VVFR_desc: "The Voyenno-Vozdushny Flot Rossii (Military Air Fleet of Russia), an independent branch of the military since 1929, has evolved from a small bomber support group into a substantial force over the past few years. Nevertheless, many issues remain, including the replacement of obsolete or foreign aircraft and the reorganisation of air command."
 RUS_ns_inspect_VMFR: "Evaluate the VMFR"
 RUS_ns_inspect_VMFR_desc: "The Voyenno-Morskoy Flot Rossii (Military Maritime Fleet of Russia) was severely damaged during the Russian Civil War and the ensuing economic crisis. Despite recent efforts, the current Russian Navy is still a far cry even from the old Imperial fleet. However, the Maritime Ministry has long prepared ambitious reform plans that could turn around the Navy's fortunes."
