 RUS_europe_intervention_entry_tt:0 "Open the §YForeign Liaison and Intelligence Office of the European Revolutionary Committee§!, select a country, and execute its matching decisions directly."
 RUS_europe_intervention_dzerzhinsky_tt:0 "§YFelix Edmundovich Dzerzhinsky§!\n§YBorn:§! §LSeptember 11th, 1877; Vilna Governorate, Russian Poland§!\n§YBackground:§! §LA veteran Polish revolutionary and organiser of the All-Russian Extraordinary Commission, Dzerzhinsky vanished during the White victory and was presumed dead. Under the alias 'Petrel', he rebuilt an underground network from Warsaw that now reaches across Eastern Europe.§!\n\n§Y‘A Chekist must have a cool head, a warm heart, and clean hands.’§!\n\n§YClick the portrait to switch to Molotov: Civilian Aid§!"
 RUS_europe_intervention_molotov_tt:0 "§YVyacheslav Molotov§!\n§YBorn:§! §LMarch 9th, 1890; Kukarka, Vyatka Governorate, Russian Empire§!\n§YBackground:§! §LVyacheslav Mikhailovich Molotov, born Vyacheslav Mikhailovich Skryabin, came from the family of a village schoolteacher. His childhood was reasonably comfortable until his father's early death left the family in reduced circumstances. While studying at a secondary school in Kazan, he encountered the underground revolutionary press and was quickly drawn to Marxism. In 1906, at the age of sixteen, Molotov joined the Russian Social Democratic Labour Party and threw himself into underground work, organising student meetings, distributing leaflets, and maintaining contact with railway workers. Under constant police surveillance, he learned caution and silence.\n\nWhen the February Revolution broke out in 1917, Molotov was in Petrograd. He was among the first Bolshevik activists to reach the Tauride Palace and, over the following months, quickly became a central liaison. During the October uprising he coordinated communications between the Smolny Institute and the factories. Though he did not fight at the barricades, every order passed through his hands on its way to the front. His efficiency and organisational ability attracted Lenin's attention, who named him in an internal document as a 'young cadre worth cultivating'.\n\nAfter the Civil War began, Molotov was sent to the front to direct political mobilisation. He worked with Stalin at Tsaritsyn and coordinated supply lines alongside Voroshilov on the Southern Front. He was not renowned for military talent, but few could equal his ability to organise paperwork, draft orders, and systematise reports. The experience gave him an almost obsessive regard for 'order' and 'documents'; he came to believe that the revolution's endurance depended upon the reliability of its administrative chain.\n\nFollowing the collapse of the Red government, Molotov withdrew to Europe with the other exiles. In Paris, he gradually transformed from a party organiser into a participant in foreign affairs. He taught himself French, systematically studied the politics of the European states, and repeatedly made unofficial contact with the French workers' and peasants' communists and with syndicalist parties. Sverdlov once remarked that 'every one of his words has been calculated'.\n\nAs the reconstruction of socialist Russia began, the Bolshevik Party entrusted Molotov with increasingly important foreign contacts. He took part in trade negotiations with the Third International, ideological coordination meetings with the German socialists, and multilateral talks on an 'international mechanism for revolutionary coordination'. He is no gifted public speaker, but in closed negotiations displays rare patience and precision: he lets the other side reveal its whole hand, dismantles it point by point, and then assembles a revised proposal they can scarcely refuse.\n\nAt diplomatic functions Molotov invariably wears a dark suit and an immaculate tie. He keeps both hands flat upon the table as though always ready to sign a paper or strike out a line. To most comrades, every gesture suits the sobriquet 'the Hammer': never ostentatious, never deflected, and exact whenever it falls.§!\n\n§Y‘The old generation of Bolsheviks never yields to pressure. That will never change.’§!\n\n§YClick the portrait to switch to Dzerzhinsky: Military Aid§!"
