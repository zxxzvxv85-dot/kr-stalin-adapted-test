  RUS_pre_maximalist_land_reform: "“Successfully Completed” Land Reform"
  RUS_pre_maximalist_land_reform_desc: "Successive governments have claimed that Russia's land question has been properly settled and that order has returned to the countryside. Reality across the vast villages is much less comforting: old wounds of land distribution, rural poverty, administrative confusion and the remnants of anti-socialist forces still trouble the newborn socialist regime.\n\nBefore the Maximalists formally present their own programme, this question remains an old illness hidden beneath the polish of past governments."
  RUS_maximalist_land_reform: "Maximalist Land Reform"
  RUS_maximalist_land_reform_desc: "The Maximalists are putting their land reform programme into practice. As the reform deepens, disorder and resistance in the countryside may gradually give way to new forms of organisation."
  RUS_maximalist_land_reform_stage_5: "Successfully Completed Land Reform"
  RUS_maximalist_land_reform_stage_5_desc: "The Maximalist land reform has achieved decisive results. Disorder, hesitation and resistance in the countryside are giving way to new forms of organisation, with collective farms, mechanised production and local mobilisation supporting a more stable socialist countryside."
  RUS_maximalist_land_reform_stage_5_tractor_bonus: "Successfully Completed Land Reform"
  RUS_maximalist_land_reform_stage_5_tractor_bonus_desc: "The Maximalist land reform has achieved decisive results. The fulfilment of the tractor promise has further consolidated peasant trust in the new regime, while collective farms, mechanised production and grassroots mobilisation now support a stronger socialist countryside."
  RUS_maximalist_land_reform_stagnation: "Stagnating Land Reform"
  RUS_maximalist_land_reform_stagnation_desc: "The land reform has failed to transform the countryside as the Maximalists promised. White banditry, confused local implementation and withdrawals from collective farms have turned the rural question into a heavy burden for the regime."

  RUS_max_landreform_agricultural_mechanisation: "Agricultural Mechanisation"
  RUS_max_landreform_agricultural_mechanisation_desc: "The urban proletariat is growing, but the rural masses cannot be ignored. Mechanisation is necessary to improve their lives and overcome the backward state of agriculture."
  RUS_max_landreform_promote_tractors: "Promote Tractors"
  RUS_max_landreform_promote_tractors_desc: "Tractors are essential helpers in the countryside, yet the current number of tractors is far from satisfactory. The government will allocate extra funds to promote them."
  RUS_max_landreform_to_the_countryside: "To the Countryside"
  RUS_max_landreform_to_the_countryside_desc: "To address widespread illiteracy, the government will call on educated youth to go into the countryside and spread knowledge throughout the motherland."
  RUS_max_landreform_literacy_campaign: "Literacy Campaign"
  RUS_max_landreform_literacy_campaign_desc: "The countryside remains a desert of knowledge. A rural literacy campaign is therefore indispensable."
  RUS_max_landreform_livestock_reorganisation: "Reorganise Animal Husbandry"
  RUS_max_landreform_livestock_reorganisation_desc: "To carry out the socialist transformation of animal husbandry and improve living standards, the government will reorganise livestock through collectivisation and cooperatives."
  RUS_max_landreform_concentrate_herds: "Concentrate Herds"
  RUS_max_landreform_concentrate_herds_desc: "State farms will integrate scattered small herds into collective pastures, while local cooperatives will manage livestock and distribute proceeds according to labour."
  RUS_max_landreform_model_kolkhoz_zone: "Model Collective Farm Zone"
  RUS_max_landreform_model_kolkhoz_zone_desc: "We are confident in the superiority of collective farms, but the peasantry must see it directly. A model collective farm zone will show the power of example."
  RUS_max_landreform_call_for_collectivisation: "Call for Collectivisation"
  RUS_max_landreform_call_for_collectivisation_desc: "On an entirely voluntary basis, local cadres will call on the rural masses to unite in collective farms and conduct large-scale planned cultivation."

  RUS_maximalist_land_reform_subtract_score_3_tt: "§YMaximalist Land Reform§! progress decreases by §R3§!."
  RUS_max_landreform_tractor_promise_mission: "Fulfil the Tractor Promise"
  RUS_max_landreform_tractor_promise_mission_desc: "We have promised to make up the shortage of agricultural equipment within 270 days. Complete the §YPromote Tractors§! decision §Y3§! times to fulfil the promise.\n\nCurrent progress: §Y[?RUS_max_landreform_tractor_promise_count|0]§!/§Y3§!"
  RUS_max_landreform_tractor_promise_timeout_tt: "§RThe tractor promise has not been fulfilled:§! Base Stability §R-10.00%§!, Political Power §R-45§!."

  rus_maximalist_land_reform_events.1.t: "The Maximalist Proposal"
  rus_maximalist_land_reform_events.1.desc: "In response to the worsening rural situation, Ustinov submitted the Maximalist land reform plan to the congress:\nFirst, cooperate with the political security organs to take coercive measures against kulaks and landlords entrenched in the countryside, and abolish private rural landownership completely.\nSecond, call on educated youth to enter the countryside and complete rural literacy work and ideological transformation.\nThird, carry out broad and thorough agricultural mechanisation, casting aside the traditional manual forms of the old age.\nFourth, on the principle of voluntariness, use grassroots cadres to call on peasants to enter collective farms and conduct more efficient large-scale cultivation.\nThe proposal immediately caused an uproar. Many old Socialist Revolutionary figures questioned the legality of abolishing private ownership and the voluntary nature of collective farms. Ustinov refuted them on the spot, calling their position capitulation to kulaks and landlords as well as lofty doctrinairism. The Bolsheviks, long at odds with the Socialist Revolutionary Party, unsurprisingly supported Ustinov's plan and highly affirmed the Maximalist reform direction.\nAfter discussion, the congress passed the plan with 73 percent of the vote."
  rus_maximalist_land_reform_events.1.a: "Let us declare war on rural private property!"
  rus_maximalist_land_reform_events.next: "Continue."
  rus_maximalist_land_reform_events.2.t: "Peasants Flock to Muromets"
  rus_maximalist_land_reform_events.2.desc: "As the Maximalist proposal is implemented, most peasants have begun to enjoy the benefits of collectivisation. The number of those actively seeking to join grows ever larger, the deformed land structure of the past is gradually disappearing from the countryside, and the broad peasant masses are enthusiastically adding their strength to socialist construction.\n\nAlongside this sweeping land reform, Ustinov's name and that of the Maximalists have become increasingly famous. The nickname Muromets has also spread without prompting. As the warrior who led peasants against kulaks and landlords, Ustinov is now seen by collective farm members as their guide."
  rus_maximalist_land_reform_events.2.a: "The tide of collectivisation, the myth of Muromets."
  rus_maximalist_land_reform_events.2.a.tt: "§YThe Maximalist land reform has been successfully completed!§!"
  rus_maximalist_land_reform_events.3.t: "Stagnating Land Reform"
  rus_maximalist_land_reform_events.3.desc: "Facing today's tangled rural situation, the once ambitious Ustinov has finally lowered his proud head. He admits the complete failure of the Maximalists' land reform: white bandit forces entrenched in the countryside were not effectively cleared out, and the collective farm system was not properly implemented.\n\nThese failures have humiliated the Maximalists, and doubts about Ustinov now rise throughout the party. Colleagues who once revered him as a peasant saviour now accuse him of losing touch with reality and acting too hastily. More radical critics demand that he publicly apologise and hand the leadership of the Maximalists to someone who understands the countryside better.\n\nUstinov sits in an empty meeting room, reports spread out before him and filled with numbers: white bandit attacks have risen rather than fallen, and applications to leave the collective farms pile up like a small hill. He tries to defend himself, but finds himself speechless."
  rus_maximalist_land_reform_events.3.a: "The Highest Programme has reached the end of its experiment."
  rus_maximalist_land_reform_events.3.a.tt: "§RWhat have you done?§!"
  rus_maximalist_land_reform_events.4.t: "The State of Land Reform"
  rus_maximalist_land_reform_events.4.desc: "After the Great Volga Famine, the face of the Russian countryside was permanently changed.\nBefore this, the previous government's land liberalisation reform had already sown the seeds of disaster. Land shifted from restricted allocation to free purchase and sale. On the surface this was meant to stimulate the rural economy, but in reality it accelerated land concentration: kulaks used money and means of production to expand aggressively, while large numbers of ordinary peasants gradually lost their land under market fluctuations and debt pressure, falling into tenancy or wage labour. The middle peasants, or serednyaks, were already in danger, though they still retained a faint presence.\nThen the famine came.\nSuccessive droughts across the Volga basin pushed everything into the abyss. In the face of hunger, land and grain became the only hard currency. Kulaks with remaining grain swallowed the land of starving peasants at extremely low prices. Indebted peasants were forced to sell their last possessions for a mouthful of food. Many more had no time to sell anything at all. They simply died."
  rus_maximalist_land_reform_events.4.desc_2: "When the famine receded, it left an almost hopeless landscape.\nKulaks occupied the most fertile and contiguous farmland. They possessed livestock, tools and the grain still sitting in their granaries. Poor peasants, or bednyaks, and landless peasants, or batraks, made up the overwhelming majority of the population: the former struggled year after year on plots barely sufficient for survival, while the latter could only work on kulak land under harsh conditions. The serednyaks, once the stabilising foundation of the countryside, had almost disappeared. Some were ruined and fell among the poor peasants, some were swallowed by famine, and only a very small number survived.\nThe village tradition of mutual aid was smashed by famine. Kulaks treated grain as a weapon, while poor peasants fell into silent despair. The Russian countryside seemed to have retreated into a cycle of the old age.\nEven more shocking are the vast stretches of abandoned land. Fields belonging to the dead and to refugees were either bought cheaply by kulaks or nominally placed under local self-government, only to go uncultivated for lack of labour and seed. Fertile black earth is overgrown with weeds, while hungry people have nowhere to set their hoes.\nWhat Russian agriculture needs now is not piecemeal repair, but a thorough, revolutionary transformation: one capable of smashing the old order and reforging a new foundation."
  rus_maximalist_land_reform_events.4.a: "Sweep the old world away!"
  rus_maximalist_land_reform_events.6.t: "Manifesto of Collectivisation"
  rus_maximalist_land_reform_events.6.desc: "- Excerpt from Ustinov's speech at the Congress of Workers' and Peasants' Representatives\nYou ask me to explain what legality means and what voluntariness means.\nVery well. I will explain.\nSome say that directly abolishing private landownership is the style of radicals. Then let me ask:\nA peasant works the soil all his life and cannot even buy a gravestone when he dies. Is that legal?\nA landlord can take away a man's only cow with a promissory note. Is that legal?\nIf you think the correct measure is to stand by and watch, then I would rather be a radical.\nCapital drips with blood from head to toe. Our private landownership drips with peasant blood.\nIf you call this the foundation of the countryside, then I intend to dig out that foundation.\nYour favourite word is voluntariness.\nLet me tell you a true story. In Tambov Governorate there was an old peasant who borrowed seed grain from a kulak and could not repay it. The kulak took his horse under a voluntary agreement.\nWhen a man is starving to death, what signature is not voluntary?\nGo to the countryside and see for yourselves: how those with threshers extort those without them, how those with grain lend at usury.\nLook with your own eyes, comrades. This is the freedom praised by the bourgeoisie!"
  rus_maximalist_land_reform_events.6.desc_2: "The collective farm does not force people at gunpoint. But it will let everyone see:\nThose who join eat their fill; those who do not go hungry.\nThis is the reality of revolution.\nYou say collective farms are empty words?\nIn Saratov's Red Dawn model district, on the same land and under the same weather, output per head is forty percent higher than single-family farming.\nIn Tambov's Labour Commune, frost destroyed forty percent of the harvest of individual households this year. The commune lost less than ten percent.\nThe figures are written in the reports. You may check them yourselves.\nThe old populists took off the noble tailcoat, put on peasant bark shoes, entered every village along the Volga, taught peasants to read, treated the sick and wrote petitions against landlords.\nAfter that, the comrades of Land and Liberty carried shotguns onto the roads of Saratov, stopped landlord carriages and publicly burned the seized land deeds.\nThat is the tradition of the Socialist Revolutionary Party.\nNot writing elegantly worded protests in Petersburg salons, but going to the countryside and bleeding together with the peasants.\nAnd now?\nSome in the party speak of land socialisation yet dare not even speak of abolishing private ownership.\nKulaks hide grain, and they say patience. Landlords restore themselves, and they say legality. Peasants are driven to sell sons and daughters, and they say respect the principle of voluntariness.\nIs this the tradition you insist upon?\nWhen I fired in the streets in 1905, when I stood among the sailors in 1917, where were you?\nIn Kerensky's ministerial chairs? On the road to begging loans from the English?\nNow the time for battle has come again.\nSocialist Revolutionaries ought to stand up for the peasants.\nComrades,\nwhen the collective farm tractors enter the fields,\nwhen flour from public granaries reaches the workers' hands,\nthen you may say whether I am a madman or a fighter."
  rus_maximalist_land_reform_events.6.a: "Only through thorough social transformation can true individual development be realised."
  rus_maximalist_land_reform_events.7.t: "Basic Law on Land Socialisation and Collective Labour"
  rus_maximalist_land_reform_events.7.desc: "Article I: Ownership of Land\nFrom the date of this law's promulgation, all land within the Russian Socialist Republic, including arable land, pasture, forest, orchards and uncultivated wasteland, shall have private ownership abolished and become state property. No individual, family or group may claim private ownership of land under any name. All previous contracts for land sale, mortgage or inheritance shall be invalid from this date.\nArticle II: Principles for Allocating Land Use Rights\nLand use rights shall be distributed according to labour capacity among those who actually cultivate the land. Allocation shall be carried out by village, township and county poor peasant land committees. These committees shall be elected by landless peasants, or batraks, and poor peasants, or bednyaks; their members may not be kulaks, landlords or their immediate relatives.\nThe standards of allocation are as follows:\n- By household, cultivated area shall be assessed according to the number of family members able to labour.\n- Land of differing quality must be allocated in combination; inferior land may not be passed off as good, nor may barren land be concentrated upon a particular group.\n- Allocation results must be publicly voted upon by the village assembly and shall be valid only with the consent of more than two thirds of those present."
  rus_maximalist_land_reform_events.7.desc_2: "Article III: Basic Principles of Collective Labour\nAfter land allocation is completed, peasants who enjoy land use rights should, on the basis of voluntariness, preferentially join the local collective farm or agricultural cooperative. Collective farms shall practise unified cultivation, unified management and unified distribution. Members shall receive year-end dividends according to labour contribution.\nTo encourage collective labour, the state shall prioritise the following support for areas that have established collective farms:\n- Agricultural machinery and fuel quotas.\n- Improved seed and fertiliser.\n- Low-interest agricultural loans.\n- Dispatch of technical personnel and literacy teachers.\nHouseholds that refuse to join collective farms and choose independent cultivation may continue farming the land allocated to them, but must independently bear taxes and production risks and shall not enjoy the priority support listed above.\nArticle IV: Transition Period and Executive Bodies\nWithin three months of this law's promulgation, every county shall complete elections for poor peasant land committees. Within six months, all land within their jurisdictions shall be measured and registered. Within one year, initial allocation of land use rights shall be completed.\nThe People's Commissariat of Internal Affairs and the Workers' and Peasants' Inspectorate shall jointly supervise the implementation of this law. Those who obstruct land distribution, tamper with allocation results, falsify poor-peasant status or incite peasants to resist collective farms shall be held legally responsible.\nArticle V: Authority of Interpretation and Revision\nFinal authority to interpret this law belongs to the All-Russian Central Executive Committee. Any dispute concerning land allocation and collective labour shall be adjudicated step by step by the soviets at each level, with final adjudication belonging to the Agricultural Affairs Committee under the Central Executive Committee.\n---\nThis law takes effect from the date of promulgation.\nPeople's Commissar of Agriculture Ustinov"
  rus_maximalist_land_reform_events.7.a: "The gates of the new world stand open before us."
  rus_maximalist_land_reform_events.10.t: "Agricultural Mechanisation"
  rus_maximalist_land_reform_events.10.desc: "Traditional work in the fields is slow and exhausting. After a day of hard labour, peasants can cultivate only a very limited plot of land, and year after year they remain almost entirely at the mercy of the weather.\nSavinkov did invest in the countryside, but most of those funds fell into the private pockets of Guarding Alliance bureaucrats, while the rural masses continued to suffer.\nThis situation must change. The tragedies of the old countryside must not be repeated on the soil of a new age. Therefore, by unanimous vote of the congress, the agricultural department has received a considerable fund to purchase tractors and other mechanised equipment, along with indispensable fertiliser and improved seed.\nWith the help of grassroots cadres, we believe every collective farm member will master the use of tractors. In the future, reason and efficiency will become synonyms for agricultural production."
  rus_maximalist_land_reform_events.10.a: "Comrades, mount the tractors!"
  rus_maximalist_land_reform_events.11.t: "Shortage of Agricultural Equipment"
  rus_maximalist_land_reform_events.11.desc: "Land reform is only the first step. Once the land is allocated, it must still be cultivated.\nBut in today's Russian countryside, what is most lacking is precisely the machinery needed to cultivate it. For a long time, tractor production and ownership have seriously lagged behind real demand. The few tractor factories in the country have been underworked for years: their equipment is old, spare parts are scarce, and their capacity cannot cover the vast countryside.\nTake the Volga basin as an example. A typical collective farm can receive only one tractor for every three hundred hectares of arable land, and a considerable number of these are half-scrapped for lack of repair parts. In more remote provinces, the situation is even worse. Many villages still rely entirely on animal power and manual labour, with wooden ploughs and sickles remaining the most common tools in peasant hands."
  rus_maximalist_land_reform_events.11.desc_2: "Limited capacity forces us to make choices in distribution:\nPrioritise collective farms. Concentrate the limited tractors in collective farms already established or soon to be established, ensuring that model areas are mechanised first and persuading onlookers through concrete results. This road works fastest, but it means scattered smallholders outside the collectives will continue to farm under primitive conditions, possibly intensifying feelings of rural inequality in the short term.\nEqual distribution. Ensure every village, regardless of size, receives at least one tractor. This road is the safest politically and avoids complaints of favouritism. But the cost is also clear: machines will be too dispersed to form economies of scale, and the costs of maintenance and fuel supply will multiply.\nDelay distribution. Promise the peasants that every tractor will be properly allocated within the next nine months, but only after we first concentrate on raising capacity, training grassroots cadres and establishing a nationwide network for repair parts. This road requires the most patience and tests peasant trust in the regime most heavily."
  rus_maximalist_land_reform_events.11.a: "Prioritise collective farms. The rural foundation must be built properly."
  rus_maximalist_land_reform_events.11.a.tt: "We will focus support on collective farms."
  rus_maximalist_land_reform_events.11.b: "Distribute them equally. Socialism means equality."
  rus_maximalist_land_reform_events.11.b.tt: "We will distribute agricultural equipment evenly."
  rus_maximalist_land_reform_events.11.c: "Let the masses wait a little longer. Soon everyone will have a tractor to drive!"
  rus_maximalist_land_reform_events.11.c.tt: "We will prioritise tractor production. A new land reform mission will appear: complete §YPromote Tractors§! §Y3§! times within 270 days. If fulfilled, §YTrust Unbetrayed§! will fire; if not, base stability §R-10.00%§! and political power §R-45§!."
  rus_maximalist_land_reform_events.12.t: "The Long Wait"
  rus_maximalist_land_reform_events.12.desc: "Tambov Governorate, a village, before spring ploughing\n\nA group of people gathered beneath the old locust tree at the village entrance.\n\n“Above says that if we wait nine months, the tractors will arrive before this year's harvest,” the village head read the notice again and again. “As for this year... everyone will have to work harder and use livestock first.”\n\nNo one spoke.\n\nSome lowered their heads and rubbed their hands; others stared blankly at the fields waiting to be turned. A young man spoke first: “Village head, my mule went down at the start of spring. What am I supposed to plant with?”\n\n“Borrow. Mutual aid group. Endure it for now.”\n\n“That is what you said last year.”\n\nA low laugh sounded in the crowd, not because anything was funny, but with a bitter edge.\n\nThe village head was silent for a while, then spoke in a low but clear voice: “I will say only one thing. Believe it or not, I believe it. This regime is different from the old ones. If they say they will come, they will come. Only... the road must be walked one step at a time.”\n\nSpring ploughing began without tractors. Old hands bent over the plough, young people scattered seed behind them, and children followed at the end carrying buckets of water. Everything was exactly as it had been fifty years before.\n\nBut the village head never forgot the signature at the bottom of that notice, nor the line written within it: “We will not forget you.”"
  rus_maximalist_land_reform_events.12.a: "Please, comrades of the village, believe us!"
  rus_maximalist_land_reform_events.13.t: "A Letter from the Village Entrance"
  rus_maximalist_land_reform_events.13.desc: "- Red Fields Gazette\n\n“The tractors came, but they came for them.”\n\nThe speaker is old Sergei, an independent middle peasant. He crouches on his threshold, looking at the dust rising in the direction of the collective farm, where a new piece of land is being opened up. The roar of engines runs from morning to evening.\n\n“They call this priority support, and say we will benefit later too.” Sergei spits tobacco. “But what about this spring? My horse died last winter. What am I supposed to plough with?”\n\nSimilar complaints are spreading through many villages. Individual households that failed to receive machines watch the collective farm tractors enter the fields, while they still carry ploughs on their shoulders and bend their backs step by step through the furrows.\n\n“The collective farm is the future, and we are all stepping stones,” someone concludes.\n\nBut the members of the collective farm do not think so. “We work fast here and produce more. In the future the whole village will depend on our grain,” says a young member, patting the tractor's hood. “If they want to join, they are welcome any time. But if they insist on guarding their tiny plot, they cannot blame us for not waiting.”\n\nThe land does not lie. At harvest, the collective farm granary was full, while the individual households' stores were still more than half empty.\n\nThe members began to realise that collective strength truly was stronger than single-family farming. The individual households also began to realise that they must either join them or be left behind."
  rus_maximalist_land_reform_events.13.a: "The village has split, but the direction of the crack is exactly the one the Maximalists wanted."
  rus_maximalist_land_reform_events.14.t: "Letters from Readers"
  rus_maximalist_land_reform_events.14.desc: "- Izvestia\n\n“Is it fair to place us together with scattered households that only have two hectares?”\n\nA complaint letter from a Tambov collective farm member reached the newspaper office. The letter said that their farm had just entered normal operation last year and should have expanded its cultivated area this year, but the authorities decided on equal distribution. Of the three tractors originally promised to them, two were transferred to two nearby small villages.\n\n“We understand the difficulties above, but what about our plan? One hundred and fifty hectares of land and one tractor. How are we supposed to farm?”\n\nThe two villages that received tractors are not having an easy time either. A machine is strange to a small village: no one can repair it, there are no spare parts, and diesel must be bought from a town thirty kilometres away. During the harvest, the tractor broke down for nearly half a month; by the time it was repaired, the crops had already over-ripened.\n\n“If we had known this, it would have been better never to start,” a village head says with a bitter smile. “Once people have seen a tractor, they can never return to ox-ploughing. But when the machine breaks, we still have to use oxen.”\n\nThe good intentions of equal distribution have been ground to pieces by grassroots reality. Everyone received a little, but no one received enough."
  rus_maximalist_land_reform_events.14.a: "This is not good!"
  rus_maximalist_land_reform_events.15.t: "Trust Unbetrayed"
  rus_maximalist_land_reform_events.15.desc: "Volga basin, a village, early spring of the following year\n\nThe rain that began before dawn was still falling lightly, and the air smelled of opened earth. The village head stood at the entrance to the village. Before him were two brand-new tractors, their tracks still stained with factory anti-rust oil.\n\n“They have come,” he said.\n\nNo one cheered. The old peasants surrounding them merely walked around the two iron beasts. Someone bent down to touch the tracks; someone tapped the body with a finger, producing a dull metallic sound. After a long silence, an old woman stepped out of the crowd, carrying a pot of tea, and placed it on a stone beside the tractors.\n\n“For the masters. It was a hard road.”\n\nIn the distance, the first machine operators were adjusting ploughs in the open space by the village school. They wore clean work clothes with sleeves rolled to the elbows, their faces carrying the exhaustion and relief only found in those who have finally arrived.\n\nSomeone asked the village head, “What comes next?”\n\nThe village head looked toward the end of the ridges, at the black earth waiting to be turned. “First we finish the village's land, then we help the next village. Above says this batch of machines is a mobile support team. Whoever finishes first goes to help those who have not finished.”\n\nThe young people had already run over to listen to the operators explain the controls. The village head's wife stood beside him and nudged him with her elbow. “What did you tell them last year?”\n\n“I said if we believe, then we believe.”\n\n“And now?”\n\nThe village head did not answer. He stamped the mud beneath his feet. This year they would not have to carry the plough. That alone was enough to believe for another year.\n\nIn the distance, the first tractor started. The roar of the engine tore through the village's silence. Several children ran behind it, laughter scattering all along the road."
  rus_maximalist_land_reform_events.15.a: "No one will be left behind!"
  rus_maximalist_land_reform_events.15.a.tt: "After land reform is completed, §YSuccessfully Completed Land Reform§! will additionally receive: Consumer Goods Factories Expected Value §G-2.00%§!, Economy Law Cost §G-20.00%§!."
  rus_maximalist_land_reform_events.20.t: "The Landlord Class Rises Again"
  rus_maximalist_land_reform_events.20.desc: "Temporary repression by force does not equal permanent revolutionary achievement.\n\nRecently, disturbing reports have arrived from many regions: remnants of white bandits have become active again in the countryside. Building on expelled landlords and kulaks, they have formed so-called homecoming bands. These armed thugs commit every crime in the villages: burning collective farm granaries, murdering grassroots cadres, and forcing peasants to return land already distributed. In some places they even hang old flags and restore old land deeds, as though the civil war had never ended.\n\nThe atrocities of the homecoming bands carry a strongly punitive character."
  rus_maximalist_land_reform_events.20.desc_2: "In Saratov Governorate, they publicly shot a poor peasant committee chairman who had presided over land distribution and hung a wooden sign on his body reading: The masters of the land have returned. In Tambov Governorate, the account books of several village collective farms were burned in public, and members were ordered to go home and wait for their old masters to return and sign new contracts. Worse still, they exploit peasants' memories of famine, claiming that following the Bolsheviks means starvation, while following them means bread. This agitation has even gained brief responses in some remote areas short of grain.\n\nYet this is not an organised peasant uprising, but the dying counterattack of old forces. Wherever the homecoming bands go, the first thing they do is not improve livelihoods but restore the old order: bring back rent, take back land and settle accounts with traitors. Their homecoming is, in the final analysis, an attempt by landlords and kulaks to recover their lost property and privileges. The peasants will soon discover that following these bands brings not a full meal, but chains placed back on their necks.\n\nIt must be noted that the activity of the homecoming bands is not isolated local unrest. Intelligence already shows that they maintain contact with white émigré forces abroad. Weapons and ammunition secretly flow across the border, and some former white officers have even infiltrated the bands as military advisers, trying to integrate scattered rural violence into a planned counter-revolutionary rebellion.\n\nFor the newborn revolutionary regime, this is a severe test. If we cannot eliminate these reactionary armed groups in time, not only will the achievements of land reform be lost, but the newly established collective farms will suffer devastating blows. After discussion, the congress decided:"
  rus_maximalist_land_reform_events.20.a: "Expand the people's militia. We must ensure rural security..."
  rus_maximalist_land_reform_events.20.b: "...that is far from enough! Drag the artillery into the village!"
  rus_maximalist_land_reform_events.20.b.tt: "We will allow local security detachments to use heavy weapons."
  rus_maximalist_land_reform_events.20.c: "Do they think only they can kill us?"
  rus_maximalist_land_reform_events.20.c.tt: "In addition to expanding the militia and adding heavy weapons, the political security bureau will organise an assassination against the white bandit ringleader."
  rus_maximalist_land_reform_events.21.t: "One Night in Harbin"
  rus_maximalist_land_reform_events.21.desc: "As the Songhua River froze, the snow on the streets was trampled by pedestrians into a grey-black crust. Harbin, a city held firmly in the hands of the Fengtian warlords, has in recent years received large numbers of exiled White Russians and become the largest Far Eastern nest of white remnants.\n\nGrigory Mikhailovich Semyonov lives in this city. The Cossack chieftain who once dominated the lands east of Lake Baikal, the white general who once called himself Supreme Commander of the Transbaikal Cossack Host, still possesses a spacious Russian mansion, a private guard made up of former white officers, and the quiet protection of the Fengtian warlords. In his Harbin parlour he receives liaison officers of the Japanese Kwantung Army, raises funds in Russian émigré clubs, and secretly dispatches infiltration groups toward the Far Eastern border in an attempt to rekindle trouble for the socialist regime.\n\nThe Main Political Security Directorate has watched him for a long time.\n\nSemyonov is not merely an exile. He is the spiritual pillar of white forces in the Far East and the intermediary most familiar with Russian affairs between the Japanese and the Fengtian warlords. As long as he lives, anti-socialist forces in Manchuria will always have a node from which to settle, plan and connect. The anti-socialist resistance in the domestic countryside, the homecoming bands, the white agents sneaking back into villages and the local forces secretly supporting landlords in recovering land, are tied to him by countless threads. Weapons enter through channels he organises, funds circulate through his hands, and many of the homecoming band commanders are his old subordinates from the white armies.\n\nBut he also knows he is in danger. He lives secluded, keeps travel routes strictly secret, surrounds his mansion with layers of guards, and employs three former white scouts full time for counter-surveillance.\n\nYet in Harbin, he has one weakness he did not expect: his cook."
  rus_maximalist_land_reform_events.21.desc_2: "The cook is a White Russian exile. In his early years he served as a cook in Semyonov's forces, and later followed him all the way to Manchuria. His loyalty was never suspected. But he has another identity: his younger brother is a member of a collective farm in Amur Oblast, and that brother was developed by the political security bureau as an outside informant two years ago.\n\nThe brother sent only one message: My elder brother cooks for Semyonov in Harbin. After that he received no further instructions.\n\nDay X, Month X\n\nSemyonov's dinner was Ukrainian borscht. As usual, the cook served it, withdrew from the room, then went straight to the back door and climbed into an unmarked carriage. He would have no second job in Harbin.\n\nSemyonov drank the first spoonful.\n\nThree hours later, his personal doctor announced that the cause of death was acute heart failure caused by food poisoning. Fengtian police sealed the kitchen and arrested every servant, but the cook had already disappeared along some remote Manchurian village road. In a few days he would return to his homeland.\n\nWhen the news reached Moscow, a file marked completed appeared in the political security bureau archive, number Nightingale-7.\n\nOne month later, infiltration activity along the Far Eastern border clearly declined. Two months after that, white émigrés in Harbin's Russian club had a public quarrel and split into two factions accusing one another of being socialist agents, ending any possibility of unified command.\n\nIn the domestic countryside, the change was even more direct. The homecoming bands that had lost external support began to reveal fatal weaknesses: ammunition was not replenished, new members could not be recruited, and no one knew where to go next. The old cycle of striking, fleeing and retreating abroad to rest had been broken. Some once arrogant white bandit leaders began receiving news of subordinates deserting; others quietly disbanded their groups, buried their weapons and pretended they had never been bandits."
  rus_maximalist_land_reform_events.21.a: "Justice is served!"
  rus_maximalist_land_reform_events.22.t: "Under Sickle and Hammer"
  rus_maximalist_land_reform_events.22.desc: "The Third Homecoming Detachment slipped into Beryozovka village on the Volga before dawn. They planned to burn the village soviet's warehouse, poison the wells, and abduct the old mother of the collective farm chairman, parading her at the next market. This was their usual teaching terror.\n\nBut they had not expected that the militia in this village was no longer the rabble of two months ago, armed with only three old rifles.\n\nAfter the centre ordered the expansion of the people's militia, Beryozovka received thirty-five rifles and a batch of grenades. More importantly, they received a retired NCO of the old tsarist army, a Tatar who had joined the revolution out of hatred for landlords. In two weeks he taught thirty-seven peasants how to ambush, how to cover one another in movement, and how to block crossroads with grenades.\n\nAs soon as the homecoming band entered the village, dense gunfire erupted from the direction of the granary. Immediately afterward, the exits at the east and west ends of the village were blocked by burning hay carts. The panicked thugs tried to retreat along the riverbank, only to find eight women waiting in ambush with shotguns and pitchforks.\n\nThe fighting lasted less than half an hour. Of the seventeen men in the Third Homecoming Detachment, eleven were killed and six captured.\n\nThe captured detachment leader, a former white captain, murmured before being taken away: “When did you get so many guns?”\n\nThe village soviet chairman kicked the dirt in front of him. “From the day you decided to become beasts!”"
  rus_maximalist_land_reform_events.22.a: "Well done!"
  rus_maximalist_land_reform_events.23.t: "Dawn After the Artillery"
  rus_maximalist_land_reform_events.23.desc: "The Nikolayevsk county security detachment received an unprecedented order: heavy weapons could be used in suppression operations. This meant that the stone manors and brick kilns once used by white bandits as strongholds were no longer impregnable shells.\n\nThree days later, the security detachment surrounded an old landlord manor outside Chernyshevo village. Intelligence indicated that the Iron Hammer detachment of the homecoming bands, about sixty men, was stationed there and had stockpiled large amounts of grain and ammunition robbed from nearby villages.\n\nThe detachment commander did not organise an infantry charge as usual. He ordered two 76mm field guns set up four hundred metres in front of the manor, then sent someone to shout: “You have fifteen minutes to lay down your weapons and come out, or the manor will be your coffin.”\n\nThe homecoming commander's answer was a burst of machine-gun fire.\n\nFifteen minutes later, the two guns fired at once. The first salvo landed precisely in the centre of the main building, throwing stone and wood splinters into the air. The second targeted the courtyard wall and granary. After the third, there was no more gunfire from the manor.\n\nWhen the infantry rushed in, they found only more than twenty corpses and a dozen terrified prisoners. The rest, including the arrogant detachment commander, had vanished in the first shelling, leaving only half a boot buried in the rubble.\n\nAfter the news spread, homecoming bands in three neighbouring counties pulled out overnight, abandoning several long-held strongholds.\n\nAt the next provincial committee meeting, however, the security detachment commander was criticised: “It was satisfying to blow up that manor, but it was a historical building. Aim more carefully next time.”\n\nThe commander spread his hands. “Next time I will try to make the shells go around culture.”"
  rus_maximalist_land_reform_events.23.a: "Truth exists only within artillery range!"
  rus_maximalist_land_reform_events.30.t: "Transforming Animal Husbandry"
  rus_maximalist_land_reform_events.30.desc: "Rural animal husbandry in the old age was dominated by private raising and private trade. The flaws of this model were obvious: individual households not only found it difficult to manage large herds, but often failed to receive satisfactory market prices. This has still not improved.\nTo carry out a thorough socialist transformation of animal husbandry, collectivisation and cooperativisation have received broad support.\nBy integrating large breeders, state farms can concentrate resources for unified planning and technical promotion. Through planned allocation, the state can guarantee stable supplies of meat, milk, hides and wool.\nFor small individual households, grassroots cadres call for the establishment of cooperatives, in which herds are managed as common cooperative property.\nThis means that, regardless of scale, every herder will no longer be a lone individual household, but a cog in the socialist animal husbandry chain. From now on, pasture and pens will belong not to private pockets but to the collective and to the whole people. When the first cart of cooperative milk leaves the village, the herders will understand: only united herds can feed a united people."
  rus_maximalist_land_reform_events.30.a: "Let every head of livestock bear the mark of the collective!"
  rus_maximalist_land_reform_events.31.t: "The Rancher's Last Day"
  rus_maximalist_land_reform_events.31.desc: "On the Don, a ranch covering four hundred hectares. The old owner's surname still hangs on the iron gate: Kuznetsov.\n\nWhen the state farm reception team arrived, Kuznetsov himself was standing on the steps of the main house, wearing the leather jacket he had worn for twenty years. He said nothing, only watched as the team counted the herd pen by pen. His daughter stood behind him, tightly clutching the hem of his coat.\n\n“According to the decree, all herds exceeding fifty cattle are to be nationalised,” the team leader read the document, then looked up at him. “Comrade Kuznetsov, do you have anything to say?”\n\n“I do.” Kuznetsov's voice was calm. “I have raised cattle for thirty years. These hands have delivered more calves than everyone in your work team has raised combined. If you lead them away, who will feed them? Who will manage them? Who knows which cow is about to calve?”\n\nThe team leader lowered the document. “That is precisely why we need you. The state farm needs an experienced director. If you are willing...”\n\nKuznetsov was silent for a long time.\n\n“Director?” He laughed, with a tone that was hard to distinguish between sarcasm and self-mockery. “My family's ranch, and I become the director. Fine. Better than being thrown out.”\n\nHe walked down the steps toward the herd about to be nationalised. An old cow recognised him and turned its head to rub against his hand. He patted its neck and said something under his breath that only the cow could hear."
  rus_maximalist_land_reform_events.31.desc_2: "The next day, Kuznetsov put on the work clothes issued by the state farm. The words Don State Ranch were printed on the sleeve. His daughter was assigned to the veterinary station, where she was studying the latest epidemic prevention techniques. His old account books were placed in the archive, replaced by a Quarterly Production Plan.\n\nAt dinner, his daughter asked him, “Father, do you hate them?”\n\nKuznetsov picked up a piece of bread and chewed for a long time before answering. “Not anymore. I am too tired to hate. Besides, those people say they want to expand the ranch, introduce new breeding stock and build a mechanised milking room. I thought about these things when I was young, but one man could not do them.”\n\nHe paused and looked out the window at the cattle spending the night behind the fence. “Now it can be done.”\n\nThe ranch outside the window was quiet, with only an occasional cowbell. Far away, state farm workers were meeting under the lamps to discuss next season's feed procurement plan. Kuznetsov did not join them. He merely sat by the window, watching the land that had once been his become part of something larger."
  rus_maximalist_land_reform_events.31.a: "The age that belonged to him was over."
  rus_maximalist_land_reform_events.32.t: "The Hesitation of Five Households"
  rus_maximalist_land_reform_events.32.desc: "Voronezh Governorate, Zarechye Village, a late-spring afternoon\n\nOn the long table in the village office lay a copy of the Charter of the Animal Husbandry Cooperative. Five households sat around the table, representing five small herding families with only three or five cattle and sheep each. Some turned hats in their hands; others glanced out the window from time to time, thinking of who knew what.\n\n“The charter is very clear,” grassroots cadre Ignatyev said, pushing the document forward. “The herds become common cooperative assets, with unified grazing, unified epidemic prevention and unified sale. At the end of the year, dividends are distributed according to the number of animals each household contributes and the labour invested. If there is a loss, everyone bears it together; if there is profit, everyone shares it together.”\n\nSilence.\n\nFyodor, the oldest herder, spoke first. “I have raised sheep for forty years. I have always grazed them myself and sold them myself. Now I hand them over. To whom? Which of you has ever grazed sheep?”\n\nIgnatyev did not argue. He only asked: “Uncle Fyodor, how many sheep died last year? How many froze during the winter? When you sold to the buyer, how much did he press down the price?”\n\nFyodor said nothing. Seven of his sheep had frozen to death last year. The buyer had offered him only half the price charged by the butcher in town. He knew these things, and so did his neighbours.\n\n“Together, the five of you have more than seventy sheep. Seventy sheep cannot fit in anyone's yard. But if you are willing, I can apply for common pasture and coordinate a mower. Next winter your sheep will not starve for lack of hay.” Ignatyev stopped. “My words alone are useless. All five of you must nod.”\n\nAnother silence. A young wife asked quietly: “If I am not at ease, can I first bring half the flock into the cooperative and keep the other half myself?”\n\n“Yes. The charter has a half-entry clause.” Ignatyev opened that page. “But after half a year you must choose: either enter fully or withdraw fully. It cannot remain half and half. A cooperative needs one heart, not two bets.”"
  rus_maximalist_land_reform_events.32.desc_2: "“I will enter,” Fyodor suddenly said. Everyone looked at him. He lowered his head and stared at his hands. “I cannot raise them well by myself anymore. I lost seven sheep and hurt over it all winter. Let us enter. I am old. I cannot graze alone anymore.”\n\nThe second person said, “I will enter too.” The third said, “I will think about it.” The fourth said nothing, only drank the water in his cup.\n\nThe fifth was the young wife. She looked at Fyodor, then at the charter, and bit her lip. “I will add my four sheep too. But on one condition: I must be the cooperative's accountant. I can read. None of you may touch the ledger carelessly.”\n\nIgnatyev smiled. “Of course.”\n\nOne month later, the Zarechye animal husbandry cooperative officially opened. At the entrance hung a handwritten wooden sign, its crooked characters written by Fyodor with a burned branch: Unity Cooperative. On opening day, Ignatyev brought a bag of salt and, according to old village custom, scattered it over the cooperative threshold.\n\n“If the salt does not scatter, the cooperative will not scatter,” he said.\n\nFyodor stood in the crowd, watching the sheep driven into the newly built pen, more than seventy of them crowded together and bleating one after another. Suddenly he felt that the bleating this winter might not be as bleak as last year.\n\nIgnatyev stood beside him, also watching the flock. “The first cart of cooperative milk should be ready to ship in two months.”\n\nFyodor was silent for a moment and did not answer that. He only said, “That young wife keeps accounts well. She manages the ledger better than I ever did.”\n\nHis tone was light, but there was something hard to name within it: old attachment was slowly being replaced by new trust. That evening, the cooperative members held no meeting. They simply brought their children and repaired the gaps in the fence together. There were not enough nails, so someone dismantled old boards from home; someone threw his own cut hay into the collective shed. When work ended, Fyodor discovered that his own fence had been repaired too. Before he could ask who had done it, the young wife walked past him carrying a hammer, without looking back."
  rus_maximalist_land_reform_events.32.a: "Unite."
  rus_maximalist_land_reform_events.40.t: "Model Collective Farm Zone"
  rus_maximalist_land_reform_events.40.desc: "For most rural people, the collective farm is a fresh and unfamiliar term. It often appears in official pictorials and in the mouths of grassroots cadres, but rural people know little of what it actually means.\nFor a small number of people, however, collective farms are within reach. Since the establishment of the republic, Ustinov has consciously called on the masses to establish collective farms in order to defend themselves from roving white bandits. Of course, the benefits of collective farms go far beyond local security. In the farm, all members are equal, collective decision-making becomes the norm, and mutual aid is almost a basic quality of every member.\nIn regional labour competitions, collective farms have far higher output per head than individual households. The great improvement in material conditions has made more and more people notice them, some out of curiosity and others out of immediate interest. In any case, collective farms are gradually becoming the mainstream of agricultural production. These model zones will be remembered forever as the footprints of pioneers."
  rus_maximalist_land_reform_events.40.a: "Look at our collective farms, everywhere a new landscape!"
  rus_maximalist_land_reform_events.41.t: "The Land Meeting of Zarechye Village I"
  rus_maximalist_land_reform_events.41.desc: "Voronezh Governorate, Zarechye Village, village office\n\nOn the day the decree arrived, more than forty people crowded into the village office of Zarechye. There were not enough benches, so some squatted on the threshold and some leaned by the windowsill. The air mixed the smell of pipe smoke and earth. No one spoke, and only when the village head read the crucial parts of the decree did a low murmur rise below.\n\n“Land belongs to the state... distributed by poor peasant committees... voluntary entry into collective farms.”\n\nThe village head finished reading, placed the paper on the table and pressed it down with his hand. “All right. If you have questions, speak now.”\n\nAfter a moment of silence, a voice sounded from the back. “My family's land was passed down from my father. I have farmed it for twenty-five years. Now you say it is not mine?”\n\n“You still farm it. It just is not yours. You cannot sell it, rent it or pass it to your son. But the grain you grow is yours, so long as you deliver what regulations require.” The village head paused. “And if you join the collective farm, there will be seed, tools and technical guidance...”\n\n“Then it still is not mine?”\n\nThe village head did not answer immediately. He looked down at the line in the decree: “...allocate land use rights according to labour capacity.” He raised his head. “Yes. It is not yours anymore. But when did you truly have land? Could you sell it? Could you mortgage it for money? When your father was alive, did he not mortgage the land to a kulak for grain in a bad year, and in the end lose it all the same?”"
  rus_maximalist_land_reform_events.41.a: "That voice did not sound again."
  rus_maximalist_land_reform_events.42.t: "The Land Meeting of Zarechye Village II"
  rus_maximalist_land_reform_events.42.desc: "Voronezh Governorate, Zarechye Village, village office\n\nSomething happened during the election of the poor peasant committee.\n\nAccording to the decree, committee members had to be landless peasants or poor peasants; kulaks, landlords and their immediate relatives could not stand. Village head Shakharov had a large white sheet posted on the wall. Every household declared its own status, and the villagers voted among themselves.\n\nThe first two rounds went smoothly enough. In the third round, when the chairman of the poor peasant committee was to be elected, someone wrote the name Sergei Petrov on the paper.\n\n“Sergei will not do,” someone said from the corner.\n\n“His father worked as steward for the Kuznetsov family for twenty years. His family's land was a gift from the Kuznetsovs.”\n\nSergei's face went pale. He stood up. “I am a poor peasant! My family has only those five desyatinas! What does the fall of the Kuznetsovs have to do with me?”\n\n“When your father was steward, did the Kuznetsovs collect less rent from your family? Who gave your family its plough? Who gave your family its horse?”\n\nSergei opened his mouth and said nothing.\n\nThe village head was silent for a short while. “Sergei, go outside. Come back after the election.”\n\nSergei stood at the doorway, and the door closed behind him. The planks were thin; the voices inside came through, muffled and unclear. He crouched on the step outside, rubbed his face with his hands, and did not leave."
  rus_maximalist_land_reform_events.42.a: "Someone passed by, glanced at him, and said nothing."
  rus_maximalist_land_reform_events.43.t: "The Land Meeting of Zarechye Village III"
  rus_maximalist_land_reform_events.43.desc: "Voronezh Governorate, Zarechye Village, village office\n\nThat evening's argument concerned the phrase on the basis of voluntariness.\n\n“What does voluntary mean?” An old peasant knocked his pipe bowl against the table leg. “If I do not join, will you refuse me seed? Refuse me tools?”\n\n“The decree says that households that do not join still enjoy land use rights, only without priority support...”\n\n“Then that is forcing me to join!”\n\n“It is the land forcing you, not the policy,” village head Shakharov said. “How much can you farm alone? Your mule was already too old to pull the plough last year. At harvest you need to hire day labour and repay loans. Who is forcing you? You force yourself every year when you cannot deliver grain.”\n\nThe old peasant said nothing.\n\nA young daughter-in-law raised her hand. “My family's land wants to join the collective farm, but my father-in-law disagrees. The land is under his name. Can I join separately?”\n\n“By household.” The village head turned the decree's pages. “Within one household, all members capable of labour must agree. If your father-in-law disagrees, then you can only divide the household...”\n\n“We cannot divide. Where would I live after division?”\n\n“Then keep discussing it.”"
  rus_maximalist_land_reform_events.43.a: "Those present realised that good intentions, once mixed with real people in real life, inevitably stumble and scrape."
  rus_maximalist_land_reform_events.44.t: "The Land Meeting of Zarechye Village IV"
  rus_maximalist_land_reform_events.44.desc: "Voronezh Governorate, Zarechye Village, village office\n\nWhen the meeting ended, Fyodor, the old man who raised sheep, met Sergei at the door. Sergei was still crouching on the steps.\n\n“Why are you still here?”\n\n“I... am waiting for news.”\n\n“There is news.” Fyodor sat down beside him and took out his tobacco pouch. “You were not elected.”\n\nSergei froze. “Then who became chairman?”\n\n“The village head will fill in for now. Another election next month.”\n\n“...And me?”\n\nFyodor lit his pipe and took a draw. “Your family's land will be allocated as usual, so long as you are not a kulak. As for the committee, next time.” He paused. “But everyone in the village knows about your father. You have to let them know you are on their side.”\n\nSergei lowered his head and twisted a blade of grass. “How do I let them know?”\n\nFyodor patted his shoulder. “Come help at the cooperative. No need to say anything. Just come.”\n\nNight fell, but the light in the village office was still on. Inside, the remaining people gathered to discuss where the boundaries of the first collective farm should be drawn. Some gestured on the map, others wrote the population and livestock of each family in small notebooks. Zarechye's first land ledger was written page by page that night. The handwriting was crooked, but every line had witnesses.\n\nSergei stood, threw the blade of grass to the ground and said, “I will come tomorrow.”"
  rus_maximalist_land_reform_events.44.a: "Fyodor waved a hand and said nothing more. He bent down, swept the ash from the ground, and slowly walked into the night."
  rus_maximalist_land_reform_events.50.t: "The End of the Kulaks"
  rus_maximalist_land_reform_events.50.desc: "If the Maximalists are saviours to poor peasants, then to the kulaks they are an utter nightmare.\n\nUnder the pressure of bayonets and gun muzzles, the kulaks usually have only two choices.\n\nOne is to hand over their land and enter the collective farm as members, together with their confiscated tools and livestock. Perhaps they can still keep their lives and a little dignity. But few choose this path. Most kulaks refuse to abandon the property they have accumulated over many years, and some even try to organise resistance.\n\nThe other road is shorter and more direct. Most kulaks arrested by the militia are executed after trial. But that is still a dignified end. Many local cadres report that some kulaks who once terrorised the village are dragged from hiding by angry poor peasants, stripped and paraded through the streets, publicly tried at village assemblies, then executed on the spot and left exposed for days. Corpses hang from withered trees at the village entrance until the wind dries them, and only then are they taken down.\n\nWe must understand this anger. After all, these grain speculators hoarded grain in their granaries until it rotted during the worst years of the Great Famine, waiting for prices to climb still higher.\n\nSome foreign observers accuse our actions of violating humanity and personal rights. Muromets answers firmly:"
  rus_maximalist_land_reform_events.50.a: "Did the devils ever imagine this day would come?"
  rus_maximalist_land_reform_events.51.t: "The Last Day of a Kulak"
  rus_maximalist_land_reform_events.51.desc: "Volga basin\n\nKuzma Ilyich was awakened by knocking. Not with a hand, but with a rifle butt.\n\nWhen he put on his coat and went to the door, he saw torchlight through the crack. Seven or eight people stood in the yard, holding torches, clubs and sickles. Some wore militia armbands: red strips pinned to the left arm, only recently issued.\n\nThe door was kicked open from outside. A young man stepped in. Kuzma Ilyich recognised him. Last summer, the young man had still come to him on credit for a sack of rye. The young man recognised him too, his eyes wavering for a moment before he straightened his chest and tugged the militia armband on his arm, as if reminding both himself and the man before him what that strip of red cloth meant.\n\n“Kuzma Ilyich Petrov, by decision of the poor peasant committee, your land, livestock and tools are all confiscated.”\n\nBehind the young man, someone in the crowd muttered that there was no point wasting words on him, but no one rushed forward. They merely held their torches and stood outside the threshold.\n\nKuzma Ilyich stood in the doorframe, still in his nightclothes and barefoot. He looked at the faces lit by firelight outside. They were all people of this village. He recognised every face: some he had watched grow up, some he had lent grain, some he had hired as labourers and paid an extra sack of potatoes after the work was done.\n\n“I have farmed this land for thirty years.” His voice was flat, without expression, as if stating a fact unrelated to anyone else. “After my father died, it took me ten years to repay the debts. If you want to take my land, fine. But can you leave me one cow? I have a five-year-old grandson...”\n\n“No.” The young man answered without looking at Kuzma Ilyich, his eyes fixed on the wall beside him. An icon hung there above an old wooden cabinet, its doors open, folded bedding inside washed pale at the corners.\n\nKuzma Ilyich said nothing. He turned into the inner room and after a while came out with a small cloth bag, placing it on the table. It was not heavy, and landed softly. Inside were small coins and a roll of rubles wrapped in oil paper.\n\n“I saved this money for three years. Enough to buy a cow.”\n\nThe crowd was silent. No one reached for the bag. The young man spoke first. “According to the decree, all property, large or small, new or old, is to be turned over to the public. After registration into storage, it will be allocated by the collective farm.”"
  rus_maximalist_land_reform_events.51.desc_2: "Kuzma Ilyich pushed the bag a little closer. It slid a few inches across the table and stopped near the edge.\n\n“You may take the money, the grain, the plough, the horse. I only want one cow, and leave me a ploughshare. I can still farm this year. I have farmed for thirty years. I know which field should be turned deep and which should rest. If you take the land away, who will farm it?” His voice was very soft.\n\nSomeone in the crowd whispered, “He is right. He really does know how to farm.” But no one agreed and no one objected. A torch swayed in the wind; sparks drifted onto the threshold and quickly went out.\n\nThe young man finally spoke. “Kuzma Ilyich, come with us first. If you have anything to say, say it at the poor peasant committee.”\n\nAt dawn, Kuzma Ilyich was taken away. His wife stood at the door, clutching the small notes that had not been taken, unsure whether they had been allowed to remain or merely forgotten. Later he handed them over to the poor peasant committee. The receipt said voluntary donation. He could not write, so he pressed a fingerprint. He kept that receipt for a long time, pressed at the bottom of a cabinet together with the icon.\n\nA few days earlier, a body had hung from the withered tree at the village entrance: a kulak from the neighbouring village, whose surname he could no longer remember. He only remembered that the man wore a coat without insignia, and that the outline of the dried corpse..."
  rus_maximalist_land_reform_events.51.a: "was like an empty suit of clothes."
  rus_maximalist_land_reform_events.52.t: "A Poor Peasant's New Day"
  rus_maximalist_land_reform_events.52.desc: "Volga basin\n\nThe poor peasant committee's review did not take long. They looked through Kuzma Ilyich's account books: land above the permitted limit, hired labour, and a granary holding more than a year's grain. That was enough.\n\nHe was allowed to remain in the village, but had to surrender all property and enter the collective farm. The village arranged an old storehouse for him. When he moved in, he took only one box, containing a change of clothes, an old planting notebook with 1913-1926 written on its cover, records of every year's weather and every field's harvest, and a small bag of seed wrapped in scraps of cloth. He handed that seed to no one, and no one came to take it.\n\nSpring came. The collective farm began turning the land. Kuzma Ilyich was assigned to carry stones, clearing fragments from the fields for tractor cultivation. He bent down, picked them up one by one and piled them on the ridge. Beside him was his old land, the field he had farmed for thirty years, now included in the collective farm's contiguous fields. Seed had already been sown. He did not know who had sown it, nor whether it was the variety he had used in previous years.\n\nSomeone passed by and called him Uncle Petrov, asking whether he was tired. He shook his head. “The land does not tire people. People tire the land.” Then he crouched again and dug from the soil a deeply buried stone. He had turned this field dozens of times; he knew which foot of earth held stones.\n\nIn summer, he saw the ploughshare that had once belonged to his family lying by the warehouse door, already rusting, beside a new piece of equipment allocated by the collective farm. He walked over and wanted to bend down to set the ploughshare upright, but a young man passing by looked at him and said not to touch it, it was to be sold as scrap iron and was worth little.\n\nHe drew back his hand, stood for a while, then turned and left."
  rus_maximalist_land_reform_events.52.a: "After only a few steps, he looked back at the ploughshare one last time."
  rus_maximalist_land_reform_events.53.t: "The Second Spring"
  rus_maximalist_land_reform_events.53.desc: "Volga basin\n\nThat bag of seed lay at the bottom of the box for an entire year.\n\nSometimes at night Kuzma Ilyich opened the box, took out the cloth bundle, placed it on his knees, untied it, looked at the seeds inside, tied it again and put it back. He never mentioned it to anyone. Perhaps its continued existence was itself a reply.\n\nSpring came again, a little earlier than last year.\n\nThe previous winter had been too cold, freezing to death newborn lambs in several households. When the snow melted in spring, the roof of the widow's house at the east end of the village collapsed at one corner under the snow. Fortunately no one was hurt. The next morning, when Kuzma Ilyich passed by, he saw several neighbours already climbing up with timber and tools. Someone called to him, “Uncle Petrov, lend a hand!” He stood for a while, put down the straw rope he was carrying, climbed onto the roof, pried away old boards and passed up new ones. The neighbours did not say thank you, and no one mentioned what he had once been. At dusk on the day the roof was fixed, the widow cooked a pot of thin porridge and set several bowls in the yard. The people who had carried timber crouched by the wall drinking porridge, chatting now and then and looking toward the fields beginning to turn green. Kuzma Ilyich also held a bowl."
  rus_maximalist_land_reform_events.53.desc_3: "After spring ploughing began on the collective farm, he was no longer assigned alone to pick stones as he had been last year. This year tractors had become common on this stretch of land, and his work became following the seeder, watching whether the seed leaked properly and whether the depth was right. He crouched on the ridge, opened a newly covered furrow with his fingers, rubbed the soil, then stood and gestured to the tractor driver. The gesture meant: one knuckle deeper.\n\nThe driver was a young man who had come from the city last year. He drove the tractor well, but knew the land poorly. He stopped, adjusted the sowing depth by one notch, and looked back at Kuzma Ilyich. Kuzma said nothing, only nodded, then bent to pick several small stones exposed on the ridge and threw them into the basket.\n\nAfter that, he noticed that some collective farm members came to ask him things during breaks. Some asked what suited a certain field, some brought leaves eaten by insects for him to inspect, and some asked how to adjust the angle of the ploughshare entering the soil. He spoke little, but his answers were practical. When asked about leaves bitten by insects, he merely crouched, turned the soil around the roots, searched for a while and drew out a grey-brown grub with his fingertips, placing it on the leaf. “This. Turn the soil deep once, bring the eggs to the surface, and the frost will kill them.”\n\nLater he discovered that his grain ration occasionally contained an extra piece of salted lard or a few potatoes. No one admitted placing them there, and no one asked who had.\n\nHe later found that the collective farm used a new variety, ten days earlier than the one he had planted in the past, with fuller ears. At harvest, he stood at the edge of the field and watched the harvester pass, the granary filling little by little. No one asked him how it was, and he said nothing. That day, after returning home, he did not open the box again."
  rus_maximalist_land_reform_events.53.desc_2: "One evening, the young man, now deputy team leader of the collective farm, found him on the ridge, holding half an ear of wheat. “Uncle, take a look. Is something wrong with this? The tip is black.”\n\nKuzma Ilyich took it, pinched it, looked at the black grains at the tip against the setting sun, then broke one open and smelled it.\n\n“Rust.” He handed the ear back. “There was some last year too. Not serious. This year it was planted too densely and there was not enough air. Next year widen the row spacing by two inches and it will be fine.”\n\nThe young man put the ear in his pocket and was silent for a moment. “How do you know it is rust and not something else?”\n\nKuzma Ilyich did not answer. He crouched, took a handful of soil, rubbed it and let it fall between his fingers. Behind him two people walked past carrying shovels. One stopped to ask the young man which field would be turned tomorrow. The young man pointed, and the man answered all right, then casually asked Kuzma Ilyich whether he wanted to walk with them. He stood, patted the soil from his hands.\n\n“I have farmed for thirty years. I know little else, but I recognise this.”\n\nAfter walking a few steps, he turned back and added: “If the rust spreads, pull the diseased plants and burn them every other ridge. Do not be reluctant.”\n\nThat night, Kuzma Ilyich took the bag of seed from the box, untied the cloth and held a few grains in his palm for a long time. The next morning he brought it to the collective farm seed warehouse and placed it on the keeper's desk.\n\n“This is an old variety,” he said. “It resists lodging, but its yield is lower than the new one. Keep a little. If one year the weather is bad and the new variety cannot stand it, this can still hold.”\n\nThe keeper was a young man. He looked at the bag, then at him. “How do you know the new variety cannot stand it?”\n\n“I do not know.” Kuzma Ilyich shook his head. “But with land, nothing is certain. It is always good to keep one more hand.”\n\nWhen he left the seed warehouse, the sky was already bright. In the fields, tractors were turning the land in the distance, rows of black earth rolling up under the sun as if the earth were turning over. He stood at the warehouse door for a while. A neighbour carrying a shovel passed by and nodded to him; he nodded back. Then he turned and walked toward the land he had farmed for thirty years. No, it was no longer his land. But the land was still there. And this winter, beside his family's woodpile, there had been an extra bundle of split firewood, placed there by someone unknown. He thought for a moment, then carried the wood inside."
  rus_maximalist_land_reform_events.53.a: "That was enough."
