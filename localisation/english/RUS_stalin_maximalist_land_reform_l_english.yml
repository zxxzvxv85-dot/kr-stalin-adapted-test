  RUS_maximalist_land_reform_category: "Maximalist Land Reform"
  RUS_maximalist_land_reform_category_desc: "The Maximalist programme has passed the congress. Mechanisation, literacy work, livestock reorganisation and model collective farms will advance the reform step by step.\n\nCurrent land reform score: §Y[?RUS_maximalist_land_reform_score|0]§!/§Y100§!\nCurrent stage: [ROOT.RUSGetMaximalistLandReformCurrentStage]/§Y5§!\nNext stage: [ROOT.RUSGetMaximalistLandReformNextStage]"
  RUS_maximalist_land_reform_mission: "Maximalist Land Reform"
  RUS_maximalist_land_reform_mission_desc: "The Maximalists must prove that their programme can transform the Russian countryside. If reform progress reaches §Y100§!, the land reform will be completed successfully; otherwise it will end in stagnation."
  RUS_maximalist_land_reform_active_slot_tt: "Fewer than §Y2§! land reform decisions are currently active."
  RUS_maximalist_land_reform_cancel_if_finished_tt: "Land reform has already been successfully completed."
