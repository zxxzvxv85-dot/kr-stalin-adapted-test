 RUS_agri_annual_shortfall:0 "Annual Agricultural Shortfall"
 RUS_agri_annual_shortfall_desc:0 "The previous operating year failed to preserve the state's investment, forcing the civilian economy to cover the shortfall."
 RUS_agri_annual_surplus:0 "Annual Agricultural Surplus"
 RUS_agri_annual_surplus_desc:0 "The previous operating year produced a stable surplus for state use."
 RUS_agri_annual_bumper_surplus:0 "Bumper Agricultural Surplus"
 RUS_agri_annual_bumper_surplus_desc:0 "The previous operating year produced a considerable surplus, easing civilian burdens and supplying the construction sector."
 RUS_agricultural_management.1.t:0 "Annual Agricultural Settlement"
 RUS_agricultural_management.1.d.shortfall:0 "This year's operating ledgers have been consolidated. Only §Y[?RUS_agri_annual_ending_capital|1]§! capital remains, leaving a clear operating shortfall. Resources must be drawn from the civilian economy, while the management offices will face stricter scrutiny next year."
 RUS_agricultural_management.1.d.balanced:0 "This year's operating ledgers have been consolidated. Ending capital stands at §Y[?RUS_agri_annual_ending_capital|1]§!, broadly preserving the original investment. There is no surplus to celebrate, but neither has the plan imposed a new burden on the economy."
 RUS_agricultural_management.1.d.surplus:0 "This year's operating ledgers have been consolidated. Ending capital reached §Y[?RUS_agri_annual_ending_capital|1]§!, yielding a stable surplus that will ease part of the civilian economy's burden over the coming year."
 RUS_agricultural_management.1.d.bumper:0 "This year's operating ledgers have been consolidated. Ending capital reached §Y[?RUS_agri_annual_ending_capital|1]§!, far exceeding the original investment. The plan has produced a handsome surplus and released additional resources for national construction."
 RUS_agricultural_management.1.a:0 "Approve the accounts and begin the next year."
 RUS_agri_emergency_annual_cap_tt:0 "§YAn emergency advance was used this year; the annual reward cannot exceed the middle surplus tier.§!"

