 RUS_agricultural_quarterly_management_start_category:0 "Agricultural Management Preparations"
 RUS_agricultural_quarterly_management_start_category_desc:0 "The quarterly management system will remain dormant until the state formally launches its first operating plan."
 RUS_agricultural_quarterly_management_category:0 "Quarterly Agricultural Management"
 RUS_agricultural_quarterly_management_category_desc:0 "State agricultural agencies invest limited capital in five crops and settle each quarter according to the season, weather, markets and market capacity."
 RUS_start_agricultural_quarterly_management:0 "Launch the Quarterly Agricultural Plan"
 RUS_start_agricultural_quarterly_management_desc:0 "With western trade channels open once more, we can trial a state-directed system of quarterly agricultural investment. Once this decision is completed, the management panel will begin with the season corresponding to the current month."

