 RUS_agri_ledger:0 "Quarter Ledger"
 RUS_agri_ledger_tt:0 "Review last quarter's actual weather, crop markets and final returns. Both forecasts can be wrong. Actual adjustments are usually +/-0.10 or +/-0.20, rarely +/-0.40, and may be zero. Actual outcomes are revealed only at settlement."
 RUS_agricultural_management.2.t:0 "Quarterly Agricultural Ledger"
 RUS_agricultural_management.2.d:0 "Operating year [?RUS_agri_last_year|0], quarter [?RUS_agri_last_season|0]\n\nActual weather adjustment: [?RUS_agri_last_weather|2] (all crops)\n\nCrop: market / return multiplier / capacity / soil deduction\n$RUS_agri_wheat$: [?RUS_agri_last_wheat_market|2] / x[?RUS_agri_last_wheat_final|2] / [?RUS_agri_last_wheat_capacity|0] / -[?RUS_agri_last_wheat_rotation_penalty|2]\n$RUS_agri_rye$: [?RUS_agri_last_rye_market|2] / x[?RUS_agri_last_rye_final|2] / [?RUS_agri_last_rye_capacity|0] / -[?RUS_agri_last_rye_rotation_penalty|2]\n$RUS_agri_beet$: [?RUS_agri_last_beet_market|2] / x[?RUS_agri_last_beet_final|2] / [?RUS_agri_last_beet_capacity|0] / -[?RUS_agri_last_beet_rotation_penalty|2]\n$RUS_agri_flax$: [?RUS_agri_last_flax_market|2] / x[?RUS_agri_last_flax_final|2] / [?RUS_agri_last_flax_capacity|0] / -[?RUS_agri_last_flax_rotation_penalty|2]\n$RUS_agri_cotton$: [?RUS_agri_last_cotton_market|2] / x[?RUS_agri_last_cotton_final|2] / [?RUS_agri_last_cotton_capacity|0] / -[?RUS_agri_last_cotton_rotation_penalty|2]\n\nOrders: [?RUS_agri_last_orders_completed|0]; bonus: [?RUS_agri_last_order_cash|2]; points: [?RUS_agri_last_order_score|0].\nClosing capital: [?RUS_agri_last_capital|1]\n\nReturns include weather, markets, treaty, investment, saturation, soil and tiered prices. Multiplier range: 0.40-1.50."
 RUS_agricultural_management.2.a:0 "Review the accounts."
