 RUS_agricultural_management.1.t:0 "Annual Agricultural Settlement"
 RUS_agricultural_management.1.d.shortfall:0 "The four quarterly ledgers have been consolidated. Only §Y[?RUS_agri_annual_ending_capital|1]§! capital remains, leaving a clear operating shortfall. Resources must be drawn from the civilian economy, while the management offices will face stricter scrutiny next year."
 RUS_agricultural_management.1.d.balanced:0 "The four quarterly ledgers have been consolidated. Ending capital stands at §Y[?RUS_agri_annual_ending_capital|1]§!, broadly preserving the original investment. There is no surplus to celebrate, but neither has the plan imposed a new burden on the economy."
 RUS_agricultural_management.1.d.surplus:0 "The four quarterly ledgers have been consolidated. Ending capital reached §Y[?RUS_agri_annual_ending_capital|1]§!, yielding a stable surplus that will ease part of the civilian economy's burden over the coming year."
 RUS_agricultural_management.1.d.bumper:0 "The four quarterly ledgers have been consolidated. Ending capital reached §Y[?RUS_agri_annual_ending_capital|1]§!, far exceeding the original investment. The plan has produced a handsome surplus and released additional resources for national construction."
 RUS_agricultural_management.1.a:0 "Approve the accounts and begin the next year."
