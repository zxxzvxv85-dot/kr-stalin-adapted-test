 RUS_stalin_bryukhanov_sketch_events.1.t: "An Informal Sketch"
 RUS_stalin_bryukhanov_sketch_events.1.d: "Today, a senior official in the economic administration drew a black-ink caricature of People's Commissar for Finance Nikolai Bryukhanov suspended by his testicles. Stalin happened upon the drawing and added a note of his own:\n\n“To the members of the Politburo: For all his present and future sins, Bryukhanov ought to be hung by the testicles. If they hold, he shall be considered acquitted by the court; if they do not, he shall be drowned in the river.”"
 RUS_stalin_bryukhanov_sketch_events.1.a: "This sketch had best remain within the Politburo."
