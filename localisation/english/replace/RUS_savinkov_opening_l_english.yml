 rus_opening.1.t: "投鼠忌器"
 rus_opening.1.d: "彼得·尼古拉耶维奇并非没有察觉到部下日益焦躁的情绪。\n\n\n在他那间悬挂着黑海舰队海图的办公室里，贵族军官们已经不止一次将目光瞟向墙上的军刀，言辞间满是历史典故，但都充斥着劝诫的味道。可尼古拉耶维奇仍对军事政变的可行性心存疑虑——毕竟成王败寇，科尔尼洛夫殷鉴不远。\n\n\n前车之覆，后车之鉴。没有绝对的把握，彼得·尼古拉耶维奇绝不愿去做第二个科尔尼洛夫。\n\n\n更何况，他也实在拿不准其他派系的军官是否会给予他支持。军队从来不是铁板一块。贵族同仁们自然会携手相助，可战壕里晋升的共和派将领呢？那些坐视帝国坍塌的前参谋部军官呢？一旦反旗升起，多少人会拔刀响应，多少人会冷眼旁观，甚至倒戈一击？\n\n\n尤其是那个乡巴佬，安东·伊万诺维奇。那个出身农奴家庭的半吊子将军，凭几场硬仗在军中挣得了声望，如今几乎能与自己分庭抗礼。这个固执、自负、满脑子旧式“俄罗斯母亲”情结的泥腿子将领，未必愿意跟着他去冒天下之大不韪；甚至，他可能会为了抱着所谓“共和军人”的邪恶思想，反过来充当现政府的鹰犬。\n\n\n弗兰格尔站起身，走到窗前，盯着窗外灰蒙蒙的夜色，手指无意识地敲击着窗台——局势已经到了非变不可的地步，动手的时机却又被这些桎梏死死卡住……"
 rus_opening.1.a: "“姑且悬心以待。”"
 rus_opening.2.t: "投鼠忌器"
 rus_opening.2.d: "安东·伊万诺维奇并非没有注意到军营里那股暗流涌动的气氛。\n\n\n在他那间挂着巨幅前线态势图的指挥部里，军官亲信们已经不止一次在递送情报时欲言又止。那紧绷的下颌线和刻意压低的声音，无一不在表达着对“萨文科夫政府”的不满。但他依旧怀疑军事政变的可行性——军队只会在尘埃落定时为胜者加冕，指望他们提前下注是不可能的。\n\n\n没有争取到政党的支持，军队本身是不可能接管政权的。瓦西里·博尔德列夫拿着救国的旗号也没能接管政府，如今打着“反对独裁”的幌子难道就能成功吗？\n\n\n更何况，他也实在拿不准其他军区的军官是否会予以他支持。军队这地方，从来就不是铁板一块。那些在战壕里跟他一起啃过黑面包的步兵将领们自然向着他，但那些满脑子旧式贵族做派的骑兵老爷呢？那些在后方的参谋部官僚呢？一旦他举起反旗，究竟有多少人会拔刀响应，又有多少人会冷眼旁观，甚至反咬一口？串联的风险太大了，谁也不清楚“元首”的手究竟伸到了哪里。\n\n\n那个“黑男爵”，彼得·尼古拉耶维奇。那个出身显赫、自命不凡的大统领，凭借着一身贵族傲气在军中挣得了声望，这家伙可不一定会在关键时候站到他那一边。一个固执、自负、满脑子“正统皇权”情结的贵族老爷，未必跟他有同样的思想。甚至，他可能会为了维持所谓“皇族荣耀”，反过来充当黄雀，借重整秩序之名来清洗自己。\n\n\n邓尼金站起身，走到窗前，盯着窗外泥泞的军营小道。他的手指无意识地摩挲着腰间的配枪——局势已经到了非变不可的地步，动手的时机却又被这些桎梏死死卡住……"
 rus_opening.2.a: "“如果不是现在，还能是什么时候？”"
