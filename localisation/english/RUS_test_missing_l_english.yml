 RUS_fr_establish_political_commissar_organisation:0 "Implement the political commissar organizational system"
 RUS_fr_establish_political_commissar_organisation_desc:0 "after §Y90 days§! Reorganization, incorporating political work cadres, educational courses, and grassroots feedback channels into the unified structure of the entire military; upon completion, obtain §YPolitical Commissar Organization System§!."
 RUS_fr_establish_scientific_general_staff:0 "Establish a scientific general staff"
 RUS_fr_establish_scientific_general_staff_desc:0 "after §Y60 days§! Construction, to establish a unified data, combat model, and staff education system for the General Staff; upon completion, obtain §YScientific General Staff§!."
 RUS_fr_adopt_deep_battle_concept:0 "Implement the theory of deep operations"
 RUS_fr_adopt_deep_battle_concept_desc:0 "after §Y60 days§! Deduce, incorporate deep breakthroughs, operational reserves, and rapid reinforcement into the army's operational regulations; upon completion, obtain §YDeep Operations Theory§!."
 RUS_fr_establish_one_man_command:0 "Implement the system of leadership responsibility"
 RUS_fr_establish_one_man_command_desc:0 "after §Y60 days§! System adjustments clarify the military responsibilities of commanders and coordinate command with political work; upon completion, one receives §YChief Responsibility System§!."
 RUS_fr_adopt_revolutionary_collectivism:0 "Implement the revolutionary collectivist program"
 RUS_fr_adopt_revolutionary_collectivism_desc:0 "after §Y60 days§! Education rectification, taking collective responsibility, position resilience, and troop coordination as the focus of military construction; received upon completion §YRevolutionary Collectivism§!."
 RUS_fr_adopt_military_vanguardism:0 "Implement the program of military vanguardism"
 RUS_fr_adopt_military_vanguardism_desc:0 "after §Y90 days§! Pilot, giving priority support to experimental drafting, rapid decision-making, and highly mobile combat units; after completion, obtain §YMilitary Vanguardism§!."
 RUS_fr_adopt_revolutionary_heroism:0 "Implement the program of revolutionary heroism"
 RUS_fr_adopt_revolutionary_heroism_desc:0 "after §Y60 days§! Publicity and system construction, encouraging soldiers to take initiative through public recognition, battlefield authorization, and exemplary models; rewards are given upon completion §YRevolutionary Heroism§!."
 RUS_fr_reform_disorganisation_4:0 "Current situation of the Workers' and Peasants' Red Army: a mob"
 RUS_fr_reform_disorganisation_4_desc:0 "Although, under General Vasilevsky's defection efforts, a large number of the young and strong members of the White Bandit Army have switched sides and returned to our camp, internal problems within our army remain severe: the command system is nearly paralyzed, the militia is severely overstaffed, and enemy spies have infiltrated among them. If we truly want to forge a steel army to defend the people, we must immediately carry out a swift and thorough crackdown."
 RUS_fr_reform_disorganisation_3:0 "Current Situation of the Workers' and Peasants' Red Army: Everything Needs to Be Rebuilt"
 RUS_fr_reform_disorganisation_3_desc:0 "After the rectification, the Red Army finally shook off its bloated burdens, but it was still worlds away from being a truly regular army. Most of the lower-level officers were from former uprising forces and held outdated tactical ideas; the newly recruited soldiers, though enthusiastic, could not even march in basic formation. For the time being, the only strategy was to grasp the essentials. Only when the battalion and company structures were complete and commands could reach platoons and squads would this army be considered to have taken its initial shape."
 RUS_fr_reform_disorganisation_2:0 "Workers' and Peasants' Red Army Status: Tempered into Steel"
 RUS_fr_reform_disorganisation_2_desc:0 "The organization and regulations written on paper must return to the training ground, tested by sweat and corrected over time. The formation of an army is never accomplished by a single order—it requires honing through repeated drills, exposing problems in live-fire exercises, and gradually narrowing the gap between theory and actual combat in every practice."
 RUS_fr_reform_disorganisation_1:0 "Current Situation of the Workers' and Peasants' Red Army: A Stream of Iron for Ten Thousand Miles"
 RUS_fr_reform_disorganisation_1_desc:0 "Borrowing an Eastern proverb—'Everything is ready, but the east wind is lacking'—to describe the Red Army at this moment is nothing short of apt. With new equipment being gradually deployed, the quality of the Workers' and Peasants' Red Army is steadily improving. Our soldiers have learned to operate the new equipment, commanders are assimilating the new tactical regulations, and the logistics system is gradually extending to more distant fronts. We are already lying on our arms, ready to launch an assault on the fortresses of the old world."
 RUS_fr_reform_disorganisation_0:0 "Current Situation of the Workers' and Peasants' Red Army: A Stream of Iron for Ten Thousand Miles"
 RUS_fr_reform_disorganisation_0_desc:0 "Borrowing an Eastern proverb—'Everything is ready, but the east wind is lacking'—to describe the Red Army at this moment is nothing short of apt. With new equipment being gradually deployed, the quality of the Workers' and Peasants' Red Army is steadily improving. Our soldiers have learned to operate the new equipment, commanders are assimilating the new tactical regulations, and the logistics system is gradually extending to more distant fronts. We are already lying on our arms, ready to launch an assault on the fortresses of the old world."
