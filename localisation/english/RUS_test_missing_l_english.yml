l_english:
 RUS_fpc_tank_tier_3_tt:0 "§YArmored Vehicle Program§! Optimization level reached §Y2§!"
 RUS_fpc_infantry_tier_3_tt:0 "§YInfantry Equipment Plan§! Optimization level reached §Y2§!"
 RUS_fr_post_revolutionary_armed_forces:0 "Armed Forces After the Revolution"
 RUS_fr_post_revolutionary_armed_forces_desc:0 "The revolution seized the state, but it did not immediately bring forth an army capable of defending the revolution. Military districts, warehouses, and staff organs left by the old regime still operated according to yesterday's practices, and returning Red Army cadres and workers and soldiers from various places had not yet been incorporated into a unified military system. Frunze demanded that we first take stock of this chaotic legacy: preserve all usable expertise, eliminate reactionary networks, and make the Red Army once again a reliable armed force in the hands of the labor republic."
 RUS_fr_frunze_defence_report:0 "Timoshenko's Army Reorganisation Report"
 RUS_fr_frunze_defence_report_desc:0 "By order of Frunze, Timoshenko visited the military district headquarters, training camps, and front-line units, documenting the problems that had long been concealed by reports in a single report. Officer factions, organizational confusion, insufficient training, and disconnection from the military industry could no longer be explained as temporary difficulties after the revolution. The Military Commission would use this report as a basis to establish a clear order for eliminating hidden dangers, reorganizing the military system, and rectifying the defense industry."
 RUS_fr_unified_military_leadership:0 "Commander Responsibility System"
 RUS_fr_unified_military_leadership_desc:0 "The revolutionary army must not retrace the path of arbitrary and overbearing old officer corps, but collective discussion should not become an excuse for lack of responsibility. Frunze advocated that once political supervision and soldiers' rights are institutionally guaranteed, military leaders should bear full responsibility for training, orders, and outcomes. There can be thorough debate before orders are issued, but once a decision is made, the entire army must act according to the same will."
 RUS_fr_rebuild_revolutionary_military_council:0 "Establish the State Military Commission"
 RUS_fr_rebuild_revolutionary_military_council_desc:0 "§YPrerequisite: Complete the focus 'Timoshenko's Army Report'§!\n\nDuring the civil war years, the Revolutionary Military Council had organized the scattered Red Guards, railway units, and military supply agencies into a real Red Army. Now the republic once again needs a supreme command capable of coordinating the entire military. The newly established State Military Commission will be chaired by Frunze, making strategic decisions collectively, implementing orders through professional staff, and ensuring through political organs that the army always serves the working people. Stalin will also enter the highest command system as the commander-in-chief, taking direct military responsibility for the revolutionary government."
 RUS_fr_reorganise_general_staff_districts:0 "Unified Command and Military System"
 RUS_fr_reorganise_general_staff_districts_desc:0 "The vast distances of Russia have led each military district to develop its own forms, command formats, and mobilization habits, so that central intentions often become completely distorted in the process of transmission. Staff officers like Shaposhnikov assisted Frunze in redefining the responsibilities of the General Staff and the military districts, incorporating the principles of leadership responsibility, operational planning, and standardized organization into a single system. From then on, decisions made in Moscow should be able to reach every field unit in a clear and consistent form."
 RUS_fr_national_military_reform_program:0 "Military reorganization"
 RUS_fr_national_military_reform_program_desc:0 "Patchwork repairs can no longer solve the structural problems faced by the Red Army. Frunze will bring the General Staff, military districts, academies, and political organs to the same conference table, so that training, mobilization, operational theory, and cadre development are subordinated to a nationwide military reorganization plan. The reform will not end with a few new regulations; it will penetrate every level of command and every barracks until the temporary military system of the revolutionary war period is completely reorganized."
 RUS_fr_cadres_decide_everything:0 "Political Commissar Organizational System"
 RUS_fr_cadres_decide_everything_desc:0 "Guns and cannons will not understand the purpose of a revolution on their own, and orders cannot replace the political trust between officers and soldiers. We will establish a network of political commissars extending from the Military Commission to grassroots companies, unifying cadre education, disciplinary appeals, and political work within the troops. The political commissar will no longer be just an agitator in times of crisis or a monitor behind the officers, but will become a formal link connecting the Party, commanders, and ordinary soldiers."
 RUS_fr_equipment_is_the_armys_skeleton:0 "Scientific General Staff"
 RUS_fr_equipment_is_the_armys_skeleton_desc:0 "Courage can win a charge, but it cannot alone design a campaign that spans hundreds of kilometers. The General Staff must free itself from the control of personal experience and factional habits, making cartography, statistical data, wargaming, and the study of military history the common language for planning. The reorganized staff agencies will continuously test their own judgments, transforming lessons from the front into military knowledge usable by the entire army."
 RUS_fr_train_before_expansion:0 "Deep Battle Theory"
 RUS_fr_train_before_expansion_desc:0 "Young theorists such as Triandafillov pointed out that the outcome of modern warfare will not be decided at the first trench. The Red Army must simultaneously organize frontal breakthroughs, the deployment of reserves, and deep pursuit, causing the enemy's artillery, transportation, and command systems to collapse under continuous strikes. Multi-echelon coordination and rapid reinforcement will no longer be the conception of a few officers but will become the fundamental way for the entire army to understand campaigns."
 RUS_fr_red_commander_system:0 "\"Thunderstorm\" Military Academy"
 RUS_fr_red_commander_system_desc:0 "Exile, civil war, and long-term political division deprived an entire generation of Red Army officers of the opportunity for systematic training, and much valuable experience could only be passed down through personal recollections. The 'Thunderstorm' Military Academy will reconvene returning generals, frontline cadres, and military theorists to cultivate a new command collective through advanced rotational training, wargaming, and campaign studies. Here, the hierarchical barriers of the old imperial military academies should not be replicated; instead, those loyal to the revolution and truly capable should be given the opportunity to take on significant responsibilities."
 RUS_fr_unified_training_mobilisation_system:0 "Standardized Army Organization"
 RUS_fr_unified_training_mobilisation_system_desc:0 "Nowadays, units bearing the same name of infantry division may have completely different personnel, artillery, and replenishment methods. This difference is merely confusing in peacetime, but in wartime, it can be disastrous. The Military Commission will standardize the organizational tables, mobilization tables, and training cycles of divisions, armies, and military districts. Newly formed units must be able to quickly integrate into the existing command and support system, rather than reinventing their own army from scratch."
 RUS_fr_frunze_field_regulations:0 "Offensive decision-making mechanism"
 RUS_fr_frunze_field_regulations_desc:0 "Frunze consistently opposed misunderstanding the spirit of offense as a reckless frontal assault. The new decision-making mechanism will allow front-line commanders to make proactive judgments within established intentions, while requiring them to report situations quickly and maintain contact with artillery, armored units, and logistics agencies. True initiative comes from thorough preparation and clear responsibilities, not from covering up the failures of staff work with soldiers' lives."
 RUS_fr_general_staff_experimental_formations:0 "Strict training system"
 RUS_fr_general_staff_experimental_formations_desc:0 "Timoshenko sharply pointed out in the military report that the excellent performance of many units only existed on pre-arranged inspection grounds. Future training will adopt unified assessments, live-fire exercises, and surprise confrontation drills where the results are not announced in advance, and no command headquarters can replace combat capability with impressive reports. Strict training is not meant to torture soldiers, but to equip them with the skills to survive and accomplish missions under real artillery fire."
 RUS_fr_national_mobilisation_supply_test:0 "Veteran Benchmark System"
 RUS_fr_national_mobilisation_supply_test_desc:0 "Veterans of the revolutionary war possess knowledge that no textbook can fully record: how to maintain formation in chaos, how to judge whether a charge is worth it, and how to get exhausted new soldiers back on their feet. We will incorporate these veterans into the training and assessment system, making them benchmarks for new units and teachers for grassroots officers. Personal legends will eventually fade with time, but experience that has been organized and passed on can become the tradition of the entire Red Army."
 RUS_fr_all_russian_red_army_exercise:0 "Tempered into steel"
 RUS_fr_all_russian_red_army_exercise_desc:0 "§YPrerequisite: Complete the focus 'Unified Command and Military System'§!\n\nRegulations only deserve to be called a system if they remain effective in the face of mud, fatigue, and erroneous orders. Troops from various military districts will carry out a large-scale confrontation exercise near Voronezh without preset outcomes, and the General Staff, railways, warehouses, and field hospitals must also undergo inspection. The Red Army will expose its final weaknesses in this crucible and temper itself into steel through revolutionary collectivism, military avant-gardism, and revolutionary heroism."
 RUS_fr_revolutionary_military_system_finalised:0 "The Red Army is the strongest"
 RUS_fr_revolutionary_military_system_finalised_desc:0 "From soldiers' committees to the General Staff, from military school classrooms to armored divisions, the reforms that were once fragmented have now come together into a complete revolutionary military system. The German Empire once believed that the army of the old order could forever suppress the working people of the East, and its downfall has already provided the answer. The Red Army's strength does not come from whips and blind obedience, but from conscious discipline, modern military science, and the trust of millions of people in their own army."
 RUS_fr_military_rectification:0 "Military Purge"
 RUS_fr_military_rectification_desc:0 "The open rule of the old officer corps has ended, but the influence sustained through private loyalty, secret societies, and White Army networks still lingers in several headquarters. Frunze refused to replace investigation with boundaryless panic: the disciplinary committee must rely on evidence, records, and public procedures to determine responsibility. The purpose of the purge is not to destroy military professionalism, but to free the army from counter-revolutionary factions, allowing loyalty and competence to be proven within the system."
 RUS_fr_investigate_white_networks:0 "Trial Implementation of Military Democracy"
 RUS_fr_investigate_white_networks_desc:0 "The remnants of the White Army were able to hide within the army precisely because the rank-and-file soldiers had long lacked proper channels for complaints and supervision, relying only on personal relationships with officers. The trial implementation of military democracy will allow soldiers to openly report issues related to life, training, and discipline, and to elect representatives to participate in limited grassroots supervision. Revolutionary democracy cannot replace battlefield command, but it can strip secret societies and factions of the shadow that sustains their existence."
 RUS_fr_officer_oath_service_review:0 "Construction of the Military Political Work System"
 RUS_fr_officer_oath_service_review_desc:0 "Loyalty to the revolution cannot be judged solely by a written oath. Similarly, one's background and past history should not become an indelible stigma. Political work organs will standardize the processes of officers' oath-taking, education, review of their career histories, and evaluation by the masses, determining a person's fate based on long-term performance rather than rumors. The Red Army needs professional soldiers who understand why they are fighting for the labor republic, not opportunists who are skilled at writing the right slogans on examination forms."
 RUS_fr_basic_commissar_system:0 "Military Discipline and Political Review System"
 RUS_fr_basic_commissar_system_desc:0 "Military discipline must protect the revolutionary army and cannot become a tool for personal revenge or factional struggle. The new political review system will establish clear standards of evidence, channels for appeal, and boundaries of responsibility, with cases handled jointly by political commissars, military judges, and command organs. True counter-revolutionary organizations will be eradicated, and loyal professional officers will no longer have to worry about losing their reputation and positions because of a single anonymous accusation."
 RUS_fr_soldiers_committees:0 "Soldiers' Committee System"
 RUS_fr_soldiers_committees_desc:0 "The revolution transformed soldiers from silent followers of the old army into masters of the state, but this right needed to be granted a stable and clear organizational form.\n\nSoldiers' committees would oversee food, medical care, and living provisions, convey grassroots opinions to political bodies, and assist in educational work.\n\nThey did not interfere with combat orders, but they ensured that every soldier knew why they were obeying and that their legitimate demands could be heard."
 RUS_fr_unified_military_political_system:0 "Unified military and political system"
 RUS_fr_unified_military_political_system_desc:0 "If the commander, political commissar, and soldiers' committee compete for power, even the most correct system will turn into new chaos at the front line. The State Military Commission will clarify the authority of the three: the commander is responsible for military operations, the political commissar maintains the political direction, and the soldiers' committee protects the rights and organizational life at the grassroots level. Political reliability and military efficiency are no longer seen as mutually exclusive goals, but together will form the foundation of Red Army discipline."
 RUS_fr_revolutionary_collectivism:0 "Revolutionary collectivism"
 RUS_fr_revolutionary_collectivism_desc:0 "The old world likes to attribute victory to a few brilliant generals, yet forgets the ordinary soldiers, medics, and railway workers who maintain the front lines. Revolutionary collectivism holds that the strength of the army comes from the responsibilities shared among squads, platoons, companies, and up to the entire republic. We will sustain the forces through collective training, traditions of mutual assistance, and unit honor, so that the loss or demoralization of any individual cannot easily break the entire fighting collective."
 RUS_fr_military_vanguardism:0 "Military Vanguardism"
 RUS_fr_military_vanguardism_desc:0 "The revolutionary army cannot wait to start changing until everyone has accepted the new ideas. The most outstanding officers, technicians, and soldiers will be concentrated in experimental units, taking the lead in adopting new organization structures, communication methods, and mechanized tactics. Their successes will point the way for the entire army, and their failures must also be honestly recorded, so that the cost of a single experiment can bring progress to the whole Red Army."
 RUS_fr_revolutionary_heroism:0 "Revolutionary heroism"
 RUS_fr_revolutionary_heroism_desc:0 "The labor republic needs heroes, but it does not need heroes turned into unattainable idols. We will publicly commend officers who take responsibility at critical moments, soldiers who hold their positions, and logistics personnel who prevent the troops from suffering hunger and being besieged. Every meritorious deed should become an experience the entire army can learn from, allowing individual courage to ultimately be transformed into collective fighting will."
 RUS_fr_army_mechanisation_torrent:0 "Mechanized flood"
 RUS_fr_army_mechanisation_torrent_desc:0 "A few vehicles cannot mechanize an army; true mechanization means that the organization, communication, maintenance, and command rhythm are all reorganized around vehicles. The military vanguard will be the first to deploy new equipment in continuous breakthroughs and rapid pursuits, testing the theorists' ideas in motion. If the experiment succeeds, the Red Army's offensive will no longer stop at the enemy's first line of defense, but will surge into the depth of their operations like a torrent."
 RUS_fr_guards_model_units:0 "Guards Model Unit"
 RUS_fr_guards_model_units_desc:0 "The Guard title should not be a decorative honor, but should represent the highest standard that the entire army can observe and learn from. Units tested through actual combat and exercises will take on tasks such as testing new equipment, demonstrating tactics, and training grassroots officers, and will proactively share their experiences with other units. The value of a model unit is not in creating a gap between itself and ordinary soldiers, but in demonstrating what ordinary Red Army soldiers can achieve with proper organization."
 RUS_fr_revolutionary_merit_competition:0 "Revolutionary Merit Competition"
 RUS_fr_revolutionary_merit_competition_desc:0 "In the old army, promotions relied on family background, seniority, and the private patronage of commanders. In the revolutionary army, however, truly capable people must stand out.\n\nPublic battle achievements, evaluations by the masses, war game results, and professional assessments will together determine an officer's future, and lessons from failures will also be included in the evaluation.\n\nThe merit competition does not encourage exaggerating accomplishments, but forces officers to continuously prove that they can indeed lead soldiers to victory."
 RUS_fr_people_and_revolutionary_army:0 "People's Army and Revolutionary Army"
 RUS_fr_people_and_revolutionary_army_desc:0 "An army that separates itself from the people will sooner or later become a tool to oppress the people again; an army that forgets the purpose of the revolution will only shed blood for borders and the ambitions of generals. The Red Army must simultaneously be a people's army supported by workers and peasants and supervised by the people, as well as a revolutionary army willing to defend the cause of liberation for workers worldwide. No matter how collectivism, vanguardism, or heroism develop, this fundamental nature must not be shaken."
 RUS_fr_federal_armaments_defence_industry_commission:0 "Federal Armaments and Defense Industry Commission"
 RUS_fr_federal_armaments_defence_industry_commission_desc:0 "For a long time, the General Staff proposed requirements, the planning agencies allocated production capacity, and the design bureaus pursued their own plans, yet the three rarely truly sat together. The Federal Armaments and Defence Industry Commission will become a permanent body connecting the military, the Federal Planning Committee, and the defense industry organizations, translating battlefield experience into technical specifications, and then turning those specifications into orders that factories can execute. Frunze required soldiers to learn to understand the limits of industry, and also required engineers to realize that every figure ultimately relates to the lives of frontline soldiers."
 RUS_fr_light_weapons_artillery_design:0 "General Outline of Army Weapon Design"
 RUS_fr_light_weapons_artillery_design_desc:0 "The Red Army's infantry weapons and artillery came from different eras, different factories, and even served mutually contradictory tactical concepts. The new design program would be proposed by the General Staff to outline common tactical requirements, and then handed over to engineers to transform these requirements into caliber, weight, range, and production specifications. Firearms, support equipment, and artillery equipment would no longer be unrelated industrial products, but would collectively form a complete weapon system that infantry divisions could rely on."
 RUS_fr_small_arms_standardisation_committee:0 "Individual Weapons Standardization Committee"
 RUS_fr_small_arms_standardisation_committee_desc:0 "Ordnance factories across the country are still using different blueprints, tolerances, and parts catalogs. A rifle could be repaired in Tula, but if sent to Siberia it might only be dismantled as scrap. The Small Arms Standardization Committee will convene factory representatives, quartermasters, and frontline veterans to make rulings on calibers, components, and production standards item by item. Standardization does not mean rejecting improvements; it is meant to allow every improvement to be quickly adopted by the entire federation's industry."
 RUS_fr_artillery_ammunition_technical_committee:0 "Artillery and Ammunition Technology Committee"
 RUS_fr_artillery_ammunition_technical_committee_desc:0 "A high-performance artillery piece, if it lacks reliable ammunition, towing vehicles, and a stable production line, can only remain on the test field. The Technical Committee will incorporate the design and production capabilities of Obukhov, Bryansk, and Tula into a joint plan, standardizing the prototype procedures for barrels, ammunition, and towing equipment. Artillery officers will also directly participate in the reviews, so that engineers no longer design weapons merely for impressive range figures."
 RUS_fr_ergonomic_tolerance_standards:0 "Ergonomic Standards for Combat Gear"
 RUS_fr_ergonomic_tolerance_standards_desc:0 "The few hundred grams of weight and a few centimeters in size on a design drawing will become real pain on a soldier's shoulders during long marches and continuous combat. The committee will systematically collect frontline feedback on grip, aiming, carrying, and equipment layout, allowing the weapon to adapt to the human body, rather than requiring people to endure poor design. Engineers must step out of the office, because whether a piece of equipment is qualified must ultimately be answered by the Red Army soldiers who use it in combat."
 RUS_fr_soldier_load_lightening_program:0 "Outline for Lightweight Individual Soldier Load"
 RUS_fr_soldier_load_lightening_program_desc:0 "Every item carried by Red Army soldiers has a purpose, but not every item needs to be carried by the same person. The logistics department will review packaging, materials, ammunition quantities, and squad carrying responsibilities, shifting the weight that can be handled by vehicles and collective equipment off individual shoulders. Reducing the load is not about seeking comfort, but about ensuring that the troops still have the energy to fight, dig, and keep moving once they reach the battlefield."
 RUS_fr_soldier_load_lightening_specialisation_tt:0 "emphasize §YGeneral Outline of Army Weaponry Design§! Additionally received:\nSpecial Forces Capacity Limit Multiplier:§G+20.0%§!\nRangers Special Forces Capacity Contribution:§G-20.0%§!"
 RUS_fr_divisional_artillery_support_standard:0 "Regimental Artillery Support Standard"
 RUS_fr_divisional_artillery_support_standard_desc:0 "If artillery is only temporarily assigned before major offensives, infantry will never learn how to fight relying on firepower. Each infantry division should have a stable artillery organization, an ammunition stockpile, and fire liaison personnel, and the coordination procedures on the training ground must be exactly the same as in wartime. When a frontline company requests support, what they need to hear is a response from familiar artillery units, not protracted bargaining between headquarters."
 RUS_fr_armaments_quality_assurance_inspectorate:0 "Military Product Quality Acceptance System"
 RUS_fr_armaments_quality_assurance_inspectorate_desc:0 "Planned figures can prove how many weapons the factory has delivered, but they cannot prove whether these weapons can function in extreme cold, mud, and under fire. Independent inspectors will have the authority to reject non-compliant batches, trace the causes of failures, and demand redesigns, and the factory director can no longer suppress quality reports by citing the completion of production targets. The honor of socialist industry should not be built on reports but on the fact that soldiers can trust their own equipment."
 RUS_fr_self_propelled_support_fire_trials:0 "Self-supported combined firepower test"
 RUS_fr_self_propelled_support_fire_trials_desc:0 "The advance speed of mechanized troops is surpassing the ability of traditional artillery to reposition, and breakthrough columns cannot always stop to wait for artillery. Artillery engineers, vehicle design bureaus, and field units will jointly test self-supporting platforms capable of accompanying front-line maneuvers, recording the conflicts between chassis load capacity, firing stability, and supply consumption. Whether the tests ultimately lead to self-propelled artillery or other heavy firepower, they will force two long-separated technical departments to learn to cooperate."
 RUS_fr_combined_arms_support_standard:0 "Army Weapons System Finalization"
 RUS_fr_combined_arms_support_standard_desc:0 "After multiple rounds of committee review and troop testing, infantry weapons, artillery, ammunition, and support platforms can finally be produced according to the same set of tactical requirements. The Federal Armaments Committee will incorporate these achievements into the formal army weapons system, ending the era of design bureaus acting independently. Future equipment upgrades will no longer be just about replacing a weapon with a higher-performing one, but about ensuring that the entire infantry division can train, supply, and fight around it."
 RUS_fr_mechanisation_wave:0 "Outline for the Mechanization and Mobilization of the Army"
 RUS_fr_mechanisation_wave_desc:0 "The vastness of Russia has swallowed countless offensives, and after gaining a victory, troops often could only watch as the enemy regrouped on railways and roads. The mechanization of the army will simultaneously expand vehicle production, driver training, road support, and maintenance capabilities, making speed no longer the privilege of just a few cavalry and reconnaissance units. The Red Army must learn to make the entire operational system move, not just install more engines in the old formations."
 RUS_fr_mechanised_platform_research_committee:0 "Mechanized Platform Research Committee"
 RUS_fr_mechanised_platform_research_committee_desc:0 "In the past, automobile factories, engine factories, and military design departments each pursued their ideal models, resulting in complicated parts, difficult maintenance, and repeated waste of production capacity. The Mechanization Platform Research Committee will coordinate vehicle enterprises in Moscow, Nizhny Novgorod, and other locations, establishing a technical foundation that can be shared by trucks, tracked vehicles, and general-purpose chassis. Engineering standardization will pave the way for large-scale production and also spare field repair workshops from having to deal with endless parts catalogs."
 RUS_fr_rapid_mobility_equipment_trials:0 "Rapid Maneuver Equipment Test Outline"
 RUS_fr_rapid_mobility_equipment_trials_desc:0 "A brief high-speed test on the proving ground cannot determine whether a vehicle is suitable for Russian warfare. New equipment will undergo long-distance marches, rough roads, low-temperature startups, and wartime repair inspections, and the reports from drivers and maintenance personnel will be as important as engineering data. The test results will force the committee to make trade-offs: whether to prioritize expanding a reliable vehicle industry and building specialized mechanized logistics, or to invest resources in a bolder rotary-wing aircraft program."
 RUS_fr_vehicle_manufacturing_integration:0 "Vehicle Manufacturing Process Integration"
 RUS_fr_vehicle_manufacturing_integration_desc:0 "Some engineers hope to continue chasing new models with astonishing performance, but frontline officers need thousands of reliable vehicles that can arrive on time. We will focus on improving existing chassis, engines, and assembly lines, allowing different factories to expand production according to common standards and making parts interchangeable under field conditions. Quantity, reliability, and maintenance compatibility will take precedence over the record-setting feats of a few prototypes on the test track."
 RUS_fr_mechanised_logistics_regulations:0 "Regulations on Mechanized Logistics Services"
 RUS_fr_mechanised_logistics_regulations_desc:0 "The true limits of a mechanized force are not the thickness of its armor or the power of its engines, but the distance that fuel, spare parts, and repair personnel can reach. The new regulations will integrate transport battalions, maintenance battalions, and fuel convoys into the operational structure, allowing logistics officers to participate in planning before the offensive begins. Tanks and trucks should not turn into abandoned steel at the end of the road; specialized support must follow them throughout the depth of the campaign."
 RUS_fr_mechanised_logistics_non_mobility_bonus_tt:0 "Not emphasized §YOutline for the Mechanized Construction of the Army§! time,§YCurrent Situation of the Workers' and Peasants' Red Army§! Additional effect:\nSupply consumption:§G-10.0%§!"
 RUS_fr_helicopter_pilot_program:0 "Rotorcraft Verification Program"
 RUS_fr_helicopter_pilot_program_desc:0 "Rotary-wing aircraft are still regarded by many old-school officers as engineers' toys, but their demonstrated vertical takeoff and landing capabilities may change the way troops understand distance. Aviation technicians and volunteer pilots will incorporate engines, rotor structures, and transport missions into a formal validation program, accumulating knowledge that no ready-made manuals can provide through accidents and failures. If this path proves feasible, rivers, mountains, and damaged roads will no longer have the obstructive power they once did."
 RUS_fr_rapid_operational_corps:0 "Reinforced Mechanized Combat Group"
 RUS_fr_rapid_operational_corps_desc:0 "A unit that only has vehicles but lacks independent command, firepower, and support capabilities is still just infantry on wheels. Based on improved vehicle industry or specialized mechanized logistics, the Red Army will form heavily armed combat groups capable of independently carrying out breakthroughs, pursuits, and deep operations. They must continue fighting after leaving the main force of the army group, turning a brief tactical gap into an irrecoverable operational collapse for the enemy."
 RUS_fr_air_assault_brigades:0 "Airborne Infantry Experimental Organization"
 RUS_fr_air_assault_brigades_desc:0 "If rotary-wing aircraft are used solely to transport officers and documents, they will never prove their military value. We will form experimental units from the best light infantry, pilots, and communications personnel, training them to seize bridges, airfields, and command nodes by crossing front-line obstacles. This is an expensive and exclusive path, one that will consume resources that would otherwise go to the vehicle industry and mechanized logistics, but it may also create a kind of mobility that no old army has ever possessed."
 RUS_fr_deep_mobility_program:0 "High-Speed Deep Maneuver Outline"
 RUS_fr_deep_mobility_program_desc:0 "The significance of vertical maneuvering is not in performing a single daring raid, but in making the enemy lose safe zones throughout their entire depth. Airborne infantry, long-range reconnaissance, and rapid campaign command will be incorporated into a common framework, organizing operations around transportation hubs, artillery positions, and reserve assembly points. The Red Army will attempt to bypass the enemy’s strongest front and cut off the entire defensive system before they even understand what has happened."
 RUS_fr_emphasise_armour_design:0 "Armored Weapons Development Outline"
 RUS_fr_emphasise_armour_design_desc:0 "Russia has many excellent tank design bureaus and heavy industry centers, but it lacks an armored program that can make them serve a unified operational concept. The committee will bring design bureaus, metallurgy units, artillery departments, and testing grounds under unified leadership, with armored officers proposing the problems that truly need to be solved. Tanks will no longer be isolated works of engineers competing with each other, but will become part of the Red Army's breakthrough, mobility, and firepower system."
 RUS_fr_alloy_armour_standard:0 "Alloy Armor Engineering"
 RUS_fr_alloy_armour_standard_desc:0 "Armor plates of the same thickness can perform vastly differently due to differences in steel composition, heat treatment, and welding quality. The metallurgical and vehicle departments in Solmovo, Chelyabinsk, and the Urals will adopt common alloy grades, ballistic acceptance, and failure analysis standards. Every piece of test armor that is penetrated must provide useful data, so that the next tank leaving the factory does not repeat the same weaknesses."
 RUS_fr_tank_firepower_development_plan:0 "Tank Firepower Development Plan"
 RUS_fr_tank_firepower_development_plan_desc:0 "Bigger artillery does not necessarily mean a stronger tank; turret space, recoil mechanisms, aiming devices, and crew workload all come at a cost with each upgrade. The tank firepower program will involve artillery engineers, turret designers, and frontline crews in joint evaluations, establishing a continuous research and development chain from prototype guns to mass-produced modules. What we need is a complete weapon system that can reliably hit and destroy targets on the battlefield, not just a caliber that looks impressive on paper."
 RUS_fr_breakthrough_chassis_program:0 "Breakthrough universal chassis"
 RUS_fr_breakthrough_chassis_program_desc:0 "Vehicles tasked with breakthrough missions must simultaneously endure the pressures caused by heavy armor, large-caliber guns, and harsh terrain, and ordinary chassis cannot endlessly meet these demands. The design bureau will develop a universal breakthrough chassis based on load capacity, transmission, and suspension, leaving sufficient room for different superstructures to develop. It may not be the fastest or cheapest solution, but it must be able to carry the Red Army’s most powerful firepower through the enemy’s front lines."
 RUS_fr_hull_structural_durability_trials:0 "Vehicle Body Structure Durability Test"
 RUS_fr_hull_structural_durability_trials_desc:0 "The battlefield will not forgive a tank for having cracked welds, failed suspension, and overheated transmissions just because it has thick armor. The testing department will extend the vehicle's test mileage and completely dismantle any faulty vehicles to trace the root cause of every structural failure. Reliability may not be as striking as artillery or armor, but it is the prerequisite for turning a few prototype vehicles into a real armored corps."
 RUS_fr_long_range_armoured_exploitation:0 "Standards for Remote Mobile Operations"
 RUS_fr_long_range_armoured_exploitation_desc:0 "Breaking through the enemy's defensive lines is only the beginning of the armored troops' mission; the real achievements come from the subsequent pursuit and encirclement over hundreds of kilometers. The new standards for long-range mobile operations will simultaneously consider fuel, track durability, crew fatigue, radio communication, and campaign logistics, teaching armored units to continue operations without relying on railways. Any plan that only draws bold arrows on a map without calculating how a barrel of fuel will reach the front line will be rejected."
 RUS_fr_high_velocity_kinetic_gun_program:0 "High-Speed Kinetic Energy Artillery Program"
 RUS_fr_high_velocity_kinetic_gun_program_desc:0 "The contest between armor and artillery has never ceased. Weapons that are sufficient to penetrate enemy tanks today may be defeated by thicker steel plates tomorrow. The Federal Armaments and Defence Industry Commission will concentrate the efforts of metallurgy, ballistics, and artillery design departments to explore anti-armor weapons with higher initial velocity and stronger penetration. In the future, no matter what steel monsters the enemy brings to the battlefield, the Red Army must have the means to destroy them head-on."
 RUS_fr_universal_hull_standards:0 "Standardization of armored vehicle components"
 RUS_fr_universal_hull_standards_desc:0 "Redesigning the entire vehicle for each type of task not only wastes engineering time but also forces factories and maintenance units to deal with an uncontrollable variety of parts. The armored department will standardize power systems, suspension, drivetrains, and interface specifications so that tanks, self-propelled artillery, and anti-tank vehicles can share as many basic components as possible. Standardization will not eliminate specialized vehicles; on the contrary, it will allow new turrets and superstructures to move from design to mass production more quickly."
 RUS_fr_self_propelled_direct_fire_system:0 "Self-propelled direct fire system"
 RUS_fr_self_propelled_direct_fire_system_desc:0 "Towed artillery can destroy fortresses, but it is difficult to consistently follow armored columns through breaches. We will mount heavy artillery on chassis capable of accompanying frontline operations, allowing self-propelled guns and assault guns to directly suppress fortifications, gun positions, and enemy forces in assembly. This way, armored troops gain heavy firepower without having to wait for rear artillery, but they also must establish correspondingly adequate ammunition and maintenance support."
 RUS_fr_armoured_firepower_coordination_standard:0 "Armored Firepower Coordination Standard"
 RUS_fr_armoured_firepower_coordination_standard_desc:0 "If tanks, self-propelled artillery, and divisional artillery each search for targets independently, no amount of firepower will not just be dispersed across the battlefield. The new coordination standards will unify radio call signs, target designation, fire zones, and reconnaissance reports, allowing armored formations to quickly concentrate fire at decisive points. Commanders, artillery observers, and staff officers must learn to use the same language to make steel truly an organized force."
 RUS_fr_land_warfare_mainstay:0 "Unified Armored Weapon System"
 RUS_fr_land_warfare_mainstay_desc:0 "From alloy armor and general-purpose chassis, to tank guns, self-propelled artillery, and long-range support, the achievements that were once scattered across various design bureaus can now operate around the same campaign missions. Armored weapons are no longer isolated prototype vehicles on parade grounds, but have become a complete system with shared components, unified fire control procedures, and a reliable industrial backbone. The Red Army can finally regard armored forces as an independent mainstay in land combat, rather than just auxiliary weapons temporarily assigned to the infantry."
 RUS_fr_armaments_construction_stage_summary:0 "Summary of the Armament Development Stage"
 RUS_fr_armaments_construction_stage_summary_desc:0 "The committees in the three areas of infantry weapons, operational mobility, and armored engineering have submitted the results of this phase, but they have also left behind conflicts over steel, machine tools, and skilled workers. The Federal Armaments and Defence Industry Commission will compile test reports, factory data, and frontline opinions, integrating the fragmented systems into the unified construction achievements of the People's Army. The next phase of the federal plan will not satisfy everyone's wishes equally but will determine where the Republic directs its most valuable industrial strength based on the military priorities we have already chosen."
 RUS_fr_armaments_summary_integration_tt:0 "All produced under the Federal Armaments and Defence Industry Commission's plan §YNational Spirit§! will be integrated into §YWorkers' and Peasants' Red Army Current Situation: Invincible and Legendary§!"
