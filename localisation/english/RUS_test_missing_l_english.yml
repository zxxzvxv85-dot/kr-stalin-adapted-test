 RUS_semyon_timoshenko_high_command_desc:0 "§YBorn:§!§LFebruary 16, 1895; Orman, Bessarabia Province, Russian Empire§!\n §YBackground:§!§LTimoshenko was born into a Ukrainian peasant family and was the youngest of seventeen children. Growing up among the fields, markets, and on horseback, he learned Russian, Ukrainian, and Moldovan in his hometown. He could chat, argue, and haggle with different people in three local dialects, and he also early on laid the foundation for being able to get along well with soldiers.§!\n\nThe §Lshelling of World War I cut off his youthful years. Timoshenko enlisted, and due to his quick reflexes and near-innate sensitivity to firearms, he was selected for systematic training at the Machine Gun School in Oranienbaum. He eventually graduated with the rank of sergeant major and became a member of the 4th Cavalry Division of the Western Front. Through the long trenches and swamps on the Eastern Front, he quickly transformed from a recruit into a veteran. The battle that made him famous was the brutal defense of the Osovitz Fortress. After German poison gas swept across the battlefield like a green cloud, he remained stubbornly defended by the machine gun despite his bloodied face, launching a desperate counterattack later called the \"Charge of the Dead\" with surviving comrades. By the end of the war, he wore three St. George Crosses on his chest, each stained with smoke and the price of survival. However, near the end of his service, unable to endure an officer's unreasonable public humiliation, he angrily punched him down and was arrested. The Russian army's military law was as strict as iron, and he could not escape severe punishment, but the storm of the February Revolution suddenly struck, and he regained his freedom §!\n\n §LAfter the outbreak of the Russian Civil War, Timoshenko did not hesitate to join the Red Army and headed to the Southern Front. During those fierce years of close combat, he met Joseph Dzhugashvili and Budyonny, along with other Bolshevik commanders who would later shock the world, and officially joined the RCP(b) in 1919. In the seesaw battle to defend Tsaritsyn, he led a cavalry reconnaissance detachment to repeatedly engage Wrangel's White Army, often facing overwhelming odds, stubbornly holding off the enemy's advance. Although the Red Army troops repelled the White Army's waves of attacks again and again, the situation ultimately collapsed like a mountain breaking apart. After leaving behind a promise of \"we will definitely return,\" he could only retreat with the main forces from the city that had been almost soaked in blood.§!\n\n §LBut the subsequent years of exile unexpectedly opened another door for him. He received personal guidance from Red Army's outstanding commander Marshal Frunze and entered the Thunderstorm Military Academy in Paris, founded personally by Frunze, first as a student and later staying on as an assistant instructor. Timoshenko systematically studied the Deep Operations combat doctrine and deeply participated in the exercises and organizational reforms of the French Commune's army—on the training grounds, amid flying dust and the roar of tracks, he repeatedly tested, corrected, and reshaped his understanding of warfare. Nurtured by both fire and ink, the former cavalryman who once charged with bravery and instinct had transformed into a composed and strategically-minded capable military reformer.§!"
