 RUS_fr_armaments_report_title_armaments:0 "Army Ordnance Construction Stage Report"
 RUS_fr_armaments_report_title_mobility:0 "Military Mobilization Construction Stage Report"
 RUS_fr_armaments_report_title_armour:0 "Armored Weapons Construction Phase Report"
 RUS_fr_armaments_report_title_generic:0 "Federal Armament Development Stage Report"
 RUS_fr_armaments_report_header_armaments:0 "§gFile Number: Joint Military Industry No. 14  Classification: Internal to the Standing Committee  Attachments: 9 volumes§!"
 RUS_fr_armaments_report_header_mobility:0 "§gFile Number: Joint Forces Transport No. 9  Classification: Internal Use of the Standing Committee  Attachments: 11 volumes§!"
 RUS_fr_armaments_report_header_armour:0 "§gFile Number: Joint Equipment Review No. 11  Classification: Internal to the Standing Committee  Attachments: 13 volumes§!"
 RUS_fr_armaments_report_header_generic:0 "§gFile Number: Joint Forces Comprehensive No. 7  Classification: Executive Committee Internal  Attachments: 8 Volumes§!"
 RUS_fr_armaments_report_priority_armaments:0 "In accordance with the resolutions of the First Armaments Working Conference, the committee allocated 61% of the available hours for precision machine tools, 54% of the quota for high-quality gun steel, and 74 advanced technical teams primarily to infantry weapons and artillery engineering. As a result, 43 military enterprises were included in a unified ordering schedule, with 36 of them completing the production transfer on time. The Standing Committee believes that until the Federation completes comprehensive industrial expansion, reliable and standardized guns and artillery will remain the Red Army's most solid backbone."
 RUS_fr_armaments_report_priority_mobility:0 "In accordance with the resolution of the First Armaments Work Conference, the committee has included 17 automobile, engine, and repair joint enterprises in the priority protection list and has dispatched more than 1,200 engineering cadres from the railway and civil transport agencies. The annual engine delivery plan has been completed by 88%, while the construction progress of military fuel storage and transportation facilities has reached 81%. The Standing Committee believes that Russia's own distance is an enemy, and the Red Army can only turn a breakthrough into an irretrievable battle victory by moving personnel, firepower, and supplies together."
 RUS_fr_armaments_report_priority_armour:0 "In accordance with the resolution of the First Armament Work Conference, the committee concentrated 9 heavy manufacturing enterprises, 4 national test fields, and 47% of the current alloy steel quota on armored vehicle engineering. The design bureaus submitted a total of 32 complete vehicle and specialized chassis proposals, of which 19 were approved for prototype or component trial production. The Standing Committee believes that future wars require the Red Army to have armored corps capable of independent breakthroughs, sustained mobility, and concentrated firepower, rather than a few experimental vehicles for parade use."
 RUS_fr_armaments_report_priority_generic:0 "The committee has completed the inventory of resources and engineering tasks for this period: of the 68 key tasks included in the unified plan, 57 were accepted on schedule, 7 were delayed, and 4 were canceled due to insufficient technical conditions. The previously conflicting targets of the General Staff, design bureaus, and production departments are being rewritten into construction standards that can be jointly implemented by the entire federation."
 RUS_fr_armaments_report_infantry_lightweight:0 "The committee adopted the joint recommendations of frontline veterans and the medical corps, and did not continue to pursue an increase in equipment quantity as the sole goal. Twelve prototype rifles, aiming devices, and combat gear were tested by six infantry divisions, totaling 18,400 officers and soldiers; after cumulative marches and shooting tests covering 1,200 kilometers, the average individual carried weight decreased by 3.7 kilograms, and non-combat attrition due to unsuitable equipment dropped by 11%. Based on this, the General Logistics Department approved a new squad load chart, with excess weight to be borne by vehicles or collective equipment."
 RUS_fr_armaments_report_infantry_artillery:0 "The committee decided to prioritize the establishment of divisional artillery over the improvement of individual soldier load. Nine experimental divisions and 312 artillery pieces participated in a joint exercise across military districts, and the average time for artillery observers to request fire support from infantry regiments was reduced from 26 minutes to 11 minutes. Artillery organization, ammunition bases, and call-for-fire procedures have now been written into common standards; in the last live-fire assessment, 73% of artillery companies were able to complete the first salvo within the prescribed time limit."
 RUS_fr_armaments_report_infantry_generic:0 "The Army Weapons Subcommittee has approved 47 standards for calibers, ammunition, and parts, and has canceled 113 conflicting old blueprints. There are still 8 plans that need continued field testing, but no arsenal now produces non-interchangeable weapons and spare parts for the same army."
 RUS_fr_armaments_report_mobility_vehicle:0 "The committee chose to unify vehicle manufacturing processes as the main approach. Moscow and other automotive industry centers compressed 1,240 duplicate parts into 463 common specifications and organized three rapid combat teams to complete a total of 3,600 kilometers of road marches. Of the 872 vehicles participating in the trial, 82% reached the destination without major repairs, and the average field maintenance time was 31% shorter than with the old organization. This proves that a large number of repairable vehicles is far more valuable than a few prototypes with extraordinary performance."
 RUS_fr_armaments_report_mobility_logistics:0 "The committee identified specialized mechanical logistics as the main path. Four armies, eleven divisions, and more than 5,200 vehicles participated in a six-week-long support trial. Transport battalions, maintenance battalions, and fuel convoys were incorporated into the combat plan from the start of the exercise for the first time. Fuel interruptions per 1,000 vehicle-days were reduced from 17 to 5, and 64% of mechanical failures could be resolved in field repair stations; as a result, mechanized operations achieved sustainability for the first time."
 RUS_fr_armaments_report_mobility_air_assault:0 "The committee approved tests for the highest-risk rotary-wing aircraft and airborne assault. Twenty-four prototypes completed 417 flight sorties, and three reinforced companies successively carried out river crossings, bridge seizures, and behind-enemy-lines landings; five aircraft were scrapped due to accidents, and another seven needed to be returned to the factory for major repairs. These losses have all been faithfully recorded in the appendix. However, in the final assessment, the assault detachments captured the planned objectives 6 hours and 40 minutes ahead of the ground vanguard. The Standing Committee believes that while this project is still far from maturity, it has already demonstrated that the depth of a campaign is no longer necessarily constrained by ground transportation."
 RUS_fr_armaments_report_mobility_generic:0 "The Motorization Subcommittee has completed 36 standards for vehicle interfaces, maintenance tools, and transportation organization, and seven military regions have established the first batch of unified spare parts warehouses. The debate over whether the next step should be to expand vehicle production, strengthen specialized logistics, or continue exploring air mobility has not completely settled, but all plans must be based on this common industrial foundation."
 RUS_fr_armaments_report_armour_firepower:0 "The committee will focus on self-propelled direct fire and accompanying fire as special test priorities. Eleven self-propelled artillery and anti-tank prototypes completed 1,860 live-fire rounds and 340 kilometers of forced marches, with the joint verification pass rate of the gun, chassis, and ammunition interface reaching 78%. The tests also revealed issues with supply burden and vehicle lifespan, leading to the return and redesign of three plans; however, the vehicles approved for continued development are already capable of accompanying armored columns through breaches without having to wait for rear artillery at every fortified position."
 RUS_fr_armaments_report_armour_durability:0 "The committee first addressed the structural reliability issues that had long been overshadowed by the performance of prototype vehicles. Sixteen chassis were driven a total of 9,700 kilometers on muddy, frozen, and gravel roads, among which six failed to meet the minimum lifespan requirements and were halted from further production testing. After two rounds of improvements, drivetrain failures per 1,000 kilometers decreased from 6.4 to 2.1, and the average lifespan of the tracks increased by 38%. Although the new vehicles' theoretical performance did not significantly improve as a result, they were finally able to continue completing operational missions after leaving the railway and repair facility."
 RUS_fr_armaments_report_armour_generic:0 "The Armored Weapons Subcommittee has completed 22 standards for chassis, turrets, and maintenance interfaces, and has conducted cumulative durability tests covering more than 6,000 kilometers on 27 prototype vehicles. Each design bureau can still retain its own technical traditions, but from now on, any vehicle must prove that it can enter a unified production and support system, rather than just achieving impressive results on the test range."
 RUS_fr_armaments_report_conclusion_armaments:0 "Based on this, the Standing Committee recommends that the next phase of the federal program continue to prioritize the supply of firearms, artillery, ammunition, and quality inspection systems, and promote the standards established in this phase to all military district warehouses and ordnance enterprises. The mechanized and armored departments have already retained the industrial foundation for continued development, but before the infantry weapons are fully replaced, it is not advisable to further disperse the most scarce precision equipment. The Committee requests the State Military Commission to approve the above conclusions."
 RUS_fr_armaments_report_conclusion_mobility:0 "Based on this, the Standing Committee recommends that the next phase of the federal program continue to prioritize the expansion of vehicles, fuel, maintenance, and mobile force training systems, so that the current trial does not remain limited to a few demonstration units. Standardization work for infantry weapons and armored engineering has already been completed, and future additional production capacity should first be used to reduce the time required for troops and supplies to reach the battlefield. The Committee requests the State Military Commission to approve the above conclusions."
 RUS_fr_armaments_report_conclusion_armour:0 "Based on this, the Standing Committee recommends that the next phase of the federal plan continue to concentrate alloys, heavy machinery, radio equipment, and specialized support forces on the development of armored forces, so that common chassis and unified firepower programs can support truly independent armored corps. The infantry and mechanized units have already achieved basic results sufficient to maintain the operation of the entire military, but the highest-quality industrial resources should still serve the decisive breakthrough forces. The Committee requests that the State Military Commission approve the above conclusions."
 RUS_fr_armaments_report_conclusion_generic:0 "The Standing Committee recommends formally incorporating the drawings, test procedures, and production standards developed during this period into the next Federal Plan, with the General Staff continuing to oversee their implementation in the various military districts. The Committee requests that the State Military Commission review and approve the above conclusions."
 RUS_fr_armaments_report_approval_armaments:0 "Approve the report and continue to ensure the development of Army weaponry"
 RUS_fr_armaments_report_approval_mobility:0 "Approve the report and continue to ensure the mechanization development of the military"
 RUS_fr_armaments_report_approval_armour:0 "Approve the report and continue to ensure the construction of armored weapons"
 RUS_fr_armaments_report_approval_generic:0 "Approve the report and forward it to the Federal Planning Committee"
