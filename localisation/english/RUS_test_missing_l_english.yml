 RUS_fr_fragmented_officer_training:0 "Broken officer training system"
 RUS_fr_fragmented_officer_training_desc:0 "Different military regions, old military academies, and wartime crash courses each followed their own set of standards, and offensive command especially lacked systematic training."
 RUS_fr_equipment_standardisation_correction:0 "Infantry Equipment Standardization"
 RUS_fr_equipment_standardisation_correction_desc:0 "Standardizing calibers, parts, tolerances, and acceptance rules is eliminating redundant waste in the production of infantry equipment and support materials."
 RUS_fr_armoured_production_correction:0 "Armored Production Standardization"
 RUS_fr_armoured_production_correction_desc:0 "Chassis, power, and transmission components are incorporated into a unified series, and armored vehicles are no longer pieced together from incompatible factory solutions."
 RUS_fr_field_regulations_correction:0 "Frunze Field Regulations"
 RUS_fr_field_regulations_correction_desc:0 "Regulations organize combat experience into a language shared by the entire army, enabling infantry coordination and military theory to finally be continuously accumulated in actual combat."
 RUS_fr_climate_training_correction:0 "All-Weather Training Regulations"
 RUS_fr_climate_training_correction_desc:0 "Winter stationing training, rotations in hot regions, and unified health protection have made the troops no longer view the climate as an unpredictable disaster."
 RUS_fr_core_operations_correction:0 "Local Theater Joint System"
 RUS_fr_core_operations_correction_desc:0 "The military region, the General Staff, and the local mobilization agencies share the same set of contingency plans, allowing the Red Army to finally organize coherent defense and counterattacks in the home theater of operations."
 RUS_fr_red_academy_correction:0 "Thunderstorm Military Academy"
 RUS_fr_red_academy_correction_desc:0 "Exiled returning generals and outstanding cadres from the revolutionary war were incorporated into a unified senior officer education system, allowing their experience to be truly passed down."
 RUS_fr_armoured_coordination_correction:0 "Armored Troops Coordination Procedures"
 RUS_fr_armoured_coordination_correction_desc:0 "Armored units are no longer dispersed mobile fire points, but have begun to operate according to unified principles of breakthrough, communication, and support."
 RUS_fr_special_forces_correction:0 "Guard and Special Forces Training Standards"
 RUS_fr_special_forces_correction_desc:0 "The demonstration unit has extended high-intensity training, selection, and tactical summaries to all military special forces, enabling them to regain the ability to undertake critical missions."
 RUS_fr_mobilisation_base_correction:0 "National Mobilization Registration System"
 RUS_fr_mobilisation_base_correction_desc:0 "Local registers, medical examinations, and supplemental plans were unified, and the paper population could finally be transformed into usable qualified personnel."
 RUS_fr_command_merit_system_idea:0 "Revolutionary Military Merit Competition System"
 RUS_fr_command_merit_system_idea_desc:0 "Public reviews and military merit evaluations give genuinely offensive-minded commanders opportunities for promotion, and also force conservative military academies to reassess their standards."
 RUS_fr_military_democracy_trial_idea:0 "Trial Implementation of Military Democracy"
 RUS_fr_military_democracy_trial_idea_desc:0 "Grassroots participation expanded the Red Army's political mobilization capabilities in remote areas, but the highly centralized command required by armored troops was temporarily affected."
 RUS_fr_political_work_system_idea:0 "Military Political Work System"
 RUS_fr_political_work_system_idea_desc:0 "The Party organization has entered the daily life of the company and stabilized the morale of the troops, but there still needs to be coordination between political procedures and military orders."
 RUS_fr_soldiers_committees_system_idea:0 "Soldiers' Committee System"
 RUS_fr_soldiers_committees_system_idea_desc:0 "For the first time, soldiers had formal channels to file complaints regarding their living conditions, medical care, and supplies, allowing the troops to better endure long-term combat."
 RUS_fr_discipline_review_system_idea:0 "Military Discipline and Political Review System"
 RUS_fr_discipline_review_system_idea_desc:0 "Strict scrutiny protected the experience and key personnel of the troops, but it also caused the frontline infantry commanders to become cautious for a period of time."
 RUS_fr_standardised_army_structure_idea:0 "Standardized Army Organization"
 RUS_fr_standardised_army_structure_idea_desc:0 "Unified compilation, supplementation, and training cycles enable troops from different military districts to truly interchange personnel, equipment, and missions."
 RUS_fr_investigate_white_networks_operation:0 "Investigate the liaison network of the White Army within the military"
 RUS_fr_investigate_white_networks_operation_desc:0 "investment §Y[?RUS_fr_xp_cost_40|1]§! Focus on army experience, within 30 days investigate the network of old military officer relationships and pilot a system-bound military democratic supervision."
 RUS_fr_review_officer_service_records:0 "Oath and Resume of the Reviewing Officer"
 RUS_fr_review_officer_service_records_desc:0 "investment §Y[?RUS_fr_xp_cost_45|1]§! Accumulate army experience, and within 30 days establish a unified officer record, political work, and service review system."
 RUS_fr_organise_basic_commissar_network:0 "Establish a grassroots political commissar and military discipline review network"
 RUS_fr_organise_basic_commissar_network_desc:0 "investment §Y[?RUS_fr_xp_cost_40|1]§! Gain army experience, and within 30 days implement the political commissar, military discipline, and political inspections in the grassroots units."
 RUS_fr_institutionalise_soldiers_committees:0 "Institutionalized Soldiers' Committee"
 RUS_fr_institutionalise_soldiers_committees_desc:0 "investment §Y[?RUS_fr_xp_cost_45|1]§! Accumulate army experience, and incorporate the soldiers' committee into the formal military-political system within 30 days."
 RUS_fr_reopen_thunderstorm_military_academy:0 "Reopen Thunderstorm Military Academy"
 RUS_fr_reopen_thunderstorm_military_academy_desc:0 "investment §Y[?RUS_fr_xp_cost_60|1]§! Focus on army experience, rebuild advanced officer education in 120 days, and recall exiled or missing Red Army commanders such as Budyonny."
 RUS_fr_issue_frunze_field_regulations:0 "Issuance of the Frunze Field Regulations"
 RUS_fr_issue_frunze_field_regulations_desc:0 "investment §Y[?RUS_fr_xp_cost_60|1]§! Focus on army experience, and use 120 days to standardize field regulations, infantry coordination, and doctrine research methods."
 RUS_fr_implement_unified_training_mobilisation:0 "Implement a unified training and mobilization system"
 RUS_fr_implement_unified_training_mobilisation_desc:0 "investment §Y[?RUS_fr_xp_cost_50|1]§! Accumulate army experience, using 120 days of unified training, mobilization, and all-weather garrison procedures."
 RUS_fr_reorganise_general_staff_district_network:0 "Reorganized General Staff Department—Military Region Network"
 RUS_fr_reorganise_general_staff_district_network_desc:0 "investment §Y[?RUS_fr_xp_cost_55|1]§! Focus on army experience, and use 120 days to unify the local theater plan and the command relationship of the military region."
 RUS_fr_conduct_all_russian_red_army_exercise:0 "Voronezh Grand Exercise"
 RUS_fr_conduct_all_russian_red_army_exercise_desc:0 "investment §Y[?RUS_fr_xp_cost_50|1]§! Test the established command, mobilization, and support systems with 30 days of Army experience."
 RUS_fr_test_experimental_general_staff_formations:0 "Testing General Staff Department Experimental Organization"
 RUS_fr_test_experimental_general_staff_formations_desc:0 "investment §Y[?RUS_fr_xp_cost_45|1]§! Apply army experience, use 90 days to test the new organization and organize its doctrinal achievements."
 RUS_fr_conduct_national_mobilisation_supply_test:0 "Implement nationwide mobilization to ensure inspection"
 RUS_fr_conduct_national_mobilisation_supply_test_desc:0 "investment §Y[?RUS_fr_xp_cost_45|1]§! Focus on army experience, and use 90 days to review personnel registration, supplementation, and national support capabilities."
 RUS_fr_launch_army_mechanisation_programme:0 "Launch the Army Mechanization Implementation Plan"
 RUS_fr_launch_army_mechanisation_programme_desc:0 "investment §Y[?RUS_fr_xp_cost_60|1]§! Accumulate army experience, and in 120 days standardize mechanized forces and armored production."
 RUS_fr_form_guards_model_units:0 "Establish a model unit for the guard"
 RUS_fr_form_guards_model_units_desc:0 "investment §Y[?RUS_fr_xp_cost_45|1]§! Accumulate army experience and establish a demonstration unit within 90 days that can promote the experience to special forces."
 RUS_fr_institute_revolutionary_merit_competition:0 "Promote revolutionary military merit competitions"
 RUS_fr_institute_revolutionary_merit_competition_desc:0 "investment §Y[?RUS_fr_xp_cost_50|1]§! Focus on army experience, and use 90 days to reform the promotion standards for officer evaluations and offensive command talents."
 RUS_fr_requires_experimental_formations_decision_tt:0 "Resolution Completed:§YInspection of the General Staff Experimental Establishment§!"
 RUS_fr_requires_mobilisation_test_decision_tt:0 "Resolution Completed:§YImplement National Mobilization Support Inspection§!"
 RUS_fr_requires_mechanisation_decision_tt:0 "Resolution Completed:§YLaunch the Army Mechanization Implementation Plan§!"
 RUS_fr_requires_guards_units_decision_tt:0 "Resolution Completed:§YEstablish a Guard Demonstration Unit§!"
 RUS_fr_requires_merit_competition_decision_tt:0 "Resolution Completed:§YCarry Out the Revolutionary Military Merit Competition§!"
 RUS_fr_ergonomic_infantry_equipment_idea:0 "Ergonomic Standards for Combat Gear"
 RUS_fr_ergonomic_infantry_equipment_idea_desc:0 "Unified standards for carrying, holding, and aiming make infantry equipment more suitable for long marches and sustained combat, so soldiers no longer have to use physical strength to compensate for design shortcomings."
 RUS_fr_ergonomic_infantry_equipment_priority_idea:0 "Ergonomic Standards for Combat Gear"
 RUS_fr_ergonomic_infantry_equipment_priority_idea_desc:0 "After infantry weapons are given priority investment, ergonomic standards no longer focus solely on reducing the burden; instead, through comprehensive innovations in materials, structure, and carrying methods, individual soldier equipment can adapt to higher-speed tactical mobility."
 RUS_fr_support_fire_joint_trials_idea:0 "Support Firepower Joint Test Results"
 RUS_fr_support_fire_joint_trials_idea_desc:0 "The artillery department, together with mechanized units, has established new test standards. Traditional artillery bears stricter structural requirements, while rocket artillery is prioritized for improvement as a means of large-scale firepower assault."
 RUS_fr_armaments_priority_support_tradeoffs_idea:0 "Priority allocation of artillery firepower"
 RUS_fr_armaments_priority_support_tradeoffs_idea_desc:0 "Limited alloys, machine tools, and testing resources were prioritized for artillery and rocket artillery projects. As a result, the army's firepower rapidly increased, but the production capacity and tactical development of armored weapons had to temporarily yield."
 RUS_fr_light_infantry_load_standard_idea:0 "Light Infantry Load Standards"
 RUS_fr_light_infantry_load_standard_idea_desc:0 "More reasonable carrying weight, sanitation equipment, and supply distribution allow infantry to move faster, maintain a more complete organization, and preserve more living forces during prolonged battles."
 modifier_army_sub_unit_infantry_max_org_factor:0 "Infantry Organization"
 RUS_fr_divisional_artillery_priority_idea:0 "Priority construction for brigade-level artillery"
 RUS_fr_divisional_artillery_priority_idea_desc:0 "The artillery organization, ammunition bases, and fire call procedures are directly integrated into the infantry division, so that artillery and infantry are no longer two separate operational systems."
 RUS_fr_armaments_system_priority_idea:0 "The Army Weapons System Prioritizes Standardization"
 RUS_fr_armaments_system_priority_idea_desc:0 "The federal plan chooses infantry and artillery as the main backbone of the army. Unified equipment, organization, and replenishment standards give each division a more compact structure and more abundant personnel reserves, and significantly strengthen night combat, complex terrain operations, and air defense fire coordination; by contrast, the development space for armored and mechanized weapons is further restricted."
 RUS_fr_katyusha_rocket_artillery_idea:0 "Katyusha rocket launcher system"
 RUS_fr_katyusha_rocket_artillery_idea_desc:0 "The standardization of rockets, launchers, and salvo procedures transformed the rocket artillery from a few experimental units into a complete weapon system capable of unleashing devastating firepower in a short period of time."
 RUS_fr_tank_firepower_development_idea:0 "Armored Firepower Development Outline"
 RUS_fr_tank_firepower_development_idea_desc:0 "Armored weapon design no longer revolves around a single vehicle model temporarily. The turret ring, gun recoil mechanism, and crew positions are incorporated into a common standard, allowing the tank's firepower and protection to be coordinated within the same engineering process."
 RUS_fr_armour_breakthrough_programme_idea:0 "Breakthrough Chassis Plan"
 RUS_fr_armour_breakthrough_programme_idea_desc:0 "Chassis testing no longer aims to showcase the ultimate performance of prototype vehicles, but focuses on the load-bearing, transmission, and suspension capabilities required for continuous breakthroughs."
 RUS_fr_long_range_armoured_exploitation_idea:0 "Remote Armored Assault Procedures"
 RUS_fr_long_range_armoured_exploitation_idea_desc:0 "Armored troops are required to break away from the infantry's pace of advance to carry out long-distance maneuvers and operational pursuit independently. As a result, traditional infantry formations yield some resources, while armored units gain more complete operational freedom."
 RUS_fr_armour_reliability_priority_idea:0 "Armored weapons reliability comes first"
 RUS_fr_armour_reliability_priority_idea_desc:0 "Since the armored troops will undertake long-range breakthrough missions, the engine, transmission, and tracks must continue to function after leaving the railway and repair shop. Therefore, the testing department places durability ahead of all standard specifications."
 RUS_fr_universal_hull_armour_priority_idea:0 "General Vehicle Body Modification Standards"
 RUS_fr_universal_hull_armour_priority_idea_desc:0 "Unified interfaces and structural components allow older vehicles to more quickly accept new turrets, engines, and specialized superstructures, and upgrading armored vehicles is no longer equivalent to redesigning a tank."
 RUS_fr_armoured_firepower_coordination_idea:0 "Armored Firepower Coordination Standard"
 RUS_fr_armoured_firepower_coordination_idea_desc:0 "Tanks, self-propelled artillery, and anti-tank vehicles began sharing target designations, radio call signs, and fire zones. As a result, armored formations were able to concentrate their forces like a complete branch of the armed forces."
 RUS_fr_tank_destroyer_structural_idea:0 "Self-propelled anti-tank gun structural standards"
 RUS_fr_tank_destroyer_structural_idea_desc:0 "Anti-tank guns, chassis, and transmission systems are no longer considered temporarily assembled combinations. Unified structural tests allow self-propelled anti-tank guns to more effectively deal with enemy armor while maintaining mobility."
 RUS_fr_armoured_priority_coordination_tradeoff_idea:0 "Armored assault forces concentrated"
 RUS_fr_armoured_priority_coordination_tradeoff_idea_desc:0 "The best communication equipment, staff, and support units were concentrated in the armored corps. It gave the armored spearhead decisive power, but temporarily weakened the support available to other units of the entire army."
 RUS_fr_land_warfare_mainstay_idea:0 "Main Weapon System of Ground Forces"
 RUS_fr_land_warfare_mainstay_idea_desc:0 "The chassis, armor, turret, and transmission system were incorporated into a unified engineering language, and industrial orders also began to be reorganized around armor and self-supporting firepower. Infantry remained the backbone of the frontline, but the best quality steel, measuring instruments, and support forces were concentrated into the new main land combat weapon system; before this system truly matured, the entire army had to bear the cost of reorganizing production and tactical standards."
 RUS_fr_unified_armaments_equipment_standard_idea:0 "Achievements in the Construction of the People's Army: Military Engineering Standards"
 RUS_fr_unified_armaments_equipment_standard_idea_desc:0 "The engineering specifications for chassis, infantry equipment, and troop interfaces have been incorporated into the unified construction standards of the People's Army. They are no longer isolated committee trials, but have become common technical appendices for the entire military equipment system."
 RUS_fr_unified_armaments_equipment_standard_priority_idea:0 "Achievements in the Construction of the People's Army: Armored Engineering Standards"
 RUS_fr_unified_armaments_equipment_standard_priority_idea_desc:0 "On the basis of unified armament engineering standards, the reliability of armored weapons is established as a priority. The chassis, production, and battlefield support thus form a complete closed loop around independent armored corps."
 RUS_fr_unified_armaments_equipment_standard_td_idea:0 "Achievements of the People's Army in Construction: Anti-Armor Engineering Standards"
 RUS_fr_unified_armaments_equipment_standard_td_idea_desc:0 "The engineering specifications for chassis, infantry equipment, and self-propelled anti-tank guns have been incorporated into the unified construction standards of the People's Army, and the results of structural tests have been carried over to tank destroyers at all levels."
 RUS_fr_unified_armaments_equipment_standard_priority_td_idea:0 "Achievements in People's Army Construction: Armored and Anti-Armored Engineering Standards"
 RUS_fr_unified_armaments_equipment_standard_priority_td_idea_desc:0 "The reliability of armored weapons and the structural standards of self-propelled anti-tank guns are jointly incorporated into a unified armament engineering system, enabling breakthrough weapons and anti-armor firepower to be continuously improved based on the same industrial foundation."
 RUS_fr_armour_reliability_priority_bonus_tt:0 "If focusing on §YOutline for the Development of Armored Weapons§!, all §YArmored Equipment§! Reliability:§G+10.0%§!"
 RUS_fr_unlock_stabilizer_tt:0 "If focusing on §YOutline for the Development of Armored Weapons§!, unlock tank accessories:§YArtillery Stabilizer§!"
 RUS_fr_okmo_half_xp_cost_tt:0 "§YOKMO§! Choose §YFrontline Design Reporter§! After the route, the cost of army experience for all subsequent traits §GHalve§!"
 RUS_fr_self_propelled_artillery_firepower_bonus:0 "Self-propelled artillery firepower enhancement standards"
 RUS_fr_self_propelled_artillery_firepower_bonus_desc:0 "The unified interfaces for artillery, ammunition, and the vehicle chassis enable self-propelled artillery to continuously provide high-intensity support fire in mobile operations."
 RUS_fr_self_propelled_artillery_firepower_bonus_tt:0 "All §YSelf-propelled artillery§!:\nPersonnel casualties:§G+10.0%§!\nAgainst armored damage:§G+100.0%§!"
 RUS_fr_armour_priority_self_propelled_bonus:0 "Armored Troops Self-Propelled Firepower Coordination Standard"
 RUS_fr_armour_priority_self_propelled_bonus_desc:0 "Armored weapons focus on integrating tanks and self-propelled artillery into the same fire command and supply system, exchanging higher support investment for concentrated destructive power to break through clusters."
 RUS_fr_armour_priority_self_propelled_bonus_tt:0 "If focusing on §YOutline for the Development of Armored Weapons§!:\nAll §YTank§! Against personnel and against armor:§G+15.0%§!\nAll §YSelf-propelled artillery§! Supply consumption:§G-30.0%§!"
 modifier_army_sub_unit_category_tank_destroyers_speed_factor:0 "Maximum speed of the self-propelled anti-tank gun"
 RUS_fr_coordinate_armoured_firepower:0 "Coordinated Armor Firepower"
 RUS_fr_coordinate_armoured_firepower_desc:0 "investment §Y[?RUS_fr_xp_cost_30|1]§! Spend army experience, use 15 days to organize an inter-military region armored firepower coordination exercise. After completion, gain an amount equivalent to the current communism support rate.§G0.1 times§! Armor offense and defense bonus, cumulative maximum §G+15%§!."
