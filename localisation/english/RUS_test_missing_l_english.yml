 RUS_fr_timoshenko_reform_cost_discount_tt:0 "When serving as a theorist, military reform resolution army experience cost: per level §G-5%§!"
 RUS_fr_timoshenko_armaments_specialisation_tt:0 "Focus on §YGeneral Outline of Army Weaponry Design§! Time:\nGain extra when the general levels up §Y1§! Probability of point attack:§G+50%§!\nGain extra when the general levels up §Y1§! Chance to increase defense:§G+50%§!\nGain extra when the general levels up §Y1§! Probability of the point plan:§G+50%§!\nGain extra when the general levels up §Y1§! Probability of clicking logistics:§G+50%§!"
 RUS_fr_timoshenko_stage_four_upgrade_tt:0 "§YShiemiao · Timoshenko§! The theorist traits will be strengthened, additionally gaining:\nBattlefield Width:§G-10.0%§!"
 RUS_fr_political_commissar_organisation_idea:0 "Political Commissar Organizational System"
 RUS_fr_political_commissar_organisation_idea_desc:0 "The political commissar is no longer a motivator temporarily sent to the front line in times of crisis, nor a monitor standing behind the commander. They bring political education, soldiers' concerns, and the unit's experiences into a unified organizational channel, allowing the Party, officers, and ordinary soldiers to understand each other within the same system for the first time."
 RUS_fr_scientific_general_staff_idea:0 "Scientific General Staff"
 RUS_fr_scientific_general_staff_idea_desc:0 "Maps, statistics, wargaming, and military history research are replacing the contradictory intuitions of generals. The General Staff is no longer just an organ for transmitting orders, but a military science center that continuously observes war, tests hypotheses, and writes the lessons back into regulations."
 RUS_fr_deep_battle_concept_idea:0 "Deep Battle Theory"
 RUS_fr_deep_battle_concept_idea_desc:0 "The battlefield is no longer seen as a line that must be broken head-on, but as a vast depth composed of transportation hubs, reserves, artillery positions, and command organs. A breakthrough is only the beginning of a campaign; true victory comes from continuous strikes until the enemy's entire system collapses simultaneously."
 RUS_fr_one_man_command_idea:0 "Responsibility system of the chief"
 RUS_fr_one_man_command_idea_desc:0 "Debates can occur before orders are given; once orders are given, they must be executed. Commanders are granted clear and complete military responsibility, while political organs are responsible for supervising principles, interpreting objectives, and maintaining the connection between the military and the revolution. Neither will shirk responsibility by ambiguously deferring to the other."
 RUS_fr_revolutionary_collectivism_idea:0 "Revolutionary collectivism"
 RUS_fr_revolutionary_collectivism_idea_desc:0 "The strength of the people's army does not belong to any single genius commander or lone hero, but comes from squads, platoons, companies, and every soldiers' committee that are responsible to each other. As long as the collective remains connected, casualties, fatigue, and temporary setbacks cannot completely disband the forces."
 RUS_fr_military_vanguardism_idea:0 "Military Vanguardism"
 RUS_fr_military_vanguardism_idea_desc:0 "Revolutions cannot wait forever for the old army to accept new ideas. Trial units selected through rigorous screening will be the first to adopt new organization, communication, and mobile combat methods, to successfully demonstrate the path and to turn failures into lessons for the entire army."
 RUS_fr_revolutionary_heroism_idea:0 "Revolutionary heroism"
 RUS_fr_revolutionary_heroism_idea_desc:0 "The heroes needed by a revolution are not idols for people to worship, but those willing to take responsibility at decisive moments. Officers from working-class backgrounds, soldiers who hold their positions, and logistics personnel who keep the roads clear will all become examples that can be learned from by the entire army, rather than being distant and unattainable models."
 RUS_fr_tempered_in_steel_idea:0 "Tempered into steel"
 RUS_fr_tempered_in_steel_idea_desc:0 "Repeated confrontation exercises taught the Red Army to conceal their true intentions, changing deployments, shifting the main attack direction, and launching counterattacks just when the enemy was convinced they had seen everything. Camouflage, reconnaissance, and deception were no longer the special skills of a few staff officers, but became combat methods mastered jointly from the military district headquarters to the front-line units."
 RUS_fr_field_political_agitation_idea:0 "Frontline Political Propaganda Touring Team"
 RUS_fr_field_political_agitation_idea_desc:0 "Political officers, war correspondents, and exemplary grassroots soldiers are touring among the newly formed units. They translate the revolutionary government's orders into language that soldiers can understand, and they also bring back complaints and confusions from the barracks to the political organs."
 RUS_fr_general_staff_wargames_idea:0 "General Staff War Game"
 RUS_fr_general_staff_wargames_idea_desc:0 "Maps, chess pieces, and thick railroad timetables covered the staff meeting table. Each simulation forced the officers to answer the same question: When the enemy does not act in the way we hope, how should the Red Army continue its attack?"
 RUS_fr_deep_battle_exercise_idea:0 "Deep Penetration Drill"
 RUS_fr_deep_battle_exercise_idea_desc:0 "The breakthrough of the first echelon is only the beginning of the campaign. The reserves, reconnaissance units, and mobile firepower are repeatedly crossing simulated gaps on the training ground, learning how to turn the enemy's local collapse into the wavering of the entire front line."
 RUS_fr_central_military_liaison_idea:0 "Central Military-Civil Coordination Conference"
 RUS_fr_central_military_liaison_idea_desc:0 "Representatives from the General Staff, political organs, and major military districts were summoned to the same table. The meetings were not always pleasant, but each argument was cheaper than the front lines receiving conflicting orders."
 RUS_fr_academy_research_groups_idea:0 "Military Academy Theoretical Research Group"
 RUS_fr_academy_research_groups_idea_desc:0 "The instructors at Thunderstorm Military Academy are compiling exercise records, foreign battle cases, and civil war experiences into new lecture materials. The Red Army needs not only brave officers but also people who can turn lessons into methods."
 RUS_fr_unified_training_rotation_idea:0 "Unified Rotation Plan"
 RUS_fr_unified_training_rotation_idea_desc:0 "Cadres and key soldiers from different military regions are dispersed and undergo rotational training. The northern troops learn supply methods on the grasslands, the western military region gains experience in training in severe cold, and everyone must adhere to the same set of assessment standards."
 RUS_fr_military_district_readiness_idea:0 "Military Region Combat Readiness Verification"
 RUS_fr_military_district_readiness_idea_desc:0 "The inspection team will not notify the warehouse manager, railway dispatcher, or military district chief of staff in advance. The mobilization table, fuel records, and contingency maps must be available today, because the war will not wait for us to recopied the documents."
 RUS_fr_voronezh_exercise_review_idea:0 "Voronezh Exercise Review"
 RUS_fr_voronezh_exercise_review_idea_desc:0 "The failed maneuvers, late trains, and wrong orders of the Voronezh exercises were recorded point by point in the review materials. The Red Army was willing to admit these embarrassments on paper, because the next place where problems would be exposed could be the battlefield."
 RUS_fr_emergency_workshop_norms_idea:0 "Military Workshop Assault Standards"
 RUS_fr_emergency_workshop_norms_idea_desc:0 "The quartermasters, engineers, and union teams are inspecting machine tools one by one and verifying parts batch by batch in critical workshops. The sudden enforcement of standards will not permanently solve industrial problems, but it can help the current batch of orders reach the front line faster and more steadily."
 RUS_fr_unified_army_reform:0 "Current Situation of the Workers' and Peasants' Red Army: A Stream of Iron for Ten Thousand Miles"
 RUS_fr_unified_army_reform_desc:0 "Borrowing an Eastern proverb—'Everything is ready, but the east wind is lacking'—to describe the Red Army at this moment is nothing short of apt. With new equipment being gradually deployed, the quality of the Workers' and Peasants' Red Army is steadily improving. Our soldiers have learned to operate the new equipment, commanders are assimilating the new tactical regulations, and the logistics system is gradually extending to more distant fronts. We are already lying on our arms, ready to launch an assault on the fortresses of the old world."
 RUS_fr_unified_army_reform_final:0 "Current Situation of the Workers' and Peasants' Red Army: Invincible and Legendary"
 RUS_fr_unified_army_reform_final_desc:0 "The battle-hardened Workers' and Peasants' Red Army ultimately defeated its nemesis; the arrogant German Empire collapsed under the surge of the people... let the bourgeois go mad! Let the worthless souls weep! History has already written its verdict! The Workers' and Peasants' Red Army will liberate every corner of the world!"
 RUS_fr_unify_basic_army_reform_tt:0 "Obtain the already acquired §YMilitary System Reform§! and §YMilitary System§! Mental consolidation into §YCurrent State of the Workers' and Peasants' Red Army: Iron Flow Over Ten Thousand Miles§!; Subsequent relevant resolutions will also be directly incorporated into this spirit."
 RUS_fr_comrades_abroad_army_reform_bonus_tt:0 "§YCurrent Situation of the Workers' and Peasants' Red Army§! Append:\n$MODIFIER_SEND_VOLUNTEER_SIZE$: §G+5§!\n$MODIFIER_ARMY_EXPERIENCE_FROM_VOLUNTEERS$: §G+50.0%§!"
 RUS_fr_unlock_invincible_legendary_status_tt:0 "§YCurrent State of the Workers' and Peasants' Red Army: Iron Flow for Ten Thousand Miles§! Will be upgraded to §YCurrent Status of the Workers' and Peasants' Red Army: Invincible and Legendary§!"
 RUS_fr_armaments_basic_result:0 "Foundational Achievements in Military Build-up"
 RUS_fr_armaments_basic_result_desc:0 "The firearms from Tula, the artillery from Petrograd, and the parts in warehouses across the country began to conform to unified blueprints, calibers, and acceptance standards. Federal orders no longer only pursued delivery numbers; for the first time, frontline soldiers could trust that the weapons delivered to them would be interchangeable and durable in use. However, the standardized system built around conventional warfare on the homeland also temporarily weakened the troops' ability to adapt to local conditions when operating far from the federal core areas."
 RUS_fr_mobility_basic_result:0 "Foundational Achievements in Mobile Construction"
 RUS_fr_mobility_basic_result_desc:0 "Vehicles are no longer rare machines manufactured by each factory according to their own habits. Standardized engine specifications, maintenance manuals, and parts catalogs connect automobile factories, military supply depots, and field repair stations, establishing the initial mobile framework for the Red Army."
 RUS_fr_mechanised_platform_mobility_priority:0 "Priority Construction of Mechanized Platforms"
 RUS_fr_mechanised_platform_mobility_priority_desc:0 "The committee regards mechanized forces as the core of operational mobility, rather than merely a means of transportation. Vehicles, personnel, and infantry tactics are thus incorporated into the same set of training and combat standards."
 RUS_fr_vehicle_manufacturing_integration_idea:0 "Vehicle Manufacturing Process Integration"
 RUS_fr_vehicle_manufacturing_integration_idea_desc:0 "Unified parts catalogs, fuel standards, and assembly line specifications reduced waste of mechanized vehicles between factories and the front lines, making large-scale equipment of forces a sustainable industrial task."
 RUS_fr_vehicle_manufacturing_integration_priority_idea:0 "Vehicle Manufacturing Process Integration"
 RUS_fr_vehicle_manufacturing_integration_priority_idea_desc:0 "Beyond the standardization of parts catalogs, fuel standards, and assembly line specifications, the priority of mechanized construction has also promoted the development of a more mature system for training, organization, and coordinated operations in mechanized forces."
 RUS_fr_air_assault_brigades_idea:0 "Aerial Maneuver Test Compilation"
 RUS_fr_air_assault_brigades_idea_desc:0 "Maintaining rotary-wing aircraft, training specialized infantry, and establishing a new command system are costly, but they allowed the Red Army for the first time to bypass front-line obstacles and directly contest the enemy's operational depth."
 RUS_fr_air_assault_mobility_priority_idea:0 "Helicopter Concentrated Production Plan"
 RUS_fr_air_assault_mobility_priority_idea_desc:0 "In order to transform airborne assault from an experimental formation into a real combat force, the committee adopted extremely expensive specialized aircraft and training systems, concentrating the best personnel into the new special forces."
 RUS_fr_deep_mobility_priority_idea:0 "High-speed deep operation maneuver combat system"
 RUS_fr_deep_mobility_priority_idea_desc:0 "Continuous investment enables airborne mobile forces to cross roads, rivers, and trenches, entering deep into enemy territory before the enemy has completed deployment. The accompanying enormous industrial burden becomes the cost that the federation's plans must bear for the long term."
 RUS_fr_mobility_priority_improved_logistics_bonus:0 "Mechanized Logistics Strengthening Standards"
 RUS_fr_mobility_priority_improved_logistics_bonus_desc:0 "The priority investment in mechanization construction has further strengthened transportation scheduling, fuel management, and frontline supply procedures."
 RUS_fr_mobility_priority_logistics_bonus_tt:0 "If focused §YOutline for the Mechanized Construction of the Army§!,§YImproved Logistics Company§! the effect §GDouble§!:\nSupply usage: extra §G-10.0%§!\nFuel usage: additional §G-5.0%§!"
 RUS_fr_armour_basic_result:0 "Fundamental Achievements in Armored Construction"
 RUS_fr_armour_basic_result_desc:0 "The design bureau no longer viewed each type of tank as a work belonging solely to itself. Chassis, armor, turrets, and transmission systems were incorporated into a common engineering language, allowing factories in the Urals and Petrograd to share test results and lay the foundation for future large-scale armored forces."
 RUS_fr_armaments_priority_result:0 "Priority construction of army weaponry"
 RUS_fr_armaments_priority_result_desc:0 "The committee reserved the best steel, measuring tools, and skilled workers for the infantry weapons and artillery factories. The Red Army would still rely on soldiers to advance on foot, but these fighters would no longer pay the price for crude bolt mechanisms, cracked breechblocks, or non-interchangeable parts."
 RUS_fr_mobility_mechanised_priority_result:0 "Priority construction of heavy mechanization"
 RUS_fr_mobility_mechanised_priority_result_desc:0 "Rather than pursuing a few dazzling new vehicles, the committee chose to first build convoys, repair battalions, and mechanized transport columns that could support the entire army group. Speed would no longer belong to reconnaissance scouts, but would become part of the organization of the entire army."
 RUS_fr_mobility_air_priority_result:0 "Priority construction of aerial mobility"
 RUS_fr_mobility_air_priority_result_desc:0 "Autogyros are still a novelty on engineers' drafting boards and test fields, but they demonstrate a possibility of crossing roads, rivers, and trenches. The best light infantry will be assigned to experimental units to explore a path for an air cavalry that does not yet exist in any military manual."
 RUS_fr_armour_priority_result:0 "Priority construction of armored weapons"
 RUS_fr_armour_priority_result_desc:0 "Tanks should not merely be moving shields that cover the infantry's advance. Concentrated design efforts will reorganize production around independent armored corps, so that firepower, protection, communication, and long-distance marching capability all serve the operational breakthrough."
 RUS_fr_armaments_specialisation:0 "Specialized development of military equipment"
 RUS_fr_armaments_specialisation_desc:0 "The federal plan is to shift arms production from temporary expansion to long-term specialized division of labor. A stable feedback loop is established between design bureaus, test ranges, and mass-production factories, allowing each round of orders to incorporate the lessons of the previous round of war and production."
 RUS_fr_mobility_specialisation:0 "Flexible specialized development"
 RUS_fr_mobility_specialisation_desc:0 "Roads, vehicles, warehouses, and repair capabilities are regarded as part of the same campaign system, rather than separate logistical items. The mobility of the Red Army will be supported by an organization network that can operate repeatedly, rather than relying on one-time material concentration."
 RUS_fr_armour_specialisation:0 "Armored Specialization Development"
 RUS_fr_armour_specialisation_desc:0 "An independent armored engineering system has already been established. Achievements in metallurgy, artillery, engines, and radio have been continuously integrated into a common chassis, allowing armored forces to shape their equipment around their own operational tasks, rather than passively accepting the vehicles provided by factories."
 RUS_fr_military_reform.10.t:0 "The First Armaments Work Conference"
 RUS_fr_military_reform.10.d:0 "The Federal Armaments and Defence Industry Commission has already received three equally large construction proposals. The commission is able to advance all areas, allowing each to achieve basic results; however, the initially established priority direction will receive additional resources, personnel, and long-term policy support."
 RUS_fr_military_reform.10.a:0 "Give priority to establishing a unified military production system"
 RUS_fr_military_reform.10.b:0 "Give priority to solving mobility and logistics issues"
 RUS_fr_military_reform.10.c:0 "Prioritize the development of an independent armored weapons system"
 RUS_fr_military_reform.20.t:0 "Infantry Weapon Design Debate"
 RUS_fr_military_reform.20.d:0 "The committee cannot simultaneously allocate the limited special materials to individual soldier load optimization and divisional artillery expansion. The preliminary design work has been completed, and now it is necessary to decide which plan to finalize first."
 RUS_fr_military_reform.20.a:0 "Reduce the load and improve the infantry's sustained combat capability"
 RUS_fr_military_reform.20.b:0 "Strengthen the artillery support for the division to protect the infantry with firepower"
 RUS_fr_military_reform.30.t:0 "Technical route of mechanized construction"
 RUS_fr_military_reform.30.d:0 "Conventional vehicle manufacturing, specialized mechanized logistics, and helicopter air assault still in the experimental stage will compete for the same pool of engineers, engines, and training resources. The committee can only select one of these paths."
 RUS_fr_military_reform.30.a:0 "Integrate vehicle manufacturing and build a rapid campaign corps"
 RUS_fr_military_reform.30.b:0 "Prioritize specialized and mechanized logistics"
 RUS_fr_military_reform.30.c:0 "Skipping the conventional phase, attempt to form an air assault unit"
 RUS_fr_military_reform.40.t:0 "The engineering orientation of armored weapons"
 RUS_fr_military_reform.40.d:0 "The committee must determine the focus of special tests between the self-directed firepower and the durability of the vehicle structure. The rest of the common chassis, artillery, and component standards will continue to be advanced as usual."
 RUS_fr_military_reform.40.a:0 "Give priority to establishing a self-directing fire system"
 RUS_fr_military_reform.40.b:0 "Prioritize completing the vehicle body structure durability test"
 RUS_fr_military_reform.50.t:0 "Assessment Report on the Current Construction Difficulties of the Red Army"
 RUS_fr_military_reform.50.d:0 "To: Military Affairs Department of the Central Executive Committee\n\n1. Regarding the quality of military personnel\n\nThe current composition of the Red Army is mainly workers and peasants. From an ideological perspective, the purity of this force can be assured—they come from the working class, have no vested interests with the old regime, and hold a simple trust in the new government. But at the operational level, we cannot avoid a fundamental difficulty: literacy rate does not equal cognitive ability.\n\nThe literacy program provided soldiers with the most basic reading and writing training, but this was far from enough. A soldier who can recognize written orders may not necessarily understand concepts such as 'enemy situation assessment,' 'terrain utilization,' and 'firepower coordination.' The judgment required on the battlefield comes from comprehension, not just literacy. Currently, among junior soldiers in the Red Army, the proportion who can independently assess situations at the tactical level is still relatively low. This forces junior commanders to take on a large amount of judgment work that could have been done by the soldiers themselves, making the command chain fragile and inefficient.\n\nIn addition, a considerable portion of soldiers in the troops still lack basic understanding of the operating principles of modern weapons. They can follow the manual to complete loading and firing actions, but if a malfunction or abnormal situation occurs, they often cannot independently determine the cause of the problem. Under actual combat conditions, this state of 'only knowing how to operate but not judge' could become a deadly shortcoming.\n\n2. Regarding the Shortage of Commanders\n\nThe mass resignation of White Army officers was seen as a necessary process of 'cleansing the old forces' in the early stages of the revolution. But the gaps left by this process have still not been effectively filled.\n\nThe gap in mid- and junior-level commanders in the Red Army is still significant. Among the existing group of commanders, a considerable number have been promoted directly from the ranks of soldiers—they are brave, loyal, and respected, but lack systematic military education. A few are able to independently develop effective command methods through actual combat, but most need more time to accumulate experience than the current conditions allow. Meanwhile, as the gap in junior commanders has yet to be filled, higher-level command positions are also affected.\n\nThe essence of the problem is a lack of time. A qualified platoon leader needs at least a year of systematic training and practical experience; a company commander requires even more time; and an officer capable of independently commanding a battalion-level unit has a development cycle measured in years. We are accelerating the training pace, but the gap between the training speed and actual demand remains significant and is difficult to fully bridge in the short term."
 RUS_fr_military_reform.50.d_2:0 "III. On the Practical Distance of the 'Deep Operations' Theory\n\nMarshal Tukhachevsky's military theory is complete and scientific, which is beyond doubt. However, the completeness of theory cannot replace the preparation process in reality.\n\nThe armored corps, mechanized infantry, coordinated air force, and corresponding logistical support system required to implement the 'Deep Operations' theory are still in the initial stages. Our industrial base is not yet capable of supporting equipment production on such a scale; our transportation network cannot yet ensure logistical support over such depth; our communication methods cannot yet maintain such complex battlefield coordination—all the material conditions necessary to support the implementation of the theory still have a long way to go.\n\nThis is not a denial of Marshal Tukhachevsky's theory, but an assessment of the real conditions. If we measure the current state of the Red Army by the standard of 'theoretical completeness,' the conclusion will inevitably be 'far from enough.' And if we slow our pace of progress because it is 'far from enough,' then we will never reach the height depicted by the theory.\n\nThe key lies in having a clear timetable. We need to know, given the current industrial capacity and educational resources, how far we can advance each year; we need to know which steps can be accelerated and which steps can only proceed in an orderly manner; we also need to know that if we must achieve combat capability by a certain point in time, we must make trade-offs in certain areas.\n\nConclusion\n\nThe three problems currently facing the Red Army—troop quality, shortage of commanders, and implementation of theory—are not three separate issues, but three aspects of the same problem: there is not enough time.\n\nWe need more time to develop soldiers' understanding, more time to train commanders, and more time to build the industrial base and logistical systems necessary to achieve 'Deep Operations.' But war waits for no one. Therefore, we must make a difficult choice: to concentrate limited resources on the most critical aspects within a limited time.\n\nNational Military Staff Department\nSemyon Konstantinovich Timoshenko"
 RUS_fr_military_reform.50.a:0 "Time is tight, and the tasks are heavy."
 RUS_fr_military_reform.51.t:0 "The foremost of future wars"
 RUS_fr_military_reform.51.d:0 "Driven by the ideas of military revolution, Marshal Mikhail Nikolayevich Tukhachevsky completed his work 'The Primacy of Future War.' Based on practical experience from the civil war, combined with his observations during his studies at the French General Staff Military Academy and his long-term observation of the major European military powers, the book systematically argues for the decisive role of armored forces, a new military development, in future wars.\n\nTukhachevsky wrote in his book: 'Future wars will no longer be stalemates of trenches and barbed wire, but contests of steel and speed.' He analyzed the progress of European countries in building armored forces and clearly pointed out that Russia had fallen behind the major Western powers in this field. The viewpoints presented in the book were quite forward-looking: the future battlefield will belong to large-scale mechanized corps, and the infantry's breakthrough capability must rely on the rapid penetration of armored units, while the coordination between air power and armored forces will be key to determining the outcome of campaigns. He also specifically emphasized the standardization and generalization of the military industry—a proposal directly related to the supply difficulties he observed during the high-intensity attrition warfare of the civil war.\n\nAs soon as the book was published, it caused a strong reaction in the military and political circles. Instructors at military academies recommended it as a must-read for officers, while commanders on the front lines flipped through it page by page, trying to find answers on how the next war should be fought. There were also dissenting voices pointing out: given the current domestic economic level, is it realistic to massively expand the armored forces? In response, Tukhachevsky did not deny the constraints of the economic foundation, but rather pointed out that technological gaps would not close on their own by waiting—'If we can't build it today, we certainly won't be able to build it tomorrow—because others are moving faster than us.'"
 RUS_fr_military_reform.51.d_2:0 "Taking advantage of this opportunity, Tukhachevsky joined forces with a group of young domestic officers and formally submitted a proposal to the Central Executive Committee to establish the 'State Military Commission' (abbreviated as 'SMC'). The proposal suggested that the new department would report directly to the Central Executive Committee and be responsible for coordinating the nation's military research and development, military-industrial production, and strategic planning, ensuring information sharing and material coordination among the military districts. The functions of the SMC would include: formulating unified military-industrial production standards and coordinating the production plans of various military-industrial enterprises; organizing the initiation and review of military research projects to ensure that equipment development aligns with strategic needs; establishing an independent testing and evaluation system to systematically assess and improve the technological gap of existing equipment.\n\nThe proposal concludes: 'A country without a war-conscious mindset can only respond passively on its own territory.' The significance of the National Military Commission lies in that it will free Russia's military development from the inertia of 'each military district acting on its own,' turning it into an integrated whole with direction, rhythm, and predictive capability. It is not another layer of administrative bureaucracy, but an engine focused on 'how to win the next war.'\n\nAt present, this proposal has entered the preliminary discussion stage. Supporters believe that this move will significantly improve national defense efficiency, while opponents question its scope of authority and its relationship with existing military institutions. However, regardless of the outcome, 'future warfare' has already turned from the title of an article into a political issue that needs to be taken seriously."
 RUS_fr_military_reform.51.a:0 "Faster! Stronger!"
 RUS_fr_military_reform.52.t:0 "Introduction to 'Thunder'"
 RUS_fr_military_reform.52.d:0 "Mikhail Frunze\n\n——The Organizational Mechanism and Computational Basis of Modern Offensive Campaigns\n\nBourgeois military theorists often define war as 'the continuation of politics,' which is not wrong, but they deliberately avoid a more fundamental question: whose continuation is politics itself? The answer can only be that it is the continuation of the irreconcilable class struggle between the proletariat and the exploiting class.\n\nTherefore, this book does not study 'general war.' There is no such thing as a general war in the world, just as there is no such thing as a general person. All offensive campaigns, no matter which direction the arrows on the map point, are essentially the material manifestation of class will in space. When we talk about 'the sound of thunder,' we are not discussing an auditory effect, but rather: how to use steel and explosives, with the highest economic efficiency, to read the historical verdict to the old world.\n\nCurrently popular military textbooks exhibit two harmful tendencies. One is 'technological fetishism,' which breaks war down into ballistic curves and fuel consumption rates, as if victory depends on the accuracy of the slide rule; the other is 'spontaneous heroism,' which sanctifies the charge experiences during the civil war period and regards organization as unnecessary. The former forgets that weapons are extensions of human arms, and humans are cells of the class; the latter refuses to acknowledge that revolutionary passion, if it cannot be converted into precise calculations of rounds per minute and fuel consumption per kilometer, is merely gunpowder without a fuse.\n\nThis book attempts to carve out a third path between these two tendencies—the proletariat's scientific view of struggle. Its core tenet can be stated as:\n\n\"Every artillery shell must ask itself: For whose land are you exploding?\"\n\nBased on this, the book does not provide a 'sure-win secret,' but instead offers a set of simultaneous equations of class sensitivity and material constraints. We require commanders to complete three mental procedures before formulating plans:"
 RUS_fr_military_reform.52.d_2:0 "1. Class positioning: Your direction of attack, has it cut off the class supply chain that the enemy relies on? For example, capturing a bakery is strategically more significant than capturing a bunker.\n\n2. Political Transmission: After your orders are issued, can the lowest-level Red Army soldiers translate them into concrete images of 'defending the Soviets' in their own words?\n\n3. Historical Reflexivity: If this campaign fails, can you clearly indicate in your report—is it due to miscalculation of resources, or a failure in political mobilization?\n\nSome people might criticize this statement for 'placing politics above the military.' My response is: The Red Army is the Red Army precisely because it never pretends to be politically neutral. The White Army generals also had politics; it's just that they were ashamed to admit that their politics belonged to the landlords and capitalists.\n\nWe can quote a passage from Comrade Lenin: 'In the most democratic bourgeois republic, 'neutrality' is nothing more than one of the forms of enslaving the working people.'\n\nLastly, I must candidly record a piece of data: during the 1920 assault on Wrangel, an infantry division moved 27 minutes faster than an adjacent division that had not been given an explanation because the political commissar explained to the soldiers two days in advance \"why they had to capture that station.\" Those 27 minutes represent the material conversion rate of ideology. What this book refers to as 'thunder' ultimately means using this conversion rate to cover the entire airspace that bourgeois military science calls 'purely technical.'\n\nIf after reading this book, the only thing you remember is a tactical formula, it means you have only understood the skeleton. If when you close the book, what resonates in your ears is the voice of millions of the exploited demanding the return of land and factories—that is the true frequency of the 'thunder'.\n\nThis book is dedicated to those red commanders who can both clean their rifles and read 'Das Kapital'.\nBecause future wars are not won by generals, but by soldiers who understand dialectics."
 RUS_fr_military_reform.52.a:0 "A thunderclap on the revolutionary battlefield!"
 RUS_fr_military_reform.53.t:0 "Establish a Marxist view of heroes"
 RUS_fr_military_reform.53.d:0 "——General Political Department of the Workers' and Peasants' Red Army Bulletin\n(No. 47)\n\nComrades:\n\nHero worship has existed since ancient times. Epics from the slave era praised warriors who could lift heavy weights, historical records of feudal dynasties erected monuments to emperors, generals, and ministers, and the bourgeoisie dressed up heroes as 'geniuses' and 'supermen' above all people. These 'heroes' share a common characteristic: they stand above the people, and their brilliance comes at the cost of the people's obscurity.\n\nMarxism does not approve of such heroes.\n\nThis is not to say that Marxism denies the existence of heroes. On the contrary, we are more aware than anyone else of the importance of those who step forward at critical turning points in history and crucial moments of revolution. But the fundamental questions posed by Marxism are: Where do heroes come from? For whom do heroes fight?\n\nOur answer is: Heroes come from the people, and heroes fight for the people.\n\nWhen an ordinary Petrograd worker picks up a rifle and heads toward the barricades, when an illiterate peasant gives the last bag of grain to passing partisans, when a young female student abandons her classroom to go to the war-torn frontlines—these are the moments when heroes are born. They are not born heroes; history chose them, the awakening of their class summoned them, and the suffering and hopes of millions of working people pushed them to the forefront of their era. The reason they become heroes is not because they possess extraordinary gifts beyond ordinary humans, but because they understand the connection between themselves and the people more profoundly than anyone else, and more consciously take on the historical mission of class liberation.\n\nThis is the Marxist view of heroes. It strips away the mysterious, innate aura from heroes and restores them as products of history, children of the people, and warriors of the class."
 RUS_fr_military_reform.53.d_2:0 "By applying this kind of view of heroism to the revolutionary military cause, we will be able to correctly understand what kind of heroism revolutionary soldiers should have.\n\nFirst, revolutionary military heroism is not individual bravery, but class consciousness. A revolutionary soldier dares to face a hail of bullets and shells not because he disregards life, but because he is clear about what he is fighting for. He knows that on the other side of every trench, there are not only enemies, but also millions of suffering workers and peasants waiting to be liberated. This consciousness is more enduring and powerful than any personal passion or impulse.\n\nSecond, revolutionary military heroism is not a momentary impulse, but a daily cultivation. True heroes shine not only on the battlefield but also sweat on the training ground, keep their eyes wide open at their posts, and do their duties to the utmost in every ordinary position. Those soldiers who aim their guns for hours in thirty-degree-below-zero cold without moving an inch, those technical soldiers who repeatedly polish parts at the lathe until their hands are covered with calluses, those communications personnel who copy telegrams word by word in the duty room late at night—they may never be written into poems or turned into songs, but they are equally practicing revolutionary military heroism.\n\nThird, revolutionary military heroism is not a lone act above the collective, but a conscious action of integrating into and serving the collective. A truly revolutionary heroic army is not supported by a few lone heroes. Its strength comes from the countless ordinary soldiers consciously observing discipline, sincere care for comrades, and resolute execution of higher-level commands. Here, the hero is not the one standing at the front of the ranks admired by all; the hero is the very force itself.\n\nTherefore, when political organs at all levels conduct heroism education, they must distinguish themselves clearly from the heroic views of all old armies. Do not encourage individuals to show off, do not engage in blind worship of individuals, and do not attribute accomplishments to a few while forgetting the vast majority of ordinary soldiers. One should be adept at discovering flashes of heroism in the daily work of grassroots companies, seeing the growth of class consciousness in every drop of sweat, and guiding all officers and soldiers to realize that dedicating oneself to the cause of the people's liberation is, in itself, the highest form of heroism; every revolutionary soldier who faithfully fulfills their duties is writing a heroic epic that belongs to this great era.\n\nComrades, all officers and soldiers, our era does not need heroes who kneel and gaze upward; it needs millions of revolutionary fighters who stand, fight, and consciously undertake their historical mission at their posts. When every ordinary soldier realizes that they are the masters of history and the creators of victory, our army will truly be invincible.\n\nGeneral Political Department of the Workers' and Peasants' Red Army"
 RUS_fr_military_reform.53.a:0 "Circumstances shape heroes."
 RUS_fr_military_reform.90.t:0 "[RUS_fr_armaments_report_title]"
 RUS_fr_military_reform.90.d:0 "Standing Committee of the Federal Armaments and Defence Industry Commission\nTo the State Military Commission and the Federal Planning Commission:\n[RUS_fr_armaments_report_header]\n\nSince the establishment of the committee, the tactical requirements proposed by the General Staff, the engineering plans submitted by various military industrial institutions, and the production targets issued by the federal planning agencies have been included in the same construction cycle for the first time. [RUS_fr_armaments_report_priority]\n\n §Y1. Army Ordnance Work§!\n[RUS_fr_armaments_report_infantry_route]\n\n §Y2. Campaign Maneuvering and Transportation Work§!\n[RUS_fr_armaments_report_mobility_route]\n\n §Y3. Armored Vehicle Operations§!\n[RUS_fr_armaments_report_armour_route]\n\n §YStanding Committee Conclusion§!\n[RUS_fr_armaments_report_conclusion]\n\nThe Standing Committee of the Federal Armaments and Defence Industry Commission respectfully presents."
 RUS_fr_military_reform.90.a:0 "[RUS_fr_armaments_report_approval]"
 RUS_fr_military_reform.402.t:0 "Military Reform Materiel in Short Supply"
 RUS_fr_military_reform.402.d:0 "The Federal Planning Committee reports that the reserves of steel, machine tools, vehicles, and communication equipment dedicated to national military reform have fallen to the warning line. If not replenished promptly, the automatically advancing rectification and armament construction projects will be suspended due to a lack of materials.\n\ncan be at §YNational Military Reform§! In the resolution §YAdditional Military Funding§! or §YMobilize General Staff reserves§!; can also be done once during the war §YWartime Emergency Procurement§!."
 RUS_fr_military_reform.402.a:0 "Immediately raise the next batch of supplies."
