 stalin_form_sov.25.t:0 "Bolsheviks leave home"
 stalin_form_sov.25.desc:0 "Rostov\n\nWhenever it comes to talking about home, Alyosha always seems to have ten thousand things to say. At the weekend support meetings, he always sits in the front row, back straight, with his two rough hands neatly resting on his knees—but as soon as someone starts a topic, he becomes like a thawed river, words flowing out one after another, impossible to stop.\n\nComrades listened to his story bit by bit, and gradually, they roughly pieced together the first half of Alyosha's life.\n\nIn 1917, Alyosha's father was captured by the White Army and was never heard from again. His mother fell ill from grief and despair, her body giving out all at once. That year, Alyosha had just turned eighteen, and he had a younger sister, Ilyia, who was only nine. Before the young man had time to understand what big words like 'revolution' and 'future' really meant, life slapped him into adulthood—he had to shoulder the responsibilities of this precarious family.\n\nIn 1921, the White Army established control in Russia. The Socialist Revolutionary Party and the Constitutional Democratic Party managed to put together a so-called 'Democratic Union.' They changed the signboard, but it brought Alyosha no luck. He worked at a screw factory in the suburbs, with metal shavings flying like rain in front of the lathe. He swung his wrench until smoke rose, yet the few bills he earned were only enough to barely feed the family. The money for his mother's medicine still had to be painstakingly saved penny by penny by Ilya, who washed clothes for others.\n\nThe days passed by neither too bitter nor too sweet, until the summer of 1936. A familiar foreman, using a mix of coaxing and deceit, got the unemployed Alyosha into Savinkov’s so-called 'Sunrise Project.' The name was indeed quite striking—Sunrise. But later, when Alyosha talked about this period to others, he could only shake his head with a bitter smile: that damn place… On the dark, sunless construction site, he was once forced to work continuously for twenty-seven hours, finally collapsing onto the frozen, hardened mud. If it weren’t for an old worker next to him who insisted on dragging him into a shed and giving him half a bowl of hot soup, he might never have woken up again."
 stalin_form_sov.25.desc_2:0 "Fortunately, the Bolsheviks were back. The foreman at the factory was replaced, work hours got set, and even two more lights were hung on the workshop ceiling. Alyosha’s days finally brightened a bit, and the money in his hands gradually added up. But his mother’s illness was deeply rooted, and the medicine costs were like a bottomless pit. He went over the accounts for several nights, and finally made up his mind—to join the army. The Red Army’s allowance was higher than the factory’s, and by living frugally and sending money home, it would be enough for his mother to buy medicine. Just for this reason, he signed up.\n\nOn the day of departure, the train station platform was crowded with people seeing off travelers, and the air was filled with the scent of coal smoke, tears, and the tune of an accordion. Ilya—the girl he had carried on his back since childhood, who had now grown into a young lady—stood on tiptoe in the crowd, desperately waving at him.\n\nAlyosha leaned half his body out of the car window and opened his mouth, as if ten thousand words were stuck in his throat.\n\nThe wheels rolled over the rails, producing a piercing screech, and all words were swallowed up by that loud noise. In the end, he just shouted loudly at his younger sister:"
 stalin_form_sov.25.a:0 "\"Goodbye! Little Ilya! Take good care of mom!\""
 stalin_form_sov.26.t:0 "The First Revolutionary Military Competition"
 stalin_form_sov.26.desc:0 "Kazan\n\nTo be honest, Leon doesn't like talking to people.\n\nThis isn't to say that he has a bad temper or looks down on anyone. He simply feels that opening his mouth is a very tiring thing. If someone talks to him, he will respond, but usually with no more than three words—'Hmm.' 'Okay.' 'Got it.'—any more than that, and it feels as if something is stuck in his throat and he just can't get it out. In a military camp, where people eat and sleep right next to you, his personality is of course not exactly charming, so after more than half a year of service, he really hasn't made any friends.\n\nBut he has something else.\n\nHe understands mechanics. Not the kind of 'understanding' where you flip through a couple of books and dare to say you know, but truly understands. To him, an engine isn’t just a rumbling chunk of metal; it’s dozens or even hundreds of parts talking at the same time. If one sounds off, or one rotates half a beat slower, he can hear it with his eyes closed. Once, the company commander half-jokingly said to him, 'Leon, if you paid as much attention to talking with people as you do to talking with machines, I’d happily let you be the company commander.' Leon thought about it, felt he couldn’t respond, so he just said two words: 'I wouldn’t dare.'\n\nSo when the notice for the first revolutionary military competition of the entire army came out, and the quota for the technical model within the unit fell to him, no one expressed surprise.\n\nThe event was to be held in Kazan. When the news came, Leon was in the garage, crawling under the chassis of a half-track vehicle, his hands covered in grease, tightening a bolt. The instructor read the notice once, waiting for him to say something, but all he did was stretch one hand out from under the vehicle, give a thumbs-up, and then pull it back in.\n\nThe instructor stood there, caught between laughter and tears: 'Come on, say something to me.'\n\nA muffled voice came from under the car: 'Pack up your things.'\n\nThe instructor shook his head and walked away.\n\nThe road from the base to Kazan was not short. The military truck bounced along the pothole-ridden dirt road all day, carrying twelve soldiers competing, all top picks from their respective companies. Someone started singing a song, but midway through realized the pitch had gone too high, and everyone in the truck burst out laughing. Leon sat in the innermost corner, leaning against the truck's bulkhead, with an old, worn copy of 'Principles of Internal Combustion Engine Structure' spread across his knees. Someone handed him a bottle of water; he took a sip, said 'thank you,' and then returned to reading.\n\nThe soldiers beside each other glanced at one another and exchanged a 'this is just how he is' look.\n\nKazan is, after all, Kazan. Unlike the garrison barracks and dirt training grounds, this is an old city by the Volga River. The streets are paved with stones, and some buildings still have bullet holes from the civil war, but there are already trams running, jingling all the way. The competition venue is set in an old military camp on the outskirts of the city. People from various units gather in a huge crowd, with different colored shoulder boards and sleeve badges everywhere, bustling like during the New Year.\n\nOn the day of the opening ceremony, a senior official from the headquarters came and gave a speech on the stage. Leon didn’t remember much of what was said, only one sentence: 'The revolutionary army must not only be brave, but also capable.' He stood in the ranks, chewing over this sentence in his mind several times, feeling it made some sense.\n\nThe competition was divided into several events: shooting, cross-country, tactical maneuvers, and radio operations. Each event had people cheering and others sighing. Leon registered for mechanical maintenance, which wasn’t a lively event and even had few spectators. The exam venue was set in a corner at the edge of the playground, where a long table held a row of disassembled rifles, deliberately arranged with seven or eight types of malfunctions. The examiner was an armorer wearing round glasses, looking like a teacher, but spoke in a straightforward and brisk manner: 'The competition lasts one hour, begin!'\n\nLeon sat down at the table."
 stalin_form_sov.26.desc_2:0 "From time to time, bursts of cheers erupted on the playground outside—probably someone scored a perfect ring in shooting, or someone crossed the finish line in cross-country. In the distance, the whistle from the Volga River drifted faintly, mingling with the September wind, making one feel inexplicably dazed. But Leon didn’t hear any of it.\n\nWhen he picked up the first gun, all the sounds outside went silent.\n\nHis hands do not shake. This is his skill—a hand that has been turning screws for many years, steady like a calibrated machine tool. Every finger knows exactly where to go and how much force to use. He disassembles the rifle; his movements are not fast, but each step is clean and precise: removing the receiver, retracting the spring, pulling out the firing pin, without a single unnecessary motion. He is like a silent orchestra conductor; wherever his fingers pass, the metal parts automatically line up, spreading out on the table like a detailed map.\n\nThe examiner with round-frame glasses initially stood nearby watching. As he kept watching, he stopped moving. He took off his glasses to wipe them, then put them back on, and then pulled a notebook from his pocket and wrote something on the paper.\n\nIn the thirty-eighth minute, Leon reassembled the last gun, pulled back the bolt, and pulled the trigger once. The firing pin made a crisp, clear snap. He put the gun neatly back on the table, then stood up, rubbed his hands on his pants to wipe off the oil, only to realize that the examiner was staring at him.\n\n\"Which unit are you from?\" the examiner asked.\n\nLeon reported the number.\n\nThe examiner pushed his glasses up and smiled. It was a smile that only someone experienced in the field would have, carrying a hint of unexpected surprise. 'What did you do before?'\n\n\"Ural Machinery Factory. Has repaired lathes for three years.\"\n\nThe examiner nodded, as if he had finally figured something out. He wrote another note in his notebook and then patted Leon's shoulder: 'Alright, comrade. The results will be announced later.'\n\nOn the day the results were announced, Leon got first place.\n\nHe isn't the type of person who would laugh upon winning first place. When standing on the podium, the expression on his face was much like when he usually works on cars, even a bit more serious, as if he didn't know where to put his hands. The applause from below was quite loud, especially from a few soldiers in his company, whose palms were red from clapping; one with a loud voice even shouted, 'Well done, Leon!' causing a burst of laughter from those around.\n\nIn the evening, the contestants gathered on the open ground outside the camp to eat. Someone strummed a guitar, someone used a lunchbox lid to keep the beat, and the firelight flickered across everyone's faces. Someone pulled Leon over, asking him to sit in the middle of the circle. He hesitated for a moment, but still went and sat down.\n\nThe soldier playing the guitar came over and asked him, 'Hey, Comrade Champion, don't you have anything you want to say?'\n\nLeon was silent for a while. The campfire crackled, sending sparks shooting up into the sky. In the distance, the Volga River flowed quietly in the night, like a strip of black satin. He looked down at his hands, covered with grease and rust—hands that had been tightening screws for over ten years, repairing lathes, tractors, and rifles, supporting himself, and sustaining one machine after another, silent yet roaring. He had never felt that this was anything remarkable.\n\nBut at this moment, he sat right in the middle of the firelight, surrounded by faces glowing red in the light, waiting for him to speak.\n\nHe suddenly felt that opening his mouth didn't seem that difficult after all."
 stalin_form_sov.26.a:0 "\"My name is Leon,\" he said, 'the mechanic.'"
 stalin_form_sov.27.t:0 "Late-night call"
 stalin_form_sov.27.desc:0 "Vladivostok\n\nThe phone rang right at two o'clock in the morning.\n\nThe duty officer picked up the receiver, and before he could report the code number, a heavily suppressed sobbing voice came from the other end: 'Is this... the Soldiers' Committee? Over here... our company commander...'\n\nBefore the words were finished, the voice was cut off. In the receiver, there was only the buzzing of electrical current and faint shouts and curses in the distance.\n\nThe duty officer tightened his grip on the microphone.\n\nHe said in a deep voice, 'Comrade, speak slowly. Which unit? What is the company commander's name?'\n\nThere was silence over there for a few seconds, as if hesitating about something. Then another voice joined in, harsher than the previous one, but also trembling: 'Reporting... 73rd Border Defense Detachment, 3rd Company. The company commander is Valenkin Sergeyevich Popov. We—'\n\nAnother dull thud, as if someone had fallen. The phone hung up again.\n\nThe duty officer did not hesitate. He stood up, grabbed the desk's internal phone, and shook it three times.\n\n\"Connect me to the military district political commissar. It's urgent.\"\n\nIn less than ten minutes, the military district political commissar hurried to the duty room, his uniform buttons not yet fully fastened, but the sleep had already disappeared from his face. He glanced at the duty log, his brows knitted into a knot.\n\n\"Popov.\" He chewed on the name in his mouth, \"Someone anonymously sent a letter last month. No evidence, it was suppressed.\"\n\n\"This time it's different,\" said the duty officer, 'it's a phone call. It rang twice, and the conversation wasn't finished.'\n\nThe political commissar was silent for a moment. Outside the window, the night wind of Vladivostok carried a salty fishy smell inside, making the duty log on the table rustle loudly."
 stalin_form_sov.27.desc_2:0 "The car bumped along the dirt road for nearly three hours in the middle of the night. By the time they arrived at the 73rd Border Defense Regiment, 3rd Company's station, the sky had already turned pale.\n\nThe camp was very quiet. Quiet to an abnormal degree—no sentries, no lights, only a small patch of dim yellow light coming from the window of the headquarters' bungalow.\n\nThe political commissar pushed the door open, but the scene before him left him somewhat speechless.\n\nSeven soldiers stood in a row, bruised and battered. The youngest looked not even twenty, with dried blood at the corners of his mouth and dark bruises under his eyes. Behind them, a burly officer was tied to a chair, his rank insignia torn off, collar open, his face showing a mixture of anger and contempt.\n\nThe political commissar recognized that face. Popov.\n\nOne soldier stepped forward from the seven. His rank was Private First Class. He saluted the political commissar and spoke steadily: 'Reporting to the commander. The Soldiers' Committee has received a report with real names. After verification, it is true. The suspect has been taken into custody.'\n\nHe paused, took out a neatly folded piece of paper from the pocket of his chest, and handed it over with both hands.\n\n\"This is a joint letter from all 83 soldiers of the company.\"\n\nThe political commissar took the piece of paper. It was densely covered with writing; some of it was scrawled crookedly, and it was clear that some parts were written by one person on behalf of several others. At the end were eighty-three signatures and eighty-three red handprints—the red varied in shade, and a few were too heavily inked, with the ink spreading along the grain of the paper, resembling blood.\n\nHe read line by line. Skimping on soldiers' pay, embezzling supplies, punishing soldiers physically, locking them up without giving them food... he read it three times. Then he folded the letter back up and stuffed it into his coat pocket.\n\nThe political commissar turned around and looked at Popov in the chair. The anger and contempt in those eyes had not faded, but they were beginning to waver slightly.\n\n\"Comrade Popov,\" the political commissar's voice was not loud, \"do you have anything to say?\"\n\nPopov did not answer.\n\nThe sky gradually brightened. The morning in Vladivostok was very cold, and the breath exhaled turned into white mist. When the political commissar walked out of the company headquarters, the seven bruised soldiers stood in a line at the door.\n\nBehind them, more soldiers came out of the barracks and stood in the gray morning light. They quietly watched the political commissar fill that vehicle, and watched Popov being taken onto another vehicle.\n\nThen the engine started, and the two cars drove one after the other along the road, disappearing at the end of the road.\n\nThe duty officer received a new call early the next morning."
 stalin_form_sov.27.a:0 "\"73rd Border Defense Detachment, 3rd Company, Soldiers' Committee. Report concluded!\""
 russia_socialist_events.30.t:0 "The exile returns home"
 russia_socialist_events.30.d:0 "The \"1923 National Defense Act\" once classified all 'communist activities' as illegal. When Maria Spiridonova's government came to power, its first action was to overturn all political crime verdicts made under this law. Once, this law hung like a sword over people's heads—thousands of socialists were persecuted and jailed, and many fled to Western socialist countries, joining the Bolshevik exile communities there. Now, most of them are returning home on the 'Red Boat,' comrades setting off from Paris and London on their journey back to their homeland.\n\nThey were warmly welcomed in Petrograd and announced a merger with the 'Integration Movement' party organization, which had long been active in Siberia. However, the seeds of disagreement had long been sown. The exiles' experiences were vastly different from those of domestic socialists, leading to intense clashes. These exiles now resembled more of a military-political group, seeing themselves as the orthodox successors of Lenin, and were deeply disappointed with the current political situation in Russia."
 russia_socialist_events.30.a:0 "Welcome home?"
 russia_socialist_events.32.t:0 "Bolsheviks in the officer corps"
 russia_socialist_events.32.d:0 "Due to the voluntary or involuntary retirement of a large number of White Army officers, experienced commanders are in short supply. The shortage is particularly severe among company and platoon leaders at the grassroots level, and newly formed units often reveal serious command gaps during tactical exercises and actual deployments.\n\nTo this end, Frunze, together with other Red Army officers who had returned from exile, submitted a 'Proposal for Military Purges and Reforms' to the Provisional Government. The core idea of the proposal was twofold: on one hand, to continue identifying and eliminating unreliable remnants within the old army, and on the other hand, to significantly accelerate the accelerated training in military academies and select promising talents from workers, peasants, and returning officers to fill command positions.\n\nThis proposal covers a wide range of areas—from the re-evaluation of active-duty officers, to adjustments in troop organization, and to the drafting and promotion of new combat regulations, with numerous issues to handle. Although Frunze held the position of strategic decision-maker, he was unable to supervise each reform detail personally. Therefore, in the supplementary notes of the proposal, he specifically recommended his talented protégé, Semyon Timoshenko, to coordinate and execute the daily organizational work of the reforms, so that this document could be quickly transformed into the army's actual combat capability."
 russia_socialist_events.32.c:0 "It turns out that they are indeed capable revolutionaries."
 russia_socialist_events.101.t:0 "Siege of Kronstadt"
 russia_socialist_events.101.d:0 "Red Army forces have advanced to the suburbs of Petrograd and have ordered General Goltz to surrender. However, this White Army marshal did not appear in the city and remained on his flagship, the 'General Alekseyev,' anchored outside the city. The Baltic Fleet's attitude was ambiguous and restless, leaving the entire city in a bizarre stalemate. Meanwhile, the Kronstadt fortress and the Baltic Fleet gave no substantial response to communications from any side, merely replying with the two words 'acknowledged' perfunctorily.\n\nThe city is still under the control of the people—most of the Petrograd garrison belongs to the first units to defect, and they immediately began arresting the unpopular 'Svoboda' members in the city.\n\nThis veteran naval commander was undoubtedly furious at the socialists coming to power again, but this time, he seemed to be isolated and without support. However, he still had a group of loyal sailors and marine battalions around him, and the ship’s guns remained aimed at the heart of Russia. Fierce debates broke out within the Red Army outside Petrograd: What exactly was Kolchak plotting? Was he organizing a counter-revolutionary strike, or had he already been abandoned by everyone, leaving only this fleet?\n\nIn the end, the government sent a Petrograd city commissioner aboard the 'General Alekseyev' to negotiate with Kolchak, proposing the handover of the fleet in exchange for a dignified retirement. On the ship, the former 'Supreme Ruler of All Russia' appeared haggard. He merely said lightly that perhaps he had gradually drifted away from Russia and could no longer understand the country. His previous extreme worry about the coup ultimately proved to be unnecessary—what the marshal felt more was disappointment and fatigue. After some gentle persuasion, he agreed to resign and expressed a wish to continue serving as the chairman of the Arctic Research Committee."
 russia_socialist_events.101.a:0 "A disaster was thus avoided."
 russia_socialist_events.332.t:0 "Ministry of Agriculture of the People"
 russia_socialist_events.332.a:0 "Agriculture needs radical reform, let Dubrovsky take charge."
 russia_socialist_events.332.b:0 "Mayorov and the Social Revolution are a perfect fit."
 russia_socialist_events.332.c:0 "Ustinov's viewpoint can be described as genius."
 russia_news_events.8.t:0 "A revolutionary storm sweeps across Russia"
 russia_news_events.8.d:0 "Boris Savinkov fell as a result. Due to the president's actions making the public and the military increasingly angry, large-scale protests erupted in Red Square, and amid gunfire echoing through the capital, Savinkov was shot by a member of the Socialist Revolutionary Party.\n\nIn the midst of chaos, the previously banned socialist parties rose in revolt, and people’s committees and workers' and peasants' soviets were established one after another across the country. With the broad mobilization of the Red Guards, the Provisional Government advanced with great momentum, and the remnants of the White Army in Petrograd and southern Russia scattered like birds and beasts.\n\nRussia seems to have become a socialist country overnight, which has had a profound impact on Europe and the entire world."
 russia_news_events.8.c:0 "The world revolution is already at hand!"
 RUS_yakov_sverdlov_leader_desc:0 "§YBorn:§!§LJune 3, 1885; Russian Empire, Nizhny Novgorod, Nizhny Novgorod Province§!\n §YBackground:§!§LYakov Mikhailovich Sverdlov was born into a Jewish family in Nizhny Novgorod. His father had hidden weapons for underground revolutionary organizations and always supported his children's revolutionary beliefs. Influenced by this family environment, Sverdlov joined the Social Democratic Labor Party in 1902, and later, during the party split, chose to support Lenin's Bolsheviks.§!\n\n §LHe participated in the 1905 Revolution, was subsequently arrested, and imprisoned in Yekaterinburg. Over the next ten years, he moved between prison and exile, during which he continued to study the works of Marx, Lenin, and Kautsky. After the outbreak of the February Revolution, he seized the opportunity to return to Petrograd and quickly became a core figure of the Bolsheviks. During the October Revolution and the subsequent civil war, he played an indispensable role and was nicknamed 'Black Devil' by both his comrades and enemies for his decisive actions.§!\n\n §LAfter Lenin was assassinated, Sverdlov became the primary figure among the 'triumvirate' leadership of the Bolsheviks and ultimately assumed leadership of the Russian Communist Party (Bolsheviks) in exile in Paris. He was a steadfast Leninist to the end and sharply criticized various French parties and trade unions for disregarding revolutionary unity and solely vying for power, causing socialism in that country to degenerate into 'bureaucratic sectarianism.' In stark contrast, the Bolsheviks maintained a streamlined and efficient structure—under Sverdlov's reorganization, the faction led by Zinoviev was expelled from the party, leaving behind an almost perfect revolutionary machine.§!\n\n §LAfter the reconstruction of socialist Russia, Sverdlov positioned his party as a truly revolutionary party. In his vision, the Bolsheviks would continue to uphold the torch of Leninism and shoulder the mission of leading the revolution forward.§!"
 russia_socialist_events.300.t:0 "Convene the representative assembly"
 russia_socialist_events.300.d.radsoc:0 "The decayed institutions of the Russian Republic have become ruins. Today, most of the country is being managed by provisional revolutionary committees of the Soviets and unions, as well as by village collectives. There is no reason to retain anything from Savinkov's dictatorial reforms, and Nabokov's parliamentary system is not suitable for worker Russia. Therefore, a new constitution must be drafted, and, according to the decree of Interim President Maria Spiridonova, free elections must be held.\n\nHowever, we have also taken preventive measures to guard against any reactionaries rising from the ashes. Any member of the Defense Alliance, the Russian Unity Congress, or organizations allied with them may not participate in voting before completing their sentence or being declared innocent by the people's court. This also applies to those who claim to have joined Svoboda organizations under duress or for opportunistic reasons. This move immediately implicates most members of the right and center in Russian politics. Moreover, voting should be organized by workers' committees, and the right to vote is essentially primarily restricted to workers and peasants.\n\nAs expected, more than four-fifths of the seats in the congress were held by socialist parties, with the Socialist Revolutionary Party receiving about half of the votes, and the Bolsheviks and the All-Russian Labor Union splitting the remainder. In addition, there were many other smaller parties, with the Radical Democrats and the Constitutional Democratic Union also winning some seats, but they were just ghosts of the past."
 russia_socialist_events.300.d.syndie:0 "$russia_socialist_events.300.d.radsoc$"
 russia_socialist_events.300.a:0 "The people have spoken. Let's get started."
 russia_socialist_events.441.t:0 "Workers' Revolutionary Alliance?"
 russia_socialist_events.441.d:0 "Although Lenin is no longer alive, his party still maintains considerable influence—the fact that it holds one-fifth of the seats in the parliament is clear proof.\n\nThis prompted the veterans of the All-Russian Workers' Union to start seriously considering the possibility of forming a ruling alliance with the Bolsheviks, after all, only in this way could they obtain a majority of seats in the parliament and ensure that the revolutionary achievements were not sidelined.\n\nFacing the predicament of insufficient votes and the general dissatisfaction within the party with cooperating with the Socialist Revolutionary Party, old Tarun chose to remain silent. Meanwhile, Kamenev and L'vitsky reached a consensus: allying with the Bolsheviks is all gain and no harm, as it can both bridge the historical rift between the Mensheviks and the Bolsheviks and help ensure the smooth progress of future governance.\n\nTo demonstrate sincerity, in the party's temporary election, Lev Kamenev, who had a Bolshevik background, was nominated as a candidate for chairman. After the news came out, the Bolsheviks did not immediately comment, but they also did not openly oppose it—this silence itself was regarded by the Labor Union internally as tacit approval. Whether the nomination would ultimately be approved would depend on subsequent private negotiations between the two parties, but at least this step had already been taken."
 russia_socialist_events.441.a:0 "When workers join hands, victory is assured."
 RUS_vst_bolshevik_electoral_alliance_tt:0 "§rBolsheviks§! and §rAll-Russian Trade Union§! A de facto electoral alliance has been formed."
 russia_socialist_events.301.d:0 "The debate began immediately. The former Kremlin Senate was packed with people, but the chaos was still largely under control. Only Comrade Boris Kamkov was responsible for directing the crowd, bearing the arduous task of maintaining order in the hall.\n\nMany provisions of the future constitution were easily agreed upon, including socialist construction, the declaration of the Russian Socialist Federative Republic, absolute freedom of religion and language, and the rule of the workers' and peasants' soviets elected locally... but when it came to the details, the representative assembly immediately fell into endless debates.\n\nThe Bolsheviks, together with the Communists within the All-Russian Congress of Soviets of Workers', Peasants', and Soldiers' Deputies, revived the fundamental demand of 'All power to the Soviets.' Many Socialist Revolutionary Party members, especially the Maximalists, agreed with this. The moderates, however, demanded that the Bolsheviks clarify what exactly 'all power' meant.\n\nIn fact, some form of a national congress will still exist, but the nature of the congress must be clearly defined, otherwise a new dictatorship may arise due to vague provisions. The congress has been criticized by some as secret parliamentarism, and some have gone so far as to call it liberalism.\n\nIs it possible to establish a union chamber like in France? Is it possible to set up a chamber of regional representatives? Some have even proposed establishing a tricameral system. How will the government interact with the representative assembly and the Soviets? Is it possible to vote to dismiss the government?\n\nAfter a series of twists and turns, three equally matched proposals emerged. Although it was getting late, the representatives were still very excited and hoped to put the proposals to a vote. The 'Soviet' proposal did not make too many stipulations regarding state institutions and granted the congress elected by the Soviets nearly unlimited powers, allowing it to establish and abolish state institutions as needed. The 'Federal' proposal introduced more checks and balances, including guarantees for the representation of regions and unions. The third hybrid proposal was also put on the table, attempting to reconcile constitutional safeguards with unrestricted Soviet democracy."
 russia_socialist_events.301.a:0 "All power to the Soviets!"
 RUS_const_left_option_tt:0 "Article 97\n1) The Congress of Soviets and Trade Unions is the legislative body of the Russian Soviet Federative Socialist Republic.\n2) The congress is elected by the Soviets on the basis of universal suffrage.\n\nArticle 98\nThe composition ratio of the representatives at the congress is: one county soviet representative for every 25,000 voters, or one provincial soviet representative for every 125,000 voters.\n\nSuch regulations are likely to make §rAll-Russian Trade Union§!—§YBolsheviks§! The alliance won the majority in the congress.§rAll-Russian Trade Union Federation§! in §oLeft-wing§! Support this proposal."
 russia_socialist_events.302.d:0 "Soon after, the congress began discussing the nature of power in our newborn republic. The mainstream view was that no one wanted to suffer the crimes of 1918 again, when Russia couldn't even form a legitimate provisional government, and the Bolsheviks could only handle problems amidst chaos, with the outcome being obvious to all. Therefore, the legalization of government power was widely accepted.\n\nBut the representatives have much greater differences of opinion on government affairs. Those who oppose centralization hope that the executive power, which is fully accountable to the assembly, will be weakened. This would make consolidating power more difficult, but it could also directly result in the executive branch being unable to make any decisions. On the other hand, the government must be able to act expediently when the assembly cannot convene, and many are also concerned that without a strong central executive, the resistance of counter-revolutionary forces will become even stronger."
 russia_socialist_events.303.d:0 "At the time of the Republic's inception, it was in complete chaos. Many socialists had not yet joined any faction, and some seats changed hands multiple times in recall elections. But after the constitution was passed, the electoral system gradually stabilized. Many representatives continued to perform their duties in the Soviets and trade union congresses. Many of the older generation of socialists, seeing that the people could join hands and freely decide on all aspects of their own lives, would always shed tears when recalling the glorious moments of 1917. After enduring so much suffering and persecution, the working class finally regained freedom once again.\n\nThe first round of voting at the new congress is naturally the election of the Premier. The elected person will become the symbolic national leader and will preside over the congress meetings as a chairman or chairwoman (given Spiridonova's high probability of being elected, it is necessary to mention this). Being involved in every detail and offering advice to influence politics is where the real power of the Premier lies. It is expected that a senior and respected figure will win. The counting of votes is not yet complete, but it seems that many people support Lev Kamenev and Maria Spiridonova."
 russia_socialist_events.303.b:0 "See the spark of a star about to blaze into a raging flame!"
 russia_socialist_events.304.d:0 "After the Revolutionary Alliance won the election, Chairman Kamenev's primary task was to form a coalition government capable of stabilizing the situation. However, from the moment the congress rejected the cabinet's initial proposal, the divisions were fully exposed—supporters of Levitsky within the Labor Union, communist radicals, the Dunn faction, Bolshevik representatives, and members of the Socialist Revolutionary Party each held their own opinions, resulting in endless bickering. Assembling a government that could be barely acceptable to all parties was far more difficult than the revolution itself.\n\nAll parties were closely watching every inch of gain and loss in the distribution of power. Within the coalition government, the Socialist Revolutionary Party and the Bolsheviks were already at each other's throats. Meanwhile, within the labor union, the left and right factions were also restraining each other. The centrist faction led by Levitsky, while understanding Kamenev's compromise strategy, repeatedly reminded him: concessions should be limited, after all, they were there to realize Levitsky's political vision, not to make garments for others."
 russia_socialist_events.304.a:0 "Believe in the power of friendship, let Zinoviev come up."
 russia_socialist_events.304.b:0 "The new route theory is worth trying, supporting Levitsky."
 russia_socialist_events.304.c:0 "The Bolsheviks' General Secretary Stalin might be a good start."
 RUS_kamenev_sic_zinovyev_delayed_tt:0 "Completed §YAll-Russian Labour Union§! after focus,§YGrigory Zinoviev§! Will be appointed as the second in command."
 RUS_kamenev_sic_levitsky_delayed_tt:0 "Completed §YAll-Russian Labour Union§! after focus,§YVladimir Levitsky§! Will be appointed as the second in command."
 RUS_kamenev_sic_stalin_delayed_tt:0 "Completed §YAll-Russian Labour Union§! after focus,§YJoseph Stalin§! Will be appointed as the second in command."
 russia_socialist_events.442.t:0 "Kamenev takes office"
 russia_socialist_events.442.d:0 "The organizational work of the All-Russian Labour Union has been completed, and the revolutionary coalition's majority position in the congress has also been consolidated. After confirmation by the Central Committee of the Labour Union and the delegation of the Bolsheviks, Lev Kamenev officially took over the chairmanship and, in accordance with the arrangements made during the formation of the cabinet, nominated his deputies.\n\nThe new government's list is about to be announced. Now, Kamenev must prove that this alliance spanning the Trade Union Federation, the Bolsheviks, and other revolutionary factions can not only win the election but also truly govern Russia."
 russia_socialist_events.442.a:0 "Chairman Kamenev, please start working."
 RUS_iosif_stalin_sic:0 "$RUS_iosif_stalin$"
 russia_socialist_events.12.t:0 "Outline on the Past Proletarian Revolution"
 russia_socialist_events.12.d:0 "When the first civil war ended, all hopes were shattered along with it.\n\nAfterward, anti-Communist persecution was even more severe than during the Tsarist era — hundreds of thousands of workers were executed or died in concentration camps. Russian socialists who had fled to France, together with their colleagues remaining in the country, were all caught up in a severe existential question: what to do?\n\nA large number of writings by red exiles have emerged, gradually forming two schools of thought. One is represented by Yakov Sverdlov, Mikhail Kalinin, and others, who believe that the failure of the civil war was not the fault of the Communists, but should be attributed to policies that were not implemented in practice and the betrayal of internal opportunists. Sverdlov and the old Bolsheviks adhered to orthodox Marxist-Leninism and, for a long time, sought influence in White Russia through their association with the 'integration movement.'\n\nSverdlov once made a famous assertion: Political parties and trade unions in France ignore revolutionary unity and compete for power among themselves, causing their socialist state to degenerate into a system of 'bureaucratic sectarianism.' The orthodox Communists in fact oppose the so-called institutional democracy—which is merely a vassal of capitalism—and advocate for a broader democratic life and popular participation.\n\nAnother school of thought among the exiles emerged in the 1920s, mainly composed of pro-Menshevik thinkers. In a pamphlet written in prison in 1924, 'Outlines on Past Proletarian Revolutions,' Lev Kamenev pointed out that disregarding unity was the primary mistake of the Russian left. Kamenev believed that the 1919 French revolution demonstrated the feasibility of a multi-faceted revolutionary approach—that is, different social classes collectively advancing the revolution through revolutionary parties, trade unions, and other proletarian organizations. The February Revolution succeeded precisely through this method; however, the Russian left consistently refused to give up their illusions about the White government, forcing the Bolsheviks to adopt more stringent measures of suppression.\n\nAlthough Kamenev's theory was widely accepted by Russian socialists, it was often regarded as revisionism within the exile community. Based on this theory, Vladimir Levitsky proposed the concept of 'Communist Synthesis,' the core of which is: to avoid falling into tyranny, future Russian communism must exist as a synthesis of various socialist viewpoints, and no group can impose its will on the Soviets chosen through democratic elections. In practice, Levitsky was always committed to uniting different factions of Russian socialists to build a popular front that transcended the old Bolshevik–Menshevik split—he ultimately achieved this goal by establishing the All-Russian Labour Union."
 russia_socialist_events.31.t:0 "Communist Party of Russia"
 russia_socialist_events.31.d:0 "Under the leadership of Yakov Sverdlov and Joseph Stalin, the backbone of the old Bolsheviks had regained a foothold across the land of Russia.\n\nAlthough the road to the election remains unclear, speeches by the revolutionary veteran Frunze have already stirred waves of responses at public gatherings in Petrograd. He detailed to the Russian people the truths of communism he and his comrades had come to understand through their movements across various regions—from Fahrensteil in New France, to Red Birmingham, and even to the bloody clashes on the Patagonia plains.\n\nThese personal experiences directly gave rise to the new program of the Russian Bolshevik Party—\"What Is to Be Done?\" This document exposed the essence of a pseudo-revolution: after the revolution, the liberals and capitalists still roamed free, while the so-called 'workers' representatives' revealed their dual faces. The 'champagne socialists' in the Duma, as well as the social-democrats who had wasted twenty years in literary salons, had long strayed from the true path of socialism.\n\nAs for Spiridonova? The Russian people must never be deceived — was it not these fame- and profit-seeking traitors who caused the disintegration of the revolution back then?\n\nIn those years, only Lenin truly cared about you, and now, only Lenin's followers still care about you!"
 russia_socialist_events.31.a:0 "What kind of trouble can these students of Lenin still cause?"
 russia_socialist_events.4.t:0 "The Rise of the Labour Party"
 russia_socialist_events.4.d:0 "After experiencing long-term illegal bans and political persecution, Russian socialists can finally freely organize political activities. Although most socialists joined the All-Russian Labor Union led by Levitsky or continued to remain loyal to the cause of the Socialist Revolutionary Party, many small parties were still gradually established.\n\nAmong the 'Old Republic' parties, the only one that still retains influence is the Socialist Democratic League led by Zeller. The SDL was mainly formed from a significantly weakened Radical Democratic Party; after the radicals left, it absorbed some new members from the right, who hoped to advance a more conservative or moderate agenda through the party.\n\nAnother old political party making a resurgence is the reviving Russian Communist Party (Bolsheviks), whose Central Committee returned from exile under Sverdlov's leadership. However, the party's strength is far from what it once was during its heyday. Tomsky and other Bolsheviks involved in the Russian trade union movement did not return, instead choosing to join the All-Russian Union of Labor to seek greater political influence, which further weakened the Bolsheviks' power. Nevertheless, the Bolsheviks were not unpopular; even today, they still hold significant influence among radical workers and poor peasants. To limit the Bolsheviks' development, the various political parties reached an informal agreement to prevent the Bolsheviks from accessing key positions of power.\n\nAt the same time, there are also dozens of small parties centered around well-known left-wing figures or marginal ideologies (such as anarchism and women's rights). Among these small parties and independent legislators, there are also many members who do not truly believe in socialism and only follow it superficially. Although these small parties have limited influence individually, they do form a relatively large minority group in the representative assembly."
 russia_socialist_events.4.a:0 "A tangled mess..."
 russia_socialist_events.9.t:0 "The revamped Bolsheviks"
 russia_socialist_events.9.d:0 "After the dust of the civil war settled, the Bolshevik Party organization, having learned its lessons, was completely renewed. Under Sverdlov's determined rectification, the massive party machinery was trimmed and strengthened, transforming into a lean and efficient political weapon, while most of the 'unreliable elements' chose to step aside on their own.\n\nMost of them then joined the All-Russian Labor Union, forming the left-wing faction within the organization under the leadership of Lev Kamenev. Kamenev escaped execution after the war, but could not avoid ten years of imprisonment—perhaps for this reason, he became the most prestigious former Bolshevik in post-revolutionary Russia and laid out a theoretical blueprint for the future of Russian communism. To be fair, the reason the All-Russian Labor Union was able to stand firm was entirely due to the painstaking efforts of Levitsky and Kamenev, who rallied the old members of the Russian Social Democratic Labor Party, and bridged, albeit barely, the gap between the Bolsheviks and the Mensheviks.\n\nWithin the All-Russian Labor Union, there was also another faction of former Bolsheviks, composed of opportunists such as Grigory Zinoviev. As early as 1918, Zinoviev had parted ways with Sverdlov due to differences in revolutionary strategy. Later, the 'Russian Communist Workers' Party' (RKTP) that he founded, although short-lived, was ultimately integrated into the left-wing landscape of the All-Russian Labor Union.\n\nBut it is obvious that Zinoviev's ambitions go far beyond serving as a small faction within the All-Russian Labor Union. In confrontations over practical political issues, there has always been a deep rift between him and Kamenev's moderate communists. To remove potential obstacles in the future, he has quietly begun to rebuild his influence within the Bolshevik party."
 russia_socialist_events.9.a:0 "Lenin's legacy has been shattered into pieces."
 russia_socialist_events.194.t:0 "White Army Snake Head"
 russia_socialist_events.194.d:0 "Russia is permeated with the atmosphere of civil war. When the new socialist government issued its first decrees in Moscow, most of Russia remained in chaos. But this was not the chaotic mess of 1917, when Russia was in a state of anarchy and whoever had a gun was the local ruler. Nowadays, most civil servants seem to consider the authorities sufficiently legitimate, so they did not actively resist, with only sporadic armed uprisings occurring in certain areas. The assurances of the provisional president calmed some of the tension, and many even harbored cautious hope, as the new government appeared more like the provisional government that never came to fruition in 1917.\n\nThe largest military conspiracy centered around Mikhail Drozdovsky was also exposed, and the general was immediately arrested and imprisoned. After the main forces of the White Army were destroyed, many officer corps in the stationed units still tended to resist, but the vast majority of ordinary soldiers and non-commissioned officers were unwilling to take up arms against the new revolutionary government; instead, in many places, they arrested their former commanders. Led by General Alexander Vasilevsky, a total of 28 young generals jointly published a widely circulated letter in which they recognized the new government, called on the army to exercise restraint, and demanded the organization of free elections.\n\nThe former Army Chief of Staff and some senior officers were imprisoned for allegedly participating in the crimes of the Savinkov regime. Some managed to escape, and a few died resisting arrest. In certain cases, small-scale clashes also broke out. On the eve of the civil war, our security forces successfully captured Denikin, Wrangel, Drozdovsky, and Kutepov, while Markov remained at large. With Petrograd and Tsaritsyn successively liberated, the organized reactionary armies were crushed, and the few stubborn White Army forces were relatively effectively eliminated."
 russia_socialist_events.194.a:0 "We will never give the White Army an opportunity."
 russia_socialist_events.332.d:0 "Within the workers' union, there are sharp divisions over how to solve the 'agricultural problem'.\n\nMembers of the Socialist Revolutionary Party had long been eager to act—they had always prided themselves on being guardians of the peasants. Frankly speaking, few parties in all of Russia had as deep an understanding of rural realities as the SRs. Spiridonova's husband, Ilya Mayorov, naturally became the primary candidate. This pragmatic agricultural economist called himself a 'peasant Communist' and insisted that Russian peasants could not be forcibly thrust into socialism, but could only transition through the gradual maturation of material conditions.\n\nIn direct opposition to this is Sergey Dubrovsky, who represents the views of the majority of the members of the All-Russian Labor Union. He advocates breaking the traditional rural structure by force and forcing agriculture into modernization through large-scale industrial projects and the expansion of provincial cities.\n\nHowever, there was a third candidate—the leader of the Socialist Revolutionary Party Maximalists, Alexei Ustinov. As a far-left within the party, he proposed a new form of agricultural production called 'collective farms,' believing that only through this transitional form could the countryside be freed from hunger and poverty. Perhaps his plan was the truly comprehensive strategy."
 russia_socialist_events.421.t:0 "Bolsheviks Revival"
 russia_socialist_events.421.d:0 "Under Kamenev's meticulous coordination and the Bolsheviks' own strong organizational capabilities, the rejuvenated Bolshevik Party quickly regained control of the nation's power center. Increasingly more party members were placed or elected into key government positions, and the party's political program gained broader recognition across all social strata than ever before. On the public level, the All-Russian Labor Union, by forming a de facto ruling alliance with the Bolshevik Party, temporarily stabilized the situation, providing the necessary legitimacy to support the party's governance.\n\nOn the dark side of the power system, the 'revolutionary trio' composed of Kamenev, Sverdlov, and Stalin regularly met in secret to discuss the long-term direction of the party. The three agreed that the current socialist republic had still far from completely eliminated the remnants of capitalism—in the economic sphere, a group of 'old factory directors' with real power continued to follow old management practices and resisted the new production order; in the local administrative system, many bureaucrats retained from previous regimes still paid lip service while subverting directives, even forming independent small interest groups at the grassroots level.\n\nAfter several closed-door consultations, the three of them set the overall strategy for the Bolsheviks for the upcoming period: without touching the existing state structure, they would fully infiltrate and expand the party's actual influence in various fields — including strengthening party cells within trade unions, sending reliable cadres to local soviets, controlling propaganda tools, and secretly establishing emergency command networks. At the same time, they also began drafting a contingency plan for a 'second revolution,' so that once the time was right, or when the old forces showed obvious instability, they could quickly launch a top-down purge and reorganization, completely eliminating all factors that hindered the deepening of socialism."
 russia_socialist_events.421.a:0 "Welcome, comrade."
 RUS_bolshevik_gamble_trigger_tt:0 "In order to launch the Stalin line, the focus must be completed first.§YEstablish the State Military Commission§!."
 RUS_socrus_coalition_mechanic_decisions_desc:0 "After the fall of the Savinkov regime, local rural Soviets and trade union organizations developed rapidly, gradually forming a nearly abnormal governance structure.\n\n §RSocialist Revolutionary Party§! Due to the merits from the uprising and the foundations of village organization, he advocated for leadership of the new regime;\nResuming the event publicly §oRCP(b)§! Then, with the help of returned cadres, party members in the military, and urban party organizations, gradually accumulate strength;\nChaired by Kamenev §rAll-Russian Labor Union§!, then coordinate and navigate between the two parties, striving to maintain the hard-earned leadership position of oneself.\n\nDue to the pressures of reality, the three parties had to maintain an outwardly sincere unity and jointly promote the reconstruction of Russia.\n\nIf no major 'accidents' occur in the future, the direction of the evolution of the relationship among the three parties will ultimately determine the path the workers' alliance takes.\n\n §RBe sure to properly handle the relationships between all factions!§!§YThe actual abilities of advisors will change in real time depending on the relationships of their respective factions; deteriorating relationships will directly weaken the effects of the corresponding advisors.§!\n\n §YPolitical Landscape of the Workers' Union§!:[RUS_RKP_is_shown]\nand §RSocialist Revolutionary Party§! Relationship: [?sr_var|0][RUS_VST_PSR_status]\n §rAll-Russian Trade Union§! Internal: [RUS_VST_centre_is_shown][RUS_VST_left_is_shown][RUS_VST_right_is_shown]\nand §1Social Democratic Party§! The relationship: [?sds_var|0]\n\nReducing relations with any party to zero will result in that party leaving the workers' alliance.\n\n§RSocialist Revolutionary Party§! does not favor the current coalition government; if its influence grows too large, the government will §rbecome paralyzed§!!"
 RUS_vst_party_streamlined_idea:0 "Workers' Union: Streamlined and Efficient"
 RUS_vst_party_streamlined_idea_desc:0 "The opposition within the workers' union has been marginalized, with its core united around [ROOT.GetLeader]. The amendments previously formed by various factional relationships will be retained at the level completed after streamlining and will no longer change with factional relationships."
 RUS_RKP_has_relations:0 "\nand §oRCP(b)§! The relationship: [?rkp_var|0]"
 RUS_military_production_idea:0 "Federal Armaments and Defense Industry Commission"
 RUS_military_production_idea_desc:0 "The Federal Armaments and Defence Industry Commission incorporates the General Staff, the federal planning agencies, military-industrial institutions, and armament factories into a unified armament development procedure, allowing design, testing, ordering, and mass production to be coordinated and advanced around the actual needs of the Red Army."
 RUS_central_vpk:0 "Federal Armaments and Defense Industry Commission"
 RUS_central_vpk_desc:0 "The Federal Armaments and Defence Industry Commission unifies and coordinates the work of military industrial organizations, planning authorities, and army procurement departments, ensuring that design, testing, production, and equipment acceptance follow the same set of national defense construction plans."
 RUS_council_of_industrialists_desc:0 "The Industrialists' Committee is a permanent body that undertakes functions similar to those of the Federal Armaments and Defence Industry Commission, responsible for managing Russia's military production and providing expertise to the state."
