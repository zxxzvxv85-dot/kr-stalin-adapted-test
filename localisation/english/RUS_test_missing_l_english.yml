 RUS_fr_federal_plan_armaments_allocation:0 "Additional military funding"
 RUS_fr_federal_plan_armaments_allocation_desc:0 "Adjust the current period's plan indicators and add a batch of steel, machine tools, vehicles, and communication equipment for the military reform."
 RUS_fr_draw_general_staff_reserves:0 "Mobilize the General Staff reserves"
 RUS_fr_draw_general_staff_reserves_desc:0 "Using organizational capital and mature plans represented by army experience to exchange for a batch of reserves that can be immediately put into reform."
 RUS_fr_wartime_emergency_procurement:0 "Emergency Procurement During Wartime"
 RUS_fr_wartime_emergency_procurement_desc:0 "After the outbreak of war, conduct an emergency procurement to obtain 30 points of Military Reform Materiel, but reduce stability; this measure can only be used once per construction cycle."
 RUS_fr_field_political_agitation:0 "Frontline Political Propaganda Touring Team"
 RUS_fr_field_political_agitation_desc:0 "Select political work cadres, war correspondents, and exemplary grassroots soldiers to form a touring team, conducting short-term political mobilization in training camps, replacement stations, and newly formed units."
 RUS_fr_general_staff_wargames:0 "General Staff War Game"
 RUS_fr_general_staff_wargames_desc:0 "Organize staff officers to conduct continuous wargaming, repeatedly testing railway scheduling, fire preparation, and reserve deployment on the same map."
 RUS_fr_deep_battle_exercise:0 "Deep Penetration Drill"
 RUS_fr_deep_battle_exercise_desc:0 "Focusing on motorized reconnaissance, artillery relocation, and the deployment of the second echelon, conduct a round of short-term deep breakthrough exercises."
 RUS_fr_central_military_liaison:0 "Central Military-Civil Coordination Conference"
 RUS_fr_central_military_liaison_desc:0 "Convene a short-term coordination meeting with representatives from the General Staff, political organs, and main military regions to reduce delays and buck-passing in the transmission of orders."
 RUS_fr_academy_research_groups:0 "Military Academy Theoretical Research Group"
 RUS_fr_academy_research_groups_desc:0 "Instructors were seconded from the Thunderstorm Military Academy and the Frunze Regulations Drafting Group to organize case studies, teaching materials, and research notes on military doctrines in a short-term intensive manner."
 RUS_fr_unified_training_rotation:0 "Unified Rotation Plan"
 RUS_fr_unified_training_rotation_desc:0 "Rotate cadres and grassroots backbones according to the unified training outline, allowing troops from different military regions to complete make-up training under the same set of standards."
 RUS_fr_military_district_readiness:0 "Military Region Combat Readiness Verification"
 RUS_fr_military_district_readiness_desc:0 "A inspection team dispatched by the General Staff carried out surprise checks on the mobilization tables, warehouses, transportation nodes, and operational plans of various military regions."
 RUS_fr_voronezh_exercise_review:0 "Voronezh Exercise Review"
 RUS_fr_voronezh_exercise_review_desc:0 "Write the mistakes exposed in the Voronezh grand exercise into review materials, and promote a round of short-term corrective training across the entire military."
 RUS_fr_emergency_workshop_norms:0 "Military Workshop Assault Standards"
 RUS_fr_emergency_workshop_norms_desc:0 "Key workshops are jointly inspected by the quartermaster, engineers, and union teams, using short-term blitzes to standardize procedures, acceptance, and production discipline."
 RUS_fr_develop_katyusha_rocket_artillery:0 "Develop the Katyusha rocket launcher"
 RUS_fr_develop_katyusha_rocket_artillery_desc:0 "investment §Y[?RUS_fr_xp_cost_50|1]§! Leverage army experience, complete tests of rockets, launchers, salvo control, and vehicle-based deployment within 120 days, and establish a unified technical system applicable to both towed and self-propelled rocket artillery."
 RUS_fr_reform_command_audit:0 "Phase One: Command System Audit"
 RUS_fr_reform_command_audit_desc:0 "investment §Y[?RUS_fr_xp_cost_100|1]§! Conduct a 120-day continuous command system audit based on army experience, prioritizing the rectification of the command chain, combat plans, and the operational front."
 RUS_fr_reform_standard_tables:0 "Second Stage: Unified Compilation and Military-Political Standards"
 RUS_fr_reform_standard_tables_desc:0 "investment §Y[?RUS_fr_xp_cost_100|1]§! Based on army experience, conduct a unified reorganization lasting 120 days, focusing on clarifying military and political authority, standardizing the organization, and restoring troop coordination."
 RUS_fr_reform_training_cycles:0 "Phase Three: Training and Support Cycle"
 RUS_fr_reform_training_cycles_desc:0 "investment §Y[?RUS_fr_xp_cost_100|1]§! Carry out a continuous 90-day training rectification based on army experience, focusing on the reconstruction of training, mobilization, replenishment, and logistics cycles."
 RUS_fr_reform_grand_field_test:0 "Phase Four: National Live-Fire Exercise"
 RUS_fr_reform_grand_field_test_desc:0 "investment §Y[?RUS_fr_xp_cost_100|1]§! Conduct a nationwide live troop inspection based on Army experience for 90 consecutive days to complete the basic rectification of the general military system; issues related to doctrine, officer training, equipment standards, and inter-service coordination still need to be addressed individually through corresponding reforms."
