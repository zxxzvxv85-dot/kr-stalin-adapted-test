l_english:
  RUS_labour_aristocracy: "Cultivate Socialist New Culture"
  RUS_labour_aristocracy_desc: "A socialist republic cannot rely only on factories, schools and armies to sustain itself. New social relations require a new language, new art and new everyday life. The workers and peasants must gain the right to speak in cultural construction, while vanguard cadres must answer a question of their own: are they speaking on behalf of the masses, or helping the masses learn to speak in their own voice?"
  RUS_education_reform_effect_new_culture_popularisation_tt: "Add effects to §Y$RUS_reforming_education_system$§!:\nConsumer Goods Factories Factor: §R+5.00%§!\nDaily Political Power Gain: §G+5.00%§!"
  RUS_education_reform_effect_new_culture_elite_art_tt: "Add effects to §Y$RUS_reforming_education_system$§!:\nConsumer Goods Factories Factor: §G-5.00%§!\nDaily Political Power Gain: §R-5.00%§!"
  RUS_education_reform_effect_revolutionary_realism_tt: "Add effects to §Y$RUS_reforming_education_system$§!:\nParty Popularity Stability Modifier: §G+10.00%§!"
  RUS_education_reform_effect_revolutionary_romanticism_tt: "Add effects to §Y$RUS_reforming_education_system$§!:\nResearch Speed: §G+10.00%§!"
  rus_stalin_new_culture_events.next: "Continue."
  rus_stalin_new_culture_events.1.t: "Creators of a New Culture"
  rus_stalin_new_culture_events.1.desc: "To lay the foundation for socialist culture, representatives of workers and peasants convened a congress on socialist cultural development. During the meeting, they would decide the future direction of culture.\n\nThe first question before them was simple: who creates the new culture?\n\nThe question was raised by a peasant representative from Voronezh Governorate. He said: “A few days ago our village put out a wall newspaper. It was written by cadres from above. The wording was beautiful, but after it was posted, people walked past, glanced at it and left. Later an old peasant took the wall newspaper down and wrote a doggerel poem on the back. The day that poem was posted, more than twenty people gathered to read it. I am not saying the cadres wrote badly. I am saying that the cadres wrote at a desk, while that poem was written squatting on a field ridge.”\n\nThere was laughter in the hall, but after the laughter ended, the question was placed solemnly on the agenda.\n\nOne voice argued that the new culture must be created by the workers and peasants themselves.\n\nThose who supported this direction held that culture cannot simply be distributed from above. If culture is merely poured down into the masses from the top, how is it different from the old regime's moral instruction? The vitality of the new culture lies in the fact that it must come from those who truly live in labour: their language, their feelings and their forms of expression are the truest soil of the new culture.\n\nThe role of cadres should be to provide materials and tools, not to prescribe content and form. Let wall newspapers be run by villagers, clubs managed by workers, and poems written by hands that have held hoes and wrenches. Even if such work is rough and immature at first, it remains the workers' and peasants' own expression, with a liveliness and sincerity that no finely polished cadre art can replace."
  rus_stalin_new_culture_events.1.desc_2: "Another voice argued that the workers and peasants need cadre guidance and organisation.\n\nThe masses live on the front line of labour, but they lack systematic cultural training and theoretical equipment. Without cadre organisation and guidance, spontaneous cultural expression by workers and peasants may slide back into the inertia of old forms: singing old tunes and painting old patterns, merely replacing the word tsar in the lyrics with chairman. A truly socialist new culture needs someone to point the way and hold the line.\n\nCadres do not come to replace the creative work of workers and peasants, but to help raise it. A village can run its own wall newspaper, but if no cadre tells them which content accords with socialist principles, they may write things that are lively yet shallow.\n\nBoth voices have their reasons.\n\nSupporters of worker-peasant self-creation say that cadre-led culture will eventually become cadre culture, with the masses reduced to passive recipients. The new culture will lose its most precious quality: its mass character. A culture without mass participation, however refined, is not socialist culture.\n\nSupporters of cadre guidance say that complete spontaneity may lead to cultural regression. Cultural progress needs direction and standards, and these can only be provided by cadres with more education and training. If one speaks only of mass character and not of advanced character, the new culture will forever remain at the level of wall newspapers and doggerel.\n\nThe answer to this question will determine the foundation of future cultural construction: will culture be built from above, or grown from below? The former guarantees speed and order; the latter guarantees truth and warmth. Yet culture is something that needs time to ferment. Too fast, and it remains on the surface; too slow, and the moment may be missed. Finding a viable road between the two is the true difficulty of this discussion.\n\nThe congress decided to vote. The representatives believed:"
  rus_stalin_new_culture_events.1.a: "If it never touches the soil, what good is a tower in the clouds?"
  rus_stalin_new_culture_events.1.a.tt: "We will prioritise worker-peasant self-creation."
  rus_stalin_new_culture_events.1.b: "Without guidance, what use are vanguard cadres?"
  rus_stalin_new_culture_events.1.b.tt: "We will prioritise cadre guidance."
  rus_stalin_new_culture_events.2.t: "Popularisation or Elevation?"
  rus_stalin_new_culture_events.2.desc: "Cultural resources are limited. This hardly needs proof. Paper, ink, film, teachers, projectors: everything has a quota, and every allocation must be fought for again and again. When there are only so many materials that can be sent to the countryside, the choice inevitably appears on the table: should these limited things be used to print one hundred thousand literacy manuals, or one finely bound collection of revolutionary poetry?\n\nThe question was posed by a representative of the People's Commissariat of Education. In his speech, he offered several sets of figures: “With our current paper quota and printing capacity, the paper required for one two-hundred-page poetry collection is enough to print eight thousand literacy wall charts. The charts can be posted in eight thousand village clubs; the poetry collection can only sit on a few hundred shelves.”\n\nSome in the hall lowered their heads and calculated. No one spoke.\n\nThe dispute soon split into two roads.\n\nOne side argued that the first task of cultural construction is to let as many people as possible come into contact with culture. If a person has never read a book, heard a play or seen a painting, one cannot discuss with him what kind of book, play or painting is good. First spread quantity, let the seeds of culture be sown as widely as possible, and after everyone has a chance to read, see newspapers and watch a film, then speak of quality. That is the realistic and reliable path.\n\nUnder this view, resources should first go to popular cultural activity: more rural mobile projection teams, more literacy textbooks, more travelling theatre troupes. A poetry collection can be thin, even mimeographed as a pamphlet; a painting need not be of high artistic standard, so long as it can be hung in every village club. Something is better than nothing, and more is better than less."
  rus_stalin_new_culture_events.2.desc_2: "The other side acknowledged the importance of popularisation, but argued that the premise of popularisation is having something worth popularising. If the new culture remains forever at the level of leaflets and wall charts, it will never replace the old culture in the hearts of the masses. A peasant who watches ten crude travelling performances may remember less than one line from a good play, and that line may take root in his heart and become a standard by which he judges other things.\n\nUnder this view, resources should be concentrated on the creation of fine works: funding a good play, publishing a good novel, filming a good movie. Even if this means printing tens of thousands fewer leaflets, a single work that truly enters the hearts of the masses has far greater influence than propaganda that is forgotten as soon as it is seen. The premise of quantity turning into quality is that the quality itself deserves to exist.\n\nAt root, the two positions differ in their judgement of the time logic of cultural construction.\n\nThe popularisers believe that culture cannot leap upward within a single generation. First everyone must cease to be illiterate, then one can speak of classics; first everyone must have seen a play, then one can speak of good plays. This road is slower, but steadier and more consistent with objective limitations.\n\nThe elevationists believe that cultural leaps are achieved precisely through a minority of fine works. The first edition of The Communist Manifesto was not large, yet it changed the way the whole world thought. If one speaks only of quantity and not quality, cultural construction becomes a soulless statistical game. In the end only figures remain, and not one work that can be remembered.\n\nThe congress decided to vote. Most representatives were more convinced by:"
  rus_stalin_new_culture_events.2.a: "Quantity turns into quality."
  rus_stalin_new_culture_events.2.a.tt: "We will endorse the popularisation line."
  rus_stalin_new_culture_events.2.b: "One classic is worth a thousand leaflets."
  rus_stalin_new_culture_events.2.b.tt: "We will endorse the elevationist line."
  rus_stalin_new_culture_events.3.t: "The Emphasis of Revolutionary Art"
  rus_stalin_new_culture_events.3.desc: "“What should the new culture look like?”\n\nThe question was raised by a southern representative: “We have built schools, run newspapers and opened clubs, but what will be performed in the clubs? What will hang on the walls? If the new culture has no artistic language of its own, it will forever be water without roots.”\n\nTwo voices formed in the hall.\n\nOne advocated Comrade Zhdanov's revolutionary realism.\n\nArt must take root in reality and accurately reflect the concrete struggles of socialist construction. This does not mean copying reality, but using truthful details and concrete situations to let workers and peasants see their own lives in art: the mud stuck to tractor tracks, the dust floating in granaries, the wrinkles scorched by the sun on collective farmers' faces. Revolutionary realism believes that reality itself is already powerful enough; art need only present it honestly."
  rus_stalin_new_culture_events.3.desc_2: "The other advocated Comrade Mayakovsky's revolutionary romanticism.\n\nMerely reflecting reality is not enough. Revolution is not only what is happening now, but what the future will become. Art should carry a temperature higher than reality and depict a vista that can inspire the people to move forward. It does not avoid ideals; it deliberately enlarges them, because workers and peasants need to see the ultimate goal of their struggle in art. Revolutionary romanticism believes that art is not a mirror, but a lamp: it not only shows reality, but lights the road ahead.\n\nThe realists believe romanticism easily slides into empty lyricism, while the romanticists fear that realism may become a mediocre record of trivial daily life. Both voices have their positions and their reasons.\n\nThe direction of art will determine the literary and artistic works of the country for the next decade, and also determine how a generation understands the age in which it lives.\n\nThe congress decided to vote. Two choices stood before the representatives:"
  rus_stalin_new_culture_events.3.a: "Let art take root in real struggle, with truth as the highest standard."
  rus_stalin_new_culture_events.3.a.tt: "We endorse revolutionary realism."
  rus_stalin_new_culture_events.3.b: "Let art look toward the future, with the ideal as the highest standard."
  rus_stalin_new_culture_events.3.b.tt: "We endorse revolutionary romanticism."
  rus_stalin_new_culture_events.4.t: "Religion and Socialism"
  rus_stalin_new_culture_events.4.desc: "The former Russian Empire may fairly be called a semi-religious country. The influence of Orthodoxy and its church penetrated every corner of folk life: from baptism at birth to prayers for the dead, from blessing rituals before spring ploughing to thanksgiving services after the autumn harvest, the church's presence in people's lives endured far longer than that of any administrative body. The great majority of our revolutionaries were themselves once Orthodox believers in their youth. No one can deny that the church preserved peasant oral traditions, distributed bread during famine years, and for a long time served as the only cultural centre of the Russian countryside.\n\nSome believe that our goals are essentially consistent with the vision of the early Christians: peace on earth, human unity, and equality for all. In their view, early Christianity's resistance to the slave system of the Roman Empire and socialism's resistance to capitalist exploitation share a certain spiritual temperament. The former placed hope in the next world, while the latter seeks to realise it in this one. This perspective of continuity leads some to advocate transformation instead of destruction, using socialist construction to absorb the valuable parts of religious culture.\n\nYet the opposing voice is just as loud. The early Christians awaited the kingdom of heaven, while we are building the world of humanity. As a social organisation, the Christian church depends by its very nature on supernatural authority intervening in worldly order, which is fundamentally incompatible with the rationalist foundation of socialism. If the church is allowed to continue existing, it will be like an old nail buried under the roadbed, one day suddenly puncturing the tyre."
  rus_stalin_new_culture_events.4.desc_2: "The problem does not end there. The church's power structure in the countryside is not only spiritual. It owns land, though this has already been confiscated in the land reform; it owns schools, which are being transformed; it holds a ritual monopoly over birth, illness, death and mourning. It need not openly oppose Soviet power. Merely continuing to play the role of another authority in the village is enough to leave the new regime's grassroots organisations constrained. When a peasant encounters difficulty, does he first seek the party secretary or the priest? In many places the answer remains unclear.\n\nThe congress ultimately formed two different lines on this question.\n\nCompletely eliminate religious influence. The church and the old system are one body. Unless religious influence is removed, socialist ideology cannot truly take root in the countryside. Churches should be converted into clubs or warehouses, religious education should be prohibited, and clergy should be transferred to new occupations or re-educated. Only by cutting the thread between God and man can the people truly understand that what saves them is not prayer in heaven, but the plough and hammer in their hands.\n\nGradually improve religious relations. Immediate forced abolition of religion would create unnecessary confrontation, especially in rural regions where faith is deeply rooted. Through education, cultural construction and social security, the real influence of the church should be weakened step by step. When peasants feel that the state offers more reliable help than the church, they will naturally turn toward a new way of life. Religion itself will fade as social conditions change. There is no need to rush to uproot it by administrative means.\n\nAfter the final vote, the congress inclined toward:"
  rus_stalin_new_culture_events.4.a: "Religion is the opium of the people..."
  rus_stalin_new_culture_events.4.a.tt: "We will break with religion."
  rus_stalin_new_culture_events.4.b: "...but the question is why the people turn to Him."
  rus_stalin_new_culture_events.4.b.tt: "We will reconcile with religion."
