 RUS_ukr_land_agitation:0 "Rural Land Disputes"
 RUS_ukr_rail_slowdown:0 "Railway Slowdown"
 RUS_ukr_war_low:0 "Underground Wartime Sabotage"
 RUS_ukr_war_medium:0 "Coordinated Underground Sabotage"
 RUS_ukr_war_high:0 "Widespread Underground Sabotage"
 RUS_ukr_war_mine:0 "Wartime Mining Strikes"
 RUS_ukr_war_rural:0 "Disrupted Rural Mobilisation"
 RUS_ukr_war_attack:0 "Ukrainian Railway Intelligence"
 RUS_ukr_families:0 "Aid the Families of the Defeated"
 RUS_ukr_families_desc:0 "Political power: 25. At 50 alert, pay 10 more. Infantry equipment: 0. Strength: 0. Duration: 30 days. Consumer goods factory factor +2% while active. Cooldown after completion or cancellation: 180 days. Cancellation removes the active consumer goods burden, without refunding spent resources. \nStrength +15; alert +5. "
 RUS_ukr_families_result_tt:0 "Strength +15; alert +5. "
 RUS_ukr_mine:0 "Rebuild Donbas Miners’ Mutual Aid"
 RUS_ukr_mine_desc:0 "Political power: 35. At 50 alert, pay 10 more. Infantry equipment: 0. Strength: 0. Duration: 45 days. Consumer goods factory factor +3% while active. Once per game on success. Cancellation removes the active consumer goods burden, without refunding spent resources. \nStrength +15; alert +10. Establish the mining network."
 RUS_ukr_mine_result_tt:0 "Strength +15; alert +10. Establish the mining network."
 RUS_ukr_rural:0 "Contact Rural Socialist Remnants"
 RUS_ukr_rural_desc:0 "Political power: 35. At 50 alert, pay 10 more. Infantry equipment: 500. Strength: 0. Duration: 45 days. Consumer goods factory factor +2% while active. Once per game on success. Cancellation removes the active consumer goods burden, without refunding spent resources. \nStrength +15; alert +15. Establish the rural network. Ukraine having completed Purge Republican Sympathisers adds another 5 alert."
 RUS_ukr_rural_result_tt:0 "Strength +15; alert +15. Establish the rural network. Ukraine having completed Purge Republican Sympathisers adds another 5 alert."
 RUS_ukr_rail:0 "Restore Railway Workers’ Contacts"
 RUS_ukr_rail_desc:0 "Political power: 40. At 50 alert, pay 10 more. Infantry equipment: 0. Strength: 0. Duration: 60 days. Consumer goods factory factor +3% while active. Once per game on success. Cancellation removes the active consumer goods burden, without refunding spent resources. \nStrength +10; alert +10. Establish the railway network."
 RUS_ukr_rail_result_tt:0 "Strength +10; alert +10. Establish the railway network."
 RUS_ukr_relocate:0 "Relocate Underground Cadres"
 RUS_ukr_relocate_desc:0 "Political power: 20. No high-alert surcharge. Infantry equipment: 0. Strength: 0. Duration: 30 days. Consumer goods factory factor +2% while active. Cooldown after completion or cancellation: 60 days. Cancellation removes the active consumer goods burden, without refunding spent resources. \nStrength +0; alert -20. "
 RUS_ukr_relocate_result_tt:0 "Strength +0; alert -20. "
 RUS_ukr_declaration:0 "Print a Joint Underground Declaration"
 RUS_ukr_declaration_desc:0 "Political power: 40. At 50 alert, pay 10 more. Infantry equipment: 0. Strength: 0. Duration: 45 days. Consumer goods factory factor +3% while active. Once per game on success. Cancellation removes the active consumer goods burden, without refunding spent resources. \nStrength +20; alert +15. Revolutionary readiness +2 points."
 RUS_ukr_declaration_result_tt:0 "Strength +20; alert +15. Revolutionary readiness +2 points."
 RUS_ukr_strike:0 "Fund a Miners’ Strike"
 RUS_ukr_strike_desc:0 "Political power: 30. At 50 alert, pay 10 more. Infantry equipment: 0. Strength: 15. Duration: 30 days. Consumer goods factory factor +2% while active. Cooldown after completion or cancellation: 120 days. Cancellation removes the active consumer goods burden, without refunding spent resources. \nStrength +0; alert +15. Ukraine: stability -3 percentage points (at most three times per game); factory output -5% for 90 days. Ukraine having completed Purge Republican Sympathisers adds another 5 alert."
 RUS_ukr_strike_result_tt:0 "Strength +0; alert +15. Ukraine: stability -3 percentage points (at most three times per game); factory output -5% for 90 days. Ukraine having completed Purge Republican Sympathisers adds another 5 alert."
 RUS_ukr_land:0 "Distribute Land Registers"
 RUS_ukr_land_desc:0 "Political power: 25. At 50 alert, pay 10 more. Infantry equipment: 0. Strength: 10. Duration: 30 days. Cooldown after completion or cancellation: 120 days. At Ukrainian land reform score 70, pay another 10 political power and 5 strength. Cancellation removes the active consumer goods burden, without refunding spent resources. \nStrength +0; alert +10. Ukraine: stability -5% and mobilisation speed -10% for 90 days. Ukraine having completed Purge Republican Sympathisers adds another 5 alert."
 RUS_ukr_land_result_tt:0 "Strength +0; alert +10. Ukraine: stability -5% and mobilisation speed -10% for 90 days. Ukraine having completed Purge Republican Sympathisers adds another 5 alert."
 RUS_ukr_slowdown:0 "Organise Railway Slowdowns"
 RUS_ukr_slowdown_desc:0 "Political power: 35. At 50 alert, pay 10 more. Infantry equipment: 0. Strength: 15. Duration: 21 days. Cooldown after completion or cancellation: 120 days. Cancellation removes the active consumer goods burden, without refunding spent resources. \nStrength +0; alert +20. Ukraine: supply efficiency -8% for 60 days. Ukraine having completed Purge Republican Sympathisers adds another 5 alert."
 RUS_ukr_slowdown_result_tt:0 "Strength +0; alert +20. Ukraine: supply efficiency -8% for 60 days. Ukraine having completed Purge Republican Sympathisers adds another 5 alert."
 RUS_ukr_night:0 "Night on the Dnieper"
 RUS_ukr_night_desc:0 "Political power: 50. At 50 alert, pay 10 more. Infantry equipment: 1000. Strength: 40. Duration: 7 days. Once per game on success. Freezes all strength and active networks at the start. Cancellation returns strength, but not political power or equipment. \nFrozen strength 40–59 / 60–79 / 80–100: Ukrainian supply efficiency -10% / -15% / -20%, organisation recovery -5% / -10% / -15%, lasting 30 / 45 / 60 days. Frozen mining network: factory output -10%; rural network: mobilisation speed -20%; railway network: Russian attack against Ukraine +5%. Removes this system’s peacetime penalties. Alert becomes 100 for a 90-day lockdown, then returns to 40."
 RUS_ukr_night_result_tt:0 "Frozen strength 40–59 / 60–79 / 80–100: Ukrainian supply efficiency -10% / -15% / -20%, organisation recovery -5% / -10% / -15%, lasting 30 / 45 / 60 days. Frozen mining network: factory output -10%; rural network: mobilisation speed -20%; railway network: Russian attack against Ukraine +5%. Removes this system’s peacetime penalties. Alert becomes 100 for a 90-day lockdown, then returns to 40."
 RUS_ukr_status_readonly_tt:0 "This row displays status."
 RUS_ukr_afford_tt:0 "Enough political power, strength and infantry equipment to pay all listed costs."
 RUS_ukr_families_requirements_tt:0 "Russia is independent and socialist and has completed the Dnieper focus; Ukraine exists, has not capitulated, is non-socialist and shares Germany’s faction. No Ukrainian operation, pending raid or lockdown is active.\nRussia and Ukraine are at peace.The anti-Hetman revolt has ended; 180-day cooldown has ended."
 RUS_ukr_mine_requirements_tt:0 "Russia is independent and socialist and has completed the Dnieper focus; Ukraine exists, has not capitulated, is non-socialist and shares Germany’s faction. No Ukrainian operation, pending raid or lockdown is active.\nRussia and Ukraine are at peace.The mining network has not yet been established."
 RUS_ukr_rural_requirements_tt:0 "Russia is independent and socialist and has completed the Dnieper focus; Ukraine exists, has not capitulated, is non-socialist and shares Germany’s faction. No Ukrainian operation, pending raid or lockdown is active.\nRussia and Ukraine are at peace.The rural network has not yet been established."
 RUS_ukr_rail_requirements_tt:0 "Russia is independent and socialist and has completed the Dnieper focus; Ukraine exists, has not capitulated, is non-socialist and shares Germany’s faction. No Ukrainian operation, pending raid or lockdown is active.\nRussia and Ukraine are at peace.The railway network has not yet been established."
 RUS_ukr_relocate_requirements_tt:0 "Russia is independent and socialist and has completed the Dnieper focus; Ukraine exists, has not capitulated, is non-socialist and shares Germany’s faction. No Ukrainian operation, pending raid or lockdown is active.\nRussia and Ukraine are at peace.Alert is at least 20; 60-day cooldown has ended."
 RUS_ukr_declaration_requirements_tt:0 "Russia is independent and socialist and has completed the Dnieper focus; Ukraine exists, has not capitulated, is non-socialist and shares Germany’s faction. No Ukrainian operation, pending raid or lockdown is active.\nRussia and Ukraine are at peace.At least two active networks; the declaration has not yet been printed."
 RUS_ukr_strike_requirements_tt:0 "Russia is independent and socialist and has completed the Dnieper focus; Ukraine exists, has not capitulated, is non-socialist and shares Germany’s faction. No Ukrainian operation, pending raid or lockdown is active.\nRussia and Ukraine are at peace.Mining network active; 120-day cooldown has ended."
 RUS_ukr_land_requirements_tt:0 "Russia is independent and socialist and has completed the Dnieper focus; Ukraine exists, has not capitulated, is non-socialist and shares Germany’s faction. No Ukrainian operation, pending raid or lockdown is active.\nRussia and Ukraine are at peace.Rural network active; 120-day cooldown has ended."
 RUS_ukr_slowdown_requirements_tt:0 "Russia is independent and socialist and has completed the Dnieper focus; Ukraine exists, has not capitulated, is non-socialist and shares Germany’s faction. No Ukrainian operation, pending raid or lockdown is active.\nRussia and Ukraine are at peace.Railway network active; 120-day cooldown has ended."
 RUS_ukr_night_requirements_tt:0 "Russia is independent and socialist and has completed the Dnieper focus; Ukraine exists, has not capitulated, is non-socialist and shares Germany’s faction. No Ukrainian operation, pending raid or lockdown is active.\nRussia and Ukraine are at war.Await Our Moment has been completed; at least two active networks; this action has not previously succeeded."
