 RUS_ukr_raid:0 "Raid pending"
 RUS_ukr_locked:0 "Lockdown"
 RUS_ukr_unlock_tt:0 "Unlocks Ukrainian underground diplomacy decisions: build networks, accumulate strength and manage government alert."
 RUS_ukr_night_unlock_tt:0 "Unlocks the wartime decision Night on the Dnieper."
 RUS_ukr_raid_evacuate_tt:0 "Pay 30 political power; consumer goods factory factor +4% for 30 days; strength -10; retain all networks; alert becomes 40."
 RUS_ukr_raid_abandon_tt:0 "Strength -25; one random active network is disabled for 90 days; alert becomes 40. No effect if the operation is no longer valid."
 RUS_ukr_burden_2:0 "Underground Subsidies"
 RUS_ukr_burden_3:0 "Underground Network Funding"
 RUS_ukr_emergency_burden:0 "Emergency Evacuation Funding"
 RUS_ukr_mine_strike:0 "Donbas Miners’ Strike"
 RUS_ukr_land_agitation:0 "Rural Land Disputes"
 RUS_ukr_rail_slowdown:0 "Railway Slowdown"
 RUS_ukr_war_low:0 "Underground Wartime Sabotage"
 RUS_ukr_war_medium:0 "Coordinated Underground Sabotage"
 RUS_ukr_war_high:0 "Widespread Underground Sabotage"
 RUS_ukr_war_mine:0 "Wartime Mining Strikes"
 RUS_ukr_war_rural:0 "Disrupted Rural Mobilisation"
 RUS_ukr_war_attack:0 "Ukrainian Railway Intelligence"
 RUS_ukr_families:0 "Aid the Families of the Defeated"
 RUS_ukr_families_desc:0 "The revolt failed, but the survivors’ families must not be forgotten. Discreet assistance can rebuild their trust."
 RUS_ukr_mine:0 "Rebuild Donbas Miners’ Mutual Aid"
 RUS_ukr_mine_desc:0 "The Donbas mines still bring workers together. Mutual aid can reconnect isolated underground groups."
 RUS_ukr_rural:0 "Contact Rural Socialist Remnants"
 RUS_ukr_rural_desc:0 "Borotbist and other socialist remnants persist in the countryside. Cautious contact may open room for cooperation."
 RUS_ukr_rail:0 "Restore Railway Workers’ Contacts"
 RUS_ukr_rail_desc:0 "Ukraine’s railways connect cities and industrial districts—and can reconnect workers’ organisations."
 RUS_ukr_relocate:0 "Relocate Underground Cadres"
 RUS_ukr_relocate_desc:0 "The police are closing in. Moving exposed cadres to safety can preserve our existing contacts."
 RUS_ukr_declaration:0 "Print a Joint Underground Declaration"
 RUS_ukr_declaration_desc:0 "A joint declaration need not conceal our differences to give scattered opposition groups a common voice."
 RUS_ukr_strike:0 "Fund a Miners’ Strike"
 RUS_ukr_strike_desc:0 "Discontent is growing in the mines. Strike support can bring that pressure to bear on the Hetman’s government."
 RUS_ukr_land:0 "Distribute Land Registers"
 RUS_ukr_land_desc:0 "The disputes left by land redistribution still linger. Circulating the records can bring them back into the open."
 RUS_ukr_slowdown:0 "Organise Railway Slowdowns"
 RUS_ukr_slowdown_desc:0 "One delay may be accidental; repeated delays can disrupt an entire transport system. Railway workers can keep that pressure alive."
 RUS_ukr_night:0 "Night on the Dnieper"
 RUS_ukr_night_desc:0 "War has come. The networks along the Dnieper will act together, turning patient preparation into an opportunity at the front."
 RUS_ukr_status_readonly_tt:0 "This row displays status."
 RUS_ukr_afford_tt:0 "Enough political power, strength and infantry equipment to pay all listed costs."
