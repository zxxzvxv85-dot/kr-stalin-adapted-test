 RUS_ukr_status:0 "Ukrainian underground: [?RUS_ukr_strength|0] strength / [?RUS_ukr_alert|0] alert"
 RUS_ukr_status_desc:0 "Mines: [RUSUkrMineState] | Rural: [RUSUkrRuralState] | Rail: [RUSUkrRailState]\nCurrent: [RUSUkrActionState] | [?RUS_ukr_days|0] days left\nLockdown: [?RUS_ukr_lockdown_days|0] days left\nEvery 30 consecutive idle peacetime days: alert -5. At 50 alert, actions cost 10 extra political power except cadre relocation. At 80 alert, completing a peacetime action triggers a raid.\nEvent prose is intentionally blank. The paid option evacuates cadres; the free option abandons one network. Cancelling an ordinary action preserves networks."
 RUS_ukr_network_missing:0 "Not established"
 RUS_ukr_network_active:0 "Active"
 RUS_ukr_network_disabled:0 "Disabled for 90 days"
 RUS_ukr_idle:0 "Idle"
 RUS_ukr_raid:0 "Raid pending"
 RUS_ukr_locked:0 "Lockdown"
 RUS_ukr_unlock_tt:0 "Unlocks Ukrainian underground diplomacy decisions: build networks, accumulate strength and manage government alert."
 RUS_ukr_night_unlock_tt:0 "Unlocks the wartime decision Night on the Dnieper."
 RUS_ukr_raid_evacuate_tt:0 "Pay 30 political power; consumer goods factory factor +4% for 30 days; strength -10; retain all networks; alert becomes 40."
 RUS_ukr_raid_abandon_tt:0 "Strength -25; one random active network is disabled for 90 days; alert becomes 40. No effect if the operation is no longer valid."
 RUS_ukr_burden_2:0 "Underground Subsidies"
 RUS_ukr_burden_3:0 "Underground Network Funding"
 RUS_ukr_emergency_burden:0 "Emergency Evacuation Funding"
