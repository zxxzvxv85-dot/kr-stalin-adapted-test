 RUS_ukr_status:0 "Ukrainian Underground"
 RUS_ukr_status_desc:0 "Organisation strength: §Y[?RUS_ukr_strength|0]§! / §Y100§!\nGovernment alert: §Y[?RUS_ukr_alert|0]§! / §Y100§!\n\nMining network: [RUSUkrMineState]\nRural network: [RUSUkrRuralState]\nRailway network: [RUSUkrRailState]\n\nCurrent operation: [RUSUkrActionState]\nOperation time remaining: §Y[?RUS_ukr_days|0]§! days\nLockdown time remaining: §Y[?RUS_ukr_lockdown_days|0]§! days\n\n§YAlert Rules§!\nAfter §Y30§! consecutive idle days at peace: government alert §G−5§!.\nAt §Y50§! government alert: additional political power cost §R+[RUSDiplomacyPPCost10]§! (except cadre relocation).\nAt §Y80§! government alert: completing a peacetime operation triggers a raid."
 RUS_ukr_network_missing:0 "§gNot established§!"
