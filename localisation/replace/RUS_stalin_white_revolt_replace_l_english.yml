 russia_events.926.d: "Within days of Savinkov's death, the upper ranks of the so-called Union for the Defence of the Motherland and Freedom had scattered—arrested, shot, or fleeing the country. Only Generals Vladimir Manstein and Anton Turkul retained enough influence over the garrisons outside Moscow to launch a counter-coup. With cavalry and an armoured column, they briefly entered the southern districts of the capital and seized several important positions.\n\nThe plotters expected the Moscow garrison to defect en masse and rally beneath their 'White Guard' banners. Almost no one answered. The city had no desire to die for its fallen Vozhd.\n\nAfter a short engagement outside Zvenigorod, the main rebel force surrendered. Manstein was brought before a military tribunal and executed on the spot.\n\nYet the wave of counter-revolution had not subsided. Across the provinces, White officers refused obedience and raised their garrisons against the provisional government. Under the unified command of Field Marshal Markov, these reactionary formations are rapidly assembling, sharpening their blades for an attempt to strangle the revolution."
 russia_events.926.a: "Order them to lay down their arms!"
 russia_socialist_events.2.t: "Upon the Ruins of the Old Army"
 russia_socialist_events.2.d: "Following the destruction of the White strongholds in Petrograd and Tsaritsyn, counter-revolutionary committees uncovered extensive records in headquarters and officers' clubs across the country. One secret pledge, bearing the signatures of more than 180 senior officers, proved that the supposedly spontaneous resistance of the provincial garrisons had been a coordinated uprising from the beginning. Its signatories had promised to answer Markov's call and seize railways, arsenals and local administrations once Manstein captured Moscow. Their plan has failed, but the document now stands as evidence that cannot be denied.\n\nThe provisional government has offered no honourable pensions to the organisers. Officers who directed the revolt, ordered the execution of Red Guards or sabotaged the railways have been sent before revolutionary tribunals. Some fled abroad with the defeated formations, while others discarded their uniforms and attempted to disappear among demobilised soldiers. Yet the government has also refused to drive every former officer indiscriminately into the counter-revolution. Specialists who took no part in the rebellion and swear obedience to the new regime may remain after investigation; ordinary soldiers are being demobilised or incorporated into loyal formations. The knowledge of the old army may be preserved, but its claim to stand above the people must be destroyed.\n\nThe purge has inevitably left many commands vacant. Young officers, Red Guard commanders and revolutionary military cadres returning from exile are being promoted, while political commissars assume oversight of the military academies. The Socialist-Revolutionary Yury Sablin has been appointed Minister of War and Chief of Army, charged with welding these disparate forces into a single revolutionary army. Confusion, inexperience and mistrust will haunt the reorganisation, but from this day Russia's rifles belong not to a self-appointed officer caste, but to the revolution and the people."
 russia_socialist_events.2.a: "Build the Red Army upon the ruins of the old."
