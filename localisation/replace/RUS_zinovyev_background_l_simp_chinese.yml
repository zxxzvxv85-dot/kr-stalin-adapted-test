 RUS_grigory_zinovyev_leader_desc: "§Y生于：§!§L1883年9月23日；俄罗斯帝国、赫尔松省叶利沙维特格勒§!\n§Y背景：§!§L格里戈里·叶夫谢耶维奇·季诺维也夫是一个什么样的角色？这恐怕只有格里戈里自己清楚。\n\n俄国社会民主工党分裂后，他很快便证明了自己是一名精明强干的组织者，自那以后便一直是布尔什维克的高层人物。他外表文静瘦弱，却总能给人带来惊喜——甚至惊讶。\n\n然而，不知是受到了加米涅夫谨慎性格的影响，还是忧虑武装起义的结局，他强烈反对发动十月起义——反对的理由至今不为人所知。直到十月革命最终爆发，他仍在党内保留反对意见。这种怪诞的态度和言行，迅速导致他与党中央的分歧。列宁死后，分歧更是几乎发展为脱党行动。此后，他开始组织地方工人组织，有时与布尔什维克合作，有时又与之抗衡。\n\n内战失败后，季诺维也夫同其他布尔什维克们一同流亡法兰西公社。在不断的互相指责中，过往的冲突被迅速升级——党主席斯维尔德洛夫始终是一名鼓动家，反对季诺维也夫的谨慎策略和内战时期反对党的行为；而“格里什卡三世”则对布尔什维克在红十月中的盲动行为嗤之以鼻。此事直接促使了布尔什维克党内的“清党”运动，以季诺维也夫为首的反对派被斯维尔德洛夫和斯大林联手踢出。\n\n心灰意冷的格里戈里因此离开法兰西，前往英国，与达特的先锋派和潘克赫斯特派建立起联系。不久后，他重拾信心回到俄罗斯，并在全俄劳联内部组建了一个小规模的先锋共产党。这其中的立场转变——如何从反对十月革命的妥协立场，演变至无条件坚持党的领导和无产阶级革命行动——或许只有他的挚友加米涅夫有所了解吧。\n\n在现实政治的影响下，布尔什维克同季诺维也夫的态度有所回暖——毕竟他还代表着劳联左翼先锋派的票仓。但这样的“合作”关系并未持续太久：在一次日常审查中，雅科夫·斯维尔德洛夫发现，季诺维也夫仍不断尝试通过私人交际的方式介入布尔什维克内部。\n\n任凭时代风云变幻，“格里什卡三世”唯有一事贯彻如一：为了确保无产阶级专政和自身地位，他将不择手段。§!"
