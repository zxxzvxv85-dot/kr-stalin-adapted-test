 RUS_unfinished_october_intro_header:0 "Незавершённый Октябрь"
 RUS_unfinished_october_intro_content:0 "В 1917 году война и голод пошатнули основы §PРоссийской империи§!; после §YФевральской революции§! совершавшее одну ошибку за другой §mбуржуазное Временное правительство§! также не сумело решить множество унаследованных от империи проблем.\n\nПосле провала последних переговоров о §Y«Компромиссах»§! §oВладимир Ленин§! тайно вернулся из Финляндии в Санкт-Петербург и возглавил §oбольшевиков§!, свергнувших обманывавшую народ §m«вторую редакцию Булыгинской думы»§! и передавших власть §oСоветам§!. Однако дальнейшие события явно превзошли ожидания §oбольшевиков§!: в §Yавгусте 1918 года§! убийство §oЛенина§! §tлевыми эсерами§! едва ли не напрямую привело к полному расколу российских левых. Среди подозрений и предательства революционная власть оказалась окружена врагами.\n\nТем временем §PБелая армия§!, получавшая помощь §aГермании§!, постепенно добилась превосходства. К §Y1921 году§! §oсоветская власть§! стояла на грани гибели, а уцелевшим революционерам оставалось лишь эвакуироваться из §YАрхангельска§! и других городов, взяв с собой знамёна, архивы и неосуществлённую программу.\n\nДля победителей §oбольшевизм§! стал бедствием, с которым России следовало навсегда распрощаться; для побеждённых поражение означало потерю и родины, и права говорить от имени революции. Успех §rреволюций во Франции и Британии§! сделал §rсиндикализм§! самой влиятельной идеологией международного социалистического движения.\n\n§oБольшевики§! были благодарны французским и британским товарищам за помощь, но не отказались от своих первоначальных идеалов. Они по-прежнему настаивали: рабочему классу нужна революционная партия, способная действовать единым целым; он должен взять государственную власть через §oСоветы§! и с её помощью преобразовать старое общество. По их мнению, §oдиктатура пролетариата§! должна обеспечивать власть трудящихся масс, а само государство является лишь переходной формой на пути к §oкоммунизму§!. Однако им ещё предстояло понять, как уберечь этот идеал от бюрократизации и добиться того, чтобы партийное руководство и участие масс поддерживали друг друга."
