 RUS_nat_land_reform_stage_5_desc:0 "Максималисты претворяют свою программу земельной реформы в жизнь. По мере углубления реформы беспорядок и сопротивление в деревне могут постепенно уступить место новым формам организации."
 RUS_nat_land_reform_stage_6_desc:0 "Максималисты претворяют свою программу земельной реформы в жизнь. По мере углубления реформы беспорядок и сопротивление в деревне могут постепенно уступить место новым формам организации."
 RUS_nat_land_reform_stage_7_desc:0 "Максималисты претворяют свою программу земельной реформы в жизнь. По мере углубления реформы беспорядок и сопротивление в деревне могут постепенно уступить место новым формам организации."
 RUS_nat_land_reform_stage_8_desc:0 "Земельная реформа максималистов достигла решающих результатов. Беспорядок, колебания и сопротивление в деревне уступают место новым формам организации, а колхозы, механизированное производство и низовая мобилизация поддерживают более устойчивую социалистическую деревню."
 RUS_nat_land_reform_stage_8_tractor_bonus_desc:0 "Земельная реформа максималистов достигла решающих результатов. Выполнение тракторного обещания еще сильнее укрепило доверие крестьян к новой власти, а колхозы, механизированное производство и низовая мобилизация поддерживают более прочную социалистическую деревню."
