l_russian:
  russia_socialist_events.3.t: "Воссоединённая партия социалистов-революционеров"
  russia_socialist_events.3.d: "История партии социалистов-революционеров — это история непрерывных расколов и воссоединений. Последний крупный раскол произошёл после смерти Виктора Чернова: уход многолетнего лидера обнажил трещины, давно существовавшие внутри партии. После его кончины Борис Савинков железной рукой провёл почти сокрушительную чистку правого крыла, и множество кадров, прежде считавшихся «становым хребтом партии», оказалось в списках «изменников». Тем временем левые были вынуждены уйти в подполье и вернуться к самому знакомому, но и самому тяжёлому для них способу существования — терроризму.\n\nТеперь эсеры вновь заняли господствующее положение на политической карте. Однако этого далеко недостаточно, чтобы объединить под одним знаменем крестьянство, составляющее подавляющее большинство населения России. Недоверие крестьян к партиям, отчуждение между регионами и взаимная подозрительность, оставшаяся со времён революции, по-прежнему образуют глубокие пропасти на пути к единству.\n\nПосле нескольких раундов закрытых переговоров между Марией Спиридоновой и Фридрихом Рихтером партия социалистов-революционеров наконец объявила о своём новом воссоединении.\n\nНаблюдатели отмечают явные следы компромисса в этом единстве. Спиридонова олицетворяет радикальное наследие левого крыла и его сельские корни, тогда как Рихтер представляет силы, стремящиеся привести партию к демократии и парламентаризму. Их согласие основано не столько на доверии, сколько на прагматичном расчёте: цена раскола куда выше стоимости компромисса."
  russia_socialist_events.3.a: "Неужели они и вправду научатся сотрудничать?"
  russia_socialist_events.3.b: "Расскажите подробнее о партии социалистов-революционеров."
  russia_socialist_events.73.d: "Максималисты — одно из самых радикальных течений внутри партии социалистов-революционеров, чьи истоки восходят ещё к дореволюционной России. Своё название фракция получила от написанного Алексеем Устиновым манифеста «Революционная максимальная программа — коммунизм». Этот документ стал не только программным трудом, но в значительной мере и политической декларацией всего течения.\n\nВо время Революционной войны максималисты заключили союз с большевиками и наладили тесное сотрудничество на общем фронте. После войны они не распустились, а превратились в партизанскую организацию, продолжавшую работу на местах. За долгие годы подполья им удалось сохранить организационную целостность и боевой дух. Теперь, с изменением политического климата, эта сила вновь вышла на поверхность и стремительно растёт.\n\nПо своей сути возрождающиеся максималисты ближе к революционерам, чем к социалистам-революционерам в традиционном понимании. Их политический язык, методы организации и логика борьбы имеют гораздо больше общего с большевиками, что неизменно придаёт им особое положение внутри партии эсеров.\n\nВ руководстве фракции Алексей Устинов повсеместно почитается её членами как духовный вождь, а заложенная в его трудах теоретическая основа по-прежнему служит идейным фундаментом движения. Практической организацией и повседневными делами заведует Андрей Колегаев. Их отношения одновременно наставников и товарищей образуют самую прочную политическую связь внутри фракции. Именно эта взаимная опора позволила максималистам даже в годы затяжных невзгод сохранить жизненную силу, присущую революционной партии.\n\nПолитические взгляды максималистов резко отличаются от взглядов традиционных социалистов-революционеров. В принципе они отрицают самостоятельную историческую роль крестьянства как «переходного класса» в революционном процессе, считая его по природе колеблющимся и ограниченным. На практике, однако, они признают революционное назначение беднейшего крестьянства как орудия преобразований: бедноту можно мобилизовать, организовать и направить к социалистическому переустройству. Поэтому пробуждение классового сознания сельскохозяйственных рабочих и их организация прямо провозглашаются одной из главных политических целей фракции."
  russia_socialist_events.73.a: "Лучшие союзники социальной революции!"
  russia_socialist_events.30.d: "Закон о национальной обороне \"1923 года\" когда-то классифицировал все «коммунистические действия» как незаконные. Когда к власти пришло правительство Марии Спиридоновой, его первым действием было отменить все приговоры по политическим преступлениям, вынесенные в соответствии с этим законом. Раньше этот закон висел над головами людей, как меч — тысячи социалистов были преследуемы и заключены в тюрьму, а многие бежали в западные социалистические страны, присоединяясь к сообществам большевистских эмигрантов там. Теперь большинство из них возвращаются домой на «Красном корабле», товарищи, отправляющиеся из Парижа и Лондона в путь обратно на родину.\n\nИх тепло встретили в Петрограде и объявили о слиянии с партийной организацией «Движение интеграции», которая уже давно действовала в Сибири. Однако семена разногласий были посеяны задолго до этого. Опыт ссыльных сильно отличался от опыта отечественных социалистов, что приводило к ожесточённым столкновениям. Эти ссыльные теперь больше напоминали военно-политическую группу, считая себя ортодоксальными преемниками Ленина, и были глубоко разочарованы текущей политической ситуацией в России."
  russia_socialist_events.30.a: "С возвращением домой?"
  russia_socialist_events.32.d: "В связи с добровольным или вынужденным уходом на пенсию большого числа офицеров Белой армии, опытные командиры находятся в дефиците. Особенно остро нехватка наблюдается среди командиров рот и взводов на уровне низшего звена, и вновь сформированные подразделения часто демонстрируют серьезные пробелы в командовании во время тактических учений и реальных развертываний.\n\nС этой целью Фрунзе вместе с другими офицерами Красной Армии, вернувшимися из ссылки, представил Временному правительству «Предложение о военных чистках и реформах». Основная идея предложения была двоякой: с одной стороны, продолжать выявление и устранение ненадёжных остатков в старой армии, а с другой — значительно ускорить ускоренное обучение в военных академиях и отбирать перспективные кадры из числа рабочих, крестьян и возвращающихся офицеров для заполнения командных должностей.\n\nЭто предложение охватывает широкий спектр вопросов — от переоценки действующих офицеров до корректировки организации войск и составления и продвижения новых боевых положений, с множеством вопросов, требующих решения. Хотя Фрунзе занимал должность стратегического руководителя, он не мог лично контролировать каждую деталь реформы. Поэтому в дополнительных заметках к предложению он особенно рекомендовал своего талантливого protégé Семёна Тимошенко координировать и осуществлять повседневную организационную работу по реформам, чтобы этот документ мог быть быстро превращен в реальную боевую способность армии."
  russia_socialist_events.101.d: "Силы Красной Армии продвинулись к окраинам Петрограда и приказали генералу Гольцу сдаться. Однако этот маршал Белой армии не появился в городе и остался на своем флагмане «Генерал Алексеев», пришвартованном за пределами города. Отношение Балтийского флота было двусмысленным и беспокойным, оставляя весь город в странном застое. Между тем, крепость Кронштадта и Балтийский флот не давали существенного ответа на сообщения с любой стороны, ограничиваясь лишь двумя словами «принято» формально.\n\nГород все еще находится под контролем народа — большая часть петропавловского гарнизона принадлежит первым подразделениям, которые перешли на сторону восставших, и они сразу начали арестовывать непопулярных членов 'Свободы' в городе.\n\nЭтот опытный морской командир, без сомнения, был в ярости из-за того, что социалисты вновь пришли к власти, но на этот раз он, казалось, был изолирован и без поддержки. Однако у него по-прежнему была группа верных моряков и батальоны морской пехоты вокруг него, а пушки корабля оставались наводенными на сердце России. В Красной Армии за пределами Петрограда разгорелись ожесточённые споры: что именно замышляет Колчак? Организует ли он контрреволюционный удар, или уже был оставлен всеми, и остался лишь этот флот?\n\nВ конце концов правительство отправило в Петроград городского комиссара на борту «Генерала Алексеев» для переговоров с Колчаком, предлагая передать флот в обмен на достойную отставку. На корабле бывший «Верховный правитель всей России» выглядел измученным. Он лишь слегка сказал, что, возможно, постепенно отдалился от России и больше не может понять страну. Его прежняя крайняя озабоченность по поводу переворота в конечном итоге оказалась ненужной — больше на маршала навалилось чувство разочарования и усталости. После некоторого мягкого убеждения он согласился уйти в отставку и выразил желание продолжать служить председателем Комитета по арктическим исследованиям."
  russia_socialist_events.101.a: "Таким образом, катастрофа была предотвращена."
  russia_socialist_events.332.c: "Взгляд Устинова можно охарактеризовать как гениальный."
  russia_news_events.8.d: "Борис Савинков пал в результате этого. Из-за действий президента, вызывавших растущее недовольство общественности и армии, в Красной площади вспыхнули массовые протесты, и среди эха выстрелов по всей столице Савинков был застрелен членом Партии социалистов-революционеров.\n\nПосреди хаоса ранее запрещённые социалистические партии подняли восстание, и народные комитеты, а также советы рабочих и крестьян создавались один за другим по всей стране. С широкой мобилизацией Красной гвардии Временное правительство продвигалось с большой энергией, а остатки Белой армии в Петрограде и на юге России рассеялись, как птицы и звери.\n\nКажется, что Россия за одну ночь стала социалистической страной, что оказало глубокое влияние на Европу и весь мир."
  russia_news_events.8.c: "Мировая революция уже близка!"
