l_russian:
  russia_socialist_events.3.t: "Воссоединённая партия социалистов-революционеров"
  russia_socialist_events.3.d: "История партии социалистов-революционеров — это история непрерывных расколов и воссоединений. Последний крупный раскол произошёл после смерти Виктора Чернова: уход многолетнего лидера обнажил трещины, давно существовавшие внутри партии. После его кончины Борис Савинков железной рукой провёл почти сокрушительную чистку правого крыла, и множество кадров, прежде считавшихся «становым хребтом партии», оказалось в списках «изменников». Тем временем левые были вынуждены уйти в подполье и вернуться к самому знакомому, но и самому тяжёлому для них способу существования — терроризму.\n\nТеперь эсеры вновь заняли господствующее положение на политической карте. Однако этого далеко недостаточно, чтобы объединить под одним знаменем крестьянство, составляющее подавляющее большинство населения России. Недоверие крестьян к партиям, отчуждение между регионами и взаимная подозрительность, оставшаяся со времён революции, по-прежнему образуют глубокие пропасти на пути к единству.\n\nПосле нескольких раундов закрытых переговоров между Марией Спиридоновой и Фридрихом Рихтером партия социалистов-революционеров наконец объявила о своём новом воссоединении.\n\nНаблюдатели отмечают явные следы компромисса в этом единстве. Спиридонова олицетворяет радикальное наследие левого крыла и его сельские корни, тогда как Рихтер представляет силы, стремящиеся привести партию к демократии и парламентаризму. Их согласие основано не столько на доверии, сколько на прагматичном расчёте: цена раскола куда выше стоимости компромисса."
  russia_socialist_events.3.a: "Неужели они и вправду научатся сотрудничать?"
  russia_socialist_events.3.b: "Расскажите подробнее о партии социалистов-революционеров."
