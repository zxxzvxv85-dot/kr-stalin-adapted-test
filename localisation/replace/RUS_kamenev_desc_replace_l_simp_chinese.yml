 RUS_lev_kamenev_leader_desc: "§Y生于：§! §L1883年7月18日，俄罗斯帝国、莫斯科省、莫斯科§!\n§Y背景：§! §L姓名：列夫·鲍里索维奇·加米涅夫\n列夫·鲍里索维奇·加米涅夫（原姓罗森菲尔德）虽然性格温和，但却是一名独特而富有争议的人物在一些人看来，他只是个平庸的资产阶级中层管理者，偶然参与了革命；在另一些人眼中，他却是位真正值得敬重的革命者，证明了一个人无需先成为恐怖分子，才能成为共产主义者。他生于莫斯科的工人阶级家庭，选择攻读法律，并因此结识了列宁和托洛茨基等社会民主革命者。\n\n加米涅夫一直是作家和组织者，倾向于反对过于危险的计划，认为那是“对俄国未来不负责任的赌博”。因此，他主张与社会革命党进行务实合作，并反对十月革命。这一立场在1922年审判中被大书特书，以作为他动机纯洁的佐证。\n\n内战期间，加米涅夫在国家政府和莫斯科担任高级领导职务。但在1921年，他突然宣布因“党务纠纷”退党并作为十月革命的反对者重新开始政治活动，布尔什维克们也在报纸上不断公开声讨这个“革命的叛徒”。\n\n到了1922年审判，他和其他布尔什维克一起被指控叛国。“加米涅夫审判”导致了国内民意分裂，他的辩护律师认为，他在1921年便与布尔什维克撇清了关系，在内战中还庇护了相当多因所谓“红色恐怖”而流离失所的人。最终，他避免了死刑，而是服了10年的苦役，在狱中，加米涅夫撰写了许多深远影响的著作，奠定了战后红色叙事的基调，并主张与前孟什维克和解。他的观点与弗拉基米尔·列维茨基不谋而合，而列维茨基也曾在加米涅夫受审期间组织孟什维克声援他。\n\n1932年获释后，由于保卫祖国与自由联盟战斗队判处他死刑，他只得逃离俄罗斯。他声称，正是在外的流亡岁月重塑了他的政治愿景。\n\n如今回到俄罗斯后，他加入了列维茨基，帮助他创建了一个统一的俄罗斯社会主义政党。尽管他在革命理念上与列维茨基有相当大的差别，但他目前仍然愿意作为一名实干家活跃于全俄劳联中。§!\n\n§Y重要信息：流亡期间，加米涅夫依然和斯维德洛夫保持着书信联系。尽管加米涅夫本人声称这不过是与政治无关的私人来往，但外界仍有流言称他实际并没有放弃自己的党籍，而是在充当布尔什维克在俄罗斯的“白手套”。§!"
