 RUS_unfinished_october_intro_header:0 "The Unfinished October"
 RUS_unfinished_october_intro_content:0 "In 1917, war and hunger shook the foundations of the §PRussian Empire§!; after the §YFebruary Revolution§!, the blundering §mbourgeois Provisional Government§! also failed to resolve the many problems the empire had left behind.\n\nAfter the final negotiations over §YOn Compromises§! broke down, §oVladimir Lenin§! slipped back from Finland into Saint Petersburg and led the §oBolsheviks§! in overthrowing the “§msecond edition of the Bulygin Duma§!” that had deceived the people, handing power to the §oSoviets§!. Yet what followed clearly exceeded the §oBolsheviks'§! expectations: in §YAugust 1918§!, the assassination of §oLenin§! by the §tLeft Socialist-Revolutionaries§! all but brought about a complete split within the Russian left. Amid suspicion and betrayal, the revolutionary government found itself beset by enemies on every side.\n\nMeanwhile, the §PWhite Army§!, aided by §aGermany§!, gradually gained the upper hand. By §Y1921§!, §oSoviet power§! was on the verge of collapse, and the surviving revolutionaries could only evacuate from §YArkhangelsk§! and elsewhere, taking with them their flags, archives and unfulfilled programme.\n\nFor the victors, §oBolshevism§! had become a catastrophe to which Russia should bid farewell forever; for the defeated, they had lost both their homeland and their authority to speak for the revolution. The success of the §rFrench and British revolutions§! made §rsyndicalism§! the most influential ideology within the international socialist movement.\n\nAlthough grateful for the assistance of their French and British comrades, the §oBolsheviks§! did not abandon their original ideals. They still insisted that the working class needed a revolutionary party capable of united action, and that it must wield state power through the §oSoviets§! to transform the old society. In their view, the §odictatorship of the proletariat§! should safeguard the rule of the working masses, while the state itself was only a transitional form on the road to §ocommunism§!. Yet how to keep this ideal from becoming bureaucratic, and how to ensure that party leadership and mass participation supported one another, remained questions they had to confront."
