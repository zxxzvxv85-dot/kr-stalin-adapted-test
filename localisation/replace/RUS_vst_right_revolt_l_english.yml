l_english:
 russia_socialist_events.353.d.coalition:0 "The alliance with the Bolsheviks has finally torn the All-Russian Union of Labour apart. Those members of the right wing who openly despised the 'communists' had long since lost any real influence within the Union. A group led by Dan has at last resigned its posts en masse and announced its intention to rebuild the Russian Social Democratic Labour Party, seeking a third path between the Bolsheviks and the Socialist-Revolutionaries.\n\nYet this 'third path' plainly did not lead very far. A substantial part of Dan's faction has moved ever closer to the Socialist-Revolutionaries in political practice: their parliamentary voting patterns closely follow those of the SRs, while local organisations have even begun nominating joint candidates and sharing grassroots networks.\n\nFortunately, the great majority of our party cadres favour centrist or left-wing positions, and this latest departure has not seriously weakened our organisation."
 russia_socialist_events.353.d.rebellion:0 "$russia_socialist_events.353.d.coalition$"
 russia_socialist_events.353.a:0 "At least we can still rely on our Bolshevik allies."
