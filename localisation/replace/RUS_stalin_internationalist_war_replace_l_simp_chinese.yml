l_simp_chinese:
  russia_socialist_events.433.d: "曾经的俄罗斯苏维埃联邦社会主义共和国宪法具有坚实的国际主义性质，无需“繁琐手续”即可授予该国所有外国工人公民身份。革命政府在战俘中开展政治工作，让资本主义列强大为恼火，因此，授予战俘公民身份，允许其合法开展活动，并保证其回国后不会遭到报复成为了革命战争的基本要求。为了分化潮水一般的敌众，党中央重新引入了这一做法并加以改进，为所有工人阶级出身的外国人提供了获取公民身份的合法途径，该途径同样十分便捷。由于不受《布列斯特-立托夫斯克条约》的限制以及向非资本主义世界开放的需要束缚，我们可以按阶级划分外国战俘，并在阶级团结的基础上发动无产阶级和贫农。事实证明，有相当多的人愿意接受新的政治教育与阶级意识的观念。这不仅对未来占领帝国公约乃至可能的世界革命具有重要意义，更是让许多热心人士得以全心全意地投身于国际主义事业，并为军中的辅助角色甚至是作战角色提供了大量合格的后备人员。"
