l_english:
  russia_socialist_events.433.d: "The constitution of the former Russian Soviet Federative Socialist Republic was staunchly internationalist in nature, granting citizenship to all foreign workers in the country without “cumbersome formalities”. The revolutionary government conducted political work among prisoners of war, much to the chagrin of the capitalist powers. As a result, granting prisoners of war citizenship, allowing them to carry out legal activities, and guaranteeing their safety from reprisals after returning home became basic requirements of revolutionary war. In order to divide the tide of enemy forces, the Party Centre has reintroduced and improved this practice, providing a similarly simple legal route to citizenship for all foreign individuals of a working-class background. Unfettered by the Treaty of Brest-Litovsk and by the need to open ourselves to a non-capitalist world, we can divide foreign prisoners along class lines and appeal to the proletariat and poor peasants on the basis of class solidarity. Many have proven willing to accept a new political education and the concept of class consciousness. This will not only prove valuable for any future occupation of the Reichspakt and even a possible world revolution, but will also allow many enthusiastic individuals to devote themselves wholeheartedly to the internationalist cause, providing a large pool of qualified candidates for auxiliary roles and even combat roles in the army."
