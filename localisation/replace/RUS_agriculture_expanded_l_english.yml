 RUS_nat_land_reform_stage_7_desc:0 "The Maximalists are putting their land reform programme into practice. As the reform deepens, disorder and resistance in the countryside may gradually give way to new forms of organisation."
 RUS_nat_land_reform_stage_8_desc:0 "The Maximalist land reform has achieved decisive results. Disorder, hesitation and resistance in the countryside are giving way to new forms of organisation, with collective farms, mechanised production and local mobilisation supporting a more stable socialist countryside."
 RUS_nat_land_reform_stage_8_tractor_bonus_desc:0 "The Maximalist land reform has achieved decisive results. The fulfilment of the tractor promise has further consolidated peasant trust in the new regime, while collective farms, mechanised production and grassroots mobilisation now support a stronger socialist countryside."
