 RUS_unfinished_october_intro_header:0 "未竟的十月"
 RUS_unfinished_october_intro_content:0 "1917年，战争与饥饿动摇了§P俄罗斯帝国§!的根基；§Y二月革命§!后，昏招频出的§m资产阶级临时政府§!也没能解决帝国遗留的诸多问题。\n\n在最后一次§Y《论妥协》§!的谈判受挫后，§o弗拉基米尔·列宁§!从芬兰潜回圣彼得堡，带领§o布尔什维克§!推翻了愚弄人民的“§m第二版布利金杜马§!”，将政权交予§o苏维埃§!。但事情的后续发展，显然超出了§o布尔什维克§!的预料：§Y1918年8月§!，§t左翼社会革命党§!对§o列宁§!的刺杀，几乎直接导致了俄罗斯左翼的全面分裂。在猜忌与背叛之下，革命政权被迫四面受敌。\n\n与此同时，得到§a德国§!援助的§P白军§!逐渐取得优势。到§Y1921年§!，§o苏维埃政权§!已行将覆灭，幸存的革命者只能从§Y阿尔汉格尔斯克§!等地撤离，随身携带的只有旗帜、档案和未能实现的纲领。\n\n对于胜利者而言，§o布尔什维主义§!已成为俄罗斯应当永远告别的灾难；对于失败者而言，他们失去了祖国，也失去了革命的话语权。§r法国与英国革命§!的成功，使§r工团主义§!成为国际社会主义运动中最具影响力的意识形态。\n\n§o布尔什维克§!虽然对英法同志的接济心怀感激，却没有因此放弃最初的理想。他们仍然坚持：工人阶级需要能够统一行动的革命政党，需要通过§o苏维埃§!掌握国家权力，并以此改造旧社会。在他们看来，§o无产阶级专政§!应当保障劳动群众的统治，而国家本身只是通向§o共产主义§!的过渡形式。然而，如何使这一理想免于官僚化，如何让党的领导与群众参与相互支持，仍是他们必须面对的问题。"
