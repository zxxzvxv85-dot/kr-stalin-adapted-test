l_simp_chinese:
 RUS_provisional_revolution_context_tt:0 "占据首都的革命者们尚无力统领全国，一场新的苏维埃大会已迫在眉睫……"
 RUS_provisional_revolution_event_only_tt:0 "由“雾月革命”事件完成。"
 RUS_provisional_pending_event_only_tt:0 "该国策将由后续剧情事件完成。"
 russia_events.924.t:0 "雾月革命"
 russia_events.924.d:0 "如今的革命形势已经超乎了所有人的预料：不可一世的前白军政府，竟在一夜之间土崩瓦解。\n\n随着元首的仓皇倒台与军队的哗变，那些曾在秘密警察追捕下东躲西藏的社会主义政党，终于得以重新走上台前。\n\n然而实事求是地说，如今的权力交接更像是一场匆忙的军事政变，一出翻版的二月革命——伴随着质疑、猜忌，以及无穷无尽的混乱。在真正的苏维埃大会召开、赋予政权合法性之前，我们自然不能指望这个临时拼凑的班子能有什么实际作为。\n\n尽管目前“政令不出莫斯科”的现状令人无奈，但各地方倒是乐于接受来自中央的名义管辖——前提是那些命令不触及他们的地盘。各地的村社、官僚和新兴的工会苏维埃都在观望，毕竟安于现状，总比再卷入一场血腥的全面内战来得强。"
 russia_events.924.a:0 "人民发声的时候到了！"
