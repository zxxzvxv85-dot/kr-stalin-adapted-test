l_simp_chinese:
  RUS_socrus_coalition_mechanic_decisions_desc: "萨文科夫政权垮台后，各地乡苏维埃和工会组织迅猛发展，逐渐形成一套近乎畸形的治理结构。\n\n§R社会革命党§!因起义功绩和乡村组织根基，主张新政权的领导权；\n重新公开活动的§o俄共（布）§!则借助归国干部、军中党员与城市党组织，逐步积蓄力量；\n由加米涅夫主持的§r全俄劳联§!，则在两党之间协调周旋，竭力维持自身来之不易的领导地位。\n\n由于现实所迫，三党不得不维持明面上的精诚团结，共同推进俄罗斯的重建工作。\n\n如果未来不发生重大“意外”，三党关系的演变方向，将最终决定工人联盟走向何方。\n\n§Y工人联盟的政治格局§!：[RUS_RKP_is_shown]\n与§R社革党§!的关系：[?sr_var|0][RUS_VST_PSR_status]\n§r全俄劳联§!内部：[RUS_VST_centre_is_shown][RUS_VST_left_is_shown][RUS_VST_right_is_shown]\n与§1社民盟§!的关系：[?sds_var|0]\n\n与任何党派的关系降为零，都将导致该党派退出工人联盟。"
  RUS_RKP_has_relations: "\n与§o俄共（布）§!的关系：[?rkp_var|0]"

  RUS_kamenev_psr_agenda_in_progress: "社革党正在推进国策"
  RUS_kamenev_psr_agenda_in_progress_desc: "社会革命党正在独立推进本党的政治议程。在该国策完成以前，工人联盟内部的权力平衡将每周向§R社革党§!一侧移动§Y2%§!。"
  RUS_kamenev_psr_agenda_bop_modifier: "社革党的政治攻势"
  RUS_kamenev_psr_agenda_bop_modifier_desc: "社会革命党正在推动本党的政治议程，借机扩大其在工人联盟中的影响。"

  RUS_kamenev_three_accounts: "与最高纲领派谈判"
  RUS_kamenev_three_accounts_desc: "社革党在乡村竖起的旗帜虽多，真正扎根于贫农和农业工人之中的，却不止他们一家。乌斯季诺夫领导的最高纲领派熬过了白色恐怖，至今仍维系着一张串联村社、矿区与旧地下组织的联络网，其中不少人本就把自己视作留守农村的布尔什维克。我们应当承认他们的独立地位，请这些久经考验的同志为俄共（布）重新打开通往乡村的道路。"
  RUS_kamenev_no_permanent_creditor: "限制社革党的主导权"
  RUS_kamenev_no_permanent_creditor_desc: "社革党总爱把起义的功劳挂在嘴边，仿佛土地人民委员部、内务机关乃至各州政权，都该作为酬劳交到他们手中。革命不是哪一党的私产，农村更不能由社革党中央一言而决。地方任命必须交由部长会议复核，最高纲领派和乡村苏维埃也应有独立的发言权；否则，所谓联合政府迟早会沦为社革党的一块招牌。"
  RUS_kamenev_one_party_card: "维持革命纯洁性"
  RUS_kamenev_one_party_card_desc: "参加联合政府，绝不意味着俄共（布）可以卷起自己的旗帜。进入工会、苏维埃和人民委员部的党员仍须遵守中央决议，凡涉及土地、工厂和军队的重大问题，也必须先由党团审议。社革党或许会把这种纪律斥为“政府中的政府”，可若为了几句团结的空话便放弃党的纲领，那才是对革命真正的背叛。"
  RUS_kamenev_majority_rule: "扩大政治联盟"
  RUS_kamenev_majority_rule_desc: "俄共（布）方才恢复公开活动，归国同志再多，也不足以独力撑起百废待兴的俄罗斯。加米涅夫主张向劳联右派和社会主义民主同盟打开政府大门，把一切愿意承认土地革命与工人政权的人团结起来。阿布拉莫维奇和泽勒会索要顾问席位，党内也少不了反对之声；然而在铁路停摆、粮运不继的今天，扩大联盟或许正是我们不得不付出的代价。"
  RUS_kamenev_concessions_to_bolsheviks_unlock_tt: "解锁可重复决议：§Y向布尔什维克让步§!"
  RUS_kamenev_concessions_to_esers_unlock_tt: "解锁可重复决议：§Y向社革党让步§!"
  RUS_kamenev_concessions_to_bolsheviks: "向布尔什维克让步"
  RUS_kamenev_concessions_to_bolsheviks_desc: "我们将在报刊、集会和党务活动上给俄共（布）留下更多余地，并接纳中央局举荐的部分干部。既然布尔什维克仍愿留在联合政府之中，有些争执就不妨先在谈判桌上解决。"
  RUS_kamenev_concessions_to_esers: "向社革党让步"
  RUS_kamenev_concessions_to_esers_desc: "我们将暂缓执行几项争议最大的农村命令，并在合作社、地方自治和农民代表问题上接受社革党的部分主张。只要他们还肯留在联合政府里，这点让步总好过让乡村再度陷入动荡。"
  RUS_kamenev_revolutionary_legality: "与卡姆科夫派谈判"
  RUS_kamenev_revolutionary_legality_desc: "卡姆科夫和他的追随者参加了起义，却不肯让社革党中央独占胜利果实。他们拥护苏维埃，也坚持保留自己的组织与报刊。我们可以承认卡姆科夫派的合法地位，作为交换，他们必须在土地、内务和地方任命问题上抵制社革党中央的垄断。彼此虽谈不上亲近，却足以在眼下坐到同一张桌旁。"

  RUS_science_of_marxism: "[ROOT.RUSGetKamenevScienceOfMarxismName]"
  RUS_kamenev_science_of_marxism_name: "马克思主义教育"
  RUS_kamenev_science_of_marxism_name_default: "马克思主义科学"

  RUS_mensheviks: "[ROOT.RUSGetKamenevMensheviksName]"
  RUS_mensheviks_desc: "[ROOT.RUSGetKamenevMensheviksDesc]"
  RUS_kamenev_mensheviks_name: "三党联合执政"
  RUS_kamenev_mensheviks_desc: "旧政府倒台以后，谁也没有独自接管俄罗斯的本钱。全俄劳联掌握着工会和苏维埃的日常机关，社革党控制着遍布各地的起义委员会，俄共（布）则在军队和归国干部中颇有根基，三方只得共组政府。加米涅夫恰好坐在谈判桌的正中：党不便明说的话，经他之口便成了可以讨论的提案；盟友难以接受的条件，经他删改又成了可以签字的协议。他就这样戴上了布尔什维克的“白手套”。"
  RUS_kamenev_mensheviks_name_default: "唐恩派"
  RUS_kamenev_mensheviks_desc_default: "全俄劳联右翼的唐恩派得名于其领导人，老孟什维克费奥多尔·唐恩。其广泛地主张扩大革命政治，同时谨慎地向社会主义经济过渡。在二十年代的暴政和萨文科夫独裁的激化之下，许多前孟什维克，以及一些颇具妥协思想的前布尔什维克都加入了这一派。"

  RUS_eser_deal: "[ROOT.RUSGetKamenevEserDealName]"
  RUS_eser_deal_desc: "[ROOT.RUSGetKamenevEserDealDesc]"
  RUS_kamenev_eser_deal_name: "与社革党的妥协"
  RUS_kamenev_eser_deal_desc: "不能否认，社会主义俄罗斯正是从社革党发动的起义中诞生的。他们有资格进入新政府，继续参与土地改革、地方自治和农民组织事务，却没有资格独占革命。承认社革党的功绩，不等于承认农村是他们的私产；乌斯季诺夫的最高纲领派必须保有独立席位，其他党派也有权过问农村政策。"
  RUS_kamenev_eser_deal_desc_default: "社会革命党对社会主义的理解一直饱受质疑，他们大多数人拔高农民的地位并反对马克思主义，信仰农业社会主义，但是无论如何我们都跟这帮人绑在一条船上了。我们会去接触意识形态上可共融的社革党人，以期达成更持久的协定。"

  RUS_invite_sverdlov: "[ROOT.RUSGetKamenevInviteSverdlovName]"
  RUS_invite_sverdlov_desc: "[ROOT.RUSGetKamenevInviteSverdlovDesc]"
  RUS_kamenev_invite_sverdlov_name: "回归列宁主义"
  RUS_kamenev_invite_sverdlov_desc: "几封私信和几位军中旧交，支撑不起一个曾经领导革命的政党。我们将请斯维尔德洛夫以俄共（布）代表的身份进入部长会议，由他主持恢复中央机关，把归国干部、地方党小组和军中党员重新组织起来。加米涅夫仍可在各党之间从容周旋，但今后由他带上谈判桌的，将不再是几名流亡者私下商定的条件，而是一个重新运转起来的布尔什维克党的意志。"
  RUS_kamenev_invite_sverdlov_name_default: "回归列宁主义"
  RUS_kamenev_invite_sverdlov_desc_default: "尽管余下的独立布尔什维克拒绝加入全俄劳联，他们仍然是工人联盟中不可忽视的重要力量。他们的文职领袖兼理论家雅科夫·斯维尔德洛夫是一位才华横溢的行政官员，在流亡社区和军队中深受欢迎，同时也是一位经验丰富的革命家。秉持团结的精神，我们将与这位老同志接洽，正式邀请他加入部长会议。"

  RUS_invite_zeller: "[ROOT.RUSGetKamenevInviteZellerName]"
  RUS_invite_zeller_desc: "[ROOT.RUSGetKamenevInviteZellerDesc]"
  RUS_kamenev_invite_zeller_name: "维持劳联的广泛联盟"
  RUS_kamenev_invite_zeller_desc: "泽勒领导的社会主义民主同盟，在技术工人、小业主和劳联温和派中仍有不少追随者。与其把这些人推到社革党一边，不如在工人联盟里给他们留下一席之地。泽勒势必会为每项重要政策讨价还价，但一个真正广泛的联盟，本就不可能只听见一种声音。"
  RUS_kamenev_invite_zeller_name_default: "邀请泽勒"
  RUS_kamenev_invite_zeller_desc_default: "社会主义民主同盟被许多人视为反动的激进民主党中的顽固分子，但其确实赢得了不少小企业主和富裕工人的忠诚，在俄罗斯南部尤其如此。其新的领袖盖哈德·泽勒算是最为不温不火的社会主义者，但他肯定也理解合作的价值——是时候正式邀请他加入部长会议，将他的党派拉入工人联盟了。"

  RUS_internationalists: "[ROOT.RUSGetKamenevInternationalistsName]"
  RUS_internationalists_desc: "[ROOT.RUSGetKamenevInternationalistsDesc]"
  RUS_kamenev_internationalists_name: "胜利后的第一次代表大会"
  RUS_kamenev_internationalists_desc: "党首们关起门来谈妥的条件，终究要交给代表大会裁决。各地工会、苏维埃、农民委员会和革命党组织都将派人到会，土地、经济、国家制度以及各党的权限，也都要在会场上争个明白。季诺维也夫主动接下了筹备工作。自此，代表资格如何审定、何种提案能够列入议程、各地代表由谁接待，都要先过他的办公室。"
  RUS_kamenev_internationalists_name_default: "国际主义者"
  RUS_kamenev_internationalists_desc_default: "国际主义者因主张第三国际的工团主义综合而得名，是全俄劳联的核心力量。他们呼吁苏维埃与工会共享权力，拥护工人联盟，主要围绕列维茨基和苏利莫夫的领导而形成。"

  RUS_communists: "[ROOT.RUSGetKamenevCommunistsName]"
  RUS_communists_desc: "[ROOT.RUSGetKamenevCommunistsDesc]"
  RUS_kamenev_communists_name: "布尔什维克复兴"
  RUS_kamenev_communists_desc: "俄共（布）的中央机关和地方委员会将重新挂牌，党员也终于可以堂堂正正地以布尔什维克之名活动。党暂且留在全俄劳联主持的联合政府中：加米涅夫出面同盟友交涉，斯维尔德洛夫料理中央党务，季诺维也夫则经营劳联左翼和代表大会党团。组织一经复兴，昔日被流亡与地下斗争压住的领导权之争，也随之回到了党内。"
  RUS_kamenev_communists_name_default: "共产主义者"
  RUS_kamenev_communists_desc_default: "全俄劳联左翼非常喜欢共产主义者这个标签，他们寻求在不向反对派妥协的情况下，快速过渡到社会主义计划经济，并推动达成实现社会革命的不懈承诺。通常来说，这派人由列夫·加米涅夫领导，但是在格里戈里·季诺维也夫影响下，他们也有可能转向一个更加个人主义的方向。"

  RUS_war_on_landowners: "[ROOT.RUSGetKamenevWarOnLandownersName]"
  RUS_war_on_landowners_desc: "[ROOT.RUSGetKamenevWarOnLandownersDesc]"
  RUS_kamenev_war_on_landowners_name: "加速结束农业过渡期"
  RUS_kamenev_war_on_landowners_desc: "我们必须明白，农民这一作为过渡阶级的存在是必然要消亡的。而土地改革的贯彻落实，给我们提供了加速这一过程的机会。农业工厂的试点将为未来的农业生产提供新的范本。"
  RUS_kamenev_war_on_landowners_name_default: "加速结束农业过渡期"
  RUS_kamenev_war_on_landowners_desc_default: "我们必须明白，农民这一作为过渡阶级的存在是必然要消亡的。而土地改革的贯彻落实，给我们提供了加速这一过程的机会。农业工厂的试点将为未来的农业生产提供新的范本。"

  RUS_stalin_kamenev_tree.1.t: "一本磨旧的名册"
  RUS_stalin_kamenev_tree.1.d: "乌斯季诺夫来时，腋下只夹着一本封皮磨白的旧册子。里面记有最高纲领派旧党员、贫农委员会负责人、集体农庄积极分子，还有一些早已同社革党中央分道扬镳的地方组织者。许多姓名后面没有地址，只有一座村庄、一处车站，或是潦草写下的四个字：“仍可联络”。\n\n“这些人要土地革命，也认工农政权，”乌斯季诺夫把册子推到桌上，“但他们不需要社革党中央替自己开口。”加米涅夫答应给最高纲领派留下独立活动的余地，并在土地与农业机关中保留席位。斯维尔德洛夫接过名册，要求中央逐一查证；坐在一旁的季诺维也夫随即补充说，今后农村代表的资格，最好也由一个专门机关统一核准。"
  RUS_stalin_kamenev_tree.1.a: "先把失散的同志找回来。"
  RUS_stalin_kamenev_tree.3.t: "第二张党证"
  RUS_stalin_kamenev_tree.3.d: "莫斯科\n\n伊万坐在登记处的办公桌后，摩挲着钢笔帽上的一道划痕。接上与党的联系后，他被安排在这间办公室做接待登记工作。这不是他想要的职位——他更希望回部队，但肺部在流亡期间落下的旧伤让他再也扛不住北方的寒冬。组织上说他懂文书工作，字迹清楚，对人耐心，适合做这个。\n\n他接受了安排，一开始只是觉得清闲。但几个月后他发现自己确实喜欢这份差事。每天来登记的人形形色色：从法国回来的流亡者口袋里还揣着法郎硬币，刚从军营退役的士兵帽子上留着弹孔，还有一些长期藏在地下、连正式党证都没有的老面孔。\n\n伊万喜欢听他们讲自己的经历——虽然他的职责只是核对和记录，但他总觉得每一张表格背后都是这场革命的一个侧面。更重要的是，他发现来登记的人中，有不少和他一样的人：失去过身份、辗转过多座城市、被关押过又被释放、重新找到组织。在这间办公室工作久了，他开始觉得这不像一份闲差，而像某种意义的接应站——把散落的人逐个捡回来。\n\n今天轮到他值班，上午已经接待了六个人，刚送走一位从法国回来的女同志，杯里的茶还没凉透，门又被推开了。\n\n进来的人衣着整洁但旧，外套袖口磨得发白，身板笔直。他在桌前坐下，摘下帽子搁在膝上，动作干脆。\n\n“补办党证。”对方直言，“原证件在流亡期间遗失。”\n\n伊万点了下头，翻开表格。“您的姓名是？”"
  RUS_stalin_kamenev_tree.3.a: "阿列克谢·米哈伊洛维奇·乌斯季诺夫。"
  RUS_stalin_kamenev_tree.4.t: "联盟的新席位"
  RUS_stalin_kamenev_tree.4.d: "扩大联盟后的第一次协商会，一连开了三天。阿布拉莫维奇领来劳联右派的工会干部，泽勒身边坐满社会主义民主同盟的技术人员，地方苏维埃和最高纲领派也各有代表到场。谁都不愿先碰党纲，加米涅夫索性把粮食调运、工厂复工和地方重建摆到最前面。会内通过了几项联合提案，会外则谈妥了更多顾问席位。\n\n消息传到俄共（布）中央局，不少党员指责加米涅夫把刚刚争回的阵地拱手送给温和派。季诺维也夫没有跟着反对，只吩咐筹备处收齐与会者的履历、党籍和推荐人。既然这些人都要参加下一次代表大会，他自然应该先弄清楚，他们会坐在哪里，又会把票投给谁。"
  RUS_stalin_kamenev_tree.4.a: "先让国家重新运转。"
  RUS_stalin_kamenev_tree.5.t: "卡姆科夫的条件"
  RUS_stalin_kamenev_tree.5.d: "卡姆科夫没有出席正式宴会。散会以后，他从侧门进了加米涅夫的办公室，只带来两项条件：不能把所有社革党人一概打成反革命，也不能用莫斯科委派的官员，取代起义中自行产生的地方苏维埃。只要这两条得到保证，他愿意反对社革党中央独占土地机关，也赞成由工会和苏维埃构成新国家的骨架。\n\n加米涅夫当场应允，并承认卡姆科夫派保留组织与报刊的权利。协议公布以后，一批左翼社革党干部开始同党中央拉开距离。他们并未因此变成布尔什维克，却足以让斯皮里多诺娃少掉一批可靠的拥护者。至于这些尚未选边的代表，季诺维也夫相信，日后总还会有再谈一次的机会。"
  RUS_stalin_kamenev_tree.5.a: "先在能谈拢的地方合作。"

  RUS_kamenev_psr_automatic_focus_tt: "这是§Y社会革命党§!自行推进的政治议程，玩家不能手动选择。完成后将改变党派关系和革命政府的权力平衡。"
  RUS_kamenev_bol_automatic_focus_tt: "这是§Y俄共（布）§!的组织建设国策，由玩家自行选择完成。完成后将改变党派关系和革命政府的权力平衡。"
  RUS_kamenev_psr_agenda_originator: "社会革命党中央"
  RUS_kamenev_bol_agenda_originator: "俄共（布）中央局"

  RUS_kamenev_psr_rebuild_central_committee: "“斗争赢得权利”"
  RUS_kamenev_psr_rebuild_central_committee_desc: "社会主义共和国不是在会议桌上诞生的。正是社革党遍布各地的组织发动村庄、筹措粮饷并投身起义，萨文科夫的统治才会土崩瓦解。斯皮里多诺娃认为，这场斗争理应为社革党赢得参与新政权的权利。流亡归来的中央委员、地方书记和游击队代表将重新聚首，把战火中各自为战的组织整合为一个全国政党，准备索取他们自认为用鲜血换来的位置。"
  RUS_kamenev_psr_absorb_democratic_parties: "吸收民主党派"
  RUS_kamenev_psr_absorb_democratic_parties_desc: "社革党能够号召万千村庄，在城市工会和专业机关中却处处落后于劳联与布尔什维克。为补上这块短板，斯皮里多诺娃打算接纳社会主义民主同盟、地方自治派以及拥护新共和国的温和左翼。只要承认土地革命和社会主义政权，他们便可保留自己的招牌，参加社革党主持的联合委员会。借助这些新盟友，社革党也能把组织伸进城市。"
  RUS_kamenev_psr_preserve_land_committees: "与右派合流"
  RUS_kamenev_psr_preserve_land_committees_desc: "一批在起义中观望不前的社革党右派，如今也开始试探归队。他们承认社会主义共和国已成事实，却要求保全地方自治和合作社经营，并反对在农村继续扩大阶级斗争。斯皮里多诺娃愿意作出这些保证，换取一批熟悉行政事务的旧同僚回到中央。只是右派一旦归来，最高纲领派和贫农组织在党内的声音难免会被压低。"
  RUS_kamenev_psr_land_socialisation_bill: "土地社会化草案"
  RUS_kamenev_psr_land_socialisation_bill_desc: "社革党终于把多年来的土地口号写成了法案：地主土地一律无偿没收，土地不得买卖出租，再由地方土地委员会按劳动需要重新分配。没收地主并无异议，问题在于谁来分地。布尔什维克和最高纲领派绝不会把一切交给不分贫富的村社多数；贫农委员会、国营农场与集体农庄应占何种地位，势必成为审议中的争论焦点。"
  RUS_kamenev_psr_local_self_government: "乡村苏维埃自治章程"
  RUS_kamenev_psr_local_self_government_desc: "起义中诞生的乡村苏维埃，本就是各村农民自己选出、又拿枪守下来的，社革党绝不肯让莫斯科派来的委员轻易接管。新章程将赋予乡村苏维埃选举执行委员会、审议预算和管理公有土地的权力，中央只有在其公然违法时方可解散。所谓乡村自治既是社革党的信条，也会把他们在农村的优势写进法律。"
  RUS_kamenev_psr_claim_internal_affairs: "组建乡村民兵"
  RUS_kamenev_psr_claim_internal_affairs_desc: "枪声虽已平息，起义时期的游击队和护村队却没有随之消失，武器也大多锁在地方委员会的仓库里。社革党打算把这些队伍整编为乡村民兵，仍由地方苏维埃供养，并优先留用起义中的指挥员。布尔什维克则要求军械与任命一律向中央备案。争论说到底并不复杂：军械库的钥匙，究竟应当握在谁手中？"
  RUS_kamenev_psr_cooperatives_fair_grain_prices: "增设合作社"
  RUS_kamenev_psr_cooperatives_fair_grain_prices_desc: "临时征粮早已怨声四起，私人粮商又趁交通混乱压价囤粮。社革党开出的药方是在各县增设生产、信贷和粮食合作社，由合作社收购余粮、供应农具并发放贷款。最高纲领派并不反对合作社，却坚持让贫农和农业工人另有代表；否则，昔日的富户只消换上一块合作社招牌，便又能坐回原来的位置。"
  RUS_kamenev_psr_peasant_congress: "增加农民代表比例"
  RUS_kamenev_psr_peasant_congress_desc: "既然新政权以工农之名立国，农民在人民委员会、计划机关和劳联代表大会中的席位就不该只是点缀。社革党要求增加农民代表，反对者并不多；真正难办的是这些代表由谁产生。地方苏维埃、合作社和贫农委员会都要自行推举，社革党中央却坚持由党的农民代表大会统一核准。代表证上的那枚印章，远比席位数目本身更要紧。"
  RUS_kamenev_psr_defend_revolutionary_democracy: "捍卫农民地位"
  RUS_kamenev_psr_defend_revolutionary_democracy_desc: "乡村苏维埃不得任意解散，计划机关必须保留农民席位，征粮和民兵整编也须征得地方同意。社革党把这些要求写成《农民权利保证》，准备以此证明，只有他们才肯在新政权中替农民说话。可在布尔什维克看来，所谓“农民”从来不是一个浑然无别的整体；若把富农、贫农和农业工人一股脑塞进同一只口袋，农村真正的矛盾反倒会被遮住。"
  RUS_kamenev_psr_final_party_congress: "安抚最高纲领派"
  RUS_kamenev_psr_final_party_congress_desc: "最高纲领派不肯解散地方组织，一些干部甚至已经同俄共（布）恢复了往来。若在胜利之初便公开决裂，社革党好不容易缝合起来的全国机关顷刻就会再度破碎。斯皮里多诺娃只得让步，答应给贫农委员会、农业工人和集体农庄留下独立代表，也暂不追究双重组织关系。乌斯季诺夫接受这份妥协，却没有交出一张名册，也没有割断一条旧日联系。"
  RUS_kamenev_psr_agrarian_socialism: "农业社会主义"
  RUS_kamenev_psr_agrarian_socialism_desc: "社革党将他们主张的乡村苏维埃与农民代表等提案整理为了一份完整的纲领，宣称俄罗斯将由自由联合的劳动村社走向社会主义，并试图把自己写成整个农民阶级的当然代表。"

  RUS_kamenev_bol_register_returning_members: "“一切权力归苏维埃”"
  RUS_kamenev_bol_register_returning_members_desc: "推翻旧政府只完成了革命的一半。工农兵拿起武器，不是为了换一批人坐进部长办公室，而是要让权力真正回到苏维埃手中。可一句口号并不能自行组织国家，为达成这一伟大目标，我们仍有很多工作要做。"
  RUS_kamenev_bol_restore_central_bureau: "两张党证"
  RUS_kamenev_bol_restore_central_bureau_desc: "全俄劳联是各派社会主义者共同行动的联盟，不是没收党证的机关。加入劳联的布尔什维克，仍有权保留俄共（布）党籍，服从本党的纪律。加米涅夫会在公开场合为这种双重身份据理力争，中央局则另行保管党员名册和组织关系。我们可以在劳联中并肩工作，却不能因此放弃自己的组织。"
  RUS_kamenev_bol_restore_pravda: "《真理报》重返俄罗斯"
  RUS_kamenev_bol_restore_pravda_desc: "没有一份自己的报纸，中央的决议便只能靠传闻抵达基层，社革党关于土地和地方自治的主张也无人系统驳斥。《真理报》的旧招牌必须重新挂起来，让党的声音再度传遍俄罗斯。只是新编辑部里已有不少季诺维也夫的亲信；在他们笔下，共产派愈发显得坚定果决，而加米涅夫的妥协，仿佛只是党在过渡时期不得不借用的一根拐杖。"
  RUS_kamenev_bol_rebuild_factory_cells: "车间里的党小组"
  RUS_kamenev_bol_rebuild_factory_cells_desc: "彼得格勒、莫斯科、乌拉尔和顿巴斯的工厂里，仍有许多经受过旧日斗争的党员，只是他们早已彼此失散。中央局将以车间为单位重建党小组，传阅文件，推举工会代表，也把工人对工资、生产纪律和工厂管理的意见逐级送回中央。劳联依旧主持工会和苏维埃中的公开活动，但在每一次表决以前，布尔什维克都将先形成自己的主张。"
  RUS_kamenev_bol_railway_telegraph_bureau: "铁路与电报联络局"
  RUS_kamenev_bol_railway_telegraph_bureau_desc: "仅凭莫斯科寄出的公函，不可能维系横跨整个俄罗斯的党组织。可靠的铁路工人、电报员和旧地下交通员将重新集合，在各处枢纽车站设立联络点，为文件、人员和经费开辟固定路线。季诺维也夫主动把这项工作纳入书记处。地方政府未必知道每封电报的去向，而他从此可以越过层层机关，直接同各省党组织说话。"
  RUS_kamenev_bol_unify_planning_apparatus: "开设党校"
  RUS_kamenev_bol_unify_planning_apparatus_desc: "革命履历可以证明忠诚，却不能代替统计、生产和行政知识。为了给新政权培养真正能办事的干部，中央局将开设党校，从工程师、工会积极分子和地方书记中选拔学员，系统讲授马克思主义、组织工作与国家管理。结业以后，他们将由中央统一分配，前往人民委员部、计划机关和地方苏维埃任职。"
  RUS_kamenev_bol_win_vst_majority: "设立最高纲领派联络处"
  RUS_kamenev_bol_win_vst_majority_desc: "乌斯季诺夫同意在俄共（布）中央局旁设立联络处，由最高纲领派派人常驻。贫农委员会、农村激进派和旧地下组织的报告，从此不必再经社革党中央转手；布尔什维克的文件，也终于有了一条直达乡村的道路。双方仍保留各自的党证，但在反对富农、反对社革党垄断农村的问题上，这些残留在乡间的布尔什维克，正一步步回到原来的队伍中。"
  RUS_kamenev_bol_undissolved_central_committee: "高举红旗"
  RUS_kamenev_bol_undissolved_central_committee_desc: "《真理报》已经复刊，车间党小组与铁路联络网也重新贯通全国，最高纲领派则为我们补上了通往乡村的一环。斯维尔德洛夫保存多年的中央委员凭证足以证明，俄共（布）从未解散，只是被迫转入地下。如今，红旗终于可以再次升上中央机关。可就在党重见天日之时，季诺维也夫也已在劳联共产派中聚拢起自己的多数。举起旗帜的人，与有权以党的名义发号施令的人，未必会是同一个。"

  RUS_kamenev_national_economic_line: "国民经济总路线"
  RUS_kamenev_national_economic_line_desc: "第一个五年计划已经把零散的生产安排纳入统一规划，但工厂、铁路和资源开发仍各自为政。最高国民经济委员会将据此排定全国建设的先后次序：巩固核心城市的生产与运输，把乌拉尔建设成连接东西部的新支点，并为西伯利亚的长期开发准备人力和设备。"
  RUS_kamenev_all_russian_electrification_unlock_tt: "解锁可重复决议：§Y全俄电气化工程§!"
  RUS_kamenev_all_russian_electrification: "全俄电气化工程"
  RUS_kamenev_all_russian_electrification_desc: "电气化不能只停留在中央机关的蓝图上。勘测队、线路工人与地方苏维埃将分段铺开输电网，使新建电站、铁路和工业区真正连成一体。"
  RUS_kamenev_all_russian_electrification_available_tt: "至少有一处由我国拥有并控制、§Y基础设施§!未满级的§Y核心地区§!"
  RUS_kamenev_all_russian_electrification_complete_tt: "在一处随机的、由我国拥有并控制的§Y核心地区§!增加§G1§!级§Y基础设施§!\n在同一地区增加§G1§!个§Y建筑槽§!\n获得§Y五年计划分数§!：§G+1§!"
  RUS_kamenev_industrialise_urals: "规划自然发展"
  RUS_kamenev_industrialise_urals_desc: "从伏尔加河到叶尼塞河，俄罗斯的河流、森林与矿藏不能再由地方机关各自处置。国家计划将把水利枢纽、资源勘探、能源建设和新工业城市放在同一张图上，在改造自然的同时，为东西部建立一系列新的工业支点。"
  RUS_rybinsk_hydroelectric_dam: "雷宾斯克水电站"
  RUS_rybinsk_hydroelectric_dam_desc: "雷宾斯克位于伏尔加河上游，河面开阔，邻近莫斯科与北方工业区。若在此修筑大坝、船闸和大型电站，我们便能稳定两地的电力供应，并改善伏尔加河航运。不过，新水库势必淹没大片村庄和农田，迁建工作必须与主体工程一并纳入计划。"
  RUS_zhiguli_hydroelectric_dam: "日古利水电站"
  RUS_zhiguli_hydroelectric_dam_desc: "伏尔加河流经日古利山地时骤然收窄，斯塔夫罗波尔-伏尔加河畔一带因此成为兴建大型水利枢纽的理想地点。水电站将为萨马拉及中伏尔加工业带提供充足电力，改善上下游航运，并带动一座新的工人城市在河岸兴起。"
  RUS_krasnoyarsk_hydroelectric_dam: "克拉斯诺亚尔斯克水电站"
  RUS_krasnoyarsk_hydroelectric_dam_desc: "叶尼塞河穿过萨彦山地后奔向克拉斯诺亚尔斯克，巨大的流量与落差尚未得到利用。在城市上游筑坝，可以为西伯利亚的冶金、采矿和铁路提供源源不断的电力，使克拉斯诺亚尔斯克成为东方工业化的重要支点。"
  RUS_kamenev_industrialise_eastern_europe: "增强城市辐射"
  RUS_kamenev_industrialise_eastern_europe_desc: "西部与中部的大城市已经拥有最完整的工厂、院校和交通网。扩建制造业、农业机械厂和铁路枢纽，可以让这些城市把技术、设备和组织力量送往周边地区，带动整个核心地带进入统一计划。"
  RUS_urban_renovation_and_expansion: "翻新与扩建"
  RUS_renovate_and_expand_moscow: "[219.GetName]翻新与扩建"
  RUS_renovate_and_expand_moscow_desc: "[219.GetName]作为全国的政治与经济中枢，道路、住房和公共设施已经难以承受不断增加的人口、机关与工厂。市苏维埃将统一拆除危房、拓宽干道、整修管网并扩建工业区，使首都能够更好地带动周边地区。"
  RUS_renovate_and_expand_tsaritsyn: "[217.GetName]翻新与扩建"
  RUS_renovate_and_expand_tsaritsyn_desc: "[217.GetName]扼守伏尔加河下游，也是南俄粮食、石油与金属运输的交汇点。扩建码头、厂区、工人住宅和市政设施，将使这座城市成为整个伏尔加流域更加有力的工业中心。"
  RUS_renovate_and_expand_saint_petersburg: "[195.GetName]翻新与扩建"
  RUS_renovate_and_expand_saint_petersburg_desc: "[195.GetName]仍拥有俄罗斯最重要的港口、造船厂和机械工业，但连年的危机已经使住房与公共设施严重老化。统一整修旧工业区、港区和市政管网，并为城区继续扩展留出空间，北方首都才能重新焕发生机。"
  RUS_kamenev_industrialise_siberia: "西伯利亚大开发"
  RUS_kamenev_industrialise_siberia_desc: "西伯利亚地下埋藏着尚未充分开发的金属、矿产与燃料。把资本、技术人员和铁路建设投入东方，可以让这片长期被忽视的地区成为社会主义工业化的重要资源基地。"
  RUS_auto_kamenev_vst_left_path: "加米涅夫领导的劳联左派路线已经确立"
  RUS_kamenev_return_to_leninism: "[ROOT.RUSGetKamenevInviteSverdlovName]"
  RUS_kamenev_return_to_leninism_desc: "[ROOT.RUSGetKamenevInviteSverdlovDesc]"
  RUS_kamenev_congress_of_unions: "$RUS_chamber_of_unions$"
  RUS_kamenev_congress_of_unions_desc: "$RUS_chamber_of_unions_desc$"
  RUS_kamenev_acknowledge_eser_contribution: "[ROOT.RUSGetKamenevEserDealName]"
  RUS_kamenev_acknowledge_eser_contribution_desc: "[ROOT.RUSGetKamenevEserDealDesc]"
