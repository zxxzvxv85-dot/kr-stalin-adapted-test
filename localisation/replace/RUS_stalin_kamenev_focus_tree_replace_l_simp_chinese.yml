  RUS_kamenev_technocratic_syndicalism: "为民主奠基"
  RUS_kamenev_technocratic_syndicalism_desc: "在资本主义国家，民主常常被认作为制度的簇拥，而我们将证明——民主是一种生活方式。列宁所预言的“广大无产阶级的民主”已近在咫尺。"
  RUS_kamenev_idealistic_spark: "理想主义星火"
  RUS_kamenev_idealistic_spark_desc: "写进章程的权利若无人践行，终究只是纸上的漂亮字句。劳联将派出宣讲员与监察员，督促工厂大会、乡村苏维埃和地方工会如期改选，把预算与任命真正交给代表审议。有人嘲笑我们在内战方歇之际奢谈民主，可劳动者若永远没有机会亲自管理国家，革命许下的一切又与空话何异？"

  RUS_stalin_kamenev_agendas.1.t: "两百页的土地法案"
  RUS_stalin_kamenev_agendas.1.d: "土地人民委员部把草案送来时，秘书们足足抱进了两大摞文件。最前面的条文倒十分干脆：地主土地无偿没收，土地不得买卖出租，原有庄园交由地方土地委员会处置。社革党代表一再提醒部长们，这是起义以前便许给农民的承诺，乡村不会容忍莫斯科继续拖延。\n\n真正的争执，从土地委员会应由谁组成开始。布尔什维克要求贫农和农业工人另选代表，以免富裕农户凭人数支配村社；乌斯季诺夫又提出，集体农庄和最高纲领派也须有自己的席位。加米涅夫没有准许立即表决，而是把草案送进跨党派委员会逐条审议。主席槌落下时，社革党得到的是一场审议，而不是一纸照准。"
  RUS_stalin_kamenev_agendas.1.a: "土地要分，条文也要逐条说清。"
  RUS_stalin_kamenev_agendas.2.t: "谁代表俄罗斯农民"
  RUS_stalin_kamenev_agendas.2.d: "全俄农民代表会议尚未开幕，社革党中央便替大多数地方代表团办好了车票和住处。入口处挂满土地社会化的标语，斯皮里多诺娃的报告也已印成小册，只等各地来宾用掌声确认社革党在农村的领导地位。\n\n乌斯季诺夫带来的代表却不肯坐进社革党预先划好的席位。贫农委员会、集体农庄和农村地下组织的代表另坐一席，开会第一件事便是要求复核富裕农户的代表资格。劳联与俄共（布）的组织员也先后赶到，几次程序表决一直拖到深夜。社革党原想让全国看见一个团结的农村，台下泾渭分明的座次却比台上任何演说都更醒目。"
  RUS_stalin_kamenev_agendas.2.a: "先查清每一张代表证。"
  RUS_stalin_kamenev_agendas.3.t: "只能保留一张党证？"
  RUS_stalin_kamenev_agendas.3.d: "社革党把几份地方通报带到了部长会议。通报中的干部白天佩着劳联代表证参加协商，晚上却依照俄共（布）党团的决定准备第二天的表决。社革党据此要求清查双重党籍：凡加入全俄劳联者，只能服从劳联纪律，不得再领受其他党组织的秘密指示。\n\n加米涅夫答应公开部长和高级干部的党籍，却拒绝把普通共产党员逐出劳联。几天以后，季诺维也夫向各地发出内部通知，党员名册不再交给联合政府，重要联络一律改用编号。社革党禁止人们在纸面上保留两张党证，却管不到他们究竟听从谁的号令。"
  RUS_stalin_kamenev_agendas.3.a: "公开身份，不交出组织。"
  RUS_stalin_kamenev_agendas.4.t: "党员名册"
  RUS_stalin_kamenev_agendas.4.d: "登记处开门当日，走廊从清晨起便排起长队。前来注册的人员身份各异：有从法国和蒙古回国的流亡者，有刚离开军营的前线士兵，也有长期潜伏在国内地下组织的骨干成员。\n\n由于革命期间档案散失严重，工作人员只能逐项核对旧党龄、流放地、工作履历和介绍人信息；对证明文件缺失者，则要求两名正式党员现场作证。核验过程繁琐耗时，但布尔什维克仍从紧张的财政中拨出专款推进此项工作，将其视为巩固组织纪律、厘清党员身份的基础性环节。\n\n登记过程中，部分党员的资历争议逐渐浮出水面——个别申请者的入党时间与组织记录存在出入，或流放经历难以查证，这引发了对历史贡献认定标准的内部讨论。同时，这份名册也为后续干部任用和党内人事调整提供了依据，不可避免地在各派系之间引起微妙反应。尽管工作推进缓慢，但布尔什维克高层认为，完成党员全面登记是建立有效组织体系的前提条件，也是防止投机分子混入队伍的必要措施。至初步汇总时，登记人数与预期仍有差距，但至少为党内管理提供了可供参考的基础数据。"
  RUS_stalin_kamenev_agendas.4.a: "忠贞的革命者又有了自己的组织。"
  RUS_stalin_kamenev_agendas.6.t: "联络名单"
  RUS_stalin_kamenev_agendas.6.d: "在莫斯科挂牌的当天下午，乌斯季诺夫就派人送来了一批手写的农村通信地址。第一批名单共四十七个，覆盖萨拉托夫、坦波夫和沃罗涅日三个省。\n\n名单上的联系人构成并不单一。有失联多年的旧党员，其入党时间可追溯至一九〇五年；有集体农庄的管委会成员，经最高纲领派在当地的宣传网络建立联系；也有原社革党地方支部中的激进分子，内战结束后脱离了社革党系统，但尚未正式转入布尔什维克的组织框架。\n\n乌斯季诺夫在附信中做了分类说明。他标注了每个联系人的政治倾向、在当地的组织基础以及可承担的工作范围。部分人注明“中间人联络，不直接经手文件”，另一些人则被标注为“可承担传递和宣讲任务”。"
  RUS_stalin_kamenev_agendas.6.a: "布尔什维克或许能在农村重新站稳脚跟？"
  RUS_stalin_kamenev_agendas.7.t: "农业社会主义纲领"
  RUS_stalin_kamenev_agendas.7.d: "社革党中央把土地社会化、合作社、乡村苏维埃自治和农民代表名额汇成了一份完整纲领。斯皮里多诺娃在农民代表大会上逐章宣读，每念到起义时期的旧口号，台下便响起一阵掌声。纲领的最后宣称，俄罗斯将由自由联合的劳动村社走向社会主义，而社革党正是整个农民阶级当之无愧的代表。\n\n乌斯季诺夫随即登台。他赞成没收地主土地，却绝不承认村社之内再无阶级之分；布尔什维克代表也要求把贫农、农业工人和集体农庄从笼统的“农民”中单列出来。社革党依靠多数通过了纲领，可谁有资格代表农村，并不会由举手表决决定。"
  RUS_stalin_kamenev_agendas.7.a: "一纸纲领代表不了整个农村。"
  RUS_stalin_kamenev_agendas.9.t: "社革党的新盟友"
  RUS_stalin_kamenev_agendas.9.d: "社革党中央向社会主义民主同盟、地方自治派和几支小型民主社会主义团体发出邀请。条件并不苛刻：承认社会主义共和国和土地革命，停止反对新政权的活动。各团体不必立即并入社革党，既可保留刊物和地方组织，也能在社革党主持的联合委员会中获得席位。\n\n首批来客到场时，工作人员临时添了几排座椅。斯皮里多诺娃亲自致欢迎辞，几位温和派领袖也当场递交合作声明。加米涅夫乐见更多党派恢复公开活动，俄共（布）却很快发现，社革党已经借着这批新盟友，把手伸进了过去难以涉足的城市机关和专业团体。"
  RUS_stalin_kamenev_agendas.9.a: "社革党的席位又多了。"
  RUS_stalin_kamenev_agendas.10.t: "谁来替农民说话"
  RUS_stalin_kamenev_agendas.10.d: "斯皮里多诺娃领着各地农民代表走进部长会议，要求政府签署《农民权利保证》。文件规定，乡村苏维埃不得任意解散，征粮数额须同地方代表协商，计划机关必须给农民留下固定席位，中央也无权随意撤换地方民兵指挥员。她提醒在座诸人，正是无数村庄用粮食和子弟支撑了起义，胜利后的政府不能只在缺粮缺兵时才想起农民。\n\n乌斯季诺夫起身赞成保护贫农组织和乡村苏维埃，却拒绝让社革党中央以全体农民的名义签字。布尔什维克代表随即要求，在文件中明确区分贫农、富农和农业工人。原稿最终被退回修改，斯皮里多诺娃却已借这场争论把话说给了全国的乡村。"
  RUS_stalin_kamenev_agendas.10.a: "先说清楚，你们替谁担保。"
