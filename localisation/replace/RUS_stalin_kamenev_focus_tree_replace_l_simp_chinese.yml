l_simp_chinese:
  RUS_kamenev_three_accounts: "胜利后的权力安排"
  RUS_kamenev_three_accounts_desc: "社革党发动了起义，全俄劳联接管了工会和苏维埃，社会主义政权才得以迅速站稳脚跟。如今，流亡多年的布尔什维克干部也陆续回国。三方都要进入政府，也都想决定今后的政策。加米涅夫首先要划清各自的职责，免得这个临时联盟刚刚取胜便陷入内讧。"
  RUS_kamenev_no_permanent_creditor: "限制社革党的主导权"
  RUS_kamenev_no_permanent_creditor_desc: "社革党为起义出了最多的力，因而要求掌握土地、内务和地方行政。但这份功劳不能成为他们长期把持政府的理由。我们将统一地方官员的任命，检查各级机关是否越权，并争取最高纲领派支持，逐步削弱社革党中央对农村组织和地方机关的控制。"
  RUS_kamenev_one_party_card: "统一党籍和组织纪律"
  RUS_kamenev_one_party_card_desc: "凡是进入劳联机关工作的布尔什维克干部，都要登记党籍，并遵守共同的组织纪律。加米涅夫继续出面协调各方，斯维尔德洛夫负责恢复各地党组织的联系；季诺维也夫则开始插手干部任命，借此扩大自己在劳联中的影响。"
  RUS_kamenev_majority_rule: "交由代表大会表决"
  RUS_kamenev_majority_rule_desc: "工人联盟不能一直靠各派领袖在会外私下谈妥一切。今后的重大提案都要交给代表大会表决。各派仍可公开争取支持，但一旦表决有了结果，就不能再以退出政府逼迫各方重新谈判。"
  RUS_kamenev_revolutionary_legality: "建立革命法制"
  RUS_kamenev_revolutionary_legality_desc: "革命期间，各地颁下了不少临时命令，地方机关自行其是，各党也常常包庇本派干部。政府将统一办事程序，设立国家监察机关和干部申诉制度，查处滥用职权以及拒不执行中央决定的行为。"

  RUS_mensheviks: "[ROOT.RUSGetKamenevMensheviksName]"
  RUS_mensheviks_desc: "[ROOT.RUSGetKamenevMensheviksDesc]"
  RUS_kamenev_mensheviks_name: "三党联合执政"
  RUS_kamenev_mensheviks_desc: "全俄劳联、社会革命党与俄共（布）将共同组成临时政府。社革党掌握着不少地方机关，劳联负责工会和苏维埃的日常行政，布尔什维克则在军队和归国干部中很有影响。加米涅夫将主持三方谈判。由于劳联和社革党都愿意同他打交道，他逐渐成了布尔什维克在联合政府中的“白手套”：妥协由他出面，党组织则在幕后恢复。"
  RUS_kamenev_mensheviks_name_default: "唐恩派"
  RUS_kamenev_mensheviks_desc_default: "全俄劳联右翼的唐恩派得名于其领导人，老孟什维克费奥多尔·唐恩。其广泛地主张扩大革命政治，同时谨慎地向社会主义经济过渡。在二十年代的暴政和萨文科夫独裁的激化之下，许多前孟什维克，以及一些颇具妥协思想的前布尔什维克都加入了这一派。"

  RUS_eser_deal: "[ROOT.RUSGetKamenevEserDealName]"
  RUS_eser_deal_desc: "[ROOT.RUSGetKamenevEserDealDesc]"
  RUS_kamenev_eser_deal_name: "承认社革党的起义贡献"
  RUS_kamenev_eser_deal_desc: "如果没有社会革命党发动的起义，社会主义者不可能如此迅速地接管俄罗斯。政府会承认他们在革命中的作用，并在土地、地方自治和农民组织等问题上同他们合作。但乌斯季诺夫领导的最高纲领派必须保持独立，不能让社革党中央独自决定农村政策。"
  RUS_kamenev_eser_deal_desc_default: "社会革命党对社会主义的理解一直饱受质疑，他们大多数人拔高农民的地位并反对马克思主义，信仰农业社会主义，但是无论如何我们都跟这帮人绑在一条船上了。我们会去接触意识形态上可共融的社革党人，以期达成更持久的协定。"

  RUS_invite_sverdlov: "[ROOT.RUSGetKamenevInviteSverdlovName]"
  RUS_invite_sverdlov_desc: "[ROOT.RUSGetKamenevInviteSverdlovDesc]"
  RUS_kamenev_invite_sverdlov_name: "让俄共（布）走上台前"
  RUS_kamenev_invite_sverdlov_desc: "俄共（布）不能再只靠劳联左翼、军中旧友和私人关系影响政府。斯维尔德洛夫将代表恢复公开活动的党组织进入部长会议，并负责联系归国干部、地方党小组和军中的布尔什维克。加米涅夫仍会出面协调各方，但俄共（布）已经重新有了自己的组织。"
  RUS_kamenev_invite_sverdlov_name_default: "回归列宁主义"
  RUS_kamenev_invite_sverdlov_desc_default: "尽管余下的独立布尔什维克拒绝加入全俄劳联，他们仍然是工人联盟中不可忽视的重要力量。他们的文职领袖兼理论家雅科夫·斯维尔德洛夫是一位才华横溢的行政官员，在流亡社区和军队中深受欢迎，同时也是一位经验丰富的革命家。秉持团结的精神，我们将与这位老同志接洽，正式邀请他加入部长会议。"

  RUS_invite_zeller: "[ROOT.RUSGetKamenevInviteZellerName]"
  RUS_invite_zeller_desc: "[ROOT.RUSGetKamenevInviteZellerDesc]"
  RUS_kamenev_invite_zeller_name: "维持劳联的广泛联盟"
  RUS_kamenev_invite_zeller_desc: "泽勒和社会主义民主同盟在富裕工人、小业主及劳联温和派中仍有影响。让他们继续留在工人联盟内，可以防止这些人完全倒向社革党，也能让联合政府保持更广泛的支持。代价是许多政策还得花时间协商。"
  RUS_kamenev_invite_zeller_name_default: "邀请泽勒"
  RUS_kamenev_invite_zeller_desc_default: "社会主义民主同盟被许多人视为反动的激进民主党中的顽固分子，但其确实赢得了不少小企业主和富裕工人的忠诚，在俄罗斯南部尤其如此。其新的领袖盖哈德·泽勒算是最为不温不火的社会主义者，但他肯定也理解合作的价值——是时候正式邀请他加入部长会议，将他的党派拉入工人联盟了。"

  RUS_internationalists: "[ROOT.RUSGetKamenevInternationalistsName]"
  RUS_internationalists_desc: "[ROOT.RUSGetKamenevInternationalistsDesc]"
  RUS_kamenev_internationalists_name: "胜利后的第一次代表大会"
  RUS_kamenev_internationalists_desc: "临时达成的安排必须交给代表大会确认。各地工会、苏维埃、农民委员会和革命党组织将围绕土地改革、计划经济、国家制度和各党权限展开争论。季诺维也夫借筹备大会的机会摸清了各地代表的立场与派别，并开始为争夺劳联领导权做准备。"
  RUS_kamenev_internationalists_name_default: "国际主义者"
  RUS_kamenev_internationalists_desc_default: "国际主义者因主张第三国际的工团主义综合而得名，是全俄劳联的核心力量。他们呼吁苏维埃与工会共享权力，拥护工人联盟，主要围绕列维茨基和苏利莫夫的领导而形成。"

  RUS_communists: "[ROOT.RUSGetKamenevCommunistsName]"
  RUS_communists_desc: "[ROOT.RUSGetKamenevCommunistsDesc]"
  RUS_kamenev_communists_name: "布尔什维克复兴"
  RUS_kamenev_communists_desc: "俄共（布）的中央机关和地方组织将重新公开活动，但眼下仍留在全俄劳联领导的联合政府内。加米涅夫负责对外协调，斯维尔德洛夫重建组织系统，季诺维也夫则经营劳联左翼和代表大会党团。随着党组织恢复，谁来领导布尔什维克也重新成了问题。"
  RUS_kamenev_communists_name_default: "共产主义者"
  RUS_kamenev_communists_desc_default: "全俄劳联左翼非常喜欢共产主义者这个标签，他们寻求在不向反对派妥协的情况下，快速过渡到社会主义计划经济，并推动达成实现社会革命的不懈承诺。通常来说，这派人由列夫·加米涅夫领导，但是在格里戈里·季诺维也夫影响下，他们也有可能转向一个更加个人主义的方向。"

  RUS_war_on_landowners: "[ROOT.RUSGetKamenevWarOnLandownersName]"
  RUS_war_on_landowners_desc: "[ROOT.RUSGetKamenevWarOnLandownersDesc]"
  RUS_kamenev_war_on_landowners_name: "乡村中的布尔什维克"
  RUS_kamenev_war_on_landowners_desc: "最高纲领派在农村保留了许多地下组织。他们的工作方式更接近布尔什维克，而不是社革党主流。乌斯季诺夫将组织贫农委员会和集体农庄积极分子，打击地主、富农与投机粮商。这样既能推进土地改革，也能削弱社革党中央对农村革命运动的控制。"
  RUS_kamenev_war_on_landowners_name_default: "加速结束农业过渡期"
  RUS_kamenev_war_on_landowners_desc_default: "农民这一过渡阶级是必然在未来消亡的，而我们要做的则是加速这一过程，促使其向农业工人迈进，确保旧的小资产阶级思想再无立地生根的阶级基础。"

  RUS_stalin_kamenev_tree.1.t: "第一次联合执政会议"
  RUS_stalin_kamenev_tree.1.d: "第一次执政会议谈的不是新法令，而是谁来掌管政府和地方机关。社革党带来了参加起义的地方委员会与游击队负责人名单；全俄劳联要求继续领导工会、苏维埃和工业管理机关；斯维尔德洛夫则希望一批归国布尔什维克进入中央部门。\n\n加米涅夫承认三方都为革命胜利出了力，但拒绝按党派瓜分国家机关。会议决定成立联合委员会，逐项商定人选和权限。季诺维也夫主动接下整理各地代表资料的工作。当时没人太在意这份差事，而他已经开始从一张张名册中摸清劳联内部的人事关系。"
  RUS_stalin_kamenev_tree.1.a: "先把政府组织起来。"
  RUS_stalin_kamenev_tree.2.t: "社革党的要求"
  RUS_stalin_kamenev_tree.2.d: "社革党中央提出，既然这场起义主要是他们组织起来的，土地部、内务机关和地方行政就应交给社革党。布尔什维克代表拒绝接受这一要求，双方在执政会议上第一次公开争执。\n\n乌斯季诺夫没有站在社革党中央一边。他表示，最高纲领派赞成土地社会化，也主张在农村开展阶级斗争，但不会接受社革党垄断所有农民组织。加米涅夫随即提出，地方任命须经联合政府确认，各级机关也要接受统一检查。这一方案得到了劳联左翼和最高纲领派的支持。"
  RUS_stalin_kamenev_tree.2.a: "地方机关必须服从联合政府。"
  RUS_stalin_kamenev_tree.3.t: "统一登记"
  RUS_stalin_kamenev_tree.3.d: "新的组织通告规定，凡进入全俄劳联机关工作的布尔什维克干部，都必须登记党籍并遵守联合政府的会议纪律。通告由加米涅夫出面签署，他因此继续担任布尔什维克同其他党派交涉时的公开代表。\n\n季诺维也夫主动接管干部联络和代表资格审查，越来越多的任命要经过他的手。斯维尔德洛夫赞成恢复党的组织联系，却开始担心季诺维也夫正把劳联党团变成自己的权力基础。"
  RUS_stalin_kamenev_tree.3.a: "先把组织关系理顺。"
  RUS_stalin_kamenev_tree.4.t: "新的表决规则"
  RUS_stalin_kamenev_tree.4.d: "代表大会通过了新的议事规则。各派仍可在会前协商，也可以提出修正案；但提案一经多数表决，所有参加工人联盟的政党都必须执行，不能再以退出政府逼迫大会重议。\n\n新规则加快了决策，也让每一个代表席位变得更加重要。负责筹备大会的季诺维也夫已经掌握各省、各工会和各党团的票数，开始有针对性地争取立场不定的代表。"
  RUS_stalin_kamenev_tree.4.a: "按表决结果办。"
  RUS_stalin_kamenev_tree.5.t: "监察委员会的人选"
  RUS_stalin_kamenev_tree.5.d: "国家监察委员会刚刚成立，各派便围绕秘书处和地方调查员的人选争执起来。社革党想保护自己掌握的地方自治机关，劳联干部要求清理旧官僚，布尔什维克则主张重点调查投机、破坏和拒不执行中央命令的行为。\n\n加米涅夫坚持让三方共同监督委员会。季诺维也夫拿到了一部分干部任命权，斯维尔德洛夫则要求所有调查档案都在中央留存副本。斯大林没有公开插手，但军中的老部下已经开始把涉及军政机关的材料送到他那里。"
  RUS_stalin_kamenev_tree.5.a: "先把程序定下来。"

  RUS_kamenev_psr_automatic_focus_tt: "这是§Y社会革命党§!自行推进的政治议程，玩家不能手动选择。完成后将改变党派关系和革命政府的权力平衡。"
  RUS_kamenev_bol_automatic_focus_tt: "这是§Y俄共（布）§!自行推进的政治议程，玩家不能手动选择。完成后将改变党派关系和革命政府的权力平衡。"
  RUS_kamenev_psr_agenda_originator: "社会革命党中央"
  RUS_kamenev_bol_agenda_originator: "俄共（布）中央局"

  RUS_kamenev_psr_rebuild_central_committee: "重建社革党中央"
  RUS_kamenev_psr_rebuild_central_committee_desc: "参加起义的地方委员会、游击队负责人和旧党部必须重新服从一个中央。社革党将借革命胜利恢复组织网，把各地临时机关同本党联系起来，并以此要求在联合政府中获得与其贡献相称的地位。"
  RUS_kamenev_psr_land_socialisation_bill: "提出土地社会化法案"
  RUS_kamenev_psr_land_socialisation_bill_desc: "社革党准备把土地交给劳动者共同使用，由地方土地委员会安排分配与经营。布尔什维克担心富裕农民会控制这些委员会；乌斯季诺夫则赞成没收地主土地，却要求同时建立贫农组织和集体农庄。土地问题将成为三方第一次正面交锋。"
  RUS_kamenev_psr_local_self_government: "扩大地方自治"
  RUS_kamenev_psr_local_self_government_desc: "社革党主张让县、乡和农民委员会保留广泛权力，并反对中央随意撤换地方干部。这样既能保护革命期间形成的基层机关，也能让社革党继续掌握它最可靠的组织基础。"
  RUS_kamenev_psr_peasant_congress: "召开全俄农民代表会议"
  RUS_kamenev_psr_peasant_congress_desc: "一场全国性的农民代表会议将讨论土地、粮食征购、地方自治和农村治安。社革党想借会议证明自己仍代表俄罗斯农民；最高纲领派则准备组织贫农和农村激进派，阻止社革党中央独占会场。"
  RUS_kamenev_psr_claim_internal_affairs: "争取内务与地方行政"
  RUS_kamenev_psr_claim_internal_affairs_desc: "社革党要求由本党干部主持内务机关和地方行政，理由是他们最熟悉起义中形成的委员会、民兵和农村网络。布尔什维克认为这会把国家的任命权交给一个政党，双方围绕省长、警务和地方调查员的名单展开了争夺。"
  RUS_kamenev_psr_defend_revolutionary_democracy: "捍卫革命民主"
  RUS_kamenev_psr_defend_revolutionary_democracy_desc: "社革党将反对一党独占政府写进自己的政治纲领，要求重大法案继续由代表大会和联合内阁审议。他们把自己说成革命民主的守门人，同时也借这套程序保护已经掌握的地方机关与部长席位。"

  RUS_kamenev_bol_restore_central_bureau: "恢复俄共（布）中央局"
  RUS_kamenev_bol_restore_central_bureau_desc: "斯维尔德洛夫将召集归国干部和国内残存的党组织，恢复中央局、书记处与地方联络系统。加米涅夫仍负责同其他党派交涉，但布尔什维克不再只是一批依附劳联左翼的旧同志。"
  RUS_kamenev_bol_register_returning_members: "登记归国党员"
  RUS_kamenev_bol_register_returning_members_desc: "每一名归国党员都要说明流亡经历、旧组织关系和愿意承担的工作。加米涅夫为这项安排向联合政府作出解释，季诺维也夫则接手名册和代表资格审查。看似枯燥的登记工作，很快成了分配职位和控制党团的钥匙。"
  RUS_kamenev_bol_rebuild_factory_cells: "重建工厂党团"
  RUS_kamenev_bol_rebuild_factory_cells_desc: "彼得格勒、莫斯科、乌拉尔和顿巴斯的工厂党小组将恢复联系，并在工会和苏维埃中统一行动。全俄劳联仍是工人政治的公开框架，但越来越多基层提案会先在布尔什维克党团内部商定。"
  RUS_kamenev_bol_restore_military_organisations: "恢复军中党组织"
  RUS_kamenev_bol_restore_military_organisations_desc: "内战老兵、军校教员和政治工作人员仍保留着旧日联系。斯维尔德洛夫希望把这些关系纳入中央登记，季诺维也夫想借政治机关扩大自己的影响，斯大林则开始留意谁在越过军事委员会直接向各部队发出指示。"
  RUS_kamenev_bol_unify_planning_apparatus: "在计划机关建立党团"
  RUS_kamenev_bol_unify_planning_apparatus_desc: "工业统计、物资分配和计划委员会中已经聚集了大批布尔什维克技术干部。中央局将把这些分散的小组联结起来，使经济提案在送交政府之前先经过党内讨论，也让俄共（布）逐步掌握国家机器最重要的账本。"
  RUS_kamenev_bol_win_vst_majority: "争取劳联多数"
  RUS_kamenev_bol_win_vst_majority_desc: "季诺维也夫将工厂党团、归国干部和各地代表名册汇成一套严密的票数计算。他不急着宣布俄共（布）取代劳联，而是先让忠于自己的人控制议程、资格审查和干部提名。加米涅夫仍是台前的领袖，权力却正在他的身后转手。"

  RUS_stalin_kamenev_agendas.1.t: "土地法案送到部长会议"
  RUS_stalin_kamenev_agendas.1.d: "社革党把土地社会化法案摆上部长会议：地主土地立即没收，土地不得买卖，具体经营交给地方土地委员会安排。社革党代表把这说成起义最重要的承诺，也暗示任何拖延都是对农民的背叛。\n\n布尔什维克反对把权力直接交给没有阶级区分的村社多数。乌斯季诺夫也没有替社革党中央背书，他要求贫农委员会、集体农庄和农业工人都获得独立席位。加米涅夫把法案送入联合委员会，土地改革由此变成了各党争夺农村领导权的第一战。"
  RUS_stalin_kamenev_agendas.1.a: "逐条审议，不能让任何一党包办。"
  RUS_stalin_kamenev_agendas.2.t: "谁代表俄罗斯农民"
  RUS_stalin_kamenev_agendas.2.d: "全俄农民代表会议开幕前，社革党已经掌握了大多数地方代表团的联络渠道。他们准备以土地法案和起义功绩巩固农村多数，并要求联合政府承认社革党对农民事务的优先发言权。\n\n最高纲领派带来了另一批代表：贫农委员会、农村地下组织和集体农庄积极分子。乌斯季诺夫公开支持土地革命，却拒绝接受社革党中央替所有农民说话。劳联和布尔什维克的组织员也进入会场，会议尚未表决，农村左翼已经先分成了两块。"
  RUS_stalin_kamenev_agendas.2.a: "让代表们自己表明立场。"
  RUS_stalin_kamenev_agendas.3.t: "革命民主的护栏"
  RUS_stalin_kamenev_agendas.3.d: "社革党中央公布了一份《革命民主保障纲要》，要求联合内阁、代表大会和地方自治机关彼此制约，任何政党都不得单独控制内务、土地和选举事务。文件写得堂皇，也确实回应了许多人对一党专断的担忧。\n\n但布尔什维克很快指出，社革党所谓的保障恰好会冻结现有的人事安排，让他们继续把持大批地方机关。加米涅夫同意保留公开审议和干部申诉，却拒绝承认任何党的既得职位。双方的争论已经不再是革命要不要民主，而是谁有权规定民主怎样运转。"
  RUS_stalin_kamenev_agendas.3.a: "程序必须约束所有人。"
  RUS_stalin_kamenev_agendas.4.t: "归国党员名册"
  RUS_stalin_kamenev_agendas.4.d: "斯维尔德洛夫主持恢复了俄共（布）的党员登记。流亡地、旧党龄、地下关系和专长都被记录下来，许多多年没有组织联系的布尔什维克终于重新找到了上级。加米涅夫向联合政府保证，这只是恢复正常的党务工作。\n\n季诺维也夫主动承担代表资格和干部去向的审核。他开始知道谁会被派往工会，谁能进入计划机关，谁又握有某个省份的代表票。加米涅夫仍替党出面解释一切，真正决定人往哪里去的名册却逐渐落到了季诺维也夫手里。"
  RUS_stalin_kamenev_agendas.4.a: "先把失散的组织重新接起来。"
  RUS_stalin_kamenev_agendas.5.t: "军队里的旧关系"
  RUS_stalin_kamenev_agendas.5.d: "俄共（布）中央局开始登记军中的老党员、内战干部和政治工作人员。斯维尔德洛夫要求所有联系归中央掌握，避免各派在部队中私设系统；季诺维也夫却不断把亲近自己的干部推荐进政治机关。\n\n斯大林没有反对恢复党组织，但他注意到一些命令绕过军事委员会，以党团名义直接送到部队。几份名单随后被交到斯维尔德洛夫桌上。两人第一次明确意识到，季诺维也夫经营的已经不只是劳联里的一个派别。"
  RUS_stalin_kamenev_agendas.5.a: "军中的组织关系必须留档。"
  RUS_stalin_kamenev_agendas.6.t: "季诺维也夫的多数"
  RUS_stalin_kamenev_agendas.6.d: "在新一轮劳联代表会议召开前，季诺维也夫已经算清了每一张票。工厂党团按统一名单投票，归国干部被派往关键委员会，资格审查又挡住了一批反对者。会议选出的主席团仍然尊重加米涅夫的名义领导，实际多数却听从季诺维也夫的安排。\n\n他随后开始散布加米涅夫向社革党让步过多、已经无力领导共产派的说法。斯维尔德洛夫掌握着党组织的档案，斯大林重新取得了军中的影响，两人都看出了同一个危险：季诺维也夫正准备把劳联多数变成接管俄共（布）的跳板。"
  RUS_stalin_kamenev_agendas.6.a: "这场争夺已经不能再装作不存在。"
