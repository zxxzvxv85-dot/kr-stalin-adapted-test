  RUS_stalin_kamenev_agendas.1.t: "土地法案送到部长会议"
  RUS_stalin_kamenev_agendas.1.d: "社革党把土地社会化法案摆上部长会议：地主土地立即没收，土地不得买卖，具体经营交给地方土地委员会安排。社革党代表把这说成起义最重要的承诺，也暗示任何拖延都是对农民的背叛。\n\n布尔什维克反对把权力直接交给没有阶级区分的村社多数。乌斯季诺夫也没有替社革党中央背书，他要求贫农委员会、集体农庄和农业工人都获得独立席位。加米涅夫把法案送入联合委员会，土地改革由此变成了各党争夺农村领导权的第一战。"
  RUS_stalin_kamenev_agendas.1.a: "逐条审议，不能让任何一党包办。"
  RUS_stalin_kamenev_agendas.2.t: "谁代表俄罗斯农民"
  RUS_stalin_kamenev_agendas.2.d: "全俄农民代表会议开幕前，社革党已经掌握了大多数地方代表团的联络渠道。他们准备以土地法案和起义功绩巩固农村多数，并要求联合政府承认社革党对农民事务的优先发言权。\n\n最高纲领派带来了另一批代表：贫农委员会、农村地下组织和集体农庄积极分子。乌斯季诺夫公开支持土地革命，却拒绝接受社革党中央替所有农民说话。劳联和布尔什维克的组织员也进入会场，会议尚未表决，农村左翼已经先分成了两块。"
  RUS_stalin_kamenev_agendas.2.a: "让代表们自己表明立场。"
  RUS_stalin_kamenev_agendas.3.t: "只能保留一张党证？"
  RUS_stalin_kamenev_agendas.3.d: "社革党中央要求联合政府清查双重党籍：已经加入全俄劳联的干部不得再秘密服从俄共（布）的组织纪律。社革党声称，公开联盟若被另一个隐蔽党团操纵，就不可能进行诚实的协商。\n\n加米涅夫答应公布部长和高级干部的党籍，却拒绝把劳联变成排斥共产党员的组织。季诺维也夫则命人把真正重要的联络改用内部编号保存。新规定划出了一条清楚的界线，也教会布尔什维克怎样在界线背后继续活动。"
  RUS_stalin_kamenev_agendas.3.a: "名册可以查，组织不会因此消失。"
  RUS_stalin_kamenev_agendas.4.t: "归国党员名册"
  RUS_stalin_kamenev_agendas.4.d: "斯维尔德洛夫主持恢复了俄共（布）的党员登记。流亡地、旧党龄、地下关系和专长都被记录下来，许多多年没有组织联系的布尔什维克终于重新找到了上级。加米涅夫向联合政府保证，这只是恢复正常的党务工作。\n\n季诺维也夫主动承担代表资格和干部去向的审核。他开始知道谁会被派往工会，谁能进入计划机关，谁又握有某个省份的代表票。加米涅夫仍替党出面解释一切，真正决定人往哪里去的名册却逐渐落到了季诺维也夫手里。"
  RUS_stalin_kamenev_agendas.4.a: "先把失散的组织重新接起来。"
  RUS_stalin_kamenev_agendas.6.t: "乌斯季诺夫的联络名单"
  RUS_stalin_kamenev_agendas.6.d: "乌斯季诺夫把一份农村联络名单交给了中央局。名单上既有最高纲领派旧党员，也有贫农委员会、集体农庄和社革党地方组织中的激进分子。他们不愿接受社革党中央的约束，却仍认同土地革命和工农政权。\n\n季诺维也夫立刻看出了这些人的价值：他们可以削弱社革党对农村代表的垄断，也能给劳联共产派带来城市之外的票。加米涅夫把这解释为左翼合作，斯维尔德洛夫则要求所有联络归中央备案。谁来掌握这张名单，已经成了新的权力问题。"
  RUS_stalin_kamenev_agendas.6.a: "先把每一条联系登记清楚。"
  RUS_stalin_kamenev_agendas.7.t: "农业社会主义纲领"
  RUS_stalin_kamenev_agendas.7.d: "社革党中央把土地社会化、合作社、乡村苏维埃自治和农民代表配额合并成一份农业社会主义纲领。斯皮里多诺娃把它称作起义对农村的完整承诺，并要求联合政府承认社革党在农民事务上的首要地位。\n\n乌斯季诺夫支持没收地主土地，却拒绝把村社说成没有阶级差别的共同体。布尔什维克代表同样指出，贫农、农业工人和富裕农户不可能永远拥有相同利益。纲领获得通过，社革党的农村机器也因此更加完整；围绕谁代表农民的争斗却远未结束。"
  RUS_stalin_kamenev_agendas.7.a: "土地革命不能停在漂亮的纲领上。"
  RUS_stalin_kamenev_agendas.8.t: "红旗重新升起"
  RUS_stalin_kamenev_agendas.8.d: "《真理报》已经在俄罗斯重新发行，工厂党小组和铁路联络网也恢复运转。斯维尔德洛夫在中央局会议上拿出保存多年的党员名册、组织决议和中央委员凭证，宣布俄共（布）从未解散，如今只是重新回到公开政治中。\n\n季诺维也夫把升旗仪式办成了劳联共产派的胜利展示，仿佛全国党组织都已承认他的领导。斯大林没有当场反驳，只把军中政治联络的记录交给斯维尔德洛夫。红旗已经升起，谁能以党的名义发号施令，却要等到那场豪赌中见分晓。"
  RUS_stalin_kamenev_agendas.8.a: "旗帜属于党，不属于任何个人。"
