  RUS_lev_kamenev_leader_desc: "§YРодился:§! §L18 июля 1883 г., Москва, Московская губерния, Российская империя§!\n§YБиография:§! §LИмя: Лев Борисович Каменев\nЛев Борисович Каменев, урождённый Розенфельд, отличался мягким характером, но оставался своеобразной и спорной фигурой. Для одних он был лишь посредственным буржуазным управленцем среднего звена, случайно наткнувшимся на революцию; для других — по-настоящему достойным революционером, доказательством того, что коммунистом можно стать, не превращаясь сначала в террориста. Родившись в рабочей семье в Москве, он выбрал изучение права и тем самым вошёл в контакт с социал-демократическими революционерами, такими как Ленин и Троцкий.\n\nКаменев всегда был писателем и организатором, склонным возражать против планов, которые казались ему слишком опасными, называя их безответственной ставкой на будущее России. По этой причине он выступал за прагматическое сотрудничество с социалистами-революционерами и против Октябрьской революции. Эта позиция неоднократно подчёркивалась на его процессе 1922 года как доказательство чистоты его мотивов.\n\nВо время Гражданской войны Каменев занимал высокие руководящие посты в национальном правительстве и в Москве. Однако в 1921 году он внезапно объявил, что покидает партию из-за внутренних споров, и возобновил политическую деятельность как противник Октябрьской революции.\n\nК процессу 1922 года он и другие большевики были обвинены в измене. Суд над Каменевым расколол общественное мнение по всей стране. Его защита утверждала, что он ещё в 1921 году порвал связи с большевиками и укрыл многих людей, перемещённых так называемым Красным террором в годы Гражданской войны. В итоге он избежал смертного приговора и вместо этого получил десять лет каторжных работ. В тюрьме Каменев написал множество далеко идущих работ, которые помогли задать тон послевоенному красному нарративу, одновременно отстаивая примирение с бывшими меньшевиками. Его взгляды совпадали с позициями Владимира Левицкого, организовавшего поддержку меньшевиков во время суда.\n\nПосле освобождения в 1932 году боевые дружины Союза защиты Родины и свободы приговорили его к смерти, заставив бежать из России. Он утверждает, что именно годы изгнания в Британии и Франции изменили его политическое видение.\n\nВернувшись в Россию, он решил присоединиться к Левицкому и помог ему создать единую русскую социалистическую партию. Хотя его революционные идеи заметно отличались от идей Левицкого, он оставался готов служить практическим организатором внутри ВСТ.\n\nВажная информация: в годы изгнания Каменев продолжал переписываться со Свердловым, хотя содержание этих писем остаётся неизвестным. По этой причине часто ходят слухи, что он никогда по-настоящему не отказывался от партийного членства и фактически служил белой перчаткой большевиков в России.§!"
