l_english:
  RUS_kamenev_three_accounts: "Negotiate with the Maximalists"
  RUS_kamenev_three_accounts_desc: "The Socialist-Revolutionaries possess the strongest ready-made organisation in the countryside, but the Maximalists no longer wish to obey the SR Central Committee. Ustinov and many local organisers retain an almost Bolshevik tradition of discipline and want to bind the land revolution to poor-peasant politics. Kamenev will recognise their place in the rural struggle in exchange for organisational independence and a road into the village soviets."
  RUS_kamenev_no_permanent_creditor: "Curb the SRs' Dominance"
  RUS_kamenev_no_permanent_creditor_desc: "The Socialist-Revolutionaries carried most of the uprising and now demand control of land policy, internal affairs and local administration. Their service in the revolution cannot become a reason to dominate the government indefinitely. We will bring local appointments under common rules, investigate abuses of authority and win the Maximalists' support against the SR Central Committee's control of the countryside."
  RUS_kamenev_one_party_card: "Preserve Revolutionary Purity"
  RUS_kamenev_one_party_card_desc: "A coalition may temporarily contain several left-wing forces, but the Bolsheviks cannot lose their programme in endless compromise. Party discipline will be tightened, important cadres must declare their loyalties, and no agreement may obstruct working-class control of the state. We will have fewer allies, but the restored party will retain a clear direction."
  RUS_kamenev_majority_rule: "Expand the Political Coalition"
  RUS_kamenev_majority_rule_desc: "Returning veterans alone cannot govern all Russia. Non-party workers in the VST, local SR activists, Maximalists and village soviet delegates can all be won through practical proposals. Kamenev sees the foundations of a broader revolutionary coalition; Zinovyev sees new delegate seats and cadre networks to cultivate."
  RUS_kamenev_concessions_to_bolsheviks_unlock_tt: "Unlocks repeatable decision: §YConcessions to the Bolsheviks§!"
  RUS_kamenev_concessions_to_esers_unlock_tt: "Unlocks repeatable decision: §YConcessions to the Socialist-Revolutionaries§!"
  RUS_kamenev_concessions_to_bolsheviks: "Concessions to the Bolsheviks"
  RUS_kamenev_concessions_to_bolsheviks_desc: "The Bolsheviks retain disciplined organisations in the factories, railways and army. By relaxing restrictions on their public activity and accepting several organisational demands, the government can keep their supporters within legal political life."
  RUS_kamenev_concessions_to_esers: "Concessions to the Socialist-Revolutionaries"
  RUS_kamenev_concessions_to_esers_desc: "The Socialist-Revolutionaries still command a broad network of rural committees, cooperatives and local soviets. Accepting part of their programme and giving their allies more room in government will strengthen the parties that sustain the coalition."
  RUS_kamenev_revolutionary_legality: "Negotiate with Kamkov's Faction"
  RUS_kamenev_revolutionary_legality_desc: "Kamkov's followers joined the SR uprising but do not want the Central Committee to turn victory into a lasting monopoly over land, internal affairs and local government. They support soviet power while preserving their own organisation and rural influence. Kamenev will seek limited cooperation that divides the SR mainstream without driving these leftists into opposition."

  RUS_science_of_marxism: "[ROOT.RUSGetKamenevScienceOfMarxismName]"
  RUS_kamenev_science_of_marxism_name: "Marxist Education"
  RUS_kamenev_science_of_marxism_name_default: "The Science of Marxism"

  RUS_mensheviks: "[ROOT.RUSGetKamenevMensheviksName]"
  RUS_mensheviks_desc: "[ROOT.RUSGetKamenevMensheviksDesc]"
  RUS_kamenev_mensheviks_name: "Three-Party Government"
  RUS_kamenev_mensheviks_desc: "The VST, the Party of Socialist-Revolutionaries and the RCP(b) will form a provisional government together. The SRs control many local institutions, the VST runs the unions and soviets, and the Bolsheviks are influential among the army and returning exiles. Kamenev will chair the negotiations. Because both the VST and the SRs are willing to deal with him, he is becoming the Bolsheviks' front man in the coalition: Kamenev makes the compromises in public while the party rebuilds behind him."
  RUS_kamenev_mensheviks_name_default: "The Danists"
  RUS_kamenev_mensheviks_desc_default: "Named for their leader, veteran Menshevik Fyodor Dan, the right wing of the VST broadly stands for the broadening of revolutionary politics and a cautious economic transition to socialism. Radicalised by the brutality of the 20s and the Savinkov dictatorship, many former Mensheviks, as well as a few more compromise-minded former Bolsheviks, have found themselves among their numbers."

  RUS_eser_deal: "[ROOT.RUSGetKamenevEserDealName]"
  RUS_eser_deal_desc: "[ROOT.RUSGetKamenevEserDealDesc]"
  RUS_kamenev_eser_deal_name: "Recognise the SR Contribution"
  RUS_kamenev_eser_deal_desc: "Without the Socialist-Revolutionary uprising, the socialists could not have taken control of Russia so quickly. The government will recognise their role in the revolution and work with them on land, local self-government and peasant organisation. Ustinov's Maximalists must nevertheless remain independent, so that the SR Central Committee cannot dictate rural policy on its own."
  RUS_kamenev_eser_deal_desc_default: "The Party of Socialist-Revolutionaries has an inherently questionable understanding of socialism - most of their rank disparage Marxism with their exaltation of the peasantry and their beliefs in agrarian socialism, but regardless we are stuck with them. We will reach out to ideologically compatible Esers in the hope of forming a more durable arrangement."

  RUS_invite_sverdlov: "[ROOT.RUSGetKamenevInviteSverdlovName]"
  RUS_invite_sverdlov_desc: "[ROOT.RUSGetKamenevInviteSverdlovDesc]"
  RUS_kamenev_invite_sverdlov_name: "Return to Leninism"
  RUS_kamenev_invite_sverdlov_desc: "The RCP(b) can no longer influence the government only through the VST left, old comrades in the army and private contacts. Sverdlov will enter the council of ministers on behalf of the restored party organisation and coordinate returning cadres, local cells and Bolsheviks in the army. Kamenev will still negotiate with the other parties, but the RCP(b) once again has an organisation of its own."
  RUS_kamenev_invite_sverdlov_name_default: "Return to Leninism"
  RUS_kamenev_invite_sverdlov_desc_default: "Although the remaining independent Bolsheviks declined to join the VST, they are still valued members of the Workers' Coalition. Their civilian leader and ideologue, Yakov Sverdlov, is a skilled administrator and popular among the emigre community and the army, not to mention a veteran revolutionary. In the spirit of unity, we will reach out to our old comrade and formally invite him to the council of ministers."

  RUS_invite_zeller: "[ROOT.RUSGetKamenevInviteZellerName]"
  RUS_invite_zeller_desc: "[ROOT.RUSGetKamenevInviteZellerDesc]"
  RUS_kamenev_invite_zeller_name: "Preserve the VST's Broad Coalition"
  RUS_kamenev_invite_zeller_desc: "Zeller and the Socialist-Democratic Union still influence better-off workers, small proprietors and the VST's moderates. Keeping them inside the Workers' Coalition will stop those groups from drifting entirely toward the SRs and preserve wider support for the government. The price is that many policies will still require lengthy negotiations."
  RUS_kamenev_invite_zeller_name_default: "Invite Zeller"
  RUS_kamenev_invite_zeller_desc_default: "The Socialist-Democratic Union is seen as a holdout of the reactionary RDP by many, but it does command the loyalties of many better-off workers and small business owners, especially in Southern Russia. Its new leader, the charismatic Gergard Zeller, is a socialist of the most lukewarm shade, but certainly understands the value of cooperation - it is time to formally invite him to the council of ministers and his party to the Workers' Coalition."

  RUS_internationalists: "[ROOT.RUSGetKamenevInternationalistsName]"
  RUS_internationalists_desc: "[ROOT.RUSGetKamenevInternationalistsDesc]"
  RUS_kamenev_internationalists_name: "The First Congress after Victory"
  RUS_kamenev_internationalists_desc: "The provisional settlement must be confirmed by a congress. Unions, soviets, peasant committees and revolutionary parties from across Russia will argue over land reform, economic planning, the form of the state and the powers of each party. While preparing the congress, Zinovyev has learned where the delegates and factions stand and begun laying the groundwork for a bid to lead the VST."
  RUS_kamenev_internationalists_name_default: "The Internationalists"
  RUS_kamenev_internationalists_desc_default: "Named for their adherence to the Third Internationale's Syndicalist Synthesis, the Internationalists are the centre of the VST. Calling for shared power between Soviets and Unions, the Internationalists champion the Workers' Coalition and are mainly focused around the personalities of Levitsky and Sulimov."

  RUS_communists: "[ROOT.RUSGetKamenevCommunistsName]"
  RUS_communists_desc: "[ROOT.RUSGetKamenevCommunistsDesc]"
  RUS_kamenev_communists_name: "Bolshevik Revival"
  RUS_kamenev_communists_desc: "The central and local organisations of the RCP(b) will resume open activity, though for now the party will remain in the VST-led coalition government. Kamenev handles negotiations with the other parties, Sverdlov rebuilds the organisation and Zinovyev cultivates the VST left and its congress faction. As the party returns, the question of who will lead it has returned as well."
  RUS_kamenev_communists_name_default: "The Communists"
  RUS_kamenev_communists_desc_default: "Preferring the label of Communist above all else, the VST's left-wing seeks to quickly transition to a planned socialist economy, pushing for unceasing commitment to the social revolution without any quarter to reactionaries. Generally, they are led by Lev Kamenev, although Grigory Zinovyev's influence could lead them in a more personalist direction."

  RUS_war_on_landowners: "[ROOT.RUSGetKamenevWarOnLandownersName]"
  RUS_war_on_landowners_desc: "[ROOT.RUSGetKamenevWarOnLandownersDesc]"
  RUS_kamenev_war_on_landowners_name: "Accelerate the End of the Agricultural Transition"
  RUS_kamenev_war_on_landowners_desc: "The Maximalists preserved a large underground network in the countryside. Their methods are closer to those of the Bolsheviks than to the SR mainstream. Ustinov will organise poor peasants' committees and collective-farm activists against landlords, kulaks and grain speculators. This will advance the land reform while weakening the SR Central Committee's control over the rural revolutionary movement."
  RUS_kamenev_war_on_landowners_name_default: "Accelerate the End of the Agricultural Transition"
  RUS_kamenev_war_on_landowners_desc_default: "The peasantry is a transitional class destined to disappear. We must hasten its transformation into agricultural workers and deprive petty-bourgeois ideas of their remaining class foundation."

  RUS_stalin_kamenev_tree.1.t: "The List Ustinov Brought"
  RUS_stalin_kamenev_tree.1.d: "Ustinov brought no formal programme, but a ledger of rural contacts: old Maximalists, poor-peasant committee organisers, collective-farm activists and local militants who had broken with the SR Central Committee. They supported the land revolution and workers' and peasants' power, he told Kamenev, but would no longer allow the SRs to speak for the whole countryside.\n\nKamenev promised organisational independence and seats in the land and agricultural bodies. In return, Ustinov would connect these groups to a national network. Sverdlov demanded that every contact be registered by the centre; Zinovyev was already counting how many rural votes the list might bring to the communist caucus."
  RUS_stalin_kamenev_tree.1.a: "Reconnect the comrades in the countryside."
  RUS_stalin_kamenev_tree.2.t: "The SR Demands"
  RUS_stalin_kamenev_tree.2.d: "The SR Central Committee argued that, since it had organised the main force of the uprising, the land ministry, internal affairs and local administration should all be placed in its hands. The Bolshevik delegates rejected the demand, producing the coalition's first open dispute.\n\nUstinov did not side with the SR leadership. The Maximalists, he said, supported land socialisation and class struggle in the countryside, but would not accept an SR monopoly over peasant organisations. Kamenev proposed that local appointments require approval from the coalition government and that every office be subject to common inspection. The VST left and the Maximalists both backed him."
  RUS_stalin_kamenev_tree.2.a: "Local institutions answer to the coalition."
  RUS_stalin_kamenev_tree.3.t: "The Boundary of Revolutionary Purity"
  RUS_stalin_kamenev_tree.3.d: "The Central Bureau ruled that coalition cooperation could not override the Bolshevik programme. Party members in key institutions must declare their organisational ties, and important proposals must first be discussed by the caucus. Kamenev presented this as a measure against confusion; the SRs saw a second chain of command taking shape inside the government.\n\nZinovyev volunteered to supervise credentials and cadre reviews. In the name of purity, ever more appointments passed through his hands. Sverdlov supported renewed discipline but began to wonder whether, in Zinovyev's vocabulary, purity was slowly becoming obedience to Zinovyev."
  RUS_stalin_kamenev_tree.3.a: "Cooperation cannot replace the party programme."
  RUS_stalin_kamenev_tree.4.t: "Invite Our Friends into the Hall"
  RUS_stalin_kamenev_tree.4.d: "Kamenev invited non-party VST workers, local soviet delegates, Maximalists and cooperative SR activists to policy conferences. Instead of beginning with party quotas, they discussed grain, factory management and reconstruction. Many who would never join the Bolsheviks were willing to submit proposals alongside them.\n\nZinovyev arranged the delegations and speaking order, quickly learning the demands and weaknesses of every new ally. Kamenev saw a broader revolutionary coalition. Zinovyev saw a voting ledger that could be cultivated seat by seat."
  RUS_stalin_kamenev_tree.4.a: "Work together on concrete questions."
  RUS_stalin_kamenev_tree.5.t: "Kamkov's Conditions"
  RUS_stalin_kamenev_tree.5.d: "Kamkov agreed to weaken the SR Central Committee's control of local institutions and to support a leading role for unions and soviets. He set two conditions: not every SR was to be branded a counter-revolutionary, and central appointments must not simply replace the local soviets born in the uprising.\n\nKamenev accepted limited cooperation and left Kamkov's faction legal room to operate. The agreement drew cadres away from the SR mainstream without making them Bolshevik dependants. Zinovyev disliked the ambiguity, but knew these delegates might yet be won."
  RUS_stalin_kamenev_tree.5.a: "First break the monopoly we both oppose."

  RUS_kamenev_psr_automatic_focus_tt: "This is an agenda pursued automatically by the §YSocialist-Revolutionary Party§! and cannot be selected by the player. Its completion will alter party relations and the revolutionary government's balance of power."
  RUS_kamenev_bol_automatic_focus_tt: "This is an organisational focus of the §YRussian Communist Party (Bolsheviks)§! and must be selected by the player. Its completion will alter party relations and the revolutionary government's balance of power."
  RUS_kamenev_psr_agenda_originator: "Socialist-Revolutionary Central Committee"
  RUS_kamenev_bol_agenda_originator: "RCP(B) Central Bureau"

  RUS_kamenev_psr_rebuild_central_committee: "The SRs Mend Their Splits"
  RUS_kamenev_psr_rebuild_central_committee_desc: "After the uprising, SRs scattered among underground groups, local committees and partisan detachments gather around the centre once more. Spiridonova seeks to rebuild a nationwide party apparatus and turn temporary revolutionary ties back into formal organisation. The appearance of unity also gives the Central Committee a chance to recover the provincial cadre rolls."
  RUS_kamenev_psr_preserve_land_committees: "Reunite with the Right"
  RUS_kamenev_psr_preserve_land_committees_desc: "SR rightists who stood aside during the uprising are prepared to return. They accept that the republic has turned socialist, but demand local autonomy, cooperatives and a more cautious agricultural programme. The Central Committee will trade concessions for party unity and reduce the Maximalists' weight."
  RUS_kamenev_psr_land_socialisation_bill: "Draft Law on Land Socialisation"
  RUS_kamenev_psr_land_socialisation_bill_desc: "The SRs propose that land belong to the common use of working people and be allocated by local committees rather than owned directly by the central state. Bolsheviks and Maximalists support expropriation, but insist that poor-peasant bodies, state farms and collectives must not be ruled by prosperous village majorities."
  RUS_kamenev_psr_local_self_government: "Charter of Rural Soviet Autonomy"
  RUS_kamenev_psr_local_self_government_desc: "The SRs propose a charter limiting the centre's power to dismiss rural delegates or interfere with commune budgets. It would protect institutions born in the revolution while writing the party's organisational advantage in the countryside into the new state."
  RUS_kamenev_psr_claim_internal_affairs: "Form the Rural Militia"
  RUS_kamenev_psr_claim_internal_affairs_desc: "Uprising committees combine partisan bands, village guards and captured weapons into rural militias. The SRs want them commanded by local soviets and politically supervised by veterans of the revolt. Bolsheviks fear that the armed forces will be broken into local preserves, and the dispute soon centres on commanders and arsenal keys."
  RUS_kamenev_psr_cooperatives_fair_grain_prices: "Expand the Cooperatives"
  RUS_kamenev_psr_cooperatives_fair_grain_prices_desc: "The SRs expand production, credit and grain cooperatives across the districts, replacing improvised collection and private middlemen with organised exchange. The system can improve supply and deepen the party's daily presence in the countryside. The Maximalists demand separate poor-peasant representation so prosperous farmers cannot capture the new bodies."
  RUS_kamenev_psr_peasant_congress: "Increase Peasant Representation"
  RUS_kamenev_psr_peasant_congress_desc: "The SRs demand reserved places for peasant delegates in the commissariats, planning bodies and VST congress. The argument is not whether peasants should speak, but whether their representatives are chosen by local soviets, cooperatives, poor-peasant committees or SR organisations."
  RUS_kamenev_psr_defend_revolutionary_democracy: "Ban Dual Party Membership"
  RUS_kamenev_psr_defend_revolutionary_democracy_desc: "The SR Central Committee targets officials who carry both VST and RCP(B) cards and demands that they choose one organisation. Publicly this clarifies party responsibility; in practice it is meant to sever the Bolsheviks' use of the VST's open organisation to expand a disciplined caucus."
  RUS_kamenev_psr_final_party_congress: "Placate the Maximalists"
  RUS_kamenev_psr_final_party_congress_desc: "The Maximalists oppose renewed SR control of the countryside and threaten to carry more local organisers towards the Bolsheviks. Spiridonova promises independent representation for poor peasants, agricultural workers and collective farms, and no longer demands the immediate dissolution of the Maximalist organisation. The compromise prevents an open split without resolving the struggle over the rural revolution."
  RUS_kamenev_psr_agrarian_socialism: "Agrarian Socialism"
  RUS_kamenev_psr_agrarian_socialism_desc: "Land socialisation, cooperatives, rural soviet autonomy and peasant representation are assembled into a complete programme. The SRs proclaim a socialist road through freely associated labouring communes and present themselves as the countryside's natural voice. Maximalists and Bolsheviks accept the land revolution but reject the claim that class conflict has vanished from the village."

  RUS_kamenev_bol_register_returning_members: "Registry of Returning Cadres"
  RUS_kamenev_bol_register_returning_members_desc: "Sverdlov reorganises the rolls of returning party members, exiles and underground couriers. Kamenev tells the coalition that this is ordinary party work, while Zinovyev uses credential reviews and assignments to learn who may enter every level of the VST apparatus."
  RUS_kamenev_bol_restore_central_bureau: "Two Party Cards"
  RUS_kamenev_bol_restore_central_bureau_desc: "A member may openly join the VST while secretly retaining RCP(B) discipline. Kamenev stands in public and explains why the two loyalties do not conflict; Zinovyev keeps the list that will never be published. The Bolsheviks gain both a legal covering and an organisation of their own."
  RUS_kamenev_bol_restore_pravda: "Pravda Returns to Russia"
  RUS_kamenev_bol_restore_pravda_desc: "Zinovyev revives Pravda under an independent editorial board, restoring a Bolshevik voice beyond the VST. It attacks SR localism in public and begins portraying Kamenev as a useful conciliator who lacks the resolve to lead the communist tendency indefinitely."
  RUS_kamenev_bol_rebuild_factory_cells: "Party Cells on the Shop Floor"
  RUS_kamenev_bol_rebuild_factory_cells_desc: "Factory groups in Petrograd, Moscow, the Urals and the Donbas reconnect and act to a common line in unions and soviets. The VST remains the public framework of workers' politics, but more rank-and-file proposals are settled inside the Bolshevik caucus first."
  RUS_kamenev_bol_railway_telegraph_bureau: "Railway and Telegraph Liaison Bureau"
  RUS_kamenev_bol_railway_telegraph_bureau_desc: "Railway workers, telegraphists and underground couriers form a network spanning Russia, carrying Central Bureau instructions past local governments. It restores links broken by the civil war and gives Zinovyev his first national channel that does not depend upon Kamenev."
  RUS_kamenev_bol_unify_planning_apparatus: "Open Party Schools"
  RUS_kamenev_bol_unify_planning_apparatus_desc: "The Central Bureau opens party schools for industrial statisticians, engineers, union organisers and local secretaries, teaching Marxism, organisation and state administration before assigning graduates to commissariats and soviets. The schools supply the new state with cadres and give Zinovyev another channel through which to shape appointments."
  RUS_kamenev_bol_win_vst_majority: "Establish the Maximalist Liaison Office"
  RUS_kamenev_bol_win_vst_majority_desc: "Ustinov connects poor-peasant organisations, rural radicals and the Maximalist underground with the Bolsheviks. Publicly this is cooperation against the SR monopoly in the countryside; for Zinovyev, it is also the shortest route from the urban caucuses to rural delegate votes."
  RUS_kamenev_bol_undissolved_central_committee: "Raise the Red Flag"
  RUS_kamenev_bol_undissolved_central_committee_desc: "From Pravda and factory cells to the railway network and rural Maximalists, the RCP(B) once again possesses a nationwide organisation. The credentials preserved by Sverdlov prove that its Central Committee never dissolved. The red flag will fly openly over party headquarters again, but with Zinovyev holding the VST communist majority, who controls the flagpole remains unsettled."

  RUS_kamenev_national_economic_line: "The General Line for the National Economy"
  RUS_kamenev_national_economic_line_desc: "The First Five-Year Plan has brought scattered production schedules under one plan, but factories, railways and resource projects still pull in different directions. The Supreme Council of the National Economy will now set a single order of priorities: strengthen the great cities, make the Urals a new link between east and west, and prepare the labour and machinery needed for Siberia's long development."
  RUS_kamenev_industrialise_urals: "Plan the Development of Nature"
  RUS_kamenev_industrialise_urals_desc: "The minerals, forests and rivers of the Urals can no longer be handled piecemeal by local offices. Resource surveys, power construction and new industrial towns will be placed on one plan, preserving long-term productive capacity while creating a new industrial hinge between east and west."
  RUS_kamenev_industrialise_eastern_europe: "Extend the Cities' Reach"
  RUS_kamenev_industrialise_eastern_europe_desc: "The cities of western and central Russia already possess the country's strongest factories, institutes and transport links. Expanding manufacturing, agricultural machinery and railway hubs will let them carry skills, equipment and organisation into the surrounding regions."
  RUS_kamenev_industrialise_siberia: "The Great Development of Siberia"
  RUS_kamenev_industrialise_siberia_desc: "Siberia contains immense reserves of metals, minerals and fuel that remain barely developed. Capital, technical cadres and new railways can turn the neglected east into a vital resource base for socialist industrialisation."
  RUS_auto_kamenev_vst_left_path: "Kamenev's leadership of the VST Left has been established"
