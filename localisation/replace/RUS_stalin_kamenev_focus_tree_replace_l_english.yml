  RUS_stalin_kamenev_agendas.1.t: "The Land Bill Reaches the Cabinet"
  RUS_stalin_kamenev_agendas.1.d: "The SRs have placed their land socialisation bill before the cabinet: estates are to be confiscated immediately, land may not be bought or sold, and local land committees will decide its use. They call it the uprising's central promise and suggest that any delay would betray the peasantry.\n\nThe Bolsheviks reject giving undifferentiated village majorities such power. Ustinov also refuses to endorse the SR leadership, demanding independent representation for poor-peasant committees, collective farms and agricultural labourers. Kamenev sends the bill to a joint commission, turning land reform into the first contest for leadership of the countryside."
  RUS_stalin_kamenev_agendas.1.a: "Examine every clause; no party will settle this alone."
  RUS_stalin_kamenev_agendas.2.t: "Who Speaks for the Russian Peasant?"
  RUS_stalin_kamenev_agendas.2.d: "Before the All-Russian Peasant Congress opens, the SRs already control most channels to the provincial delegations. They intend to turn the land bill and their role in the uprising into a rural majority, and to have the coalition recognise their first claim to peasant affairs.\n\nThe Maximalists have brought a different set of delegates: poor-peasant committees, rural underground groups and collective-farm activists. Ustinov supports the agrarian revolution but refuses to let the SR Central Committee speak for every peasant. VST and Bolshevik organisers enter the hall as well; before the first vote, the rural left has already divided into two camps."
  RUS_stalin_kamenev_agendas.2.a: "Let the delegates state their own positions."
  RUS_stalin_kamenev_agendas.3.t: "Only One Party Card?"
  RUS_stalin_kamenev_agendas.3.d: "The SR Central Committee demands an audit of dual membership: officials who have joined the VST may no longer secretly obey RCP(B) discipline. The SRs argue that an open alliance cannot negotiate honestly if it is steered by another, concealed caucus.\n\nKamenev agrees to publish the affiliations of ministers and senior officials, but refuses to turn the VST into an organisation closed to communists. Zinovyev quietly orders the most important contacts preserved under internal numbers. The rule draws a clear line, and teaches the Bolsheviks how to keep working behind it."
  RUS_stalin_kamenev_agendas.3.a: "The rolls may be inspected; the organisation will not disappear."
  RUS_stalin_kamenev_agendas.4.t: "The Rolls of the Returning Members"
  RUS_stalin_kamenev_agendas.4.d: "Sverdlov has restored the RCP(B)'s membership register. Places of exile, seniority, underground contacts and professional skills are now recorded, reconnecting many Bolsheviks who had gone years without an organisation. Kamenev assures the coalition that this is merely ordinary party work.\n\nZinovyev volunteers to review credentials and assign cadres. He soon knows who will enter the unions, who can serve in the planning apparatus and who controls a province's delegate votes. Kamenev still explains the party's actions in public, but the rolls that decide where people go are passing into Zinovyev's hands."
  RUS_stalin_kamenev_agendas.4.a: "Reconnect the scattered organisation."
  RUS_stalin_kamenev_agendas.6.t: "Ustinov's List of Contacts"
  RUS_stalin_kamenev_agendas.6.d: "Ustinov has delivered a rural contact list to the Central Bureau. It contains old Maximalists, poor-peasant committees, collective-farm activists and radicals inside local SR organisations. They reject the discipline of the SR centre while remaining committed to land revolution and workers' and peasants' power.\n\nZinovyev immediately sees their value: they can break the SR monopoly over rural delegates and bring the communist tendency votes beyond the cities. Kamenev presents the arrangement as left-wing cooperation, while Sverdlov insists that every link be registered by the centre. Control of the list has become another question of power."
  RUS_stalin_kamenev_agendas.6.a: "First put every connection on record."
  RUS_stalin_kamenev_agendas.7.t: "The Agrarian Socialist Programme"
  RUS_stalin_kamenev_agendas.7.d: "The SR Central Committee combines land socialisation, cooperatives, rural soviet autonomy and peasant quotas into a single agrarian socialist programme. Spiridonova calls it the uprising's complete promise to the countryside and demands recognition of the SRs' leading voice in peasant affairs.\n\nUstinov supports expropriation but refuses to describe the village commune as a classless community. The Bolsheviks likewise insist that poor peasants, agricultural labourers and prosperous farmers cannot share identical interests forever. The programme passes and the SR rural machine grows stronger, but the struggle over who represents the peasantry is far from over."
  RUS_stalin_kamenev_agendas.7.a: "The land revolution cannot end in a fine programme."
  RUS_stalin_kamenev_agendas.8.t: "The Red Flag Rises Again"
  RUS_stalin_kamenev_agendas.8.d: "Pravda is again printed in Russia, while factory cells and the railway network are functioning once more. Sverdlov presents the preserved membership rolls, resolutions and Central Committee credentials and declares that the RCP(B) never dissolved; it has merely returned to open political life.\n\nZinovyev turns the flag-raising into a triumph for the VST communists, as though the whole party had accepted his leadership. Stalin offers no public objection, but passes records of military political contacts to Sverdlov. The flag is raised. Who may command in its name will be decided when the gamble begins."
  RUS_stalin_kamenev_agendas.8.a: "The flag belongs to the party, not to one man."
