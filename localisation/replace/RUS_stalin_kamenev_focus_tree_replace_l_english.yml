l_english:
  RUS_kamenev_three_accounts: "The Settlement after Victory"
  RUS_kamenev_three_accounts_desc: "The socialist government was established through the Socialist-Revolutionary uprising and the VST's seizure of the unions and soviets. At the same time, Bolshevik cadres are returning from years of exile. All three forces demand a place in government and a say in policy. Kamenev must first define their responsibilities before the temporary alliance falls into infighting immediately after victory."
  RUS_kamenev_no_permanent_creditor: "Curb the SRs' Dominance"
  RUS_kamenev_no_permanent_creditor_desc: "The Socialist-Revolutionaries carried most of the uprising and now demand control of land policy, internal affairs and local administration. Their service in the revolution cannot become a reason to dominate the government indefinitely. We will bring local appointments under common rules, investigate abuses of authority and win the Maximalists' support against the SR Central Committee's control of the countryside."
  RUS_kamenev_one_party_card: "A Common Party Register"
  RUS_kamenev_one_party_card_desc: "Every Bolshevik working in a VST institution will register their party membership and follow a common organisational discipline. Kamenev will continue to negotiate in public, while Sverdlov restores contact between local party organisations. Zinovyev, meanwhile, is beginning to interfere in cadre appointments in order to expand his influence inside the VST."
  RUS_kamenev_majority_rule: "Let the Congress Decide"
  RUS_kamenev_majority_rule_desc: "The Workers' Coalition cannot depend forever on party leaders settling every question outside the chamber. Major proposals will now be put to a vote at the congress. Each faction may campaign for support, but once a decision is made it may no longer threaten to leave the government and force new negotiations."
  RUS_kamenev_revolutionary_legality: "Establish Revolutionary Legality"
  RUS_kamenev_revolutionary_legality_desc: "The revolution left behind a mass of temporary orders, local authorities acting on their own and parties shielding their own officials. The government will introduce common procedures, establish a state inspectorate and a system of appeal for cadres, and punish abuses of authority and refusals to carry out central decisions."

  RUS_mensheviks: "[ROOT.RUSGetKamenevMensheviksName]"
  RUS_mensheviks_desc: "[ROOT.RUSGetKamenevMensheviksDesc]"
  RUS_kamenev_mensheviks_name: "Three-Party Government"
  RUS_kamenev_mensheviks_desc: "The VST, the Party of Socialist-Revolutionaries and the RCP(b) will form a provisional government together. The SRs control many local institutions, the VST runs the unions and soviets, and the Bolsheviks are influential among the army and returning exiles. Kamenev will chair the negotiations. Because both the VST and the SRs are willing to deal with him, he is becoming the Bolsheviks' front man in the coalition: Kamenev makes the compromises in public while the party rebuilds behind him."
  RUS_kamenev_mensheviks_name_default: "The Danists"
  RUS_kamenev_mensheviks_desc_default: "Named for their leader, veteran Menshevik Fyodor Dan, the right wing of the VST broadly stands for the broadening of revolutionary politics and a cautious economic transition to socialism. Radicalised by the brutality of the 20s and the Savinkov dictatorship, many former Mensheviks, as well as a few more compromise-minded former Bolsheviks, have found themselves among their numbers."

  RUS_eser_deal: "[ROOT.RUSGetKamenevEserDealName]"
  RUS_eser_deal_desc: "[ROOT.RUSGetKamenevEserDealDesc]"
  RUS_kamenev_eser_deal_name: "Recognise the SR Uprising"
  RUS_kamenev_eser_deal_desc: "Without the Socialist-Revolutionary uprising, the socialists could not have taken control of Russia so quickly. The government will recognise their role in the revolution and work with them on land, local self-government and peasant organisation. Ustinov's Maximalists must nevertheless remain independent, so that the SR Central Committee cannot dictate rural policy on its own."
  RUS_kamenev_eser_deal_desc_default: "The Party of Socialist-Revolutionaries has an inherently questionable understanding of socialism - most of their rank disparage Marxism with their exaltation of the peasantry and their beliefs in agrarian socialism, but regardless we are stuck with them. We will reach out to ideologically compatible Esers in the hope of forming a more durable arrangement."

  RUS_invite_sverdlov: "[ROOT.RUSGetKamenevInviteSverdlovName]"
  RUS_invite_sverdlov_desc: "[ROOT.RUSGetKamenevInviteSverdlovDesc]"
  RUS_kamenev_invite_sverdlov_name: "Bring the RCP(b) into the Open"
  RUS_kamenev_invite_sverdlov_desc: "The RCP(b) can no longer influence the government only through the VST left, old comrades in the army and private contacts. Sverdlov will enter the council of ministers on behalf of the restored party organisation and coordinate returning cadres, local cells and Bolsheviks in the army. Kamenev will still negotiate with the other parties, but the RCP(b) once again has an organisation of its own."
  RUS_kamenev_invite_sverdlov_name_default: "Return to Leninism"
  RUS_kamenev_invite_sverdlov_desc_default: "Although the remaining independent Bolsheviks declined to join the VST, they are still valued members of the Workers' Coalition. Their civilian leader and ideologue, Yakov Sverdlov, is a skilled administrator and popular among the emigre community and the army, not to mention a veteran revolutionary. In the spirit of unity, we will reach out to our old comrade and formally invite him to the council of ministers."

  RUS_invite_zeller: "[ROOT.RUSGetKamenevInviteZellerName]"
  RUS_invite_zeller_desc: "[ROOT.RUSGetKamenevInviteZellerDesc]"
  RUS_kamenev_invite_zeller_name: "Preserve the VST's Broad Coalition"
  RUS_kamenev_invite_zeller_desc: "Zeller and the Socialist-Democratic Union still influence better-off workers, small proprietors and the VST's moderates. Keeping them inside the Workers' Coalition will stop those groups from drifting entirely toward the SRs and preserve wider support for the government. The price is that many policies will still require lengthy negotiations."
  RUS_kamenev_invite_zeller_name_default: "Invite Zeller"
  RUS_kamenev_invite_zeller_desc_default: "The Socialist-Democratic Union is seen as a holdout of the reactionary RDP by many, but it does command the loyalties of many better-off workers and small business owners, especially in Southern Russia. Its new leader, the charismatic Gergard Zeller, is a socialist of the most lukewarm shade, but certainly understands the value of cooperation - it is time to formally invite him to the council of ministers and his party to the Workers' Coalition."

  RUS_internationalists: "[ROOT.RUSGetKamenevInternationalistsName]"
  RUS_internationalists_desc: "[ROOT.RUSGetKamenevInternationalistsDesc]"
  RUS_kamenev_internationalists_name: "The First Congress after Victory"
  RUS_kamenev_internationalists_desc: "The provisional settlement must be confirmed by a congress. Unions, soviets, peasant committees and revolutionary parties from across Russia will argue over land reform, economic planning, the form of the state and the powers of each party. While preparing the congress, Zinovyev has learned where the delegates and factions stand and begun laying the groundwork for a bid to lead the VST."
  RUS_kamenev_internationalists_name_default: "The Internationalists"
  RUS_kamenev_internationalists_desc_default: "Named for their adherence to the Third Internationale's Syndicalist Synthesis, the Internationalists are the centre of the VST. Calling for shared power between Soviets and Unions, the Internationalists champion the Workers' Coalition and are mainly focused around the personalities of Levitsky and Sulimov."

  RUS_communists: "[ROOT.RUSGetKamenevCommunistsName]"
  RUS_communists_desc: "[ROOT.RUSGetKamenevCommunistsDesc]"
  RUS_kamenev_communists_name: "Bolshevik Revival"
  RUS_kamenev_communists_desc: "The central and local organisations of the RCP(b) will resume open activity, though for now the party will remain in the VST-led coalition government. Kamenev handles negotiations with the other parties, Sverdlov rebuilds the organisation and Zinovyev cultivates the VST left and its congress faction. As the party returns, the question of who will lead it has returned as well."
  RUS_kamenev_communists_name_default: "The Communists"
  RUS_kamenev_communists_desc_default: "Preferring the label of Communist above all else, the VST's left-wing seeks to quickly transition to a planned socialist economy, pushing for unceasing commitment to the social revolution without any quarter to reactionaries. Generally, they are led by Lev Kamenev, although Grigory Zinovyev's influence could lead them in a more personalist direction."

  RUS_war_on_landowners: "[ROOT.RUSGetKamenevWarOnLandownersName]"
  RUS_war_on_landowners_desc: "[ROOT.RUSGetKamenevWarOnLandownersDesc]"
  RUS_kamenev_war_on_landowners_name: "Bolsheviks in the Countryside"
  RUS_kamenev_war_on_landowners_desc: "The Maximalists preserved a large underground network in the countryside. Their methods are closer to those of the Bolsheviks than to the SR mainstream. Ustinov will organise poor peasants' committees and collective-farm activists against landlords, kulaks and grain speculators. This will advance the land reform while weakening the SR Central Committee's control over the rural revolutionary movement."
  RUS_kamenev_war_on_landowners_name_default: "Accelerate the End of the Agricultural Transition"
  RUS_kamenev_war_on_landowners_desc_default: "The peasantry is a transitional class destined to disappear. We must hasten its transformation into agricultural workers and deprive petty-bourgeois ideas of their remaining class foundation."

  RUS_stalin_kamenev_tree.1.t: "The First Coalition Meeting"
  RUS_stalin_kamenev_tree.1.d: "The first meeting of the coalition government did not begin with new decrees, but with the question of who would control the ministries and local institutions. The SRs brought lists of local committees and partisan commanders who had joined the uprising. The VST demanded continued authority over the unions, soviets and industrial administration, while Sverdlov asked that returning Bolsheviks be appointed to central offices.\n\nKamenev acknowledged the part played by all three forces, but refused to divide the state along party lines. A joint commission would instead settle appointments and responsibilities one by one. Zinovyev volunteered to organise the delegates' records. Few thought much of the clerical task, but the lists were already teaching him how influence inside the VST was distributed."
  RUS_stalin_kamenev_tree.1.a: "First, put the government in order."
  RUS_stalin_kamenev_tree.2.t: "The SR Demands"
  RUS_stalin_kamenev_tree.2.d: "The SR Central Committee argued that, since it had organised the main force of the uprising, the land ministry, internal affairs and local administration should all be placed in its hands. The Bolshevik delegates rejected the demand, producing the coalition's first open dispute.\n\nUstinov did not side with the SR leadership. The Maximalists, he said, supported land socialisation and class struggle in the countryside, but would not accept an SR monopoly over peasant organisations. Kamenev proposed that local appointments require approval from the coalition government and that every office be subject to common inspection. The VST left and the Maximalists both backed him."
  RUS_stalin_kamenev_tree.2.a: "Local institutions answer to the coalition."
  RUS_stalin_kamenev_tree.3.t: "The Common Register"
  RUS_stalin_kamenev_tree.3.d: "A new organisational circular ordered every Bolshevik working in a VST institution to register their party membership and observe the coalition government's meeting discipline. Kamenev signed it in public, preserving his role as the Bolsheviks' recognised representative in negotiations with the other parties.\n\nZinovyev took charge of cadre liaison and the certification of delegates, placing a growing number of appointments in his hands. Sverdlov supported the restoration of party contacts, but began to fear that Zinovyev was turning the VST faction into a personal base of power."
  RUS_stalin_kamenev_tree.3.a: "Set the organisational lines in order."
  RUS_stalin_kamenev_tree.4.t: "New Rules of Procedure"
  RUS_stalin_kamenev_tree.4.d: "The congress adopted new rules of procedure. Parties may still negotiate and submit amendments before a vote, but once a proposal wins a majority every member of the Workers' Coalition must carry it out. Threatening to leave the government will no longer force the congress to reconsider.\n\nThe new rules have made decisions faster and every delegate's seat more valuable. Zinovyev, who organised the congress, already knows the strength of each province, union and faction and has begun courting delegates whose loyalties remain uncertain."
  RUS_stalin_kamenev_tree.4.a: "Carry out the vote."
  RUS_stalin_kamenev_tree.5.t: "Appointments to the Inspectorate"
  RUS_stalin_kamenev_tree.5.d: "No sooner had the State Inspectorate been formed than the parties began arguing over its secretariat and provincial investigators. The SRs wanted to protect the local authorities they controlled, VST officials demanded a purge of the old bureaucracy, and the Bolsheviks wanted priority given to speculation, sabotage and refusals to carry out central orders.\n\nKamenev insisted that all three parties supervise the inspectorate. Zinovyev secured part of the appointment process, while Sverdlov required copies of every investigation file to be kept at the centre. Stalin did not intervene openly, but his old comrades in the army had begun forwarding him material involving military institutions."
  RUS_stalin_kamenev_tree.5.a: "First, settle the procedure."

  RUS_kamenev_psr_automatic_focus_tt: "This is an agenda pursued automatically by the §YSocialist-Revolutionary Party§! and cannot be selected by the player. Its completion will alter party relations and the revolutionary government's balance of power."
  RUS_kamenev_bol_automatic_focus_tt: "This is an agenda pursued automatically by the §YRussian Communist Party (Bolsheviks)§! and cannot be selected by the player. Its completion will alter party relations and the revolutionary government's balance of power."
  RUS_kamenev_psr_agenda_originator: "Socialist-Revolutionary Central Committee"
  RUS_kamenev_bol_agenda_originator: "RCP(B) Central Bureau"

  RUS_kamenev_psr_rebuild_central_committee: "Rebuild the SR Central Committee"
  RUS_kamenev_psr_rebuild_central_committee_desc: "The local committees, partisan commanders and old party offices that took part in the uprising must again answer to a centre. The SRs will use the prestige of victory to restore their network, tie the provisional authorities to the party and demand a place in government commensurate with their contribution."
  RUS_kamenev_psr_land_socialisation_bill: "Table the Land Socialisation Bill"
  RUS_kamenev_psr_land_socialisation_bill_desc: "The SRs propose that land be held for the common use of working people and administered by local land committees. The Bolsheviks fear those bodies will fall under prosperous peasant influence, while Ustinov supports expropriation only if poor-peasant organisations and collective farms receive their own power."
  RUS_kamenev_psr_local_self_government: "Expand Local Self-Government"
  RUS_kamenev_psr_local_self_government_desc: "The SRs want districts, communes and peasant committees to retain broad authority and oppose arbitrary removals by the centre. This would preserve institutions born during the revolution and protect the party's most dependable organisational base."
  RUS_kamenev_psr_peasant_congress: "Convene the All-Russian Peasant Congress"
  RUS_kamenev_psr_peasant_congress_desc: "A national peasant congress will debate land, grain procurement, local government and rural security. The SRs mean to prove that they still speak for the countryside; the Maximalists will organise poor peasants and rural radicals to deny the SR Central Committee a monopoly over the hall."
  RUS_kamenev_psr_claim_internal_affairs: "Claim Internal Affairs and Local Administration"
  RUS_kamenev_psr_claim_internal_affairs_desc: "The SRs demand control of internal affairs and local administration on the grounds that they know the committees, militias and rural networks created during the uprising. The Bolsheviks see an attempt to hand state appointments to one party, and the fight moves to lists of governors, police officials and investigators."
  RUS_kamenev_psr_defend_revolutionary_democracy: "Defend Revolutionary Democracy"
  RUS_kamenev_psr_defend_revolutionary_democracy_desc: "The SR programme will prohibit any one party from monopolising government and require major bills to pass through both congress and coalition cabinet. They cast themselves as guardians of revolutionary democracy, while using those same procedures to defend the offices and local authorities they already hold."

  RUS_kamenev_bol_restore_central_bureau: "Restore the RCP(B) Central Bureau"
  RUS_kamenev_bol_restore_central_bureau_desc: "Sverdlov will gather returning cadres and the party organisations that survived inside Russia, restoring the Central Bureau, Secretariat and provincial links. Kamenev will still negotiate with the other parties, but the Bolsheviks will no longer be merely old comrades sheltered within the VST left."
  RUS_kamenev_bol_register_returning_members: "Register the Returning Party Members"
  RUS_kamenev_bol_register_returning_members_desc: "Every returning member must record their exile, former organisational ties and preferred work. Kamenev explains the arrangement to the coalition, while Zinovyev takes charge of the rolls and delegate credentials. Routine registration soon becomes the key to appointments and control of the caucus."
  RUS_kamenev_bol_rebuild_factory_cells: "Rebuild the Factory Cells"
  RUS_kamenev_bol_rebuild_factory_cells_desc: "Party groups in Petrograd, Moscow, the Urals and the Donbas will restore contact and act together in unions and soviets. The VST remains the public framework of workers' politics, but a growing number of rank-and-file proposals will first be settled inside the Bolshevik caucus."
  RUS_kamenev_bol_restore_military_organisations: "Restore the Military Party Organisations"
  RUS_kamenev_bol_restore_military_organisations_desc: "Civil-war veterans, academy instructors and political workers still retain their old connections. Sverdlov wants those links registered by the centre, Zinovyev wants his nominees in the political apparatus, and Stalin has begun watching who sends instructions to units without passing through the Military Council."
  RUS_kamenev_bol_unify_planning_apparatus: "Build Party Groups in the Planning Apparatus"
  RUS_kamenev_bol_unify_planning_apparatus_desc: "Bolshevik technical cadres are already numerous in industrial statistics, material allocation and planning commissions. The Central Bureau will connect their scattered groups, allowing economic proposals to be discussed inside the party before reaching cabinet and placing the state's most important ledgers within Bolshevik reach."
  RUS_kamenev_bol_win_vst_majority: "Win a VST Majority"
  RUS_kamenev_bol_win_vst_majority_desc: "Zinovyev will combine factory caucuses, returning cadres and provincial delegate lists into a precise count of votes. He will not yet proclaim the Bolsheviks' replacement of the VST; instead, loyalists will first take control of agendas, credentials and cadre nominations. Kamenev remains the public leader while power changes hands behind him."

  RUS_stalin_kamenev_agendas.1.t: "The Land Bill Reaches the Cabinet"
  RUS_stalin_kamenev_agendas.1.d: "The SRs have placed their land socialisation bill before the cabinet: estates are to be confiscated immediately, land may not be bought or sold, and local land committees will decide its use. They call it the uprising's central promise and suggest that any delay would betray the peasantry.\n\nThe Bolsheviks reject giving undifferentiated village majorities such power. Ustinov also refuses to endorse the SR leadership, demanding independent representation for poor-peasant committees, collective farms and agricultural labourers. Kamenev sends the bill to a joint commission, turning land reform into the first contest for leadership of the countryside."
  RUS_stalin_kamenev_agendas.1.a: "Examine every clause; no party will settle this alone."
  RUS_stalin_kamenev_agendas.2.t: "Who Speaks for the Russian Peasant?"
  RUS_stalin_kamenev_agendas.2.d: "Before the All-Russian Peasant Congress opens, the SRs already control most channels to the provincial delegations. They intend to turn the land bill and their role in the uprising into a rural majority, and to have the coalition recognise their first claim to peasant affairs.\n\nThe Maximalists have brought a different set of delegates: poor-peasant committees, rural underground groups and collective-farm activists. Ustinov supports the agrarian revolution but refuses to let the SR Central Committee speak for every peasant. VST and Bolshevik organisers enter the hall as well; before the first vote, the rural left has already divided into two camps."
  RUS_stalin_kamenev_agendas.2.a: "Let the delegates state their own positions."
  RUS_stalin_kamenev_agendas.3.t: "Guardrails for Revolutionary Democracy"
  RUS_stalin_kamenev_agendas.3.d: "The SR Central Committee has published a Programme of Guarantees for Revolutionary Democracy. It makes the coalition cabinet, congress and local authorities checks upon one another and bars any party from controlling internal affairs, land and elections alone. The language is lofty, and it answers a genuine fear of one-party rule.\n\nThe Bolsheviks quickly point out that these guarantees would freeze the present appointments and leave the SRs in command of a great many local bodies. Kamenev accepts open scrutiny and a right of appeal for officials, but rejects every party's claim to permanent offices. The argument is no longer whether the revolution should be democratic, but who gets to define how its democracy works."
  RUS_stalin_kamenev_agendas.3.a: "The rules must bind everyone."
  RUS_stalin_kamenev_agendas.4.t: "The Rolls of the Returning Members"
  RUS_stalin_kamenev_agendas.4.d: "Sverdlov has restored the RCP(B)'s membership register. Places of exile, seniority, underground contacts and professional skills are now recorded, reconnecting many Bolsheviks who had gone years without an organisation. Kamenev assures the coalition that this is merely ordinary party work.\n\nZinovyev volunteers to review credentials and assign cadres. He soon knows who will enter the unions, who can serve in the planning apparatus and who controls a province's delegate votes. Kamenev still explains the party's actions in public, but the rolls that decide where people go are passing into Zinovyev's hands."
  RUS_stalin_kamenev_agendas.4.a: "Reconnect the scattered organisation."
  RUS_stalin_kamenev_agendas.5.t: "Old Ties in the Army"
  RUS_stalin_kamenev_agendas.5.d: "The RCP(B) Central Bureau has begun registering old members, civil-war cadres and political workers in the armed forces. Sverdlov insists that every connection be recorded at the centre so no faction can build a private military network; Zinovyev continues recommending his own people to the political apparatus.\n\nStalin does not oppose restoring the party organisation, but he notices instructions reaching units in the name of party caucuses without passing through the Military Council. Several lists are soon laid on Sverdlov's desk. For the first time, both men state plainly that Zinovyev is building more than a faction inside the VST."
  RUS_stalin_kamenev_agendas.5.a: "Every military connection must be on record."
  RUS_stalin_kamenev_agendas.6.t: "Zinovyev's Majority"
  RUS_stalin_kamenev_agendas.6.d: "Before the latest VST conference, Zinovyev had counted every vote. Factory caucuses followed a common slate, returning cadres entered key committees, and credential reviews kept several opponents outside. The elected presidium still honours Kamenev's nominal leadership, but its working majority now follows Zinovyev.\n\nHe begins spreading the claim that Kamenev has conceded too much to the SRs and can no longer lead the Communist faction. Sverdlov controls the party archives and Stalin has recovered influence in the army; both see the same danger. Zinovyev is preparing to use his VST majority as a springboard for taking the RCP(B) itself."
  RUS_stalin_kamenev_agendas.6.a: "This struggle can no longer be treated as if it did not exist."
