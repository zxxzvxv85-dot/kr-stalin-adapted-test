l_simp_chinese:
  KR_spiridonist_trait: "£RUS_faction_sr_populist §1社革党（民粹派）§!"
  RUS_dismantle_crystals_of_power_desc: "国家权力正日渐衰微，俄罗斯社会在渐渐无政府化。民粹派一直憧憬着一个真正去中心化的俄罗斯——工人通过苏维埃和工会而非中央政府来组织活动。全党应全力促成该理想之实现。"
  RUS_spiridonist_influencing_sr_tt: "\n§1民粹派§!正在影响§R社会革命党§!，这将给予："
  russia_socialist_events.103.a.tt: "我们将站在社会革命党§1民粹派§!一边，并以他们的视角继续游玩。"
  russia_socialist_events.111.d: "俄国无政府主义者虽然人数不多，但影响力不小。在政治上，他们与民粹派都有着在俄罗斯实行分权化的构想。但对他们来说，无政府主义与其说是要为之追寻的理想，倒不如说是份实打实的政治纲领。\n\n党内某些人可能支持与他们接触，但也许我们现在不该惹上太多麻烦。"
  russia_socialist_events.112.d: "令人遗憾的是，就连我们许多最优秀军人的政治倾向都值得怀疑。正因如此，民粹派才会更加偏爱尤里·萨布林，他也许不是最出色的军官，但却是值得我们信赖，能够捍卫社会主义民主的人。\n\n通过保证萨布林及其属下将继续担任现职，他们也许就会加入我们的民主集团。"
  russia_socialist_events.140.d: "近来，党内没有哪一天不是这样轻蔑偏执地对待最高纲领派。每一个举动都受到密切关注，每一场谈话都受到监听，每一项行动都受到跟踪。随着最高纲领派从讨厌但有用的角色转变为革命的潜在颠覆者，关于将他们开除党籍的传言正愈演愈烈。\n\n如今，令人不安的一天终于到来了，社会革命党的新一届党代会现已召开，随之而来的是，人们将注意力全都集中在最高纲领派相关的议题上。乌斯季诺夫试图通过渲染反革命分子的威胁来分散党的注意力，但除了遭到冷嘲热讽之外，他一无所获。\n\n民粹派和其他小派系首先揭露并谴责了最高纲领派与布尔什维克不可告人的联系，随后又列举了一系列指控，包括全俄政保局受他们指使而犯下的累累罪行，以及他们与党内其他成员的意识形态分歧。大家很快达成了共识，再次将最高纲领派全体开除出党，这次他们永远不得再回来。"
  russia_socialist_events.161.t: "民粹派宣言"
  russia_socialist_events.161.d: "代表大会选举结束后不久，斯皮里多诺娃主席发表了一次真情实感的演讲，勾勒出俄罗斯社会主义的未来。她断言，俄罗斯的政治革命现已达到顶峰，但社会革命仍未到来。\n\n这场社会革命将会如何发展？斯皮里多诺娃表示，苏维埃必须掌握权力并实施法律——若没有人民的自我组织，无论是现在或是将来，政府都无法拯救社会主义。工人联盟的最终目标是为这种自我组织奠定基础。然而，她解释道，这些发展必须加以谨慎控制，以确保俄罗斯社会主义永远不会倒退回布尔什维克的契卡主义。\n\n玛图什卡的话语响彻了社会革命党，但很少有人真正致力于这一目标，除了那些自称“民粹派”的人——包括鲍里斯·卡姆科夫、弗拉基米尔·卡列林、伊利亚·马约罗夫等人，他们将完全致力于实现她在《民粹派宣言》中提出的愿景。\n\n一些人已经谴责《民粹派宣言》是一种政治举动，旨在分裂社革党，而非团结党内。我们决不能动摇：即便他们处处针对，我们仍将不懈努力，朝着革命的第二阶段前进。"
  russia_socialist_events.165.d: "为了证明社会革命党民粹派并非一群不关心实际治理、与现实脱节的理想主义者，我们必须至少将自己的一些想法付诸行动。\n\n为此，伊利亚·马约罗夫制定了详细的计划，并已提交给代表大会批准。该计划设想在坦波夫地区实施“农民共产主义”，呼吁该地区大规模下放权力，并开展大规模的农业机械化和教育计划，这将有助于该地区实现现代化，同时也将赋予俄罗斯农民极大的自由。\n\n尽管该计划费时费力且代价不菲，不过一旦取得成功，就将成为社革党值得夸耀的丰功伟绩。"
  russia_socialist_events.166.d: "尽管社会革命党民粹派和最高纲领派在讨论中占据了主导地位，但人们不应忘记，尽管两派的党内影响力与日俱增，但他们的规模仍然较小。虽然两派对未来的愿景是一致的，但在如何实现这一愿景上仍存在着巨大分歧。\n\n没人能比伊萨克·施泰因贝格更能代表这场冲突了。从表面上看，他与民粹派完全一致，坚信类似于无政府主义的大规模权力下放，最终摧毁国家机器并实现直接民主。与此同时，他也和最高纲领派一样，不相信工人联盟能够实现这一目标，至少目前如此。\n\n作为最具影响力的社革党人之一，尽管施泰因贝格的想法十分激进，但他仍然拥有相当多的追随者，他的赤诚之心可能会为党内其他成员指明未来的方向。他的追随者们组成了自己的非正式派系——浪漫主义派，他们不会接受通过妥协折中来实现自己的愿景，同时也会谴责最高纲领派的威权言论。只有怀揣着坚定不移的决心，我们才能表明自己有能力将社革党打造成未来俄罗斯的政党，而不仅仅是执政联盟中的普通一员。"
  russia_socialist_events.174.d: "施泰因贝格总理的思想绝非正统，但在社会主义俄罗斯的大环境中，这些思想逐渐成为了社会革命党的主流。随着欧洲资本主义土崩瓦解，反动恐怖势力被连根拔起，我们不再需要维持一支庞大的常备军，可以将更多的资金用于人民。\n\n实际上，这意味着俄罗斯普通民众将迎来前所未有的繁荣，一切确保他们自由的措施都是合情合理的。施泰因贝格提出的直接、分权民主理念得到了广泛关注；越来越多的经济事务被交由小企业(artels)和合作社负责，而工业与贸易部的重要性则有所减弱。\n\n此外，在最近召开的社革党会议上，与会人员以微弱多数通过了该党制定的两个目标，即最终消灭党派纷争和议会制，并摧毁国家机器本身。然而，会上并没有为这些目标设定准确的时间表，通俗来说，社革党知道何时为最佳时机。\n\n不过，也有人质疑了愈发左倾的趋势。全俄劳联批评了总理的提议，认为该提议效率低下，其他人则对社革党提倡的近乎无政府主义的制度表达了不满。然而，对于民粹派，尤其是施泰因贝格来说，最近几年的情况表明，第二阶段革命的条件现已完美达成。"
  russia_socialist_events.184.d: "安德烈·科列加耶夫是一位拥有农业问题研究背景的最高纲领派成员，他今日向代表大会陈述了关于坦波夫试点的问题。他说道，坦波夫苏维埃的选举结果令人不满：其苏维埃代表从整体来看相当右倾，许多人未加入任何政党，且就算往好了说，他们对社会主义的投入也值得怀疑。科列加耶夫指出，坦波夫计划的理想主义原则没能按照预想的那样发展。他提出了一份替代方案，即当选的苏维埃代表必须加入一个已登记在案的政党。\n\n全俄劳联立马开始声援科列加耶夫。党员尼古拉·苏汉诺夫发言表达了支持，称农民很快会在投票中违背自己的利益，而且，尽管苏维埃民主是必要之举，但这种民主不该把那些不认同社会主义的人包括在内，几乎可以肯定，这些人会试图从内部颠覆整个体制。\n\n社革党民粹派猛然遭到严厉抨击，一时间萌生寡不敌众之感。然而，一位重量级政治人物介入了辩论。在大多数时候，斯皮里多诺娃不会干涉这种辩论，只作为团结革命的形象人物存在。但这次，她坚定地为坦波夫苏维埃的选举辩护。代表大会遇到的难题并不是坦波夫人民选出了右翼社会主义者，而是社革党和全俄劳联这样的党派没有获得人民的信任。苏维埃并不仅仅是代表工人农民的政治经济组织，还是反映民意、民情、民愿的平台。\n\n斯皮里多诺娃的介入成功说服其他党员支持坦波夫试点。这次难关充分展现了主席按照自己的意愿影响社革党的能力，可见她在民粹派运动中有多么受人崇拜。"
  RUS_aleksandr_elyashevich_advisor_desc: "§Y生于：§!§L1888年1月27日；俄罗斯帝国、伊尔库茨克省伊尔库茨克§!\n§Y背景：§!§L亚历山大·鲍里索维奇·叶利亚舍维奇的父亲是犹太军医，他的家族一直与流亡伊尔库茨克的民意党成员保持着联系。起初，他与孟什维克过从甚密，社会革命党引人注目的暗杀活动激励了他，最终他加入了社革党。后来，他搬到彼得格勒学习，真正开始参与俄罗斯的革命政治，并被证明是一位优秀的演说家和鼓动者。被迫流亡德国后，他开始学习经济学，之后又进入帝俄军队服役。\n\n叶利亚舍维奇主张在俄罗斯建立一个统一的社会主义政党，并寻求促进各社会主义团体之间的合作。他曾在莫斯科军事工业委员会和临时政府中工作，十月政变后开始反对布尔什维主义。内战后，他跟随切尔诺夫成为社革党“中派”的一员，参与了尼古拉·康德拉季耶夫的经济改革，大力支持国家主导的工业化，反对“国家资本主义”。他在萨文科夫掌权期间被监禁，后来成为愈发倾向于民粹派政治纲领的右翼社革党人之一。§!"
  russia_flavour_events.185.d.spiridonist: "随着伟大的革命战争取得胜利，曾经的犹太区上空飘扬起红旗，东欧犹太人终于摆脱了资本主义和资产阶级民族主义的剥削，迎来了新的曙光。现在大多数犹太民族（尽管这个词所指涉的范围一直存在争议）都已站在社会主义旗帜下，犹太社区内的政治讨论也达到了白热化。世界革命看来已不可避免，而那些已经获得解放的犹太工人已开始努力创造那个几代人位置不懈奋斗的新社会。\n\n社会革命党一直与犹太知识分子保持着密切联系，事实上，许多最著名的社革党人都是犹太人。民粹派激进分子伊萨克·施泰因贝格在欧洲获得解放的犹太人中声名鹊起，成为了新红色现代性的标志人物：每当他参加安息日召开的苏维埃和工会代表大会时，总会有一位犹太人同志帮他提着公文包——许多无产者和犹太教经学院的学生都对他向农民发表的激情演讲，以及他在赎罪日期间含泪、虔诚的忏悔和尽职尽责的斋戒心怀敬畏。\n\n犹太统一社会主义工人党自称为“联合”(Fareyniktes)，虽然目前仍是工人联盟里的一个小党派，但其规模现已迅速扩大，尤其是在乌克兰和白罗斯农民中。联合设想在未来建立一个横跨全欧洲的社会主义联邦，并希望能与庇护党合作解决民族问题：首先，按照现有的社革党理想，随着时间推移逐渐下放权力给地方议会和合作社。但是，犹太社区的个别成员有权宣布自己是跨国文化议会(Seym)的成员，该议会负责处理教育和文化事务。在这种新自治模式出现后，人们希望随着共产主义时代的临近，各民族之间的界限将逐渐消失。"
  russia_flavour_events.185.d.maximalist: "随着伟大的革命战争取得胜利，曾经的犹太区上空飘扬起红旗，东欧犹太人终于摆脱了资本主义和资产阶级民族主义的剥削，迎来了新的曙光。现在大多数犹太民族（尽管这个词所指涉的范围一直存在争议）都已站在社会主义旗帜下，犹太社区内的政治讨论也达到了白热化。世界革命看来已不可避免，而那些已经获得解放的犹太工人已开始努力创造那个几代人位置不懈奋斗的新社会。\n\n社会革命党一直与犹太知识分子保持着密切联系，事实上，许多最著名的社革党人都是犹太人。民粹派激进分子伊萨克·施泰因贝格在欧洲获得解放的犹太人中声名鹊起，成为了新红色现代性的标志人物：每当他参加安息日召开的苏维埃和工会代表大会时，总会有一位犹太人同志帮他提着公文包——许多无产者和犹太教经学院的学生都对他向农民发表的激情演讲，以及他在赎罪日期间含泪、虔诚的忏悔和尽职尽责的斋戒心怀敬畏。\n\n现已解散的犹太统一社会主义工人党，该党的前成员自称为“联合”(Fareyniktes)，该党现在是一个注册的政治杂志和团体，其规模现已迅速扩大，尤其是在乌克兰和白罗斯农民中。联合设想在未来建立一个横跨全欧洲的社会主义联邦，并希望能与庇护党合作解决民族问题：首先，按照现有的社革党理想，随着时间推移逐渐下放权力给地方议会和合作社。但是，犹太社区的个别成员有权宣布自己是跨国文化议会(Seym)的成员，该议会负责处理教育和文化事务。虽然解散政党成立社革联盟的做法导致文化议会内部气氛愈发紧张，但政府似乎会暂时让该议会继续运作。在这种新自治模式出现后，人们希望随着共产主义时代的临近，各民族之间的界限将逐渐消失。"
  RUS_guide_1: "§M社会主义革命：社会革命党/全俄罗斯劳工联盟§!（$radical_socialist_coloured$/$syndicalist_coloured$/$totalist_coloured$）\n£white_dot 在1938年之前，让萨文科夫政权的§P军方愤怒§!保持在§O5§!及以上的同时，让§C民众愤怒§!达到§R8§!及以上，从而令其崩溃。\n£white_dot 通过立宪会议的事件链选择§t社会革命党§!或§r全俄罗斯劳工联盟§!执政。\n£white_dot 一旦选择了§t社会革命党§!，§1民粹派§!将保持$radical_socialist_coloured$，而通过国策§Y结束一切战争的战争§!进入§o最高纲领派§!将成为$totalist_coloured$。\n£white_dot 要进入§1民粹派§!的子路线§Y永不妥协的理想主义§!，需要完成§Y西伯利亚发展方向§!、§Y坦波夫计划§!和§Y团结浪漫主义者§!这三个任务。\n£white_dot 如果完成了上述三个任务，§Y鲍里斯·卡姆科夫§!将在战后掌权，否则§Y尼古拉·兹多布诺夫§!将在战后掌权。\n\n£white_dot §r全俄劳联§!有多个路线，注意，不管走哪条路线，列维茨基都会是初始领导人，直到全俄劳联执政一年后的年度全俄劳联代表大会上才会改变领导人。\n£white_dot 要让§Y弗拉基米尔·列维茨基§!继续执政，需要§r国际主义者§!§C团结度§!为普遍支持列维茨基及以上，同时平衡§S唐恩派（全俄劳联右派）§!和§x共产主义者（全俄劳联左派）§!之间的关系。如果完成了国策§Y党权下放§!，§Y格里戈里·马克西莫夫§!可以通过国策§Y劳工解放§!成为战后领导人。\n£white_dot 要让§Y拉斐尔·阿布拉莫维奇§!在年度全俄劳联代表大会上掌权，需要国家精神§Y全俄劳联：派系斗争§!，§r国际主义者§!§C团结度§!低于4，费奥多尔·唐恩为二把手。\n£white_dot 要让§Y列夫·加米涅夫§!在年度全俄劳联代表大会上掌权，需要国家精神§Y全俄劳联：派系斗争§!，§r国际主义者§!§C团结度§!低于4，列夫·加米涅夫为二把手。\n£white_dot 要让§Y丹尼尔·苏利莫夫§!在年度全俄劳联代表大会上掌权，需要立宪会议批准了强大的行政权，国家精神§Y全俄劳联：派系斗争§!，§r国际主义者§!§C团结度§!低于4，且§S唐恩派§!与§x共产主义者§!的关系为5及以上。在苏利莫夫掌权后，§Y米哈伊尔·托姆斯基§!与§Y亚历山大·什利亚普尼科夫§!可以通过国策§Y革命新世代§!在战后掌权。\n£white_dot §Y格里戈里·季诺维也夫§!可以通过以下两种方式在列夫·加米涅夫上台后接管权力：\n-£BoP_right_texticon 选择国策§Y应对工会反对派§!，并在事件链中选择破坏加米涅夫的声誉。\n-£BoP_right_texticon 让§o激进度§!增至10。\n£white_dot 完成国策§Y从内部维护革命§!后，你将成为$totalist_coloured$。\n\n£white_dot §Y共和国§!路线也可以进入§r全俄劳联§!路线。\n£white_dot 按共和国路线正常进行游戏，但让极左翼接管§S激进民主党§!，并赢得选举。\n£white_dot 利用国策和决议，在白军发起政变之前完成国策§Y推翻共和国§!。\n\n§M远东军§!\n£white_dot 只有在§n萨文科夫§!或§r社会主义§!治下，俄罗斯遭受荼毒，远东军才会起义。\n£white_dot 如果游玩俄罗斯，在事件“红胡子阿塔曼”中，不要选择暗杀§Y格里戈里·谢苗诺夫§!。\n£white_dot 也可以选择奉天政府或大日本帝国，进而切换为远东军。\n\n§M自由俄罗斯军§!\n£white_dot 只有在§n萨文科夫§!或§r社会主义§!治下，俄罗斯遭受荼毒，自由俄罗斯军才会起义。\n£white_dot 也可以选择德意志帝国或任意德国的§Y东方盟友§!，进而切换为自由俄罗斯军。"
