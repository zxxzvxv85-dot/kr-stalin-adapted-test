  RULE_OPTION_RUS_FORPOL_INT_DESC: "为了社会主义的团结友爱，俄罗斯加入了第三国际。$RUS_FORPOL_REQUIREMENTS$\n\n如果§Y$RUS_PATH$§!中选择了任一§C社革党左派(民粹派)§!，那么法兰西公社在§Y$FRA_PATH$§!中必须选择§C无政府派§!\n§C注意：如果法兰西公社不再是第三国际领导国，那么新阵营领导国必须拥有$radical_socialist_coloured$政府。§!\n\n如果§Y$RUS_PATH$§!中选择了§C激进民主党：苏利莫夫§!或任一§C全俄劳联中派§!，那么法兰西公社在§Y$FRA_PATH$§!中必须§R没有§!选择任一§C索雷尔派§!或§C雅各宾派§!\n§C注意：如果法兰西公社不再是第三国际领导国，那么新阵营领导国必须§R没有§!$totalist_coloured$政府。§!\n\n§Y$RUS_PATH$§!中§R没有§!选择§C社革党左派(最高纲领派)：乌斯季诺夫§!"
  RSA_radical_socialist_party: "自俄委（社革民粹派）"
