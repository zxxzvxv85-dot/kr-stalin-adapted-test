 RUS_lev_kamenev_leader_desc: "§YBorn:§! §LJuly 18th, 1883, in Moscow, Moscow Governorate, Russian Empire§!\n§YBackground:§! §LName: Lev Borisovich Kamenev\nLev Borisovich Kamenev, born Rosenfeld, was mild in temperament, yet remained a unique and controversial figure. To some, he was merely a mediocre bourgeois middle manager who happened upon the revolution by chance; to others, he was a genuinely respectable revolutionary, proof that one need not first become a terrorist in order to become a communist. Born into a working-class family in Moscow, he chose to study law and thereby came into contact with Social Democratic revolutionaries such as Lenin and Trotsky.\n\nKamenev was always a writer and organiser, inclined to oppose plans he considered too dangerous, calling them an irresponsible gamble with Russia's future. For this reason, he advocated pragmatic cooperation with the Socialist Revolutionaries and opposed the October Revolution. This stance was repeatedly emphasised during his 1922 trial as evidence of the purity of his motives.\n\nDuring the Civil War, Kamenev held senior leadership posts in the national government and in Moscow. In 1921, however, he abruptly announced that he was leaving the party over internal disputes and resumed political activity as an opponent of the October Revolution.\n\nBy the 1922 trial, he and other Bolsheviks were accused of treason. The Kamenev Trial split public opinion across the country. His defence argued that he had already severed ties with the Bolsheviks in 1921 and had sheltered many people displaced by the so-called Red Terror during the Civil War. In the end, he avoided the death sentence and instead served ten years of penal labour. In prison, Kamenev wrote many far-reaching works that helped set the tone of the post-war Red narrative, while also arguing for reconciliation with former Mensheviks. His views coincided with those of Vladimir Levitsky, who had organised Menshevik support for him during the trial.\n\nAfter his release in 1932, the Combat Squads of the Union for the Defence of the Motherland and Freedom sentenced him to death, forcing him to flee Russia. He claims that it was his years of exile in Britain and France that reshaped his political vision.\n\nUpon returning to Russia, he chose to join Levitsky and helped him create a unified Russian socialist party. Although his revolutionary ideas differed considerably from Levitsky's, he remained willing to serve as a practical organiser within the VST.\n\nImportant Information: During his exile, Kamenev continued to correspond with Sverdlov, though the contents of these letters remain unknown. For this reason, rumours often circulate that he never truly abandoned his party membership and was instead serving as the Bolsheviks' white glove in Russia.§!"
