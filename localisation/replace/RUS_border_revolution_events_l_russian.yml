 RUS_future_foreign_policy_events.13.t:0 "Большевики Прибалтики"
 RUS_future_foreign_policy_events.13.d:0 "Помимо большевиков в самой России, немало товарищей-коммунистов продолжает борьбу под властью империалистов. В Прибалтике Коммунистическая партия Латвии (большевиков) остаётся верна своему делу.\n\nС момента образования Балтийского герцогства, этого уродливого порождения империализма, рабочих и крестьян побережья приковали к колеснице германских юнкеров и местных помещиков. Земли захватывают, заводы передают под военное управление, а любое сопротивление объявляют пособничеством коммунистам. Но чем сильнее угнетение, тем яростнее отпор. Уйдя в подполье, латвийские большевики ни на день не прекратили работу. Последние действующие большевики внутри Восточного вала, они неизменно возглавляют сопротивление.\n\nТеперь их представители тайными путями прибыли в Москву. Они привезли не только приветствия балтийских рабочих, но и просьбу: больше оружия, радиостанций и кадров. Когда придёт время, восстание начнётся в Риге и охватит всю Прибалтику."
 RUS_future_foreign_policy_events.13.a:0 "Свобода неизбежна!"
 russia_socialist_events.183.t:0 "Харьковский инцидент"
 russia_socialist_events.183.d:0 "На прошлой неделе забастовка металлургов Харьковского тракторного завода переросла в беспорядки. Без предупреждения администрация урезала ежедневный паёк на треть и удлинила рабочий день на два часа ради оборонного производства. Представители рабочих потребовали переговоров, но получили отказ. На следующий день был создан стачечный комитет: почти восемь тысяч из двенадцати тысяч рабочих отложили инструменты. Полицию направили подавить протест, который вскоре перерос в ожесточённые столкновения.\n\nРеволюционеры действовали быстро. Боротьбисты и Коммунистическая партия Украины вооружили металлургов и подготовились к неизбежному нападению.\n\nОсознав серьёзность положения, реакционные украинские власти решили ввести войска. Однако организаторы обороны, оценив соотношение сил, отказались от прямого столкновения и заблаговременно увели основной актив в подполье.\n\nНа ночном совещании перед отходом революционеры разбили активистов на небольшие группы, укрывшиеся на заводах, железной дороге и в окрестных сёлах. Была оставлена целая система паролей и явок. Заводы, рабочие кварталы, железнодорожные узлы — ещё вчера действовавшие открыто революционеры почти за одну ночь исчезли с улиц. Для украинских властей это было дурным знаком.\n\nНа следующий день правительство объявило розыск бежавшего Шумского и его сообщников, назначило награду за их поимку и ввело чрезвычайное положение в Харькове. Однако обыски по всему городу позволили задержать лишь нескольких второстепенных участников, не успевших скрыться.\n\nПри содействии Политического охранного управления лидер боротьбистов Александр Шумский пересёк границу и сегодня утром прибыл в Царицын. Он уже передал разведывательному бюро просьбу о финансировании и выделении кадров."
 russia_socialist_events.183.a:0 "Ради товарищей и братьев мы готовы на всё!"
 RUS_future_foreign_policy_events.14.t:0 "Столкновения в Гомеле"
 RUS_future_foreign_policy_events.14.d:0 "Не все белорусы готовы подчиняться марионеточному правительству в Минске. То ли из возмущения реакционным распределением земли, то ли благодаря агитации революционных организаций, многие жители востока Беларуси вступили в разрастающееся партизанское движение.\n\nЛеса и болота вокруг Гомеля стали естественным укрытием для небольших отрядов. Большинство партизан — мелкие крестьяне, лесорубы и железнодорожники. У них нет достойного оружия, зато они знают каждую топь и каждую лесную тропу. Правительственные карательные колонны не раз пытались окружить их, но те всякий раз ускользали, пользуясь местностью.\n\nМинск тревожит утрата контроля над происходящим. Власти перебрасывают подкрепления и развешивают объявления, обещая добровольно сдавшимся прощение и землю. Откликнулись немногие. Затем правительственные войска сожгли несколько деревень, обвинённых в пособничестве коммунистам, лишь пополнив ряды партизан отчаявшимися крестьянами.\n\nРеволюционные организации уже несколько раз выходили с нами на серьёзные переговоры. Они просят лекарства и радиостанции, а также опытных революционных инструкторов: в конце концов, нельзя вечно оставаться в лесах."
 RUS_future_foreign_policy_events.14.a:0 "Соедините с товарищем Ворошиловым: ему снова нашлась работа."
