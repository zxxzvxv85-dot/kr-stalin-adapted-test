 russia_socialist_events.353.d.coalition:0 "Союз с большевиками окончательно расколол Всероссийский союз труда. Правые, открыто питавшие отвращение к «коммунистам», давно утратили реальное влияние внутри Союза. Группа во главе с Даном в конце концов сложила свои полномочия и объявила о намерении воссоздать Российскую социал-демократическую рабочую партию, пытаясь проложить третий путь между большевиками и социалистами-революционерами.\n\nОднако этот «третий путь» явно оказался недолгим. Значительная часть сторонников Дана в своей политической практике всё больше сближается с социалистами-революционерами: в парламенте они голосуют почти так же, как эсеры, а местные организации уже начали выдвигать общих кандидатов и совместно использовать низовые партийные связи.\n\nК счастью, подавляющее большинство партийных работников тяготеет к центристским и левым позициям, и этот очередной уход не нанёс серьёзного ущерба силе нашей организации."
 russia_socialist_events.353.d.rebellion:0 "$russia_socialist_events.353.d.coalition$"
 russia_socialist_events.353.a:0 "По крайней мере, мы ещё можем опереться на наших союзников-большевиков."
