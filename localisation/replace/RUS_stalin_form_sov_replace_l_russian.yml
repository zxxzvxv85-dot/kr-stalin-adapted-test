l_russian:
  russia_socialist_events.330.d: "После председателя-министра и министра внутренних дел народный министр промышленности и торговли занимает третье по значению место в правительстве. Этот пост приносит немалый престиж и реальную власть, а его обладатель способен во многом определять направление экономической политики.\n\nБудь решение только за нами, идеальным кандидатом стал бы убеждённый сторонник плановой экономики Станислав Струмилин, однако правящая коалиция его не примет. Наши правые союзники вместо него выдвигают Александра Финна-Енотаевского, сторонника смешанной экономики.\n\nЕщё два кандидата не принадлежат к ВСТ. Эсеры предлагают Бориса Камкова, скорее как жест доброй воли со стороны Рабочей коалиции, чем как автора самостоятельного хозяйственного курса. Большевики же выдвинули Николая Бухарина. Этот радикальный партийный экономист намерен полностью перекроить хозяйственную ткань страны, административным принуждением подчинив общественное разделение труда воле пролетарского государства."
  RUS_sergey_kirov_sic_desc: "§YРодился:§! §L27 марта 1886 года; Уржум, Вятская губерния, Российская империя§!\n§YБиография:§! §LСергей Миронович Киров, урождённый Сергей Костриков, родился в Вятской губернии. Рано потеряв отца, он с юности познал тяжёлую бедность русской деревни. В 1904 году Киров вступил в Российскую социал-демократическую рабочую партию в Томске и вскоре проявил себя как организатор стачек и стойкий участник революционной борьбы. Будучи профессиональным революционером, он вёл подпольную работу во Владикавказе, одновременно увлекаясь альпинизмом, поэзией и театром.\n\nПосле Октябрьской революции Киров решительно примкнул к большевикам. В годы Гражданской войны его неутомимая энергия и яркое личное обаяние сделали его одной из стремительно восходивших звёзд политической сцены. Он возглавлял Астраханский революционный комитет и сыграл важную роль в поддержании военного порядка и распределении ресурсов региона.\n\nВ 1921 году Киров вместе с товарищами из «Интеграционного движения» участвовал в подпольном сопротивлении на территории Белой России, но в конце концов был вынужден отступить. В эмиграции во Франции он твёрдо защищал генеральную линию партии, поддержал начатую Центральным комитетом чистку и принял в ней деятельное участие. Это ещё более укрепило его положение и авторитет в партии.\n\nПосле восстановления социалистической России выдающиеся организаторские способности Кирова быстро сделали его любимцем ленинградских масс. Сегодня его по праву можно назвать одним из самых популярных товарищей среди большевиков.§!"
  RUS_irina_kakhovskaya_advisor_desc: "§YРодилась:§! §L27 августа 1887 года; Тараща, Киевская губерния, Российская империя§!\n§YБиография:§! §LИрина Константиновна Каховская родилась в русской семье в Киеве. Получив педагогическое образование, она стала учительницей и первоначально мечтала преподавать в сельской школе. Однако революционная буря 1905 года увлекла её к иному делу: в том же году при содействии своих знакомых Александры Коллонтай и Максима Горького она вступила в Российскую социал-демократическую рабочую партию.\n\nЕё большевистская карьера оказалась весьма недолгой. Признавая основную ленинскую идею пролетарского авангарда, Каховская не могла принять чрезмерно теоретические построения о ходе революции и почти полное пренебрежение крестьянским вопросом. По её убеждению, без глубокого преобразования русской деревни любая революция остановится у городских баррикад. Эта позиция всё сильнее отдаляла её от партийного большинства. В конце концов она покинула большевиков и примкнула к Союзу социалистов-революционеров-максималистов — течению, занимавшему более радикальные позиции по крестьянскому вопросу, но сохранявшему революционно-марксистскую основу.\n\nВ 1908 году её сослали в Нерчинск. Там её революционная деятельность на время прервалась, однако холод и одиночество тюрьмы не сломили её волю. Мария Спиридонова, находившаяся с ней в одной тюрьме, стала для неё важной собеседницей в политических вопросах. Их разговоры в камерах впоследствии служили Каховской важным ориентиром при формировании её политических позиций.\n\nС началом революции Каховская быстро вернулась к борьбе. Вместе с Борисом Донским она подготовила покушения на гетмана Скоропадского и германского генерал-фельдмаршала Германа фон Эйхгорна, сумев в итоге убить последнего. Эта операция принесла ей широкую известность и привела сначала в руки германских оккупационных властей, а затем ВЧК. После передачи чекистам её, вопреки ожиданиям многих, не казнили и не заключили на долгие годы. Изучив её прошлое, ВЧК сочла, что речь идёт о «расхождении в линии, а не о враждебности», и некоторое время спустя освободила её. Этот опыт сменил холодность Каховской к большевикам осторожным наблюдением. Она стала понимать, что, несмотря на расхождения в вопросе городского рабочего класса, у них остаётся место для сосуществования в борьбе с внешним врагом и защите коренных интересов революции.\n\nПосле войны она вошла в число основателей Боевого союза социалистов-революционеров-максималистов и неизменно придерживалась курса на вооружённую борьбу. В организационной системе максималистов она прежде всего отвечала за подготовку военных операций и обучение бойцов, а также участвовала в поддержании связей с другими революционными течениями, включая неофициальные контакты с большевиками, хотя в этих отношениях всегда сохранялась тщательно выверенная дистанция. Каховская никогда не отказывалась от самостоятельной позиции максималистов, но постепенно приняла одну практическую истину: перед лицом общего врага разногласия между революционерами можно временно отложить.\n\nОна по-прежнему высоко держит красное знамя революции. Только цвет этого знамени кажется ей глубже, чем простой красный.§!"
  RUS_andrey_kolegayev_sic_desc: "§YРодился:§! §L22 марта 1887 года; Сургут, Тобольская губерния, Российская империя§!\n§YБиография:§! §LАндрей Лукич Колегаев происходил из революционной семьи: оба его родителя состояли в «Народной воле», и революционная судьба словно была предначертана ему с рождения. Сначала он изучал право, но вскоре избрал путь левых социалистов-революционеров. В Казани Колегаев проявил себя талантливым организатором крестьянства, а после Октябрьской революции стал одной из ключевых фигур партии левых эсеров.\n\nПолитический перелом в конце Гражданской войны глубоко изменил его путь. Когда внутри партии левых эсеров возобладало стремление поднять вооружённое восстание против большевиков, Колегаев открыто выступил против. Причиной была не симпатия к большевикам, а трезвый стратегический расчёт: пока Красная армия вела смертельную борьбу с белыми, любой раскол внутри революционного лагеря мог лишь дать шанс общему врагу. Эта позиция в конце концов заставила его покинуть левых эсеров и ненадолго создать собственную Партию революционного коммунизма, которой, впрочем, не суждено было просуществовать долго.\n\nПосле войны Колегаев был вынужден эмигрировать. В последующие годы его жизнь постоянно чередовалась между изгнанием и Россией: порой он писал теоретические статьи в дешёвых квартирах Парижа или Лондона, порой тайно возвращался на родину и налаживал связи между деревней и подпольными организациями. Именно в ходе этой работы он тесно сблизился с максималистами, а в центре этого союза находилась его дружба с Алексеем Устиновым, сочетавшая отношения наставника и ученика с товарищеским равенством.\n\nВ теории Устинов последовательно изложил Колегаеву основы «аграрного большевизма»: крестьянство не является самостоятельным революционным классом, но служит естественным союзником пролетариата в деревне. Эта идея дала ясную систему координат многолетним размышлениям Колегаева о крестьянском вопросе, и следы влияния Устинова заметны во всех его последующих трудах. На практике роль Устинова была ещё конкретнее. Во время многочисленных тайных возвращений Колегаева в Россию для подпольной работы именно Устинов через сеть своих связей обеспечивал его явочными квартирами, документами и местными посредниками. В каждом переходе границы и каждом тайном собрании заключалась доля тщательно переданного Устиновым опыта подпольной борьбы.\n\nКолегаев умеет превращать разрозненное недовольство деревни в дисциплинированное политическое действие. Благодаря этому дару он стал одним из наиболее уважаемых руководителей максималистов, а в эмигрантских кругах получил неофициальное прозвище «крестьянского лениниста».§!"
  KR_prince_of_petrograd_sic: "Сын Ленинграда"
  KR_prince_of_petrograd: "Сын Ленинграда"
  russia_socialist_events.33.d: "Подсудимый: Иосиф Виссарионович Сталин\n\nОбвинение: пятьдесят пять убийств\n\nДвадцать лет назад гарнизоны форта Красная Горка и батареи Серая Лошадь подняли вооружённый мятеж, пытаясь силой свергнуть революционную власть. Во главе мятежа стоял поручик Н. М. Неклюдов; он сам и многие его сторонники принадлежали к партии социалистов-революционеров. Пока город страдал от голода, эсеры захватили военные укрепления и организовали мятеж, вынудив начальника обороны города И. В. Сталина отдать приказ о восстановлении порядка.\n\nМятежники укрепились в фортах и сопротивлялись четыре дня. Большевистские части в конце концов взяли укрепления штурмом и подавили восстание. На основании законов военного времени, принятых Советом народных комиссаров, комиссар Н. М. Разин получил приказ привести в исполнение военный приговор в отношении пятидесяти пяти главарей мятежа; ещё несколько человек пропали без вести в ходе боёв и последовавшей неразберихи. Приказ Сталина был военной мерой против вооружённого мятежа и относился к открыто восставшим военнослужащим, а не к мирным жителям.\n\nНа суде обвинение попыталось представить подавление мятежа как убийство. Однако показания главного свидетеля, товарища Разина, подтвердили, что приказ Сталина основывался на законах Совета народных комиссаров и являлся законной мерой военного времени против мятежников. Товарищ Сталин сохранял спокойствие и не отрицал, что отдал приказ о подавлении восстания. Его защита была ясной и решительной: шла война, подчинённые ему части подняли мятеж, а применение против них военной силы полностью соответствовало действовавшему законодательству.\n\nОбвинение сослалось на недавно принятый Закон о справедливости против белого террора, пытаясь применить новый закон к законному подавлению мятежа двадцатилетней давности. Такая попытка придать закону обратную силу вызвала споры среди присутствовавших. В конце концов обвинение заявило, что, учитывая заслуги Сталина перед рабочим классом, готово ограничиться десятью годами каторжных работ.\n\nОднако суд не согласился с доводами обвинения. Было установлено, что приказ товарища Сталина полностью соответствовал законам военного времени Совета народных комиссаров и являлся необходимой военной мерой против вооружённого мятежа. Закон, принятый позднее, не мог служить основанием для преследования за действия двадцатилетней давности. На этом основании суд оправдал товарища Сталина."
  russia_socialist_events.33.c: "Вот так просчитались…"
  russia_socialist_events.330.e: "Пусть товарищ Бухарин перестроит нашу экономику."
  russia_socialist_events.335.d: "Художники — инженеры человеческих душ. С приходом революции души российского народа должны подвергнуться коренному преобразованию. Главная задача Народного министерства культуры состоит в том, чтобы нести партийные идеи в массы, прививать социалистические ценности и бороться с контрреволюционной культурой.\n\nРоссия не испытывает недостатка в идеалистах, готовых заняться такой культурной работой. Александра Коллонтай предлагает полностью перестроить российское общество, упразднив семью и патриархат; Иван Гронский стремится создать новую культуру социалистического героизма. Эсеры рекомендуют Бориса Малкина, организатора кинопроизводства и партийного пропагандиста. Однако участники совещания явно склоняются к ветерану большевистского движения Михаилу Калинину, чьи идеи коммунистического воспитания привлекли всеобщее внимание."
  russia_socialist_events.335.a: "Рвение Коллонтай заслуживает признания."
  russia_socialist_events.335.b: "Замысел Гронского имеет более прочную основу."
  russia_socialist_events.335.c: "Малкин — более практичный выбор."
  russia_socialist_events.335.e: "Калинин признан наиболее подходящим кандидатом."
  RUS_stalin_general_secretary_sic: "Стальное сердце"
  RUS_iosif_stalin_sic_desc: "$RUS_iosif_stalin_leader_desc$"
  RUS_bolshevik_gamble_event_tt: "Мы используем всё влияние, которым обладает §oГригорий Зиновьев§!, чтобы попытаться взять под контроль §oРоссийскую коммунистическую партию (большевиков)§!.\n§RОднако если Иосиф Сталин всё ещё находится в нашем правительстве и восстановил влияние в армии, событие может развиваться иначе...§!"
  RUS_charter_of_russian_totalism: "Спор о тотализме"
  RUS_war_on_landowners_desc: "Крестьянство — переходный класс, которому суждено исчезнуть. Мы должны ускорить его превращение в сельскохозяйственных рабочих и лишить старые мелкобуржуазные идеи классовой почвы."
  RUS_red_intelligentsia: "Революционный культурный фронт"
  RUS_red_intelligentsia_desc: "Старый мир исчезает не сразу, а в ходе мучительного и долгого процесса. Идеи революции и демократии должны укорениться в сердце каждого гражданина."
  RUS_technocratic_syndicalism: "Заложить основы демократии"
  RUS_technocratic_syndicalism_desc: "Наконец пролетарская демократия, о которой говорил Ленин, набирает силу в России. Демократия, в миллион раз более демократичная, чем любая буржуазная, обеспечит наш переход к коммунизму!"
  RUS_preserve_revolution_within: "Триумф красного кормчего"
  RUS_preserve_revolution_within_desc: "Зиновьев сосредоточил в своих руках верховную власть. Его замысел русского тотализма и государства пролетарской диктатуры теперь §Rстанет реальностью§!."
  RUS_guide: "§MСталин — Обратить Октябрь вспять§! (§rКоммунизм§!)\n£white_dot Чтобы включить механику баланса сил, не активируйте решение §YНе затягивать темп§! до выбора фокуса §YВсероссийский союз труда§!. После завершения выборного процесса этого фокуса убедитесь, что единство §rинтернационалистов§! равно §Y2§! или ниже, а отношения с §oкоммунистами§! ровно §Y10§!. Подождите один день после завершения фокуса, чтобы сработало событие §YКаменев приходит к власти§!. В этот момент §YПервый четырёхлетний план§! станет §YПервым пятилетним планом§!, а завершение фокуса §YПервый пятилетний план§! добавит бонус пятилетки ко всем соответствующим промышленным решениям.\n£white_dot Идите по пути §oВСТ — Григорий Зиновьев§!. Перед завершением фокуса §YБольшевистская ставка§! убедитесь, что выполнены следующие условия:\n - Изгнанники вернулись.\n - Фокус §YВоенный марксизм§! завершён.\nЕсли все условия выполнены, вскоре после выбора §YБольшевистской ставки§! начнётся цепочка событий, в которой Сталин и Свердлов составят заговор для свержения Зиновьева и ВСТ. Последовательно выберите «Зиновьев должен быть свергнут», а затем «Думаю, я сумею их убедить». При успехе переворот против Зиновьева удастся. В следующем событии выберите «Сталин поведёт нас к победе», чтобы привести Иосифа Сталина к власти.\n£white_dot После победы над Германской империей во Второй мировой войне вы сможете создать §oСоюз Советских Социалистических Республик§!.\n\n§MСавинков — Пастырь наций / Спаситель мира / Идеократический принцип§! (§nНационал-популизм§!)\n£white_dot Сохраните режим Савинкова, удерживая §CНародный гнев§! ниже §R8§!, а §PВоенный гнев§! ниже §r10§!.\n£white_dot Чтобы получить подпуть §MПастырь наций§!, склоните баланс сил к солидаристам и назначьте Филоненко в событии «Филоненко встречается с Вождём».\n£white_dot Чтобы получить подпуть §MСпаситель мира§!, не склоняйте баланс сил ни к солидаристам, ни к идеократам.\n£white_dot Чтобы получить подпуть §MИдеократический принцип§!, склоните баланс сил к идеократам и назначьте Савицкого в событии «Савицкий встречается с Вождём».\n\n§MРеспублика — РДП / правые эсеры / кадеты / ВПП§! (§SСоциал-демократия§! / §lСоциал-либерализм§! / §mРыночный либерализм§! / §cСоциал-консерватизм§! / §gАвторитарная демократия§!)\n£white_dot Назначьте Антона Деникина новым начальником армии в событии «Замена Корнилова».\n£white_dot Обрушьте режим Савинкова, доведя §CНародный гнев§! до §R8§! или выше при §PВоенном гневе§! ниже §O5§!, либо доведя §PВоенный гнев§! выше §R8§!.\n£white_dot Если режим Савинкова падёт из-за §CНародного гнева§!, социалисты ненадолго придут к власти, но через несколько дней Антон Деникин совершит контрпереворот.\n£white_dot Используйте решения Третьей конституции и избирательные события, чтобы привести к власти нужную партию.\n£white_dot При избрании §SРДП§! не допускайте захвата партии крайне левыми.\n£white_dot Если выбраны §lправые эсеры§!, §YВладимир Рихтер§! может погибнуть, если §cПравый гнев§! или §PВоенный гнев§! достигнут §O6§! или выше. В зависимости от того, кому был передан контроль над Государственным советом, новым лидером станет §YПитирим Сорокин§! или §YИлья Фондаминский§!.\n£white_dot Если выбраны §mкадеты§!, §YВасилий Маклаков§! может уйти из политики, если §gПолитическая апатия§! достигнет 5 или выше. В зависимости от того, кому был передан контроль над Государственным советом, новым лидером станет §YПётр Долгоруков§! или §YАнтон Карташёв§!.\n£white_dot Если §YИван Солоневич§! будет убит, новым лидером станет §YДмитрий Романов§!.\n£white_dot Взяв послевоенный фокус §YВозвращение к традиции§!, режим §cВПП§! под руководством Солоневича станет §gавторитарно-демократическим§!.\n\n§MИмперия — правые эсеры / кадеты / ВПП / НМД§! (§lСоциал-либерализм§! / §mРыночный либерализм§! / §cСоциал-консерватизм§! / §gАвторитарная демократия§! / §PПатерналистская автократия§!)\n£white_dot Назначьте Петра Врангеля начальником армии в событии «Замена Корнилова».\n£white_dot Обрушьте режим Савинкова, доведя §CНародный гнев§! до §R8§! или выше при §PВоенном гневе§! ниже §O5§!, либо доведя §PВоенный гнев§! выше §R8§!.\n£white_dot Если режим Савинкова падёт из-за §CНародного гнева§!, социалисты ненадолго придут к власти, но через несколько дней Пётр Врангель совершит контрпереворот.\n£white_dot Используйте решения Третьей конституции и избирательные события, чтобы привести к власти нужную партию.\n£white_dot Если §YИван Солоневич§! является вторым лицом государства, фокусы §YЧума демократизма§! и §YДиктатура совести§! позволят перейти соответственно к §gавторитарной демократии§! и §Pпатерналистской автократии§!.\n\n§MВрангель — кадеты / ВПП / СОР§! (§mРыночный либерализм§! / §cСоциал-консерватизм§! / §gАвторитарная демократия§!)\n£white_dot Назначьте Петра Врангеля начальником армии в событии «Замена Корнилова».\n£white_dot На пути Савинкова доведите §PВоенный гнев§! до §r8§! во время войны с Германской империей, и Врангель возьмёт власть как §Pпатерналистский автократ§!.\n£white_dot После войны используйте события, чтобы избрать желаемую партию."
  russia_flavour_events.55.a: "Вся власть Советам!"
  russia_flavour_events.55.d.soc: "После поражения большевиков в Гражданской войне сменявшие друг друга правительства объявляли российских социалистов предателями. С самого момента поражения социалисты начали обвинять друг друга, пытаясь понять, на ком лежит ответственность. Меньшевики утверждали, что вся революция с самого начала была анархической ошибкой, а в отсталой России единственно жизнеспособной программой было действовать как социалистическая оппозиция внутри республиканской революции. Левые эсеры, анархисты и некоторые большевики-капитулянты считали, что сама революция заслуживает празднования, но была искажена большевистскими крайностями после взятия власти, их предательством крестьянства, кровавым Красным террором и капитуляцией перед немцами по Брест-Литовскому договору.\n\nПеред лицом таких нападок и клеветы на Октябрьскую революцию оппортунисты и колеблющиеся элементы разбежались во все стороны. Только самые твёрдые и сильные большевики продолжали защищать ортодоксию и законность революции, одновременно осуждая предательство социалистами-революционерами классовой революции. Они считали, что поражение Октября было лишь отливом революции, и что однажды могучий ветер истории сметёт эти сухие ветви и опавшие листья, позволив Русской революции родиться заново.\n\nНа этом фоне социалистическое движение погрузилось в хаос. Их преследовали белые, они были расколоты и почти лишены надежды. Одни вступили к радикальным демократам и приняли строго реформистскую линию, пытаясь выторговать шанс на выживание. Другие продолжали борьбу не на жизнь, а на смерть против белых бандитов, защищая народ от шаек «Свободы». Многие также пытались вести переговоры и идти на компромисс, надеясь построить русский социализм, способный объединить враждующие течения эпохи. Но теперь все эти споры подошли к своему заключению, и большевики, возродившиеся из пепла, доказали свою правоту — ход истории не остановить,"
