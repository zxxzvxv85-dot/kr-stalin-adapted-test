l_english:
  russia_flavour_events.55.d.soc: "After the Bolsheviks were defeated in the Civil War, successive governments branded Russia's socialists as traitors. From the moment of defeat, socialists began blaming one another, trying to discover where responsibility lay. The Mensheviks argued that the whole revolution had been an anarchic mistake from the very beginning, and that in backward Russia the only viable programme was to act as a socialist opposition within a republican revolution. The Left Socialist-Revolutionaries, anarchists and some Bolshevik capitulators believed that the revolution itself deserved celebration, but had been distorted by Bolshevik excesses after taking power, their betrayal of the peasantry, the bloody Red Terror, and their surrender to the Germans in the Treaty of Brest-Litovsk.\n\nFaced with such smears and slanders against the October Revolution, opportunists and wavering elements scattered in every direction. Only the firmest and strongest Bolsheviks continued to defend the revolution's orthodoxy and legitimacy, while condemning the Socialist-Revolutionaries' betrayal of class revolution. They believed that October's defeat was only a low tide in the revolution, and that one day the mighty wind of history would sweep away these dead branches and fallen leaves, allowing the Russian Revolution to be born anew.\n\nAgainst this background, the socialist movement sank into chaos. They were persecuted by the Whites, divided and almost without hope. Some joined the Radical Democrats and adopted a strictly reformist line, trying to bargain for a chance of survival. Others continued a life-and-death struggle against the White bandits, defending the people from Svoboda mobs. Many also attempted negotiation and compromise, hoping to build a Russian socialism capable of uniting the hostile factions of the day. But now all these disputes have reached their conclusion, and the Bolsheviks reborn from the ashes have proven themselves correct - the tide of history is unstoppable,"
  russia_flavour_events.55.a: "All Power to the Soviets! (Vsya vlast Sovetam!)"
