 RUS_agricultural_quarterly_management_category:0 "Государственное сельское хозяйство"
 RUS_agricultural_quarterly_management_category_desc:0 "Аграрный комитет координирует продовольственную безопасность и восстановление села: от посевов и запасов до производства техники и внешней торговли."
 RUS_agri_export_orders_unlock_tt:0 "Открывает §Yквартальные заказы Британии и Франции§!: каждая существующая страна даёт заказ культур и техники со следующего квартала. Множитель цены выполненных заказов §G+0.10§!."
 RUS_agri_annual_shortfall_desc:0 "В прошлом сельскохозяйственном году внутреннее снабжение упало ниже безопасного уровня и требует дополнительных ресурсов."
 RUS_future_foreign_002_effect_tt:0 "Открывает решения §Y«Военная помощь»§! для всех социалистических стран мира; каждая страна может получить такую помощь только один раз.\nОдин обычный заказ культур каждый квартал, начиная со следующего."
