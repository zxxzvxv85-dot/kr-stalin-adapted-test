  russia_socialist_events.62.d: "[ROOT.RUSGetPlannedEconomyEventDesc]"
  russia_socialist_events.62.d_four: "Although making rapid industrial advances in the 1920s, Russia is still a second-rate great power in industrial terms, notwithstanding our tremendous potential. Despite opposition from the moderates in VST and PSR, we have taken the first steps towards introducing full state planning to our economy to ensure a rapid pace of development.\n\nWe have established the Fedplan, composed of delegates from labour unions and economists to oversee the creation and implementation of the first 4-Year Plan. The main theorists behind our economic policy are Stanislav Strumilin and Sergey Dubrovsky, both respected in their own field and proponents of rapid industrialisation through state intervention. In Strumilin's analysis of Savinkov's VES, he points out that it had a sound economic rationale, but in practice it failed to deliver due to compromises with capitalist interests and rampant corruption in the SZRS. The Fedplan is a half-democratic, half-technocratic body under the supervision of the Congress, and the current government has placed high hopes on it.\n\nThe first 4-Year Plan is focused on thorough socialisation of the economy, expansion of heavy and military industry in preparation for the coming war, and mechanisation of agriculture. From these, more advanced industries can be built in the future. While the lowest levels of economy are still relatively free, the Fedplan has quickly established a bureaucracy to oversee the unions, which act as the chief implementers of the Fedplan's directives. It remains to be seen how successful the plan will be."
  russia_socialist_events.62.d_five: "Although making rapid industrial advances in the 1920s, Russia is still a second-rate great power in industrial terms, notwithstanding our tremendous potential. Despite opposition from the moderates in VST and PSR, we have taken the first steps towards introducing full state planning to our economy to ensure a rapid pace of development.\n\nWe have established the Fedplan, composed of delegates from labour unions and economists to oversee the creation and implementation of the First Five-Year Plan. The main theorists behind our economic policy are Stanislav Strumilin and Sergey Dubrovsky, both respected in their own field and proponents of rapid industrialisation through state intervention. In Strumilin's analysis of Savinkov's VES, he points out that it had a sound economic rationale, but in practice it failed to deliver due to compromises with capitalist interests and rampant corruption in the SZRS. The Fedplan is a half-democratic, half-technocratic body under the supervision of the Congress, and the current government has placed high hopes on it.\n\nThe First Five-Year Plan is focused on thorough socialisation of the economy, expansion of heavy and military industry in preparation for the coming war, and mechanisation of agriculture. From these, more advanced industries can be built in the future. While the lowest levels of economy are still relatively free, the Fedplan has quickly established a bureaucracy to oversee the unions, which act as the chief implementers of the Fedplan's directives. It remains to be seen how successful the plan will be."
  russia_socialist_events.435.t: "The State of Industry"
  russia_socialist_events.435.d: "If the problem of the countryside is land, then the problem of industry is order.\n\nSince the revolution, Russia's industrial system has never truly been unified. Factories across the country have fended for themselves amid turmoil: some barely survive on old orders, some linger under the protection of speculators, and many more have simply stopped work. What to produce, how much to produce, and whom to sell to - no central institution can answer these questions.\n\nThe result is disastrous.\n\nIn the Urals, a blast furnace capable of producing tens of thousands of tonnes of pig iron each year has stopped for lack of coke, while less than three hundred kilometres away another coking plant leaves the same quantity of coke weathering in a rail yard because transport dispatching has collapsed. This is not an exception, but the rule. Factories lack coordination, information does not flow, plans do not connect, and transport does not move. The whole industrial system is like a machine whose gears all bite in the wrong places: every part is turning, but the machine itself will not move forward.\n\nWorse still is the loss of resources. Speculators exploit the confusion to purchase industrial raw materials at rock-bottom prices and smuggle them across the border for enormous profits. Timber, ore, even semi-finished machine-tool parts - things that should be used for domestic construction - become roubles in smugglers' pockets.\n\nOther resources are wasted on meaningless production. Some factories, in order to 'fulfil targets', produce large quantities of shoddy goods that the market does not need; others duplicate the same equipment while truly scarce machines are ignored. There is enthusiasm for production, but its direction is blind.\n\nBeneath all this, the workers' condition is equally alarming. In idle or half-idle factories, workers cannot receive full wages, and sometimes not even rations. Skilled workers are forced from the shop floor: some drift into the streets, while others are hired by speculators for private work. The hands that should be building socialism are being eaten away piece by piece by the remnants of the old age.\n\nThis is the reality the First Five-Year Plan must face: not beginning from zero, but beginning from chaos. The first task of the plan is not 'construction', but 'organisation' - to gather scattered resources, bring self-governing factories onto a unified track, and turn every wasted tonne of coal, every piece of iron, and every pair of workers' hands back into a machine that can truly run."
  russia_socialist_events.435.a: "Let us begin the work."
  russia_socialist_events.434.t: "The RKP(b) and the First Five-Year Plan"
  russia_socialist_events.434.d: "The drafting of the First Five-Year Plan is no mere technical matter confined to the offices of Fedplan. With the left wing of the VST having gained a decisive advantage in the political struggle, the theorists, organisers and trade-union cadres of the RKP(b) have begun to take part in planning work to an unprecedented degree. Factory committees, railway unions, mining delegates and red economists from across the country have been summoned to debate the layout of heavy industry, the construction of transport arteries, the mechanisation of agriculture and the expansion of defence production.\n\nTo many old bureaucrats and moderate economists, the Bolshevik proposals are dangerously radical, almost indifferent to reality. They warn that Russia still stands amid the ruins left by war, destruction and capital flight: means of production are scarce, skilled workers are few, and the local administrative apparatus has not yet recovered enough to bear the weight of a nationwide plan. The representatives of the RKP(b), however, reject such caution. It is precisely because Russia remains backward, they argue, that the chains left by the old world must be broken by more resolute and centralised means.\n\nSverdlov, Kamenev, Stalin and a number of returned Bolshevik cadres have all stressed in different forums that the Five-Year Plan is not an ordinary economic policy, but the revolutionary state's deliberate offensive against history. It must draw scattered factories, mines, railways and farms into a single rhythm, and reorganise the working class as the vanguard of socialist construction. Every target in the plan must serve one purpose: to reforge Russia, from the ruins of a defeated revolution cursed by reaction, into an industrial fortress capable of sustaining world revolution.\n\nIn the end, Fedplan has accepted most of the amendments proposed by the RKP(b). The First Five-Year Plan will centre on heavy industry, machine-building, energy development and railway modernisation, while incorporating the trade-union system into its mechanisms of supervision and mobilisation. It will not be a moderate programme of recovery, but a construction programme that declares war on the old world."
  russia_socialist_events.434.a: "Let the roar of machines answer them."
  russia_socialist_events.436.t: "Report on the First Five-Year Plan\nSpecial Session of the All-Russian Central Executive Committee"
  russia_socialist_events.436.d: "Comrades:\n\nSeveral years ago, when we proposed the First Five-Year Plan, in whose hands was this country's industry? In the hands of scattered old capitalists, speculators and local bureaucrats. In whose hands was agriculture? In the hands of landlords, kulaks and grain merchants who practised exploitation in the name of the 'free market'. In whose hands was education? In the hands of the old intelligentsia, who used cultural barriers to keep the children of workers and peasants outside the gates.\n\nToday, we must answer a fundamental question: what, in these years, has changed?\n\nI. The transformation of production relations: from private possession to ownership by the whole people\n\nThe core of the Five-Year Plan is not merely 'how many factories were built'. That is only the surface. Its essence is the fundamental transformation of ownership over the means of production.\n\nSeveral years ago, even a factory bearing the signboard of 'state ownership' was often still governed in practice by the poison left by the old age: the director might have come from the old capitalist class, the technical backbone might be old intellectuals, workers had no say in production, and the flow of products was manipulated by speculators. At that time, 'state ownership' was only nominal.\n\nThrough factory committees, workers' supervision, and deepening class education, we have step by step placed these factories truly in the hands of the working class. Workers now take part not only in production, but in management: production plans are discussed by workers, distribution schemes are voted on by workers, and technical improvements are proposed by workers.\n\nThis is not sentimental 'labour-capital cooperation', but the proletariat's actual command over the production process.\n\nThe same is true in agriculture. The meaning of land reform does not lie in 'dividing the land'. Division was only the first step. The real transformation is that land has passed from the private property of landlords and kulaks into public means of production owned by the state and cultivated collectively. A collective farm is not simply 'farming together', but a thorough reconstruction of production relations in the countryside.\n\nThe kulak class has been eliminated as a class. For the first time, poor peasants and landless peasants have seen their own names upon the land - not as tenant farmers, not as hired labourers, but as the true masters of the land.\n\nThis is the class content of the Five-Year Plan: the means of production are seized back from private hands and returned to those who create them.\n\nII. The deepening of class struggle: planning against anarchy\n\nWhat was industry like in the old age? It was anarchy. Every factory decided for itself what to produce, how much to produce, and whom to sell to. The result was that scarce materials went unmade, surplus goods filled warehouses, and speculators grew rich amid confusion.\n\nThe significance of the Five-Year Plan is that the unified plan of the proletarian state has replaced the anarchy of capitalism. This is not a technical question. It is a class question.\n\nWhy? Because planning itself is the negation of the bourgeois 'free market'. When the state decides that steel will be used first for tractor plants rather than luxury goods, it is the will of the working class overriding the will of capital. When the state allocates scarce machine tools to collective farms rather than private workshops, it is the socialist purpose of production replacing the capitalist logic of profit.\n\nThis is not an 'economic adjustment'. It is the systematic liquidation of bourgeois production logic by the proletarian state.\n\nIII. Revolution in the superstructure: culture is no longer a privilege\n\nThe meaning of educational reform has never been as simple as 'teaching more people to read'. The illiteracy of the old age was a tool by which the ruling class preserved its rule: illiterate peasants could not read the law, calculate rents, or organise themselves to resist. Cultural monopoly was one of the most concealed and most solid forms of class oppression.\n\nIn these years, we have brought schools into villages, night schools into workshops, and film brigades into the most remote pastoral regions. The children of workers and peasants have entered the lecture halls of higher education for the first time - not to 'learn how to become elites', but to learn how to better serve the working class.\n\nThe old intelligentsia once monopolised the power to define 'what knowledge is' and 'who is qualified to receive knowledge'. Today, that power is being taken back. An old peasant who has worked in a collective farm for twenty years is invited to lecture at an agricultural university because he understands animal breeding. He is not a 'guest professor'; he is the best teacher. A fitter who has repaired machine tools for thirty years is transferred to a technical school to write textbooks because he knows the properties of every kind of steel. He is not a 'worker representative'; he is the one who understands materials best.\n\nThis is not 'cultural popularisation'. It is the transfer of cultural leadership. Knowledge is passing from the monopoly of the few into the common wealth of all working people."
  russia_socialist_events.436.d_2: "IV. Ideological construction: the broad rise of class consciousness\n\nThe deepest change brought by the Five-Year Plan is not on forms or in factory buildings, but in people's minds.\n\nSeveral years ago, many workers still saw themselves as 'people who sell labour-power'. Today, they begin to see themselves as masters of the state. Several years ago, many peasants worried over 'my family's land'. Today, they worry over 'our farm's harvest'. Several years ago, an illiterate rural youth might never leave a circle of fifty li. Today, a young person of the same origin is attending night school, entering training courses, learning to drive a tractor, and even beginning to read Lenin.\n\nThis is not the 'awakening of national spirit' - that is the language of bourgeois intellectuals. This is the awakening of proletarian class consciousness: for the first time, labourers realise that they are not spectators of history, but its subjects; not objects to be administered, but masters who administer the state.\n\nWhen members of a collective farm vote on a decision at a members' meeting, when workers in a workshop meeting propose amendments to a production plan, when an old peasant who once could not read picks up the Decree on Land Socialisation and reads it himself - in those moments, the old ideology is collapsing and new class consciousness is growing irreversibly.\n\nThis is the greatest achievement of the Five-Year Plan: the proletariat is learning to organise itself.\n\nV. Difficulties and lessons: the dialectic of advance\n\nMarx teaches us that every transformation is accompanied by pain. The Five-Year Plan is no exception.\n\nWe have made mistakes of excessive haste in collectivisation, suffered from bureaucratic drag in industrialisation, and encountered commandism in grassroots implementation. In some regions kulak elements disguised themselves and infiltrated cadre ranks; in others, speculators exploited gaps in the plan to continue profiteering.\n\nThese are not evidence of 'failure'. On the contrary, they are the real face of class struggle. There is no socialist revolution that proceeds smoothly from beginning to end. Mistakes are exposed so they can be corrected. Difficulties stand before us so they can be overcome.\n\nThe key point is this: we corrected them, we overcame them, and we learned to sum up experience through struggle.\n\nVI. Present tasks and future direction\n\nThe First Five-Year Plan is complete. But the struggle will not end. The transformation of production relations is not complete, and the revolution in ideology is not complete.\n\nOur productive forces are not yet developed enough, our technology is not yet advanced enough, the ranks of our working class still need to expand and improve, and rural collectivisation still needs further consolidation.\n\nThis is not a road laid with red carpets. It is a road that must be walked with sleeves rolled up, palms worn raw, sweat shed, and even blood spilled. But we have already proven that this road can be walked.\n\nA proletarian state can organise production, transform the countryside, create a new corps of working-class intellectuals, and build a complete system of social education in a country where illiteracy once embraced the majority.\n\nWe have not relied on any 'national superiority' - that is a myth invented by reactionary theorists. We rely on only one iron law: once the proletariat has taken hold of its own fate, no force can prevent it from creating history.\n\nThe Second Five-Year Plan is already on the road. The factories not yet built, the children not yet in school, the villages not yet taught to drive tractors - all of them are waiting for us.\n\nThen let us keep working. No excuses, no retreat, and no intention of either."
  russia_socialist_events.436.a: "All-Russian Central Executive Committee"
  russia_socialist_events.437.t: "Stalingrad Tractor Plant"
  russia_socialist_events.437.d: "\"Faster, better, cheaper\" is the slogan engraved inside the gates of the Stalingrad Tractor Plant, the first words every worker sees upon entering the workshops. As one of the first combines in the country to master assembly-line production of tracked vehicles, the plant produces agricultural tractors in peacetime, but can rapidly shift within the defence mobilisation system to armoured carriers, tractors and light tracked chassis. This combination of peace and war production makes it a key link between rural mechanisation and army motorisation.\n\nThe works stretch along a branch of the Volga, with foundries, forges, stamping shops, heat-treatment halls and final assembly lines, as well as a special line for cold-bending armour plate. Conveyor belts run day and night, carrying engines, running gear and hull sections towards assembly stations. Workers operate in three eight-hour shifts. The plant provides free canteens, hot-water showers, a basic infirmary, simple factory apartments for skilled workers, and schools for workers' children. In every brigade, a blackboard records the double competition in output and quality; the best team each month receives a collective bonus and a place in Red Track, the factory newspaper. Annual model workers may spend two weeks at a sanatorium downstream on the Volga.\n\nUnder the Five-Year Plan, the Stalingrad Tractor Plant is designated a model factory for peace-war integration. The plan includes a new armour-rolling shop, an automatic welding line, and a circular test track for tracked-vehicle endurance trials. Tractor production is to double within five years, while the ability to shift to armoured production must shrink from one month to one week. A technical training centre and a defence-sport club with an indoor firing range will also be built. The Stalingrad Tractor Plant gives power to the fields and shields to the front, expressing in four plain words an entire philosophy of industrialisation."
  russia_socialist_events.437.a: "Build national defence faster, better and cheaper!"
  russia_socialist_events.438.t: "Izhevsk Mechanical Plant"
  russia_socialist_events.438.d: "High-quality infantry equipment is the industrial principle of the Izhevsk Mechanical Plant. As one of the oldest armaments combines in the country, it has long specialised in the development and production of rifles, light machine guns, automatic rifles and ammunition.\n\nInside the works are rows of precision machine tools and production lines that never fall silent. Workers operate in three eight-hour shifts, with free factory canteens, heated dormitories and a factory clinic. Skilled technicians may apply for simple housing. Labour competitions fill daily work: every workshop posts red-banner charts for output and quality, and winning brigades receive additional bonuses and holiday vouchers.\n\nIn the Five-Year Plan, the Izhevsk Mechanical Plant is listed as a priority technical-modernisation site. Planned expansions include a new high-precision cold-forging shop, an automated ammunition assembly building, and an indoor range for testing new automatic weapons. The plan requires output to quadruple by the end of the period, while also adding a workers' palace of culture and a technical school. This factory will not only rearm the army's infantry, but also forge a new generation of military-industrial specialists."
  russia_socialist_events.438.a: "By next year, every soldier will have at least ten rifles!"
  russia_socialist_events.439.t: "Lenin Automobile Plant"
  russia_socialist_events.439.d: "The Lenin Automobile Plant is defined by export-oriented production: high-quality vehicles are to earn foreign currency for the state. As one of the first domestic automobile enterprises aimed at the international market, it specialises in medium trucks, off-road service cars and specialised chassis, all known for ruggedness and reliability in severe cold. Stamping, welding, painting and final assembly halls run their conveyors day and night.\n\nWorkers operate in two ten-hour shifts. The plant has low-cost canteens, bathhouses and shift dormitories; skilled mechanics may receive factory apartments, while their children get priority in the attached nursery and primary school. Monthly bonuses are paid according to export orders fulfilled, and brigades that meet targets for three months in a row may receive holidays at Black Sea sanatoria.\n\nIn the Five-Year Plan, the Lenin Automobile Plant is an export-oriented key enterprise. Planned works include a fully automatic stamping line, an enclosed test track, and a packaging and spare-parts centre for overseas customers. Annual vehicle output is to triple by the end of the plan, with exports accounting for no less than sixty percent. The plant will also expand its palace of culture, add technical-training workshops, and introduce selected foreign machine tools to improve component precision. The Lenin Automobile Plant is both a source of foreign exchange and a calling card for our industrial capacity."
  russia_socialist_events.439.a: "A window looking outward."
  russia_socialist_events.440.t: "Tankograd"
  russia_socialist_events.440.d: "\"Cheap\" is the impression almost every visitor takes away from Tankograd. By refining machining techniques and gathering low-cost materials on a vast scale, the factory has reduced the cost of tanks and armoured vehicles to an astonishing degree without sacrificing performance. Its products are simple, repairable and suited to wars of mass attrition, making them the most reliable steel companions of the front.\n\nThe works cover several square kilometres and are divided into foundry, forge, armour-welding, final assembly and gun shops. Conveyors and rail carts move rough parts between workshops day and night. Workers operate in two ten-hour shifts, with heated dormitories, low-cost canteens and a factory clinic. Key technical workers can obtain simple family housing in the plant district, and their children receive priority at the attached workers' school. Each process has a scrap-rate red-banner board; teams that meet monthly standards receive an extra half-month's wages. Every summer, the factory union sends outstanding producers to a nearby lake sanatorium for one week.\n\nUnder the Five-Year Plan, Tankograd is a priority expansion site. The programme includes a large stamping shop, a fully automatic armour heat-treatment line, and a dedicated proving ground for cross-country tank trials. Tank output must triple within five years while labour hours per vehicle are nearly halved. To support expansion, the district will add a technical school, a cinema and a gymnasium. Tankograd bears the army's main burden of armoured production while continuously refining its philosophy of high value at low cost."
  russia_socialist_events.440.a: "A tank for the price of a rifle!"
