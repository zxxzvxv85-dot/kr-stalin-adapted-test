  RUS_4_year_plan_desc: "[ROOT.RUSGetFirstPlanDesc]"
  RUS_4_year_plan_desc_four: "Instead of relying on the mechanisms of the market, socialism requires new ways of expanding the means of production. We shall set up a council that will work with all elements of the economy to set production goals. These goals will be determined across a four year period and be reviewed annually to check the productivity of all firms and ensure all are receiving their necessary inputs, being revised where necessary."
