  RUS_stalin_ffyp_expand_coal_prospecting_mission_desc: "Within §Y270 days§!, raise Shcheglovsk, Tomsk, and Chelyabinsk to §YInfrastructure level 5§! and ensure that each state contains at least §Y2 Civilian Factories§!.\n\n§GSuccess:§! Gain §G5%§! Stability and add §G9§! Coal in each state.\n§RFailure:§! Lose §R5%§! Stability and §R10§! First Five-Year Plan score, and remove §R9§! Coal from each state."
  RUS_stalin_ffyp_accelerate_urban_development: "Accelerate Urban Development"
  RUS_stalin_ffyp_accelerate_urban_development_desc: "Begin a §Y500-day§! programme of urban infrastructure and industrial expansion. Novgorod, Smolensk, Bryansk, Kursk, and Belgorod must each reach §YInfrastructure level 5§! and contain at least §Y4 Civilian Factories§!."
  RUS_stalin_ffyp_accelerate_urban_development_mission: "Accelerate Urban Development"
  RUS_stalin_ffyp_accelerate_urban_development_mission_desc: "Within §Y500 days§!, raise Novgorod, Smolensk, Bryansk, Kursk, and Belgorod to §YInfrastructure level 5§! and ensure that each state contains at least §Y4 Civilian Factories§!.\n\n§GSuccess:§! Add §G2§! Coal, §G1§! Reinforced Power Grid, §G4§! Rubber, and §G4§! Oil in each state.\n§RFailure:§! Lose §R10%§! Stability and §R10§! First Five-Year Plan score."
  RUS_stalin_ffyp_accelerate_urban_development_reward_tt: "Add §G2§! Coal, §G1§! Reinforced Power Grid, §G4§! Rubber, and §G4§! Oil in each of Novgorod, Smolensk, Bryansk, Kursk, and Belgorod"
  RUS_stalin_ffyp_score_loss_10_tt: "First Five-Year Plan score: §R-10§!"
  RUS_kamenev_all_russian_electrification_automatic: "Automate All-Russian Electrification"
  RUS_kamenev_all_russian_electrification_automatic_desc: "Click to enable or disable automatic execution of §YAll-Russian Electrification§!. Once enabled, the system waits for the current project to finish. Whenever at least §Y15§! Political Power and §Y1§! Civilian Factory available for projects are present, and a controlled Russian core state still has less than Infrastructure level 5, it automatically starts the next project with its normal Political Power cost, factory use, duration, and effects."
  RUS_kamenev_all_russian_electrification_automatic_enable_tt: "§GEnable§! automatic All-Russian Electrification"
  RUS_kamenev_all_russian_electrification_automatic_disable_tt: "§RDisable§! automatic All-Russian Electrification"
  RUS_kamenev_all_russian_electrification_automatic_mission: "All-Russian Electrification: Automation Enabled"
  RUS_kamenev_all_russian_electrification_automatic_mission_desc: "The automation system is waiting for §YAll-Russian Electrification§! to meet all activation conditions. Once they are met, it will automatically deduct §Y15§! Political Power and execute the project with its original duration and effects."
