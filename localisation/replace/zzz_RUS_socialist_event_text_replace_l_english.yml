l_english:
  russia_socialist_events.3.t: "The Socialist-Revolutionaries Reunited"
  russia_socialist_events.3.d: "The history of the Socialist-Revolutionary Party is one of ceaseless division and reunion. Its most recent great schism followed the death of Viktor Chernov, whose passing tore open fissures that had long existed within the party. In his wake, Boris Savinkov subjected the right wing to an almost ruinous purge, consigning many cadres once regarded as the ‘backbone of the party’ to lists of traitors. Meanwhile, the left was driven underground and forced back into the mode of survival it knew best, and bore most heavily: terrorism.\n\nToday, the Socialist-Revolutionaries have once again assumed a dominant place on the political map. Yet this alone is far from sufficient to unite beneath one banner the peasantry that constitutes the overwhelming majority of Russia's population. Peasant distrust of political parties, regional divisions, and the mutual suspicions inherited from the revolutionary years remain deep chasms across the road to unity.\n\nAfter several rounds of private negotiations between Maria Spiridonova and Friedrich Richter, the Socialist-Revolutionary Party has finally proclaimed itself reunited once more.\n\nObservers note that this reunion bears the unmistakable marks of compromise. Spiridonova represents the left's radical inheritance and rural foundations, while Richter embodies the forces within the party seeking democratisation and parliamentarism. Their consensus rests less upon trust than upon pragmatic calculation: after all, the price of division is far higher than the cost of compromise."
  russia_socialist_events.3.a: "Can these people truly learn what cooperation means?"
  russia_socialist_events.3.b: "Tell me more about the Socialist-Revolutionary Party."
  russia_socialist_events.73.d: "The Maximalists are one of the most radical factions within the Socialist-Revolutionary Party, with roots reaching back to pre-revolutionary Russia. The faction takes its name from the manifesto The Revolutionary Maximalist Programme — Communism, written by Alexei Ustinov. More than a statement of principles, the document has to a considerable extent become the faction's political declaration.\n\nDuring the Revolutionary War, the Maximalists allied themselves with the Bolsheviks and forged a close working relationship on their shared battlefields. They did not disband after the war, instead becoming a partisan organisation that remained active at the grassroots. Through long years underground, they preserved both their organisational integrity and their will to fight. Now, as the political climate changes, this force has resurfaced and is rapidly growing.\n\nAs a resurgent force, the Maximalists are fundamentally closer to revolutionaries than to Socialist-Revolutionaries in the traditional sense. Their political language, organisational methods, and logic of struggle have far more in common with the Bolsheviks, leaving them with a distinct identity within the Socialist-Revolutionary Party.\n\nWithin the leadership, Alexei Ustinov is widely regarded by the membership as its spiritual leader, and the theoretical framework established in his writings remains the ideological foundation of the faction. Practical organisation and everyday affairs, meanwhile, are handled by Andrei Kolegayev. Their relationship, at once that of teacher and student and of close comrades, forms the Maximalists' strongest political bond. It is this mutually reinforcing structure that has enabled the faction to preserve the distinctive vitality of a revolutionary party through years of adversity.\n\nThe Maximalists' political programme differs sharply from that of traditional Socialist-Revolutionaries. In principle, they reject the peasantry's independent historical role as a ‘transitional class’ in the revolutionary process, regarding it as inherently wavering and limited. In practice, however, they accept the revolutionary purpose of the poor peasantry as an instrument of transformation: poor peasants can be mobilised, organised, and guided towards socialist transformation. Consequently, awakening the class consciousness of agricultural workers and organising them is explicitly identified as one of the faction's central policy objectives."
  russia_socialist_events.73.a: "The finest allies of the social revolution!"
  russia_socialist_events.30.d: "The \"1923 National Defense Act\" once classified all 'communist activities' as illegal. When Maria Spiridonova's government came to power, its first action was to overturn all political crime verdicts made under this law. Once, this law hung like a sword over people's heads—thousands of socialists were persecuted and jailed, and many fled to Western socialist countries, joining the Bolshevik exile communities there. Now, most of them are returning home on the 'Red Boat,' comrades setting off from Paris and London on their journey back to their homeland.\n\nThey were warmly welcomed in Petrograd and announced a merger with the 'Integration Movement' party organization, which had long been active in Siberia. However, the seeds of disagreement had long been sown. The exiles' experiences were vastly different from those of domestic socialists, leading to intense clashes. These exiles now resembled more of a military-political group, seeing themselves as the orthodox successors of Lenin, and were deeply disappointed with the current political situation in Russia."
  russia_socialist_events.30.a: "Welcome home?"
  russia_socialist_events.32.d: "Due to the voluntary or involuntary retirement of a large number of White Army officers, experienced commanders are in short supply. The shortage is particularly severe among company and platoon leaders at the grassroots level, and newly formed units often reveal serious command gaps during tactical exercises and actual deployments.\n\nTo this end, Frunze, together with other Red Army officers who had returned from exile, submitted a 'Proposal for Military Purges and Reforms' to the Provisional Government. The core idea of the proposal was twofold: on one hand, to continue identifying and eliminating unreliable remnants within the old army, and on the other hand, to significantly accelerate the accelerated training in military academies and select promising talents from workers, peasants, and returning officers to fill command positions.\n\nThis proposal covers a wide range of areas—from the re-evaluation of active-duty officers, to adjustments in troop organization, and to the drafting and promotion of new combat regulations, with numerous issues to handle. Although Frunze held the position of strategic decision-maker, he was unable to supervise each reform detail personally. Therefore, in the supplementary notes of the proposal, he specifically recommended his talented protégé, Semyon Timoshenko, to coordinate and execute the daily organizational work of the reforms, so that this document could be quickly transformed into the army's actual combat capability."
  russia_socialist_events.101.d: "Red Army forces have advanced to the suburbs of Petrograd and have ordered General Goltz to surrender. However, this White Army marshal did not appear in the city and remained on his flagship, the 'General Alekseyev,' anchored outside the city. The Baltic Fleet's attitude was ambiguous and restless, leaving the entire city in a bizarre stalemate. Meanwhile, the Kronstadt fortress and the Baltic Fleet gave no substantial response to communications from any side, merely replying with the two words 'acknowledged' perfunctorily.\n\nThe city is still under the control of the people—most of the Petrograd garrison belongs to the first units to defect, and they immediately began arresting the unpopular 'Svoboda' members in the city.\n\nThis veteran naval commander was undoubtedly furious at the socialists coming to power again, but this time, he seemed to be isolated and without support. However, he still had a group of loyal sailors and marine battalions around him, and the ship’s guns remained aimed at the heart of Russia. Fierce debates broke out within the Red Army outside Petrograd: What exactly was Kolchak plotting? Was he organizing a counter-revolutionary strike, or had he already been abandoned by everyone, leaving only this fleet?\n\nIn the end, the government sent a Petrograd city commissioner aboard the 'General Alekseyev' to negotiate with Kolchak, proposing the handover of the fleet in exchange for a dignified retirement. On the ship, the former 'Supreme Ruler of All Russia' appeared haggard. He merely said lightly that perhaps he had gradually drifted away from Russia and could no longer understand the country. His previous extreme worry about the coup ultimately proved to be unnecessary—what the marshal felt more was disappointment and fatigue. After some gentle persuasion, he agreed to resign and expressed a wish to continue serving as the chairman of the Arctic Research Committee."
  russia_socialist_events.101.a: "A disaster was thus avoided."
  russia_socialist_events.332.c: "Ustinov's viewpoint can be described as genius."
  russia_news_events.8.d: "Boris Savinkov fell as a result. Due to the president's actions making the public and the military increasingly angry, large-scale protests erupted in Red Square, and amid gunfire echoing through the capital, Savinkov was shot by a member of the Socialist Revolutionary Party.\n\nIn the midst of chaos, the previously banned socialist parties rose in revolt, and people’s committees and workers' and peasants' soviets were established one after another across the country. With the broad mobilization of the Red Guards, the Provisional Government advanced with great momentum, and the remnants of the White Army in Petrograd and southern Russia scattered like birds and beasts.\n\nRussia seems to have become a socialist country overnight, which has had a profound impact on Europe and the entire world."
  russia_news_events.8.c: "The world revolution is already at hand!"
