 RUS_nat_land_reform_stage_8_desc:0 "最高纲领派的土地改革已经取得决定性成果。农村的混乱、迟疑与反抗逐步让位于新的组织形式，集体农庄、机械化生产与基层动员共同支撑起了一个更加稳固的社会主义农村。"
 RUS_nat_land_reform_stage_8_tractor_bonus_desc:0 "最高纲领派的土地改革已经取得决定性成果。拖拉机承诺的兑现进一步巩固了农民对新政权的信任，集体农庄、机械化生产与基层动员共同支撑起了一个更加稳固的社会主义农村。"
