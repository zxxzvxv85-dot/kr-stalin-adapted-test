 russia_socialist_events.353.d.coalition:0 "与布尔什维克的结盟最终撕裂了全俄罗斯劳工联盟。 那些对“共产主义分子”抱有显著厌恶情绪的右翼成员，在联盟内部早已丧失实际影响力。以唐恩为首的一批人最终选择集体辞去职务，宣布将重建俄国社会民主工党——试图在布尔什维克与社会革命党之间开辟出第三条道路。\n\n但显然，这“第三条道路”并没有走多远。唐恩派中的相当一部分人，在政治实践中与社会革命党日渐靠拢：其在议会中的投票倾向与社革党高度一致，地方组织层面甚至开始联合提名候选人、共享基层网络资源。\n\n值得庆幸的是，党内绝大多数干部更倾向于中派与左派立场，我们的组织力量并未因这一轮出走而受到严重削弱。"
 russia_socialist_events.353.d.rebellion:0 "$russia_socialist_events.353.d.coalition$"
 russia_socialist_events.353.a:0 "至少我们还可以仰仗我们的布尔什维克盟友。"
