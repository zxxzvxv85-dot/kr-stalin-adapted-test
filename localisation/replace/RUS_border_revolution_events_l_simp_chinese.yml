 RUS_future_foreign_policy_events.13.t:0 "波罗的海的布尔什维克们"
 RUS_future_foreign_policy_events.13.d:0 "除开俄罗斯本土的布尔什维克，还有相当多的共产党同志在帝国主义的统治下保持活动——在波罗的海，拉脱维亚共产党（布）始终如一。\n\n波罗的海大公国，这一帝国主义的畸形产物成立以来，波罗的海沿岸的工人和农民便被绑上了德意志容克与当地土豪劣绅的战车。土地被圈占，工厂被军管，任何反抗都被冠以“通共”之名。但压迫越深，反抗越烈，拉脱维亚共产党（布）自转入地下以来，从未停止活动——作为东墙内活跃的最后的布尔什维克们，他们始终在抵抗运动中保持着领导作用。\n\n如今，他们的代表已通过秘密渠道抵达莫斯科。他们带来的不仅是波罗的海工人的问候，还有一份请求——更多的武器、电台和干部。一旦时机成熟，起义将从里加开始，蔓延至整个波罗的海。"
 RUS_future_foreign_policy_events.13.a:0 "必将自由！"
 russia_socialist_events.183.t:0 "哈尔科夫事件"
 russia_socialist_events.183.d:0 "上周，哈尔科夫拖拉机厂钢铁工人的罢工演变成了混乱。起因是厂方在未事先通知的情况下，将工人每日口粮配给削减了三分之一，同时宣布延长工时两小时以“支援国防生产”。工人代表要求与厂方谈判，遭到拒绝。次日，罢工委员会成立，全厂一万两千名工人中有近八千人放下了工具。警方被派去平息抗议活动，抗议很快升级为暴力冲突。\n\n革命者迅速采取行动。斗争派和乌克兰共产党武装了钢铁工人，并做好了应对即将到来之攻击的准备。\n\n反动的乌克兰当局意识到形势严峻，决定出动军队。然而，主要的防御组织者并未选择正面迎击，而是在评估力量对比后，主动将骨干撤入地下，转入潜伏状态。\n\n革命者们在撤离前连夜召开会议，将骨干分成若干小组，分别潜伏进工厂、铁路和周边村庄，并留下了一套完整的联络暗号与接头地点。工厂、工人区、铁路枢纽——那些曾经公开活动的革命者，几乎一夜之间就从街面上消失了。对乌克兰当局来说，这显然不是一个好兆头。\n\n乌克兰政府次日发布通缉令，悬赏捉拿“在逃的舒姆斯基及其同伙”，并宣布哈尔科夫进入紧急状态。然而，他们搜遍全城，只抓到几个来不及撤离的外围成员。\n\n在政治保卫局的帮助下，斗争派领袖亚历山大·舒姆斯基已通过越过边境，于今日上午抵达察里津。他已向情报局递交了经费以及干部队伍申请。"
 russia_socialist_events.183.a:0 "为我们的同志兼兄弟两肋插刀也在所不辞！"
 RUS_future_foreign_policy_events.14.t:0 "戈梅利冲突"
 RUS_future_foreign_policy_events.14.d:0 "并不是所有白罗斯人都愿意屈从明斯克傀儡政府的统治。不知是出于对反动土地分配的愤懑，还是由于革命组织的鼓动，在白罗斯东部，相当多的当地居民参与进了声势浩大的游击活动中。\n\n戈梅利一带的森林与沼泽，成了这些游击小队最天然的掩体。他们大多是当地的小农、伐木工和铁路工人，手中没有像样的武器，却熟悉每一片泥沼和每一条林间小道。政府军的清剿纵队几次试图合围，都被他们借助地形甩脱。\n\n明斯克方面对局势的失控感到焦躁。他们一面增派兵力，一面发布告示，许诺“主动投诚者既往不咎，并分予土地”。然而响应者寥寥。政府军随后焚烧了几个“通共”的村庄，这反而把更多走投无路的农民推进了游击队。\n\n革命组织方面也与我们进行了几次像样的接洽。他们请求药品和电台——还有经验丰富的革命教官，毕竟他们总不能永远待在森林里。"
 RUS_future_foreign_policy_events.14.a:0 "接伏罗希洛夫同志，他又有活干了。"
