  russia_socialist_events.62.d: "[ROOT.RUSGetPlannedEconomyEventDesc]"
  russia_socialist_events.62.d_four: "尽管俄罗斯在二十年代取得了迅猛的工业发展，但就工业实力而言，我们仍是二流国家，尚有巨大的发展潜力。因此，尽管全俄劳联和社会革命党中的温和派表示反对，我们还是迈出了在经济中全面引入国家计划的第一步，以实现快速发展。\n\n我们现已建立了联邦计划委员会(Fedplan)，该委员会由工会代表和经济学家组成，负责监督第一个四年计划的制定和实施。我们的经济政策将主要遵循斯坦尼斯拉夫·斯特鲁米林和谢尔盖·杜布罗夫斯基的理论，两人都是各自领域内德高望重的人物，也都支持通过国家干预快速实现工业化。斯特鲁米林在分析萨文科夫的最高经济委员会时指出，该委员会遵循了合理的经济理论，但由于向资本家利益妥协，加上保卫联盟内部腐败猖獗，导致许多计划都未能落实。联邦计划委员会是一个兼具民主和技术官僚性质的机构，受代表大会监督，当局对该委员会寄予了厚望。\n\n第一个四年计划的重点包括彻底实现经济社会化、扩大重工业和军工业以应对即将到来的战争以及实现农业机械化。以此为基础，未来我们将建立起更加先进的工业体系。虽然基层经济仍相对自由，但由于工会是联邦计划委员会指令的主要执行者，因此委员会已迅速成立了监督工会的官僚机构。至于这一切能取得多大成功，仍需我们拭目以待。"
  russia_socialist_events.62.d_five: "尽管俄罗斯在二十年代取得了迅猛的工业发展，但就工业实力而言，我们仍是二流国家，尚有巨大的发展潜力。因此，尽管全俄劳联和社会革命党中的温和派表示反对，我们还是迈出了在经济中全面引入国家计划的第一步，以实现快速发展。\n\n我们现已建立了联邦计划委员会(Fedplan)，该委员会由工会代表和经济学家组成，负责监督第一个五年计划的制定和实施。我们的经济政策将主要遵循斯坦尼斯拉夫·斯特鲁米林和谢尔盖·杜布罗夫斯基的理论，两人都是各自领域内德高望重的人物，也都支持通过国家干预快速实现工业化。斯特鲁米林在分析萨文科夫的最高经济委员会时指出，该委员会遵循了合理的经济理论，但由于向资本家利益妥协，加上保卫联盟内部腐败猖獗，导致许多计划都未能落实。联邦计划委员会是一个兼具民主和技术官僚性质的机构，受代表大会监督，当局对该委员会寄予了厚望。\n\n第一个五年计划的重点包括彻底实现经济社会化、扩大重工业和军工业以应对即将到来的战争以及实现农业机械化。以此为基础，未来我们将建立起更加先进的工业体系。虽然基层经济仍相对自由，但由于工会是联邦计划委员会指令的主要执行者，因此委员会已迅速成立了监督工会的官僚机构。至于这一切能取得多大成功，仍需我们拭目以待。"
  russia_socialist_events.435.t: "工业现状"
  russia_socialist_events.435.d: "如果说农村的问题是土地，那工业的问题就是秩序。\n\n自革命以来，俄国的工业体系从未真正统一过。各地工厂在动荡中各自为政——有的依靠旧订单勉强维持，有的在投机商人的庇护下苟延残喘，还有更多的则干脆停工待毙。生产什么、生产多少、卖给谁——这些问题没有一个中央机构能够回答。\n\n结果是灾难性的。\n\n在乌拉尔，一座年产数万吨生铁的高炉因为缺乏焦炭而停产，而不到三百公里外的另一座焦化厂，却因为铁路调度混乱而将同样数量的焦炭堆在货场上慢慢风化。这样的事情不是个例，而是常态。各厂之间缺乏协调，信息不通、计划不连、运输不畅——整个工业体系像一台齿轮全部咬错的机器，每个部件都在转，但整台机器就是不往前走。\n\n更糟糕的是资源的流失。投机商人利用混乱的局势，将大量工业原料以极低的价格收购，再通过边境走私运往国外换取暴利。木材、矿石、甚至半成品的机床零件——这些东西本该用于国内的工厂建设，却变成了走私贩子口袋里的卢布。\n\n另一些资源则被浪费在毫无意义的生产上。有的工厂为了“完成指标”，大量生产市面上根本不需要的劣质产品；有的则重复建设同一类型的设备，而真正紧缺的机器却无人问津。生产的热情是有的，但方向是盲目的。\n\n而在这一切之下，工人的处境同样令人忧虑。停产或半停产的工厂里，工人拿不到足额的工资，甚至领不到口粮。大量技术工人被迫离开车间，有的流落街头，有的被投机商雇佣去做私活——原本应该建设社会主义的双手，正在被旧时代的残余一点点蚕食。\n\n这就是第一个五年计划必须面对的现实：不是从零开始，而是从混乱开始。计划的首要任务不是“建设”，而是“整理”——把散落各处的资源收拢起来，把各自为政的工厂纳入统一的轨道，把被浪费的每一吨煤、每一块铁、每一双工人的手，重新组织成一台能够真正运转的机器。"
  russia_socialist_events.435.a: "让我们开始工作吧。"
  russia_socialist_events.434.t: "俄共（布）参与第一个五年计划"
  russia_socialist_events.434.d: "第一个五年计划的制定工作并不只是联邦计划委员会内部的技术事务。随着全俄劳联左翼在政治斗争中取得决定性优势，俄共（布）的理论家、组织者与工会干部开始以前所未有的深度参与到计划编制之中。各地工厂委员会、铁路工会、矿业代表与红色经济学家被召集起来，围绕重工业布局、交通干线建设、农业机械化与国防工业扩张展开了连日争论。\n\n在许多旧官僚和温和派经济学家眼中，布尔什维克的设想过于激进，甚至近乎不顾现实。他们提醒说，俄罗斯仍处在战争、破坏与资本外逃留下的废墟之中，生产资料短缺，熟练工人不足，地方行政体系也远未恢复到足以承担全国性计划的程度。然而俄共（布）代表并不接受这种谨慎。他们认为，正因为俄罗斯仍然落后，才必须以更坚决、更集中的方式突破旧世界留下的枷锁。\n\n斯维尔德洛夫、加米涅夫、斯大林以及一批归国的布尔什维克干部都在不同场合强调：五年计划不是普通的经济政策，而是革命国家对历史的主动进攻。它既要把分散的工厂、矿山、铁路和农庄纳入统一节奏，也要把工人阶级重新组织成社会主义建设的先锋力量。计划的每一项指标，都必须服从于一个目标：让俄罗斯从被围困、被轻蔑、被反动派诅咒的失败革命废墟中，重新锻造成能够支撑世界革命的工业堡垒。\n\n最终，联邦计划委员会采纳了俄共（布）提出的大部分修订意见。第一个五年计划将以重工业、机械制造、能源开发与铁路现代化为核心，同时把工会系统纳入监督与动员体系。它将不会是一份温和的恢复方案，而是一份向整个旧世界宣战的建设纲领。"
  russia_socialist_events.434.a: "让机器的轰鸣声回答他们。"
  russia_socialist_events.436.t: "一五计划总结报告\n——全俄中央执行委员会特别会议"
  russia_socialist_events.436.d: "同志们：\n\n几年前，当我们提出第一个五年计划的时候，这个国家的工业还攥在谁手里？——分散在各处的旧资本家、投机商人和地方官僚手里。农业还攥在谁手里？——地主、富农和那些以“自由市场”为名行剥削之实的粮商手里。教育还攥在谁手里？——旧知识阶层手里，他们用文化壁垒把工农子弟挡在门外。\n\n今天，我们要回答一个根本性的问题：这几年，究竟改变了什么？\n\n一、生产关系的改造：从私人占有到全民所有\n\n五年计划的核心，不止是“建了多少工厂”——那只是表象。本质是生产资料所有制的根本变革。\n\n几年前，一座工厂即便挂着“国有”的招牌，其实际运行也常常被旧时代的遗毒支配：厂长可能是旧资本家出身，技术骨干可能是旧知识分子，工人在生产中没有发言权，产品流向被投机商人操控。那时的“国有”，只是名义上的。\n\n我们通过工厂委员会制度、工人监督机制和不断深化的阶级教育，一步步把这些工厂真正交到了工人阶级手里。工人不仅参与生产，更参与管理——生产计划由工人讨论、分配方案由工人表决、技术改进由工人提出。\n\n这不是温情脉脉的“劳资合作”，而是无产阶级对生产过程的实际掌握。\n\n农业领域同样如此。土地改革的意义，不在于“把地分了”——分地只是第一步。真正的变革在于：土地从地主和富农的私有财产，转变为由国家所有、由集体耕种的公共生产资料。集体农庄不是简单的“合在一起种地”，而是对农村生产关系的彻底重构。\n\n富农阶级作为一个阶级已经被消灭，贫农和无地农民第一次在土地上看到了自己的名字——不是作为佃农，不是作为雇工，而是作为土地真正的主人。\n\n这就是五年计划的阶级内容：生产资料从私人手中夺回，归还给创造它的人。\n\n二、阶级斗争的深化：计划与无政府状态的对立\n\n旧时代的工业是什么样？是无政府状态。每个工厂自己决定生产什么、生产多少、卖给谁。结果是：紧缺的物资没人造，过剩的产品堆满仓库，投机商人在混乱中大发横财。\n\n五年计划的意义，就在于用无产阶级国家的统一计划，取代了资本主义的无政府状态。这不是一个技术问题——这是一个阶级问题。\n\n为什么？因为计划本身就是对资产阶级“自由市场”的否定。当国家决定钢铁优先用于拖拉机厂而非奢侈品生产时，这是在用工人阶级的意志压过资本的意志。当国家决定将稀缺的机床分配给集体农庄而非私人作坊时，这是在用社会主义的生产目的取代资本主义的利润逻辑。\n\n这不是一场“经济调整”。这是一场无产阶级国家对资产阶级生产逻辑的系统性清算。\n\n三、上层建筑的革命：文化不再是特权\n\n教育改造的意义，从来不在于“让更多人识字”这么简单。旧时代的文盲率，是统治阶级维持统治的工具——不识字的农民无法读懂法律、无法计算地租、无法组织起来反抗。文化垄断，是阶级压迫最隐蔽也最坚固的一环。\n\n这几年，我们把学校开进了村庄，把夜校开进了车间，把电影放映队送进了最偏远的牧区。工农子弟第一次走进了高等教育的课堂——他们不是去“学习如何成为精英”，而是去“学习如何更好地为工人阶级服务”。\n\n旧知识阶层曾垄断着“什么是知识”、“谁有资格获得知识”的定义权。今天，这个权力正在被夺回来。一位在集体农庄干了二十年的老农，因为懂牲畜繁育被请去农业大学讲课——他不是“客座教授”，他就是最好的老师。一位在车间修了三十年机床的钳工，因为熟悉每种钢材的特性被调到技术学校编写教材——他不是“工人代表”，他就是最懂材料的人。\n\n这不是“文化普及”。这是文化领导权的转移。知识正在从少数人的垄断，变成全体劳动人民的共同财富。\n\n四、意识形态的建设：阶级觉悟的普遍提升\n\n五年计划最深远的变化，不在报表上，不在厂房里，而在人的头脑中。\n\n几年前，许多工人还把自己看作“出卖劳动力的人”；今天，他们开始把自己看作“国家的主人”。几年前，许多农民还在为“我家的地”发愁；今天，他们开始为“咱们农庄的收成”操心。几年前，一个不识字的农村青年可能一辈子走不出方圆五十里；今天，同样出身的年轻人正在读夜校、进培训班、学习拖拉机驾驶技术，甚至开始读列宁的著作。\n\n这不是“民族精神的觉醒”——那是资产阶级知识分子的说辞。这是无产阶级阶级意识的觉醒——是劳动者第一次意识到：他们不是历史的旁观者，而是历史的主体；他们不是被管理的对象，而是管理国家的主人。\n\n当集体农庄的庄员在社员大会上为一个决策投票时，当工厂的工人在车间会议上对生产计划提出修改意见时，当一名从前不识字的老农拿起《土地社会化法令》自己阅读时——在这些时刻，旧的意识形态正在土崩瓦解，新的阶级意识正在不可逆转地生长。\n\n这才是五年计划最大的成就：无产阶级，正在学会把自己组织起来。\n\n五、困难与教训：前进中的辩证法\n\n马克思告诉我们：任何变革都伴随着阵痛。五年计划也不例外。\n\n我们在集体化的过程中犯过操之过急的错误，在工业化中受过官僚主义的拖累，在基层执行中产生过命令主义的问题。有些地区富农分子伪装身份混入干部队伍，有些投机商人利用计划缺口继续倒买倒卖。\n\n这些不是“失败”的证据——恰恰相反，它们是阶级斗争的真实面貌。没有一帆风顺的社会主义革命。错误暴露出来，就是为了被纠正。困难横在面前，就是为了被克服。\n\n问题的关键在于：我们纠正了，我们克服了，我们学会了在斗争中不断总结经验。\n\n六、当前任务与未来方向\n\n第一个五年计划完成了。但斗争不会结束——生产关系的改造没有完成，意识形态的革命没有完成。\n\n我们的生产力还不够发达，我们的技术还不够先进，我们的工人阶级队伍还需要不断扩大和提升，我们的农村集体化还需要进一步巩固。\n\n这不是一条铺满红地毯的路。这是一条需要挽起袖子、磨破手掌、流汗甚至流血才能走完的路。但我们已经证明了：这条路走得通。\n\n无产阶级国家可以组织生产，可以改造农村，可以创造出一支崭新的工人阶级知识分子队伍，可以在一个曾经文盲占绝大多数的国家里建立起完整的社会教育体系。\n\n我们没有依赖任何“民族优越性”——那是反动理论家编造出来的神话。我们只依赖一条铁律：无产阶级一旦掌握了自己的命运，就没有什么力量能够阻止它创造历史。\n\n第二个五年计划已经在路上。那些还没建成的工厂、还没读上书的孩子、还没学会开拖拉机的村庄——他们都在等着我们。\n\n那就继续干。没有借口，没有退路，也从来不打算有。"
  russia_socialist_events.436.a: "全俄中央执行委员会"
  russia_socialist_events.437.t: "斯大林格勒拖拉机厂"
  russia_socialist_events.437.d: "“多快好省”——这是斯大林格勒拖拉机厂刻在厂门内侧的标语，也是每一名工人每天走进车间时最先看到的四个字。作为国内最早实现履带式车辆流水线生产的联合企业，该厂在和平时期以生产农用拖拉机为主，而在国防动员体系中，它随时可以快速切换至装甲输送车、牵引车及轻型履带式装甲底盘的批量制造。这种“平战结合”的模式，使工厂成为连接农村机械化与军队装甲化的关键枢纽。\n\n厂区沿伏尔加河支流展开，拥有铸造、锻造、冲压、热处理、总装五大车间，此外还有一条专门用于装甲板冷弯成型的生产线。传送带昼夜运转，将发动机、行动装置和车体分段依次送往总装工位。工人们实行三班轮换制，每班八小时，厂内提供免费的大食堂、装有热水的淋浴室以及配备基本药品的医务室。熟练技术工人可以申请厂属的简易公寓，家属随迁的还可安排至附近的工人子弟学校。日常生产中，每个班组面前都挂着一块“产量与良品率双竞赛”的黑板，每月综合评比第一的班组可获得集体奖金，并登载在厂报《红色履带》上。年度标兵则有机会去伏尔加河下游的疗养所休整两周。\n\n在五年计划中，斯大林格勒拖拉机厂被定位为“平战结合示范厂”。规划包括新建一座装甲板轧制车间、一条自动焊接流水线，以及一个用于测试履带车辆耐久性的环形试验道。计划要求工厂的拖拉机年产量在五年内翻一番，同时装甲车辆的快速转产能力也要从目前的一个月缩短至一周。为此，厂区还将扩建一座技工培训中心，并在工人住宅区增设一个带室内射击场的国防体育俱乐部。斯大林格勒拖拉机厂不仅为田野提供动力，也为前线输送盾牌——它用“多快好省”四字，诠释着一种朴素的工业化哲学。"
  russia_socialist_events.437.a: "“多快好省”地建设国防！"
  russia_socialist_events.438.t: "伊热夫斯克机械工厂"
  russia_socialist_events.438.d: "高质量的步兵装备是伊热夫斯克机械工厂的产业方针。作为国内历史最悠久的军工联合体之一，该厂长期专注于步枪、轻机枪、自动步枪及配套弹药的研发与生产。\n\n走进厂区，映入眼帘的是成排的精密机床和日夜不停的生产线。工人们实行三班轮换制，每班八小时，厂方提供免费的工人食堂、带暖气的集体宿舍以及厂属诊所。技术骨干还可申请分得一套简易住宅。日常工作中，劳动竞赛蔚然成风——每个车间都张贴着产量与良品率的红旗榜，优胜班组能拿到额外的奖金和假期疗养券。\n\n五年计划中，伊热夫斯克机械工厂被列为重点技术改造单位。规划中的扩建项目包括一座新的高精度冷锻车间、一座自动化弹药装配楼，以及一条用于测试新型自动武器的室内靶道。计划还明确要求工厂的产能将在计划期末提升至目前的四倍，同时为工人新增一座文化宫和一所技工学校。\n\n这座工厂不仅承担着为全军更新单兵武器的任务，也正逐渐成为培养新一代军工技术骨干的熔炉。"
  russia_socialist_events.438.a: "到了明年，每个士兵都能至少领到十支枪！"
  russia_socialist_events.439.t: "列宁汽车厂"
  russia_socialist_events.439.d: "以对外出口为主，通过高质量车辆载换取外汇，是列宁汽车厂的核心定位。作为国内最早面向国际市场的汽车制造企业，该厂专注于生产中型载重卡车、越野公务车及部分专用底盘，产品以坚固耐用、适应严寒气候著称。厂区内分布着冲压、焊接、涂装和总装四大车间，传送带昼夜不停。\n\n工人们实行两班轮换制，每班十小时，厂内设有平价食堂、职工浴室和倒班宿舍。熟练技师可享受厂属公寓分配，子女优先进入配套的托儿所和小学。每月根据出口订单完成情况发放绩效奖金，连续三个月达标的班组可获得前往黑海疗养院休假的奖励。\n\n五年计划中，列宁汽车厂被列为出口导向型重点企业。规划包括新建一条全自动冲压线、一座封闭式试车场，以及一个专门面向海外客户的整车包装与备件中心。计划要求工厂的整车年产量在计划期末提升至目前的三倍，其中出口占比不低于六成。同时，厂区将扩建工人文化宫、增设技工培训车间，并引入部分国外先进机床以提升零部件精度。列宁汽车厂不仅肩负着为国家换取外汇的重任，也正逐步成长为展示本国工业制造能力的一张名片。"
  russia_socialist_events.439.a: "向外展望的窗口。"
  russia_socialist_events.440.t: "坦克格勒"
  russia_socialist_events.440.d: "“廉价”，几乎是每一个参观完坦克格勒军工厂的参观者都会留下的印象。通过精进加工技术和广泛收集廉价材料，这座工厂在不牺牲性能的前提下，将坦克与装甲车辆的生产成本压缩到了令人惊讶的程度。其产品以结构简单、易于维修、适应大规模消耗战而著称，成为前线部队最可靠的“钢铁伙伴”。\n\n厂区横跨数平方公里，分为铸造、锻造、装甲焊接、总装和火炮五大车间。传送带与轨道车将毛坯件在各车间之间昼夜转运。工人们实行两班轮换制，每班十小时，厂内提供带暖气的集体宿舍、平价食堂和厂属诊所。关键技术工人可享受厂区内的简易家庭住房，其子女优先进入附属的工人子弟学校。日常生产中，每道工序都设有“废品率红旗榜”，当月达标的小组可获得额外半个月的工资作为奖励。每年夏季，厂工会组织优秀生产者前往附近的湖区疗养所休假一周。\n\n五年计划中，坦克格勒被列为重点扩产单位。规划包括新建一座大型冲压车间、一条全自动装甲板热处理线，以及一个用于测试坦克越野性能的专用试验场。计划要求工厂的坦克年产量在五年内提升至当前的三倍，同时将单车工时降低近一半。为配合扩产，厂区还将新建一所技工学校，并在工人住宅区增设一家电影院和一座体育馆。\n\n坦克格勒不仅承担着为全军提供主战装备的重任，也在“高性价比”这条道路上不断打磨自己的工艺哲学。"
  russia_socialist_events.440.a: "一支步枪换一辆坦克！"
