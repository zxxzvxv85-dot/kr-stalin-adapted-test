  RUS_first_five_year_plan_industrial_projects_desc_five: "联邦计划委员会将各地的工业、交通和资源开发项目集中纳入第一个五年计划的统一节奏。\n\n当前五年计划分数：§Y[?RUS_first_five_year_plan_score|1]§!\n当前阶段：§Y[?RUS_first_five_year_plan_stage|0]§!/§Y6§!\n下一阶段：[ROOT.RUSGetFirstFiveYearPlanNextStage]"
