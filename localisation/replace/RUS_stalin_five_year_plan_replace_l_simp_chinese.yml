  RUS_4_year_plan_desc: "[ROOT.RUSGetFirstPlanDesc]"
  RUS_4_year_plan_desc_four: "社会主义不依赖于市场机制，而是需要新的方式来扩充生产资料。我们将成立一个委员会，与经济各要素合作设定生产目标。这些目标将以四年为周期制定，并每年进行审查，以检查所有企业的生产力，确保其获得所需的投入，并在必要时调整。"
  RUS_4_year_plan_desc_five: "社会主义不依赖于市场机制，而是需要新的方式来扩充生产资料。我们将成立一个委员会，与经济各要素合作设定生产目标。这些目标将以五年为周期制定，并每年进行审查，以检查所有企业的生产力，确保其获得所需的投入，并在必要时调整。"
