  RUS_yakov_sverdlov_leader_desc: "§Y生于：§!§L1885年6月3日；俄罗斯帝国、下诺夫哥罗德省下诺夫哥罗德§!\n§Y背景：§!§L雅科夫·米哈伊洛维奇·斯维尔德洛夫出生在下诺夫哥罗德的一个犹太家庭。其父曾为地下革命组织匿藏武器，并始终支持子女的革命信仰。受此家庭氛围影响，斯维尔德洛夫在1902年加入社会民主工党，后来在党内分裂时选择支持列宁的布尔什维克。\n\n他曾参与1905年革命，随后遭逮捕并被关进叶卡捷琳堡的监狱。此后十年间，他辗转于牢狱与流亡之间，其间坚持研读马克思、列宁和考茨基等人的著作。二月革命爆发后，他抓住机会返回彼得格勒，迅速成为布尔什维克的核心人物。在十月革命和随后的内战中，他发挥了不可或缺的作用，因行事果决而被党内同志和敌人共同冠以“黑魔鬼”的绰号。\n\n列宁遇刺后，斯维尔德洛夫成为布尔什维克领导层“三驾马车”中的首要人物，并最终出任流亡巴黎的俄罗斯共产党（布尔什维克）的领导者。他是一位至死不渝的列宁主义者，曾尖锐批评法国的各个政党和工会罔顾革命团结、一意争夺权力，致使该国社会主义正朝着“官僚宗派主义”蜕变。与之形成鲜明对比的是布尔什维克内部的精简高效——在斯维尔德洛夫的改组下，季诺维也夫领导的分裂派别被开除出党，留下的则是一套近乎完美的革命机器。\n\n社会主义俄罗斯重建后，斯维尔德洛夫将其政党定位为真正的革命政党。在他的设想中，布尔什维克将继续高举列宁主义的火炬，肩负起引领革命前行的使命。§!"
  russia_socialist_events.330.d: "人民工业与贸易部在总理与内务部长之后，稳坐第三把交椅。其声望与实权皆不容小觑，对经济政策的走向更有着举足轻重的话语权。\n\n若由我们自主定夺，斯坦尼斯拉夫·斯特鲁米林这般笃信计划经济的学者，自是最理想的人选。但执政联盟断难接受他。右翼盟友转而力荐亚历山大·芬恩-叶诺塔耶夫斯基——一位混合经济路线的拥护者。\n\n执政联盟内部，还有两位来自党外的候选人。社会革命党推举的鲍里斯·卡姆科夫，更像是工人联盟摆出的善意姿态，而非真正执掌经济方略的人选。布尔什维克则提名了尼古拉·布哈林——这位以激进著称的党内经济理论家，正构思着一幅彻底重塑全国经济肌理的蓝图：通过行政强制手段，将社会分工按照无产阶级政权的意志重新锻造。"
  RUS_sergey_kirov_sic_desc: "§Y生于：§!§L1886年3月27日；俄罗斯帝国、维亚特卡省乌尔茹姆§!\n§Y背景：§!§L谢尔盖·米罗诺维奇·基洛夫，原名谢尔盖·科斯特里科夫，生于维亚特卡。早年丧父，青年时期即陷入俄国农村深重的贫困。1904年，他在托木斯克加入俄国社会民主工党，在斗争中迅速成长为罢工运动的组织者和战斗骨干。作为一名职业革命者，他在弗拉季高加索从事地下活动，其间亦对登山、诗歌与戏剧产生了浓厚兴趣。\n\n十月革命后，基洛夫果断投身布尔什维克阵营。内战期间，他以充沛的精力与非凡的个人魅力，成为政治舞台上迅速崛起的新星。他曾主持阿斯特拉罕革命委员会，为该地区战时秩序的维持与资源调配发挥了关键作用。\n\n1921年，他曾与“整合运动”的同志们在白色俄罗斯境内开展地下抵抗，最终被迫撤离。在法国的流亡生涯中，他坚定捍卫党的总路线，积极拥护并参与党中央发起的“清党”行动，在其中发挥了重要作用。这进一步巩固了他在党内的地位与声望。\n\n社会主义俄罗斯重建后，凭借着出色的组织能力，他迅速成为了列宁格勒群众的宠儿，可以说，他目前已是布尔什维克党内最受欢迎的同志之一。§!"
  KR_prince_of_petrograd_sic: "列宁格勒之子"
  KR_prince_of_petrograd: "列宁格勒之子"
  russia_socialist_events.33.d: "被告：约瑟夫·维萨里奥诺维奇·斯大林\n\n指控：五十五起谋杀案\n\n二十年前，克拉斯纳亚戈尔卡（红丘）堡与谢拉亚洛沙季（灰马）炮台的驻军发动武装叛乱，企图以武力推翻革命政权。叛乱由中尉N·M·涅克柳多夫领导，其本人及部众多为社会革命党人。当时城市深陷饥荒，社会革命党人却占据军事要塞组织哗变，城市防卫司令I·V·斯大林不得不下令恢复秩序。\n\n叛乱者据守堡垒顽抗，战斗持续四天。布尔什维克部队最终攻克堡垒，平定叛乱。依据人民委员会通过的战时法律，政委N·M·拉津奉命对五十五名叛乱首要分子执行战时处决，另有一些人在战斗和混乱中下落不明。斯大林下达的命令是对武装叛乱的军事处置，针对的是公开叛变的军人，而非普通民众。\n\n庭审中，控方试图将这次平叛行动描绘成“谋杀”。关键证人拉津同志的证言恰恰证明，斯大林的命令以人民委员会法律为依据，是在战时条件下对叛军的合法处置。斯大林同志在庭上镇定自若，毫不回避自己曾下令平叛。他的辩护清晰而果断：当时正值战时，部属已经叛变，依照人民委员会通过的法律，采取军事手段镇压叛乱完全合法合规。\n\n控方援引新颁布的《反对白色恐怖正义法》，企图以事后法律追究二十年前的合法平叛。这种以新法追溯旧事的做法在旁听席上引发争议。控方最后表示，念及斯大林对工人阶级事业的贡献，愿将刑罚减为十年苦役。\n\n然而，法庭最终未采纳控方意见。经审理认定，斯大林同志下达的命令完全符合人民委员会通过的战时法律，是对武装叛乱的必要军事处置；控方以事后颁布的法律追究二十年前的行为，不具有法律效力。法庭据此宣判斯大林同志无罪。"
  russia_socialist_events.33.c: "真是一步臭棋……"
  russia_socialist_events.330.e: "让布哈林同志来重塑我们的经济。"
  russia_socialist_events.335.d: "艺术家是人类灵魂的工程师。随着革命的到来，俄罗斯人民的灵魂需要进行一场根本性的改造。人民文化部的主要职责，在于向群众传播党的主张，灌输社会主义价值观，并对反革命文化予以打击。\n\n俄罗斯并不缺乏怀有理想的文化工程师。亚历山德拉·柯伦泰主张彻底重塑整个俄罗斯社会，废除家庭与父权制度；伊万·格龙斯基则致力于创造一种新型的社会主义英雄文化。社会革命党方面推荐了电影组织者兼该党宣传家鲍里斯·马尔金。然而，与会成员显然更倾向于布尔什维克资深代表米哈伊尔·加里宁——其共产主义教育理念备受关注。"
  russia_socialist_events.335.a: "柯伦泰的热情值得肯定。"
  russia_socialist_events.335.b: "格龙斯基的构想更具现实基础。"
  russia_socialist_events.335.c: "马尔金是更为务实的选择。"
  russia_socialist_events.335.e: "加里宁是公认合适的人选。"
  RUS_iosif_stalin_high_command_desc: "$RUS_iosif_stalin_leader_desc$"
  russia_flavour_events.55.d.soc: "布尔什维克在内战中失败后，历任政府都将俄国社会主义者打成了叛徒。从失败的那一刻起，社会主义者们就开始互相指责，试图找出责任所在。孟什维克认为，整场革命从一开始就是一个无政府主义错误，在落后的俄国，唯有在共和革命中作为社会主义反对派的纲领才是可行的。左翼社会革命党、无政府主义者和一些布尔什维克投降者认为，革命本身是值得庆贺的，但被布尔什维克掌权时的过火行为、对农民的背叛、血腥的红色恐怖和在《布列斯特-立托夫斯克条约》中对德国人投降所扭曲。\n\n面对诸如此类对十月革命的抹黑与诬陷，投机派与摇摆分子都纷纷作鸟兽散，只有最坚定、最坚强的布尔什维克始终坚持捍卫革命的正统性与正当性，同时谴责了社革党对阶级革命的背叛。他们相信，十月的失败不过是革命的低潮，浩浩荡荡的历史之风终有一日会扫尽这些枯枝败叶，俄国革命也将随之迎来新生。\n\n在这种背景下，社会主义运动陷入了混乱。他们遭到白军的迫害，四分五裂，希望渺茫。一些人加入了激进民主党，并严格采取改革立场，试图通过妥协换取一线生机。另一些人则继续与白匪军展开殊死斗争，保护人民免受斯沃博达派暴徒的伤害。也曾有许多人试图谈判妥协，建立一种能够统一当下敌对各派的俄罗斯式社会主义——但如今，这一切的纷争都迎来句号，涅槃重生的布尔什维克证明了自己的正确性——历史潮流势不可挡，"
  russia_flavour_events.55.a: "一切权力归苏维埃！（Vsya vlast Sovetam!）"
  russia_socialist_events.300.t: "召集代表大会"
  russia_socialist_events.300.d.radsoc: "衰败的俄罗斯共和国机构已成废墟。如今，该国大部分地区正由苏维埃和工会的临时革命委员会以及村庄集体管理。没有理由保留萨文科夫独裁改革的任何内容，纳博科夫的议会制也不适合工人俄罗斯。因此，必须起草一部新宪法，并按照临时总统玛丽亚-斯皮里多诺娃的法令，举行自由选举。\n\n不过，我们也已采取了预防措施，以防任何反动派死灰复燃。任何保卫联盟、俄罗斯统一大会或与其结盟的组织成员在刑满释放或被人民法院宣判无罪之前，不得参与投票。这也适用于那些声称受到胁迫或出于投机而加入斯沃博达派组织的人。此举立即牵连了俄罗斯政坛右翼和中间派的大部分成员。此外，投票应由工人委员会组织，选举权本质上主要限制在工人和农民内部。\n\n不出所料，代表大会五分之四以上的席位都属于社会主义政党，其中社会革命党获得了大约一半的选票，布尔什维克和全俄劳联则平分秋色。此外还有许多其他小党派，激进民主党和立宪民主联盟也获得了一些席位，但他们只是昔日的幽灵罢了。"
  russia_socialist_events.300.d.syndie: "$russia_socialist_events.300.d.radsoc$"
  russia_socialist_events.300.a: "人民已经发声。让我们开始吧。"
  russia_socialist_events.441.t: "工人的革命联盟？"
  russia_socialist_events.441.d: "尽管列宁已不在世，但他的党依然保持着可观的影响力——议会中五分之一的席位便是明证。\n\n这促使全俄劳联的元老们开始认真考虑与布尔什维克组建执政联盟的可能性，毕竟只有这样才能在议会中获得多数席位，确保革命成果不被旁落。\n\n面对票数不足的困境，以及党内对与社会革命党合作的普遍不满，老唐恩选择了沉默。而加米涅夫与列维茨基则达成一致：与布尔什维克结盟百利而无一害，既能弥合孟什维克与布尔什维克之间的历史裂痕，也有助于未来执政的平稳推进。\n\n为显示诚意，党内临时选举中，曾有过布尔什维克背景的列夫·加米涅夫被提名为主席候选人。消息传出后，布尔什维克方面未立即表态，但也没有公开反对——这种沉默本身就被劳联内部视为默许。提名是否最终通过，将取决于两党后续的私下交涉，但至少这一步已经迈出。"
  russia_socialist_events.441.a: "工人携手，胜利不愁。"
  RUS_vst_bolshevik_electoral_alliance_tt: "§r布尔什维克§!和§r全俄劳联§!已组成事实上的选举联盟。"
  russia_socialist_events.301.d: "争论当即开始。前克宫元老院人山人海，但混乱基本仍在可控范围之内。只有鲍里斯·卡姆科夫同志负责指挥人群，他肩负着维持大厅秩序的艰巨任务。\n\n未来宪法的许多条款均轻松达成了一致，包括社会主义建设、俄罗斯社会主义联邦共和国宣言、宗教和语言的绝对自由，以及由当地选举产生的工农苏维埃统治等……但当涉及细节时，代表大会随即陷入了无穷无尽的争论。\n\n布尔什维克联合全俄劳联内的共产主义者，重拾了“一切权力归苏维埃”的基本要求。许多社会革命党人，尤其是最高纲领派，对此表示同意。而温和派则要求布党解释清楚：“一切权力”到底意味着什么？\n\n实际上，某种形式的全国代表大会仍将存在，但必须明确代表大会的性质，否则便会因条文模糊不清而诞生新的独裁政权。代表大会已被某些人批评为隐秘议会主义，更有甚者称其为自由主义。\n\n能否像法国那样设立工会院？能否设立地区代表院？甚至有人提议建立三院制。政府将如何与代表大会和苏维埃互动？能否投票罢免政府？\n\n一波三折后，出现了三份势均力敌的方案。虽然天色将晚，但代表们仍十分激动，希望能将方案付诸表决。“苏维埃”方案没有对国家机构做出过多规定，并赋予了苏维埃选举产生的代表大会近乎无限的权力，可以根据需要建立和废除国家机构。“联邦”方案则引入了更多的制衡机制，包括保证地区和工会的代表权。第三种混合方案也摆上了台面，试图协调宪法保卫措施和不受限的苏维埃民主。"
  russia_socialist_events.301.a: "一切权力归苏维埃！"
  RUS_const_left_option_tt: "第97条\n1）苏维埃与工会代表大会是俄罗斯社会主义联邦共和国的立法机构。\n2）代表大会由苏维埃在普选的基础上选举产生。\n\n第98条\n代表大会的代表组成比例为：每2.5万选民产生一名县苏维埃代表，或每12.5万选民产生一名省苏维埃代表。\n\n如此规定很可能使§r全俄劳联§!—§Y布尔什维克§!联盟赢得代表大会多数。§r全俄劳联§!中的§o左派§!支持该提案。"
  russia_socialist_events.302.d: "不久后，代表大会开始就我们新生的共和国权力本质为何展开讨论。会中主流观点认为，没人想再受一次1918年的罪了，那时俄罗斯压根凑不出一个合法的临时政府，布尔什维克只能在动荡中处理问题，最终的结局也有目共睹，因此关于政府权力的法制化得到了广泛认可。\n\n但代表们在政府事务上的意见分歧要大得多。反对中央集权的一方希望完全向代表大会负责的行政权力得到削弱。这会让独揽权力变得更加困难，但也可能直接导致行政机关没法下任何决断。从另一方面来说，政府必须能在无法召开代表大会会议时便宜行事，许多人还担心若没有强大的中央行政机关存在，反革命势力的抵抗力量将变得更加强大。"
  russia_socialist_events.303.d: "共和国在初诞之时混乱不堪，许多社会主义者还没加入任何派系，一些席位也在罢免选举中多次易主。但在宪法通过后，选举制度逐渐稳定了下来。很多代表继续在苏维埃与工会代表大会中履职。许多老一辈的社会主义者看到人民可以携起手来，自由地决定事关自己生活的方方面面，在回想起1917年的光辉时刻时总是泪眼婆娑。经受了这么多苦难和迫害，工人阶级终于再次获得自由。\n\n新一届代表大会的首轮投票自然是主席（Premier）选举，当选者将成为象征性的国家领袖，作为男主持者（chairman）或女主持者（chairwoman）主持代表大会会议（鉴于斯皮里多诺娃获选概率之大，有必要提及这点）。事无巨细皆置身其中，建言献策以影响政局，这便是主席真正的权力所在。预计会有一位资历老且受敬重的人物胜选。计票尚未结束，但看起来有很多人支持列夫·加米涅夫和玛丽亚·斯皮里多诺娃。"
  russia_socialist_events.303.b: "试看星星之火，行将燃成熊熊之焰！"
  russia_socialist_events.304.d: "革命联盟赢得选举后，加米涅夫主席的首要任务便是组建一届足以稳定局势的联合政府。然而，代表大会否决内阁最初提案的那一刻起，分歧便彻底暴露出来——劳联内部列维茨基的支持者、共产主义激进派、唐恩派、布尔什维克代表以及社会革命党人各执一词，吵得不可开交。要凑出一届能让各方都勉强接受的政府，远比革命本身更棘手。\n\n各方都紧盯着权力分配的每一寸得失。联合政府内部，社会革命党和布尔什维克已经在互掐脖子。而劳联内部，左派与右派也在互相掣肘。列维茨基所领导的中派虽对加米涅夫的妥协策略表示理解，但也一再提醒他：让步应当有限度，毕竟他们是为实现列维茨基的政治构想而来，而非为他人作嫁衣。"
  russia_socialist_events.304.a: "相信友谊的力量吧，让季诺维也夫上。"
  russia_socialist_events.304.b: "新路线理论值得尝试，支持列维茨基。"
  russia_socialist_events.304.c: "布尔什维克的斯大林总书记或许是个好开始。"
  RUS_kamenev_sic_zinovyev_delayed_tt: "完成§Y全俄罗斯劳工联盟§!国策后，§Y格里戈里·季诺维也夫§!将被任命为二把手。"
  RUS_kamenev_sic_levitsky_delayed_tt: "完成§Y全俄罗斯劳工联盟§!国策后，§Y弗拉基米尔·列维茨基§!将被任命为二把手。"
  RUS_kamenev_sic_stalin_delayed_tt: "完成§Y全俄罗斯劳工联盟§!国策后，§Y约瑟夫·斯大林§!将被任命为二把手。"
  russia_socialist_events.442.t: "加米涅夫上台"
  russia_socialist_events.442.d: "全俄罗斯劳工联盟的组织工作已经完成，革命联盟在代表大会中的多数地位也随之稳固。经劳联中央委员会与布尔什维克代表团确认，列夫·加米涅夫正式接过主席职务，并依照组阁时达成的安排，提名自己的副手。\n\n新政府的名单即将公布。如今，加米涅夫必须证明，这个横跨劳联、布尔什维克与其他革命派别的联盟不仅能赢得选举，也能真正治理俄罗斯。"
  russia_socialist_events.442.a: "加米涅夫主席，请开始工作吧。"
  RUS_iosif_stalin_sic: "$RUS_iosif_stalin$"
  RUS_iosif_stalin_sic_desc: "$RUS_iosif_stalin_leader_desc$"
  RUS_stalin_general_secretary_sic: "钢铁之心"
  russia_socialist_events.12.t: "《关于过去无产阶级革命的提纲》"
  russia_socialist_events.12.d: "第一次内战终结时，所有希望随之破灭。\n\n此后，反共迫害较之沙皇时代有过之而无不及——数十万名工人被枪决或死于集中营。流亡法国的俄国社会主义者，连同残存于国内的同仁，共同陷入一场严峻的生存性质疑：怎么办？\n\n红色流亡者的著述大量涌现，其间逐渐形成两种思想派别。其一以雅科夫·斯维尔德洛夫、米哈伊尔·加里宁等人为代表，认为内战失败并非共产主义者之过，而应归咎于实际操作中未能落实的政策，以及内部投机分子的背叛。斯维尔德洛夫与老布尔什维克们坚持正统马克思列宁主义，并长期通过与“整合运动”的关联，在白色俄罗斯境内争取势力。\n\n斯维尔德洛夫曾有一著名论断：法国各政党与工会无视革命团结，相互争夺权力，致使其社会主义国家正在蜕变为“官僚宗派主义”体制。正统共产主义者实际上反对所谓制度性民主——这不过是资本主义的附庸——而主张更为广泛的民主生活与民众参与。\n\n流亡者中的另一思想流派兴起于二十年代，主要由亲孟什维克思想家构成。列夫·加米涅夫于1924年在狱中撰写的小册子《关于过去无产阶级革命的提纲》中指出，蔑视团结是俄罗斯左派的主要错误。加米涅夫认为，1919年法国革命印证了多面向革命理念的可行性——即社会各阶层通过革命政党、工会及其他无产阶级组织合力推进革命，二月革命正是循此途径取得成功；然而，俄罗斯左翼始终不愿放弃对白军政府的幻想，迫使布尔什维克不得不采取更为严厉的镇压手段。\n\n加米涅夫的理论虽获得俄国社会主义者的广泛接受，却在流亡团体内部多被视为修正主义。基于这一理论，弗拉基米尔·列维茨基提出了“共产主义综合”的构想，其核心在于：为避免堕入暴政，未来的俄罗斯共产主义必须作为各种社会主义观点的综合而存在，且不容任何团体将其意志强加于民主选举产生的苏维埃之上。在实践层面，列维茨基始终致力于联合各派俄国社会主义者，以构筑跨越布尔什维克—孟什维克旧有分裂的人民阵线——他最终通过组建全俄罗斯劳工联盟，实现了这一目标。"
  russia_socialist_events.31.t: "俄罗斯共产党"
  russia_socialist_events.31.d: "在雅科夫·斯维尔德洛夫与约瑟夫·斯大林的统率之下，老布尔什维克的骨干已在俄罗斯大地重新站稳阵脚。\n\n尽管选举前路尚未明朗，革命宿将伏龙芝的讲话却已在彼得格勒的群众集会上激起层层回响。他向俄罗斯民众详尽陈述了自己与战友们在各地辗转中所领悟的共产主义真谛——自新法兰西的法伦施泰尔，至红色伯明翰，再到巴塔哥尼亚草原上的浴血交锋。\n\n这些亲历，直接催生了俄国布尔什维克共产党新政纲——《怎么办？》。这份文件揭露了一场伪革命的实质：革命之后，自由派与资本家依旧逍遥法外，而所谓的“工人”代表，则露出其双重面孔。杜马中那些“香槟社会主义者”，以及二十年来在文学沙龙里空耗光阴的社民党人，早已与真正的社会主义道路背道而驰。\n\n至于斯皮里多诺娃？俄罗斯人民绝不可被蒙蔽——当年，不正是这些追名逐利的叛卖者，导致了革命的分崩离析吗？\n\n在当年，只有列宁真正关心过你们，而现在，也只有列宁的追随者依然在乎你们！"
  russia_socialist_events.31.a: "这些列宁的学生们还能掀起什么风浪？"
  russia_socialist_events.4.t: "工人政党的崛起"
  russia_socialist_events.4.d: "在经历了长期的非法查禁和政治迫害后，俄罗斯的社会主义者终于可以自由地组织政治活动了。尽管大多数社会主义者加入了列维茨基领导的全俄劳联，或继续忠于社会革命党的事业，但仍有许多小型政党陆续成立。\n\n在“旧共和国”政党中，唯一仍保有影响力的是泽勒领导的社会主义民主同盟。社民盟主要是遭受过大幅削弱的激进民主党重组而成，激进派离开后，其吸纳了一些来自右翼的新成员，他们希望通过该党推动更保守或温和的议程。\n\n另一个重新崛起的老牌政党是复兴的俄罗斯共产党（布尔什维克），其中央委员会在斯维尔德洛夫的领导下从流亡中回归。然而，这个党派的力量已远不及当年的辉煌时期。托姆斯基以及其他涉足俄国工会主义运动的布尔什维克没有回归，而是选择加入全俄劳联以寻求更大的政治影响力，这进一步削弱了布尔什维克的力量。但布尔什维克并非不受欢迎，时至今日，他们仍然在激进工人和贫农中享有很大的影响力。为限制布尔什维克的发展，各政党间达成了一项非正式协议，避免让布尔什维克们接触关键权力职位。\n\n与此同时，还有数十个围绕左翼知名人物或边缘意识形态（如无政府主义、妇女权益）成立的小党派。这些小党派和独立议员中还包含大量并非真正信奉社会主义、只是在表面上追随的成员。虽然这些小党派单独影响有限，但确实在代表大会中组成了一个相对庞大的少数派集团。"
  russia_socialist_events.4.a: "一团乱麻......"
  russia_socialist_events.9.t: "改头换面的布尔什维克们"
  russia_socialist_events.9.d: "内战尘埃落定后，吸取教训的布尔什维克党组织已面目全新。在斯维尔德洛夫的锐意整肃之下，庞大的党机器被削枝强干，化为精悍高效的政治利器，而那些“不可靠分子”则大多选择了自行退场。\n\n他们中的大部分人转而汇入全俄劳工联盟，并在列夫·加米涅夫的引领下，构成了该组织内部的左翼一脉。加米涅夫战后幸免于死刑，却难逃十年铁窗之苦——或许正因如此，他已成为革命后俄国最具声望的前布尔什维克，亦为俄罗斯共产主义的未来铺设了一套理论蓝图。平心而论，全俄劳工联盟之所以能够屹立不倒，全赖列维茨基与加米涅夫二人苦心孤诣，收拢俄国社会民主工党的旧部，横亘于布尔什维克与孟什维克之间的那道鸿沟，也因他们而被勉强弥合。\n\n而在全俄劳联之内，还盘踞着另一派前布尔什维克，由格里戈里·季诺维也夫之类的机会主义者组成。季诺维也夫早在1918年便因革命策略分歧而与斯维尔德洛夫分道扬镳，其后他所创建的“俄罗斯共产主义工人党”（RKTP）虽昙花一现，终究被整合进全俄劳联左翼的版图之中。\n\n但显而易见，季诺维也夫的野心远不止于充当全俄劳联内部的一个小派系。在现实政治议题的交锋中，他与加米涅夫的共产主义温和派之间始终存在着深刻的裂痕。为了扫清未来的潜在障碍，他已悄然着手在布尔什维克党内重新培植自己的影响力。"
  russia_socialist_events.9.a: "列宁的遗产已四分五裂。"
  russia_socialist_events.194.t: "白军蛇首"
  russia_socialist_events.194.d: "俄罗斯弥漫着内战的气息。新社会主义政府在莫斯科颁布第一批法令时，俄国的大部分地区仍是一片混乱。但这并不是1917年那种一团乱麻的混乱，当时俄罗斯处于无政府状态，有枪便是草头王。如今，大多数公务员似乎认为当局足够合法，因此并未积极抵抗，仅在某些地区发生了一些零星的武装叛乱。临时总统的保证则平息了一些紧张情绪，许多人甚至抱有谨慎的希望，新政府看起来更像1917年胎死腹中的临时政府。\n\n以米哈伊尔・德罗兹多夫斯基为核心的最大军事阴谋也已败露，这位将军随即被捕入狱。在白军主力消亡后，仍有许多驻军部队的军官团倾向于抵抗，但绝大多数普通土兵和士官并不愿意拿起武器反抗新的革命政府，反而在许多地方逮捕了他们曾经的长官。在亚历山大·华西列夫斯基将军的牵头下，共28名年轻将领联名发表了一封广为流传的信件，他们在信中承认了新政府，呼吁军队保持克制并要求组织自由选举。\n\n前陆军总长和一些高级军官因涉嫌参与萨文科夫政权的罪行而锒铛入狱。一些人成功逃亡，少数人在拒捕后死亡。在某些情况下，还爆发了小规模的冲突。内战前夕，我们的安全部门成功抓获了邓尼金、弗兰格尔、德罗兹多夫斯基和库捷波夫，马尔科夫仍然在逃。随着彼得格勒和察里津相继解放，成建制的反动军队已被粉碎，少数白军顽固势力也被相对有效地清除。"
  russia_socialist_events.194.a: "我们绝不会让白军有机可乘。"
  russia_socialist_events.332.d: "在工人联盟内部，围绕如何破解“农业问题”，各方分歧尖锐。\n\n社会革命党人早已跃跃欲试——他们素来自诩农民的守护者，平心而论，全俄也少有政党能像社革那样，对农村实际有如此深厚的认知。斯皮里多诺娃的丈夫伊利亚·马约罗夫自然成为首要人选。这位务实的农业经济学家自称“农民共产主义者”，坚持认为俄国农民无法被强行推入社会主义，只能依靠物质条件的渐进成熟来过渡。\n\n与之针锋相对的是谢尔盖·杜布罗夫斯基，他代表着全俄劳联多数成员的意见，主张以强制手段打破农村旧有格局，通过大规模工业项目和省级城市扩张，迫使农业跑步进入现代化。\n\n然而，还有第三位候选人——社会革命党最高纲领派领袖阿列克谢·乌斯季诺夫。作为党内极左翼，他提出“集体农庄”这一新型农业生产形态，认为唯有通过这种过渡形式，才能使农村摆脱饥饿与贫困。或许，他的方案才是真正的周全之策。"
  russia_socialist_events.421.t: "布尔什维克复兴"
  russia_socialist_events.421.d: "在加米涅夫的周密协调和布尔什维克自身强大的组织能力作用下，重整旗鼓的布尔什维克党迅速重掌国家权力中枢。越来越多的党员被安插或选举进入政府的关键岗位，党的政治纲领也在社会各阶层中获得了比以往更广泛的认同。公开层面上，全俄劳联通过与布尔什维克党结成事实上的执政联盟，暂时稳住了局面，为党的执政提供了必要的合法性支撑。\n\n而在权力体系的暗面，由加米涅夫、斯维尔德洛夫和斯大林组成的“革命三人团”则定期会晤，秘密讨论党的长远走向。三人一致认为，当前的社会主义共和国仍远未彻底清除资本主义的遗毒——经济领域里，一批手握实权的“老厂长”依然沿袭旧式管理，抵制新的生产秩序；地方行政系统中，大量前朝留用的官僚依旧阳奉阴违，甚至在基层形成独立的小利益集团。\n\n经过数次闭门磋商，三人为布尔什维克接下来一段时期定下了总体路线：在不触动现行国家架构的前提下，全力渗透和扩张党在各领域的实际影响力——包括加强工会中的党小组、向地方苏维埃输送可靠的干部、控制舆论宣传工具，并秘密建立应急指挥网络。同时，他们也开始着手拟定“二次革命”的预案，一旦时机成熟，或当旧势力出现明显动荡时，即可迅速发起自上而下的清洗与重组，彻底扫除一切阻碍社会主义深化的因素。"
  russia_socialist_events.421.a: "欢迎加入，同志。"

  RUS_guide: "§M斯大林 - 逆转十月革命§!（§r共产主义§!）\n£white_dot 完成国策§Y全俄罗斯劳工联盟§!时，俄罗斯所有国策时间会自动减少§G7天§!；在该国策的选举过程结束后，保证§o共产主义者§!关系大于§Y7§!，且§r国际主义者§!团结度不大于§Y3§!。完成国策后等待一天即可触发§Y加米涅夫上台§!事件，此时§Y第一个四年计划§!会变为§Y第一个五年计划§!，完成国策§Y第一个五年计划§!后，所有相关工业决议都会为§Y第一个五年计划§!追加加成。完成国策§Y马克思主义教育§!后会解锁§Y教育改革§!，完成国策§Y与最高纲领派谈判§!后会解锁§Y土地改革§!。\n£white_dot 按照§r全俄劳联§!左线游玩，在完成国策§Y布尔什维克豪赌§!之前，确保满足以下要求：\n - 流亡的社会主义将领已回国。\n - 在事件§Y克拉斯纳亚戈尔卡案件§!对斯大林的审判中选择最后一项“不过，他做得对”。\n - 已经完成国策§Y设立国家军事委员会§!。\n若满足全部要求，在进行国策布尔什维克豪赌后不久便会触发斯大林与斯维尔德洛夫密谋推翻季诺维也夫和全俄劳联的事件链，依次选择“季诺维也夫必须被推翻”、“我想他们会被我说服的”，针对季诺维也夫的政变便能成功，在随后的事件中选择“斯大林同志将带领我们走向胜利”，约瑟夫·斯大林便可以上台。\n£white_dot 在二战中击败德意志帝国后，你将能成立§o苏维埃社会主义共和国联盟§!。\n\n§M萨文科夫 - 各民族的牧羊人/世界的救星/思想统治原则§!（§n国家民粹主义§!）\n£white_dot 让萨文科夫政权的§C民众愤怒§!保持在§R8§!以下，且§P军方愤怒§!保持在§r10§!以下，从而维持统治。\n£white_dot 要进入§M各民族的牧羊人§!子路线，需要在权力平衡中偏向协作派，并在事件“菲洛年科拜会元首”中任命菲洛年科。\n£white_dot 要进入§M世界的救星§!子路线，需要在协作派与思想统治派之间不偏不倚。\n£white_dot 要进入§M思想统治原则§!子路线，需要在权力平衡中偏向思想统治派，并在事件“萨维茨基拜会元首”中任命萨维茨基。\n\n§M共和国 - 激进民主党/右翼社会革命党/立宪民主联盟/全俄罗斯爱国党§!（§S社会民主主义§!/§l社会自由主义§!/§m市场自由主义§!/§c社会保守主义§!/§g威权民主主义§!）\n£white_dot 在事件“接替科尔尼洛夫”中，任命安东·邓尼金为陆军总长。\n£white_dot 让萨文科夫政权的§P军方愤怒§!保持在§O5§!以下的同时，让§C民众愤怒§!达到§R8§!及以上；或直接让§P军方愤怒§!达到§R8§!及以上，从而令其崩溃。\n£white_dot 如果萨文科夫政权因§C民众愤怒§!崩溃，社会主义者会短暂掌权，但在几天后就会被安东·邓尼金发动反政变推翻。\n£white_dot 利用第三宪法的决议和选举事件来推动你希望的政党执政。\n£white_dot 如果§S激进民主党§!胜选，不要让党内极左翼夺权。\n£white_dot 如果§l右翼社会革命党§!胜选，当§c右翼愤怒§!或§P军方愤怒§!达到§O6§!及以上时，§Y弗拉基米尔·里希特§!将会死亡。接下来取决于谁控制了国务委员会，新的领袖会在§Y皮季里姆·索罗金§!与§Y伊利亚·丰达明斯基§!之间决出。\n£white_dot 如果§m立宪民主联盟§!胜选，当§g政治冷感§!达到5及以上，§Y瓦西里·马克拉科夫§!将会辞职并退出政界。接下来取决于谁控制了国务委员会，新的领袖会在§Y彼得·多尔戈鲁科夫§!与§Y安东·卡尔塔绍夫§!之间选出。\n£white_dot 如果§Y伊万·索洛涅维奇§!遇刺，§Y德米特里·罗曼诺夫§!将担任新的领袖。\n£white_dot 完成战后国策§Y回归传统§!，索洛涅维奇领导的§c全俄罗斯爱国党§!政权将变为§g威权民主主义§!。\n\n§M帝国 - 右翼社会革命党/立宪民主联盟/全俄罗斯爱国党/人民君主运动§!（§l社会自由主义§!/§m市场自由主义§!/§c社会保守主义§!/§g威权民主主义§!/§P家长制独裁§!）\n£white_dot 在事件“接替科尔尼洛夫”中，任命彼得·弗兰格尔为陆军总长。\n£white_dot 让萨文科夫政权的§P军方愤怒§!保持在§O5§!以下的同时，让§C民众愤怒§!达到§R8§!及以上；或直接让§P军方愤怒§!达到§R8§!及以上，从而令其崩溃。\n£white_dot 如果萨文科夫政权因§C民众愤怒§!崩溃，社会主义者会短暂掌权，但在几天后就会被彼得·弗兰格尔发动反政变推翻。\n£white_dot 利用第三宪法的决议和选举事件来推动你希望的政党执政。\n£white_dot 当§Y伊万·索洛涅维奇§!为二把手时，完成国策§Y民主主义流毒§!将变为§g威权民主主义§!，完成国策§Y良心专制§!将变为§P家长制独裁§!。\n\n§M弗兰格尔 - 立宪民主联盟/全俄罗斯爱国党/俄罗斯统一大会§!（§m市场自由主义§!/§c社会保守主义§!/§g威权民主主义§!）\n£white_dot 在事件“接替科尔尼洛夫”中，任命彼得·弗兰格尔为陆军总长。\n£white_dot 在萨文科夫路线同德意志帝国的战争中，让§P军方愤怒§!达到§r8§!，弗兰格尔就会夺权，并将变为§P家长制独裁§!。\n£white_dot 战争结束后，利用事件选举出你希望的政党。"

  RUS_bolshevik_gamble_event_tt: "我们将运用§o格里戈里·季诺维也夫§!所拥有的全部影响力来尝试接管§o俄罗斯共产党（布尔什维克）§!。\n§R但是，如果约瑟夫·斯大林仍然在我们的政府之中，且已重新在军队中获得影响力，事件可能会向另一个方向发展……§!"
  RUS_bolshevik_gamble_trigger_tt: "若要使斯大林路线得以发动，必须先完成国策§Y设立国家军事委员会§!。"
  RUS_charter_of_russian_totalism: "极权主义论战"
  RUS_war_on_landowners_desc: "我们必须明白，农民这一作为过渡阶级的存在是必然要消亡的。而土地改革的贯彻落实，给我们提供了加速这一过程的机会。农业工厂的试点将为未来的农业生产提供新的范本。"
  RUS_red_intelligentsia: "革命文化阵地战"
  RUS_red_intelligentsia_desc: "“旧世界的消亡不是一下子完成的，而是经历着一个痛苦的和长期的过程。”为了避免旧资产阶级思想的侵蚀与投机分子的影响，我们必须将革命与民主的思想植入每一名公民的心中。"
  RUS_technocratic_syndicalism: "为民主奠基"
  RUS_technocratic_syndicalism_desc: "在资本主义国家，民主常常被认作为制度的簇拥，而我们将证明——民主是一种生活方式。列宁所预言的“广大无产阶级的民主”已近在咫尺。"
  RUS_preserve_revolution_within: "红色舵手凯旋"
  RUS_preserve_revolution_within_desc: "在一系列的政治运作下，季诺维也夫业已大权在握，他所构想的俄罗斯式的极权主义与无产阶级专政国家将§R变成现实§!。"
