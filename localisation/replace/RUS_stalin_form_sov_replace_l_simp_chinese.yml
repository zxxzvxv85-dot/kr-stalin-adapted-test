  RUS_iosif_stalin_high_command_desc: "$RUS_iosif_stalin_leader_desc$"
  russia_flavour_events.55.d.soc: "布尔什维克在内战中失败后，历任政府都将俄国社会主义者打成了叛徒。从失败的那一刻起，社会主义者们就开始互相指责，试图找出责任所在。孟什维克认为，整场革命从一开始就是一个无政府主义错误，在落后的俄国，唯有在共和革命中作为社会主义反对派的纲领才是可行的。左翼社会革命党、无政府主义者和一些布尔什维克投降者认为，革命本身是值得庆贺的，但被布尔什维克掌权时的过火行为、对农民的背叛、血腥的红色恐怖和在《布列斯特-立托夫斯克条约》中对德国人投降所扭曲。\n\n面对诸如此类对十月革命的抹黑与诬陷，投机派与摇摆分子都纷纷作鸟兽散，只有最坚定、最坚强的布尔什维克始终坚持捍卫革命的正统性与正当性，同时谴责了社革党对阶级革命的背叛。他们相信，十月的失败不过是革命的低潮，浩浩荡荡的历史之风终有一日会扫尽这些枯枝败叶，俄国革命也将随之迎来新生。\n\n在这种背景下，社会主义运动陷入了混乱。他们遭到白军的迫害，四分五裂，希望渺茫。一些人加入了激进民主党，并严格采取改革立场，试图通过妥协换取一线生机。另一些人则继续与白匪军展开殊死斗争，保护人民免受斯沃博达派暴徒的伤害。也曾有许多人试图谈判妥协，建立一种能够统一当下敌对各派的俄罗斯式社会主义——但如今，这一切的纷争都迎来句号，涅槃重生的布尔什维克证明了自己的正确性——历史潮流势不可挡，"
  russia_flavour_events.55.a: "一切权力归苏维埃！（Vsya vlast Sovetam!）"
  russia_socialist_events.4.t: "工人政党的崛起"
  russia_socialist_events.4.d: "在经历了长期的非法查禁和政治迫害后，俄罗斯的社会主义者终于可以自由地组织政治活动了。尽管大多数社会主义者加入了列维茨基领导的全俄劳联，或继续忠于社会革命党的事业，但仍有许多小型政党陆续成立。\n\n在“旧共和国”政党中，唯一仍保有影响力的是泽勒领导的社会主义民主同盟。社民盟主要是遭受过大幅削弱的激进民主党重组而成，激进派离开后，其吸纳了一些来自右翼的新成员，他们希望通过该党推动更保守或温和的议程。\n\n另一个重新崛起的老牌政党是复兴的俄罗斯共产党（布尔什维克），其中央委员会在斯维尔德洛夫的领导下从流亡中回归。然而，这个党派的力量已远不及当年的辉煌时期。托姆斯基以及其他涉足俄国工会主义运动的布尔什维克没有回归，而是选择加入全俄劳联以寻求更大的政治影响力，这进一步削弱了布尔什维克的力量。但布尔什维克并非不受欢迎，时至今日，他们仍然在激进工人和贫农中享有很大的影响力。为限制布尔什维克的发展，各政党间达成了一项非正式协议，避免让布尔什维克们接触关键权力职位。\n\n与此同时，还有数十个围绕左翼知名人物或边缘意识形态（如无政府主义、妇女权益）成立的小党派。这些小党派和独立议员中还包含大量并非真正信奉社会主义、只是在表面上追随的成员。虽然这些小党派单独影响有限，但确实在代表大会中组成了一个相对庞大的少数派集团。"
  russia_socialist_events.4.a: "一团乱麻......"
  russia_socialist_events.421.t: "布尔什维克复兴"
  russia_socialist_events.421.d: "在加米涅夫的周密协调和布尔什维克自身强大的组织能力作用下，重整旗鼓的布尔什维克党迅速重掌国家权力中枢。越来越多的党员被安插或选举进入政府的关键岗位，党的政治纲领也在社会各阶层中获得了比以往更广泛的认同。公开层面上，全俄劳联通过与布尔什维克党结成事实上的执政联盟，暂时稳住了局面，为党的执政提供了必要的合法性支撑。\n\n而在权力体系的暗面，由加米涅夫、斯维尔德洛夫和斯大林组成的“革命三人团”则定期会晤，秘密讨论党的长远走向。三人一致认为，当前的社会主义共和国仍远未彻底清除资本主义的遗毒——经济领域里，一批手握实权的“老厂长”依然沿袭旧式管理，抵制新的生产秩序；地方行政系统中，大量前朝留用的官僚依旧阳奉阴违，甚至在基层形成独立的小利益集团。\n\n经过数次闭门磋商，三人为布尔什维克接下来一段时期定下了总体路线：在不触动现行国家架构的前提下，全力渗透和扩张党在各领域的实际影响力——包括加强工会中的党小组、向地方苏维埃输送可靠的干部、控制舆论宣传工具，并秘密建立应急指挥网络。同时，他们也开始着手拟定“二次革命”的预案，一旦时机成熟，或当旧势力出现明显动荡时，即可迅速发起自上而下的清洗与重组，彻底扫除一切阻碍社会主义深化的因素。"
  russia_socialist_events.421.a: "欢迎加入，同志。"

  RUS_guide: "§M斯大林 - 逆转十月革命§!（§o极权主义§!）\n£white_dot 完成国策§Y全俄罗斯劳工联盟§!时，俄罗斯所有国策时间会自动减少§G7天§!；在该国策的选举过程结束后，保证§r国际主义者§!团结度低于或等于§Y2§!，且§o共产主义者§!关系为§Y10§!。完成国策后等待一天即可触发§Y加米涅夫上台§!事件，此时§Y第一个四年计划§!会变为§Y第一个五年计划§!，完成国策§Y第一个五年计划§!后，所有相关工业决议都会为§Y第一个五年计划§!追加加成。完成国策§Y马克思主义教育§!后会解锁§Y教育改革§!，完成国策§Y与最高纲领派谈判§!后会解锁§Y土地改革§!。\n£white_dot 按照§r全俄劳联§!左线游玩，在完成国策§Y布尔什维克豪赌§!之前，确保满足以下要求：\n - 流亡的社会主义将领已回国。\n - 在事件§Y克拉斯纳亚戈尔卡案件§!对斯大林的审判中选择最后一项“不过，他做得对”。\n - 已经完成国策§Y设立国家军事委员会§!。\n若满足全部要求，在进行国策布尔什维克豪赌后不久便会触发斯大林与斯维尔德洛夫密谋推翻季诺维也夫和全俄劳联的事件链，依次选择“季诺维也夫必须被推翻”、“我想他们会被我说服的”，针对季诺维也夫的政变便能成功，在随后的事件中选择“斯大林同志将带领我们走向胜利”，约瑟夫·斯大林便可以上台。\n£white_dot 在二战中击败德意志帝国后，你将能成立§o苏维埃社会主义共和国联盟§!。\n\n§M萨文科夫 - 各民族的牧羊人/世界的救星/思想统治原则§!（§n国家民粹主义§!）\n£white_dot 让萨文科夫政权的§C民众愤怒§!保持在§R8§!以下，且§P军方愤怒§!保持在§r10§!以下，从而维持统治。\n£white_dot 要进入§M各民族的牧羊人§!子路线，需要在权力平衡中偏向协作派，并在事件“菲洛年科拜会元首”中任命菲洛年科。\n£white_dot 要进入§M世界的救星§!子路线，需要在协作派与思想统治派之间不偏不倚。\n£white_dot 要进入§M思想统治原则§!子路线，需要在权力平衡中偏向思想统治派，并在事件“萨维茨基拜会元首”中任命萨维茨基。\n\n§M共和国 - 激进民主党/右翼社会革命党/立宪民主联盟/全俄罗斯爱国党§!（§S社会民主主义§!/§l社会自由主义§!/§m市场自由主义§!/§c社会保守主义§!/§g威权民主主义§!）\n£white_dot 在事件“接替科尔尼洛夫”中，任命安东·邓尼金为陆军总长。\n£white_dot 让萨文科夫政权的§P军方愤怒§!保持在§O5§!以下的同时，让§C民众愤怒§!达到§R8§!及以上；或直接让§P军方愤怒§!达到§R8§!及以上，从而令其崩溃。\n£white_dot 如果萨文科夫政权因§C民众愤怒§!崩溃，社会主义者会短暂掌权，但在几天后就会被安东·邓尼金发动反政变推翻。\n£white_dot 利用第三宪法的决议和选举事件来推动你希望的政党执政。\n£white_dot 如果§S激进民主党§!胜选，不要让党内极左翼夺权。\n£white_dot 如果§l右翼社会革命党§!胜选，当§c右翼愤怒§!或§P军方愤怒§!达到§O6§!及以上时，§Y弗拉基米尔·里希特§!将会死亡。接下来取决于谁控制了国务委员会，新的领袖会在§Y皮季里姆·索罗金§!与§Y伊利亚·丰达明斯基§!之间决出。\n£white_dot 如果§m立宪民主联盟§!胜选，当§g政治冷感§!达到5及以上，§Y瓦西里·马克拉科夫§!将会辞职并退出政界。接下来取决于谁控制了国务委员会，新的领袖会在§Y彼得·多尔戈鲁科夫§!与§Y安东·卡尔塔绍夫§!之间选出。\n£white_dot 如果§Y伊万·索洛涅维奇§!遇刺，§Y德米特里·罗曼诺夫§!将担任新的领袖。\n£white_dot 完成战后国策§Y回归传统§!，索洛涅维奇领导的§c全俄罗斯爱国党§!政权将变为§g威权民主主义§!。\n\n§M帝国 - 右翼社会革命党/立宪民主联盟/全俄罗斯爱国党/人民君主运动§!（§l社会自由主义§!/§m市场自由主义§!/§c社会保守主义§!/§g威权民主主义§!/§P家长制独裁§!）\n£white_dot 在事件“接替科尔尼洛夫”中，任命彼得·弗兰格尔为陆军总长。\n£white_dot 让萨文科夫政权的§P军方愤怒§!保持在§O5§!以下的同时，让§C民众愤怒§!达到§R8§!及以上；或直接让§P军方愤怒§!达到§R8§!及以上，从而令其崩溃。\n£white_dot 如果萨文科夫政权因§C民众愤怒§!崩溃，社会主义者会短暂掌权，但在几天后就会被彼得·弗兰格尔发动反政变推翻。\n£white_dot 利用第三宪法的决议和选举事件来推动你希望的政党执政。\n£white_dot 当§Y伊万·索洛涅维奇§!为二把手时，完成国策§Y民主主义流毒§!将变为§g威权民主主义§!，完成国策§Y良心专制§!将变为§P家长制独裁§!。\n\n§M弗兰格尔 - 立宪民主联盟/全俄罗斯爱国党/俄罗斯统一大会§!（§m市场自由主义§!/§c社会保守主义§!/§g威权民主主义§!）\n£white_dot 在事件“接替科尔尼洛夫”中，任命彼得·弗兰格尔为陆军总长。\n£white_dot 在萨文科夫路线同德意志帝国的战争中，让§P军方愤怒§!达到§r8§!，弗兰格尔就会夺权，并将变为§P家长制独裁§!。\n£white_dot 战争结束后，利用事件选举出你希望的政党。"

  RUS_bolshevik_gamble_event_tt: "我们将运用§o格里戈里·季诺维也夫§!所拥有的全部影响力来尝试接管§o俄罗斯共产党（布尔什维克）§!。\n§R但是，如果约瑟夫·斯大林仍然在我们的政府之中，且已重新在军队中获得影响力，事件可能会向另一个方向发展……§!"
  RUS_bolshevik_gamble_trigger_tt: "若要使斯大林路线得以发动，必须先完成国策§Y设立国家军事委员会§!。"
  RUS_charter_of_russian_totalism: "极权主义论战"
  RUS_war_on_landowners_desc: "农民这一过渡阶级是必然在未来消亡的，而我们要做的则是加速这一过程，促使向农业工人的迈进，确保旧的小资产阶级思想再无立地生根的阶级基础。"
  RUS_red_intelligentsia: "革命文化阵地战"
  RUS_red_intelligentsia_desc: "“旧世界的消亡不是一下子完成的，而是经历着一个痛苦的和长期的过程。”为了避免旧资产阶级思想的侵蚀与投机分子的影响，我们必须将革命与民主的思想植入每一名公民的心中。"
  RUS_technocratic_syndicalism: "为民主奠基"
  RUS_technocratic_syndicalism_desc: "终于！列宁同志所设想的无产阶级民主已在如今的俄罗斯蓄势待发，一个“比任何资产阶级民主更民主千百倍的民主”将确保我们向共产主义的过渡！"
  RUS_preserve_revolution_within: "红色舵手凯旋"
  RUS_preserve_revolution_within_desc: "在一系列的政治运作下，季诺维也夫业已大权在握，他所构想的俄罗斯式的极权主义与无产阶级专政国家将§R变成现实§!。"
