l_simp_chinese:
  tstz_stalingrad: "斯大林格勒拖拉机厂"
  RUS_military_production_idea: "联邦军备与国防工业委员会"
  RUS_military_production_idea_desc: "联邦军备与国防工业委员会把总参谋部、联邦计划机关、军工机构和兵工厂纳入同一套军备建设程序，使设计、试验、订货与量产能够围绕红军的实际需要协调推进。"
  RUS_central_vpk: "联邦军备与国防工业委员会"
  RUS_central_vpk_desc: "联邦军备与国防工业委员会统一协调军工机构、计划机关与军队订货部门的工作，使设计、试验、生产和装备验收服从同一套国防建设计划。"
  RUS_council_of_industrialists_desc: "实业家委员会是一个常设机构，承担着类似于联邦军备与国防工业委员会的职能，负责管理俄罗斯的军事生产并为国家提供专业领域援助。"
