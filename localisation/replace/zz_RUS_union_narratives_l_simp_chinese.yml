 # 用户2026-10-25正文；全部分支统一正文，不更改事件/国策逻辑。
 russia_socialist_events.406.d:0 "俄罗斯帝国已被扫进了历史的垃圾堆，但命运的转折却将我们引向了此般境地：只要我们奋起努力，1917年的伟大梦想——在前帝俄疆域上建立一个民主的社会主义联盟，便是触手可及。作为革命者，我们不会把时间浪费在“乌克兰民族不存在”，以及其他黑色百人团口号之类的荒谬言论上，而是投身于我们的意向：作为东欧和亚洲工业化程度最高的国家，俄罗斯是最有能力改善物质条件，打击暴政、资本主义和迷信，并最终引领整个地区全面实现社会主义制度的国家。\n\n目前，我们的联盟还只是一个松散的联盟。所有共和国都会选举代表组成联盟代表大会，联盟代表大会是法定的最高权力机构，但其权力有限。各共和国在国防和外交政策上相互联系，形成一个单一的经济区，并在从基础设施项目到经济专业化等各个领域进行协调。此外，联盟代表大会还会仲裁各成员国之间的矛盾。\n\n我们的联盟集权化计划现已提交给[GetSecondInCommand]政府，将在联盟代表大会上推进该计划。这个14点计划旨在废除民族国家、民族、宗教以及经济沙文主义，并将我们的联盟变成一个社会主义国家实体。\n\n虽然措辞十分美好，但该计划也招致了严厉的批评。我们党内有些人认为该计划在实践中是行集权主义、国家主义和“红色帝国主义”之实，一些乌克兰和白罗斯同志的批评更是有过之而无不及。那些不明所以的人总是反对进步。"
 russia_socialist_events.406.d2:0 "$russia_socialist_events.406.d$"
 russia_socialist_events.406.d3:0 "$russia_socialist_events.406.d$"
 russia_socialist_events.406.a:0 "哪种愿景会占上风？"
 russia_socialist_events.407.d:0 "联盟代表大会每季度召开一次，休会期间，由执行委员会负责处理联盟的日常事务。但实际上，执行委员会主要负责监督各成员共和国。根据联盟代表大会最近通过的一项立法，执行委员会被授权成立联盟部委，各共和国的独立政府机构将合并为一个全联盟部委。\n\n前两个部委——军事部和外交部，都已从联盟代表大会任命的委员会手中接管了对应事务，其意图旨在进一步协调各共和国，将其逐渐纳入集中管理之下。当然，俄罗斯苏维埃政府也会将权力移交给这个超国家政府，来自各个加盟国的政府成员如今共聚一堂，为了美好的明天共同奋斗。"
 russia_socialist_events.407.a:0 "好极了。"
 russia_socialist_events.420.start:0 "随着欧洲的战火平息，一切都发生了变化。俄罗斯的工农大军从列宁格勒进军柏林，解放了所到之处的人民，乌克兰、白罗斯和许多其他国家的同志也加入了他们的行列。我们的加盟国体制已成为整合这些解放区的框架，许多已处于社会主义政府统治下的国家都以加盟共和国的身份加入了我们的联盟。在首届联盟代表大会上，来自这些解放区的代表首次与俄罗斯的各族人民共同参会。"
 russia_socialist_events.420.d.psrdem:0 "$russia_socialist_events.420.start$\n\n战后的首次联盟代表大会会议完全是一团乱麻。为了容纳新成立的姊妹共和国的人口，席位数量扩大到了1080个，乌克兰社会主义者占据了近四分之一的席位。现任主席弗拉基米尔·卡列林主持了会议，会议主要侧重于解决不同成员共和国之间的问题。乌克兰代表迅速利用他们的人数优势，确保所有较小的成员共和国都能得到保障。但话说回来，许多人非常乐意让未来的苏维埃社会主义共和国联盟成为一个真正的国家实体，而非仅维持为社会主义国家之间的松散联盟。"
 russia_socialist_events.420.d.psrmax:0 "$russia_socialist_events.420.d.psrdem$"
