 # 012期待已久的联合？；014重建加盟国；045成立苏维埃社会主义共和国联盟；064最初与最末的革命。
 # 用户此次简称用于定位；保留既有显示标题、稳定ID、条件和奖励。
 RUS_future_foreign_012_desc:0 "与第三国际盟友的沟通早已证明了社会主义国家间的友好情谊，各国之间的交往也印证了革命阶级的团结。如今帝国主义行将毁灭，我们有什么理由不继续联合在一起呢？"
 RUS_future_foreign_013_desc:0 "哪有什么“我们”“你们”与“他们”？除却资产阶级包装的民族主义话术，各族劳动人民之间究竟有多少真正的差异？当我们面对同一个敌人，流着同样的血汗，一切人为的隔阂都必将被彻底粉碎。"
 RUS_future_foreign_014_desc:0 "战争的创伤无疑是极其惨痛的。欧洲各国在连天炮火下几乎化为废墟，百废待兴。但万幸的是，我国工业体系尚有余力，广大工农群众亦满怀热忱，愿以最大的力量援助我们的阶级兄弟，让这满目疮痍的大地重焕生机。"
 RUS_future_foreign_015_desc:0 "有多少家庭被帝国主义的罪恶行径所摧毁？残酷的战争给各国留下了无数食不果腹的孤儿，以及支离破碎的残破家庭。面对这触目惊心的惨状，我们必须倾尽全力去抚平这深重的创伤。"
 RUS_future_foreign_028_desc:0 "社会主义的大家庭急需绝对的统一与团结。在这同一面不可摧毁的旗帜下，我们将向全世界宣告欧陆战争的永恒终结——旧世界从此不复存在！世界革命万岁！无产阶级大团结万岁！"
 RUS_future_foreign_029_desc:0 "我们虽在尽力弥合路线差异，但部分革命友邦的执政能力着实令人担忧。为了引导那些“意识形态尚不成熟”的同志，苏维埃理应挺身而出，成为屹立于世界之巅的共产主义榜样与灯塔。"
 RUS_future_foreign_030_desc:0 "在各加盟国，不同的地方党组织在执政理念与利益分配上存在着深刻分歧。为了消除内部的派系倾轧与妥协风气，必须对地方组织进行全面审查与整合，将那些不可靠的分子清理出去，用统一的意志重新武装各级委员会。"
 RUS_future_foreign_031_desc:0 "民族主义从来不是什么纯洁的信仰，而是资产阶级用来分化无产阶级的毒药。它用虚伪的“同胞”情谊掩盖剥削，用地域与血统的隔阂，阻挠各国工农兄弟的联合。在社会主义的阵营里，绝不允许这种旧时代的流毒继续蔓延。"
 RUS_future_foreign_042_desc:0 "“同志们，你们可听见？那来自远方的声声呼唤！旧世界的丧钟已经敲响，帝国主义的末日即将来临。握紧你们手中的武器，历史的决战时刻已进入倒计时——为了无产阶级的最终胜利，前进！”"
 RUS_future_foreign_043_desc:0 "也许“世界革命”的宏大口号听起来太过遥远，但赤化欧洲的轮廓已在战火中清晰可见。与其眺望不可及的未来，不如先集中力量，将这片大陆彻底化为无产阶级的坚不可摧的堡垒。"
 RUS_future_foreign_044_desc:0 "革命不能依靠刺刀和枪支来传播，强权无法孕育真正的信仰。我们应当用面包、土地和和平的真理去赢得世界。因为真正不可战胜的武器，是千百万觉醒的劳动者。"
 RUS_future_foreign_045_desc:0 "曾几何时，“无产阶级联盟”的概念被视作一个幼稚的幻想，甚至连许多社会主义者也对跨越民族隔阂的联合抱有疑虑。如今，历史的进程已给出了答案。苏联的成立，不仅是一个新的国家实体的诞生，更是对旧有民族主义壁垒的彻底粉碎。它将成为世界革命最坚强的堡垒，指引全人类走向共产主义。"
 RUS_future_foreign_064_desc:0 "从彼得格勒冬宫的第一声炮响，到如今席卷欧亚大陆的赤色狂潮，我们走过了漫长而血腥的岁月。历史的车轮不会倒转，旧世界已无路可退。\n\n“试看星星之火，定成燎原之势！”"
