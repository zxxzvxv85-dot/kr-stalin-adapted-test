l_simp_chinese:
 RUS_amo_mio_desc:0 "$amo_RUS_MIO$\n§L[RUSStalinMioIntro_amo]§!\n"
 RUS_stalin_mio_intro_amo:0 "莫斯科汽车公司成立于 1916 年，是俄罗斯建立汽车工业的国家计划的一部分。近些年来，莫斯科汽车厂参与了俄国内战后第一辆坦克的制造，通过许可生产了许多欧美品牌的汽车，并自主设计了自己的汽车品牌。\n\n俄共执政后，为了纪念已经逝去的弗拉基米尔·列宁，莫斯科汽车厂被更名为列宁汽车厂。"
 RUS_as_mio_desc:0 "$as_RUS_MIO$\n§L[RUSStalinMioIntro_as]§!\n"
 RUS_stalin_mio_intro_as:0 "内战结束后，经过海军部的不懈努力，亚速海造船厂得以建立。这是一家规模虽小但仍然重要的造船厂，负责为黑海舰队生产船只。\n\n五年计划期间，为了发展能够抵御外敌的强大海军，亚速海造船厂得到扩大，并更名为黑海造船厂"
 RUS_av_mio_desc:0 "$av_RUS_MIO$\n§L[RUSStalinMioIntro_av]§!\n"
 RUS_stalin_mio_intro_av:0 "海军部造船厂在内战期间遭到严重破坏，在海军部的大力支持下才得以幸存。海军部造船厂如今更像波罗的海造船厂的 “弟弟”，专注于建造较为轻型的船只，并凭借民用合同维持运营。"
 RUS_bmz_mio_desc:0 "$bmz_RUS_MIO$\n§L[RUSStalinMioIntro_bmz]§!\n"
 RUS_stalin_mio_intro_bmz:0 "布良斯克机械制造厂最初以机车和部分船舶制造业务起家，不过自大战以来已发展为主要的火炮制造商，同时也保留了制造火车的能力，并在 1934 年被萨文科夫进行了有限的国有化。\n\n五年计划中，为了顺应对火炮研发、生产制造的需求，包括布良斯克机械制造厂在内的多个火炮生产厂商被合并至新建立的莫托维利哈工厂。"
 RUS_bz_mio_desc:0 "$bz_RUS_MIO$\n§L[RUSStalinMioIntro_bz]§!\n"
 RUS_stalin_mio_intro_bz:0 "波罗的海造船厂成立于 1861 年，自诞生以来已经建造了许多船只。内战结束后，工厂经历了一段艰难时期，但在海军部持续不断的支持下，它挺过了难关。在吞并彼得罗扎沃德和乌斯季 - 伊若拉造船厂后，该造船厂已成为俄罗斯当下规模最大的造船厂。"
 RUS_chtz_mio_desc:0 "$chtz_RUS_MIO$\n§L[RUSStalinMioIntro_chtz]§!\n"
 RUS_stalin_mio_intro_chtz:0 "多亏了政府近期的努力，车里雅宾斯克拖拉机厂现已专门生产适用于西伯利亚和其他条件恶劣地区的可靠拖拉机。该厂既可用于民用生产，也可用于军用生产，是一座潜力巨大的工厂，有望成为国内主要的坦克生产商之一。"
 RUS_dalzavod_mio_desc:0 "$dalzavod_RUS_MIO$\n§L[RUSStalinMioIntro_dalzavod]§!\n"
 RUS_stalin_mio_intro_dalzavod:0 "达尔扎沃德由私企于内战结束后成立，用于促进对美贸易。在华尔街股灾后，达尔扎沃德被迫扩大业务范围以维持经营，并开始承接政府合同。该公司主要专注于船舶改装和维修，同时也生产船只和弹药。"
 RUS_duks_mio_desc:0 "$duks_RUS_MIO$\n§L[RUSStalinMioIntro_duks]§!\n"
 RUS_stalin_mio_intro_duks:0 "由于二十年代拮据的经济状况，莫斯科航空工厂杜克斯失去了几家小型工厂，但还是设法生存了下来，并继续从事飞机制造业。通过着重扩建莫斯科工厂，杜克斯仍然保有其战斗机之王地位。\n\n俄共执政后，曾经的“战斗机之王”莫斯科航空工厂杜克斯因公然对抗政府进行反社会主义活动被阿尔焦姆·米高扬与米哈伊尔·格列维奇接管，最高苏维埃任命他们成立了米高扬-格列维奇设计局。"
 RUS_gamayun_mio_desc:0 "$gamayun_RUS_MIO$\n§L[RUSStalinMioIntro_gamayun]§!\n"
 RUS_stalin_mio_intro_gamayun:0 "俄罗斯航空公司 “加马云” 成立于 1927 年，由俄罗斯资深航空人士斯柳萨连科和格里戈罗维奇合资成立。该公司于 1932 年成功在喀山建立了一家现代化的飞机制造厂。在吸引了中央空气流体动力学研究院前途无量的设计师佩特利亚科夫加入工厂后，加马云与战争部签订了固定合同，并确立起自身作为轰炸机和运输机生产商的地位。\n\n俄共执政后，俄罗斯航空公司加马云因内部大量人员潜逃国外，最高苏维埃因此任命前途无量的图波列夫弟子苏霍伊接管加马云，并在此基础上成立了苏霍伊设计局。"
 RUS_osoavia_mio_desc:0 "$osoavia_RUS_MIO$\n§L[RUSStalinMioIntro_osoavia]§!\n"
 RUS_stalin_mio_intro_osoavia:0 "国防飞机协助协会成立于 1927 年，是由空军之友协会和俄罗斯国防援助协会合并而成的非营利组织。几年后，国防飞机协助协会收购了多家杜克斯飞机厂，协会也因此成为了俄罗斯最大的飞机制造商之一，伊留申等杰出工程师也在协会旗下工作。\n\n俄共执政后，原国防飞机协助协会因高层从事反革命活动被执行调查，优秀设计师伊留申因此接管协会并在此基础上成立了伊留申设计局。"
 RUS_laz_mio_desc:0 "$laz_RUS_MIO$\n§L[RUSStalinMioIntro_laz]§!\n"
 RUS_stalin_mio_intro_laz:0 "列别杰夫汽车厂成立于 1916 年，是俄罗斯建立汽车工业的国家计划的一环。由于汽车厂创始人热爱航空，在内战结束后，列别杰夫汽车厂曾试图涉足航空业，却差点因此破产。尽管该汽车厂仍与航空企业保持着合同往来，但其目前专注于重型卡车和发动机的生产。\n\n列别杰夫汽车厂于革命后被国有化，更名为雅罗斯拉夫尔汽车厂。"
 RUS_naz_mio_desc:0 "$naz_RUS_MIO$\n§L[RUSStalinMioIntro_naz]§!\n"
 RUS_stalin_mio_intro_naz:0 "下诺夫哥罗德汽车厂 1929 年成立于下诺夫哥罗德，最初为私人企业，在政府的大力支持下，很快成为俄罗斯主要的汽车制造商之一。该汽车厂深受福特公司设计的影响，具有公认的大规模生产能力。\n\n为了纪念文学巨匠高尔基，下诺夫哥罗德被更名为高尔基，而下诺夫哥罗德汽车厂更名为了高尔基汽车厂。"
 RUS_obukhov_mio_desc:0 "$obukhov_RUS_MIO$\n§L[RUSStalinMioIntro_obukhov]§!\n\n"
 RUS_stalin_mio_intro_obukhov:0 "彼得格勒武器、光学与钢铁厂 “奥布霍夫” 在内战结束后的几年里被私有化，但其仍与海军部和战争部有着密切的联系，并由此承接了大部分合同。作为众多领域的行家里手，奥布霍夫同时也是发明家协会里为战争部效力的坦克设计师们的起家公司。"
 RUS_okmo_mio_desc:0 "$okmo_RUS_MIO$\n§L[RUSStalinMioIntro_okmo]§!\n"
 RUS_stalin_mio_intro_okmo:0 "特种机械制造托拉斯 (Spetsmash) 的设计部门，试验设计机械部汇聚了俄罗斯最优秀的工程师。虽然该部门没有自己的生产基地，但其对特种机械制造托拉斯旗下的所有工厂都有着不可小觑的影响力。\n\n实验机械设计部在进行内部审查后更名为莫洛佐夫机械制造设计局，由莫洛佐夫领导。"
 RUS_putilovets_mio_desc:0 "$putilovets_RUS_MIO$\n§L[RUSStalinMioIntro_putilovets]§!\n"
 RUS_stalin_mio_intro_putilovets:0 "普梯洛夫工厂公司的主要工厂自 1885 年以来一直为私人所有，但在 1935 年后，萨文科夫对其进行了有限国有化，并将其更名为 “普梯洛夫工厂”(Putilovets)。如今，该工厂已转为军火生产，并扩大了设计部门，现已成为俄罗斯的主要坦克生产商。\n\n为了表彰谢尔盖·基洛夫在拖拉机与坦克工业领域的贡献，普梯洛夫工厂更名基洛夫工厂。"
 RUS_skorost_mio_desc:0 "$skorost_RUS_MIO$\n§L[RUSStalinMioIntro_skorost]§!\n"
 RUS_stalin_mio_intro_skorost:0 "“速度” 航空机械制造厂于 1934 年由雅科夫列夫轻型航空集团在战争部的支持下创建，是雅科夫列夫旗下的一家私企。该工厂专注于批量生产飞机，并很快成为战争部的宠儿之一。\n\n“红色速度”的掌控者雅科夫列夫主动接受改组，在人员基本不变的情况下成立了雅科夫列夫设计局。"
 RUS_sokol_mio_desc:0 "$sokol_RUS_MIO$\n§L[RUSStalinMioIntro_sokol]§!\n"
 RUS_stalin_mio_intro_sokol:0 "特种航空托拉斯 “索科尔”（Sokol，意译为鹰）是一家诞生于 1930 年的国有企业，以二十年代末被政府收购的下诺夫哥罗德列别杰夫飞机厂为基础成立。索科尔工厂在过去几年里大幅扩建，成为了俄罗斯最大的飞机制造厂之一，其主要设计师包括拉沃契金、戈尔布诺夫和古德科夫等人。\n\n航空托拉斯索科尔接受政府再次改组后由拉沃契金担任总设计师，成立了拉沃契金设计局。"
 RUS_toz_mio_desc:0 "$toz_RUS_MIO$\n§L[RUSStalinMioIntro_toz]§!\n"
 RUS_stalin_mio_intro_toz:0 "图拉兵工厂是俄罗斯最古老的军工厂，拥有庞大的专业人才队伍和强大的生产能力，能够生产从左轮手枪到机炮的各式武器。费奥多尔・托卡列夫 —— 这位俄罗斯当代最杰出的武器设计大师就出自图拉兵工厂。"
 RUS_tsagi_mio_desc:0 "$tsagi_RUS_MIO$\n§L[RUSStalinMioIntro_tsagi]§!\n"
 RUS_stalin_mio_intro_tsagi:0 "中央空气流体动力学研究院成立于内战时期，由战争部直接支持，既为军用工业服务，也为民用工业服务。该研究院以图波列夫和他的弟子苏霍伊而闻名，也是俄罗斯轰炸机主体部分的设计方。\n\n中央空气流体学研究院与佩特利亚科夫为首的前加马云团体再次合并后成立了图波列夫与佩特利亚科夫联合设计局。"
 RUS_tstz_mio_desc:0 "$tstz_RUS_MIO$\n§L[RUSStalinMioIntro_tstz]§!\n"
 RUS_stalin_mio_intro_tstz:0 "多亏了政府近期的努力，察里津拖拉机厂迅速成为俄罗斯最大的拖拉机制造商之一。在坦克生产部门成立后，察里津拖拉机厂已经准备好利用其生产线为军队服务。\n\n为了表彰斯大林在内战时期于察里津死战不退、多次击退白军进攻、为其他方向的撤退部队争取时间的英勇举动和对其余军事上的贡献，察里津更名为斯大林格勒（尽管遭受了当事人的强烈反对），察里津拖拉机厂也改名为斯大林格勒拖拉机厂。"
 RUS_uztm_mio_desc:0 "$uztm_RUS_MIO$\n§L[RUSStalinMioIntro_uztm]§!\n"
 RUS_stalin_mio_intro_uztm:0 "多亏了政府近期的努力，乌拉尔重型机械厂现已成为叶卡捷琳堡附近的一座城市，拥有自己的公园、住宅区，当然还有乌拉尔地区最大的机械制造厂。武器部门是乌拉尔重型机械厂的众多部门之一，由几位前途无量的年轻工程师领导。"
 RUS_vpoz_mio_desc:0 "$vpoz_RUS_MIO$\n§L[RUSStalinMioIntro_vpoz]§!\n"
 RUS_stalin_mio_intro_vpoz:0 "维亚茨基耶波利亚内兵工厂是为了应对战争而建立的，最初是一家线轴厂，但很快就变成了一家军工制造商。随着军队的武器需求日益增加，工厂里的一些资深工程师，如什帕金，很快被委以简化枪支和支援装备生产流程的任务。\n\n五年计划期间，为了体现“工人”的要素，威亚茨基耶波利亚内工厂更名为莫洛特机器制造厂（莫洛特，译为锤子）。"
