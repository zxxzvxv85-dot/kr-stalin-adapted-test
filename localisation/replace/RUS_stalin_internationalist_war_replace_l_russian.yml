l_russian:
  russia_socialist_events.433.d: "Конституция прежней Российской Советской Федеративной Социалистической Республики была по своей природе убеждённо интернационалистской и предоставляла гражданство всем иностранным рабочим в стране без «обременительных формальностей». Революционное правительство вело политическую работу среди военнопленных, к сильному недовольству капиталистических держав. В результате предоставление военнопленным гражданства, разрешение им вести легальную деятельность и гарантия их безопасности от расправ после возвращения домой стали базовыми требованиями революционной войны. Чтобы расколоть поток вражеских сил, партийный центр вновь ввёл и усовершенствовал эту практику, предоставив столь же простой юридический путь к гражданству всем иностранцам рабочего происхождения. Освободившись от Брест-Литовского договора и от необходимости открываться некапиталистическому миру, мы можем разделять иностранных пленных по классовому признаку и обращаться к пролетариату и бедному крестьянству на основе классовой солидарности. Многие уже доказали готовность принять новое политическое воспитание и понятие классового сознания. Это окажется ценным не только для будущей оккупации Рейхспакта и даже возможной мировой революции, но и позволит множеству воодушевлённых людей полностью посвятить себя интернационалистскому делу, создав широкий резерв пригодных кандидатов для вспомогательных и даже боевых ролей в армии."
