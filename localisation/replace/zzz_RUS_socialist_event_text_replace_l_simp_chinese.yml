l_simp_chinese:
  russia_socialist_events.3.t: "破镜重圆的社会革命党"
  russia_socialist_events.3.d: "社会革命党的历史是一部不断分裂与重组的历史。最近一次重大分裂发生在维克托·切尔诺夫去世之后——这位长期领袖的离去，撕开了党内早已存在的裂痕。在其身后，鲍里斯·萨文科夫以铁腕手段对右翼阵营进行了几乎毁灭性的清洗，大批曾被视作“党的脊梁”的干部被打入“叛国者”的名单。与此同时，左翼势力被迫转入地下，回到他们最为熟悉却也最为沉重的生存方式——恐怖主义。\n\n如今，社革党在政治版图上重新占据了主导地位。然而，这还远不足以将占俄国人口绝大多数的农民团结在同一面旗帜之下。农民对政党的不信任、地区之间的隔阂、以及革命年代遗留下的互相猜忌，仍是横亘在统一道路上的深刻沟壑。\n\n经过玛利亚·斯皮里多诺娃与弗里德里希·里希特之间的数轮闭门磋商，社会革命党最终宣告了它的再次统一。\n\n观察人士指出，社会革命党的这一次统一带有明显的妥协痕迹——斯皮里多诺娃代表着左翼的激进遗产与农村底色，里希特则象征着党内试图走向民主化、议会化的力量。两人之间的共识与其说是信任，不如说是一种务实的计算：毕竟分裂的代价远高于妥协的成本。"
  russia_socialist_events.3.a: "这些家伙真能学会什么叫合作？"
  russia_socialist_events.3.b: "多讲讲社会革命党。"
  russia_socialist_events.73.d: "最高纲领派是社会革命党内部最为激进的派系之一，其渊源可追溯至革命前的俄国。该派系名称源于阿列克谢·乌斯季诺夫所撰写的《革命的最高纲领——共产主义》宣言——这份文件不仅是纲领性文献，更在相当程度上成为了该派系的政治宣言。\n\n革命战争期间，最高纲领派与布尔什维克结盟，在共同的战场上建立了密切的协作关系。战后，他们并未解散，而是转型为游击组织在基层坚持活动，在漫长的地下岁月中依旧保持了组织的完整性与战斗意志。如今，随着政治气候的转变，这支力量再次浮出水面并迅速发展壮大。\n\n作为一股重新崛起的力量，最高纲领派在本质上更接近于革命者而非传统意义上的社会革命党人。他们的政治语言、组织方式和斗争逻辑，都与布尔什维克有着更多的相似之处——这使他们在社革党内部始终保持着一种独特的身份定位。\n\n在领导结构上，阿列克谢·乌斯季诺夫被派内成员普遍视为精神领袖，其著作所确立的理论框架仍是派系的思想基石。而实际的组织工作与日常事务，则由安德烈·科列加耶夫负责。两人之间亦师亦友的关系，构成了最高纲领派内部最为牢固的政治纽带，正是这种相互支撑的结构，使该派系在长期逆境中仍维持了革命政党所特有的生命力。\n\n最高纲领派的政治主张与传统社会革命党人迥然不同。在原则层面，他们否定农民作为一个“过渡阶级”在革命进程中的独立历史作用，认为其天然具有摇摆性与局限性；但在实践层面，他们认同贫农阶级作为变革工具的革命目的——即贫农可以被动员、被组织、并被引导至社会主义改造的方向。因此，在政策层面，实现农业工人的阶级觉醒与组织化，被明确列为该派系的核心目标之一。"
  russia_socialist_events.73.a: "社会革命的最佳盟友！"
  russia_socialist_events.30.d: "《1923年国家保卫法案》曾将一切“共产主义”活动定为非法。玛丽亚·斯皮里多诺娃政府上台后，首先便推翻了所有依据该法案作出的政治犯罪判例。曾经，这条法律如同一柄悬顶之剑——数以千计的社会主义者遭到迫害、锒铛入狱，许多人逃亡西方社会主义国家，加入了那里的布尔什维克流亡群体。如今，大多数人正搭乘“红船”归国，同志们从巴黎、伦敦踏上了返乡之路。\n\n他们在彼得格勒受到热烈欢迎，并宣布与长期在西伯利亚活动的“整合运动”党组织合并。然而，分歧的种子早已埋下。流亡者与国内社会主义者截然不同的经历，正激烈地碰撞。这些流亡者如今更像一个军事政治集团，自视为列宁的正统继承人，对当前俄罗斯的政治局势深感失望。"
  russia_socialist_events.30.a: "欢迎回家？"
  russia_socialist_events.32.d: "由于大批白军军官的自愿或非自愿退役，经验丰富的指挥官已是供不应求。基层连排长缺口尤甚，新组建的部队往往在战术演练和实际调度中暴露出严重的指挥断层。\n\n为此，伏龙芝联名其他流亡归来的红军军官向临时政府提交了一份“军事肃反与改革提案”。提案的核心思路是双管齐下：一方面继续甄别和清除旧军队中不可靠的残余势力，另一方面则大幅加快军事院校的速成培训，并从工农骨干和归国军官中选拔可塑之才填补指挥岗位。\n\n这份提案涉及面极广——从现役军官的重新审查，到部队编制调整，再到新作战条令的编写与推广，事务千头万绪。伏龙芝虽身兼战略决策之职，但无力逐一督办每项改革细节。因此在提案的附加说明中，他特意推荐了自己的得意门生，谢苗·铁木辛哥，负责协调和执行改革中的日常组织工作，以便将这份文件尽快转化为军队的实际战斗力。"
  russia_socialist_events.101.d: "红军部队已推进至彼得格勒城郊，并勒令高尔察克率部投降。然而，这位白军元帅并未在城内露面，依旧留在停泊于城外的旗舰“阿列克谢耶夫将军”号上。波罗的海舰队态度暧昧，蠢蠢欲动，整座城市陷入一种诡异的僵持局面。与此同时，喀琅施塔得要塞和波罗的海舰队对各方通讯均未予实质回应，仅以“收悉”二字敷衍了事。\n\n城市目前仍处于人民控制之下——大部分彼得格勒驻军正属于首批倒戈的部队，他们随即开始逮捕城内不受欢迎的“斯沃博达”分子。\n\n这位海军老帅无疑对社会主义者再次掌权感到出离愤怒，但这一次，他似乎孤立无援。不过，他身边仍有一批忠心的海员和海军步兵营，舰上炮口也依然瞄准着俄罗斯的心脏地带。彼得格勒外的红军内部爆发激烈争论：高尔察克究竟在谋划什么？是组织反革命反扑，还是早已众叛亲离、只剩这支舰队？\n\n最终，政府委派彼得格勒市委员登上“阿列克谢耶夫将军”号，与高尔察克谈判，提出以移交舰队换取体面退休的条件。在舰上，昔日“全俄罗斯最高执政”显得灰头土脸。他只是淡淡地说，或许自己已与俄罗斯渐行渐远，再也看不懂这个国家了。先前对政变的极度担忧最终被证明是多余的——元帅更多的是失望和疲惫。经一番好言劝说，他同意请辞，并表示希望继续担任北极研究委员会主席。"
  russia_socialist_events.101.a: "一场灾难就此避免。"
  russia_socialist_events.332.c: "乌斯季诺夫的观点可谓天才。"
  russia_news_events.8.d: "鲍里斯·萨文科夫就此陨落。由于总统的所作所为让民众与军方愈发愤怒，红场爆发了大规模抗议活动，伴随着响彻首都的枪声，萨文科夫被一名社会革命党人射杀。\n\n乱局之中，曾遭取缔的社会主义政党们揭竿而起，各地相继成立了各自的人民委员会与工农苏维埃。在赤卫队的广泛动员下，临时政府高歌猛进，彼得格勒和南俄罗斯的白军残余势力纷纷作鸟兽散。\n\n俄罗斯似乎仅在一夜之间便成为了社会主义国家，这对欧洲乃至于整个世界而言都产生了深远的影响。"
  russia_news_events.8.c: "世界革命已近在咫尺！"
