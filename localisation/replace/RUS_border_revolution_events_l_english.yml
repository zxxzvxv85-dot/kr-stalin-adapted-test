 RUS_future_foreign_policy_events.13.t:0 "The Bolsheviks of the Baltic"
 RUS_future_foreign_policy_events.13.d:0 "Beyond the Bolsheviks in Russia itself, many communist comrades remain active under imperialist rule. In the Baltic, the Communist Party of Latvia (Bolsheviks) has never wavered.\n\nEver since the United Baltic Duchy, that grotesque creation of imperialism, was founded, the workers and peasants of the Baltic coast have been yoked to the war chariot of the German Junkers and local landed bullies. Land has been enclosed, factories placed under military control, and every act of resistance denounced as communist collusion. Yet deeper oppression has only bred fiercer resistance. Since going underground, the Latvian Communist Party (Bolsheviks) has never ceased its work. As the last Bolsheviks still active within the Ostwall, they have consistently led the resistance.\n\nNow their representatives have reached Moscow through clandestine channels. They bring not only the greetings of the Baltic workers but a request: more weapons, radios and cadres. When the moment comes, the uprising will begin in Riga and spread throughout the Baltic."
 RUS_future_foreign_policy_events.13.a:0 "Freedom shall prevail!"
 russia_socialist_events.183.t:0 "The Kharkov Incident"
 russia_socialist_events.183.d:0 "Last week, a strike by steelworkers at the Kharkov Tractor Plant descended into chaos. Without prior notice, management had cut daily food rations by a third and extended the working day by two hours to support defence production. The workers asked for negotiations and were refused. The following day, a strike committee formed; nearly eight thousand of the twelve thousand workers laid down their tools. Police sent to quell the protest soon became embroiled in violent clashes.\n\nThe revolutionaries acted swiftly. The Borotbists and the Communist Party of Ukraine armed the steelworkers and prepared for the attack they knew would come.\n\nRecognising the gravity of the situation, the reactionary Ukrainian authorities decided to send in the army. The principal organisers of the defence, however, assessed the balance of forces and chose to withdraw their cadres underground rather than face the troops head-on.\n\nMeeting through the night before their withdrawal, the revolutionaries divided their cadres into small groups, hiding them in factories, on the railways and in neighbouring villages. They left behind a complete system of passwords and meeting points. Factories, workers’ districts, railway junctions: almost overnight, the revolutionaries who had once operated openly vanished from the streets. For the Ukrainian authorities, this was hardly a reassuring sign.\n\nThe next day, the Ukrainian government issued warrants and offered a reward for Shumsky and his accomplices, declaring a state of emergency in Kharkov. Despite searching the entire city, they caught only a handful of peripheral members who had failed to escape in time.\n\nWith the help of the Political Security Directorate, Borotbist leader Alexander Shumsky crossed the border and reached Tsaritsyn this morning. He has submitted a request to the intelligence bureau for funds and a team of cadres."
 russia_socialist_events.183.a:0 "We shall spare no effort for our comrades and brothers!"
 RUS_future_foreign_policy_events.14.t:0 "Clashes in Gomel"
 RUS_future_foreign_policy_events.14.d:0 "Not all Belarusians are willing to submit to the puppet government in Minsk. Whether out of anger at reactionary land distribution or at the urging of revolutionary organisers, many residents of eastern Belarus have joined a growing partisan movement.\n\nThe forests and marshes around Gomel provide these small bands with natural cover. Most are smallholders, lumberjacks and railway workers. They lack proper weapons, but know every bog and woodland path. Government columns have repeatedly tried to encircle them, only to lose them in the difficult terrain.\n\nMinsk grows anxious as control slips away. More troops have been dispatched, alongside proclamations promising pardons and land to anyone who surrenders voluntarily. Few have answered. Government forces then burned several villages accused of communist sympathies, driving still more desperate peasants into the partisan ranks.\n\nThe revolutionary organisations have also made several serious approaches to us. They ask for medicine and radios, and for experienced revolutionary instructors. After all, they cannot remain in the forests forever."
 RUS_future_foreign_policy_events.14.a:0 "Get Comrade Voroshilov. There is work for him again."
