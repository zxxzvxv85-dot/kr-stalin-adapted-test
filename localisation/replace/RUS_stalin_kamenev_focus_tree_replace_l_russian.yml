l_russian:
  RUS_kamenev_psr_agenda_in_progress: "Эсеры проводят свой курс"
  RUS_kamenev_psr_agenda_in_progress_desc: "Партия социалистов-революционеров самостоятельно продвигает свою политическую программу. До завершения текущего фокуса баланс сил будет еженедельно смещаться на §Y2%§! в сторону §Rэсеров§!."
  RUS_kamenev_psr_agenda_bop_modifier: "Политическое наступление эсеров"
  RUS_kamenev_psr_agenda_bop_modifier_desc: "Партия социалистов-революционеров использует свою политическую программу, чтобы расширить влияние в Рабочей коалиции."

  RUS_kamenev_three_accounts: "Переговоры с максималистами"
  RUS_kamenev_three_accounts_desc: "Эсеры располагают самой развитой сетью в деревне, но максималисты больше не желают подчиняться их Центральному комитету. Устинов и многие местные организаторы сохранили почти большевистскую дисциплину и стремятся связать земельную революцию с политикой деревенской бедноты. Каменев признает их роль в сельской борьбе в обмен на организационную самостоятельность и доступ к деревенским советам."
  RUS_kamenev_no_permanent_creditor: "Ограничить влияние эсеров"
  RUS_kamenev_no_permanent_creditor_desc: "Эсеры сыграли главную роль в восстании и теперь требуют передать им земельную политику, внутренние дела и местное управление. Но заслуги в революции не дают им права бессрочно господствовать в правительстве. Мы введём единый порядок местных назначений, проверим случаи превышения полномочий и заручимся поддержкой максималистов против контроля эсеровского ЦК над деревней."
  RUS_kamenev_one_party_card: "Сохранить революционную чистоту"
  RUS_kamenev_one_party_card_desc: "Коалиция может временно объединять разные левые силы, но большевики не должны растворить свою программу в бесконечных уступках. Партийная дисциплина будет усилена, ответственные кадры обязаны открыто обозначить принадлежность, а соглашения не должны мешать рабочему классу овладеть государственным аппаратом. Союзников станет меньше, зато партия сохранит ясный курс."
  RUS_kamenev_majority_rule: "Расширить политическую коалицию"
  RUS_kamenev_majority_rule_desc: "Одних вернувшихся ветеранов недостаточно, чтобы управлять всей Россией. Беспартийных рабочих ВСТ, низовых эсеров, максималистов и делегатов местных советов можно привлечь конкретными предложениями. Каменев видит более широкую революционную коалицию, а Зиновьев — новые мандаты и кадровые сети."
  RUS_kamenev_concessions_to_bolsheviks_unlock_tt: "Открывает повторяемое решение: §YУступки большевикам§!"
  RUS_kamenev_concessions_to_esers_unlock_tt: "Открывает повторяемое решение: §YУступки эсерам§!"
  RUS_kamenev_concessions_to_bolsheviks: "Уступки большевикам"
  RUS_kamenev_concessions_to_bolsheviks_desc: "Большевики сохраняют дисциплинированные организации на заводах, железных дорогах и в армии. Ослабив ограничения на их открытую деятельность и приняв часть организационных требований, правительство удержит их сторонников в рамках легальной политики."
  RUS_kamenev_concessions_to_esers: "Уступки эсерам"
  RUS_kamenev_concessions_to_esers_desc: "Эсеры по-прежнему располагают широкой сетью сельских комитетов, кооперативов и местных советов. Приняв часть их программы и предоставив союзникам больше места в правительстве, мы укрепим партии, поддерживающие коалицию."
  RUS_kamenev_revolutionary_legality: "Переговоры с фракцией Камкова"
  RUS_kamenev_revolutionary_legality_desc: "Сторонники Камкова участвовали в эсеровском восстании, но не желают превращать победу в постоянную монополию ЦК ПСР над землёй, внутренними делами и местной властью. Они поддерживают власть советов, сохраняя собственную организацию. Каменев предложит ограниченное сотрудничество, чтобы расколоть эсеровский центр и не вытолкнуть этих левых в оппозицию."

  RUS_science_of_marxism: "[ROOT.RUSGetKamenevScienceOfMarxismName]"
  RUS_kamenev_science_of_marxism_name: "Марксистское образование"
  RUS_kamenev_science_of_marxism_name_default: "Наука марксизма"

  RUS_mensheviks: "[ROOT.RUSGetKamenevMensheviksName]"
  RUS_mensheviks_desc: "[ROOT.RUSGetKamenevMensheviksDesc]"
  RUS_kamenev_mensheviks_name: "Трёхпартийное правительство"
  RUS_kamenev_mensheviks_desc: "ВСТ, Партия социалистов-революционеров и РКП(б) вместе сформируют временное правительство. Эсеры контролируют многие местные учреждения, ВСТ ведает профсоюзами и советами, а большевики влиятельны среди военных и вернувшихся эмигрантов. Каменев возглавит переговоры. Поскольку и ВСТ, и эсеры готовы иметь с ним дело, он постепенно становится публичным лицом большевиков в коалиции: Каменев идёт на компромиссы от имени партии, пока её аппарат восстанавливается за кулисами."
  RUS_kamenev_mensheviks_name_default: "Данисты"
  RUS_kamenev_mensheviks_desc_default: "Правое крыло ВСТ получило название по имени своего лидера, старого меньшевика Фёдора Дана. Данисты выступают за расширение революционной политики и осторожный переход к социалистической экономике. Жестокость двадцатых годов и диктатура Савинкова радикализовали многих бывших меньшевиков, а также часть склонных к компромиссу бывших большевиков, и привели их в эту фракцию."

  RUS_eser_deal: "[ROOT.RUSGetKamenevEserDealName]"
  RUS_eser_deal_desc: "[ROOT.RUSGetKamenevEserDealDesc]"
  RUS_kamenev_eser_deal_name: "Признать вклад эсеров"
  RUS_kamenev_eser_deal_desc: "Без восстания социалистов-революционеров социалисты не смогли бы так быстро взять Россию под контроль. Правительство признает их роль в революции и будет сотрудничать с ними в вопросах земли, местного самоуправления и крестьянских организаций. Однако максималисты Устинова должны сохранить самостоятельность, чтобы эсеровский ЦК не мог единолично определять политику в деревне."
  RUS_kamenev_eser_deal_desc_default: "Понимание социализма у Партии социалистов-революционеров всегда вызывало сомнения. Большинство эсеров возвышает крестьянство, отвергает марксизм и придерживается аграрного социализма, но как бы то ни было, мы связаны с ними. Мы обратимся к идеологически близким эсерам в надежде заключить более прочное соглашение."

  RUS_invite_sverdlov: "[ROOT.RUSGetKamenevInviteSverdlovName]"
  RUS_invite_sverdlov_desc: "[ROOT.RUSGetKamenevInviteSverdlovDesc]"
  RUS_kamenev_invite_sverdlov_name: "Возвращение к ленинизму"
  RUS_kamenev_invite_sverdlov_desc: "РКП(б) больше не может влиять на правительство только через левое крыло ВСТ, старых товарищей в армии и личные связи. Свердлов войдёт в совет министров от имени восстановленной партийной организации и свяжет вернувшиеся кадры, местные ячейки и большевиков в армии. Каменев по-прежнему будет вести переговоры с другими партиями, но у РКП(б) вновь появится собственная организация."
  RUS_kamenev_invite_sverdlov_name_default: "Возвращение к ленинизму"
  RUS_kamenev_invite_sverdlov_desc_default: "Хотя оставшиеся независимыми большевики отказались вступать в ВСТ, они всё ещё являются важной частью Рабочей коалиции. Их гражданский лидер и теоретик Яков Свердлов — талантливый администратор, популярный среди эмигрантов и военных, а также опытный революционер. Ради единства мы обратимся к старому товарищу и официально пригласим его в совет министров."

  RUS_invite_zeller: "[ROOT.RUSGetKamenevInviteZellerName]"
  RUS_invite_zeller_desc: "[ROOT.RUSGetKamenevInviteZellerDesc]"
  RUS_kamenev_invite_zeller_name: "Сохранить широкую коалицию ВСТ"
  RUS_kamenev_invite_zeller_desc: "Целлер и Социал-демократический союз всё ещё пользуются влиянием среди зажиточных рабочих, мелких собственников и умеренных членов ВСТ. Если они останутся в Рабочей коалиции, эти группы не уйдут целиком к эсерам, а правительство сохранит более широкую поддержку. За это придётся платить долгими переговорами по многим вопросам."
  RUS_kamenev_invite_zeller_name_default: "Пригласить Целлера"
  RUS_kamenev_invite_zeller_desc_default: "Многие считают Социал-демократический союз остатком реакционной РДП, однако он пользуется поддержкой зажиточных рабочих и мелких предпринимателей, особенно на юге России. Его новый лидер Гергард Целлер придерживается самых умеренных социалистических взглядов, но наверняка понимает пользу сотрудничества. Пришло время официально пригласить его в совет министров, а его партию — в Рабочую коалицию."

  RUS_internationalists: "[ROOT.RUSGetKamenevInternationalistsName]"
  RUS_internationalists_desc: "[ROOT.RUSGetKamenevInternationalistsDesc]"
  RUS_kamenev_internationalists_name: "Первый съезд после победы"
  RUS_kamenev_internationalists_desc: "Временные договорённости должен утвердить съезд. Профсоюзы, советы, крестьянские комитеты и революционные партии со всей России обсудят земельную реформу, плановую экономику, устройство государства и полномочия каждой партии. Готовя съезд, Зиновьев выяснил позиции делегатов и фракций и начал готовиться к борьбе за руководство ВСТ."
  RUS_kamenev_internationalists_name_default: "Интернационалисты"
  RUS_kamenev_internationalists_desc_default: "Интернационалисты, получившие название из-за приверженности синдикалистскому синтезу Третьего Интернационала, составляют центр ВСТ. Они выступают за совместную власть советов и профсоюзов, поддерживают Рабочую коалицию и в основном группируются вокруг Левицкого и Сулимова."

  RUS_communists: "[ROOT.RUSGetKamenevCommunistsName]"
  RUS_communists_desc: "[ROOT.RUSGetKamenevCommunistsDesc]"
  RUS_kamenev_communists_name: "Возрождение большевиков"
  RUS_kamenev_communists_desc: "Центральные и местные органы РКП(б) вновь начнут открытую работу, хотя пока партия останется в коалиционном правительстве под руководством ВСТ. Каменев ведёт переговоры с другими партиями, Свердлов восстанавливает организацию, а Зиновьев укрепляет позиции среди левого крыла ВСТ и его съездовской фракции. Вместе с партией вернулся и вопрос о том, кто должен её возглавить."
  RUS_kamenev_communists_name_default: "Коммунисты"
  RUS_kamenev_communists_desc_default: "Левое крыло ВСТ предпочитает называть себя коммунистами. Оно стремится как можно быстрее перейти к плановой социалистической экономике и продолжать социальную революцию без уступок реакции. Обычно фракцию возглавляет Лев Каменев, однако влияние Григория Зиновьева может придать ей более личный характер."

  RUS_war_on_landowners: "[ROOT.RUSGetKamenevWarOnLandownersName]"
  RUS_war_on_landowners_desc: "[ROOT.RUSGetKamenevWarOnLandownersDesc]"
  RUS_kamenev_war_on_landowners_name: "Ускорить завершение аграрного перехода"
  RUS_kamenev_war_on_landowners_desc: "Максималисты сохранили в деревне обширную подпольную сеть. Их методы ближе к большевистским, чем к линии большинства эсеров. Устинов организует комитеты бедноты и активистов колхозов для борьбы с помещиками, кулаками и спекулянтами хлебом. Это продвинет земельную реформу и одновременно ослабит контроль эсеровского ЦК над революционным движением в деревне."
  RUS_kamenev_war_on_landowners_name_default: "Ускорить завершение аграрного перехода"
  RUS_kamenev_war_on_landowners_desc_default: "Крестьянство — переходный класс, которому суждено исчезнуть. Мы должны ускорить его превращение в сельскохозяйственных рабочих и лишить старые мелкобуржуазные идеи классовой почвы."

  RUS_stalin_kamenev_tree.1.t: "Список, принесённый Устиновым"
  RUS_stalin_kamenev_tree.1.d: "Устинов принёс не официальную программу, а книгу деревенских контактов: старых максималистов, руководителей комитетов бедноты, активистов коллективных хозяйств и местных организаторов, порвавших с ЦК ПСР. Они поддерживают земельную революцию и рабоче-крестьянскую власть, сказал он Каменеву, но больше не позволят эсерам говорить от имени всей деревни.\n\nКаменев пообещал организационную самостоятельность и места в земельных и сельскохозяйственных органах. Взамен Устинов подключит эти группы к общероссийской сети. Свердлов потребовал зарегистрировать все связи в центре, а Зиновьев уже подсчитывал, сколько деревенских голосов принесёт список коммунистической фракции."
  RUS_stalin_kamenev_tree.1.a: "Восстановим связи с товарищами в деревне."
  RUS_stalin_kamenev_tree.3.t: "Граница революционной чистоты"
  RUS_stalin_kamenev_tree.3.d: "Центральное бюро постановило, что коалиционное сотрудничество не может стоять выше большевистской программы. Партийцы в ключевых учреждениях обязаны раскрыть организационные связи, а важные предложения сначала обсуждаются фракцией. Каменев назвал это мерой против путаницы; эсеры увидели вторую цепь командования внутри правительства.\n\nЗиновьев взялся проверять мандаты и кадры. Под лозунгом чистоты через его руки проходило всё больше назначений. Свердлов поддерживал дисциплину, но начал спрашивать себя, не становится ли «чистота» у Зиновьева синонимом личного послушания."
  RUS_stalin_kamenev_tree.3.a: "Сотрудничество не заменит партийную программу."
  RUS_stalin_kamenev_tree.4.t: "Пригласить друзей в зал"
  RUS_stalin_kamenev_tree.4.d: "Каменев пригласил на политические совещания беспартийных рабочих ВСТ, делегатов местных советов, максималистов и готовых к сотрудничеству низовых эсеров. Вместо партийных квот они обсуждали хлеб, управление заводами и восстановление. Многие, кто не вступил бы в партию, согласились вносить предложения вместе с большевиками.\n\nЗиновьев распределял делегации и порядок выступлений, быстро узнавая требования и слабости новых союзников. Каменев видел широкую революционную коалицию. Зиновьев — ведомость голосов, которую можно обрабатывать мандат за мандатом."
  RUS_stalin_kamenev_tree.4.a: "Будем работать вместе над конкретными вопросами."
  RUS_stalin_kamenev_tree.5.t: "Условия Камкова"
  RUS_stalin_kamenev_tree.5.d: "Камков согласился ослабить контроль ЦК ПСР над местными учреждениями и поддержать ведущую роль профсоюзов и советов. Он поставил два условия: не объявлять всех эсеров контрреволюционерами и не заменять центральными назначенцами советы, возникшие в ходе восстания.\n\nКаменев принял ограниченное сотрудничество и оставил фракции Камкова пространство для легальной работы. Соглашение оттянуло кадры от эсеровского центра, не превратив их в большевистский придаток. Зиновьеву не нравилась двусмысленность, но он понимал, что этих делегатов ещё можно привлечь."
  RUS_stalin_kamenev_tree.5.a: "Сначала разрушим монополию, которой противостоим вместе."

  RUS_kamenev_psr_automatic_focus_tt: "Эта политическая программа автоматически проводится §YПартией социалистов-революционеров§! и не может быть выбрана игроком. Её выполнение изменит отношения между партиями и баланс сил в революционном правительстве."
  RUS_kamenev_bol_automatic_focus_tt: "Это организационный фокус §YРоссийской коммунистической партии (большевиков)§!, который игрок выбирает самостоятельно. Его выполнение изменит отношения между партиями и баланс сил в революционном правительстве."
  RUS_kamenev_psr_agenda_originator: "Центральный комитет ПСР"
  RUS_kamenev_bol_agenda_originator: "Центральное бюро РКП(б)"

  RUS_kamenev_psr_rebuild_central_committee: "Примирение в ПСР"
  RUS_kamenev_psr_rebuild_central_committee_desc: "После восстания эсеры из подпольных групп, местных комитетов и партизанских отрядов вновь собираются вокруг центра. Спиридонова восстанавливает общероссийский партийный аппарат и превращает временные революционные связи в формальную организацию. Видимость единства также позволяет ЦК вернуть контроль над губернскими списками кадров."
  RUS_kamenev_psr_absorb_democratic_parties: "Привлечь демократические партии"
  RUS_kamenev_psr_absorb_democratic_parties_desc: "В деревне эсеры сильны, но в городских профсоюзах и учреждениях уступают ВСТ и большевикам. Спиридонова откроет связанные с партией организации для Социал-демократического союза, сторонников местного самоуправления и умеренных левых, признавших социалистическую республику и земельную революцию. Так влияние ПСР распространится и на городские округа."
  RUS_kamenev_psr_preserve_land_committees: "Воссоединиться с правыми"
  RUS_kamenev_psr_preserve_land_committees_desc: "Правые эсеры, остававшиеся в стороне во время восстания, готовы вернуться. Они признают социалистический поворот республики, но требуют местной автономии, кооперативов и более осторожной аграрной политики. ЦК обменяет уступки на партийное единство и ослабит влияние максималистов."
  RUS_kamenev_psr_land_socialisation_bill: "Проект социализации земли"
  RUS_kamenev_psr_land_socialisation_bill_desc: "Эсеры предлагают передать землю в общее пользование трудящихся и распределять её через местные комитеты, а не прямую собственность центрального государства. Большевики и максималисты поддерживают конфискацию, но требуют защитить бедняцкие организации, совхозы и коллективные хозяйства от большинства зажиточной деревни."
  RUS_kamenev_psr_local_self_government: "Устав автономии сельских советов"
  RUS_kamenev_psr_local_self_government_desc: "Эсеры предлагают ограничить право центра смещать сельских представителей и вмешиваться в волостные бюджеты. Устав защитит органы, возникшие в революции, и одновременно закрепит организационное преимущество ПСР в деревне."
  RUS_kamenev_psr_claim_internal_affairs: "Создать сельскую милицию"
  RUS_kamenev_psr_claim_internal_affairs_desc: "Повстанческие комитеты объединяют партизан, деревенскую стражу и трофейное оружие в сельскую милицию. Эсеры хотят подчинить её местным советам и поручить политическую работу ветеранам восстания. Большевики опасаются раздробления вооружённых сил, и спор быстро переходит к командирам и ключам от арсеналов."
  RUS_kamenev_psr_cooperatives_fair_grain_prices: "Расширить сеть кооперативов"
  RUS_kamenev_psr_cooperatives_fair_grain_prices_desc: "Эсеры расширяют производственные, кредитные и зерновые кооперативы, заменяя временные реквизиции и частных посредников организованным обменом. Система улучшит снабжение и укрепит повседневное влияние партии в деревне. Максималисты требуют отдельных мест для бедноты, чтобы новые органы не захватили зажиточные хозяева."
  RUS_kamenev_psr_peasant_congress: "Увеличить представительство крестьян"
  RUS_kamenev_psr_peasant_congress_desc: "ПСР требует закрепить места для крестьянских делегатов в комиссариатах, плановых органах и съезде ВСТ. Спор идёт не о праве крестьян говорить, а о том, кто выбирает их представителей: местные советы, кооперативы, комитеты бедноты или партийные организации эсеров."
  RUS_kamenev_psr_defend_revolutionary_democracy: "Запретить двойное членство"
  RUS_kamenev_psr_defend_revolutionary_democracy_desc: "ЦК ПСР требует, чтобы чиновники с билетами ВСТ и РКП(б) выбрали одну организацию. Формально это проясняет партийную ответственность; фактически эсеры хотят перекрыть большевикам возможность использовать открытую структуру ВСТ для роста дисциплинированной фракции."
  RUS_kamenev_psr_final_party_congress: "Умиротворить максималистов"
  RUS_kamenev_psr_final_party_congress_desc: "Максималисты выступают против нового господства эсеров в деревне и угрожают увести больше местных организаторов к большевикам. Спиридонова обещает отдельное представительство бедноте, сельским рабочим и коллективным хозяйствам и больше не требует немедленного роспуска максималистской организации. Компромисс предотвращает открытый раскол, но не решает спор о направлении сельской революции."
  RUS_kamenev_psr_agrarian_socialism: "Аграрный социализм"
  RUS_kamenev_psr_agrarian_socialism_desc: "Социализация земли, кооперативы, автономия сельских советов и крестьянское представительство складываются в единую программу. Эсеры провозглашают путь к социализму через свободный союз трудовых общин и объявляют себя естественным голосом деревни. Максималисты и большевики принимают земельную революцию, но не признают исчезновения классовой борьбы."

  RUS_kamenev_bol_register_returning_members: "Бюро учёта вернувшихся кадров"
  RUS_kamenev_bol_register_returning_members_desc: "Свердлов заново составляет списки вернувшихся партийцев, эмигрантов и подпольных связных. Каменев объясняет коалиции, что это обычная партийная работа, а Зиновьев через проверку мандатов и назначений узнаёт, кто сможет войти во все уровни аппарата ВСТ."
  RUS_kamenev_bol_restore_central_bureau: "Два партийных билета"
  RUS_kamenev_bol_restore_central_bureau_desc: "Член партии может открыто вступить в ВСТ и тайно сохранить дисциплину РКП(б). Каменев публично объясняет, почему две лояльности не противоречат друг другу, а Зиновьев хранит список, который никогда не будет опубликован. Большевики получают законное прикрытие и собственную организацию."
  RUS_kamenev_bol_restore_pravda: "«Правда» возвращается в Россию"
  RUS_kamenev_bol_restore_pravda_desc: "Зиновьев возрождает «Правду» с независимой редакцией и возвращает большевикам голос вне ВСТ. Газета открыто нападает на местничество эсеров и постепенно изображает Каменева полезным посредником, которому не хватает решимости долго руководить коммунистическим течением."
  RUS_kamenev_bol_rebuild_factory_cells: "Партийные ячейки в цехах"
  RUS_kamenev_bol_rebuild_factory_cells_desc: "Заводские группы Петрограда, Москвы, Урала и Донбасса восстанавливают связь и проводят единую линию в профсоюзах и советах. ВСТ остаётся открытой формой рабочей политики, но всё больше низовых предложений сначала решается внутри большевистской фракции."
  RUS_kamenev_bol_railway_telegraph_bureau: "Бюро железнодорожной и телеграфной связи"
  RUS_kamenev_bol_railway_telegraph_bureau_desc: "Железнодорожники, телеграфисты и подпольные курьеры создают общероссийскую сеть, доставляющую указания Центрального бюро в обход местных властей. Она восстанавливает связи, разрушенные гражданской войной, и впервые даёт Зиновьеву канал, не зависящий от Каменева."
  RUS_kamenev_bol_unify_planning_apparatus: "Открыть партийные школы"
  RUS_kamenev_bol_unify_planning_apparatus_desc: "Центральное бюро открывает партийные школы для промышленных статистиков, инженеров, профсоюзных активистов и местных секретарей. Здесь преподают марксизм, организационную работу и государственное управление, после чего выпускников направляют в комиссариаты и советы. Школы дают государству кадры, а Зиновьеву — новый канал влияния на назначения."
  RUS_kamenev_bol_win_vst_majority: "Учредить бюро связи с максималистами"
  RUS_kamenev_bol_win_vst_majority_desc: "Устинов связывает организации бедноты, сельских радикалов и подполье максималистов с большевиками. Публично это сотрудничество против монополии ПСР в деревне; для Зиновьева это также кратчайший путь от городских фракций к голосам сельских делегатов."
  RUS_kamenev_bol_undissolved_central_committee: "Поднять красное знамя"
  RUS_kamenev_bol_undissolved_central_committee_desc: "От «Правды» и заводских ячеек до железнодорожной сети и деревенских максималистов РКП(б) вновь располагает общероссийской организацией. Сохранённые Свердловым мандаты доказывают, что Центральный комитет никогда не распускался. Красное знамя вновь поднимется над штабом партии, но после завоевания Зиновьевым большинства коммунистов ВСТ вопрос о том, кто держит древко, остаётся открытым."

  RUS_kamenev_national_economic_line: "Генеральная линия народного хозяйства"
  RUS_kamenev_national_economic_line_desc: "Первая пятилетка свела разрозненные производственные задания в единый план, однако заводы, железные дороги и освоение ресурсов всё ещё развиваются несогласованно. Высший совет народного хозяйства установит общий порядок работ: укрепить крупнейшие города, превратить Урал в новую связь между западом и востоком и заранее подготовить людей и технику для долгого освоения Сибири."
  RUS_kamenev_all_russian_electrification_unlock_tt: "Открывает повторяемое решение: §YВсероссийский проект электрификации§!"
  RUS_kamenev_all_russian_electrification: "Всероссийский проект электрификации"
  RUS_kamenev_all_russian_electrification_desc: "Электрификация не должна оставаться планом центральных ведомств. Изыскатели, линейные бригады и местные советы будут участок за участком расширять сеть, связывая новые электростанции, железные дороги и промышленные районы."
  RUS_kamenev_all_russian_electrification_available_tt: "Есть хотя бы одна принадлежащая нам и контролируемая нами §Yнациональная область§! с уровнем §Yинфраструктуры§! ниже 5"
  RUS_kamenev_all_russian_electrification_complete_tt: "Построить §G1§! уровень §Yинфраструктуры§! в случайной принадлежащей нам и контролируемой нами §Yнациональной области§!\nДобавить §G1§! §Yячейку для строительства§! в той же области\nПолучить §Yочки пятилетнего плана§!: §G+1§!"
  RUS_kamenev_industrialise_urals: "Плановое освоение природы"
  RUS_kamenev_industrialise_urals_desc: "От Волги до Енисея реки, леса и минеральные богатства России больше нельзя делить между отдельными местными ведомствами. Гидроузлы, разведка ресурсов, энергетика и новые промышленные города войдут в единый план преобразования природы и создания новых опор индустрии на западе и востоке страны."
  RUS_rybinsk_hydroelectric_dam: "Рыбинская гидроэлектростанция"
  RUS_rybinsk_hydroelectric_dam_desc: "Рыбинск стоит на широкой верхней Волге, недалеко от Москвы и северных промышленных районов. Плотина, шлюзы и крупная электростанция обеспечат их устойчивой энергией и улучшат судоходство. Однако новое водохранилище затопит деревни и пахотные земли, поэтому переселение жителей должно войти в общий план работ."
  RUS_zhiguli_hydroelectric_dam: "Жигулёвская гидроэлектростанция"
  RUS_zhiguli_hydroelectric_dam_desc: "У Жигулёвских гор Волга резко сужается, и окрестности Ставрополя-на-Волге подходят для крупного гидроузла. Станция даст энергию Самаре и промышленному поясу Среднего Поволжья, улучшит судоходство и поможет вырасти новому рабочему городу на берегу реки."
  RUS_krasnoyarsk_hydroelectric_dam: "Красноярская гидроэлектростанция"
  RUS_krasnoyarsk_hydroelectric_dam_desc: "Енисей вырывается из Саянских гор к Красноярску, но его огромный поток и перепад высот почти не используются. Плотина выше города обеспечит энергией сибирскую металлургию, рудники и железные дороги, превратив Красноярск в одну из опор индустриализации востока."
  RUS_kamenev_industrialise_eastern_europe: "Расширить влияние городов"
  RUS_kamenev_industrialise_eastern_europe_desc: "Города западной и центральной России уже располагают лучшими заводами, учебными заведениями и транспортными узлами страны. Расширение производства, сельскохозяйственного машиностроения и железных дорог позволит направить знания, оборудование и организаторские силы в окружающие районы."
  RUS_urban_renovation_and_expansion: "Реконструкция и расширение"
  RUS_renovate_and_expand_moscow: "Реконструкция и расширение: [219.GetName]"
  RUS_renovate_and_expand_moscow_desc: "[219.GetName] — политический и хозяйственный центр России, но его дороги, жильё и коммунальные сети уже не справляются с ростом населения, учреждений и предприятий. Городской совет снесёт аварийные здания, расширит магистрали, обновит сети и промышленные районы, чтобы столица могла увереннее развивать окружающие области."
  RUS_renovate_and_expand_tsaritsyn: "Реконструкция и расширение: [217.GetName]"
  RUS_renovate_and_expand_tsaritsyn_desc: "[217.GetName] контролирует нижнюю Волгу и связывает торговлю хлебом, нефтью и металлом юга России. Расширение пристаней, заводских районов, рабочего жилья и коммунальных служб превратит город в ещё более мощный промышленный центр всего Поволжья."
  RUS_renovate_and_expand_saint_petersburg: "Реконструкция и расширение: [195.GetName]"
  RUS_renovate_and_expand_saint_petersburg_desc: "[195.GetName] сохраняет важнейший российский порт, верфи и машиностроение, но годы кризиса износили жильё и коммунальные сети. Общая программа ремонта и расширения вновь свяжет старые промышленные районы с гаванью и даст северной столице пространство для роста."
  RUS_kamenev_industrialise_siberia: "Великое освоение Сибири"
  RUS_kamenev_industrialise_siberia_desc: "Сибирь хранит огромные запасы металлов, минералов и топлива, которые почти не разрабатываются. Капитал, технические кадры и новые железные дороги превратят забытый восток в важнейшую сырьевую базу социалистической индустриализации."
  RUS_auto_kamenev_vst_left_path: "Левая линия ВСТ под руководством Каменева утвердилась"
