l_russian:
  RUS_kamenev_three_accounts: "Распределение власти после победы"
  RUS_kamenev_three_accounts_desc: "Социалистическая власть была установлена благодаря восстанию эсеров и тому, что ВСТ взял под контроль профсоюзы и советы. Тем временем большевистские кадры после долгой эмиграции возвращаются в Россию. Все три силы требуют мест в правительстве и права участвовать в выработке его курса. Каменеву предстоит определить их полномочия, иначе временный союз может распасться сразу после победы."
  RUS_kamenev_no_permanent_creditor: "Ограничить влияние эсеров"
  RUS_kamenev_no_permanent_creditor_desc: "Эсеры сыграли главную роль в восстании и теперь требуют передать им земельную политику, внутренние дела и местное управление. Но заслуги в революции не дают им права бессрочно господствовать в правительстве. Мы введём единый порядок местных назначений, проверим случаи превышения полномочий и заручимся поддержкой максималистов против контроля эсеровского ЦК над деревней."
  RUS_kamenev_one_party_card: "Единый партийный учёт"
  RUS_kamenev_one_party_card_desc: "Все большевики, работающие в учреждениях ВСТ, должны зарегистрировать партийную принадлежность и соблюдать общую организационную дисциплину. Каменев продолжит вести открытые переговоры, а Свердлов восстановит связи между местными партийными организациями. Зиновьев тем временем вмешивается в кадровые назначения, расширяя своё влияние внутри ВСТ."
  RUS_kamenev_majority_rule: "Передать решение съезду"
  RUS_kamenev_majority_rule_desc: "Рабочая коалиция не может вечно полагаться на договорённости партийных вождей за пределами зала заседаний. Важнейшие предложения будут выноситься на голосование съезда. Каждая фракция вправе добиваться поддержки, но после принятия решения она уже не сможет угрожать выходом из правительства и требовать новых переговоров."
  RUS_kamenev_revolutionary_legality: "Установить революционную законность"
  RUS_kamenev_revolutionary_legality_desc: "Революция оставила после себя множество временных распоряжений, самоуправство местных властей и привычку партий прикрывать собственных чиновников. Правительство введёт единые процедуры, создаст государственную инспекцию и порядок обжалования для кадров, а также будет пресекать злоупотребления властью и отказ выполнять решения центра."

  RUS_mensheviks: "[ROOT.RUSGetKamenevMensheviksName]"
  RUS_mensheviks_desc: "[ROOT.RUSGetKamenevMensheviksDesc]"
  RUS_kamenev_mensheviks_name: "Трёхпартийное правительство"
  RUS_kamenev_mensheviks_desc: "ВСТ, Партия социалистов-революционеров и РКП(б) вместе сформируют временное правительство. Эсеры контролируют многие местные учреждения, ВСТ ведает профсоюзами и советами, а большевики влиятельны среди военных и вернувшихся эмигрантов. Каменев возглавит переговоры. Поскольку и ВСТ, и эсеры готовы иметь с ним дело, он постепенно становится публичным лицом большевиков в коалиции: Каменев идёт на компромиссы от имени партии, пока её аппарат восстанавливается за кулисами."
  RUS_kamenev_mensheviks_name_default: "Данисты"
  RUS_kamenev_mensheviks_desc_default: "Правое крыло ВСТ получило название по имени своего лидера, старого меньшевика Фёдора Дана. Данисты выступают за расширение революционной политики и осторожный переход к социалистической экономике. Жестокость двадцатых годов и диктатура Савинкова радикализовали многих бывших меньшевиков, а также часть склонных к компромиссу бывших большевиков, и привели их в эту фракцию."

  RUS_eser_deal: "[ROOT.RUSGetKamenevEserDealName]"
  RUS_eser_deal_desc: "[ROOT.RUSGetKamenevEserDealDesc]"
  RUS_kamenev_eser_deal_name: "Признать вклад эсеров в восстание"
  RUS_kamenev_eser_deal_desc: "Без восстания социалистов-революционеров социалисты не смогли бы так быстро взять Россию под контроль. Правительство признает их роль в революции и будет сотрудничать с ними в вопросах земли, местного самоуправления и крестьянских организаций. Однако максималисты Устинова должны сохранить самостоятельность, чтобы эсеровский ЦК не мог единолично определять политику в деревне."
  RUS_kamenev_eser_deal_desc_default: "Понимание социализма у Партии социалистов-революционеров всегда вызывало сомнения. Большинство эсеров возвышает крестьянство, отвергает марксизм и придерживается аграрного социализма, но как бы то ни было, мы связаны с ними. Мы обратимся к идеологически близким эсерам в надежде заключить более прочное соглашение."

  RUS_invite_sverdlov: "[ROOT.RUSGetKamenevInviteSverdlovName]"
  RUS_invite_sverdlov_desc: "[ROOT.RUSGetKamenevInviteSverdlovDesc]"
  RUS_kamenev_invite_sverdlov_name: "Вернуть РКП(б) к открытой работе"
  RUS_kamenev_invite_sverdlov_desc: "РКП(б) больше не может влиять на правительство только через левое крыло ВСТ, старых товарищей в армии и личные связи. Свердлов войдёт в совет министров от имени восстановленной партийной организации и свяжет вернувшиеся кадры, местные ячейки и большевиков в армии. Каменев по-прежнему будет вести переговоры с другими партиями, но у РКП(б) вновь появится собственная организация."
  RUS_kamenev_invite_sverdlov_name_default: "Возвращение к ленинизму"
  RUS_kamenev_invite_sverdlov_desc_default: "Хотя оставшиеся независимыми большевики отказались вступать в ВСТ, они всё ещё являются важной частью Рабочей коалиции. Их гражданский лидер и теоретик Яков Свердлов — талантливый администратор, популярный среди эмигрантов и военных, а также опытный революционер. Ради единства мы обратимся к старому товарищу и официально пригласим его в совет министров."

  RUS_invite_zeller: "[ROOT.RUSGetKamenevInviteZellerName]"
  RUS_invite_zeller_desc: "[ROOT.RUSGetKamenevInviteZellerDesc]"
  RUS_kamenev_invite_zeller_name: "Сохранить широкую коалицию ВСТ"
  RUS_kamenev_invite_zeller_desc: "Целлер и Социал-демократический союз всё ещё пользуются влиянием среди зажиточных рабочих, мелких собственников и умеренных членов ВСТ. Если они останутся в Рабочей коалиции, эти группы не уйдут целиком к эсерам, а правительство сохранит более широкую поддержку. За это придётся платить долгими переговорами по многим вопросам."
  RUS_kamenev_invite_zeller_name_default: "Пригласить Целлера"
  RUS_kamenev_invite_zeller_desc_default: "Многие считают Социал-демократический союз остатком реакционной РДП, однако он пользуется поддержкой зажиточных рабочих и мелких предпринимателей, особенно на юге России. Его новый лидер Гергард Целлер придерживается самых умеренных социалистических взглядов, но наверняка понимает пользу сотрудничества. Пришло время официально пригласить его в совет министров, а его партию — в Рабочую коалицию."

  RUS_internationalists: "[ROOT.RUSGetKamenevInternationalistsName]"
  RUS_internationalists_desc: "[ROOT.RUSGetKamenevInternationalistsDesc]"
  RUS_kamenev_internationalists_name: "Первый съезд после победы"
  RUS_kamenev_internationalists_desc: "Временные договорённости должен утвердить съезд. Профсоюзы, советы, крестьянские комитеты и революционные партии со всей России обсудят земельную реформу, плановую экономику, устройство государства и полномочия каждой партии. Готовя съезд, Зиновьев выяснил позиции делегатов и фракций и начал готовиться к борьбе за руководство ВСТ."
  RUS_kamenev_internationalists_name_default: "Интернационалисты"
  RUS_kamenev_internationalists_desc_default: "Интернационалисты, получившие название из-за приверженности синдикалистскому синтезу Третьего Интернационала, составляют центр ВСТ. Они выступают за совместную власть советов и профсоюзов, поддерживают Рабочую коалицию и в основном группируются вокруг Левицкого и Сулимова."

  RUS_communists: "[ROOT.RUSGetKamenevCommunistsName]"
  RUS_communists_desc: "[ROOT.RUSGetKamenevCommunistsDesc]"
  RUS_kamenev_communists_name: "Возрождение большевиков"
  RUS_kamenev_communists_desc: "Центральные и местные органы РКП(б) вновь начнут открытую работу, хотя пока партия останется в коалиционном правительстве под руководством ВСТ. Каменев ведёт переговоры с другими партиями, Свердлов восстанавливает организацию, а Зиновьев укрепляет позиции среди левого крыла ВСТ и его съездовской фракции. Вместе с партией вернулся и вопрос о том, кто должен её возглавить."
  RUS_kamenev_communists_name_default: "Коммунисты"
  RUS_kamenev_communists_desc_default: "Левое крыло ВСТ предпочитает называть себя коммунистами. Оно стремится как можно быстрее перейти к плановой социалистической экономике и продолжать социальную революцию без уступок реакции. Обычно фракцию возглавляет Лев Каменев, однако влияние Григория Зиновьева может придать ей более личный характер."

  RUS_war_on_landowners: "[ROOT.RUSGetKamenevWarOnLandownersName]"
  RUS_war_on_landowners_desc: "[ROOT.RUSGetKamenevWarOnLandownersDesc]"
  RUS_kamenev_war_on_landowners_name: "Большевики в деревне"
  RUS_kamenev_war_on_landowners_desc: "Максималисты сохранили в деревне обширную подпольную сеть. Их методы ближе к большевистским, чем к линии большинства эсеров. Устинов организует комитеты бедноты и активистов колхозов для борьбы с помещиками, кулаками и спекулянтами хлебом. Это продвинет земельную реформу и одновременно ослабит контроль эсеровского ЦК над революционным движением в деревне."
  RUS_kamenev_war_on_landowners_name_default: "Ускорить завершение аграрного перехода"
  RUS_kamenev_war_on_landowners_desc_default: "Крестьянство — переходный класс, которому суждено исчезнуть. Мы должны ускорить его превращение в сельскохозяйственных рабочих и лишить старые мелкобуржуазные идеи классовой почвы."

  RUS_stalin_kamenev_tree.1.t: "Первое заседание коалиции"
  RUS_stalin_kamenev_tree.1.d: "Первое заседание коалиционного правительства началось не с новых декретов, а со спора о том, кто будет управлять министерствами и местными учреждениями. Эсеры принесли списки местных комитетов и партизанских командиров, участвовавших в восстании. ВСТ потребовал сохранить руководство профсоюзами, советами и промышленным управлением, а Свердлов предложил назначить вернувшихся большевиков в центральные ведомства.\n\nКаменев признал вклад всех трёх сил, но отказался делить государственный аппарат между партиями. Совместная комиссия будет поочерёдно согласовывать назначения и полномочия. Зиновьев сам вызвался привести в порядок сведения о делегатах. Тогда эту канцелярскую работу почти никто не заметил, но по спискам он уже изучал расстановку сил внутри ВСТ."
  RUS_stalin_kamenev_tree.1.a: "Сначала приведём правительство в порядок."
  RUS_stalin_kamenev_tree.2.t: "Требования эсеров"
  RUS_stalin_kamenev_tree.2.d: "ЦК эсеров заявил, что раз основные силы восстания были организованы партией, то земельное ведомство, внутренние дела и местное управление должны перейти под её контроль. Большевистские делегаты отвергли требование, и в коалиции впервые разгорелся открытый спор.\n\nУстинов не поддержал руководство эсеров. Максималисты, заявил он, выступают за социализацию земли и классовую борьбу в деревне, но не примут монополию эсеров на крестьянские организации. Каменев предложил утверждать местные назначения коалиционным правительством и подчинить все учреждения общим проверкам. Левое крыло ВСТ и максималисты поддержали его."
  RUS_stalin_kamenev_tree.2.a: "Местные учреждения подчиняются коалиции."
  RUS_stalin_kamenev_tree.3.t: "Единый учёт"
  RUS_stalin_kamenev_tree.3.d: "Новая организационная директива обязала всех большевиков, работающих в учреждениях ВСТ, зарегистрировать партийную принадлежность и соблюдать дисциплину заседаний коалиционного правительства. Каменев публично подписал документ и сохранил роль официального представителя большевиков в переговорах с другими партиями.\n\nЗиновьев взял на себя связь с кадрами и проверку полномочий делегатов, так что всё больше назначений проходило через его руки. Свердлов поддерживал восстановление партийных связей, но начал опасаться, что Зиновьев превращает фракцию ВСТ в личную опору."
  RUS_stalin_kamenev_tree.3.a: "Разберёмся с организационными связями."
  RUS_stalin_kamenev_tree.4.t: "Новый порядок голосования"
  RUS_stalin_kamenev_tree.4.d: "Съезд принял новый регламент. Партии по-прежнему могут заранее договариваться и вносить поправки, но после принятия предложения большинством все участники Рабочей коалиции обязаны его выполнить. Угроза выхода из правительства больше не заставит съезд пересматривать решение.\n\nНовый порядок ускорил принятие решений и повысил значение каждого мандата. Зиновьев, отвечавший за подготовку съезда, уже знает число голосов у каждой губернии, профсоюза и фракции и начал привлекать колеблющихся делегатов."
  RUS_stalin_kamenev_tree.4.a: "Выполнить решение съезда."
  RUS_stalin_kamenev_tree.5.t: "Назначения в государственную инспекцию"
  RUS_stalin_kamenev_tree.5.d: "Государственная инспекция едва успела возникнуть, а партии уже спорили о составе её секретариата и местных следователей. Эсеры хотели защитить подконтрольные им органы самоуправления, чиновники ВСТ требовали очистить аппарат от старой бюрократии, а большевики предлагали прежде всего расследовать спекуляцию, саботаж и отказ выполнять решения центра.\n\nКаменев настоял, чтобы инспекцию совместно контролировали все три стороны. Зиновьев получил часть полномочий по кадровым назначениям, а Свердлов потребовал хранить в центре копии всех материалов расследований. Сталин открыто не вмешивался, но его старые товарищи в армии уже начали передавать ему документы, связанные с военными учреждениями."
  RUS_stalin_kamenev_tree.5.a: "Сначала установим общий порядок."

  RUS_kamenev_psr_automatic_focus_tt: "Эта политическая программа автоматически проводится §YПартией социалистов-революционеров§! и не может быть выбрана игроком. Её выполнение изменит отношения между партиями и баланс сил в революционном правительстве."
  RUS_kamenev_bol_automatic_focus_tt: "Эта политическая программа автоматически проводится §YРоссийской коммунистической партией (большевиков)§! и не может быть выбрана игроком. Её выполнение изменит отношения между партиями и баланс сил в революционном правительстве."
  RUS_kamenev_psr_agenda_originator: "Центральный комитет ПСР"
  RUS_kamenev_bol_agenda_originator: "Центральное бюро РКП(б)"

  RUS_kamenev_psr_rebuild_central_committee: "Революционные заслуги повстанцев"
  RUS_kamenev_psr_rebuild_central_committee_desc: "ЦК ПСР требует официально признать ведущую роль партии в сельском восстании, местных комитетах и партизанской мобилизации. Эти заслуги реальны, но эсеры намерены обменять их на преимущественное влияние в земельных делах, внутреннем управлении и местной администрации."
  RUS_kamenev_psr_preserve_land_committees: "Земельные комитеты нельзя распускать"
  RUS_kamenev_psr_preserve_land_committees_desc: "Эсеры требуют сохранить состав и судебные полномочия уездных и волостных земельных комитетов, запретив центру произвольно их распускать. Большевики видят в этих учреждениях опору власти ПСР в деревне, а максималисты требуют отдельных мест для бедноты и коллективных хозяйств."
  RUS_kamenev_psr_land_socialisation_bill: "Проект социализации земли"
  RUS_kamenev_psr_land_socialisation_bill_desc: "Эсеры предлагают передать землю в общее пользование трудящихся и распределять её через местные комитеты, а не прямую собственность центрального государства. Большевики и максималисты поддерживают конфискацию, но требуют защитить бедняцкие организации, совхозы и коллективные хозяйства от большинства зажиточной деревни."
  RUS_kamenev_psr_local_self_government: "Устав автономии сельских советов"
  RUS_kamenev_psr_local_self_government_desc: "Эсеры предлагают ограничить право центра смещать сельских представителей и вмешиваться в волостные бюджеты. Устав защитит органы, возникшие в революции, и одновременно закрепит организационное преимущество ПСР в деревне."
  RUS_kamenev_psr_claim_internal_affairs: "Кому подчиняется сельская милиция?"
  RUS_kamenev_psr_claim_internal_affairs_desc: "Большинство сельских отрядов создали повстанческие комитеты и кадры ПСР. Эсеры хотят подчинить их местным советам, а не Военному совету; большевики опасаются раздробления вооружённых сил, и спор переходит к назначениям и ключам от губернских арсеналов."
  RUS_kamenev_psr_cooperatives_fair_grain_prices: "Кооперативы и справедливая цена на хлеб"
  RUS_kamenev_psr_cooperatives_fair_grain_prices_desc: "Эсеры предлагают заменить принудительные заготовки кооперативами, сельским кредитом и договорными закупками по приемлемой для крестьянина цене. Городские профсоюзы боятся нехватки хлеба, а максималисты спрашивают, помогает ли схема бедноте или лишь усиливает торг зажиточных хозяев."
  RUS_kamenev_psr_peasant_congress: "Квоты для крестьянских представителей"
  RUS_kamenev_psr_peasant_congress_desc: "ПСР требует закрепить места для крестьянских делегатов в комиссариатах, плановых органах и съезде ВСТ. Спор идёт не о праве крестьян говорить, а о том, кто выбирает их представителей: местные советы, кооперативы, комитеты бедноты или партийные организации эсеров."
  RUS_kamenev_psr_defend_revolutionary_democracy: "Запретить двойное членство"
  RUS_kamenev_psr_defend_revolutionary_democracy_desc: "ЦК ПСР требует, чтобы чиновники с билетами ВСТ и РКП(б) выбрали одну организацию. Формально это проясняет партийную ответственность; фактически эсеры хотят перекрыть большевикам возможность использовать открытую структуру ВСТ для роста дисциплинированной фракции."
  RUS_kamenev_psr_final_party_congress: "Последний полный съезд ПСР"
  RUS_kamenev_psr_final_party_congress_desc: "Спиридонова созывает последний съезд, ещё способный собрать все общероссийские течения ПСР, и пытается восстановить общую линию по земле, местной автономии и коалиции. В одном зале сидят ветераны восстания, максималисты и делегаты, уже смотрящие в сторону большевиков; съезд завершится, но прежнее единство партии уже не вернуть."

  RUS_kamenev_bol_register_returning_members: "Бюро учёта вернувшихся кадров"
  RUS_kamenev_bol_register_returning_members_desc: "Свердлов заново составляет списки вернувшихся партийцев, эмигрантов и подпольных связных. Каменев объясняет коалиции, что это обычная партийная работа, а Зиновьев через проверку мандатов и назначений узнаёт, кто сможет войти во все уровни аппарата ВСТ."
  RUS_kamenev_bol_restore_central_bureau: "Два партийных билета"
  RUS_kamenev_bol_restore_central_bureau_desc: "Член партии может открыто вступить в ВСТ и тайно сохранить дисциплину РКП(б). Каменев публично объясняет, почему две лояльности не противоречат друг другу, а Зиновьев хранит список, который никогда не будет опубликован. Большевики получают законное прикрытие и собственную организацию."
  RUS_kamenev_bol_restore_pravda: "Возродить «Правду»"
  RUS_kamenev_bol_restore_pravda_desc: "Зиновьев возрождает «Правду» с независимой редакцией и возвращает большевикам голос вне ВСТ. Газета открыто нападает на местничество эсеров и постепенно изображает Каменева полезным посредником, которому не хватает решимости долго руководить коммунистическим течением."
  RUS_kamenev_bol_rebuild_factory_cells: "Партийные ячейки в цехах"
  RUS_kamenev_bol_rebuild_factory_cells_desc: "Заводские группы Петрограда, Москвы, Урала и Донбасса восстанавливают связь и проводят единую линию в профсоюзах и советах. ВСТ остаётся открытой формой рабочей политики, но всё больше низовых предложений сначала решается внутри большевистской фракции."
  RUS_kamenev_bol_railway_telegraph_bureau: "Бюро железнодорожной и телеграфной связи"
  RUS_kamenev_bol_railway_telegraph_bureau_desc: "Железнодорожники, телеграфисты и подпольные курьеры создают общероссийскую сеть, доставляющую указания Центрального бюро в обход местных властей. Она восстанавливает связи, разрушенные гражданской войной, и впервые даёт Зиновьеву канал, не зависящий от Каменева."
  RUS_kamenev_bol_unify_planning_apparatus: "Красные специалисты и партийные школы"
  RUS_kamenev_bol_unify_planning_apparatus_desc: "Промышленные статистики, инженеры, плановики и местные секретари проходят через новые партийные школы перед назначением в комиссариаты. Государству нужны красные специалисты, а большевики через обучение, учёт и назначения превращают технические кадры в организованную силу центра."
  RUS_kamenev_bol_win_vst_majority: "Бюро связи с максималистами"
  RUS_kamenev_bol_win_vst_majority_desc: "Устинов связывает организации бедноты, сельских радикалов и подполье максималистов с большевиками. Публично это сотрудничество против монополии ПСР в деревне; для Зиновьева это также кратчайший путь от городских фракций к голосам сельских делегатов."
  RUS_kamenev_bol_restore_military_organisations: "Вернувшиеся командиры Красной армии"
  RUS_kamenev_bol_restore_military_organisations_desc: "Вернувшиеся красные командиры, преподаватели военных школ и политработники вновь входят в армию. Свердлов требует учитывать все связи в центре, Зиновьев ищет места для своих кадров, а Сталин собирает имена тех, кто отдаёт приказы в обход Военного совета."
  RUS_kamenev_bol_undissolved_central_committee: "Центральный комитет, который не распускался"
  RUS_kamenev_bol_undissolved_central_committee_desc: "Свердлов предъявляет отдельно сохранённые списки, решения и мандаты, доказывающие, что РКП(б) никогда полностью не сливалась с ВСТ. Зиновьев располагает большинством среди коммунистов ВСТ, но не контролирует всю партию; ни Свердлов, ни Сталин не позволят ему смешать эти понятия."

  RUS_stalin_kamenev_agendas.1.t: "Земельный законопроект в кабинете"
  RUS_stalin_kamenev_agendas.1.d: "Эсеры внесли в кабинет законопроект о социализации земли: помещичьи владения немедленно конфискуются, купля и продажа земли запрещаются, а её использование определяют местные земельные комитеты. Они называют это главным обещанием восстания и намекают, что промедление будет предательством крестьянства.\n\nБольшевики отказываются передавать такую власть неразделённому деревенскому большинству. Устинов также не поддерживает руководство ПСР и требует отдельных мест для комитетов бедноты, коллективных хозяйств и сельскохозяйственных рабочих. Каменев направляет проект в совместную комиссию, превращая земельную реформу в первую борьбу за руководство деревней."
  RUS_stalin_kamenev_agendas.1.a: "Разберём каждую статью; одна партия этого не решит."
  RUS_stalin_kamenev_agendas.2.t: "Кто говорит от имени русского крестьянина?"
  RUS_stalin_kamenev_agendas.2.d: "Ещё до открытия Всероссийского крестьянского съезда эсеры контролируют большинство каналов связи с губернскими делегациями. Они хотят превратить земельный закон и заслуги восстания в устойчивое большинство и добиться признания своего первенства в крестьянских делах.\n\nМаксималисты привезли других представителей: комитеты бедноты, сельское подполье и активистов коллективных хозяйств. Устинов поддерживает аграрную революцию, но не позволяет ЦК ПСР говорить за всё крестьянство. В зал входят и организаторы ВСТ с большевиками; ещё до первого голосования сельские левые уже разделились на два лагеря."
  RUS_stalin_kamenev_agendas.2.a: "Пусть делегаты сами выскажут свою позицию."
  RUS_stalin_kamenev_agendas.3.t: "Только один партийный билет?"
  RUS_stalin_kamenev_agendas.3.d: "ЦК ПСР требует проверить двойное членство: чиновники, вступившие в ВСТ, больше не должны тайно подчиняться дисциплине РКП(б). Эсеры утверждают, что открытый союз не способен честно вести переговоры, если им управляет другая, скрытая фракция.\n\nКаменев соглашается опубликовать партийность министров и высших чиновников, но отказывается закрывать ВСТ для коммунистов. Зиновьев тем временем велит хранить важнейшие связи под внутренними номерами. Новое правило проводит ясную черту и одновременно учит большевиков работать за ней."
  RUS_stalin_kamenev_agendas.3.a: "Списки можно проверить; организация от этого не исчезнет."
  RUS_stalin_kamenev_agendas.4.t: "Списки вернувшихся партийцев"
  RUS_stalin_kamenev_agendas.4.d: "Свердлов восстановил учёт членов РКП(б). Места эмиграции, партийный стаж, подпольные связи и специальности заносятся в документы, и многие большевики впервые за годы вновь находят свою организацию. Каменев уверяет коалицию, что это обычная партийная работа.\n\nЗиновьев добровольно берётся за проверку мандатов и распределение кадров. Вскоре он знает, кто отправится в профсоюзы, кто войдёт в плановые органы и кто распоряжается голосами губернии. Каменев по-прежнему публично объясняет действия партии, но списки, решающие судьбу людей, переходят в руки Зиновьева."
  RUS_stalin_kamenev_agendas.4.a: "Восстановим разорванные организационные связи."
  RUS_stalin_kamenev_agendas.5.t: "Старые связи в армии"
  RUS_stalin_kamenev_agendas.5.d: "Центральное бюро РКП(б) начало регистрировать старых партийцев, кадры гражданской войны и политработников в вооружённых силах. Свердлов требует учитывать все связи в центре, чтобы ни одна фракция не создала собственную военную сеть; Зиновьев продолжает рекомендовать своих людей в политический аппарат.\n\nСталин не возражает против восстановления партийной организации, но замечает указания, которые идут в части от имени фракций в обход Военного совета. Несколько списков вскоре оказываются на столе Свердлова. Впервые оба прямо признают, что Зиновьев строит нечто большее, чем фракцию внутри ВСТ."
  RUS_stalin_kamenev_agendas.5.a: "Все военные связи должны быть учтены."
  RUS_stalin_kamenev_agendas.6.t: "Список связей Устинова"
  RUS_stalin_kamenev_agendas.6.d: "Устинов передал Центральному бюро список сельских контактов. В нём старые максималисты, комитеты бедноты, активисты коллективных хозяйств и радикалы из местных организаций ПСР. Они отвергают дисциплину эсеровского центра, но сохраняют верность земельной революции и власти рабочих и крестьян.\n\nЗиновьев сразу понимает их ценность: они способны разрушить монополию ПСР на сельских делегатов и принести коммунистическому течению голоса за пределами городов. Каменев называет это сотрудничеством левых, а Свердлов требует поставить каждую связь на учёт центра. Контроль над списком становится новым вопросом власти."
  RUS_stalin_kamenev_agendas.6.a: "Сначала учтём каждую связь."
  RUS_stalin_kamenev_agendas.7.t: "Последний полный съезд ПСР"
  RUS_stalin_kamenev_agendas.7.d: "Спиридоновой удаётся собрать в одном зале ЦК ПСР, местных повстанцев, представителей кооперативов и максималистов. Прежние заслуги партии всё ещё вызывают аплодисменты, но каждое голосование по земельным комитетам, сельской милиции и двойному членству показывает, что общего ответа больше нет.\n\nСъезд принимает осторожную совместную декларацию, однако после закрытия делегаты расходятся по разным лагерям. ПСР остаётся незаменимой силой коалиции, но ей всё труднее говорить от имени всей деревни как единой партии."
  RUS_stalin_kamenev_agendas.7.a: "Съезд закрыт; раскол — нет."
  RUS_stalin_kamenev_agendas.8.t: "Центральный комитет, который не распускался"
  RUS_stalin_kamenev_agendas.8.d: "Зиновьев считает, что большинство среди коммунистов ВСТ позволяет ему говорить от имени всей большевистской партии. На заседании Центрального бюро Свердлов раскладывает списки, организационные решения и неотменённые мандаты: РКП(б) может действовать через ВСТ, но никогда не передавала ему свою высшую власть.\n\nЗатем Сталин предъявляет записи о политических связях в армии. Вместе документы показывают, что Зиновьев поднялся почти к вершине, однако ни партийная организация, ни вооружённые силы ему единолично не принадлежат. Свердлов не выступает с открытым обвинением и возвращает бумаги в сейф. Настоящая борьба начнётся вместе с большой ставкой."
  RUS_stalin_kamenev_agendas.8.a: "Большая ставка ещё не сделана."
