l_russian:
  RUS_maximalist_land_reform_category_desc: "Программа максималистов прошла через съезд. Механизация, ликвидация неграмотности, реорганизация животноводства и образцовые колхозы будут постепенно продвигать реформу вперед.\n\nТекущий счет земельной реформы: §Y[?RUS_maximalist_land_reform_score|0]§!/§Y[GetRUSNatTarget]§!\nТекущий этап: [ROOT.RUSGetMaximalistLandReformCurrentStage]/[GetRUSNatStageCount]\nСледующий этап: [ROOT.RUSGetMaximalistLandReformNextStage]"
  RUS_maximalist_land_reform_mission_desc: "Максималисты должны доказать, что их программа способна преобразить русскую деревню. Если прогресс реформы достигнет §Y[GetRUSNatTarget]§!, земельная реформа будет успешно завершена; иначе она закончится застоем."
  RUS_maximalist_land_reform_score_status_tt: "§YСчет земельной реформы§!: [?RUS_maximalist_land_reform_score|Y0]/§Y[GetRUSNatTarget]§!\n§YТекущий этап§!: [ROOT.RUSGetMaximalistLandReformCurrentStage]/[GetRUSNatStageCount]\n§YСледующий этап§!: [ROOT.RUSGetMaximalistLandReformNextStage]"
  RUS_maximalist_land_reform_next_stage_100: "§Y[GetRUSNatTarget]§! очков"
  RUS_max_landreform_tractor_promise_mission_desc: "Мы обещали восполнить нехватку сельскохозяйственной техники за [GetRUSNatTractorDays] дней. Завершите решение §YПродвигать тракторы§! §Y3§! раза, чтобы выполнить обещание.\n\nТекущий прогресс: §Y[?RUS_max_landreform_tractor_promise_count|0]§!/§Y3§![GetRUSNatTractorRequirement]"
  rus_maximalist_land_reform_events.11.c.tt: "Мы сделаем приоритетом производство тракторов. Появится новая миссия земельной реформы: завершить §YПродвигать тракторы§! §Y3§! раза за [GetRUSNatTractorDays] дней. При успехе произойдет событие §YДоверие не обмануто§!; при провале базовая стабильность §R-10.00%§! и политическая власть §R-45§!.[GetRUSNatTractorRequirement]"
