l_simp_chinese:
 russia_events.926.d: "萨文科夫死后数日，所谓“保卫祖国与自由联盟”的高层便已星散——或遭逮捕，或被枪决，或仓皇出逃。唯弗拉基米尔·曼施坦因将军与安东·图尔库尔将军尚能挟制莫斯科近郊卫戍部队，借机发动反政变。凭借骑兵与一支装甲纵队，二人一度攻入莫斯科南部城区，占领数处要地。\n\n反政变一方原指望莫斯科守军大规模倒戈，归顺其“白卫军”旗帜，然而应者寥寥。这座城早已无意再为逝去的元首殉葬。\n\n在兹韦尼哥罗德郊外短暂交火之后，叛军主力即宣告投降。曼施坦因被押解至军事法庭，当庭执行枪决。\n\n但肃反的浪潮远未平息。地方驻军中大批白卫军官拒不臣服，率部举旗反抗临时政府。这群反动武装在马尔科夫元帅的统一号令下迅速集结，磨刀霍霍，随时准备绞杀革命。"
 russia_events.926.a: "命令他们缴械投降！"
 russia_socialist_events.2.t: "在旧军队的废墟上"
 russia_socialist_events.2.d: "彼得格勒与察里津的白军据点相继覆灭后，肃反委员会在各地司令部和军官俱乐部中查获了大批文件。其中一份由一百八十余名高级军官签署的秘密誓约，证明所谓“地方驻军的自发抵抗”从一开始就是一场经过协调的反革命叛乱。签署者曾答应响应马尔科夫的号令，在曼施坦因夺取莫斯科后控制铁路、兵工厂与地方行政机关。如今他们的计划已经破产，誓约却成为了无法抵赖的罪证。\n\n临时政府没有再向这些人提供体面的养老金。直接组织叛乱、下令处决赤卫队员或破坏铁路的军官被送上革命法庭；一部分人随溃军逃往国外，还有一些人脱下制服，试图混入返乡士兵之中。与此同时，政府也拒绝把每一名旧军官都不加区别地推向反革命。未参与叛乱、愿意宣誓服从新政权的专业军官得以接受审查后留任，普通士兵则被遣散或重新编入忠于革命的部队。旧军队的知识可以保留，但它凌驾于人民之上的传统必须被彻底摧毁。\n\n这场清洗不可避免地留下了大量指挥空缺。年轻军官、赤卫队指挥员和从流亡地归来的革命军事干部被迅速提拔，军事学校也将由新的政治委员监督。社会革命党人尤里·萨布林被任命为战争部长兼陆军总长，负责把来源各异的部队整编为一支统一的革命军队。重建期间，混乱、经验不足和彼此猜疑仍将困扰军队；但从今天起，俄国的枪不再属于某个自封的军官集团，而属于革命和人民。"
 russia_socialist_events.2.a: "在旧军队的废墟上建立红军。"
