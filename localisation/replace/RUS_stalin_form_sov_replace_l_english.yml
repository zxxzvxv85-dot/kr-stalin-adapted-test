  russia_socialist_events.33.d: "Defendant: Iosif Vissarionovich Stalin\n\nCharge: fifty-five counts of murder\n\nTwenty years ago, the garrisons of Fort Krasnaya Gorka and the Seraya Loshad battery launched an armed revolt in an attempt to overthrow the revolutionary government by force. The uprising was led by Lieutenant N. M. Neklyudov, and he and many of his followers were Socialist-Revolutionaries. While the city was gripped by famine, the Socialist-Revolutionaries seized military fortifications and organised a mutiny, forcing the commander of the city's defences, I. V. Stalin, to order the restoration of order.\n\nThe insurgents held the fortifications and resisted for four days. Bolshevik forces eventually stormed the forts and suppressed the revolt. Under wartime legislation passed by the Council of People's Commissars, Commissar N. M. Razin was ordered to carry out the wartime execution of fifty-five ringleaders; several others disappeared amid the fighting and confusion. Stalin's order was a military response to armed rebellion, directed against soldiers in open mutiny rather than ordinary civilians.\n\nDuring the trial, the prosecution attempted to portray the suppression as murder. Yet the testimony of the principal witness, Comrade Razin, demonstrated that Stalin's order rested upon the laws of the Council of People's Commissars and constituted a lawful wartime measure against rebels. Comrade Stalin remained calm in court and made no attempt to deny that he had ordered the suppression. His defence was clear and resolute: the country was at war, troops under his command had mutinied, and the use of military force against them was fully lawful under the legislation then in force.\n\nThe prosecution invoked the recently enacted Law of Justice Against White Terror in an attempt to apply a later statute to a lawful suppression carried out twenty years earlier. This retroactive use of the law provoked controversy among those observing the trial. The prosecution ultimately stated that, in view of Stalin's contributions to the cause of the working class, it was prepared to reduce the sentence to ten years of hard labour.\n\nThe court, however, rejected the prosecution's case. It found that Comrade Stalin's order had fully complied with the wartime legislation of the Council of People's Commissars and had been a necessary military response to armed revolt. A law enacted after the event could not be used to prosecute conduct from two decades earlier. The court therefore acquitted Comrade Stalin."
  russia_socialist_events.33.c: "What a disastrous move…"
  russia_socialist_events.330.e: "Let Comrade Bukharin reshape our economy."
  russia_socialist_events.335.d: "Artists are the engineers of the human soul. With the arrival of the revolution, the souls of the Russian people must undergo a fundamental transformation. The People's Ministry of Culture is chiefly responsible for carrying the party's message to the masses, instilling socialist values and combating counter-revolutionary culture.\n\nRussia has no shortage of idealistic cultural engineers. Aleksandra Kollontay proposes a complete remaking of Russian society and the abolition of the family and patriarchy; Ivan Gronsky seeks to create a new culture of socialist heroism. The Socialist-Revolutionaries recommend Boris Malkin, an organiser of film production and party propagandist. Those present, however, clearly favour the veteran Bolshevik representative Mikhail Kalinin, whose ideas on communist education have attracted considerable attention."
  russia_socialist_events.335.a: "Kollontay's passion deserves recognition."
  russia_socialist_events.335.b: "Gronsky's vision rests on firmer ground."
  russia_socialist_events.335.c: "Malkin is the more pragmatic choice."
  russia_socialist_events.335.e: "Kalinin is widely accepted as the right choice."
  RUS_stalin_general_secretary_sic: "Heart of Steel"
