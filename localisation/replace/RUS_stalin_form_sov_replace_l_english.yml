  RUS_guide: "§MStalin - Reverse the October§! (§rCommunist§!)\n£white_dot To enable the Balance of Power mechanic, do not activate the decision §YPrevent Pacing Drag§! before selecting the focus §YAll-Russian Labour Union§!. After that focus's election process ends, make sure §rInternationalist§! unity is §Y2§! or below and §oCommunist§! relations are exactly §Y10§!. Wait one day after the focus completes to trigger the §YKamenev Takes Power§! event. At that point, §YFirst 4-Year Plan§! becomes §YFirst Five-Year Plan§!, and completing the §YFirst Five-Year Plan§! focus will add the five-year-plan bonus to all relevant industrial decisions.\n£white_dot Play the §oVST – Grigory Zinovyev§! path. Before completing the focus §YThe Bolshevik Gamble§!, make sure the following conditions are met:\n - The exiles have returned.\n - The focus §YMilitary Marxism§! has been completed.\nIf all conditions are met, shortly after selecting \"The Bolshevik Gamble\", an event chain will begin in which Stalin and Sverdlov conspire to overthrow Zinovyev and the VST. Choose \"Zinoviev must be overthrown\" and then \"I think they will be convinced by me\" in order. If successful, the coup against Zinovyev will succeed. In the next event, choose \"Stalin will lead us to victory\" to bring Joseph Stalin to power.\n£white_dot After defeating the German Empire in World War II, you will be able to establish the §oUnion of Soviet Socialist Republics§!.\n\n§MSavinkov - Shepherd of Nations / Saviour of the World / Ideocratic Principle§! (§nNational Populist§!)\n£white_dot Keep Savinkov's regime intact by having §CPopular Anger§! below §R8§! and §PMilitary Anger§! below §r10§!.\n£white_dot To get the §MShepherd of Nations§! subpath, have the Balance of Power lean towards the Solidarists and appoint Filonenko in the event 'Filonenko Meets the Vozhd'.\n£white_dot To get the §MSaviour of the World§! subpath, have the Balance of Power not lean towards the Solidarists or Ideocrats.\n£white_dot To get the §MIdeocratic Principle§! subpath, have the Balance of Power lean towards the Ideocrats and appoint Savitsky in the event 'Savitsky Meets the Vozhd'.\n\n§MRepublic - RDP / Right-SRs / Kadets / VPP§! (§SSocial Democrat§! / §lSocial Liberal§! / §mMarket Liberal§! / §cSocial Conservative§! / §gAuthoritarian Democrat§!)\n£white_dot Appoint Anton Denikin as the new Chief of Army in the event 'Replacing Kornilov'.\n£white_dot Make Savinkov's regime collapse by having §CPopular Anger§! be §R8§! or above and §PMilitary Anger§! below §O5§!, or by having §PMilitary Anger§! above §R8§!.\n£white_dot If Savinkov's regime collapses due to §CPopular Anger§!, the socialists will briefly come to power but will be countercouped by Anton Denikin a few days later.\n£white_dot Use the Third Constitution decisions and election events to propel the desired party in power.\n£white_dot If electing the §SRDP§!, do not let the far-left take over the party.\n£white_dot If the §lRight-SRs§! were chosen, §YVladimir Rikhter§! can die if §cRight-wing Anger§! or §PMilitary Anger§! are §O6§! or above. Depending on who was given control of the state council, either §YPitirim Sorokin§! or §YIlya Fondaminsky§! will become the new leader.\n£white_dot If the §mKadets§! were chosen, §YVasily Maklakov§! can resign from politics if §gPolitical Apathy§! reaches 5 or greater. Depending on who was given control of the state council, either §YPyotr Dolgorukov§! or §YAnton Kartashyov§! will become the new leader.\n£white_dot If §YIvan Solonevich§! is assassinated, §YDmitry Romanov§! will become the new leader.\n£white_dot By taking the postwar focus §YReturn to Tradition§!, a Solonevich-led §cVPP§! regime will become §gAuthoritarian Democrat§!.\n\n§MEmpire - Right-SRs / Kadets / VPP / NMD§! (§lSocial Liberal§! / §mMarket Liberal§! / §cSocial Conservative§! / §gAuthoritarian Democrat§! / §PPaternal Autocrat§!)\n£white_dot Appoint Pyotr Wrangel as the Chief of Army in the event 'Replacing Kornilov'.\n£white_dot Make Savinkov's regime collapse by having §CPopular Anger§! be §R8§! or above and §PMilitary Anger§! below §O5§!, or by having §PMilitary Anger§! above §R8§!.\n£white_dot If Savinkov's regime collapses due to §CPopular Anger§!, the socialists will briefly come to power but will be countercouped by Pyotr Wrangel a few days later.\n£white_dot Use the Third Constitution decisions and election events to propel the desired party in power.\n£white_dot By having §YIvan Solonevich§! as the second in command, the focuses §YPlague of Democraticism§! and §YDictatorship of Conscience§! can be taken to become §gAuthoritarian Democrat§! and §PPaternal Autocrat§!, respectively.\n\n§MWrangel - Kadets / VPP / SOR§! (§mMarket Liberal§! / §cSocial Conservative§! / §gAuthoritarian Democrat§!)\n£white_dot Appoint Pyotr Wrangel as the Chief of Army in the event 'Replacing Kornilov'.\n£white_dot While on the Savinkov path, have §PMilitary Anger§! reach §r8§! during war with the German Empire, and Wrangel will take control as §PPaternal Autocrat§!.\n£white_dot Postwar, use events to elect the desired party of your choice."

  russia_socialist_events.330.d: "After the Chairman-Minister and the Minister of Internal Affairs, the People's Minister of Industry and Trade holds the third most prestigious and powerful post in the government, with considerable influence over the direction of economic policy.\n\nLeft to ourselves, a committed advocate of economic planning such as Stanislav Strumilin would be the ideal candidate, but the governing coalition would never accept him. Our allies on the right instead recommend Aleksandr Finn-Yenotayevsky, a supporter of a mixed economy.\n\nTwo further candidates come from outside the VST. The Socialist-Revolutionaries have nominated Boris Kamkov, more as a gesture of goodwill from the Workers' Coalition than as a serious author of economic policy. The Bolsheviks, meanwhile, have put forward Nikolay Bukharin. This radical party economist is devising a programme to reshape the country's entire economic fabric by using administrative compulsion to recast the social division of labour according to the will of the proletarian state."
  RUS_sergey_kirov_sic_desc: "§YBorn:§! §LMarch 27th, 1886, in Urzhum, Vyatka Governorate, Russian Empire§!\n§YBackground:§! §LSergey Mironovich Kirov, born Sergey Kostrikov in Vyatka, lost his father at an early age and grew up amid the deep poverty of the Russian countryside. In 1904, he joined the Russian Social Democratic Labour Party in Tomsk and quickly emerged as an organiser of strikes and a militant activist. As a professional revolutionary, he conducted underground work in Vladikavkaz, while also developing a keen interest in mountaineering, poetry and theatre.\n\nAfter the October Revolution, Kirov firmly committed himself to the Bolshevik cause. During the Civil War, his boundless energy and remarkable personal charm made him a rapidly rising political figure. He chaired the Astrakhan Revolutionary Committee and played a crucial role in maintaining wartime order and allocating the region's resources.\n\nIn 1921, he worked alongside comrades of the Integration Movement in the underground resistance within White Russia, before eventually being forced to withdraw. During his exile in France, he steadfastly defended the party's general line and actively supported and participated in the purge initiated by the Central Committee. This further strengthened his standing and reputation within the party.\n\nAfter Socialist Russia was rebuilt, his outstanding organisational ability quickly made him a favourite of the people of Leningrad. He is now, by any measure, one of the most popular comrades in the Bolshevik ranks.§!"
  RUS_irina_kakhovskaya_advisor_desc: "§YBorn:§! §LAugust 27th, 1887; Tarashcha, Kiev Governorate, Russian Empire§!\n§YBackground:§! §LIrina Konstantinovna Kakhovskaya was born into a Russian family in Kiev. After graduating in pedagogy, she became a teacher, having originally hoped to educate children in a rural school. The revolutionary storm of 1905, however, swept her into another calling. That year, through her acquaintances Aleksandra Kollontay and Maksim Gorky, she joined the Russian Social Democratic Labour Party.\n\nHer career as a Bolshevik proved remarkably brief. Although she accepted Lenin's central conception of the proletarian vanguard, she could not accept his excessively theoretical projections of revolution, nor his near-disregard for the peasant question. In her view, without a profound transformation of the Russian countryside, any revolution would come to a halt at the urban barricades. This position gradually estranged her from the party mainstream. She ultimately left the Bolsheviks and joined the Union of Socialist-Revolutionary Maximalists, a faction more radical on the peasant question while still retaining the character of revolutionary Marxism.\n\nIn 1908, she was exiled to Nerchinsk. Her revolutionary career was interrupted there, but neither the cold nor the solitude of prison broke her resolve. Maria Spiridonova, confined in the same prison, became an important political interlocutor. Their conversations in the cells would serve as a lasting point of reference for Kakhovskaya's later political positions.\n\nWhen revolution broke out, Kakhovskaya swiftly returned to the struggle. Together with Boris Donskoy, she planned the assassinations of Hetman Skoropadskyi and German Field Marshal Hermann von Eichhorn, ultimately succeeding in killing the latter. The operation made her famous and led her into the hands first of the German occupation authorities and then of the Cheka. After she was transferred to the Cheka, she was neither executed nor held indefinitely, as many had expected. Instead, after reviewing her background, the Cheka concluded that hers was a matter of "divergence in line rather than hostility" and released her some time later. The experience shifted her attitude towards the Bolsheviks from coldness to cautious observation. She began to recognise that, although their line on the urban working class differed from her own, coexistence was possible in the struggle against foreign enemies and in defence of the revolution's fundamental interests.\n\nAfter the war, she became one of the founding members of the Combat Union of Socialist-Revolutionary Maximalists and remained committed to armed struggle. Within the Maximalists' organisation, she was chiefly responsible for planning military operations and training, while also maintaining contacts with other revolutionary factions, including informal exchanges with the Bolsheviks, though always at a carefully measured distance. She never abandoned the Maximalists' independent position, but gradually accepted a practical truth: when faced with a common enemy, differences among revolutionaries could temporarily be set aside.\n\nShe still holds high the red banner of revolution. In her eyes, however, the colour of that banner is deeper than red alone.§!"
  RUS_andrey_kolegayev_sic_desc: "§YBorn:§! §LMarch 22nd, 1887; Surgut, Tobolsk Governorate, Russian Empire§!\n§YBackground:§! §LAndrey Lukich Kolegayev came from a revolutionary family: both of his parents belonged to Narodnaya Volya, and the course of revolution seemed marked in his blood from birth. He initially studied law, but soon turned to the path of the Left Socialist-Revolutionaries. In Kazan, he developed into an accomplished organiser of the peasantry and became one of the Left-SRs' key figures after the October Revolution.\n\nThe political turning point at the end of the Civil War profoundly altered his course. When elements within the Left-SRs moved towards an armed uprising against the Bolsheviks, Kolegayev firmly opposed them. This was not born of sympathy for the Bolsheviks, but of sober strategic judgement: while the Red Army was still locked in a life-and-death struggle with the Whites, any division within the revolutionary camp could only create opportunities for their common enemy. This position ultimately led him to leave the Left-SRs and briefly establish his own Party of Revolutionary Communism, though it did not survive for long.\n\nAfter the war, Kolegayev was forced into exile. In the years that followed, his life alternated between foreign refuges and Russia itself. At times he wrote theoretical articles in cheap apartments in Paris or London; at others he secretly returned home to build connections among rural communities and underground organisations. In the course of this work, he developed a close partnership with the Maximalists, centred above all upon his bond with Alexei Ustinov, a relationship at once that of pupil and mentor and of close comrades.\n\nIn theory, Ustinov systematically explained to Kolegayev the framework of "Agrarian Bolshevism": the peasantry was not an independent revolutionary class, but the proletariat's natural ally in the countryside. This idea gave Kolegayev a clear theoretical bearing for his longstanding reflections on the peasant question, and the traces of Ustinov's influence can be found throughout his later writings. In practice, Ustinov's role was more concrete. During Kolegayev's repeated clandestine returns to Russia, Ustinov used his network to provide safe contacts, identity papers and local intermediaries. Every border crossing and every secret meeting carried something of Ustinov's careful instruction in the methods of underground work.\n\nKolegayev excels at turning scattered rural discontent into disciplined political action. This ability has made him a deeply respected leader among the Maximalists and earned him the informal title of "Peasant Leninist" in émigré circles.§!"
