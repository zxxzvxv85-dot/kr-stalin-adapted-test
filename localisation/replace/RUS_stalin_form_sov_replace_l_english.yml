  RUS_bolshevik_gamble_event_tt: "We will use all the influence §oGrigory Zinovyev§! has to attempt a takeover of the §oRussian Communist Party (of Bolsheviks)§!.\n§RHowever, if Joseph Stalin is still in our government and has regained influence in the military, the event may develop in another direction…§!"
  RUS_charter_of_russian_totalism: "The Totalist Debate"
  RUS_war_on_landowners_desc: "The peasantry is a transitional class destined to disappear. We must hasten its transformation into agricultural workers and deprive petty-bourgeois ideas of their remaining class foundation."
  RUS_red_intelligentsia: "The Revolutionary Cultural Front"
  RUS_red_intelligentsia_desc: "The old world does not disappear at once, but through a painful and protracted process. To resist bourgeois ideas and opportunism, revolution and democracy must take root in every citizen."
  RUS_technocratic_syndicalism: "Lay the Foundations of Democracy"
  RUS_technocratic_syndicalism_desc: "At last, the proletarian democracy envisioned by Lenin is gathering strength in Russia. A democracy a million times more democratic than any bourgeois democracy will secure our transition to communism!"
  RUS_preserve_revolution_within: "Triumph of the Red Helmsman"
  RUS_preserve_revolution_within_desc: "Through a succession of political manoeuvres, Zinovyev has secured supreme power. His vision of Russian-style totalism and a state of proletarian dictatorship will now §Rbecome reality§!."
