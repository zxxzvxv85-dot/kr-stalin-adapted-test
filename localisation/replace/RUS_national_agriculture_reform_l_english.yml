l_english:
  RUS_maximalist_land_reform_category_desc: "The Maximalist programme has passed the congress. Mechanisation, literacy work, livestock reorganisation and model collective farms will advance the reform step by step.\n\nCurrent land reform score: §Y[?RUS_maximalist_land_reform_score|0]§!/§Y100§!\nCurrent stage: [ROOT.RUSGetMaximalistLandReformCurrentStage]/§Y5§!\nNext stage: [ROOT.RUSGetMaximalistLandReformNextStage]"
  RUS_maximalist_land_reform_mission_desc: "The Maximalists must prove that their programme can transform the Russian countryside. If reform progress reaches §Y100§!, the land reform will be completed successfully; otherwise it will end in stagnation."
  RUS_maximalist_land_reform_score_status_tt: "§YLand Reform Score§!: [?RUS_maximalist_land_reform_score|Y0]/§Y100§!\n§YCurrent Stage§!: [ROOT.RUSGetMaximalistLandReformCurrentStage]/5\n§YNext Stage§!: [ROOT.RUSGetMaximalistLandReformNextStage]"
  RUS_maximalist_land_reform_next_stage_100: "§Y100§! points"
  RUS_max_landreform_tractor_promise_mission_desc: "We have promised to make up the shortage of agricultural equipment within [GetRUSNatTractorDays] days. Complete the §YPromote Tractors§! decision §Y3§! times to fulfil the promise.\n\nCurrent progress: §Y[?RUS_max_landreform_tractor_promise_count|0]§!/§Y3§![GetRUSNatTractorRequirement]"
  rus_maximalist_land_reform_events.11.c.tt: "We will prioritise tractor production. A new land reform mission will appear: complete §YPromote Tractors§! §Y3§! times within [GetRUSNatTractorDays] days. If fulfilled, §YTrust Unbetrayed§! will fire; if not, base stability §R-10.00%§! and political power §R-45§!.[GetRUSNatTractorRequirement]"
