l_russian:
 russia_events.926.d: "Через несколько дней после смерти Савинкова верхушка так называемого Союза защиты Родины и Свободы рассеялась: одни были арестованы или расстреляны, другие бежали. Лишь генералы Владимир Манштейн и Антон Туркул сохранили влияние на гарнизоны под Москвой и решились на контрпереворот. С кавалерией и броневой колонной они ненадолго ворвались в южные районы столицы и заняли несколько важных позиций.\n\nЗаговорщики рассчитывали, что московский гарнизон массово перейдёт под знамёна их «Белой гвардии». Однако откликнулись немногие: город больше не желал умирать за погибшего Вождя.\n\nПосле короткого боя под Звенигородом основные силы мятежников капитулировали. Манштейна доставили в военный трибунал и немедленно расстреляли.\n\nНо волна контрреволюции ещё не утихла. Во многих провинциальных гарнизонах белые офицеры отказались подчиниться и подняли части против временного правительства. Под единым командованием фельдмаршала Маркова реакционные формирования быстро собираются, готовясь задушить революцию."
 russia_events.926.a: "Приказать им сложить оружие!"
 russia_socialist_events.2.t: "На руинах старой армии"
 russia_socialist_events.2.d: "После разгрома белых опорных пунктов в Петрограде и Царицыне комиссии по борьбе с контрреволюцией обнаружили множество документов в штабах и офицерских клубах. Тайная клятва, подписанная более чем 180 старшими офицерами, доказала, что якобы стихийное сопротивление провинциальных гарнизонов с самого начала было согласованным мятежом. Подписавшиеся обещали откликнуться на призыв Маркова и после захвата Москвы Манштейном занять железные дороги, арсеналы и местные учреждения. Их замысел провалился, но документ стал неопровержимой уликой.\n\nВременное правительство не предложило организаторам почётных пенсий. Офицеры, руководившие мятежом, приказывавшие расстреливать красногвардейцев или разрушать железные дороги, предстали перед революционными трибуналами. Одни бежали за границу вместе с разбитыми частями, другие сняли мундиры и попытались затеряться среди возвращавшихся домой солдат. Однако правительство отказалось без разбора толкать каждого старого офицера в лагерь контрреволюции. Специалисты, не участвовавшие в восстании и готовые присягнуть новой власти, могут остаться после проверки; рядовые демобилизуются или включаются в верные революции части. Знания старой армии можно сохранить, но её притязание стоять над народом должно быть уничтожено.\n\nЧистка неизбежно оставила множество командных должностей свободными. Молодые офицеры, командиры Красной гвардии и возвращающиеся из эмиграции революционные военные кадры быстро повышаются, а военные училища переходят под надзор политических комиссаров. Эсер Юрий Саблин назначен военным министром и главнокомандующим армией; ему поручено объединить разнородные части в единую революционную армию. Реорганизацию будут сопровождать неразбериха, недостаток опыта и взаимное недоверие, но отныне русское оружие принадлежит не самозваной офицерской касте, а революции и народу."
 russia_socialist_events.2.a: "Построить Красную армию на руинах старой."
