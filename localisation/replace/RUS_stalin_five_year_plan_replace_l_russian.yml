  russia_socialist_events.62.d: "[ROOT.RUSGetPlannedEconomyEventDesc]"
  russia_socialist_events.62.d_four: "Несмотря на быстрый промышленный рост в 1920-х годах, Россия всё ещё остаётся второразрядной великой державой в промышленном отношении, пусть и обладает огромным потенциалом. Вопреки сопротивлению умеренных в ВСТ и ПСР мы сделали первые шаги к введению полного государственного планирования, чтобы обеспечить быстрые темпы развития.\n\nМы учредили Федплан, состоящий из делегатов профсоюзов и экономистов, для руководства созданием и выполнением первого четырёхлетнего плана. Главными теоретиками нашей экономической политики стали Станислав Струмилин и Сергей Дубровский — оба уважаемые специалисты и сторонники быстрой индустриализации при государственном вмешательстве. Анализируя савинковский ВЭС, Струмилин отмечает, что его экономическая логика была здрава, но на практике он не дал результата из-за компромиссов с капиталистическими интересами и безудержной коррупции в СЗРС. Федплан является наполовину демократическим, наполовину технократическим органом под надзором Съезда, и нынешнее правительство возлагает на него большие надежды.\n\nПервый четырёхлетний план сосредоточен на полной социализации экономики, расширении тяжёлой и военной промышленности в подготовке к грядущей войне и механизации сельского хозяйства. На этой основе в будущем можно будет строить более передовые отрасли. Хотя низовые уровни экономики ещё остаются относительно свободными, Федплан быстро создал бюрократический аппарат для надзора за профсоюзами, которые выступают главными исполнителями его директив. Насколько успешным окажется план, ещё предстоит увидеть."
  russia_socialist_events.62.d_five: "Несмотря на быстрый промышленный рост в 1920-х годах, Россия всё ещё остаётся второразрядной великой державой в промышленном отношении, пусть и обладает огромным потенциалом. Вопреки сопротивлению умеренных в ВСТ и ПСР мы сделали первые шаги к введению полного государственного планирования, чтобы обеспечить быстрые темпы развития.\n\nМы учредили Федплан, состоящий из делегатов профсоюзов и экономистов, для руководства созданием и выполнением Первого пятилетнего плана. Главными теоретиками нашей экономической политики стали Станислав Струмилин и Сергей Дубровский — оба уважаемые специалисты и сторонники быстрой индустриализации при государственном вмешательстве. Анализируя савинковский ВЭС, Струмилин отмечает, что его экономическая логика была здрава, но на практике он не дал результата из-за компромиссов с капиталистическими интересами и безудержной коррупции в СЗРС. Федплан является наполовину демократическим, наполовину технократическим органом под надзором Съезда, и нынешнее правительство возлагает на него большие надежды.\n\nПервый пятилетний план сосредоточен на полной социализации экономики, расширении тяжёлой и военной промышленности в подготовке к грядущей войне и механизации сельского хозяйства. На этой основе в будущем можно будет строить более передовые отрасли. Хотя низовые уровни экономики ещё остаются относительно свободными, Федплан быстро создал бюрократический аппарат для надзора за профсоюзами, которые выступают главными исполнителями его директив. Насколько успешным окажется план, ещё предстоит увидеть."
  russia_socialist_events.435.t: "Состояние промышленности"
  russia_socialist_events.435.d: "Если проблема деревни — земля, то проблема промышленности — порядок.\n\nСо времени революции промышленная система России так и не была по-настоящему объединена. Фабрики по всей стране выживали сами по себе среди смуты: одни едва держались на старых заказах, другие тянули существование под покровительством спекулянтов, а многие просто остановились. Что производить, сколько производить и кому продавать — ни один центральный орган не мог ответить на эти вопросы.\n\nРезультат оказался катастрофическим.\n\nНа Урале доменная печь, способная давать десятки тысяч тонн чугуна в год, остановилась из-за нехватки кокса, тогда как менее чем в трёхстах километрах другой коксохимический завод оставлял такое же количество кокса выветриваться на железнодорожном дворе, потому что транспортная диспетчеризация развалилась. Это не исключение, а правило. Фабрикам не хватает координации, информация не циркулирует, планы не соединяются, транспорт не движется. Вся промышленная система похожа на машину, шестерни которой зацеплены не там: каждая часть вращается, но сама машина не идёт вперёд.\n\nЕщё хуже — утрата ресурсов. Спекулянты пользуются хаосом, скупают промышленное сырьё по бросовым ценам и контрабандой вывозят его за границу с огромной прибылью. Лес, руда, даже полуготовые детали станков — всё, что должно служить отечественному строительству, превращается в рубли в карманах контрабандистов.\n\nДругие ресурсы растрачиваются на бессмысленное производство. Одни фабрики ради «выполнения планов» выпускают груды плохих товаров, не нужных рынку; другие дублируют одно и то же оборудование, пока по-настоящему редкие машины остаются без внимания. Производственный энтузиазм есть, но его направление слепо.\n\nПод всем этим положение рабочих столь же тревожно. На простаивающих или полупростаивающих фабриках рабочие не получают полной зарплаты, а иногда даже пайков. Квалифицированных рабочих выталкивают из цехов: одни бродят по улицам, другие нанимаются к спекулянтам на частную работу. Руки, которые должны строить социализм, шаг за шагом разъедаются остатками старой эпохи.\n\nТакова реальность, с которой должен столкнуться Первый пятилетний план: не начало с нуля, а начало с хаоса. Первая задача плана — не «строительство», а «организация»: собрать разрозненные ресурсы, вывести самоуправляющиеся фабрики на единый путь и вернуть каждую потраченную впустую тонну угля, каждый кусок железа и каждую пару рабочих рук в машину, которая действительно способна работать."
  russia_socialist_events.435.a: "Приступим к работе."
  russia_socialist_events.434.t: "РКП(б) и Первый пятилетний план"
  russia_socialist_events.434.d: "Составление Первого пятилетнего плана — вовсе не техническое дело, ограниченное кабинетами Федплана. После того как левое крыло ВСТ получило решающее преимущество в политической борьбе, теоретики, организаторы и профсоюзные кадры РКП(б) начали участвовать в плановой работе в беспрецедентной степени. Фабричные комитеты, железнодорожные союзы, делегаты шахт и красные экономисты со всей страны были созваны, чтобы обсуждать размещение тяжёлой промышленности, строительство транспортных артерий, механизацию сельского хозяйства и расширение оборонного производства.\n\nДля многих старых бюрократов и умеренных экономистов большевистские предложения опасно радикальны и почти безразличны к реальности. Они предупреждают, что Россия всё ещё стоит среди руин, оставленных войной, разрушением и бегством капитала: средств производства мало, квалифицированных рабочих немного, а местный административный аппарат ещё не восстановился настолько, чтобы выдержать тяжесть общенационального плана. Представители РКП(б), однако, отвергают такую осторожность. Именно потому, говорят они, что Россия остаётся отсталой, цепи старого мира должны быть разбиты более решительными и централизованными средствами.\n\nСвердлов, Каменев, Сталин и ряд вернувшихся большевистских кадров в разных местах подчёркивали, что пятилетний план — не обычная экономическая политика, а сознательное наступление революционного государства против истории. Он должен свести разрозненные фабрики, шахты, железные дороги и хозяйства в единый ритм и реорганизовать рабочий класс как авангард социалистического строительства. Каждая цель плана должна служить одной задаче: перековать Россию из руин побеждённой революции, проклятой реакцией, в промышленную крепость, способную поддерживать мировую революцию.\n\nВ итоге Федплан принял большинство поправок, предложенных РКП(б). Первый пятилетний план будет сосредоточен на тяжёлой промышленности, машиностроении, развитии энергетики и модернизации железных дорог, включая профсоюзную систему в механизмы надзора и мобилизации. Это будет не умеренная программа восстановления, а строительная программа, объявляющая войну старому миру."
  russia_socialist_events.434.a: "Пусть им ответит рёв машин."
  russia_socialist_events.436.t: "Доклад о Первом пятилетнем плане\nСпециальная сессия Всероссийского Центрального Исполнительного Комитета"
  russia_socialist_events.436.d: "Товарищи:\n\nНесколько лет назад, когда мы предложили Первый пятилетний план, в чьих руках находилась промышленность страны? В руках разрозненных старых капиталистов, спекулянтов и местных бюрократов. В чьих руках было сельское хозяйство? В руках помещиков, кулаков и хлебных торговцев, практиковавших эксплуатацию под именем «свободного рынка». В чьих руках было образование? В руках старой интеллигенции, которая с помощью культурных барьеров держала детей рабочих и крестьян за воротами.\n\nСегодня мы должны ответить на главный вопрос: что изменилось за эти годы?\n\nI. Преобразование производственных отношений: от частного владения к общенародной собственности\n\nСуть пятилетнего плана не только в том, «сколько фабрик построено». Это лишь поверхность. Его сущность — коренное преобразование собственности на средства производства.\n\nНесколько лет назад даже фабрика с вывеской «государственная собственность» часто фактически управлялась ядом старой эпохи: директор мог происходить из старого капиталистического класса, технический костяк — из старой интеллигенции, рабочие не имели голоса в производстве, а поток продукции направлялся спекулянтами. Тогда «государственная собственность» была лишь названием.\n\nЧерез фабричные комитеты, рабочий контроль и углубление классового образования мы шаг за шагом действительно передали эти фабрики в руки рабочего класса. Рабочие теперь участвуют не только в производстве, но и в управлении: производственные планы обсуждаются рабочими, схемы распределения утверждаются рабочими, технические улучшения предлагаются рабочими.\n\nЭто не сентиментальное «сотрудничество труда и капитала», а реальное командование пролетариата производственным процессом.\n\nТо же относится и к сельскому хозяйству. Смысл земельной реформы не сводится к «разделу земли». Раздел был лишь первым шагом. Подлинное преобразование состоит в том, что земля перешла из частной собственности помещиков и кулаков в общественные средства производства, принадлежащие государству и обрабатываемые коллективно. Коллективное хозяйство — не просто «совместная пахота», а глубокая перестройка производственных отношений в деревне.\n\nКулацкий класс ликвидирован как класс. Впервые бедняки и безземельные крестьяне увидели свои имена на земле — не как арендаторы, не как батраки, а как настоящие хозяева земли.\n\nТаково классовое содержание пятилетнего плана: средства производства вырваны из частных рук и возвращены тем, кто их создаёт.\n\nII. Углубление классовой борьбы: план против анархии\n\nКак выглядела промышленность старой эпохи? Это была анархия. Каждая фабрика сама решала, что производить, сколько производить и кому продавать. В результате дефицитные материалы не производились, излишние товары забивали склады, а спекулянты богатели среди хаоса.\n\nЗначение пятилетнего плана в том, что единый план пролетарского государства заменил анархию капитализма. Это не технический вопрос. Это классовый вопрос.\n\nПочему? Потому что планирование само по себе отрицает буржуазный «свободный рынок». Когда государство решает, что сталь сначала пойдёт на тракторные заводы, а не на предметы роскоши, это воля рабочего класса берёт верх над волей капитала. Когда государство направляет редкие станки в коллективные хозяйства, а не в частные мастерские, это социалистическая цель производства заменяет капиталистическую логику прибыли.\n\nЭто не «экономическая корректировка». Это систематическая ликвидация буржуазной производственной логики пролетарским государством.\n\nIII. Революция в надстройке: культура больше не привилегия\n\nСмысл образовательной реформы никогда не сводился к тому, чтобы «научить больше людей читать». Неграмотность старой эпохи была орудием, с помощью которого правящий класс сохранял своё господство: неграмотный крестьянин не мог прочитать закон, посчитать ренту или организоваться для сопротивления. Культурная монополия была одной из самых скрытых и прочных форм классового угнетения.\n\nЗа эти годы мы принесли школы в деревни, вечерние школы в мастерские и кинобригады в самые отдалённые пастбищные районы. Дети рабочих и крестьян впервые вошли в аудитории высшего образования — не для того, чтобы «научиться становиться элитой», а чтобы лучше служить рабочему классу.\n\nСтарая интеллигенция когда-то монополизировала право определять, «что такое знание» и «кто достоин его получить». Сегодня эта власть возвращается назад. Старый крестьянин, двадцать лет работавший в коллективном хозяйстве, приглашён читать лекции в сельскохозяйственный университет, потому что он понимает животноводство. Он не «приглашённый профессор»; он лучший учитель. Слесарь, тридцать лет ремонтировавший станки, переведён в техническую школу писать учебники, потому что он знает свойства каждой марки стали. Он не «представитель рабочих»; он тот, кто лучше всех понимает материал.\n\nЭто не «культурное просвещение». Это передача культурного руководства. Знание переходит из монополии немногих в общее богатство всех трудящихся.\n\nIV. Идеологическое строительство: широкий подъём классового сознания\n\nСамое глубокое изменение, принесённое пятилетним планом, находится не в формах и не в фабричных зданиях, а в сознании людей.\n\nНесколько лет назад многие рабочие ещё считали себя «людьми, продающими рабочую силу». Сегодня они начинают видеть себя хозяевами государства. Несколько лет назад многие крестьяне тревожились о «земле моей семьи». Сегодня они тревожатся об «урожае нашего хозяйства». Несколько лет назад неграмотный сельский юноша мог никогда не выйти за пределы круга в пятьдесят ли. Сегодня такой же юноша посещает вечернюю школу, идёт на курсы, учится водить трактор и даже начинает читать Ленина.\n\nЭто не «пробуждение национального духа» — так говорят буржуазные интеллектуалы. Это пробуждение пролетарского классового сознания: впервые трудящиеся понимают, что они не зрители истории, а её субъекты; не объекты управления, а хозяева, управляющие государством.\n\nКогда члены коллективного хозяйства голосуют на общем собрании, когда рабочие на цеховом собрании предлагают поправки к производственному плану, когда старый крестьянин, прежде не умевший читать, сам берёт в руки Декрет о социализации земли и читает его — в эти моменты старая идеология рушится, а новое классовое сознание необратимо растёт.\n\nЭто величайшее достижение пятилетнего плана: пролетариат учится организовывать самого себя.\n\nV. Трудности и уроки: диалектика продвижения\n\nМаркс учит нас, что всякое преобразование сопровождается болью. Пятилетний план не исключение.\n\nМы допускали ошибки чрезмерной поспешности в коллективизации, страдали от бюрократического торможения в индустриализации и сталкивались с командным нажимом в низовой реализации. В некоторых районах кулацкие элементы маскировались и проникали в кадры; в других спекулянты использовали пробелы в плане, чтобы продолжать наживаться.\n\nЭто не доказательство «провала». Напротив, это реальное лицо классовой борьбы. Не бывает социалистической революции, которая от начала до конца идёт гладко. Ошибки выявляются, чтобы быть исправленными. Трудности встают перед нами, чтобы быть преодоленными.\n\nГлавное вот что: мы исправили их, мы преодолели их и научились подводить итоги опыта через борьбу.\n\nVI. Текущие задачи и будущее направление\n\nПервый пятилетний план завершён. Но борьба не закончится. Преобразование производственных отношений не завершено, и революция в идеологии не завершена.\n\nНаши производительные силы ещё недостаточно развиты, наша техника ещё недостаточно передова, ряды рабочего класса всё ещё нуждаются в расширении и улучшении, а сельская коллективизация — в дальнейшем укреплении.\n\nЭто не дорога, устланная красными коврами. Это дорога, по которой нужно идти с закатанными рукавами, стёртыми ладонями, пролитым потом и, возможно, кровью. Но мы уже доказали, что по этой дороге можно идти.\n\nПролетарское государство способно организовать производство, преобразовать деревню, создать новый корпус рабочей интеллигенции и построить целостную систему социального образования в стране, где неграмотность когда-то охватывала большинство.\n\nМы не опирались ни на какое «национальное превосходство» — это миф, придуманный реакционными теоретиками. Мы опираемся только на один железный закон: когда пролетариат берёт свою судьбу в собственные руки, никакая сила не может помешать ему творить историю.\n\nВторой пятилетний план уже в пути. Ещё не построенные фабрики, ещё не пришедшие в школу дети, ещё не наученные водить тракторы деревни — все они ждут нас.\n\nТак продолжим работу. Без оправданий, без отступления и без намерения сдаться."
  russia_socialist_events.436.a: "Всероссийский Центральный Исполнительный Комитет"
  russia_socialist_events.437.t: "Сталинградский тракторный завод"
  russia_socialist_events.437.d: "«Быстрее, лучше, дешевле» — лозунг, выгравированный у ворот Сталинградского тракторного завода, первые слова, которые видит каждый рабочий, входя в цеха. Как один из первых комбинатов страны, освоивших конвейерное производство гусеничных машин, завод в мирное время выпускает сельскохозяйственные тракторы, но в системе оборонной мобилизации способен быстро перейти к бронетранспортёрам, тягачам и лёгким гусеничным шасси. Это сочетание мирного и военного производства делает его ключевым звеном между механизацией деревни и моторизацией армии.\n\nЗавод тянется вдоль волжской ветки, с литейными, кузнечными, штамповочными, термическими и сборочными цехами, а также специальной линией холодной гибки бронелиста. Конвейеры работают день и ночь, неся двигатели, ходовую часть и секции корпусов к сборочным постам. Рабочие трудятся в три восьмичасовые смены. Завод предоставляет бесплатные столовые, горячие души, базовый медпункт, простые заводские квартиры для квалифицированных рабочих и школы для детей рабочих. В каждой бригаде доска фиксирует двойное соревнование по выпуску и качеству; лучшая команда месяца получает коллективную премию и место в заводской газете «Красная гусеница». Ежегодные передовики могут провести две недели в санатории ниже по Волге.\n\nПо пятилетнему плану Сталинградский тракторный завод назначен образцовой фабрикой мирно-военной интеграции. План включает новый бронепрокатный цех, автоматическую сварочную линию и кольцевой испытательный трек для проверки выносливости гусеничной техники. Производство тракторов должно удвоиться за пять лет, а срок перехода к бронетанковому производству должен сократиться с одного месяца до одной недели. Также будут построены центр технической подготовки и оборонно-спортивный клуб с закрытым тиром. Сталинградский тракторный завод даёт силу полям и щиты фронту, выражая четырьмя простыми словами целую философию индустриализации."
  russia_socialist_events.437.a: "Строить национальную оборону быстрее, лучше и дешевле!"
  russia_socialist_events.438.t: "Ижевский механический завод"
  russia_socialist_events.438.d: "Высококачественное пехотное снаряжение — промышленный принцип Ижевского механического завода. Как один из старейших оружейных комбинатов страны, он давно специализируется на разработке и производстве винтовок, лёгких пулемётов, автоматических винтовок и боеприпасов.\n\nВнутри завода стоят ряды точных станков и производственных линий, которые никогда не умолкают. Рабочие трудятся в три восьмичасовые смены, пользуются бесплатными заводскими столовыми, отапливаемыми общежитиями и заводской клиникой. Квалифицированные техники могут претендовать на простое жильё. Трудовые соревнования наполняют каждый день: каждый цех вывешивает краснознамённые таблицы выпуска и качества, а бригады-победители получают дополнительные премии и путёвки на отдых.\n\nВ пятилетнем плане Ижевский механический завод включён в число приоритетных площадок технической модернизации. Запланированы новый высокоточный цех холодной ковки, автоматизированный корпус сборки боеприпасов и закрытый тир для испытания нового автоматического оружия. План требует к концу периода увеличить выпуск в четыре раза, а также построить рабочий дворец культуры и техническую школу. Этот завод не только перевооружит армейскую пехоту, но и выкует новое поколение военно-промышленных специалистов."
  russia_socialist_events.438.a: "К следующему году у каждого солдата будет не меньше десяти винтовок!"
  russia_socialist_events.439.t: "Автомобильный завод имени Ленина"
  russia_socialist_events.439.d: "Автомобильный завод имени Ленина определяется экспортно ориентированным производством: качественные машины должны приносить государству иностранную валюту. Как одно из первых отечественных автомобильных предприятий, нацеленных на международный рынок, он специализируется на средних грузовиках, внедорожных служебных автомобилях и специальных шасси, известных прочностью и надёжностью в сильные морозы. Цеха штамповки, сварки, окраски и окончательной сборки гонят конвейеры день и ночь.\n\nРабочие трудятся в две десятичасовые смены. На заводе есть дешёвые столовые, бани и сменные общежития; квалифицированные механики могут получить заводские квартиры, а их дети — преимущество при приёме в прикреплённые ясли и начальную школу. Ежемесячные премии выплачиваются по выполненным экспортным заказам, а бригады, три месяца подряд выполняющие нормы, могут получить отпуск в черноморских санаториях.\n\nВ пятилетнем плане завод имени Ленина является ключевым экспортным предприятием. Запланированы полностью автоматическая штамповочная линия, закрытый испытательный трек и центр упаковки и запасных частей для зарубежных заказчиков. Годовой выпуск автомобилей должен утроиться к концу плана, а доля экспорта составить не менее шестидесяти процентов. Завод также расширит дворец культуры, добавит мастерские технической подготовки и введёт отдельные иностранные станки для повышения точности деталей. Автомобильный завод имени Ленина — это и источник валюты, и визитная карточка нашей промышленной мощи."
  russia_socialist_events.439.a: "Окно, обращённое наружу."
  russia_socialist_events.440.t: "Танкоград"
  russia_socialist_events.440.d: "«Дешевизна» — впечатление, которое почти каждый посетитель выносит из Танкограда. Совершенствуя методы обработки и собирая дешёвые материалы в огромном масштабе, завод снизил стоимость танков и бронемашин до поразительной степени без ущерба для характеристик. Его изделия просты, ремонтопригодны и подходят для войн массового истощения, становясь самыми надёжными стальными спутниками фронта.\n\nЗавод занимает несколько квадратных километров и делится на литейные, кузнечные, бронесварочные, сборочные и орудийные цеха. Конвейеры и рельсовые тележки перемещают грубые детали между цехами день и ночь. Рабочие трудятся в две десятичасовые смены, с отапливаемыми общежитиями, дешёвыми столовыми и заводской клиникой. Ключевые технические работники могут получить простое семейное жильё в заводском районе, а их дети — преимущество в прикреплённой рабочей школе. У каждого процесса есть краснознамённая доска брака; команды, выполняющие месячные нормы, получают дополнительную половину месячной зарплаты. Каждое лето заводской профсоюз отправляет лучших производственников на неделю в санаторий у ближайшего озера.\n\nПо пятилетнему плану Танкоград является приоритетной площадкой расширения. Программа включает крупный штамповочный цех, полностью автоматическую линию термообработки брони и отдельный полигон для испытаний танков по пересечённой местности. Выпуск танков должен утроиться за пять лет, а трудозатраты на машину — почти сократиться вдвое. Для поддержки расширения район получит техническую школу, кинотеатр и гимназию. Танкоград несёт главную нагрузку армии по производству бронетехники, постоянно совершенствуя свою философию высокой ценности при низкой цене."
