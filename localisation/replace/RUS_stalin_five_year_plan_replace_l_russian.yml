  RUS_4_year_plan: "[ROOT.RUSGetFirstPlanName]"
  RUS_4_year_plan_name_four: "Первый четырёхлетний план"
  RUS_4_year_plan_name_five: "Первый пятилетний план"
  RUS_4_year_plan_desc: "[ROOT.RUSGetFirstPlanDesc]"
  RUS_4_year_plan_desc_four: "Вместо опоры на рыночные механизмы социализм требует новых способов расширения средств производства. Мы создадим совет, который будет работать со всеми элементами экономики и задавать производственные цели. Эти цели будут определяться на четырёхлетний период и ежегодно пересматриваться, чтобы проверять производительность всех предприятий, обеспечивать их необходимыми ресурсами и при необходимости вносить поправки."
  RUS_4_year_plan_desc_five: "Вместо опоры на рыночные механизмы социализм требует новых способов расширения средств производства. Мы создадим совет, который будет работать со всеми элементами экономики и задавать производственные цели. Эти цели будут определяться на пятилетний период и ежегодно пересматриваться, чтобы проверять производительность всех предприятий, обеспечивать их необходимыми ресурсами и при необходимости вносить поправки."
  RUS_first_five_year_plan_industrial_projects: "[ROOT.RUSGetFirstFiveYearPlanIndustrialProjectsName]"
  RUS_first_five_year_plan_industrial_projects_desc: "[ROOT.RUSGetFirstFiveYearPlanIndustrialProjectsDesc]"
  RUS_first_five_year_plan_industrial_projects_normal: "Экономические проекты"
  RUS_first_five_year_plan_industrial_projects_desc_normal: "Эти решения будут §Gспособствовать§! нашему §Cэкономическому восстановлению§!."
  RUS_first_five_year_plan_industrial_projects_five: "Промышленные проекты первого пятилетнего плана"
  RUS_first_five_year_plan_industrial_projects_desc_five: "Федплан втягивает местные промышленные, транспортные и ресурсные проекты в единый ритм Первого пятилетнего плана.\n\nОчки пятилетнего плана: §Y[?RUS_first_five_year_plan_score|1]§!\nТекущий этап: §Y[?RUS_first_five_year_plan_stage|0]§!/§Y6§!\nСледующий этап: [ROOT.RUSGetFirstFiveYearPlanNextStage]"
  RUS_first_five_year_plan_mission: "Завершить Первый пятилетний план"
  RUS_first_five_year_plan_mission_desc: "Первый пятилетний план должен доказать организационные возможности революционного правительства. До истечения срока нам необходимо иметь более §Y600§! фабрик, технологию §YКонцентрированная промышленность V§! или §YРассредоточенная промышленность V§!, а также не менее §Y110§! очков пятилетнего плана."
  RUS_first_five_year_plan: "Первый пятилетний план"
  RUS_first_five_year_plan_desc: "[ROOT.RUSGetFirstFiveYearPlanTankogradBonus]Федплан втягивает разрозненные промышленные, транспортные и ресурсные проекты в единый ритм Первого пятилетнего плана. Каждое завершённое промышленное начинание добавляет плану новый организационный опыт, производственные мощности и политическую уверенность."
