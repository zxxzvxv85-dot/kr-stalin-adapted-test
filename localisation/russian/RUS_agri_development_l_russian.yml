 RUS_agri_exchange_storage_effect_tt:0 "Потратить §Y4§! доступных баллов реформы.\nВ следующем квартале итоговый множитель убыточных культур §G+0.15§!, но не выше §Y1.00§!. Прибыльные культуры без изменений. Действует один квартал, в том числе после смены года."
 RUS_agri_exchange_storage_desc:0 "Достижения земельной реформы и сельского хозяйства послужат развитию производства и общественного благосостояния.\n\nПотратить §Y4§! доступных баллов реформы.\nВ следующем квартале итоговый множитель убыточных культур §G+0.15§!, но не выше §Y1.00§!. Прибыльные культуры без изменений. Действует один квартал, в том числе после смены года."
 RUS_agri_exchange_aid_food:0 "Продовольственная помощь: [FROM.GetName]"
 RUS_agri_exchange_aid_food_available_tt:0 "Квартальное хозяйствование начато, земельная реформа успешно завершена; Получатель существует, имеет подходящий социалистический строй, не воюет с нами и ещё не получает аграрной помощи; фокус гражданской помощи завершён; Доступно не менее §Y8§! баллов реформы"
