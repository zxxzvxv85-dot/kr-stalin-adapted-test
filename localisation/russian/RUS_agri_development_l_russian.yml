 RUS_agri_exchange_export_desc:0 "Достижения земельной реформы и сельского хозяйства послужат развитию производства и общественного благосостояния.\n\nПотратить §Y6§! доступных баллов реформы.\nОднократно получить §G15000§! экономического профицита. Перерыв: §Y180 дней§!. Не занимает место внутренней программы."
