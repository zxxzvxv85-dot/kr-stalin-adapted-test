 RUS_agri_exchange_machinery_desc:0 "Достижения земельной реформы и сельского хозяйства послужат развитию производства и общественного благосостояния.\n\nПотратить §Y4§! доступных баллов реформы.\nВ следующем квартале базовые множители всех культур §G+0.10§!, итоговый предел остаётся §Y1.50§!. Действует один квартал, в том числе после смены года; текущий квартал не меняется."
 RUS_agri_exchange_storage:0 "Хранение и перевозки"
