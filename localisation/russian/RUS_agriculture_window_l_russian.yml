l_russian:
 RUS_agri_window_open:0 "Система сельского хозяйства"
 RUS_agri_window_open_desc:0 "Нажмите, чтобы открыть производство сельхозпродукции и техники, торговлю и развитие."
 RUS_agri_window_open_tt:0 "§YСистема сельского хозяйства§!\nНажмите, чтобы открыть производство сельхозпродукции и техники, торговлю и развитие."
 RUS_agri_window_support:0 "Поддержка"
 RUS_agri_window_development:0 "Развитие"
 RUS_agri_window_support_status:0 "Поддержка за квартал: §Y[?RUS_nat_support_count|0] / 4§!"
 RUS_agri_window_development_status:0 "Очки реформы: §Y[?RUS_agri_spendable_score|0]§!\nВременные проекты: §Y[?RUS_agri_domestic_active_count|0] / 2§!"
 RUS_agri_window_development_locked:0 "Развитие сельского хозяйства доступно после успешной земельной реформы."
 RUS_agri_window_guide_label:0 "Руководство"
 RUS_agri_window_shutdown_label:0 "Завершить управление"
 RUS_agri_window_shutdown_desc:0 "Цели земельной реформы перевыполнены. Повседневное производство можно передать постоянным органам. Решение необратимо."
 RUS_agri_window_shutdown_effect:0 "Навсегда прекращает ежедневное управление, квартальные расчёты и напоминания, закрывает окно. Освобождает выделенные фабрики и снимает временные годовые аграрные модификаторы. Этапы земельной реформы и независимые награды сохраняются."
 RUS_agri_window_RUS_nat_guide_decision_label:0 "Руководство"
 RUS_agri_window_RUS_nat_guide_decision_tt:0 "§YРуководство§!\nПорядок распределения производства, снабжения, резервов, экспорта и земельной реформы.\n\n[!nat_action_RUS_nat_guide_decision_click_enabled]\n[!nat_action_RUS_nat_guide_decision_click]"
 RUS_agri_window_RUS_nat_support_food_label:0 "Межрегиональные поставки зерна"
 RUS_agri_window_RUS_nat_support_food_tt:0 "§YМежрегиональные поставки зерна§!\nДобавить 4 ед. пшеницы; один раз за квартал, максимум четыре меры поддержки за квартал; стабильность -2% за меру, с Устиновым -1%.\n\n[!nat_action_RUS_nat_support_food_click_enabled]\n[!nat_action_RUS_nat_support_food_click]"
 RUS_agri_window_RUS_nat_support_processing_label:0 "Сырьё для переработки"
 RUS_agri_window_RUS_nat_support_processing_tt:0 "§YСырьё для переработки§!\nДобавить 2 ед. свёклы; один раз за квартал, максимум четыре меры поддержки за квартал; стабильность -2% за меру, с Устиновым -1%.\n\n[!nat_action_RUS_nat_support_processing_click_enabled]\n[!nat_action_RUS_nat_support_processing_click]"
 RUS_agri_window_RUS_nat_support_textiles_label:0 "Сырьё для текстиля"
 RUS_agri_window_RUS_nat_support_textiles_tt:0 "§YСырьё для текстиля§!\nДобавить по 1,5 ед. льна и хлопка; один раз за квартал, максимум четыре меры поддержки за квартал; стабильность -2% за меру, с Устиновым -1%.\n\n[!nat_action_RUS_nat_support_textiles_click_enabled]\n[!nat_action_RUS_nat_support_textiles_click]"
 RUS_agri_window_RUS_nat_support_technical_label:0 "Агрономическая поддержка"
 RUS_agri_window_RUS_nat_support_technical_tt:0 "§YАгрономическая поддержка§!\nУрожайность +5% в этом квартале; один раз за квартал, максимум четыре меры поддержки за квартал; стабильность -2% за меру, с Устиновым -1%.\n\n[!nat_action_RUS_nat_support_technical_click_enabled]\n[!nat_action_RUS_nat_support_technical_click]"
 RUS_agri_window_RUS_nat_support_repair_label:0 "Ремонт сельхозтехники"
 RUS_agri_window_RUS_nat_support_repair_tt:0 "§YРемонт сельхозтехники§!\nИзнос техники -5 п.п. в этом квартале; один раз за квартал, максимум четыре меры поддержки за квартал; стабильность -2% за меру, с Устиновым -1%.\n\n[!nat_action_RUS_nat_support_repair_click_enabled]\n[!nat_action_RUS_nat_support_repair_click]"
 RUS_agri_window_RUS_nat_support_emergency_label:0 "Экстренная закупка зерна"
 RUS_agri_window_RUS_nat_support_emergency_tt:0 "§YЭкстренная закупка зерна§!\nПри расчёте покрыть до 90% потребности в зерне: не более 4 ед., без экспортного излишка; один раз за квартал, максимум четыре меры поддержки за квартал; стабильность -2% за меру, с Устиновым -1%.\n\n[!nat_action_RUS_nat_support_emergency_click_enabled]\n[!nat_action_RUS_nat_support_emergency_click]"
 RUS_agri_window_RUS_agri_exchange_rations_label:0 "Улучшить снабжение города и деревни"
 RUS_agri_window_RUS_agri_exchange_rations_tt:0 "§YУлучшить снабжение города и деревни§!\nДостижения земельной реформы и сельского хозяйства послужат развитию производства и общественного благосостояния.\n\n8 баллов\n[!nat_action_RUS_agri_exchange_rations_click_enabled]\n[!nat_action_RUS_agri_exchange_rations_click]"
 RUS_agri_window_RUS_agri_exchange_mechanisation_label:0 "Расширить механизацию сельского хозяйства"
 RUS_agri_window_RUS_agri_exchange_mechanisation_tt:0 "§YРасширить механизацию сельского хозяйства§!\nДостижения земельной реформы и сельского хозяйства послужат развитию производства и общественного благосостояния.\n\n10 баллов\n[!nat_action_RUS_agri_exchange_mechanisation_click_enabled]\n[!nat_action_RUS_agri_exchange_mechanisation_click]"
 RUS_agri_window_RUS_agri_exchange_reserves_label:0 "Пополнить армейские продовольственные резервы"
 RUS_agri_window_RUS_agri_exchange_reserves_tt:0 "§YПополнить армейские продовольственные резервы§!\nДостижения земельной реформы и сельского хозяйства послужат развитию производства и общественного благосостояния.\n\n8 баллов\n[!nat_action_RUS_agri_exchange_reserves_click_enabled]\n[!nat_action_RUS_agri_exchange_reserves_click]"
 RUS_agri_window_RUS_agri_exchange_materials_label:0 "Обеспечить сырьём лёгкую промышленность"
 RUS_agri_window_RUS_agri_exchange_materials_tt:0 "§YОбеспечить сырьём лёгкую промышленность§!\nДостижения земельной реформы и сельского хозяйства послужат развитию производства и общественного благосостояния.\n\n10 баллов\n[!nat_action_RUS_agri_exchange_materials_click_enabled]\n[!nat_action_RUS_agri_exchange_materials_click]"
 RUS_agri_window_RUS_agri_exchange_export_label:0 "Экспорт сельскохозяйственных излишков"
 RUS_agri_window_RUS_agri_exchange_export_tt:0 "§YЭкспорт сельскохозяйственных излишков§!\nДостижения земельной реформы и сельского хозяйства послужат развитию производства и общественного благосостояния.\n\n6 баллов\n[!nat_action_RUS_agri_exchange_export_click_enabled]\n[!nat_action_RUS_agri_exchange_export_click]"
 RUS_agri_window_RUS_agri_exchange_machinery_label:0 "Дополнительная техника"
 RUS_agri_window_RUS_agri_exchange_machinery_tt:0 "§YДополнительная техника§!\nДостижения земельной реформы и сельского хозяйства послужат развитию производства и общественного благосостояния.\n\n4 баллов\n[!nat_action_RUS_agri_exchange_machinery_click_enabled]\n[!nat_action_RUS_agri_exchange_machinery_click]"
 RUS_agri_window_RUS_agri_exchange_storage_label:0 "Хранение и перевозки"
 RUS_agri_window_RUS_agri_exchange_storage_tt:0 "§YХранение и перевозки§!\nДостижения земельной реформы и сельского хозяйства послужат развитию производства и общественного благосостояния.\n\n4 баллов\n[!nat_action_RUS_agri_exchange_storage_click_enabled]\n[!nat_action_RUS_agri_exchange_storage_click]"
 RUS_agri_window_RUS_nat_close_system_label:0 "Завершить управление"
 RUS_agri_window_RUS_nat_close_system_tt:0 "§YЗавершить управление§!\nЦели земельной реформы перевыполнены. Повседневное производство можно передать постоянным органам. Решение необратимо.\n\n[!nat_action_RUS_nat_close_system_click_enabled]\n[!nat_action_RUS_nat_close_system_click]"
