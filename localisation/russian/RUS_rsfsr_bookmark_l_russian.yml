 RUS_rsfsr_bookmark_history: "Поначалу под вдохновенным руководством Владимира Ленина большевики стали известны по всей стране, получив поддержку самых обездоленных.\n\nНо надежды не сбылись. В стремительно менявшейся революционной обстановке ожидаемое народом единство левых так и не наступило. Эсеры-оппортунисты предали революцию, и товарищ Ленин погиб. Некогда многообещающая русская революция потерпела крах, а большевикам оставалось лишь покинуть родину и искать иной путь…"
 RUS_rsfsr_bookmark_card_label: "Российская Советская\nФедеративная Республика"
