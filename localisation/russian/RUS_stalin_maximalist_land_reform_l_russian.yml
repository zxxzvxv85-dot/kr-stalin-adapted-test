  RUS_pre_maximalist_land_reform: "«Успешно завершенная» земельная реформа"
  RUS_pre_maximalist_land_reform_desc: "Сменявшие друг друга правительства утверждали, что земельный вопрос в России решен должным образом и порядок вернулся в деревню. Но действительность огромной деревенской страны куда менее утешительна: старые раны земельного распределения, сельская бедность, административная путаница и остатки антисоциалистических сил все еще тревожат новорожденный социалистический режим.\n\nДо того как максималисты официально представят собственную программу, этот вопрос остается старой болезнью, скрытой под полировкой прежних правительств."
  RUS_maximalist_land_reform: "Земельная реформа максималистов"
  RUS_maximalist_land_reform_desc: "Максималисты претворяют свою программу земельной реформы в жизнь. По мере углубления реформы беспорядок и сопротивление в деревне могут постепенно уступить место новым формам организации."
  RUS_maximalist_land_reform_stage_5: "Успешно завершенная земельная реформа"
  RUS_maximalist_land_reform_stage_5_desc: "Земельная реформа максималистов достигла решающих результатов. Беспорядок, колебания и сопротивление в деревне уступают место новым формам организации, а колхозы, механизированное производство и низовая мобилизация поддерживают более устойчивую социалистическую деревню."
  RUS_maximalist_land_reform_stage_5_tractor_bonus: "Успешно завершенная земельная реформа"
  RUS_maximalist_land_reform_stage_5_tractor_bonus_desc: "Земельная реформа максималистов достигла решающих результатов. Выполнение тракторного обещания еще сильнее укрепило доверие крестьян к новой власти, а колхозы, механизированное производство и низовая мобилизация поддерживают более прочную социалистическую деревню."
  RUS_maximalist_land_reform_stagnation: "Застой земельной реформы"
  RUS_maximalist_land_reform_stagnation_desc: "Земельная реформа не сумела преобразить деревню так, как обещали максималисты. Белый бандитизм, путаное исполнение на местах и выходы из колхозов превратили сельский вопрос в тяжелое бремя режима."

  RUS_max_landreform_agricultural_mechanisation: "Механизация сельского хозяйства"
  RUS_max_landreform_agricultural_mechanisation_desc: "Городской пролетариат растет, но сельские массы нельзя игнорировать. Механизация необходима, чтобы улучшить их жизнь и преодолеть отсталость сельского хозяйства."
  RUS_max_landreform_promote_tractors: "Продвигать тракторы"
  RUS_max_landreform_promote_tractors_desc: "Тракторы являются важнейшими помощниками в деревне, но их нынешнее количество далеко от удовлетворительного. Правительство выделит дополнительные средства на их распространение."
  RUS_max_landreform_to_the_countryside: "В деревню"
  RUS_max_landreform_to_the_countryside_desc: "Чтобы бороться с широкой неграмотностью, правительство призовет образованную молодежь идти в деревню и распространять знания по всей родине."
  RUS_max_landreform_literacy_campaign: "Кампания ликвидации неграмотности"
  RUS_max_landreform_literacy_campaign_desc: "Деревня все еще остается пустыней знаний. Поэтому сельская кампания ликвидации неграмотности необходима."
  RUS_max_landreform_livestock_reorganisation: "Реорганизовать животноводство"
  RUS_max_landreform_livestock_reorganisation_desc: "Для социалистического преобразования животноводства и улучшения уровня жизни правительство реорганизует скот через коллективизацию и кооперацию."
  RUS_max_landreform_concentrate_herds: "Сосредоточить стада"
  RUS_max_landreform_concentrate_herds_desc: "Государственные хозяйства объединят разрозненные мелкие стада на общих пастбищах, а местные кооперативы будут управлять скотом и распределять доходы по труду."
  RUS_max_landreform_model_kolkhoz_zone: "Образцовая колхозная зона"
  RUS_max_landreform_model_kolkhoz_zone_desc: "Мы уверены в превосходстве колхозов, но крестьянство должно увидеть его своими глазами. Образцовая колхозная зона покажет силу примера."
  RUS_max_landreform_call_for_collectivisation: "Призвать к коллективизации"
  RUS_max_landreform_call_for_collectivisation_desc: "На полностью добровольной основе местные кадры призовут сельские массы объединяться в колхозы и вести крупное плановое земледелие."

  RUS_maximalist_land_reform_subtract_score_3_tt: "Прогресс §Yземельной реформы максималистов§! уменьшится на §R3§!."
  RUS_max_landreform_tractor_promise_mission: "Выполнить тракторное обещание"
  RUS_max_landreform_tractor_promise_mission_desc: "Мы обещали восполнить нехватку сельскохозяйственной техники за 270 дней. Завершите решение §YПродвигать тракторы§! §Y3§! раза, чтобы выполнить обещание.\n\nТекущий прогресс: §Y[?RUS_max_landreform_tractor_promise_count|0]§!/§Y3§!"
  RUS_max_landreform_tractor_promise_timeout_tt: "§RТракторное обещание не выполнено:§! базовая стабильность §R-10.00%§!, политическая власть §R-45§!."

  rus_maximalist_land_reform_events.1.t: "Предложение максималистов"
  rus_maximalist_land_reform_events.1.desc: "Отвечая на все более гнилое положение в деревне, Устинов представил съезду программу земельной реформы максималистов:\nВо-первых, совместно с органами политической охраны принять принудительные меры против кулаков и помещиков, давно засевших в деревне, и полностью отменить частную собственность на сельскую землю.\nВо-вторых, призвать образованную молодежь идти в деревню, завершить ликвидацию неграмотности и идейное преобразование.\nВ-третьих, провести широкую и решительную механизацию сельского хозяйства, отбросив традиционные ручные формы старого времени.\nВ-четвертых, на принципе добровольности через низовые кадры призвать крестьян вступать в колхозы и вести более эффективное крупное земледелие.\nПредложение сразу вызвало бурю. Многие старые эсеры сомневались в законности отмены частной собственности и добровольности колхозов. Устинов тут же отверг их доводы, назвав их капитулянтством перед кулаками и помещиками и высокомерным доктринерством. Большевики, давно находившиеся в неприязни с партией социалистов-революционеров, предсказуемо поддержали план Устинова и высоко оценили направление реформы максималистов.\nПосле обсуждения съезд принял программу 73 процентами голосов."
  rus_maximalist_land_reform_events.1.a: "Объявим войну сельской частной собственности!"
  rus_maximalist_land_reform_events.next: "Продолжить."
  rus_maximalist_land_reform_events.2.t: "Крестьяне идут к Муромцу"
  rus_maximalist_land_reform_events.2.desc: "По мере осуществления предложения максималистов большинство крестьян начинает пользоваться выгодами коллективизации. Все больше людей сами просят принять их, прежняя искривленная земельная структура постепенно исчезает из деревни, а широкие крестьянские массы с энтузиазмом помогают социалистическому строительству.\n\nВместе с этой бурной земельной реформой имя Устинова и максималистов звучит все громче. Прозвище Муромец тоже распространяется само собой: как богатыря, который ведет крестьян против кулаков и помещиков, члены колхозов видят в Устинове своего проводника."
  rus_maximalist_land_reform_events.2.a: "Волна коллективизации, миф о Муромце."
  rus_maximalist_land_reform_events.2.a.tt: "§YЗемельная реформа максималистов успешно завершена!§!"
  rus_maximalist_land_reform_events.3.t: "Застой земельной реформы"
  rus_maximalist_land_reform_events.3.desc: "Перед нынешним узлом сельских проблем некогда уверенный Устинов наконец опустил голову. Он признал полный провал земельной реформы максималистов: белобандитские силы в деревне не были эффективно очищены, а колхозный строй не был правильно проведен.\n\nПровалы лишили максималистов лица, и в партии все громче звучат сомнения в Устинове. Товарищи, когда-то почитавшие его как спасителя крестьян, теперь обвиняют его в отрыве от реальности и чрезмерной поспешности. Более радикальные прямо требуют от него публичного покаяния и передачи руководства максималистами человеку, который лучше понимает деревню.\n\nУстинов сидит в пустом зале заседаний, перед ним раскрыты доклады с цифрами: нападения белых бандитов растут, а заявления о выходе из колхозов складываются горой. Он пытается оправдаться, но уже не находит слов."
  rus_maximalist_land_reform_events.3.a: "«Высшая программа» завершила свой опыт."
  rus_maximalist_land_reform_events.3.a.tt: "§RЧто же ты натворил?§!"
  rus_maximalist_land_reform_events.4.t: "Состояние земельной реформы"
  rus_maximalist_land_reform_events.4.desc: "После Великого голода на Волге облик русской деревни был изменен навсегда.\nДо этого земельная либерализация прежнего правительства уже заложила семена бедствия. Земля перешла от ограниченного распределения к свободной купле-продаже. На словах это должно было оживить сельскую экономику, но на деле ускорило скупку земли: кулаки, опираясь на деньги и средства производства, быстро расширялись, а множество обычных крестьян под давлением рынка и долгов постепенно теряли землю, превращаясь в арендаторов или батраков. Середняки уже тогда стояли на краю, хотя еще сохраняли слабое присутствие.\nПотом пришел голод.\nНепрерывная засуха в Поволжье столкнула все в пропасть. Перед лицом голода земля и зерно стали единственной твердой валютой. Кулаки с запасами хлеба за бесценок забирали землю у умирающих крестьян. Должники продавали последнее имущество за кусок хлеба. А многие не успели продать ничего: они просто умерли."
  rus_maximalist_land_reform_events.4.desc_2: "Когда голод отступил, он оставил почти безнадежную картину.\nКулаки заняли самую плодородную и удобную землю. У них был скот, инвентарь и остатки хлеба в амбарах. Бедняки и батраки составляли подавляющее большинство населения: первые год за годом боролись за жизнь на клочке земли, вторые могли только работать на кулацких полях на тяжелых условиях. Середняки, когда-то считавшиеся опорой деревенской устойчивости, почти исчезли: одни разорились и стали бедняками, других поглотил голод, выжили лишь немногие.\nТрадиция деревенской взаимопомощи была разрушена голодом. Кулаки превратили хлеб в оружие, бедняки погрузились в молчаливое отчаяние. Русская деревня словно откатилась к старому кругу.\nЕще страшнее - огромные пустующие земли. Участки умерших и беженцев либо дешево скупали кулаки, либо номинально брали под опеку местные органы, но из-за нехватки рук и семян их никто не обрабатывал. Плодородная черноземная земля заросла сорняками, а голодным людям негде было вонзить мотыгу.\nТеперь сельскому хозяйству России нужны не мелкие починки, а глубокое революционное преобразование, способное разбить старый порядок и выковать новое основание."
  rus_maximalist_land_reform_events.4.a: "Сметем старый мир!"
  rus_maximalist_land_reform_events.6.t: "Манифест коллективизации"
  rus_maximalist_land_reform_events.6.desc: "- Речь Устинова на съезде рабочих и крестьянских представителей, отрывок\nВы хотите, чтобы я объяснил, что такое «законность» и что такое «добровольность».\nХорошо, объясню.\nКто-то говорит, что прямое уничтожение частной собственности на землю - это «радикализм». Тогда я спрошу:\nкрестьянин всю жизнь пашет землю и перед смертью не может купить даже надгробие - это «законно»?\nПомещик по долговой расписке может увести единственную корову у семьи - это «законно»?\nЕсли правильной мерой вы считаете стоять в стороне, то я предпочту быть радикалом.\n«Капитал с головы до пят источает кровь». А наша земельная частная собственность источает кровь крестьян.\nЕсли вы называете это «основой деревни», я эту основу выкопаю.\nВаше любимое слово - «добровольность».\nРасскажу вам правду: в Тамбовской губернии старик-крестьянин занял у кулака семенное зерно и не смог вернуть. Кулак по «добровольному соглашению» увел его лошадь.\nКогда человек умирает от голода, какая подпись не будет «добровольной»?\nСъездите в деревню и посмотрите, как те, у кого есть молотилки, давят тех, у кого их нет; как те, у кого есть хлеб, дают в рост.\nПосмотрите своими глазами, товарищи, вот она - буржуазная «свобода»!"
  rus_maximalist_land_reform_events.6.desc_2: "Колхоз не гонит людей ружьем. Но он покажет всем:\nкто вступил - ест досыта, кто не вступил - голодает.\nТакова реальность революции.\nВы говорите, колхозы - пустые слова?\nВ саратовском образцовом районе «Красная заря» на той же земле и при той же погоде выработка на человека выше единоличной на четыре десятых.\nВ тамбовской «Трудовой коммуне» мороз уничтожил у единоличников четыре десятых урожая, а у них - меньше одной десятой.\nЦифры лежат в докладах. Можете проверить.\nСтарые народники сняли дворянские фраки, надели крестьянские лапти, прошли по деревням Поволжья, учили крестьян грамоте, лечили их, писали за них жалобы на помещиков.\nПосле этого товарищи из «Земли и воли» с ружьями останавливали на саратовских дорогах помещичьи экипажи и публично жгли захваченные земельные акты.\nВот традиция партии социалистов-революционеров.\nНе изящные протесты в петербургских салонах, а поход в деревню и кровь вместе с крестьянами.\nА теперь?\nНекоторые в партии говорят о «социализации земли», но не смеют сказать об уничтожении частной собственности.\nКулаки прячут хлеб - они говорят «терпение». Помещики возвращаются - они говорят «законность». Крестьян доводят до продажи детей - они говорят «уважайте добровольность».\nНеужели это ваша традиция?\nКогда я стрелял на улицах в 1905 году, когда я был среди матросов в 1917 году, где были вы?\nВ министерских креслах Керенского? На дороге за английскими займами?\nТеперь снова пришло время борьбы.\nСоциалисты-революционеры должны встать за крестьян.\nТоварищи,\nкогда тракторы колхозов войдут в поля,\nкогда мука из общественных амбаров попадет в руки рабочих,\nтогда и скажете, безумец я или боец."
  rus_maximalist_land_reform_events.6.a: "Только через глубокое общественное преобразование возможно настоящее развитие личности."
  rus_maximalist_land_reform_events.7.t: "Основной закон о социализации земли и коллективном труде"
  rus_maximalist_land_reform_events.7.desc: "Статья I: принадлежность земли\nСо дня опубликования настоящего закона вся земля на территории Российской Социалистической Республики, включая пашню, пастбища, леса, сады и неосвоенные пустоши, лишается частной собственности и переходит в государственную собственность. Ни одно лицо, семья или группа не может заявлять частное право на землю. Все прежние договоры купли-продажи, залога и наследования земли с этого дня недействительны.\nСтатья II: принципы распределения права пользования землей\nПраво пользования землей распределяется по трудоспособности среди тех, кто реально обрабатывает землю. Распределение выполняют сельские, волостные и уездные комитеты бедноты по земле. Эти комитеты избираются батраками и бедняками; их членами не могут быть кулаки, помещики или их ближайшие родственники.\nНормы распределения:\n- по дворам, исходя из числа трудоспособных членов семьи;\n- земли разного качества распределяются совместно, нельзя выдавать худшую за лучшую или сосредоточивать бедные земли у одной группы;\n- результат распределения утверждается открытым голосованием сельского схода и действителен при согласии более двух третей присутствующих."
  rus_maximalist_land_reform_events.7.desc_2: "Статья III: основные принципы коллективного труда\nПосле завершения распределения земли крестьяне, получившие право пользования, на добровольной основе прежде всего вступают в местные колхозы или сельскохозяйственные кооперативы. Колхоз ведет единый сев, единое управление и единое распределение. Члены участвуют в годовом разделе дохода по трудовому вкладу.\nДля поощрения коллективного труда государство предоставляет районам с колхозами приоритет:\n- сельскохозяйственные машины и топливо;\n- лучшие семена и удобрения;\n- льготные сельскохозяйственные кредиты;\n- технических работников и учителей ликбеза.\nХозяйства, отказавшиеся вступить в колхоз и выбравшие единоличную обработку, могут продолжать пользоваться выделенной землей, но несут налоги и производственный риск самостоятельно и не получают указанной приоритетной помощи.\nСтатья IV: переходный срок и органы исполнения\nВ течение трех месяцев со дня закона уезды завершают выборы комитетов бедноты по земле. В течение шести месяцев проводится обмер и регистрация всей земли. В течение года завершается первое распределение права пользования.\nНародный комиссариат внутренних дел и Рабоче-крестьянская инспекция совместно надзирают за исполнением закона. За препятствование распределению, подделку результатов, ложное объявление бедняцкого происхождения или подстрекательство к сопротивлению колхозам виновные отвечают по закону.\nСтатья V: право толкования и пересмотра\nОкончательное толкование настоящего закона принадлежит Всероссийскому Центральному Исполнительному Комитету. Все споры о земле и коллективном труде решаются Советами по ступеням, с окончательным решением за Комитетом по сельскому хозяйству при ЦИК.\n---\nНастоящий закон вступает в силу со дня опубликования.\nНародный комиссар земледелия Устинов"
  rus_maximalist_land_reform_events.7.a: "Врата нового мира открыты перед нами."
  rus_maximalist_land_reform_events.10.t: "Механизация сельского хозяйства"
  rus_maximalist_land_reform_events.10.desc: "Традиционный полевой труд отнимает много времени и сил. За день крестьянин может обработать лишь маленький участок, а год за годом остается почти полностью во власти погоды.\nСавинков действительно вкладывал средства в деревню, но большая часть ушла в карманы бюрократов Союза защиты, а сельские массы продолжали страдать.\nЭто должно измениться. Трагедии старой деревни не должны повториться на земле нового времени. Поэтому единогласным решением съезда сельскохозяйственное ведомство получило значительные средства на покупку тракторов и другой механизированной техники, а также необходимых удобрений и семян.\nМы верим, что при помощи низовых кадров каждый член колхоза научится владеть трактором. В будущем разум и эффективность станут синонимами сельского производства."
  rus_maximalist_land_reform_events.10.a: "Товарищи, на тракторы!"
  rus_maximalist_land_reform_events.11.t: "Нехватка сельскохозяйственной техники"
  rus_maximalist_land_reform_events.11.desc: "Земельная реформа - только первый шаг. Полученную землю еще нужно обработать.\nНо сегодня в русской деревне больше всего не хватает именно машин, без которых обработка невозможна. Производство и наличие тракторов давно резко отстают от потребности. Немногие тракторные заводы страны годами недогружены: оборудование стареет, деталей не хватает, мощностей недостаточно для огромной сельской карты.\nВ Поволжье типичный колхоз получает в среднем один трактор на триста гектаров пашни, и значительная часть этих машин полуразобрана из-за нехватки запчастей. В более отдаленных губерниях положение еще хуже: многие деревни до сих пор полностью зависят от тяглового скота и ручного труда, а деревянный плуг и серп остаются главными орудиями крестьянина."
  rus_maximalist_land_reform_events.11.desc_2: "Ограниченные мощности заставляют нас выбирать:\nПриоритет колхозам. Сосредоточить редкие тракторы в уже созданных или создаваемых колхозах, чтобы образцовые районы первыми добились механизации и убедили сомневающихся результатом. Это даст быстрый эффект, но мелкие единоличники продолжат пахать по-старому и могут почувствовать усиление неравенства.\nРавное распределение. Добиться, чтобы каждая деревня, независимо от размера, получила хотя бы один трактор. Политически это надежнее и не вызывает упреков в предпочтениях. Но машины окажутся слишком рассеяны, масштабного эффекта не будет, а стоимость ремонта и топлива резко вырастет.\nОтложить распределение. Пообещать крестьянам, что в ближайшие девять месяцев каждый трактор будет правильно распределен, но сперва сосредоточиться на росте производства, подготовке кадров и создании всероссийской сети запчастей. Этот путь требует терпения и сильнее всего проверяет доверие крестьян к власти."
  rus_maximalist_land_reform_events.11.a: "Сначала колхозам. Сельский фундамент должен быть крепким."
  rus_maximalist_land_reform_events.11.a.tt: "Мы сосредоточим поддержку на колхозах."
  rus_maximalist_land_reform_events.11.b: "Распределить поровну: социализм означает равенство."
  rus_maximalist_land_reform_events.11.b.tt: "Мы распределим сельскохозяйственную технику равномерно."
  rus_maximalist_land_reform_events.11.c: "Пусть массы еще немного подождут. Скоро у каждого будет трактор!"
  rus_maximalist_land_reform_events.11.c.tt: "Мы сделаем приоритетом производство тракторов. Появится новая миссия земельной реформы: завершить §YПродвигать тракторы§! §Y3§! раза за 270 дней. При успехе произойдет событие §YДоверие не обмануто§!; при провале базовая стабильность §R-10.00%§! и политическая власть §R-45§!."
  rus_maximalist_land_reform_events.12.t: "Долгое ожидание"
  rus_maximalist_land_reform_events.12.desc: "Тамбовская губерния, деревня, перед весенней пахотой\n\nУ старой акации на въезде в деревню собрались люди.\n\n«Сверху сказали: подождем девять месяцев, и к осенней уборке тракторы придут», - снова и снова читал уведомление староста. «А в этом году... потрудитесь, пока скотом».\n\nНикто не говорил.\n\nКто-то тер руки, кто-то смотрел на дальние поля, которые нужно было поднять. Молодой парень заговорил первым: «Староста, у меня мул весной пал. Чем я сеять буду?»\n\n«Одолжишь. Через группу взаимопомощи. Перетерпишь».\n\n«Так же говорили в прошлом году».\n\nВ толпе раздался тихий смех - не веселый, а горький.\n\nСтароста помолчал, потом сказал низко, но ясно: «Одно скажу. Верите или нет, а я верю. Эта власть не такая, как прежние. Если сказала, что придет, значит придет. Просто... дорогу проходят шаг за шагом».\n\nВесенняя пахота началась без тракторов. Старики гнулись за плугом, молодые разбрасывали семена, дети с ведрами шли позади. Все было как пятьдесят лет назад.\n\nНо староста запомнил подпись под уведомлением и строчку в нем: «Мы вас не забудем»."
  rus_maximalist_land_reform_events.12.a: "Просим односельчан поверить нам!"
  rus_maximalist_land_reform_events.13.t: "Письмо с деревенской окраины"
  rus_maximalist_land_reform_events.13.desc: "- Газета «Красные поля»\n\n«Тракторы пришли, но пришли к ним».\n\nТак говорит старый Сергей, единоличный середняк. Он сидит на корточках у своего порога и смотрит на пыль, поднимающуюся у колхоза: там с утра до вечера гудит мотор, распахивая новый участок.\n\n«Они говорят, это приоритетная помощь, говорят, потом и нам перепадет». Сергей сплевывает табак. «А что с этой весной? Моя лошадь зимой сдохла. Чем мне землю поднимать?»\n\nТакие жалобы идут по деревням. Единоличники, не получившие машин, смотрят, как тракторы колхозов идут в поля, а сами по-прежнему несут плуг и согнутой спиной проходят борозду за бороздой.\n\n«Колхоз - будущее, а мы мостки под ногами», - так кто-то подвел итог.\n\nНо колхозники так не думают. «У нас работа идет быстрее, урожай выше. Потом вся деревня будет жить нашим хлебом», - говорит молодой колхозник, хлопая по капоту трактора. «Хотят вступать - милости просим. А если цепляются за свой клочок, пусть не винят нас, что мы не ждем».\n\nЗемля не лжет. К осени колхозный амбар был полон, а амбары единоличников оставались наполовину пустыми.\n\nКолхозники начали понимать, что сила коллектива действительно выше одиночного труда; единоличники начали понимать, что им придется либо вступить, либо остаться позади."
  rus_maximalist_land_reform_events.13.a: "Деревня раскололась, но трещина пошла именно туда, куда хотели максималисты."
  rus_maximalist_land_reform_events.14.t: "Рубрика писем читателей"
  rus_maximalist_land_reform_events.14.desc: "- «Известия»\n\n«Разве справедливо ставить нас в один ряд с мелкими хозяевами по два гектара?»\n\nВ редакцию пришло письмо от члена тамбовского колхоза. В нем говорилось, что их колхоз только в прошлом году встал на ноги и должен был расширить посевы, но сверху решили распределять поровну: из трех обещанных тракторов два забрали и отдали двум соседним малым деревням.\n\n«Мы понимаем трудности сверху, но что делать с нашим планом? Сто пятьдесят гектаров и один трактор - как сеять?»\n\nДве деревни, получившие тракторы, тоже не живут легко. Для маленькой деревни одна машина - незнакомая вещь: ремонтировать некому, запасных частей нет, за дизелем нужно ехать за тридцать километров. На уборке трактор простоял почти полмесяца, а когда его починили, хлеб уже переспел.\n\n«Лучше бы не начинали», - горько усмехнулся один староста. «Кто увидел трактор, уже не вернется к воловьей пахоте. Но если машина сломалась, все равно впрягаем волов».\n\nДоброе намерение равного распределения было разбито реальностью на местах. Каждый получил немного, но никто не получил достаточно."
  rus_maximalist_land_reform_events.14.a: "Это нехорошо!"
  rus_maximalist_land_reform_events.15.t: "Доверие не обмануто"
  rus_maximalist_land_reform_events.15.desc: "Поволжье, деревня, начало весны следующего года\n\nДождь, начавшийся перед рассветом, все еще мелко падал, и воздух пах вскрытой землей. Староста стоял у въезда в деревню. Перед ним были два новых трактора, на гусеницах еще блестело заводское антикоррозийное масло.\n\n«Пришли», - сказал он.\n\nНикто не кричал. Старики лишь обошли двух железных зверей кругом: кто-то трогал гусеницу, кто-то стучал пальцем по корпусу, слушая глухой металл. После долгого молчания из толпы вышла старуха, принесла чайник и поставила его на камень у трактора.\n\n«Мастерам. С дороги устали».\n\nВдали первые механизаторы на площадке у школы налаживали плуги. На них была чистая рабочая одежда, рукава закатаны до локтей, а на лицах была усталость и радость тех, кто наконец дошел.\n\nКто-то спросил старосту: «Что дальше?»\n\nСтароста посмотрел на черную землю в конце гряд: «Сначала засеем нашу деревню, потом поможем соседней. Сверху сказали, это мобильная бригада: кто закончил первым, едет помогать тем, кто еще не закончил».\n\nМолодежь уже побежала слушать объяснения механизаторов. Жена старосты стояла рядом и толкнула его локтем: «Что ты им говорил в прошлом году?»\n\n«Сказал: если верим, значит верим».\n\n«А теперь?»\n\nСтароста не ответил. Он наступил на грязь под ногами. В этом году не придется тащить плуг. Одного этого хватало, чтобы верить еще год.\n\nВдали завелся первый трактор. Рев мотора разорвал деревенскую тишину. Несколько детей побежали за ним, и смех рассыпался по дороге."
  rus_maximalist_land_reform_events.15.a: "Никто не останется позади!"
  rus_maximalist_land_reform_events.15.a.tt: "После завершения земельной реформы §YУспешно завершенная земельная реформа§! дополнительно получит: ожидаемое количество фабрик товаров народного потребления §G-2.00%§!, стоимость закона об экономике §G-20.00%§!."
  rus_maximalist_land_reform_events.20.t: "Возрождение помещичьего класса"
  rus_maximalist_land_reform_events.20.desc: "Временное силовое подавление еще не означает вечного революционного результата.\n\nВ последнее время из разных мест поступают тревожные донесения: остатки белых бандитов снова активизируются в деревне. Опираясь на изгнанных помещиков и кулаков, они создают так называемые «возвратные отряды». Эти вооруженные громилы жгут колхозные амбары, убивают низовых кадров, заставляют крестьян возвращать уже распределенную землю. В некоторых местах они вывешивают старые флаги и восстанавливают старые земельные акты, словно гражданская война не закончилась.\n\nИх зверства носят ярко выраженный карательный характер."
  rus_maximalist_land_reform_events.20.desc_2: "В Саратовской губернии они публично расстреляли председателя комитета бедноты, руководившего распределением земли, и повесили на него дощечку: «Хозяева земли вернулись». В Тамбовской губернии в нескольких деревнях публично сожгли книги колхозного учета, а колхозникам приказали «разойтись по домам и ждать возвращения старых хозяев». Еще хуже то, что они используют память о голоде, заявляя: «с большевиками вы только умрете от голода, с нами будет хлеб». В некоторых отдаленных хлебонедостаточных районах такая агитация даже получила временный отклик.\n\nНо это не организованное крестьянское восстание, а предсмертная контратака старых сил. Куда бы ни пришел такой отряд, он прежде всего восстанавливает старый порядок: ренту, возврат земли, расправы над «предателями». Их «возвращение» в сущности есть попытка помещиков и кулаков вернуть собственность и привилегии. Крестьяне скоро поймут: за ними идут не сытый хлеб, а прежние цепи.\n\nРазведка показывает, что эти отряды связаны с белой эмиграцией за границей. Оружие и боеприпасы тайно идут через границу, а бывшие белые офицеры проникают к ним как «советники», пытаясь превратить разрозненное деревенское насилие в плановое контрреволюционное восстание.\n\nДля молодой революционной власти это серьезное испытание. Если мы вовремя не уничтожим эти реакционные вооруженные силы, плоды земельной реформы будут утрачены, а только созданные колхозы получат разрушительный удар. После обсуждения съезд постановил:"
  rus_maximalist_land_reform_events.20.a: "Расширить народную милицию. Мы должны обеспечить безопасность деревни..."
  rus_maximalist_land_reform_events.20.b: "...этого мало! Вкатить пушки в деревню!"
  rus_maximalist_land_reform_events.20.b.tt: "Мы позволим местным отрядам охраны порядка использовать тяжелое оружие."
  rus_maximalist_land_reform_events.20.c: "Они думают, только они могут убивать нас?"
  rus_maximalist_land_reform_events.20.c.tt: "Помимо расширения милиции и тяжелого оружия, политическая охрана организует убийство главаря белых бандитов."
  rus_maximalist_land_reform_events.21.t: "Одна ночь в Харбине"
  rus_maximalist_land_reform_events.21.desc: "Когда Сунгари сковало льдом, снег на улицах был истоптан до серо-черной корки. Харбин, город, прочно удерживаемый фэнтяньскими милитаристами, за последние годы принял множество русских белоэмигрантов и стал крупнейшим дальневосточным гнездом белых остатков.\n\nГригорий Михайлович Семенов живет именно здесь. Казачий атаман, когда-то громыхавший восточнее Байкала, белый генерал, называвший себя верховным командующим Забайкальским казачьим войском, до сих пор имеет просторный русский особняк, личную охрану из бывших белых офицеров и негласную защиту фэнтяньских властей. В харбинской гостиной он принимает офицеров связи японской Квантунской армии, собирает деньги в русских клубах и тайно посылает группы к дальневосточной границе, пытаясь снова зажечь неприятности для социалистической власти.\n\nГлавное управление политической охраны давно следит за ним.\n\nСеменов не просто изгнанник. Он духовная опора белых сил на Дальнем Востоке и посредник между японцами и фэнтяньцами, лучше всех знающий русские дела. Пока он жив, у антисоциалистических сил в Маньчжурии есть место для связи, планов и организации. Деревенское антисоциалистическое сопротивление, «возвратные отряды», белые агенты в селах и местные силы, поддерживающие помещиков, связаны с ним множеством нитей. Оружие идет по его каналам, деньги проходят через его руки, а многие командиры таких отрядов служили у него в белой армии.\n\nНо он знает об опасности: живет скрытно, маршруты держит в тайне, особняк охраняется слоями постов, а три бывших белых разведчика занимаются контрнаблюдением.\n\nОднако в Харбине у него есть неожиданная слабость: повар."
  rus_maximalist_land_reform_events.21.desc_2: "Повар - белый эмигрант. В молодости он был кашеваром в частях Семенова, потом бежал с ним в Маньчжурию. Его преданность никто не ставил под сомнение. Но у него есть и другая связь: его младший брат состоит в амурском колхозе, а тот брат два года назад стал внешним осведомителем политической охраны.\n\nБрат передал только одно сообщение: «мой старший брат готовит Семенову в Харбине». После этого никаких указаний не было.\n\nДень X, месяц X\n\nУжин Семенова состоял из украинского борща. Повар как обычно подал его, вышел за дверь, затем направился к черному входу и сел в безномерную повозку. Второй работы в Харбине у него уже не будет.\n\nСеменов сделал первый глоток.\n\nЧерез три часа личный врач объявил причиной смерти острую сердечную недостаточность от пищевого отравления. Фэнтяньская полиция опечатала кухню и арестовала слуг, но повар уже исчез на глухой маньчжурской дороге. Через несколько дней он сможет вернуться домой.\n\nКогда новость дошла до Москвы, в архиве политической охраны появился документ с пометкой «выполнено», номер «Соловей-7».\n\nЧерез месяц проникновения на дальневосточной границе заметно сократились. Еще через два месяца белые эмигранты в харбинском русском клубе публично перессорились и раскололись на две группы, обвиняющие друг друга в работе на социалистов.\n\nВ деревне последствия оказались еще прямее. «Возвратные отряды», лишенные внешней поддержки, обнаружили смертельную слабость: патроны не пополнялись, новобранцы не приходили, дальнейший план отсутствовал. Старый цикл «ударить, уйти за границу, отдохнуть» был сломан. Одни белые главари начали получать вести о бегстве людей, другие тихо распускали отряды, закапывали оружие и делали вид, будто никогда не были бандитами."
  rus_maximalist_land_reform_events.21.a: "Сердце радуется!"
  rus_maximalist_land_reform_events.22.t: "Под серпом и молотом"
  rus_maximalist_land_reform_events.22.desc: "Третий возвратный отряд вошел в волжскую деревню Березовку перед рассветом. Они собирались сжечь склад сельсовета, отравить колодцы и похитить старую мать председателя колхоза, чтобы провести ее по следующему базару. Это был их обычный «учебный террор».\n\nНо они не ожидали, что сельская милиция уже не та толпа с тремя старыми ружьями, что была два месяца назад.\n\nПосле приказа центра расширить народную милицию Березовка получила тридцать пять винтовок и партию гранат. Главное же - туда прислали отставного унтер-офицера царской армии, татарина, перешедшего к революции из ненависти к помещикам. За две недели он научил тридцать семь крестьян устраивать засады, прикрывать друг друга и перекрывать улицы гранатами.\n\nЕдва отряд вошел в деревню, со стороны амбара ударил плотный огонь. Затем восточный и западный выходы из деревни были перекрыты горящими возами сена. Испуганные бандиты попытались уйти вдоль реки, но там уже ждали восемь женщин с охотничьими ружьями и вилами.\n\nБой длился меньше получаса. Из семнадцати человек Третьего возвратного отряда одиннадцать были убиты, шестеро взяты живыми.\n\nПленный командир, бывший белый капитан, перед уводом пробормотал: «Когда у вас стало столько оружия?»\n\nПредседатель сельсовета ударил ногой по земле перед ним: «С того дня, как вы решили стать скотами!»"
  rus_maximalist_land_reform_events.22.a: "Отлично!"
  rus_maximalist_land_reform_events.23.t: "Рассвет после артиллерии"
  rus_maximalist_land_reform_events.23.desc: "Николаевский уездный отряд охраны получил невиданный приказ: в зачистках разрешено применять тяжелое оружие. Каменные усадьбы и кирпичные печи, где белые бандиты устраивали опорные пункты, больше не были непробиваемыми черепахами.\n\nЧерез три дня отряд окружил старую помещичью усадьбу у села Чернышево. Разведка сообщала, что там стоит около шестидесяти человек «Молот-отряда» и складированы хлеб и патроны, награбленные в окрестных деревнях.\n\nКомандир не стал, как обычно, гнать пехоту в атаку. Он приказал поставить две 76-мм полевые пушки в четырехстах метрах перед усадьбой и передать: «У вас четверть часа, чтобы сложить оружие и выйти. Иначе усадьба станет вашим гробом».\n\nОтветом была очередь из пулемета.\n\nЧерез пятнадцать минут обе пушки открыли огонь. Первый залп точно ударил по главному дому, камень и щепки взлетели в воздух. Второй бил по стене двора и амбару. После третьего из усадьбы больше не стреляли.\n\nКогда пехота вошла внутрь, она нашла два десятка трупов и несколько перепуганных пленных. Остальные, включая хвастливого командира, исчезли в первом обстреле, оставив лишь половину сапога в обломках.\n\nПосле новости возвратные отряды трех соседних уездов за ночь снялись и бросили несколько давно занятых пунктов.\n\nНо на следующем заседании губкома командира отряда все же раскритиковали: «Ты взорвал усадьбу быстро, но это историческое здание. В следующий раз целься точнее».\n\nКомандир развел руками: «В следующий раз постараюсь, чтобы снаряды обходили культуру стороной»."
  rus_maximalist_land_reform_events.23.a: "Истина существует только в радиусе действия артиллерии!"
  rus_maximalist_land_reform_events.30.t: "Преобразование животноводства"
  rus_maximalist_land_reform_events.30.desc: "Старое сельское животноводство держалось на частных хозяевах и частной торговле. Недостатки очевидны: единоличники плохо управляют большими стадами и часто получают плохую цену на рынке. До сих пор это не изменилось.\nДля глубокого социалистического преобразования животноводства широкое признание получили коллективизация и кооперация.\nОбъединив крупных скотоводов, совхозы смогут сосредоточить ресурсы, вести единое планирование и распространять технику. Через плановое распределение государство обеспечит стабильное снабжение мясом, молоком, кожей и шерстью.\nДля мелких хозяев низовые кадры призовут создавать кооперативы, где стадо станет общим имуществом.\nЭто значит, что каждый пастух, независимо от размера хозяйства, перестанет быть одиноким единоличником и станет звеном социалистической цепи животноводства. Отныне пастбища и загоны принадлежат не частному кошельку, а коллективу и всему народу. Когда первая телега «кооперативного молока» выйдет из деревни, пастухи поймут: только объединенное стадо накормит объединенный народ."
  rus_maximalist_land_reform_events.30.a: "Пусть на каждом животном будет знак коллектива!"
  rus_maximalist_land_reform_events.31.t: "Последний день скотовладельца"
  rus_maximalist_land_reform_events.31.desc: "На Дону, ранчо в четыреста гектаров. На железных воротах все еще висит фамилия старого хозяина: Кузнецов.\n\nКогда приемная бригада совхоза прибыла, сам Кузнецов стоял на ступенях главного дома в кожаной куртке, которую носил двадцать лет. Он молчал и только смотрел, как люди бригады загон за загоном пересчитывают скот. За спиной стояла дочь, крепко держась за край его куртки.\n\n«По декрету все стада свыше пятидесяти голов переходят в государственную собственность», - прочитал начальник бригады и поднял глаза. «Товарищ Кузнецов, вам есть что сказать?»\n\n«Есть». Голос Кузнецова был спокоен. «Я тридцать лет растил скот. Эти руки приняли больше телят, чем вся ваша бригада вместе вырастила. Вы уведете их. Кто будет кормить? Кто будет смотреть? Кто узнает, какая корова вот-вот отелится?»\n\nНачальник опустил документ: «Именно поэтому вы нам нужны. Совхозу нужен опытный управляющий. Если вы согласны...»\n\nКузнецов долго молчал.\n\n«Управляющий?» Он усмехнулся, и в этом было непонятно что - насмешка или самоирония. «Мое ранчо, а я управляющий. Ладно. Лучше, чем гнать меня прочь».\n\nОн спустился к стаду, которое должны были национализировать. Старая корова узнала его и потерлась мордой о руку. Он похлопал ее по шее и тихо сказал что-то, что слышала только корова."
  rus_maximalist_land_reform_events.31.desc_2: "На следующий день Кузнецов надел совхозную рабочую одежду. На рукаве было написано «Донской государственный скотный двор». Дочь определили на ветеринарный пункт изучать новые методы профилактики. Старые книги учета убрали в архив, а вместо них появилась «Квартальная производственная программа».\n\nЗа ужином дочь спросила: «Папа, ты их ненавидишь?»\n\nКузнецов взял кусок хлеба и долго жевал. «Уже нет. Сил ненавидеть не осталось. И потом... они говорят, что будут расширять пастбище, вводить новый племенной скот, строить механизированную доильную. Я в молодости думал об этом, но один не мог сделать».\n\nОн помолчал и посмотрел в окно на стадо в загоне. «Теперь можно».\n\nЗа окном ранчо было тихим, лишь иногда звенел колокольчик. Вдалеке рабочие совхоза при лампах обсуждали закупку корма на следующий сезон. Кузнецов не пошел к ним. Он просто сидел у окна и смотрел, как бывшая его земля становится частью чего-то большего."
  rus_maximalist_land_reform_events.31.a: "Его эпоха закончилась."
  rus_maximalist_land_reform_events.32.t: "Колебания пяти дворов"
  rus_maximalist_land_reform_events.32.desc: "Воронежская губерния, деревня Заречье, поздняя весна\n\nНа длинном столе в сельсовете лежал «Устав животноводческого кооператива». Вокруг сидели пять семей, каждая с тремя-пятью коровами и овцами. Кто-то вертел шапку, кто-то поглядывал в окно.\n\n«В уставе ясно написано», - сказал низовой кадр Игнатьев, подвигая бумагу. «Скот как общее имущество кооператива: общий выпас, общая профилактика, общая продажа. В конце года доход делится по числу внесенного скота и трудовому участию. Убыток - вместе, прибыль - вместе».\n\nМолчание.\n\nСтарший пастух Федор заговорил первым: «Я сорок лет пас овец сам и продавал сам. Теперь отдавать овец? Кому? Кто из вас пас овец?»\n\nИгнатьев не спорил, только спросил: «Дядя Федор, сколько овец у вас умерло в прошлом году? Сколько замерзло зимой? Сколько цены сбил скупщик?»\n\nФедор молчал. Семь овец замерзли. Скупщик дал половину цены городской мясной лавки. Он знал это, и соседи знали.\n\n«У вас пятерых больше семидесяти овец. В один двор их не вместить. Но если согласитесь, я могу просить общее пастбище и сенокосилку. Следующей зимой овцы не умрут от нехватки сена». Игнатьев остановился. «Моих слов мало. Нужно, чтобы все пятеро кивнули».\n\nСнова молчание. Молодая жена тихо спросила: «А если я не уверена, можно половину в кооператив, половину оставить себе?»\n\n«Можно. В уставе есть пункт о половинном вступлении». Игнатьев открыл страницу. «Но через полгода нужно выбрать: полностью вступить или полностью выйти. Половина на половину не годится. Кооперативу нужна общая воля, а не две ставки»."
  rus_maximalist_land_reform_events.32.desc_2: "«Я вступаю», - вдруг сказал Федор. Все посмотрели на него. Он опустил голову и смотрел на руки. «Один я уже не справляюсь. Семь овец погибло, всю зиму сердце болело. Вступлю. Старый я, одному не выпасти».\n\nВторой сказал: «И я вступаю». Третий: «Подумаю». Четвертый молчал, только выпил воду.\n\nПятой была молодая жена. Она посмотрела на Федора, на устав и прикусила губу. «Я тоже внесу наших четырех овец. Но одно условие: я буду счетоводом кооператива. Я грамотная, и никто не будет трогать книгу как попало».\n\nИгнатьев улыбнулся: «Конечно».\n\nЧерез месяц животноводческий кооператив Заречья официально открылся. У входа висела деревянная табличка с кривыми буквами, которые Федор написал обугленной веткой: «Кооператив Единство». На открытие Игнатьев принес мешочек соли и по старому обычаю посыпал порог.\n\n«Соль не рассыплется - кооператив не рассыплется», - сказал он.\n\nФедор стоял среди людей и смотрел на овец в новом загоне: больше семидесяти голов, тесно, блеяние волной. Вдруг он подумал, что этой зимой овечьи голоса, может быть, не будут такими жалкими.\n\nИгнатьев рядом сказал: «Первую телегу кооперативного молока, думаю, через два месяца отправим».\n\nФедор помолчал и ответил не на это: «Та молодая жена хорошо считает. Лучше меня книги ведет».\n\nСказано было тихо, но в этих словах что-то менялось: старая привязанность медленно уступала место новому доверию. В тот вечер члены кооператива не проводили собраний. Они с детьми просто чинили прорехи в загоне. Гвоздей не хватало, кто-то принес старые доски, кто-то бросил свое сено в общий сарай. К концу работы Федор увидел, что и его забор починен. Он не успел спросить кем: молодая жена прошла мимо с молотком и не обернулась."
  rus_maximalist_land_reform_events.32.a: "Объединиться."
  rus_maximalist_land_reform_events.40.t: "Образцовая колхозная зона"
  rus_maximalist_land_reform_events.40.desc: "Для большинства сельских жителей колхоз - новое и непонятное слово. Оно часто встречается в официальных картинках и речах низовых кадров, но что это такое на деле, крестьяне знают плохо.\nДля небольшой части людей колхоз уже осязаем. С основания республики Устинов сознательно призывал массы создавать колхозы, чтобы защищаться от бродячих белых бандитов. Но польза колхоза не сводится к безопасности. В нем все члены равны, коллективное решение становится нормой, а взаимопомощь почти обязательным качеством каждого.\nВ районных трудовых соревнованиях колхозы дают значительно больше продукции на человека, чем единоличники. Улучшение материальных условий привлекает все больше людей: одних из любопытства, других из прямого интереса. Так или иначе, колхоз становится основным путем сельского производства. Эти образцовые зоны будут помнить как следы первопроходцев."
  rus_maximalist_land_reform_events.40.a: "Посмотрите на наши колхозы: вокруг новая жизнь!"
  rus_maximalist_land_reform_events.41.t: "Земельное собрание в Заречье I"
  rus_maximalist_land_reform_events.41.desc: "Воронежская губерния, деревня Заречье, сельсовет\n\nВ день получения декрета в сельсовет набилось больше сорока человек. Лавок не хватало: кто-то сидел на пороге, кто-то стоял у окна. В воздухе смешались запах махорки и земли. Все молчали, и только когда староста читал важные места, внизу поднимался глухой гул.\n\n«Земля принадлежит государству... распределяется комитетами бедноты... вступление в колхоз добровольное».\n\nСтароста дочитал, положил бумагу на стол и прижал рукой. «Ну, спрашивайте».\n\nПосле паузы сзади прозвучал голос: «Моя земля от отца, я ее двадцать пять лет пахал. Теперь она не моя?»\n\n«Ты ее все равно пашешь, только она не твоя. Не можешь продать, сдать, передать сыну. А хлеб твой, если сдашь положенное». Староста помолчал. «А если вступишь в колхоз, будут семена, инвентарь, агроном...»\n\n«Так все равно не моя?»\n\nСтароста не сразу ответил. Он посмотрел на строку декрета: «распределить право пользования по трудоспособности». Потом поднял голову. «Да, не твоя. Но когда она действительно была твоей? Ты мог ее продать? Заложить? При твоем отце в неурожай не закладывали ли ее кулаку за хлеб, и разве в конце она не пропала?»"
  rus_maximalist_land_reform_events.41.a: "Этот голос больше не прозвучал."
  rus_maximalist_land_reform_events.42.t: "Земельное собрание в Заречье II"
  rus_maximalist_land_reform_events.42.desc: "Воронежская губерния, деревня Заречье, сельсовет\n\nПри выборах комитета бедноты случилась неприятность.\n\nПо декрету членами комитета могли быть только батраки и бедняки; кулаки, помещики и их ближайшие родственники не допускались. Староста Шахаров велел повесить на стену большой белый лист: каждый двор сам объявлял свой состав, а затем деревня голосовала.\n\nПервые два тура прошли спокойно. В третьем, когда выбирали председателя комитета, на листе появилось имя Сергей Петров.\n\n«Сергей не годится», - сказали из угла.\n\n«Его отец двадцать лет был управляющим у Кузнецовых. Их земля - кузнецовский подарок».\n\nСергей побледнел и встал. «Я бедняк! У нас всего пять десятин! При чем тут Кузнецовы?»\n\n«Когда твой отец был управляющим, Кузнецовы меньше брали с вас? Кто дал вашей семье плуг? Кто дал лошадь?»\n\nСергей открыл рот и ничего не сказал.\n\nСтароста помолчал. «Сергей, выйди. После выборов зайдешь».\n\nСергей стоял за дверью. Дверь была тонкая, голоса изнутри доносились смутно. Он сел на ступеньки, потер лицо руками и не ушел."
  rus_maximalist_land_reform_events.42.a: "Кто-то прошел мимо, посмотрел на него и ничего не сказал."
  rus_maximalist_land_reform_events.43.t: "Земельное собрание в Заречье III"
  rus_maximalist_land_reform_events.43.desc: "Воронежская губерния, деревня Заречье, сельсовет\n\nВечерний спор шел о словах «на основе добровольности».\n\n«Что значит добровольно?» - старик стукнул трубкой о ножку стола. «Если не вступлю, вы семян не дадите? Инвентаря не дадите?»\n\n«Декрет говорит: не вступившие дворы сохраняют право пользования землей, но не получают приоритетной помощи...»\n\n«Значит, вы меня загоняете!»\n\n«Тебя загоняет земля, а не политика», - сказал староста Шахаров. «Один ты сколько вспашешь? Твой мул прошлой осенью уже плуг не тянул. В жатву опять нанимать поденщиков и отдавать долги. Кто тебя гонит? Ты сам себя гонишь каждый год, когда хлеб не сдаешь».\n\nСтарик замолчал.\n\nМолодая невестка подняла руку: «Наша земля хочет в колхоз, но свекор против. Земля на нем. Могу я отдельно вступить?»\n\n«По двору», - сказал староста, листая декрет. «В одном дворе должны согласиться все трудоспособные. Если свекор против, можно только выделиться...»\n\n«А жить где, если выделиться?»\n\n«Тогда договаривайтесь дальше»."
  rus_maximalist_land_reform_events.43.a: "Люди поняли: когда добрые намерения сталкиваются с настоящей жизнью и настоящими людьми, без трения не обойтись."
  rus_maximalist_land_reform_events.44.t: "Земельное собрание в Заречье IV"
  rus_maximalist_land_reform_events.44.desc: "Воронежская губерния, деревня Заречье, сельсовет\n\nКогда собрание разошлось, Федор, тот самый старик-овцевод, встретил Сергея у двери. Сергей все еще сидел на ступеньках.\n\n«Ты чего тут?»\n\n«Я... жду известий».\n\n«Есть известия». Федор сел рядом и достал кисет. «Не выбрали».\n\nСергей замер: «А кто председатель?»\n\n«Пока сам староста. Через месяц перевыборы».\n\n«...А я?»\n\nФедор закурил. «Землю семье дадут, если не кулак. А комитет - в другой раз». Он помолчал. «Но про твоего отца деревня знает. Надо, чтобы люди поняли: ты с ними».\n\nСергей вертел травинку: «Как?»\n\nФедор похлопал его по плечу. «Приходи помогать в кооператив. Ничего не говори, просто приходи».\n\nСтемнело, но в сельсовете еще горел свет. Внутри оставшиеся люди спорили, где провести границы первого колхоза. Кто-то водил пальцем по карте, кто-то записывал людей и скот каждого двора в тетрадку. Первый земельный учет Заречья писался в эту ночь страница за страницей; буквы были кривые, но у каждой строки были свидетели.\n\nСергей встал, бросил травинку на землю: «Завтра приду»."
  rus_maximalist_land_reform_events.44.a: "Федор махнул рукой и больше ничего не сказал. Он смел пепел с земли и медленно ушел в ночь."
  rus_maximalist_land_reform_events.50.t: "Конец кулаков"
  rus_maximalist_land_reform_events.50.desc: "Если для бедняков максималисты - спасители, то для кулаков они настоящий кошмар.\n\nПод давлением штыков и винтовок у кулака обычно два пути.\n\nПервый - сдать землю и войти в колхоз как «член» вместе с конфискованными орудиями и скотом. Так можно сохранить жизнь и немного достоинства. Но мало кто выбирает это. Большинство отказывается отдавать накопленное годами имущество, некоторые даже пытаются сопротивляться.\n\nВторой путь короче и прямее. Большинство кулаков, арестованных милицией, после суда расстреливают. Но это еще «приличный» конец. Местные кадры сообщают, что некоторых деревенских самодуров бедняки вытаскивали из укрытий, раздевали и водили по улицам, судили на сходе и казнили на месте, оставляя тела на несколько дней. Трупы висели на сухих деревьях у въезда в деревню, пока ветер не высушивал их.\n\nМы должны понять этот гнев. Именно эти хлебные спекулянты в самые страшные годы голода держали хлеб в амбарах до плесени, ожидая еще большей цены.\n\nИностранные наблюдатели обвиняют нас в нарушении человечности и личных прав. Муромец отвечает твердо:"
  rus_maximalist_land_reform_events.50.a: "Думали ли демоны, что этот день придет?"
  rus_maximalist_land_reform_events.51.t: "Последний день кулака"
  rus_maximalist_land_reform_events.51.desc: "Поволжье\n\nКузьму Ильича разбудил стук. Не рукой - прикладом.\n\nОн накинул пальто и подошел к двери. В щель был виден свет факелов. Во дворе стояли семь-восемь человек с факелами, палками и серпами; у некоторых на левом рукаве были недавно выданные красные повязки милиции.\n\nДверь выбили ногой. Вошел молодой парень, и Кузьма Ильич узнал его: прошлым летом тот еще брал у него мешок ржи в долг. Парень тоже узнал его, взгляд дрогнул, но он расправил плечи и подтянул повязку, будто напоминая себе и стоящему напротив, что значит эта красная лента.\n\n«Кузьма Ильич Петров, решением комитета бедноты ваша земля, скот и инвентарь конфискуются».\n\nВ толпе за его спиной кто-то шепнул: «Чего с ним говорить», но никто не бросился вперед. Все стояли с факелами у порога.\n\nКузьма Ильич стоял в дверях в ночной рубахе и босиком. Он смотрел на освещенные огнем лица. Все были из этой деревни. Он знал каждое: кого-то видел с детства, кому-то давал зерно, кого-то нанимал на работу и после платил лишним мешком картошки.\n\n«Я тридцать лет пашу эту землю». Голос был ровный, будто он говорил о чужом. «После смерти отца десять лет отдавал долги. Хотите забрать землю - забирайте. Но можно оставить одну корову? У меня пятилетний внук...»\n\n«Нет», - ответил парень, глядя не на него, а на стену. Там висела икона, под ней старый шкаф с выстиранными до белизны одеялами.\n\nКузьма Ильич ничего не сказал. Он ушел в комнату и вернулся с маленьким мешочком, положив его на стол. Мешочек был легкий. Внутри - мелкие монеты и свернутые в промасленную бумагу рубли.\n\n«Копил три года. Хватит на корову».\n\nТолпа молчала. Никто не взял мешочек. Парень первым сказал: «По декрету все имущество, большое и малое, новое и старое, поступает в общественный фонд. После регистрации им распоряжается колхоз»."
  rus_maximalist_land_reform_events.51.desc_2: "Кузьма Ильич подвинул мешочек ближе, почти к краю стола.\n\n«Забирайте деньги, хлеб, плуг, коня. Мне нужна одна корова и один лемех. Я еще могу сеять. Я тридцать лет пахал, знаю, где глубже, где под пар. Если вы заберете землю, кто ее обработает?» Голос его был тих.\n\nВ толпе кто-то шепнул: «Он прав, он правда знает землю». Но никто не поддержал и не возразил. Факел качнулся на ветру, искры упали на порог и погасли.\n\nПарень наконец сказал: «Кузьма Ильич, пройдемте с нами. Скажете все в комитете бедноты».\n\nК рассвету его увели. Жена стояла у двери с теми мелкими купюрами, которые не взяли: то ли разрешили оставить, то ли забыли. Потом он отдал их в комитет бедноты. В квитанции было написано «добровольное пожертвование». Он не умел писать и поставил отпечаток пальца. Квитанцию он долго хранил внизу шкафа вместе с иконой.\n\nНа сухом дереве у въезда в деревню несколько дней назад висел труп кулака из соседнего села. Фамилии он уже не помнил, только помнил пальто без знаков и высохший силуэт..."
  rus_maximalist_land_reform_events.51.a: "как пустая одежда."
  rus_maximalist_land_reform_events.52.t: "Новый день бедняка"
  rus_maximalist_land_reform_events.52.desc: "Поволжье\n\nПроверка комитета бедноты заняла недолго. Они перелистали книги Кузьмы Ильича: земли больше нормы, батраков нанимал, в амбаре хлеба больше чем на год. Этого хватило.\n\nЕму разрешили остаться в деревне, но он должен был сдать все имущество и вступить в колхоз. Ему дали старый склад. Переезжая, он взял только сундук: смену одежды, старую тетрадь с записями о посевах, на обложке «1913-1926», каждый год погода и урожай каждого поля, и маленький мешочек семян в тряпке. Эти семена он никому не сдал, и никто за ними не пришел.\n\nПришла весна. Колхоз начал пахоту. Кузьме Ильичу поручили таскать камни, очищая поле для трактора. Он нагибался, подбирал камни и складывал их на меже. Рядом была его старая земля, поле, которое он пахал тридцать лет, теперь включенное в колхозный массив. Семена уже были посеяны; он не знал кем и не знал, тем ли сортом, к которому привык.\n\nКто-то проходил мимо и называл его дядей Петровым, спрашивая, устал ли он. Он покачал головой: «Земля не утомляет людей, люди утомляют землю». Потом снова присел и вытащил из глубины большой камень. Он десятки раз переворачивал эту землю и знал, в какой пяди есть камни.\n\nЛетом он увидел у склада свой прежний лемех, уже ржавый, рядом с новой колхозной машиной. Он подошел и хотел поставить его ровнее, но проходивший молодой человек сказал не трогать: это пойдет в лом, стоит копейки.\n\nОн убрал руку, постоял и ушел."
  rus_maximalist_land_reform_events.52.a: "Пройдя несколько шагов, он в последний раз оглянулся на лемех."
  rus_maximalist_land_reform_events.53.t: "Вторая весна"
  rus_maximalist_land_reform_events.53.desc: "Поволжье\n\nМешочек семян пролежал на дне сундука целый год.\n\nИногда ночью Кузьма Ильич открывал сундук, доставал тряпичный узел, клал на колени, развязывал, смотрел на семена, снова завязывал и убирал. Он никому о нем не говорил. Возможно, само его существование было ответом.\n\nВесна пришла снова, чуть раньше прошлогодней.\n\nПрошлая зима была слишком холодной, у нескольких дворов замерзли новорожденные ягнята. Когда весной стаял снег, у вдовы на восточном краю деревни обрушился угол крыши. Люди не пострадали. На следующее утро Кузьма Ильич проходил мимо и увидел, что соседи уже лезут наверх с досками и инструментом. Кто-то крикнул: «Дядя Петров, помоги!» Он постоял, положил веревку, поднялся на крышу, стал снимать старые доски и подавать новые. Никто не сказал «спасибо» и не вспоминал, кем он был раньше. Вечером вдова сварила жидкую кашу, поставила миски во дворе, и люди, таскавшие бревна, сидели у стены, разговаривали и смотрели на зеленеющие поля. Кузьма Ильич тоже взял миску."
  rus_maximalist_land_reform_events.53.desc_3: "Когда началась колхозная весенняя пахота, его уже не отправляли одного собирать камни. В этом году тракторная пахота дошла и до этого участка, а его поставили рядом с сеялкой смотреть, не забивается ли зерно и правильна ли глубина. Он разгребал пальцем свежую борозду, растирал землю, вставал и показывал трактористу жест: еще на сустав глубже.\n\nТракторист был молодой, из города, умел водить машину, но землю знал плохо. Он остановился, изменил глубину и посмотрел на Кузьму Ильича. Тот молча кивнул и убрал с межи несколько камешков.\n\nПотом колхозники стали спрашивать его на перерывах: что лучше сеять на таком поле, что за листья, объеденные жуком, как выставить угол лемеха. Он говорил мало, но по делу. На вопрос о листьях он присел, раскопал землю у корня, вытащил серо-бурую личинку и положил на лист: «Вот. Глубоко перепашите, яйца вынесет наверх, морозом убьет».\n\nИногда в его пайке оказывался лишний кусочек сала или несколько картофелин. Никто не признавался, и никто не спрашивал.\n\nПотом он увидел, что колхоз использует новый сорт: созревает на десять дней раньше прежнего, колос полнее. На уборке он стоял у поля и смотрел, как комбайн идет, а амбар постепенно наполняется. Никто не спросил его мнения, и он сам ничего не сказал. В тот день, вернувшись домой, он больше не открывал сундук."
  rus_maximalist_land_reform_events.53.desc_2: "Однажды вечером молодой парень, теперь заместитель бригадира, нашел его на меже с половиной колоса в руке: «Дядя, посмотри, что-то не так? Кончик чернеет».\n\nКузьма Ильич взял колос, помял, посмотрел на черные зерна против заката, разломил одно и понюхал.\n\n«Ржавчина». Он вернул колос. «В прошлом году тоже была, немного. В этом слишком густо посеяли, воздуха мало. В следующем году междурядье на два дюйма шире - пройдет».\n\nПарень убрал колос и спросил: «Как ты знаешь, что ржавчина?»\n\nКузьма Ильич не ответил. Он взял горсть земли, растер и дал ей просыпаться сквозь пальцы. Позади прошли двое с лопатами; один спросил бригадира, какое поле завтра копать, потом мимоходом спросил Кузьму Ильича, не пойдет ли с ними. Он встал, стряхнул землю.\n\n«Я тридцать лет землю пахал. Другого не знаю, а это узнаю».\n\nСделав несколько шагов, он добавил: «Если ржавчина пойдет, больные растения выдернуть и через ряд сжечь. Не жалеть».\n\nВ ту ночь он достал мешочек семян, развязал и долго держал несколько зерен на ладони. Утром отнес его на колхозный семенной склад и положил на стол кладовщика.\n\n«Старый сорт», - сказал он. «Не полегает, но урожай ниже нового. Оставьте немного. Если когда-нибудь погода подведет и новый не выдержит, этот поможет».\n\nКладовщик, молодой человек, посмотрел на мешочек и на него: «Откуда ты знаешь, что новый не выдержит?»\n\n«Не знаю». Кузьма Ильич покачал головой. «Но с землей нельзя быть уверенным. Лучше иметь запас».\n\nКогда он вышел со склада, уже рассвело. Вдали тракторы переворачивали черную землю, ряды ее поднимались на солнце, будто сама земля переворачивалась. Он постоял у двери. Сосед с лопатой прошел мимо и кивнул ему; он кивнул в ответ. Потом повернулся к полю, которое пахал тридцать лет. Нет, оно уже не было его. Но земля была там. А этой зимой у его дровяника появилась связка колотых дров, неизвестно кем оставленная. Он подумал и занес ее в дом."
  rus_maximalist_land_reform_events.53.a: "Этого достаточно."
