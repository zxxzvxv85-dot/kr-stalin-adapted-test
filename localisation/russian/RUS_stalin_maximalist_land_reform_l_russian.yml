l_russian:
  RUS_maximalist_land_reform_category: "Земельная реформа максималистов"
  RUS_maximalist_land_reform_category_desc: "Программа максималистов прошла через съезд. Механизация, ликвидация неграмотности, реорганизация животноводства и образцовые колхозы будут постепенно продвигать реформу вперед.\n\nТекущий счет земельной реформы: §Y[?RUS_maximalist_land_reform_score|0]§!/§Y100§!\nТекущий этап: [ROOT.RUSGetMaximalistLandReformCurrentStage]/§Y5§!\nСледующий этап: [ROOT.RUSGetMaximalistLandReformNextStage]"
  RUS_maximalist_land_reform_mission: "Земельная реформа максималистов"
  RUS_maximalist_land_reform_mission_desc: "Максималисты должны доказать, что их программа способна преобразить русскую деревню. Если прогресс реформы достигнет §Y100§!, земельная реформа будет успешно завершена; иначе она закончится застоем."
  RUS_maximalist_land_reform_active_slot_tt: "Сейчас активно меньше §Y2§! решений земельной реформы."
  RUS_maximalist_land_reform_cancel_if_finished_tt: "Земельная реформа уже успешно завершена."
  RUS_maximalist_land_reform_add_score_1_tt: "Прогресс §Yземельной реформы максималистов§! увеличится на §G1§!."
  RUS_maximalist_land_reform_add_score_5_tt: "Прогресс §Yземельной реформы максималистов§! увеличится на §G5§!."
  RUS_maximalist_land_reform_add_score_3_tt: "Прогресс §Yземельной реформы максималистов§! увеличится на §G3§!."
  RUS_maximalist_land_reform_add_score_2_tt: "Прогресс §Yземельной реформы максималистов§! увеличится на §G2§!."
  RUS_maximalist_land_reform_add_score_10_tt: "Прогресс §Yземельной реформы максималистов§! увеличится на §G10§!."
  RUS_maximalist_land_reform_score_status_tt: "§YСчет земельной реформы§!: [?RUS_maximalist_land_reform_score|Y0]/§Y100§!\n§YТекущий этап§!: [ROOT.RUSGetMaximalistLandReformCurrentStage]/5\n§YСледующий этап§!: [ROOT.RUSGetMaximalistLandReformNextStage]"
  RUS_maximalist_land_reform_current_stage_0: "§Y0§!"
  RUS_maximalist_land_reform_current_stage_1: "§Y1§!"
  RUS_maximalist_land_reform_current_stage_2: "§Y2§!"
