 RUS_future_foreign_military_aid_idea_desc:0 ""
 RUS_future_foreign_balkan_military_aid:0 "Военная помощь Балканам в военное время"
 RUS_future_foreign_balkan_military_aid_desc:0 "Военная помощь социалистическому режиму на Балканах в период войны."
 RUS_future_foreign_civil_aid:0 "Оказать гражданскую помощь государству [FROM.GetNameDef]"
 RUS_future_foreign_civil_aid_desc:0 ""
 RUS_future_foreign_civil_aid_cost:0 "£pol_power §Y30§! §YОчки пятилетнего плана: 1§!"
 RUS_future_foreign_civil_aid_cost_blocked:0 "£pol_power §R30§! §RОчки пятилетнего плана: 1§!"
 RUS_future_foreign_016_effect_tt:0 "Открывает динамический модификатор §Y$RUS_soviets_and_phalanstere$§!.\nКаждая европейская социалистическая страна даёт §G+1%§! — $MODIFIER_RESEARCH_SHARING_PER_COUNTRY_BONUS$; каждая американская социалистическая страна даёт §G+1%§! — $MODIFIER_TRADE_OPINION_FACTOR$ и §G-0,5%§! — $MODIFIER_CONSUMER_GOODS_FACTOR$; каждая азиатская, африканская или океанийская социалистическая страна даёт §G+1%§! — $modifier_production_speed_infrastructure_factor$.\nПосле завершения технологии ВПО каждая социалистическая страна приносит £civ_factory_output §G25§! единиц экономического излишка.\nКаждый завершённый новый внешнеполитический фокус повышает $MODIFIER_CONSUMER_GOODS_FACTOR$ на §R1%§!."
 RUS_future_foreign_047_merge_tt:0 "Изменить §Y$RUS_soviets_and_phalanstere$§!:\n$MODIFIER_CONSUMER_GOODS_FACTOR$: §G-15,00%§!\n$MODIFIER_RESEARCH_SPEED_FACTOR$: §G+5,00%§!\n$country_resource_oil$: §R-40§!\nЭти дополнительные эффекты будут удалены после начала войны с Германией."
 RUS_future_foreign_exchange_five_year_plan_score:0 "Перераспределить ресурсы пятилетки"
 RUS_future_foreign_exchange_five_year_plan_score_desc:0 "Транспорт, оборудование и организаторов для внешнего фронта можно выделить из накопленных результатов пятилетнего плана. Каждое вложенное очко плана повышает революционную готовность на одно очко."
 RUS_future_foreign_exchange_five_year_plan_score_effect_tt:0 "Очки пятилетнего плана: §R-1§!\nРеволюционная готовность: §G+1§!"
 RUS_future_foreign_borderland_readiness_low_3:0 "Братоубийственная распря"
 RUS_future_foreign_borderland_readiness_low_2:0 "Братоубийственная распря"
 RUS_future_foreign_borderland_readiness_low_1:0 "Братоубийственная распря"
