 RUS_europe_intervention_readiness_low_3_effect_tt:0 "С началом Второй мировой войны области под контролем §YБалтийского герцогства или возникших после его распада Эстонии и Латвии, а также Литвы, Белой Руси, Украины, Грузии или Азербайджана§! получают §YБратоубийственную распрю§!. Только §YРоссия§! несёт следующие потери в боях с этими странами:\nАтака и защита: §R-40%§!\nСрок: §Y365 дней§!"
