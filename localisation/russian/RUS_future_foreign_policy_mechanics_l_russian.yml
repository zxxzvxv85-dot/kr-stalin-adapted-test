 RUS_future_foreign_borderland_readiness_high_3:0 "Недостаточная революционная подготовка"
 RUS_europe_intervention_readiness_low_3_effect_tt:0 "При переходе в этот диапазон все области, находящиеся под контролем §YБалтийского герцогства или возникших после его распада Эстонии и Латвии, а также Литвы, Белой Руси, Украины, Грузии или Азербайджана§!, получают:\nАтака и защита местных войск: §R-40%§!\nСрок: §Y365 дней§!"
