l_russian:
 RUS_third_international_gendarme:0 "Жандарм Третьего интернационала"
 RUS_third_international_gendarme_desc:0 "Русские революционные бойцы не только защищают собственную рабоче-крестьянскую власть, но и приобретают бесценный опыт в классовой борьбе по всему миру."
 RUS_third_international_gendarme_status_tt:0 "Страны, где победило наше добровольческое вмешательство: §Y[?RUS_third_international_gendarme_victories|0]§!\nПервая победа в каждой стране, куда мы действительно направляли добровольцев, увеличивает их предел и прирост армейского опыта от добровольцев."
 RUS_soviets_and_phalanstere:0 "Советы и Фаланстер"
 RUS_soviets_and_phalanstere_desc:0 "Фаланстер больше не является лишь окном, через которое эмигранты смотрят на родину. Связи между советскими научными учреждениями, революционными правительствами и социалистической промышленностью складываются во всемирную сеть знаний и производства."
 RUS_soviets_and_phalanstere_status_tt:0 "Красных стран в мире: §Y[?RUS_soviets_and_phalanstere_red_country_count|0]§!\nЗавершение технологии с любой §Yвоенно-промышленной организацией§! приносит £civ_factory_output §G[?RUS_soviets_and_phalanstere_mio_surplus|0]§! экономического излишка.\nКрасными считаются страны под властью §Yрадикальных социалистов, тоталистов, синдикалистов или коммунистов§!."
 RUS_future_foreign_004_effect_tt:0 "Открывает динамический модификатор §Y«Жандарм Третьего интернационала»§!.\nКаждый завершённый новый внешнеполитический фокус повышает §Yреволюционную готовность§! на §G1§!."
 RUS_future_foreign_016_effect_tt:0 "Открывает динамический модификатор §Y«Советы и Фаланстер»§!.\nКаждая красная страна в мире даёт §G0,5%§! к обмену технологиями; завершение технологии с любой ВПО приносит экономический излишек в зависимости от числа красных стран.\nКаждый завершённый новый внешнеполитический фокус повышает коэффициент товаров народного потребления на §R1%§!."
 RUS_future_foreign_exchange_five_year_plan_score:0 "Перераспределить ресурсы пятилетки"
 RUS_future_foreign_exchange_five_year_plan_score_desc:0 "Транспорт, оборудование и организаторов для внешнего фронта можно выделить из накопленных результатов пятилетнего плана. Каждое вложенное очко плана повышает революционную готовность на одно очко."
 RUS_future_foreign_exchange_five_year_plan_score_effect_tt:0 "Очки пятилетнего плана: §R-1§!\nРеволюционная готовность: §G+1§!"
