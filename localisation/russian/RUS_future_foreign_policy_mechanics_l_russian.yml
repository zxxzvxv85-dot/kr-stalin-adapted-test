l_russian:
 RUS_third_international_gendarme:0 "Жандарм Третьего интернационала"
 RUS_third_international_gendarme_desc:0 "Русская революционная армия учится в социалистической борьбе за рубежом."
 RUS_third_international_gendarme_status_tt:0 "Социалистические страны, где победило наше добровольческое вмешательство: §Y[?RUS_third_international_gendarme_victories|0]§!\nУчитываются лишь §Yсоциалистические страны§!, получившие наших добровольцев."
 RUS_soviets_and_phalanstere:0 "Советы и Фаланстер"
 RUS_soviets_and_phalanstere_desc:0 "Советы координируют исследования, торговлю и строительство с социалистическими странами с учётом условий каждого континента."
 RUS_soviets_and_phalanstere_status_tt:0 "Европейских социалистических стран: §Y[?RUS_soviets_and_phalanstere_europe_country_count|0]§!\nАмериканских социалистических стран: §Y[?RUS_soviets_and_phalanstere_america_country_count|0]§!\nАзиатских, африканских и океанийских социалистических стран: §Y[?RUS_soviets_and_phalanstere_afro_asia_oceania_country_count|0]§!\nПосле завершения технологии ВПО каждая социалистическая страна приносит £civ_factory_output §G25§! единиц экономического излишка; всего: £civ_factory_output §G[?RUS_soviets_and_phalanstere_mio_surplus|0]§!."
 RUS_franco_russian_industrial_cooperation:0 "Франко-российское промышленное сотрудничество"
 RUS_franco_russian_industrial_cooperation_desc:0 "Французское тяжёлое оборудование и инженеры помогают России осваивать минеральные ресурсы и развивать связанную с ними инфраструктуру и торговые сети."
 RUS_future_foreign_joint_develop_pokrovsk_tungsten:0 "Совместная разработка вольфрамовых рудников Покровска"
 RUS_future_foreign_joint_develop_pokrovsk_tungsten_desc:0 "В соответствии с Парижско-Московским договором Россия и Французская коммуна совместно вложат средства в разработку вольфрамовых рудников Покровска. Часть новых мощностей останется в распоряжении России, а остальная продукция составит долгосрочную французскую долю добычи."
 RUS_future_foreign_017_pokrovsk_unlock_tt:0 "Открывает дипломатическое решение: §Y$RUS_future_foreign_joint_develop_pokrovsk_tungsten$§!"
 RUS_pokrovsk_tungsten_concession:0 "Покровская вольфрамовая концессия"
 RUS_pokrovsk_tungsten_concession_desc:0 "По соглашению о совместной разработке с Россией Французская коммуна получает долгосрочную долю в добыче вольфрама в Покровске."
 RUS_future_foreign_004_effect_tt:0 "Открывает динамический модификатор §Y«Жандарм Третьего интернационала»§!.\nКаждый завершённый новый внешнеполитический фокус повышает §Yреволюционную готовность§! на §G1§!."
 RUS_future_foreign_002_effect_tt:0 "Открывает решения §Y«Военная помощь»§! для всех социалистических стран мира; каждая страна может получить такую помощь только один раз."
 RUS_future_foreign_003_effect_tt:0 "Открывает решения §Y«Гражданская помощь»§! для всех социалистических стран мира; каждая страна может получить такую помощь только один раз."
 RUS_future_foreign_military_aid:0 "Оказать военную помощь государству [FROM.GetNameDef]"
 RUS_future_foreign_military_aid_desc:0 ""
 RUS_future_foreign_military_aid_cost:0 "£pol_power §Y30§! £GFX_RUS_fr_military_reform_materials §Y20§!"
 RUS_future_foreign_military_aid_cost_blocked:0 "£pol_power §R30§! £GFX_RUS_fr_military_reform_materials §R20§!"
 RUS_future_foreign_military_aid_idea:0 "Российская военная помощь"
 RUS_future_foreign_military_aid_idea_desc:0 ""
 RUS_future_foreign_civil_aid:0 "Оказать гражданскую помощь государству [FROM.GetNameDef]"
 RUS_future_foreign_civil_aid_desc:0 ""
 RUS_future_foreign_civil_aid_cost:0 "£pol_power §Y30§! §YОчки пятилетнего плана: 1§!"
 RUS_future_foreign_civil_aid_cost_blocked:0 "£pol_power §R30§! §RОчки пятилетнего плана: 1§!"
 RUS_future_foreign_016_effect_tt:0 "Открывает динамический модификатор §Y«Советы и Фаланстер»§!.\nКаждая европейская социалистическая страна даёт §G+1%§! к обмену технологиями; каждая американская социалистическая страна даёт §G+1%§! к влиянию на торговлю и §G-0,5%§! к коэффициенту товаров народного потребления; каждая азиатская, африканская или океанийская социалистическая страна даёт §G+1%§! к скорости строительства инфраструктуры.\nПосле завершения технологии ВПО каждая социалистическая страна приносит £civ_factory_output §G25§! единиц экономического излишка.\nКаждый завершённый новый внешнеполитический фокус повышает коэффициент товаров народного потребления на §R1%§!."
 RUS_future_foreign_exchange_five_year_plan_score:0 "Перераспределить ресурсы пятилетки"
 RUS_future_foreign_exchange_five_year_plan_score_desc:0 "Транспорт, оборудование и организаторов для внешнего фронта можно выделить из накопленных результатов пятилетнего плана. Каждое вложенное очко плана повышает революционную готовность на одно очко."
 RUS_future_foreign_exchange_five_year_plan_score_effect_tt:0 "Очки пятилетнего плана: §R-1§!\nРеволюционная готовность: §G+1§!"
