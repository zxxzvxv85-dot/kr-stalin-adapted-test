 RUS_future_foreign_borderland_readiness_high_1:0 "Братоубийственная распря"
 RUS_future_foreign_borderland_readiness_high_2:0 "Братоубийственная распря"
 RUS_future_foreign_borderland_readiness_high_3:0 "Братоубийственная распря"
 RUS_europe_intervention_readiness_low_3_effect_tt:0 "С началом Второй мировой войны области под контролем §YБалтийского герцогства или возникших после его распада Эстонии и Латвии, а также Литвы, Белой Руси, Украины, Грузии или Азербайджана§! получают §YБратоубийственную распрю§!. Только §YРоссия§! несёт следующие потери в боях с этими странами:\nАтака и защита: §R-40%§!\nСрок: §Y365 дней§!"
 RUS_europe_intervention_readiness_low_2_effect_tt:0 "С началом Второй мировой войны области под контролем §YБалтийского герцогства или возникших после его распада Эстонии и Латвии, а также Литвы, Белой Руси, Украины, Грузии или Азербайджана§! получают §YБратоубийственную распрю§!. Только §YРоссия§! несёт следующие потери в боях с этими странами:\nАтака и защита: §R-35%§!\nСрок: §Y300 дней§!"
 RUS_europe_intervention_readiness_low_1_effect_tt:0 "С началом Второй мировой войны области под контролем §YБалтийского герцогства или возникших после его распада Эстонии и Латвии, а также Литвы, Белой Руси, Украины, Грузии или Азербайджана§! получают §YБратоубийственную распрю§!. Только §YРоссия§! несёт следующие потери в боях с этими странами:\nАтака и защита: §R-30%§!\nСрок: §Y240 дней§!"
 RUS_europe_intervention_readiness_balanced_effect_tt:0 "С началом Второй мировой войны области под контролем §YБалтийского герцогства или возникших после его распада Эстонии и Латвии, а также Литвы, Белой Руси, Украины, Грузии или Азербайджана§! получают §YБратоубийственную распрю§!. Только §YРоссия§! несёт следующие потери в боях с этими странами:\nАтака и защита: §R-25%§!\nСрок: §Y180 дней§!"
 RUS_europe_intervention_readiness_high_1_effect_tt:0 "С началом Второй мировой войны области под контролем §YБалтийского герцогства или возникших после его распада Эстонии и Латвии, а также Литвы, Белой Руси, Украины, Грузии или Азербайджана§! получают §YБратоубийственную распрю§!. Только §YРоссия§! несёт следующие потери в боях с этими странами:\nАтака и защита: §R-20%§!\nСрок: §Y120 дней§!"
 RUS_europe_intervention_readiness_high_2_effect_tt:0 "С началом Второй мировой войны области под контролем §YБалтийского герцогства или возникших после его распада Эстонии и Латвии, а также Литвы, Белой Руси, Украины, Грузии или Азербайджана§! получают §YБратоубийственную распрю§!. Только §YРоссия§! несёт следующие потери в боях с этими странами:\nАтака и защита: §R-17,5%§!\nСрок: §Y60 дней§!"
 RUS_europe_intervention_readiness_high_3_effect_tt:0 "С началом Второй мировой войны области под контролем §YБалтийского герцогства или возникших после его распада Эстонии и Латвии, а также Литвы, Белой Руси, Украины, Грузии или Азербайджана§! получают §YБратоубийственную распрю§!. Только §YРоссия§! несёт следующие потери в боях с этими странами:\nАтака и защита: §R-15%§!\nСрок: §Y30 дней§!"
 RUS_future_foreign_057_effect_tt:0 "После завершения эффекты определяются отдельно по текущим отношениям с каждой северной страной:\n\n[GetRUSNordicIcelandStatus][GetRUSNordicNorwayStatus][GetRUSNordicSwedenStatus][GetRUSNordicFinlandStatus][GetRUSNordicDenmarkStatus]"
 RUS_future_foreign_nordic_status_empty:0 ""
 RUS_future_foreign_nordic_ice_status:0 "[ICE.GetName] (отношения: [?ICE.opinion@RUS|+0]): [GetRUSNordicIcelandEffect]\n"
 RUS_future_foreign_nordic_nor_status:0 "[NOR.GetName] (отношения: [?NOR.opinion@RUS|+0]): [GetRUSNordicNorwayEffect]\n"
 RUS_future_foreign_nordic_swe_status:0 "[SWE.GetName] (отношения: [?SWE.opinion@RUS|+0]): [GetRUSNordicSwedenEffect]\n"
 RUS_future_foreign_nordic_fin_status:0 "[FIN.GetName] (отношения: [?FIN.opinion@RUS|+0]): [GetRUSNordicFinlandEffect]\n"
 RUS_future_foreign_nordic_den_status:0 "[DEN.GetName] (отношения: [?DEN.opinion@RUS|+0]): [GetRUSNordicDenmarkEffect]\n"
 RUS_future_foreign_nordic_effect_faction:0 "\nЦель уже состоит в другой фракции (имеет приоритет):\n£stability_texticon Базовая стабильность: §R-12.00%§!\n£boost_popularity_texticon Поддержка радикальных социалистов: §G+15.00%§!\n£civilian_intel_texticon Гражданская разведка: §G+75.00%§!\n"
 RUS_future_foreign_nordic_effect_negative:0 "\nОтношения ниже §Y0§!:\n£stability_texticon Базовая стабильность: §R-2.00%§!\n£boost_popularity_texticon Поддержка радикальных социалистов: §G+2.00%§!\n"
 RUS_future_foreign_nordic_effect_low:0 "\nОтношения от §Y0 до 40§!:\n£stability_texticon Базовая стабильность: §R-5.00%§!\n£boost_popularity_texticon Поддержка радикальных социалистов: §G+5.00%§!\n"
 RUS_future_foreign_nordic_effect_mid:0 "\nОтношения от §Y41 до 80§!:\n£civilian_intel_texticon Гражданская разведка: §G+50.00%§!\n£stability_texticon Базовая стабильность: §R-8.00%§!\n£boost_popularity_texticon Поддержка радикальных социалистов: §G+10.00%§!\n"
 RUS_future_foreign_nordic_effect_pact:0 "\nОтношения от §Y81 до 100§!:\nПакт о ненападении: заключён\n£pol_power Политическая власть России: §G+50§!\n£pol_power Политическая власть цели: §G+50§!\n"
 RUS_future_foreign_nordic_effect_invite:0 "\nОтношения выше §Y100§! и социалистическое правительство цели: открывается решение пригласить цель в российскую фракцию.\n"
 RUS_future_foreign_nordic_effect_none:0 "\nОтношения выше §Y100§! и несоциалистическое правительство цели: дополнительных эффектов нет.\n"
 RUS_future_foreign_nordic_relation_low_negative:0 "Напряжённые отношения с Севером"
 RUS_future_foreign_nordic_relation_low_negative_desc:0 "Ухудшение отношений с Россией подрывает внутреннюю стабильность."
 RUS_future_foreign_nordic_relation_low:0 "Прохладные отношения с Севером"
 RUS_future_foreign_nordic_relation_low_desc:0 "Прохладные отношения с Россией усиливают политическое давление."
 RUS_future_foreign_nordic_relation_mid:0 "Отдалённые отношения с Севером"
 RUS_future_foreign_nordic_relation_mid_desc:0 "Ограниченное сотрудничество с Россией сопровождается внутренним беспокойством."
 RUS_future_foreign_nordic_relation_faction:0 "Противостояние северных блоков"
 RUS_future_foreign_nordic_relation_faction_desc:0 "Членство во враждебной фракции подвергает страну политическому и разведывательному давлению России."
 RUS_future_foreign_nordic_invite:0 "Пригласить государство [FROM.GetNameDef] в российскую фракцию"
 RUS_future_foreign_nordic_invite_desc:0 "Дзержинский напрямую приведёт это социалистическое государство во фракцию, созданную Россией. После завершения решения цель немедленно вступает во фракцию без ожидания ответа."
 RUS_future_foreign_nordic_invite_available_tt:0 "Россия должна быть лидером фракции; цель должна быть социалистическим государством без фракции, иметь отношения выше §Y100§!, а у России должно быть не менее §Y20§! политической власти."
 RUS_future_foreign_agriculture_enabled_tt:0 "§YСельскохозяйственная мини-игра Устинова§! включена."
 RUS_future_foreign_policy_events.5.t:0 "Последняя борьба"
 RUS_future_foreign_policy_events.5.d:0 "Революционная готовность недостаточна"
 RUS_future_foreign_policy_events.5.a:0 "Понято."
 RUS_future_foreign_policy_events.5.a_tt:0 "§RВаршавское восстание провалилось! Немцы раскрыли наши намерения и скоро придут!§!"
 RUS_future_foreign_policy_events.6.t:0 "Облако в штанах"
 RUS_future_foreign_policy_events.6.d:0 "Я пришёл с улицы, закопчённый светом фонарей и отполированный дождём. Я стою перед вами, как обнажённая истина.\n\nНастал последний конец: вам некуда бежать. Моё стихотворение — молот, разбивающий все ваши окна, и град, уничтожающий все ваши сады.\n\nЯ умру, как разорванный флаг, но перед смертью переверну весь этот мир вверх дном!"
 RUS_future_foreign_policy_events.6.a:0 "Позволить Польше вступить в нашу фракцию."
