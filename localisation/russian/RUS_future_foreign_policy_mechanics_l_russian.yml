l_russian:
 RUS_third_international_gendarme:0 "Жандарм Третьего интернационала"
 RUS_third_international_gendarme_desc:0 "Русская революционная армия учится в социалистической борьбе за рубежом."
 RUS_third_international_gendarme_status_tt:0 "Социалистические страны, где победило наше добровольческое вмешательство: §Y[?RUS_third_international_gendarme_victories|0]§!\nУчитываются лишь §Yсоциалистические страны§!, получившие наших добровольцев.\nУчтённые социалистические страны Балкан: §Y[?RUS_third_international_gendarme_balkan_count|0]§! (учитываются после завершения §Y«Под звездным небом»§!)"
 RUS_soviets_and_phalanstere:0 "Советы и Фаланстер"
 RUS_soviets_and_phalanstere_desc:0 "Советы координируют исследования, торговлю и строительство с социалистическими странами с учётом условий каждого континента."
 RUS_soviets_and_phalanstere_status_tt:0 "Европейских социалистических стран: §Y[?RUS_soviets_and_phalanstere_europe_country_count|0]§!\nАмериканских социалистических стран: §Y[?RUS_soviets_and_phalanstere_america_country_count|0]§!\nАзиатских, африканских и океанийских социалистических стран: §Y[?RUS_soviets_and_phalanstere_afro_asia_oceania_country_count|0]§!\nПосле завершения технологии ВПО каждая социалистическая страна приносит £civ_factory_output §G25§! единиц экономического излишка; всего: £civ_factory_output §G[?RUS_soviets_and_phalanstere_mio_surplus|0]§!."
 RUS_franco_russian_industrial_cooperation:0 "Франко-российское промышленное сотрудничество"
 RUS_franco_russian_industrial_cooperation_desc:0 "Французское тяжёлое оборудование и инженеры помогают России осваивать минеральные ресурсы и развивать связанную с ними инфраструктуру и торговые сети."
 RUS_future_foreign_joint_develop_pokrovsk_tungsten:0 "Совместная разработка вольфрамовых рудников Покровска"
 RUS_future_foreign_joint_develop_pokrovsk_tungsten_desc:0 "В соответствии с Парижско-Московским договором Россия и Французская коммуна совместно вложат средства в разработку вольфрамовых рудников Покровска. Часть новых мощностей останется в распоряжении России, а остальная продукция составит долгосрочную французскую долю добычи."
 RUS_future_foreign_017_pokrovsk_unlock_tt:0 "Открывает дипломатическое решение: §Y$RUS_future_foreign_joint_develop_pokrovsk_tungsten$§!"
 RUS_pokrovsk_tungsten_concession:0 "Покровская вольфрамовая концессия"
 RUS_pokrovsk_tungsten_concession_desc:0 "По соглашению о совместной разработке с Россией Французская коммуна получает долгосрочную долю в добыче вольфрама в Покровске."
 RUS_future_foreign_joint_develop_zlatoust_chromium:0 "Разработать хромовые рудники Златоуста"
 RUS_future_foreign_joint_develop_zlatoust_chromium_desc:0 "В соответствии с Парижско-Московским договором Россия и Французская коммуна совместно вложат средства в разработку хромовых рудников Златоуста. Часть новых мощностей останется в распоряжении России, а остальная продукция составит долгосрочную французскую долю добычи."
 RUS_future_foreign_017_zlatoust_unlock_tt:0 "Открывает дипломатическое решение: §Y$RUS_future_foreign_joint_develop_zlatoust_chromium$§!"
 RUS_zlatoust_chromium_concession:0 "Златоустовская хромовая концессия"
 RUS_zlatoust_chromium_concession_desc:0 "По соглашению о совместной разработке с Россией Французская коммуна получает долгосрочную долю в добыче хрома в Златоусте."
 RUS_future_foreign_004_effect_tt:0 "Открывает динамический модификатор §Y«Жандарм Третьего интернационала»§!.\nКаждый завершённый новый внешнеполитический фокус повышает §Yреволюционную готовность§! на §G1§!."
 RUS_future_foreign_002_effect_tt:0 "Открывает решения §Y«Военная помощь»§! для всех социалистических стран мира; каждая страна может получить такую помощь только один раз."
 RUS_future_foreign_003_effect_tt:0 "Открывает решения §Y«Гражданская помощь»§! для всех социалистических стран мира; каждая страна может получить такую помощь только один раз."
 RUS_future_foreign_019_effect_tt:0 "Для социалистических режимов Балкан:\nСтоимость военной и гражданской помощи: §G-50.00%§! (политическая власть, военные материалы и очки пятилетки)\n§YВоенная помощь в мирное время§!:\n£mil_factory Военные заводы вне карты: §G+2§!\n£manpower_texticon Людские ресурсы: §G+10000§!\n§YВоенная помощь в военное время§!: §Y$RUS_future_foreign_balkan_military_aid$§! на §Y180§! дней, даёт:\n$MODIFIER_ARMY_ORG_FACTOR$: §G+10.00%§!\n$MODIFIERS_ARMY_ATTACK_AGAINST_MAJOR_FACTOR$: §G+10.00%§!\n$MODIFIERS_ARMY_DEFENCE_AGAINST_MAJOR_FACTOR$: §G+10.00%§!\nОткрывает дипломатическое решение: §Y$RUS_future_foreign_balkan_invite$§!."
 RUS_future_foreign_019_agri_orders_tt:0 "После включения §Yсельскохозяйственной мини-игры Устинова§! социалистические режимы Балкан ежеквартально добавляют объединённый заказ на урожай."
 RUS_future_foreign_balkan_invite:0 "Пригласить в текущую российскую фракцию"
 RUS_future_foreign_balkan_invite_desc:0 "Напрямую пригласить балканский социалистический режим, не входящий ни в одну фракцию, во фракцию, которую возглавляем мы, не дожидаясь ответа."
 RUS_future_foreign_balkan_invite_available_tt:0 "Мы должны возглавлять фракцию; цель — балканская социалистическая страна, не входящая ни в одну фракцию; требуется не менее §Y20§! политической власти."
 RUS_future_foreign_035_effect_tt:0 "За каждую существующую социалистическую страну на Балканах к §Y$RUS_third_international_gendarme$§! добавляется:\n$MODIFIER_ARMY_EXPERIENCE_FROM_VOLUNTEERS$: §G+5.00%§!\n$MODIFIERS_ARMY_NON_CORE_ATTACK_FACTOR$: §G+0.20%§!\nС этой страной заключается §Yпакт о ненападении§!, и за каждую страну даётся §Y50§! политической власти.\n\nТекущие социалистические страны Балкан (§Y[?RUS_third_international_gendarme_balkan_socialist_count|0]§!):\n[GetRUSBalkanGendarmeSerbia][GetRUSBalkanGendarmeRomania][GetRUSBalkanGendarmeGreece][GetRUSBalkanGendarmeAlbania][GetRUSBalkanGendarmeBulgaria]"
 RUS_future_foreign_balkan_serbia_active:0 "§Y[SER.GetName]§!\n"
 RUS_future_foreign_balkan_romania_active:0 "§Y[ROM.GetName]§!\n"
 RUS_future_foreign_balkan_greece_active:0 "§Y[GRE.GetName]§!\n"
