 RUS_europe_intervention_readiness_high_1_effect_tt:0 "При переходе в этот диапазон все области, находящиеся под контролем §YБалтийского герцогства или возникших после его распада Эстонии и Латвии, а также Литвы, Белой Руси, Украины, Грузии или Азербайджана§!, получают:\nАтака и защита местных войск: §R-20%§!\nСрок: §Y120 дней§!"
