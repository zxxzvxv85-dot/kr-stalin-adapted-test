 RUS_agricultural_management.3.t:0 "Аграрные перспективы нового государства"
 RUS_agricultural_management.3.d:0 "По мере углубления земельной реформы и развёртывания широкомасштабных опытов по созданию сельскохозяйственных фабрик Высший экономический совет провёл комплексную оценку восстановления сельскохозяйственного производства в регионах. Её результаты показывают, что на обозримую перспективу продовольственная безопасность страны в основном обеспечена.\n\nВосстановление сельского хозяйства идёт быстрее ожиданий, а урожайность в опытных районах заметно превышает показатели традиционного земледелия. Эта тенденция укрепляет уверенность в перспективах аграрных преобразований.\n\nПоследний доклад Центрального статистического управления о производстве и потреблении продовольствия также подкрепляет эти выводы убедительными данными.\n\nНа протяжении последних нескольких лет самообеспеченность основными продовольственными культурами устойчиво превышает безопасный порог, а стратегические запасы зерна восстановлены до семидесяти процентов от уровня, предшествовавшего гражданской войне. Во внутреннем заключении Высшего экономического совета отмечается, что при сохранении нынешних темпов восстановления к концу пятилетки страна сможет полностью избавиться от зависимости от ввоза продовольствия.\nЭтот вывод получил широкую поддержку представителей различных фракций внутри Совета.\n\nОднако первые успехи в производстве ещё не означают зрелости самого устройства хозяйства. При распространении сельскохозяйственных фабрик обнаружились разнобой управленческих норм, отставание внедрения новых технологий и недостаток координации в распределении рабочей силы. В некоторых опытных районах производственные задания выполняются, но организационная структура остаётся рыхлой, а права и обязанности работников и руководителей разграничены нечётко. В других местах из-за отсутствия единых технических правил урожайность соседних фабрик различается более чем на тридцать процентов. Ещё существеннее то, что существующая система управления пока не решила коренной вопрос: как включить разрозненную сельскую рабочую силу в устойчивую систему промышленной организации труда.\n\nВ ответ на эти трудности заместитель народного министра земледелия Андрей Колегаев представил съезду новый проект реформы. Для обеспечения эффективности и устойчивости сельскохозяйственного производства он предлагает ввести на сельскохозяйственных фабриках соответствующие формы демократического управления и экономической обратной связи. Это позволит разграничить ответственность, упорядочить процедуры и накопить организационный опыт для дальнейшего расширения системы.\n\nПроект получил широкое одобрение съезда: все стороны признали его в принципе вполне осуществимым. Конкретные положения предстоит уточнить в ходе дальнейших обследований на местах, которые проведёт совместная рабочая группа Высшего экономического совета и Министерства земледелия."
 RUS_agricultural_management.3.a:0 "Ещё один шаг в новый мир."
 RUS_agricultural_management.3.b:0 "Посмотрим на проект этого «крестьянского ленинца»."
 RUS_agricultural_management.4.t:0 "О проекте Колегаева"
 RUS_agricultural_management.4.d:0 "Главная мысль проекта Колегаева состоит в полном переходе сельскохозяйственных фабрик от опытных начинаний к устойчивой системе хозяйствования. Предлагается следующее устройство:\n\nI. Организационная структура\n\nСельскохозяйственная фабрика объединяет несколько деревень в пределах административного района и подчиняется непосредственно местному сельскохозяйственному совету. Внутри фабрики вводятся три уровня управления: фабричное управление составляет годовые производственные планы и технические программы; цехи, соответствующие отдельным деревням, выполняют конкретные полевые задания; производственные бригады служат низовыми трудовыми единицами, формируемыми по площади земли и видам культур и работающими по установленным нормам.\n\nТрёхуровневая структура призвана обеспечить достаточный охват управления, не допуская искажения распоряжений из-за чрезмерного числа инстанций.\n\nII. Самостоятельность районов и центральное руководство\n\nВ основу местной самостоятельности положен принцип единого планирования и поуровневого исполнения. Управление фабрики составляет годовой план на основе ориентиров, установленных центром, однако цехи располагают значительной свободой в выборе сортов, сроков полевых работ, соотношения севооборота и паровых земель. Не выходя за рамки вышестоящего плана, фабрики могут гибко менять структуру посевов с учётом местных почв и климата. Это должно предотвратить отрыв центральных указаний от действительности и сократить потери урожая вследствие единого шаблона.\n\nОдновременно проект прямо устанавливает обязательный механизм координации. В ключевых вопросах, включая задания по заготовке зерна, минимальную посевную площадь и основные технические нормы, такие как доля улучшенных семян и правила внесения удобрений, фабрики обязаны безусловно выполнять единые распоряжения центра. Ссылки на местные особенности не дают права на освобождение от этих требований. Местные сельскохозяйственные советы отвечают за надзор и ежеквартально представляют Народному министерству земледелия отчёты о ходе производства. В отношении хозяйств, не выполнивших задания два квартала подряд, вышестоящие органы вправе начать особую надзорную процедуру, направить технические группы для исправления недостатков и при необходимости сменить руководство фабрики.\n\nИными словами, местам предоставляется достаточная гибкость для учёта природных различий, а центр сохраняет необходимые полномочия, чтобы не допустить подрыва стратегического минимума продовольственной безопасности. Проект стремится провести между этими противоречивыми требованиями практически осуществимую границу.\n\nIII. Трудовые отношения и распределение\n\nНа сельскохозяйственных фабриках вводится единая организация труда. Крестьяне вступают в них как сельскохозяйственные рабочие и перестают быть отдельными хозяйствами, непосредственно связанными со своим участком земли. Ежедневный выход на работу, согласованное разделение обязанностей и сменное распределение рабочей силы постепенно заменяют традиционный временный наём в разгар полевых работ. На фабриках создаются группы технического руководства и должности политических комиссаров: первые распространяют улучшенные семена и нормы земледелия, вторые отвечают за трудовую дисциплину и политическое воспитание.\n\nРаспределение осуществляется по труду, посредством системы трудовых баллов. Основные баллы определяются продолжительностью и тяжестью работы; дополнительно вводятся поощрительные и штрафные баллы, стимулирующие перевыполнение заданий и освоение новых технологий. При годовом расчёте стоимость трудовых баллов увязывается с фактической продукцией фабрики: больший урожай даёт больший доход, а при неурожае выплаты соответственно уменьшаются.\n\nВ случае масштабного стихийного бедствия Совет всё равно гарантирует членам фабрики основные средства к существованию.\n\nIV. Порядок распространения\n\nПредлагаются три этапа:\n\n- Первый: обобщить опыт действующих хозяйств и разработать единые положения об управлении и технические нормы.\n- Второй: полностью развернуть систему в основных зернопроизводящих районах, охватив 60% пахотных земель страны.\n- Третий: постепенно распространить опыт сельскохозяйственных фабрик на животноводство и садоводство, завершив фабричное переустройство всего сельского хозяйства.\n\nV. Общее назначение проекта\n\nВ пояснениях Колегаев подчёркивает, что сельскохозяйственная фабрика не является простым повторением коллективизации. Это организационная форма переустройства сельского хозяйства по промышленным принципам, цель которой состоит не только в повышении урожайности, но и в создании в деревне трудовых отношений и управленческих структур, соответствующих социализму.\n\nВ конце пояснений к проекту Колегаев приводит, переосмысливая её, известную ленинскую формулу:"
 RUS_agricultural_management.4.a:0 "«Социалистическое сельское хозяйство = фабричное производство + демократические принципы»"
