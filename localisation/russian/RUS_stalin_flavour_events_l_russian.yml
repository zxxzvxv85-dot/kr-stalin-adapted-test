 RUS_stalin_flavour_events.1.t: "«Большевик с гор»"
 RUS_stalin_flavour_events.1.d: "Грузинский писатель Лаврентий Берия, широко известный под прозвищем «Ультрачеловек Берия» (Ultraman Beria), недавно выпустил новый роман в жанре альтернативной истории — §I«Большевик с гор»§!. Действие романа разворачивается после победы Красной армии в Гражданской войне, на заре Союза Советских Социалистических Республик.\n\nГлавный герой, Сосело, родился в бедной грузинской крестьянской семье. Познакомившись с марксизмом во время учёбы в семинарии, в юности он закономерно примыкает к большевикам и становится верным последователем Ленина. В ходе борьбы Сосело постепенно входит в высшее руководство партии, а в критический момент Гражданской войны принимает военное командование и под Казанью отражает наступление белых. После смерти Ленина от ран он занимает пост генерального секретаря и успешно проводит советскую власть через внутренние и внешние испытания. Под мудрым руководством товарища Сосело Советский Союз совершает небывалые в истории человечества подвиги: за несколько десятилетий, как утверждает автор, полностью исчезают голод и неграмотность, промышленность становится первой в мире, а красное знамя впервые водружается на Марсе.\n\nЕдва появившись, эта грандиозная утопия вызвала бурные споры. Радикальные синдикалисты и коммунисты приветствовали её как «чертёж идеального общества», тогда как консервативные синдикалисты и либералы обвинили автора в пренебрежении логикой действительности и недостатке глубины.\n\nПримечательно, что занимавший тогда пост заместителя председателя Всероссийского союза труда Григорий Зиновьев также оценил книгу невысоко, заявив, что она «недостаточно передаёт революционный пыл»."
 RUS_stalin_flavour_events.1.a: "Неужели альтернативная история нынче так хорошо продаётся?"
