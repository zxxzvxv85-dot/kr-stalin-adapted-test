 RUS_stalin_flavour_events.1.t: "«Большевик с гор»"
 RUS_stalin_flavour_events.1.d: "Грузинский писатель Лаврентий Берия, широко известный под прозвищем «Ультрачеловек Берия» (Ultraman Beria), недавно выпустил новый роман в жанре альтернативной истории — §I«Большевик с гор»§!. Действие романа разворачивается после победы Красной армии в Гражданской войне, на заре Союза Советских Социалистических Республик.\n\nГлавный герой, Сосело, родился в бедной грузинской крестьянской семье. Познакомившись с марксизмом во время учёбы в семинарии, в юности он закономерно примыкает к большевикам и становится верным последователем Ленина. В ходе борьбы Сосело постепенно входит в высшее руководство партии, а в критический момент Гражданской войны принимает военное командование и под Казанью отражает наступление белых. После смерти Ленина от ран он занимает пост генерального секретаря и успешно проводит советскую власть через внутренние и внешние испытания. Под мудрым руководством товарища Сосело Советский Союз совершает небывалые в истории человечества подвиги: за несколько десятилетий, как утверждает автор, полностью исчезают голод и неграмотность, промышленность становится первой в мире, а красное знамя впервые водружается на Марсе.\n\nЕдва появившись, эта грандиозная утопия вызвала бурные споры. Радикальные синдикалисты и коммунисты приветствовали её как «чертёж идеального общества», тогда как консервативные синдикалисты и либералы обвинили автора в пренебрежении логикой действительности и недостатке глубины.\n\nПримечательно, что занимавший тогда пост заместителя председателя Всероссийского союза труда Григорий Зиновьев также оценил книгу невысоко, заявив, что она «недостаточно передаёт революционный пыл»."
 RUS_stalin_flavour_events.1.a: "Неужели альтернативная история нынче так хорошо продаётся?"
 RUS_stalin_flavour_events.2.t: "Профессор Никола Тесла уходит на покой"
 RUS_stalin_flavour_events.2.d: "МОСКВА, 26 декабря 1940 года.\n\nКомиссия по электрификации объявила сегодня, что знаменитый электротехник и основоположник системы переменного тока профессор Никола Тесла по причине преклонного возраста и состояния здоровья официально подал прошение об отставке. Совет народных комиссаров удовлетворил его просьбу. Отныне профессор Тесла оставляет должность главного инженера по стандартизации электроэнергетики. Занимаемый им одновременно пост председателя Комиссии по электрификации переходит к товарищу Глебу Максимилиановичу Кржижановскому. За профессором сохраняется почётное звание консультанта электроэнергетической промышленности.\n\nПрофессор Тесла прибыл в Россию по приглашению в начале 1920-х годов и прослужил здесь почти два десятилетия. За это время он руководил введением единого всероссийского стандарта трёхфазного переменного тока частотой 50 герц, положил конец смешению оставшегося немецкого и американского оборудования и обеспечил возможность объединения региональных электросетей. Тем самым была создана прочная энергетическая основа индустриализации. Предложенные им технологии передачи энергии на большие расстояния и замыслы беспроводной передачи также задали направление последующим исследовательским программам.\n\nВ постановлении Совета народных комиссаров отмечается, что профессор Тесла «посвятил все силы делу электрификации человечества и щедро делился знаниями в то время, когда русский народ особенно нуждался в технической помощи; его вклад навсегда вошёл в летопись социалистического строительства».\n\nПосле отставки профессор Тесла поселится в санатории под Москвой и продолжит теоретические исследования и литературную работу. Всероссийский электротехнический институт предоставит ему небольшую лабораторию для личных изысканий. Новый председатель комиссии товарищ Кржижановский заявил, что продолжит незавершённые Теслой работы по дальней передаче энергии и электрификации страны."
 RUS_stalin_flavour_events.2.a: "Желаем Вам счастливой жизни на покое!"
 RUS_stalin_flavour_events.3.t: "«Тесла Электрик» приступает к работе"
 RUS_stalin_flavour_events.3.d: "После утверждения нового раунда целевых инвестиций Государственная электротехническая компания Теслы, основанная и возглавляемая профессором Теслой, обрела вторую жизнь.\n\nГосударственные ассигнования быстро превратились в реальные материалы и оборудование, которые партиями доставляются на предприятие. В первую поставку вошли десятки мощных высоковольтных трансформаторов и специально изготовленных катушек Теслы. Вслед за ними в сборочные цеха поступили крупные ламповые генераторы, приборы на электронно-лучевых трубках для измерения электромагнитных полей и несколько полуавтоматических станков точной намотки. На складах накоплены достаточные запасы слюдяных пластин, пропитанной бумажной изоляционной ленты и специальных медных кабелей. Несколько передвижных высоковольтных испытательных установок уже прибыли на полигон.\n\nПеречень оборудования был лично составлен профессором Теслой, а Москва выделила всё необходимое непосредственно для следующего этапа опытов. Монтаж и наладка идут по плану; первый цикл испытаний должен начаться через месяц. Сам профессор Тесла по-прежнему руководит повседневной работой лаборатории, а о результатах будет доложено отдельно.\n\n§Y(Мини-игра «Всероссийское обследование электросети» разблокирована и доступна в категории «Тесла Электрик» во вкладке решений.)§!"
 RUS_stalin_flavour_events.3.a: "Ждём Ваших новых изобретений!"
 RUS_stalin_flavour_events.3.b: "Расскажите подробнее о профессоре Тесле."
 RUS_stalin_flavour_events.4.t: "Сон Кирова"
 RUS_stalin_flavour_events.4.d: "После того как недавно на одной из улиц в Сергея Кирова угодил упавший с большой высоты популярный роман и отправил его в больницу, во сне его стали преследовать совершенно невероятные видения:\n\n«Это... Ленинград? Небо такое тёмное, и прохожих совсем нет. Другие товарищи так усердно трудятся — и мне надо поднажать и присоединиться к ним. Почему у меня за спиной так холодно? Ты... а-а-а!»\n\n«Почему я вижу всё так странно? О чём докладывает тот солдат? Почему здешние русские солдаты говорят по-английски... Мы в небе?! Что значит ‘Kirov reporting’???»"
 RUS_stalin_flavour_events.4.a: "Проснувшись, Киров первым делом отправился в санаторий."
 RUS_stalin_flavour_events.5.t: "Никола Тесла"
 RUS_stalin_flavour_events.5.d: "§YРодился:§! §L10 июля 1856 года; Смилян, Хорватская Военная граница, Австрийская империя§!\n\n§YБиография:§! §LНикола Тесла родился в сербской семье и от природы обладал необычайно ярким зрительным воображением и почти безошибочной памятью. Во время учёбы в Грацском техническом университете увлечение переменным током заставило его забросить занятия; диплома он так и не получил, после чего работал в Будапеште и Париже.\n\nВ 1884 году Тесла с рекомендательным письмом отправился к Томасу Эдисону, однако спор о постоянном и переменном токе вскоре развёл их пути. Затем Тесла изобрёл асинхронный двигатель и продал патенты на систему переменного тока компании Вестингауза. На Всемирной выставке 1893 года в Чикаго он осветил выставочный комплекс переменным током, убедительно превзойдя схему Эдисона и сделав переменный ток будущим мировым стандартом.\n\nОткрыв лабораторию в Нью-Йорке, Тесла создал катушку своего имени, раннее радиоуправляемое судно и начал исследования рентгеновского излучения. В 1895 году была введена в строй Ниагарская гидроэлектростанция — первая в мире крупная электростанция переменного тока.\n\nОднако судьба оказалась к нему неблагосклонна. Грандиозный финансовый крах в Соединённых Штатах почти разорил Теслу. Ради заработка он вместе с коллегами из General Electric отправился в Россию, чтобы содействовать электрификации страны.\n\nПрибыв в Россию, Тесла обнаружил хаотическое смешение напряжений, частот и систем фаз. Как отец трёхфазного переменного тока, он почти не мог мириться с подобным беспорядком. Поэтому Тесла представил правительству Савинкова технический меморандум, доказывавший абсолютное превосходство трёхфазного стандарта частотой 50 герц, и лично участвовал в переделке оставшегося немецкого и американского оборудования для работы в единой сети.\n\nНесмотря на преклонный возраст, Тесла по-прежнему проводит дни в лаборатории, вновь и вновь настраивая аппаратуру и стремясь осуществить мечту о передаче энергии по всему земному шару.§!"
 RUS_stalin_flavour_events.5.a: "Благодарим Вас за Ваш труд!"
 RUS_tesla_appointment_clause_socialist: "Совет народных комиссаров официально поручил"
