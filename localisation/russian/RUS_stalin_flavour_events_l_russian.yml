 RUS_tesla_electrical_industries: "«Тесла Электрик»"
 RUS_tesla_electrical_industries_desc: "Созданный профессором Теслой коллектив специалистов превратился в самостоятельное электротехническое предприятие и продолжит его работу над едиными стандартами, дальней передачей энергии и электрификацией всей страны."
