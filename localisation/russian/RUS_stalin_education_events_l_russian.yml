  rus_stalin_education_events.1.t: "Декрет о всеобщем обязательном образовании"
  rus_stalin_education_events.1.desc: "Статья I: пределы обязательного образования\nСо дня обнародования настоящего декрета каждый ребенок на территории Российской Социалистической Республики в возрасте от семи до пятнадцати лет, независимо от пола, национальности, происхождения семьи или религиозных убеждений, пользуется правом и несет обязанность получить начальное образование. Срок обязательного образования устанавливается в четыре года; программа включает грамоту, арифметику, начальные сведения о природе, историю и основы социалистической теории.\n\nСтатья II: принцип бесплатности образования\nПлата за обучение, учебники и основные учебные принадлежности на ступени обязательного образования полностью покрываются государственным казначейством. Никакое местное учреждение или частное лицо не вправе взимать с семьи учащегося какие-либо платежи под видом расходов, связанных с обязательным образованием.\n\nСтатья III: обязанности местных исполнительных органов\nУездные и сельские Советы обязаны в течение шести месяцев со дня обнародования настоящего декрета завершить учет всех детей школьного возраста на своей территории и обеспечить своевременное поступление каждого зарегистрированного ребенка в школу. Местные исполнительные органы ежемесячно представляют вышестоящему органу народного образования сведения о зачислении и посещаемости.\n\nСтатья IV: обязанности родителей и опекунов\nРодители или законные опекуны обязаны обеспечить своевременное поступление находящихся под их опекой детей школьного возраста в школу и завершение ими установленного срока обучения. Лица, которые без уважительной причины препятствуют поступлению ребенка в школу или вынуждают его бросить учебу, и после разъяснительной работы не исправляются, подлежат взысканию со стороны местного Совета в виде предупреждения, штрафа или общественных работ в зависимости от тяжести случая."
  rus_stalin_education_events.1.desc_2: "Статья V: распределение и подготовка учителей\nДля осуществления всеобщего обязательного образования правительство расширяет прием в педагогические училища и учреждает краткосрочные курсы подготовки учителей в каждом уезде. Лица со средним образованием и выше, желающие заниматься преподаванием, после подготовки и проверки знаний получают преимущественное направление в сельские школы. Сельские учителя пользуются тем же денежным содержанием, что и городские, а также получают от государства жилищные субсидии и пособия на проезд во время зимних и летних каникул.\n\nСтатья VI: образовательные гарантии для особых групп\nДля детей школьного возраста, которые не могут посещать школу обычным порядком вследствие инвалидности, бедности семьи или иных особых обстоятельств, местные органы народного образования учреждают обучение на дому или специальные школы, чтобы ни один ребенок не был лишен права на образование по какой-либо причине.\n\nСтатья VII: переходные меры\nПервый год со дня обнародования настоящего декрета считается периодом разъяснения и подготовки. В этот срок все уровни советской власти обязаны завершить строительство школьных помещений, подготовку учителей и печатание учебников. С осеннего семестра второго года обязательное образование вводится по всей стране.\n\nСтатья VIII: надзор и исполнение\nИсполнение настоящего декрета находится под совместным надзором Народного комиссариата просвещения и Рабоче-крестьянской инспекции. Местные исполнительные органы ежеквартально представляют вышестоящим инстанциям отчеты о ходе обязательного образования. Лица, виновные в плохом исполнении или подлоге отчетности, привлекаются к ответственности по закону.\n\nСтатья IX: право толкования и пересмотра\nПраво толкования и пересмотра настоящего декрета принадлежит Всероссийскому центральному отделу народного образования."
  rus_stalin_education_events.1.a: "Настоящий декрет вступает в силу со дня опубликования."
  rus_stalin_education_events.2.t: "Воспроизводство равенства"
  rus_stalin_education_events.2.desc: "- О классовой сущности старого образования и миссии социалистического образования\nНиколай Петрович Соболев\n\nВ капиталистическом обществе образование никогда не бывает нейтральным.\n\nНа поверхности оно будто бы относится ко всем одинаково: школы открывают двери каждому, расписание одно для всех учеников, а экзаменационные отметки как будто зависят только от личного старания. Но под этой видимостью справедливости образование выполняет скрытую и точную задачу: воспроизводит классы. Дети бедных остаются бедными, дети богатых остаются богатыми.\n\nСтарое образование никогда не заявляет об этой цели открыто, но достигает ее при помощи сложного механизма отбора. Этот механизм состоит из трех слоев.\n\nПервый слой: неравенство доступа к школе. Престижные школы в городских центрах и ветхие классы в глухих деревнях пользуются одной и той же программой, словно сама программа способна стереть расстояние дороги, отсутствие книг и отсутствие керосиновой лампы. В учебнике говорится о городских трамваях и фабриках; деревенский ребенок, читая слово «трамвай», представляет себе железный ящик, которого никогда не видел.\n\nВторой слой: ценностная направленность обучения. Урок истории рассказывает о смене царей и полководцев, а простые люди, создающие настоящее богатство в поле и мастерской, остаются лишь смутной сноской под названием «трудовой народ». Урок литературы рассказывает о дворянской любви и рыцарской верности, а историю жены рабочего, весь день согнутой над корытом с бельем, никто не считает достойной учебника. В классе дети усваивают молчаливое согласие со старым порядком, будто мир всегда был таким и иным быть не может."
  rus_stalin_education_events.2.desc_2: "Третий слой: культурная пристрастность критериев оценки. Экзамен проверяет «правильный русский язык», тогда как дети из трущоб с детства слышат говоры и просторечие; он проверяет «цивилизованные манеры», тогда как речь фабричных детей получает клеймо «грубости». Среди отобранных «отличников» люди привилегированного происхождения неизменно составляют подавляющее большинство: не потому, что они умнее, а потому, что образование с самого начала было скроено под их жизненный опыт.\n\nЧерез эти три слоя старое образование исполняет всю свою миссию: превращает классовое преимущество в видимость личных способностей, маскирует насилие общественной структуры под различия личного старания, заставляет победителей верить, что они всего заслужили, а проигравших - принять мысль, будто они изначально ни на что не годны. Когда дети вырастают, они спокойно входят в заранее приготовленные для них места: дети богатых принимают имущество и власть, дети бедных принимают инструменты и молчание.\n\nВ этом движении воспроизводства победители кажутся себе естественными победителями, а побежденных приучают к согласию. Никто не ставит под сомнение сами правила, потому что правила выглядят «нейтральными»: одинаковые учебники, одинаковые классы, одинаковые экзамены. Но именно через это внешне равное «символическое насилие» власть имущие тайно и действенно защищают свою собственность на средства производства.\n\nЧто такое символическое насилие?\n\nОно не так заметно, как кнут помещика, и не так ясно написано, как расписка ростовщика. Оно скрытнее, а потому действеннее. Оно прячется в словах, кажущихся нейтральными: «дарование», «старательность», «ум», «тупость». Ребенок богатых с детства живет среди книжных шкафов, за обеденным столом слышит разговоры о политике и экономике; естественно, он кажется более «умным», потому что уже прошел первый круг домашнего образования. Ребенок бедных после школы помогает семье, а вечером не смеет зажечь керосиновую лампу; естественно, он кажется более «тупым», потому что его уже лишили права не быть лишенным.\n\nВ этом весь секрет старого образования: оно мерит одной линейкой людей, стоящих на разных стартах, а затем объявляет тех, кто с самого начала отставал, «недостаточно старательными».\n\nЭто похоже на естественный отбор и выживание сильнейших, но за этим скрыто насилие, именуемое социальным дарвинизмом: различия человеческого общества приравниваются к законам хищной природы, а классовое расслоение облачается в одежду «науки».\n\nНо социалистическое образование не принимает этой логики. Мы не признаем, что кто-то «рожден» для поражения.\n\nСоциалистическое образование не спрашивает: «откуда ты пришел?» Оно спрашивает: «куда ты хочешь идти?» Оно не мерит всех детей одной линейкой, потому что знает: каждый ребенок стоит на иной стартовой линии, а обязанность педагога - не дать правилам самим сбить с ног того, кто бежит медленнее, а не доказывать правилами, будто он заслужил отставание.\n\nЧтобы смыть остатки старого века и положить конец классовому воспроизводству, социалистическая школа должна объявить войну несправедливости.\n\nЭто значит: школа должна не только учить ребенка грамоте, но и обеспечивать ему свет, при котором можно читать после уроков; школа должна не только передавать знания, но и воспитывать способность понимать мир - не пассивно принимать «мир таков», а смело спрашивать, почему он таков и как сделать его лучше. Школа больше не должна отбирать «достойных обучения», она должна приносить образование к каждой двери, не лишая никого права расти из-за происхождения, бедности или профессии родителей.\n\nКонечная точка старого образования - создавать различия и освящать их как результат «честного соревнования». Начальная точка нового образования - признать эти различия, а затем шаг за шагом заполнять их.\n\nЭто нелегкое дело. Нужны школы, учителя и учебники; нужны керосин, сытый обед в столовой и печь в зимнем классе. Это дороже и труднее старого образования.\n\nНо только так образование перестанет быть убежищем привилегий и станет настоящей лестницей в будущее для каждого ребенка, родился ли он в московской квартире или в глинобитной избе в Заречье.\n\nСтарое образование отбирает. Новое образование поднимает."
  rus_stalin_education_events.2.a: "«В этом вся вера социалистического образования»."
  rus_stalin_education_events.3.t: "Мел Василия Ивановича"
  rus_stalin_education_events.3.desc: "Саратовская губерния, деревня Березовка\n\nВасилий Иванович был единственным в деревне человеком, которого можно было назвать «грамотным». Когда-то он три года работал наборщиком в городской типографии: умел читать, считать и писать почерком не красивым, но понятным. Когда уездный начальник сказал, что в деревне надо построить школу, секретарь первым делом подумал о нем.\n\nШкольное здание деревня строила сама: кирпича не было, значит, использовали дерево. Балки дали все дворы понемногу, доски для крыши староста Шахаров снял со своего дома. Чуть больше чем через месяц у старого дуба у въезда в деревню стояла деревянная изба, где могли сесть тридцать детей.\n\nВ первый школьный день пришло девятнадцать детей, от семи до тринадцати лет.\n\nУ Василия почти не было учебных пособий. Он достал старую книгу, сохраненную со времен типографии, и переписал буквы с первой страницы на доску - на самом деле просто строганую доску, выкрашенную в черный цвет.\n\nСамого старшего мальчика звали Миша. Ему было тринадцать, и он все еще не умел писать свое имя. Василий протянул ему мел: «Ну, давай руку».\n\nМиша держал мел так, будто держал нож. Василий взял его руку и, черта за чертой, написал на доске «Миша».\n\n«Это твое имя».\n\nМиша долго смотрел на кривые буквы.\n\nЧерез несколько дней Василий заметил, что Миша приходит особенно рано. Войдя в класс, он увидел, что Миша сидит на корточках и обугленной веткой снова и снова царапает что-то на земле. Подойдя ближе, Василий увидел: «Миша». Черты были неверные, но узнать можно было."
  rus_stalin_education_events.3.desc_2: "Василий ничего не сказал. Он лишь достал из кармана обломок мела и положил на подоконник рядом с Мишей. Миша поднял на него глаза, но Василий не сказал ничего и пошел готовить урок.\n\nВ тот день после занятий в сумке Миши появилась новая вещь: не книга, а маленькая грифельная дощечка, которую Василий попросил привезти из города. Черная, с ладонь величиной. Сумка была легкой, но Миша нес ее в руках всю дорогу домой.\n\nКогда пришла зима, печь в классе топили жарко. Василий у печи читал ученикам газету. Дойдя до слов «обязательное образование», он остановился и объяснил их. Дети кивали, не вполне понимая. Только Миша сидел в первом ряду с широко раскрытыми глазами, будто серьезно о чем-то думал.\n\nПосле уроков Миша каждый день выводил буквы на земле. К весне"
  rus_stalin_education_events.3.a: "его имя было написано ровнее, чем у другого ребенка, которого учил Василий."
  rus_stalin_education_events.4.t: "Декрет о строительстве высшего образования"
  rus_stalin_education_events.4.desc: "Статья I: задачи высшего образования\nДля удовлетворения настоятельной потребности социалистического строительства в специальных технических кадрах правительство постановляет расширить и построить ряд высших учебных заведений в главных городах страны. Их задача - подготовка инженеров, агрономов, врачей, учителей и специалистов разного профиля, которые должны владеть современными научными знаниями и быть преданы делу социализма.\n\nСтатья II: план строительства высшей школы\nВ течение трех лет со дня обнародования настоящего декрета правительство построит или расширит не менее пятнадцати высших учебных заведений в Москве и других городах. Каждое учебное заведение должно открыть не менее трех направлений, непосредственно связанных с народнохозяйственным строительством, включая, но не ограничиваясь, машиностроение, электротехнику, химическую инженерию, агрономию, медицину, педагогику и общественные науки.\n\nСтатья III: принципы приема\nВсе граждане, достигшие семнадцати лет и окончившие среднюю школу или имеющие равную подготовку, независимо от классового происхождения допускаются к вступительным экзаменам в высшие учебные заведения. Прием должен сочетать отбор по знаниям с учетом классового состава: при равных экзаменационных результатах преимущество получают выходцы из семей рабочих, крестьян и трудовой интеллигенции.\n\nСтатья IV: рабоче-крестьянские подготовительные курсы\nДля обеспечения поступления детей рабочих и крестьян в высшую школу при каждом высшем учебном заведении учреждаются рабоче-крестьянские подготовительные курсы сроком от одного до двух лет. Программа включает восполнение базовых теоретических знаний и политическое воспитание. Лица, успешно прошедшие итоговую проверку, могут поступать на соответствующую специальность без единого вступительного экзамена."
  rus_stalin_education_events.4.desc_2: "Статья V: соединение преподавания с научным исследованием\nВысшие учебные заведения проводят принцип соединения преподавания с научным исследованием. На каждом факультете создаются исследовательские группы или лаборатории, организующие участие преподавателей и старших студентов в решении практических задач промышленного и сельскохозяйственного производства. Результаты исследований прежде всего направляются на решение конкретных технических трудностей народного хозяйства.\n\nСтатья VI: материальное обеспечение и источники финансирования\nСредства на строительство высшей школы выделяются централизованно из государственного бюджета и включаются в число важнейших статей годовой сметы. Местные народные комитеты предоставляют высшим учебным заведениям на своей территории участки под строительство и лимиты строительных материалов. В период строительства местная власть содействует решению вопросов питания, жилья и быта строительных рабочих.\n\nСтатья VII: создание преподавательских кадров\nПравительство будет пополнять кадры высшей школы различными способами: направлением лучших выпускников на учебу за границу, приглашением прогрессивных иностранных ученых к преподаванию, отбором имеющихся технических специалистов для дальнейшего обучения. Денежное содержание преподавателей высшей школы и средства на исследования гарантируются государством по единым нормам.\n\nСтатья VIII: право толкования и пересмотра\nПраво толкования и пересмотра настоящего декрета принадлежит Всероссийскому центральному отделу народного образования."
  rus_stalin_education_events.4.a: "Настоящий декрет вступает в силу со дня опубликования."
  rus_stalin_education_events.5.t: "Первая лампа вечерней школы"
  rus_stalin_education_events.5.desc: "Тульская губерния, Серпуховский машиностроительный завод\n\nВ день открытия рабочей вечерней школы пришло семнадцать человек. Все они явились прямо после поздней смены, в рабочей одежде, пропитанной маслом. Класс устроили в пустом заводском складе: директор велел перенести туда несколько рядов скамеек и повесить впереди доску.\n\nЛектора прислали из города. Это был молодой человек в круглых очках, говоривший негромко. На первом уроке он объяснял основные принципы механики и рисовал схемы. Старый слесарь сидел в первом ряду и все время хмурился.\n\nПосле занятия старый слесарь подошел к доске. «Схема у вас неправильная».\n\nМолодой человек замер. «Что в ней неправильно?»\n\nСтарый слесарь взял мел и изменил на рисунке передачу. «В настоящей сборке эта шестерня идет в другую сторону. На бумаге вроде верно, а поставишь - не крутится».\n\nМолодой человек посмотрел и поправил очки. «Я проверю по учебнику...»\n\n«Не надо», - сказал старый слесарь. «Вы просто придите в цех и один раз посмотрите. Деталь там стоит. Она не врет».\n\nНа второй урок молодой человек принес настоящую модель передачи, такую же, как в заводском цехе. Он поставил ее на стол и дал рабочим по очереди показать работу. Когда очередь дошла до старого слесаря, тот разобрал модель и собрал ее обратно меньше чем за две минуты.\n\nМолодой человек помолчал. «Вам бы преподавать».\n\nТот вечерний урок продолжался почти три часа, потому что старый слесарь достал из кармана пожелтевшую тетрадь - собственный альбом неисправностей станков, без слов, одни рисунки от руки, - и, показывая на одну страницу, спросил: «А эту поломку учебник как описывает?»"
  rus_stalin_education_events.5.desc_2: "Молодой человек наклонился, посмотрел и признал, что такого случая никогда не видел.\n\nПосле этого на уроках вечерней школы всегда лежали настоящие детали. Иногда сломанный вал, иногда изношенный подшипник. Рабочие собирались вокруг них, обсуждали, разбирали, спорили, а молодой человек стоял рядом, делал записи и иногда вставлял теоретическое объяснение. Позднее старый слесарь стал «внештатным преподавателем»: сверху ему назначили небольшую доплату. Небольшую, но он не отказался.\n\nКогда его спросили, чего он добивается, он буркнул: «Когда я был учеником, меня никто ничему не учил. Все приходилось самому подсматривать. Теперь, если кто-то готов учить, значит, кто-то должен быть готов учиться». Он помолчал. «Да и формулы, что этот парень объясняет, правда работают. Я тридцать лет машины чинил, а только теперь понял, что в моих старых приемах тоже была своя причина»."
  rus_stalin_education_events.5.a: "Научная теория должна соединяться с практикой."
  rus_stalin_education_events.6.t: "Записная книжка Игнатьева"
  rus_stalin_education_events.6.desc: "Воронежская губерния, уездные курсы\n\nКогда Игнатьев явился на занятия, он оказался самым старшим слушателем. Остальным было около двадцати, ему уже тридцать пять.\n\nКурсы длились два месяца, расписание было плотным: политика и постановления, правила распределения земли, устав коллективной артели, способы улаживания споров, а еще урок устного выступления, где учили ясно говорить на деревенском сходе.\n\nКаждый вечер Игнатьев переписывал дневные записи заново, потому что почерк у него был слишком неразборчивый.\n\nНа выпускном экзамене преподаватель задал всем один вопрос: «Если вы вернетесь в деревню, а крестьянин укажет на вас пальцем и спросит: “С какой стати ты будешь нами распоряжаться?”, что вы ответите?»\n\nКто-то отвечал: «Потому что меня прислали сверху», кто-то: «Потому что я пришел вам помочь». Преподаватель был недоволен всеми.\n\nКогда очередь дошла до Игнатьева, он помолчал. «Я расскажу ему все, что знаю: зачем нужны комитеты бедноты, как в колхозе делят зерно, чей участок где может остаться. Если не смогу ответить, скажу: “Узнаю и потом скажу”, а потом сдержу слово».\n\nПреподаватель посмотрел на него: «А вы знаете, что значит сдержать слово?»\n\n«Знаю», - сказал Игнатьев. «Я землю пашу. Крестьяне пустым словам не верят. Они верят урожаю на следующий год».\n\nПосле выпуска Игнатьева направили обратно в деревню Заречье. В первый же день дома деревенские окружили его и спросили, чему он научился. Он не стал произносить длинную речь. Просто достал из сумки новую тетрадь. На обложке было написано: «Рабочие записи по деревне Заречье»."
  rus_stalin_education_events.6.desc_2: "«Самое важное, чему я научился, - сказал Игнатьев, - это записывать каждое ваше слово, а потом решать дела одно за другим. Что сделать нельзя, тоже запишу, а потом посмотрим, можно ли будет сделать».\n\nВ тот вечер деревенские увидели открытую первую страницу. На ней ровным почерком были переписаны несколько строк:"
  rus_stalin_education_events.6.a: "«В делах нужен счет, а в словах - верность слову»."
  rus_stalin_education_events.7.t: "Ответное письмо"
  rus_stalin_education_events.7.desc: "Воронежская губерния, деревня Заречье\n\nИгнатьев снова уезжал на переподготовку. В прошлый раз она длилась два месяца, теперь только один, но занятия были труднее: один курс целиком посвящался «анализу различий крестьянских требований по районам». После вечерней самоподготовки товарищи в общежитии спорили без конца.\n\nВ день возвращения, под вечер, он проходил мимо дома Сергея. Сергей чинил забор во дворе. Игнатьев остановился у дороги и некоторое время смотрел молча.\n\n«Чего уставился?» - Сергей опустил молоток. «Что, съездил в губернию учиться, теперь деревенских не узнаешь?»\n\nИгнатьев улыбнулся и вынул из сумки письмо. «Нет. Это бумага из губкома, дополнительное разъяснение о земельных спорах. Одна страница может тебе пригодиться».\n\nСергей взял письмо, пролистал, ничего не сказал и вернул.\n\nИгнатьев не спешил уходить. Он сел рядом на пень. «Сергей, я многому научился. Была там одна фраза: “Хорошая политика, плохо объясненная, все равно что отсутствие политики”».\n\n«Значит, моя работа - перевести губернские бумаги на наш деревенский язык, чтобы люди поняли»."
  rus_stalin_education_events.7.desc_2: "Он помолчал. «Вот, например, твое дело. Твой отец служил управляющим у Кузнецовых. Это вина старого общества, а не твой детский выбор. Но откуда деревне это знать? На курсах нас учили так: поручить тебе порядок у школы грамоты. Каждый вечер ходи возле класса. Когда все увидят, что ты помогаешь старухам носить воду и чинишь школьные окна, тебе ничего не придется объяснять. Люди сами сочтут тебя своим».\n\nСергей выругался. «Умеешь ты людей высчитывать».\n\n«Это не расчет». Игнатьев встал и отряхнул пыль с брюк. «Так учили губернские преподаватели: “Низовой кадр должен уметь выращивать правду в самой земле”».\n\nСергей больше не ругался, но на следующий день действительно пришел к дверям школы грамоты. Постоял немного. Одна старуха узнала его и крикнула: «Помоги-ка поднять». Он как-то сам собой помог. Потом делал это каждый день. И с какого-то дня, никто уже не помнил с какого, дети из школы грамоты стали звать его дядей Сергеем.\n\nПосле той переподготовки Игнатьев добавил в своей записной книжке одну строку:"
  rus_stalin_education_events.7.a: "«Опыт низовой работы полезнее любой бумаги»."
  rus_stalin_education_events.8.t: "Экран"
  rus_stalin_education_events.8.desc: "Тамбовская губерния, деревня Гремячье\n\nКинопередвижка приехала уже к темноте. На телеге везли кинопроектор, белый экран и генератор, за телегой шли двое молодых людей.\n\nДеревенские окружили их: такого они не видели. Кто-то спросил, что это такое. Киномеханик ответил: «Кино показывать». И собралась вся деревня.\n\nЭкран повесили на наружную стену школы, генератор гудел в стороне. Первый отрывок показывал уборку в коллективном хозяйстве: тракторы шли по пшеничному полю, зерно струилось в амбары как вода. Картинка дрожала, и трактор на экране двигался вперед. Старики-крестьяне смотрели не отрываясь. Никто не говорил.\n\nПотом пошла хроника индустриального строительства: домна выпускала чугун, летели искры, рабочие управляли станками в цехах. Молодой рабочий стоял в заднем ряду и невольно потрогал мозоли на своих руках: руки на экране были совсем как его, только это было в другом месте, в городе.\n\nЗатем киномеханик показал санитарный фильм о профилактике сыпного тифа. На середине одна старуха вдруг встала и показала на экран: «Вот эти симптомы, о которых врач говорит, - так прошлой зимой соседский ребенок и умер».\n\nЕй никто не ответил. На экране врач показывал, как обеззараживать известковой водой.\n\nКогда показ закончился, молодежь окружила киномеханика вопросами: «Откуда машина?» «Когда еще приедете?» Дети ходили вокруг проектора кругами."
  rus_stalin_education_events.8.desc_2: "Киномеханик убирал аппаратуру и терпеливо отвечал. Кто-то спросил: «А места в кино настоящие? Правда бывают такие огромные амбары?» Киномеханик похлопал по аппарату. «Самые настоящие. Будете хорошо обрабатывать землю, сдавать хлеб - через несколько лет и у вас амбары будут такими». В толпе кто-то засмеялся, немного глупо, но искренне.\n\nЭкран сняли, сложили в ящик, генератор постепенно стих. Но огни в деревне горели дольше обычного: во многих домах говорили о том, что только что увидели, о тракторах, о стали и о тех далеких местах, которых они никогда не знали..."
  rus_stalin_education_events.8.a: "...и о прекрасном будущем."
  rus_stalin_education_events.9.t: "Линии, выросшие из руин"
  rus_stalin_education_events.9.desc: "Конструктивизм родился на руинах после Октябрьской революции.\n\nПосле 1917 года старый мир был разбит вдребезги. Царские портреты срывали со стен, дворянские усадьбы горели, церковные колокола умолкли. Но художники вскоре поняли: разбить старое - только первый шаг. Вопрос был в другом: как должен выглядеть новый мир?\n\nГруппа молодых художников начала думать над этим вопросом. Они отказывались писать портреты дворян, религиозные сюжеты и все, что существует «только для созерцания». Они заявляли: искусство не должно висеть на стене, чтобы им любовались, оно должно войти в жизнь и стать самой жизнью. Так родился конструктивизм, служащий народным массам.\n\nКонструктивисты считали, что художника следует называть не «художником», а «инженером». Они поклонялись не вдохновению, а конструкции: стальным фермам заводов, подвесам мостов, приводным валам машин. В их глазах самым прекрасным предметом был не цветок и не изящное обнаженное тело, а трактор, водонапорная башня или точно вычерченный чертеж. Красота, по их мнению, поддавалась измерению."
  rus_stalin_education_events.9.desc_2: "Их представитель Татлин в 1920 году спроектировал «Памятник III Интернационалу»: наклонную стальную спираль, более чем вдвое выше Эйфелевой башни, внутри которой подвешены три стеклянных зала для законодательства, управления и пропаганды, каждый вращается со своей скоростью. Башня так и не была построена, но ее чертеж уже был манифестом: она не принадлежала ни одному классическому стилю, не имела «переда» и «зада», сама была динамической, устремленной вверх силой, вечно вращающейся и вечно растущей.\n\nДругой представитель, Родченко, писал в 1921 году: «Мы заявляем, что искусство умерло. Его труп гниет в музеях. Искусство будущего будет промышленным, строительным, служащим народу».\n\nЭти слова тогда вызвали бурю. Традиционные художники обвиняли конструктивистов в «уничтожении красоты», публика недоумевала, что означают эти косые линии и чистые геометрические формы. Но конструктивисты не придавали спорам значения. Они уже перешли к новой работе: оформляли заводские стенды, рабочую одежду, колхозные плакаты и даже посуду для общественных столовых. Все, что могло изменить зрительную среду повседневной жизни, могло стать «искусством».\n\nОни верили, что новому обществу нужен новый зрительный язык. Декоративный стиль царского времени был полон вычурности и пустой роскоши, а конструктивизм заменял кривые прямыми линиями, а пышную резьбу - ясными и сильными геометрическими формами. Это было не ради «красоты», а ради того, чтобы каждый увидевший почувствовал новую силу: силу машины, коллектива и будущего.\n\nС великими переменами в российском обществе конструктивизм вновь получает признание и возрождение. Эти великие конструктивисты заново смотрят на привычный мир глазами пролетариата: превращают заводские трубы в вертикальные линии, межи полей - в горизонтальные, улыбки народа - в светлые круги. Затем они складывают эти линии и формы вместе, создавая картину, какой никто никогда не видел, но которая каждому кажется глубоко знакомой."
  rus_stalin_education_events.9.a: "Мы начертим первый чертеж нового мира."
  rus_stalin_education_events.10.t: "Рассвет «конструкции»"
  rus_stalin_education_events.10.desc: "Москва, Первая государственная типография\n\nСтена прежде была серо-белой, как все серо-белые стены этого города. Пока однажды не пришли молодые люди с кистями, красками и листом, исписанным геометрическими линиями.\n\n«Это не картина», - сказал главный из них, молодой человек в рабочей куртке, испачканной краской, с растрепанными волосами. «Это структура. Продолжение производственной линии. Еще одно лицо печатной машины».\n\nОни были конструктивистами. До их прихода на стенах типографии висели царские портреты и религиозные картины; прошлой осенью их сорвали, и стена с тех пор пустовала. Рабочие привыкли проходить мимо пустой стены и никогда не думали что-нибудь туда добавить.\n\nНо конструктивисты думали.\n\nОни разложили чертежи на длинных столах столовой и при помощи циркуля и линейки выводили лучи, кольца и наклонные цветные плоскости. Некоторые рабочие подходили посмотреть, не понимали и стеснялись спросить. Старый наборщик указал на наклонный красный треугольник на чертеже: «А это что?»\n\n«Революция».\n\n«Какая революция? Февральская или Октябрьская?»\n\n«Каждая», - сказал молодой человек. «Каждый удар вверх».\n\nЧерез неделю стенная роспись была готова. Это была огромная геометрическая композиция: красный клин шел из левого нижнего угла к правому верхнему, рассекал серый фон, а вокруг него золотые и черные плоскости дробились, вращались и собирались заново. Вверху была строка, выведенная по линейке, угловатая и четкая: «Наши глаза больше не смотрят назад»."
  rus_stalin_education_events.10.desc_2: "Рабочие долго стояли перед стеной с котелками в руках. Никто не сказал «красиво», и никто не сказал «непонятно». Кочегар поставил котелок, подошел к стене и провел пальцем вдоль края красного клина.\n\n«Этот цвет, - сказал он, - как огонь в топке».\n\nМолодой человек, отвечавший за роспись, стоял позади толпы и наконец выдохнул. Он смотрел, как грубые пальцы скользят над стеной, не решаясь коснуться и не желая отойти, будто он нанес на стену не просто цвет, а что-то хрупкое.\n\nНа следующий день на заводской стене появились еще несколько строк - на этот раз написанных самими рабочими. Буквы были кривые, но внизу они нарисовали маленький красный треугольник, словно боялись, что кто-нибудь его не заметит."
  rus_stalin_education_events.10.a: "«Огонь в топке красный, и наши сердца тоже»."
  rus_stalin_education_events.11.t: "Пари"
  rus_stalin_education_events.11.desc: "Ижевский машиностроительный завод, цех окончательной сборки\n\nПолучив указание «усовершенствовать производственную технику», Андрей Петрович три дня собирал технический актив завода. Вывод был один: цех окончательной сборки нужно полностью перестраивать под новую линию. Но бюджет был ограничен, а остановка производства на реконструкцию означала потерю как минимум половины месячного выпуска.\n\n«Можно не перестраивать все сразу», - сказал старый слесарь Михаил, выдвигая другое мнение. «Сначала убрать узкие места, остальное не трогать. Переделали одно - посмотрели результат, если хорошо, переделали следующее. Так не придется останавливать всю линию сразу».\n\nАндрей посмотрел на Михаила. «Если делать поэтапно, каждое изменение требует остановки. В сумме простой может выйти больше».\n\n«Зато каждый раз стоит только одно место, остальные работают», - настаивал Михаил. «По вашему плану вся линия встанет, семьсот человек будут сидеть. Даже один день - это семьсот человек без работы на день».\n\nОни не могли договориться. Наконец директор решил: будет пари. Андрей сначала перестраивает один пост по своему плану, Михаил наблюдает. Если через месяц после переделки не будет заметного роста эффективности, дальше делают по Михаилу.\n\nПеределка длилась пять дней. Конвейер на этом посту перепроектировали, порядок стеллажей с деталями изменили. В первый день после пуска рабочие на посту сначала путались, но к вечеру ускорились. На второй день куча полуфабрикатов у поста уменьшилась вдвое. На третий день рабочие соседнего поста сами подошли спросить: «Что вы у себя поменяли?»\n\nМихаил неделю стоял рядом и смотрел, ничего не говоря."
  rus_stalin_education_events.11.desc_2: "На восьмой день он вошел в кабинет Андрея и положил на стол пачку папирос. «Вы выиграли».\n\nАндрей не взял папиросы. «Ваш способ тоже правильный. Поэтапная переделка действительно надежнее. Когда будем перестраивать следующий пост, сделаем по-вашему».\n\nМихаил опешил. «Вы же выиграли, а все равно по-моему?»\n\n«Дело не в выигрыше», - сказал Андрей. «Дело в том, какой способ подходит. Ваш способ подходит нашему старому заводу, мой - новому».\n\nМихаил забрал папиросы и буркнул: «Тогда в следующий раз сразу говорите, не спорьте со мной на пари».\n\n«В следующий раз сразу позову вас советоваться», - засмеялся Андрей.\n\nВ месячном отчете директор написал: «Рабочие не против перемен, они лишь хотят, чтобы процесс перемен не мешал их труду. После переделки выработка на новом посту выросла, уверенность рабочих также усилилась. Следующим шагом продолжить перестройку остальных постов по поэтапному плану Михаила»."
  rus_stalin_education_events.11.a: "Техническое улучшение - это также процесс сплочения."
  rus_stalin_education_events.12.t: "Три обхода директора"
  rus_stalin_education_events.12.desc: "На Дону, ремонтная мастерская совхоза\n\nПосле назначения директором хозяйства Кузнецов первым делом не стал проводить собрание, а переставил в ремонтной мастерской все. Три дня он раскладывал инструменты по размеру, запасные части по маркам, переносил верстак из угла к окну.\n\nРабочие смотрели, как он хлопочет. Кто-то тихо сказал: «Новый директор пришел - вот и возится с ерундой».\n\nКузнецов услышал, но не ответил.\n\nНа четвертый день сломался трактор. Раньше рабочим приходилось полдня рыться на заваленных полках в поисках подходящего ключа; теперь Кузнецов за пять минут нашел нужный ключ, за пятнадцать вскрыл кожух, за двадцать заменил деталь. Вся работа заняла меньше часа.\n\nОн бросил старую деталь в ящик для лома, хлопнул ладонями, стряхивая масло, и спросил: «Раньше сколько ремонтировали?»\n\n«Полдня».\n\nКузнецов больше ничего не сказал. Он только носком сапога указал на новую желтую линию на полу, делившую рабочую зону на «ждет ремонта» и «отремонтировано». С тех пор никто больше не складывал исправные детали рядом со сломанными.\n\nНа утренней летучке следующего дня его единственное распоряжение было: «Сегодня рассортировать ту кучу новых подшипников на складе по размерам и занести в ведомость. До конца смены хочу видеть учет». Сказал и ушел.\n\nЧерез месяц на стене мастерской появились несколько таблиц, показывавших изменение запасов деталей. Кто-то спросил Кузнецова, что это такое. Он ответил одной фразой:"
  rus_stalin_education_events.12.a: "«Время, которое вы раньше теряли, написано на этой таблице. Смотрите сами»."
  rus_stalin_education_events.13.t: "Один ключ открывает десять тысяч замков"
  rus_stalin_education_events.13.desc: "Ижевский машиностроительный завод, кабинет главного инженера\n\nКогда в Ижевск пришло распоряжение о стандартизации производственных линий, главный инженер Андрей Петрович как раз ломал голову над допусками партии новых винтовочных деталей. В разных цехах были разные формы, и когда детали одной партии поступали на окончательную сборку, треть нередко не подходила.\n\nСтандартизация означала, что единые технические нормы придется составлять заново. Заводу нужно было на несколько дней остановиться, чтобы перестроить приспособления и оснастку.\n\nНа совещании директор спросил: «Сколько мы теряем за один день остановки?»\n\nАндрей ответил: «Пять дней выпуска».\n\n«А после переделки сколько сэкономим?»\n\nАндрей перелистал смету и осторожно подбирал слова. «В дальнейшем ружья не придется присылать к нам за деталями. На фронте любая механическая станция сможет заменить нужную часть. Такую выгоду не подсчитаешь».\n\nДиректор помолчал. «Переделывать».\n\nПеределка длилась неделю. После новой выверки сборочной линии рабочие обнаружили, что детали, которые раньше приходилось подгонять напильником, теперь входили плавно. Старый слесарь-подгонщик сказал: «За двадцать лет я впервые почувствовал, что деталь с другого завода тоже можно поставить».\n\nЭта фраза позже дошла до тамбовской станции сельхозтехники. Там механик впервые починил грузовик Ленинского автозавода ижевскими стандартными деталями. Завернув последний винт, он открыл капот и некоторое время разглядывал двигатель. «Раньше мы писали на завод и ждали запчасти. Иногда ждали месяцами. Теперь открыл склад и взял». Он поднял ключ. «Крепкая вещь, и стандартная. Не на марку смотри, а на номер. Один ключ открывает десять тысяч замков. Хорошая работа»."
  rus_stalin_education_events.13.desc_2: "Первые результаты стандартизации линий проявились через несколько месяцев: взаимозаменяемость деталей между заводами резко выросла, сроки ремонта в среднем сократились на две трети, простои цехов из-за неисправностей заметно уменьшились. В отчете в центр Андрей писал: «Мы сэкономили не только время, но и доверие. Теперь рабочие чувствуют, что все заводы страны - одна семья»."
  rus_stalin_education_events.13.a: "«Детали могут идти куда угодно, и люди тоже»."
