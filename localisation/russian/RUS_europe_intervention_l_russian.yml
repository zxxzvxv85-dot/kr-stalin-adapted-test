 RUS_europe_intervention_entry_tt:0 "Открыть §YОтдел внешних связей и разведки Европейского революционного комитета§!, выбрать страну и выполнить связанные с ней решения."
 RUS_europe_intervention_dzerzhinsky_tt:0 "§YФеликс Эдмундович Дзержинский§!\n§YРодился:§! §L11 сентября 1877 года; Виленская губерния, Царство Польское, Российская империя§!\n§YБиография:§! §LОпытный польский революционер и организатор Всероссийской чрезвычайной комиссии исчез во время победы белых и долго считался погибшим. Под псевдонимом «Буревестник» он восстановил в Варшаве подпольную сеть, которая теперь охватывает всю Восточную Европу.§!\n\n§YНажмите на портрет, чтобы выбрать Молотова: гражданская помощь§!"
 RUS_europe_intervention_molotov_tt:0 "§YВячеслав Молотов§!
§YРодился:§! §L9 марта 1890 года; Кукарка, Вятская губерния, Российская империя§!
§YБиография:§! §LВячеслав Михайлович Молотов, урождённый Скрябин, происходил из семьи сельского учителя. После ранней смерти отца семья обеднела. Во время учёбы в Казанском реальном училище он познакомился с подпольной революционной печатью и быстро увлёкся марксизмом. В 1906 году шестнадцатилетний Молотов вступил в Российскую социал-демократическую рабочую партию и занялся подпольной работой: организовывал студенческие собрания, распространял листовки и поддерживал связь с железнодорожниками. Полицейская слежка научила его осторожности и молчанию.

Во время Февральской революции 1917 года Молотов находился в Петрограде. Он был среди первых большевиков, прибывших в Таврический дворец, и вскоре стал одним из главных связных партии. В дни Октябрьского восстания он координировал связь между Смольным и заводами. Сам он не сражался на баррикадах, однако через его руки проходили все распоряжения, направлявшиеся на передовую. Его исполнительность и организаторские способности привлекли внимание Ленина, назвавшего его во внутреннем документе «молодым кадром, заслуживающим подготовки».

С началом Гражданской войны Молотова направили на фронт для ведения политической работы. В Царицыне он работал со Сталиным, а на Южном фронте вместе с Ворошиловым координировал снабжение. Военными талантами он не славился, зато почти не имел равных в организации делопроизводства, составлении приказов и систематизации донесений. Именно тогда у него возникло почти навязчивое уважение к «порядку» и «документу»: долговечность революции он связывал с надёжностью административной цепи.

После падения красной власти Молотов вместе с другими изгнанниками перебрался в Европу. В Париже он постепенно превратился из партийного организатора в участника внешнеполитической работы. Он самостоятельно выучил французский язык, систематически изучал политическое устройство европейских стран и неоднократно неофициально встречался с французскими коммунистами и синдикалистскими партиями. Свердлов однажды заметил, что «каждое его слово заранее рассчитано».

С началом восстановления социалистической России партия стала поручать Молотову всё более важные внешние контакты. Он участвовал в торговых переговорах с Третьим Интернационалом, идеологических совещаниях с германскими социалистами и многосторонних консультациях о «международном механизме координации революции». Он не блистает публичным красноречием, зато в закрытых переговорах проявляет редкие терпение и точность: сначала позволяет собеседнику раскрыть все карты, затем разбирает их по пунктам и в конце предлагает такую редакцию соглашения, от которой почти невозможно отказаться.

На дипломатических встречах Молотов неизменно появляется в тёмном костюме с безупречно завязанным галстуком. Он держит ладони на столе, словно готов в любую секунду подписать документ или вычеркнуть из него строку. Для большинства товарищей каждое его движение соответствует прозвищу «Молот»: без показной эффектности, без отклонения, но всякий удар точен.§!

§Y«Старое поколение большевиков никогда не уступает давлению. Это не изменится.»§!\n\n§YНажмите на портрет, чтобы выбрать Дзержинского: военная помощь§!"
