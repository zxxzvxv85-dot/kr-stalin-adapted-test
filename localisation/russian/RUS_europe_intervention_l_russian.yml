 RUS_europe_intervention_dzerzhinsky_tt:0 "§YФеликс Эдмундович Дзержинский§!\n§YРодился:§! §L11 сентября 1877 года; Виленская губерния, Царство Польское, Российская империя§!\n§YБиография:§! §LОпытный польский революционер и организатор Всероссийской чрезвычайной комиссии исчез во время победы белых и долго считался погибшим. Под псевдонимом «Буревестник» он восстановил в Варшаве подпольную сеть, которая теперь охватывает всю Восточную Европу.§!"
 RUS_europe_intervention_empty_tt:0 ""
 RUS_europe_intervention_no_selection:0 "§YОбзор Европы§!: показать все доступные решения по революционной дипломатии и вмешательству"
 RUS_europe_intervention_help:0 "Выберите страну, затем откройте решения, чтобы увидеть соответствующие действия. «Обзор» вернёт полный список."
 RUS_europe_intervention_overview_button:0 "Обзор"
