  RUS_long_event_continue: "Продолжить"
  russia_socialist_events.3.t: "Воссоединённая партия социалистов-революционеров"
  russia_socialist_events.3.d: "История партии социалистов-революционеров — это история непрерывных расколов и воссоединений. Последний крупный раскол произошёл после смерти Виктора Чернова: уход многолетнего лидера обнажил трещины, давно существовавшие внутри партии. После его кончины Борис Савинков железной рукой провёл почти сокрушительную чистку правого крыла, и множество кадров, прежде считавшихся «становым хребтом партии», оказалось в списках «изменников». Тем временем левые были вынуждены уйти в подполье и вернуться к самому знакомому, но и самому тяжёлому для них способу существования — терроризму.\n\nТеперь эсеры вновь заняли господствующее положение на политической карте. Однако этого далеко недостаточно, чтобы объединить под одним знаменем крестьянство, составляющее подавляющее большинство населения России. Недоверие крестьян к партиям, отчуждение между регионами и взаимная подозрительность, оставшаяся со времён революции, по-прежнему образуют глубокие пропасти на пути к единству.\n\nПосле нескольких раундов закрытых переговоров между Марией Спиридоновой и Фридрихом Рихтером партия социалистов-революционеров наконец объявила о своём новом воссоединении.\n\nНаблюдатели отмечают явные следы компромисса в этом единстве. Спиридонова олицетворяет радикальное наследие левого крыла и его сельские корни, тогда как Рихтер представляет силы, стремящиеся привести партию к демократии и парламентаризму. Их согласие основано не столько на доверии, сколько на прагматичном расчёте: цена раскола куда выше стоимости компромисса."
  russia_socialist_events.3.a: "Неужели они и вправду научатся сотрудничать?"
  russia_socialist_events.3.b: "Расскажите подробнее о партии социалистов-революционеров."
  russia_socialist_events.1437.t: "Положение партии социалистов-революционеров"
  russia_socialist_events.1437.d: "«Воссоединившаяся» под давлением обстоятельств партия социалистов-революционеров теперь явственно разделилась на два главных течения.\n\nСлева стоят народники во главе с Марией Спиридоновой. Они продолжают традиции левых эсеров времён до Первой гражданской войны и по-прежнему высоко держат знамя «Земли и воли». Они требуют немедленно и безвозмездно передать помещичьи земли сельским общинам и комитетам деревенской бедноты, а также восстановить рабочий контроль над фабриками.\n\nПравое крыло представлено демократами во главе с Фридрихом Рихтером, многолетним соратником покойного Виктора Чернова. Они считают себя законными наследниками его «конструктивного социализма» и выступают за постепенное восстановление демократических институтов с опорой на земства, кооперативы и легальную печать. В отличие от прямолинейного радикализма народников, демократы уделяют больше внимания правовым процедурам, просвещению и местному самоуправлению и глубоко привержены парламентской демократии.\n\nЗа пределами двух главных лагерей существует несколько меньших течений. Среди них — созданная Питиримом Сорокиным гражданская фракция, занимающая промежуточное положение и придерживающаяся социал-демократических и умеренно-прагматических взглядов. Она немногочисленна, но её сторонники сосредоточены в университетах, местных кооперативах и статистических учреждениях, где постепенно накапливают влияние при помощи социальных исследований, образования взрослых и кооперативного кредита.\n\nОднако самым заметным неосновным течением в современной российской политике стали максималисты, идейным вдохновителем которых является Алексей Устинов. На заседаниях партийный истеблишмент нередко называет их «аграрными большевиками». Ещё во время Первой гражданской войны они прославились как стойкие союзники большевиков. После победы Белой России большинство их членов вошло в боевые группы, рассеялось по Центральной и Восточной Сибири и там испытало на практике систему коллективных хозяйств Устинова. Теперь, после новой победы Красного знамени, максималистов всё ещё не признаёт руководство партии социалистов-революционеров, однако их влияние продолжает расти."
  russia_socialist_events.1437.a: "«...Когда-нибудь это принесёт плоды, даже если ты уже не сможешь их увидеть»"
