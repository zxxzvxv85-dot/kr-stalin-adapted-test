  RUS_long_event_continue: "Продолжить"
  russia_socialist_events.3.b: "Расскажите подробнее о партии социалистов-революционеров."
  russia_socialist_events.1437.t: "Положение партии социалистов-революционеров"
  russia_socialist_events.1437.d: "Воссоединившаяся под давлением обстоятельств партия социалистов-революционеров теперь явственно разделилась на два главных течения.\n\nСлева стоят народники во главе с Марией Спиридоновой. Они продолжают традиции левых эсеров времён до Первой гражданской войны и по-прежнему высоко держат знамя «Земли и воли». Они требуют немедленно и безвозмездно передать помещичьи земли сельским общинам и комитетам деревенской бедноты, а также восстановить рабочий контроль над фабриками.\n\nПравое крыло представлено демократами во главе с Фридрихом Рихтером, многолетним соратником покойного Виктора Чернова. Они считают себя законными наследниками его «конструктивного социализма» и выступают за постепенное восстановление демократических институтов с опорой на земства, кооперативы и легальную печать. В отличие от прямолинейного радикализма народников, демократы уделяют больше внимания правовым процедурам, просвещению и местному самоуправлению и глубоко привержены парламентской демократии.\n\nЗа пределами двух главных лагерей существует несколько меньших течений. Среди них — созданная Питиримом Сорокиным гражданская фракция, занимающая промежуточное положение и придерживающаяся социал-демократических и умеренно-прагматических взглядов. Она немногочисленна, но её сторонники сосредоточены в университетах, местных кооперативах и статистических учреждениях, где постепенно накапливают влияние при помощи социальных исследований, образования взрослых и кооперативного кредита.\n\nОднако самым заметным неосновным течением в современной российской политике стали максималисты, идейным вдохновителем которых является Алексей Устинов. Ещё во время Первой гражданской войны они прославились как стойкие союзники большевиков. После победы Белой России большинство их членов вошло в боевые группы, рассеялось по Центральной и Восточной Сибири и там испытало на практике систему коллективных хозяйств Устинова. Теперь, после новой победы Красного знамени, максималистов всё ещё не признаёт руководство партии социалистов-революционеров, однако их влияние продолжает расти."
  russia_socialist_events.1437.a: "«...Когда-нибудь это принесёт плоды, даже если ты уже не сможешь их увидеть»"
