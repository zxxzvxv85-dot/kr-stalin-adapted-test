 RUS_future_foreign_joint_deterrence_tt:0 "Обменяться гарантиями независимости с §YФранцузской Коммуной§! и улучшить взаимное мнение на §G25§!.\nОбе страны получат дух §YФранко-российское сдерживание§!: поддержка войны §G+5%§!, скорость планирования §G+10%§! на §Y180 дней§!. Если при завершении фокуса обе страны воюют с Германией, срок составит §Y365 дней§!.\nФокус не включает обе страны в один альянс автоматически."
 RUS_future_foreign_red_flags_merge_tt:0 "Навсегда дополнить дух §YСоветы и Фаланстер§!:\nПрирост политической власти: §G+5%§!\nСтоимость поддержания улучшенных отношений: §G-25%§!\nЛимит добровольческих дивизий: §G+2§!\nСтоимость решений §YВоенная помощь§! и §YГражданская помощь§! в политической власти снизится на §G20%§! (с §Y30§! до §Y24§!). Прочие затраты и проекты разработки ресурсов не изменятся."
