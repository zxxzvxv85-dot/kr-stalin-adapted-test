l_russian:
 RUS_future_foreign_002_desc:0 "На Западе ещё остаются товарищи, которые вместе с нами хранят верность одному идеалу. Некоторые из них расходятся с нами в вопросах политической линии и даже отошли от того, что мы понимаем под «ортодоксией»,—но если мы действительно намерены уничтожить империалистическую систему, нам придётся отбросить предубеждения."
 RUS_future_foreign_003_desc:0 "Россия, раскинувшаяся между Европой и Азией, всегда сохраняла окно для связей с Востоком. Большинство революционных партий Азии в той или иной степени связано с большевиками и другими политическими движениями России. По сравнению с западными друзьями, с которыми у нас возникает всё больше разногласий, у нас с товарищами на Востоке явно гораздо больше тем для общего разговора."
 RUS_future_foreign_004_desc:0 "В 1921 году легенда Красного Октября померкла под тяжестью действительности — но кто из нас не следил за той революцией, затаив дыхание? От огней Смольного, не гаснувших всю ночь в 1917 году, до документов и карт, разложенных сегодня на московских столах переговоров, убеждения революционеров остаются неизменными."
 RUS_future_foreign_006_desc:0 "Наша социалистическая республика пока ещё молода и уязвима... В империалистическом окружении нам следует искать сотрудничества и солидарности у братских государств Запада. Товарищ Вячеслав Молотов уже отправился в Париж для проведения консультаций."
 RUS_future_foreign_016_desc:0 "Сотрудничество между пролетарскими государствами должно быть безоговорочным и согласованным. В теории у нас общая цель; на практике, однако, невозможно игнорировать разрыв в техническом развитии. Россия всё ещё заметно отстаёт от основных технических стандартов Третьего интернационала. Чтобы догнать товарищей, опережающих нас на многие годы, придётся приложить ещё больше усилий."
 RUS_future_foreign_017_desc:0 "Торговля с Западом развивается успешнее, чем ожидалось. Быть может, теперь нам следует проявить больше инициативы и, опираясь на уже существующие торговые связи, расширить обмен и переговоры с ведущими членами Третьего интернационала. Помимо Коммуны, большой интерес к соглашению проявил и Лондон. Есть все основания полагать, что оно станет важной вехой в отношениях между пролетарскими государствами."
 RUS_future_foreign_032_desc:0 "«Оружие критики не может, конечно, заменить критики оружием». В окружении мировой реакции лишь сила позволит нам удержать завоёванные позиции. Военное строительство России восстанавливается, но одних наших усилий недостаточно. Обмен техническим опытом с западными товарищами поможет ещё больше укрепить оборону страны."
 RUS_future_foreign_046_desc:0 "Угроза германского империализма растёт с каждым днём. Никто не может точно сказать, когда железная пята прусского милитаризма вновь двинется против революции. Быть может, взаимные гарантии независимости между нами и Французской коммуной станут последним рубежом обороны перед лицом империализма..."
 RUS_future_foreign_047_desc:0 "«От каждого по способностям, каждому по потребностям» — в идеальном коммунистическом обществе это станет незыблемой основой. Хотя внутри страны ещё нет условий для полного осуществления этого принципа, мы должны первыми воплотить его в отношениях между пролетарскими государствами."
 RUS_future_foreign_056_desc:0 "Волну мировой революции не остановить. От Европы до Азии, от заводов до полей знамя пролетариата поднимается над всё новыми землями. Стены империализма падут, туман реформизма рассеется, а предательство оппортунистов будет осуждено историей. Искра революции переходит из одной страны в другую, пока не воспламенит каждый континент..."
