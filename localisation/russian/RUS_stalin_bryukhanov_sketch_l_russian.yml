 RUS_stalin_bryukhanov_sketch_events.1.t: "Неформальный набросок"
 RUS_stalin_bryukhanov_sketch_events.1.d: "Сегодня один из высокопоставленных работников хозяйственного ведомства чёрными чернилами нарисовал карикатуру на народного комиссара финансов Николая Брюханова, подвешенного за яички. Сталин случайно увидел рисунок и оставил на нём собственную приписку:\n\n«Членам Политбюро: За все нынешние и будущие грехи Брюханова следует подвесить за яички. Если выдержат — считать оправданным судом; если не выдержат — утопить в реке»."
 RUS_stalin_bryukhanov_sketch_events.1.a: "Я всего лишь пришёл рисовать набросок. Что вы делаете?"
