l_russian:
 RUS_east_asia_flavour.1.t:0 "Алеет Восток"
 RUS_east_asia_flavour.1.d:0 "«Революция в колониальных и полуколониальных странах должна прежде всего свергнуть гнёт иностранного империализма и создать независимое национальное государство; лишь затем, под руководством пролетарской партии, следует встать на некапиталистический путь развития».\n\nНа фоне нынешнего подъёма мировой революции в нашей стране всё шире разворачивается обсуждение интернациональной помощи. Особенно заметны голоса, обращающие внимание на революцию в Восточной Азии. Победа национального правительства в Нанкине укрепила веру большинства товарищей в будущее революционного Востока. В последнем номере «Правды» опубликована передовая статья, отмечающая, что пробуждение колониальных и полуколониальных народов Восточной Азии уже не ограничивается националистическими восстаниями старого типа. Великая восточная страна с населением в сотни миллионов человек собственной победой доказывает: цепи империализма в Азии можно разорвать.\n\nДалее авторы утверждают, что курс нанкинского правительства на новые Три народных принципа, его антиимпериалистическая позиция и первые шаги земельной реформы коренным образом изменили положение революции в Восточной Азии. Наша страна должна воспользоваться этой исторической возможностью и оказать революционному Востоку более решительную моральную и материальную поддержку. Некоторые товарищи даже предлагают как можно скорее направить в Нанкин официальную миссию военных советников и предоставить необходимое промышленное оборудование.\n\nОднако звучат и осторожные напоминания: путь восточноазиатской революции не будет лёгким. Империализм не пожелает добровольно покинуть этот континент, а следующий этап национального освобождения — переход к социалистическому пути развития — станет испытанием решимости и мудрости всех революционеров."
 RUS_east_asia_flavour.1.a:0 "Да здравствует революционный Китай!"
 RUS_east_asia_flavour.1.b:0 "Меня всё же больше интересуют наши друзья-большевики на Востоке…"
 RUS_east_asia_flavour.1.b.tt:0 "Хотите больше материалов о китайской революции? Возможно, стоит попробовать «§R长夜孤星§!»!"
