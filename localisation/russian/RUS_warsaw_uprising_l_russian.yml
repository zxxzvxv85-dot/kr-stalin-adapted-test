 RUS_future_foreign_policy_events.10.t:0 "Варшавское восстание"
 RUS_future_foreign_policy_events.10.d:0 "В 01:15 мощный взрыв раздался на арсенале в варшавском районе Прага. Началось вооружённое восстание, организованное Коммунистической партией Польши (MKP), Союзом профессиональных союзов (ZZZ) и находившимся в московской эмиграции Польским революционным комитетом. Повстанцы перерезали телефонные линии к Венскому вокзалу, заняли управление железных дорог и трамвайное депо Старого города.\n\nОсновные силы восставших насчитывали около трёх тысяч человек: рабочие дружины и перешедшие на их сторону польские солдаты. Вооружённые винтовками и ручными пулемётами, они возвели баррикады на Краковском предместье. В 02:40 повстанцы ворвались в варшавскую ратушу и разоружили охрану. В 03:15 была занята государственная радиостанция. Глава польского временного правительства §b[POL.GetRUSWarsawHeadOfGovernment]§! был захвачен и заключён в подвале Банка Польши.\n\nГерманская военная миссия в Польше срочно объявила военное положение во всём городе. Командующий германским гарнизоном Варшавы фон Безелер приказал бронеавтомобилям выдвинуться на Театральную площадь. В 05:20 в Мокотуве повстанцы встретили их бутылками с зажигательной смесью и перекрёстным огнём. Два бронеавтомобиля сгорели, уцелевшие подразделения отошли в казармы западных предместий.\n\nВ 06:00 Польская социалистическая партия (PPS) выступила в поддержку восстания и призвала рабочих ко всеобщей забастовке. Христианский союз национального единства (ChZJN) объявил о нейтралитете. Консульство Австрийской империи закрыло двери; австро-венгерские войска бездействовали.\n\nК 07:30 повстанцы контролировали два моста через Вислу. Остатки правительства §b[POL.GetName]§! отступили во дворец Радзивиллов. Германская военная миссия отправила в Берлин срочную телеграмму с просьбой о подкреплении.\n\nВ 08:00 Польский революционный комитет зачитал по радио Воззвание к польскому народу, объявив об упразднении монархии, выходе из Рейхспакта и создании Польской Советской Республики. Комитет призвал немедленно начать всеобщие забастовки и вооружённые восстания в Познани, Львове и других городах."
 RUS_future_foreign_policy_events.10.a:0 "Польский народ сам сбросит свои оковы."

 RUS_future_foreign_policy_events.11.t:0 "Стрела на тетиве"
 RUS_future_foreign_policy_events.11.d:0 "Начавшись как стихийная забастовка, волнения теперь охватили всю Варшаву. Первыми из цехов вышли текстильщики; вагоновожатые остановили трамваи, а печи в пекарнях остыли. К третьему дню крупные фабричные районы города объединились, и между рабочими кварталами и центром выросли баррикады. Наряду со старыми эмблемами польского рабочего движения на знамёнах появились новые слова: «Земля, хлеб, свобода».\n\nПоначалу канцелярия германского имперского наместника не придала происходящему значения. Расквартированных в Варшаве имперских войск хватило бы для подавления любых беспорядков. Но когда демонстранты двинулись из Праги к центру города, наместник обнаружил странности в передвижении войск: солдаты-поляки медлили с исполнением приказов, а некоторые даже отказывались поднимать винтовки против толпы.\n\nТем временем на каждом перекрёстке появились листовки Польского революционного комитета. Они призывали рабочих создавать советы депутатов, а крестьян — отказываться сдавать зерно гарнизонам. Ещё большую тревогу в Берлине вызвало то, что железнодорожники в некоторых местностях начали задерживать специальные составы, направлявшиеся в Германию. Пожары окрасили ночное небо Варшавы в красный цвет; выстрелы смешивались с песнями, доносясь от берегов Вислы до рабочих кварталов на окраинах.\n\nВремени на осторожное обдумывание у революционеров почти не осталось. Следует ли возглавить массовую забастовку? Сумеют ли варшавские партийные организации справиться с непредвиденными обстоятельствами? И успеют ли откликнуться на местах?"
 RUS_future_foreign_policy_events.11.a:0 "Смело поднимем наше красное знамя!"
 RUS_future_foreign_policy_events.11.a_tt:0 "Даже если завтрашний день народа столь туманен…\nБуря уже на пороге: Варшавское восстание вот-вот начнётся. Наша готовность к войне определит, смогут ли польские провинции откликнуться на революцию в столице."

 RUS_future_foreign_policy_events.12.t:0 "Волнения в Люблине"
 RUS_future_foreign_policy_events.12.d:0 "Наша официальная поддержка польской революции расширила возможности польских революционеров. За последние месяцы деньги и печатное оборудование, тайно переправленные через границу, принесли первые плоды в Люблине, Кельце и Жешуве. Подпольные типографии начали регулярно выпускать «Голос рабочего», а листовки появились у фабричных ворот, в солдатских столовых и на деревенских рынках. На эти средства Польский революционный комитет создал сеть связей среди железнодорожников и восстановил разгромленные низовые организации в шахтёрских районах и на текстильных фабриках.\n\nВаршавские власти не остались в неведении. В рабочих кварталах Люблина всё чаще появляются полицейские осведомители, непрерывно приходят сообщения об арестах и обысках. Но за каждой волной репрессий следуют ещё более массовые протесты. На прошлой неделе рабочие Люблинского паровозного завода стихийно объявили забастовку в знак протеста против ареста трёх товарищей; вскоре к ним присоединились трамвайщики и муниципальные рабочие всего города. Правительство направило конную полицию, но, увидев тысячи рабочих, преградивших путь у заводских ворот, она так и не решилась вмешаться."
 RUS_future_foreign_policy_events.12.a:0 "Момент назревает."
 RUS_future_foreign_policy_events.12.a_tt:0 "Всеобщая вера в революцию есть уже начало революции."
