l_russian:
 RUS_subcontinental_economic_aid:0 "Российско-индийская экономическая помощь"
 RUS_subcontinental_economic_aid_desc:0 "От Волги до Ганга взаимовыгодные торговые соглашения связывают усилия двух стран по строительству новой жизни. Сырьё, машины и технические знания пересекают границы, помогая рабочим и крестьянам в их общем деле."
 RUS_subcontinental_military_aid:0 "Российская военная помощь"
 RUS_subcontinental_military_aid_desc:0 "Борьба за единство Индии ещё не окончена. Российские военные советники работают плечом к плечу с местными революционерами, передавая опыт подготовки, снабжения и взаимодействия войск на фронтах субконтинента."
