l_russian:
 RUS_agri_business_header:0 "Сбыт/Почва"
 RUS_agri_preview_summary:0 "Без погоды и рынка: доход §Y[?RUS_agri_preview_receipts|1]§!  остаток §Y[?RUS_agri_preview_capital|1]§!  прибыль §Y[?RUS_agri_preview_profit|1]§!"
 RUS_agri_business_rules_tt:0 "Сбыт по полной цене: 3-5 единиц вложений в культуру за сезон. Следующие 2 единицы получают поправку -0.30 к множителю; остальные -0.70. Минимум каждой ступени: 0.40.\nВложения от 5 единиц или свыше половины всех вложений повышают истощение этой культуры на 1 в следующем сезоне. Вложения не более 2 без концентрации снижают его на 1; иначе оно неизменно. Уровень даёт -0.15, максимум 3; смена года его не снимает.\nЗаказы проверяются при расчёте. Премия: 0.65 от требуемых вложений в капитал и 1 очко при текущей или успешно завершённой реформе. До реформы или после её провала очки не выдаются. Премии не входят в доходность культур; капитал ограничен 30.\nБазовый расчёт не учитывает погоду и рынок, но включает выполненные по вложениям заказы. Неподтверждённый план в конце сезона заменяется равномерным распределением."
 RUS_agri_order_none:0 "Нет"
 RUS_agri_no_second_order:0 "В этом сезоне нет второго заказа"
