 RUS_agri_balance:0 "Поровну"
 RUS_agri_balance_tt:0 "Равномерно распределить доступные вложения между пятью культурами."
 RUS_agri_clear:0 "Очистить"
 RUS_agri_clear_tt:0 "Отменить все ещё не закреплённые вложения этого квартала."
 RUS_agri_confirm:0 "Подтвердить"
 RUS_agri_confirm_tt:0 "Закрепить текущий план. Неподтверждённый план будет заменён равномерным распределением в конце квартала."
 RUS_agri_reopen:0 "Изменить"
 RUS_agri_reopen_tt:0 "Снять закрепление и изменить план до конца квартала."
 RUS_agri_annual_shortfall:0 "Годовой сельскохозяйственный дефицит"
 RUS_agri_annual_shortfall_desc:0 "Прошлый хозяйственный год не сохранил государственные вложения, и гражданская экономика вынуждена покрывать дефицит."
 RUS_agri_annual_surplus:0 "Годовой сельскохозяйственный профицит"
 RUS_agri_annual_surplus_desc:0 "Прошлый хозяйственный год принёс устойчивый профицит для государственных нужд."
 RUS_agri_annual_bumper_surplus:0 "Крупный сельскохозяйственный профицит"
 RUS_agri_annual_bumper_surplus_desc:0 "Прошлый хозяйственный год принёс значительный профицит, облегчив нагрузку на гражданскую экономику и строительство."
 RUS_agricultural_management.1.t:0 "Годовой сельскохозяйственный расчёт"
 RUS_agricultural_management.1.d.shortfall:0 "Сводные книги за четыре квартала готовы. К концу года осталось лишь §Y[?RUS_agri_annual_ending_capital|1]§! капитала, что означает явный дефицит. Недостачу придётся покрыть гражданской экономике, а управление в следующем году ждёт более строгая проверка."
 RUS_agricultural_management.1.d.balanced:0 "Сводные книги за четыре квартала готовы. Итоговый капитал составляет §Y[?RUS_agri_annual_ending_capital|1]§!, то есть первоначальные вложения в целом сохранены. Праздновать нечего, но и новой нагрузки на экономику план не создал."
 RUS_agricultural_management.1.d.surplus:0 "Сводные книги за четыре квартала готовы. Итоговый капитал достиг §Y[?RUS_agri_annual_ending_capital|1]§!, обеспечив устойчивый профицит, который в следующем году снизит нагрузку на гражданскую экономику."
 RUS_agricultural_management.1.d.bumper:0 "Сводные книги за четыре квартала готовы. Итоговый капитал достиг §Y[?RUS_agri_annual_ending_capital|1]§!, намного превысив первоначальные вложения. План дал крупный профицит и высвободил дополнительные ресурсы для строительства."
 RUS_agricultural_management.1.a:0 "Утвердить счета и начать следующий год."
 RUS_agri_emergency_annual_cap_tt:0 "§YВ этом году использовался чрезвычайный аванс; годовая награда не может превысить средний уровень профицита.§!"
