l_russian:
 RUS_agricultural_quarterly_management_start_category:0 "Подготовка сельскохозяйственного управления"
 RUS_agricultural_quarterly_management_start_category_desc:0 "Система квартального управления не начнёт работу, пока государство официально не запустит первый хозяйственный план."
 RUS_agricultural_quarterly_management_category:0 "Квартальное управление сельским хозяйством"
 RUS_agricultural_quarterly_management_category_desc:0 "Государственные сельскохозяйственные учреждения вкладывают ограниченный оборотный капитал в пять культур и подводят итоги каждого квартала с учётом сезона, конъюнктуры и насыщения рынка."
 RUS_start_agricultural_quarterly_management:0 "Начать квартальный сельскохозяйственный план"
 RUS_start_agricultural_quarterly_management_desc:0 "Западные торговые каналы вновь открыты, и мы можем испытать государственную систему квартальных вложений в сельское хозяйство. Панель управления откроется только после завершения этого решения."

