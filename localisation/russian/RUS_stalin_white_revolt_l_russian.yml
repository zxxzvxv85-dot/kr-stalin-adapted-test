l_russian:
 RUS_white_revolt_category: "Белое контрнаступление"
 RUS_white_revolt_category_desc: "Старый офицерский корпус отказывается признать Временное социалистическое правительство. Красная армия должна за девяносто дней взять под контроль подступы к Петрограду и Царицыну."
 RUS_white_revolt_deadline: "Девяносто дней новой власти"
 RUS_white_revolt_deadline_desc: "Если белые опорные пункты в Петрограде и Царицыне не будут уничтожены вовремя, военные свергнут Временное социалистическое правительство."
 RUS_white_revolt_status: "Положение на красных фронтах"
 RUS_white_revolt_status_desc: "Подступы к Петрограду: §Y[?RUS_white_revolt_petrograd_progress|0]§!/§Y[?RUS_white_revolt_petrograd_required|0]§!\nПодступы к Царицыну: §Y[?RUS_white_revolt_tsaritsyn_progress|0]§!/§Y[?RUS_white_revolt_tsaritsyn_required|0]§!\n\nКонтроль всех доступных подступов откроет последнюю операцию на соответствующем направлении. Области, не контролируемые Россией, не учитываются."
 RUS_bolshevik_rifle_support: "Поддержка большевиков"
 RUS_bolshevik_rifle_support_desc: "Вернувшиеся большевистские военные кадры готовы вооружить железнодорожников, красногвардейцев и срочно сформированные части."
 RUS_bolshevik_rifle_support_tt: "Потеряно §R5000§! единиц стрелкового оружия; получено §G25§! ед. командного ресурса."
 RUS_red_army_advance: "Наступление на [FROM.GetName]"
 RUS_red_army_advance_desc: "Красная гвардия и верные революции части очистят местные белые позиции и возьмут под контроль железные дороги, мосты и телеграф."
 RUS_encircle_petrograd_whites: "Окружить петроградских белых"
 RUS_encircle_petrograd_whites_desc: "После захвата окружающих железных дорог белые казармы и штабы в Петрограде можно изолировать и принудить к сдаче."
 RUS_cut_off_tsaritsyn_whites: "Отрезать царицынских белых"
 RUS_cut_off_tsaritsyn_whites_desc: "Согласованное наступление отрежет последние пути белых к Дону и нижней Волге."
 RUS_defend_against_white_counterattack: "Отразить белую контратаку"
 RUS_defend_against_white_counterattack_desc: "Белые наступают на §Y[event_target:RUS_white_revolt_counterattack_state.GetName]§!. Необходимо немедленно направить резервы."
 RUS_white_revolt_counterattack_mission: "Белая контратака"
 RUS_white_revolt_counterattack_mission_desc: "Без подкреплений наши силы в области §Y[event_target:RUS_white_revolt_counterattack_state.GetName]§! будут выбиты."
 RUS_white_revolt_cp_10: "£command_power §Y10§!"
 RUS_white_revolt_cp_10_blocked: "£command_power §R10§!"
 RUS_white_revolt_cp_15: "£command_power §Y15§!"
 RUS_white_revolt_cp_15_blocked: "£command_power §R15§!"
 RUS_white_revolt_cp_20: "£command_power §Y20§!"
 RUS_white_revolt_cp_20_blocked: "£command_power §R20§!"
 RUS_white_revolt_start_tt: "Завершает национальный фокус §Y«Красное знамя над Кремлём»§!.\nОткрывает решения категории §Y«Белое контрнаступление»§!.\nПолучено §G30§! ед. командного ресурса.\nБелые опорные пункты в Петрограде и Царицыне необходимо уничтожить за §Y90 дней§!."
 RUS_white_revolt_victory_tt: "§GРеволюция победила.§!\nСоциалистическая Россия будет официально провозглашена."
 RUS_white_revolt_failure_tt: "§RРеволюция потерпела поражение.§!\nВоенные создадут временное правительство и восстановят республику."
 RUS_red_army_advance_tt: "После завершения операции Красная армия возьмёт под контроль пути сообщения в области §Y[FROM.GetName]§!."
 RUS_encircle_petrograd_whites_tt: "После завершения операции §GПетроградское направление будет обеспечено§!."
 RUS_encircle_petrograd_whites_available_tt: "Контролировать Петроград и все окружающие цели, остающиеся под властью России; белая контратака не должна продолжаться."
 RUS_cut_off_tsaritsyn_whites_tt: "После завершения операции §GЦарицынское направление будет обеспечено§!."
 RUS_cut_off_tsaritsyn_whites_available_tt: "Контролировать Царицын и все окружающие цели, остающиеся под властью России; белая контратака не должна продолжаться."
 RUS_defend_against_white_counterattack_tt: "Удержать §Y[event_target:RUS_white_revolt_counterattack_state.GetName]§! и не позволить белым восстановить позиции."
 RUS_white_revolt_counterattack_failure_tt: "Если оборона не будет организована вовремя, область §Y[event_target:RUS_white_revolt_counterattack_state.GetName]§! будет потеряна и её придётся очищать заново."
 russia_events.926.d: "Через несколько дней после смерти Савинкова верхушка так называемого Союза защиты Родины и Свободы рассеялась: одни были арестованы или расстреляны, другие бежали. Лишь генералы Владимир Манштейн и Антон Туркул сохранили влияние на гарнизоны под Москвой и решились на контрпереворот. С кавалерией и броневой колонной они ненадолго ворвались в южные районы столицы и заняли несколько важных позиций.\n\nЗаговорщики рассчитывали, что московский гарнизон массово перейдёт под знамёна их «Белой гвардии». Однако откликнулись немногие: город больше не желал умирать за погибшего Вождя.\n\nПосле короткого боя под Звенигородом основные силы мятежников капитулировали. Манштейна доставили в военный трибунал и немедленно расстреляли.\n\nНо волна контрреволюции ещё не утихла. Во многих провинциальных гарнизонах белые офицеры отказались подчиниться и подняли части против временного правительства. Под единым командованием фельдмаршала Маркова реакционные формирования быстро собираются, готовясь задушить революцию."
 russia_events.926.a: "Приказать им сложить оружие!"
 rus_stalin_white_revolt_events.1.t: "Белые отказываются сложить оружие"
 rus_stalin_white_revolt_events.1.d: "Переворот Манштейна рухнул на улицах Москвы, а сам генерал погиб в суматохе. Однако старая армия не приняла революцию. Офицеры захватили казармы и железнодорожные узлы вокруг Петрограда, а остатки белых собираются у Царицына.\n\nУ временного правительства мало надёжных регулярных частей. Красная гвардия, революционные матросы и верные железнодорожники должны открыть пути к обоим городам раньше, чем белые объединят силы."
 rus_stalin_white_revolt_events.1.a: "Направить красных к Петрограду и Царицыну!"
 rus_stalin_white_revolt_events.2.t: "Белая крепость Петроград"
 rus_stalin_white_revolt_events.2.d: "Военные училища, гвардейские казармы и старые морские учреждения стали опорными пунктами белых. Если дороги через Лугу, Олонец и Званск останутся у них, революционные матросы будут отрезаны от внутренних районов."
 rus_stalin_white_revolt_events.2.a: "Колыбель революции не должна пасть."
 rus_stalin_white_revolt_events.3.t: "Южные офицеры собираются в Царицыне"
 rus_stalin_white_revolt_events.3.d: "Донские офицеры, казаки и контрреволюционные отряды стекаются к Царицыну. Они намерены использовать волжские пути, объединить южных белых и двинуться на Москву. Миллерово, Камышин, Покровск и Великокняжеск решат судьбу их подкреплений."
 rus_stalin_white_revolt_events.3.a: "Перерезать все пути отхода."
 rus_stalin_white_revolt_events.4.t: "Белые контратакуют"
 rus_stalin_white_revolt_events.4.d: "Белое командование бросило резервы против области §Y[event_target:RUS_white_revolt_counterattack_state.GetName]§!. Местная Красная гвардия просит немедленных подкреплений."
 rus_stalin_white_revolt_events.4.a: "Подготовить оборону!"
 rus_stalin_white_revolt_events.5.t: "Красная линия прорвана"
 rus_stalin_white_revolt_events.5.d: "Подкрепления не успели прибыть в область §Y[event_target:RUS_white_revolt_counterattack_state.GetName]§!. Железная дорога и телеграф вновь оказались в руках белых."
 rus_stalin_white_revolt_events.5.a: "Придётся взять её снова."
 rus_stalin_white_revolt_events.6.t: "Петроградские белые капитулируют"
 rus_stalin_white_revolt_events.6.d: "После перерезания железных дорог белый гарнизон быстро израсходовал продовольствие и боеприпасы. Революционные матросы и красногвардейцы взяли последние казармы, и над колыбелью революции вновь поднят красный флаг."
 rus_stalin_white_revolt_events.6.a: "Петроград в безопасности."
 rus_stalin_white_revolt_events.7.t: "Царицынские белые уничтожены"
 rus_stalin_white_revolt_events.7.d: "Красная армия одновременно заняла железные дороги и переправы через Волгу. Казачьи части распались, а оставшиеся офицеры сдались после неудачной попытки прорыва. Южная контрреволюция сломлена."
 rus_stalin_white_revolt_events.7.a: "Царицын принадлежит революции."
 rus_stalin_white_revolt_events.8.t: "Белые свергают временное правительство"
 rus_stalin_white_revolt_events.8.d: "Девяносто дней прошли, но Петроград и Царицын так и не были одновременно усмирены. Белые объединились по уцелевшим железным дорогам и начали решающее наступление на Москву. Охрана временного правительства была разбита за несколько часов.\n\nВоенные приняли власть и обещали вновь созвать Учредительное собрание после восстановления порядка. Русская революция снова потерпела поражение."
 rus_stalin_white_revolt_events.8.a: "Военные восстановят республику."
 rus_stalin_white_revolt_events.9.t: "Революция выдержала испытание"
 rus_stalin_white_revolt_events.9.d: "Белые опорные пункты в Петрограде и Царицыне уничтожены. Старая армия лишилась последних центров координации общероссийской контрреволюции. Временное социалистическое правительство стало реальной силой, определяющей судьбу России."
 rus_stalin_white_revolt_events.9.a: "Теперь построим социалистическую Россию."
 rus_stalin_white_revolt_events.11.t: "Лужская железная дорога вновь открыта"
 rus_stalin_white_revolt_events.11.d: "Южные пути к Петрограду сходятся у Луги, поэтому белые превратили станцию в засов на воротах столицы. Рельсы в направлении Москвы были разобраны, северную платформу прикрывал бронепоезд, а окрестных крестьян заставили рыть траншеи. Почти каждый мост на пути красных оказался взорван.\n\nИсход боя изменили железнодорожники. Ночью они сняли заряды в паровозном депо и вывели спрятанный маневровый паровоз к красным позициям. На рассвете красногвардейцы ворвались на станцию в товарных вагонах, пока верные части наступали с юга. К полудню белый бронепоезд отступил к Петрограду, а первый состав с хлебом и боеприпасами уже отправился на север."
 rus_stalin_white_revolt_events.11.a: "Ворота к Петрограду открыты."
 rus_stalin_white_revolt_events.12.t: "Красные знамёна в олонецких лесах"
 rus_stalin_white_revolt_events.12.d: "В Олонце не было широких дорог для большой армии. Белые офицеры использовали озёра, леса и заброшенные лесопилки для устройства засад на красные колонны. После исчезновения нескольких связных отрядов фронт некоторое время зависел от лыжных посыльных.\n\nМестные лесорубы и вернувшиеся с фронта солдаты передали красным карту лесных троп. Лёгкие отряды обошли заставы и до рассвета захватили телефонную станцию и склады. Лишённые связи белые посты быстро рассеялись. Теперь красные ленты отмечают каждый лесной указатель, а северный обход находится в руках революции."
 rus_stalin_white_revolt_events.12.a: "Даже леса встали на сторону революции."
 rus_stalin_white_revolt_events.13.t: "Мост через Волхов"
 rus_stalin_white_revolt_events.13.d: "Званск контролировал переправы через Волхов и железную дорогу к востоку от Петрограда. Белые заложили мост взрывчаткой, намереваясь уничтожить его при отступлении и сорвать окружение города. Пулемёты круглосуточно следили за опорами.\n\nВместо лобового штурма матросы и рабочие электростанции спустились по реке на барже и перерезали провода под мостом. Затем заводские гудки призвали рабочих занять станцию. Обнаружив мост целым, а путь отхода перерезанным, белый гарнизон бросил тяжёлое оружие и бежал на запад. Восточное кольцо замыкается."
 rus_stalin_white_revolt_events.13.a: "Пустить поезда через Волхов."
 rus_stalin_white_revolt_events.14.t: "Бой за узел Миллерово"
 rus_stalin_white_revolt_events.14.d: "Миллерово связывало Донскую область с белыми в Царицыне. Через станцию шли офицеры, казаки и боеприпасы с юга. Белые полагали, что открытая степь и превосходство конницы не позволят перерезать эту линию.\n\nКрасная пехота спряталась в вагонах с углём, а сочувствующие стрелочники направили состав к военной платформе. Красногвардейцы заняли сигнальную башню, пока конница перерезала телеграф и закрыла южный переезд. Белые отступили к Дону, оставив десятки вагонов с винтовками, снарядами и продовольствием."
 rus_stalin_white_revolt_events.14.a: "Их жизненная линия перерезана."
 rus_stalin_white_revolt_events.15.t: "Волжская флотилия у Камышина"
 rus_stalin_white_revolt_events.15.d: "Камышин служил перевалочным портом для снабжения Царицына по Волге. Вооружённые буксиры контролировали реку, а склады были заполнены реквизированной мукой. Пока порт оставался у белых, Царицын нельзя было полностью изолировать.\n\nНочью красные артиллеристы подняли лёгкие орудия на западные высоты и на рассвете открыли огонь. Докеры закрыли угольные склады и вывели из строя лебёдки. Когда один буксир поднял красный флаг и развернул пушку, остальные вскоре сдались. Порт и зерно теперь принадлежат революции."
 rus_stalin_white_revolt_events.15.a: "Кто контролирует реку, тот контролирует Царицын."
 rus_stalin_white_revolt_events.16.t: "Рабочее восстание в Покровске"
 rus_stalin_white_revolt_events.16.d: "На противоположном от Царицына берегу Волги Покровск располагал железнодорожными мастерскими, пристанями и складами. Белые арестовывали профсоюзных активистов, но подпольный комитет продолжал передавать красным ремонтные ведомости и грузовые списки.\n\nВ ночь прибытия красных рабочие включили воздушную тревогу как сигнал к восстанию. Они захватили оружейную, перекрыли дороги к пристани и заблокировали путь недостроенными паровозами. Белое подкрепление попало под огонь из мастерских и с водонапорных башен. Утром красные части встретились с рабочими дружинами у станции."
 rus_stalin_white_revolt_events.16.a: "Рабочие сами освободили свой город."
 rus_stalin_white_revolt_events.17.t: "Конница в великокняжеской степи"
 rus_stalin_white_revolt_events.17.d: "Великокняжеск лежал на степных дорогах к Дону и Кавказу. Белые собирали здесь конницу, отбирали у деревень лошадей и обещали восстановить старый земельный порядок после взятия Москвы. Бедные казаки не верили ни обещаниям, ни офицерам.\n\nКрасные агитаторы пообещали рядовым всадникам возможность вернуться домой после сдачи оружия. Попытка казнить посланцев вызвала мятеж двух полков. С началом боя мятежники ворвались в белый штаб, а красная конница перекрыла северную дорогу. Через полдня белые знамёна исчезли со степи, и многие бывшие призывники присоединились к красным."
 rus_stalin_white_revolt_events.17.a: "Пусть теперь они сражаются за народ."
 rus_stalin_white_revolt_events.18.t: "Красное знамя над Сибирью"
 rus_stalin_white_revolt_events.18.d: "Бескрайняя Сибирь долго оставалась последним убежищем остатков Белой армии. Однако всеобщая мобилизация сельской Красной гвардии и проникновение Движения интеграции лишили реакционеров покоя даже на этой промёрзшей земле. Под единым руководством Ворошилова и Жданова красногвардейцы ударили из железнодорожных посёлков и городских окраин, а регулярные части Красной армии замкнули кольцо и перерезали все пути сообщения между восточными и западными отрядами белых.\n\nЗа несколько недель белые опорные пункты утонули в народном море. Омский гарнизон был окружён до начала прорыва, и уже на следующее утро над городом поднялся красный флаг. В Новониколаевске целые роты сложили оружие, а многие солдаты перешли к красногвардейцам. В Иркутске агенты Движения интеграции разрушили белый штаб изнутри. Отдельные отряды пытались удерживаться в деревнях и лесах, но повторные зачистки быстро заглушили выстрелы среди снегов. В руки революции попали винтовки, пулемёты, боеприпасы и целые склады.\n\nНа Дальнем Востоке атаман Семёнов попытался собрать казачью конницу и вооружённых беглых помещиков вдоль восточного участка Транссибирской магистрали. Прежде чем его приказы дошли до всех лагерей, партизаны взорвали запасной склад боеприпасов, а Красная гвардия перерезала путь к Приморью. Казачья конница была разбита артиллерией на замёрзших реках, обозы увязли в снежной грязи. Бросив знамёна и тяжёлое оружие, Семёнов с несколькими десятками приближённых бежал в Маньчжурию.\n\nПосле разгрома его войск сибирское большевистско-левоэсеровское правительство признало власть временного правительства. Красные знамёна подняты от Урала до Тихого океана. Железные дороги снова везут на запад хлеб и уголь, сдавшиеся солдаты проходят переустройство, а новая власть прочно укоренилась на огромной территории. К востоку от Урала организованного белого сопротивления больше нет."
 rus_stalin_white_revolt_events.18.a: "Отличная работа, товарищи!"
 rus_stalin_white_revolt_events.19.t: "О работе партии"
 rus_stalin_white_revolt_events.19.d: "Иосиф Сталин\n\nНекоторые товарищи полагают, что раз наша партия стала правящей, раз рабочий класс взял власть, социалистическое сознание само собой, стихийно вырастет в массах и потому партия может не заботиться о систематическом воспитании. Это грубейшая ошибка, товарищи, гнилое преклонение перед стихийностью и самое откровенное хвостовство.\n\nВред этой точки зрения состоит в том, что она стирает различие между пролетарским авангардом и широкими массами, снижает уровень партии до среднего уровня рядового рабочего и отрицает роль партии как передового отряда и политического вождя рабочего класса. В «Что делать?» товарищ Ленин раз и навсегда разбил это экономистское заблуждение. Поклонение стихийности ослабляет социалистическое сознание и расчищает дорогу буржуазной идеологии, ибо стихийное развитие рабочего движения подчиняет его этой идеологии.\n\nЧто такое партия? Это авангард пролетариата, высшая форма его организации. Её задача не в том, чтобы плестись в хвосте масс и записывать их настроения, а в том, чтобы идти впереди, руководить ими и поднимать их до уровня социалистического сознания. Если партия не вносит социалистическое сознание в рабочее движение, для чего она нужна? Чтобы быть хвостом профсоюзов или рупором стихийных настроений беспартийных масс? Нет, товарищи. Вся работа партии состоит в вооружении рабочего класса революционной теорией и соединении социалистического сознания с рабочим движением. Без этого не будет ни подлинной пролетарской партии, ни победы революции, ни укрепления диктатуры пролетариата."
 rus_stalin_white_revolt_events.19.d_2: "Перед нами стоит грандиозная задача социалистического строительства. Но остатки буржуазного мышления не исчезли с крушением старого строя. Они сидят в сознании людей, прячутся в тысяче мелочей быта и постоянно воспроизводятся. Мелкобуржуазная стихия окружает и опутывает рабочий класс частнособственническими привычками, спекуляцией, националистическими предрассудками и бюрократизмом. Международный капитализм также стремится к реставрации посредством подкупа, шпионажа и идеологического проникновения.\n\nЧто означает ослабление идейно-воспитательной работы партии? Это значит дать буржуазной идеологии свободно разливаться и уступить наши позиции врагу. Недооценивать социалистическое воспитание — значит объективно помогать буржуазии и готовить реставрацию капитализма. Это не запугивание, а железная действительность.\n\nКаковы же нынешние задачи партии?"
 rus_stalin_white_revolt_events.19.a: "Прежде всего следует ясно определить задачи партии."
 rus_stalin_white_revolt_events.20.d: "Во-первых, необходимо усилить марксистско-ленинское теоретическое образование внутри партии. Нельзя терпеть барского равнодушия к вопросам теории. Наши кадры, особенно молодые, должны овладеть наукой марксизма-ленинизма: лишь теория позволяет правильно оценивать обстановку, предвидеть ход событий и не терять политического направления. Тот, кто думает заменить теоретическую подготовку одним практическим опытом, близорук и неизбежно оступится в политике.\n\nВо-вторых, идейное воспитание должно проникнуть в рабочий класс и во все трудящиеся массы. Заводы, колхозы, школы, газеты и клубы должны стать опорными пунктами социалистического сознания. На языке масс, живыми фактами и конкретными примерами рабочим и крестьянам следует объяснять, что такое социализм и капитализм, каковы характер и цель нашей борьбы. Каждый трудящийся должен связать свою судьбу с судьбой Советского государства и сознательно, преданно, с энтузиазмом бороться за социализм.\n\nВ-третьих, на идеологическом фронте необходима непримиримая борьба. Нельзя оставлять лазеек оппортунизму, национализму, религиозным предрассудкам и буржуазному влиянию. Критика и самокритика — острое оружие партии, и его нельзя откладывать. Боязнь вскрывать ошибки и бороться с ложными уклонами есть гнилой либерализм, несовместимый с большевизмом. Партийный работник должен быть не безобидным добряком, боящимся кого-либо задеть, а принципиальным политическим бойцом, который резко, открыто и честно разоблачает всякое отступление от марксизма-ленинизма, от кого бы оно ни исходило.\n\nНекоторые товарищи спрашивают: не вызовет ли это недовольства и напряжения? Большевики никогда не работали посредством заигрывания с массами. Либеральный обыватель, боящийся критики, — самый ненадёжный «коммунист». Его слабость и стремление замять конфликт вредят партии больше открытого врага. Открытого врага видно и можно точно поразить; обыватель же прикрывает гниль «интересами партии» и разлагает её боеспособность."
 rus_stalin_white_revolt_events.20.a: "Партия должна быть принципиальным политическим бойцом."
 rus_stalin_white_revolt_events.21.d: "Товарищи! Наша партия росла и закалялась в борьбе. Во мраке царского самодержавия, под бешеными ударами белых в Гражданской войне, в смертельной борьбе с реакцией она преодолела бесчисленные трудности. Источником её силы были вооружённость марксистской теорией, безграничная преданность делу рабочего класса, стальное единство и железная дисциплина.\n\nТеперь, когда одержана великая историческая победа, нельзя допустить ни малейшего ослабления. Чем благоприятнее положение, тем сильнее должны быть идейная работа и революционная бдительность. Нужно помнить о капиталистическом окружении, о том, что классовый враг не спит и всё ещё мечтает восстановить корни капитализма в Советском Союзе.\n\nВнесение социалистического сознания в рабочее движение всегда было линией нашей партии: вчера, сегодня и завтра. Тот, кто принижает или расшатывает эту линию, помогает врагу, подрывает социалистическое строительство и прокладывает путь реставрации капитализма.\n\nНаша партия сильна, потому что вооружена марксизмом-ленинизмом. Она непобедима, потому что связана плотью и кровью с рабочим классом и всеми трудящимися. Мы должны беречь её идейную чистоту и организационное единство как зеницу ока. Ещё твёрже, настойчивее и искуснее мы должны объединить миллионы под знаменем марксизма-ленинизма и с несокрушимой большевистской решимостью идти к коммунизму.\n\nОтказ от иллюзий стихийности и решительное, систематическое внесение социалистического сознания в массы — вот вся сущность работы партии."
 rus_stalin_white_revolt_events.21.a: "Это надёжная гарантия диктатуры пролетариата и построения социализма."
 rus_stalin_white_revolt_events.22.t: "Об «Интеграционном движении»"
 rus_stalin_white_revolt_events.22.d: "Хотя большевики потерпели поражение в Гражданской войне, их политическое влияние сохраняется до сих пор.\n\nПод руководством большевистской верхушки террористическая организация, созданная Климентом Ефремовичем Ворошиловым и Андреем Александровичем Ждановым, продолжает отчаянную борьбу против военных на бескрайних сибирских равнинах.\n\nНаибольшую известность им принесла неудачная попытка убийства фельдмаршала Корнилова, предпринятая вместе с максималистами ПСР во время кампании против Фэнтяня. Власти потратили огромные силы и средства на поиски, но так и не нанесли «Интеграционному движению» действенного удара. Напротив, преследование сделало его знаменитым и превратило в духовный символ уцелевших красных бандитов.\n\nПоследние донесения Ставки и проверки на местах заставляют признать: нынешнее наступление не способно завершить войну в короткий срок. Первобытные леса и болота к востоку от Енисея дают банде Ворошилова и Жданова естественное убежище, а децентрализованные ячейки сводят на нет традиционную схему зачистки «крепость — железная дорога». Ещё тревожнее то, что длительная изоляция и зависимость от снабжения породили пассивное сосуществование террористов с частью отдалённых поселений. Граница между своими и чужими становится всё менее различимой..."
 rus_stalin_white_revolt_events.22.a: "Эти дураки всё ещё живут в 1917 году?!"
 RUS_stalin_post_white_revolt_events.1.t: "Казанский инцидент"
 RUS_stalin_post_white_revolt_events.1.d: "Гражданская война идёт далеко не так гладко, как мы рассчитывали. В Казани вспыхнули ожесточённые вооружённые столкновения между стихийно возникшими сельскими коммунами и местными вооружёнными силами. Подобные конфликты время от времени происходят и в других районах, обнажая всё более острое коренное противоречие: вопрос о земле.\n\nУ прежних либеральных правительств было несколько лет, но земельный вопрос так и не был решён окончательно. Центральные декреты давно существуют на бумаге, однако слабость местной администрации, ненадёжность низового аппарата и послевоенный хаос тормозят их исполнение. В Казани и её окрестностях кулаки воспользовались вакуумом власти и под видом «арендных договоров» и «долговых обязательств» сохранили фактический контроль над землёй. Бедняки и ветераны Красной армии тем временем всё сильнее возмущаются тем, что обещанные наделы до них так и не дошли. Радикалы сельских коммун решили, что «декретов уже достаточно, не хватает лишь действия», вооружились и попытались вернуть землю напрямую. Местные войска, получив приказ «поддерживать порядок и защищать всякую законную собственность», преградили им путь. Ни одна сторона не уступила, и спор перерос в крупное вооружённое столкновение.\n\nЕщё опаснее то, что конфликт быстро приобрёл политический смысл, далеко выходящий за рамки земельного спора. Местные кулаки и старые кооперативные круги объявили себя «защитниками порядка от новой большевистской тирании», тогда как органы безопасности сообщают, что в радикальные выступления части сельских коммун «могли проникнуть белые агитаторы». В Казани противоречие, которое ещё можно было уладить, обе стороны мгновенно истолковали как «схватку революции с контрреволюцией». Именно такое толкование стало самым опасным побочным следствием затянувшегося земельного преобразования..."
 RUS_stalin_post_white_revolt_events.1.a: "Это будет борьба не на жизнь, а на смерть..."
 RUS_stalin_post_white_revolt_events.1.a_tt: "Земельную реформу §Rбольше нельзя откладывать§!! Участие некоторых товарищей — «сельских большевиков» — может помочь этой работе."
