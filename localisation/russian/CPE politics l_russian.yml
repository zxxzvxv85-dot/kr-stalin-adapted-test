l_russian:
  communist: "Коммунистическая"
  communist_noun: "Коммунизм"
  communist_desc: "Коммунизм"
  marxist_subtype: "Марксизм"
  left_communist_subtype: "Левый коммунизм"
  leninist_subtype: "Ленинизм"
  marxism_leninism_subtype: "Марксизм-ленинизм"
  right_communist_subtype: "Правый коммунизм"
  maoist_subtype: "Маоизм"
  marxist_subtype_desc: "Марксизм — социалистическое течение, основанное на классовой борьбе, коллективной собственности на средства производства и политической программе, выведенной из трудов Карла Маркса."
  left_communist_subtype_desc: "Левый коммунизм — ленинистское течение, подчёркивающее индустриализацию, международную революцию и противостояние социализму в одной стране."
  leninist_subtype_desc: "Ленинизм — марксистское течение, сосредоточенное на дисциплинированной авангардной партии, ведущей революцию и управляющей после победы через партийное обсуждение."
  marxism_leninism_subtype_desc: "Марксизм-ленинизм — теоретическая система, сложившаяся из соединения марксизма и ленинизма. Она использует диалектический и исторический материализм как мировоззрение и метод, рассматривает развитие общества как результат противоречий между производительными силами и производственными отношениями, а также между экономическим базисом и надстройкой, анализирует капиталистическую эксплуатацию и прибавочную стоимость, подчёркивает руководство пролетарской партии, социалистическую революцию и диктатуру пролетариата с конечной целью уничтожения классовой эксплуатации и построения коммунистического общества."
  right_communist_subtype_desc: "Правый коммунизм"
  maoist_subtype_desc: "Маоизм приспосабливает марксизм-ленинизм к массовой мобилизации, крестьянской революционной войне и непрерывной классовой борьбе."
  communist_drift: "Ежедневная поддержка коммунистов"
  communist_acceptance: "Принятие коммунистической дипломатии"
  RUS_stalin_MHC_organiser: "$KR_MHC_organiser$"
  FACTION_NAME_COMMUNIST_1: "Коммунистический интернационал"
  KR_is_socialist: "$government_is_loc$§Y$totalist$§!, §Y$communist$§!, §Y$syndicalist$§! или §Y$radical_socialist$§!"
  KR_is_socialist_NOT: "$government_is_not_loc$§Y$totalist$§!, §Y$communist$§!, §Y$syndicalist$§! или §Y$radical_socialist$§!"
