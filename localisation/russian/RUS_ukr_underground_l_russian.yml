 RUS_ukr_status:0 "Украинское подполье"
 RUS_ukr_status_desc:0 "Сила организации: §Y[?RUS_ukr_strength|0]§! / §Y100§!\nБдительность правительства: §Y[?RUS_ukr_alert|0]§! / §Y100§!\n\nШахтёрская сеть: [RUSUkrMineState]\nСельская сеть: [RUSUkrRuralState]\nЖелезнодорожная сеть: [RUSUkrRailState]\n\nТекущая операция: [RUSUkrActionState]\nДо завершения операции: §Y[?RUS_ukr_days|0]§! дн.\nДо окончания блокировки: §Y[?RUS_ukr_lockdown_days|0]§! дн.\n\n§YПравила бдительности§!\nПосле §Y30§! дней бездействия в мирное время: бдительность §G−5§!.\nПри бдительности §Y50§!: дополнительные затраты политической власти §R+10§! (кроме переправки кадров).\nПри бдительности §Y80§!: завершение мирной операции вызывает облаву."
 RUS_ukr_network_missing:0 "§gНе создана§!"
 RUS_ukr_network_active:0 "§GДействует§!"
 RUS_ukr_network_disabled:0 "§RВременно недоступна§!"
 RUS_ukr_idle:0 "Ожидание"
 RUS_ukr_raid:0 "Облава"
 RUS_ukr_locked:0 "Блокировка"
 RUS_ukr_unlock_tt:0 "Открывает дипломатические решения украинского подполья: создание сетей, накопление силы и контроль тревоги правительства."
 RUS_ukr_night_unlock_tt:0 "Открывает военное решение «Ночь на Днепре»."
 RUS_ukr_raid_evacuate_tt:0 "Потратить 30 политической власти; коэффициент заводов потребительских товаров +4% на 30 дней; сила -10; сохранить сети; тревога снижается до 40."
 RUS_ukr_raid_abandon_tt:0 "Сила -25; одна случайная действующая сеть отключается на 90 дней; тревога снижается до 40. Если условия операции утрачены, последствий нет."
 RUS_ukr_burden_2:0 "Субсидии подполью"
 RUS_ukr_burden_3:0 "Финансирование подпольных сетей"
 RUS_ukr_emergency_burden:0 "Средства на срочную эвакуацию"
 RUS_ukr_mine_strike:0 "Забастовка шахтёров Донбасса"
 RUS_ukr_land_agitation:0 "Земельные споры в деревне"
 RUS_ukr_rail_slowdown:0 "Саботаж на железной дороге"
 RUS_ukr_war_low:0 "Военный саботаж подполья"
 RUS_ukr_war_medium:0 "Согласованный саботаж подполья"
 RUS_ukr_war_high:0 "Масштабный саботаж подполья"
 RUS_ukr_war_mine:0 "Военные забастовки шахтёров"
 RUS_ukr_war_rural:0 "Срыв сельской мобилизации"
 RUS_ukr_war_attack:0 "Разведданные украинских железнодорожников"
 RUS_ukr_families:0 "Помочь семьям участников восстания"
 RUS_ukr_families_desc:0 "Восстание потерпело поражение, но семьи выживших не должны быть забыты. Тайная помощь может вернуть их доверие."
 RUS_ukr_mine:0 "Восстановить взаимопомощь шахтёров Донбасса"
 RUS_ukr_mine_desc:0 "Шахты Донбасса по-прежнему объединяют рабочих. Взаимопомощь восстановит связи разрозненных подпольных групп."
 RUS_ukr_rural:0 "Связаться с сельским социалистическим подпольем"
 RUS_ukr_rural_desc:0 "Боротьбисты и другие социалистические группы сохранились в деревне. Осторожные контакты откроют путь к сотрудничеству."
 RUS_ukr_rail:0 "Восстановить связи с железнодорожниками"
 RUS_ukr_rail_desc:0 "Железные дороги Украины соединяют города и промышленные районы, а вместе с ними и рабочие организации."
 RUS_ukr_relocate:0 "Переправить подпольные кадры"
 RUS_ukr_relocate_desc:0 "Полиция сжимает кольцо. Переправка раскрытых кадров в безопасное место поможет сохранить связи."
 RUS_ukr_declaration:0 "Напечатать совместную декларацию подполья"
 RUS_ukr_declaration_desc:0 "Совместная декларация не обязана скрывать разногласия, чтобы дать разрозненной оппозиции общий голос."
 RUS_ukr_strike:0 "Поддержать забастовку шахтёров"
 RUS_ukr_strike_desc:0 "В шахтах растёт недовольство. Поддержка забастовки позволит направить это давление на правительство гетмана."
 RUS_ukr_land:0 "Распространить земельные реестры"
 RUS_ukr_land_desc:0 "Споры о перераспределении земли не утихли. Распространение реестров вновь вынесет их на всеобщее обсуждение."
 RUS_ukr_slowdown:0 "Организовать саботаж на железной дороге"
 RUS_ukr_slowdown_desc:0 "Одна задержка может быть случайной, но череда задержек нарушит всю транспортную систему. Железнодорожники способны поддержать это давление."
 RUS_ukr_night:0 "Ночь на Днепре"
 RUS_ukr_night_desc:0 "Война началась. Сети вдоль Днепра выступят одновременно, превратив долгую подготовку в возможность для фронта."
 RUS_ukr_status_readonly_tt:0 "Эта строка показывает состояние."
 RUS_ukr_afford_tt:0 "Достаточно политической власти, силы и пехотного снаряжения для оплаты всех указанных затрат."
 RUS_ukr_no_active_action_tt:0 "Нет действующей операции на Украине"
 RUS_ukr_no_pending_raid_tt:0 "Нет неразрешённой облавы"
 RUS_ukr_no_lockdown_tt:0 "Подпольные связи не заблокированы"
 RUS_ukr_revolt_over_tt:0 "Антигетманское восстание завершилось"
 RUS_ukr_alert20_tt:0 "Тревога правительства не менее §Y20§!"
 RUS_ukr_two_networks_tt:0 "Действуют не менее §Yдвух§! сетей"
 RUS_ukr_mine_active_tt:0 "Шахтёрская сеть действует"
 RUS_ukr_rural_active_tt:0 "Сельская сеть действует"
 RUS_ukr_rail_active_tt:0 "Железнодорожная сеть действует"
 RUS_ukr_land_extra_cost_tt:0 "Укрепившаяся земельная реформа: дополнительно §Y10§! политической власти и §Y5§! силы."
 RUS_ukr_freeze_strength_tt:0 "Задействовать и зафиксировать всю силу подполья."
 RUS_ukr_lockdown_result_tt:0 "Тревога повышается до §R100§!. Связи блокируются на §Y90 дней§!, затем тревога снижается до §Y40§!."
 RUS_ukr_cancel_refund_tt:0 "Вернуть силу, задействованную в операции."
