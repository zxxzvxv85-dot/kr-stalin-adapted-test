 RUS_ukr_status:0 "Украинское подполье: [?RUS_ukr_strength|0] силы / [?RUS_ukr_alert|0] тревоги"
 RUS_ukr_status_desc:0 "Шахты: [RUSUkrMineState] | Село: [RUSUkrRuralState] | Железные дороги: [RUSUkrRailState]\nДействие: [RUSUkrActionState] | Осталось [?RUS_ukr_days|0] дн.\nБлокировка: [?RUS_ukr_lockdown_days|0] дн.\n30 дней без действий в мирное время: тревога -5. При тревоге 50 действия дороже на 10 политической власти, кроме переправки кадров. При 80 завершение мирного действия вызывает облаву.\nТекст события намеренно пуст. Платный выбор спасает кадры, бесплатный жертвует одной сетью. Обычная отмена сохраняет сети."
