 RUS_ukr_war_attack:0 "Разведданные украинских железнодорожников"
 RUS_ukr_families:0 "Помочь семьям участников восстания"
 RUS_ukr_families_desc:0 "Политическая власть: 25. При тревоге 50 доплата 10. Пехотное снаряжение: 0. Сила: 0. Срок: 30 дн. Коэффициент заводов потребительских товаров +2% на время действия. Перерыв после завершения или отмены: 180 дн. Отмена снимает потребительскую нагрузку, но не возвращает потраченные ресурсы. \nСила +15; тревога +5. "
 RUS_ukr_families_result_tt:0 "Сила +15; тревога +5. "
 RUS_ukr_mine:0 "Восстановить взаимопомощь шахтёров Донбасса"
 RUS_ukr_mine_desc:0 "Политическая власть: 35. При тревоге 50 доплата 10. Пехотное снаряжение: 0. Сила: 0. Срок: 45 дн. Коэффициент заводов потребительских товаров +3% на время действия. Успешное выполнение возможно один раз за игру. Отмена снимает потребительскую нагрузку, но не возвращает потраченные ресурсы. \nСила +15; тревога +10. Создаётся шахтёрская сеть."
 RUS_ukr_mine_result_tt:0 "Сила +15; тревога +10. Создаётся шахтёрская сеть."
 RUS_ukr_rural:0 "Связаться с сельским социалистическим подпольем"
 RUS_ukr_rural_desc:0 "Политическая власть: 35. При тревоге 50 доплата 10. Пехотное снаряжение: 500. Сила: 0. Срок: 45 дн. Коэффициент заводов потребительских товаров +2% на время действия. Успешное выполнение возможно один раз за игру. Отмена снимает потребительскую нагрузку, но не возвращает потраченные ресурсы. \nСила +15; тревога +15. Создаётся сельская сеть. Завершённая украинская чистка сторонников республики добавляет ещё 5 тревоги."
 RUS_ukr_rural_result_tt:0 "Сила +15; тревога +15. Создаётся сельская сеть. Завершённая украинская чистка сторонников республики добавляет ещё 5 тревоги."
 RUS_ukr_rail:0 "Восстановить связи с железнодорожниками"
 RUS_ukr_rail_desc:0 "Политическая власть: 40. При тревоге 50 доплата 10. Пехотное снаряжение: 0. Сила: 0. Срок: 60 дн. Коэффициент заводов потребительских товаров +3% на время действия. Успешное выполнение возможно один раз за игру. Отмена снимает потребительскую нагрузку, но не возвращает потраченные ресурсы. \nСила +10; тревога +10. Создаётся железнодорожная сеть."
 RUS_ukr_rail_result_tt:0 "Сила +10; тревога +10. Создаётся железнодорожная сеть."
 RUS_ukr_relocate:0 "Переправить подпольные кадры"
 RUS_ukr_relocate_desc:0 "Политическая власть: 20. Без доплаты за тревогу. Пехотное снаряжение: 0. Сила: 0. Срок: 30 дн. Коэффициент заводов потребительских товаров +2% на время действия. Перерыв после завершения или отмены: 60 дн. Отмена снимает потребительскую нагрузку, но не возвращает потраченные ресурсы. \nСила +0; тревога -20. "
 RUS_ukr_relocate_result_tt:0 "Сила +0; тревога -20. "
 RUS_ukr_declaration:0 "Напечатать совместную декларацию подполья"
 RUS_ukr_declaration_desc:0 "Политическая власть: 40. При тревоге 50 доплата 10. Пехотное снаряжение: 0. Сила: 0. Срок: 45 дн. Коэффициент заводов потребительских товаров +3% на время действия. Успешное выполнение возможно один раз за игру. Отмена снимает потребительскую нагрузку, но не возвращает потраченные ресурсы. \nСила +20; тревога +15. Революционная готовность: +2 пункта."
 RUS_ukr_declaration_result_tt:0 "Сила +20; тревога +15. Революционная готовность: +2 пункта."
 RUS_ukr_strike:0 "Поддержать забастовку шахтёров"
 RUS_ukr_strike_desc:0 "Политическая власть: 30. При тревоге 50 доплата 10. Пехотное снаряжение: 0. Сила: 15. Срок: 30 дн. Коэффициент заводов потребительских товаров +2% на время действия. Перерыв после завершения или отмены: 120 дн. Отмена снимает потребительскую нагрузку, но не возвращает потраченные ресурсы. \nСила +0; тревога +15. Украина: стабильность -3 процентных пункта (не более трёх раз за игру); выпуск военных заводов -5% на 90 дней. Завершённая украинская чистка сторонников республики добавляет ещё 5 тревоги."
 RUS_ukr_strike_result_tt:0 "Сила +0; тревога +15. Украина: стабильность -3 процентных пункта (не более трёх раз за игру); выпуск военных заводов -5% на 90 дней. Завершённая украинская чистка сторонников республики добавляет ещё 5 тревоги."
 RUS_ukr_land:0 "Распространить земельные реестры"
 RUS_ukr_land_desc:0 "Политическая власть: 25. При тревоге 50 доплата 10. Пехотное снаряжение: 0. Сила: 10. Срок: 30 дн. Перерыв после завершения или отмены: 120 дн. При украинском показателе земельной реформы 70 доплата: 10 политической власти и 5 силы. Отмена снимает потребительскую нагрузку, но не возвращает потраченные ресурсы. \nСила +0; тревога +10. Украина: стабильность -5%, скорость мобилизации -10% на 90 дней. Завершённая украинская чистка сторонников республики добавляет ещё 5 тревоги."
 RUS_ukr_land_result_tt:0 "Сила +0; тревога +10. Украина: стабильность -5%, скорость мобилизации -10% на 90 дней. Завершённая украинская чистка сторонников республики добавляет ещё 5 тревоги."
 RUS_ukr_slowdown:0 "Организовать саботаж на железной дороге"
 RUS_ukr_slowdown_desc:0 "Политическая власть: 35. При тревоге 50 доплата 10. Пехотное снаряжение: 0. Сила: 15. Срок: 21 дн. Перерыв после завершения или отмены: 120 дн. Отмена снимает потребительскую нагрузку, но не возвращает потраченные ресурсы. \nСила +0; тревога +20. Украина: эффективность снабжения -8% на 60 дней. Завершённая украинская чистка сторонников республики добавляет ещё 5 тревоги."
 RUS_ukr_slowdown_result_tt:0 "Сила +0; тревога +20. Украина: эффективность снабжения -8% на 60 дней. Завершённая украинская чистка сторонников республики добавляет ещё 5 тревоги."
 RUS_ukr_night:0 "Ночь на Днепре"
 RUS_ukr_night_desc:0 "Политическая власть: 50. При тревоге 50 доплата 10. Пехотное снаряжение: 1000. Сила: 40. Срок: 7 дн. Успешное выполнение возможно один раз за игру. В начале фиксируются вся сила и действующие сети. При отмене сила возвращается; политическая власть и снаряжение не возвращаются. \nЗафиксированная сила 40–59 / 60–79 / 80–100: эффективность снабжения Украины -10% / -15% / -20%, восстановление организации -5% / -10% / -15% на 30 / 45 / 60 дней. Зафиксированная шахтёрская сеть: выпуск заводов -10%; сельская: мобилизация -20%; железнодорожная: атака России против Украины +5%. Мирные штрафы этой системы снимаются. Тревога становится равной 100, через 90 дней блокировки снижается до 40."
 RUS_ukr_night_result_tt:0 "Зафиксированная сила 40–59 / 60–79 / 80–100: эффективность снабжения Украины -10% / -15% / -20%, восстановление организации -5% / -10% / -15% на 30 / 45 / 60 дней. Зафиксированная шахтёрская сеть: выпуск заводов -10%; сельская: мобилизация -20%; железнодорожная: атака России против Украины +5%. Мирные штрафы этой системы снимаются. Тревога становится равной 100, через 90 дней блокировки снижается до 40."
 RUS_ukr_status_readonly_tt:0 "Эта строка показывает состояние."
 RUS_ukr_afford_tt:0 "Достаточно политической власти, силы и пехотного снаряжения для оплаты всех указанных затрат."
 RUS_ukr_families_requirements_tt:0 "Россия независима, социалистическая и завершила днепровский фокус; Украина существует, не капитулировала, не социалистическая и состоит в альянсе Германии. Нет другой операции, неразрешённой облавы или блокировки.\nРоссия и Украина находятся в мире.Антигетманское восстание завершилось; перерыв в 180 дней окончен."
 RUS_ukr_mine_requirements_tt:0 "Россия независима, социалистическая и завершила днепровский фокус; Украина существует, не капитулировала, не социалистическая и состоит в альянсе Германии. Нет другой операции, неразрешённой облавы или блокировки.\nРоссия и Украина находятся в мире.Шахтёрская сеть ещё не была создана."
 RUS_ukr_rural_requirements_tt:0 "Россия независима, социалистическая и завершила днепровский фокус; Украина существует, не капитулировала, не социалистическая и состоит в альянсе Германии. Нет другой операции, неразрешённой облавы или блокировки.\nРоссия и Украина находятся в мире.Сельская сеть ещё не была создана."
 RUS_ukr_rail_requirements_tt:0 "Россия независима, социалистическая и завершила днепровский фокус; Украина существует, не капитулировала, не социалистическая и состоит в альянсе Германии. Нет другой операции, неразрешённой облавы или блокировки.\nРоссия и Украина находятся в мире.Железнодорожная сеть ещё не была создана."
 RUS_ukr_relocate_requirements_tt:0 "Россия независима, социалистическая и завершила днепровский фокус; Украина существует, не капитулировала, не социалистическая и состоит в альянсе Германии. Нет другой операции, неразрешённой облавы или блокировки.\nРоссия и Украина находятся в мире.Тревога не менее 20; перерыв в 60 дней окончен."
 RUS_ukr_declaration_requirements_tt:0 "Россия независима, социалистическая и завершила днепровский фокус; Украина существует, не капитулировала, не социалистическая и состоит в альянсе Германии. Нет другой операции, неразрешённой облавы или блокировки.\nРоссия и Украина находятся в мире.Не менее двух действующих сетей; декларация ещё не напечатана."
 RUS_ukr_strike_requirements_tt:0 "Россия независима, социалистическая и завершила днепровский фокус; Украина существует, не капитулировала, не социалистическая и состоит в альянсе Германии. Нет другой операции, неразрешённой облавы или блокировки.\nРоссия и Украина находятся в мире.Шахтёрская сеть действует; перерыв в 120 дней окончен."
 RUS_ukr_land_requirements_tt:0 "Россия независима, социалистическая и завершила днепровский фокус; Украина существует, не капитулировала, не социалистическая и состоит в альянсе Германии. Нет другой операции, неразрешённой облавы или блокировки.\nРоссия и Украина находятся в мире.Сельская сеть действует; перерыв в 120 дней окончен."
 RUS_ukr_slowdown_requirements_tt:0 "Россия независима, социалистическая и завершила днепровский фокус; Украина существует, не капитулировала, не социалистическая и состоит в альянсе Германии. Нет другой операции, неразрешённой облавы или блокировки.\nРоссия и Украина находятся в мире.Железнодорожная сеть действует; перерыв в 120 дней окончен."
 RUS_ukr_night_requirements_tt:0 "Россия независима, социалистическая и завершила днепровский фокус; Украина существует, не капитулировала, не социалистическая и состоит в альянсе Германии. Нет другой операции, неразрешённой облавы или блокировки.\nРоссия и Украина воюют.Фокус ожидания момента завершён; не менее двух действующих сетей; действие ещё не завершалось успешно."
