  RUS_leniency_granted: "Дарована снисходительность"
  RUS_leniency_granted_desc: "Поскольку радикальные социалисты теперь едва держатся на плаву, наша снисходительность наверняка вызовет у них благодарность. Для будущего управления это принесёт большую пользу и не причинит вреда."
  RUS_leniency_granted_tt: "§tПСР§! присоединится к нам, и мы получим возможность активировать политических советников из различных её фракций."

  stalin_form_sov.15.t: "О радикальных социалистах"
  stalin_form_sov.15.desc: "Раз уж мы решили проявить снисходительность к радикальным социалистам, задача возвращения части их членов к национальному строительству выходит на первый план. В конце концов, у каждого из них есть собственная область опыта, и они могут внести вклад в наше дело.\n\nНо можем ли мы действительно доверять их обещанию «никогда не добиваться реабилитации»?"
  stalin_form_sov.15.a: "Объединить беспартийных."
  stalin_form_sov.15.a_tt: "Мы сможем активировать беспартийных политических советников $KR_sr_trait$!"
  stalin_form_sov.15.b: "Объединить спиридоновцев."
  stalin_form_sov.15.b_tt: "Мы сможем активировать политических советников $KR_spiridonist_trait$!"
  stalin_form_sov.15.c: "Объединить максималистов."
  stalin_form_sov.15.c_tt: "Мы сможем активировать политических советников $KR_maximalist_trait$!"
  RUS_radsocs_advisor: "Объединены беспартийные $KR_sr_trait$"
  RUS_radsocs_spiridonist_advisor: "Объединены $KR_spiridonist_trait$"
  RUS_radsocs_maximalist_advisor: "Объединены $KR_maximalist_trait$"

  RUS_shelter_dust_and_filth: "Укрыть пыль и грязь"
  RUS_shelter_dust_and_filth_desc: "Когда великие враги стоят у наших ворот, полная чистка консерваторов и правых лишь усилит антисоциалистическое сопротивление. Возможно, временная терпимость — неизбежное зло."
  RUS_shelter_dust_and_filth_tt: "Мы сможем постепенно снижать влияние национального духа §YАнтисоциалистическое сопротивление§! через решения с §Gменьшими затратами§!, однако полностью устранить его можно будет только после завершения послевоенных фокусов.\nОткрывает решение: £GFX_decision_icon_small §YПодавить контрреволюционную деятельность§!."
  RUS_decrease_antisoc_resistance_soviet: "Подавить контрреволюционную деятельность"
  RUS_shelter_dust_and_filth_idea: "Укрыть пыль и грязь"

  RUS_one_nation_one_purpose: "Одна нация, одна цель"
  RUS_one_nation_one_purpose_desc: "Эта война против Германии куда труднее, чем мы предполагали. Возможно, пришло время отложить предрассудки и объединиться против врага. Если военные усилия не улучшатся, мы можем потерять контроль над ситуацией."
  RUS_one_nation_one_purpose_tt: "Хотя наша цель — единство, это решение вместе с выгодами может принести §oчрезвычайно серьёзные последствия§!!"

  RUS_triple_flip: "Тройной переворот"
  RUS_triple_flip_desc: "Большевистская партия не сумела использовать свой последний шанс и окончательно рухнула. На этот раз мы падаем в бездну. Само выживание России висит на волоске."
  RUS_triple_flip_tt: "§RМы не смогли, как ожидалось, сдержать Германию. За несколько коротких лет страна пережила множество политических потрясений, и будущее стало неопределённее, чем когда-либо...§!\n\nМы будем вынуждены просить мира у §YГерманской империи§! и уступить обширные территории.\n§CЕсли Германия всё ещё находится в состоянии войны, она нам не откажет.§!"
  RUS_triple_flip_happened: "Тройной переворот произошёл."

  RUS_ensure_the_syndicalists_independence: "Уважать независимость ВСТ"
  RUS_ensure_the_syndicalists_independence_desc: "Мы не должны повторять ошибку Зиновьева. Произвольное поглощение ВСТ может повести нас тем же путём. Напротив, уважая их самостоятельный статус, мы позволим им стать дружественной «официальной оппозицией» — взаимовыгодным устройством для всех."
  RUS_ensure_the_syndicalists_independence_tt: "Мы сможем активировать политических советников $KR_vst_left_trait$, а потенциально также $KR_vst_centre_trait$ и $KR_vst_right_trait$."

  stalin_form_sov.16.t: "О ВСТ"
  stalin_form_sov.16.desc: "Поскольку мы решили уважать независимость ВСТ, некоторые бывшие члены, прежде заявлявшие о полном разрыве с нами, теперь вновь обдумывают сотрудничество. Задача их возвращения к национальному строительству уже внесена в повестку, ведь каждый из них обладает специальными навыками, полезными для нашего развития.\n\nОднако мы должны тщательно решить, ограничиться ли центристами или включить также правых."
  stalin_form_sov.16.a: "Объединить ВСТ (центристов)."
  stalin_form_sov.16.a_tt: "Мы сможем активировать политических советников $KR_vst_centre_trait$!"
  stalin_form_sov.16.b: "Объединить ВСТ (центристов) и ВСТ (правых)."
  stalin_form_sov.16.b_tt: "Мы сможем активировать политических советников $KR_vst_centre_trait$ и $KR_vst_right_trait$!"
  RUS_vst_left_advisor: "Объединены $KR_vst_left_trait$"
  RUS_vst_central_advisor: "Объединены $KR_vst_centre_trait$"
  RUS_vst_right_advisor: "Объединены $KR_vst_right_trait$"

  RUS_a_compromise_choice: "Компромиссный выбор"
  RUS_a_compromise_choice_desc: "Мы преодолели различные нестабильности переходного периода власти. Хотя по пути пришлось идти на компромиссы, нет сомнений, что в данный момент Сталин стал компромиссным выбором всей Советской России."
  RUS_stalin_compromise_choice: "Компромиссный выбор"
  RUS_stalin_compromise_choice_2: "Компромиссный выбор"
  RUS_political_figurehead: "Политическая ширма"
  RUS_political_figurehead_desc: "Каждое великое начало сопровождается высокими речами, но воплотить слова в дела всегда непросто. Возможно, ради стабилизации политической среды мы принесли слишком много жертв и совершили слишком много ошибок — теперь пришло время платить цену."
  RUS_stalin_political_figurehead: "Политическая ширма"
  RUS_stalin_political_figurehead_2: "Политическая ширма"
  RUS_stay_strong_tt: "В зависимости от текущей черты лидера §YИосифа Сталина§! мы получим усиление."
  RUS_invite_revolutionary_committee_tt_2: "Если наша текущая цель — создать союз, состоящий из нескольких советских стран, то при завершении этого решения до Второй мировой войны §Y[POL.GetNameDef]§! станет нашим потенциальным партнёром!"
  RUS_abolish_war_focus_tt: "§YКоммунистический интернационал§! не существует."
  RUS_stalin_abolish_war_faction_leader_tt: "После вступления в §YТретий Интернационал§! мы автоматически примем руководство фракцией."

  RUS_triple_flip_copy: "$RUS_triple_flip$"
  RUS_triple_flip_copy_desc: "$RUS_triple_flip_desc$"
  RUS_turn_the_tide: "Переломить ход"
  RUS_turn_the_tide_desc: "Это наш последний шанс. Немцы хотят насладиться добычей с нашей земли под видом ложного мира, но они ошибаются. Мы не боимся сгореть вместе с ними!"
  RUS_turn_the_tide_tt: "Мы объявим войну §YГерманской империи§!, но это будет наш последний шанс. Если в течение шести месяцев мы не вернём контроль над всеми §Yнасильно уступленными§! территориями, мы §oмгновенно рухнем§!!"
  RUS_turn_the_tide_idea: "Пути назад нет"
  RUS_turn_the_tide_mission: "Последняя битва"
  RUS_turn_the_tide_mission_tt: "Все §Yнасильно уступленные§! территории возвращены под наш контроль."
  RUS_turn_the_tide_mission_timeout_tt: "§oКрах неминуем...§!"

  stalin_form_sov.17.t: "Как закалялась сталь"
  stalin_form_sov.17.desc: "Николай Алексеевич Островский, большевик и русский коммунистический писатель, родившийся в бедной украинской рабочей семье, сразу после публикации своего романа «Как закалялась сталь» был признан классиком международного социализма. Взяв за основу собственную жизнь автора и допустив известную художественную переработку, книга живо представляет исторические фрагменты от начала Революции 1917 года до её поражения в 1921 году и последующего восстановления социалистической России. Она реалистично передала мысли и жизнь людей той эпохи и получила признание не только в России, но и во всём мире. Её знаменитые строки о том, что всю жизнь и все силы следует отдать освобождению человечества, вдохновили революционные социалистические организации и угнетённые народы по всему миру.\n\nХотя в 1921 году Островский вместе со Свердловым, Сталиным, Фрунзе и другими коммунистами через Архангельск ушёл в изгнание во Французскую Коммуну, он оставался защитником коммунизма и марксизма-ленинизма. Он также вёл решительную борьбу против клеветы, изображавшей коммунизм и марксизм-ленинизм тоталитарными, откуда бы эта клевета ни исходила — от международных левых или от правых. Хотя книга не говорит этого прямо, между её строк читается мысль: Коммунистическая партия и коммунизм не являются тоталитарными в том смысле, в каком это утверждают их враги."
  stalin_form_sov.17.desc_2: "Островский утверждал, что мир клевещет на Коммунистическую партию и коммунизм потому, что людей без передовых идей могут обмануть и сбить с пути любые реакционные силы. Лишь одна партия с несгибаемой решимостью борется со всеми угнетателями — Большевистская партия. Отвечая контрреволюционерам, клеветникам и ревизионистам, Островский вынес на оборот обложки слова Иосифа Сталина: можно ли уничтожить капитализм без беспощадной классовой борьбы? Нет. Теория, будто капиталисты могут врасти в социализм, только выращивает классы и увековечивает их.\n\nПротив тех, кто утверждает, что авангардный коммунизм иррационален и разрушителен, что у коммунистов нет ни интереса, ни способности, ни воли решать социальные проблемы, а так называемый Красный террор якобы был лишён разума и всяких рациональных предпосылок, Островский цитировал Ленина: свержение старого порядка — лишь начало революции, а подлинная революция заключается в строительстве; после взятия власти пролетариатом классовая борьба между пролетариатом и буржуазией не прекращается, а становится шире, острее и суровее.\n\nТворчество Островского привлекло внимание бесчисленных коммунистических и социалистических революционеров, активистов и политиков. Теперь оно рассматривается как окно, через которое коммунизм может сбросить обвинение в тоталитаризме, и как начало нового общественного переосмысления самого понятия тоталитаризма."
  stalin_form_sov.17.a: "Не позволяйте реакции ослепить народ!"

  stalin_form_sov.19.t: "Годовщина Октябрьской революции"
  stalin_form_sov.19.desc: "28 января 1921 года, окружённое врагами внутри и снаружи, последнее организованное соединение Красной армии прекратило сопротивление, и разбитая Русская революция окончательно потерпела поражение.\n\nСегодня, с новым пониманием Красного Октября, выработанным партийным центром, и с широкой мобилизацией масс, народ увидел ложь реакции. Истина Октября была вновь открыта, а то поражение теперь воспринимается как песнь храбрых: окружённые реакционерами всего мира, поражённые скрытыми предателями и поставленные перед самыми неблагоприятными условиями, большевики не преклонили колени, а решили пролить последнюю каплю крови за правду и справедливость.\n\nИ вот новое шествие возникло само собой: из Ленинграда, от «Авроры», бесконечная людская волна движется вперёд, машет красными знамёнами и хором поёт Интернационал, оплакивая павших воинов.\n\nСреди них — обычные рабочие из цехов и бедные крестьяне из коллективных хозяйств. Их жизни различны, но их объединяет один коммунистический идеал.\n\nКак писал маршал Фрунзе в годы Гражданской войны: бесчисленные люди погибали на пути атаки, а затем мы переступали через их тела и продолжали идти вперёд.\n\nМы, коммунисты, люди особого склада, сделанные из особого материала... и если потребуется, мы без колебаний отдадим себя революции."
  stalin_form_sov.19.a: "«Пока остаётся хотя бы один коммунист, наш идеал не умрёт»"

  stalin_form_sov.21.t: "Самое светлое будущее"
  stalin_form_sov.21.desc: "Как далеко в прошлое уходит история стремления человечества к освобождению?\nК Спартаку на Западе или к Чэнь Шэну и У Гуану на Востоке?\n\nИсторики могут давать разные ответы, но одно не менялось никогда: движение человечества к освобождению не прекращалось.\n\nВ 1917 году великий Ленин повёл народ против эксплуатации и угнетения, вновь зажёг факел социализма после Парижской Коммуны. Хотя революция однажды потерпела неудачу под тяжестью истории, идеал освобождения не погас. Последующие годы вновь и вновь доказывали ленинскую истину:\n\n«Смерть не принадлежит рабочему классу!»\n\nИ теперь, от Балтийского моря до Токийского залива, все народы едины под советским знаменем. Прогнивший старый мир горит в народном гневе, а сияющая страна завтрашнего дня распахнула ворота всему человечеству.\n\nМы можем предвидеть:\n\nСвободное и демократическое государство рабочих и крестьян создаст достижения, недоступные ни одной капиталистической великой державе;\nНаука и поэзия будут принадлежать каждому человеку;\nХлеб и розы больше не будут продаваться с ценником.\n\nСоветы поведут всё человечество из тюрьмы царства необходимости к подлинно свободному будущему."
  stalin_form_sov.21.a: "«С нулевого часа — к самому светлому будущему»."
  stalin_form_sov.21.a_tt: "§YНачав с нуля, даже если путь долог.\nСлавному и великому освободителю — наш салют!§!"

  stalin_form_sov.22.t: "Декларация об образовании Союза Советских Социалистических Республик"
  stalin_form_sov.22.desc: "Со времени основания советских республик народы мира разделились на два лагеря: капиталистический и социалистический.\n\nТам, в капиталистическом лагере, существуют национальная ненависть и неравенство, колониальное рабство и шовинизм, национальное угнетение и преследование, империалистические зверства и война.\n\nЗдесь, в социалистическом лагере, существуют взаимное доверие и мир, национальная свобода и равенство, мирное сосуществование и братское сотрудничество народов.\n\nДесятилетиями капиталистический мир пытался примирить свободное развитие наций с системой, в которой человек эксплуатирует человека, надеясь тем самым решить национальный вопрос. Все эти попытки ни к чему не привели. Напротив, национальные противоречия всё сильнее запутались и теперь угрожают самому существованию капитализма. Буржуазия уже неспособна построить сотрудничество между народами.\n\nТолько в советском лагере, только при диктатуре пролетариата, объединяющей огромное большинство населения, возможно искоренить национальное угнетение, создать атмосферу взаимного доверия и заложить основы братского сотрудничества народов. Только благодаря этим условиям советские республики смогли отбить атаки империалистов извне и изнутри.\n\nТолько благодаря этим условиям они смогли успешно завершить гражданскую войну, обеспечить своё существование и приступить к мирному хозяйственному строительству.\n\nОднако годы войны не прошли бесследно. Разорённые поля, простаивающие фабрики, разрушенные производительные силы и истощённые экономические ресурсы, оставленные войной, сделали отдельных усилий каждой республики недостаточными. Восстановление народного хозяйства невозможно, пока республики остаются разделёнными.\n\nВ то же время нестабильность международного положения и опасность новых нападений требуют от советских республик создания единого фронта перед лицом капиталистического окружения.\n\nНаконец, сама структура советской власти, интернационалистская по своей классовой природе, побуждает трудящиеся массы советских республик к объединению в одну социалистическую семью.\n\nВсе эти обстоятельства настоятельно требуют объединения советских республик в одно союзное государство, способное гарантировать внешнюю безопасность, внутреннее экономическое процветание и право каждого народа на свободное развитие.\n\nВоля народов советских республик, недавно собравшихся на собственные съезды советов и единогласно выразивших решение создать Союз Советских Социалистических Республик, служит надёжной гарантией того, что этот союз является добровольным союзом равных наций; что каждой республике гарантировано право свободного выхода из союза; что союз открыт для всех социалистических советских республик, уже существующих или ещё только возникающих; что это новое союзное государство является надлежащим завершением принципов мирного сосуществования и братского сотрудничества народов, заложенных с октября 1917 года; что оно станет надёжным оплотом против мирового капитализма и новым решительным шагом на пути к объединению рабочих всех стран во всемирную социалистическую советскую республику.\n\nМы заявляем обо всём этом всему миру и торжественно провозглашаем нерушимость принципов советской власти. Эти принципы воплощены в конституциях социалистических советских республик, представители которых уполномочили нас. Мы, представители этих республик, действуя на основании предоставленных нам полномочий, постановляем подписать договор об образовании Союза Советских Социалистических Республик."

  stalin_form_sov.24.t: "Социалисты-революционеры и большевики"
  stalin_form_sov.24.desc: "Хотя Всероссийский союз труда одержал победу в парламенте, в практической работе управления он всё ещё зависит от своих союзников-социалистов-революционеров и от большевиков, возвращающихся из изгнания.\n\nПод поверхностью сотрудничества борьба между двумя партиями никогда не прекращалась. Министерство финансов, Земельный комитет, военное ведомство, кадровые отделы местных советов — каждая вакансия может стать новым полем боя.\n\nБлагодаря долгой работе в деревне социалисты-революционеры контролируют подавляющее большинство сельских советов и местных милицейских сил. От западной России до Сибири, от продразвёрстки до весеннего сева, почти каждый сельскохозяйственный нерв находится в их руках. В начале Второй революции именно их влияние в деревне помогло нам избежать гражданской войны. Эту силу Всероссийский союз труда не может игнорировать.\n\nБольшевики же пока остаются в городах и подполье. У них прочные сети в фабричных цехах, железнодорожных депо и портовых доках; ветераны Красной гвардии скрываются в рядах милиции, а тайные члены партии тихо занимают телеграфные конторы и банки. Пока численность их членов значительно меньше, чем у социалистов-революционеров, но их дисциплина внушительна, и, извлёкши уроки из первой гражданской войны, большевики стали более едиными, чем прежде.\n\nЗа столом конференции царит гармония; под столом каждая нога бьёт другую. Обе стороны ждут возможности вырвать влияние соперника из правительства с корнем. Как координатор, Всероссийский союз труда может лишь поддерживать осторожное равновесие между двумя фракциями, чтобы революция продвигалась по плану."
  stalin_form_sov.24.a: "Мы будем действовать осторожно."
  stalin_form_sov.24.a_tt: "§RДве партии давно хранят старые обиды. Если революционная ситуация станет крайней, кто поручится, что они не перевернут доску?§!"

  stalin_form_sov.10002.t: "Германия ищет мира!"
  stalin_form_sov.10002.desc: "Наши военные усилия превзошли ожидания. Мы успешно вернули территории, утраченные по прежнему неравноправному договору. Теперь Германская империя, изнурённая непрерывной войной, протянула оливковую ветвь и заявила, что готова восстановить довоенные европейские границы и прекратить вмешательство в Центральной Азии.\n\nКак нам ответить?"
  stalin_form_sov.10002.a: "Довольно."
  stalin_form_sov.10002.a_tt: "§YМы сможем восстановить довоенные европейские границы!§!"
  stalin_form_sov.10002.b: "К чёрту их!"

  RUS_dictatorship_proletariat: "Общенародное государство"
  RUS_dictatorship_proletariat_desc: "Наше нынешнее государство в самой своей сущности уже отличается от буржуазного. Старое определение к нему неприменимо; оно должно продолжать служить орудием власти всего народа."
  RUS_charter_of_russian_totalism: "Спор о тотализме"
  RUS_charter_of_russian_totalism_desc: "Западные революционные течения вызвали в стране дискуссию о тотализме. Основанное Гронским Общество изучения западного тотализма придаёт этому спору всё более академический и политический характер."
  RUS_invite_sverdlov: "Возвращение к ленинизму"
  RUS_war_on_landowners: "Ускорить завершение аграрного перехода"
  RUS_war_on_landowners_desc: "Крестьянство — переходный класс, которому суждено исчезнуть. Мы должны ускорить его превращение в сельскохозяйственных рабочих и лишить мелкобуржуазные идеи их классовой почвы."
  RUS_red_intelligentsia: "Революционный культурный фронт"
  RUS_red_intelligentsia_desc: "Старый мир исчезает не сразу, а в ходе мучительного и долгого процесса. Идеи революции и демократии должны укорениться в сердце каждого гражданина."
  RUS_technocratic_syndicalism: "Заложить основы демократии"
  RUS_technocratic_syndicalism_desc: "Наконец пролетарская демократия, о которой говорил Ленин, набирает силу в России. Демократия, в миллион раз более демократичная, чем любая буржуазная, обеспечит наш переход к коммунизму!"
  RUS_preserve_revolution_within: "Триумф красного кормчего"
  RUS_preserve_revolution_within_desc: "Зиновьев сосредоточил в своих руках верховную власть. Его замысел русского тотализма и государства пролетарской диктатуры теперь §Rстанет реальностью§!."
  RUS_maximalist_land_reform_success_focus_requirement: "§YЗемельная реформа§! завершена"
  rus_stalin_zinovyev_rework.continue: "Читать дальше..."
  rus_stalin_zinovyev_rework.1.t: "Общество изучения западного тотализма"
  rus_stalin_zinovyev_rework.1.d: "После отмены буржуазной цензуры в России начали распространяться доктрины Мосли, Валуа и Муссолини. Общество Ивана Гронского объединило интеллектуалов левого крыла ВСТ, большевиков и эсеров-максималистов, отвергло идею русского тотализма и потребовало всесторонней критики его западной формы.\n\nБольшевики осудили тотализм за обожествление государства как конечной стадии человечества и за отказ от демократии под видом полной самоотдачи. Ссылаясь на Ленина, общество заключило, что тотализм лишь увековечивает государственную машину. Западный тотализм и все его русские разновидности должны быть разоблачены и искоренены."
  rus_stalin_zinovyev_rework.1.a: "Сказано точно и беспощадно!"
  rus_stalin_zinovyev_rework.2.t: "Русский тотализм"
  rus_stalin_zinovyev_rework.2.d: "Зиновьев ответил критикам манифестом «Русский тотализм». Он утверждал, что диктатура пролетариата необходима социализму, а её ослабление во имя демократии означает капитуляцию перед буржуазией.\n\nВ отличие от западных тоталистов, поклоняющихся вечному государству, русские тоталисты должны использовать переходное пролетарское полугосударство для подавления эксплуататоров и подготовки собственного отмирания."
  rus_stalin_zinovyev_rework.3.d: "Зиновьев настаивал, что злоупотребление словом «тотальный» на Западе не должно заставлять революционеров отказаться от диктатуры пролетариата. Большевики ответили, что его презрение к демократическим формам искажает марксизм: диктатура пролетариата означает широчайшую демократию для большинства и решительное подавление эксплуататорского меньшинства.\n\nПротивопоставляя диктатуру демократии, Зиновьев попал в ту же ловушку, что и западные тоталисты. Вне организованного авангарда он ещё мог повторять революционные фразы, но уже не понимал их смысла."
  rus_stalin_zinovyev_rework.3.a: "Пусть Каменев за ним присмотрит!"
  rus_stalin_zinovyev_rework.10.t: "Общество изучения диктатуры пролетариата"
  rus_stalin_zinovyev_rework.10.d: "Вскоре после публикации манифеста «Русский тотализм» вокруг Зиновьева начал собираться небольшой кружок. Они называли себя Обществом изучения диктатуры пролетариата, тогда как окружающие прямо говорили о «зиновьевцах». В ядро входили бывшие авторы интернационалистских газет, несколько теоретиков Петроградского университета и интеллигенты, колебавшиеся между левыми эсерами и большевиками. Они регулярно собирались в квартире Зиновьева, обсуждая теоретические основы пролетарской диктатуры, условия диктаторского государства и, по их собственным словам, «европейский социализм, отравленный формальной демократией».\n\nВскоре кружок опубликовал открытое заявление, в котором Зиновьев категорически отверг навязанный им ярлык тотализма:\n\n«Называть нас тоталистами — либо теоретическое невежество, либо сознательная политическая клевета. Тотализм — будь то бирмингемская группа или миланский „вождь“ — абсолютизирует и увековечивает государство, ставит государственную машину над классами. Мы же отстаиваем прямо противоположное: господство класса над государством, использование пролетариатом государственной машины как переходной формы к окончательному исчезновению всякой государственной власти. Кто не различает временного усиления государства ради его уничтожения и поклонения государству как конечной цели, тот не вправе рассуждать о марксизме».\n\nЗаявление также подчёркивало, что общество не стремится создать новую партию и не намерено бороться со Всероссийским союзом труда. Оно требует лишь места в теоретической дискуссии о диктатуре пролетариата."
  rus_stalin_zinovyev_rework.10.a: "«Григорий, ты всё-таки поосторожнее»."
  rus_stalin_zinovyev_rework.11.t: "Резолюция по вопросу тотализма"
  rus_stalin_zinovyev_rework.11.d: "На съезде Всероссийского союза труда вопрос тотализма был официально внесён в повестку дня. Делегаты ожесточённо спорили о западном тотализме после Бирмингемской декларации, манифесте Зиновьева «Русский тотализм» и деятельности его Общества изучения диктатуры пролетариата. В итоге съезду представили два противоположных проекта резолюции.\n\nПервое направление: единство и включение\n\nПроект утверждал, что критика западного тотализма Зиновьевым направлена в ту же сторону, что и позиция Союза. Его тезис о диктатуре пролетариата как переходном орудии, а не конечной цели, не противоречит основам марксизма. Осуждая западный тотализм, Союз должен ограниченно принять разумные элементы зиновьевской теории и сплотить все антиимпериалистические силы. Товарищ Зиновьев может отклоняться от основной программы в организационных вопросах, но его теоретическую работу нельзя просто приравнять к вражеской.\n\nВторое направление: провести все границы\n\nЭтот проект отрицал возможность компромисса. Настоящая ошибка Зиновьева состояла не в критике западного тотализма, а в презрении к демократии, совпадающем с позицией бирмингемской группы. Абстрактно противопоставляя диктатуру демократии и умалчивая о пролетарской демократии, он стирал коренное различие между пролетарским и буржуазным государством. Как учил Ленин, диктатура пролетариата впервые даст демократию народу и большинству. И западный тотализм, и его «русская» разновидность являются изменой марксистскому учению о государстве и не заслуживают теоретической терпимости под знаменем Союза."
  rus_stalin_zinovyev_rework.11.a: "Частично принять позицию Зиновьева ради единства."
  rus_stalin_zinovyev_rework.11.b: "Нельзя терпеть отклонения от линии."
  rus_stalin_zinovyev_rework.4.t: "Опытная зона «сельскохозяйственной фабрики»"
  rus_stalin_zinovyev_rework.4.d: "С развитием земельной реформы и механизации максималисты и большевики приступили к превращению крестьянства в сельскохозяйственных рабочих.\n\nГосударственная сельскохозяйственная фабрика «Заря» в Омске предложила статус государственного рабочего, твёрдую зарплату и социальные гарантии. На четыреста мест поступило свыше тысячи двухсот заявлений. Первые добровольцы уже едут в Омск, доверяя Муромцу и обещанному им будущему."
  rus_stalin_zinovyev_rework.4.a: "Они станут первыми сельскохозяйственными рабочими на этой мёрзлой земле."
  rus_stalin_zinovyev_rework.5.t: "Крепостной, крестьянин, сельскохозяйственный рабочий"
  rus_stalin_zinovyev_rework.5.d: "Колхоз «Земля и воля», Новосибирск\n\nСтарый Валерий с детства гнул спину над сибирской землёй. Революции 1917 года были для него лишь далёкой сменой флагов. В 1927 году городской поэт превратил его голод и боль в пасторальные стихи, а затем вернулся к городским кафе и огням."
  rus_stalin_zinovyev_rework.6.d: "Земельная реформа дала Валерию надел, но не дала ни орудий, ни уверенности; неурожаи превратили землю в новую цепь. Затем Муромец принёс колхозы, тракторы, семена и амбары. Полные склады и машины подарили Валерию сытость и почти незнакомое свободное время.\n\nЭта свобода воскресила старое желание: увидеть город и узнать, сможет ли он стать кем-то помимо человека, которого земля породила и истощила."
  rus_stalin_zinovyev_rework.6.a: "Он покинет эту землю."
  rus_stalin_zinovyev_rework.7.t: "Новенький"
  rus_stalin_zinovyev_rework.7.d: "Сельскохозяйственная фабрика «Заря», Омск\n\nВасилий Шумилов прибыл с перевязанным верёвкой чемоданом и потрёпанным руководством по трактору. Сорокадневные курсы дали ему основы, а терпеливая самостоятельная работа научила чинить то, чего курсы не объясняли. В колхозе его звали учёным, но сам Василий знал, как мало ему известно."
  rus_stalin_zinovyev_rework.8.d: "Омская фабрика обещала систематическое обучение, новые тракторы, ремонтную мастерскую, станки и запасные части. Замасленное руководство, экзаменационные оценки и практический талант поставили Василия первым в списке."
  rus_stalin_zinovyev_rework.8.d_2: "На «Заре» его ждали двенадцать блестящих тракторов, огромная мастерская, технический экзамен и бескрайнее поле с единственной табличкой: «Третий производственный участок»."
  rus_stalin_zinovyev_rework.9.d: "В круглосуточной столовой Василий услышал о планах открыть четвёртый участок и выделить ему три новых трактора. Вечером он прошёл мимо освещённой мастерской и слушал, как ночная смена работает во тьме. Здесь этот звук был обыденным.\n\nДумая о завтрашнем экзамене и старом ключе в чемодане, Василий представлял, как впервые вспашет землю четвёртого участка. А пока ему нужно было лишь выспаться. Он закрыл глаза."
  rus_stalin_zinovyev_rework.9.a: "Свет в ремонтной мастерской горел, пока он не уснул."
  RUS_nationalise_AEG_electrical_facilities: "Национализировать электрооборудование AEG"
  RUS_nationalise_AEG_electrical_facilities_desc: "Электростанции, подстанции и линии электропередачи, оставленные AEG в России, до сих пор раздроблены между разобщёнными компаниями и местными учреждениями. Государство должно взять их под контроль, установить единый технический стандарт и включить их во всероссийскую сеть программы «Восход».\n\n§YРегионы, выбранные программой «Восход»:§!\n[?RUS_aeg_nationalisation_state_1.GetName], [?RUS_aeg_nationalisation_state_2.GetName], [?RUS_aeg_nationalisation_state_3.GetName], [?RUS_aeg_nationalisation_state_4.GetName], [?RUS_aeg_nationalisation_state_5.GetName]\n[?RUS_aeg_nationalisation_state_6.GetName], [?RUS_aeg_nationalisation_state_7.GetName], [?RUS_aeg_nationalisation_state_8.GetName], [?RUS_aeg_nationalisation_state_9.GetName], [?RUS_aeg_nationalisation_state_10.GetName]"
  RUS_nationalise_AEG_electrical_facilities_complete_tt: "После завершения решения:\nВ каждом из следующих §Y10 регионов§! появится по §Y1 усиленной электросети§!, §Y1 уровню инфраструктуры§! и §Y1 ячейке строительства§!:\n§Y[?RUS_aeg_nationalisation_state_1.GetName], [?RUS_aeg_nationalisation_state_2.GetName], [?RUS_aeg_nationalisation_state_3.GetName], [?RUS_aeg_nationalisation_state_4.GetName], [?RUS_aeg_nationalisation_state_5.GetName]\n[?RUS_aeg_nationalisation_state_6.GetName], [?RUS_aeg_nationalisation_state_7.GetName], [?RUS_aeg_nationalisation_state_8.GetName], [?RUS_aeg_nationalisation_state_9.GetName], [?RUS_aeg_nationalisation_state_10.GetName]§!\nПопулярность синдикализма: §G+5,00%§!"
  RUS_stalin_voskhod.1.t: "Извилистый путь электрификации"
  RUS_stalin_voskhod.1.d: "После окончания Гражданской войны в 1920 году молодая Российская Республика наконец смогла вернуться к замороженному закону об электрификации «Общества 1886 года». К 1922 году новое правительство эсеров и кадетов решило сохранить дореволюционную систему концессионных акционерных обществ. Частному и иностранному капиталу предлагалось учреждать компании, получать концессии и осваивать выделенные городские либо промышленные районы в порядке «свободного развития».\n\nВ результате сложились две основные системы электрификации. Европейская часть России развивалась вокруг Москвы, опираясь прежде всего на германские стандарты и оборудование AEG; азиатская часть закупала доступное американское оборудование и следовала стандартам General Electric. Частные предприятия и иностранные, в том числе бельгийские, компании были рассыпаны по стране подобно звёздам. Единого стандарта не существовало: применялись частоты 20, 40 и 50 Гц, а однофазные сети соседствовали с трёхфазными.\n\nАмериканский биржевой крах и затянутая Вильнюсским соглашением петля остановили и без того трудный процесс. Разрыв финансовых цепочек заморозил стройки, превратив грандиозные планы «свободного развития» в вереницу недостроев. Несовместимые сети нельзя было соединить; без единого обслуживания аварии учащались и усиливали беспорядок в промышленности. Уход иностранного капитала оставил технический вакуум, а отечественные предприниматели не могли оплатить дорогостоящую перестройку. После короткого подъёма электрификация России быстро пошла на спад.\n\nВ час почти полной изоляции молодая Французская Социальная Республика и реорганизованная EDF вышли на русский рынок с низкими ценами и качественными услугами. От Петрограда начала расходиться новая сеть. После прихода к власти Союза защиты Родины и Свободы Вождь Савинков ввёл обязательный «единый электрический стандарт»: все новые и перестраиваемые объекты должны были перейти на трёхфазный переменный ток частотой 50 Гц. Частные энергокомпании национализировали, а предприятиям с иностранным капиталом дали переходный срок для замены оборудования. По совету французских инженеров электростанции стали возводить возле торфяных залежей Центральной России и соединять высоковольтными линиями с Москвой, Нижним Новгородом и другими промышленными центрами.\n\n«Стандарт Савинкова» заметно ускорил электрификацию. Однако нехватка специалистов вынудила даже Вождя закрыть глаза на прибывших французских «синдикалистских головорезов» и молчаливо позволить им вести на стройках техническое обучение и политическую агитацию."
  RUS_stalin_voskhod.1.a: "Светло, ярко и жарко, как сам Вождь!"
