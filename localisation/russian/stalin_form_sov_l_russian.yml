  KR_maximalist_trait: "§oЭсер (максималист)§!"
  KR_maximalist_ustinov: "$KR_maximalist_trait$"
  KR_maximalist_kolegayev: "$KR_maximalist_trait$"
  KR_maximalist_kakhovskaya: "$KR_maximalist_trait$"
  RUS_aleksey_ustinov: "Алексей Михайлович Устинов"
  RUS_aleksey_ustinov_advisor: "Алексей Михайлович Устинов"
  RUS_aleksey_ustinov_sic: "Алексей Михайлович Устинов"
  RUS_aleksey_ustinov_advisor_desc: "§YРодился:§! §L15 марта 1885 г.; Корфуно, Московская губерния, Российская империя§!\n§YБиография:§! §LАлексей Михайлович Устинов родился в богатой дворянской семье и получил хорошее образование, но судьба проложила для него совсем иной путь. В 1902 году, ещё будучи состоятельным молодым человеком, Устинов принял участие в революционной деятельности, а позднее вступил в Партию социалистов-революционеров и уже не свернул с этого пути. В Саратове он организовал собственную боевую организацию эсеров, но вскоре был арестован и заключён в тюрьму, лишён дворянского состояния и вынужден отправиться в эмиграцию. Во время Мировой войны он создал революционную сеть среди русских военнопленных, готовя крупное восстание. В 1917 году, когда час восстания наконец настал, он без колебаний встал на сторону крайне левого крыла социалистов-революционеров, открыто выступил против правительства Керенского и против любых компромиссов с буржуазными партиями.\n\nКак и другие левые эсеры, Устинов ушёл в самую толщу народа и стал выдающимся вождём революционных моряков Гельсингфорса, то есть Хельсинки. Чтобы обеспечить переход революции к её заключительной стадии, он и его сторонники всё сильнее сближались с большевиками, а разрыв между максималистами и другими течениями эсеров становился всё очевиднее. Хотя по многим вопросам он расходился и с максималистами, и с большевиками, в самом главном они оставались едины: в полной преданности революции.\n\nВ годы Гражданской войны Устинов выступил против восстания левых эсеров и предпочёл до последнего момента сражаться плечом к плечу с большевиками. После окончания Гражданской войны максималисты продолжали действовать в виде небольших партизанских организаций, а сам он долгие годы скитался в эмиграции между Белоруссией, Францией и другими местами. В этот период он сосредоточился на руководстве максималистами в изгнании и поддерживал тесные связи с боевой группой Левандовского.\n\nРазмышляя над революциями разных стран, он глубоко осознал значение революционного рабоче-крестьянского союза. Поэтому, стремясь решить давнюю проблему сельской бедности в России и помочь беднейшим крестьянам на местах совершить переход к положению сельскохозяйственных рабочих, он творчески выдвинул форму сельского производства — коллективное хозяйство. После основания республики он возглавил бедноту в борьбе против гнёта помещиков и кулаков и успешно создал несколько образцовых районов. Именно эта беспощадная к реакционерам твёрдость принесла ему прозвище «Муромец».§!\n\nПримечание: хотя он нередко проявляет высокомерие и самоуверенность, как единственный лидер максималистов он остаётся великим революционером — преданным делу, способным вести за собой и вдохновлять товарищей вокруг."
