  RUS_nikolay_bukharin_advisor: "Николай Бухарин"
  RUS_nikolay_bukharin_advisor_compat: "Николай Бухарин"
  RUS_nikolay_bukharin_advisor_desc: "§YРодился:§! §L27 сентября 1888 года по старому стилю; Москва, Российская империя.§!\n§YБиография:§! §LВ глазах окружающих Бухарин навсегда оставался молодым революционером, чья горячность граничила с наивностью, а вежливость сочеталась с лукавством,— и это впечатление удивительно точно передавало его характер. Он превосходно рисовал карикатуры, едкие и вместе с тем остроумные; увлекался естествознанием и во время эмиграции мог надолго замереть, разглядывая горные пласты Альп. Эти занятия, казалось бы совершенно чуждые подпольной борьбе, оставляли ему окно во внешний мир. Через микроскоп и страницы альбома он видел мир куда более сложный, чем любая догма, и потому ещё более достойный борьбы.\n\nНо эпоха не позволяла революционеру надолго задерживаться среди образцов и рисунков.\n\nКак и для множества его современников, революция 1905 года полностью изменила жизнь Бухарина. Однако решающий перелом произошёл не на вершине баррикад и митингов, а во время удушливых репрессий, последовавших за бурей.\n\n«В университете больше не проводили собраний, не было ни демонстраций, ни баррикад. Именно в тот год я вступил в большевистскую организацию».\n\nВо время революции, потрясшей весь мир, Бухарин был одним из самых молодых представителей левой оппозиции внутри большевистской партии. Он яростно выступал против уступок Германии, сделанных Лениным в Брестском мире, и требовал отменить принцип национального самоопределения, считая его противоречащим марксистскому пониманию национального вопроса. Однако дальнейший ход истории заставил его признать: без этих мер трагическая революция пришла бы к концу ещё раньше.\n\nПоражение Красного Октября не сломило его. Годы эмиграции в Париже и Лондоне расширили его кругозор, а в бесконечных спорах с западными синдикалистами он выработал необычную концепцию — демократическую плановую экономику. Бухарин надеялся соединить принудительную силу государства с широким участием профсоюзной демократии, чтобы сохранить гибкость планирования и революционный характер местных Советов.§!"
