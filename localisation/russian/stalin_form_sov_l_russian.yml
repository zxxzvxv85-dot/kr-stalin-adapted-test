  RUS_mikhail_kalinin: "Михаил Иванович Калинин"
  RUS_mikhail_kalinin_advisor: "Михаил Иванович Калинин"
  RUS_mikhail_kalinin_advisor_desc: "§YРодился:§! §L19 ноября 1875 года (7 ноября по старому стилю); Тверская губерния, Российская империя.§!\n§YБиография:§! §LМихаил Иванович Калинин родился в обычной русской семье бедных крестьян. Из-за нужды он проучился в начальной школе лишь несколько лет и уже в четырнадцать лет один отправился на заработки в Санкт-Петербург, где сначала был учеником на заводе, а затем токарем. Тяготы жизни простого рабочего он познал очень рано. Именно в заводских цехах Калинин соприкоснулся с набиравшим силу рабочим движением, и его политическое сознание быстро пробудилось. В 1898 году он вступил в Российскую социал-демократическую рабочую партию, а во время последующей внутрипартийной борьбы твёрдо встал на сторону большевиков во главе с Лениным.\n\nВо время революции 1905 года Калинин активно организовывал рабочие забастовки в Петрограде, участвовал в создании фабричных комитетов и распространял революционные листовки на тайных собраниях. В последующее десятилетие за непрерывную подпольную деятельность его неоднократно арестовывали и ссылали; его путь пролегал через Кавказ, Эстонию и другие края. После каждого освобождения он возвращался в Петроград и продолжал незаконченную работу. Тюрьмы и лютые морозы не сломили его волю, а лишь закалили присущие ему выдержку, практичность и политическую стойкость.\n\nПосле начала Великой войны Калинин тайно вёл в Петрограде антивоенную агитацию, сплачивая солдат на фронте и рабочих в тылу. Когда Февральская революция 1917 года свергла царский режим, он немедленно занялся восстановлением разгромленной партийной организации и был избран депутатом Петроградской городской думы. В октябре того же года Калинин вошёл в большевистский Военно-революционный штаб, непосредственно участвовал в обеспечении связи и мобилизации при штурме Зимнего дворца и стал одним из ключевых координаторов вооружённого восстания в Петрограде.\n\nОднако гражданская война завершилась поражением красной власти. К счастью, ещё до окончательного краха режима Калинин успел вместе с другими эмигрантами отступить в Западную Европу. Вскоре после прибытия в Париж эмигрантское сообщество погрузилось в глубокое уныние и мучительные размышления о причинах поражения. Суждение Калинина было необычайно ясным: неудачу во многом следовало объяснить тем, что приспособленцы разлагали и подрывали революционное дело. Поэтому во время партийной чистки под руководством Свердлова он сдержанно и уверенно возглавил проверку рядов. Оберегая чистоту организации, Калинин умеренно удалял оппортунистов и перерожденцев, не допуская перегибов и безосновательного расширения репрессий.\n\nГоды вдали от родины и сравнительно спокойная обстановка в Париже дали ему редкую возможность. Калинин начал систематизировать опыт, накопленный во время ранней работы в рабочем движении, и посвятил весь свой пыл коммунистическому просвещению — от составления политических букварей до проведения учебных курсов. Он неизменно верил: «Труд не только создаёт материальные богатства, но и формирует духовный облик человека».§!"
