l_russian:
  RUS_labour_aristocracy: "Воспитать новую социалистическую культуру"
  RUS_labour_aristocracy_desc: "Социалистическая республика не может держаться только на заводах, школах и армии. Новые общественные отношения требуют нового языка, нового искусства и нового повседневного быта. Рабочие и крестьяне должны получить право голоса в культурном строительстве, а авангардные кадры обязаны ответить на собственный вопрос: говорят ли они вместо масс, или помогают массам научиться говорить собственным голосом?"
  RUS_education_reform_effect_new_culture_popularisation_tt: "Добавить эффекты к §Y$RUS_reforming_education_system$§!:\nФактор фабрик товаров народного потребления: §R+5.00%§!\nЕжедневный прирост политической власти: §G+5.00%§!"
  RUS_education_reform_effect_new_culture_elite_art_tt: "Добавить эффекты к §Y$RUS_reforming_education_system$§!:\nФактор фабрик товаров народного потребления: §G-5.00%§!\nЕжедневный прирост политической власти: §R-5.00%§!"
  RUS_education_reform_effect_revolutionary_realism_tt: "Добавить эффекты к §Y$RUS_reforming_education_system$§!:\nМодификатор стабильности от популярности партии: §G+10.00%§!"
  RUS_education_reform_effect_revolutionary_romanticism_tt: "Добавить эффекты к §Y$RUS_reforming_education_system$§!:\nСкорость исследований: §G+10.00%§!"
  rus_stalin_new_culture_events.next: "Продолжить."
  rus_stalin_new_culture_events.1.t: "Создатели новой культуры"
  rus_stalin_new_culture_events.1.desc: "Чтобы заложить основу социалистической культуры, представители рабочих и крестьян созвали совещание о социалистическом культурном строительстве. На нем им предстояло определить направление будущего развития культуры.\n\nПервый вопрос перед ними был прост: кто создает новую культуру?\n\nЭтот вопрос поднял крестьянский представитель из Воронежской губернии. Он сказал: «Несколько дней назад у нас в деревне выпустили стенгазету. Ее написали присланные сверху кадры. Слова были красивые, но после вывешивания люди весь день проходили мимо, смотрели одним глазом и уходили. Потом один старик снял стенгазету и на обороте написал частушечный стих. В тот же день вокруг него собралось больше двадцати человек. Я не говорю, что кадры написали плохо. Я говорю, что кадры писали за столом, а тот стих был написан на корточках на меже».\n\nВ зале засмеялись, но после смеха вопрос был серьезно поставлен в повестку.\n\nОдни утверждали: новую культуру должны создавать сами рабочие и крестьяне.\n\nСторонники этого направления считали, что культуру нельзя «спустить». Если культура лишь льется сверху на массы, чем она отличается от старой «наставительной» опеки? Жизненная сила новой культуры в том, что она должна исходить от тех, кто действительно живет трудом: их язык, их чувства и их способы выражения являются настоящей почвой новой культуры.\n\nРоль кадров должна состоять в предоставлении материалов и инструментов, а не в предписании содержания и формы. Пусть стенгазеты ведут сами деревенские, клубами распоряжаются сами рабочие, а стихи пишут руки, державшие мотыгу и гаечный ключ. Даже если поначалу это грубо и незрело, это собственное выражение рабочих и крестьян, обладающее живостью и искренностью, которые не заменит никакое отточенное «кадровое искусство»."
  rus_stalin_new_culture_events.1.desc_2: "Другие утверждали: рабочим и крестьянам нужны руководство и организация кадров.\n\nМассы живут на передовой линии труда, но им недостает систематической культурной подготовки и теоретического вооружения. Без организации и руководства кадров стихийное культурное выражение рабочих и крестьян может скатиться к инерции старых форм: снова петь старые песни, рисовать старые узоры, лишь заменив в словах «царя» на «председателя». Настоящей социалистической новой культуре нужен тот, кто укажет направление и удержит меру.\n\nКадры приходят не затем, чтобы «заменить» творчество рабочих и крестьян, а чтобы помочь ему «подняться». Деревня может сама вести стенгазету, но если никто не объяснит, какое содержание соответствует социалистическим принципам, она может написать нечто шумное, но лишенное глубины.\n\nУ обеих сторон есть свои основания.\n\nСторонники самотворчества рабочих и крестьян говорят: культура под руководством кадров в конце концов станет «кадровой культурой», а массы останутся пассивными получателями. Новая культура потеряет свое драгоценнейшее качество - массовость. Культура без участия масс, как бы высока она ни была, не является социалистической культурой.\n\nСторонники руководства кадров отвечают: полная стихийность может привести к культурному откату. Культурному прогрессу нужны направление и стандарты, а дать их могут только кадры, получившие больше образования и подготовки. Если говорить только о «массовости» и не говорить о «передовом характере», новая культура навсегда останется на уровне стенгазеты и частушки.\n\nОтвет на этот вопрос определит основу будущего культурного строительства: будет ли культура строиться сверху вниз или расти снизу вверх? Первое гарантирует скорость и порядок, второе - правду и тепло. Но культура сама по себе требует времени для брожения: слишком быстро - останется на поверхности; слишком медленно - можно упустить момент. Найти жизнеспособную дорогу между ними и есть настоящая трудность этой дискуссии.\n\nСовещание решило голосовать. Представители сочли:"
  rus_stalin_new_culture_events.1.a: "Если не касается земли, зачем ему пылиться на высоте?"
  rus_stalin_new_culture_events.1.a.tt: "Мы сделаем упор на самотворчество рабочих и крестьян."
  rus_stalin_new_culture_events.1.b: "Если нет руководства, зачем нужны авангардные кадры?"
  rus_stalin_new_culture_events.1.b.tt: "Мы сделаем упор на руководство кадров."
  rus_stalin_new_culture_events.2.t: "«Популяризация» или «возвышение»?"
  rus_stalin_new_culture_events.2.desc: "Культурные ресурсы ограничены, и это почти не требует доказательств. Бумага, краска, пленка, учителя, кинопроекторы - у всего есть нормы, за каждое ассигнование приходится бороться снова и снова. Когда в деревню можно направить лишь столько-то материалов, выбор неизбежно оказывается на столе: потратить ограниченные средства на сто тысяч букварей или на роскошно изданный сборник революционных стихов?\n\nЭтот вопрос поставил представитель Народного комиссариата просвещения. В своем выступлении он привел несколько расчетов: «При нынешней норме бумаги и печатных мощностях бумага на один двухсотстраничный сборник стихов позволит напечатать восемь тысяч учебных плакатов. Плакаты можно повесить в восьми тысячах деревенских клубов, а сборник стихов окажется лишь на нескольких сотнях полок».\n\nВ зале кто-то опустил голову и стал считать. Никто не говорил.\n\nСпор быстро разделился на два пути.\n\nОдна сторона утверждала: первая задача культурного строительства - дать как можно большему числу людей соприкоснуться с культурой. Если человек не читал книг, не слушал пьес и не видел картин, нельзя обсуждать с ним, какая книга, пьеса или картина хороша. Сначала нужно развернуть количество, посеять семена культуры как можно шире, и только после того, как каждый сможет читать, смотреть газету и увидеть фильм, говорить о качестве. Это реалистичный и надежный путь.\n\nПри таком подходе ресурсы должны прежде всего идти на массовые культурные мероприятия: больше сельских кинопередвижек, больше учебников для ликбеза, больше странствующих театральных трупп. Сборник стихов может быть тонким, даже отпечатанным на ротаторе; картина не обязана иметь высокий художественный уровень, если ее можно повесить в каждом деревенском клубе. Лучше что-то, чем ничего; лучше больше, чем меньше."
  rus_stalin_new_culture_events.2.desc_2: "Другая сторона признавала важность популяризации, но считала, что условием популяризации является наличие того, что стоит популяризировать. Если новая культура навсегда останется на уровне листовок и плакатов, она никогда не заменит старую культуру в сердцах масс. Крестьянин может посмотреть десять грубых выездных постановок и забыть их, но запомнить несколько строк из хорошей пьесы - и эти строки укоренятся в нем, став мерилом для других вещей.\n\nПри таком подходе ресурсы следует сосредоточить на создании лучших произведений: поддержать хороший сценарий, издать хороший роман, снять хороший фильм. Даже если из-за этого будет напечатано на десятки тысяч листовок меньше, одно произведение, действительно вошедшее в сердце масс, окажет влияние куда большее, чем агитматериалы, забытые сразу после прочтения. Условие перехода количества в качество состоит в том, что само качество достойно существования.\n\nРазличие между двумя позициями в сущности есть различие в понимании «временной логики культурного строительства».\n\nСторонники популяризации считают, что культура не может совершить скачок за одно поколение. Сначала все должны перестать быть неграмотными, затем можно говорить о «классике»; сначала все должны увидеть театр, затем можно говорить о «хорошем театре». Этот путь медленнее, но устойчивее и лучше соответствует объективным ограничениям.\n\nСторонники возвышения считают, что культурный скачок как раз и совершается через немногие выдающиеся произведения. Первый тираж «Манифеста Коммунистической партии» был невелик, но он изменил способ мышления всего мира. Если говорить только о «количестве» и не говорить о «качестве», культурное строительство превратится в бездушную статистическую игру, после которой останутся лишь цифры и ни одного памятного произведения.\n\nСовещание решило голосовать. Большинство представителей больше согласилось с:"
  rus_stalin_new_culture_events.2.a: "Количество переходит в качество."
  rus_stalin_new_culture_events.2.a.tt: "Мы поддержим линию популяризации."
  rus_stalin_new_culture_events.2.b: "Одна классика стоит тысячи листовок."
  rus_stalin_new_culture_events.2.b.tt: "Мы поддержим линию возвышения."
  rus_stalin_new_culture_events.3.t: "Направление революционного искусства"
  rus_stalin_new_culture_events.3.desc: "«Как должна выглядеть новая культура?»\n\nЭтот вопрос задал представитель с юга: «Мы построили школы, выпускаем газеты, открыли клубы - но что будут играть в клубах? Что будет висеть на стенах? Если у новой культуры нет собственного художественного языка, она навсегда останется водой без корней».\n\nВ зале сложились два мнения.\n\nПервое защищало предложенный товарищем Ждановым революционный реализм.\n\nИскусство должно укореняться в действительности и точно отражать конкретную борьбу социалистического строительства. Это не механическое копирование жизни, а изображение через правдивые детали и конкретные ситуации, чтобы рабочие и крестьяне увидели в искусстве собственную жизнь: грязь на гусеницах трактора, пыль в амбаре, морщины на лицах колхозников, выжженные солнцем. Революционный реализм верит: сама действительность уже обладает достаточной силой, искусству нужно лишь честно ее показать."
  rus_stalin_new_culture_events.3.desc_2: "Другое мнение защищало революционный романтизм товарища Маяковского.\n\nОдного отражения действительности недостаточно. Революция - это не только то, что происходит сейчас, но и то, чем станет будущее. Искусство должно иметь температуру выше реальности, должно рисовать даль, способную вести народ вперед. Оно не избегает идеала, даже намеренно усиливает его, потому что рабочие и крестьяне должны видеть в искусстве конечную цель своей борьбы. Революционный романтизм верит: искусство - не зеркало, а лампа. Оно не только показывает действительность, но и освещает путь.\n\nРеалисты считают, что романтизм легко скатывается в пустую лирику; романтики опасаются, что реализм превратится в посредственную запись мелкого быта. У обеих сторон есть позиции и доводы.\n\nНаправление искусства определит облик литературы и искусства страны на ближайшее десятилетие, а также то, каким образом целое поколение будет понимать эпоху, в которой живет.\n\nСовещание решило голосовать. Перед представителями стояли два варианта:"
  rus_stalin_new_culture_events.3.a: "Пусть искусство укоренится в реальной борьбе, а высшим мерилом будет правда."
  rus_stalin_new_culture_events.3.a.tt: "Мы поддержим революционный реализм."
  rus_stalin_new_culture_events.3.b: "Пусть искусство смотрит в будущее, а высшим мерилом будет идеал."
  rus_stalin_new_culture_events.3.b.tt: "Мы поддержим революционный романтизм."
  rus_stalin_new_culture_events.4.t: "Религия и социализм"
  rus_stalin_new_culture_events.4.desc: "Бывшую Российскую империю можно назвать почти полурелигиозной страной. Влияние православия и церкви проникало в каждый угол народной жизни: от крещения при рождении до заупокойной молитвы, от благословения перед весенней пахотой до благодарственного молебна после осенней жатвы. Присутствие церкви в жизни людей было долговечнее присутствия любого административного учреждения. Большинство наших революционеров в юности тоже были православными. Никто не может отрицать, что церковь сохраняла крестьянские устные традиции, раздавала хлеб в годы голода и долгое время оставалась единственным культурным центром русской деревни.\n\nНекоторые считают, что наши цели по сути совпадают с видением ранних христиан: мир во всем мире, единство человечества, равенство всех. По их мнению, сопротивление раннего христианства рабству Римской империи и сопротивление социализма капиталистической эксплуатации имеют некую общую «духовную окраску», только первые возлагали надежды на загробный мир, а вторые стремятся осуществить их в этом. Такая точка зрения на преемственность заставляет некоторых предлагать не уничтожение, а преобразование, используя социалистическое строительство для усвоения ценных частей религиозной культуры.\n\nНо голос противников звучит столь же громко: ранние христиане ждали Царства Небесного, а мы строим человеческий мир. Христианская церковь как общественная организация самим своим существованием зависит от вмешательства «сверхъестественного авторитета» в земной порядок, что коренным образом несовместимо с рационалистической основой социализма. Если позволить церкви продолжать существование, она станет старым гвоздем под дорожным полотном, который однажды внезапно проколет шину."
  rus_stalin_new_culture_events.4.desc_2: "Проблема не исчерпывается этим. Власть религии в деревне не только духовна. Церковь владеет землей, хотя та уже конфискована в ходе земельной реформы; владеет школами, которые сейчас преобразуются; обладает монополией на обряды рождения, болезни, смерти и поминовения. Ей не нужно открыто противостоять советской власти. Достаточно продолжать играть в деревне роль «другого авторитета», и низовые организации нового режима уже почувствуют себя связанными по рукам и ногам. К кому крестьянин пойдет первым, столкнувшись с бедой: к секретарю ячейки или к священнику? Во многих местах ответ все еще неясен.\n\nВ итоге совещание выработало две разные линии.\n\nПолностью устранить религиозное влияние. Церковь и старый строй едины; пока религиозное влияние не устранено, социалистическая идеология не сможет по-настоящему укорениться в деревне. Храмы следует превратить в клубы или склады, религиозное обучение запретить, духовенство перевести на другие занятия или подвергнуть перевоспитанию. Только полностью перерезав нить между «Богом» и «человеком», народ поймет: спасают его не небесные молитвы, а плуг и молот в его руках.\n\nПостепенно улучшать отношения с религией. Немедленная насильственная отмена религии лишь создаст ненужное противостояние, особенно в деревне, где вера укоренилась глубоко. Через образование, культурное строительство и социальное обеспечение нужно постепенно ослаблять фактическое влияние церкви, чтобы крестьяне, почувствовав, что государство помогает надежнее церкви, естественно повернулись к новому образу жизни. Религия сама исчезнет с изменением общественных условий; нет нужды поспешно «вырывать» ее административными мерами.\n\nПосле последнего голосования совещание склонялось к:"
  rus_stalin_new_culture_events.4.a: "Религия - опиум народа..."
  rus_stalin_new_culture_events.4.a.tt: "Мы порвем с религией."
  rus_stalin_new_culture_events.4.b: "...но вопрос в том, почему народ обращается к Нему."
  rus_stalin_new_culture_events.4.b.tt: "Мы примиримся с религией."
