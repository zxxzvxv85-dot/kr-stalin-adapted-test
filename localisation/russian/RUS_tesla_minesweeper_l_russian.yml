l_russian:
  RUS_tesla_minesweeper_category: "Всероссийская проверка электросети"
  RUS_tesla_minesweeper_category_desc: "Проверьте сеть §Y8x8§! с §Y10§! аварийными узлами. Левая кнопка проверяет узел; число показывает количество аварий среди восьми соседних узлов, а пустые области открываются автоматически. Правая кнопка отмечает опасный узел, повторное нажатие снимает отметку.\n\nЗа §Yx§!-ю проверку подряд в случайных областях строится §Yx§! §Cусиленных энергосетей§!. После каждого раунда действует перерыв §Y60 дней§!. Для проверки компания §Y«Тесла Электрик»§! должна быть привлечена как промышленный концерн."
  RUS_tesla_state_funding: "Государственное финансирование «Тесла Электрик»"
  RUS_tesla_state_funding_desc: "Выделить компании §Y«Тесла Электрик»§! целевой исследовательский грант."
  RUS_tesla_minesweeper_title: "Всероссийская проверка электросети"
  RUS_tesla_minesweeper_board_desc: "Найдите 10 аварий в сети 8x8; пустые области открываются сами, числа показывают соседние аварии."
  RUS_tesla_minesweeper_locked_desc: "Открывается после назначения §YНиколы Теслы§! советником или выбора §Y«Тесла Электрик»§! промышленным концерном."
  RUS_tesla_minesweeper_entry_desc: "Открыть всероссийскую проверку электросети.\n\n§LИнженеры выявляют аварийные узлы, изолируют участки короткого замыкания и руководят ремонтом российской электросети.§!"
  RUS_tesla_minesweeper_entry_category_desc: "§LВыявить аварийные узлы, изолировать замыкания и организовать ремонт сети.§!"
  RUS_tesla_minesweeper_status_ready: "§YРемонтные бригады готовы§!"
  RUS_tesla_minesweeper_status_active: "§GПроверка электросети идёт§!"
  RUS_tesla_minesweeper_status_won: "§GНеисправности устранены§!\n§LСерия [?RUS_tesla_minesweeper_win_streak|0] · Построено [?RUS_tesla_minesweeper_reward_grids|0]§!"
  RUS_tesla_minesweeper_status_won_no_reward: "§GНеисправности устранены§!\n§LСерия [?RUS_tesla_minesweeper_win_streak|0] · Всё охвачено§!"
  RUS_tesla_minesweeper_status_lost: "§RКороткое замыкание§!"
  RUS_tesla_minesweeper_reward: "§YНаграда за серию ремонтов§!\nЗа n-ю подряд завершённую проверку строится до n усиленных энергосетей в случайных подходящих областях."
  RUS_tesla_minesweeper_flags: "Аварий: 10  Отмечено: [?RUS_tesla_minesweeper_flags|0]/10"
  RUS_tesla_minesweeper_elapsed: "Время: [?RUS_tesla_minesweeper_elapsed_hours|0] ч"
  RUS_tesla_minesweeper_cooldown: "§YОбслуживание оборудования: 60 дней§!"
  RUS_tesla_minesweeper_start: "Начать новую проверку"
  RUS_tesla_minesweeper_start_tooltip: "Выделить новый участок электросети 8x8 для проверки. После каждой операции оборудование обслуживается 60 дней."
  RUS_tesla_minesweeper_cell_tooltip: "§YЛевая кнопка§!: проверить узел\n§YПравая кнопка§!: отметить опасный узел\n§YЛюбая кнопка на отмеченном узле§!: снять отметку\n§LПервая проверка всегда безопасна.§!"
