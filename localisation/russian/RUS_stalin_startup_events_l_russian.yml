l_russian:
  rus_stalin_startup_events.1.t: "Наследие голода на Волге"
  rus_stalin_startup_events.1.desc: "После Гражданской войны в памяти современных русских, помимо катастрофического дальневосточного похода, сильнее всего отпечатался великий голод, охвативший бассейн Волги в 1932 году.\n\nВесной и летом 1932 года Поволжье поразила необычайная засуха. С мая почти не было настоящих дождей; к июлю палящий зной выжег молодые всходы, и пшеничные поля, которым следовало стать золотыми, превратились в серо-бурые пустоши. Более чем в тридцати уездах среднего и нижнего течения Волги урожай зерна составил менее одной пятой обычного года. Один чиновник, посланный осмотреть район, писал в донесении: «Это уже не царство людей; остались только кости и отчаяние».\n\nГолод распространялся стремительно. Люди сдирали кору с деревьев, варили коренья трав и даже мололи глину в порошок, чтобы наполнить желудок. Скот массово погибал из-за нехватки корма, а во многих деревнях исчезли даже звуки кур и собак. По неполным оценкам, с зимы 1932 года до весны 1933 года в Поволжье от голода умерли сотни тысяч людей. Беженцы тянулись вдоль железных дорог к Москве, а тех, кто падал в пути, оставляли без погребения."
  rus_stalin_startup_events.1.desc_2: "Социальные последствия этого голода были глубокими.\n\nВо-первых, была разорвана сама структура деревенского общества. И без того хрупкое среднее крестьянство почти исчезло: одних разорил голод, другие продали последнее зерно ради выживания, а огромное большинство опустилось в бедность. Кулаки тем временем прятали зерно, давали ссуды под грабительские проценты и за унизительную цену поглощали землю и орудия труда. Неравенство за один сезон расширилось до потрясающих размеров. Старые, грубые обычаи крестьянской взаимопомощи уступили место голой борьбе за выживание.\n\nВо-вторых, доверие крестьян к правительству упало до самой низкой отметки. Никто больше не верил кадетскому лозунгу о том, что «свобода приносит свободу». Крестьяне повернулись к народническому движению Союза защиты, убеждённые, что Савинков, «герой крестьян», сможет повести их к возвращению земли. Так голод стал одной из главных причин последующего прихода Савинкова к власти.\n\nНаконец, голод самым жестоким образом показал неотложность земельной реформы. После этой катастрофы земельный строй России стал хрупким, как натянутая струна, неспособной выдержать новое напряжение.\n\nЕсли не преобразовать производственные и распределительные отношения в деревне, следующий голод будет ещё страшнее — и когда он придёт, второго шанса начать заново может уже не остаться."
  rus_stalin_startup_events.next: "Продолжить."
  rus_stalin_startup_events.1.a: "Трагедия больше не повторится!"
