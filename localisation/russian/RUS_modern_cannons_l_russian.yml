l_russian:
 RUS_modern_high_velocity_cannon: "Современная скорострельная пушка"
 RUS_modern_high_velocity_cannon_desc: "Современное орудие с исключительно высокой начальной скоростью снаряда. Специализированные боеприпасы обеспечивают превосходное поражение брони, а улучшенные снаряды повышают эффективность против живой силы."
 RUS_modern_heavy_cannon: "Современная тяжёлая пушка"
 RUS_modern_heavy_cannon_desc: "Современное крупнокалиберное орудие с высокой эффективностью против живой силы и бронетехники, ценой значительных размеров, массы и стоимости."
 EQ_MOD_CAT_RUS_modern_main_armament_TITLE: "Основное вооружение современного танка"
 RUS_modern_cannons_unlock: "Вооружение современного танка"
 RUS_modern_cannons_unlock_desc: "На шасси современных танков можно устанавливать современную скорострельную и современную тяжёлую пушки."
