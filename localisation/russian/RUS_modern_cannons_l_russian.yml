l_russian:
 RUS_modern_high_velocity_cannon: "Современная скорострельная пушка"
 RUS_modern_high_velocity_cannon_desc: "Современное орудие с исключительно высокой начальной скоростью снаряда. Специализированные боеприпасы обеспечивают превосходное поражение брони, а улучшенные снаряды повышают эффективность против живой силы."
 RUS_modern_heavy_cannon: "Современная тяжёлая пушка"
 RUS_modern_heavy_cannon_desc: "Современное крупнокалиберное орудие с высокой эффективностью против живой силы и бронетехники, ценой значительных размеров, массы и стоимости."
 EQ_MOD_CAT_RUS_modern_main_armament_TITLE: "Основное вооружение современного танка"
 RUS_modern_cannons_unlock: "Вооружение современного танка"
 RUS_modern_cannons_unlock_desc: "Завершение спецпроекта «Современный оперённый бронебойный подкалиберный снаряд» открывает современную скорострельную и современную тяжёлую пушки. Обе считаются средним основным вооружением и больше не требуют современного танкового шасси."
 sp_land_modern_fin_stabilized_discarding_sabot: "Современный оперённый бронебойный подкалиберный снаряд"
 sp_land_modern_fin_stabilized_discarding_sabot_desc: "Разработать новое поколение оперённых бронебойных подкалиберных боеприпасов с отделяющимся поддоном, чьи удлинённый сердечник, высокая скорость и аэродинамическая устойчивость значительно повышают бронепробиваемость современных танковых орудий."
 sp_land_modern_fin_stabilized_discarding_sabot_speed_factor: "Скорость исследования современных оперённых бронебойных подкалиберных снарядов"
