l_russian:
 RUS_japanese_antiwar_movement:0 "Рост антивоенного движения"
 RUS_japanese_antiwar_movement_desc:0 "Противодействие имперской экспансии охватывает заводы, университеты и порты. Всё больше японцев задаются вопросом, кому выгодна война."
 RUS_active_northeast_resistance:0 "Активное сопротивление на северо-востоке"
 RUS_active_northeast_resistance_desc:0 "Партизаны на железных дорогах взаимодействуют с городским подпольем. Народное сопротивление расшатывает порядок, созданный фэнтяньскими властями и японским капиталом."
 RUS_northeast_anti_japanese_network:0 "Северо-восточная антияпонская сеть"
 RUS_northeast_anti_japanese_network_desc:0 "Тайные связные объединяют силы сопротивления. Проводники, разведданные и снабжение движутся по путям, которых нет на официальных картах."
 RUS_transcontinental_economic_cooperation:0 "Трансконтинентальное экономическое сотрудничество"
 RUS_transcontinental_economic_cooperation_desc:0 "Расстояние не может помешать сотрудничеству трудящихся. Инженеры обмениваются знаниями, а новые дороги и производственные планы связывают промышленные города двух стран."
 RUS_workers_peasants_military_exchange:0 "Совместные занятия Красной армии"
 RUS_workers_peasants_military_exchange_desc:0 "Командиры двух стран изучают опыт боёв над общими картами, превращая его в более продуманные планы будущих операций."
 RUS_project_156_sponsor:0 "Проект 156"
 RUS_project_156_sponsor_desc:0 "Промышленное оборудование, чертежи и инженеры отправляются в Китай. Программа задействует отечественные производственные и строительные мощности и поддерживается регулярными взаимными расчётами."
 RUS_project_156_recipient:0 "Проект 156"
 RUS_project_156_recipient_desc:0 "По всему Китаю закладываются новые промышленные центры. Российские специалисты и китайские рабочие совместно создают основы самостоятельной промышленной экономики."
 RUS_sino_soviet_friendship_treaty:0 "Советско-китайский договор о дружбе и союзе"
 RUS_sino_soviet_friendship_treaty_desc:0 "Общие интересы и убеждения связывают наши народы. От пограничных постов и верфей до авиационных конструкторских бюро и рабочих собраний сотрудничество укрепляет совместную защиту мира."
 RUS_sino_soviet_treaty_easy_equipment:0 "Лёгкий режим: советско-китайское сотрудничество в вооружении"
 RUS_sino_soviet_treaty_easy_equipment_desc:0 "Сотрудничество в авиационной промышленности превращает общие разработки в более обильные поставки техники."
 RUS_northeast_network_combat:0 "Северо-восточная сеть сопротивления"
 RUS_northeast_network_combat_easy:0 "Северо-восточная сеть: лёгкий режим"
 RUS_northeast_network_targets_tt:0 "Атака и защита армии против несоциалистической §Y[JAP.GetName]§! и сотрудничающей с ней §Y[FNG.GetName]§!: §G+[GetRUSEastAsiaNetworkBonus]%§!. Бонус против страны прекращается при изменении её позиции."
 RUS_project_156_monthly_surplus_tt:0 "£civ_factory_output Ежемесячный экономический профицит: §G+[GetRUSEastAsiaMonthlySurplus]§!"
 RUS_project_156_monthly_infrastructure_tt:0 "Ежемесячно независимо выбираются §Y[GetRUSEastAsiaInfrastructureDraws]§! случайных национальных региона под нашим владением и контролем, где есть место для строительства. Каждый выбор немедленно добавляет §G1§! уровень §Yинфраструктуры§!. Один регион может быть выбран повторно; при отсутствии подходящих регионов выбор пропускается."
