l_russian:
  RUS_stalin_adapted_steel_comrade_achievement_NAME: "Стальной товарищ"
  RUS_stalin_adapted_steel_comrade_achievement_DESC: "Играя за социалистическую Россию, привести Сталина к власти и объединить страну под его знаменем."
  RUS_stalin_adapted_steel_comrade_achievement_tt: "Пойти по §Yсталинскому пути§!, сделать §YСталина§! главой России и завершить фокус §Y$RUS_unite_under_stalin$§!."

  RUS_stalin_adapted_plan_overfulfilled_achievement_NAME: "План перевыполнен"
  RUS_stalin_adapted_plan_overfulfilled_achievement_DESC: "Успешно завершить первую пятилетку с перевыполненным результатом в 135 очков."
  RUS_stalin_adapted_plan_overfulfilled_achievement_tt: "Успешно завершить §Yпервую пятилетку§!, набрав в общей сложности §Y135 очков§!."

  RUS_stalin_adapted_field_to_classroom_achievement_NAME: "От поля до школы"
  RUS_stalin_adapted_field_to_classroom_achievement_DESC: "Завершить максималистскую земельную реформу и социалистическую реформу образования."
  RUS_stalin_adapted_field_to_classroom_achievement_tt: "Успешно завершить §Yмаксималистскую земельную реформу§! и §Yреформу образования§!."

  RUS_stalin_adapted_red_army_strongest_achievement_NAME: "Красная армия всех сильней"
  RUS_stalin_adapted_red_army_strongest_achievement_DESC: "Победить Германскую империю и превратить Рабоче-крестьянскую Красную армию в непобедимую легенду."
  RUS_stalin_adapted_red_army_strongest_achievement_tt: "Завершить фокус §Y$RUS_fr_revolutionary_military_system_finalised$§!."

  RUS_stalin_adapted_three_agendas_achievement_NAME: "Три задачи, одно направление"
  RUS_stalin_adapted_three_agendas_achievement_DESC: "Завершить все три политические задачи под руководством Сталина."
  RUS_stalin_adapted_three_agendas_achievement_tt: "Пусть §YСталин§! завершит все три свои политические задачи."

  RUS_stalin_adapted_childish_fantasy_achievement_NAME: "Какая детская фантазия — но со Сталиным"
  RUS_stalin_adapted_childish_fantasy_achievement_DESC: "На сталинском пути создать Советский Союз и возглавляемый Москвой Коммунистический Интернационал."
  RUS_stalin_adapted_childish_fantasy_achievement_tt: "Пойти по §Yсталинскому пути§!, завершить фокусы §Y$RUS_found_communist_international$§! и §Y$RUS_found_sov_union$§! и создать §YСоюз Советских Социалистических Республик§!."
