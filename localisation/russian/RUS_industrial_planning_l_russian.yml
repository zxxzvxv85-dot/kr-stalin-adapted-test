 RUS_ip_region_0_active:0 "§YMoscow§!"
 RUS_ip_region_0_tab:0 "[GetRUSIPRegionTab0]"
 RUS_ip_region_0_summary:0 "§YMoscow§! · Coal §Y8§! · Iron §Y10§! · Rocks §Y5§! · Tiles §Y56§!"
 RUS_ip_region_0_tt:0 "§YMoscow§!\nModerate coal and iron in a compact industrial hinterland.\nCoal: §Y8§!; iron: §Y10§!; rocks: §Y5§!.\nRandom positions per new plan, saved thereafter.\nSwitch maps; other regions keep producing."
 RUS_ip_region_1:0 "Petrograd"
 RUS_ip_region_1_active:0 "§YPetrograd§!"
 RUS_ip_region_1_tab:0 "[GetRUSIPRegionTab1]"
 RUS_ip_region_1_summary:0 "§YPetrograd§! · Coal §Y5§! · Iron §Y6§! · Rocks §Y4§! · Tiles §Y49§!"
 RUS_ip_region_1_tt:0 "§YPetrograd§!\nSparse deposits and limited space favour compact production.\nCoal: §Y5§!; iron: §Y6§!; rocks: §Y4§!.\nRandom positions per new plan, saved thereafter.\nSmall deposits are sandbox starting reserves.\nSwitch maps; other regions keep producing."
 RUS_ip_region_2:0 "Tsaritsyn"
 RUS_ip_region_2_active:0 "§YTsaritsyn§!"
 RUS_ip_region_2_tab:0 "[GetRUSIPRegionTab2]"
 RUS_ip_region_2_summary:0 "§YTsaritsyn§! · Coal §Y5§! · Iron §Y7§! · Rocks §Y4§! · Tiles §Y41§!"
 RUS_ip_region_2_tt:0 "§YTsaritsyn§!\nLittle coal, slightly more iron, and a narrow north–south footprint.\nCoal: §Y5§!; iron: §Y7§!; rocks: §Y4§!.\nRandom positions per new plan, saved thereafter.\nSmall deposits are sandbox starting reserves.\nSwitch maps; other regions keep producing."
 RUS_ip_region_3:0 "West Siberia"
 RUS_ip_region_3_active:0 "§YWest Siberia§!"
 RUS_ip_region_3_tab:0 "[GetRUSIPRegionTab3]"
 RUS_ip_region_3_summary:0 "§YWest Siberia§! · Coal §Y14§! · Iron §Y18§! · Rocks §Y8§! · Tiles §Y68§!"
 RUS_ip_region_3_tt:0 "§YWest Siberia§!\nRich in both ores, with more iron deposits for steel expansion.\nCoal: §Y14§!; iron: §Y18§!; rocks: §Y8§!.\nRandom positions per new plan, saved thereafter.\nSwitch maps; other regions keep producing."
 RUS_ip_region_4:0 "Central Siberia"
 RUS_ip_region_4_active:0 "§YCentral Siberia§!"
 RUS_ip_region_4_tab:0 "[GetRUSIPRegionTab4]"
 RUS_ip_region_4_summary:0 "§YCentral Siberia§! · Coal §Y18§! · Iron §Y18§! · Rocks §Y10§! · Tiles §Y99§!"
 RUS_ip_region_4_tt:0 "§YCentral Siberia§!\nAbundant, balanced ores with the largest building area.\nCoal: §Y18§!; iron: §Y18§!; rocks: §Y10§!.\nRandom positions per new plan, saved thereafter.\nSwitch maps; other regions keep producing."
 RUS_ip_region_5:0 "Far East"
 RUS_ip_region_5_active:0 "§YFar East§!"
 RUS_ip_region_5_tab:0 "[GetRUSIPRegionTab5]"
 RUS_ip_region_5_summary:0 "§YFar East§! · Coal §Y8§! · Iron §Y16§! · Rocks §Y10§! · Tiles §Y57§!"
 RUS_ip_region_5_tt:0 "§YFar East§!\nIron-rich, coal-poor and rocky; coal constrains expansion.\nCoal: §Y8§!; iron: §Y16§!; rocks: §Y10§!.\nRandom positions per new plan, saved thereafter.\nSwitch maps; other regions keep producing."
 RUS_ip_build_1:0 "Coal mine"
 RUS_ip_cost_1:0 "§R-3§! / level"
 RUS_ip_build_1_tt:0 "§YCoal mine§!\n\nFacility level: §G+1§!\nInvestment: §R-3§!\n\n§YAt full production, per level:§!\nDaily coal output: §G+0.30§!\n\nRequires a matching deposit; maximum level §Y3§!. Cannot replace another facility.\nConnect to the depot to operate. Weak route segments limit capacity; shortages limit output."
 RUS_ip_build_2:0 "Iron mine"
 RUS_ip_cost_2:0 "§R-3§! / level"
 RUS_ip_build_2_tt:0 "§YIron mine§!\n\nFacility level: §G+1§!\nInvestment: §R-3§!\n\n§YAt full production, per level:§!\nDaily iron output: §G+0.30§!\n\nRequires a matching deposit; maximum level §Y3§!. Cannot replace another facility.\nConnect to the depot to operate. Weak route segments limit capacity; shortages limit output."
 RUS_ip_build_3:0 "Power station"
 RUS_ip_cost_3:0 "§R-5§! / level"
 RUS_ip_build_3_tt:0 "§YPower station§!\n\nFacility level: §G+1§!\nInvestment: §R-5§!\n\n§YAt full production, per level:§!\nDaily coal consumption: §R-0.10§!\nDaily power supply: §G+0.60§!\n\nRequires ordinary industrial land; maximum level §Y3§!. Cannot replace another facility.\nConnect to the depot to operate. Weak route segments limit capacity; shortages limit output."
 RUS_ip_build_4:0 "Steelworks"
 RUS_ip_cost_4:0 "§R-6§! / level"
 RUS_ip_build_4_tt:0 "§YSteelworks§!\n\nFacility level: §G+1§!\nInvestment: §R-6§!\n\n§YAt full production, per level:§!\nDaily coal consumption: §R-0.20§!\nDaily iron consumption: §R-0.20§!\nDaily power demand: §R+0.40§!\nDaily steel output: §G+0.20§!\n\nRequires ordinary industrial land; maximum level §Y3§!. Cannot replace another facility.\nConnect to the depot to operate. Weak route segments limit capacity; shortages limit output."
 RUS_ip_build_5:0 "Machine works"
 RUS_ip_cost_5:0 "§R-8§! / level"
 RUS_ip_build_5_tt:0 "§YMachine works§!\n\nFacility level: §G+1§!\nInvestment: §R-8§!\n\n§YAt full production, per level:§!\nDaily steel consumption: §R-0.40§!\nDaily power demand: §R+0.20§!\nDaily machinery delivery: §G+0.20§!\n\nRequires ordinary industrial land; maximum level §Y3§!. Cannot replace another facility.\nConnect to the depot to operate. Weak route segments limit capacity; shortages limit output."
 RUS_ip_rail:0 "Transport line"
 RUS_ip_remove:0 "Remove plant"
 RUS_ip_remove_rail:0 "Remove line"
 RUS_ip_switch:0 "Stop / run"
 RUS_ip_refresh:0 "Refresh"
 RUS_ip_start:0 "Start production"
 RUS_ip_help:0 "How to play"
 RUS_ip_back:0 "Back to factory"
 RUS_ip_restart:0 "Reset board"
 RUS_ip_confirm_restart:0 "Confirm reset"
 RUS_ip_cost_rail:0 "§R-1§! / level"
 RUS_ip_rail_tt:0 "§YFactory transport line§!\n\nLine level: §G+1§!\nInvestment: §R-1§!\n\nConnect through orthogonal neighbours to the §Ylocal depot§!.\nShares tiles with facilities; maximum level §Y3§!. Effective capacity is limited by the weakest segment along the best route."
 RUS_ip_remove_tt:0 "§YRemove facility§!\nRefund all investment paid for this facility.\nKeep the line, stocks and deliveries. The depot cannot be removed."
 RUS_ip_remove_rail_tt:0 "§YRemove line§!\nRefund all investment paid for this line.\nKeep its facility; downstream facilities may disconnect. The depot cannot be removed."
 RUS_ip_switch_tt:0 "§YStop / run§!\nA stopped facility neither produces nor consumes materials or power. Its line still carries traffic."
 RUS_ip_refresh_tt:0 "Recalculate connectivity, capacity and next-day output without advancing time or producing goods."
 RUS_ip_start_tt:0 "Begin §Y1800§! days of continuous production. Facilities run each game day, even with this window closed.\nGoal: deliver §Y500§! machines. Production stops at expiry and results remain visible."
 RUS_ip_restart_tt:0 "§YReset board§!\nConfirm again to clear all six boards, stocks, deliveries and clock; restore investment and randomise all deposits and rocks.\nThis independent prototype does not grant real factories or alter the old Five-Year Plan."
 RUS_ip_footnote:0 "Independent test board · machinery counts as delivery score · production follows game time"
 RUS_ip_help_title:0 "Factory Planning · How to Play"
 RUS_ip_help_0:0 "§Y1. Plan, then start§!\nTake the test decision. Share §Y40§! investment; each region starts with §Y6§! coal, §Y4§! iron and §Y2§! steel. Arrange the factory, then Start production. Deliver §Y500§! machines in §Y1800§! game days. Closing this window does not pause production."
 RUS_ip_help_1:0 "§Y2. Six regional endowments§!\nThree cities, West Siberia, Central Siberia and the Far East use KR-inspired outlines. Each has different deposit quotas, randomised once per new plan. Switching and reloading preserve them. Poor cities retain starter deposits.\nMines need deposits; other plants use plain tiles. Levels are green, blue and gold; dark rocks cannot be developed. Hover for line grades and details."
 RUS_ip_help_2:0 "§Y3. Lay out transport§!\nPlace lines under facilities and along a route to the §Ylocal depot§!, using orthogonal neighbours.\nFacilities and lines reach level §Y3§!. A level-three plant on a level-one route produces at level one. Upgrade weak segments or build a better route."
 RUS_ip_help_3:0 "§Y4. Find the bottleneck§!\nA steelworks level uses §R0.20§! coal, §R0.20§! iron and §R0.40§! power to produce §G0.20§! steel daily. A machinery level uses §R0.40§! steel and §R0.20§! power to deliver §G0.20§! machines.\nBalance each region separately: stocks and power do not cross regions. All six factories run together; deliveries add to the shared score."
 RUS_ip_help_4:0 "§Y5. Expand and rearrange§!\nEach delivered machine returns §G1.00§! investment. Expand mines, plants and lines with the proceeds. There are no periodic grants.\nDemolition refunds actual investment. Stopping plants saves resources; lines remain open. Daily order: mines, power, steel, machinery."
 RUS_ip_help_5:0 "§Y6. Forecasts and expiry§!\nThe forecast multiplies next-day output by §Y30§!; it does not guarantee a month of supply. Depleting stocks changes output.\nAt expiry production stops and results remain. Confirm a reset twice to replay. This independent prototype has no native factory rewards and does not replace the old Five-Year Plan."
