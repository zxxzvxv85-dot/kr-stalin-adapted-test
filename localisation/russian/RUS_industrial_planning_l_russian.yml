 RUS_ip_build_1:0 "Coal mine  2"
 RUS_ip_build_1_tt:0 "§YBuild or upgrade Coal mine§!\nCost: 2 investment. Each level produces 3 coal per round. Requires coal potential.\nRequires an empty district or the same facility, owned and controlled by Russia. Maximum level 3."
 RUS_ip_build_2:0 "Iron mine  2"
 RUS_ip_build_2_tt:0 "§YBuild or upgrade Iron mine§!\nCost: 2 investment. Each level produces 3 iron per round. Requires iron potential.\nRequires an empty district or the same facility, owned and controlled by Russia. Maximum level 3."
 RUS_ip_build_3:0 "Power station  3"
 RUS_ip_build_3_tt:0 "§YBuild or upgrade Power station§!\nCost: 3 investment. Each level burns 1 coal for 6 power per round.\nRequires an empty district or the same facility, owned and controlled by Russia. Maximum level 3."
 RUS_ip_build_4:0 "Steelworks  4"
 RUS_ip_build_4_tt:0 "§YBuild or upgrade Steelworks§!\nCost: 4 investment. Each level produces up to 2 steel. Each unit uses 1 coal, 1 iron, 2 power and 1 transport.\nRequires an empty district or the same facility, owned and controlled by Russia. Maximum level 3."
 RUS_ip_build_5:0 "Machinery works  5"
 RUS_ip_build_5_tt:0 "§YBuild or upgrade Machinery works§!\nCost: 5 investment. Each level produces up to 2 machines. Each unit uses 2 steel, 1 power and 1 transport.\nRequires an empty district or the same facility, owned and controlled by Russia. Maximum level 3."
 RUS_ip_rail:0 "Ж/д  2"
 RUS_ip_rail_tt:0 "§YBuild or upgrade rail§!\nCosts 2 investment. Adjacent rail connects automatically. Each level connected to Moscow adds 2 processing transport."
 RUS_ip_remove:0 "Снести завод"
 RUS_ip_remove_rail:0 "Снять ж/д"
 RUS_ip_remove_tt:0 "Remove this facility and refund investment actually paid into it this exercise. Free starting facilities have no refund."
 RUS_ip_remove_rail_tt:0 "Remove this rail and refund investment actually paid. Downstream districts may lose their connection."
 RUS_ip_settle:0 "Завершить этап"
 RUS_ip_settle_tt:0 "Recheck territorial control and rail connections, then consume inputs and resolve production.\nEach round resolves once; the exercise ends after five rounds."
 RUS_ip_refresh:0 "Обновить прогноз"
 RUS_ip_refresh_tt:0 "Recheck territory, rail and output forecasts without advancing or producing."
 RUS_ip_restart:0 "Новый план"
 RUS_ip_restart_confirm:0 "Подтвердить"
 RUS_ip_restart_tt:0 "Start a new five-round exercise. Click once to reveal confirmation; confirm again to clear only this exercise layout, stocks and score."
