 RUS_ip_start_tt:0 "Begin this independent 1800-day programme once. Each completed coal or iron mine restores 2 percentage points of extraction efficiency; 15 mines clear the penalty. Any remaining penalty ends with the programme."
 RUS_ip_refresh_tt:0 "Recheck territory, rail and work without advancing time. National capacity updates daily."
 RUS_ip_pause_tt:0 "Pause or resume. Paused work releases commitments and preserves progress."
 RUS_ip_cancel_tt:0 "Confirm to discard this project progress and release commitments. Completed facilities remain."
 RUS_ip_help_title:0 "Industrial construction · How to play"
 RUS_ip_help_0:0 "§Y1. Start and choose a site§!\nFirst take Enable Industrial Construction GUI (Test), then Start programme in this window for an independent 1800-day period. Work is delivered to the selected central state. One queued project per district, several districts at once. Closing the window does not stop work."
 RUS_ip_help_1:0 "§Y2. Real assets and supply chains§!\nStarting applies -30% extraction efficiency. Each completed coal or iron mine restores 2 percentage points; 15 clear it. Coal mines add coal, iron mines add steel; grids lower energy needs, steelworks add civs and steel, machine works add arms factories. See native reward tooltips."
 RUS_ip_help_2:0 "§Y3. Commitments§!\nWork reserves real civilian factories, coal and steel. Invalid sites and shortages pause work. Pausing, cancelling or finishing releases commitments. Capacity updates daily; lower district numbers have priority during shortages. Pause projects to adjust priority."
 RUS_ip_help_3:0 "§Y4. Speed and bottlenecks§!\nBase daily work = 1 + infrastructure x 0.12 + civilian factories (cap 20) x 0.025 + resources (cap 40) x 0.005, multiplied by freight and power factors. Coal mines and grids use coal; others use steel. Low national power slows steel and machine works to a minimum of 25%."
 RUS_ip_help_4:0 "§Y5. Rail and transport§!\nUses real rail connections to Moscow. Freight = 1 + infrastructure + rail level, quartered if disconnected. Steel/machine works require connection. Transport adds infrastructure and a level-1 railway from a connected domestic neighbour. Maritime links require ports at both ends and at least 10 convoys."
 RUS_ip_help_5:0 "§Y6. Completion and deadline§!\nProgress advances once per day, delivering real buildings or resources. Each mine type allows three expansions. The deadline cancels unfinished work and releases commitments; completed assets remain. The original Five-Year Plan mission, score and rewards are unchanged."
