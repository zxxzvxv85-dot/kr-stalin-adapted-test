 RUS_ip_test_category:0 "Factory Planning Test"
 RUS_ip_test_category_desc:0 "Prospecting, transport and manufacturing must form a complete system in the new industrial base."
 RUS_ip_enable_gui:0 "Enable Factory Planning (Test)"
 RUS_ip_enable_gui_desc:0 "Test an industrial layout on the planning board."
 RUS_ip_enable_gui_tt:0 "Unlock the separate launcher and open the factory board. Select Start production when ready to begin the §Y1800§!-day programme."
