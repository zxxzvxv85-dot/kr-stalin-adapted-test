 RUS_ip_budget_tt:0 "§YConstruction investment§!\nShared initial investment: §Y40§!\nEach delivered machine returns §G+1.00§! investment.\nDemolition refunds the actual investment paid.\nThis board has its own budget and no periodic grant."
 RUS_ip_stock_tt:0 "§Y[GetRUSIPRegion] · Local stocks§!\nConnected local facilities share stocks. Each region starts with §Y6§! coal, §Y4§! iron and §Y2§! steel. Shortages limit daily output.\nMaterials and power do not transfer between regions. Changing maps preserves stocks."
 RUS_ip_deliveries_tt:0 "§YCombined deliveries§!\nAll six regions operate simultaneously and contribute to the same score.\nCombined next-day rate × 30: §G+[?RUS_ip_total_machine_month|1]§!\nEach machine returns §G+1.00§! shared investment. Target: §Y500§!."
 RUS_ip_power_tt:0 "§YPower§!\nProduced and used daily; not stored. Steelworks draw power before machine works.\nDemand assumes full production at connected, enabled facilities. Coal shortages reduce generation."
