 RUS_ip_title:0 "Госплан · Промышленный план"
 RUS_ip_subtitle:0 "Промышленная карта России / Пять этапов"
 RUS_ip_open_tt:0 "§YIndustrial planning§!\nBuild industry and rail on the Russian map. Complete five production rounds. Closing preserves your exercise."
 RUS_ip_summary:0 "Round §Y[?RUS_ip_round|0]§! / 5  |  Investment §Y[?RUS_ip_budget|0]§!  |  Machines §G[?RUS_ip_machines|0]§!  |  Score §Y[?RUS_ip_score|0]§!"
 RUS_ip_stocks:0 "Stocks    Coal [?RUS_ip_coal|0]    Iron [?RUS_ip_iron|0]    Steel [?RUS_ip_steel|0]\nForecast    Steel +[?RUS_ip_steel_output|0]    Machines +[?RUS_ip_machine_output|0]"
 RUS_ip_network:0 "Connected [?RUS_ip_connected_count|0] / 36  |  Power [?RUS_ip_power_total|0] / demand [?RUS_ip_power_demand|0]  |  Processing transport [?RUS_ip_transport_total|0]"
 RUS_ip_target:0 "Target: §Y[?RUS_ip_target|0]§! cumulative machines. Forecast: §Y[?RUS_ip_next_machines|0]§!.\nMeet the target for 20 points. Next round grants 18 investment. Five rounds total."
 RUS_ip_instructions:0 "Click district number → Build or upgrade → Review forecast → Resolve round\nConnect adjacent districts to Moscow. Blue dashed links represent maritime transfer. Callout lines locate compact western districts."
 RUS_ip_sandbox_note:0 "This exercise uses its own investment and score. It can be replayed and does not alter national factories or Five-Year Plan rewards."
 RUS_ip_legend:0 "C: coal  I: iron  P: power  S: steel  M: machinery  ★: Moscow hub"
 RUS_ip_selected:0 "[GetRUSIPDistrict]"
 RUS_ip_detail:0 "Facility: [GetRUSIPSelectedType]  level §Y[?RUS_ip_sel_level|0]§!\nRail: level §Y[?RUS_ip_sel_rail|0]§!  [GetRUSIPSelectedStatus]\nCoal potential: [GetRUSIPCoalPotential]\nIron potential: [GetRUSIPIronPotential]\n\nControl is checked at the named centre.\nFacility and rail each have three levels."
