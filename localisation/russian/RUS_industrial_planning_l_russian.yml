 RUS_ip_build_1_tt:0 "§YCoal mine§!\n\nFacility level: §G+1§!\nInvestment: §R-3§!\n\n§YAt full production, per level:§!\nDaily coal output: §G+0.30§!\n\nRequires a matching deposit; maximum level §Y3§!. Cannot replace another facility.\nConnect to the depot to operate. Weak route segments limit capacity; shortages limit output."
 RUS_ip_build_2:0 "Iron mine"
 RUS_ip_cost_2:0 "§R-3§! / level"
 RUS_ip_build_2_tt:0 "§YIron mine§!\n\nFacility level: §G+1§!\nInvestment: §R-3§!\n\n§YAt full production, per level:§!\nDaily iron output: §G+0.30§!\n\nRequires a matching deposit; maximum level §Y3§!. Cannot replace another facility.\nConnect to the depot to operate. Weak route segments limit capacity; shortages limit output."
 RUS_ip_build_3:0 "Power station"
 RUS_ip_cost_3:0 "§R-5§! / level"
 RUS_ip_build_3_tt:0 "§YPower station§!\n\nFacility level: §G+1§!\nInvestment: §R-5§!\n\n§YAt full production, per level:§!\nDaily coal consumption: §R-0.10§!\nDaily power supply: §G+0.60§!\n\nRequires ordinary industrial land; maximum level §Y3§!. Cannot replace another facility.\nConnect to the depot to operate. Weak route segments limit capacity; shortages limit output."
 RUS_ip_build_4:0 "Steelworks"
 RUS_ip_cost_4:0 "§R-6§! / level"
 RUS_ip_build_4_tt:0 "§YSteelworks§!\n\nFacility level: §G+1§!\nInvestment: §R-6§!\n\n§YAt full production, per level:§!\nDaily coal consumption: §R-0.20§!\nDaily iron consumption: §R-0.20§!\nDaily power demand: §R+0.40§!\nDaily steel output: §G+0.20§!\n\nRequires ordinary industrial land; maximum level §Y3§!. Cannot replace another facility.\nConnect to the depot to operate. Weak route segments limit capacity; shortages limit output."
 RUS_ip_build_5:0 "Machine works"
 RUS_ip_cost_5:0 "§R-8§! / level"
 RUS_ip_build_5_tt:0 "§YMachine works§!\n\nFacility level: §G+1§!\nInvestment: §R-8§!\n\n§YAt full production, per level:§!\nDaily steel consumption: §R-0.40§!\nDaily power demand: §R+0.20§!\nDaily machinery delivery: §G+0.20§!\n\nRequires ordinary industrial land; maximum level §Y3§!. Cannot replace another facility.\nConnect to the depot to operate. Weak route segments limit capacity; shortages limit output."
