l_russian:
  RUS_malformed_education_system: "Искаженная система образования"
  RUS_malformed_education_system_desc: "Система образования, унаследованная от старого режима, глубоко искажена. Города и узкая элита монополизировали большую часть образовательных ресурсов, тогда как рабочие и крестьяне вынуждены осваивать производство среди бедности и неграмотности. Без глубокой реформы социалистическому строительству будет не хватать необходимой человеческой основы."
  RUS_reforming_education_system: "Система образования реформируется"
  RUS_reforming_education_system_desc: "Реформа образования началась, но неэффективность и нехватка подготовленных кадров, унаследованные от старой системы, не исчезнут за одну ночь. Единовременные реформы открывают новые направления, а повторяемые реформы могут быть выполнены в общей сложности до §Y[?RUS_education_reform_repeat_limit|0]§! раз."
  RUS_completed_education_reform: "Успешно завершенная реформа образования"
  RUS_completed_education_reform_desc: "После длительной и широкой реформы социалистическая Россия начала строить новую систему образования для рабочих и крестьян. Школы, курсы подготовки, культурные отряды и техническая перестройка заводов формируют новое поколение строителей."
  RUS_education_reform_status_tt: "§YПовторяемые реформы образования§!: [?RUS_education_reform_repeat_count|Y0]/§Y[?RUS_education_reform_repeat_limit|0]§!\n§YАктивные реформы образования§!: [?RUS_education_reform_active_decisions|Y0]/§Y2§!"
  RUS_education_reform_completed_status_tt: "§GРеформа образования успешно завершена.§!\n§YПовторяемые реформы образования§!: [?RUS_education_reform_repeat_count|Y0]/§Y[?RUS_education_reform_repeat_limit|0]§!"
  RUS_education_reform_focus_start_tt: "Убрать §Y$RUS_malformed_education_system$§! и начать §Yреформу образования§!."
  RUS_education_reform_active_slot_tt: "Сейчас активно меньше §Y2§! решений реформы образования."
  RUS_education_reform_recruitable_population_penalty_tt: "Коэффициент военнообязанного населения: §R-1.00%§!"
  RUS_education_reform_recruitable_population_dynamic_penalty_tt: "Коэффициент военнообязанного населения: §R-1.00%§!"
  RUS_education_reform_repeat_limit_tt: "Завершено меньше §Y[?RUS_education_reform_repeat_limit|0]§! повторяемых реформ образования."
  RUS_education_reform_cancel_if_ended_tt: "Реформа образования завершена или остановлена."
  RUS_education_reform_category: "Реформа образования"
  RUS_education_reform_category_desc: "Социалистическое строительство требует новой системы образования. Единовременные реформы открывают новые направления, а повторяемые реформы могут быть выполнены в общей сложности до §Y[?RUS_education_reform_repeat_limit|0]§! раз.\n\nТекущие повторяемые реформы: §Y[?RUS_education_reform_repeat_count|0]§!/§Y[?RUS_education_reform_repeat_limit|0]§!\nАктивные реформы образования: §Y[?RUS_education_reform_active_decisions|0]§!/§Y2§!"
  RUS_edu_compulsory_education: "Всеобщее обязательное образование"
  RUS_edu_compulsory_education_desc: "Образование - не привилегия, а право каждого советского гражданина. Слишком долго российские школы служили только городам и узкой элите, тогда как дети рабочих и крестьян часто узнавали мотыгу и гаечный ключ раньше, чем буквы. Правительство вводит обязательное образование по всей стране, чтобы у каждого ребенка школьного возраста были школа и книги."
  RUS_edu_build_rural_schools: "Строить сельские школы"
  RUS_edu_build_rural_schools_desc: "Одной политики недостаточно. Правительство профинансирует строительство новых сельских школ по всей стране, обеспечит их базовыми учебниками и пособиями и добьется, чтобы в каждой школе был хотя бы один учитель с формальной подготовкой."
  RUS_edu_higher_education: "Строить высшее образование"
  RUS_edu_higher_education_desc: "Страна без высшего образования может только идти следом за другими. У нас есть земля, ресурсы и трудолюбивый народ, но без инженеров, агрономов, врачей и учителей все это будет спать под землей и в полях. Правительство построит новые высшие учебные заведения для социалистического строительства."
  RUS_edu_worker_peasant_courses: "Рабоче-крестьянские курсы"
  RUS_edu_worker_peasant_courses_desc: "Высшее образование не должно оставаться уделом старой интеллигенции. Рабочие и крестьяне обладают практическим опытом и желанием изменить свое положение, но нуждаются в теории и инструментах. Вечерние и сезонные курсы откроют путь из мастерской и поля в аудиторию."
  RUS_edu_grassroots_cadres: "Готовить низовые кадры"
  RUS_edu_grassroots_cadres_desc: "Хорошая политика пуста, если она не доходит до деревень. Уездные школы кадров будут обучать сельскую молодежь, ветеранов и лучших рабочих политике, организации и улаживанию споров, создавая доверенных местных организаторов."
  RUS_edu_cadre_rotation: "Система переподготовки кадров"
  RUS_edu_cadre_rotation_desc: "Подготовка - это процесс, а не разовый акт. Кадры будут периодически возвращаться в учебные центры, чтобы обновлять знания, обмениваться опытом и вместе решать практические проблемы."
  RUS_edu_cultural_propaganda: "Расширить культурную пропаганду"
  RUS_edu_cultural_propaganda_desc: "Одних школ недостаточно: культура должна войти в поля и заводские цеха. Культурные отряды принесут книги, газеты, кинопроекторы и основные медицинские знания в отдаленные деревни, показывая людям, что они являются частью великого общего дела."
  RUS_edu_production_technology: "Улучшить производственную технику"
  RUS_edu_production_technology_desc: "Эффективность заводов определяет скорость национального строительства. Многие предприятия все еще используют устаревшее оборудование и расточительные процессы. Единственный ответ - всестороннее техническое улучшение: производить больше и лучше при меньших затратах ресурсов."
  RUS_edu_streamlined_workshops: "Упорядочить цеха"
  RUS_edu_streamlined_workshops_desc: "Хаотичная планировка и дублирующиеся операции тратят время и труд. Технические специалисты оценят заводские процессы, объединят лишние этапы, оптимизируют рабочие места и установят лучшие пути перемещения материалов."
  RUS_edu_standardized_lines: "Стандартизировать производственные линии"
  RUS_edu_standardized_lines_desc: "Когда-то заводы работали по несовместимым стандартам. Стандартизация деталей и производственных линий позволит совместно использовать оборудование и запчасти, быстрее проводить ремонт и легче переводить производство на военные нужды."
  RUS_education_reform_effect_compulsory_tt: "Добавить эффекты к §Y$RUS_reforming_education_system$§!:\nСкорость исследований: §G+2.00%§!\nБазовая эффективность производства: §G+5.00%§!\nОткрывает решение: §Y$RUS_edu_build_rural_schools$§!"
  RUS_education_reform_effect_rural_school_tt: "Добавить эффекты к §Y$RUS_reforming_education_system$§!:\nСкорость исследований: §G+1.00%§!\nПовторяемые реформы образования: §Y+1§!"
  RUS_education_reform_effect_higher_education_tt: "Добавить эффекты к §Y$RUS_reforming_education_system$§!:\nСкорость исследований: §G+3.00%§!\nБазовая эффективность производства: §G+5.00%§!\nОткрывает решение: §Y$RUS_edu_worker_peasant_courses$§!"
  RUS_education_reform_effect_worker_peasant_course_tt: "Добавить эффекты к §Y$RUS_reforming_education_system$§!:\nСкорость исследований: §G+2.00%§!\nПрирост средств ВПК: §G+2.00%§!\nФактор фабрик товаров народного потребления: §R+3.00%§!\nПовторяемые реформы образования: §Y+1§!"
  RUS_education_reform_effect_grassroots_cadres_tt: "Добавить эффекты к §Y$RUS_reforming_education_system$§!:\nФактор фабрик товаров народного потребления: §R+5.00%§!\nПрирост политической власти: §G+10.00%§!\nОткрывает решение: §Y$RUS_edu_cadre_rotation$§!"
  RUS_education_reform_effect_cadre_rotation_tt: "Добавить эффекты к §Y$RUS_reforming_education_system$§!:\nЕжедневный прирост политической власти: §G+0.20§!"
  RUS_education_reform_effect_cultural_propaganda_tt: "Добавить эффекты к §Y$RUS_reforming_education_system$§!:\nЕжедневный прирост политической власти: §R-0.30§!\nСкорость исследований: §G+5.00%§!"
  RUS_education_reform_effect_production_technology_tt: "Добавить эффекты к §Y$RUS_reforming_education_system$§!:\nРост эффективности производства: §G+10.00%§!\nОткрывает решения: §Y$RUS_edu_streamlined_workshops$§!, §Y$RUS_edu_standardized_lines$§!"
  RUS_education_reform_effect_streamlined_workshops_tt: "Добавить эффекты к §Y$RUS_reforming_education_system$§!:\nФактор фабрик товаров народного потребления: §G-1.50%§!\nПовторяемые реформы образования: §Y+1§!"
  RUS_education_reform_effect_standardized_lines_tt: "Добавить эффекты к §Y$RUS_reforming_education_system$§!:\nБазовая эффективность производства: §G+2.00%§!\nПрирост политической власти: §G+1.50%§!\nФактор фабрик товаров народного потребления: §R+1.50%§!\nПовторяемые реформы образования: §Y+1§!"
