 RUS_fr_military_reform_decisions:0 "Национальная военная реформа"
 RUS_fr_military_reform_decisions_desc:0 "£GFX_RUS_fr_military_reform_materials текущий §YМатериалы по военной реформе§!:§Y[?RUS_fr_military_reform_materials|2]§! / §Y[?RUS_fr_military_reform_materials_limit|0]§!\nЕжедневный рост: [?RUS_fr_military_reform_materials_daily_growth|2+=]\n\n §YНажмите на значок реформы ниже, чтобы начать соответствующий этап реформы.§!\n\nПовышайте специальные материалы через резолюцию реформы; в федеральном отделе вооружений, когда материалов достаточно, вы можете использовать резервы, эквивалентные количеству дней фокуса, чтобы завершить фокус сразу."
 RUS_fr_military_reform_materials:0 "£GFX_RUS_fr_military_reform_materials Военная реформа Материалы"
 RUS_fr_mio_research_cap_tt:0 "£research_speed_icon этой военно-промышленной организации §HИзучите мягкий предел бонусов§! Увеличить $RIGHT|+=2%$"
 RUS_fr_amo_research_surplus_tt:0 "Когда AMO завершает исследование технологии, каждая ступень военно-промышленной организации получает £civ_factory_output §HЭкономический излишек§! Увеличить $RIGHT|+=0$"
 RUS_fr_amo_moderate_output_upgrade_tt:0 "Если §YСтроительство мобильности и логистики§! является приоритетным направлением,§YУмеренная мощность механизированного двигателя§!£civ_factory_output, предоставленный военно-промышленными организациями на каждом уровне §HЭкономический излишек§! будет §Y250§! Увеличить до §Y500§!"
 RUS_fr_mechanised_platform_mobility_priority_tt:0 "если §YМоторизация и логистическое строительство§! Приоритетное направление: атака и оборона механизированных войск:§G+5.0%§!"
 RUS_fr_air_assault_mobility_priority_tt:0 "Если §YМобильность и логистическое строительство§! Это приоритетное направление:\n §YВоздушно-десантная пехота§! будет служить в качестве §YСпецназ§! компилировать\nПосле конверсии §YДесантные штурмовые войска специального назначения§! Против личного состава и против брони:§G+300.0%§!\nПосле конверсии §YДесантные штурмовые войска специального назначения§! Прорыв:§G+150.0%§!\nПосле реструктуризации §YДесантные штурмовые войска специального назначения§! Глубина пробития брони:§G+750,0%§!\nПосле реструктуризации §YДесантные штурмовые войска специального назначения§! Модификаторы атаки, защиты и передвижения во всех типах местности:§G+50.0%§!\nПри переводе в специальные войска,§YВертолёт§! Себестоимость производства:§R+500,0%§!"
 RUS_fr_deep_mobility_priority_tt:0 "если §YМоторизованное и логистическое строительство§! Это приоритетное направление:\n$MODIFIER_SPECIAL_FORCES_ATTACK_FACTOR$: §G+10.0%§!\n$MODIFIER_CONSUMER_GOODS_FACTOR$: §R+20.0%§!"
 RUS_fr_federal_plan_armaments_allocation:0 "Дополнительное военное финансирование"
 RUS_fr_federal_plan_armaments_allocation_desc:0 "Скорректируйте показатели плана текущего периода и добавьте партию стали, станков, транспортных средств и средств связи для военной реформы."
 RUS_fr_draw_general_staff_reserves:0 "Мобилизовать резервы Генерального штаба"
 RUS_fr_draw_general_staff_reserves_desc:0 "Использование организационного капитала и зрелых планов, представленных армейским опытом, для обмена на партию резервов, которые можно сразу же направить на реформу."
 RUS_fr_wartime_emergency_procurement:0 "Аварийные закупки в военное время"
 RUS_fr_wartime_emergency_procurement_desc:0 "После начала войны проведите экстренную закупку для получения 30 пунктов военных реформных материалов, но уменьшите стабильность; эта мера может быть использована только один раз за цикл строительства."
 RUS_fr_field_political_agitation:0 "Передовая команда по политической пропаганде"
 RUS_fr_field_political_agitation_desc:0 "Отбирать кадровых политработников, военных корреспондентов и образцовых рядовых солдат для формирования передвижной группы, проводящей краткосрочную политическую мобилизацию в учебных лагерях, пунктам замены и вновь формируемых подразделениях."
 RUS_fr_general_staff_wargames:0 "Военная игра Генерального штаба"
 RUS_fr_general_staff_wargames_desc:0 "Организуйте штабных офицеров для проведения непрерывных военных игр, неоднократно проверяя расписание движения поездов, подготовку огня и развертывание резервов на одной и той же карте."
 RUS_fr_deep_battle_exercise:0 "Сверло для глубокой сверловки"
 RUS_fr_deep_battle_exercise_desc:0 "Сосредоточившись на моторизованной разведке, перебазировании артиллерии и развертывании второго эшелона, проведите серию краткосрочных упражнений по глубинному прорыву."
 RUS_fr_central_military_liaison:0 "Центральная военно-гражданская координационная конференция"
 RUS_fr_central_military_liaison_desc:0 "Созвать краткосрочную координационную встречу с представителями Генерального штаба, политических органов и основных военных регионов для сокращения задержек и передачи ответственности при передаче приказов."
 RUS_fr_academy_research_groups:0 "Теоретическая исследовательская группа военной академии"
 RUS_fr_academy_research_groups_desc:0 "Инструкторы были направлены из Военной академии Гроза и Группы по разработке Уставов имени Фрунзе для организации тематических исследований, учебных материалов и исследовательских записок по военным доктринам в краткосрочном интенсивном формате."
 RUS_fr_unified_training_rotation:0 "Единый план ротации"
 RUS_fr_unified_training_rotation_desc:0 "Проводить ротацию кадров и кадровых руководителей на местах в соответствии с единым планом подготовки, позволяя войскам из разных военных регионов проходить дополнительное обучение по единому набору стандартов."
 RUS_fr_military_district_readiness:0 "Проверка боевой готовности военного округа"
 RUS_fr_military_district_readiness_desc:0 "Инспекционная группа, направленная Генеральным штабом, провела внезапные проверки мобилизационных таблиц, складов, транспортных узлов и оперативных планов различных военных округов."
 RUS_fr_voronezh_exercise_review:0 "Обзор упражнений Воронеж"
 RUS_fr_voronezh_exercise_review_desc:0 "Запишите ошибки, выявленные на Воронежском грандиозном учении, в учебные материалы и проведите круг краткосрочного корректирующего обучения по всей армии."
 RUS_fr_emergency_workshop_norms:0 "Стандарты штурма военной мастерской"
 RUS_fr_emergency_workshop_norms_desc:0 "Ключевые мастерские совместно проверяются квартирмейстером, инженерами и профсоюзными командами с использованием краткосрочных рейдов для стандартизации процедур, приёмки и дисциплины производства."
 RUS_fr_develop_katyusha_rocket_artillery:0 "Разработать реактивную систему залпового огня «Катюша»"
 RUS_fr_develop_katyusha_rocket_artillery_desc:0 "инвестиция §Y[?RUS_fr_xp_cost_50|1]§! Использовать опыт армии, выполнить испытания ракет, пусковых установок, управления залпом и развертывания на базе техники в течение 120 дней, а также создать единую техническую систему, применимую как к буксируемой, так и к самоходной ракетной артиллерии."
 RUS_fr_reform_command_audit:0 "Этап первый: Аудит системы командования"
 RUS_fr_reform_command_audit_desc:0 "инвестиция §Y[?RUS_fr_xp_cost_100|1]§! Провести 120-дневный непрерывный аудит системы командования на основе опыта армии, с приоритетом на исправление цепочки командования, боевых планов и оперативного фронта."
 RUS_fr_reform_standard_tables:0 "Второй этап: Единая компиляция и военно-политические стандарты"
 RUS_fr_reform_standard_tables_desc:0 "инвестиция §Y[?RUS_fr_xp_cost_100|1]§! На основе армейского опыта провести единую реорганизацию продолжительностью 120 дней, сосредоточив внимание на уточнении военной и политической власти, стандартизации организации и восстановлении координации войск."
 RUS_fr_reform_training_cycles:0 "Фаза три: цикл обучения и поддержки"
 RUS_fr_reform_training_cycles_desc:0 "инвестиция §Y[?RUS_fr_xp_cost_100|1]§! Провести непрерывную 90-дневную учебную корректировку на основе опыта армии, сосредоточив внимание на восстановлении циклов подготовки, мобилизации, пополнения и материально-технического обеспечения."
 RUS_fr_reform_grand_field_test:0 "Фаза Четыре: Национальные учения с боевой стрельбой"
 RUS_fr_reform_grand_field_test_desc:0 "инвестиция §Y[?RUS_fr_xp_cost_100|1]§! Провести всенациональную проверку войск вживую на основе опыта армии в течение 90 последовательных дней для завершения базовой корректировки общей военной системы; вопросы, связанные с доктриной, подготовкой офицеров, стандартами оборудования и координацией между родами войск, по-прежнему необходимо решать индивидуально через соответствующие реформы."
