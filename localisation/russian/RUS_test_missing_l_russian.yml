 RUS_fr_military_reform.90.d:0 "Постоянный комитет Федеральной комиссии по вооружениям и оборонной промышленности\nВ Государственную военную комиссию и Федеральную плановую комиссию:\n[RUS_fr_armaments_report_header]\n\nС момента создания комитета тактические требования, предложенные Генеральным штабом, инженерные планы, представленные различными военными промышленными учреждениями, и производственные цели, выданные федеральными плановыми органами, были впервые включены в один и тот же строительный цикл. [RUS_fr_armaments_report_priority]\n\n §Y1. Артиллерийское обеспечение армии§!\n[RUS_fr_armaments_report_infantry_route]\n\n §Y2. Маневрирование в кампании и транспортная работа§!\n[RUS_fr_armaments_report_mobility_route]\n\n §Y3. Операции бронетехники§!\n[RUS_fr_armaments_report_armour_route]\n\n §YЗаключение Постоянного Комитета§!\n[RUS_fr_armaments_report_conclusion]\n\nПостоянный комитет Федеральной комиссии по вооружениям и оборонной промышленности с уважением представляет."
 RUS_fr_military_reform.90.a:0 "[RUS_fr_armaments_report_approval]"
 RUS_fr_military_reform.402.t:0 "Военные реформы: нехватка материальных средств"
 RUS_fr_military_reform.402.d:0 "Федеральный плановый комитет сообщает, что запасы стали, станков, транспортных средств и средств связи, предназначенные для национальной военной реформы, упали до предупредительной границы. Если они не будут своевременно пополнены, автоматически продвигающиеся проекты по исправлению и строительству вооружений будут приостановлены из-за нехватки материалов.\n\nможет быть в §YНациональная военная реформа§! В резолюции §YДополнительное военное финансирование§! или §YМобилизовать резервы Генерального штаба§!; также может быть сделано один раз во время войны §YВоенное экстренное снабжение§!."
 RUS_fr_military_reform.402.a:0 "Немедленно поднимите следующую партию припасов."
 RUS_fr_armaments_summary_armaments_specialisation_tt:0 "Сосредоточиться на §YОбщий план разработки вооружения армии§! Специализированные достижения будут включены §YТекущее положение Красной Армии рабочих и крестьян: непобедимая и легендарная§!:\nВыпуск фабрики: текущий §YСовокупный уровень поддержки тоталитаризма и коммунизма§! из §Y10%§!(Верхний предел §G+10%§!)\nМаксимальная эффективность производства: Текущая §YСовокупный уровень поддержки тоталитаризма и коммунизма§! из §Y10%§!(Верхний предел §G+10%§!)"
 RUS_fr_armaments_summary_mobility_specialisation_tt:0 "Сосредоточиться на §YПлан механизированного строительства армии§! Специализированные достижения будут включены §YТекущее положение Красной Армии рабочих и крестьян: непобедимая и легендарная§!:\nСкорость дивизии армии: текущая §YСовокупный уровень поддержки тоталитаризма и коммунизма§! из §Y10%§!(Верхний предел §G+10%§!)\nПотребление ресурсов: текущее §YСовокупный уровень поддержки тоталитаризма и коммунизма§! из §Y-10%§!(Верхний предел §G-10%§!)"
 RUS_fr_armaments_summary_armour_specialisation_tt:0 "подчёркивать §YПлан разработки бронетанковых вооружений§! Специализированные достижения будут включены §YТекущее положение Красной Армии рабочих и крестьян: непобедимая и легендарная§!:\nПрорыв армии: текущий §YСовокупный уровень поддержки тоталитаризма и коммунизма§! из §Y10%§!(Верхний предел §G+10%§!)\nВсеобъемлющая атака: Текущее §YСовокупный уровень поддержки тоталитаризма и коммунизма§! из §Y10%§!(Верхний предел §G+10%§!)"
