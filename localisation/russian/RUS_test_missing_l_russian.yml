 RUS_fr_dashboard_reform_progress_header:0 "ТЕКУЩИЙ ПРОГРЕСС РЕФОРМ"
 RUS_fr_dashboard_reform_progress_idle:0 "§LОжидая следующего этапа реформы§!"
 RUS_fr_dashboard_reform_progress_complete:0 "§GВсе четыре основных этапа реформы завершены§!"
 RUS_fr_dashboard_reform_progress_stage_1:0 "§WСтадия I: §Y[?RUS_fr_dashboard_reform_days_remaining|0]§! дней осталось§!"
 RUS_fr_dashboard_reform_progress_stage_2:0 "§WСтадия II: §Y[?RUS_fr_dashboard_reform_days_remaining|0]§! дней осталось§!"
 RUS_fr_dashboard_reform_progress_stage_3:0 "§WСтадия III: §Y[?RUS_fr_dashboard_reform_days_remaining|0]§! дней осталось§!"
 RUS_fr_dashboard_reform_progress_stage_4:0 "§WСтадия IV: §Y[?RUS_fr_dashboard_reform_days_remaining|0]§! дней осталось§!"
 RUS_fr_dashboard_stage_1_tt:0 "§YЭтап I: Исправление команды§!\nПовторно проверить досье офицеров, ликвидировать сети внедренцев и восстановить эффективную цепочку командования от центрального штаба до передовой.\n\nСтоимость: £army_experience §Y[?RUS_fr_xp_cost_100|1]§!\nПродолжительность: §Y120 дней§!\nТребуется: the §YВоенная поправка§! фокус\n\n §GНажмите на значок, чтобы начать, как только все условия будут выполнены.§!"
 RUS_fr_dashboard_stage_2_tt:0 "§YЭтап II: Организация и политическое руководство§!\nСтандартизировать таблицы батальона и роты и уточнить обязанности командиров, политических органов и солдатских органов.\n\nСтоимость: £army_experience §Y[?RUS_fr_xp_cost_100|1]§!\nПродолжительность: §Y120 дней§!\nТребует: §YСтадия I§! и §YЕдиная военно-политическая система§! фокус\n\n §GНажмите на значок, чтобы начать, как только все условия будут выполнены.§!"
 RUS_fr_dashboard_stage_3_tt:0 "§YЭтап III: Обучение и оперативная координация§!\nИспользуйте ротационное обучение, военные академии и полевые учения, чтобы превратить письменные правила в общий оперативный метод.\n\nСтоимость: £army_experience §Y[?RUS_fr_xp_cost_100|1]§!\nПродолжительность: §Y90 дней§!\nТребует: §YСтадия II§! и §YРеорганизация армии§! фокус\n\n §GНажмите на значок, чтобы начать, как только все условия будут выполнены.§!"
 RUS_fr_dashboard_stage_4_tt:0 "§YЭтап IV: Общенациональные полевые испытания§!\nПроверка мобилизации, снабжения, связи и новых формирований в общенациональном учении, доводя базовые реформы до их окончательной формы.\n\nСтоимость: £army_experience §Y[?RUS_fr_xp_cost_100|1]§!\nПродолжительность: §Y90 дней§!\nТребует: §YСтадия III§! и §YРеорганизация армии§! фокус\n\n §GНажмите на значок, чтобы начать, как только все условия будут выполнены.§!"
 RUS_fr_dashboard_unlock_stage_1_tt:0 "Включает §YРеформа I стадии§! кнопка на §YРеформа армии§! панель"
 RUS_fr_dashboard_unlock_stage_2_tt:0 "Включает §YРеформа второго этапа§! кнопка на §YРеформа армии§! панель"
 RUS_fr_dashboard_unlock_late_stages_tt:0 "Включает §YРеформа III и IV этапов§! кнопки на §YРеформа армии§! панель; два этапа все еще должны быть выполнены в порядке"
 RUS_fr_topbar_military_reform_materials_value:0 "[?ROOT.RUS_fr_military_reform_materials|2]/[?ROOT.RUS_fr_military_reform_materials_limit|0] | [?ROOT.RUS_fr_military_reform_materials_daily_growth|2+=]"
 RUS_fr_topbar_military_reform_materials_tt:0 "£GFX_RUS_fr_military_reform_materials §YМатериальные средства военной реформы§!\n\nБазовый ежедневный прирост составляет §G+1,00§!. Каждый достигнутый рубеж очков §YПервого пятилетнего плана§! добавляет §G+0,05§!. Завершение фокусов §Y«Единое командование и организация»§! и §Y«Народная и революционная армия»§! повышает предел запасов на §Y10§! каждый.\n\nПри выборе §YФедеральной комиссии по вооружениям и оборонной промышленности§! или расположенного ниже неё фокуса достаточный запас материальных средств расходуется для его немедленного завершения. Если средств недостаточно, фокус выполняется обычным образом."
 RUS_fr_post_revolutionary_armed_forces:0 "Вооружённые силы после революции"
 RUS_fr_post_revolutionary_armed_forces_desc:0 "Революция захватила государство, но она не сразу породила армию, способную защитить революцию. Военные округа, склады и штабные органы, оставшиеся от старого режима, всё ещё работали по вчерашним порядкам, а возвращающиеся кадры Красной Армии, рабочие и солдаты из разных мест ещё не были включены в единую военную систему. Фрунзе требовал, чтобы мы сначала оценили это хаотичное наследие: сохранить все применимые знания, ликвидировать реакционные сети и вновь сделать Красную Армию надёжной вооружённой силой в руках трудовой республики."
 RUS_fr_frunze_defence_report:0 "Доклад Тимошенко о реорганизации армии"
 RUS_fr_frunze_defence_report_desc:0 "По приказу Фрунзе Тимошенко посетил штабы военных округов, учебные лагеря и передовые части, задокументировав проблемы, которые долгое время скрывались в отчетах, в одном докладе. Офицерские фракции, организационная путаница, недостаточная подготовка и разрыв с военной промышленностью больше нельзя было объяснять как временные трудности после революции. Военная комиссия будет использовать этот доклад как основу для установления четкого порядка по устранению скрытых опасностей, реорганизации военной системы и исправлению оборонной промышленности."
 RUS_fr_unified_military_leadership:0 "Единоначалие"
 RUS_fr_unified_military_leadership_desc:0 "Революционная армия не должна повторять путь произвольного и властного старого офицерского корпуса, но коллективное обсуждение не должно становиться оправданием для отсутствия ответственности. Фрунзе выступал за то, что как только политическое руководство и права солдат институционально гарантированы, военные лидеры должны нести полную ответственность за подготовку, приказы и результаты. Перед выдачей приказов может быть тщательная дискуссия, но после принятия решения вся армия должна действовать в соответствии с одной и той же волей."
 RUS_fr_rebuild_revolutionary_military_council:0 "Учредить Государственную военную комиссию"
 RUS_fr_rebuild_revolutionary_military_council_desc:0 "§YПредварительное условие: Завершить фокус 'Отчёт армии Тимошенко'§!\n\nВо время гражданской войны Революционный военный совет организовал разрозненные Красные гвардии, железнодорожные части и военные снабженческие учреждения в настоящую Красную армию. Теперь республике снова требуется верховное командование, способное координировать все вооруженные силы. Новосозданная Государственная военная комиссия будет возглавляться Фрунзе, будет принимать стратегические решения коллективно, выполнять приказы через профессиональный штаб и обеспечивать через политические органы, чтобы армия всегда служила трудящемуся народу. Сталин также войдет в систему высшего командования как главнокомандующий, принимая прямую военную ответственность за революционное правительство."
 RUS_fr_reorganise_general_staff_districts:0 "Единая система командования и управления вооруженными силами"
 RUS_fr_reorganise_general_staff_districts_desc:0 "Огромные расстояния России привели к тому, что каждый военный округ выработал свои собственные формы, форматы командования и мобилизационные привычки, так что центральные намерения часто полностью искажаются в процессе передачи. Офицеры штаба, такие как Шапошников, помогали Фрунзе заново определить обязанности Генерального штаба и военных округов, включая принципы ответственности за руководство, оперативного планирования и стандартизированной организации в единую систему. С этого времени решения, принимаемые в Москве, должны были достигать каждого полевого подразделения в ясной и последовательной форме."
 RUS_fr_national_military_reform_program:0 "Военная реорганизация"
 RUS_fr_national_military_reform_program_desc:0 "Кусочные ремонты больше не могут решить структурные проблемы, с которыми сталкивается Красная Армия. Фрунзе соберет Генеральный штаб, военные округа, академии и политические органы за одним столом, чтобы подготовка, мобилизация, оперативная теория и кадровое развитие подчинялись общенациональному плану военной реформы. Реформа не закончится несколькими новыми распоряжениями; она проникнет на каждый уровень командования и в каждый казарменный блок, пока временная военная система периода революционной войны полностью не будет реорганизована."
 RUS_fr_cadres_decide_everything:0 "Организационная система политического комиссара"
 RUS_fr_cadres_decide_everything_desc:0 "Оружие и пушки сами по себе не поймут цели революции, а приказы не могут заменить политическое доверие между офицерами и солдатами. Мы создадим сеть политкомиссаров, простирающуюся от Военной комиссии до первичных подразделений, объединяя образование кадров, дисциплинарные апелляции и политическую работу внутри войск. Политический комиссар больше не будет просто агитатором в период кризиса или наблюдателем за офицерами, но станет официальным звеном, соединяющим Партию, командиров и рядовых солдат."
 RUS_fr_equipment_is_the_armys_skeleton:0 "Научный генеральный штаб"
 RUS_fr_equipment_is_the_armys_skeleton_desc:0 "Мужество может одержать победу в атаке, но само по себе оно не может спланировать кампанию, охватывающую сотни километров. Генеральный штаб должен освободиться от влияния личного опыта и фракционных привычек, сделав картографию, статистические данные, военные игры и изучение военной истории общим языком планирования. Реформированные штабы будут непрерывно проверять свои собственные суждения, превращая уроки с фронта в военно-научные знания, пригодные для всей армии."
 RUS_fr_train_before_expansion:0 "Теория глубинной боя"
 RUS_fr_train_before_expansion_desc:0 "Молодые теоретики, такие как Триандафиллов, указывали на то, что исход современной войны не будет решён на первой траншее. Красная армия должна одновременно организовывать фронтальные прорывы, развертывание резервов и глубокое преследование, вызывая коллапс артиллерии, транспортной и командной систем противника под непрерывными ударами. Многоуровневая координация и быстрое усиление перестанут быть концепцией нескольких офицеров и станут основным способом, с помощью которого вся армия будет понимать кампании."
 RUS_fr_red_commander_system:0 "\"Гроза\" Военная академия"
 RUS_fr_red_commander_system_desc:0 "Изгнание, гражданская война и длительное политическое разделение лишили целое поколение офицеров Красной Армии возможности систематической подготовки, и многие ценные знания могли передаваться только через личные воспоминания. Военная академия «Гроза» вновь соберет возвращающихся генералов, фронтовых кадровых офицеров и военных теоретиков для формирования нового командного коллектива через продвинутую ротационную подготовку, военные игры и изучение кампаний. Здесь не следует воспроизводить иерархические барьеры старых императорских военных академий; вместо этого тем, кто лоялен революции и действительно способен, следует дать возможность брать на себя значительные обязанности."
 RUS_fr_unified_training_mobilisation_system:0 "Стандартизированная организация армии"
 RUS_fr_unified_training_mobilisation_system_desc:0 "В настоящее время подразделения с одинаковым названием пехотной дивизии могут иметь совершенно разный личный состав, артиллерию и методы пополнения. Эта разница лишь сбивает с толку в мирное время, но в военное время она может быть катастрофической. Военная комиссия стандартизирует организационные таблицы, мобилизационные таблицы и учебные циклы дивизий, армий и военных округов. Новообразованные подразделения должны быть способны быстро интегрироваться в существующую систему командования и поддержки, а не создавать свою армию с нуля."
 RUS_fr_frunze_field_regulations:0 "Механизм принятия наступательных решений"
 RUS_fr_frunze_field_regulations_desc:0 "Фрунзе последовательно выступал против того, чтобы понимать суть наступления как необдуманное лобовое нападение. Новый механизм принятия решений позволит командирам на передовой принимать проактивные решения в рамках установленных намерений, при этом требуя от них быстрого доклада о ситуации и поддержания связи с артиллерией, бронетанковыми подразделениями и логистическими службами. Истинная инициатива возникает из тщательной подготовки и четкой ответственности, а не из сокрытия недостатков работы штаба за счет жизней солдат."
 RUS_fr_general_staff_experimental_formations:0 "Строгая система тренингов"
 RUS_fr_general_staff_experimental_formations_desc:0 "Тимошенко резко отметил в военном докладе, что отличная работа многих подразделений существовала только на заранее подготовленных полигонах для проверок. Будущие тренировки будут проводиться с использованием единых оценок, стрельб вживую и учебных боевых столкновений с неожиданной проверкой, где результаты не объявляются заранее, и никакое командное руководство не может заменить боеспособность внушительными отчетами. Строгая подготовка не предназначена для того, чтобы мучить солдат, а чтобы вооружить их навыками для выживания и выполнения задач под настоящим артиллерийским огнем."
 RUS_fr_national_mobilisation_supply_test:0 "Система оценки ветеранов"
 RUS_fr_national_mobilisation_supply_test_desc:0 "Ветераны революционной войны обладают знаниями, которые ни один учебник не сможет полностью зафиксировать: как сохранять строй в хаосе, как оценить, стоит ли атака, и как вернуть на ноги уставших новобранцев. Мы включим этих ветеранов в систему обучения и оценки, сделав их эталонами для новых подразделений и наставниками для офицеров на местах. Личные легенды со временем исчезают, но опыт, который был систематизирован и передан, может стать традицией всей Красной Армии."
 RUS_fr_all_russian_red_army_exercise:0 "Закалённый в сталь"
 RUS_fr_all_russian_red_army_exercise_desc:0 "§YПредварительное условие: завершить фокус «Объединённое командование и военная система»§!\n\nПравила заслуживают называться системой только в том случае, если они остаются эффективными перед лицом грязи, усталости и ошибочных приказов. Войска из различных военных округов проведут масштабное учение по противостоянию неподалёку от Воронежа без заранее заданных исходов, а Генеральный штаб, железные дороги, склады и полевые госпитали также должны будут пройти проверку. Красная армия выявит свои последние слабые места в этом горниле и закалит себя в сталь через революционный коллективизм, военный авангардизм и революционный героизм."
 RUS_fr_revolutionary_military_system_finalised:0 "Красная Армия самая сильная"
 RUS_fr_revolutionary_military_system_finalised_desc:0 "От солдатских комитетов до Генерального штаба, от классов военных школ до танковых дивизий, реформы, которые когда-то были разрозненными, теперь объединились в полную революционную военную систему. Германская империя когда-то верила, что армия старого порядка может навсегда подавить трудящихся Востока, и её падение уже дало ответ. Сила Красной армии не исходит от кнутов и слепого повиновения, а от сознательной дисциплины, современной военной науки и доверия миллионов людей к своей собственной армии."
 RUS_fr_military_rectification:0 "Военная чистка"
 RUS_fr_military_rectification_desc:0 "Открытое правление старого офицерского корпуса закончилось, но влияние, поддерживаемое через личную лояльность, тайные общества и сети Белой армии, всё ещё сохраняется в нескольких штабах. Фрунзе отказался заменять следствие безграничной паникой: дисциплинарный комитет должен опираться на доказательства, записи и публичные процедуры для установления ответственности. Цель чистки — не уничтожить военный профессионализм, а освободить армию от контрреволюционных фракций, позволяя лояльности и компетентности проявляться в рамках системы."
 RUS_fr_investigate_white_networks:0 "Пробное внедрение военной демократии"
 RUS_fr_investigate_white_networks_desc:0 "Остатки Белой армии смогли скрываться внутри армии именно потому, что рядовые солдаты долгое время не имели надлежащих каналов для жалоб и контроля, полагаясь только на личные отношения с офицерами. Пробное внедрение военной демократии позволит солдатам открыто сообщать о проблемах, связанных с бытом, учением и дисциплиной, а также избирать представителей для участия в ограниченном контроле на местах. Революционная демократия не может заменить командование на поле боя, но она может лишить тайные общества и фракции той тени, которая поддерживает их существование."
 RUS_fr_officer_oath_service_review:0 "Строительство системы военно-политической работы"
 RUS_fr_officer_oath_service_review_desc:0 "Верность революции нельзя оценивать только по письменной клятве. Точно так же происхождение и прошлое человека не должны становиться неизгладимым клеймом. Органы политической работы будут стандартизировать процессы принятия клятвы офицерами, их обучения, проверки карьерного пути и оценки массами, определяя судьбу человека на основе долгосрочной работы, а не слухов. Красной армии нужны профессиональные солдаты, которые понимают, зачем они сражаются за рабочую республику, а не оппортунисты, умеющие писать правильные лозунги на экзаменационных бланках."
 RUS_fr_basic_commissar_system:0 "Система военной дисциплины и политического контроля"
 RUS_fr_basic_commissar_system_desc:0 "Военная дисциплина должна защищать революционную армию и не может становиться инструментом личной мести или фракционной борьбы. Новая система политических проверок установит четкие стандарты доказательств, каналы для обжалования и границы ответственности, при этом дела будут рассматриваться совместно политическими комиссарами, военными судьями и командными органами. Настоящие контрреволюционные организации будут искоренены, а верные профессиональные офицеры больше не будут беспокоиться о потере своей репутации и должностей из-за одного анонимного обвинения."
 RUS_fr_soldiers_committees:0 "Система солдатских комитетов"
 RUS_fr_soldiers_committees_desc:0 "Революция превратила солдат из молчаливых последователей старой армии в хозяев государства, но это право требовало стабильной и чёткой организационной формы. Солдатские комитеты контролировали питание, медицинскую помощь и обеспечение жильём, доносили мнения рядовых до политических органов и содействовали образовательной работе. Они не вмешивались в боевые приказы, но обеспечивали, чтобы каждый солдат понимал, зачем он подчиняется, и чтобы его законные требования могли быть услышаны."
 RUS_fr_unified_military_political_system:0 "Единая военная и политическая система"
 RUS_fr_unified_military_political_system_desc:0 "Если командир, политический комиссар и солдатский комитет будут бороться за власть, даже самая правильная система превратится в новый хаос на передовой. Государственная военная комиссия уточнит полномочия троих: командир отвечает за военные действия, политический комиссар поддерживает политическое направление, а солдатский комитет защищает права и организационную жизнь на основе. Политическая надежность и военная эффективность больше не рассматриваются как взаимоисключающие цели, а вместе будут формировать основу дисциплины Красной армии."
 RUS_fr_revolutionary_collectivism:0 "Революционный коллективизм"
 RUS_fr_revolutionary_collectivism_desc:0 "Старый мир любит приписывать победу нескольким выдающимся генералам, но забывает об обычных солдатах, медсестрах и железнодорожных рабочих, которые поддерживают передовую линию. Революционный коллективизм утверждает, что сила армии исходит из обязанностей, разделяемых между взводами, ротами, батальонами и вплоть до всей республики. Мы будем поддерживать силы через коллективную подготовку, традиции взаимопомощи и честь подразделения, так что потеря или деморализация любого отдельного человека не сможет легко сломить весь боевой коллектив."
 RUS_fr_military_vanguardism:0 "Военный авангардизм"
 RUS_fr_military_vanguardism_desc:0 "Революционная армия не может ждать с изменениями, пока все примут новые идеи. Наиболее выдающиеся офицеры, техники и солдаты будут сосредоточены в экспериментальных подразделениях, возглавляя внедрение новых организационных структур, методов связи и механизированной тактики. Их успехи укажут путь всей армии, а их неудачи также должны быть честно зафиксированы, чтобы цена одного эксперимента принесла прогресс всей Красной Армии."
 RUS_fr_revolutionary_heroism:0 "Революционный героизм"
 RUS_fr_revolutionary_heroism_desc:0 "Трудовой республике нужны герои, но ей не нужны герои, превращённые в недосягаемые кумиры. Мы будем публично отмечать офицеров, которые берут на себя ответственность в критические моменты, солдат, которые удерживают свои позиции, и сотрудников тыла, которые предотвращают голод и осаду войск. Каждый заслуженный поступок должен стать опытом, из которого может учиться вся армия, позволяя индивидуальному мужеству в конечном итоге превращаться в коллективную боевую волю."
 RUS_fr_army_mechanisation_torrent:0 "Механизированное наводнение"
 RUS_fr_army_mechanisation_torrent_desc:0 "Несколько транспортных средств не могут механизировать армию; истинная механизация означает, что организация, связь, техническое обслуживание и ритм командования полностью перестраиваются вокруг техники. Военный авангард будет первым применять новое оборудование в непрерывных прорывах и быстрых преследованиях, испытывая идеи теоретиков в действии. Если эксперимент удастся, наступление Красной Армии больше не остановится на первой линии обороны противника, а хлынет в глубину его операций, как поток."
 RUS_fr_guards_model_units:0 "Охранная модельная единица"
 RUS_fr_guards_model_units_desc:0 "Звание Гвардии не должно быть декоративной честью, а должно представлять собой высший стандарт, который вся армия может наблюдать и изучать. Подразделения, проверенные реальными боями и учениями, будут выполнять задачи, такие как испытание нового оборудования, демонстрация тактики и подготовка офицеров начального звена, а также будут активно делиться своим опытом с другими подразделениями. Ценность образцового подразделения заключается не в создании разрыва между ним и обычными солдатами, а в демонстрации того, чего могут достичь обычные солдаты Красной Армии при правильной организации."
 RUS_fr_revolutionary_merit_competition:0 "Революционный конкурс заслуг"
 RUS_fr_revolutionary_merit_competition_desc:0 "В старой армии продвижение по службе зависело от семейного происхождения, старшинства и личного покровительства командиров. В революционной армии, однако, должны выделяться действительно способные люди. Публичные боевые заслуги, оценки масс, результаты тактических игр и профессиональные оценки совместно определят будущее офицера, а уроки, извлеченные из неудач, также будут включены в оценку. Конкурс заслуг не поощряет преувеличение достижений, но заставляет офицеров постоянно доказывать, что они действительно могут вести солдат к победе."
 RUS_fr_people_and_revolutionary_army:0 "Народная армия и Революционная армия"
 RUS_fr_people_and_revolutionary_army_desc:0 "Армия, которая отделяется от народа, рано или поздно станет инструментом для угнетения народа снова; армия, которая забывает цель революции, будет проливать кровь лишь ради границ и амбиций генералов. Красная Армия должна одновременно быть народной армией, поддерживаемой рабочими и крестьянами и контролируемой народом, а также революционной армией, готовой защищать дело освобождения трудящихся всего мира. Независимо от того, как будут развиваться коллективизм, авангардизм или героизм, эта фундаментальная сущность не должна быть поколеблена."
 RUS_fr_federal_armaments_defence_industry_commission:0 "Федеральная комиссия по вооружению и оборонной промышленности"
 RUS_fr_federal_armaments_defence_industry_commission_desc:0 "Долгое время Генеральный штаб выдвигал требования, плановые органы распределяли производственные мощности, а конструкторские бюро следовали своим собственным планам, однако все трое редко когда реально собирались вместе. Федеральная комиссия по вооружениям и оборонной промышленности станет постоянным органом, связывающим военных, Федеральный плановый комитет и организации оборонной промышленности, переводя опыт с поля боя в технические спецификации, а затем превращая эти спецификации в заказы, которые фабрики смогут выполнить.Фрунзе требовал от солдат понимать пределы промышленности, а также требовал от инженеров осознавать, что каждая цифра в конечном итоге относится к жизням фронтовых солдат."
 RUS_fr_light_weapons_artillery_design:0 "Общий план разработки оружия армии"
 RUS_fr_light_weapons_artillery_design_desc:0 "Пехотное оружие и артиллерия Красной армии происходили из разных эпох, разных заводов и даже соответствовали взаимоисключающим тактическим концепциям. Новая программа проектирования должна была быть предложена Генеральным штабом для определения общих тактических требований, а затем передана инженерам для преобразования этих требований в калибр, вес, дальность и производственные спецификации. Огнестрельное оружие, вспомогательное оборудование и артиллерийское оснащение больше не будут разрозненными промышленными продуктами, а будут совместно представлять собой полную систему вооружения, на которую могли бы опираться пехотные дивизии."
 RUS_fr_small_arms_standardisation_committee:0 "Комитет по стандартизации индивидуального оружия"
 RUS_fr_small_arms_standardisation_committee_desc:0 "Орудийные заводы по всей стране до сих пор используют разные чертежи, допуски и каталоги деталей. В Туле винтовку могли отремонтировать, но если отправить её в Сибирь, её могут только разобрать на лом. Комитет по стандартизации стрелкового оружия соберёт представителей заводов, интендантов и фронтовых ветеранов, чтобы вынести решения по калибрам, компонентам и стандартам производства пункт за пунктом. Стандартизация не означает отказ от улучшений; она предназначена для того, чтобы каждое улучшение могло быть быстро принято промышленностью всей федерации."
 RUS_fr_artillery_ammunition_technical_committee:0 "Комитет по технологии артиллерии и боеприпасов"
 RUS_fr_artillery_ammunition_technical_committee_desc:0 "Высокопроизводительное артиллерийское орудие, если ему не хватает надежных боеприпасов, тягачей и стабильной производственной линии, может оставаться лишь на испытательном полигоне. Технический комитет включит проектные и производственные возможности Обухова, Брянска и Тулы в совместный план, стандартизируя процедуры прототипирования стволов, боеприпасов и тягового оборудования. Артиллерийские офицеры также будут напрямую участвовать в проверках, чтобы инженеры больше не проектировали оружие только для впечатляющих показателей дальности."
 RUS_fr_ergonomic_tolerance_standards:0 "Эргономические стандарты боевого снаряжения"
 RUS_fr_ergonomic_tolerance_standards_desc:0 "Несколько сотен граммов веса и несколько сантиметров в размере на проектном чертеже превратятся в реальную боль на плечах солдата во время долгих маршей и непрерывного боя. Комитет будет систематически собирать отзывы с передовой по хвату, прицеливанию, ношению и расположению снаряжения, что позволит оружию адаптироваться к человеческому телу, а не заставлять людей терпеть плохую конструкцию. Инженерам нужно выйти из офиса, потому что вопрос о том, соответствует ли оборудование требованиям, в конечном итоге должны решать солдаты Красной армии, использующие его в бою."
 RUS_fr_soldier_load_lightening_program:0 "План для облегченной индивидуальной нагрузки солдата"
 RUS_fr_soldier_load_lightening_program_desc:0 "Каждый предмет, который несут солдаты Красной Армии, имеет своё назначение, но не каждый предмет должен носить один и тот же человек. Отдел снабжения проверит упаковку, материалы, количество боеприпасов и обязанности по ношению в подразделениях, перераспределяя вес, который могут нести автомобили и коллективная экипировка, с плеч отдельных солдат. Сокращение нагрузки не связано с поиском комфорта, а с тем, чтобы обеспечить войска энергией для боя, рытья окопов и продолжения движения после выхода на поле боя."
 RUS_fr_soldier_load_lightening_specialisation_tt:0 "подчёркивать §YОбщий план разработки вооружений армии§! Дополнительно получено:\nМножитель ограничения вместимости спецназа:§G+20.0%§!\nВклад сил особого назначения рейнджеров:§G-20.0%§!"
 RUS_fr_divisional_artillery_support_standard:0 "Стандарт полковой артиллерийской поддержки"
 RUS_fr_divisional_artillery_support_standard_desc:0 "Если артиллерия назначается лишь временно перед крупными наступлениями, пехота никогда не научится действовать, полагаясь на огневую мощь. Каждая пехотная дивизия должна иметь стабильную артиллерийскую организацию, запас боеприпасов и офицеров по огневому взаимодействию, а процедуры координации на учебном полигоне должны быть точно такими же, как и в военное время. Когда передовая рота запрашивает поддержку, ей нужно услышать ответ от знакомых артиллерийских подразделений, а не затяжные торги между штабами."
 RUS_fr_armaments_quality_assurance_inspectorate:0 "Система приемки качества военной продукции"
 RUS_fr_armaments_quality_assurance_inspectorate_desc:0 "Плановые показатели могут показать, сколько оружия завод поставил, но они не могут доказать, сможет ли это оружие функционировать в экстремальном холоде, грязи и во время обстрела. Независимые инспекторы будут иметь полномочия отклонять несоответствующие партии, выяснять причины сбоев и требовать перепроектирования, а директор завода больше не сможет подавлять отчёты о качестве, ссылаясь на выполнение производственных планов. Честь социалистической промышленности не должна строиться на отчётах, а на том, что солдаты могут доверять своему собственному снаряжению."
 RUS_fr_self_propelled_support_fire_trials:0 "Испытание самоходного комбинированного огневого поражения"
 RUS_fr_self_propelled_support_fire_trials_desc:0 "Скорость наступления механизированных войск превышает возможности традиционной артиллерии по перебазированию, и колонны прорыва не всегда могут остановиться, чтобы дождаться артиллерии. Артиллерийские инженеры, конструкторские бюро по разработке техники и полевые подразделения совместно протестируют самоходные платформы, способные сопровождать маневры на передовой, фиксируя конфликты между грузоподъемностью шасси, стабильностью стрельбы и расходом снабжения. Независимо от того, приведут ли эти испытания в итоге к созданию самоходной артиллерии или другой тяжелой огневой мощи, они заставят два долгое время разобщенных технических отдела научиться сотрудничать."
 RUS_fr_combined_arms_support_standard:0 "Завершение системы вооружения армии"
 RUS_fr_combined_arms_support_standard_desc:0 "После нескольких раундов рассмотрения комитетом и испытаний войсками пехотного оружия, артиллерии, боеприпасов и вспомогательных платформ наконец можно производить в соответствии с единым набором тактических требований. Федеральный комитет по вооружениям включит эти достижения в формальную систему армейского вооружения, положив конец эпохе, когда конструкторские бюро действовали независимо. Будущие модернизации оборудования будут касаться уже не только замены оружия на более производительное, но и обеспечения того, чтобы вся пехотная дивизия могла тренироваться, снабжаться и вести бой с его использованием."
 RUS_fr_mechanisation_wave:0 "План механизации и мобилизации армии"
 RUS_fr_mechanisation_wave_desc:0 "Огромные просторы России поглотили бесчисленные наступления, и после одержанной победы войска часто могли лишь наблюдать, как противник перегруппировывается на железных дорогах и дорогах. Механизация армии одновременно расширит производство техники, подготовку водителей, дорожное обеспечение и возможности по техническому обслуживанию, делая скорость больше не привилегией лишь нескольких кавалерийских и разведывательных подразделений. Красная армия должна научиться приводить в движение всю оперативную систему, а не просто устанавливать больше двигателей в старые формирования."
 RUS_fr_mechanised_platform_research_committee:0 "Комитет по исследованию механизированных платформ"
 RUS_fr_mechanised_platform_research_committee_desc:0 "В прошлом автомобильные заводы, заводы по производству двигателей и военные конструкторские отделы каждый стремились к своим идеальным моделям, что приводило к сложным деталям, трудному обслуживанию и повторяющемуся потере производственных мощностей. Комитет по исследованию платформ механизации будет координировать работу автомобильных предприятий в Москве, Нижнем Новгороде и других местах, создавая техническую основу, которой могут пользоваться грузовики, гусеничная техника и шасси общего назначения. Инженерная стандартизация проложит путь к массовому производству, а также освободит полевые ремонтные мастерские от необходимости иметь дело с бесконечными каталогами деталей."
 RUS_fr_rapid_mobility_equipment_trials:0 "Контур тестирования оборудования для быстрой маневренности"
 RUS_fr_rapid_mobility_equipment_trials_desc:0 "Краткий высокоскоростной тест на испытательном полигоне не может определить, подходит ли транспортное средство для ведения войны в России. Новое оборудование пройдет долгие марши на большие расстояния, движение по неровным дорогам, запуск при низких температурах и проверки ремонта в условиях войны, а отчеты водителей и технического персонала будут столь же важны, как и инженерные данные. Результаты испытаний вынудят комитет идти на компромиссы: стоит ли приоритет отдавать расширению надежной автомобильной промышленности и созданию специализированной механизированной логистики или же вкладывать ресурсы в более смелую программу вертолетной авиации."
 RUS_fr_vehicle_manufacturing_integration:0 "Интеграция процесса производства транспортных средств"
 RUS_fr_vehicle_manufacturing_integration_desc:0 "Некоторые инженеры надеются продолжать гонку за новыми моделями с поразительной производительностью, но передовым офицерам нужны тысячи надёжных автомобилей, которые могут прибывать вовремя. Мы сосредоточимся на улучшении существующих шасси, двигателей и сборочных линий, позволяя различным заводам расширять производство в соответствии с общими стандартами и делая детали взаимозаменяемыми в полевых условиях. Количество, надёжность и совместимость при обслуживании будут иметь приоритет над рекордными достижениями нескольких прототипов на испытательном треке."
 RUS_fr_mechanised_logistics_regulations:0 "Положения о механизированных логистических услугах"
 RUS_fr_mechanised_logistics_regulations_desc:0 "Истинные пределы механизированной силы определяются не толщиной её брони или мощностью двигателей, а расстоянием, на которое могут быть доставлены топливо, запасные части и ремонтный персонал. Новые правила интегрируют транспортные батальоны, ремонтные батальоны и топливные колонны в оперативную структуру, позволяя офицерам тыла участвовать в планировании до начала наступления. Танки и грузовики не должны превращаться в брошенную сталь в конце дороги; специализированная поддержка должна следовать за ними на всей глубине кампании."
 RUS_fr_mechanised_logistics_non_mobility_bonus_tt:0 "Не выделено §YПлан механизированного строительства армии§! время,§YТекущее положение Рабоче-Крестьянской Красной Армии§! Дополнительный эффект:\nРасход материалов:§G-10.0%§!"
 RUS_fr_helicopter_pilot_program:0 "Программа проверки вертолетов"
 RUS_fr_helicopter_pilot_program_desc:0 "Вертолетные самолеты все еще рассматриваются многими офицерами старой закалки как игрушки инженеров, но их продемонстрированные возможности вертикального взлета и посадки могут изменить восприятие войсками расстояний. Авиационные техники и добровольцы-пилоты будут включать двигатели, роторные конструкции и транспортные миссии в официальную программу валидации, накапливая знания, которые никакие готовые руководства не могут предоставить через несчастные случаи и поломки. Если этот путь окажется осуществимым, реки, горы и поврежденные дороги больше не будут иметь той преградной силы, которую имели раньше."
 RUS_fr_rapid_operational_corps:0 "Усиленная механизированная боевая группа"
 RUS_fr_rapid_operational_corps_desc:0 "Подразделение, которое имеет только технику, но лишено независимого командования, огневой мощи и возможностей поддержки, остаётся всего лишь пехотой на колесах. Основываясь на развитой автомобильной промышленности или специализированной механизированной логистике, Красная Армия будет формировать тяжёлые боевые группы, способные самостоятельно осуществлять прорывы, преследования и глубокие операции. Они должны продолжать борьбу после выхода из состава главных сил армейской группы, превращая краткий тактический разрыв в невосполнимый оперативный крах для противника."
 RUS_fr_air_assault_brigades:0 "Экспериментальная организация воздушно-пехотных войск"
 RUS_fr_air_assault_brigades_desc:0 "Если вертолеты использовать исключительно для перевозки офицеров и документов, они никогда не докажут свою военную ценность. Мы сформируем экспериментальные подразделения из лучших легковооруженных пехотинцев, пилотов и специалистов по связи, обучая их захватывать мосты, аэродромы и командные узлы, преодолевая фронтовые препятствия. Это дорогой и эксклюзивный путь, который потребует ресурсов, которые в противном случае пошли бы на производство техники и механизированную логистику, но он также может создать такой вид мобильности, которого у старой армии никогда не было."
 RUS_fr_deep_mobility_program:0 "Контур высокоскоростного глубокого маневра"
 RUS_fr_deep_mobility_program_desc:0 "Значение вертикального маневрирования заключается не в проведении одного смелого рейда, а в том, чтобы заставить противника потерять безопасные зоны на всей глубине. Десантная пехота, дальняя разведка и rapid campaign command будут объединены в единую систему, организующую операции вокруг транспортных узлов, артиллерийских позиций и пунктов сборки резервов. Красная армия попытается обойти самые сильные участки фронта противника и отрезать всю систему обороны, прежде чем они поймут, что произошло."
 RUS_fr_emphasise_armour_design:0 "План разработки бронетанкового оружия"
 RUS_fr_emphasise_armour_design_desc:0 "В России есть множество отличных конструкторских бюро по танкам и центров тяжёлой промышленности, но ей не хватает бронетанковой программы, которая могла бы заставить их служить единой оперативной концепции. Комитет объединит под единым руководством конструкторские бюро, металлургические предприятия, артиллерийские подразделения и полигоны, при этом бронетанковые офицеры будут предлагать проблемы, которые действительно нужно решать. Танки больше не будут изолированными произведениями инженеров, конкурирующих друг с другом, а станут частью системы прорыва, мобильности и огневой мощи Красной армии."
 RUS_fr_alloy_armour_standard:0 "Инженерия сплавной брони"
 RUS_fr_alloy_armour_standard_desc:0 "Броневые плиты одинаковой толщины могут вести себя совершенно по-разному из-за различий в составе стали, термообработке и качестве сварки. Металлургические и автомобильные отделы в Сольмово, Челябинске и на Урале примут общие марки сплавов, стандарты баллистической приемки и анализа разрушений. Каждое испытательное броневое изделие, которое было пробито, должно предоставлять полезные данные, чтобы следующий танк, покидающий завод, не повторял те же слабости."
 RUS_fr_tank_firepower_development_plan:0 "План развития огневой мощи танка"
 RUS_fr_tank_firepower_development_plan_desc:0 "Более крупная артиллерия не обязательно означает более сильный танк; пространство в башне, механизмы отката, прицелы и рабочая нагрузка экипажа — всё это сопровождается затратами при каждом улучшении. Программа по усилению огневой мощи танка будет включать артиллерийских инженеров, конструкторов башен и передовые экипажи, участвующие в совместных оценках, создавая непрерывную цепочку исследований и разработок от прототипов орудий до серийных модулей. Нам нужна полноценная система оружия, которая надёжно поражает и уничтожает цели на поле боя, а не просто калибр, который кажется впечатляющим на бумаге."
 RUS_fr_breakthrough_chassis_program:0 "Прорывное универсальное шасси"
 RUS_fr_breakthrough_chassis_program_desc:0 "Техника, назначенная для прорыва, должна одновременно выдерживать нагрузки, вызванные тяжёлой бронёй, крупнокалиберными орудиями и суровым рельефом, а обычные шасси не могут бесконечно удовлетворять этим требованиям. Конструкторское бюро разработает универсальное шасси для прорыва, опираясь на грузоподъёмность, трансмиссию и подвеску, оставляя достаточно пространства для развития различных надстроек. Возможно, это не будет самым быстрым или дешёвым решением, но оно должно быть способно нести самое мощное вооружение Красной Армии через передний край противника."
 RUS_fr_hull_structural_durability_trials:0 "Тест прочности конструкции кузова автомобиля"
 RUS_fr_hull_structural_durability_trials_desc:0 "Поле боя не простит танку наличие треснувших сварных швов, неисправной подвески и перегретой трансмиссии только потому, что у него толстая броня. Отдел испытаний увеличит пробег транспортного средства и полностью разберет любые неисправные машины, чтобы установить коренную причину каждого конструктивного сбоя. Надежность может быть не такой впечатляющей, как артиллерия или броня, но она является необходимым условием для превращения нескольких прототипных машин в настоящий бронетанковый корпус."
 RUS_fr_long_range_armoured_exploitation:0 "Стандарты удалённых мобильных операций"
 RUS_fr_long_range_armoured_exploitation_desc:0 "Прорыв оборонительных линий противника — это только начало миссии бронетанковых войск; настоящие достижения приходят в ходе последующего преследования и окружения на сотни километров. Новые стандарты для дальнобойных мобильных операций будут одновременно учитывать топливо, износ гусениц, усталость экипажа, радиосвязь и кампанийскую логистику, обучая бронетанковые подразделения продолжать операции без опоры на железные дороги. Любой план, который только рисует смелые стрелки на карте, не рассчитал, как бочка топлива достигнет передовой линии, будет отклонён."
 RUS_fr_high_velocity_kinetic_gun_program:0 "Программа артиллерии высокой скорости кинетической энергии"
 RUS_fr_high_velocity_kinetic_gun_program_desc:0 "Соревнование между броней и артиллерией никогда не прекращалось. Оружие, способное пробить вражеские танки сегодня, завтра может оказаться бессильным перед более толстыми стальными плитами. Федеральная комиссия по вооружениям и оборонной промышленности сосредоточит усилия металлургии, баллистики и отделов проектирования артиллерии на изучении противотанковых средств с большей начальной скоростью и сильным пробивным действием. В будущем, независимо от того, каких стальных монстров противник приведет на поле боя, Красная армия должна иметь средства для их прямого уничтожения."
 RUS_fr_universal_hull_standards:0 "Стандартизация компонентов бронированных машин"
 RUS_fr_universal_hull_standards_desc:0 "Полная переработка всего автомобиля для каждого типа задач не только тратит время инженеров, но и заставляет заводы и ремонтные подразделения иметь дело с неконтролируемым разнообразием деталей. Бронированное подразделение будет стандартизировать силовые установки, подвески, трансмиссии и интерфейсные спецификации так, чтобы танки, самоходная артиллерия и противотанковые машины могли использовать как можно больше одинаковых базовых компонентов. Стандартизация не устранит специализированные машины; напротив, она позволит новым башням и надстройкам быстрее переходить от разработки к массовому производству."
 RUS_fr_self_propelled_direct_fire_system:0 "Самоходная система прямого огня"
 RUS_fr_self_propelled_direct_fire_system_desc:0 "Буксируемая артиллерия может разрушать крепости, но трудно постоянно сопровождать бронетанковые колонны через проломы. Мы установим тяжелую артиллерию на шасси, способные сопровождать фронтовые операции, что позволит самоходным орудиям и штурмовым орудиям непосредственно подавлять укрепления, артиллерийские позиции и скопления вражеских сил. Таким образом, бронетанковые войска получают мощную огневую поддержку, не дожидаясь артиллерии с тыла, но им также необходимо создать соответствующую систему снабжения боеприпасами и технического обслуживания."
 RUS_fr_armoured_firepower_coordination_standard:0 "Стандарт координации бронетанковой огневой мощи"
 RUS_fr_armoured_firepower_coordination_standard_desc:0 "Если танки, самоходная артиллерия и дивизионная артиллерия будут искать цели независимо друг от друга, никакая мощь огня не будет просто рассеяна по всему полю боя. Новые стандарты координации унифицируют радиознаки, обозначение целей, зоны огня и разведывательные отчёты, позволяя бронетанковым формированиям быстро сосредоточивать огонь в решающих точках. Командиры, артиллерийские наблюдатели и штабные офицеры должны научиться использовать один и тот же язык, чтобы сталь действительно стала организованной силой."
 RUS_fr_land_warfare_mainstay:0 "Унифицированная бронированная оружейная система"
 RUS_fr_land_warfare_mainstay_desc:0 "От легкоплавкого бронирования и универсальных шасси до танковых орудий, самоходной артиллерии и дальнобойной поддержки, достижения, когда-то разбросанные по различным конструкторским бюро, теперь могут действовать в рамках одних и тех же боевых задач. Бронированное оружие больше не является изолированными опытными образцами на парадных плацах, а стало полной системой с общими компонентами, едиными процедурами управления огнем и надежной промышленной базой. Красная армия наконец-то может рассматривать бронетанковые войска как самостоятельную опору в сухопутном бою, а не просто как вспомогательное оружие, временно приписанное к пехоте."
 RUS_fr_armaments_construction_stage_summary:0 "Резюме этапа разработки вооружения"
 RUS_fr_armaments_construction_stage_summary_desc:0 "Комитеты в трех областях — пехотного вооружения, оперативной мобильноcти и бронетанкового строительства — представили результаты этой фазы, но при этом оставили после себя конфликты по вопросам стали, станков и квалифицированных рабочих. Федеральная комиссия по вооружениям и оборонной промышленности соберет отчеты испытаний, заводские данные и мнения с фронта, интегрируя разрозненные системы в единые достижения строительства Народной армии. Следующая фаза федерального плана не удовлетворит желания всех одинаково, но определит, куда Республика направит свои наиболее ценные промышленные ресурсы на основе военных приоритетов, которые мы уже выбрали."
 RUS_fr_armaments_summary_integration_tt:0 "Всё произведено в рамках плана Федеральной комиссии по вооружениям и оборонной промышленности §YНациональный дух§! будет интегрировано в §YТекущее положение Рабоче-крестьянской Красной армии: Непобедимая и легендарная§!"
 RUS_fr_automatic_focus_tt:0 "Фокус будет автоматически продвигаться."
 RUS_fr_armaments_priority_condition_tt:0 "Фокус был выбран §YОбщий обзор разработки вооружений армии§!"
 RUS_fr_initial_materials_tt:0 "Разблокировать §YВещи военной реформы§! и §YНациональная военная реформа§! Классификация разрешений"
 RUS_fr_materials_system_unlocked_tt:0 "Разблокирует £GFX_RUS_fr_military_reform_materials §YВещи военной реформы§! с базовым ограничением §Y60§! и базовый суточный прирост §G+1.00§!. Каждый §YПервый пятилетний план§! балл этап добавляет §G+0.05§! ежедневный прирост. Также разблокирует §YВсероссийская военная реформа§! категория решения."
