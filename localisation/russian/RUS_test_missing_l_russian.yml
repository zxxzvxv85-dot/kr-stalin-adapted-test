 RUS_fr_establish_political_commissar_organisation:0 "Внедрить систему организации политических комиссаров"
 RUS_fr_establish_political_commissar_organisation_desc:0 "после §Y90 дней§! Реорганизация, включающая политические кадры, образовательные курсы и каналы обратной связи с низовыми уровнями в единую структуру всей армии; после завершения получить §YСистема организации политкомиссаров§!."
 RUS_fr_establish_scientific_general_staff:0 "Создать научный генеральный штаб"
 RUS_fr_establish_scientific_general_staff_desc:0 "после §Y60 дней§! Строительство, создание единой системы данных, модели боевых действий и системы подготовки персонала для Генерального штаба; после завершения получить §YНаучный Генеральный Штаб§!."
 RUS_fr_adopt_deep_battle_concept:0 "Реализовать теорию глубоких операций"
 RUS_fr_adopt_deep_battle_concept_desc:0 "после §Y60 дней§! Вывести, включить глубокие прорывы, оперативные резервы и быструю подкрепление в оперативные регламенты армии; после завершения получить §YТеория глубоких операций§!."
 RUS_fr_establish_one_man_command:0 "Реализовать систему ответственности руководства"
 RUS_fr_establish_one_man_command_desc:0 "после §Y60 дней§! Системные корректировки уточняют военные обязанности командиров и координируют руководство с политической работой; по завершении получают §YСистема главной ответственности§!."
 RUS_fr_adopt_revolutionary_collectivism:0 "Реализовать революционную коллективистскую программу"
 RUS_fr_adopt_revolutionary_collectivism_desc:0 "после §Y60 дней§! Исправление образования, принятие коллективной ответственности, устойчивость позиций и координация войск как основной вопрос военного строительства; получено после завершения §YРеволюционный коллективизм§!."
 RUS_fr_adopt_military_vanguardism:0 "Реализовать программу военного авангардизма"
 RUS_fr_adopt_military_vanguardism_desc:0 "после §Y90 дней§! Пилот, предоставляющий приоритетную поддержку экспериментальному проектированию, быстрому принятию решений и высокомобильным боевым подразделениям; после завершения получить §YВоенный авангардизм§!."
 RUS_fr_adopt_revolutionary_heroism:0 "Реализовать программу революционного героизма"
 RUS_fr_adopt_revolutionary_heroism_desc:0 "после §Y60 дней§! Публичность и построение системы, поощрение солдат проявлять инициативу через публичное признание, уполномочивание на поле боя и служение примером; награды выдаются по завершении §YРеволюционный героизм§!."
 RUS_fr_reform_disorganisation_4:0 "Текущее положение Красной армии рабочих и крестьян: толпа"
 RUS_fr_reform_disorganisation_4_desc:0 "Хотя под давлением попыток дезертирства генерала Василевского большое количество молодых и сильных членов Белой бандитской армии перешло на нашу сторону и вернулось в наш лагерь, внутренние проблемы в нашей армии остаются серьёзными: система командования почти парализована, милиция сильно перегружена кадрами, а среди них проникли вражеские шпионы. Если мы действительно хотим создать стальную армию для защиты народа, мы должны немедленно провести быструю и тщательную чистку."
 RUS_fr_reform_disorganisation_3:0 "Текущее положение Рабоче-Крестьянской Красной Армии: Всё необходимо восстанавливать"
 RUS_fr_reform_disorganisation_3_desc:0 "После исправления ошибок Красная Армия наконец освободилась от своих раздутых нагрузок, но она все еще была далеко от того, чтобы стать по-настоящему регулярной армией. Большинство младших офицеров происходили из бывших повстанческих сил и придерживались устаревших тактических идей; вновь призванные солдаты, хотя и были полны энтузиазма, даже не могли маршировать в базовом строю. На данный момент единственной стратегией было усвоение основ. Только когда структуру батальонов и рот будет завершена и команды смогут достигать взводов и отделений, эту армию можно будет считать принявшей начальную форму."
 RUS_fr_reform_disorganisation_2:0 "Статус Рабоче-крестьянской Красной Армии: Закален в сталь"
 RUS_fr_reform_disorganisation_2_desc:0 "Организация и правила, написанные на бумаге, должны вернуться на полигон, проверенные потом и исправленные с течением времени. Формирование армии никогда не достигается одним приказом — это требует отработки через повторяющиеся учения, выявления проблем на стрельбах и постепенного сокращения разрыва между теорией и реальной боевой деятельностью на каждой практике."
 RUS_fr_reform_disorganisation_1:0 "Текущая ситуация Рабоче-крестьянской Красной армии: Поток железа на десять тысяч миль"
 RUS_fr_reform_disorganisation_1_desc:0 "Заимствуя восточную пословицу — «Всё готово, но не хватает восточного ветра» — чтобы описать РККА в этот момент, нельзя не признать, что это чрезвычайно точно. С новыми видами оборудования, которые постепенно вводятся в действие, качество Рабоче-Крестьянской Красной Армии неуклонно улучшается. Наши солдаты научились управлять новой техникой, командиры осваивают новые тактические правила, а система снабжения постепенно охватывает более отдалённые фронты. Мы уже готовы к наступлению на крепости старого мира."
 RUS_fr_reform_disorganisation_0:0 "Текущая ситуация Рабоче-крестьянской Красной армии: Поток железа на десять тысяч миль"
 RUS_fr_reform_disorganisation_0_desc:0 "Заимствуя восточную пословицу — «Всё готово, но не хватает восточного ветра» — чтобы описать РККА в этот момент, нельзя не признать, что это чрезвычайно точно. С новыми видами оборудования, которые постепенно вводятся в действие, качество Рабоче-Крестьянской Красной Армии неуклонно улучшается. Наши солдаты научились управлять новой техникой, командиры осваивают новые тактические правила, а система снабжения постепенно охватывает более отдалённые фронты. Мы уже готовы к наступлению на крепости старого мира."
