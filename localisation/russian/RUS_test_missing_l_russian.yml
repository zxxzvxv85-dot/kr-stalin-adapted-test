 stalin_form_sov.25.t:0 "Большевики уходят из дома"
 stalin_form_sov.25.desc:0 "Ростов\n\nКогда речь заходит о доме, у Алёши, кажется, всегда есть десять тысяч вещей, о которых можно говорить. На еженедельных встречах поддержки он всегда сидит в первом ряду, спина прямая, а его две грубые руки аккуратно лежат на коленях — но как только кто-то начинает тему, он становится словно оттаявшая река, слова льются одно за другим, их невозможно остановить.\n\nТоварищи слушали его рассказ по кусочкам и постепенно примерно сложили первую половину жизни Алёши.\n\nВ 1917 году отца Алёши захватила Белая армия, и о нём больше ничего не слышали. Его мать заболела от горя и отчаяния, её тело сразу сдалось. В том году Алёше только исполнилось восемнадцать, а у него была младшая сестра Илья, которой было всего девять. Прежде чем молодой человек успел понять, что на самом деле означают такие большие слова, как «революция» и «будущее», жизнь бросила его во взрослую жизнь — ему пришлось взять на себя ответственность за эту шаткую семью.\n\nВ 1921 году Белая армия установила контроль в России. Партия социалистов-революционеров и Конституционно-демократическая партия сумели создать так называемый «Демократический союз». Они сменили вывеску, но это не принесло Алеше удачи. Он работал на заводе по производству винтов в пригороде, и металлическая стружка летала перед станком, как дождь. Он крутил гаечный ключ до появления дыма, но тех немногих заработанных денег едва хватало, чтобы прокормить семью. Деньги на лекарства для матери всё ещё приходилось painstakingly копить копейка за копейкой Илье, который стирал бельё для других.\n\nДни шли, ни слишком горькие, ни слишком сладкие, до лета 1936 года. Знакомый прораб, используя смесь подкупа и обмана, втянул безработного Алешу в так называемый «Проект Рассвет» Савинкова. Название было действительно очень впечатляющим — Рассвет. Но позже, когда Алеша рассказывал об этом периоде другим, он мог только покачать головой с горькой улыбкой: это проклятое место… На тёмной, безсолнечной стройке его однажды заставили работать непрерывно двадцать семь часов, в конце концов он рухнул на замёрзшую, затвердевшую грязь. Если бы не старый рабочий рядом с ним, который настаивал, чтобы тащить его в сарай и дать ему половину миски горячего супа, он, возможно, никогда бы больше не проснулся.\n\nК счастью, большевики вернулись. Начальника на фабрике сменили, рабочие часы установили, и даже ещё две лампы повесили на потолок цеха. Дни Алёши наконец немного прояснились, и деньги в его руках постепенно накапливались. Но болезнь матери была глубоко укоренившейся, и расходы на лекарства казались бездонной ямой. Он несколько ночей проверял счета и, наконец, решил—пойти в армию. Суточные в Красной армии были выше, чем на фабрике, и, живя экономно и отправляя деньги домой, их хватало бы, чтобы мать могла покупать лекарства. Ради этого и только он записался.\n\nВ день отъезда платформа железнодорожного вокзала была полна людей, провожавших путешественников, а воздух был наполнен запахом угольного дыма, слез и мелодией аккордеона. Илья — девушка, которую он носил на спине с детства, а теперь превратившаяся в юную даму — стояла на цыпочках в толпе, отчаянно ему махая.\n\nАлёша высунул половину своего тела из окна машины и открыл рот, как будто десять тысяч слов застряли у него в горле.\n\nКолеса катились по рельсам, издавая пронзительный скрип, и все слова заглушались этим громким шумом. В конце концов он просто громко закричал на свою младшую сестру:"
 stalin_form_sov.25.a:0 "\"Прощай! Маленький Илья! Береги маму!\""
 stalin_form_sov.26.t:0 "Первый Революционный Военный Конкурс"
 stalin_form_sov.26.desc:0 "Казань\n\nЧестно говоря, Леону не нравится разговаривать с людьми.\n\nЭто не значит, что у него плохой характер или что он смотрит на других свысока. Он просто считает, что открывать рот — это очень утомительно. Если кто-то с ним заговорит, он ответит, но, как правило, не более чем тремя словами — «Мм.» «Хорошо.» «Понял.» — больше этого, и кажется, что что-то застряло у него в горле, и он просто не может этого выговаривать. В военном лагере, где люди едят и спят прямо рядом с вами, его личность, конечно, не совсем очаровательна, так что после более чем полугода службы он действительно не завёл друзей.\n\nНо у него есть что-то ещё.\n\nОн понимает механику. Не в том смысле «понимания», когда перелистываешь пару книг и смеешь говорить, что знаешь, а по-настоящему понимает. Для него двигатель — это не просто грохочущий кусок металла; это десятки или даже сотни деталей, говорящих одновременно. Если одна звучит не так, или одна вращается на пол-оборота медленнее, он услышит это с закрытыми глазами. Однажды командир роты в полушутку сказал ему: «Леон, если бы ты уделял общению с людьми столько же внимания, сколько уделяешь общению с машинами, я с радостью позволил бы тебе быть командиром роты». Леон об этом подумал, почувствовал, что не может ответить, и сказал всего два слова: «Не осмелюсь».\n\nТак что когда вышло уведомление о первом революционном военном конкурсе всей армии, и квота на техническую модель в подразделении досталась ему, никто не выразил удивления.\n\nМероприятие должно было пройти в Казани. Когда пришли новости, Леон был в гараже, ползая под шасси полугусеничного автомобиля, его руки были покрыты смазкой, он затягивал болт. Инструктор прочитал уведомление один раз, ожидая, что он что-то скажет, но всё, что он сделал, это протянул одну руку из-под автомобиля, показал большой палец вверх, а затем снова убрал её.\n\nИнструктор стоял там, разрываясь между смехом и слезами: «Давай, скажи что-нибудь мне».\n\nПод машиной раздался приглушённый голос: «Соберите свои вещи.»\n\nИнструктор покачал головой и ушёл.\n\nДорога от базы до Казани была недолгой. Военный грузовик весь день скакал по ухабистой грунтовой дороге, перевозив двенадцать солдат-соревнующихся, всех лучших отборов из своих частей. Кто-то начал петь песню, но на середине понял, что тон стал слишком высоким, и все в грузовике разразились смехом. Леон сидел в самом внутреннем углу, прислонившись к перегородке грузовика, с старой, изношенной копией «Принципы конструкции двигателя внутреннего сгорания» на коленях. Кто-то протянул ему бутылку воды; он сделал глоток, сказал «спасибо» и снова вернулся к чтению.\n\nСолдаты, стоявшие рядом, переглянулись и обменялись взглядом типа 'он просто такой'.\n\nКазань есть, в конце концов, Казань. В отличие от гарнизонных казарм и грязных учебных полей, это старый город на Волге. Улицы вымощены камнем, а на некоторых зданиях до сих пор видны пулевые отверстия времен гражданской войны, но уже ходят трамваи, звеня весь путь. Место проведения соревнований расположено в старом военном лагере на окраине города. Люди из разных частей собираются огромной толпой, повсюду разноцветные погоны и нарукавные знаки, гомон как в Новый год.\n\nВ день церемонии открытия приехал старший чиновник из штаба и выступил с речью на сцене. Леон мало что помнил из сказанного, только одно предложение: «Революционная армия должна быть не только храброй, но и способной.» Он стоял в строю, несколько раз обдумывая это предложение про себя, чувствуя, что в нём есть смысл.\n\nСоревнование было разделено на несколько мероприятий: стрельба, кросс, тактические маневры и радиосвязь. На каждом мероприятии кто-то подбадривал участников, а кто-то вздыхал. Леон записался на техническое обслуживание, которое было не слишком оживленным мероприятием и даже имело мало зрителей. Экзаменационная площадка была устроена в углу на краю спортивной площадки, где на длинном столе лежала ряд разобранных винтовок, намеренно расположенных с семью или восемью типами неисправностей. Экзаменатор был оружейником в круглых очках, напоминавшим учителя, но говорил прямо и энергично: 'Соревнование длится один час, начинайте!'\n\nЛеон сел за стол.\n\nВремя от времени на игровой площадке снаружи раздавались взрывы радостных криков — вероятно, кто-то попал в идеальное кольцо при стрельбе или кто-то пересек финишную черту в кроссе. Вдали слабо доносился свист Волги, смешиваясь с сентябрьским ветром и вызывая необъяснимое чувство легкого оцепенения. Но Леон всего этого не слышал.\n\nКогда он взял в руки первый пистолет, все звуки снаружи стихли.\n\nЕго руки не дрожат. Это его умение — рука, которая много лет закручивала винты, ровная, как откалиброванный станок. Каждый палец точно знает, куда идти и с какой силой действовать. Он разбирает винтовку; его движения не быстрые, но каждый шаг четкий и точный: снимает приемник, оттягивает пружину, вынимает ударник, без единого лишнего движения. Он как молчаливый дирижер оркестра; куда проходят его пальцы, металлические детали автоматически выстраиваются, рассыпаясь на столе словно детализированная карта.\n\nЭкзаменатор в очках с круглыми оправами изначально стоял рядом, наблюдая. Продолжая наблюдать, он перестал двигаться. Он снял очки, чтобы протереть их, затем снова надел их и достал из кармана блокнот, чтобы что-то написать на бумаге.\n\nНа тридцать восьмой минуте Леон собрал последнее оружие, оттянул затвор и один раз нажал на спусковой крючок. Ударник издал чистый, резкий щелчок. Он аккуратно положил оружие обратно на стол, затем встал, потёр руки о штаны, чтобы стереть масло, и лишь тогда понял, что экзаменатор пристально на него смотрит.\n\n\"Из какого вы подразделения?\" — спросил экзаменатор.\n\nЛеон сообщил число.\n\nЭкзаменатор поправил очки и улыбнулся. Это была улыбка, которую может иметь только человек, опытный в этой области, с оттенком неожиданного удивления. 'Чем ты занимался раньше?'\n\n\"Уральский машиностроительный завод. Ремонтировал токарные станки три года.\"\n\nЭкзаменатор кивнул, словно наконец что-то понял. Он сделал ещё одну запись в своем блокноте, а затем похлопал Леона по плечу: «Хорошо, товарищ. Результаты будут объявлены позже.»\n\nВ день объявления результатов Леон занял первое место.\n\nОн не из тех людей, которые смеются, выиграв первое место. Стоя на пьедестале, выражение его лица было таким же, как обычно, когда он работает над машинами, даже немного серьёзнее, как будто он не знал, куда деть руки. Аплодисменты снизу были довольно громкими, особенно от нескольких солдат его роты, у которых ладони были красные от хлопков; один с громким голосом даже крикнул: «Молодец, Леон!», вызывая взрыв смеха у окружающих.\n\nВечером участники собрались на открытой площадке за пределами лагеря, чтобы поесть. Кто-то перебирал струны гитары, кто-то использовал крышку от ланчбокса, чтобы отбивать ритм, а свет костра мерцал на лицах всех. Кто-то позвал Леона, попросив его сесть в середину круга. Он на мгновение замешкался, но все же подошел и сел.\n\nСолдат, играющий на гитаре, подошёл и спросил его: «Эй, товарищ Чемпион, разве у тебя нет ничего, что ты хочешь сказать?»\n\nЛеон некоторое время молчал. Костер потрескивал, посылая искры в небо. Вдалеке река Волга тихо текла в ночи, словно полоса черного атласа. Он посмотрел на свои руки, покрытые смазкой и ржавчиной — руки, которые уже более десяти лет затягивали винты, ремонтировали токарные станки, тракторы и ружья, поддерживали его самого и обслуживали одну машину за другой, молча, но грохоча. Он никогда не считал это чем-то необычным.\n\nНо в этот момент он сидел прямо посреди огненного света, окружённый лицами, краснеющими в свете, ожидая его слов.\n\nВдруг он почувствовал, что открыть рот на самом деле не кажется таким уж трудным."
 stalin_form_sov.26.a:0 "\"Меня зовут Леон,\" — сказал он, 'механик.'"
 stalin_form_sov.27.t:0 "Поздний ночной звонок"
 stalin_form_sov.27.desc:0 "Владивосток\n\nТелефон зазвонил ровно в два часа ночи.\n\nДежурный взял трубку, и прежде чем он успел доложить кодовый номер, с другого конца раздался сильно приглушённый всхлипывающий голос: «Это... Солдатский комитет? Здесь... наш командир роты...»\n\nПрежде чем слова были закончены, голос оборвался. В приёмнике слышался только гуд электрического тока и слабые крики и ругательства вдали.\n\nДежурный офицер крепче сжал микрофон.\n\nОн сказал глубоким голосом: «Товарищ, говорите медленно. Какая часть? Как зовут командира роты?»\n\nТам на несколько секунд воцарилась тишина, как будто кто-то сомневался. Потом присоединился другой голос, резче предыдущего, но тоже дрожащий: «Докладываю… 73-й пограничный отряд, 3-я рота. Командир роты — Валёнкин Сергеевич Попов. Мы—»\n\nЕщё один глухой стук, как будто кто-то упал. Телефон снова повесили.\n\nДежурный не колебался. Он встал, схватил внутренний телефон на столе и потряс его три раза.\n\n\"Соедините меня с военным комиссаром округа. Это срочно.\"\n\nМенее чем через десять минут политический комиссар военного округа поспешил в дежурную комнату, пуговицы его мундира еще не были полностью застегнуты, но сон уже исчез с его лица. Он взглянул на журнал дежурства, его брови сморщились в узел.\n\n\"Попов.\" Он прокручивал это имя во рту, \"Кто-то анонимно прислал письмо в прошлом месяце. Доказательств нет, его скрыли.\"\n\n\"На этот раз всё иначе,\" сказал дежурный офицер, 'это был телефонный звонок. Он прозвонил дважды, и разговор не закончился.'\n\nПолитический комиссар на мгновение замолчал. За окном ночной ветер Владивостока принес с собой солоновато-рыбный запах, который заставлял шумно шелестеть журнал дежурства на столе.\n\nМашина тряслась по грунтовой дороге почти три часа посреди ночи. К тому времени, как они прибыли на станцию 73-го полка пограничной обороны, 3-й роты, небо уже посветлело.\n\nЛагерь был очень тихим. Тихим до ненормальной степени — ни часовых, ни огней, только небольшой участок тусклого жёлтого света, исходившего из окна бунгало штаба.\n\nПолитический комиссар толкнул дверь, но сцена перед ним оставила его несколько ошеломлённым.\n\nСемь солдат стояли в ряд, избитые и избитые. Младший выглядел ещё не на двадцать, с засохшей кровью в уголках рта и тёмными синяками под глазами. За ними крепкий офицер был привязан к стулу, его знак отличия был сорван, воротник открыт, на лице читались смесь злости и презрения.\n\nПолиткомиссар узнал это лицо. Попов.\n\nОдин солдат вышел вперёд из семерки. Его звание было рядовой первой статьи. Он отдал честь политическому комиссару и спокойно сказал: «Докладываю командиру. Комитет солдат получил доклад с настоящими именами. После проверки это подтверждено. Подозреваемый взят под стражу.»\n\nОн остановился, вытащил аккуратно сложенный лист бумаги из кармана на груди и передал его обеими руками.\n\n\"Это совместное письмо от всех 83 солдат роты.\"\n\nПолитический комиссар взял кусок бумаги. Она была густо покрыта письмом; часть текста была небрежно написана криво, и было ясно, что некоторые части написаны одним человеком от имени нескольких других. В конце стояли восемьдесят три подписи и восемьдесят три красные отпечатка рук — красный цвет варьировался по оттенку, а несколько отпечатков были слишком сильно окрашены, и чернила растекались по волокнам бумаги, напоминая кровь.\n\nОн читал строка за строкой. Сокращая оплату солдат, присваивая припасы, физически наказывая солдат, запирая их без еды... он прочитал это три раза. Затем он сложил письмо обратно и сунул его в карман пальто.\n\nПолитический комиссар развернулся и посмотрел на Попова в кресле. Гнев и презрение в этих глазах не исчезли, но они начали слегка колебаться.\n\n\"Товарищ Попов,\" голос политического комиссара не был громким,\" у вас есть что сказать?\"\n\nПопов не ответил.\n\nНебо постепенно светлело. Утро во Владивостоке было очень холодным, и выдыхаемый воздух превращался в белый туман. Когда политкомиссар вышел из штаба роты, семь побитых солдат стояли в линию у двери.\n\nПозади них из казарм вышли ещё солдаты и встали в сером утреннем свете. Они тихо наблюдали, как политрук загружает тот транспорт, и как Попова сажают в другой транспорт.\n\nЗатем двигатель завёлся, и две машины поехали одна за другой по дороге, исчезая в конце дороги.\n\nДежурный получил новый звонок рано следующим утром."
 stalin_form_sov.27.a:0 "\"73-й пограничный отряд, 3-я рота, Солдатский комитет. Доклад завершён!\""
 russia_socialist_events.30.t:0 "Изгнанник возвращается домой"
 russia_socialist_events.30.d:0 "Закон о национальной обороне \"1923 года\" когда-то классифицировал все «коммунистические действия» как незаконные. Когда к власти пришло правительство Марии Спиридоновой, его первым действием было отменить все приговоры по политическим преступлениям, вынесенные в соответствии с этим законом. Раньше этот закон висел над головами людей, как меч — тысячи социалистов были преследуемы и заключены в тюрьму, а многие бежали в западные социалистические страны, присоединяясь к сообществам большевистских эмигрантов там. Теперь большинство из них возвращаются домой на «Красном корабле», товарищи, отправляющиеся из Парижа и Лондона в путь обратно на родину.\n\nИх тепло встретили в Петрограде и объявили о слиянии с партийной организацией «Движение интеграции», которая уже давно действовала в Сибири. Однако семена разногласий были посеяны задолго до этого. Опыт ссыльных сильно отличался от опыта отечественных социалистов, что приводило к ожесточённым столкновениям. Эти ссыльные теперь больше напоминали военно-политическую группу, считая себя ортодоксальными преемниками Ленина, и были глубоко разочарованы текущей политической ситуацией в России."
 russia_socialist_events.30.a:0 "С возвращением домой?"
 russia_socialist_events.32.t:0 "Большевики в офицерском корпусе"
 russia_socialist_events.32.d:0 "В связи с добровольным или вынужденным уходом на пенсию большого числа офицеров Белой армии, опытные командиры находятся в дефиците. Особенно остро нехватка наблюдается среди командиров рот и взводов на уровне низшего звена, и вновь сформированные подразделения часто демонстрируют серьезные пробелы в командовании во время тактических учений и реальных развертываний.\n\nС этой целью Фрунзе вместе с другими офицерами Красной Армии, вернувшимися из ссылки, представил Временному правительству «Предложение о военных чистках и реформах». Основная идея предложения была двоякой: с одной стороны, продолжать выявление и устранение ненадёжных остатков в старой армии, а с другой — значительно ускорить ускоренное обучение в военных академиях и отбирать перспективные кадры из числа рабочих, крестьян и возвращающихся офицеров для заполнения командных должностей.\n\nЭто предложение охватывает широкий спектр вопросов — от переоценки действующих офицеров до корректировки организации войск и составления и продвижения новых боевых положений, с множеством вопросов, требующих решения. Хотя Фрунзе занимал должность стратегического руководителя, он не мог лично контролировать каждую деталь реформы. Поэтому в дополнительных заметках к предложению он особенно рекомендовал своего талантливого протégé Семёна Тимошенко координировать и осуществлять повседневную организационную работу по реформам, чтобы этот документ мог быть быстро превращен в реальную боевую способность армии."
 russia_socialist_events.32.c:0 "Оказывается, они действительно способны быть революционерами."
 russia_socialist_events.101.t:0 "Осада Кронштадта"
 russia_socialist_events.101.d:0 "Силы Красной Армии продвинулись к окраинам Петрограда и приказали генералу Гольцу сдаться. Однако этот маршал Белой армии не появился в городе и остался на своем флагмане «Генерал Алексеев», пришвартованном за пределами города. Отношение Балтийского флота было двусмысленным и беспокойным, оставляя весь город в странном застое. Между тем, крепость Кронштадта и Балтийский флот не давали существенного ответа на сообщения с любой стороны, ограничиваясь лишь двумя словами «принято» формально.\n\nГород все еще находится под контролем народа — большая часть петропавловского гарнизона принадлежит первым подразделениям, которые перешли на сторону восставших, и они сразу начали арестовывать непопулярных членов 'Свободы' в городе.\n\nЭтот опытный морской командир, без сомнения, был в ярости из-за того, что социалисты вновь пришли к власти, но на этот раз он, казалось, был изолирован и без поддержки. Однако у него по-прежнему была группа верных моряков и батальоны морской пехоты вокруг него, а пушки корабля оставались наводенными на сердце России. В Красной Армии за пределами Петрограда разгорелись ожесточённые споры: что именно замышляет Колчак? Организует ли он контрреволюционный удар, или уже был оставлен всеми, и остался лишь этот флот?\n\nВ конце концов правительство отправило в Петроград городского комиссара на борту «Генерала Алексеев» для переговоров с Колчаком, предлагая передать флот в обмен на достойную отставку. На корабле бывший «Верховный правитель всей России» выглядел измученным. Он лишь слегка сказал, что, возможно, постепенно отдалился от России и больше не может понять страну. Его прежняя крайняя озабоченность по поводу переворота в конечном итоге оказалась ненужной — больше на маршала навалилось чувство разочарования и усталости. После некоторого мягкого убеждения он согласился уйти в отставку и выразил желание продолжать служить председателем Комитета по арктическим исследованиям."
 russia_socialist_events.101.a:0 "Таким образом, катастрофа была предотвращена."
 russia_socialist_events.332.t:0 "Министерство сельского хозяйства народа"
 russia_socialist_events.332.a:0 "Сельскому хозяйству нужна радикальная реформа, пусть Дубровский возьмет на себя руководство."
 russia_socialist_events.332.b:0 "Майоров и Социальная революция идеально подходят друг другу."
 russia_socialist_events.332.c:0 "Взгляд Устинова можно охарактеризовать как гениальный."
 russia_news_events.8.t:0 "Революционная буря охватывает Россию"
 russia_news_events.8.d:0 "Борис Савинков пал в результате этого. Из-за действий президента, вызывавших растущее недовольство общественности и армии, в Красной площади вспыхнули массовые протесты, и среди эха выстрелов по всей столице Савинков был застрелен членом Партии социалистов-революционеров.\n\nПосреди хаоса ранее запрещённые социалистические партии подняли восстание, и народные комитеты, а также советы рабочих и крестьян создавались один за другим по всей стране. С широкой мобилизацией Красной гвардии Временное правительство продвигалось с большой энергией, а остатки Белой армии в Петрограде и на юге России рассеялись, как птицы и звери.\n\nКажется, что Россия за одну ночь стала социалистической страной, что оказало глубокое влияние на Европу и весь мир."
 russia_news_events.8.c:0 "Мировая революция уже близка!"
 RUS_yakov_sverdlov_leader_desc:0 "§YРодился:§!§L3 июня 1885 года; Российская империя, Нижний Новгород, Нижегородская губерния§!\n §YПредыстория:§!§LЯков Михайлович Свердлов родился в еврейской семье в Нижнем Новгороде. Его отец хранил оружие для подпольных революционных организаций и всегда поддерживал революционные убеждения своих детей. Под влиянием такой семейной обстановки Свердлов в 1902 году вступил в Социал-демократическую рабочую партию, а позже, во время раскола партии, решил поддержать большевиков Ленина.§!\n\n §LОн участвовал в революции 1905 года, был впоследствии арестован и заключён в тюрьму в Екатеринбурге. В течение следующих десяти лет он перемещался между тюрьмой и ссылкой, в это время продолжая изучать труды Маркса, Ленина и Каутского. После начала Февральской революции он воспользовался возможностью вернуться в Петроград и быстро стал ключевой фигурой большевиков. Во время Октябрьской революции и последующей гражданской войны он сыграл незаменимую роль и получил прозвище 'Чёрный дьявол' как от товарищей, так и от врагов за свои решительные действия.§!\n\n §LПосле того как Ленина убили, Свердлов стал основной фигурой среди руководства большевиков 'триумвирата' и в конечном итоге возглавил Российскую коммунистическую партию (большевиков) в изгнании в Париже. Он оставался верным ленинистом до конца и резко критиковал различные французские партии и профсоюзы за пренебрежение революционным единством и стремление исключительно к власти, из-за чего социализм в этой стране деградировал в 'бюрократический сектантизм'. В резком контрасте, большевики поддерживали упрощённую и эффективную структуру — в ходе реорганизации Свердлова фракция, возглавляемая Зиновьевым, была исключена из партии, оставив практически совершенную революционную машину.§!\n\n §LПосле реконструкции социалистической России Свердлов позиционировал свою партию как по-настоящему революционную. По его видению, большевики продолжат нести факел ленинизма и взять на себя миссию ведения революции вперёд.§!"
 russia_socialist_events.300.t:0 "Созвать представительное собрание"
 russia_socialist_events.300.d.radsoc:0 "Разрушенные институты Российской Республики превратились в руины. Сегодня большая часть страны управляется временными революционными комитетами Советов и союзов, а также сельскими коллективами. Нет никакого смысла сохранять что-либо из диктаторских реформ Савинкова, а парламентская система Набокова не подходит для рабочей России. Поэтому необходимо разработать новую конституцию, и, согласно указу Исполняющей обязанности Президента Марии Спиридоновой, должны быть проведены свободные выборы.\n\nОднако мы также приняли превентивные меры, чтобы предотвратить появление реакционеров из пепла. Любой член Альянса обороны, Конгресса Русского Единства или организаций, связанных с ними, не может участвовать в голосовании, пока не отбывает наказание или пока народный суд не признает его невиновным. Это также касается тех, кто утверждает, что вступил в организации «Свобода» под давлением или по оппортунистическим причинам. Этот шаг немедленно затрагивает большинство членов правых и центристских сил в российской политике. Более того, голосование должно организовываться рабочими комитетами, а право голоса фактически ограничивается в первую очередь рабочими и крестьянами.\n\nКак и ожидалось, более четырех пятых мест в конгрессе занимали социалистические партии, при этом Партия социалистов-революционеров получила около половины голосов, а большевики и Всероссийский союз трудящихся разделили оставшееся. Кроме того, было много других, меньших партий, при этом Радикальные демократы и Конституционно-демократический союз также выиграли несколько мест, но они были лишь призраками прошлого."
 russia_socialist_events.300.d.syndie:0 "$russia_socialist_events.300.d.radsoc$"
 russia_socialist_events.300.a:0 "Народ высказался. Давайте начнем."
 russia_socialist_events.441.t:0 "Революционный альянс рабочих?"
 russia_socialist_events.441.d:0 "Хотя Ленина уже нет в живых, его партия по-прежнему сохраняет значительное влияние — тот факт, что она занимает пятую часть мест в парламенте, является ясным доказательством.\n\nЭто подтолкнуло ветеранов Всероссийского союза рабочих начать всерьёз рассматривать возможность формирования правящей коалиции с большевиками, ведь только таким образом они могли получить большинство мест в парламенте и обеспечить, чтобы революционные достижения не были отодвинуты на второй план.\n\nСтолкнувшись с проблемой недостатка голосов и общим недовольством в партии по поводу сотрудничества с Партией социалистов-революционеров, старый Тарун решил сохранять молчание. Тем временем Каменев и Львицкий пришли к согласию: союз с большевиками приносит только выгоду и не влечет вреда, так как он может одновременно преодолеть исторический разрыв между меньшевиками и большевиками и помочь обеспечить плавное течение будущего управления.\n\nЧтобы показать искренность, на временных выборах партии в качестве кандидата на пост председателя был выдвинут Лев Каменев, имевший большевистское прошлое. После того как новости появились, большевики не сделали немедленных комментариев, но и открыто не возражали — это молчание само по себе рассматривалось в профсоюзе как молчаливое одобрение. Будет ли выдвижение в конечном итоге одобрено, зависело от последующих частных переговоров между двумя сторонами, но, по крайней мере, этот шаг уже был сделан."
 russia_socialist_events.441.a:0 "Когда рабочие объединяют усилия, победа обеспечена."
 RUS_vst_bolshevik_electoral_alliance_tt:0 "§rБольшевики§! и §rВсероссийский профсоюз§! Фактический электоральный альянс был сформирован."
 russia_socialist_events.301.d:0 "Дебаты начались немедленно. Бывший Кремлёвский Сенат был забит людьми, но хаос всё ещё находился в основном под контролем. Только товарищ Борис Камков был ответственен за управление толпой, неся трудную задачу поддержания порядка в зале.\n\nМногие положения будущей конституции были легко согласованы, включая социалистическое строительство, провозглашение Российской Социалистической Федеративной Республики, полную свободу вероисповедания и языка, а также власть рабочих и крестьянских советов, избранных на местном уровне... но когда доходило до деталей, представительное собрание сразу же погружалось в бесконечные дебаты.\n\nБольшевики вместе с коммунистами внутри Всероссийского съезда Советов рабочих, крестьянских и солдатских депутатов возродили фундаментальное требование «Вся власть Советам». Многие члены Партии социалистов-революционеров, особенно максималисты, с этим соглашались. Однако умеренные требовали, чтобы большевики уточнили, что именно означает «вся власть».\n\nФактически, какая-то форма национального конгресса всё ещё будет существовать, но природа конгресса должна быть чётко определена, иначе новая диктатура может возникнуть из-за расплывчатых положений. Конгресс подвергался критике со стороны некоторых как тайный парламентаризм, и некоторые доходили до того, что называли его либерализмом.\n\nВозможно ли создать союзную палату, как во Франции? Возможно ли создать палату региональных представителей? Некоторые даже предлагали установить трёхпалатную систему. Как правительство будет взаимодействовать с представительным собранием и Советами? Можно ли голосовать за отставку правительства?\n\nПосле серии крутых поворотов появились три равнозначных предложения. Несмотря на то что становилось поздно, представители все еще были очень взволнованы и надеялись вынести предложения на голосование. «Советское» предложение не ставило слишком много условий относительно государственных учреждений и предоставляло конгрессу, избранному Советами, практически неограниченные полномочия, позволяя ему создавать и упразднять государственные учреждения по мере необходимости. «Федеральное» предложение вводило больше сдержек и противовесов, включая гарантии представительства регионов и союзов. На стол также было вынесено третье гибридное предложение, пытавшееся согласовать конституционные гарантии с неограниченной советской демократией."
 russia_socialist_events.301.a:0 "Вся власть Советам!"
 RUS_const_left_option_tt:0 "Статья 97\n1) Съезд Советов и Профсоюзов является законодательным органом РСФСР.\n2) Конгресс избирается Советами на основе всеобщего избирательного права.\n\nСтатья 98\nСоотношение представителей на съезде следующее: один представитель районного совета на каждые 25 000 избирателей или один представитель областного совета на каждые 125 000 избирателей.\n\nТакие правила, скорее всего, приведут к §rВсероссийский профсоюз§!—§YБольшевики§! Альянс выиграл большинство в конгрессе.§rВсероссийская Федерация Профсоюзов§! в §oЛевый§! Поддержите это предложение."
 russia_socialist_events.302.d:0 "Вскоре после этого конгресс начал обсуждать природу власти в нашей новорожденной республике. Общепринятая точка зрения заключалась в том, что никто не хотел снова переживать преступления 1918 года, когда Россия не могла даже сформировать законное временное правительство, а большевики могли решать проблемы только в условиях хаоса, с очевидным для всех исходом. Поэтому легализация государственной власти была широко принята.\n\nНо у представителей есть гораздо более существенные разногласия по вопросам государственного управления. Те, кто выступает против централизации, надеются, что исполнительная власть, полностью подотчетная собранию, будет ослаблена. Это затруднит консолидацию власти, но также может напрямую привести к тому, что исполнительная ветвь власти не сможет принимать никакие решения. С другой стороны, правительство должно иметь возможность действовать оперативно, когда собрание не может собраться, и многие также обеспокоены тем, что без сильной центральной исполнительной власти сопротивление контрреволюционных сил станет еще более сильным."
 russia_socialist_events.303.d:0 "Во времена зарождения Республики она находилась в полном хаосе. Многие социалисты еще не присоединились к какой-либо фракции, а некоторые места несколько раз меняли владельцев на выборах с возможностью отзыва. Но после принятия конституции избирательная система постепенно стабилизировалась. Многие представители продолжали исполнять свои обязанности в Советах и на съездах профсоюзов. Многие представители старшего поколения социалистов, видя, что народ может объединяться и свободно решать все аспекты своей жизни, всегда проливали слезы, вспоминая славные моменты 1917 года. После того как они пережили столько страданий и преследований, рабочий класс вновь обрел свободу.\n\nПервый этап голосования на новом конгрессе, естественно, — это выбор Премьера. Избранный человек станет символическим национальным лидером и будет председательствовать на заседаниях конгресса в качестве председателя или председательницы (учитывая высокую вероятность избрания Спиридоновой, необходимо это упомянуть). Настоящая власть Премьера заключается в том, чтобы быть вовлечённым во все детали и давать советы, влияя на политику. Ожидается, что победит опытная и уважаемая фигура. Подсчёт голосов ещё не завершён, но, похоже, многие поддерживают Льва Каменева и Марию Спиридонову."
 russia_socialist_events.303.b:0 "Увидь искру звезды, готовую разгореться в яростное пламя!"
 russia_socialist_events.304.d:0 "После того как Революционный Альянс победил на выборах, главной задачей председателя Каменева было сформировать коалиционное правительство, способное стабилизировать ситуацию. Однако с момента, когда конгресс отклонил первоначальное предложение кабинета, все разногласия стали полностью очевидны — сторонники Левицкого в Трудовом союзе, коммунистические радикалы, фракция Данна, представители большевиков и члены Партии социалистов-революционеров имели собственные мнения, что приводило к бесконечным спорам. Формирование правительства, которое могло бы быть хоть как-то приемлемым для всех партий, было гораздо сложнее, чем сама революция.\n\nВсе стороны внимательно следили за каждой малейшей прибылью и потерей в распределении власти. В коалиционном правительстве Партия социалистов-революционеров и большевики уже были друг с другом в ожесточённой борьбе. Между тем, в рамках профсоюза левые и правые фракции также сдерживали друг друга. Центристская фракция во главе с Левитским, понимая компромиссную стратегию Каменева, неоднократно напоминала ему: уступки должны быть ограниченными, ведь они были там для того, чтобы реализовать политическое видение Левитского, а не чтобы шить одежду для других."
 russia_socialist_events.304.a:0 "Верьте в силу дружбы, пусть Зиновьев поднимется."
 russia_socialist_events.304.b:0 "Стоит попробовать новую теорию маршрутов, поддерживая Левицкого."
 russia_socialist_events.304.c:0 "Генеральный секретарь большевиков Сталин может быть хорошим началом."
 RUS_kamenev_sic_zinovyev_delayed_tt:0 "Завершено §YВсероссийский трудовой союз§! после фокуса,§YГригорий Зиновьев§! Будет назначен вторым командующим."
 RUS_kamenev_sic_levitsky_delayed_tt:0 "Завершено §YВсероссийский трудовой союз§! после фокуса,§YВладимир Левицкий§! Будет назначен вторым командующим."
 RUS_kamenev_sic_stalin_delayed_tt:0 "Завершено §YВсероссийский трудовой союз§! после фокуса,§YИосиф Сталин§! Будет назначен вторым командующим."
 russia_socialist_events.442.t:0 "Каменев вступает в должность"
 russia_socialist_events.442.d:0 "Организационная работа Всероссийского Трудового Союза была завершена, и также была закреплена большинство революционной коалиции на съезде. После подтверждения Центральным комитетом Трудового союза и делегацией большевиков Лев Каменев официально вступил в должность председателя и, в соответствии с договоренностями, достигнутыми при формировании кабинета, выдвинул своих заместителей.\n\nСкоро будет объявлен список новой правительства. Теперь Каменев должен доказать, что этот союз, охватывающий Федерацию профсоюзов, большевиков и другие революционные фракции, может не только выиграть выборы, но и по-настоящему управлять Россией."
 russia_socialist_events.442.a:0 "Председатель Каменев, пожалуйста, начинайте работать."
 RUS_iosif_stalin_sic:0 "$RUS_iosif_stalin$"
 russia_socialist_events.12.t:0 "План прошлой пролетарской революции"
 russia_socialist_events.12.d:0 "Когда первая гражданская война закончилась, все надежды были разрушены вместе с ней.\n\nПосле этого антикоммунистические преследования стали ещё более жестокими, чем в царскую эпоху — сотни тысяч рабочих были казнены или погибли в концентрационных лагерях. Русские социалисты, бежавшие во Францию, вместе с их коллегами, оставшимися в стране, оказались втянуты в серьёзный экзистенциальный вопрос: что делать?\n\nПоявилось большое количество сочинений красных эмигрантов, постепенно формирующих две школы мысли. Одну представляют Яков Свердлов, Михаил Калинин и другие, которые считают, что поражение в гражданской войне было не виной коммунистов, а должно быть отнесено на счет невыполненной на практике политики и предательства внутренних оппортунистов. Свердлов и старые большевики придерживались ортодоксального марксизма-ленинизма и долгое время стремились оказать влияние в Белой России через свою связь с 'движением за интеграцию'.\n\nСвердлов однажды сделал известное утверждение: политические партии и профсоюзы во Франции игнорируют революционное единство и соревнуются за власть между собой, что приводит к тому, что их социалистическое государство вырождается в систему «бюрократического сектантства». Ортодоксальные коммунисты на самом деле выступают против так называемой институциональной демократии — которая всего лишь является вассалом капитализма — и выступают за более широкую демократическую жизнь и участие народа.\n\nВ 1920-х годах среди эмигрантов возникла еще одна школа мысли, в основном состоявшая из сторонников меньшевиков. В брошюре, написанной в тюрьме в 1924 году, «Очерк прошлых пролетарских революций», Лев Каменев отметил, что пренебрежение единством было основной ошибкой российского левого движения. Каменев считал, что французская революция 1919 года продемонстрировала возможность многоаспектного революционного подхода — то есть совместного продвижения революции различными социальными классами через революционные партии, профсоюзы и другие пролетарские организации. Февральская революция добилась успеха именно этим методом;Однако российские левые постоянно отказывались отказываться от своих иллюзий относительно Белого правительства, что вынуждало большевиков принимать более строгие меры подавления.\n\nХотя теория Каменева была широко принята российскими социалистами, в эмигрантской среде её часто считали ревизионизмом. Исходя из этой теории, Владимир Левицкий предложил концепцию «Коммунистического синтеза», ядром которой является следующее: чтобы избежать тирании, будущий российский коммунизм должен существовать как синтез различных социалистических взглядов, и ни одна группа не может навязывать свою волю Советам, избранным через демократические выборы. На практике Левицкий всегда стремился объединить разные фракции российских социалистов, чтобы построить народный фронт, который бы преодолел старый раскол между большевиками и меньшевиками — в конечном итоге он достиг этой цели, создав Всероссийский союз труда."
 russia_socialist_events.31.t:0 "Коммунистическая партия России"
 russia_socialist_events.31.d:0 "Под руководством Якова Свердлова и Иосифа Сталина костяк старых большевиков вновь обрёл опору по всей России.\n\nХотя путь к выборам остается неясным, речи революционного ветерана Фрунзе уже вызвали волну откликов на публичных собраниях в Петрограде. Он подробно изложил русскому народу истины коммунизма, которые он и его соратники поняли в ходе своих передвижений по различным регионам — от Фаренштейля в Новой Франции до Красного Бирмингема и даже до кровавых столкновений на равнинах Патагонии.\n\nЭти личные переживания напрямую привели к созданию новой программы Российской большевистской партии — \"Что делать?\" Этот документ обнажил суть псевдореволюции: после революции либералы и капиталисты продолжали находиться на свободе, в то время как так называемые «представители рабочих» выявили свои двойные лица. «Шампанские социалисты» в Думе, а также социал-демократы, потратившие двадцать лет в литературных салонах, давно отбились от истинного пути социализма.\n\nА что насчёт Спиридоновой? Русский народ никогда нельзя обманывать — разве не эти предатели славы и прибыли стали причиной распада революции тогда?\n\nВ те годы о вас действительно заботился только Ленин, а теперь заботятся о вас только последователи Ленина!"
 russia_socialist_events.31.a:0 "Какие проблемы эти ученики Ленина ещё могут вызвать?"
 russia_socialist_events.4.t:0 "Взлет Лейбористской партии"
 russia_socialist_events.4.d:0 "После переживания долгосрочных незаконных запретов и политических преследований, российские социалисты наконец-то могут свободно организовывать политическую деятельность. Хотя большинство социалистов присоединились к Всероссийскому Трудовому Союзу, возглавляемому Левицким, или продолжали оставаться верными делу Партии социалистов-революционеров, многие мелкие партии все же постепенно создавались.\n\nСреди партий 'Старой Республики' единственной, которая по-прежнему сохраняет влияние, является Социал-демократическая лига под руководством Целлера. SDL в основном была сформирована из значительно ослабленной Радикально-демократической партии; после ухода радикалов она приняла некоторых новых членов с правого крыла, которые надеялись продвигать более консервативную или умеренную повестку через партию.\n\nЕще одной старой политической партией, возрождающейся, является возрождающаяся Российская Коммунистическая Партия (большевиков), Центральный комитет которой вернулся из изгнания под руководством Свердлова. Однако сила партии далеко не такая, какой она была в свои лучшие годы. Томский и другие большевики, участвовавшие в российском профсоюзном движении, не вернулись, вместо этого выбрав вступление в Всероссийский союз труда, чтобы получить большее политическое влияние, что еще больше ослабило власть большевиков. Тем не менее, большевики не были непопулярны; даже сегодня они по-прежнему имеют значительное влияние среди радикально настроенных рабочих и бедных крестьян.Чтобы ограничить развитие большевиков, различные политические партии достигли неформального соглашения о том, чтобы не допустить большевиков к ключевым постам власти.\n\nВ то же время существуют также десятки небольших партий, сосредоточенных вокруг известных левых деятелей или маргинальных идеологий (таких как анархизм и права женщин). Среди этих небольших партий и независимых законодателей есть также много членов, которые на самом деле не верят в социализм и следуют ему лишь поверхностно. Хотя эти небольшие партии по отдельности имеют ограниченное влияние, они образуют относительно небольшое, но заметное меньшинство в представительном собрании."
 russia_socialist_events.4.a:0 "Запутанная путаница..."
 russia_socialist_events.9.t:0 "Обновлённые большевики"
 russia_socialist_events.9.d:0 "После того как пыль гражданской войны улеглась, организация партии большевиков, извлекшая уроки, была полностью обновлена. Под решительной ректификацией Свердлова массовый партийный аппарат был сокращен и укреплен, превратившись в компактное и эффективное политическое орудие, в то время как большинство «ненадежных элементов» сами решили отойти в сторону.\n\nБольшинство из них затем вступили во Всероссийский союз трудящихся, сформировав левое крыло организации под руководством Льва Каменева. Каменев избежал казни после войны, но не смог избежать десяти лет заключения — возможно, по этой причине он стал самым престижным бывшим большевиком в послереволюционной России и разработал теоретическую концепцию будущего российского коммунизма.Честно говоря, причина, по которой Всероссийский трудовой союз смог стоять твёрдо, заключалась полностью в кропотливых усилиях Левицкого и Каменева, которые сплотили старых членов Российской социал-демократической рабочей партии и, хотя и едва, преодолели разрыв между большевиками и меньшевиками.\n\nВнутри Всероссийского союза труда существовала также другая фракция бывших большевиков, состоявшая из оппортунистов, таких как Григорий Зиновьев. Уже в 1918 году Зиновьев разошёлся с Свердловым из-за разногласий в революционной стратегии. Позднее созданная им «Российская коммунистическая рабочая партия» (РКРП), хотя и просуществовала недолго, в конечном итоге была интегрирована в левое крыло Всероссийского союза труда.\n\nНо очевидно, что амбиции Зиновьева выходят далеко за пределы роли небольшой фракции в Общероссийском союзе трудящихся. В противостояниях по практическим политическим вопросам между ним и умеренными коммунистами Каменева всегда существовал глубокий разрыв. Чтобы удалить потенциальные препятствия в будущем, он тихо начал восстанавливать свое влияние внутри партии большевиков."
 russia_socialist_events.9.a:0 "Наследие Ленина было разбито на куски."
 russia_socialist_events.194.t:0 "Белая армия Головастик"
 russia_socialist_events.194.d:0 "Россия пропитана атмосферой гражданской войны. Когда новое социалистическое правительство издало свои первые указы в Москве, большая часть России оставалась в хаосе. Но это был не хаотический беспорядок 1917 года, когда Россия находилась в состоянии анархии, и кто имел оружие, тот и был местным правителем. В наше время большинство государственных служащих, по-видимому, считает власть достаточно законной, поэтому они не оказывали активного сопротивления, и лишь в отдельных районах происходили отдельные вооруженные восстания. Уверения временного президента успокоили некоторую напряженность, и многие даже питали осторожную надежду, поскольку новое правительство выглядело больше как временное правительство, которое так и не состоялось в 1917 году.\n\nБольшая военная конспирация вокруг Михаила Дроздовского также была раскрыта, и генерал был немедленно арестован и заключен в тюрьму. После того как основные силы Белой армии были уничтожены, многие офицерские корпуса в подразделениях, находившихся на местах, всё ещё склонялись к сопротивлению, но подавляющее большинство рядовых солдат и унтер-офицеров не хотели брать оружие против нового революционного правительства; вместо этого во многих местах они арестовывали своих бывших командиров.Под руководством генерала Александра Василевского всего 28 молодых генералов совместно опубликовали широко распространённое письмо, в котором они признали новое правительство, призвали армию к сдержанности и потребовали организации свободных выборов.\n\nБывший начальник штаба армии и некоторые высокопоставленные офицеры были заключены в тюрьму за предполагаемое участие в преступлениях режима Савинкова. Некоторым удалось бежать, а некоторые погибли, оказывая сопротивление при аресте. В отдельных случаях также вспыхивали небольшие стычки. Накануне гражданской войны наши органы безопасности успешно захватили Деникина, Врангеля, Дроздовского и Кутепова, тогда как Марков оставался на свободе. После поочередного освобождения Петрограда и Царицына организованные реакционные армии были разгромлены, а немногие упорные силы Белой Армии были относительно эффективно уничтожены."
 russia_socialist_events.194.a:0 "Мы никогда не дадим Белой армии возможности."
 russia_socialist_events.332.d:0 "Внутри рабочей профсоюза существуют глубокие разногласия по поводу того, как решить «аграрную проблему».\n\nЧлены Партии социалистических революционеров давно стремились действовать — они всегда гордились тем, что являются защитниками крестьян. Честно говоря, немногие партии во всей России обладали таким глубоким пониманием сельской действительности, как эсеры. Муж Спиридоновой, Илья Майоров, естественно, стал главным кандидатом. Этот прагматичный аграрный экономист называл себя 'крестьянским коммунисом' и настаивал на том, что российских крестьян нельзя насильно вталкивать в социализм, они могут перейти к нему лишь через постепенное созревание материальных условий.\n\nПрямо противоположно этому стоит Сергей Дубровский, который представляет взгляды большинства членов Всероссийского союза труда. Он выступает за насильственное разрушение традиционной сельской структуры и принуждение сельского хозяйства к модернизации через крупномасштабные промышленные проекты и расширение провинциальных городов.\n\nОднако был третий кандидат — лидер максималистов Партии социалистов-революционеров Алексей Устинов. Будучи представителем крайне левого крыла партии, он предложил новую форму сельскохозяйственного производства, называемую «колхозами», считая, что только через эту переходную форму сельская местность может быть освобождена от голода и нищеты. Возможно, его план был по-настоящему всеобъемлющей стратегией."
 russia_socialist_events.421.t:0 "Возрождение большевиков"
 russia_socialist_events.421.d:0 "Благодаря тщательной координации Каменева и сильным организационным способностям самих большевиков, обновлённая большевистская партия быстро восстановила контроль над центром государственной власти. Все больше членов партии назначались или избирались на ключевые государственные посты, а политическая программа партии получила более широкое признание во всех социальных слоях, чем когда-либо прежде. На общественном уровне Всероссийский профсоюз, сформировав фактический правящий союз с большевистской партией, временно стабилизировал ситуацию, обеспечив необходимую легитимность для поддержки управления партией.\n\nНа темной стороне системы власти «революционное трио», состоящее из Каменева, Свердлова и Сталина, регулярно встречалось тайно, чтобы обсуждать долгосрочное направление партии. Все трое согласились, что нынешняя социалистическая республика все еще далека от полного устранения остатков капитализма: в экономической сфере группа «старых директоров фабрик» с реальной властью продолжала следовать старым методам управления и сопротивлялась новому производственному порядку; в местной системе управления многие бюрократы, оставшиеся со времен предыдущих режимов, по-прежнему на словах поддерживали указания, одновременно саботируя их, а также создавали независимые небольшие группы по интересам на местном уровне.\n\nПосле нескольких закрытых консультаций, они трое определили общую стратегию большевиков на предстоящий период: не трогая существующую государственную структуру, они будут полностью проникать и расширять реальное влияние партии в различных сферах — включая укрепление партийных ячеек в профсоюзах, отправку надежных кадров в местные советы, контроль над пропагандистскими инструментами и тайное создание сетей аварийного командования.В то же время они также начали разрабатывать план действий на случай «второй революции», чтобы, когда наступит подходящее время или когда старые силы проявят явную нестабильность, они могли быстро провести сверху вниз чистку и реорганизацию, полностью устранив все факторы, препятствующие углублению социализма."
 russia_socialist_events.421.a:0 "Добро пожаловать, товарищ."
 RUS_bolshevik_gamble_trigger_tt:0 "Чтобы запустить линию Сталина, сначала необходимо завершить фокус.§YСоздать Государственную военную комиссию§!."
 RUS_socrus_coalition_mechanic_decisions_desc:0 "После падения режима Савинкова местные сельские советы и профсоюзные организации развивались быстро, постепенно формируя почти ненормальную структуру управления.\n\n §RСоциалистическая революционная партия§! Благодаря заслугам, приобретённым во время восстания, и основам деревенской организации, он выступал за руководство новым режимом;\nВозобновление мероприятия публично §oРКП(б)§! Затем с помощью возвращённых кадров, партийных работников в армии и городских партийных организаций постепенно накапливать силы;\nПод председательством Каменева §rВсероссийский трудовой союз§!, затем координировать и направлять действия между двумя сторонами, стремясь сохранить заслуженно достигнутую лидирующую позицию для себя.\n\nИз-за давления реальности три партии были вынуждены сохранять внешнюю искреннюю единство и совместно продвигать реконструкцию России.\n\nЕсли в будущем не произойдут серьезные «аварии», направление эволюции отношений между тремя сторонами в конечном итоге определит путь, который выберет союз работников.\n\n §RОбязательно правильно управляйте отношениями между всеми фракциями!§!§YФактические способности советников будут меняться в реальном времени в зависимости от отношений их соответствующих фракций; ухудшение отношений напрямую ослабит эффекты соответствующих советников.§!\n\n §YПолитический ландшафт Союза рабочих§!:[RUS_RKP_is_shown]\nи §RСоциалистическая революционная партия§! Отношения: [?sr_var|0][RUS_VST_PSR_status]\n §rВсероссийский профсоюз§! Внутренний: [RUS_VST_centre_is_shown][RUS_VST_left_is_shown][RUS_VST_right_is_shown]\nи §1Социал-демократическая партия§! Отношение: [?sds_var|0]\n\nСведение отношений с любой стороной к нулю приведет к тому, что эта сторона покинет союз рабочих."
 RUS_vst_party_streamlined_idea:0 "Профсоюз работников: Оптимизированный и эффективный"
 RUS_vst_party_streamlined_idea_desc:0 "Оппозиция внутри профсоюза работников была маргинализирована, её ядро объединилось вокруг [ROOT.GetLeader]. Поправки, ранее сформированные различными фракционными отношениями, будут сохранены на уровне, достигнутом после оптимизации, и больше не будут меняться в зависимости от фракционных отношений."
 RUS_RKP_has_relations:0 "\nи §oРКП(б)§! Отношение: [?rkp_var|0]"
 RUS_military_production_idea:0 "Федеральная комиссия по вооружению и оборонной промышленности"
 RUS_military_production_idea_desc:0 "Федеральная комиссия по вооружениям и оборонной промышленности объединяет Генеральный штаб, федеральные плановые органы, военно-промышленные учреждения и оружейные заводы в единую процедуру разработки вооружений, позволяя координировать и продвигать проектирование, испытания, заказ и массовое производство в соответствии с реальными потребностями Красной Армии."
 RUS_central_vpk:0 "Федеральная комиссия по вооружению и оборонной промышленности"
 RUS_central_vpk_desc:0 "Федеральная комиссия по вооружениям и оборонной промышленности объединяет и координирует работу военных промышленных организаций, плановых органов и отделов закупок армии, обеспечивая, чтобы проектирование, испытания, производство и приемка оборудования соответствовали одному и тому же набору планов строительства национальной обороны."
 RUS_council_of_industrialists_desc:0 "Комитет промышленников является постоянным органом, выполняющим функции, аналогичные функциям Федеральной комиссии по вооружениям и оборонной промышленности, ответственной за управление военным производством России и предоставление экспертной поддержки государству."
