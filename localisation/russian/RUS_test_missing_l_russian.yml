 RUS_fr_armaments_report_title_mobility:0 "Отчет о стадии строительства военной мобилизации"
 RUS_fr_armaments_report_title_armour:0 "Отчет о фазе строительства бронетехники"
 RUS_fr_armaments_report_title_generic:0 "Отчет о стадии разработки федерального вооружения"
 RUS_fr_armaments_report_header_armaments:0 "§gНомер дела: Объединённая военно-промышленная индустрия № 14  Классификация: Для служебного пользования Постоянного комитета  Приложения: 9 томов§!"
 RUS_fr_armaments_report_header_mobility:0 "§gНомер файла: Транспорт совместных сил № 9  Классификация: Внутреннее использование Постоянного комитета  Приложения: 11 томов§!"
 RUS_fr_armaments_report_header_armour:0 "§gНомер файла: Объединённая проверка оборудования № 11  Классификация: Внутреннее для Постоянного комитета  Приложения: 13 томов§!"
 RUS_fr_armaments_report_header_generic:0 "§gНомер файла: Совокупные силы №7  Классификация: Внутренний документ Исполнительного комитета  Вложения: 8 томов§!"
 RUS_fr_armaments_report_priority_armaments:0 "В соответствии с резолюциями Первой рабочей конференции по вооружениям, комитет выделил 61% доступных часов на прецизионные станки, 54% квоты на высококачественную стальную артиллерию и 74 передовые технические команды в основном на оружие пехоты и артиллерийскую индустрию. В результате 43 военных предприятия были включены в единый график заказов, из которых 36 завершили перенос производства в срок. Постоянный комитет считает, что до того момента, пока Федерация не завершит всестороннее промышленное расширение, надежные и стандартизированные пушки и артиллерия останутся самым прочным каркасом Красной армии."
 RUS_fr_armaments_report_priority_mobility:0 "В соответствии с резолюцией Первой конференции по вооружениям, комитет включил 17 автомобильных, двигательных и ремонтных совместных предприятий в список приоритетной защиты и направил более 1200 инженерных кадров из железнодорожных и гражданских транспортных органов. Годовой план поставки двигателей выполнен на 88%, в то время как темпы строительства военных объектов для хранения и транспортировки топлива достигли 81%. Постоянный комитет считает, что собственная дистанция России является врагом, и Красная армия может превратить прорыв только в безвозвратную победу в бою, одновременно перемещая персонал, огневую мощь и припасы."
 RUS_fr_armaments_report_priority_armour:0 "В соответствии с резолюцией Первой конференции по вооружению, комитет сосредоточил 9 крупных производственных предприятий, 4 государственных испытательных полигона и 47% текущей квоты на легированную сталь на инженерии бронетехники. Конструкторские бюро представили в общей сложности 32 предложения по полным машинам и специализированным шасси, из которых 19 были утверждены для опытного или компонентного пробного производства. Постоянный комитет считает, что будущие войны требуют от Красной Армии наличия бронетанковых корпусов, способных к самостоятельным прорывам, поддерживаемой мобильности и сосредоточенной огневой мощи, а не просто нескольких экспериментальных машин для участия в парадах."
 RUS_fr_armaments_report_priority_generic:0 "Комитет завершил инвентаризацию ресурсов и инженерных задач за этот период: из 68 ключевых задач, включенных в единый план, 57 были приняты в срок, 7 были отложены, а 4 отменены из-за недостаточных технических условий. Ранее конфликтующие цели Генерального штаба, конструкторских бюро и производственных отделов переписываются в строительные стандарты, которые могут быть совместно реализованы всей федерацией."
 RUS_fr_armaments_report_infantry_lightweight:0 "Комитет принял совместные рекомендации ветеранов передовой линии и медицинского корпуса и не продолжил преследовать увеличение количества оборудования как единственную цель. Двенадцать опытных образцов винтовок, прицельных устройств и боевого снаряжения были протестированы шестью пехотными дивизиями, всего 18 400 офицеров и солдат; после совокупных маршей и стрельб на дистанцию 1 200 километров средний вес, переносимый отдельным солдатом, уменьшился на 3,7 килограмма, а потери не в бою из-за неподходящего снаряжения снизились на 11%. На основе этого Главное управление логистики утвердило новую таблицу нагрузки отряда, при этом избыточный вес должен переноситься транспортными средствами или коллективным снаряжением."
 RUS_fr_armaments_report_infantry_artillery:0 "Комитет решил приоритизировать создание дивизионной артиллерии над улучшением боевой нагрузки отдельного солдата. Девять экспериментальных дивизий и 312 артиллерийских орудий участвовали в совместных учениях по военным округам, и среднее время, необходимое артиллерийским наблюдателям для запроса огневой поддержки у пехотных полков, сократилось с 26 минут до 11 минут. Организация артиллерии, базы боеприпасов и процедуры вызова огня теперь включены в общие стандарты; в последней проверке боевой подготовки 73% артиллерийских батарей смогли выполнить первый залп в установленный срок."
 RUS_fr_armaments_report_infantry_generic:0 "Подкомитет по вооружению армии утвердил 47 стандартов для калибров, боеприпасов и деталей, и отменил 113 противоречивых старых чертежей. Все еще есть 8 планов, которые требуют продолжения полевых испытаний, но сейчас ни один арсенал не производит оружие и запасные части, не взаимозаменяемые для одной и той же армии."
 RUS_fr_armaments_report_mobility_vehicle:0 "Комитет решил объединить процессы производства транспортных средств в качестве основного подхода. Москва и другие центры автомобильной промышленности сократили 1 240 дублирующих деталей до 463 общих спецификаций и организовали три быстрые боевые группы для выполнения в общей сложности 3 600 километров дорожных маршей. Из 872 автомобилей, участвовавших в испытаниях, 82% достигли пункта назначения без серьёзного ремонта, а среднее время полевого обслуживания было на 31% короче, чем при старой организации. Это доказывает, что большое количество ремонтопригодных автомобилей гораздо ценнее нескольких прототипов с выдающимися характеристиками."
 RUS_fr_armaments_report_mobility_logistics:0 "Комитет определил специализированную механическую логистику как основной путь. В испытании поддержки длиной в шесть недель приняли участие четыре армии, одиннадцать дивизий и более 5200 транспортных средств. Батальоны транспорта, батальоны технического обслуживания и топливные конвои были включены в боевой план с самого начала учений впервые. Перерывы в поставках топлива на 1000 автодней были сокращены с 17 до 5, а 64% механических неисправностей удалось устранить в полевых ремонтных станциях; в результате механизированные операции впервые достигли устойчивости."
 RUS_fr_armaments_report_mobility_air_assault:0 "Комитет одобрил испытания для вертолетной техники наивысшего риска и воздушного штурма. Двадцать четыре прототипа выполнили 417 боевых вылетов, и три усиленные роты последовательно осуществили форсирование рек, захват мостов и высадки в тылу противника; пять самолетов были списаны из-за аварий, а еще семь потребовали возвращения на завод для капитального ремонта. Все эти потери были тщательно зафиксированы в приложении. Однако по итоговой оценке штурмовые отряды захватили запланированные цели на 6 часов 40 минут раньше наземного авангарда.Постоянный комитет считает, что хотя этот проект пока далек от зрелости, он уже показал, что глубина кампании больше не обязательно ограничивается наземным транспортом."
 RUS_fr_armaments_report_mobility_generic:0 "Подкомитет по моторизации завершил разработку 36 стандартов для интерфейсов автомобилей, инструментов для обслуживания и организации транспорта, а семь военных округов создали первую партию унифицированных складов запасных частей. Дебаты о том, должен ли следующим шагом быть расширение производства автомобилей, усиление специализированной логистики или продолжение исследований воздушной мобильности, еще не полностью завершены, но все планы должны основываться на этой общей промышленной базе."
 RUS_fr_armaments_report_armour_firepower:0 "Комитет сосредоточится на самоходной прямой стрельбе и сопровождающем огне в качестве особых приоритетов испытаний. Одиннадцать прототипов самоходной артиллерии и противотанковых средств выполнили 1 860 выстрелов в живую и 340 километров марш-бросков, при этом совместный коэффициент прохождения проверки пушки, шасси и интерфейса боеприпасов достиг 78%. Испытания также выявили проблемы с нагрузкой на снабжение и сроком службы техники, что привело к возвращению и переработке трех планов; однако машины, одобренные для дальнейшей разработки, уже способны сопровождать бронетанковые колонны через прорывы, не дожидаясь артиллерии тыла на каждой укрепленной позиции."
 RUS_fr_armaments_report_armour_durability:0 "Комитет сначала рассмотрел вопросы надежности конструкции, которые долгое время оставались в тени из-за характеристик опытных образцов автомобилей. Шестнадцать шасси проехали в общей сложности 9 700 километров по грязным, замерзшим и гравийным дорогам, среди которых шесть не смогли соответствовать минимальным требованиям по сроку службы и были исключены из дальнейших производственных испытаний. После двух раундов улучшений количество отказов трансмиссий на 1 000 километров снизилось с 6,4 до 2,1, а средний срок службы гусениц увеличился на 38%.Хотя теоретическая производительность новых транспортных средств от этого значительно не улучшилась, они наконец смогли продолжать выполнять боевые задачи после выхода с железной дороги и ремонтного предприятия."
 RUS_fr_armaments_report_armour_generic:0 "Подкомитет по бронированным вооружениям завершил разработку 22 стандартов для шасси, башен и интерфейсов обслуживания, а также провел совокупные испытания на прочность, охватывающие более 6 000 километров на 27 прототипах транспортных средств. Каждое конструкторское бюро по-прежнему может сохранять свои технические традиции, но отныне любое транспортное средство должно доказать, что оно может войти в единую систему производства и поддержки, а не просто показывать впечатляющие результаты на испытательном полигоне."
 RUS_fr_armaments_report_conclusion_armaments:0 "Исходя из этого, Постоянный комитет рекомендует, чтобы следующий этап федеральной программы продолжал придавать приоритет обеспечению оружия, артиллерии, боеприпасов и систем контроля качества, а также распространял стандарты, установленные на этом этапе, на все склады военных округов и оружейные предприятия. Механизированные и бронетанковые подразделения уже сохранили промышленную базу для дальнейшего развития, но до полной замены стрелкового оружия не рекомендуется далее рассеивать наиболее дефицитное прецизионное оборудование. Комитет просит Государственную военную комиссию утвердить вышеуказанные выводы."
 RUS_fr_armaments_report_conclusion_mobility:0 "Исходя из этого, Постоянный комитет рекомендует, чтобы следующий этап федеральной программы продолжал приоритетное внимание расширению парка транспортных средств, топлива, технического обслуживания и систем подготовки подвижных сил, чтобы текущий опыт не оставался ограниченным несколькими демонстрационными единицами. Работа по стандартизации стрелкового оружия и бронетанковой инженерной техники уже завершена, и будущие дополнительные производственные мощности должны в первую очередь использоваться для сокращения времени, необходимого для доставки войск и снабжения на поле боя. Комитет просит Государственную военную комиссию утвердить вышеуказанные выводы."
 RUS_fr_armaments_report_conclusion_armour:0 "Исходя из этого, Постоянный комитет рекомендует, чтобы следующий этап федерального плана продолжал концентрировать сплавы, тяжёлую технику, радиотехническое оборудование и специализированные вспомогательные силы на развитии бронетанковых войск, чтобы единые шасси и унифицированные программы огневой мощи могли поддерживать по-настоящему самостоятельные танковые корпуса. Пехотные и механизированные подразделения уже достигли базовых результатов, достаточных для поддержания функционирования всего военного предприятия, однако наиболее качественные промышленные ресурсы всё же должны служить силам, обеспечивающим решающий прорыв. Комитет просит Государственную военную комиссию утвердить вышеуказанные выводы."
 RUS_fr_armaments_report_conclusion_generic:0 "Постоянный комитет рекомендует официально включить чертежи, испытательные процедуры и стандарты производства, разработанные в этот период, в следующий Федеральный план, при этом Генеральный штаб продолжает контролировать их внедрение в различных военных округах. Комитет просит Государственную военную комиссию рассмотреть и утвердить вышеуказанные выводы."
 RUS_fr_armaments_report_approval_armaments:0 "Одобрить отчет и продолжать обеспечивать развитие вооружения Армии"
