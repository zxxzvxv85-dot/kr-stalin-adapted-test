 RUS_fr_timoshenko_reform_theorist:0 "Теоретик реформы военной системы"
 RUS_fr_timoshenko_reform_theorist_reformed:0 "Теоретик реформы военной системы (улучшение)"
 RUS_fr_timoshenko_reform_theorist_armaments:0 "Теоретик реформы военной системы (с упором на вооружение пехоты)"
 RUS_fr_timoshenko_reform_theorist_reformed_armaments:0 "Теоретик реформы военной системы (Сосредоточение на вооружении пехоты · Улучшение)"
 RUS_fr_timoshenko_reform_cost_discount_tt:0 "При выполнении функций теоретика, разрешение на военную реформу, опыт армии, стоимость: за уровень §G-5%§!"
 RUS_fr_timoshenko_armaments_specialisation_tt:0 "Сосредоточиться на §YОбщий обзор разработки вооружений армии§! Время:\nПолучите дополнительное при повышении уровня генерала §Y1§! Вероятность точечной атаки:§G+50%§!\nПолучите дополнительное при повышении уровня генерала §Y1§! Шанс увеличить защиту:§G+50%§!\nПолучите дополнительное при повышении уровня генерала §Y1§! Вероятность по плану очков:§G+50%§!\nПолучите дополнительное при повышении уровня генерала §Y1§! Вероятность клика по логистике:§G+50%§!"
 RUS_fr_timoshenko_stage_four_upgrade_tt:0 "§YШиемяо · Тимошенко§! Черты теоретика будут усилены, дополнительно приобретая:\nШирина поля боя:§G-10.0%§!"
 RUS_fr_political_commissar_organisation_idea:0 "Организационная система политического комиссара"
 RUS_fr_political_commissar_organisation_idea_desc:0 "Политический комиссар больше не является мотиватором, временно отправляемым на передовую в периоды кризиса, и не наблюдателем, стоящим за командиром. Он вносит политическое образование, заботы солдат и опыт подразделения в единый организационный канал, позволяя Партии, офицерам и рядовым солдатам впервые понимать друг друга в рамках одной системы."
 RUS_fr_scientific_general_staff_idea:0 "Научный генеральный штаб"
 RUS_fr_scientific_general_staff_idea_desc:0 "Карты, статистика, военные игры и исследования военной истории заменяют противоречивые интуиции генералов. Генеральный штаб больше не является просто органом для передачи приказов, а представляет собой центр военной науки, который непрерывно наблюдает за войной, проверяет гипотезы и записывает уроки обратно в правила."
 RUS_fr_deep_battle_concept_idea:0 "Теория глубинной боя"
 RUS_fr_deep_battle_concept_idea_desc:0 "Поле боя больше не воспринимается как линия, которую нужно прорвать напрямую, а как огромную глубину, состоящую из транспортных узлов, резервов, артиллерийских позиций и командных органов. Прорыв — это лишь начало кампании; истинная победа достигается от непрерывных ударов, пока вся система противника не рухнет одновременно."
 RUS_fr_one_man_command_idea:0 "Система ответственности начальника"
 RUS_fr_one_man_command_idea_desc:0 "Дебаты могут происходить до того, как будут отданы приказы; как только приказы даны, они должны быть выполнены. Командирам предоставляется четкая и полная военная ответственность, в то время как политические органы отвечают за надзор за принципами, интерпретацию целей и поддержание связи между военными и революцией. Никто не будет уклоняться от ответственности, неоднозначно перекладывая её на другого."
 RUS_fr_revolutionary_collectivism_idea:0 "Революционный коллективизм"
 RUS_fr_revolutionary_collectivism_idea_desc:0 "Сила народной армии не принадлежит какому-либо одному гениальному командиру или одинокому герою, а исходит от отрядов, взводов, рот и каждого солдатского комитета, которые отвечают друг перед другом. До тех пор, пока коллектив остается сплоченным, потери, усталость и временные неудачи не могут полностью распустить силы."
 RUS_fr_military_vanguardism_idea:0 "Военный авангардизм"
 RUS_fr_military_vanguardism_idea_desc:0 "Революции не могут ждать вечно, пока старая армия примет новые идеи. Испытательные подразделения, отобранные посредством строгого отбора, первыми примут новую организацию, методы связи и мобильного боя, чтобы успешно продемонстрировать путь и превратить неудачи в уроки для всей армии."
 RUS_fr_revolutionary_heroism_idea:0 "Революционный героизм"
 RUS_fr_revolutionary_heroism_idea_desc:0 "Герои, необходимые революции, — это не идолы, которым люди могут поклоняться, а те, кто готов взять на себя ответственность в решающие моменты. Офицеры из рабочей среды, солдаты, которые держат свои позиции, и сотрудники тыла, обеспечивающие свободное движение на дорогах, — все они станут примерами, на которых может учиться вся армия, а не далекими и недостижимыми образцами."
 RUS_fr_tempered_in_steel_idea:0 "Закалённый в сталь"
 RUS_fr_tempered_in_steel_idea_desc:0 "Повторяющиеся учебные столкновения научили Красную армию скрывать свои истинные намерения, менять дислокацию, изменять направление главного удара и начинать контратаки в тот момент, когда противник был уверен, что он уже все видел. Маскировка, разведка и обман перестали быть особыми навыками нескольких штабных офицеров и стали боевыми методами, освоенными совместно от штабов военных округов до передовых подразделений."
 RUS_fr_field_political_agitation_idea:0 "Передовая команда по политической пропаганде"
 RUS_fr_field_political_agitation_idea_desc:0 "Политические комиссары, военные корреспонденты и образцовые рядовые солдаты совершают турне по вновь сформированным подразделениям. Они переводят приказы революционного правительства на язык, который могут понять солдаты, а также возвращают жалобы и недоразумения из казарм к политическим органам."
 RUS_fr_general_staff_wargames_idea:0 "Военная игра Генерального штаба"
 RUS_fr_general_staff_wargames_idea_desc:0 "Карты, шахматные фигуры и толстые железнодорожные расписания покрывали стол для совещаний штаба. Каждое моделирование заставляло офицеров отвечать на один и тот же вопрос: когда враг не действует так, как мы надеемся, как Красная Армия должна продолжать своё наступление?"
 RUS_fr_deep_battle_exercise_idea:0 "Сверло для глубокой сверловки"
 RUS_fr_deep_battle_exercise_idea_desc:0 "Прорыв первого эшелона — это лишь начало кампании. Резервы, разведывательные подразделения и мобильная огневая мощь многократно преодолевают смоделированные разрывы на учебном полигоне, учась превращать локальный крах противника в колебание всей линии фронта."
 RUS_fr_central_military_liaison_idea:0 "Центральная военно-гражданская координационная конференция"
 RUS_fr_central_military_liaison_idea_desc:0 "Представителей Генерального штаба, политических органов и крупных военных округов созвали за один стол. Встречи были не всегда приятными, но каждый спор был дешевле, чем фронт, получающий противоречивые приказы."
 RUS_fr_academy_research_groups_idea:0 "Теоретическая исследовательская группа военной академии"
 RUS_fr_academy_research_groups_idea_desc:0 "Инструкторы Военной академии Грозовая буря собирают записи упражнений, случаи иностранных сражений и опыт гражданской войны в новые учебные материалы. Красной армии нужны не только смелые офицеры, но и люди, которые могут превращать уроки в методы."
 RUS_fr_unified_training_rotation_idea:0 "Единый план ротации"
 RUS_fr_unified_training_rotation_idea_desc:0 "Кадры и ключевые солдаты из различных военных округов рассредоточены и проходят ротационное обучение. Северные войска изучают методы снабжения на степях, западный военный округ набирается опыта в обучении в условиях сильного холода, и все должны придерживаться одного и того же набора оценочных стандартов."
 RUS_fr_military_district_readiness_idea:0 "Проверка боевой готовности военного округа"
 RUS_fr_military_district_readiness_idea_desc:0 "Инспекционная группа не будет заранее уведомлять начальника склада, железнодорожного диспетчера или начальника штаба военного округа. Таблица мобилизации, записи о топливе и карты чрезвычайных ситуаций должны быть доступны сегодня, потому что война не будет ждать, пока мы перепишем документы."
 RUS_fr_voronezh_exercise_review_idea:0 "Обзор упражнений Воронеж"
 RUS_fr_voronezh_exercise_review_idea_desc:0 "Неудачные маневры, опоздавшие поезда и неправильные приказы Воронежских учений фиксировались пункт за пунктом в обзорных материалах. Красная армия была готова признавать эти неловкости на бумаге, потому что следующим местом, где проблемы могли проявиться, могло быть поле боя."
 RUS_fr_emergency_workshop_norms_idea:0 "Стандарты штурма военной мастерской"
 RUS_fr_emergency_workshop_norms_idea_desc:0 "Интенданты, инженеры и бригады профсоюза осматривают станки один за другим и проверяют детали партиями в критически важных цехах. Внезапное введение стандартов не решит промышленные проблемы навсегда, но может помочь текущей партии заказов быстрее и более стабильно достичь передовой."
 RUS_fr_unified_army_reform:0 "Текущая ситуация Рабоче-крестьянской Красной армии: Поток железа на десять тысяч миль"
 RUS_fr_unified_army_reform_desc:0 "Заимствуя восточную пословицу — «Всё готово, но не хватает восточного ветра» — чтобы описать РККА в этот момент, нельзя не признать, что это чрезвычайно точно. С новыми видами оборудования, которые постепенно вводятся в действие, качество Рабоче-Крестьянской Красной Армии неуклонно улучшается. Наши солдаты научились управлять новой техникой, командиры осваивают новые тактические правила, а система снабжения постепенно охватывает более отдалённые фронты. Мы уже готовы к наступлению на крепости старого мира."
 RUS_fr_unified_army_reform_final:0 "Текущее положение Рабоче-Крестьянской Красной Армии: Непобедимая и Легендарная"
 RUS_fr_unified_army_reform_final_desc:0 "Закалённая в боях Рабоче-Крестьянская Красная Армия в конечном итоге победила своего заклятого врага; высокомерная Германская империя рухнула под натиском народа... пусть буржуазия сходит с ума! Пусть ничтожные души плачут! История уже написала свой вердикт! Рабоче-Крестьянская Красная Армия освободит каждый уголок мира!"
 RUS_fr_unify_basic_army_reform_tt:0 "Получить уже приобретённое §YРеформа военной системы§! и §YВоенная система§! Психическое закрепление в §YТекущее состояние Красной армии рабочих и крестьян: железный поток на десять тысяч миль§!; Последующие соответствующие резолюции также будут напрямую включены в этот дух."
 RUS_fr_comrades_abroad_army_reform_bonus_tt:0 "§YТекущее положение Рабоче-Крестьянской Красной Армии§! Добавить:\n$MODIFIER_SEND_VOLUNTEER_SIZE$: §G+5§!\n$MODIFIER_ARMY_EXPERIENCE_FROM_VOLUNTEERS$: §G+50.0%§!"
 RUS_fr_unlock_invincible_legendary_status_tt:0 "§YТекущее состояние Красной армии рабочих и крестьян: железный поток на десять тысяч миль§! Будет обновлено до §YТекущее положение Красной Армии рабочих и крестьян: непобедимая и легендарная§!"
 tech_forest_warfare_terrain_effect:0 "  §Y$forest$§!:\n    $STAT_ADJUSTER_MOVEMENT$[?0.05|=+1%]\n    $STAT_ADJUSTER_ATTACK$[?0.05|=+1%]\n    $STAT_ADJUSTER_DEFENCE$[?0.03|=+1%]"
 tech_marsh_warfare_terrain_effect:0 "  §Y$marsh$§!:\n    $STAT_ADJUSTER_MOVEMENT$[?0.05|=+1%]\n    $STAT_ADJUSTER_ATTACK$[?0.1|=+1%]\n    $STAT_ADJUSTER_DEFENCE$[?0.05|=+1%]"
 RUS_fr_armaments_basic_result:0 "Основополагающие достижения в военном накоплении"
 RUS_fr_armaments_basic_result_desc:0 "Огнестрельное оружие из Тулы, артиллерия из Петрограда и комплектующие на складах по всей стране начали соответствовать единым чертежам, калибрам и стандартам приемки. Федеральные заказы уже не стремились лишь к количеству поставок; впервые солдаты на передовой могли быть уверены, что поставляемое им оружие будет взаимозаменяемым и долговечным в эксплуатации. Однако стандартизированная система, построенная вокруг ведения обычной войны на родине, также временно ослабила способность войск адаптироваться к местным условиям при действиях далеко от федеральных ядерных районов."
 RUS_fr_mobility_basic_result:0 "Основополагающие достижения в мобильном строительстве"
 RUS_fr_mobility_basic_result_desc:0 "Транспортные средства больше не являются редкими машинами, производимыми каждой фабрикой по своим собственным привычкам. Стандартизированные спецификации двигателей, инструкции по техническому обслуживанию и каталоги запчастей соединяют автомобильные заводы, военные склады снабжения и полевые ремонтные станции, создавая первоначальную мобильную инфраструктуру Красной армии."
 RUS_fr_mechanised_platform_mobility_priority:0 "Приоритетное строительство механизированных платформ"
 RUS_fr_mechanised_platform_mobility_priority_desc:0 "Комитет рассматривает механизированные силы как ядро оперативной мобильности, а не просто как средство передвижения. Таким образом, транспортные средства, личный состав и тактика пехоты включаются в один и тот же набор стандартов подготовки и боевых действий."
 RUS_fr_vehicle_manufacturing_integration_idea:0 "Интеграция процесса производства транспортных средств"
 RUS_fr_vehicle_manufacturing_integration_idea_desc:0 "Единые каталоги деталей, стандарты топлива и спецификации сборочных линий сократили потери механизированной техники между заводами и передовыми линиями, делая оснащение войск крупномасштабным оборудованием устойчивой промышленной задачей."
 RUS_fr_vehicle_manufacturing_integration_priority_idea:0 "Интеграция процесса производства транспортных средств"
 RUS_fr_vehicle_manufacturing_integration_priority_idea_desc:0 "Помимо стандартизации каталогов деталей, топливных стандартов и спецификаций сборочной линии, приоритет механизированного строительства также способствовал развитию более зрелой системы подготовки, организации и координированных операций в механизированных силах."
 RUS_fr_air_assault_brigades_idea:0 "Сборник тестов воздушных маневров"
 RUS_fr_air_assault_brigades_idea_desc:0 "Содержание вертолетной авиации, обучение специализированной пехоты и создание новой системы командования обходятся дорого, но они впервые позволили Красной армии обойти препятствия на передовой и напрямую противостоять оперативной глубине противника."
 RUS_fr_air_assault_mobility_priority_idea:0 "План концентрации производства вертолётов"
 RUS_fr_air_assault_mobility_priority_idea_desc:0 "Для того чтобы превратить воздушно-десантные войска из экспериментального формирования в реальную боевую силу, комитет принял чрезвычайно дорогие специализированные самолёты и системы подготовки, сосредоточив лучших специалистов в новых специальных войсках."
 RUS_fr_deep_mobility_priority_idea:0 "Боевая система маневренных операций на высокой скорости и большой глубины"
 RUS_fr_deep_mobility_priority_idea_desc:0 "Непрерывные инвестиции позволяют воздушно-мобильным силам пересекать дороги, реки и окопы, проникая глубоко на территорию врага до того, как противник завершит развертывание. Сопровождающее это огромное промышленное бремя становится той ценой, которую планы федерации должны нести в долгосрочной перспективе."
 RUS_fr_mobility_priority_improved_logistics_bonus:0 "Стандарты усиления механизированной логистики"
 RUS_fr_mobility_priority_improved_logistics_bonus_desc:0 "Приоритетные инвестиции в механизацию строительства еще больше укрепили планирование перевозок, управление топливом и процедуры снабжения на передовой."
 RUS_fr_mobility_priority_logistics_bonus_tt:0 "Если сосредоточен §YПлан механизированного строительства армии§!,§YУлучшенная логистическая компания§! эффект §GДвойной§!:\nИспользование расходных материалов: дополнительно §G-10.0%§!\nИспользование топлива: дополнительное §G-5.0%§!"
 RUS_fr_armour_basic_result:0 "Фундаментальные достижения в бронетанковом строительстве"
 RUS_fr_armour_basic_result_desc:0 "Конструкторское бюро больше не рассматривало каждый тип танка как работу, принадлежащую исключительно ему. Шасси, броня, башни и трансмиссионные системы были включены в общий инженерный язык, что позволило заводам в Урале и Петрограде обмениваться результатами испытаний и заложить основу для будущих крупномасштабных бронетанковых сил."
 RUS_fr_armaments_priority_result:0 "Приоритетное строительство военного оружия"
 RUS_fr_armaments_priority_result_desc:0 "Комитет зарезервировал лучшую сталь, измерительные инструменты и квалифицированных работников для заводов по производству пехотного оружия и артиллерии. Красная армия по-прежнему будет полагаться на солдат, чтобы наступать пешком, но эти бойцы больше не будут платить цену за грубые болтовые механизмы, трещины в затворах или несменяемые детали."
 RUS_fr_mobility_mechanised_priority_result:0 "Приоритетное строительство тяжелой механизации"
 RUS_fr_mobility_mechanised_priority_result_desc:0 "Вместо того чтобы гнаться за несколькими ослепительными новыми машинами, комитет решил сначала построить конвои, ремонтные батальоны и механизированные транспортные колонны, которые могли бы поддерживать всю армию. Скорость больше не будет принадлежать разведывательным отрядам, а станет частью организации всей армии."
 RUS_fr_mobility_air_priority_result:0 "Приоритетное строительство воздушной мобильности"
 RUS_fr_mobility_air_priority_result_desc:0 "Автожиры по-прежнему являются новинкой на рабочих чертежах инженеров и на испытательных полигонах, но они демонстрируют возможность преодолевать дороги, реки и траншеи. Лучшая лёгкая пехота будет назначена в экспериментальные подразделения для изучения пути воздушной кавалерии, которая ещё не существует ни в одном военном руководстве."
 RUS_fr_armour_priority_result:0 "Приоритетное строительство бронированного оружия"
 RUS_fr_armour_priority_result_desc:0 "Танки не должны быть просто движущимися щитами, прикрывающими наступление пехоты. Сосредоточенные усилия по проектированию реорганизуют производство вокруг независимых бронетанковых корпусов, так что огневая мощь, защита, связь и способность к дальним маршам будут служить оперативному прорыву."
 RUS_fr_armaments_specialisation:0 "Специализированная разработка военной техники"
 RUS_fr_armaments_specialisation_desc:0 "Федеральный план заключается в том, чтобы перейти от временного расширения производства оружия к долгосрочному специализированному разделению труда. Устанавливается стабильная обратная связь между конструкторскими бюро, испытательными полигонами и массовыми производственными заводами, позволяя каждому циклу заказов учитывать уроки предыдущего цикла войны и производства."
 RUS_fr_mobility_specialisation:0 "Гибкая специализированная разработка"
 RUS_fr_mobility_specialisation_desc:0 "Дороги, транспортные средства, склады и ремонтные возможности рассматриваются как часть единой кампании, а не как отдельные логистические элементы. Подвижность Красной армии будет поддерживаться организационной сетью, способной действовать многократно, а не полагающейся на однократное сосредоточение материальных средств."
 RUS_fr_armour_specialisation:0 "Развитие броневой специализации"
 RUS_fr_armour_specialisation_desc:0 "Независимая бронетанковая инженерная система уже создана. Достижения в металлургии, артиллерии, двигателях и радио постоянно интегрируются в единое шасси, позволяя бронетанковым силам формировать свою технику в соответствии с собственными оперативными задачами, а не пассивно принимать машины, предоставленные заводами."
 RUS_fr_military_reform.10.t:0 "Первая конференция по вооружению"
 RUS_fr_military_reform.10.d:0 "Федеральная комиссия по вооружениям и оборонной промышленности уже получила три одинаково крупных предложения по строительству. Комиссия способна продвигать все направления, позволяя каждому достигать базовых результатов; однако изначально установленное приоритетное направление получит дополнительные ресурсы, персонал и долгосрочную поддержку политики."
 RUS_fr_military_reform.10.a:0 "Отдавайте приоритет созданию единой системы военного производства"
 RUS_fr_military_reform.10.b:0 "Отдавайте приоритет решению вопросов мобильности и логистики"
 RUS_fr_military_reform.10.c:0 "Ставьте в приоритет разработку независимой бронетанковой системы вооружения"
 RUS_fr_military_reform.20.t:0 "Дебаты о разработке пехотного оружия"
 RUS_fr_military_reform.20.d:0 "Комитет не может одновременно распределять ограниченные специальные материалы между оптимизацией индивидуальной нагрузки солдат и расширением дивизионной артиллерии. Предварительные проектные работы завершены, и теперь необходимо решить, какой план завершить первым."
 RUS_fr_military_reform.20.a:0 "Снизьте нагрузку и улучшите устойчивую боеспособность пехоты"
 RUS_fr_military_reform.20.b:0 "Укрепите артиллерийскую поддержку дивизии, чтобы защищать пехоту огневой мощью"
 RUS_fr_military_reform.30.t:0 "Технический маршрут механизированного строительства"
 RUS_fr_military_reform.30.d:0 "Традиционное производство транспортных средств, специализированная механизированная логистика и воздушное наступление с вертолетов, все еще находящееся на экспериментальной стадии, будут конкурировать за один и тот же пул инженеров, двигателей и учебных ресурсов. Комитет может выбрать только один из этих путей."
 RUS_fr_military_reform.30.a:0 "Интегрировать производство транспортных средств и создать корпус для быстрой кампании"
 RUS_fr_military_reform.30.b:0 "Отдавайте приоритет специализированной и механизированной логистике"
 RUS_fr_military_reform.30.c:0 "Пропуская обычную фазу, попытайтесь сформировать воздушно-ударное подразделение"
 RUS_fr_military_reform.40.t:0 "Инженерная направленность бронетанковых вооружений"
 RUS_fr_military_reform.40.d:0 "Комитет должен определить направление специальных испытаний между самостоятельной огневой мощью и прочностью конструкции автомобиля. Остальные общие стандарты шасси, артиллерии и компонентов будут продолжать совершенствоваться как обычно."
 RUS_fr_military_reform.40.a:0 "Отдайте приоритет созданию автономной системы пожаротушения"
 RUS_fr_military_reform.40.b:0 "Приоритезируйте завершение испытания прочности конструкции кузова автомобиля"
 RUS_fr_military_reform.50.t:0 "Отчёт об оценке текущих трудностей строительства Красной Армии"
 RUS_fr_military_reform.50.d:0 "Кому: Отдел военных дел Центрального исполнительного комитета\n\n1. Относительно качества военного персонала\n\nТекущий состав Красной Армии в основном состоит из рабочих и крестьян. С идеологической точки зрения чистоту этой силы можно гарантировать — они происходят из рабочего класса, не имеют заинтересованности в старом режиме и питают простое доверие к новому правительству. Но на оперативном уровне мы не можем избежать фундаментальной трудности: уровень грамотности не равен когнитивным способностям.\n\nПрограмма обучения грамотности предоставляла солдатам самые базовые навыки чтения и письма, но этого было далеко недостаточно. Солдат, который умеет распознавать письменные приказы, не обязательно понимает такие понятия, как «оценка положения противника», «использование местности» и «координация огня». Суждения, необходимые на поле боя, исходят из понимания, а не просто из грамотности. В настоящее время среди младших солдат Красной Армии доля тех, кто может самостоятельно оценивать ситуацию на тактическом уровне, всё ещё относительно невелика.Это заставляет младших командиров выполнять большое количество работы, требующей принятия решений, которую могли бы сделать сами солдаты, делая цепочку командования хрупкой и неэффективной.\n\nКроме того, значительная часть солдат в войсках по-прежнему не имеет базового понимания принципов работы современных вооружений. Они могут следовать инструкции, чтобы выполнить действия по зарядке и стрельбе, но если возникает неисправность или аномальная ситуация, они часто не могут самостоятельно определить причину проблемы. В условиях реального боя такое состояние «знают только как использовать, но не умеют оценивать» может стать смертельным недостатком.\n\n2. Что касается нехватки командиров\n\nМассовая отставка офицеров Белой армии рассматривалась как необходимый процесс «очищения старых сил» на ранних этапах революции. Но пробелы, оставленные этим процессом, до сих пор не были эффективно заполнены.\n\nРазрыв в средних и младших звеньях командиров в Красной армии по-прежнему значителен. Среди существующей группы командиров значительное число были повышены непосредственно из рядов солдат — они смелые, преданные и уважаемые, но не имеют систематического военного образования. Некоторые способны самостоятельно вырабатывать эффективные методы командования в ходе реальных боевых действий, но большинству требуется больше времени для накопления опыта, чем позволяют текущие условия. Между тем, поскольку пробел в младших командирах еще не заполнен, страдают также и более высокие командные должности.\n\nСуть проблемы заключается в нехватке времени. Квалифицированному командиру взвода требуется как минимум год систематической подготовки и практического опыта; командиру роты нужно еще больше времени; а офицеру, способному самостоятельно командовать подразделением батальонного уровня, требуется цикл развития, измеряемый годами. Мы ускоряем темпы подготовки, но разрыв между скоростью обучения и фактическим спросом остается значительным и в краткосрочной перспективе его трудно полностью преодолеть.\n\nIII. О практическом расстоянии теории «глубоких операций»\n\nВоенная теория маршала Тухачевского является полной и научной, о чем не вызывает сомнений. Однако полнота теории не может заменить процесс подготовки на практике.\n\nБронированные корпуса, механизированная пехота, скоординированные силы воздушного флота и соответствующая система тылового обеспечения, необходимые для реализации теории «Глубоких операций», находятся пока на начальных стадиях. Наша промышленная база еще не способна поддерживать производство техники в таких масштабах; наша транспортная сеть пока не может обеспечить тыловое обеспечение на такой глубине; наши методы связи еще не могут поддерживать столь сложную координацию на поле боя — все материальные условия, необходимые для поддержки реализации этой теории, еще далеки от достижения.\n\nЭто не отрицание теории маршала Тухачевского, а оценка реальных условий. Если мы будем измерять текущее состояние Красной Армии по стандарту «теоретической полноты», вывод неизбежно будет «далеко до достаточного». И если мы замедлим темпы прогресса, потому что это «далеко до достаточного», то мы никогда не достигнем высоты, показанной теорией.\n\nКлюч заключается в наличии четкого расписания. Нам нужно знать, с учетом текущих производственных мощностей и образовательных ресурсов, как далеко мы можем продвинуться каждый год; нам нужно знать, какие шаги можно ускорить, а какие шаги могут продвигаться только упорядоченно; нам также нужно знать, что если мы должны достичь боеспособности к определенному времени, нам придется идти на компромиссы в некоторых областях.\n\nЗаключение\n\nТри проблемы, с которыми в настоящее время сталкивается Красная армия — качество войск, нехватка командиров и внедрение теории — это не три отдельных вопроса, а три аспекта одной и той же проблемы: времени недостаточно.\n\nНам нужно больше времени, чтобы развить понимание солдат, больше времени, чтобы тренировать командиров, и больше времени, чтобы создать промышленную базу и логистические системы, необходимые для осуществления «Глубоких операций». Но война никого не ждет. Поэтому мы должны сделать трудный выбор: сосредоточить ограниченные ресурсы на наиболее критических аспектах в ограниченное время.\n\nНациональный отдел военного штаба\nСемён Константинович Тимошенко"
 RUS_fr_military_reform.50.a:0 "Время поджимает, а задачи тяжёлые."
 RUS_fr_military_reform.51.t:0 "Ведущие будущие войны"
 RUS_fr_military_reform.51.d:0 "Под впечатлением от идей военной революции маршал Михаил Николаевич Тухачевский завершил свою работу «Первенство будущей войны». Основываясь на практическом опыте гражданской войны, в сочетании с наблюдениями, полученными во время учебы в Академии Генерального штаба Франции, и долгим наблюдением за ведущими европейскими военными державами, книга систематически отстаивает решающую роль бронетанковых сил, нового военного развития, в будущих войнах.\n\nТухачевский писал в своей книге: «Будущие войны уже не будут застойными оборонами с траншеями и колючей проволокой, а станут состязанием стали и скорости». Он анализировал развитие европейских стран в создании броневых сил и ясно указывал на то, что Россия отстала от ведущих западных держав в этой области. Представленные в книге взгляды были весьма перспективными: будущее поле боя будет принадлежать крупномасштабным механизированным корпусам, а способность пехоты к прорыву должна опираться на быструю проникающую деятельность бронетанковых соединений, при этом координация между военно-воздушными силами и броневыми войсками станет ключом к определению исхода кампаний.Он также специально подчеркнул стандартизацию и обобщение военной промышленности — предложение, напрямую связанное с трудностями снабжения, которые он наблюдал во время высокоинтенсивной изнурительной войны гражданской войны.\n\nКак только книга была опубликована, она вызвала сильную реакцию в военных и политических кругах. Преподаватели в военных академиях рекомендовали её как обязательное чтение для офицеров, а командиры на передовой листали её страница за страницей, пытаясь найти ответы на вопрос, как должна вестись следующая война. Были также и несогласные голоса, указывавшие: учитывая текущий уровень внутренней экономики, реально ли массово расширять бронетанковые войска?В ответ Тухачевский не отрицал ограничения экономической основы, но скорее указал на то, что технологические разрывы не закроются сами по себе, просто ожидая — «Если мы не можем построить это сегодня, мы уж точно не сможем построить это завтра — потому что другие движутся быстрее нас».\n\nВоспользовавшись этой возможностью, Тухачевский объединился с группой молодых отечественных офицеров и официально представил предложение в Центральный исполнительный комитет о создании «Государственной военной комиссии» (сокращённо «ГВК»). В предложении указывалось, что новый отдел будет подчиняться напрямую Центральному исполнительному комитету и отвечать за координацию военных научных исследований и разработок страны, военно-промышленного производства и стратегического планирования, обеспечивая обмен информацией и материальную координацию между военными округами.Функции СМК будут включать: разработку единых стандартов военно-промышленного производства и координацию планов производства различных военно-промышленных предприятий; организацию инициирования и рассмотрения военных исследовательских проектов для обеспечения того, чтобы разработка оборудования соответствовала стратегическим потребностям; создание независимой системы испытаний и оценки для систематической оценки и улучшения технологического отрыва существующего оборудования.\n\nВ предложении делается вывод: «Страна без сознания войны может реагировать только пассивно на своей территории». Значение Национальной военной комиссии заключается в том, что она освободит военное развитие России от инерции «каждого военного округа, действующего самостоятельно», превратив его в целостное единство с направлением, ритмом и прогнозируемостью. Это не еще один слой административной бюрократии, а механизм, ориентированный на «то, как выиграть следующую войну».\n\nВ настоящее время это предложение вступило в стадию предварительного обсуждения. Сторонники считают, что этот шаг значительно повысит эффективность национальной обороны, в то время как противники ставят под сомнение его полномочия и его связь с существующими военными учреждениями. Однако, независимо от исхода, «война будущего» уже превратилась из названия статьи в политический вопрос, который необходимо воспринимать всерьез."
 RUS_fr_military_reform.51.a:0 "Быстрее! Сильнее!"
 RUS_fr_military_reform.52.t:0 "Введение в «Гром»"
 RUS_fr_military_reform.52.d:0 "Михаил Фрунзе\n\n——Организационный механизм и вычислительная основа современных наступательных кампаний\n\nБуржуазные военные теоретики часто определяют войну как «продолжение политики», что не неверно, но они сознательно избегают более фундаментального вопроса: чьё продолжение является самой политикой? Ответ может быть только один — это продолжение непримиримой классовой борьбы между пролетариатом и эксплуататорским классом.\n\nСледовательно, эта книга не изучает «общую войну». В мире нет такой вещи, как общая война, так же как нет такой вещи, как общий человек. Все наступательные кампании, независимо от того, в каком направлении указывают стрелки на карте, по сути являются материальным проявлением классовой воли в пространстве. Когда мы говорим о «громе», мы говорим не об аудиальном эффекте, а о том: как использовать сталь и взрывчатку с наивысшей экономической эффективностью, чтобы зачитать исторический приговор старому миру.\n\nВ настоящее время популярные военные учебники демонстрируют две вредные тенденции. Одна из них — «технологический фетишизм», который разбивает войну на баллистические кривые и нормы расхода топлива, как будто победа зависит от точности логарифмической линейки; другая — «спонтанный героизм», который окормляет опыт штурмов в период гражданской войны и считает организацию ненужной. Первая забывает, что оружие является продолжением человеческих рук, а человек — клетка класса; вторая отказывается признать, что революционный пыл, если его нельзя преобразовать в точные расчеты выстрелов в минуту и расхода топлива на километр, является лишь порохом без запала.\n\nЭта книга пытается проложить третий путь между этими двумя тенденциями — научным взглядом пролетариата на борьбу. Его основной постулат можно изложить следующим образом:\n\n\"Каждый артиллерийский снаряд должен спрашивать себя: Чью землю ты разрываешь?\"\n\nИсходя из этого, книга не предлагает «секрет гарантированного успеха», а вместо этого представляет собой систему одновременно решаемых уравнений чувствительности к классу и материальных ограничений. Мы требуем от командиров выполнения трех умственных процедур перед формулированием планов:\n\n1. Позиционирование класса: Ваше направление атаки, перекрыло ли оно цепочку поставок класса, на которую полагается противник? Например, захват пекарни стратегически более значим, чем захват бункера.\n\n2. Политическая трансляция: После того как ваши приказы будут отданы, могут ли солдаты Красной армии самого низшего звена перевести их в конкретные образы «защиты Советов» своими собственными словами?\n\n3. Историческая рефлексивность: Если эта кампания провалится, можете ли вы ясно указать в своем отчете — это происходит из-за неправильного расчета ресурсов или из-за неудачи в политической мобилизации?\n\nНекоторые люди могут критиковать это заявление за «ставку политики выше армии». Мой ответ таков: Красная армия — это Красная армия именно потому, что она никогда не притворяется политически нейтральной. У генералов Белой армии тоже была политика; просто им было стыдно признать, что их политика принадлежала помещикам и капиталистам.\n\nМы можем процитировать отрывок из товарища Ленина: «В самой демократичной буржуазной республике 'нейтралитет' — это не что иное, как одна из форм порабощения трудящихся.»\n\nНаконец, я должен откровенно зафиксировать один факт: во время наступления на Врангеля в 1920 году одна пехотная дивизия движением опередила соседнюю дивизию на 27 минут, которой не объяснили причин продвижения, потому что политический комиссар заранее, за два дня, объяснил солдатам \", почему они должны захватить ту станцию.\" Эти 27 минут представляют материальный коэффициент преобразования идеологии. То, что в этой книге называется 'громом', в конечном итоге означает использование этого коэффициента преобразования для покрытия всего воздушного пространства, которое буржуазная военная наука называет 'чисто техническим'.\n\nЕсли после прочтения этой книги единственное, что вы запомнили, это тактическая формула, это значит, что вы поняли лишь скелет. Если же, закрыв книгу, в ваших ушах звучит голос миллионов эксплуатируемых, требующих возвращения земли и фабрик — вот это и есть истинная частота «грома».\n\nЭта книга посвящена тем красным командирам, которые умеют и чистить свои ружья, и читать «Капитал».\nПотому что будущие войны выигрывают не генералы, а солдаты, которые понимают диалектику."
 RUS_fr_military_reform.52.a:0 "Громовой удар на революционном поле битвы!"
 RUS_fr_military_reform.53.t:0 "Установить марксистский взгляд на героев"
 RUS_fr_military_reform.53.d:0 "——Бюллетень Главного политического управления Рабоче-крестьянской Красной армии\n(№ 47)\n\nТоварищи:\n\nКульт героев существовал с древних времён. Эпопеи эпохи рабства восхваляли воинов, способных поднимать тяжести, исторические записи феодальных династий возводили памятники императорам, генералам и министрам, а буржуазия возвышала героев как «гениев» и «суперменов» над всеми людьми. У этих «героев» есть общая черта: они стоят выше народа, а их блеск достигается за счёт незаметности народа.\n\nМарксизм не одобряет таких героев.\n\nЭто не означает, что марксизм отрицает существование героев. Напротив, мы больше всех осознаём важность тех, кто выступает в критические поворотные моменты истории и решающие моменты революции. Но основные вопросы, поставленные марксизмом, таковы: Откуда берутся герои? За кого борются герои?\n\nНаш ответ таков: Герои приходят от народа, и герои сражаются за народ.\n\nКогда обычный петроградский рабочий берёт в руки винтовку и идёт к баррикадам, когда неграмотный крестьянин отдаёт последнюю сумку зерна проходящим партизанам, когда молодая студентка покидает аудиторию, чтобы отправиться на охваченную войной передовую — именно в эти моменты рождаются герои. Они не рождаются героями; история выбрала их, пробуждение их класса призвало их, и страдания и надежды миллионов трудящихся людей толкнули их на передний план их эпохи.Причина, по которой они становятся героями, заключается не в том, что они обладают необычными способностями, превосходящими способности обычных людей, а в том, что они понимают связь между собой и людьми глубже всех остальных и более сознательно берут на себя историческую миссию освобождения класса.\n\nЭто марксистский взгляд на героев. Он снимает с героев таинственную, врожденную ауру и восстанавливает их как продукты истории, детей народа и воинов класса.\n\nПрименяя такой взгляд на героизм к революционной военной причине, мы сможем правильно понять, каким героизмом должны обладать революционные солдаты.\n\nВо-первых, революционный воинский героизм — это не индивидуальная храбрость, а классовая сознательность. Революционный солдат смело идет под град пуль и снарядов не потому, что он пренебрегает жизнью, а потому что ясно понимает, за что он борется. Он знает, что по ту сторону каждой окопа находятся не только враги, но и миллионы страдающих рабочих и крестьян, ожидающих освобождения. Это сознание более стойкое и мощное, чем любые личные страсти или порывы.\n\nВо-вторых, революционный воинский героизм — это не мгновенный порыв, а ежедневное воспитание. Истинные герои сияют не только на поле боя, но и потеют на учебном плацу, бодро следят за своей вахтой и выполняют свои обязанности на все сто в любой обычной должности.Те солдаты, которые целыми часами при минус тридцати градусах держат оружие, не двигая ни на дюйм, те технические солдаты, которые неоднократно шлифуют детали на токарном станке, пока их руки не покрываются мозолями, те связисты, которые поздно ночью в дежурной комнате переписывают телеграммы слово в слово — о них, возможно, никогда не напишут в стихах и не превратят в песни, но они одинаково проявляют революционный военный героизм.\n\nТретье, революционный военный героизм — это не одиночный акт выше коллектива, а сознательное действие по интеграции в коллектив и служению ему. Подлинно революционная героическая армия не держится на нескольких одиноких героях. Её сила исходит от бесчисленных простых солдат, сознательно соблюдающих дисциплину, искренне заботящихся о товарищах и решительно выполняющих приказы старших. Здесь герой — это не тот, кто стоит во главе рядов и на кого все восхищаются; герой — это сама сила коллектива.\n\nТаким образом, когда политические органы на всех уровнях проводят воспитание героизма, они должны чётко отличаться от героических взглядов всех старых армий. Не следует поощрять показывать себя, не следует заниматься слепым поклонением личности и не следует приписывать достижения немногим, забывая о подавляющем большинстве обычных солдат. Следует умело выявлять вспышки героизма в повседневной работенизовых подразделений, видеть рост классового сознания в каждой капле пота и направлять всех офицеров и солдат на осознание того, что посвящение себя делу народного освобождения является, само по себе, высшей формой героизма;Каждый революционный солдат, верно исполняющий свои обязанности, пишет героическую эпопею, принадлежащую этой великой эпохе.\n\nТоварищи, все офицеры и солдаты, нашей эпохе не нужны герои, которые преклоняют колени и смотрят вверх; нужны миллионы революционных бойцов, которые стоят, сражаются и сознательно выполняют свою историческую миссию на своих постах. Когда каждый обычный солдат осознает, что он — хозяева истории и создатели победы, наша армия будет по-настоящему непобедима.\n\nГлавное политическое управление Рабоче-Крестьянской Красной Армии"
 RUS_fr_military_reform.53.a:0 "Обстоятельства формируют героев."
