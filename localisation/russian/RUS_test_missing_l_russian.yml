 RUS_fr_recruitable_population_factor_bonus_tt:0 "Коэффициент трудоспособного населения:§G+10.00%§!"
 RUS_fr_fragmented_officer_training:0 "Сломанная система подготовки офицеров"
 RUS_fr_fragmented_officer_training_desc:0 "Различные военные округа, старые военные академии и ускоренные курсы военного времени следовали каждому своим собственным стандартам, и наступательное командование особенно испытывало нехватку систематической подготовки."
 RUS_fr_equipment_standardisation_correction:0 "Стандартизация пехотного снаряжения"
 RUS_fr_equipment_standardisation_correction_desc:0 "Стандартизация калибров, деталей, допусков и правил приемки устраняет избыточные потери в производстве пехотного снаряжения и вспомогательных материалов."
 RUS_fr_armoured_production_correction:0 "Стандартизация производства бронетехники"
 RUS_fr_armoured_production_correction_desc:0 "Шасси, силовые установки и компоненты трансмиссии объединены в единую серию, и бронетехника больше не собирается из несовместимых заводских решений."
 RUS_fr_field_regulations_correction:0 "Полевые Уставы Фрунзе"
 RUS_fr_field_regulations_correction_desc:0 "Регламенты организуют боевой опыт в язык, понятный всей армии, что позволяет координацию пехоты и военную теорию, наконец, постоянно накапливать в реальных боевых условиях."
 RUS_fr_climate_training_correction:0 "Правила тренировок во всех погодных условиях"
 RUS_fr_climate_training_correction_desc:0 "Зимовые учения по дислокации, ротации в жарких регионах и единая система защиты здоровья сделали так, что войска больше не рассматривают климат как непредсказуемое бедствие."
 RUS_fr_core_operations_correction:0 "Местная совместная система театров"
 RUS_fr_core_operations_correction_desc:0 "Военный округ, Генеральный штаб и местные мобилизационные органы используют один и тот же комплект планов на случай чрезвычайных ситуаций, что позволяет Красной Армии наконец организовать согласованную оборону и контратаки на родной территории проведения операций."
 RUS_fr_red_academy_correction:0 "Военная академия Гроза"
 RUS_fr_red_academy_correction_desc:0 "Изгнанные возвращающиеся генералы и выдающиеся кадры революционной войны были включены в единую систему подготовки старших офицеров, что позволило на самом деле передать их опыт."
 RUS_fr_armoured_coordination_correction:0 "Процедуры координации бронетанковых войск"
 RUS_fr_armoured_coordination_correction_desc:0 "Бронетанковые подразделения больше не являются разрозненными мобильными огневыми точками, а начали действовать согласно единым принципам прорыва, связи и поддержки."
 RUS_fr_special_forces_correction:0 "Стандарты подготовки охранников и спецназа"
 RUS_fr_special_forces_correction_desc:0 "Демонстрационный блок предоставил расширенное высокоинтенсивное обучение, отбор и тактические обзоры всем военным спецподразделениям, что позволило им восстановить способность выполнять критические миссии."
 RUS_fr_mobilisation_base_correction:0 "Национальная система регистрации мобилизации"
 RUS_fr_mobilisation_base_correction_desc:0 "Местные регистры, медицинские осмотры и дополнительные планы были объединены, и бумажное население наконец могло быть превращено в пригодный квалифицированный персонал."
 RUS_fr_command_merit_system_idea:0 "Революционная система конкурсов военных заслуг"
 RUS_fr_command_merit_system_idea_desc:0 "Публичные отзывы и оценки военных заслуг дают действительно настроенным на оскорбления командирам возможности для продвижения по службе, а также вынуждают консервативные военные академии пересматривать свои стандарты."
 RUS_fr_military_democracy_trial_idea:0 "Пробное внедрение военной демократии"
 RUS_fr_military_democracy_trial_idea_desc:0 "Участие на местах расширило политические возможности мобилизации Красной армии в отдалённых районах, но строго централизованное командование, необходимое для бронетанковых войск, было временно затронуто."
 RUS_fr_political_work_system_idea:0 "Система военно-политической работы"
 RUS_fr_political_work_system_idea_desc:0 "Партийная организация вошла в повседневную жизнь компании и стабилизировала моральный дух войск, но по-прежнему необходимо согласование между политическими процедурами и военными приказами."
 RUS_fr_soldiers_committees_system_idea:0 "Система солдатских комитетов"
 RUS_fr_soldiers_committees_system_idea_desc:0 "Впервые у солдат появились официальные каналы для подачи жалоб по поводу условий проживания, медицинского обслуживания и снабжения, что позволило войскам лучше переносить длительные боевые действия."
 RUS_fr_discipline_review_system_idea:0 "Система военной дисциплины и политического контроля"
 RUS_fr_discipline_review_system_idea_desc:0 "Тщательный контроль защищал опыт и ключевой персонал войск, но он также заставил командиров пехоты на передовой на некоторое время стать более осторожными."
 RUS_fr_standardised_army_structure_idea:0 "Стандартизированная организация армии"
 RUS_fr_standardised_army_structure_idea_desc:0 "Единые циклы сборов, пополнения и обучения позволяют войскам из разных военных округов действительно обмениваться личным составом, техникой и задачами."
 RUS_fr_investigate_white_networks_operation:0 "Исследовать сеть связей Белой армии внутри военных кругов"
 RUS_fr_investigate_white_networks_operation_desc:0 "инвестиция §Y[?RUS_fr_xp_cost_40|1]§! Сосредоточьтесь на военном опыте, в течение 30 дней исследуйте сеть отношений старых военных офицеров и испытайте систему ограниченного военного демократического контроля."
 RUS_fr_review_officer_service_records:0 "Клятва и резюме проверяющего офицера"
 RUS_fr_review_officer_service_records_desc:0 "инвестиция §Y[?RUS_fr_xp_cost_45|1]§! Накопите армейский опыт и в течение 30 дней создайте единый учет офицеров, систему политической работы и службу обзора."
 RUS_fr_organise_basic_commissar_network:0 "Создать сеть народного политического комиссара и проверки военной дисциплины"
 RUS_fr_organise_basic_commissar_network_desc:0 "инвестиция §Y[?RUS_fr_xp_cost_40|1]§! Приобретайте армейский опыт и в течение 30 дней внедрите политкомиссара, военную дисциплину и политические проверки в подразделениях базового уровня."
 RUS_fr_institutionalise_soldiers_committees:0 "Институционализированный комитет солдат"
 RUS_fr_institutionalise_soldiers_committees_desc:0 "инвестиция §Y[?RUS_fr_xp_cost_45|1]§! Накопите армейский опыт и включите комитет солдат в официальную военно-политическую систему в течение 30 дней."
 RUS_fr_reopen_thunderstorm_military_academy:0 "Переоткрыть Военную академию Грозы"
 RUS_fr_reopen_thunderstorm_military_academy_desc:0 "инвестиция §Y[?RUS_fr_xp_cost_60|1]§! Сосредоточьтесь на армейском опыте, восстановите продвинутое офицерское образование за 120 дней и верните изгнанных или пропавших командиров Красной Армии, таких как Будённый."
 RUS_fr_issue_frunze_field_regulations:0 "Издание Фрунзенских полевых уставов"
 RUS_fr_issue_frunze_field_regulations_desc:0 "инвестиция §Y[?RUS_fr_xp_cost_60|1]§! Сосредоточьтесь на армейском опыте и используйте 120 дней для стандартизации полевых правил, координации пехоты и методов исследования доктрин."
 RUS_fr_implement_unified_training_mobilisation:0 "Внедрить единую систему подготовки и мобилизации"
 RUS_fr_implement_unified_training_mobilisation_desc:0 "инвестиция §Y[?RUS_fr_xp_cost_50|1]§! Накопите армейский опыт, используя 120 дней единых тренировок, мобилизации и всепогодных гарнизонных процедур."
 RUS_fr_reorganise_general_staff_district_network:0 "Реорганизованное Главное управление Генерального штаба — Сеть военного округа"
 RUS_fr_reorganise_general_staff_district_network_desc:0 "инвестиция §Y[?RUS_fr_xp_cost_55|1]§! Сосредоточьтесь на опыте армии и используйте 120 дней, чтобы унифицировать план местного театра и командные отношения военного округа."
 RUS_fr_conduct_all_russian_red_army_exercise:0 "Воронежское грандиозное учение"
 RUS_fr_conduct_all_russian_red_army_exercise_desc:0 "инвестиция §Y[?RUS_fr_xp_cost_50|1]§! Проверить установленные командные, мобилизационные и поддерживающие системы с 30-дневным опытом службы в армии."
 RUS_fr_test_experimental_general_staff_formations:0 "Экспериментальная организация Главного штаба"
 RUS_fr_test_experimental_general_staff_formations_desc:0 "инвестиция §Y[?RUS_fr_xp_cost_45|1]§! Примените армейский опыт, используйте 90 дней для тестирования новой организации и организации ее доктринальных достижений."
 RUS_fr_conduct_national_mobilisation_supply_test:0 "Реализовать всенародную мобилизацию для обеспечения проверки"
 RUS_fr_conduct_national_mobilisation_supply_test_desc:0 "инвестиция §Y[?RUS_fr_xp_cost_45|1]§! Сосредоточьтесь на опыте армии и используйте 90 дней для проверки регистрации персонала, пополнения и национальных возможностей поддержки."
 RUS_fr_launch_army_mechanisation_programme:0 "Запустить План внедрения механизации армии"
 RUS_fr_launch_army_mechanisation_programme_desc:0 "инвестиция §Y[?RUS_fr_xp_cost_60|1]§! Накопите военный опыт, и за 120 дней стандартизируйте механизированные силы и производство бронетехники."
 RUS_fr_form_guards_model_units:0 "Создать образцовое подразделение для охраны"
 RUS_fr_form_guards_model_units_desc:0 "инвестиция §Y[?RUS_fr_xp_cost_45|1]§! Накопите опыт армии и создайте демонстрационный подразделение в течение 90 дней, которое сможет продвигать этот опыт в специальные войска."
 RUS_fr_institute_revolutionary_merit_competition:0 "Продвигать революционные соревнования по военным заслугам"
 RUS_fr_institute_revolutionary_merit_competition_desc:0 "инвестиция §Y[?RUS_fr_xp_cost_50|1]§! Сосредоточьтесь на армейском опыте и используйте 90 дней, чтобы реформировать стандарты продвижения для оценки офицеров и талантов наступательного командования."
 RUS_fr_requires_experimental_formations_decision_tt:0 "Резолюция выполнена:§YИнспекция Экспериментального учреждения Генерального штаба§!"
 RUS_fr_requires_mobilisation_test_decision_tt:0 "Резолюция выполнена:§YПровести проверку поддержки национальной мобилизации§!"
 RUS_fr_requires_mechanisation_decision_tt:0 "Резолюция выполнена:§YЗапустить План внедрения механизации армии§!"
 RUS_fr_requires_guards_units_decision_tt:0 "Резолюция выполнена:§YСоздать демонстрационное подразделение охраны§!"
 RUS_fr_requires_merit_competition_decision_tt:0 "Резолюция выполнена:§YПроведите революционный конкурс военных заслуг§!"
 RUS_fr_ergonomic_infantry_equipment_idea:0 "Эргономические стандарты боевого снаряжения"
 RUS_fr_ergonomic_infantry_equipment_idea_desc:0 "Единые стандарты ношения, удержания и прицеливания делают пехотное снаряжение более подходящим для длительных маршей и продолжительного боя, поэтому солдатам больше не приходится использовать физическую силу, чтобы компенсировать недостатки конструкции."
 RUS_fr_ergonomic_infantry_equipment_priority_idea:0 "Эргономические стандарты боевого снаряжения"
 RUS_fr_ergonomic_infantry_equipment_priority_idea_desc:0 "После того как приоритетные инвестиции направлены на пехотное оружие, эргономические стандарты больше не сосредоточены исключительно на снижении нагрузки; вместо этого, посредством комплексных инноваций в материалах, конструкции и методах ношения, индивидуальное снаряжение солдата может адаптироваться к более высокой скоростной тактической мобильности."
 RUS_fr_support_fire_joint_trials_idea:0 "Результаты совместных испытаний поддерживающей огневой мощи"
 RUS_fr_support_fire_joint_trials_idea_desc:0 "Артиллерийский отдел вместе с механизированными подразделениями установил новые стандарты испытаний. Традиционная артиллерия требует более строгих конструктивных требований, в то время как ракетная артиллерия становится приоритетной для улучшения как средство массированного огневого удара."
 RUS_fr_armaments_priority_support_tradeoffs_idea:0 "Приоритетное распределение артиллерийской мощи"
 RUS_fr_armaments_priority_support_tradeoffs_idea_desc:0 "Ограниченные сплавы, станки и испытательные ресурсы были приоритетно направлены на проекты артиллерии и ракетной артиллерии. В результате огневая мощь армии быстро возросла, но производственные мощности и тактическое развитие бронетанковых средств пришлось временно отдать в сторону."
 RUS_fr_light_infantry_load_standard_idea:0 "Нормы нагрузки легкой пехоты"
 RUS_fr_light_infantry_load_standard_idea_desc:0 "Более разумный вес носимого снаряжения, санитарное оборудование и распределение снабжения позволяют пехоте двигаться быстрее, поддерживать более полную организацию и сохранять больше живой силы во время продолжительных боев."
 modifier_army_sub_unit_infantry_max_org_factor:0 "Организация пехоты"
 RUS_fr_divisional_artillery_priority_idea:0 "Приоритетное строительство для артиллерии бригадного уровня"
 RUS_fr_divisional_artillery_priority_idea_desc:0 "Артиллерийская организация, базы боеприпасов и процедуры вызова огня напрямую интегрированы в пехотную дивизию, так что артиллерия и пехота больше не являются двумя отдельными оперативными системами."
 RUS_fr_armaments_system_priority_idea:0 "Военная система вооружений придает приоритет стандартизации"
 RUS_fr_armaments_system_priority_idea_desc:0 "Федеральный план выбирает пехоту и артиллерию в качестве основной опоры армии. Единые стандарты экипировки, организации и пополнения дают каждой дивизии более компактную структуру и более обильные кадровые резервы, а также значительно усиливают действия ночью, операции в сложной местности и координацию огня ПВО; напротив, пространство для развития бронетанковых и механизированных вооружений дополнительно ограничено."
 RUS_fr_katyusha_rocket_artillery_idea:0 "Реактивная система залпового огня «Катюша»"
 RUS_fr_katyusha_rocket_artillery_idea_desc:0 "Стандартизация ракет, пусковых установок и процедур залпового огня превратила ракетную артиллерию из нескольких экспериментальных единиц в полноценную систему вооружения, способную за короткое время нанести разрушительный удар."
 RUS_fr_tank_firepower_development_idea:0 "Контур развития бронированной огневой мощи"
 RUS_fr_tank_firepower_development_idea_desc:0 "Проектирование бронированного оружия больше не сосредоточено на одной модели машины временно. Кольцо башни, механизм отката орудия и позиции экипажа включены в общий стандарт, что позволяет координировать огневую мощь и защиту танка в рамках одного инженерного процесса."
 RUS_fr_armour_breakthrough_programme_idea:0 "План прорывного шасси"
 RUS_fr_armour_breakthrough_programme_idea_desc:0 "Тестирование шасси больше не направлено на демонстрацию максимальной производительности прототипов автомобилей, а сосредоточено на несущей способности, трансмиссии и возможностях подвески, необходимых для постоянных прорывов."
 RUS_fr_long_range_armoured_exploitation_idea:0 "Удалённые процедуры бронированного штурма"
 RUS_fr_long_range_armoured_exploitation_idea_desc:0 "Бронетанковые войска обязаны отрываться от темпа наступления пехоты, чтобы самостоятельно осуществлять маневры на большие расстояния и оперативное преследование. В результате традиционные пехотные формирования уступают часть ресурсов, в то время как бронетанковые подразделения получают более полную оперативную свободу."
 RUS_fr_armour_reliability_priority_idea:0 "Надежность бронированного оружия превыше всего"
 RUS_fr_armour_reliability_priority_idea_desc:0 "Поскольку бронетанковые войска будут выполнять задачи по дальнему прорыву, двигатель, трансмиссия и гусеницы должны продолжать работать после выхода с железной дороги и ремонтной мастерской. Поэтому отдел испытаний ставит прочность выше всех стандартных характеристик."
 RUS_fr_universal_hull_armour_priority_idea:0 "Общие стандарты модификации кузова транспортного средства"
 RUS_fr_universal_hull_armour_priority_idea_desc:0 "Унифицированные интерфейсы и структурные компоненты позволяют старым транспортным средствам быстрее принимать новые башни, двигатели и специализированные надстройки, а модернизация бронетехники больше не равносильна переработке танка."
 RUS_fr_armoured_firepower_coordination_idea:0 "Стандарт координации бронетанковой огневой мощи"
 RUS_fr_armoured_firepower_coordination_idea_desc:0 "Танки, самоходная артиллерия и противотанковые средства начали обмениваться целеуказаниями, радиомерными позывными и огневыми зонами. В результате бронетанковые формирования смогли концентрировать свои силы как полноценный род войск."
 RUS_fr_tank_destroyer_structural_idea:0 "Структурные стандарты самоходных противотанковых орудий"
 RUS_fr_tank_destroyer_structural_idea_desc:0 "Противотанковые орудия, шасси и трансмиссионные системы больше не считаются временно собранными комбинациями. Унифицированные структурные испытания позволяют самоходным противотанковым орудиям более эффективно бороться с бронетехникой противника, сохраняя при этом мобильность."
 RUS_fr_armoured_priority_coordination_tradeoff_idea:0 "Сосредоточенные бронированные штурмовые силы"
 RUS_fr_armoured_priority_coordination_tradeoff_idea_desc:0 "Лучшее коммуникационное оборудование, персонал и вспомогательные подразделения были сосредоточены в бронетанковом корпусе. Это давало бронетанковому клину решающую мощь, но временно ослабляло поддержку, доступную другим подразделениям всей армии."
 RUS_fr_land_warfare_mainstay_idea:0 "Основная система оружия сухопутных войск"
 RUS_fr_land_warfare_mainstay_idea_desc:0 "Шасси, броня, башня и трансмиссионная система были объединены в единый инженерный язык, и промышленные заказы также начали перестраиваться вокруг брони и самоподдерживающейся огневой мощи. Пехота оставалась опорой передовой линии, но лучшая сталь, измерительные приборы и вспомогательные силы были сосредоточены в новой основной системе сухопутного боевого оружия; до того как эта система действительно созрела, всей армии приходилось нести расходы по реорганизации производства и тактических стандартов."
 RUS_fr_unified_armaments_equipment_standard_idea:0 "Достижения в строительстве Народной армии: стандарты военной инженерии"
 RUS_fr_unified_armaments_equipment_standard_idea_desc:0 "Инженерные спецификации для шасси, пехотного снаряжения и интерфейсов войск были включены в единые стандарты строительства Народной армии. Они больше не являются отдельными испытаниями комитетов, а стали общими техническими приложениями для всей системы военной техники."
 RUS_fr_unified_armaments_equipment_standard_priority_idea:0 "Достижения в строительстве Народной армии: стандарты бронетанковой инженерии"
 RUS_fr_unified_armaments_equipment_standard_priority_idea_desc:0 "На основе единых стандартов вооружения устанавливается приоритет надежности бронетанкового оружия. Ходовая часть, производство и поддержка на поле боя таким образом образуют полный замкнутый цикл вокруг независимых бронетанковых корпусов."
 RUS_fr_unified_armaments_equipment_standard_td_idea:0 "Достижения Народной Армии в строительстве: стандарты противотанковой инженерной подготовки"
 RUS_fr_unified_armaments_equipment_standard_td_idea_desc:0 "Технические характеристики шасси, пехотного снаряжения и самоходных противотанковых орудий были включены в единые нормы строительства Народной армии, а результаты испытаний конструкции были перенесены на истребители танков на всех уровнях."
 RUS_fr_unified_armaments_equipment_standard_priority_td_idea:0 "Достижения в строительстве Народной Армии: стандарты бронированной и противобронированной инженерии"
 RUS_fr_unified_armaments_equipment_standard_priority_td_idea_desc:0 "Надёжность бронетанкового оружия и конструктивные стандарты самоходных противотанковых пушек совместно включены в единую систему вооруженно-инженерного обеспечения, что позволяет непрерывно улучшать прорывное оружие и противоармейскую огневую мощь на основе одной и той же промышленной базы."
 RUS_fr_armour_reliability_priority_bonus_tt:0 "Если сосредоточиться на §YПлан разработки бронетанковых вооружений§!, все §YБронированное оборудование§! Надежность:§G+10.0%§!"
 RUS_fr_unlock_stabilizer_tt:0 "Если сосредоточиться на §YПлан разработки бронетанковых вооружений§!, разблокировать аксессуары для танка:§YСтабилизатор артиллерии§!"
 RUS_fr_okmo_half_xp_cost_tt:0 "§YОКМО§! Выбрать §YВедущий репортер по дизайну§! После маршрута стоимость опыта армии для всех последующих характеристик §GПоловина§!"
 RUS_fr_self_propelled_artillery_firepower_bonus:0 "Стандарты повышения огневой мощи самоходной артиллерии"
 RUS_fr_self_propelled_artillery_firepower_bonus_desc:0 "Единые интерфейсы для артиллерии, боеприпасов и шасси позволяют самоходной артиллерии непрерывно обеспечивать огневую поддержку высокой интенсивности в мобильных операциях."
 RUS_fr_self_propelled_artillery_firepower_bonus_tt:0 "Все §YСамоходная артиллерия§!:\nЧеловеческие потери:§G+10.0%§!\nПротив бронированных повреждений:§G+100.0%§!"
 RUS_fr_armour_priority_self_propelled_bonus:0 "Стандарт координации бронетанковых войск с самоходной огневой поддержкой"
 RUS_fr_armour_priority_self_propelled_bonus_desc:0 "Бронированное оружие сосредоточено на интеграции танков и самоходной артиллерии в одну систему управления огнем и снабжения, обменивая большие вложения в поддержку на сосредоточенную огневую мощь для прорыва скоплений."
 RUS_fr_armour_priority_self_propelled_bonus_tt:0 "Если сосредоточиться на §YПлан разработки бронетанковых вооружений§!:\nВсе §YТанк§! Против личного состава и против брони:§G+15.0%§!\nВсе §YСамоходная артиллерия§! Расход материалов:§G-30.0%§!"
 modifier_army_sub_unit_category_tank_destroyers_speed_factor:0 "Максимальная скорость самоходного противотанкового орудия"
 RUS_fr_coordinate_armoured_firepower:0 "Скоординированная бронетанковая огневая мощь"
 RUS_fr_coordinate_armoured_firepower_desc:0 "инвестиция §Y[?RUS_fr_xp_cost_30|1]§! Потратите опыт армии, используйте 15 дней для организации межвоенного регионального учения по координации бронетанковой огневой мощи. После завершения получите количество, эквивалентное текущему уровню поддержки коммунизма.§G0,1 раза§! Бонус к атаке и защите от брони, максимальный накопительный §G+15%§!."
 RUS_chtz_scaling_tt:0 "§g §H[THIS.GetName]§! В настоящее время каждый [?0.1|W%0] из £research_speed_icon §HБонус за исследование§!, затраты на производство £GFX_build_cost_ic_texticon снизятся на [?-0.01|-=%].\n\nВ настоящее время §H[THIS.GetName]§! Имея [?research_bonus|W%] £research_speed_icon §HБонус за исследование§!, это снизит производственные затраты £GFX_build_cost_ic_texticon на [?build_cost_ic_to_gain|-=%]. §!"
 RUS_fr_chtz_uncapped_production_tt:0 "Если сосредоточиться на §YПлан разработки бронетанковых вооружений§!,§YЧелябинский тракторный завод§! Снижение производственных затрат, получаемое за счет бонусов за исследования, будет продолжать расти и больше не будет ограничено §Y-10%§! Ограничение верхнего предела."
