 RUS_semyon_timoshenko_high_command_desc:0 "§YРодился:§!§L16 февраля 1895 года; Орман, Бессарабская губерния, Российская империя§!\n §YПредыстория:§!§LТимошенко родился в украинской крестьянской семье и был самым младшим из семнадцати детей. Растя среди полей, на рынках и верхом на лошади, он выучил русский, украинский и молдавский языки в своем родном городе. Он мог общаться, спорить и торговаться с разными людьми на трех местных диалектах, а также с раннего возраста заложил основу для того, чтобы хорошо ладить с солдатами.§!\n\nЭтот §LОбстрелы Первой мировой войны отрезали ему юные годы. Тимошенко записался добровольцем, и благодаря своим быстрым реакциям и почти врожденной чувствительности к огнестрельному оружию, он был выбран для систематической подготовки в Школе пулеметчиков в Ораниенбауме. В конечном итоге он окончил её с званием старшего сержанта и стал членом 4-й кавалерийской дивизии Западного фронта. Через длинные окопы и болота на Восточном фронте он быстро превратился из новобранца в ветерана. Битва, сделавшая его знаменитым, была жестокой обороной крепости Осoвиц.§!§L После того как немецкий ядовитый газ прокатился по полю боя, словно зелёное облако, он упрямо защищался пулемётом, несмотря на окровавленное лицо, и начал отчаянную контратаку, позже названную «Атака мёртвых», с выжившими товарищами. К концу войны он носил на груди три Георгиевских креста, каждый из которых был испачкан дымом и ценой выживания. Однако ближе к концу службы, не выдержав необоснованного публичного унижения офицера, он сердито ударил его и был арестован§!.§LВоенное право российской армии было железным, и ему не удалось избежать сурового наказания, но внезапно разразилась буря Февральской революции, и он вновь обрел свободу§!\n\n §LПосле начала Гражданской войны в России Тимошенко не колеблясь присоединился к Красной Армии и направился на Южный фронт. В эти суровые годы ожесточённых боёв вблизи он познакомился с Иосифом Джугашвили и Будённым, а также с другими большевистскими командирами, впоследствии потрясшими мир, и официально вступил в РКП(б) в 1919 году. В качающейся борьбе за защиту Царицына он возглавил кавалерийский разведывательный отряд, неоднократно вступая в схватки с Белой армией Врангеля, часто сталкиваясь с подавляющими силами противника, упорно сдерживая его наступление. Хотя войска Красной армии вновь и вновь отражали волны атак Белой армии, ситуация в конечном итоге разрушилась, как гора, разламывающаяся на части.§!§LОставив после себя обещание «мы обязательно вернемся», он мог лишь отступить с основными силами из города, который был почти пропитан кровью.§!\n\n §LНо последующие годы ссылки неожиданно открыли для него другую дверь. Он получил личное наставничество от выдающегося командующего Красной армии маршала Фрунзе и поступил в Военную академию «Гроза» в Париже, основанную лично Фрунзе, сначала как студент, а затем оставшись ассистентом преподавателя. Тимошенко систематически изучал доктрину боевых действий «Глубокая операция» и активно участвовал в учениях и организационных реформах армии Французской коммуны — на учебных полигонах, среди летящей пыли и грохота гусениц, он многократно проверял, корректировал и перестраивал своё понимание войны.§!§LВзрощенный как огнем, так и чернилами, бывший кавалерист, который когда-то атаковал с храбростью и инстинктом, превратился в спокойного и стратегически мыслящего способного военного реформатора.§!"
