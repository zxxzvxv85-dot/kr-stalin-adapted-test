 RUS_fr_focus_materials_instant_completion_tt:0 "Если текущий £GFX_RUS_fr_military_reform_materials §YВещи военной реформы§! запас составляет как минимум продолжительность этого фокуса в днях, его выбор потребляет это количество и §Gзавершает это немедленно§!. При недостатке материальных средств процесс продолжается в обычном порядке."
