 RUS_kliment_voroshilov: "Климент Ефремович Ворошилов"
 RUS_kliment_voroshilov_army_chief: "Климент Ефремович Ворошилов"
 RUS_kliment_voroshilov_advisor_desc: "§YРодился:§! §L23 января 1881 года; Бахмутский уезд, Екатеринославская губерния, Российская империя§!\n§YПроисхождение:§! §LКлимент Ефремович Ворошилов родился в семье железнодорожного рабочего в Бахмутском уезде Екатеринославской губернии. В детстве ему довелось работать пастухом и шахтёром. С 1893 по 1895 год он учился в земской школе.\n\nВ 1896 году Ворошилов поступил на Екатерининский завод Донецко-Юрьевского металлургического общества. За организацию забастовки его уволили, однако именно тогда впервые ярко проявились его способности организатора. В 1903 году он стал рабочим Луганского паровозостроительного завода. К концу того же года разочарование в обращении с рабочими и влияние радикальной подпольной печати привели его в Российскую социал-демократическую рабочую партию (большевиков).\n\nС 1904 года до начала мировой войны Ворошилова трижды арестовывали и дважды отправляли в ссылку. Всякий раз, оказавшись на свободе, он возвращался к подпольной работе в Луганске, дважды становился одним из руководителей местных большевиков и участвовал в двух партийных съездах. После начала войны в 1914 году он работал на Царицынском орудийном заводе.\n\nПосле Февральской революции 1917 года Ворошилова избрали депутатом Петроградского совета рабочих и солдатских депутатов. В марте он возглавил Луганский комитет большевиков, а в августе принял участие в VI съезде РСДРП(б).\n\nВо время вооружённого восстания в Петрограде в ноябре 1917 года Ворошилов входил в Петроградский военно-революционный комитет. Месяц спустя вместе с Феликсом Эдмундовичем Дзержинским он участвовал в создании Всероссийской чрезвычайной комиссии.\n\nВ марте 1918 года Ворошилов сформировал 1-й Луганский социалистический отряд для отражения наступления австро-германских войск на Донбасс. Позднее он командовал 5-й армией, был заместителем командующего Южным фронтом и членом его военного совета. С 3 октября по 18 декабря он командовал 10-й армией и участвовал в Царицынском сражении.\n\nНа VIII съезде РКП(б) в 1919 году Ворошилов выступил на стороне сталинской Военной оппозиции. Когда Троцкий с напускным благочестием предложил ввести институт комиссаров перед привлечением бывших офицеров, Ворошилов ударил кулаком по столу и закричал: «Да пошёл ты на хуй! Эту военно-политическую систему ещё до своего убийства предложил покойный вождь, товарищ Владимир Ильич Ленин. После его смерти ты, бывший меньшевик и паразит Реввоенсовета, скрыл её и отказался проводить в жизнь, а теперь выдаёшь за компромисс. Это, блядь, отвратительно!» После этих слов он в ярости покинул зал.\n\nВскоре по указанию Свердлова, Сталина, Фрунзе и других Ворошилов повёл свои отряды к Байкалу, соединился с местными партизанами, умевшими воевать в суровом климате, и объединил их в большевистскую военно-партизанскую силу, продолжавшую борьбу в России после отхода основных большевистских армий. Постоянные удары по белому правительству и удивительная приспособленность к ледяной пустыне заставили местных белых прозвать их «снежными чудовищами». Среди простого народа эти партизаны пользовались такой славой, что почти в каждой деревне их принимали как родных, обеспечивая бойцов пополнениями и припасами.\n\nВорошилов и Жданов, его земляк, также продолжавший партизанскую борьбу в России, установили радиосвязь и создали «Движение интеграции» — единую военно-политическую организацию, призванную поднять угнетённых на борьбу против эксплуататоров.\n\nКогда над Кремлём вновь взовьётся красное знамя и германский империализм будет разгромлен, Ворошилов наконец сможет вернуться в Луганск, на родину, которую не видел двадцать лет.§!"
 RUS_kliment_voroshilov_recruit_tt: "§YКлимент Ефремович Ворошилов§! присоединится в качестве §Yфельдмаршала§!."
 RUS_kliment_voroshilov_army_chief_tt: "§YКлимент Ефремович Ворошилов§! станет доступен как §Yглавнокомандующий армией§!: §YАрмейский прорыв (мастер)§!."
