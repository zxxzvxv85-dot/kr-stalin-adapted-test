 RUS_readiness_decay_tt:0 "§YЕжемесячное снижение готовности§!\nВсего: §R−[?RUS_readiness_decay_total|2]§!\nАрмия (40%): −[?RUS_readiness_decay_army|2]\nПятилетка (35%): −[?RUS_readiness_decay_plan|2]\nЗемельная реформа (25%): −[?RUS_readiness_decay_land|2]\n\nОкругление до 0.1 пункта.\nСнижение = 2 × средневзвешенная доля незавершённых реформ.\nЦели: 4 военных этапа, 150 баллов пятилетки, 200 земельных баллов. Успешная земельная реформа также снимает свой штраф.\nБез базового снижения; максимум 2 пункта в месяц, после выполнения всех целей — 0. Только для этого пути; учитываются оставшиеся после обмена баллы."
