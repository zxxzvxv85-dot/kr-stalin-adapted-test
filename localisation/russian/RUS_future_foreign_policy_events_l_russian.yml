 RUS_future_foreign_policy_events.1.t:0 "Возвращение «Буревестника»"
 RUS_future_foreign_policy_events.1.d:0 "Недавно Управление политической охраны получило тайное письмо из Варшавы. Простой конверт был запечатан сургучом; вместо подписи на нём виднелся лишь незатейливый силуэт буревестника. Техническая экспертиза установила, что бумага и чернила относятся к дешёвым сортам, повсеместно распространённым в Польше.\n\nСамо письмо было кратким.\n\nАвтор называл себя Феликсом Эдмундовичем Дзержинским—старым большевиком, пропавшим во время отступления в Гражданскую войну и давно считавшимся погибшим. Он коротко описал своё спасение: сменил имя, смешался с потоком беженцев и после долгих скитаний добрался до Варшавы. Не зная, уцелел ли Центральный комитет, он остался в подполье и в последующие годы постепенно восстановил сеть связей. В конце письма стояло: «Я всё это время ждал возможности вновь установить надёжную связь. Теперь я считаю, что этот момент настал».\n\nК письму прилагалось доказательство—старые карманные часы с номером Петроградского военно-революционного комитета. На внутренней стороне крышки мелкими буквами было выгравировано: «Смольный—1917». Эти часы Дзержинский носил при себе во время Октябрьского вооружённого восстания, и подделать их было практически невозможно.\n\nПосле того как технический отдел полностью переписал письмо, оригинал немедленно опечатали. Проверку совместно провели архив Управления политической охраны и Секретариат Центрального комитета. Часы тщательно разобрали: степень износа надписи соответствовала их возрасту, а номер механизма полностью совпал с записью в реестре имущества Петроградского военно-революционного комитета за октябрь 1917 года. Ещё важнее были упомянутые в письме подробности—например, содержание секретного приказа, лично подписанного Дзержинским во время одной из операций 1918 года. Эти сведения никогда не попадали ни в открытые, ни в служебные документы и могли быть известны лишь участникам событий или немногим высшим руководителям.\n\nЗаключение подготовили за три рабочих дня: личность подтверждена."
 RUS_future_foreign_policy_events.1.a:0 "«Над седой равниной моря ветер тучи собирает…»"
 RUS_future_foreign_policy_events.1.unlock_tt:0 "Мы превратим необъятную Россию в перевалочный пункт мировой революции!\n§YОтдел внешних связей и разведки Европейского революционного комитета§! открыт в разделе §Yбаланса сил§!. Не забудьте заглянуть!"
 RUS_future_foreign_policy_events.2.t:0 "Возвращение в Париж"
 RUS_future_foreign_policy_events.2.d:0 "Париж, Елисейский дворец\n\nСпустя всего несколько месяцев Вячеслав Михайлович вновь ступил на французскую землю. Встречал его старый друг Марсель Кашен. Париж основательно подготовился к переговорам, и торжественность приёма несколько удивила Молотова — ведь со стороны всё это выглядело лишь обычным ответным дипломатическим визитом.\n\nОднако Париж явно не собирался упускать представившуюся возможность.\n\nПереговоры проходили в одном из салонов Елисейского дворца. С французской стороны присутствовали Кашен, комиссар рабоче-крестьянского правительства по торговле и несколько видных представителей промышленности. Вопреки ожиданиям Москвы, французы не стали ограничиваться политическими заявлениями и сразу перешли к делу: они хотели расширить торговлю ресурсами, особенно увеличить импорт зерна, руды и нефти. В обмен Франция могла предложить тяжёлое оборудование и промышленные товары, а также техническую помощь в восстановлении России.\n\nМолотов запоминал каждый предложенный пункт и не торопился с ответом. Кашена это не удивляло — он хорошо знал манеру переговоров старого большевика.\n\nПо мере обсуждения яснее становились и разногласия. Французская сторона неизменно ограничивала сотрудничество рамками «торгового обмена и взаимодополняемости экономик», обходя предложенные Москвой положения о политическом доверии. Молотов дважды переводил разговор к совместной поддержке революционного движения в Европе, и оба раза Кашен мягко уклонялся от темы, ссылаясь на «приоритет экономического сотрудничества».\n\nК завершению встречи Молотов получил подробный проект торгового соглашения, охватывавший нефть, руду, зерно и другие массовые товары. Условия французской технической помощи также выглядели весьма щедрыми.\n\nОсобенно довольны обе стороны остались рамочным соглашением о совместной разработке российских минеральных ресурсов. Французы проявили необычайный энтузиазм: они обещали не только современное горнодобывающее оборудование и инженерные группы, но и долгосрочное сотрудничество в переработке и перевозке сырья. Для Москвы это означало стабильный приток твёрдой валюты; для Парижа — долгосрочную гарантию включения сибирских месторождений в промышленную систему Франции. В этом вопросе стороны неожиданно нашли общий язык, не требовавший никаких украшений."
 RUS_future_foreign_policy_events.2.a:0 "За наших друзей по революции!"
 RUS_future_foreign_policy_events.3.t:0 "Первая революция"
 RUS_future_foreign_policy_events.3.d:0 "В тот октябрь, более двадцати лет назад, мы верили, что старый мир окончательно рухнет от одного пушечного выстрела. Когда распахнулись двери Зимнего дворца, нам казалось, что вместе с ними открылись все дороги в будущее.\n\nПоследующие события оказались сложнее, чем мог предвидеть любой большевик: наступление белых, международная блокада, внутренняя борьба и долгая ночь изгнания. Революция не завершилась в ту ночь 1917 года — она лишь началась. Подобно зажжённому фитилю, она прошла сквозь тьму целой эпохи и до сих пор не догорела.\n\nЛюди, спешившие по коридорам Смольного; рабочие, вполголоса читавшие листовки в заводских цехах; солдаты, делившие с товарищами последний кусок хлеба в окопах, — они сражались не ради мимолётного лозунга. Они сражались, потому что верили: история и народ запомнят их выбор.\n\nСегодня мы стоим на проложенных ими рельсах, как бы ни бросало нас из стороны в сторону...\n\nПервая революция — это не только тот октябрьский день. Это один и тот же выбор, который в каждую эпоху делает каждый, кто отказывается склониться перед старым миром,—"
 RUS_future_foreign_policy_events.3.a:0 "Доведём революцию до конца!"
 RUS_future_foreign_policy_events.3.poem_tt:0 "§RПусть беда идёт за бедой —\nНас не сломит уныние.\nСтанем вместе, друзья,\nИ не иссякнет наша сила.\n\nСлышишь, метель бушует,\nВидишь, летят метеоры;\nСердце зовёт меня\nВ дальние края потрясений...§!"
