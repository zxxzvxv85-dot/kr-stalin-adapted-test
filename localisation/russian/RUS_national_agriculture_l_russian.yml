 RUS_nat_tab_3:0 "Отчёт"
 RUS_nat_tab_0_tt:0 "§YЗемледелие§!\n20 единиц плана за квартал, не более 10 на культуру. Выполнение обещания о технике и завершение реформы дают по 2 постоянные единицы, максимум 24.\nУрожай зависит от сезона, истощения почвы, фактической погоды, средней обеспеченности техникой и модификаторов выпуска. Оценка не учитывает скрытые погоду и рынок; прогноз может ошибаться. Рынок, насыщение и ёмкость сбыта влияют только на цену.\nУтверждённый план можно открыть для изменения до конца квартала. Без утверждения применяется автоплан внутренних нужд и резервов. Неполный квартал рассчитывается по фактическим дням."
 RUS_nat_tab_1_tt:0 "§YТехника§!\nВыделенные доступные гражданские заводы резервируются. Выпуск одного завода в сутки: 1,20 x эффективность x коэффициент выпуска. Учитываются текущие очки пятилетки и государственные модификаторы выпуска, предела и роста эффективности.\nНовые заводы начинают с 30%. При остановке эффективность снижается на 0,1 процентного пункта в сутки до 30%. Потеря заводов сокращает назначение. Заполненные парк и склад останавливают производство и накопительный счётчик.\nЦель парка: 400, со следующего квартала после реформы 500; склад: 4500. Квартальный износ парка 10/15/20/25%, при плохой погоде ещё 5 п.п., максимум 30%. Склад не изнашивается. Среднее покрытие меняет урожай до 90-110%.\nОбещание: три решения о тракторах за 540 дней и 3000 единиц собственного производства с запуска системы. Экспорт не уменьшает накопленный выпуск."
 RUS_nat_tab_2_tt:0 "§YЗапасы и торговля§!\nПотребности полного квартала: пшеница и рожь вместе 8, свёкла 2, лён и хлопок вместе 4. Война на начало квартала добавляет 2 продовольствия и 1 волокна.\nСначала внутренние нужды, затем выбранный резерв на половину/один/два квартала, затем принятые заказы по приоритету. Только полные заказы, без повторного расходования запасов. Пределы культур: 12/12/6/6/6. Потери запасов 5%, с Каховской 2%.\nЗападные товарищи открывают обычный заказ. После Парижского договора существующие Британия и Франция дают заказы культур и техники со следующего квартала. Базовый экономический профицит за единицу: культуры 1000, техника 150. Выполненные англо-французские заказы дают +0,10 к цене; итоговый множитель 0,40-1,50. Перед экспортом техники восполняется парк и резервируется 25% целевого парка."
 RUS_nat_tab_3_tt:0 "§YКвартальный отчёт§!\nОчки снабжения: всё продовольствие +2, при 90% и менее 100% +1; полная свёкла и волокно по +0,5. Только эта часть ограничена 3 очками за квартал и 12 за сельскохозяйственный год. Все три потребности дают ещё 50 политвласти, максимум 200 за год.\nДополнительно: квартальный запас зерна +2; среднее покрытие техникой от 90% +2; задание +4 и ещё 1 с Устиновым. Очки выдаются только при действующей или успешной официальной реформе. Неполные кварталы пропорциональны дням.\nРеформа Устинова: 150 очков за 720 дней. После успеха излишек становится расходуемым балансом без снижения этапа. Провал останавливает очки и обмен, но не производство. Экспорт не даёт очков реформы.\nГодовые духи зависят от среднего снабжения и резервов на конец года. Нехватка продовольствия накапливает штрафы, полное снабжение снимает один уровень за квартал. Нехватка свёклы или волокна снижает выпуск заводов."
