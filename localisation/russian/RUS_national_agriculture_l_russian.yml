 RUS_nat_tab_3:0 "Отчёт"
 RUS_nat_tab_0_tt:0 "§YЗемледелие§!\n\n£RUS_nat_text_food£ §Y20§! единиц плана за квартал, не более §Y10§! на культуру. Выполнение обещания о технике и §Gзавершение реформы§! дают §Gпо 2 постоянные единицы§!, максимум §Y24§!.\n\n£RUS_nat_text_food£ §4Урожай§! зависит от §4сезона§!, §4истощения почвы§!, §4фактической погоды§!, §4средней обеспеченности техникой§! и §4модификаторов выпуска§!. Оценка не учитывает §Rскрытые погоду и рынок§!; §Rпрогноз может ошибаться§!. §4Рынок§!, §4насыщение§! и §4ёмкость сбыта§! влияют только на §4цену§!.\n\n£RUS_nat_text_orders£ §YУтверждённый план§! можно §Yоткрыть для изменения§! до конца квартала. Без утверждения применяется §Yавтоплан§! внутренних нужд и §4резерв§!ов. Неполный квартал рассчитывается по §Yфактическим дням§!."
 RUS_nat_tab_1_tt:0 "§YТехника§!\n\n£RUS_nat_text_machinery£ Выделенные доступные §4гражданские заводы§! §4резерв§!ируются. \n\nВыпуск завода в сутки = §Y1,20§! x §4эффективность§! x §4коэффициент выпуска§!\n\nУчитываются текущие §4очки пятилетки§! и государственные §4модификаторы выпуска§!, §4предела и роста эффективности§!.\n\n£RUS_nat_text_factories£ Новые заводы начинают с §Y30%§!. При остановке §4эффективность§! снижается на §Y0,1§! процентного пункта в сутки до §Y30%§!. Потеря заводов сокращает назначение. Заполненные парк и §4склад§! останавливают производство и накопительный счётчик.\n\n£RUS_nat_text_stock£ §4Цель парка§!: §Y400§!, со §Yследующего квартала§! после реформы §Y500§!; §4склад§!: §Y4500§!. Квартальный §Rизнос§! парка §Y10§!/§Y15§!/§Y20§!/§Y25%§!, при §Rплохой погоде§! ещё §Y5§! п.п., максимум §Y30%§!. Склад не изнашивается. §4Среднее покрытие§! меняет урожай до §Y90§!§R-110%§!.\n\n£RUS_nat_text_orders£ Обещание: три решения о тракторах за §Y540§! дней и §Y3000§! единиц собственного производства с запуска системы. Экспорт не уменьшает §4накопленный выпуск§!."
 RUS_nat_tab_2_tt:0 "§YЗапасы и торговля§!\n\n£RUS_nat_text_food£ Потребности полного квартала: пшеница и рожь вместе §Y8§!, свёкла §Y2§!, лён и хлопок вместе §Y4§!. Война на начало квартала добавляет §Y2§! продовольствия и §Y1§! волокна.\n\n£RUS_nat_text_stock£ Сначала §4внутренние нужды§!, затем выбранный §4резерв§! на половину/один/два квартала, затем принятые §4заказ§!ы по приоритету. §YТолько полные заказы§!, без повторного расходования запасов. Пределы культур: §Y12§!/§Y12§!/§Y6§!/§Y6§!/§Y6§!. §RПотери запасов§! §Y5%§!, с §YКаховской§! §Y2%§!.\n\n£RUS_nat_text_export£ §YЗападные товарищи§! открывают обычный §4заказ§!. После §YПарижского договора§! существующие Британия и Франция дают §4заказ§!ы культур и техники со §Yследующего квартала§!. Базовый §4экономический профицит§! за единицу: культуры §Y1000§!, техника §Y150§!. Выполненные англо-французские §4заказ§!ы дают §G+0,10§! к цене; итоговый §4множитель§! §Y0,40§!§R-1,50§!. Перед экспортом техники восполняется парк и §4резерв§!ируется §Y25%§! целевого парка."
 RUS_nat_tab_3_tt:0 "§YКвартальный отчёт§!\n\n£RUS_nat_text_reform£ §4Очки снабжения§!: всё продовольствие §G+2§!, при §Y90%§! и менее §Y100%§! §G+1§!; полная свёкла и волокно по §G+0,5§!. Только эта часть ограничена §Y3§! очками за квартал и §Y12 за сельскохозяйственный год§!. Все три потребности дают ещё §Y50§! §4политвласти§!, максимум §Y200 за год§!.\n\n£RUS_nat_text_machinery£ Дополнительно: §4квартальный запас зерна§! §G+2§!; среднее покрытие техникой от §Y90%§! §G+2§!; §4задание§! §G+4§! и ещё §Y1§! с §YУстиновым§!. §YОчки выдаются только при действующей или успешной официальной реформе§!. Неполные кварталы пропорциональны дням.\n\n£RUS_nat_text_reform£ Реформа Устинова: §Y150§! очков за §Y720§! дней. После успеха излишек становится §4расходуемым балансом§! §Gбез снижения этапа§!. §RПровал останавливает очки и обмен§!, но не производство. §RЭкспорт не даёт очков реформы§!.\n\n£RUS_nat_text_food£ §4Годовые духи§! зависят от среднего снабжения и §4резерв§!ов на конец года. §RНехватка продовольствия§! накапливает штрафы, полное снабжение §Gснимает один уровень§! за квартал. Нехватка свёклы или волокна §Rснижает выпуск заводов§!."
