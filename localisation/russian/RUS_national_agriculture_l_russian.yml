 RUS_nat_reserve_0_tt:0 "£RUS_nat_text_stock£ §YВнутренний запас на 0.5 кварт.§!\n\nСначала обеспечиваются §4текущие внутренние нужды§!, затем сохраняются зерно, свёкла и волокно в объёме §Y0.5 полных квартальных потребностей§!. Только излишки могут идти на §4экспортные заказы§!.\nБольший резерв оставляет меньше продукции для экспорта. Лимиты складов и квартальные потери сохраняются.\nПо умолчанию: §Yодин квартал§!. Запчасти для техники резервируются отдельно в размере §Y25%§! целевого парка; эта кнопка на них не влияет."
 RUS_nat_reserve_1:0 "Запас 1 кв."
 RUS_nat_reserve_1_tt:0 "£RUS_nat_text_stock£ §YВнутренний запас на 1 кварт.§!\n\nСначала обеспечиваются §4текущие внутренние нужды§!, затем сохраняются зерно, свёкла и волокно в объёме §Y1 полных квартальных потребностей§!. Только излишки могут идти на §4экспортные заказы§!.\nБольший резерв оставляет меньше продукции для экспорта. Лимиты складов и квартальные потери сохраняются.\nПо умолчанию: §Yодин квартал§!. Запчасти для техники резервируются отдельно в размере §Y25%§! целевого парка; эта кнопка на них не влияет."
 RUS_nat_reserve_2:0 "Запас 2 кв."
 RUS_nat_reserve_2_tt:0 "£RUS_nat_text_stock£ §YВнутренний запас на 2 кварт.§!\n\nСначала обеспечиваются §4текущие внутренние нужды§!, затем сохраняются зерно, свёкла и волокно в объёме §Y2 полных квартальных потребностей§!. Только излишки могут идти на §4экспортные заказы§!.\nБольший резерв оставляет меньше продукции для экспорта. Лимиты складов и квартальные потери сохраняются.\nПо умолчанию: §Yодин квартал§!. Запчасти для техники резервируются отдельно в размере §Y25%§! целевого парка; эта кнопка на них не влияет."
