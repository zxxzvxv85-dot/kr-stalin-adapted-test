 RUS_nat_industry:0 "Снабжение и сельхозмашиностроение"
 RUS_national_agriculture.1.t:0 "Годовой сельскохозяйственный отчёт"
 RUS_national_agriculture.1.d:0 "Аграрный комитет завершил годовую оценку. Внутренние потребности удовлетворены на [?RUS_nat_last_annual|1]%. Начался новый сельскохозяйственный год."
 RUS_national_agriculture.1.a:0 "Продолжим строительство социалистического сельского хозяйства."
 RUS_national_agriculture.2.t:0 "Руководство по сельскому хозяйству"
 RUS_national_agriculture.2.d:0 "Нажимайте §bчетыре вкладки§! над аграрным интерфейсом для перехода к посевам, технике, торговле и отчёту. Бесплатное решение §bРуководство по сельскому хозяйству§! открывает эту справку повторно.\n\n§4Производство§!: §b10§! бесплатных единиц плана на квартал, до §b10§! на культуру. Проверьте внутренние нужды и резервы в §bБалансе§!, затем распределите посевы кнопками плюс и минус. Оценки урожая и дохода обновляются сразу.\n\n§4План§!: ручные изменения сохраняются сразу. Утверждение блокирует план; повторное открытие разрешает правки. Ручной план переносится в следующий квартал, автоматический пересчитывается по сезонным нуждам и резервам. Неутверждённый ручной план также применяется при расчёте.\n\n§4Реформа§!: хозяйство работает с назначения министра, очки выдаются после официального начала реформы. Цель §b200§! за §b720§! дней. Решения дают до §b90§!, остальное — хозяйство и события.\n\n§4Расчёт§!: внутренние нужды, резервы, заказы, затем потери остатков. Каждый квартал приходит уведомление; за §b7§! дней до конца — напоминание о неутверждённом плане."
 RUS_national_agriculture.3.t:0 "Новый сельскохозяйственный квартал"
 RUS_national_agriculture.3.d:0 "Прошлый квартал рассчитан.\n\n§4Внутренние нужды§!: зерно §b[?RUS_nat_food_last_ratio|2]%§!, свёкла §b[?RUS_nat_beet_last_ratio|2]%§!, волокно §b[?RUS_nat_textile_last_ratio|2]%§!.\n§4Очки реформы§!: §b+[?RUS_agri_last_quarter_score|2]§!.\n§4Политвласть§!: §b+[?RUS_nat_last_pp|1]§!.\n\nСезон, прогнозы, потребности и заказы обновлены. Ручное распределение сохранено. Проверьте §bБаланс§! нового квартала."
 RUS_national_agriculture.4.t:0 "Проверка квартального плана"
 RUS_national_agriculture.4.d:0 "До расчёта §b[?RUS_nat_remaining|0]§! дней. Состояние: [GetRUSNatPlan].\n\nПроверьте снабжение, резервы и заказы. Ручной черновик будет применён; автоплан учитывает внутренние нужды и запасы. Утверждённый план можно снова открыть."
 RUS_national_agriculture.5.t:0 "Баланс текущего квартала"
 RUS_national_agriculture.5.d:0 "§4Зерно§!\nЗапас §b[?RUS_nat_food_stock_now|1]§!; ожидаемый урожай §b[?RUS_nat_food_new_yield|1]§!.\nСнабжение §b[?RUS_nat_food_delivered|1]§!/§b[?RUS_nat_food_need|1]§! (§b[?RUS_nat_food_preview|2]§!%).\nЦелевой резерв §b[?RUS_nat_food_reserve|1]§!; заказы §b[?RUS_nat_food_order_need|1]§!.\nДополнительно требуется: §b[?RUS_nat_food_all_gap|2]§!.\n\n§4Свёкла§!\nЗапас §b[?RUS_nat_beet_stock_now|1]§!; ожидаемый урожай §b[?RUS_nat_beet_new_yield|1]§!.\nСнабжение §b[?RUS_nat_beet_delivered|1]§!/§b[?RUS_nat_beet_need|1]§! (§b[?RUS_nat_beet_preview|2]§!%).\nЦелевой резерв §b[?RUS_nat_beet_reserve|1]§!; заказы §b[?RUS_nat_beet_order_need|1]§!.\nДополнительно требуется: §b[?RUS_nat_beet_all_gap|2]§!.\n\n§4Волокно§!\nЗапас §b[?RUS_nat_textile_stock_now|1]§!; ожидаемый урожай §b[?RUS_nat_textile_new_yield|1]§!.\nСнабжение §b[?RUS_nat_textile_delivered|1]§!/§b[?RUS_nat_textile_need|1]§! (§b[?RUS_nat_textile_preview|2]§!%).\nЦелевой резерв §b[?RUS_nat_textile_reserve|1]§!; заказы §b[?RUS_nat_textile_order_need|1]§!.\nДополнительно требуется: §b[?RUS_nat_textile_all_gap|2]§!.\n\nОбщая цель = внутренние нужды + резерв + принятые заказы\n\nЗерно и волокно объединены в группы; заказ требует указанную культуру целиком. Остатки теряются после снабжения и экспорта при расчёте текущего квартала. Прогноз использует открытые условия."
 RUS_nat_event_production:0 "Открыть производство"
 RUS_nat_event_ledger:0 "Открыть баланс"
 RUS_nat_event_close:0 "Продолжить текущий план"
 RUS_nat_event_confirm:0 "Утвердить план"
 RUS_nat_event_conditions:0 "Погода и рыночный прогноз"
 RUS_nat_event_indicators:0 "Урожай, почва и доход"
 RUS_nat_event_guide:0 "Вернуться к руководству"
 RUS_national_agriculture.6.t:0 "Погода и рынок"
 RUS_national_agriculture.6.d:0 "£RUS_nat_text_food£ §4Погода§! — общий климатический итог квартала для пяти культур. §GБлагоприятная§! чаще повышает урожай, §bобычная§! чаще не меняет его, §Rплохая§! чаще снижает. Фактическая плохая погода также повышает износ техники.\n\nПоправка погоды прибавляется к сезонному коэффициенту до учёта техники и прочих факторов. Погодные §b+20%§! в отчёте означают прибавку §b0.20§! к коэффициенту:\n§b1.25§! + §b0.20§! = §b1.45§!\n\n£RUS_nat_text_income£ §4Рынок§! меняет цену выполненных экспортных заказов. §GСильный§! чаще повышает цену, §bстабильный§! чаще сохраняет её, §Rслабый§! чаще снижает. Культуры и техника имеют отдельные рыночные результаты; прогнозы могут совпасть.\n\n§4Прогноз и итог§!: начальные оценки показывают вероятность. Благоприятная погода может стать плохой, сильный рынок — упасть. Итоги раскрываются при расчёте в §bКвартальном отчёте§!.\n\n§4Оценки§!: урожай на единицу и ожидаемый экспортный доход учитывают открытые условия. Скрытые погода и рынок, как и сами слова прогноза, в эти числа не входят."
 RUS_national_agriculture.7.t:0 "Урожай, почва и доход"
 RUS_national_agriculture.7.d:0 "£RUS_nat_text_food£ §4Урожай на единицу§!: ожидаемый выпуск при §b1§! единице плана с учётом сезона, истощения, среднего покрытия техникой, открытых бонусов и доли квартала.\n\nОжидаемый урожай = план x урожай на единицу\nПлан §b4§! при §b1.25§! даёт §b5§! единиц.\n\n£RUS_nat_text_food£ §4Истощение почвы§!: повторная концентрация посевов снижает урожай; смена или сокращение культуры восстанавливает почву. §4Насыщение§! и §4ёмкость сбыта§! влияют на цены: повторная концентрация снижает цену, экспорт сверх ёмкости получает поэтапную скидку.\n\n£RUS_nat_text_stock£ §4Нужды и резервы§!: пшеница и рожь обеспечивают зерно, лён и хлопок — волокно, свёкла учитывается отдельно. Сначала снабжение, затем выбранный резерв и полные заказы указанной культуры. Остатки ограничиваются складом, после чего вычитаются потери.\n\n£RUS_nat_text_income£ §4Ожидаемый доход§!: профицит от выполнимых заказов при открытых условиях, включая старые запасы. Внутреннее потребление учитывается в снабжении; без выполнимого заказа доход §b0§!.\n\nДоход экспорта = сумма оценок выполнимых заказов\nДоход заказа = количество x базовая цена x множитель цены\n\nБаза: культуры §b1000§!, техника §b150§!. Договор, насыщение и скидки учитываются в пределах §b40%–150%§!. Строка культуры показывает её доход; итог также включает технику."
